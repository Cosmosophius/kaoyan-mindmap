"]},{"t":"简述中国古代官学制度的发展演变","y":"简答题","p":["庠序：学校雏形","西周学在官府","孔子私学兴起","汉武帝设太学确立官学","隋唐国子监完备","宋以后书院与官学并存"],"q":"中国古代官学制度大致经历了：①尧舜时期的庠序之教，为学校雏形；②西周\"学在官府\"，设辟雍、泮宫，教育为贵族垄断；③春秋战国私学兴起，孔子首开私人讲学之风；④汉武帝设太学，官学制度正式确立；⑤隋唐设国子监，形成完备的中央官学体系；⑥宋元明清书院兴盛，官学与私学并存互补。","w":"high","e":["2018 真题"]},{"t":"汉武帝采纳董仲舒\"罢黜百家，（  ）\"的建议，确立了儒学的独尊地位。","y":"填空题","p":["董仲舒对策","儒学独尊、设太学"],"q":"独尊儒术","w":"high","e":["2015 真题"]},{"t":"国子监最初只是管理教育的行政机关，到了明代就发展成为兼有行政机关和最高学府两种性质的机构。","y":"判断题","p":["隋设、唐宋为行政机关","明代兼具最高学府性质"],"q":"正确。隋设国子监，唐宋主要为教育行政机关；明代国子监既管全国官学，又直接培养监生，兼具双重性质。","w":"high","e":["2024 真题"]},{"t":"私学兴起于春秋战国时期，孔子是最早创办私学的人物之一。","y":"判断题","p":["春秋私学兴起","孔子有教无类"],"q":"正确。春秋时期\"天子失官，学在四夷\"，孔子首创大规模私学，主张\"有教无类\"，打破贵族对教育的垄断。","w":"normal","e":["核心考点"]}]},{"id":"culture-c08-s02","t":"第二节 书院制度","w":"high","n":9,"k":[{"t":"书院","y":"名词解释","p":["始于唐、盛于宋","名师主持、学术自由、教研结合","四大书院与朱熹学规"],"q":"中国古代特有的教育组织形式，始于唐、盛于宋。书院多由名师主持，以研习儒家经典为主，注重学术自由与德行修养，教学与研究相结合。宋代四大书院为白鹿洞、岳麓、应天府、嵩阳（一说石鼓）。朱熹所订《白鹿洞书院揭示》成为后世书院学规范式。","w":"high","e":["2022 真题"]},{"t":"白鹿洞书院","y":"名词解释","p":["位于江西庐山","朱熹重修并主讲","制定《白鹿洞书院揭示》","学规成为后世典范"],"q":"宋代著名书院，位于江西庐山五老峰下。南宋朱熹重修并主讲，制定《白鹿洞书院揭示》（学规），提出“父子有亲、君臣有义、夫妇有别、长幼有序、朋友有信”的五教之目与为学、修身、处事、接物之要。该学规成为后世书院教育的典范。","w":"high","e":["2022 真题"]},{"t":"东林书院","y":"名词解释","p":["江苏无锡，顾宪成高攀龙重修","讽议朝政、裁量人物","形成东林党","天启年间遭禁毁"],"q":"东林书院位于江苏无锡，原为北宋杨时讲学处，万历三十二年（1604年）顾宪成、高攀龙等重修并讲学其中。书院以\"风声雨声读书声，声声入耳；家事国事天下事，事事关心\"为宗旨，讽议朝政、裁量人物，形成影响巨大的\"东林党\"。天启年间遭魏忠贤禁毁，是书院议政的典型代表。","w":"normal","e":["核心考点"]},{"t":"简述中国古代书院的教学特点","y":"简答题","p":["名师主讲、自由讲学","教学与研究相结合","自学为主、质疑问难","重德行修养、学规严明"],"q":"①名师主讲、自由讲学，学术气氛浓厚；②教学与研究相结合，注重义理探讨；③以学生自学、质疑问难为主，师生共同研讨；④注重德行修养与人格培养，学规严明；⑤多选址于山林名胜，环境清幽，利于潜心治学。","w":"high","e":["2016 真题"]},{"t":"简述书院制度的特点","y":"简答题","p":["办学自主","名师主讲","学术自由讲会论辩","注重自学与德行","讲会藏书祭祀学田","多建于山林名胜"],"q":"①办学自主：多由私人或地方官府设立，不受官府直接控制；②名师主讲：延请名儒大师讲学，学术水平高；③学术自由：允许不同学派讲会论辩，形成自由讨论风气；④教学与研习结合：注重自学、质疑问难与德行修养；⑤制度完备：有讲会、藏书、祭祀、学田四大规制；⑥环境选择：多建于山林名胜，远离尘嚣。书院弥补了官学之不足，是中国古代教育的宝","w":"high","e":["2022 真题"]},{"t":"简述书院教育的特点","y":"简答题","p":["办学以私办为主官助为辅","选址山林环境清幽","教学与研究结合重自由讲学","讲会制度学术辩论","重道德修养与人格培养"],"q":"书院教育的特点主要有：①办学主体多元，以私人创办为主、官方支持为辅；②选址多在山水胜地，环境清幽；③教学与研究相结合，重自由讲学与学术辩论；④实行讲会制度，不同学派可同堂论辩；⑤注重道德修养与人格培养，学规明确；⑥师生关系密切，尊师爱生之风浓厚。","w":"high","e":["2021 真题"]},{"t":"简述中国古代书院制度的特点","y":"简答题","p":["教学与学术研究结合","自由讲学与会讲辩论","自学为主、质疑问难","师生关系密切重人格感化","设于山林、学田自给","宋代四大书院"],"q":"书院是唐宋至明清的一种私人讲学与藏书研究机构。特点：其一，教学与学术研究相结合，书院多为学派基地，如朱熹白鹿洞书院、张栻岳麓书院；其二，自由讲学与门户开放，允许不同学派会讲辩论，如朱陆鹅湖之会；其三，教学以自学为主、讲论结合，注重质疑问难；其四，师生关系密切，重人格感化与品德修养；其五，多设于山林名胜，环境清幽；其六，","w":"normal","e":["核心考点"]},{"t":"宋代四大书院中，朱熹曾主持讲学并制订学规的是（  ）书院。","y":"填空题","p":["朱熹《白鹿洞书院揭示》","四大书院之首"],"q":"白鹿洞","w":"high","e":["2022 真题"]},{"t":"下列书院中，不属于宋代四大书院的是（ ）。","y":"单项选择题","p":["东林书院为明代顾宪成所建","四大书院：白鹿洞、岳麓、应天、嵩阳"],"q":"C. 东林书院","w":"normal","e":["核心考点"]}]},{"id":"culture-c08-s03","t":"第三节 蒙学与教育特征","w":"high","n":6,"k":[{"t":"蒙学","y":"名词解释","p":["儿童启蒙教育","教材有三字经百家姓千字文","以识字与伦理规范为主","古代基础教育形式"],"q":"中国古代对儿童进行的启蒙教育，又称小学、私塾教育。教材主要有《三字经》《百家姓》《千字文》《弟子规》《幼学琼林》等，内容以识字、写字、伦理道德与日常规范为主。蒙学是中国古代基础教育的重要形式。","w":"normal","e":["核心考点"]},{"t":"简述中国古代教育的主要特征","y":"简答题","p":["以儒家经典为核心内容","官学私学并行","教育与科举紧密结合","重道轻器、等级森严"],"q":"①以儒家经典为主要内容，重伦理道德教育；②官学与私学并行，官学为主、私学为辅；③教育与科举紧密结合，科举成为教育的指挥棒；④重道轻器，轻视科技与生产技艺；⑤等级森严，教育机会不均等。","w":"high","e":["2019 真题"]},{"t":"简述中国古代教育思想的主要特点","y":"简答题","p":["儒家思想为主导重伦理","明人伦培养君子","知行合一躬行实践","因材施教循序渐进","重师道尊严","教育与选官结合"],"q":"中国古代教育思想的主要特点：①以儒家思想为主导，重伦理道德教育；②以\"明人伦\"为核心目标，培养君子人格；③重\"知行合一\"与躬行实践；④强调因材施教、循序渐进、启发诱导；⑤重师道尊严，师者传道授业解惑；⑥教育与选官制度紧密结合。","w":"normal","e":["核心考点"]},{"t":"试论中国古代教育思想对现代的启示","y":"论述题","p":["有教无类的教育公平","因材施教的个性化教学","学思结合独立思考","教学相长师生共进","德育为先立德树人","书院精神的借鉴","剔除等级性糟粕"],"q":"①有教无类：孔子主张教育不分贵贱贫富，体现了教育公平理念，对当代教育公平有启示；②因材施教：根据学生个性差异施教，启示当代个性化教学；③学思结合：“学而不思则罔，思而不学则殆”，强调独立思考；④教学相长：《学记》提出“教学相长”，启示师生共同成长；⑤德育为先：重视人格养成与伦理教育，启示当代立德树人；⑥书院精神：学术自","w":"high","e":["2021 真题"]},{"t":"试论中国古代教育制度对当代教育的启示","y":"论述题","p":["书院自由讲学启示学术自由","因材施教循序渐进仍具价值","重人格养成反对唯分数","教学相长构建良好师生关系","多元办学格局的借鉴","剔除等级性与功利化糟粕"],"q":"中国古代教育制度对当代教育的启示主要有：①书院自由讲学、学术辩论的传统，启示当代教育应保护学术自由与批判性思维；②\"因材施教\"\"循序渐进\"的教学原则，对个性化教育仍有指导意义；③重道德修养与人格养成，提醒当代教育不能唯分数论；④\"教学相长\"\"尊师爱生\"的师生观，有助于构建良好师生关系；⑤私学与官学并存互补的多元办学格局","w":"high","e":["2022 真题"]},{"t":"中国古代最高学府中，兼具教育行政机关与最高学府双重性质的是（ ）。","y":"单项选择题","p":["隋设、明清兼具双重性质","监生制度"],"q":"B. 国子监","w":"high","e":["2024 真题"]}]}]},{"id":"culture-c09","t":"第九章 科举制度","w":"high","s":[{"id":"culture-c09-s01","t":"第一节 选官制度的演变","w":"high","n":16,"k":[{"t":"科举制","y":"名词解释","p":["隋大业元年设进士科始","1905年废止历时1300年","以考试成绩为录取标准","打破门第限制"],"q":"科举制是中国古代通过考试选拔官吏的制度，始于隋大业元年（605年）设进士科，终于清光绪三十一年（1905年）废止，历时1300年。它以考试成绩为录取标准，打破了门第限制，使庶族地主得以参政，是中国古代选官制度的重大变革，对后世及东亚、西方文官制度均有深远影响。","w":"high","e":["2015 真题","2019 真题","2024 真题"]},{"t":"九品中正制","y":"名词解释","p":["曹丕时陈群建议确立","中正官评定九品","后期唯重门第、\"上品无寒门\""],"q":"魏晋南北朝时期的选官制度，曹丕称帝后采纳陈群建议确立。由中正官按家世、德行、才能评定士人为九品，供朝廷选用。初期尚兼顾才德，后逐渐以门第为唯一标准，形成\"上品无寒门，下品无势族\"的局面，至隋被科举制取代。","w":"high","e":["2022 真题","2017 真题"]},{"t":"察举制","y":"名词解释","p":["汉代地方长官考察推举","科目以孝廉最为重要","以德行才能为标准"],"q":"汉代选拔官吏的制度，由地方长官在辖区内考察、推举人才，经朝廷考核后授予官职。汉武帝时确立，科目有孝廉、茂才、贤良方正等，以孝廉最为重要。察举制以德行才能为标准，是科举制之前最重要的选官制度。","w":"high","e":["2022 真题"]},{"t":"简述科举制度在唐宋以后的演变","y":"简答题","p":["隋创进士科","唐完善、进士科最贵","宋立殿试、糊名誊录","明清八股取士、四级考试","1905年废除"],"q":"①隋炀帝始设进士科，科举制创立；②唐代完善，设明经、进士等常科，以进士科最贵，行卷之风盛行；③宋代确立殿试为常制，实行糊名、誊录，录取名额大增，考试趋于严密；④明清确立八股取士，形成童试、乡试、会试、殿试四级体系，考试内容限于四书五经；⑤清末光绪三十一年（1905）废除科举。","w":"high","e":["2023 真题","2019 真题"]},{"t":"简述科举制度对中国社会的深远影响","y":"简答题","p":["打破门阀、促进阶层流动","扩大统治基础、加强集权","提高官员文化素质","八股束缚思想、阻碍科技"],"q":"积极方面：①打破门阀世族对政治的垄断，促进社会阶层流动；②扩大统治基础，加强中央集权；③提高官员的文化素质，推动儒学与教育普及；④形成公平竞争的价值观念，影响东亚诸国。消极方面：①明清八股取士严重束缚思想，扼杀创新；②造成\"万般皆下品，惟有读书高\"的畸形价值观；③考试内容脱离实际，阻碍科技发展。","w":"high","e":["2023 真题","2016 真题"]},{"t":"简述中国古代选官制度的演变过程","y":"简答题","p":["先秦世卿世禄制","汉代察举制以孝廉为主","魏晋九品中正制重门第","隋唐至清科举制以考试取士","趋势：由推荐到考试、由门第到才学"],"q":"中国古代选官制度大致经历了：①先秦世卿世禄制，官职世袭；②汉代察举制，由地方长官考察推荐，科目以孝廉为主；③魏晋南北朝九品中正制，中正官评定九等，后期以门第取人；④隋唐至清科举制，以考试成绩取士，打破门第限制，1905年废止。其演变趋势是选拔标准由门第、德行转向才学，选拔方式由推荐转向考试，日益公平开放。","w":"high","e":["2018 真题","2022 真题"]},{"t":"简述科举制度的历史作用与影响","y":"简答题","p":["打破门阀垄断扩大统治基础","考试取士相对公平","促进社会阶层流动","推动教育文化普及","影响东亚与西方文官制度","内容僵化束缚思想"],"q":"科举制度的历史作用主要有：①打破了门阀士族对政治的垄断，扩大统治基础，使庶族地主得以参政；②以考试取士，相对公平公正，提高了官员文化素质；③促进了社会阶层流动，\"朝为田舍郎，暮登天子堂\"；④推动了儒学教育与文化普及；⑤对东亚日本、朝鲜、越南及西方近代文官制度产生深远影响。其消极面在于内容僵化、束缚思想，尤其八股取士流弊","w":"high","e":["2019 真题","2024 真题"]},{"t":"简述科举制度的演变过程","y":"简答题","p":["隋创立进士科","唐代完善设殿试武举","宋代糊名誊录扩大录取","明清八股取士四级考试","1905年废除"],"q":"①创立：隋文帝废九品中正制，以考试选官；隋炀帝设进士科，科举正式形成；②完善：唐代设明经、进士等科，武则天创殿试、武举，考试内容与程序日趋完备；③改革：宋代扩大录取名额，确立殿试为定制，实行糊名誊录，考试趋于公平严密；④鼎盛与僵化：明清形成童试、乡试、会试、殿试四级体系，以八股文取士，制度严密但内容僵化；⑤废除：190","w":"high","e":["2019 真题"]},{"t":"简述科举制度产生的社会历史背景","y":"简答题","p":["九品中正制造成门阀垄断","庶族地主兴起要求打破垄断","隋统一后加强中央集权","扩大统治基础的人才需求","隋炀帝设进士科为确立标志"],"q":"科举制度产生于隋代，其背景为：其一，魏晋以来九品中正制造成“上品无寒门、下品无势族”的门阀垄断，庶族地主经济实力上升，要求打破门阀对仕途的垄断；其二，隋统一后需要加强中央集权，收回选官权于中央，削弱地方豪族势力；其三，官僚制度本身需要更广泛、更稳定的人才来源，以扩大统治基础；其四，纸笔考试的技术条件与儒家经典教育的普及","w":"normal","e":["核心考点"]},{"t":"试论科举制度的历史作用与影响","y":"论述题","p":["打破门阀促进阶层流动","公平取士提高官员素质","推动教育普及儒学传播","加强中央集权","影响西方文官制度","八股束缚思想重文轻技"],"q":"积极方面：①打破门阀世族对政治的垄断，扩大统治基础，促进社会阶层流动，“朝为田舍郎，暮登天子堂”；②以考试取士，相对公平公正，提高了官员的文化素质；③推动教育普及与儒学传播，形成重学重教的社会风气；④加强了中央集权，把选官权收归中央；⑤对东亚及西方文官制度产生重要影响。消极方面：①考试内容局限于儒家经典，尤其明清八股文","w":"high","e":["2023 真题","2018 真题"]},{"t":"试论科举制度对中国社会结构的影响","y":"论述题","p":["打破门阀垄断形成士大夫阶层","促进阶层流动与耕读传家","推动儒学教育普及","形成士绅阶层主导地方","官本位与轻视科技的弊端"],"q":"科举制度对中国社会结构的影响深远：①政治上，打破了魏晋以来门阀士族垄断政权的格局，形成\"士大夫\"这一新的社会阶层，官僚队伍向庶族开放，皇权得以借助寒门士子制衡世家；②社会结构上，促进了阶层流动，形成\"耕读传家\"的社会理想与\"万般皆下品，惟有读书高\"的价值取向；③文化上，推动了儒学经典教育的普及与地方宗族办学之风；④经济","w":"high","e":["2023 真题"]},{"t":"试述科举制度对中国社会的深远影响","y":"论述题","p":["积极：打破门阀、促进阶层流动","积极：收选官权于中央、加强集权","积极：推动重学与教育发展","积极：影响东亚与西方文官制度","消极：八股束缚思想抑制创新","消极：官本位与脱离实际"],"q":"科举制度的影响可从正反两面论述。积极影响：其一，打破了门阀世族对仕途的垄断，使庶族寒门得以通过读书入仕，扩大了统治基础，促进了社会阶层流动；其二，把选官权收归中央，加强了中央集权，削弱了地方势力；其三，以考试取士确立了知识本位与能力标准，推动了重学风气的形成与儒家文化的普及；其四，促进了教育发展，官学私学并兴，书院繁盛","w":"normal","e":["核心考点"]},{"t":"科举制正式创立于（  ）朝，以隋炀帝始设进士科为标志。","y":"填空题","p":["隋炀帝始设进士科","1905年废除"],"q":"隋","w":"normal","e":["核心考点"]},{"t":"提出\"上品无寒门，下品无势族\"所批评的选官制度是（ ）。","y":"单项选择题","p":["魏晋九品中正制唯重门第","隋唐科举制取而代之"],"q":"D. 九品中正制","w":"high","e":["2022 真题"]},{"t":"科举制正式取代九品中正制，始于（ ）。","y":"单项选择题","p":["隋炀帝设进士科","九品中正制至此废止"],"q":"C. 隋朝","w":"normal","e":["核心考点"]},{"t":"科举制创立于唐代，以唐太宗时增设进士科为标志。","y":"判断题","p":["科举制创于隋","唐代为完善期"],"q":"错误。科举制创立于隋朝，以隋炀帝始设进士科为标志；唐代是科举制的完善时期。","w":"normal","e":["核心考点"]}]},{"id":"culture-c09-s02","t":"第二节 明清科举程序","w":"high","n":13,"k":[{"t":"连中三元","y":"名词解释","p":["乡试解元、会试会元、殿试状元","三级皆第一为连中三元","历史上极为罕见"],"q":"科举考试中，乡试、会试、殿试三级考试均获第一名者称\"连中三元\"。乡试第一名称解元，会试第一名称会元，殿试第一名称状元，合称\"三元\"。历史上连中三元者极少，被视为科举最高荣誉。","w":"high","e":["2020 真题"]},{"t":"进士科","y":"名词解释","p":["隋炀帝大业年间始设","以试策取士","唐代重诗赋最为贵重","明清考八股文","标志科举制度形成"],"q":"科举考试的重要科目，隋炀帝大业年间始设，以试策取士。唐代进士科重诗赋，最为士人所重，有“三十老明经，五十少进士”之说。宋以后进士科成为科举的主要科目，明清进士科考八股文。进士科的确立标志着科举制度的正式形成。","w":"high","e":["2020 真题"]},{"t":"殿试","y":"名词解释","p":["皇帝亲自主持的最高一级","始于武则天宋代定制","一甲三名状元榜眼探花","录取者统称进士"],"q":"科举考试的最高一级，由皇帝在殿廷亲自主持。始于唐代武则天，宋代成为定制。明清殿试分三甲：一甲三名赐进士及第（状元、榜眼、探花），二甲若干赐进士出身，三甲若干赐同进士出身。殿试录取者统称进士。","w":"high","e":["2019 真题"]},{"t":"乡试","y":"名词解释","p":["省级考试三年一次","秋八月举行称秋闱","考中者称举人","第一名称解元"],"q":"乡试是明清科举制度中的省级考试，每三年一次在省城举行，因在秋八月举行故称\"秋闱\"。由皇帝钦派主考官主持，应试者为秀才及监生，考中者称举人，第一名称解元。举人即取得参加会试的资格，并具备做官资格。","w":"high","e":["2024 真题"]},{"t":"会试","y":"名词解释","p":["乡试次年春三月京城举行","称春闱或礼闱","考中者称贡士","第一名称会元"],"q":"会试是明清科举制度中的中央考试，于乡试次年春三月在京城礼部举行，故称\"春闱\"或\"礼闱\"。由皇帝钦派大臣主持，应试者为举人，考中者称贡士，第一名称会元。会试合格者方可参加殿试。","w":"high","e":["2024 真题"]},{"t":"童试","y":"名词解释","p":["明清科举初级考试","县试府试院试三阶段","录取后为生员秀才","科举功名的起点"],"q":"明清科举的初级考试，包括县试、府试、院试三个阶段。应试者称童生，院试录取后取得生员（秀才）资格，进入府州县学。童试是科举功名的起点，考中秀才方可参加乡试。","w":"normal","e":["核心考点"]},{"t":"简述明清科举的考试层级","y":"简答题","p":["童试—秀才","乡试秋闱—举人、解元","会试春闱礼闱—贡士、会元","殿试—进士、状元榜眼探花"],"q":"①童试：包括县试、府试、院试，录取者称生员（秀才）；②乡试：每三年一次，秋八月在省城举行，故称秋闱，录取者称举人，第一名称解元；③会试：乡试次年春三月在京师由礼部主持，故称春闱或礼闱，录取者称贡士，第一名称会元；④殿试：由皇帝亲策于殿廷，录取者称进士，分三甲，一甲三名依次为状元、榜眼、探花。","w":"high","e":["2024 真题","2021 真题"]},{"t":"简述明清科举的考试程序","y":"简答题","p":["童试录取秀才","乡试秋闱中举人解元","会试春闱中贡士会元","殿试分三甲状元榜眼探花"],"q":"①童试：包括县试、府试、院试，录取者为生员（秀才）；②乡试：每三年在省城举行，秋八月开考称秋闱，考中者为举人，第一名称解元；③会试：乡试次年春三月在京师举行，由礼部主持称春闱或礼闱，考中者为贡士，第一名称会元；④殿试：皇帝亲自主持，录取者统称进士，分三甲，一甲三名状元、榜眼、探花。","w":"high","e":["2024 真题"]},{"t":"简述明清科举的三级考试体系","y":"简答题","p":["院试：童试取秀才","乡试：秋闱、取举人、第一解元","会试：春闱、取贡士、第一会元","殿试：皇帝亲策、一甲状元榜眼探花","连中三元"],"q":"明清科举分为三级：第一级为院试，包括童试（县试、府试、院试），考中者称秀才（生员），取得入学资格；第二级为乡试，每三年一次在省城举行，逢子午卯酉年，因在秋八月故称秋闱，考中者称举人，第一名称解元；第三级为会试与殿试，会试于乡试次年春二月在京师礼部举行，故称春闱或礼闱，考中者称贡士，第一名称会元；殿试由皇帝亲策于廷，取中","w":"normal","e":["核心考点"]},{"t":"明清科举考试中，乡试在八月举行故称秋闱，其第一名称为（  ）。","y":"填空题","p":["乡试第一解元","会试第一会元、殿试第一状元"],"q":"解元","w":"high","e":["2020 真题"]},{"t":"殿试录取者称进士，一甲三名依次为状元、榜眼、（  ）。","y":"填空题","p":["一甲三名：状元、榜眼、探花","二甲赐进士出身、三甲赐同进士出身"],"q":"探花","w":"normal","e":["核心考点"]},{"t":"明清科举中，由礼部主持、于春三月在京师举行的考试是（ ）。","y":"单项选择题","p":["会试春闱、礼部主持","乡试秋闱、省城举行"],"q":"B. 会试","w":"high","e":["2024 真题"]},{"t":"明清会试因为举办时间为每年的春三月，由礼部主持，因此又叫\"礼闱\"或\"春闱\"。","y":"判断题","p":["会试春三月、礼部主持","故称春闱、礼闱"],"q":"正确。会试于乡试次年春三月在京师举行，由礼部主持，故称春闱、礼闱；乡试在秋八月，称秋闱。","w":"high","e":["2024 真题"]}]},{"id":"culture-c09-s03","t":"第三节 防弊制度与八股文","w":"high","n":4,"k":[{"t":"糊名誊录","y":"名词解释","p":["宋代防止考官徇私","糊名即密封姓名籍贯","誊录即重新抄录试卷","保证考试公平"],"q":"宋代科举为防止考官徇私而实行的制度。糊名又称弥封，即将试卷上考生的姓名、籍贯等密封；誊录即由专人将试卷重新抄录，使考官无法辨认笔迹。二者有效防止了舞弊，保证了考试的公平性，是科举制度走向严密的重要标志。","w":"high","e":["2018 真题"]},{"t":"八股文","y":"名词解释","p":["明清科举规定文体","破题承题起讲入手起股中股后股束股","依朱熹四书章句集注","格式僵化束缚思想"],"q":"明清科举考试规定的文体，又称制义、时文。文章须由破题、承题、起讲、入手、起股、中股、后股、束股八部分组成，后四股各有两股对偶文字，共八股。内容须依朱熹《四书章句集注》发挥，不得自由立论。八股文格式僵化，严重束缚思想，是明清科举的一大弊端。","w":"high","e":["2023 真题"]},{"t":"糊名与誊录","y":"名词解释","p":["宋代防舞弊的试卷制度","糊名封糊姓名籍贯","誊录重抄以防认笔迹","使考试趋于客观公正"],"q":"糊名与誊录是宋代为防科场舞弊而创立的试卷管理制度。糊名（弥封）即将试卷卷首考生姓名、籍贯等封糊，使考官不知考生身份，始于唐武则天时，宋代普遍推行；誊录即由书吏将试卷重新抄录一遍，使考官不能辨认笔迹，始于宋真宗时。二者使考试趋于客观公正，是科举制度成熟的重要标志。","w":"normal","e":["核心考点"]},{"t":"八股文是明清科举考试规定的文体，其格式分为破题、承题、起讲、入手、起股、中股、后股、束股八个部分。","y":"判断题","p":["破题承题起讲入手","起股中股后股束股","代圣贤立言、束缚思想"],"q":"正确。八股文又称制义、时文，严格规定格式与字数，内容须代圣贤立言，不得自由发挥，严重束缚思想。","w":"high","e":["2018 真题"]}]}]},{"id":"culture-c10","t":"第十章 典籍藏书","w":"high","s":[{"id":"culture-c10-s01","t":"第一节 典籍分类与载体","w":"high","n":14,"k":[{"t":"经史子集","y":"名词解释","p":["经部：儒家经典与小学","史部：各类史书","子部：诸子与科技艺术","集部：文学总集别集"],"q":"中国古代图书的四部分类法。经部收儒家经典及小学之书；史部收各类史书；子部收诸子百家及科技、艺术、宗教之书；集部收文学作品的总集与别集。四部分类法由西晋荀勖《中经新簿》初创，至《隋书·经籍志》正式定名，成为《四库全书》的分类依据。","w":"high","e":["2023 真题","2019 真题"]},{"t":"四部分类法","y":"名词解释","p":["经史子集四部","经部儒家经典史部历史","子部诸子科技集部诗文","《隋书·经籍志》定型","《四库全书总目》集大成"],"q":"四部分类法是中国古代图书分类的主要方法，即经、史、子、集四部。经部收儒家经典及注疏，史部收历史著作，子部收诸子百家及科技类书，集部收诗文集与文学评论。此法始于魏晋，定型于《隋书·经籍志》，至《四库全书总目》而集大成，是中国目录学的核心体系。","w":"high","e":["2017 真题","2022 真题"]},{"t":"《七略》","y":"名词解释","p":["刘歆在刘向《别录》基础上编成","分辑略等七部分","我国第一部综合性图书分类目录"],"q":"我国第一部综合性的图书分类目录，西汉刘歆在其父刘向《别录》的基础上编成。全书分辑略、六艺略、诸子略、诗赋略、兵书略、术数略、方技略七部分，故称《七略》。它确立了我国古代图书六分法的体系，对后世目录学影响深远。","w":"high","e":["2024 真题"]},{"t":"七略","y":"名词解释","p":["西汉刘歆编成","中国第一部综合性图书分类目录","辑略、六艺、诸子、诗赋、兵书、术数、方技","奠定古代图书分类框架"],"q":"《七略》是西汉刘歆在其父刘向《别录》基础上编成的中国第一部综合性图书分类目录，成书于公元前六年。全书分辑略、六艺略、诸子略、诗赋略、兵书略、术数略、方技略七部分，著录图书六百零三家、一万三千余卷。\"七略\"确立了我国古代图书分类的基本框架，对后世目录学影响深远。","w":"normal","e":["核心考点"]},{"t":"类书","y":"名词解释","p":["采摭群书按类编排的工具书","述而不作，辑录原文","《艺文类聚》《太平御览》《永乐大典》","具有文献辑佚价值"],"q":"类书是采摭群书、按类目或韵目编排、便于寻检的资料性工具书，其特点是\"述而不作\"，辑录原文而不加己意。著名类书有唐代《艺文类聚》《初学记》、宋代《太平御览》《册府元龟》、明代《永乐大典》、清代《古今图书集成》。类书保存了大量佚书遗文，具有极高的文献辑佚价值。","w":"normal","e":["核心考点"]},{"t":"简述中国古代图书分类法的发展演变","y":"简答题","p":["《七略》六分法","荀勖创甲乙丙丁四部","李充定经史子集次序","《隋志》正式定名"],"q":"①西汉刘歆《七略》创立六分法（六艺、诸子、诗赋、兵书、术数、方技）；②西晋荀勖《中经新簿》创甲乙丙丁四部；③东晋李充调整四部次序为经、史、子、集；④《隋书·经籍志》正式以经史子集命名四部，四部分类法定型；⑤清代《四库全书》集四部分类之大成。","w":"high","e":["2020 真题"]},{"t":"简述中国古代典籍的主要载体形式及其演变","y":"简答题","p":["甲骨—最早文字载体","金石—青铜石碑","简牍缣帛—先秦至魏晋","纸与印刷术—唐雕版宋活字"],"q":"①甲骨：商周时刻于龟甲兽骨，最早的文字载体；②金石：铸于青铜、刻于石碑；③简牍：竹木片，盛行于先秦至魏晋；④缣帛：丝织品，与简牍并行；⑤纸：东汉蔡伦改进造纸术后逐渐普及，成为主要载体；⑥印刷术：唐代雕版、宋代毕昇活字印刷，使典籍大量流通。","w":"high","e":["2016 真题"]},{"t":"简述中国古代图书分类方法的发展","y":"简答题","p":["《七略》七分法首创","荀勖《中经新簿》四分法之始","《隋书·经籍志》正式定名经史子集","《四库全书总目》集大成"],"q":"中国古代图书分类方法的发展：①西汉刘歆《七略》首创七分法，为最早的系统分类目录；②西晋荀勖《中经新簿》创甲乙丙丁四分法，为四部分类之始；③《隋书·经籍志》正式以经、史、子、集命名四部，四分法定型；④清代《四库全书总目》集四部分类之大成，成为古代目录学的最高成就。此外还有南朝王俭《七志》、阮孝绪《七录》等七分法体系。","w":"high","e":["2019 真题"]},{"t":"简述中国古代图书分类法的发展","y":"简答题","p":["刘歆《七略》为最早分类目录","荀勖四部：经子史集","李充调整为经史子集","《隋书·经籍志》正式定名","《四库全书》四部四十四类"],"q":"中国古代图书分类主要有：西汉刘歆在刘向《别录》基础上编成《七略》，分辑略、六艺略、诸子略、诗赋略、兵书略、术数略、方技略，为我国最早的图书分类目录。西晋荀勖编《中经新簿》，改七略为甲乙丙丁四部，即经、子、史、集。东晋李充调整次序为经、史、子、集，奠定四部分类法的基础。《隋书·经籍志》正式以经史子集四部命名，此后历代沿用","w":"normal","e":["核心考点"]},{"t":"我国第一部综合性的图书分类目录是西汉刘歆编成的《（  ）》。","y":"填空题","p":["刘歆编、分七部分","刘向《别录》为其基础"],"q":"七略","w":"high","e":["2024 真题"]},{"t":"东汉（  ）改进造纸术，使纸张逐渐成为主要书写材料。","y":"填空题","p":["蔡伦改进造纸术","纸成为主要载体"],"q":"蔡伦","w":"normal","e":["核心考点"]},{"t":"我国第一部综合性的图书分类目录是（ ）。","y":"单项选择题","p":["刘歆编《七略》","六分法体系"],"q":"C. 《七略》","w":"high","e":["2024 真题"]},{"t":"西汉刘向汇集各种书录编辑成《七略》，这是我国最早的目录学专著。","y":"判断题","p":["《七略》为刘歆所编","刘向编《别录》"],"q":"错误。《七略》是刘向之子刘歆在刘向《别录》基础上编成的；刘向编成的是《别录》。","w":"high","e":["2024 真题"]},{"t":"《永乐大典》是明代永乐年间编纂的大型类书，也是我国古代规模最大的类书。","y":"判断题","p":["明永乐年间编纂","解缙主持","古代规模最大的类书"],"q":"正确。《永乐大典》由解缙、姚广孝主持编纂，共二万二千余卷，是我国古代规模最大的类书，今仅存残卷。","w":"high","e":["2019 真题"]}]},{"id":"culture-c10-s02","t":"第二节 著名典籍","w":"high","n":11,"k":[{"t":"《四库全书》","y":"名词解释","p":["乾隆年间编纂、纪昀总纂","收书三千四百余种","按经史子集四部分类","古代规模最大的丛书"],"q":"清代乾隆年间编纂的大型丛书，由纪昀（纪晓岚）任总纂官，历时十余年编成。全书收书三千四百余种、七万九千余卷，按经史子集四部分类，是我国古代规模最大的丛书。编纂同时查禁销毁了大量不利于清廷的书籍，并形成《四库全书总目提要》这一目录学巨著。","w":"high","e":["2017 真题"]},{"t":"《永乐大典》","y":"名词解释","p":["明成祖永乐年间编纂","解缙姚广孝主持","22877卷约3.7亿字","我国古代规模最大的类书"],"q":"《永乐大典》是明成祖永乐年间编纂的大型类书，由解缙、姚广孝主持，历时五年编成。全书22877卷，约3.7亿字，收录先秦至明初典籍七八千种，按韵目编排，是我国古代规模最大的类书。今仅存残卷数百册，散藏于世界各地。","w":"high","e":["2016 真题"]},{"t":"《说文解字》","y":"名词解释","p":["东汉许慎著","中国第一部系统字书","收字9353个","首创540部首检字法","以六书分析字形"],"q":"《说文解字》是东汉许慎所著的中国第一部系统分析字形、解释字义的字书。全书收字9353个，重文1163个，按540个部首编排，首创部首检字法，以\"六书\"理论分析字形结构，是研究古文字与汉字本义的最重要典籍。","w":"high","e":["2018 真题"]},{"t":"《资治通鉴》","y":"名词解释","p":["北宋司马光主持编纂","编年体通史294卷","记1362年历史","鉴于往事有资于治道"],"q":"《资治通鉴》是北宋司马光主持编纂的编年体通史，历时十九年完成。全书294卷，记载上起战国周威烈王二十三年（前403年）、下迄五代后周世宗显德六年（959年）共1362年的历史，以\"鉴于往事，有资于治道\"为宗旨，为帝王提供治国借鉴，与《史记》并称\"史学双璧\"。","w":"high","e":["2021 真题"]},{"t":"永乐大典","y":"名词解释","p":["明成祖永乐年间编纂","解缙、姚广孝主持","二万二千八百七十七卷","古代规模最大的类书"],"q":"《永乐大典》是明成祖永乐年间编纂的巨型类书，由解缙、姚广孝主持，始于永乐元年（1403年），成于永乐六年（1408年）。全书二万二千八百七十七卷、一万一千零九十五册，约三亿七千万字，按《洪武正韵》韵目编排，收录图书七八千种，是我国古代规模最大的类书。正本已佚，副本仅存四百余册散藏世界各地。","w":"normal","e":["核心考点"]},{"t":"四库全书","y":"名词解释","p":["清乾隆年间编纂","纪昀任总纂官","收书三千四百六十一种","抄七部藏南北七阁，另有总目提要"],"q":"《四库全书》是清乾隆年间编纂的中国古代最大的一部丛书，由纪昀（纪晓岚）任总纂官，始修于乾隆三十八年（1773年），成于乾隆四十七年（1782年）。全书收书三千四百六十一种、七万九千三百零九卷，按经史子集四部分类，抄成七部藏于南北七阁。同时编纂《四库全书总目提要》，是目录学的集大成之作，但修书过程中亦禁毁删改了大量书籍。","w":"normal","e":["核心考点"]},{"t":"简述中国古代典籍的主要类型","y":"简答题","p":["经部典籍","史书四种体例","类书与丛书","字书韵书与政书"],"q":"中国古代典籍的主要类型有：①经部典籍，如《十三经》；②史书，按体例分编年体（《春秋》《资治通鉴》）、纪传体（《史记》《汉书》）、纪事本末体（《通鉴纪事本末》）、国别体（《国语》《战国策》）；③类书，如《永乐大典》《古今图书集成》；④丛书，如《四库全书》；⑤字书韵书，如《说文解字》《广韵》；⑥政书，如《通典》《文献通考》","w":"normal","e":["核心考点"]},{"t":"简述《永乐大典》与《四库全书》的编纂及其价值","y":"简答题","p":["永乐大典：明成祖、解缙主持、最大类书","按韵目编排、辑佚价值高","四库全书：乾隆、纪昀主持、最大丛书","分经史子集四部","寓禁于征、删改销毁的局限"],"q":"《永乐大典》为明成祖时解缙、姚广孝主持编纂，永乐六年成书，共二万二千八百七十七卷，装成一万一千零九十五册，是我国古代规模最大的类书。它按韵目编排，辑录先秦至明初典籍七八千种，保存了大量佚书，其中许多后已失传，故有极高辑佚价值。今仅存残卷数百册。《四库全书》为清乾隆时纪昀等主持编纂，历时十年，收书三千四百余种、七万九千余","w":"normal","e":["核心考点"]},{"t":"试论《四库全书》编纂的文化意义与历史局限","y":"论述题","p":["保存典籍精华收书3461种","总目提要辨章学术考镜源流","推动乾嘉朴学与校勘学","寓禁于征禁毁三千余种","官方意志取舍排斥异端","文化专制的产物"],"q":"《四库全书》的文化意义：①是中国古代规模最大的丛书，系统保存了先秦至清初的典籍精华，收书3461种、79309卷；②《四库全书总目提要》对万余种书籍撰写提要，辨章学术、考镜源流，是古代目录学的集大成之作；③推动了乾嘉朴学与版本校勘学的发展；④确立了经史子集的完整分类体系。其历史局限：①\"寓禁于征\"，编纂过程中禁毁书籍三","w":"high","e":["2023 真题"]},{"t":"清代乾隆年间编纂的最大丛书是《（  ）》，总纂官为纪昀。","y":"填空题","p":["纪昀总纂","经史子集四部分类"],"q":"四库全书","w":"high","e":["2017 真题"]},{"t":"《四库全书》的总纂官是（ ）。","y":"单项选择题","p":["纪晓岚任总纂官","乾隆年间编成"],"q":"C. 纪昀","w":"normal","e":["核心考点"]}]},{"id":"culture-c10-s03","t":"第三节 藏书楼","w":"normal","n":1,"k":[{"t":"天一阁","y":"名词解释","p":["明嘉靖范钦建于宁波","现存最古老的私家藏书楼","取天一生水之义","曾进呈《四库全书》六百余种"],"q":"天一阁是明代嘉靖年间兵部右侍郎范钦在浙江宁波所建的私人藏书楼，建于嘉靖四十年（1561年），取《周易》\"天一生水\"之义以水克火，故名。原有藏书七万余卷，多为宋元明刻本与抄本，是我国现存最古老的私家藏书楼。清代修《四库全书》时曾进呈珍贵典籍六百余种。","w":"normal","e":["核心考点"]}]}]},{"id":"culture-c11","t":"第十一章 科技成就","w":"high","s":[{"id":"culture-c11-s01","t":"第一节 四大发明","w":"high","n":9,"k":[{"t":"四大发明","y":"名词解释","p":["造纸术—东汉蔡伦改进","印刷术—唐雕版、宋活字","火药—唐炼丹、宋军用","指南针—战国司南、宋航海"],"q":"造纸术、印刷术、火药、指南针的合称，是中国古代对世界文明最具影响力的科技成就。造纸术由东汉蔡伦改进；印刷术历经唐代雕版、宋代毕昇活字；火药始于唐代炼丹，宋代用于军事；指南针源于战国司南，宋代用于航海。四大发明经阿拉伯传入欧洲，对世界历史进程产生深远影响。","w":"high","e":["2016 真题"]},{"t":"简述中国古代科技的主要特点","y":"简答题","p":["实用性强、服务农业军事","经验性强、缺乏理论演绎","整体观、天人合一","长期领先、官办为主"],"q":"①实用性强，多服务于农业、军事与医药等实际需要；②经验性强，重观察记录与经验总结，缺乏理论演绎；③整体观强，注重天人合一、阴阳五行的系统思维；④技术领先，四大发明、天文历法、中医、农学长期居于世界前列；⑤官办为主，重大科技活动多由政府组织。","w":"high","e":["2017 真题"]},{"t":"简述中国古代科技发展的主要特点","y":"简答题","p":["实用性强服务农政","重经验总结轻理论推演","整体观与辩证思维","集中于农医天算工艺","明中叶后逐渐落后"],"q":"中国古代科技发展的主要特点：①实用性强，多服务于农业生产与国家治理，如农书、历法、水利；②经验性强，重实践经验总结而轻理论推演；③整体观与辩证思维，如中医的阴阳五行、天人相应；④成就集中于农学、医学、天文历法、数学与工艺技术；⑤长期居于世界领先地位，至明代中后期逐渐落后于西方。","w":"high","e":["2019 真题"]},{"t":"简述中国古代四大发明及其世界影响","y":"简答题","p":["造纸术：蔡伦改进、取代简帛","印刷术：雕版到毕昇活字","火药：唐代发明、宋代军用","指南针：司南到航海罗盘","推动文艺复兴、宗教改革与新航路开辟"],"q":"四大发明为造纸术、印刷术、火药、指南针。造纸术：东汉蔡伦改进造纸工艺，以树皮麻头破布旧渔网为原料，制成质优价廉的纸，取代竹简帛书，极大促进文化传播。印刷术：唐代出现雕版印刷，北宋毕昇发明活字印刷（胶泥活字），元代王祯创木活字与转轮排字盘。火药：唐代炼丹家发明，宋代用于军事，出现突火枪、火箭。指南针：战国司南，宋代制成罗","w":"normal","e":["核心考点"]},{"t":"试论中国古代科技在明清时期由领先转为落后的原因","y":"论述题","p":["专制集权与重农抑商压制创新","八股取士与理学僵化轻视科技","小农经济缺乏技术革新动力","海禁闭关阻断中西交流","重经验轻理论缺乏实验科学","西方近代科学兴起拉开差距"],"q":"中国古代科技在明清时期由领先转为落后的原因主要有：①制度层面，高度集权的君主专制与重农抑商政策压制了工商业与技术创新；②思想层面，科举八股取士与程朱理学的僵化，使知识分子埋头经书、轻视科技，视科技为\"奇技淫巧\"；③经济层面，小农经济自给自足，缺乏扩大再生产与技术革新的内在动力；④政策层面，明清长期实行海禁与闭关锁国，阻","w":"high","e":["2024 真题","2021 真题"]},{"t":"试分析中国古代科技长期领先而近代落后的原因","y":"论述题","p":["领先：农耕经济需求","领先：大一统组织能力","领先：实用理性与外来吸收","落后：自然经济缺乏技术需求","落后：科举八股轻视科技","落后：重经验轻理论、缺逻辑与实验","落后：海禁闭关与专制压制"],"q":"长期领先的原因：其一，农耕经济的需要推动了天文历法、水利工程、农学的发展；其二，大一统的国家组织能力支持大型工程与官方科研，如历法修订、大运河、郑和下西洋；其三，实用理性传统使科技紧密服务于生产与治国；其四，相对开放的文化交流吸收了印度、阿拉伯等外来科技。近代落后的原因：其一，自然经济占主导，缺乏对机械化生产的技术需求","w":"normal","e":["核心考点"]},{"t":"北宋（  ）发明活字印刷术，比欧洲早约四百年。","y":"填空题","p":["北宋庆历年间","胶泥活字"],"q":"毕昇","w":"high","e":["2015 真题"]},{"t":"下列科技著作与作者对应正确的是（ ）。","y":"单项选择题","p":["宋应星著《天工开物》","被誉为\"中国17世纪的工艺百科全书\""],"q":"A. 《天工开物》—宋应星","w":"high","e":["2019 真题"]},{"t":"明清时期，西方科技逐渐传入中国，对中国农学的研究产生一定的影响，出现了像贾思勰这样的大科学家。","y":"判断题","p":["贾思勰为北魏人","徐光启著《农政全书》"],"q":"错误。贾思勰是北魏农学家，著《齐民要术》。明清时期吸收西方科技的农学家代表是徐光启，著《农政全书》。","w":"high","e":["2024 真题"]}]},{"id":"culture-c11-s02","t":"第二节 农学与医药","w":"high","n":10,"k":[{"t":"《齐民要术》","y":"名词解释","p":["北魏贾思勰著","现存最早最完整的农学名著","总结黄河流域农业生产经验"],"q":"北魏贾思勰所著，是我国现存最早、最完整的古代农学名著。全书系统总结了黄河中下游地区的农业生产经验，包括耕作、育种、栽培、饲养、加工等技术，被誉为\"中国古代农业百科全书\"。","w":"high","e":["2024 真题"]},{"t":"《本草纲目》","y":"名词解释","p":["明代李时珍著","收药一千八百余种","总结16世纪前药物学成就"],"q":"明代李时珍所著的中医药学巨著，全书五十二卷，收载药物一千八百余种，附方一万一千余首。该书按纲目体例分类，系统总结了16世纪以前中国的药物学成就，被达尔文誉为\"中国古代的百科全书\"。","w":"high","e":["2018 真题"]},{"t":"《天工开物》","y":"名词解释","p":["明代宋应星著","1637年刊行","18卷记农业与手工业技术","中国17世纪的工艺百科全书"],"q":"《天工开物》是明代宋应星所著的中国古代综合性科学技术著作，刊于崇祯十年（1637年）。全书18卷，分三编，系统记载了农业和手工业的生产技术，包括谷物加工、纺织、染色、制盐、造纸、冶铸、锤锻、陶瓷、榨油、酿酒、珠玉等，被誉为\"中国17世纪的工艺百科全书\"。","w":"high","e":["2020 真题"]},{"t":"齐民要术","y":"名词解释","p":["北魏贾思勰著","现存最早最完整的农书","十卷九十二篇","顺天时、量地利"],"q":"《齐民要术》是北魏贾思勰所著的综合性农书，约成书于公元533至544年，是中国现存最早、最完整的农学著作。全书十卷九十二篇，系统总结了黄河流域的农、林、牧、副、渔生产经验，包括耕作、育种、栽培、贮藏、酿造、畜养等，提出\"顺天时、量地利\"的农业思想，被誉为\"中国古代农业百科全书\"。","w":"normal","e":["核心考点"]},{"t":"天工开物","y":"名词解释","p":["明代宋应星著，1637年刊","十八卷，记述三十个生产部门","附插图一百二十余幅","中国十七世纪的工艺百科全书"],"q":"《天工开物》是明代宋应星所著的综合性科学技术著作，初刊于崇祯十年（1637年）。全书十八卷，分三编，系统记述了农业与手工业三十个生产部门的技术经验，包括谷物加工、纺织、制盐、制糖、陶瓷、冶铸、造纸、兵器等，并附插图一百二十余幅。被誉为\"中国十七世纪的工艺百科全书\"，已被译成多种文字。","w":"normal","e":["核心考点"]},{"t":"本草纲目","y":"名词解释","p":["明代李时珍著","五十二卷，收药一千八百九十二种","附方一万一千余首","十六世纪以前药物学总结"],"q":"《本草纲目》是明代李时珍所著的中药学巨著，历时二十七年、三易其稿，成书于万历六年（1578年），万历二十四年（1596年）在南京刊行。全书五十二卷，收药一千八百九十二种，附方一万一千零九十六首，插图一千一百六十幅，按十六部六十类分类。它系统总结了十六世纪以前中国的药物学成就，被达尔文称为\"中国古代百科全书\"。","w":"normal","e":["核心考点"]},{"t":"我国现存最早、最完整的古代农学名著是北魏贾思勰所著的《（  ）》。","y":"填空题","p":["北魏贾思勰","现存最早最完整农书"],"q":"齐民要术","w":"high","e":["2024 真题"]},{"t":"明代李时珍所著的药物学巨著是《（  ）》。","y":"填空题","p":["李时珍","收药一千八百余种"],"q":"本草纲目","w":"normal","e":["核心考点"]},{"t":"我国现存最早的一部完整的农书是（ ）。","y":"单项选择题","p":["北魏贾思勰","现存最早最完整农书"],"q":"B. 《齐民要术》","w":"high","e":["2024 真题"]},{"t":"《天工开物》是明代宋应星所著，被誉为\"中国17世纪的工艺百科全书\"。","y":"判断题","p":["明宋应星著","工艺百科全书"],"q":"正确。《天工开物》系统记载了农业与手工业的生产技术，图文并茂，是明代科技成就的集大成之作。","w":"high","e":["2019 真题"]}]},{"id":"culture-c11-s03","t":"第三节 数学、天文与历法","w":"high","n":6,"k":[{"t":"《九章算术》","y":"名词解释","p":["东汉成书分九章246题","方田粟米至勾股九类","确立算法为中心的数学体系","负数与方程解法世界领先"],"q":"《九章算术》是中国古代数学的代表作，成书于东汉，全书分九章共246个数学问题，内容包括方田、粟米、衰分、少广、商功、均输、盈不足、方程、勾股。它系统总结了中国先秦至汉代的数学成就，确立了以算法为中心的中国古代数学体系，其中负数概念与联立一次方程组解法居世界领先地位。","w":"high","e":["2017 真题"]},{"t":"二十四节气","y":"名词解释","p":["按太阳黄道位置划分","完整见于《淮南子·天文训》","反映季节气候物候变化","2016年列入人类非遗"],"q":"二十四节气是中国古代根据太阳在黄道上的位置划分的农事历法体系，形成于春秋战国，完整记载见于西汉《淮南子·天文训》。它以立春、雨水、惊蛰等二十四个名称反映季节、气候与物候的变化，指导农业生产。2016年被联合国教科文组织列入人类非物质文化遗产代表作名录。","w":"normal","e":["核心考点"]},{"t":"九章算术","y":"名词解释","p":["东汉初期成书","二百四十六个数学问题","方田至勾股共九章","负数与方程解法世界领先"],"q":"《九章算术》是中国古代数学的经典著作，成书于东汉初期，是《算经十书》中最重要的一部。全书收二百四十六个数学问题，分为方田、粟米、衰分、少广、商功、均输、盈不足、方程、勾股九章，系统总结了先秦至汉代的数学成就，在分数运算、比例算法、线性方程组解法、负数概念等方面处于世界领先地位。","w":"normal","e":["核心考点"]},{"t":"授时历","y":"名词解释","p":["元代郭守敬等编制，1281年颁行","回归年365.2425日","与公历相同但早三百年","创制简仪、高表等仪器"],"q":"《授时历》是元代郭守敬、王恂等编制的历法，至元十八年（1281年）颁行。它确定回归年长度为365.2425日，与现行公历（格里高利历）完全相同，但比后者早了三百年。该历废除上元积年，采用实测数据，并创制简仪、高表等天文仪器，是中国古代最精密的历法之一。","w":"normal","e":["核心考点"]},{"t":"梦溪笔谈","y":"名词解释","p":["北宋沈括著","笔记体，二十六卷","记载活字印刷、指南针、石油","中国科学史上的坐标"],"q":"《梦溪笔谈》是北宋沈括所著的笔记体科学著作，成书于元祐年间，因写于润州梦溪园而得名。全书二十六卷（另有补笔谈、续笔谈），内容涉及天文、数学、物理、化学、地理、地质、气象、生物、医药、工程技术、文学、史学、音乐等，其中关于活字印刷、指南针、石油的记载尤为珍贵，被誉为\"中国科学史上的坐标\"。","w":"normal","e":["核心考点"]},{"t":"简述中国古代天文历法的主要成就","y":"简答题","p":["《夏小正》最早物候历","商代干支纪日与日月食记录","春秋十九年七闰","张衡浑天仪地动仪","僧一行实测子午线","郭守敬《授时历》"],"q":"中国古代天文历法成就主要有：①《夏小正》为现存最早的物候历；②商代甲骨文已有完备的干支纪日与日月食记录；③春秋时确定十九年七闰法，比西方早百余年；④战国《甘石星经》为世界最早的天文学著作；⑤汉代张衡制浑天仪、地动仪；⑥唐代僧一行主持实测子午线长度，编《大衍历》；⑦元代郭守敬编《授时历》，一年长度365.2425日，与现","w":"high","e":["2022 真题"]}]},{"id":"culture-c11-s04","t":"第四节 水利工程","w":"normal","n":1,"k":[{"t":"都江堰","y":"名词解释","p":["战国李冰父子主持修建","鱼嘴、飞沙堰、宝瓶口三大主体","无坝引水，自动分水排沙","使成都平原成为天府之国"],"q":"都江堰是战国时期秦国蜀郡守李冰父子主持修建的大型无坝引水灌溉工程，约建于公元前256年至前251年，位于四川灌县岷江之上。工程由鱼嘴分水堤、飞沙堰溢洪道、宝瓶口引水口三大主体构成，实现了自动分水、排沙、控流。两千多年来一直发挥效益，使成都平原成为\"天府之国\"，是世界水利史上的杰作。","w":"normal","e":["核心考点"]}]},{"id":"culture-c11-s05","t":"第五节 科技发展滞缓原因","w":"high","n":1,"k":[{"t":"试分析13世纪以后中国科学技术发展滞缓的原因","y":"简答题","p":["专制强化、思想控制严酷","八股取士、轻视科技","重道轻器、视为奇技淫巧","重农抑商、缺乏市场需求","闭关锁国、阻断交流"],"q":"①政治上君主专制空前强化，思想控制严酷；②科举八股取士，知识分子埋头章句，轻视科技；③\"重道轻器\"的传统观念，视科技为\"奇技淫巧\"；④重农抑商政策压制工商业，科技缺乏市场需求；⑤缺乏形式逻辑与实验科学传统，重经验总结而轻理论演绎；⑥明清闭关锁国，阻断中西科技交流。","w":"high","e":["2024 真题"]}]}]},{"id":"culture-c12","t":"第十二章 传统建筑","w":"high","s":[{"id":"culture-c12-s01","t":"第一节 木构架与结构构件","w":"high","n":14,"k":[{"t":"斗拱","y":"名词解释","p":["位于柱顶与屋檐之间的构件","承托屋檐、传递荷载","层数出跳定等级","形成框架结构"],"q":"中国传统木构建筑中特有的构件，由斗、拱、昂等组成，位于柱顶与屋檐之间，起承托屋檐、传递荷载和装饰的作用。斗拱的层数与出跳数越多，建筑等级越高。它使中国建筑形成了\"墙倒屋不塌\"的框架结构特性。","w":"high","e":["2018 真题"]},{"t":"榫卯","y":"名词解释","p":["凹凸结合的连接工艺","凸者为榫、凹者为卯","不用钉、抗震性能好"],"q":"中国传统木构建筑的核心连接工艺，在两个构件上采用凹凸结合的方式相接，凸出者称榫，凹入者称卯。榫卯不用钉子，靠木材本身的咬合受力，具有良好的抗震性能，是中国古代木构建筑的重大创造。","w":"high","e":["2017 真题"]},{"t":"木构架结构","y":"名词解释","p":["以木柱木梁承重","墙倒屋不塌","抬梁式穿斗式井干式","抬梁式用于北方与宫殿"],"q":"木构架结构是中国古代建筑最主要的承重方式，以木柱、木梁构成房屋骨架，墙体只起围护分隔作用，有\"墙倒屋不塌\"之说。主要形式有抬梁式、穿斗式和井干式。其中抬梁式使用最广，多用于北方与宫殿庙宇；穿斗式多用于南方民居。","w":"high","e":["2016 真题"]},{"t":"简述中国古代建筑的主要特征","y":"简答题","p":["木构架为主墙倒屋不塌","院落布局中轴对称","重群体组合与空间序列","屋顶形式多样等级分明","色彩装饰有严格等级","与自然和谐天人合一"],"q":"中国古代建筑的主要特征：①以木构架结构为主，墙倒屋不塌；②平面布局以院落为单位，讲究中轴对称；③重视群体组合与空间序列，形成\"庭院深深\"的层次感；④屋顶形式丰富，有庑殿、歇山、悬山、硬山、攒尖等，等级分明；⑤色彩与装饰有严格等级，如黄琉璃瓦为皇家专用；⑥建筑与自然环境和谐统一，体现天人合一思想。","w":"high","e":["2017 真题","2022 真题"]},{"t":"简述中国古代建筑的主要特点","y":"简答题","p":["木构为主、框架结构","中轴对称、等级森严","院落组合、纵深扩展","装饰丰富、注重环境"],"q":"①木构为主，以木构架为骨架，形成\"墙倒屋不塌\"的框架结构；②中轴对称，重要建筑沿纵轴布局，体现等级秩序；③院落组合，以院落为单位向纵深扩展；④装饰丰富，斗拱、彩画、琉璃瓦、雕饰并用；⑤等级森严，屋顶形制、开间数、色彩均有严格规定；⑥注重与环境协调，体现天人合一。","w":"high","e":["2020 真题"]},{"t":"简述中国古建筑屋顶的主要形制及其等级","y":"简答题","p":["庑殿顶等级最高","歇山顶次之","悬山、硬山多用于民居","重檐高于单檐"],"q":"主要形制由高到低依次为：①庑殿顶（四阿顶），四面斜坡，用于宫殿、坛庙主殿，等级最高；②歇山顶，四面坡与两面坡结合，等级仅次于庑殿顶；③悬山顶，两坡出檐悬于山墙外；④硬山顶，两坡不出檐，多见于民居；⑤攒尖顶，用于亭、塔、坛；⑥卷棚顶，无正脊，多见于园林。此外还有重檐与单檐之别，重檐高于单檐。","w":"high","e":["2019 真题"]},{"t":"简述中国古代建筑的基本特征","y":"简答题","p":["木构架：抬梁式与穿斗式","院落式布局、中轴对称","群体组合与空间序列","屋顶形式多样、檐角起翘","色彩装饰等级化","与自然山水结合"],"q":"中国古代建筑的基本特征：其一，以木构架为主要结构方式，采用抬梁式与穿斗式，墙倒屋不塌；其二，以庭院为基本单位，形成院落式布局，讲究中轴对称与主次分明；其三，重视群体组合与空间序列，通过门、廊、院层层展开；其四，屋顶形式丰富，有庑殿、歇山、悬山、硬山、攒尖等，檐角起翘、屋面反曲；其五，装饰色彩制度化，如宫殿用黄瓦红墙、民","w":"normal","e":["核心考点"]},{"t":"试论中国古代建筑所体现的文化观念","y":"论述题","p":["礼制等级观念","宗法家族观念","天人合一与风水","中轴对称体现中庸","阴阳五行观念","内向封闭的文化性格"],"q":"中国古代建筑深刻体现了传统文化观念：①礼制等级观念，如屋顶形式、开间数量、色彩装饰均有严格等级，黄瓦红墙为皇家专用；②宗法家族观念，四合院\"长幼有序、内外有别\"的布局正是宗法伦理的空间化；③天人合一思想，建筑选址讲究风水、依山傍水，与自然融为一体；④中正平和之美，中轴对称、居中为尊体现儒家中庸思想；⑤阴阳五行观念，如奇","w":"high","e":["2023 真题"]},{"t":"中国古建筑屋顶形制中，等级最高的是（  ）顶。","y":"填空题","p":["庑殿顶四面斜坡","用于宫殿坛庙主殿"],"q":"庑殿","w":"high","e":["2019 真题"]},{"t":"中国传统木构建筑不用钉子、以凹凸咬合连接构件的工艺称为（  ）。","y":"填空题","p":["凸者为榫、凹者为卯","抗震性能优异"],"q":"榫卯","w":"high","e":["2017 真题"]},{"t":"北京故宫始建于（  ）朝永乐年间，是世界上现存规模最大的木构宫殿建筑群。","y":"填空题","p":["明永乐年间营建","现存最大木构宫殿群"],"q":"明","w":"normal","e":["核心考点"]},{"t":"中国现存规模最大、保存最完整的古代木构宫殿建筑群是（ ）。","y":"单项选择题","p":["明永乐年间建","世界最大木构宫殿群"],"q":"D. 北京故宫","w":"normal","e":["核心考点"]},{"t":"斗拱是中国传统木构建筑的特有构件，其层数越多，建筑等级越高。","y":"判断题","p":["斗拱承托屋檐","层数定等级"],"q":"正确。斗拱位于柱顶与屋檐之间，承托出檐、传递荷载，层数与出跳数越多，建筑等级越高。","w":"high","e":["2018 真题"]},{"t":"中国古建筑以砖石结构为主，形成\"墙倒屋不塌\"的特点。","y":"判断题","p":["以木构架为主","墙体不承重"],"q":"错误。中国古建筑以木构架为主，墙体不承重，故\"墙倒屋不塌\"；砖石结构多见于塔、桥、城墙等。","w":"normal","e":["核心考点"]}]},{"id":"culture-c12-s02","t":"第二节 屋顶形制与等级","w":"high","n":3,"k":[{"t":"庑殿顶","y":"名词解释","p":["等级最高的屋顶形式","一正脊四斜脊，又称四阿顶","用于宫殿坛庙最高等级建筑","太和殿为重檐庑殿顶"],"q":"庑殿顶是中国传统屋顶形式中等级最高的一种，由一条正脊和四条斜脊组成，四面均为斜坡，故又称\"四阿顶\"\"五脊殿\"。它多用于宫殿、坛庙等最高等级建筑，如故宫太和殿即重檐庑殿顶。屋顶形式按等级依次为庑殿、歇山、悬山、硬山、攒尖，是礼制等级在建筑上的直接体现。","w":"normal","e":["核心考点"]},{"t":"简述中国古代屋顶的主要形式与等级","y":"简答题","p":["庑殿顶等级最高用于宫殿","歇山顶次之","悬山顶用于民居","硬山顶等级较低","攒尖顶用于亭塔","重檐高于单檐"],"q":"中国古代屋顶形式主要有：①庑殿顶，四面斜坡、一条正脊四条斜脊，等级最高，用于宫殿与重要庙宇；②歇山顶，四面斜坡上部两山面为三角形山花，等级次之；③悬山顶，两山面屋顶悬出山墙之外，多用于民居；④硬山顶，两山面与山墙齐平，等级较低；⑤攒尖顶，多用于亭阁、塔；⑥重檐比单檐等级高。整体等级序列为：重檐庑殿 > 重檐歇山 > 单","w":"high","e":["2020 真题"]},{"t":"下列屋顶形制中，等级最高的是（ ）。","y":"单项选择题","p":["庑殿顶为最高等级","歇山顶次之"],"q":"C. 庑殿顶","w":"high","e":["2019 真题"]}]},{"id":"culture-c12-s03","t":"第三节 布局、民居与园林","w":"high","n":5,"k":[{"t":"四合院","y":"名词解释","p":["北方典型民居、北京最著名","中轴对称、四面围合","体现宗法伦理与天人合一"],"q":"中国北方典型的传统民居形式，以北京四合院最为著名。其布局以南北纵轴对称为原则，由正房、东西厢房、倒座房围合成封闭的院落，大门多开于东南角。四合院体现了尊卑有序、长幼有别的宗法伦理和\"天人合一\"的居住理念。","w":"high","e":["2016 真题"]},{"t":"中轴线","y":"名词解释","p":["都城规划核心原则","南北纵贯对称布局","南起永定门北至钟鼓楼","体现皇权至上居中为尊"],"q":"中轴线是中国古代都城规划的核心原则，以南北纵贯的都城中轴为骨架，重要建筑对称分布于两侧。明清北京城中轴线南起永定门，经正阳门、天安门、紫禁城、景山，北至钟鼓楼，全长约7.8公里，集中体现了皇权至上、居中为尊的礼制思想，2024年\"北京中轴线\"被列入世界遗产名录。","w":"high","e":["2024 真题"]},{"t":"借景","y":"名词解释","p":["古典园林最重要的造景手法","将园外景物纳入园内视野","《园冶》\"得景则无拘远近\"","远借、邻借、仰借、俯借"],"q":"借景是中国古典园林最重要的造景手法，指将园外的景物有意识地组织到园内视野之中，使有限空间获得无限意境。计成《园冶》云\"借者，园虽别内外，得景则无拘远近\"。借景分远借、邻借、仰借、俯借、应时而借等，如颐和园借西山、拙政园借北寺塔，是园林艺术\"虽由人作，宛自天开\"的关键。","w":"normal","e":["核心考点"]},{"t":"风水","y":"名词解释","p":["又称堪舆","阴阳五行、八卦方位的环境选择","藏风聚气、负阴抱阳","含实践经验亦杂糅迷信"],"q":"风水又称堪舆，是中国古代关于建筑选址、朝向、布局的环境选择理论与术数。它以阴阳五行、八卦方位、气论为基础，讲究\"藏风聚气\"\"负阴抱阳\"\"背山面水\"。其中包含对地形、水文、气候、日照的实践经验，具有合理成分，但也杂糅了大量迷信内容。风水观念深刻影响了中国传统聚落、住宅与陵墓的营造。","w":"normal","e":["核心考点"]},{"t":"简述中国古典园林的分类与造园手法","y":"简答题","p":["皇家、私家、寺观、陵墓四类","北方、江南、岭南地域风格","师法自然、宛自天开","叠山理水","借景对景框景漏景","步移景异与诗画意境"],"q":"中国古典园林按隶属关系分为皇家园林（如颐和园、承德避暑山庄）、私家园林（如苏州拙政园、留园）、寺观园林（如杭州灵隐寺）与陵墓园林。按地域风格分为北方园林、江南园林、岭南园林。造园手法：其一，师法自然、虽由人作宛自天开，追求自然山水的意境；其二，叠山理水，以假山池沼模拟自然；其三，建筑与山水花木有机组合，亭台楼榭廊桥点缀","w":"normal","e":["核心考点"]}]},{"id":"culture-c12-s04","t":"第四节 建筑典籍","w":"high","n":1,"k":[{"t":"《营造法式》","y":"名词解释","p":["北宋李诫奉敕编修","1103年刊行34卷","规定设计施工用料标准","提出材分制模数体系"],"q":"《营造法式》是北宋李诫奉敕编修的建筑技术专著，刊于崇宁二年（1103年）。全书34卷，系统规定了建筑的设计规范、施工技术、用料标准与工限，提出\"材分制\"模数体系，是中国古代最完备的建筑技术典籍，对研究宋代建筑与东亚建筑影响极大。","w":"high","e":["2021 真题"]}]}]},{"id":"culture-c13","t":"第十三章 古典文学","w":"high","s":[{"id":"culture-c13-s01","t":"第一节 先秦文学","w":"high","n":10,"k":[{"t":"风骚","y":"名词解释","p":["风指《诗经·国风》，骚指屈原《离骚》","分别代表现实主义与浪漫主义两大传统","后世以风骚代指文学"],"q":"“风”指《诗经》中的《国风》，“骚”指屈原的《离骚》。“风骚”并称，代表了中国古典文学中现实主义与浪漫主义两大源头，后世常以“风骚”代指文学或文学成就。","w":"high","e":["2021 真题","2016 真题"]},{"t":"《诗经》","y":"名词解释","p":["我国第一部诗歌总集，共305篇","内容分风、雅、颂三部分","手法为赋、比、兴","奠定现实主义诗歌传统"],"q":"我国第一部诗歌总集，收录西周初年至春秋中叶约五百年的诗歌 305 篇，又称“诗三百”。按内容分为风、雅、颂三部分，艺术上多用赋、比、兴手法，奠定了中国诗歌现实主义的优良传统。","w":"high","e":["2019 真题","2015 真题"]},{"t":"楚辞","y":"名词解释","p":["屈原为代表的楚国新诗体","句式长短参差，多用“兮”字","刘向辑录成书，浪漫主义源头"],"q":"战国时期以屈原为代表的楚国诗人创造的一种新诗体，句式长短参差，多用“兮”字，富有浓郁的楚国地方色彩与浪漫主义精神。西汉刘向辑录屈原、宋玉等人作品编成《楚辞》一书，是我国第一部浪漫主义诗歌总集。","w":"high","e":["2018 真题"]},{"t":"诗经六义","y":"名词解释","p":["风雅颂为体制分类","赋比兴为表现手法","风为地方乐歌，颂为祭祀乐歌","儒家诗学核心范畴"],"q":"诗经六义指《诗经》的六种体制与表现手法，即风、雅、颂、赋、比、兴。风、雅、颂是《诗经》按音乐性质划分的三类内容：风为地方乐歌，雅为周王畿正声，颂为宗庙祭祀乐歌；赋、比、兴是表现手法：赋为铺陈直叙，比为比喻，兴为先言他物以引起所咏之词。这一体系是儒家诗学的核心范畴。","w":"normal","e":["核心考点"]},{"t":"简述《诗经》的思想内容与艺术成就","y":"简答题","p":["反映劳动、爱情、战争徭役与反抗情绪","开创赋比兴手法","四言为主，重章叠句","奠定现实主义传统"],"q":"思想内容：①反映劳动人民的生活与爱情；②揭露统治者剥削压迫，表现反抗情绪；③反映战争徭役之苦与思乡怀人；④颂扬祖先与祭祀宴飨。艺术成就：①开创赋、比、兴的表现手法；②句式以四言为主，重章叠句，反复咏叹；③语言质朴自然，富有音乐性；④奠定现实主义创作传统。","w":"high","e":["2021 真题"]},{"t":"简述《诗经》的内容分类与艺术特色","y":"简答题","p":["最早诗歌总集、三百零五篇","风雅颂的分类","赋比兴手法","重章叠句的结构","四言为主、语言质朴","奠定现实主义传统"],"q":"《诗经》是我国最早的诗歌总集，收录西周初年至春秋中叶诗歌三百零五篇，分风、雅、颂三部分。风为十五国风，多为民歌，反映民间生活与情感；雅分大雅小雅，多为贵族所作，涉及政治讽喻与宴飨；颂为周颂、鲁颂、商颂，用于宗庙祭祀。艺术特色：其一，赋比兴的表现手法，赋为直陈其事，比为比喻，兴为起兴发端；其二，重章叠句、回环往复的结构；","w":"normal","e":["核心考点"]},{"t":"我国第一部诗歌总集是《（  ）》，共收录诗歌 305 篇。","y":"填空题","p":["《诗经》又称“诗三百”，收录西周至春秋诗歌305篇"],"q":"诗经","w":"high","e":["2019 真题"]},{"t":"屈原的代表作《（  ）》是我国古代最长的抒情诗。","y":"填空题","p":["《离骚》共370余句，是我国古代最长的抒情诗"],"q":"离骚","w":"high","e":["2017 真题"]},{"t":"我国第一部浪漫主义诗歌总集是（ ）。","y":"单项选择题","p":["《楚辞》由刘向辑录","《诗经》为现实主义诗歌总集"],"q":"B. 《楚辞》","w":"high","e":["2018 真题"]},{"t":"《诗经》中的“风”指宗庙祭祀的乐歌。","y":"判断题","p":["风为各地民歌","雅为宫廷正乐","颂为宗庙祭祀乐歌"],"q":"错误。“风”指各地民歌民谣；“雅”为宫廷正乐；“颂”才是宗庙祭祀的乐歌。","w":"normal","e":["核心考点"]}]},{"id":"culture-c13-s02","t":"第二节 汉魏六朝文学","w":"normal","n":3,"k":[{"t":"乐府","y":"名词解释","p":["本为汉代掌乐官署","采集民歌配乐，后成诗体名","《孔雀东南飞》为代表，多叙事","唐代新乐府运动承其精神"],"q":"乐府本是汉代掌管音乐的官署，始于秦，汉武帝时规模扩大，负责采集民间歌谣、配制乐曲。后人将乐府机关采集、演唱的诗歌称为\"乐府诗\"，遂由官署名变为诗体名。汉乐府以《陌上桑》《孔雀东南飞》为代表，多叙事、善铺陈、语言质朴，开创了中国叙事诗的传统。唐代白居易等倡导新乐府运动，主张\"文章合为时而著，歌诗合为事而作\"。","w":"normal","e":["核心考点"]},{"t":"建安风骨","y":"名词解释","p":["建安时期三曹与建安七子","反映动乱、抒建功立业之志","慷慨悲凉、刚健有力","后世提倡刚健文风的旗帜"],"q":"建安风骨指汉末建安时期以曹操、曹丕、曹植父子及\"建安七子\"为代表的诗歌风格。其作品继承汉乐府现实精神，反映社会动乱与人民疾苦，抒发建功立业的抱负，情感慷慨悲凉、语言刚健有力、意境雄浑阔大。刘勰《文心雕龙》称\"慷慨以任气，磊落以使才\"，后世以此作为反对绮靡诗风、提倡刚健文风的旗帜。","w":"normal","e":["核心考点"]},{"t":"骈文","y":"名词解释","p":["南北朝盛行的文体","双句为主，讲究对仗声律","四六句式，用典繁富","韩柳古文运动后渐衰"],"q":"骈文是魏晋以来形成、南北朝盛行的文体，又称\"骈体文\"\"四六文\"。其特点是通篇以双句（俪句、偶句）为主，讲究对仗工整、声律和谐、用典繁富、辞藻华丽，句式多为四字、六字相间。代表作家有庾信、徐陵，代表作《哀江南赋》《玉台新咏序》。中唐韩柳古文运动兴起后骈文渐衰，清代又一度复兴。","w":"normal","e":["核心考点"]}]},{"id":"culture-c13-s03","t":"第三节 唐宋文学","w":"high","n":9,"k":[{"t":"唐宋八大家","y":"名词解释","p":["唐代韩愈、柳宗元，宋代欧阳修、三苏、王安石、曾巩","倡导古文运动，反对骈文","主张文以明道","确立平易畅达的散文传统"],"q":"唐代韩愈、柳宗元和宋代欧阳修、苏洵、苏轼、苏辙、王安石、曾巩八位散文家的合称。他们倡导古文运动，反对骈文浮华，主张“文以明道”，确立了平易畅达的散文传统，对后世散文发展影响深远。","w":"high","e":["2023 真题","2017 真题"]},{"t":"简述宋词豪放派与婉约派的代表人物及风格差异","y":"简答题","p":["婉约派：柳永、李清照，柔美细腻","豪放派：苏轼、辛弃疾，气象雄浑","两派代表作品与题材差异","两派并非绝对对立"],"q":"婉约派以柳永、李清照为代表，题材多写离愁别绪、儿女情长，语言柔美细腻，讲究音律，柳永《雨霖铃》、李清照《声声慢》为代表作；豪放派以苏轼、辛弃疾为代表，题材广阔，气象雄浑，抒发家国情怀与人生抱负，苏轼《念奴娇·赤壁怀古》、辛弃疾《破阵子》为代表作。两派并非截然对立，苏轼、辛弃疾亦有婉约之作。","w":"high","e":["2018 真题"]},{"t":"简述唐诗发展的四个阶段及其代表诗人","y":"简答题","p":["初唐四杰与陈子昂力矫浮艳","盛唐李白杜甫双峰并峙","中唐新乐府运动与韩孟诗派","晚唐李商隐杜牧绮丽感伤"],"q":"①初唐：王勃、杨炯、卢照邻、骆宾王“初唐四杰”及陈子昂，力矫齐梁浮艳诗风；②盛唐：李白、杜甫、王维、孟浩然、高适、岑参，浪漫与现实两峰并峙，山水田园与边塞诗派兴盛；③中唐：白居易、元稹倡导新乐府运动，韩愈、孟郊奇险诗风，李贺瑰丽想象；④晚唐：李商隐、杜牧，风格绮丽感伤，唐诗由盛转衰。","w":"normal","e":["核心考点"]},{"t":"简述唐诗发展的几个阶段及代表作家","y":"简答题","p":["初唐四杰与陈子昂","盛唐李白杜甫双峰","盛唐山水田园与边塞诗派","中唐新乐府与韩孟诗派","晚唐小李杜"],"q":"唐诗发展分四期：初唐（高祖至玄宗初），代表有王勃、杨炯、卢照邻、骆宾王四杰，陈子昂倡汉魏风骨，张若虚《春江花月夜》孤篇横绝；盛唐（玄宗至代宗），为唐诗巅峰，有李白之飘逸、杜甫之沉郁，山水田园派王维孟浩然，边塞派高适岑参王昌龄；中唐（代宗至文宗），有白居易元稹的新乐府运动，韩愈孟郊的奇险，刘禹锡柳宗元的清峻，李贺的瑰奇；","w":"normal","e":["核心考点"]},{"t":"试述宋词的发展脉络与豪放婉约两大流派","y":"论述题","p":["晚唐五代花间与南唐词","柳永创慢词、扩大题材","苏轼以诗为词开豪放","周邦彦格律与婉约集成","李清照词别是一家","辛弃疾以文为词、苏辛并称","豪放与婉约互渗"],"q":"宋词发展脉络：晚唐五代词以温庭筠、韦庄为代表的花间派与李煜的南唐词奠定基础，题材多绮怨柔情。北宋初期晏殊、欧阳修承其余绪，词风闲雅；柳永大量创制慢词长调，铺叙羁旅行役，扩大词的体制与题材；苏轼以诗为词，开豪放一派，扩大词的境界；周邦彦精于音律、讲究章法，为婉约之集大成。南宋初期李清照倡词别是一家，以寻常语入词，为婉约正","w":"normal","e":["核心考点"]},{"t":"宋代词坛豪放派的代表词人是苏轼和（  ）。","y":"填空题","p":["苏轼、辛弃疾并称“苏辛”，为豪放派代表"],"q":"辛弃疾","w":"high","e":["2020 真题"]},{"t":"“初唐四杰”指王勃、杨炯、卢照邻和（  ）。","y":"填空题","p":["初唐四杰：王勃、杨炯、卢照邻、骆宾王"],"q":"骆宾王","w":"normal","e":["核心考点"]},{"t":"提出“文以明道”、倡导古文运动的唐代作家是（ ）。","y":"单项选择题","p":["韩愈倡导古文运动","与柳宗元并称“韩柳”"],"q":"C. 韩愈","w":"high","e":["2023 真题"]},{"t":"苏轼与辛弃疾同为豪放派词人，并称“苏辛”。","y":"判断题","p":["苏轼开创豪放词风","辛弃疾发展至高峰","并称苏辛"],"q":"正确。苏轼开豪放一派，辛弃疾继之并将豪放词推向高峰，二人并称“苏辛”。","w":"high","e":["2019 真题"]}]},{"id":"culture-c13-s04","t":"第四节 元明清文学","w":"high","n":17,"k":[{"t":"汤显祖与临川派","y":"名词解释","p":["汤显祖，江西临川人，代表作《牡丹亭》","临川四梦：《牡丹亭》《紫钗记》《南柯记》《邯郸记》","主张重情采，与沈璟吴江派对立"],"q":"汤显祖是明代万历年间著名戏曲家，江西临川人，代表作“临川四梦”中以《牡丹亭》最为著名。他主张戏曲创作应以“情”为主，不受格律束缚，形成了以文采见长的“临川派”（又称玉茗堂派），与沈璟为首的“吴江派”形成对立。","w":"high","e":["2024 真题","2019 真题"]},{"t":"四大名著","y":"名词解释","p":["《三国演义》《水浒传》《西游记》《红楼梦》","《三国演义》为第一部长篇章回体小说","《红楼梦》前八十回曹雪芹，后四十回高鹗续"],"q":"指《三国演义》《水浒传》《西游记》《红楼梦》四部长篇章回体小说。《三国演义》为罗贯中所著，是我国第一部长篇章回体历史演义小说；《水浒传》相传为施耐庵所著；《西游记》为吴承恩所著；《红楼梦》前八十回为曹雪芹所著，后四十回一般认为是高鹗续成。","w":"high","e":["2022 真题","2016 真题"]},{"t":"元曲四大家","y":"名词解释","p":["关汉卿、白朴、马致远、郑光祖","关汉卿为四大家之首，代表作《窦娥冤》","与唐诗宋词并称"],"q":"指元代杂剧作家关汉卿、白朴、马致远、郑光祖。关汉卿被誉为“元曲四大家”之首，代表作《窦娥冤》；白朴《梧桐雨》；马致远《汉宫秋》；郑光祖《倩女离魂》。元曲与唐诗、宋词并称，是中国韵文史上的高峰。","w":"high","e":["2020 真题"]},{"t":"公安派","y":"名词解释","p":["明代后期三袁为代表","湖北公安人","独抒性灵，不拘格套","反对前后七子复古模拟"],"q":"公安派是明代后期以袁宏道、袁宗道、袁中道三兄弟为代表的文学流派，因三人为湖北公安人而得名。他们受李贽童心说影响，提出\"独抒性灵，不拘格套\"的文学主张，反对前后七子的复古模拟，强调作家真情实感与个性表现。公安派的文学解放思潮对晚明小品文与清代性灵派产生了深远影响。","w":"normal","e":["核心考点"]},{"t":"桐城派","y":"名词解释","p":["清代最大散文流派","方苞、刘大櫆、姚鼐为代表","方苞义法说，姚鼐义理考据辞章","主盟文坛二百余年"],"q":"桐城派是清代最大的散文流派，由方苞开创，经刘大櫆、姚鼐发展完善，因三人均为安徽桐城人而得名。方苞提出\"义法\"说，刘大櫆讲\"神气音节\"，姚鼐提出义理、考据、辞章三者统一，并编《古文辞类纂》确立古文统系。桐城派主盟清代文坛二百余年，影响直至近代。","w":"normal","e":["核心考点"]},{"t":"简述明清小说的发展脉络与代表作品","y":"简答题","p":["明初三国水浒开创章回体","明中世情神魔小说兴盛","三言二拍短篇白话高峰","清代红楼梦为古典小说巅峰"],"q":"①明初：《三国演义》《水浒传》开创长篇章回体；②明中叶：《西游记》神魔小说兴盛，《金瓶梅》开创文人独立创作世情小说；③明末“三言二拍”代表短篇白话小说高峰；④清代：《红楼梦》达到古典小说巅峰，《儒林外史》为讽刺小说杰作，《聊斋志异》为文言短篇小说集大成。","w":"normal","e":["核心考点"]},{"t":"试论《红楼梦》的思想内容与艺术成就","y":"论述题","p":["四大家族兴衰与宝黛爱情悲剧","揭露封建末世腐朽与礼教批判","人物塑造高度个性化","结构宏大严谨、语言洗练","打破大团圆传统的悲剧结局"],"q":"思想内容：以贾、史、王、薛四大家族兴衰为背景，以宝黛爱情悲剧为主线，深刻揭露封建末世的腐朽与必然衰亡的命运，批判封建礼教与科举制度，具有深刻的现实主义精神。艺术成就：①人物形象塑造高度个性化，塑造了众多性格鲜明的人物；②结构宏大而严谨，多条线索交织推进；③语言洗练自然，兼具雅俗；④细节描写精微，生活气息浓厚；⑤打破“大","w":"high","e":["2022 真题"]},{"t":"《红楼梦》前八十回的作者是（  ），后四十回一般认为是高鹗续成。","y":"填空题","p":["曹雪芹著前八十回，高鹗续后四十回"],"q":"曹雪芹","w":"high","e":["2021 真题"]},{"t":"“临川四梦”中成就最高、影响最大的是《（  ）》。","y":"填空题","p":["《牡丹亭》为汤显祖临川四梦之首"],"q":"牡丹亭","w":"high","e":["2024 真题"]},{"t":"我国第一部长篇章回体历史演义小说是《（  ）》。","y":"填空题","p":["罗贯中《三国演义》为第一部长篇章回体历史演义小说"],"q":"三国演义","w":"normal","e":["核心考点"]},{"t":"被誉为“元曲四大家”之首的作家是（ ）。","y":"单项选择题","p":["元曲四大家以关汉卿为首","代表作《窦娥冤》"],"q":"D. 关汉卿","w":"high","e":["2020 真题"]},{"t":"下列作品中，不属于关汉卿代表作的是（ ）。","y":"单项选择题","p":["《西厢记》为王实甫代表作","关汉卿代表作有《窦娥冤》《救风尘》《望江亭》"],"q":"A. 《西厢记》","w":"normal","e":["核心考点"]},{"t":"《儒林外史》的作者是（ ）。","y":"单项选择题","p":["吴敬梓著《儒林外史》","我国古典讽刺小说杰作"],"q":"C. 吴敬梓","w":"normal","e":["核心考点"]},{"t":"“三言二拍”中的“三言”作者是（ ）。","y":"单项选择题","p":["冯梦龙编“三言”","凌濛初著“二拍”"],"q":"D. 冯梦龙","w":"normal","e":["核心考点"]},{"t":"明代戏曲的鼎盛时期是明代下半叶，出现了以沈璟为代表的“吴江派”和以汤显祖为代表的“临川派”。","y":"判断题","p":["万历年间传奇鼎盛","临川派重情采，吴江派重格律"],"q":"正确。万历年间传奇创作达到高峰，汤显祖重情采的临川派与沈璟重格律的吴江派形成鲜明对立。","w":"high","e":["2024 真题"]},{"t":"《三国演义》是我国第一部文人独立创作的长篇世情小说。","y":"判断题","p":["三国演义为历史演义","金瓶梅为第一部文人独立创作世情小说"],"q":"错误。《三国演义》是历史演义小说；第一部文人独立创作的长篇世情小说是《金瓶梅》。","w":"normal","e":["核心考点"]},{"t":"汤显祖的“临川四梦”包括《牡丹亭》《紫钗记》《南柯记》和《邯郸记》。","y":"判断题","p":["临川四梦具体篇目","因梦境情节得名"],"q":"正确。四剧均以梦境为关键情节，故称“临川四梦”，又称“玉茗堂四梦”。","w":"normal","e":["核心考点"]}]}]},{"id":"culture-c14","t":"第十四章 各类艺术","w":"high","s":[{"id":"culture-c14-s01","t":"第一节 书法艺术","w":"high","n":12,"k":[{"t":"楷书四大家","y":"名词解释","p":["欧阳询、颜真卿、柳公权、赵孟頫","欧阳询《九成宫醴泉铭》为天下第一楷书","颜筋柳骨并称","赵体圆润清秀"],"q":"指唐代欧阳询、颜真卿、柳公权和元代赵孟頫。欧阳询楷书劲险刻厉，于平正中见险绝，代表作《九成宫醴泉铭》；颜真卿端庄雄伟，代表作《多宝塔碑》；柳公权骨力遒劲，与颜真卿并称“颜筋柳骨”；赵孟頫圆润清秀，世称“赵体”。","w":"high","e":["2024 真题","2020 真题"]},{"t":"颜筋柳骨","y":"名词解释","p":["颜真卿柳公权并称","颜体丰腴雄浑筋骨内含","柳体骨力遒劲结体严紧","代表唐代楷书最高成就"],"q":"颜筋柳骨是后人对唐代书法家颜真卿与柳公权书法风格的并称。颜真卿书法丰腴雄浑、筋骨内含，如《多宝塔碑》《颜勤礼碑》；柳公权书法骨力遒劲、结体严紧，如《玄秘塔碑》《神策军碑》。二人并称\"颜柳\"，代表了唐代楷书的最高成就。","w":"high","e":["2020 真题"]},{"t":"书法的\"永字八法\"","y":"名词解释","p":["以\"永\"字八种笔画为法","侧勒努趯策掠啄磔","楷书笔画写法要领"],"q":"永字八法是古代书法用笔的基本法则，因\"永\"字包含八种基本笔画而得名：侧（点）、勒（横）、努（竖）、趯（钩）、策（提）、掠（长撇）、啄（短撇）、磔（捺）。它系统概括了楷书笔画的写法要领，是学习书法的重要入门法则。","w":"normal","e":["核心考点"]},{"t":"简述中国书法五种主要书体的演变与特点","y":"简答题","p":["篆书圆转匀称","隶书变圆为方，古今分水岭","楷书法度严谨","行书流畅，兰亭序为天下第一行书","草书简省连绵"],"q":"①篆书：包括甲骨文、金文、小篆，线条圆转匀称，结构对称；②隶书：变圆为方，变曲为直，出现波磔，是古今文字分水岭；③楷书：形体方正，笔画平直，法度严谨，为通行标准字体；④行书：介于楷草之间，流畅便捷，王羲之《兰亭序》为天下第一行书；⑤草书：结构简省，笔画连绵，重在气势神韵。","w":"high","e":["2019 真题"]},{"t":"简述中国书法的字体演变","y":"简答题","p":["甲骨文金文","篆书李斯小篆","隶书隶变古今文字分界","楷书唐楷鼎盛","行书兰亭序","草书张旭怀素"],"q":"中国书法字体演变大致为：①甲骨文，商代刻于龟甲兽骨，为最早成体系文字；②金文，铸刻于青铜器，笔画圆浑；③篆书，秦统一后李斯整理小篆，字形长方、笔画匀圆；④隶书，汉代盛行，\"隶变\"使汉字由古文字转为今文字，字形扁方、蚕头燕尾；⑤楷书，魏晋成熟、唐代鼎盛，法度严谨；⑥行书，介于楷草之间，以王羲之《兰亭序》为最高典范；⑦草书","w":"high","e":["2019 真题"]},{"t":"简述中国书法字体的演变与代表书家","y":"简答题","p":["小篆：李斯","隶书：蚕头燕尾","王羲之书圣与兰亭序","初唐四家与颜筋柳骨","宋四家尚意","楷书四大家欧颜柳赵"],"q":"中国书法字体演变：甲骨文、金文之后，秦代小篆为官方正体，代表书家李斯；汉代隶书盛行，有“蚕头燕尾”之波磔；魏晋楷书、行书、草书成熟，钟繇为楷书之祖，王羲之被誉为书圣，代表作《兰亭序》为天下第一行书；唐代书法鼎盛，欧阳询、虞世南、褚遂良、薛稷为初唐四家，颜真卿创颜体，柳公权创柳体，有“颜筋柳骨”之称，张旭、怀素以狂草著称","w":"normal","e":["核心考点"]},{"t":"初唐书法家欧阳询的楷书代表作是《（  ）》，被誉为“天下第一楷书”。","y":"填空题","p":["欧阳询楷书劲险刻厉","《九成宫醴泉铭》为天下第一楷书"],"q":"九成宫醴泉铭","w":"high","e":["2024 真题","2020 真题"]},{"t":"东晋书法家王羲之的《（  ）》被誉为“天下第一行书”。","y":"填空题","p":["王羲之《兰亭序》为天下第一行书","唐太宗酷爱并随葬昭陵"],"q":"兰亭序","w":"high","e":["2018 真题"]},{"t":"被称为“书圣”的东晋书法家是（  ）。","y":"填空题","p":["王羲之被尊为书圣","代表作《兰亭序》"],"q":"王羲之","w":"high","e":["2017 真题"]},{"t":"下列书法作品中，属于颜真卿代表作的是（ ）。","y":"单项选择题","p":["颜真卿代表作《多宝塔碑》《颜勤礼碑》","《玄秘塔碑》为柳公权作品"],"q":"A. 《多宝塔碑》","w":"high","e":["2020 真题"]},{"t":"唐朝欧阳询的书法以楷书为最好，字体劲险刻厉，于平正中见险绝，其代表作为《九成宫醴泉铭》。","y":"判断题","p":["欧阳询楷书劲险刻厉","《九成宫醴泉铭》为代表作"],"q":"正确。欧阳询为初唐四家之一，楷书世称“欧体”，《九成宫醴泉铭》被誉为天下第一楷书。","w":"high","e":["2024 真题"]},{"t":"“颜筋柳骨”中的“柳”指的是唐代书法家柳公权。","y":"判断题","p":["颜真卿丰腴雄浑","柳公权骨力遒劲"],"q":"正确。“颜筋柳骨”指颜真卿笔画丰腴雄浑、柳公权骨力遒劲，二人并称“颜柳”。","w":"normal","e":["核心考点"]}]},{"id":"culture-c14-s02","t":"第二节 绘画艺术","w":"high","n":8,"k":[{"t":"《清明上河图》","y":"名词解释","p":["北宋张择端所作风俗长卷","描绘汴京清明时节市井繁华","分城郊、汴河、街市三段","现实主义风俗画杰作"],"q":"北宋画家张择端所作风俗长卷，绢本设色，现藏北京故宫博物院。全图描绘北宋都城汴京清明时节的市井繁华，展现了城郊、汴河、街市三部分场景，人物数以百计，是我国古代现实主义风俗画的杰作，具有极高的历史与艺术价值。","w":"high","e":["2022 真题","2017 真题"]},{"t":"文人画","y":"名词解释","p":["文人学士创作，苏轼首倡","重神韵意趣、轻形似","山水花鸟梅兰竹菊为题材","诗书画印四者结合"],"q":"文人画是中国传统绘画中由文人学士创作、以抒发主观情趣为旨归的画种，又称\"士人画\"，由苏轼首倡其说，经元四家、明董其昌发展成熟。其特点是重神韵意趣而轻形似工整，多以山水、花鸟、梅兰竹菊为题材，讲求诗、书、画、印四者结合，追求\"逸笔草草，不求形似\"的境界，体现了文人的人格理想与审美情趣。","w":"normal","e":["核心考点"]},{"t":"工笔与写意","y":"名词解释","p":["中国画两种基本技法","工笔工整细致、层层渲染","写意简练豪放、重在传神","分小写意与大写意"],"q":"工笔与写意是中国画两种基本的表现技法。工笔又称\"细笔\"，用笔工整细致、设色层层渲染、造型精微谨严，多用于人物、花鸟，如宋代院体画；写意又称\"粗笔\"，用笔简练豪放、以少胜多、重在传神，通过笔墨的浓淡干湿表现物象神韵，又分小写意与大写意。二者一工一放，代表了中国画两种不同的审美取向。","w":"normal","e":["核心考点"]},{"t":"简述中国画的主要特点","y":"简答题","p":["以线造型，讲究笔墨","重写意传神，气韵生动","留白与虚实相生","诗书画印四位一体","分人物、山水、花鸟三科"],"q":"①以线造型，讲究笔墨技法；②重写意传神，追求“气韵生动”，不拘泥于形似；③讲究章法与留白，虚实相生；④诗、书、画、印融为一体；⑤题材上分人物、山水、花鸟三大科；⑥使用绢、纸与毛笔、墨、颜料等特有工具材料。","w":"normal","e":["核心考点"]},{"t":"北宋画家张择端的风俗画长卷《（  ）》描绘了汴京的市井繁华。","y":"填空题","p":["张择端《清明上河图》","现藏北京故宫博物院"],"q":"清明上河图","w":"high","e":["2022 真题"]},{"t":"《清明上河图》的作者是（ ）。","y":"单项选择题","p":["北宋张择端所作","描绘汴京清明市井"],"q":"B. 张择端","w":"high","e":["2022 真题"]},{"t":"中国画讲究“气韵生动”，这一审美标准最早见于（ ）。","y":"单项选择题","p":["南齐谢赫提出“六法”","“气韵生动”为六法之首"],"q":"C. 谢赫《古画品录》","w":"normal","e":["核心考点"]},{"t":"中国画按题材可分为人物、山水、花鸟三大科。","y":"判断题","p":["人物画成熟最早","山水画魏晋兴起","花鸟画唐代独立成科"],"q":"正确。人物画成熟最早，山水画于魏晋兴起、宋元大盛，花鸟画至唐代独立成科。","w":"normal","e":["核心考点"]}]},{"id":"culture-c14-s03","t":"第三节 戏曲艺术","w":"high","n":10,"k":[{"t":"京剧四大名旦","y":"名词解释","p":["梅兰芳、尚小云、程砚秋、荀慧生","梅派圆润大方，代表作《贵妃醉酒》","程派幽咽婉转，代表作《锁麟囊》","代表京剧旦角艺术最高成就"],"q":"指梅兰芳、尚小云、程砚秋、荀慧生四位京剧旦角表演艺术家。梅兰芳创“梅派”，唱腔圆润大方，代表作《贵妃醉酒》；尚小云创“尚派”，刚健婀娜；程砚秋创“程派”，幽咽婉转，代表作《锁麟囊》；荀慧生创“荀派”，活泼俏丽。四人代表京剧旦角艺术的最高成就。","w":"high","e":["2024 真题","2018 真题"]},{"t":"京剧脸谱","y":"名词解释","p":["程式化面部化妆图案","红忠、黑直、白奸","色彩象征人物性格品质"],"q":"京剧演员面部化妆的程式化图案，通过不同色彩与纹样象征人物性格与品质。红脸表示忠勇正义，如关羽；黑脸表示刚直勇猛，如包拯、张飞；白脸表示奸诈多疑，如曹操；蓝脸、绿脸多表示草莽英雄；金银脸多用于神佛。","w":"normal","e":["核心考点"]},{"t":"生旦净丑","y":"名词解释","p":["京剧四大行当","生为男性正面角色","旦为女性角色","净为花脸，丑为喜剧角色"],"q":"生旦净丑是京剧（戏曲）的四大行当。生为男性正面角色，分老生、小生、武生等；旦为女性角色，分青衣、花旦、老旦、武旦等；净俗称\"花脸\"，多为性格豪迈或奸诈的男性，以脸谱化妆为特征，分正净、副净、武净；丑为喜剧角色，鼻梁涂白，分文丑、武丑。行当体制是中国戏曲程式化表演的核心。","w":"normal","e":["核心考点"]},{"t":"简述京剧的形成过程与艺术特征","y":"简答题","p":["四大徽班进京，徽汉合流","唱念做打四功，手眼身法步五法","生旦净丑四大行当","脸谱服饰程式化与虚拟性表演"],"q":"形成：清乾隆年间四大徽班进京，徽调与汉调合流，吸收昆曲、秦腔等艺术养分，至道光年间形成京剧，同治、光绪年间走向成熟。艺术特征：①唱、念、做、打四功并重；②手、眼、身、法、步五法俱全；③角色分生、旦、净、丑四大行当；④脸谱与服饰程式化；⑤虚拟性表演，一桌二椅可代万千场景。","w":"high","e":["2021 真题"]},{"t":"简述京剧的形成与行当、流派","y":"简答题","p":["徽班进京、融合多腔、西皮二黄","生旦净丑四大行当","唱念做打与手眼身法步","四大名旦梅程尚荀","老生流派"],"q":"京剧形成于清代道光年间，以徽班进京为基础，融合徽调、汉调、昆曲、秦腔等，形成以西皮、二黄为主要声腔的剧种，同治光绪年间趋于成熟，程长庚、余三胜、张二奎为老生三杰。行当分生、旦、净、丑四大类：生为男性角色，分老生、小生、武生；旦为女性角色，分青衣、花旦、武旦、老旦；净为花脸，重勾脸谱；丑为滑稽角色，分文丑、武丑。表演讲究","w":"normal","e":["核心考点"]},{"t":"试论中国传统戏曲的艺术特征","y":"论述题","p":["唱念做打综合一体","虚拟性以鞭代马以桨代船","程式性规范严格","写意性追求神似","生旦净丑行当化","流派纷呈世界三大体系"],"q":"中国传统戏曲的艺术特征主要有：①综合性，融唱、念、做、打于一体，综合文学、音乐、舞蹈、美术、武术；②虚拟性，舞台上不设实景，以鞭代马、以桨代船，通过演员表演虚拟出时空；③程式性，唱腔、念白、身段、脸谱、服装均有严格规范；④写意性，追求神似而非形似，重意境营造；⑤角色行当化，分生、旦、净、丑四大行当；⑥流派纷呈，京剧四大","w":"high","e":["2022 真题"]},{"t":"京剧四大行当是生、旦、净、（  ）。","y":"填空题","p":["生旦净丑四大行当","丑角鼻梁涂白，俗称小花脸"],"q":"丑","w":"normal","e":["核心考点"]},{"t":"京剧“四大名旦”中，以《贵妃醉酒》为代表作的是（ ）。","y":"单项选择题","p":["梅兰芳创梅派","代表作《贵妃醉酒》《霸王别姬》"],"q":"D. 梅兰芳","w":"high","e":["2024 真题"]},{"t":"京剧脸谱中，白脸通常象征（ ）。","y":"单项选择题","p":["白脸象征奸诈，如曹操","红脸忠勇，黑脸刚直"],"q":"A. 奸诈多疑","w":"normal","e":["核心考点"]},{"t":"京剧形成于明代中叶，由昆曲与秦腔融合而成。","y":"判断题","p":["京剧形成于清代道光年间","徽汉合流为形成基础"],"q":"错误。京剧形成于清代道光年间，由徽调与汉调合流，并吸收昆曲、秦腔等养分而成。","w":"normal","e":["核心考点"]}]}]},{"id":"culture-c15","t":"第十五章 精美器物","w":"high","s":[{"id":"culture-c15-s01","t":"第一节 青铜器","w":"high","n":8,"k":[{"t":"青铜器","y":"名词解释","p":["铜锡铅合金","夏代始，商周鼎盛","礼器乐器兵器生活用器","饕餮纹、司母戊鼎、四羊方尊"],"q":"青铜是铜与锡、铅的合金。我国青铜器始于夏代，商周达到鼎盛，主要用于礼器、乐器、兵器与生活用具。商周青铜器造型厚重、纹饰繁缛，常见饕餮纹、夔龙纹，代表器物有司母戊鼎、四羊方尊，是研究上古礼制与工艺的重要实物。","w":"high","e":["2019 真题","2015 真题"]},{"t":"青铜礼器","y":"名词解释","p":["商周祭祀宴飨礼仪用器","藏礼于器的宗法等级体现","鼎簋尊卣爵觚等","列鼎制度天子九鼎"],"q":"青铜礼器是商周时期用于祭祀、宴飨、朝聘等重要礼仪活动的青铜器，是\"藏礼于器\"的宗法等级制度的物化体现。主要种类有鼎、簋、尊、卣、爵、觚等，其中鼎为最重要的礼器，用以\"明尊卑、别上下\"，天子九鼎、诸侯七鼎、大夫五鼎，形成严格的列鼎制度。","w":"high","e":["2017 真题"]},{"t":"司母戊鼎","y":"名词解释","p":["商代后期青铜方鼎","1939年安阳武官村出土","重832.84公斤最重青铜器","现藏中国国家博物馆"],"q":"司母戊鼎（又称后母戊鼎）是商代后期铸造的青铜方鼎，1939年出土于河南安阳武官村。鼎高133厘米、口长110厘米、重832.84公斤，是迄今出土最重的中国古代青铜器。鼎腹内壁铸有\"司母戊\"三字铭文，为商王祖庚或祖甲为祭祀其母戊所铸，现藏中国国家博物馆。","w":"high","e":["2019 真题"]},{"t":"鼎","y":"名词解释","p":["青铜礼器，源于陶鼎","圆腹三足两耳，亦有方鼎","权力等级象征，问鼎喻图谋王位","列鼎制度天子九鼎"],"q":"鼎是中国古代最重要的青铜礼器，由新石器时代的陶鼎演变而来，形状多为圆腹、三足、两耳，亦有方鼎四足。鼎本为炊器，后成为祭祀与宴飨的礼器，是权力与等级的象征，\"问鼎\"即喻图谋王位。相传夏禹铸九鼎象征九州，为传国之宝。西周列鼎制度规定天子九鼎、诸侯七鼎、大夫五鼎，等级森严。","w":"normal","e":["核心考点"]},{"t":"简述中国古代青铜器的发展与礼器制度","y":"简答题","p":["商周鼎盛、战国后衰落","器类：食器酒器水器乐器","列鼎制度与等级秩序","钟鸣鼎食","金文为重要史料","饕餮夔龙云雷纹"],"q":"青铜器发展：夏代开始出现，商周为鼎盛期，商代晚期与西周早期为高峰，战国后因铁器与礼制衰落而转向实用。器类有食器（鼎、簋、鬲）、酒器（爵、觚、尊、卣）、水器（盘、匜）、乐器（钟、镈）、兵器与工具。礼器制度：鼎为核心礼器，用于祭祀与宴飨，列鼎制度规定天子九鼎、诸侯七鼎、大夫五鼎、士三鼎，体现等级秩序，故有“钟鸣鼎食”之说。","w":"normal","e":["核心考点"]},{"t":"商代晚期铸造的（  ）是目前我国出土最重的青铜器。","y":"填空题","p":["司母戊鼎重832.84公斤","现藏中国国家博物馆"],"q":"司母戊鼎","w":"high","e":["2019 真题"]},{"t":"我国目前出土最重的青铜器是（ ）。","y":"单项选择题","p":["司母戊鼎重832.84公斤","商代晚期铸造"],"q":"D. 司母戊鼎","w":"normal","e":["核心考点"]},{"t":"青铜器是铜与铁的合金。","y":"判断题","p":["青铜为铜锡铅合金","因色青灰得名"],"q":"错误。青铜是铜与锡、铅的合金，因颜色青灰而得名，与铁无关。","w":"normal","e":["核心考点"]}]},{"id":"culture-c15-s02","t":"第二节 陶瓷","w":"high","n":13,"k":[{"t":"五大名窑","y":"名词解释","p":["汝、官、哥、钧、定","汝窑天青釉为诸窑之冠","钧窑窑变万彩","定窑白瓷印花刻花"],"q":"宋代最著名的五个瓷窑：汝窑、官窑、哥窑、钧窑、定窑。汝窑以天青釉著称，为宋代五大名窑之首；官窑釉色粉青，紫口铁足；哥窑有金丝铁线开片；钧窑釉色窑变，“入窑一色，出窑万彩”；定窑以白瓷印花刻花见长。","w":"high","e":["2023 真题","2018 真题"]},{"t":"唐三彩","y":"名词解释","p":["唐代低温铅釉陶器","以黄绿白三色为主","多为随葬明器","造型有马、骆驼、人物"],"q":"唐代盛行的一种低温铅釉陶器，以黄、绿、白（或褐）三色为主，故称唐三彩。多用作随葬明器，造型有马、骆驼、人物、器皿等，釉色淋漓交融，富有浓郁的盛唐气象，代表唐代陶瓷工艺的高度成就。","w":"high","e":["2021 真题"]},{"t":"青花瓷","y":"名词解释","p":["元代景德镇创烧的釉下彩","钴料绘画，高温一次烧成","元青花用苏麻离青，发色浓艳","外销主要品种，影响世界"],"q":"青花瓷是元代景德镇创烧的釉下彩瓷器，以钴料在素胎上绘画，再罩透明釉经高温一次烧成，呈现白地蓝花的效果。元代青花使用进口\"苏麻离青\"钴料，发色浓艳、有铁锈斑，器形硕大；明清青花以永乐、宣德、成化、康熙为高峰。青花瓷是中国瓷器外销的主要品种，深刻影响了伊斯兰世界与欧洲的陶瓷艺术。","w":"normal","e":["核心考点"]},{"t":"简述中国古代瓷器发展的主要阶段与代表成就","y":"简答题","p":["东汉成熟青瓷","唐代南青北白","宋代五大名窑","元代景德镇青花","明清彩瓷兴盛"],"q":"①商周原始青瓷出现；②东汉成熟青瓷烧制成功；③唐代“南青北白”，越窑青瓷与邢窑白瓷并称；④宋代五大名窑各擅胜场，瓷业达到高峰；⑤元代景德镇青花瓷成熟，成为瓷都；⑥明代斗彩、五彩兴盛；⑦清代粉彩、珐琅彩工艺精湛。","w":"high","e":["2017 真题"]},{"t":"简述中国古代瓷器的发展脉络","y":"简答题","p":["商代原始青瓷","东汉成熟青瓷","唐代南青北白","宋代五大名窑","元代青花瓷","明清斗彩粉彩"],"q":"中国古代瓷器发展脉络：①商代出现原始青瓷；②东汉晚期成熟青瓷烧成，瓷器正式诞生；③唐代形成\"南青北白\"格局，越窑青瓷与邢窑白瓷并称，并有唐三彩；④宋代五大名窑鼎盛，瓷器艺术达到巅峰；⑤元代景德镇烧成青花瓷，成为中国瓷器主流；⑥明代斗彩、五彩发展，成化斗彩鸡缸杯闻名；⑦清代粉彩、珐琅彩集大成，工艺臻于极致。","w":"high","e":["2018 真题"]},{"t":"简述中国古代陶瓷发展的重要阶段","y":"简答题","p":["新石器彩陶黑陶","唐代南青北白与唐三彩","宋代五大名窑","元代青花与釉里红","明代斗彩五彩","清代粉彩珐琅彩"],"q":"中国陶瓷发展：新石器时代有彩陶与黑陶，仰韶文化彩陶、龙山文化蛋壳黑陶为代表。商周有原始青瓷。东汉烧制出成熟青瓷。唐代形成南青北白格局，越窑青瓷与邢窑白瓷并称，唐三彩为陶器瑰宝。宋代五大名窑为汝、官、哥、钧、定，汝窑天青、钧窑窑变、定窑白瓷印花各具特色，另有耀州窑、龙泉窑、景德镇窑。元代景德镇烧成青花瓷与釉里红，青花成为","w":"normal","e":["核心考点"]},{"t":"唐代陶瓷业形成“南青北白”格局，南方以越窑（  ）瓷为代表，北方以邢窑白瓷为代表。","y":"填空题","p":["越窑青瓷与邢窑白瓷并称南青北白"],"q":"青","w":"high","e":["2021 真题"]},{"t":"宋代五大名窑中，以“入窑一色，出窑万彩”的窑变釉著称的是（  ）。","y":"填空题","p":["钧窑窑变釉色绚丽","入窑一色出窑万彩"],"q":"钧窑","w":"high","e":["2023 真题"]},{"t":"元代以后成为全国制瓷中心、被誉为“瓷都”的是江西（  ）。","y":"填空题","p":["景德镇元代青花成熟","明清成为全国制瓷中心"],"q":"景德镇","w":"normal","e":["核心考点"]},{"t":"宋代五大名窑中，被列为诸窑之冠的是（ ）。","y":"单项选择题","p":["汝窑天青釉为五大名窑之首","传世汝窑器不足百件"],"q":"B. 汝窑","w":"high","e":["2023 真题"]},{"t":"唐代邢窑与越窑分别以生产（ ）著称。","y":"单项选择题","p":["邢窑白瓷、越窑青瓷","形成南青北白格局"],"q":"C. 白瓷与青瓷","w":"high","e":["2021 真题"]},{"t":"唐代邢窑白瓷和越窑青瓷分别代表了北方瓷业和南方瓷业的最高水平。","y":"判断题","p":["南青北白","邢窑白瓷代表北方","越窑青瓷代表南方"],"q":"正确。唐代形成“南青北白”格局，越窑青瓷与邢窑白瓷分别代表南北瓷业最高水平。","w":"high","e":["2015 真题"]},{"t":"宋代五大名窑是指汝、官、哥、钧、定五个瓷窑。","y":"判断题","p":["五大名窑具体所指","汝窑为诸窑之冠"],"q":"正确。五大名窑为汝窑、官窑、哥窑、钧窑、定窑，各以独特釉色与工艺著称。","w":"high","e":["2023 真题"]}]},{"id":"culture-c15-s03","t":"第三节 玉器与工艺","w":"high","n":4,"k":[{"t":"景泰蓝","y":"名词解释","p":["铜胎掐丝珐琅","明代景泰年间兴盛得名","掐丝填釉烧制打磨镀金","北京传统工艺代表"],"q":"又称铜胎掐丝珐琅，明代景泰年间最为兴盛，故称景泰蓝。以铜为胎，用细铜丝掐成花纹轮廓，填入珐琅釉料，经烧制、打磨、镀金而成。色彩以蓝为主，富丽堂皇，是北京传统工艺美术的代表。","w":"high","e":["2020 真题"]},{"t":"文房四宝","y":"名词解释","p":["笔、墨、纸、砚","湖笔、徽墨、宣纸、端砚","产地各具代表性","承载书画艺术与文人审美"],"q":"文房四宝指中国传统书写工具笔、墨、纸、砚，是文人书房必备之物。其名品分别为：湖笔（浙江湖州）、徽墨（安徽歙县）、宣纸（安徽泾县）、端砚（广东肇庆）与歙砚（安徽歙县）。文房四宝不仅是实用工具，更承载了书法绘画艺术与文人审美，是中国传统文化的重要物质载体。","w":"normal","e":["核心考点"]},{"t":"简述中国古代玉器的文化内涵","y":"简答题","p":["祭祀天地的礼器","君子比德于玉的伦理象征","身份等级标志","辟邪护身的民俗信仰"],"q":"①玉被视为天地精华，用于祭祀天地山川；②玉象征德行，《礼记》有“君子比德于玉”，以玉的温润比喻仁、义、智、勇等美德；③玉器是身份等级的标志，圭、璧、琮、璜等形制各有用途；④玉有辟邪护身、延年益寿的民俗信仰；⑤玉雕工艺体现精湛技艺，如良渚玉琮、汉代金缕玉衣。","w":"normal","e":["核心考点"]},{"t":"景泰蓝又称（ ）。","y":"单项选择题","p":["景泰蓝即铜胎掐丝珐琅","明代景泰年间兴盛"],"q":"C. 铜胎掐丝珐琅","w":"normal","e":["核心考点"]}]}]},{"id":"culture-c16","t":"第十六章 风俗习惯","w":"high","s":[{"id":"culture-c16-s01","t":"第一节 岁时节日","w":"high","n":16,"k":[{"t":"春节","y":"名词解释","p":["农历正月初一，又称过年","源于上古岁首祭祀","贴春联、守岁、拜年、压岁钱","象征辞旧迎新、阖家团圆"],"q":"农历正月初一，是我国最隆重、最热闹的传统节日，又称过年。源于上古岁首祭祀，习俗有贴春联、放鞭炮、守岁、拜年、吃年夜饭、发压岁钱等，象征辞旧迎新、阖家团圆，是中华民族最重要的节日。","w":"high","e":["2016 真题"]},{"t":"清明节","y":"名词解释","p":["二十四节气与传统节日","扫墓祭祖与踏青郊游","融合寒食节禁火冷食习俗"],"q":"二十四节气之一，也是我国重要的传统节日。主要习俗为扫墓祭祖与踏青郊游，兼具缅怀先人与亲近自然的双重内涵。清明前一二日的寒食节有禁火冷食之俗，后与清明融合。","w":"high","e":["2019 真题"]},{"t":"端午节","y":"名词解释","p":["农历五月初五，又称端阳节","纪念屈原投汨罗江","赛龙舟、吃粽子、挂艾草"],"q":"农历五月初五，又称端阳节。相传为纪念投汨罗江的爱国诗人屈原，习俗有赛龙舟、吃粽子、挂艾草菖蒲、饮雄黄酒、佩香囊等，具有驱邪避疫与纪念先贤的双重意义。","w":"high","e":["2021 真题"]},{"t":"中秋节","y":"名词解释","p":["农历八月十五，居秋季之中","赏月、吃月饼、家人团聚","源于古代秋分祭月","嫦娥奔月神话"],"q":"农历八月十五，因居秋季之中而得名，又称团圆节。习俗有赏月、吃月饼、家人团聚，源于古代秋分祭月，嫦娥奔月、吴刚伐桂等神话为其增添浪漫色彩，是仅次于春节的重要传统节日。","w":"high","e":["2018 真题"]},{"t":"二十四节气","y":"名词解释","p":["按太阳黄道位置划分","始于立春终于大寒","指导农业生产","2016年列入人类非遗代表作名录"],"q":"我国古代根据太阳在黄道上的位置划分的二十四时节，始于立春，终于大寒，包括立春、雨水、惊蛰、春分、清明、谷雨等。它反映季节变化与农事节律，指导农业生产，2016 年被列入联合国教科文组织人类非物质文化遗产代表作名录。","w":"high","e":["2020 真题"]},{"t":"简述中国传统节日的文化内涵","y":"简答题","p":["顺应自然节律与农事","重视家族伦理与团圆","祈福禳灾的民俗心理","承载历史记忆与民族精神"],"q":"①顺应自然节律，二十四节气与传统节日多与农事、季节相关；②重视家族伦理，春节团圆、清明祭祖、中秋赏月均体现血缘亲情；③寄托祈福禳灾愿望，如端午驱邪、重阳登高避灾；④承载历史记忆与民族精神，如端午纪念屈原、寒食纪念介子推；⑤饮食与游艺文化丰富，形成独特的节日民俗体系。","w":"normal","e":["核心考点"]},{"t":"端午节相传是为纪念战国时期投汨罗江的爱国诗人（  ）。","y":"填空题","p":["屈原投汨罗江","端午节赛龙舟吃粽子"],"q":"屈原","w":"high","e":["2021 真题"]},{"t":"我国最隆重、最热闹的传统节日是农历正月初一的（  ）。","y":"填空题","p":["春节又称过年","我国最重要的传统节日"],"q":"春节","w":"normal","e":["核心考点"]},{"t":"农历八月十五的中秋节又称（  ）节。","y":"填空题","p":["中秋节又称团圆节","赏月吃月饼家人团聚"],"q":"团圆","w":"normal","e":["核心考点"]},{"t":"二十四节气中，标志着夏季开始的是（  ）。","y":"填空题","p":["四立为立春立夏立秋立冬","分别标志四季开始"],"q":"立夏","w":"normal","e":["核心考点"]},{"t":"下列传统节日中，以扫墓祭祖为主要习俗的是（ ）。","y":"单项选择题","p":["清明扫墓祭祖踏青","端午纪念屈原，中秋赏月"],"q":"D. 清明节","w":"high","e":["2019 真题"]},{"t":"中秋节吃月饼的习俗主要象征（ ）。","y":"单项选择题","p":["月饼形圆象征团圆","中秋节又称团圆节"],"q":"A. 团圆","w":"normal","e":["核心考点"]},{"t":"二十四节气中，表示昼夜平分的是（ ）。","y":"单项选择题","p":["春分秋分昼夜平分","夏至冬至为昼夜最长最短"],"q":"A. 春分","w":"normal","e":["核心考点"]},{"t":"清明节既是二十四节气之一，又是我国重要的传统节日。","y":"判断题","p":["清明为二十四节气之一","融合寒食节而成节日"],"q":"正确。清明为二十四节气之一，同时融合寒食节习俗，成为扫墓祭祖、踏青郊游的传统节日。","w":"high","e":["2019 真题"]},{"t":"重阳节有登高、赏菊、插茱萸的习俗，日期为农历九月初九。","y":"判断题","p":["农历九月初九","登高赏菊插茱萸"],"q":"正确。九为阳数，两九相重故称重阳，习俗有登高、赏菊、插茱萸、饮菊花酒。","w":"normal","e":["核心考点"]},{"t":"元宵节的主要习俗是吃粽子、赛龙舟。","y":"判断题","p":["元宵节赏灯猜谜吃元宵","端午才吃粽子赛龙舟"],"q":"错误。吃粽子、赛龙舟是端午节习俗；元宵节的主要习俗是赏灯、猜灯谜、吃元宵。","w":"normal","e":["核心考点"]}]},{"id":"culture-c16-s02","t":"第二节 人生礼仪与婚俗","w":"high","n":6,"k":[{"t":"冠礼与笄礼","y":"名词解释","p":["男子二十冠礼，女子十五笄礼","冠礼三加：缁布冠、皮弁、爵弁","取字，以成人之礼相待","标志成年，获得权利与义务"],"q":"冠礼与笄礼是古代男子的成年礼与女子的成年礼。男子二十岁行冠礼，于宗庙中由父亲主持，加缁布冠、皮弁、爵弁三次，取字并以成人之礼相待；女子十五岁行笄礼，结发加簪（笄），表示可以许嫁。二者均标志由少年进入成年，获得成人的权利与义务，是传统人生礼仪的重要环节。","w":"normal","e":["核心考点"]},{"t":"六礼","y":"名词解释","p":["《仪礼·士昏礼》所载六道程序","纳采、问名、纳吉、纳征、请期、亲迎","纳征送聘礼，亲迎为最后环节","确立传统婚姻礼仪规范"],"q":"六礼是中国古代婚姻缔结的六道程序，见于《仪礼·士昏礼》，即纳采、问名、纳吉、纳征、请期、亲迎。纳采用雁求婚；问名问女方姓名生辰；纳吉卜得吉兆后定婚；纳征送聘礼；请期商定婚期；亲迎新郎迎娶新娘。六礼确立了传统婚姻的礼仪规范，历代虽有简化，但基本框架沿用至近代。","w":"normal","e":["核心考点"]},{"t":"简述中国古代婚姻“六礼”的内容","y":"简答题","p":["纳采、问名、纳吉","纳征、请期、亲迎","确立于周代，为传统婚俗基本程式"],"q":"六礼是古代婚姻的六道程序：①纳采，男方请媒人提亲；②问名，询问女方姓名生辰；③纳吉，占卜得吉兆后定婚；④纳征，男方送聘礼；⑤请期，商定婚期；⑥亲迎，新郎迎娶新娘。六礼确立于周代，是传统婚俗的基本程式。","w":"high","e":["2017 真题"]},{"t":"简述中国古代婚姻制度的主要形态与礼俗","y":"简答题","p":["一夫一妻多妾与嫡庶之分","六礼：纳采问名纳吉纳征请期亲迎","同姓不婚与父母之命","婚姻目的在继嗣与合二姓之好"],"q":"古代婚姻形态：原始社会有群婚、对偶婚，后过渡到一夫一妻制。周代确立一夫一妻多妾制，嫡庶分明。婚姻礼俗为六礼：纳采（男家请媒提亲）、问名（问女方姓名生辰）、纳吉（占卜吉凶）、纳征（送聘礼订婚）、请期（议定婚期）、亲迎（新郎迎娶）。婚姻原则有同姓不婚、父母之命媒妁之言、门当户对。其他形态有入赘、童养媳、冥婚等。婚姻目的在于","w":"normal","e":["核心考点"]},{"t":"古代婚姻六礼中，男方送聘礼的一道程序称为（  ）。","y":"填空题","p":["六礼：纳采、问名、纳吉、纳征、请期、亲迎","纳征即送聘礼"],"q":"纳征","w":"high","e":["2017 真题"]},{"t":"古代婚姻“六礼”中，最后一道程序是（ ）。","y":"单项选择题","p":["六礼以亲迎告终","新郎亲往迎娶新娘"],"q":"B. 亲迎","w":"high","e":["2017 真题"]}]},{"id":"culture-c16-s03","t":"第三节 生肖与饮食","w":"normal","n":2,"k":[{"t":"十二生肖","y":"名词解释","p":["十二种动物与十二地支相配","起源先秦，完整见于《论衡》","用于纪年纪时","中华文化圈特有民俗符号"],"q":"十二生肖是中国传统的以十二种动物纪年、纪时的民俗系统，即鼠、牛、虎、兔、龙、蛇、马、羊、猴、鸡、狗、猪，与十二地支相配。其起源可追溯至先秦，完整记载见于东汉王充《论衡》。生肖文化渗透于纪年、婚配、命理、艺术等民俗生活各个方面，是中华文化圈特有的民俗符号。","w":"normal","e":["核心考点"]},{"t":"八大菜系","y":"名词解释","p":["鲁川粤苏浙闽湘徽八系","鲁菜重火候高汤","川菜麻辣、粤菜清鲜","体现饮食文化地域多样性"],"q":"八大菜系是中国地方风味菜肴的八个代表性体系，即鲁菜、川菜、粤菜、苏菜、浙菜、闽菜、湘菜、徽菜。鲁菜为北方代表，讲究火候与高汤；川菜麻辣鲜香，善用三椒；粤菜清淡鲜美，重原汁原味；苏菜刀工精细、口味平和；浙菜清鲜脆嫩；闽菜善用海鲜与汤；湘菜香辣浓郁；徽菜重油重色、善烧炖。八大菜系体现了中国饮食文化的地域多样性。","w":"normal","e":["核心考点"]}]},{"id":"culture-c16-s04","t":"综合考点","w":"normal","n":1,"k":[{"t":"简述中国古代姓氏制度的主要特点","y":"简答题","p":["姓为母系血缘，氏为父系分支","秦汉以后姓氏合一","来源有国名封邑官职职业","魏晋重视门第谱牒"],"q":"①姓与氏有别：姓为母系血缘标志，氏为父系分支与封邑标志，秦汉以后姓氏合一；②姓氏来源多样：以国名、封邑、官职、职业、居地、祖先名字为姓；③讲究门第：魏晋南北朝形成士族门阀，重视谱牒；④避讳与改姓：因避帝王名讳、避祸而改姓；⑤字辈排行：同族按字辈命名以明世系。","w":"normal","e":["核心考点"]}]}]},{"id":"culture-c17","t":"第十七章 中外文化交流","w":"high","s":[{"id":"culture-c17-s01","t":"第一节 陆上与海上丝路","w":"high","n":11,"k":[{"t":"丝绸之路","y":"名词解释","p":["张骞出使西域后开辟","东起长安，西至地中海东岸","输出丝绸瓷器造纸术","输入葡萄苜蓿与佛教艺术"],"q":"西汉张骞出使西域后开辟的横贯欧亚的交通贸易通道。东起汉唐都城长安，经河西走廊、西域，越过葱岭，抵达中亚、西亚，直至地中海东岸转至罗马各地。中国输出丝绸、瓷器、造纸术，输入葡萄、苜蓿、胡桃及佛教、音乐等，是东西方经济文化交流的重要纽带。","w":"high","e":["2024 真题","2018 真题"]},{"t":"张骞通西域","y":"名词解释","p":["西汉两次出使西域","前139年首次出使大月氏","前119年再使乌孙","凿空西域，奠定丝绸之路"],"q":"张骞通西域是西汉时期两次出使西域的重大外交活动。建元二年（前139年）张骞奉汉武帝命出使大月氏，欲联合夹击匈奴，途中被匈奴扣留十余年，历尽艰险返回；元狩四年（前119年）再度出使乌孙。张骞的两次西行打通了中原与西域的交通，史称\"凿空\"，为丝绸之路的开辟奠定了基础。","w":"normal","e":["核心考点"]},{"t":"海上丝绸之路","y":"名词解释","p":["古代海上贸易与文化通道","形成秦汉，繁荣宋元","泉州、广州、宁波为始发港","输出丝绸瓷器，输入香料珠宝"],"q":"海上丝绸之路是古代中国与外国进行贸易往来和文化交流的海上通道，形成于秦汉，发展于三国隋唐，繁荣于宋元，明初达到顶峰，明中叶后因海禁而衰落。它以泉州、广州、宁波、扬州等为始发港，输出丝绸、瓷器、茶叶，输入香料、珠宝、药材。宋元时期泉州被誉为\"东方第一大港\"，海上丝路是陶瓷外销与宗教传播的重要通道。","w":"normal","e":["核心考点"]},{"t":"简述丝绸之路的历史作用","y":"简答题","p":["物产互通，丝绸西传","造纸术印刷术火药西传","佛教等宗教东传","艺术与使节往来"],"q":"①经济上：促进东西方物产互通，中国丝绸、瓷器、茶叶西传，西域葡萄、苜蓿、香料东来；②科技上：中国造纸术、印刷术、火药西传，推动世界文明进程；③宗教上：佛教经西域传入中国，祆教、摩尼教、伊斯兰教亦随之东来；④艺术上：音乐、舞蹈、绘画、雕塑相互影响；⑤政治上：加强中外使节往来与友好关系。","w":"high","e":["2024 真题"]},{"t":"简述中国古代中外文化交流的主要途径","y":"简答题","p":["陆上丝绸之路","海上丝绸之路","使节往来","宗教传播","商贸活动","战争与移民"],"q":"中国古代中外文化交流的主要途径：①丝绸之路，汉代张骞开辟，为陆上主要通道；②海上丝绸之路，自唐宋兴盛，广州、泉州、宁波为重要港口；③使节往来，如张骞出使西域、郑和下西洋；④宗教传播，如佛教东传、玄奘西行、鉴真东渡；⑤商贸活动，胡商云集长安、泉州；⑥战争与移民，如怛罗斯之战使造纸术西传。","w":"high","e":["2019 真题"]},{"t":"简述丝绸之路的形成及其文化交流意义","y":"简答题","p":["张骞通西域后开辟、长安为起点","输出丝绸瓷器造纸术","输入葡萄苜蓿香料良马","佛教等宗教经此传入","西域乐舞与石窟艺术","造纸术西传与阿拉伯科技东来"],"q":"丝绸之路是汉代张骞通西域后开辟的横贯欧亚的交通贸易通道，因主要输出丝绸得名。路线以长安为起点，经河西走廊、西域，越帕米尔高原，至中亚、西亚，抵达地中海东岸。文化交流意义：其一，物质交流上，中国输出丝绸、瓷器、茶叶、造纸术，输入葡萄、苜蓿、胡桃、香料、玻璃器、良马；其二，宗教传播上，佛教经此传入中国，祆教、摩尼教、景教、","w":"normal","e":["核心考点"]},{"t":"试论中国古代中外文化交流的历史意义","y":"论述题","p":["丰富中国文化内涵","四大发明西传推动欧洲变革","形成东亚汉字文化圈","和平交往的典范","为一带一路提供历史根基"],"q":"中国古代中外文化交流的历史意义：①丰富了中国文化内涵，佛教东传促成宋明理学，西域乐舞融入中原艺术，葡萄、苜蓿、胡椒等物产丰富了中国饮食；②推动了世界文明进程，四大发明西传对欧洲文艺复兴、地理大发现与资产阶级革命起了巨大推动作用，造纸术经怛罗斯之战传入阿拉伯再入欧洲；③促进了东亚文化圈的形成，汉字、儒学、律令制、佛教传入","w":"high","e":["2023 真题"]},{"t":"西汉时期出使西域、开辟丝绸之路的是（  ）。","y":"填空题","p":["张骞两次出使西域","凿空之旅开辟丝绸之路"],"q":"张骞","w":"high","e":["2018 真题"]},{"t":"丝绸之路的起点是（ ）。","y":"单项选择题","p":["丝绸之路东起汉唐都城长安","经河西走廊西行"],"q":"A. 长安","w":"high","e":["2024 真题"]},{"t":"下列人物中，为中日文化交流作出卓越贡献的是（ ）。","y":"单项选择题","p":["鉴真六次东渡日本","玄奘西行天竺"],"q":"B. 鉴真","w":"high","e":["2017 真题"]},{"t":"丝绸之路东起汉唐首都长安，向西经河西走廊，经过里海南沿、巴格达，抵达波罗的海东岸，转至罗马各地。","y":"判断题","p":["西至地中海东岸转罗马","波罗的海位置错误"],"q":"错误。丝绸之路西端抵达地中海东岸后转至罗马各地，而非波罗的海东岸，波罗的海位于欧洲北部。","w":"high","e":["2024 真题"]}]},{"id":"culture-c17-s02","t":"第二节 中外人物往来","w":"high","n":11,"k":[{"t":"郑和下西洋","y":"名词解释","p":["明永乐至宣德年间七次远航","最远到达非洲东海岸","途经30余国","比哥伦布早87年","宣德化柔远人的朝贡贸易"],"q":"郑和下西洋是明代永乐至宣德年间（1405—1433年）由宦官郑和率领的七次大规模远洋航行。船队最多达200余艘、2.7万余人，最远到达非洲东海岸与红海沿岸，途经30余国，比哥伦布远航早87年。它以\"宣德化、柔远人\"为宗旨，以朝贡贸易为主，促进了中国与亚非各国的友好往来，但未带来经济扩张。","w":"high","e":["2017 真题","2022 真题"]},{"t":"玄奘西行","y":"名词解释","p":["贞观年间西行天竺求法","历时十七年，带回佛经六百余部","主持译经一千三百余卷","口述《大唐西域记》"],"q":"唐代高僧玄奘于贞观年间西行天竺求法，历时十七年，行程五万里，带回佛经六百余部，并在长安主持译经，共译出七十五部一千三百余卷。口述《大唐西域记》，记载西域与印度地理风俗，是研究中亚南亚历史地理的重要文献。","w":"high","e":["2020 真题"]},{"t":"鉴真东渡","y":"名词解释","p":["唐代高僧六次东渡日本","双目失明仍矢志不渝","传授戒律建筑医药","主持修建唐招提寺"],"q":"唐代高僧鉴真应日本僧人邀请，六次东渡日本，前五次均告失败，双目失明，第六次终于抵达日本。他在日本传授戒律、建筑、雕塑、医药等技艺，主持修建唐招提寺，为中日文化交流作出卓越贡献。","w":"high","e":["2017 真题"]},{"t":"遣唐使","y":"名词解释","p":["日本学习唐朝的官方使团","630—894年共派十九次","阿倍仲麻吕、空海、吉备真备","全面输入唐制与文化"],"q":"遣唐使是日本为学习唐朝制度文化而派遣的官方使团。自贞观四年（630年）至乾宁元年（894年），日本共派遣唐使十九次，实际成行十余次，每次数百人，成员包括正副使、留学生、学问僧、医师、画师等。阿倍仲麻吕、吉备真备、空海、最澄等皆为杰出代表。遣唐使全面输入了唐朝的典章制度、文字、宗教、建筑与艺术，深刻塑造了日本文化。","w":"normal","e":["核心考点"]},{"t":"简述郑和下西洋的概况与历史意义","y":"简答题","p":["永乐至宣德年间七次远航","最远抵达非洲东海岸","促进亚非经济文化交流","早于欧洲航海家半个多世纪"],"q":"概况：明永乐至宣德年间，郑和率船队七次下西洋，历时二十八年，最远抵达非洲东海岸与红海沿岸，规模宏大，船队最多达二百余艘、两万余人。意义：①宣扬明朝国威，加强中外友好往来；②促进中国与亚非各国的经济文化交流；③积累丰富的航海经验与地理知识；④比欧洲航海家的远航早半个多世纪。","w":"high","e":["2016 真题"]},{"t":"简述郑和下西洋的经过与历史意义","y":"简答题","p":["1405—1433 七次远航","最远抵非洲东海岸","和平通好、朝贡贸易","促进亚非经济文化交流","留下瀛涯胜览等文献","终止后错失大航海机遇"],"q":"郑和下西洋是明成祖至宣宗年间（1405—1433）的七次远航，郑和率船队二百余艘、两万余人，从刘家港出发，经南海、印度洋，最远抵达非洲东海岸与红海沿岸，访问三十余国。意义：其一，它是世界航海史上的空前壮举，比哥伦布、达伽马早半个多世纪；其二，它以和平通好为主，宣扬国威、建立朝贡贸易，未占领殖民地，体现和平外交传统；其三","w":"normal","e":["核心考点"]},{"t":"唐代高僧（  ）六次东渡日本，主持修建唐招提寺。","y":"填空题","p":["鉴真六次东渡","主持修建唐招提寺"],"q":"鉴真","w":"high","e":["2017 真题"]},{"t":"明代（  ）七次下西洋，最远抵达非洲东海岸。","y":"填空题","p":["郑和七下西洋","最远抵达非洲东海岸"],"q":"郑和","w":"high","e":["2016 真题"]},{"t":"玄奘口述、由弟子辩机笔录的《（  ）》是研究中亚南亚史地的重要文献。","y":"填空题","p":["《大唐西域记》十二卷","研究中亚南亚历史地理重要文献"],"q":"大唐西域记","w":"high","e":["2020 真题"]},{"t":"郑和下西洋发生在（ ）。","y":"单项选择题","p":["郑和七下西洋","历时二十八年"],"q":"C. 明永乐至宣德年间","w":"normal","e":["核心考点"]},{"t":"鉴真东渡日本，传授戒律、建筑、医药等技艺，并主持修建唐招提寺。","y":"判断题","p":["六次东渡","传授戒律建筑医药","主持修建唐招提寺"],"q":"正确。鉴真六次东渡，双目失明仍矢志不渝，对日本佛教与文化艺术影响深远。","w":"high","e":["2017 真题"]}]},{"id":"culture-c17-s03","t":"第三节 西学东渐","w":"normal","n":1,"k":[{"t":"西学东渐","y":"名词解释","p":["明清至近代西方学术传入中国","利玛窦、汤若望等耶稣会士为媒介","徐光启与利玛窦译《几何原本》","推动传统学术转型与近代化"],"q":"西学东渐指明清之际及近代西方科学技术与思想文化逐渐传入中国的历史过程。明末以利玛窦、汤若望、南怀仁等耶稣会士为媒介，传入天文、历法、数学、地理、火器、水利等知识，徐光启与利玛窦合译《几何原本》；近代则以鸦片战争后西方学术的系统输入为标志。西学东渐推动了中国传统学术的转型与近代化进程。","w":"normal","e":["核心考点"]}]}]},{"id":"culture-c18","t":"第十八章 中国传统文化的基本特征与现代价值","w":"high","s":[{"id":"culture-c18-s01","t":"第一节 中国传统文化的基本特征","w":"high","n":13,"k":[{"t":"中国传统文化的基本特征","y":"名词解释","p":["统一性：大一统文化格局","连续性：文明未曾中断","包容性：融合外来与民族文化","多样性：地域与民族异彩纷呈","重伦理尚中庸：儒家伦理为核心"],"q":"中国传统文化在数千年发展中形成的基本特征主要有：①统一性，长期大一统格局使文化具有强大的凝聚力；②连续性，是世界上唯一未曾中断的古老文明；③包容性，能吸纳融合外来文化与少数民族文化；④多样性，地域文化与民族文化异彩纷呈；⑤重伦理、尚中庸，以儒家伦理为核心价值。","w":"high","e":["2018 真题"]},{"t":"中庸之道","y":"名词解释","p":["出自《论语·雍也》","不偏不倚、无过无不及","把握适度、反对极端、追求和谐"],"q":"中庸是儒家重要的伦理与哲学范畴，出自《论语·雍也》。\"中\"指不偏不倚、无过无不及；\"庸\"指平常、恒常。中庸之道主张处理事物要把握适度原则，反对极端，追求和谐，是中华民族重要的思维方式与处世准则。","w":"high","e":["2021 真题"]},{"t":"和而不同","y":"名词解释","p":["出自《论语·子路》","承认差异前提下的和谐","反对无原则苟同","多元共生包容精神"],"q":"出自《论语·子路》\"君子和而不同，小人同而不和\"。\"和\"指在承认差异的前提下求得和谐统一，\"同\"指无原则的苟同。和而不同体现了中国文化包容差异、多元共生的精神，是处理人际关系与文化交流的重要原则。","w":"high","e":["2022 真题"]},{"t":"天人合一","y":"名词解释","p":["中国传统哲学核心命题","源于《周易》老庄，张载正式提出","主张人与自然和谐统一","对生态文明建设有启示"],"q":"天人合一是中国传统哲学关于天人关系的核心命题，强调人与自然、天道与人道的统一和谐。其思想渊源可追溯至《周易》与老庄，庄子提出\"天地与我并生，万物与我为一\"，董仲舒发展为\"天人感应\"，宋代张载正式提出\"天人合一\"的命题。这一观念主张人应顺应自然规律、与自然和谐共生，对当代生态文明建设具有重要启示意义。","w":"normal","e":["核心考点"]},{"t":"简述中国传统文化的主要特征","y":"简答题","p":["统一性与连续性","包容性与多样性","伦理本位以儒为核心","崇尚中庸和谐与天人合一"],"q":"中国传统文化的主要特征包括：①统一性，大一统格局形成强大文化凝聚力；②连续性，文明五千年未曾中断；③包容性，儒释道并存并融合外来文化；④多样性，地域文化与多民族文化共生；⑤伦理本位，以家族伦理和儒家道德为核心；⑥崇尚中庸与和谐，追求天人合一。","w":"high","e":["2018 真题"]},{"t":"简述“和而不同”思想的来源与内涵","y":"简答题","p":["出自论语子路","史伯和实生物、晏婴和如羹焉","和：多样统一；同：简单叠加","承认差异、求同存异","文化包容与国际和平"],"q":"“和而不同”出自《论语·子路》：“君子和而不同，小人同而不和。”其思想渊源可追溯到西周末年史伯的“和实生物，同则不继”与晏婴的“和如羹焉”。“和”指不同事物相济相成、多样统一，如五味调和、八音和谐；“同”指单一事物的简单叠加与无原则附和。内涵上，它主张承认差异、包容多样，在差异中求协调、在对立中求统一；在人际关系上表现","w":"normal","e":["核心考点"]},{"t":"试论中国传统“天人合一”思想的内涵及其当代意义","y":"论述题","p":["内涵：天与人相通相类","内涵：人与自然为统一整体","内涵：顺应自然规律","内涵：以天道论证人道","意义：生态伦理与可持续发展","意义：人与自然生命共同体","局限：须扬弃天人感应的神秘成分"],"q":"“天人合一”是中国传统哲学的核心命题之一。内涵上：其一，天与人相通相类，孟子倡“尽心知性知天”，董仲舒提出天人感应、人副天数；其二，人与自然是统一的整体，庄子主张天地与我并生、万物与我为一；其三，人应顺应自然规律，老子讲道法自然，荀子虽主张“制天命而用之”，仍强调顺天时；其四，以天道论证人道，把伦理纲常视为天理，如宋儒","w":"normal","e":["核心考点"]},{"t":"中国传统文化的精神内核是孔子所创立的（  ）思想，同时又辅以道家思想和佛家思想。","y":"填空题","p":["精神内核为儒家思想","辅以道家与佛家"],"q":"儒家","w":"high","e":["2017 真题"]},{"t":"《论语·子路》中\"君子（  ），小人同而不和\"体现了中国文化包容差异的精神。","y":"填空题","p":["和而不同出自《论语·子路》"],"q":"和而不同","w":"high","e":["2022 真题"]},{"t":"\"天人合一\"思想在中国古代最早的哲学表达见于（ ）。","y":"单项选择题","p":["庄子提出天地与我并生、万物与我为一","董仲舒发展为天人感应","宋代张载正式提出天人合一命题"],"q":"C. 《庄子》","w":"normal","e":["核心考点"]},{"t":"下列不属于中国传统文化基本特征的是（ ）。","y":"单项选择题","p":["中国文化具有包容性而非排他性","儒释道三教并存即为明证","统一性连续性多样性均为其基本特征"],"q":"D. 排他性","w":"normal","e":["核心考点"]},{"t":"中国传统文化的基本特征包括统一性、连续性、包容性和多样性。","y":"判断题","p":["统一性连续性包容性多样性","另有伦理本位与中庸和谐"],"q":"正确。这四者是中国传统文化公认的基本特征，此外还有伦理本位、崇尚中庸和谐等特点。","w":"high","e":["2018 真题"]},{"t":"\"和而不同\"主张消除一切差异，追求完全一致。","y":"判断题","p":["和：差异中的和谐","同：无原则苟同"],"q":"错误。\"和而不同\"恰恰是在承认差异的前提下求得和谐统一，反对无原则的苟同（\"同而不和\"）。","w":"normal","e":["核心考点"]}]},{"id":"culture-c18-s02","t":"第二节 传统文化的现代价值","w":"high","n":8,"k":[{"t":"文化自信","y":"名词解释","p":["对自身文化价值的充分肯定","对文化生命力的坚定信念","源于优秀传统文化与先进文化"],"q":"文化自信是一个国家、一个民族对自身文化价值的充分肯定和对自身文化生命力的坚定信念。它源于中华优秀传统文化、革命文化和社会主义先进文化，是更基础、更广泛、更深厚的自信。","w":"normal","e":["核心考点"]},{"t":"横渠四句","y":"名词解释","p":["北宋张载（横渠）提出","为天地立心、为生民立命","为往圣继绝学、为万世开太平","儒家士人担当精神的经典表达"],"q":"横渠四句是北宋理学家张载（号横渠）在《横渠语录》中提出的名言：\"为天地立心，为生民立命，为往圣继绝学，为万世开太平。\"它概括了儒家士人的最高理想：以天地之心为心确立价值本体，为民众安身立命，继承弘扬圣贤绝学，开创万世太平。这四句话是中国传统知识分子担当精神的经典表达。","w":"normal","e":["核心考点"]},{"t":"简述中国传统文化现代价值的主要体现","y":"简答题","p":["天人合一：生态文明智慧","和而不同：国际关系与命运共同体","仁义礼智信：道德建设资源","自强不息厚德载物：民族精神动力"],"q":"中国传统文化的现代价值主要体现在：①\"天人合一\"为当代生态文明建设提供智慧；②\"和而不同\"为处理国际关系、构建人类命运共同体提供理念；③\"仁义礼智信\"等伦理资源有助于道德建设；④\"中庸\"\"和谐\"思想有助于协调社会关系；⑤自强不息、厚德载物的民族精神是民族复兴的精神动力。","w":"high","e":["2020 真题"]},{"t":"试论如何正确对待中国传统文化","y":"论述题","p":["批判继承取其精华去其糟粕","创造性转化与创新性发展","坚持马克思主义指导反对两种错误倾向","坚定文化自信推动文化走出去"],"q":"正确对待中国传统文化应坚持：①批判继承，取其精华、去其糟粕，区分民主性精华与封建性糟粕；②创造性转化、创新性发展，使传统文化与当代社会相适应、与现代文明相协调；③坚持马克思主义指导，坚守中华文化立场，反对历史虚无主义与全盘复古；④加强文化自信，推动中华优秀传统文化走向世界，增强国家文化软实力。","w":"high","e":["2023 真题","2019 真题"]},{"t":"试论中国传统文化与现代化的关系","y":"论述题","p":["传统文化是现代化的根基与资源","积极因素提供价值支撑","消极因素需改造","现代化推动传统文化创新发展"],"q":"二者是辩证统一的关系：①传统文化是现代化的根基与精神资源，现代化不能割断历史；②传统文化中重伦理、重和谐、重整体的思想可为现代化提供价值支撑；③传统文化中的等级观念、因循守旧等消极因素会阻碍现代化，必须加以改造；④现代化为传统文化注入新的时代内涵，推动其创造性转化与创新性发展，二者在互动中共同演进。","w":"normal","e":["核心考点"]},{"t":"北宋张载提出的\"为天地立心，为生民立命，为往圣继绝学，为（  ）\"被称为\"横渠四句\"。","y":"填空题","p":["横渠四句为张载名言","体现士人担当精神"],"q":"万世开太平","w":"normal","e":["核心考点"]},{"t":"提出\"为天地立心，为生民立命\"的北宋思想家是（ ）。","y":"单项选择题","p":["张载为关学创始人","横渠四句影响深远","著有《正蒙》"],"q":"A. 张载","w":"normal","e":["核心考点"]},{"t":"对待传统文化应当全盘继承，不应作任何批判。","y":"判断题","p":["批判继承取精华去糟粕","创造性转化创新性发展"],"q":"错误。应坚持批判继承、取其精华去其糟粕，并推动创造性转化与创新性发展，反对全盘复古与历史虚无主义两种错误倾向。","w":"normal","e":["核心考点"]}]}]}]},{"d":"yinlun","t":"对外汉语教育学引论","c":[{"id":"yinlun-c01","t":"第一章 对外汉语教育是一门专门的学科","w":"high","s":[{"id":"yinlun-c01-s01","t":"第一节 对外汉语教育的学科名称","w":"high","n":23,"k":[{"t":"第一语言","y":"名词解释","p":["人出生以后首先接触并获得的语言","第二语言指人们在获得第一语言以后再学习和使用的另一种语言。","这是按人们获得语言的先后顺序来区分的两个概念，也是语言教学理论中用得最多的术语。"],"q":"人出生以后首先接触并获得的语言","w":"high","e":["2013 真题","2019 真题"]},{"t":"第二语言","y":"名词解释","p":["指人们在获得第一语言以后再学习和使用的另一种语言","由于学习这些语言的规律与学习第二语言有很多共同之处，所以一般不再细分而统称第二语言。","广义的“第二语言”是指任何一种在第一语言获得以后学习和使用的语言，包括外语。"],"q":"指人们在获得第一语言以后再学习和使用的另一种语言","w":"high","e":["2019 真题"]},{"t":"母语","y":"名词解释","p":["母语是指本国、本民族的语言","这是按国家的界限来区分的。","外语是指外国的语言。一般情况下母语是人们的第一语言；但对一些移居国外的人来说，其子女出生后首先接触并获得的语言有可能是居住国的语言而不是母语。"],"q":"母语是指本国、本民族的语言","w":"normal","e":["核心考点"]},{"t":"本族语","y":"名词解释","p":["本族语就是本民族的语言，因此这一术语与“母语”可以通用","这是按言语社团、通常是民族的界限来区分的。非本族语是指本民族以外的语言，可能是外语，也可能是指本国其他民族的语言。"],"q":"本族语就是本民族的语言，因此这一术语与“母语”可以通用","w":"normal","e":["核心考点"]},{"t":"对外汉语教学","y":"名词解释","p":["《中国大百科全书·语言文字》中写道：“对外汉语教学是指对外国人的汉语教学。”","实际上也包括对第一语言不是汉语的海外华人进行的汉语教学。","这一名称基本上体现了这个学科的特点和内涵，在国外也产生了广泛的影响，而且简洁上口、符合汉语习惯，因此从1982年提出一直使用至今。","但是十多年的使用也发现这一名称有一定的局限性：它只突出了主要教学对象，未能全面、准确地反映学科性质——第二语言教学。"],"q":"《中国大百科全书·语言文字》中写道：“对外汉语教学是指对外国人的汉语教学。”","w":"high","e":["2015 真题","2021 真题"]},{"t":"汉语作为第二语言的教学","y":"名词解释","p":["从学术上较能精确地指称这一学科内涵和性质的，应当是“汉语作为第二语言教学”，即“Teaching of Chinese as a Second Language”（英文缩写为TCSL）。","这一名称既能指在中国进行的对外国人的汉语教学、即对外汉语教学，也能指世界各地的汉语教学，而且还能包括与之性质大体相同的对我国国内少数民族的汉语教学。","也就是说，它能涵盖第一语言以外的所有汉语教学，同时又能体现出它与其上位学科——整个第二语言教学学科的关系。"],"q":"从学术上较能精确地指称这一学科内涵和性质的，应当是“汉语作为第二语言教学”，即“Teaching of Chinese as a Second Language”（英文缩写为TCSL）。","w":"normal","e":["核心考点"]},{"t":"应用语言学","y":"名词解释","p":["这是使用得最早、最为普遍的名称。早在19世纪末就由波兰语言学家博杜恩·德·库尔特内（Baudouin de Courtenay）提出。","广义的应用语言学是跟理论语言学相对的概念，指把理论语言学的理论、规律、原则和方法应用到其他学科领域，从而产生的新的边缘学科。","狭义的应用语言学则专指语言学理论在语言教学中的应用，特别是指第二语言教学。","把应用语言学用作本学科的名称并不恰当，因为本学科的性质绝不仅仅是“应用”，它所应用的更不仅仅是“语言学”。"],"q":"这是使用得最早、最为普遍的名称。早在19世纪末就由波兰语言学家博杜恩·德·库尔特内（Baudouin de Courtenay）提出。","w":"high","e":["2017 真题"]},{"t":"教育语言学","y":"名词解释","p":["国外的语言教育专家对学科体系的研究非常重视。","美国学者斯波尔斯基（B. Spolsky）主张用“教育语言学”。","加拿大学者斯特恩（H. H. Stern）提出“第二语言教学理论的一般模式”；斯波尔斯基基于1980年提出“教育语言学理论模式”。","在斯波尔斯基的模式中，语言描写、语言学习理论和语言运用理论成为第二语言教学理论的主要来源。"],"q":"国外的语言教育专家对学科体系的研究非常重视。","w":"normal","e":["核心考点"]},{"t":"对外汉语教育学","y":"名词解释","p":["从教育的高度研究对外汉语教学，反映到本学科的名称上，本书主张应与其他学科教育学的名称相一致，即用“对外汉语教育学”比较规范。","这一名称还能更清楚地体现出本学科的性质及其科学定位。","当然，提出“对外汉语教育”并不意味着、实际上也不可能用它来取代已使用近20年之久、早已深入人心的“对外汉语教学”这一名称。"],"q":"从教育的高度研究对外汉语教学，反映到本学科的名称上，本书主张应与其他学科教育学的名称相一致，即用“对外汉语教育学”比较规范。","w":"normal","e":["核心考点"]},{"t":"语言教学中，按人们获得语言的先后顺序来区分的两个概念是____和____。","y":"填空题","p":["第一语言指人出生以后首先接触并获得的语言","第二语言指人们在获得第一语言以后再学习和使用的另一种语言"],"q":"第一语言；第二语言","w":"high","e":["2013 真题"]},{"t":"按国家的界限来区分，语言可分为____和____。","y":"填空题","p":["母语是指本国、本民族的语言","外语是指外国的语言"],"q":"母语；外语","w":"normal","e":["核心考点"]},{"t":"《中国大百科全书·语言文字》指出：“对外汉语教学是指____的汉语教学。”","y":"填空题","p":["对外汉语教学是指对外国人的汉语教学"],"q":"对外国人","w":"high","e":["2021 真题"]},{"t":"从学术上较能精确地指称本学科内涵和性质的名称是“汉语作为第二语言教学”，其英文缩写为____。","y":"填空题","p":["Teaching of Chinese as a Second Language，英文缩写为TCSL"],"q":"TCSL","w":"normal","e":["核心考点"]},{"t":"使用得最早、最为普遍的语言教育学科名称是____，它由波兰语言学家____在19世纪末提出。","y":"填空题","p":["早在19世纪末就由波兰语言学家博杜恩·德·库尔特内提出"],"q":"应用语言学；博杜恩·德·库尔特内","w":"high","e":["2017 真题"]},{"t":"第一语言和母语是完全等同的概念，第二语言一定就是外语。","y":"判断题","p":["第一语言和第二语言按习得时间先后区分","母语和外语按国家的界限区分","移居国外的人，其子女首先获得的语言可能是居住国语言而不是母语"],"q":"错误。不能把第一语言和母语这两个概念完全等同起来，同样的道理，第二语言也不一定就是外语。","w":"high","e":["2019 真题"]},{"t":"非本族语一定是外语。","y":"判断题","p":["非本族语可能指本国其他民族的语言","对我国蒙族来说，汉语是非本族语，是本国其他民族的语言，但绝不能称作外语"],"q":"错误。非本族语是指本民族以外的语言，可能是外语，也可能是指本国其他民族的语言。","w":"normal","e":["核心考点"]},{"t":"“对外汉语教学”这一名称的局限性在于它只突出了主要教学对象，未能全面、准确地反映学科性质——第二语言教学。","y":"判断题","p":["该名称简洁上口、符合汉语习惯，从1982年提出一直使用至今","但未能全面准确地反映学科性质"],"q":"正确。“对外汉语教学”只突出了主要教学对象，未能全面、准确地反映学科性质——第二语言教学。","w":"high","e":["2021 真题"]},{"t":"狭义的应用语言学专指语言学理论在语言教学中的应用，特别是指第二语言教学。","y":"判断题","p":["广义的应用语言学指把理论语言学的理论、规律、原则和方法应用到其他学科领域","狭义的应用语言学专指语言学理论在语言教学中的应用"],"q":"正确。狭义的应用语言学则专指语言学理论在语言教学中的应用，特别是指第二语言教学。","w":"normal","e":["核心考点"]},{"t":"下列学科名称中，使用得最早、最为普遍的是（　）。","y":"单项选择题","p":["应用语言学是使用得最早、最为普遍的名称"],"q":"A","w":"normal","e":["核心考点"]},{"t":"对外汉语教学这个名称正式提出的时间是（　）。","y":"单项选择题","p":["从1982年提出一直使用至今"],"q":"A","w":"high","e":["2021 真题"]},{"t":"认为“外语教育学不是语言科学，更不是应用语言学”的学者是（　）。","y":"单项选择题","p":["章兼中先生认为：“外语教育学不是语言科学，更不是应用语言学。”"],"q":"B","w":"normal","e":["核心考点"]},{"t":"简述对外汉语教学界围绕学科名称的讨论，并说明实际使用中的三个学科名称及其关系。","y":"简答题","p":["对外汉语教学指对外国人的汉语教学","汉语教学是国际场合的简化名称","汉语作为第二语言教学（TCSL）学术上最精确","三者的关系是包含与被包含"],"q":"①“对外汉语教学”：指对外国人的汉语教学，也包括对第一语言不是汉语的海外华人进行的汉语教学；基本上体现了学科特点，但只突出了主要教学对象，未能全面准确地反映学科性质。②“汉语教学”：为适应国际场合而简化的名称，可专指汉语作为第二语言的教学。③“汉语作为第二语言教学”（TCSL）：学术上较能精确指称学科内涵和性质，能涵盖","w":"high","e":["2015 真题"]},{"t":"简述第一语言与第二语言、母语与外语、本族语与非本族语三组概念的区分标准及相互关系。","y":"简答题","p":["第一语言和第二语言按习得先后顺序区分","母语和外语按国家界限区分","本族语和非本族语按民族界限区分","三组概念不能简单等同"],"q":"①第一语言和第二语言：按人们获得语言的先后顺序区分。第一语言指人出生以后首先接触并获得的语言；第二语言指人们在获得第一语言以后再学习和使用的另一种语言。②母语和外语：按国家的界限区分。母语是指本国、本民族的语言；外语是指外国的语言。一般情况下母语是人们的第一语言，但不能把第一语言和母语完全等同起来。③本族语和非本族语：","w":"high","e":["2019 真题"]}]},{"id":"yinlun-c01-s02","t":"第二节 对外汉语教育的学科任务和学科体系","w":"high","n":17,"k":[{"t":"对外汉语教育学科的任务","y":"名词解释","p":["对外汉语教育学科的任务是研究汉语作为第二语言的教育原理、教育过程和教育方法，并用来指导教育实践，从而更好地实现学习者德智体美全面发展的教育目的。","对外汉语教育学科研究的核心内容是对外汉语教学。","对外汉语教育作为一门分支学科，它还有一项任务，即以自身的学科理论建设，为第二语言教育学科甚至整个语言教育学科的理论发展做出贡献。"],"q":"对外汉语教育学科的任务是研究汉语作为第二语言的教育原理、教育过程和教育方法，并用来指导教育实践，从而更好地实现学习者德智体美全面发展的教育目的。","w":"high","e":["2016 真题"]},{"t":"学科体系","y":"名词解释","p":["学科体系是一门学科的结构系统，它显示构成该学科的内部和外部因素以及这些因素之间的关系，其核心部分是学科的理论体系。","学科体系既体现了学科的内容及学科的性质特征，同时又能为学科的理论研究和整个学科建设指明方向。"],"q":"学科体系是一门学科的结构系统，它显示构成该学科的内部和外部因素以及这些因素之间的关系，其核心部分是学科的理论体系。","w":"high","e":["2018 真题"]},{"t":"对外汉语语言学","y":"名词解释","p":["对外汉语语言学是作为第二语言来教学和研究的汉语语言学，包括语音、词汇、语法、汉字、语义、语用、话语、功能和文化因素等方面。","对对外汉语语言学的研究是对对外汉语教学内容的研究；从教育学的角度来分析，也是对对外汉语教学的客体的研究。","语言学和汉语语言学（一般指作为母语研究的汉语语言学）是对外汉语教学的理论基础，对本学科研究汉语起指导的作用，但它不能代替本学科对汉语的研究。","本学科需要从第二语言学习和教学这一新的角度来描写汉语、研究汉语。"],"q":"对外汉语语言学是作为第二语言来教学和研究的汉语语言学，包括语音、词汇、语法、汉字、语义、语用、话语、功能和文化因素等方面。","w":"high","e":["2020 真题"]},{"t":"汉语习得理论","y":"名词解释","p":["汉语习得理论是对对外汉语教学的主体——学习者的研究，即侧重从心理学的角度研究教学对象的学习过程和学习规律。","随着认知心理学和教育心理学的发展和语言习得研究本身的进展，人们逐渐认识到“教”的成功与否决定性的因素还在“学”的方面，对“学”的研究是对“教”的研究的基础和前提。"],"q":"汉语习得理论是对对外汉语教学的主体——学习者的研究，即侧重从心理学的角度研究教学对象的学习过程和学习规律。","w":"high","e":["2019 真题"]},{"t":"对外汉语教学理论","y":"名词解释","p":["对外汉语教学理论是把上述两个方面——对教学内容和对教学对象的研究结合起来，即研究如何通过教学活动使教学内容为学习者迅速、有效掌握的规律和原理。","教学理论有时也称为教学论或教学原理（甚至称为教学法），这是本学科研究的传统领域。","我们亟须把教学论的教学目的、教学原则、教学过程、课程设置、教学方法、教学手段和教学评估等一般理论与对外汉语教学的规律紧密结合起来，形成有自己特色的对外汉语教学理论。"],"q":"对外汉语教学理论是把上述两个方面——对教学内容和对教学对象的研究结合起来，即研究如何通过教学活动使教学内容为学习者迅速、有效掌握的规律和原理。","w":"high","e":["2021 真题"]},{"t":"学科研究方法学","y":"名词解释","p":["本体系中所说的学科研究方法学，是指受哲学方法论普遍规律的指导，用来探讨对本学科最具针对性的方法论原则，并着重研究适用于本学科的一般方法，特别是本学科特有的方法。","学科研究方法学也是本学科理论体系的一个重要组成部分，研究方法在很大程度上决定研究的成果，甚至影响到研究的成功与失败。"],"q":"本体系中所说的学科研究方法学，是指受哲学方法论普遍规律的指导，用来探讨对本学科最具针对性的方法论原则，并着重研究适用于本学科的一般方法，特别是本学科特有的方法。","w":"normal","e":["核心考点"]},{"t":"应用研究","y":"名词解释","p":["应用研究指运用相关学科和本学科的基础理论，对总体设计、教材编写、课堂教学、测试评估、教学管理和师资培养等方面进行专门的研究。","用学科的基础理论来指导教学实践，需要经过学科应用研究这个中介环节。","应用研究与教学实践最为接近，可以直接用来指导相关的教学活动。","本学科的理论体系除基础理论外，还有应用研究。"],"q":"应用研究指运用相关学科和本学科的基础理论，对总体设计、教材编写、课堂教学、测试评估、教学管理和师资培养等方面进行专门的研究。","w":"normal","e":["核心考点"]},{"t":"对外汉语教育学科研究的核心内容是____。","y":"填空题","p":["对外汉语教育学科研究的核心内容是对外汉语教学"],"q":"对外汉语教学","w":"high","e":["2016 真题"]},{"t":"对外汉语教育学科体系分成三个部分：____、____和____。","y":"填空题","p":["这一模式把学科体系分成三个部分：理论基础、学科理论和教学实践"],"q":"理论基础；学科理论；教学实践","w":"high","e":["2018 真题"]},{"t":"本学科的基础理论包括四个方面：对外汉语语言学、____、汉语习得理论和____。","y":"填空题","p":["本学科的基础理论包括四个方面：对外汉语语言学、对外汉语教学理论、汉语习得理论和学科研究方法学"],"q":"对外汉语教学理论；学科研究方法学","w":"high","e":["2021 真题"]},{"t":"作为本学科理论基础的七个主要学科是语言学、心理学、教育学、文化学、社会学、横断学科及____。","y":"填空题","p":["七个主要学科：语言学、心理学、教育学、文化学、社会学、横断学科及哲学"],"q":"哲学","w":"high","e":["2017 真题"]},{"t":"对外汉语教育作为一门分支学科，其任务只是研究教学，不包括学科理论建设。","y":"判断题","p":["任务是研究汉语作为第二语言的教育原理、教育过程和教育方法","另一项任务是进行学科理论建设"],"q":"错误。对外汉语教育作为一门分支学科，还有一项任务，即以自身的学科理论建设，为第二语言教育学科甚至整个语言教育学科的理论发展做出贡献。","w":"normal","e":["核心考点"]},{"t":"在学科理论研究的四个方面中，对外汉语语言学的研究居于核心地位。","y":"判断题","p":["对外汉语语言学、汉语习得理论、方法学都是为语言教学服务的","教学理论的研究居于学科理论研究的核心地位"],"q":"错误。在以上所列学科基础理论的四个方面中，教学理论的研究居于学科理论研究的核心地位。","w":"high","e":["2021 真题"]},{"t":"第一次在对外汉语教学领域明确提出学科体系模式的学者是（　）。","y":"单项选择题","p":["其中影响最大的是吕必松先生有关第二语言学科理论和第二语言教学结构的论述，第一次在对外汉语教学领域明确提出了学科体系模式"],"q":"A","w":"high","e":["2018 真题"]},{"t":"提出“第二语言教学理论的一般模式”的是（　）。","y":"单项选择题","p":["斯特恩本人于1983年提出的“第二语言教学理论的一般模式”"],"q":"C","w":"normal","e":["核心考点"]},{"t":"简述对外汉语教育学科的学科任务。","y":"简答题","p":["研究教育原理、教育过程和教育方法","核心内容是对外汉语教学","以学科理论建设为第二语言教育学科做贡献"],"q":"①对外汉语教育学科的任务是研究汉语作为第二语言的教育原理、教育过程和教育方法，并用来指导教育实践，从而更好地实现学习者德智体美全面发展的教育目的。②研究的核心内容是对外汉语教学，即通过研究汉语作为第二语言教与学的全过程和整个教学系统中各种内部和外部因素及其相互作用，揭示学习和教学的本质特征及规律。③另一项任务是以自身的","w":"high","e":["2016 真题"]},{"t":"简述对外汉语教育学科体系的构成。","y":"简答题","p":["理论基础：七个基础学科","学科理论：基础理论+应用研究","教学实践"],"q":"对外汉语教育学科体系分成三个部分：①理论基础：提出与本学科发展关系最密切的七个基础学科，即语言学、心理学、教育学、文化学、社会学、横断学科及哲学。②学科理论：包括基础理论和应用研究两部分。基础理论包括对外汉语语言学、对外汉语教学理论、汉语习得理论和学科研究方法学四个方面；应用研究指运用相关学科和本学科的基础理论，对总体","w":"high","e":["2018 真题"]}]},{"id":"yinlun-c01-s03","t":"第三节 对外汉语教育的学科性质和学科特点","w":"high","n":16,"k":[{"t":"对外汉语教学的性质","y":"名词解释","p":["对外汉语教学是一种第二语言教学，也是一种外语教学。","从上述四个方面可以概括出对外汉语教学的性质是汉语作为第二语言的教学，它是第二语言教学的分支学科。","对外汉语教学首先是语言教学；对外汉语教学是第二语言教学；对外汉语教学是汉语作为第二语言的教学；对外汉语教学是对外国人进行的汉语作为第二语言的教学。"],"q":"对外汉语教学是一种第二语言教学，也是一种外语教学。","w":"high","e":["2016 真题","2022 真题"]},{"t":"对外汉语教学的特点","y":"名词解释","p":["（1）以培养汉语交际能力为目标——不是让已具备汉语运用能力的本族人掌握更多的语言和文化知识，而是让作为第二语言的学习者掌握用汉语进行听说读写交际活动的能力。","（2）以技能训练为中心，将语言知识转化为技能。","这些性质和特点也影响到对外汉语教学基本原则等一系列问题的确定。"],"q":"（1）以培养汉语交际能力为目标——不是让已具备汉语运用能力的本族人掌握更多的语言和文化知识，而是让作为第二语言的学习者掌握用汉语进行听说读写交际活动的能力。","w":"high","e":["2018 真题"]},{"t":"专门的学科","y":"名词解释","p":["所谓专门的学科，就是指它有专门的研究对象、研究任务和研究视角，是别的学科所无法替代的。","对外汉语教育是一门专门的学科。","对外汉语教育的研究对象，是汉语作为第二语言的教育现象、教育原理和教育方法，并以对外汉语教学为核心。","本学科的研究任务和教学任务，是其他任何学科，包括最相近的语言学学科、外语教育学科、甚至母语文教育学科所不承担的。"],"q":"所谓专门的学科，就是指它有专门的研究对象、研究任务和研究视角，是别的学科所无法替代的。","w":"normal","e":["核心考点"]},{"t":"综合交叉学科","y":"名词解释","p":["对外汉语教育是一门综合交叉学科。","由两门学科相交而介于其间的，称为边缘交叉学科；由多门学科涉及到同一对象而形成的综合性学科，称为综合交叉学科。","它综合了多种学科的理论成果，研究本学科所面临的特殊课题，从而形成并逐步完善自身的学科理论。","作为本学科理论基础的七个主要学科：语言学、心理学、教育学、文化学、社会学、横断学科及哲学。"],"q":"对外汉语教育是一门综合交叉学科。","w":"high","e":["2017 真题"]},{"t":"应用的学科","y":"名词解释","p":["我们把与实践紧密联系、直接解决实际问题的学科称为应用学科。","对外汉语教育是一门理论与实践紧密结合、具有极强实践性的应用学科。","应用学科也有其自身的基础理论研究领域和理论体系，它不仅需要进行具体的应用研究，不仅关注应用过程本身，而且要进行与之相关的基础理论研究。","它面对着对外汉语教育的实际和大量亟待解决的问题，理论研究的目的在于指导教育实践。"],"q":"我们把与实践紧密联系、直接解决实际问题的学科称为应用学科。","w":"high","e":["2019 真题"]},{"t":"对外汉语教学是一种____教学，也是一种____教学。","y":"填空题","p":["对外汉语教学是一种第二语言教学，也是一种外语教学"],"q":"第二语言；外语","w":"high","e":["2016 真题"]},{"t":"吕叔湘先生说：“学习语言不是学一套知识，而是学一种____。”","y":"填空题","p":["学习语言不是学一套知识，而是学一种技能"],"q":"技能","w":"normal","e":["核心考点"]},{"t":"对外汉语教学首先是语言教学，语言课首先是技能课、工具课。","y":"判断题","p":["语言教学的根本任务是教好语言","语言课首先是技能课、工具课","语言学课程主要是知识课、理论课"],"q":"正确。对外汉语教学首先是语言教学，语言是交际工具，教语言就是要让学习者掌握这个交际工具，语言课首先是技能课、工具课。","w":"high","e":["2016 真题"]},{"t":"对外汉语教学与我国国内少数民族的汉语作为第二语言的教学完全相同。","y":"判断题","p":["外国学生来自世界各国，东西方文化差异巨大","文化因素成了对外汉语教学中不可或缺的内容"],"q":"错误。对外汉语教学是对外国人进行的汉语作为第二语言的教学，不同于对我国国内少数民族的汉语作为第二语言的教学。国内各少数民族同属于中华民族大家庭，由于民族间的文化差异所造成的困难要小得多。","w":"normal","e":["核心考点"]},{"t":"对外汉语教育是一门专门的学科，但并不是综合的学科。","y":"判断题","p":["对外汉语教育是综合交叉学科","它综合了多种学科的理论成果"],"q":"错误。对外汉语教育是一门专门的学科，是综合的学科，又是一门应用的学科。","w":"high","e":["2019 真题"]},{"t":"对外汉语教学的性质，从根本上说是（　）。","y":"单项选择题","p":["从上述四个方面可以概括出对外汉语教学的性质是汉语作为第二语言的教学，它是第二语言教学的分支学科"],"q":"B","w":"high","e":["2016 真题","2022 真题"]},{"t":"提出对外汉语教育是“专门的学科、综合的学科、应用的学科”的是本书作者对（　）的概括。","y":"单项选择题","p":["对外汉语教育是一门专门的学科，是综合的学科，又是一门应用的学科"],"q":"A","w":"high","e":["2019 真题"]},{"t":"被本书作者称为集语言学家、语言教育理论家和语言教师于一身的世界著名学者是（　）。","y":"单项选择题","p":["赵元任先生就是大家非常熟悉的例子，他是集语言学家、语言教育理论家和语言教师为一身的世界著名学者"],"q":"A","w":"normal","e":["核心考点"]},{"t":"简述对外汉语教学的四个方面的性质。","y":"简答题","p":["语言教学","第二语言教学","汉语作为第二语言的教学","对(外国人进行的)汉语作为第二语言的教学"],"q":"①对外汉语教学首先是语言教学。语言教学的根本任务是教好语言，语言课首先是技能课、工具课，不同于语言学教学。②对外汉语教学是第二语言教学。这使对外汉语教学不同于第一语言（母语文）教学，第二语言教学往往从零起点开始，带有短期、速成、集中、强化的特点。③对外汉语教学是汉语作为第二语言的教学。汉语有本身的特殊规律，不同于其他第","w":"high","e":["2016 真题"]},{"t":"简述对外汉语教育学科的特点。","y":"简答题","p":["专门的学科","综合的学科","应用的学科"],"q":"对外汉语教育是一门专门的学科，是综合的学科，又是一门应用的学科。①专门的学科：有专门的研究对象、研究任务和研究视角，是别的学科所无法替代的。②综合的学科：是一门综合交叉学科，综合了多种学科的理论成果，研究本学科所面临的特殊课题。③应用的学科：理论与实践紧密结合、具有极强实践性，有自身的理论体系（基础理论和应用研究），研","w":"high","e":["2019 真题"]},{"t":"试论述第二语言教学为什么不能定位于应用语言学。","y":"论述题","p":["所应用的理论不仅是语言学","语言学与语言教学是应用和启示的关系","应用语言学名称笼统且有失片面","语言教学已找到独立发展道路"],"q":"要点：①第二语言教学所“应用”的理论不仅是语言学，还有心理学、教育学、文化学、社会学等，单单应用语言学理论解决不了语言教学的所有问题。②语言学与语言教学之间的关系决不仅仅是“应用”，斯波尔斯基1970年指出两者是“应用和启示”的关系，塞林克认为“不能把第二语言教材或教学方法放在语言学的基础之上”，科德指出“理论语言学同","w":"high","e":["2017 真题"]}]},{"id":"yinlun-c01-s04","t":"第四节 对外汉语教育的学科定位与争论","w":"high","n":12,"k":[{"t":"学科定位","y":"名词解释","p":["学科定位，是指某一学科在众多学科中的位置，也就是科学地确定它的门类归属问题，通常是由该学科的研究内容、任务和性质所决定的。","学科定位问题之所以需要探讨，是因为它决定学科的发展方向。","对外汉语教育由于它研究内容的特殊性，也由于它是一门综合交叉学科，受到多种学科理论的影响，因而在学科定位的问题上，多少年来一直存在不同的看法和争论。"],"q":"学科定位，是指某一学科在众多学科中的位置，也就是科学地确定它的门类归属问题，通常是由该学科的研究内容、任务和性质所决定的。","w":"high","e":["2020 真题"]},{"t":"“小儿科”论","y":"名词解释","p":["60年代至70年代，对外汉语教学曾被看做是教外国人说中国话，教“人手足刀尺”的“小儿科”，认为“是个中国人就能教汉语”，不承认这是一门学科，需要什么学问。","这是早期的“学科否定论”。","持这种看法的，很多是对我们这一行实际上并不了解的“圈子外边”的人。","在国外，据统计，美国高等院校1986至1988年所开设的英语作为第二语言教学的硕士专业有120个，博士专业有18个，可见在美国也并非“是个美国人就能教英语”。"],"q":"60年代至70年代，对外汉语教学曾被看做是教外国人说中国话，教“人手足刀尺”的“小儿科”，认为“是个中国人就能教汉语”，不承认这是一门学科，需要什么学问。","w":"normal","e":["核心考点"]},{"t":"“对外汉语文化教学学科”论","y":"名词解释","p":["80年代后期至90年代初，对外汉语教学界就进行过一场语言与文化、语言教学与文化教学关系问题的热烈争论。","在讨论中也出现了一些比较偏颇的观点，如提出对外汉语教学要“突破汉语基础教育”……最后导致要把本学科的性质改为“对外汉语文化教学学科”。","1994年12月举行的“对外汉语教学的定性、定位、定量问题座谈会”，就学科的性质与内涵、对外汉语教学中语言教学与文化教学的关系等问题进行了深入的讨论，在一些原则问题上达成了共识。","会议重申了对外汉语教学作为第二语言教学的学科性质。"],"q":"80年代后期至90年代初，对外汉语教学界就进行过一场语言与文化、语言教学与文化教学关系问题的热烈争论。","w":"high","e":["2018 真题"]},{"t":"“应用语言学学科”论","y":"名词解释","p":["传统的看法是把第二语言教学归入语言学的范畴，其上位学科是应用语言学，甚至将狭义的应用语言学用来专指第二语言教学。","首先，第二语言教学所“应用”的理论不仅是语言学，还有心理学、教育学、文化学、社会学等，单单应用语言学理论解决不了语言教学的所有问题。","第二，语言学与语言教学之间的关系决不仅仅是“应用”。","第三，“应用语言学”这一名称非常笼统，不能明确地表示出本学科的内容。","第四，今天的语言教学已经进一步发现了自己的学科特征，明确了自己的发展方向，找到了自己的发展道路。"],"q":"传统的看法是把第二语言教学归入语言学的范畴，其上位学科是应用语言学，甚至将狭义的应用语言学用来专指第二语言教学。","w":"high","e":["2017 真题"]},{"t":"1994年12月举行的“对外汉语教学的____、____、____问题座谈会”，就学科的性质与内涵等问题进行了深入的讨论。","y":"填空题","p":["1994年12月举行的“对外汉语教学的定性、定位、定量问题座谈会”"],"q":"定性；定位；定量","w":"high","e":["2018 真题"]},{"t":"对外汉语教育学科的性质是汉语作为第二语言的教育，应当定位于____学科。","y":"填空题","p":["应当定位于语言教育学科。它是语言教育学科下的第二语言教育的分支学科"],"q":"语言教育","w":"high","e":["2020 真题"]},{"t":"80年代出现的“对外汉语文化教学学科”论主张把本学科的性质改为文化教学学科，这一主张得到了座谈会的肯定。","y":"判断题","p":["会议重申了对外汉语教学作为第二语言教学的学科性质","在姓“语（言）”还是姓“文（化）”的问题面前强调了本学科的语言属性"],"q":"错误。1994年12月的座谈会重申了对外汉语教学作为第二语言教学的学科性质，强调本学科的语言属性，并未把学科性质改为文化教学学科。","w":"high","e":["2018 真题"]},{"t":"对外汉语教育学科应当定位于语言学、应用语言学范畴。","y":"判断题","p":["第二语言教学所“应用”的理论不仅是语言学","语言学与语言教学之间的关系决不仅仅是“应用”","应当定位于语言教育学科"],"q":"错误。对外汉语教育学科的性质是汉语作为第二语言的教育，应当定位于语言教育学科。","w":"high","e":["2020 真题"]},{"t":"提出语言学与语言教学之间是“应用和启示”关系的学者是（　）。","y":"单项选择题","p":["美国学者斯波尔斯基1970年指出，这两者是“应用和启示”的关系"],"q":"B","w":"normal","e":["核心考点"]},{"t":"简述关于对外汉语教育学科定位问题的几种争论。","y":"简答题","p":["“小儿科”论是早期的学科否定论","“对外汉语文化教学学科”论及座谈会共识","“应用语言学学科”论的不当","定位于语言教育学科"],"q":"①“小儿科”论：60至70年代，对外汉语教学被看做教外国人说中国话的“小儿科”，是早期的“学科否定论”。②“对外汉语文化教学学科”论：80年代后期至90年代初出现，主张把本学科性质改为文化教学学科；1994年12月的“定性、定位、定量问题座谈会”重申了对外汉语教学作为第二语言教学的学科性质。③“应用语言学学科”论：传统","w":"high","e":["2020 真题"]},{"t":"试论述为什么说对外汉语教育是其他学科所无法替代的一个专门学科？","y":"论述题","p":["有专门的研究对象","有专门的研究任务","有综合的独特的研究视角","教学任务独特","其他学科无法承担"],"q":"要点：①从研究对象看，对外汉语教育的研究对象是汉语作为第二语言的教育现象、教育原理和教育方法，并以对外汉语教学为核心，研究汉语作为第二语言教学的全过程及整个教学系统中各种内部和外部因素及其相互作用。②从研究任务看，其任务是揭示汉语作为第二语言的教育规律和教学规律，以指导教育实践和教学实践，解决实践中提出的各种问题，从而","w":"high","e":["2019 真题"]},{"t":"【案例】某高校国际中文教育专业的一名新教师在给零起点外国留学生上第一堂汉语课时，用了大半堂课详细讲解汉语的声调系统和语法知识，并让学生背诵“声母表”。一学期后，学生仍开不了口，学习兴趣明显下降，有学生抱怨“老师说汉语很难，我们学不会”。请结合对外汉语教学的性质和特点，按照“发现问题—分析问题—解决问题”的思路，写一篇800字以上的案例分析。","y":"案例分析","p":["发现问题：把语言课当作知识课","分析问题：违背语言教学是技能课、工具课的性质","第二语言教学须以技能训练为中心","解决问题：以培养交际能力为目标、精讲多练"],"q":"①发现问题：新教师把汉语课当成语言学知识课，违背了对外汉语教学的性质和特点，导致学生会话交际能力差、兴趣下降。②分析问题：依据教材，对外汉语教学首先是语言教学，语言教学的根本任务是教好语言，语言是交际工具，教语言就是要让学习者掌握这个交际工具，培养他们运用语言进行交际的能力；吕叔湘先生说“学习语言不是学一套知识，而是学","w":"high","e":["2019 真题"]}]}]},{"id":"yinlun-c02","t":"第二章 汉语作为第二语言教学的发展与现状","w":"high","s":[{"id":"yinlun-c02-s01","t":"第一节 我国对外汉语教学的发展回顾","w":"high","n":29,"k":[{"t":"《汉语教科书》","y":"名词解释","p":["1958年出版的我国第一套对外汉语教材《汉语教科书》"],"q":"1958年出版的我国第一套对外汉语教材《汉语教科书》","w":"high","e":["2025 真题"]},{"t":"东欧交换生中国语文专修班","y":"名词解释","p":["1950年成立的清华大学“东欧交换生中国语文专修班”于1951年初正式开课，拉开了新中国外国留学生汉语预备教育的帷幕。","清华大学校务委员会主任周培元教授兼任专修班班主任，著名语言学家吕叔湘先生任清华大学外籍留学生管理委员会主席并兼管专修班的业务工作。","第一年共接受来自东欧国家的33名留学生，学制为两年。"],"q":"1950年成立的清华大学“东欧交换生中国语文专修班”于1951年初正式开课，拉开了新中国外国留学生汉语预备教育的帷幕。","w":"high","e":["2016 真题"]},{"t":"北京语言学院","y":"名词解释","p":["经国务院批准，1962年6月在北京外国语学院外国留学生办公室的基础上正式成立“外国留学生高等预备学校”……是北京语言学院的前身。","1964年6月经国务院批准，外国留学生高等预备学校改名为北京语言学院，1996年又改名为北京语言文化大学。","这是我国第一所以对外汉语教学为主要任务的高等学校，它的成立结束了对外汉语教学依附于其他高等学校的情况，有了本学科自己的、独立的、稳定的基地。","北京语言文化大学至今仍是我国惟一的一所专门以对外国进修生、本科生、硕士研究生、博士研究生以及汉语进修教师进行汉语言、中国文化、中国文学、中国艺术和汉语教学理论教育为主要任务的大学。"],"q":"经国务院批准，1962年6月在北京外国语学院外国留学生办公室的基础上正式成立“外国留学生高等预备学校”……是北京语言学院的前身。","w":"high","e":["2021 真题"]},{"t":"国家对外汉语教学领导小组","y":"名词解释","p":["1987年7月国务院批准成立了由国家教委、国务院外事办公室、外交部、文化部、广播电影电视部、新闻出版署、国家语言文字工作委员会等政府部门及北京语言学院组成的“国家对外汉语教学领导小组”（1998年已扩展为由11个政府部门组成），由当时的国家教委负责人任组长。","日
