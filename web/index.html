gh","e":["教材高频"]},{"t":"阅读课课文处理有哪些方式？","y":"简答题","p":["常规处理（读前介绍/独立阅读/完成题目/教师讲解）","强化处理（适合难度大或含目标词汇的课文）","简化处理（适合眺读查读或偏易课文）","课后阅读的处理"],"q":"(一) 常规处理……(二) 强化处理……(三) 简化处理……(四) 课后阅读的处理……","w":"high","e":["教材高频"]},{"t":"阅读课如何讲解阅读理解题目？","y":"简答题","p":["难度低的问题：确认答案出处，可留给水平低的学生","难度高的问题：回到语料细读、理清线索、教处理方法","理解问题设计不足：另外提出理解问题","检查理解率的方法"],"q":"(一) 难度低的理解问题……(二) 难度高的理解问题……(三) 理解问题设计不足……(四) 检查理解率的方法……","w":"high","e":["教材高频"]},{"t":"阅读课的技能训练部分应如何处理？","y":"简答题","p":["讲解：简单、避免语法术语","讲解：归纳形式标记","技能练习：以大量练习深化，采用成对或小组练习","强调训练目的是提高阅读能力","阅读课文中随时提醒运用对应技能"],"q":"(一) 讲解……1. 简单，避免语法术语……2. 归纳形式标记……(二) 技能练习……(三) 阅读课文中的技能训练……","w":"normal","e":["核心考点"]},{"t":"阅读课如何培养学生良好的阅读习惯？","y":"简答题","p":["培养推测能力","鼓励容忍模糊性","纠正不良阅读习惯（依赖字典、朗读、默读、指读）","不同的阅读方式与阅读时间控制"],"q":"四、培养学生良好的阅读习惯……(一) 培养推测能力……(二) 鼓励容忍模糊性……(三) 纠正不良阅读习惯……(四) 不同的阅读方式与阅读时间控制。","w":"high","e":["教材高频"]},{"t":"阅读教学为什么要鼓励学生容忍模糊性？","y":"简答题","p":["阅读追求阅读量，理解率不必百分百","好读者先通篇阅读再深入重点","学生不能忍受模糊性会滞留、查字典、找出非词","教师提醒'别管这里，先往下读'","继续读下去是最高级的补救策略"],"q":"阅读课追求阅读量，对理解率的要求一般不会是百分百的……因此，教师在课堂上要不断地提醒学生： “别管这里，先往下读。”继续读下去是在所有理解失败的补救措施中最为成熟、最为高级的一个策略。","w":"high","e":["教材高频"]},{"t":"阅读课对理解率的要求必须是百分百，学生必须读懂每个细节。","y":"判断题","p":["阅读课追求阅读量，对理解率的要求一般不会是百分百的，尤其是一开始的时候，能有个百分之六七十，能够回答大部分阅读理解题目就可以了。"],"q":"阅读课追求阅读量，对理解率的要求一般不会是百分百的，尤其是一开始的时候，能有个百分之六七十，能够回答大部分阅读理解题目就可以了。","w":"high","e":["教材高频"]},{"t":"阅读课与精读课一样，需要详细讲解词汇的用法和语法知识。","y":"判断题","p":["阅读课讲解生词的原则：在语境中讲解词义，点到为止，不需要讲解词汇在文本之外的其他意义和用法。阅读课对语言知识的讲解要尽量简单直接，在几分钟内解决，因为在精读课上它们已经被详细讲过了。"],"q":"第一，讲解时一定要利用课文中的上下文，在语境中讲解词义……第二，点到为止，不需要讲解词汇在文本之外的其他意义和用法。","w":"high","e":["教材高频"]},{"t":"教程中按照不同的阅读目标、阅读文本的种类，要求学生以不同的阅读策略进行阅读，这些阅读策略包括____、____和眺读。","y":"填空题","p":["这些阅读策略包括：寻找特定细节信息的查读，浏览大意式的略读，为进一步阅读打前站的眺读。"],"q":"这些阅读策略包括：寻找特定细节信息的查读，浏览大意式的略读，为进一步阅读打前站的眺读。","w":"normal","e":["核心考点"]},{"t":"结合教材，论述读者是如何阅读的，以及这些阅读认知规律对阅读教学的启示。","y":"论述题","p":["阅读习得的简易模型（语言理解×文字解码）","词汇识别（语境与词频）","句子理解（句法策略与语义策略交互）","篇章理解（宏观策略与微观策略）","图式与推论","对阅读教学的启示（自上而下与自下而上策略、推测、容忍模糊性等）"],"q":"《国际汉语教师标准》……在阅读教学的基本原则中提出，“注重培养学习者运用自下而上与自上而下等不同的阅读策略的能力”。……第二节 怎么上阅读课?……阅读课的教学目标主要包括：第一，增加学生的词汇量……","w":"high","e":["教材高频"]}]},{"id":"rumen-c17-s03","t":"第三节 阅读课怎么教词汇？","w":"high","n":8,"k":[{"t":"可猜测词","y":"名词解释","p":["可猜测词是阅读课需要讲解的两类词语之一","正如教材所强调的，阅读课的教学目标是鼓励学生进行伴随性词汇学习，提高其阅读技能，而猜词是实现这两个目标的落脚点","在开始阅读之前，教师应选择一两个甚至若干个可通过猜测获得大概词义的词语，提前写在黑板上（或告知学生在某段某行，提前加标注），提醒学生在阅读的同时要特别注意这些目标词，鼓励他们运用学过的技能进行词义猜测","调查表明，学习者对目标词的注意有助于提高他们对词汇意义的理解率"],"q":"需要讲解的词语一般有两类：一是对阅读理解十分重要的内容关键词，二是可能通过各种方式推测出来的生词。……而猜词是实现这两个目标的落脚点。","w":"high","e":["教材高频"]},{"t":"阅读课讲解生词的原则","y":"名词解释","p":["原则上，阅读课教师不讲解课文中的生词","有些生词对于内容理解十分关键，或是对日常阅读很重要，这时教师可以根据情况进行讲解","但要首先牢记阅读课讲解生词的原则：第一，讲解时一定要利用课文中的上下文，在语境中讲解词义","如果课文中提供的语境不明确、不够用，教师可自创语境","第二，点到为止，不需要讲解词汇在文本之外的其他意义和用法"],"q":"但要首先牢记阅读课讲解生词的原则：第一，讲解时一定要利用课文中的上下文，在语境中讲解词义……第二，点到为止，不需要讲解词汇在文本之外的其他意义和用法。","w":"normal","e":["核心考点"]},{"t":"阅读课如何选定教学词汇？","y":"简答题","p":["教材生词只是参考，根据学生水平灵活把握","内容关键词","可猜测词","提前标注可猜测词，提醒注意"],"q":"需要讲解的词语一般有两类：一是对阅读理解十分重要的内容关键词，二是可能通过各种方式推测出来的生词。","w":"high","e":["教材高频"]},{"t":"阅读课讲解词语有哪些方法？","y":"简答题","p":["讨论法","语境展示法","图画——实物法","联想——引导法","综合法","在语境中讲解、点到为止"],"q":"(一) 讨论法……(二) 语境展示法……(三) 图画——实物法……(四) 联想——引导法……(五) 综合法……","w":"high","e":["教材高频"]},{"t":"阅读课的词汇练习有哪些方法？","y":"简答题","p":["两个基本点：讲理解不讲运用，重实词不重虚词","猜词练习（两人或小组为单位）","词汇联想（注意适度）","评价练习"],"q":"阅读课上的词汇练习有两个基本点一定要注意：一是讲理解，不讲运用； 二是重实词，不重虚词。刘颂浩 (1999) 把词汇练习归纳为五类，分别是辨认、联想、搭配、评价和总结。","w":"high","e":["教材高频"]},{"t":"阅读课上的词汇练习应强调运用和虚词。","y":"判断题","p":["阅读课上的词汇练习有两个基本点：一是讲理解，不讲运用；二是重实词，不重虚词。"],"q":"阅读课上的词汇练习有两个基本点一定要注意：一是讲理解，不讲运用； 二是重实词，不重虚词。","w":"high","e":["教材高频"]},{"t":"刘颂浩把词汇练习归纳为五类，分别是____、____、搭配、评价和总结。","y":"填空题","p":["刘颂浩将词汇练习归纳为辨认、联想、搭配、评价和总结五类。"],"q":"刘颂浩 (1999) 把词汇练习归纳为五类，分别是辨认、联想、搭配、评价和总结。","w":"normal","e":["核心考点"]},{"t":"【案例】某教师上中级阅读课《购物天堂香港》。他先让学生逐个查生词表的生词，查完词典后在班上逐一讲解每个生词的读音、词性和用法，并让学生抄写例句。然后让学生逐字逐句朗读课文，遇到生词就停下来查字典，读一句翻译一句。一节课下来只读完了两段，学生抱怨阅读课变成了精读课，也读不快。\n请结合本章阅读课教学的知识，分析这位教师教学存在的问题，并提出改进建议。","y":"案例分析题","p":["违反阅读课教学目标","混淆阅读课与精读课（讲解点到为止、在语境中）","违反培养良好阅读习惯的要求（依赖字典、朗读、指读）","未采用正确的词汇讲解方法和课文处理方式","未训练阅读技能（如上下文推测生词）","改进建议：明确目标、讨论法导入关键词、独立阅读、训练技能、培养推测能力"],"q":"第一，讲解时一定要利用课文中的上下文，在语境中讲解词义； 如果课文中提供的语境不明确、不够用，教师可自创语境。第二，点到为止，不需要讲解词汇在文本之外的其他意义和用法。","w":"high","e":["教材高频"]}]},{"id":"rumen-c17-s04","t":"第四节 如何把阅读课上得生动有趣？","w":"high","n":1,"k":[{"t":"如何把阅读课上得生动有趣？","y":"简答题","p":["阅读课单调的两个起因","增加参与感，加强师一生、生一生互动（'××同学时间'）","增加信息输入量，结合文化知识学习","增加输出机会（讨论，每次不超过5分钟）","合理安排阅读节奏，避免'唯课本是从'"],"q":"把阅读课上得生动有趣的关键就是能够根据课程内容设置形式多样的阅读任务和课堂活动。……一、增加参与感，加强师一生、生一生互动……二、增加信息输入量，结合文化知识学习……三、增加输出机会……四、合理安排阅读节奏。","w":"high","e":["教材高频"]}]},{"id":"rumen-c17-s05","t":"第五节 报刊阅读课","w":"high","n":4,"k":[{"t":"报刊阅读课有哪些特点？","y":"简答题","p":["报刊课开设阶段与目的","报刊语言特点（词汇、句子、连接）","教材与补充材料的结合","注重与文化教学结合"],"q":"作为阅读课的一个分支，报刊阅读这门课程必须遵循本章前面论述到的阅读课教学的基本规律； 但是，作为一门单独开列的课程，它也有自身的特点。……一、报刊阅读课的特点。","w":"high","e":["教材高频"]},{"t":"简述报刊语言在词汇上的特点。","y":"简答题","p":["书面词汇多（举例）","古词语和成语","缩略词多（举例）","新词多"],"q":"在词汇上，报刊语言有以下几个特征：(1) 书面词汇多……(2) 缩略词多……(3) 新词多。","w":"normal","e":["核心考点"]},{"t":"报刊阅读课有哪些教学技巧和常见课堂活动？","y":"简答题","p":["报刊语言教学（词汇、句子、篇章）","强调课外报刊阅读","课堂活动（有报天天读、新闻综述/发布会、班级文摘报、编前会议、看报纸读文化、同一个新闻）"],"q":"二、报刊阅读课的教学技巧……(一) 报刊语言教学……(二) 强调课外报刊阅读……(三) 相关课堂活动……","w":"normal","e":["核心考点"]},{"t":"报刊阅读课所选用的语料大都来源于报纸上的（　　）的文章，其语体大都是新闻体的议论文。A.第一版和第二版　B.第三版和第四版　C.广告版　D.副刊","y":"单项选择题","p":["报刊阅读课所选用的语料大都来源于报纸上的第一版和第二版的文章，其语体大都是新闻体的议论文。"],"q":"报刊阅读课所选用的语料大都来源于报纸上的第一版和第二版的文章，其语体大都是新闻体的议论文。","w":"normal","e":["核心考点"]}]}]},{"id":"rumen-c18","t":"第十八章 写作课教学","w":"high","s":[{"id":"rumen-c18-s01","t":"第一节 汉语写作教学的特点","w":"high","n":6,"k":[{"t":"汉语写作教学的特点","y":"名词解释","p":["写作教学主要从写的角度培养学习者语言交际的能力","由于写作综合了字、词、句法、篇章等方方面面的知识，是语言综合运用能力的一种表现，因此，写作课通常在学习者具有一定水平的听、说、读的能力之后开设","汉语二语写作教学重视培养在实际运用中写的能力","写包括填写表格、记录一个地址、写一句祝福语、描述所在位置、介绍个人情况、叙述一个故事、写一篇说明文等，这有别于汉语母语者写作即写文章的观念"],"q":"写作教学主要从写的角度培养学习者语言交际的能力。由于写作综合了字、词、句法、篇章等方方面面的知识，是语言综合运用能力的一种表现，因此，写作课通常在学习者具有一定水平的听、说、读的能力之后开设。","w":"high","e":["教材高频"]},{"t":"为什么说写比说更难？汉语写作教学有何特点？","y":"简答题","p":["听说读写分属输入与输出","写比说更难的三个原因","写作教学从写的角度培养语言交际能力","写作课在学习者具备听说读能力之后开设","重视实际运用中写的能力，区别于母语写作"],"q":"说和写相比，写更难。这里有三个原因：第一，说是使用有声语言系统 (口语)，写是使用文字系统 (书面语)……第二，汉语的文字系统跟绝大多数语言不同……第三，写在交流过程中只能通过语言转化成文字进行表达。","w":"high","e":["教材高频"]},{"t":"汉语二语写作教学中的'写'就等同于汉语母语者的'写文章'。","y":"判断题","p":["汉语二语写作教学重视培养在实际运用中写的能力。写包括填写表格、记录一个地址、写一句祝福语、描述所在位置、介绍个人情况、叙述一个故事、写一篇说明文等，这有别于汉语母语者写作即写文章的观念。"],"q":"汉语二语写作教学重视培养在实际运用中写的能力。写包括填写表格、记录一个地址、写一句祝福语、描述所在位置、介绍个人情况、叙述一个故事、写一篇说明文等，这有别于汉语母语者写作即写文章的观念。","w":"high","e":["教材高频"]},{"t":"在听、说、读、写四种语言技能中，属于语言输入的是（　　）。A.听、说　B.听、读　C.说、写　D.读、写","y":"单项选择题","p":["听、读属于语言的输入，说、写属于语言的输出。根据语言学习和教学的规律，输入在先，输出在后。"],"q":"在听、说、读、写四种语言技能中，听、读属于语言的输入，说、写属于语言的输出。","w":"normal","e":["核心考点"]},{"t":"在听、说、读、写四种语言技能中，一般来说，输出性的说、写要比输入性的听、读难，而写比说更难。","y":"判断题","p":["正确","写比说更难，原因：使用文字系统、汉语文字特殊、表达方式受限"],"q":"一般来说，输出性的说、写要比输入性的听、读难。说和写相比，写更难。……因此，写对语言运用的要求更高。","w":"normal","e":["核心考点"]},{"t":"《国际汉语能力标准》将汉语书面表达能力分为（　　）级。","y":"单项选择题","p":["C"],"q":"《国际汉语能力标准》(国家汉办，2007b) 将汉语书面表达能力分为五级，五级为最高级。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c18-s02","t":"第二节 写作教学原则","w":"high","n":19,"k":[{"t":"写作教学的实用性原则","y":"名词解释","p":["实用性原则是指教学要满足留学生的实际写作需求，要重视各种应用文体的写作练习","不论学生出于怎样的动机来学习汉语，他们的目的都是能使用汉语，'学以致用'在第二语言教学中尤为明显","写作教学是否具有实用性是写作教学成败的关键","学生之所以来上写作课，是想学到其他课上学不到的有关写作方面的知识，解决其他课型没有解决的问题：一方面学习篇章写作知识、写作技能，另一方面通过文字的输出训练解决语言运用中的实际问题","因此要注重词语、句式的语义解释和语用规律的归纳"],"q":"教学要满足留学生的实际写作需求，要重视各种应用文体的写作练习。……写作教学是否具有实用性是写作教学成败的关键。","w":"high","e":["教材高频"]},{"t":"写作教学的联系性原则","y":"名词解释","p":["联系性原则是指写作教学要注重与其他语言技能的联系，尤其是口语和阅读的关系","从语言的技能来说，口语和写作都属于输出技能，但就难度而言，写作比口语难，习得的顺序一般是先口语，后写作","为了减少写作的难度，我们通常在课堂上通过口语的练习，形成写作的雏形","先口头表达，再笔头表达，是输出训练的两个相连的部分","写作和听、阅读的关系也很密切：从写的需求来说，有时获取了具体信息，写的交际活动才可以继续下去"],"q":"写作教学要注重与其他语言技能的联系，尤其是口语和阅读的关系。……先口头表达，再笔头表达，是输出训练的两个相连的部分。","w":"high","e":["教材高频"]},{"t":"写作教学的渐进性原则","y":"名词解释","p":["渐进性原则是指教学时要考虑学生接受知识、培养能力的可能性，注意切分教学任务","篇章的写作可以化解为几个小的写作任务，从完成关键词语的写作，到完成句子的写作，再到完成段落的写作，最后是篇章的写作","把完整的写作分解成一个个小的写作过程，逐步消解篇章写作的难度，符合学生习得的规律","如教学生写游记，可以通过阅读范文找出时间地点表达、模仿写句子、把游玩内容连成段落、描写风景、完成整篇游记五个由易到难的写作小任务来完成"],"q":"教学时要考虑学生接受知识、培养能力的可能性，注意切分教学任务。篇章的写作可以化解为几个小的写作任务，从完成关键词语的写作，到完成句子的写作，再到完成段落的写作，最后是篇章的写作。","w":"high","e":["教材高频"]},{"t":"写作教学的互动性原则","y":"名词解释","p":["互动性原则是指教学时要注重师生之间的信息交流，使静态的写作活动动态化","虽然写作是一种相对静态的个体思维活动，但是作为技能的培养、作为一种教学活动，要使之动态化，这样才有利于学生写作能力的快速提高，同时增强写作的趣味性","互动可以是教师和学生之间，也可以是学生和学生之间","师生之间的互动可以体现在写作之前和写作之后的信息交流和反馈上","师生之间还可以共同完成写作任务，如老师写一个开头、学生续写"],"q":"教学时要注重师生之间的信息交流，使静态的写作活动动态化。……互动可以是教师和学生之间，也可以是学生和学生之间。","w":"high","e":["教材高频"]},{"t":"写作教学的操作性原则","y":"名词解释","p":["操作性原则是指教学中要注重学生及时操练语言知识，遵循讲练结合的原则","任何一种语言技能都需经过反复的练习才能真正掌握","写是一种难度较高的技能，更需要及时、不断、反复地练习","本着讲练结合的原则，在课堂上应该练习写作","课堂上的写作训练要注意四个问题：①写的内容要具体或者有直观性，不要让学生在决定写什么的问题上浪费时间"],"q":"教学中要注重学生及时操练语言知识，遵循讲练结合的原则。……在课堂上应该练习写作。课堂上的写作训练要注意四个问题：①写的内容要具体或者有直观性……②写的时间不宜太长，我们认为一次写作的时间以半小时左右为宜。","w":"high","e":["教材高频"]},{"t":"《国际汉语教师标准》提出的写作教学的五条基本原则是什么？","y":"简答题","p":["写作知识教学与写作实践相结合","写作教学与其他技能教学相结合","对写作过程各个环节的具体指导","教师评语、学生反馈和师生面谈等形式指导","写作教学的实用性和应用性"],"q":"《国际汉语教师标准》(国家汉办，2007a) 提出写作教学的五条基本原则：(1) 注重写作知识的教学与写作实践相结合。(2) 注重写作教学与其他技能教学相结合……(5) 注重写作教学的实用性和应用性。","w":"high","e":["教材高频"]},{"t":"写作教学中如何贯彻联系性原则？","y":"简答题","p":["与口语的联系（先口语后写作）","先口头表达再笔头表达","与听的联系（获取信息才能写）","与阅读的联系（模仿范文、扩展词汇）","强调阅读的重要性"],"q":"写作教学要注重与其他语言技能的联系，尤其是口语和阅读的关系。……总之，写作教学应该强调阅读的重要性。","w":"high","e":["教材高频"]},{"t":"写作教学中如何贯彻渐进性原则？","y":"简答题","p":["切分教学任务","从词语到句子到段落到篇章","以写游记为例的五个写作小任务","逐步消解篇章写作难度"],"q":"篇章的写作可以化解为几个小的写作任务，从完成关键词语的写作，到完成句子的写作，再到完成段落的写作，最后是篇章的写作。……例如教学生写游记，可以通过以下几个写作小任务来完成……","w":"high","e":["教材高频"]},{"t":"写作教学中，教师对写出来的成篇文章应以鼓励为主，不必指出并试图纠正学生所有的错误。","y":"判断题","p":["纠错要注意'适度性原则'。一般来讲，对写出来的成篇文章，应以鼓励为主，最好只指出严重的（如会造成误解的）、普遍的（不少同学都会出现的）错误，否则效果会适得其反。"],"q":"纠错要注意“适度性原则”。一般来讲，对写出来的成篇文章，应以鼓励为主。……最好只指出严重的(如会造成误解的)、普遍的(不少同学都会出现的) 错误。","w":"high","e":["教材高频"]},{"t":"写作课上，一次写作的时间越长越好，应鼓励学生用整个学期课时写一篇好作文。","y":"判断题","p":["写的时间不宜太长，教材认为一次写作的时间以半小时左右为宜。写作课的教学一般每周两个课时，花一节课的时间写作，学生会觉得写作课没意思。"],"q":"②写的时间不宜太长，我们认为一次写作的时间以半小时左右为宜。","w":"high","e":["教材高频"]},{"t":"写作教学的五个原则是实用性原则、____、____、____和操作性原则。","y":"填空题","p":["写作教学的原则：一、实用性原则；二、联系性原则；三、渐进性原则；四、互动性原则；五、操作性原则。"],"q":"一、实用性原则……二、联系性原则……三、渐进性原则……四、互动性原则……五、操作性原则……","w":"high","e":["教材高频"]},{"t":"课堂上的写作训练要注意四个问题，其中一次写作的时间以____左右为宜。","y":"填空题","p":["写的时间不宜太长，一次写作的时间以半小时左右为宜。"],"q":"②写的时间不宜太长，我们认为一次写作的时间以半小时左右为宜。","w":"normal","e":["核心考点"]},{"t":"以下不属于《国际汉语教师标准》提出的写作教学基本原则的是（　　）。A.注重写作知识的教学与写作实践相结合　B.注重写作教学与其他技能教学相结合　C.注重写作教学的实用性和应用性　D.注重写作教学以语言知识讲授为中心","y":"单项选择题","p":["写作教学的五条基本原则：（1）注重写作知识的教学与写作实践相结合；（2）注重写作教学与其他技能教学相结合；（3）注重对写作过程中各个环节的具体指导；（4）注重采用教师评语、学生反馈和师生面谈等形式；（5）注重写作教学的实用性和应用性。"],"q":"《国际汉语教师标准》……提出写作教学的五条基本原则：(1) 注重写作知识的教学与写作实践相结合。(2) 注重写作教学与其他技能教学相结合……(5) 注重写作教学的实用性和应用性。","w":"high","e":["教材高频"]},{"t":"结合教材，论述写作教学的基本原则。","y":"论述题","p":["《国际汉语教师标准》五条基本原则","实用性原则","联系性原则","渐进性原则","互动性原则","操作性原则"],"q":"《国际汉语教师标准》……提出写作教学的五条基本原则……一、实用性原则……二、联系性原则……三、渐进性原则……四、互动性原则……五、操作性原则……","w":"high","e":["教材高频"]},{"t":"渐进性原则","y":"名词解释","p":["渐进性原则是写作教学的原则之一，指教学时要考虑学生接受知识、培养能力的可能性，注意切分教学任务","篇章的写作可以化解为几个小的写作任务，从完成关键词语的写作，到完成句子的写作，再到完成段落的写作，最后是篇章的写作","如教学生写游记，可以通过模仿写时间地点、模仿写句子、连段、模仿描写景色、完成全篇五个由易到难的写作小任务来完成，把完整的写作分解成一个个小的写作过程，逐步消解篇章写作的难度，符合学生习得的规律"],"q":"教学时要考虑学生接受知识、培养能力的可能性，注意切分教学任务。篇章的写作可以化解为几个小的写作任务，从完成关键词语的写作，到完成句子的写作，再到完成段落的写作，最后是篇章的写作。","w":"normal","e":["核心考点"]},{"t":"互动性原则","y":"名词解释","p":["互动性原则是写作教学的原则之一，指教学时要注重师生之间的信息交流，使静态的写作活动动态化","虽然写作是一种相对静态的个体思维活动，但是作为技能的培养、作为一种教学活动，要使之动态化，这样才有利于学生写作能力的快速提高，同时增强写作的趣味性","互动可以是教师和学生之间，也可以是学生和学生之间","师生互动可以体现在写作之前和写作之后的信息交流和反馈上，还可以体现在共同完成写作任务上","学生之间的互动可以以小组形式完成学习任务，也可以是学生之间互评作文"],"q":"教学时要注重师生之间的信息交流，使静态的写作活动动态化。……互动可以是教师和学生之间，也可以是学生和学生之间。","w":"normal","e":["核心考点"]},{"t":"简述写作教学的实用性原则。","y":"简答题","p":["教学要满足留学生的实际写作需求，重视应用文体写作练习","实用性是写作教学成败的关键，注重语义解释和语用规律归纳","让学生体会写作的实用性和交际价值","加强应用文体写作训练（请假条、留言条、家信、投诉信、求职信等）","应用文种类兼顾当前需要与未来需要"],"q":"教学要满足留学生的实际写作需求，要重视各种应用文体的写作练习。……写作教学是否具有实用性是写作教学成败的关键。……因此要加强应用文体的写作训练。","w":"normal","e":["核心考点"]},{"t":"简述写作教学的联系性原则。","y":"简答题","p":["注重与其他语言技能的联系，尤其口语和阅读","口语和写作都是输出技能，先口语后写作，通过口语形成写作雏形","写作与听读关系密切：听清信息才能写，读范文才能模仿","阅读可扩展词汇，为写作服务，应强调阅读的重要性"],"q":"写作教学要注重与其他语言技能的联系，尤其是口语和阅读的关系。……先口头表达，再笔头表达，是输出训练的两个相连的部分。……因此，写作教学应该强调阅读的重要性。","w":"normal","e":["核心考点"]},{"t":"课堂上的写作训练要注意哪四个问题？","y":"简答题","p":["写的内容要具体或有直观性，不让学生在决定写什么上浪费时间","写的时间不宜太长，一次以半小时左右为宜","堂上写作应该及时讲评","堂上写作最好和课后写作有联系"],"q":"课堂上的写作训练要注意四个问题：①写的内容要具体或者有直观性……②写的时间不宜太长，我们认为一次写作的时间以半小时左右为宜。③堂上写作应该及时讲评。④堂上写作最好和课后写作有联系。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c18-s03","t":"第三节 课堂教学方法","w":"high","n":12,"k":[{"t":"读后续写","y":"名词解释","p":["读后续写是写作训练的一种方式，即给学生文章的开头，让学生接着写","续写可以以全体学生参与的方式进行，即一个人写一句地续写","也可以分组进行续写","还可以以个体的方式进行，即各人写各人的","它是篇章写作训练的一种方法，与听后写、说后写、看后写、读后写并列"],"q":"读后续写：给学生文章的开头，让学生接着写。续写可以以全体学生参与的方式进行，即一个人写一句地续写； 也可以分组进行续写； 还可以以个体的方式进行，即各人写各人的。","w":"normal","e":["核心考点"]},{"t":"写作课堂教学的三个主要环节是什么？写前准备包括哪些内容？","y":"简答题","p":["三个主要环节：写前准备、写作训练、作文讲评","写前准备的三项内容","写前准备的目的","话题引入的三种方法","写作方法介绍与范文学习","语言知识学习的多种方式"],"q":"写前准备、写作训练、作文讲评构成写作课堂教学的三个主要环节。……写前准备包括话题的引入、写作方法的介绍和范文的学习、语言知识的学习。","w":"high","e":["教材高频"]},{"t":"写作训练有哪些方式？","y":"简答题","p":["写作训练的目的","词语句式训练","篇章写作训练：命题写作","听后写","说后写","看后写","读后写","读后续写"],"q":"写作训练包括具体语言形式的练习和篇章的写作练习。……1. 命题写作……2. 听后写……3. 说后写……4. 看后写……5. 读后写……6. 读后续写。","w":"high","e":["教材高频"]},{"t":"作文讲评有哪几种方式？教师讲评应注意什么？","y":"简答题","p":["作文讲评的目的","教师讲评（肯定式、偏误归类式、类比式）","分组讨论","学生自改","学生互评","纠错注意适度性原则，以鼓励为主"],"q":"作文讲评可以分为教师讲评、分组讨论、学生自改和学生互评几种方式。……纠错要注意“适度性原则”。一般来讲，对写出来的成篇文章，应以鼓励为主。","w":"high","e":["教材高频"]},{"t":"实施学生互评应注意哪些问题？","y":"简答题","p":["重视问题清单的设计","教师应发挥指导或示范作用","教师进一步跟进","对学生原文做技术处理"],"q":"为了保证学生互评的顺利实施，要注意以下问题：①重视问题清单的设计……②学生互动中教师应发挥的作用不可忽视……③教师在学生互评之后的进一步跟进非常有必要。","w":"normal","e":["核心考点"]},{"t":"____、____、____构成写作课堂教学的三个主要环节。","y":"填空题","p":["写前准备、写作训练、作文讲评构成写作课堂教学的三个主要环节。"],"q":"写前准备、写作训练、作文讲评构成写作课堂教学的三个主要环节。","w":"high","e":["教材高频"]},{"t":"教师只在学生的作文中做评改的记号，不直接将修改的结果写出来，让学生根据符号的提示重新思考、修正，这属于作文讲评中的（　　）。A.教师讲评　B.分组讨论　C.学生自改　D.学生互评","y":"单项选择题","p":["学生自改：教师只在学生的作文中做评改的记号，不直接将修改的结果写出来，让学生根据符号的提示重新思考、修正。"],"q":"(三) 学生自改：教师只在学生的作文中做评改的记号，不直接将修改的结果写出来，让学生根据符号的提示重新思考、修正。","w":"normal","e":["核心考点"]},{"t":"【案例】某教师上中级写作课，给学生的任务是写一篇游记。他先花整节课把游记的结构、修辞手法、写作技巧讲得滔滔不绝，然后布置学生课后完成一篇500字游记。第二次课上，他把学生作文收上来，逐字逐句圈出所有错误，写满批语，并在课堂上逐一朗读学生的错误句子加以批评。结果学生写作积极性受挫，作文越写越短，还害怕上写作课。\n请结合本章写作教学原则和作文讲评的知识，分析这位教师教学存在的问题，并提出改进建议。","y":"案例分析题","p":["违反渐进性原则（未切分任务、未写前准备）","忽视联系性原则（未先说后写、读后写）","违反操作性原则（课堂不写、全放课后）","作文讲评方式不当、违反纠错适度性原则（应鼓励为主）","改进建议：切分任务、说后写读后写、课堂写作及时讲评、肯定式为主、分组讨论互评"],"q":"需要注意的是，不要指出并试图纠正学生所有的错误。纠错要注意“适度性原则”。一般来讲，对写出来的成篇文章，应以鼓励为主。……否则效果会适得其反：一是会打击学生积极性。","w":"high","e":["教材高频"]},{"t":"写前准备","y":"名词解释","p":["写前准备是写作课堂教学三个主要环节（写前准备、写作训练、作文讲评）的第一个环节，包括话题的引入、写作方法的介绍和范文的学习、语言知识的学习","根据教材设计和课程设计的不同，可以只包括其中一种，或者几种，或者全部","写前准备的主要目的是引导学生进入话题，形成关于某种方法的概念，激活学生已有的语言知识，让学生理解怎样运用特定语言表达形式进行写作，为动笔完成完整文章的写作做准备"],"q":"写前准备包括话题的引入、写作方法的介绍和范文的学习、语言知识的学习。……写前准备的主要目的是引导学生进入话题……为动笔完成完整文章的写作做准备。","w":"normal","e":["核心考点"]},{"t":"读后续写","y":"名词解释","p":["读后续写是写作训练中篇章写作训练的一种方式，即给学生文章的开头，让学生接着写","续写可以以全体学生参与的方式进行，即一个人写一句地续写","也可以分组进行续写","还可以以个体的方式进行，即各人写各人的","读后续写与读后写、听后写、说后写、看后写等共同构成写作训练的主要方式"],"q":"读后续写：给学生文章的开头，让学生接着写。续写可以以全体学生参与的方式进行，即一个人写一句地续写；也可以分组进行续写；还可以以个体的方式进行，即各人写各人的。","w":"normal","e":["核心考点"]},{"t":"作文讲评可以分为哪几种方式？教师讲评又有哪些形式？","y":"简答题","p":["作文讲评分教师讲评、分组讨论、学生自改、学生互评","教师讲评形式：肯定式、偏误归类式、类比式","纠错要注意适度性原则，以鼓励为主，只指出严重、普遍的错误"],"q":"作文讲评可以分为教师讲评、分组讨论、学生自改和学生互评几种方式。……1. 肯定式……2. 偏误归类式……3. 类比式……","w":"normal","e":["核心考点"]},{"t":"______、______、______构成写作课堂教学的三个主要环节。","y":"填空题","p":["写前准备","写作训练","作文讲评"],"q":"写前准备、写作训练、作文讲评构成写作课堂教学的三个主要环节。","w":"normal","e":["核心考点"]}]}]},{"id":"rumen-c19","t":"第十九章 专用汉语","w":"normal","s":[{"id":"rumen-c19-s01","t":"第一节 专用汉语的定义与分类","w":"normal","n":8,"k":[{"t":"专用汉语","y":"名词解释","p":["专用汉语（Chinese for Specific Purposes, CSP）是指与某种特定需求相关的汉语","如为了从事导游职业而学习旅游汉语，为了商贸需要而学习商务汉语，为了攻读医学学位而学习医学汉语","从语言学习的阶段性来看，专用汉语学习者一般需先掌握基本的汉语知识与技能（称为“通用汉语”学习阶段），然后进入专用汉语的学习","从教学内容来看，专用汉语根据学习者的专门需要用汉语来教授专门的知识和技能"],"q":"专用汉语(Chinese for Specific Purposes, CSP) 是指与某种特定需求相关的汉语。如为了从事导游职业而学习旅游汉语，为了商贸需要而学习商务汉语，为了攻读医学学位而学习医学汉语，等等。","w":"normal","e":["核心考点"]},{"t":"专业汉语","y":"名词解释","p":["专业汉语指各院校为来华留学生学习相关专业开设的汉语课程，也称为学术汉语","如为理工科学生开设的科技汉语、为医科学生开设的医学汉语等","课程开设的目的旨在以汉语作为专业学习的工具，帮助仅有通用汉语学习经历的相关专业留学生提高专业汉语水平，适应汉语授课模式的专业课程学习"],"q":"专业汉语指各院校为来华留学生学习相关专业开设的汉语课程，如为理工科学生开设的科技汉语、为医科学生开设的医学汉语等。课程开设的目的旨在以汉语作为专业学习的工具。","w":"normal","e":["核心考点"]},{"t":"职业汉语","y":"名词解释","p":["职业汉语指为满足学习者从事某项职业或业务需要而设置的汉语课程，也称为业务汉语","课程开设的目的旨在帮助学习者学习并掌握从事其职业或业务所必需的汉语知识和技能","其学习者可分为两类：一类是具备了职业知识、只是不知道汉语如何表达的有知识储备的学习者","另一类是无职业知识储备、需在课程中同时学习职业知识的学习者"],"q":"职业汉语指为满足学习者从事某项职业或业务需要而设置的汉语课程。课程开设的目的旨在帮助学习者学习并掌握从事其职业或业务所必需的汉语知识和技能。","w":"normal","e":["核心考点"]},{"t":"如何区分专业汉语和职业汉语？请举例说明。","y":"简答题","p":["分类依据：专用汉语的用途","专业汉语（学术汉语）—为学习相关专业开设，以汉语为专业学习工具，不传授专业知识","职业汉语（业务汉语）—为从事某项职业或业务设置，传授职业所必需的汉语知识和技能","举例：科技汉语/医学汉语（专业）vs 旅游汉语/商务汉语（职业）"],"q":"根据专用汉语的用途，一般可将其分为专业汉语和职业汉语两大类。前者也称为学术汉语，后者也称为业务汉语。","w":"normal","e":["核心考点"]},{"t":"专业汉语也称为学术汉语，其教学重点在于向留学生传授专业知识，而不是帮助其理解专业学科内容。","y":"判断题","p":["错误","教学重点在于从汉语角度帮助理解专业学科内容，不在于传授专业知识"],"q":"教学重点在于从汉语的角度帮助留学生理解专业学科的内容，而不在于传授专业知识。","w":"normal","e":["核心考点"]},{"t":"职业汉语课程的学习者都是无职业知识储备的人，他们需要在课程中同时学习职业知识。","y":"判断题","p":["错误","学习者分两类：有知识储备者和无职业知识储备者","并非都是无职业知识储备者"],"q":"职业汉语课程的学习者可分为两大类：一类是具备了职业知识，只是不知道汉语如何表达，我们称之为有知识储备的学习者。另一类是无职业知识储备的学习者，他们需要在职业汉语课程里同时学习职业知识。","w":"normal","e":["核心考点"]},{"t":"根据专用汉语的用途，一般可将其分为______和______两大类。前者也称为学术汉语，后者也称为业务汉语。","y":"填空题","p":["专业汉语","职业汉语"],"q":"根据专用汉语的用途，一般可将其分为专业汉语和职业汉语两大类。前者也称为学术汉语，后者也称为业务汉语。","w":"normal","e":["核心考点"]},{"t":"专用汉语的英文缩写是（　　）。","y":"单项选择题","p":["C"],"q":"专用汉语(Chinese for Specific Purposes, CSP) 是指与某种特定需求相关的汉语。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c19-s02","t":"第二节 专用汉语教学大纲与课程设置","w":"normal","n":11,"k":[{"t":"《商务汉语交际功能项目》","y":"名词解释","p":["《商务汉语交际功能项目》是2006年出版的《商务汉语考试大纲》的附录之一，它把商务活动中的交际功能项目分为生活和业务两大类","其中，生活类包括与商务活动有关的日常生活及社会交往活动","每一大类包括若干小类，每一小类列举了若干交际任务，如：生活类的签证，包括咨询、说明和办手续","业务类的招聘，包括招聘启事和面试","这些交际功能项目没有划分层级"],"q":"《商务汉语交际功能项目》把商务活动中的交际功能项目分为生活和业务两大类。其中，生活类包括与商务活动有关的日常生活及社会交往活动。","w":"normal","e":["核心考点"]},{"t":"《商务汉语常用词语表》","y":"名词解释","p":["《商务汉语常用词语表》是2006年出版的《商务汉语考试大纲》的附录之一，其中的词语包括商务业务以及与商务有关的生活、社交、工作中的常用词语，共2457个","按照词语的使用范围，这一词表分为两个表：表一收录与商务有关的生活、社交、工作类词语1035个，表二收录商务活动中的常用业务类词语1422个","大纲没有对这些商务词汇划分等级"],"q":"《商务汉语常用词语表》中的词语包括商务业务以及与商务有关的生活、社交、工作中的常用词语，共2457个。按照词语的使用范围，这一词表分为两个表。","w":"normal","e":["核心考点"]},{"t":"《旅游汉语功能大纲》","y":"名词解释","p":["《旅游汉语功能大纲》由上海师范大学对外汉语学院旅游汉语课题组于2008年编著出版","该大纲将功能细目分成五大类：组织旅游、景区游览、饭店实务、旅行社实务、旅游发展和相关管理","其中，组织旅游的侧重点放在组织、安排游客在旅游中的各项活动，重点在“导”","景区游览主要涉及旅游生活中的游览、娱乐、购物等各项活动，重点在“游”","各功能细目大多分为初、中、高三级"],"q":"《旅游汉语功能大纲》将功能细目分成五大类：组织旅游、景区游览、饭店实务、旅行社实务、旅游发展和相关管理。","w":"normal","e":["核心考点"]},{"t":"《旅游汉语词汇手册》","y":"名词解释","p":["《旅游汉语词汇手册》由上海师范大学对外汉语学院旅游汉语课题组于2008年编著出版，共收常用旅游汉语词语4674条，分为初、中、高三个级别，每个词条包括序号、词条、汉语拼音、词性和英语释义","此书为旅游汉语的教学、教材编写和旅游汉语考试提供了词语考试方面的范围和依据，可作为旅游汉语学习者、旅游者和旅游从业人员的工具书和学习参考书"],"q":"《旅游汉语词汇手册》共收常用旅游汉语词语4674条，分为初、中、高三个级别，每个词条包括序号、词条、汉语拼音、词性和英语释义。","w":"normal","e":["核心考点"]},{"t":"商务汉语","y":"名词解释","p":["就汉语作为第二语言而言，商务汉语是当前最热门的一门职业汉语","周小兵等（2008）认为：“商务汉语的教学目的是为了让学习者能用汉语从事与商务或经贸有关的活动","”商务汉语的教学重点是汉语语言技能的训练和商务专业知识的训练，其中商务专业知识的传授是浅层次的、通用的、常识性的，以满足现代社会商务交流的需要"],"q":"就汉语作为第二语言而言，商务汉语是当前最热门的一门职业汉语。周小兵等(2008) 认为：“商务汉语的教学目的是为了让学习者能用汉语从事与商务或经贸有关的活动。”","w":"normal","e":["核心考点"]},{"t":"简述商务汉语的课程设置。","y":"简答题","p":["学历生：一、二年级学通用汉语，三、四年级学商务汉语技能类和知识类课程","非学历生：需具备一定通用汉语基础，一般中高级班才开设","技能课程：商务汉语综合课、商务口语交际、商务写作、商务阅读、经贸洽谈等","知识类课程：世界经济概论、经济学原理、国际贸易实务、市场营销学等"],"q":"商务汉语方向的学历生，有的是一、二年级学通用汉语，三、四年级学商务汉语技能类和知识类课程……大部分高校开设的商务汉语技能课程主要有商务汉语综合课、商务口语交际、商务写作……","w":"normal","e":["核心考点"]},{"t":"职业类医学汉语与专业类医学汉语在课程目的和教学重点上有何不同？","y":"简答题","p":["职业类医学汉语：为适应实习工作，侧重听说能力和交际能力训练；对象已学通用汉语（HSK四级以上）","专业类医学汉语：为用汉语学临床医学专业，侧重阅读理解和听力理解训练；开设在本科一年级","职业类—帮助与病患医护人员交流；专业类—看懂教科书、听懂专业课","二者根本区别：一是面向职业实习，一是面向专业学习"],"q":"职业类医学汉语课程侧重于对学生听说能力和交际能力的训练……专业类医学汉语课程侧重于阅读理解和听力理解能力的训练。","w":"normal","e":["核心考点"]},{"t":"简述旅游汉语的课程特点及教学内容。","y":"简答题","p":["旅游汉语是一门职业汉语，应运而生","系列教材：游学中国、体验汉语旅游篇等","教学以口语交际为主","教学内容涵盖组织旅游、景区游览、饭店实务、旅行社实务、旅游发展和相关管理等"],"q":"基于职业汉语的特殊需要，目前国内的旅游汉语教学以口语交际为主，教学内容主要是与旅游整个行程相关的各项工作，包括组织旅游、景区游览、饭店实务、旅行社实务、旅游发展和相关管理等。","w":"normal","e":["核心考点"]},{"t":"简述警务汉语与军事汉语课程的基本情况。","y":"简答题","p":["警务汉语：为满足中外警界需求，速成培训；教材有《警务汉语》生活篇、专业篇等","警务汉语教材按HSK水平分级（零起点、HSK2-3级、HSK4级以上）","军事汉语：针对外军来华留学人员的日常生活和军营交流","军事汉语以口语交际为主，辅以提高听读能力；课程有孙子兵法、军事汉语阅读、中国军队概览等"],"q":"警务汉语 (生活篇)》，适合零起点学习者……军事汉语是针对外军来华留学人员的日常生活和军营交流，军事汉语的教学以口语交际为主。","w":"normal","e":["核心考点"]},{"t":"《商务汉语常用词语表》共收录常用词语______个，按照词语的使用范围分为两个表：表一收录与商务有关的生活、社交、工作类词语1035个，表二收录商务活动中的常用业务类词语______个。","y":"填空题","p":["2457","1422"],"q":"《商务汉语常用词语表》中的词语包括商务业务以及与商务有关的生活、社交、工作中的常用词语，共2457个……表二收录商务活动中的常用业务类词语1422个。","w":"normal","e":["核心考点"]},{"t":"与旅游汉语相关的功能大纲《旅游汉语功能大纲》由（　　）于2008年编著出版。","y":"单项选择题","p":["B"],"q":"目前，关于HSK(旅游) 的研发主要由上海师范大学对外汉语学院旅游汉语课题组负责。他们于2008年编著并出版了《旅游汉语功能大纲》和《旅游汉语词汇手册》。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c19-s03","t":"第三节 专用汉语教学方法","w":"normal","n":11,"k":[{"t":"迁移释义法","y":"名词解释","p":["迁移释义法是商务汉语专业术语教学方法之一，即引导学生利用已知的通用汉语词汇理解新的商务术语，促成从通用汉语词汇到商务专业术语的迁移","商务汉语中的专业术语抽象程度低，其中有不少术语与通用汉语的联系非常密切，甚至与通用汉语词汇有交叉重叠，如“索赔”“滞销”“疲软”“押金”等，适合运用迁移释义法教学"],"q":"迁移释义法就是引导学生利用已知的通用汉语词汇理解新的商务术语，促成从通用汉语词汇到商务专业术语的迁移。","w":"normal","e":["核心考点"]},{"t":"任务型教学法","y":"名词解释","p":["任务型教学法是20世纪80年代兴起的一种第二语言教学法，它是基于完成交际任务的语言教学方法，教学活动以学生为中心，教师根据教学内容设计具体的、具有明确目标的语言交际任务，让学生用目的语协商、讨论，完成任务，从而达到学习的目的","商务汉语教学强调交际性和实用性，特别适合用任务型教学法来开展教学活动"],"q":"任务型教学法是20世纪80年代兴起的一种第二语言教学法，它是基于完成交际任务的语言教学方法，教学活动以学生为中心，教师根据教学内容设计具体的、具有明确目标的语言交际任务。","w":"normal","e":["核心考点"]},{"t":"案例教学法","y":"名词解释","p":["案例教学法就是在教学中运用现实案例进行教学","案例常以书面的形式展示出来，学生在阅读、研究、讨论的基础上，通过教师的引导解决具体案例或疑难问题","针对教学中的难点或一些较为抽象的知识点，采用案例教学法，引入一些实例，或者师生一起讨论分析相关案例，可以让学生在实际的情景中把握相关的概念和知识点，也可以使某些枯燥的知识点变得生动起来，吸引学生兴趣，从而活跃课堂气氛","案例教学一般分为展示案例、分析与讨论、案例总结几个步骤"],"q":"案例教学法就是在教学中运用现实案例进行教学。案例常以书面的形式展示出来，学生在阅读、研究、讨论的基础上，通过教师的引导解决具体案例或疑难问题。","w":"normal","e":["核心考点"]},{"t":"简述商务汉语专业术语教学的主要方法。","y":"简答题","p":["迁移释义法——利用已知通用汉语词汇理解新的商务术语，促成迁移","例释法与图示法——举例子、借助图示帮助学生理解复杂抽象的术语","对比分析法——对成组出现的术语进行对比，掌握异同","避免就词论词，最终目的是让学生能在商务交际中正确使用"],"q":"以下介绍专业术语教学方法和商务汉语常用的任务型教学法及案例教学法。1. 迁移释义法……2. 例释法与图示法……3. 对比分析法……","w":"normal","e":["核心考点"]},{"t":"运用任务型教学法开展商务汉语教学活动需要注意哪些因素？","y":"简答题","p":["注重任务的真实性和实用性","不能忽略语言形式的输出","合理定位任务难度（可略高于现有水平）","合理安排与有效使用时间"],"q":"运用任务型教学法开展教学活动需要注意以下几方面的因素：第一，注重任务的真实性和实用性……第二，不能忽略语言形式的输出……第三，合理定位任务难度……第四，合理安排与有效使用时间。","w":"normal","e":["核心考点"]},{"t":"案例教学法的步骤有哪些？教师在案例讨论中应注意什么？","y":"简答题","p":["步骤：展示案例——分析与讨论——案例总结","展示案例：教师用PPT或书面展示案例，要求查阅读理论找依据","分析与讨论：分组讨论，组代表向全班阐述","案例总结：总结思路、重难点、解决问题的方法；评价表现作平时成绩","教师讨论中不轻易表露观点，避免学生依赖心理"],"q":"案例教学一般分为以下几个步骤。1. 展示案例……2. 分析与讨论……3. 案例总结……教师在讨论中不要轻易表露自己的观点，以免学生产生依赖心理。","w":"normal","e":["核心考点"]},{"t":"简述针对实习需求的医学汉语教学中生词（专业词语）的教学方法。","y":"简答题","p":["图片或实物展示法","表情动作解释法","适时归纳法（利用共同语素）","课文句子举例法（直接用课文语句作例句）"],"q":"生词学习重点在专业词语，这些词语基本上都是超纲词。专业词语的教学方法主要有：(1) 图片或实物展示法……(2) 表情动作解释法……(3) 适时归纳法……(4) 课文句子举例法……","w":"normal","e":["核心考点"]},{"t":"针对专业学习需求的医学汉语，课文教学常用哪些方法？","y":"简答题","p":["朗读法（教师带读、学生轮读、齐读）","图片、实物展示法或图表法","复述法（提示由多到少，从易到难）","小组协作法（克服畏难情绪）","归纳法（用简单语句概括、用图表概括）"],"q":"常用的方法有：(1) 朗读法……(2) 图片、实物展示法或图表法……(3) 复述法……(4) 小组协作法……(5) 归纳法……","w":"normal","e":["核心考点"]},{"t":"商务汉语专业术语教学方法主要有迁移释义法、______和______。","y":"填空题","p":["例释法与图示法","对比分析法"],"q":"以下介绍专业术语教学方法和商务汉语常用的任务型教学法及案例教学法。……1. 迁移释义法 2. 例释法与图示法 3. 对比分析法","w":"normal","e":["核心考点"]},{"t":"试述专用汉语（以商务汉语为例）的教学方法，并结合任务型教学法说明如何设计一堂商务汉语课的教学方案。","y":"论述题","p":["商务汉语教学以学生为本，突出交际性、实用性，注重师生互动与沟通","专业术语教学方法：迁移释义法、例释法与图示法、对比分析法","任务型教学法是20世纪80年代兴起、基于完成交际任务、以学生为中心的教学法","任务型教学主要环节：听对话输入—两人一组完成交际任务—公开表演并点评","运用任务型教学法注意事项：真实性实用性、语言形式输出、任务难度、时间安排"],"q":"任务型教学法是20世纪80年代兴起的一种第二语言教学法，它是基于完成交际任务的语言教学方法，教学活动以学生为中心……特别适合用任务型教学法来开展教学活动。","w":"normal","e":["核心考点"]},{"t":"【案例】某高校学习临床医学专业的留学生已学过通用汉语、HSK达到四级，并且已用英语学习了医学专业知识，即将进入中国医院见习和实习。为帮助他们适应实习工作，学校拟开设一门医学汉语课程。\n请回答：\n（1）该课程属于专用汉语中的哪一类？为什么？\n（2）该课程的教学环节应如何设计？各环节应采用哪些教学方法？\n（3）请结合该课程特点，说明其测试与评估方式应如何安排。","y":"案例分析题","p":["分类：属于职业汉语（职业类医学汉语）","理由：为从事医生职业见习实习需要，学习者已有职业知识储备，重点是掌握职业相关汉语表达，不传授职业知识","教学环节：生词学习—课文学习—口语训练—一般练习","生词教学方法：图片实物展示、表情动作解释、适时归纳、课文句子举例","课文教学方法：带读、朗读、分角色朗读、复述、总结病人情况","口语训练：看图对话和有信息差的对话两大类","测试评估：一般不进行课堂测试；期中期末以口试为主笔试为辅（口试70%、笔试30%）；平时成绩40%、考试成绩60%"],"q":"针对实习需求的医学汉语，教学环节可以分为生词学习、课文学习、口语训练和一般练习。……针对实习需求的医学汉语课程，其教学重点在于听说能力的训练，故一般不进行课堂测试。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c19-s04","t":"第四节 专用汉语的测试和评估","w":"normal","n":8,"k":[{"t":"BCT（商务汉语水平考试）","y":"名词解释","p":["BCT是商务汉语水平考试，面向全球，测试第一语言非汉语者从事商务活动所应具有的汉语水平","BCT作为一个考试系列，由BCT(A)、BCT(B)和BCT(口语)三个独立的考试组成：BCT(A)面向商务汉语初学者，考查考生运用汉语完成日常交际和基本商务交际任务的能力","BCT(B)面向商务汉语中高水平学习者，考查考生运用汉语完成较为复杂的商务交际任务的能力","BCT(口语)面向全部商务汉语学习者，通过网考形式，采用个性化、针对性的试题考查考生运用汉语口语完成各类交际任务的能力"],"q":"BCT面向全球，测试第一语言非汉语者从事商务活动所应具有的汉语水平。BCT作为一个考试系列，由BCT (A)、BCT (B) 和BCT (口语) 三个独立的考试组成。","w":"normal","e":["核心考点"]},{"t":"商务汉语考试（BCT）具有哪些特点？","y":"简答题","p":["注重商务实用：以用为本、听说导向、能力为重、定位职场","贯彻《商务汉语能力标准》，倡导考教结合","将商务文化纳入考查范围，提高跨文化交际能力"],"q":"商务汉语考试 (BCT) 具有以下特点：①注重商务实用……②贯彻《商务汉语能力标准》，倡导考教结合……③将商务文化纳入考查范围，以提高商务汉语学习者的跨文化交际能力。","w":"normal","e":["核心考点"]},{"t":"商务汉语的评估方式应如何确定？请结合不同课型说明其占比。","y":"简答题","p":["评估方式根据需求分析确定，包括平时成绩评估和考试成绩评估","根据课型特点确定平时成绩和考试成绩的占比","综合课以笔试为主：平时15%、期中25%、期末60%","听说课以口头考试为主：课堂测试25%、期中25%、期末50%","知识类课程以笔试为主，课堂测试与考试测试相结合"],"q":"商务汉语的评估方式应根据需求分析来确定，主要包括平时成绩评估和考试成绩评估。还要根据课型特点确定平时成绩和考试成绩的占比。","w":"normal","e":["核心考点"]},{"t":"简述医学汉语的测试方式及其成绩评估构成。","y":"简答题","p":["测试包括平时课堂测试和期中、期末考试","课堂测试一般为笔试，以听写形式出现","实习需求类：期中期末以口试为主、笔试为辅（如口试70%、笔试30%）","专业学习需求类：期中期末只设计笔试，题型与教材练习一致","平时成绩占40%，考试成绩占60%"],"q":"医学汉语的测试包括平时课堂测试和期中、期末考试。课堂测试一般为笔试，主要以听写形式出现……平时成绩一般占课程评估成绩的40%。","w":"normal","e":["核心考点"]},{"t":"针对实习需求的医学汉语期中、期末测试应以笔试为主、口试为辅。","y":"判断题","p":["错误","应以口试为主、笔试为辅"],"q":"针对实习需求的医学汉语期中、期末测试应以口试为主，笔试为辅。如口试占70%，笔试占30%。","w":"normal","e":["核心考点"]},{"t":"商务汉语考试（BCT）是一个包含BCT(A)、BCT(B)和BCT(口语)三个独立考试的系列考试。","y":"判断题","p":["正确","BCT由BCT(A)、BCT(B)、BCT(口语)三个独立考试组成"],"q":"BCT作为一个考试系列, 由BCT (A)、BCT (B) 和BCT (口语) 三个独立的考试组成。","w":"normal","e":["核心考点"]},{"t":"BCT是______的简称，它由BCT(A)、BCT(B)和BCT(______)三个独立的考试组成。","y":"填空题","p":["商务汉语水平考试","口语"],"q":"商务汉语水平考试(BCT) 就是其中的一种……由BCT (A)、BCT (B) 和BCT (口语) 三个独立的考试组成。","w":"normal","e":["核心考点"]},{"t":"医学汉语课程评估中，平时成绩一般占课程评估成绩的（　　）。","y":"单项选择题","p":["C"],"q":"平时成绩一般占课程评估成绩的40%。……考试成绩一般占课程评估成绩的60%。","w":"normal","e":["核心考点"]}]}]}]},{"d":"zhenti_10_23","t":"南师大汉硕10-23真题带答案","c":[{"id":"zhenti_10_23-c01","t":"全文","w":"high","s":[{"id":"zhenti_10_23-c01-s01","t":"全文","w":"high","n":348,"k":[{"t":"“的”字结构","y":"名词解释","p":["由结构助词“的”附加在其他词语之后构成
