词解释","p":["传统的看法是把第二语言教学归入语言学的范畴，其上位学科是应用语言学，甚至将狭义的应用语言学用来专指第二语言教学。","首先，第二语言教学所“应用”的理论不仅是语言学，还有心理学、教育学、文化学、社会学等，单单应用语言学理论解决不了语言教学的所有问题。","第二，语言学与语言教学之间的关系决不仅仅是“应用”。","第三，“应用语言学”这一名称非常笼统，不能明确地表示出本学科的内容。","第四，今天的语言教学已经进一步发现了自己的学科特征，明确了自己的发展方向，找到了自己的发展道路。"],"q":"传统的看法是把第二语言教学归入语言学的范畴，其上位学科是应用语言学，甚至将狭义的应用语言学用来专指第二语言教学。","w":"high","e":["2017 真题"]},{"t":"“对外汉语文化教学学科”论","y":"名词解释","p":["80年代后期至90年代初，对外汉语教学界就进行过一场语言与文化、语言教学与文化教学关系问题的热烈争论。","在讨论中也出现了一些比较偏颇的观点，如提出对外汉语教学要“突破汉语基础教育”……最后导致要把本学科的性质改为“对外汉语文化教学学科”。","1994年12月举行的“对外汉语教学的定性、定位、定量问题座谈会”，就学科的性质与内涵、对外汉语教学中语言教学与文化教学的关系等问题进行了深入的讨论，在一些原则问题上达成了共识。","会议重申了对外汉语教学作为第二语言教学的学科性质。"],"q":"80年代后期至90年代初，对外汉语教学界就进行过一场语言与文化、语言教学与文化教学关系问题的热烈争论。","w":"high","e":["2018 真题"]},{"t":"“小儿科”论","y":"名词解释","p":["60年代至70年代，对外汉语教学曾被看做是教外国人说中国话，教“人手足刀尺”的“小儿科”，认为“是个中国人就能教汉语”，不承认这是一门学科，需要什么学问。","这是早期的“学科否定论”。","持这种看法的，很多是对我们这一行实际上并不了解的“圈子外边”的人。","在国外，据统计，美国高等院校1986至1988年所开设的英语作为第二语言教学的硕士专业有120个，博士专业有18个，可见在美国也并非“是个美国人就能教英语”。"],"q":"60年代至70年代，对外汉语教学曾被看做是教外国人说中国话，教“人手足刀尺”的“小儿科”，认为“是个中国人就能教汉语”，不承认这是一门学科，需要什么学问。","w":"normal","e":["核心概念"]},{"t":"【原文】学科定位，是指某一学科在","y":"教材原文","p":["学科定位，是指某一学科在众多学科中的位置，也就是科学地确定它的门类归属问题，通常是由该学科的研究内容、任务和性质所决定的","学科定位问题之所以需要探讨，是因为它决定学科的发展方向"],"q":"学科定位，是指某一学科在众多学科中的位置，也就是科学地确定它的门类归属问题，通常是由该学科的研究内容、任务和性质所决定的。学科定位问题之所以需要探讨，是因为它决定学科的发展方向。","w":"normal","e":["原书正文"]},{"t":"【原文】对外汉语教育由于它研究内","y":"教材原文","p":["对外汉语教育由于它研究内容的特殊性，也由于它是一门综合交叉学科，受到多种学科理论的影响，因而在学科定位的问题上，多少年来一直存在不同的看法和争论"],"q":"对外汉语教育由于它研究内容的特殊性，也由于它是一门综合交叉学科，受到多种学科理论的影响，因而在学科定位的问题上，多少年来一直存在不同的看法和争论。","w":"normal","e":["原书正文"]},{"t":"【原文】一、“小儿科”论６０年代","y":"教材原文","p":["一、“小儿科”论６０年代至７０年代，对外汉语教学曾被看做是教外国人说中国话，教“人手足刀尺”的“小儿科”，认为“是个中国人就能教汉语”，不"],"q":"一、“小儿科”论６０年代至７０年代，对外汉语教学曾被看做是教外国人说中国话，教“人手足刀尺”的“小儿科”，认为“是个中国人就能教汉语”，不","w":"normal","e":["原书正文"]},{"t":"【原文】承认这是一门学科，需要什","y":"教材原文","p":["承认这是一门学科，需要什么学问","这是早期的“学科否定论”","持这种看法的，很多是对我们这一行实际上并不了解的“圈子外边”的人","众所周知，在医学科学中，小儿科也是一门精深的学科，而第二语言教学与研究真的就那么简单"],"q":"承认这是一门学科，需要什么学问。 这是早期的“学科否定论”。 持这种看法的，很多是对我们这一行实际上并不了解的“圈子外边”的人。 众所周知，在医学科学中，小儿科也是一门精深的学科，而第二语言教学与研究真的就那么简单？这些人只要回顾一下自己学习外语的经历，就不难体会到在较短的时间内教会成年人较熟练地掌握一种第二语言并非轻而易举之事。正因为如此，对对外汉语教师在","w":"normal","e":["原书正文"]},{"t":"【原文】随着对外汉语教育事业的迅","y":"教材原文","p":["随着对外汉语教育事业的迅速发展，我们的学科建设取得愈来愈明显的成就，不仅造就了一批本学科的专家，而且吸引了语言学界、心理学界、教育学界、文化学界的很多著名专家投人到这一领域中来","学科的影响日益扩大，学科的特点为更多的人所了解，特别是本学科在我国教育部的专业目录中被正式定为独立的专业，学科否定论的市场也就越来越小了"],"q":"随着对外汉语教育事业的迅速发展，我们的学科建设取得愈来愈明显的成就，不仅造就了一批本学科的专家，而且吸引了语言学界、心理学界、教育学界、文化学界的很多著名专家投人到这一领域中来。学科的影响日益扩大，学科的特点为更多的人所了解，特别是本学科在我国教育部的专业目录中被正式定为独立的专业，学科否定论的市场也就越来越小了。","w":"normal","e":["原书正文"]},{"t":"【原文】二、“对外汉语文化教学学","y":"教材原文","p":["二、“对外汉语文化教学学科”论在我们“圈子”内部也曾出现过有关学科性质和定位问题的不同意见","80年代后期至90年代初，对外汉语教学界就进行过一场语言与文化、语言教学与文化教学关系问题的热烈争论","关于语言与文化、语言教学与文化教学之间的关系，将在本书第四章第二节有系统的论述","本小节着重回顾一下争论中的主要论点"],"q":"二、“对外汉语文化教学学科”论在我们“圈子”内部也曾出现过有关学科性质和定位问题的不同意见。80年代后期至90年代初，对外汉语教学界就进行过一场语言与文化、语言教学与文化教学关系问题的热烈争论。关于语言与文化、语言教学与文化教学之间的关系，将在本书第四章第二节有系统的论述。 本小节着重回顾一下争论中的主要论点。","w":"normal","e":["原书正文"]},{"t":"【原文】对外汉语教学从初创时期开","y":"教材原文","p":["对外汉语教学从初创时期开始，就有在教材(主要是课文)中介绍有关中国社会文化的好传统","但对语言与文化之间的关系却--直缺乏理论上的探讨","在文革后的对外汉语教学恢复期，人们的注意"],"q":"对外汉语教学从初创时期开始，就有在教材(主要是课文)中介绍有关中国社会文化的好传统。但对语言与文化之间的关系却--直缺乏理论上的探讨。在文革后的对外汉语教学恢复期，人们的注意","w":"normal","e":["原书正文"]},{"t":"【原文】力很自然地集中于纠正过去","y":"教材原文","p":["力很自然地集中于纠正过去语言教学中过多的政治内容和强加于人的做法，并把对语言和语言教学的研究作为学科建立初期科学研究的重点","80年代初一些学者和教师就已开始探讨语言教学中的文化问题，但直至80年代中期，对语言教学中文化教学的研究尚未像对语言和语言教学的研究那样全面展开","由于80年代后期中、高级阶段的对外汉语教学的规模逐步扩大，外国学生更多地表现出对学习中国文化、了解中国社会的兴趣","同时也因为受到当时语言学界和文化学界的“文化研究热”的影响，以及我们自身对语言教学交际性原则的认识的提高，对外汉语教学界有更多的学者和教师关注并参与文化教学问题的研究，提出要进一步加强对外汉语教学中文化教学的正确主张，从而在本学科形成了研讨文化教学问题的热潮"],"q":"力很自然地集中于纠正过去语言教学中过多的政治内容和强加于人的做法，并把对语言和语言教学的研究作为学科建立初期科学研究的重点。80年代初一些学者和教师就已开始探讨语言教学中的文化问题，但直至80年代中期，对语言教学中文化教学的研究尚未像对语言和语言教学的研究那样全面展开。 由于80年代后期中、高级阶段的对外汉语教学的规模逐步扩大，外国学生更多地表现出对学习中国","w":"normal","e":["原书正文"]}]}]},{"id":"yinlun-c02","t":"第二章 汉语作为第二语言教学的发展与现状","w":"high","s":[{"id":"yinlun-c02-s01","t":"第一节 我国对外汉语教学的发展回顾","w":"high","n":18,"k":[{"t":"精讲多练","y":"名词解释","p":["钟梫《十五年汉语教学总结》一文中特别提到了“精讲多练”和“课内课外相结合”的实践性原则，用汉语进行课堂教学的直接性原则，教学内容与学生的专业相结合的学以致用原则，以及“语文并进”，听说读写全面要求、阶段侧重等主要的教学原则。","这些从长期教学实践中总结出来的宝贵经验，虽然还缺乏理论的指导和系统的阐述，但却是对对外汉语教学规律早期探索所得出的重要共识，对后来的教学得以坚持正确的方向起了保证作用，也为学科理论建设奠定了基础。"],"q":"钟梫《十五年汉语教学总结》一文中特别提到了“精讲多练”和“课内课外相结合”的实践性原则，用汉语进行课堂教学的直接性原则，教学内容与学生的专业相结合的学以致用原则，以及“语文并进”，听说读写全面要求、阶段侧重等主要的教学原则。","w":"high","e":["2018 真题"]},{"t":"汉语教科书","y":"名词解释","p":["1958年出版的我国第一套对外汉语教材《汉语教科书》"],"q":"1958年出版的我国第一套对外汉语教材《汉语教科书》","w":"high","e":["2025 真题"]},{"t":"北京语言学院","y":"名词解释","p":["经国务院批准，1962年6月在北京外国语学院外国留学生办公室的基础上正式成立“外国留学生高等预备学校”……是北京语言学院的前身。","1964年6月经国务院批准，外国留学生高等预备学校改名为北京语言学院，1996年又改名为北京语言文化大学。","这是我国第一所以对外汉语教学为主要任务的高等学校，它的成立结束了对外汉语教学依附于其他高等学校的情况，有了本学科自己的、独立的、稳定的基地。","北京语言文化大学至今仍是我国惟一的一所专门以对外国进修生、本科生、硕士研究生、博士研究生以及汉语进修教师进行汉语言、中国文化、中国文学、中国艺术和汉语教学理论教育为主要任务的大学。"],"q":"经国务院批准，1962年6月在北京外国语学院外国留学生办公室的基础上正式成立“外国留学生高等预备学校”……是北京语言学院的前身。","w":"high","e":["2021 真题"]},{"t":"东欧交换生中国语文专修班","y":"名词解释","p":["1950年成立的清华大学“东欧交换生中国语文专修班”于1951年初正式开课，拉开了新中国外国留学生汉语预备教育的帷幕。","清华大学校务委员会主任周培元教授兼任专修班班主任，著名语言学家吕叔湘先生任清华大学外籍留学生管理委员会主席并兼管专修班的业务工作。","第一年共接受来自东欧国家的33名留学生，学制为两年。"],"q":"1950年成立的清华大学“东欧交换生中国语文专修班”于1951年初正式开课，拉开了新中国外国留学生汉语预备教育的帷幕。","w":"high","e":["2016 真题"]},{"t":"国家对外汉语教学领导小组","y":"名词解释","p":["1987年7月国务院批准成立了由国家教委、国务院外事办公室、外交部、文化部、广播电影电视部、新闻出版署、国家语言文字工作委员会等政府部门及北京语言学院组成的“国家对外汉语教学领导小组”（1998年已扩展为由11个政府部门组成），由当时的国家教委负责人任组长。","日常工作由其常设机构“国家对外汉语教学领导小组办公室”（简称“汉办”）负责，第一任办公室主任为北京语言学院院长吕必松。","1993年国家教委发布的《中国教育改革和发展纲要》中更进一步提出要“大力加强对外汉语教学工作”。"],"q":"1987年7月国务院批准成立了由国家教委、国务院外事办公室、外交部、文化部、广播电影电视部、新闻出版署、国家语言文字工作委员会等政府部门及北京语言学院组成的“国家对外汉语教学领导小组”（1998年已扩展为由11个政府部门组成），由当时的国家教委负责人任组长。","w":"high","e":["2018 真题"]},{"t":"开创对外汉语教学事业时期","y":"名词解释","p":["对外汉语教学五十年的发展史，以1978年为界分为两个时期。1978年以前的20多年为第一时期，即“开创对外汉语教学事业”的时期，是我们对这项新的事业进行摸索、试验并不断积累经验的经验型时期。","开创事业时期（50年代初至70年代末）又可分为三个阶段，即初创阶段、巩固阶段和恢复阶段。"],"q":"对外汉语教学五十年的发展史，以1978年为界分为两个时期。1978年以前的20多年为第一时期，即“开创对外汉语教学事业”的时期，是我们对这项新的事业进行摸索、试验并不断积累经验的经验型时期。","w":"high","e":["2017 真题"]},{"t":"确立对外汉语教育学科时期","y":"名词解释","p":["1978年以后的20年为“确立对外汉语教育学科”的时期，是我们为使学科得到认定而自觉地进行学科建设，从理论和实践上探讨学科的规律并大力发展这一学科，由经验型向科学型转变的时期。","这20年又可分为80年代的“建构学科理论框架”阶段和90年代的“深化学科理论研究”阶段。","之所以提出以1978年为分界线……1978年是对外汉语教育学科发展的起点，这一年中国社会科学院召开的北京地区语言学科规划座谈会上，第一次提出把对外汉语教学“作为一个专门学科来研究”。"],"q":"1978年以后的20年为“确立对外汉语教育学科”的时期，是我们为使学科得到认定而自觉地进行学科建设，从理论和实践上探讨学科的规律并大力发展这一学科，由经验型向科学型转变的时期。","w":"high","e":["2017 真题"]},{"t":"“结构、功能、文化相结合”原则","y":"名词解释","p":["在深化理论研究的基础上，教学层面的应用研究也有了新的发展。与国外研究的趋势相一致，这一阶段对教学原则的研究和总结，成为教学法研究的重点。","特别是其中的“结构、功能、文化相结合”的原则，已成为带有中国特色的汉语作为第二语言教学的一项重要原则。","在教学法的研究方面，提出了“结构与功能相结合”的原则以及“交际性原则”，并紧密结合教学的需要对对外汉语预备教育、短期教育、进修教育及现代汉语专业的本科教育等门类的课程与教材进行了全面的改革试验。"],"q":"在深化理论研究的基础上，教学层面的应用研究也有了新的发展。与国外研究的趋势相一致，这一阶段对教学原则的研究和总结，成为教学法研究的重点。","w":"high","e":["2019 真题"]},{"t":"巩固阶段","y":"名词解释","p":["对外汉语教学进入巩固阶段的标志是，经国务院批准，1962年6月在北京外国语学院外国留学生办公室的基础上正式成立“外国留学生高等预备学校”。","从1962年到1965年，虽然只有短短的四年时间，我国对外汉语教学呈现了迅速发展的良好势头。首先表现在教学规模进一步扩大。","这四年间共接受外国留学生3944名，超过了前11年的总和。从事这项任务的学校也由一所发展到23所。"],"q":"对外汉语教学进入巩固阶段的标志是，经国务院批准，1962年6月在北京外国语学院外国留学生办公室的基础上正式成立“外国留学生高等预备学校”。","w":"normal","e":["核心概念"]},{"t":"恢复阶段","y":"名词解释","p":["恢复阶段(1972~1977年)……1972年6月北方交通大学首先接受了200名坦桑尼亚、赞比亚留学生。","1972年10月周恩来总理亲自批示恢复北京语言学院。经过不到一年的紧张筹备，北京语言学院于1973年秋季开始接受外国留学生。","由于“文化大革命”的破坏，教学工作多年中断，百废待兴，恢复阶段的对外汉语教学在校舍、设备、资料、教材、教师、管理等各方面都遇到了难以想像的困难。","1977年在校留学生总数为1217人，从1972年到1977年我国共接受留学生2266名。"],"q":"恢复阶段(1972~1977年)……1972年6月北方交通大学首先接受了200名坦桑尼亚、赞比亚留学生。","w":"normal","e":["核心概念"]},{"t":"【原文】在深化理论研究的基础上，","y":"教材原文","p":["在深化理论研究的基础上，教学层面的应用研究也有了新的发展","与国外研究的趋势相一致，这一阶段对教学原则的研究和总结，45"],"q":"在深化理论研究的基础上，教学层面的应用研究也有了新的发展。 与国外研究的趋势相一致，这一阶段对教学原则的研究和总结，45","w":"normal","e":["原书正文"]},{"t":"【原文】成为教学法研究的重点","y":"教材原文","p":["成为教学法研究的重点","特别是其中的“结构、功能、文化相结合”的原则，已成为带有中国特色的汉语作为第二语言教学的一项重要原则","对教学活动进行科学化、规范化的研究，又成为９０年代学科应用研究的另一个重点","已有数十年历史的对外汉语教学，随着规模的不断扩大，参与单位日益增多，教学质量的要求也在进一步提高"],"q":"成为教学法研究的重点。特别是其中的“结构、功能、文化相结合”的原则，已成为带有中国特色的汉语作为第二语言教学的一项重要原则。对教学活动进行科学化、规范化的研究，又成为９０年代学科应用研究的另一个重点。 已有数十年历史的对外汉语教学，随着规模的不断扩大，参与单位日益增多，教学质量的要求也在进一步提高。更好地解决教学中存在的盲目性、随意性和无序状态，对教学活动的","w":"normal","e":["原书正文"]},{"t":"【原文】上一节分阶段概括介绍了近","y":"教材原文","p":["上一节分阶段概括介绍了近半个世纪以来对外汉语教学事业和学科建设的发展历程，现在再从几个方面进一步总结一下这半个世纪(主要是近 20年来)所取得的成就"],"q":"上一节分阶段概括介绍了近半个世纪以来对外汉语教学事业和学科建设的发展历程，现在再从几个方面进一步总结一下这半个世纪(主要是近 20年来)所取得的成就。","w":"normal","e":["原书正文"]},{"t":"【原文】一、国家和民族的事业随着","y":"教材原文","p":["一、国家和民族的事业随着我国改革开放的不断深入，我国与世界各国在经济、文化、教育和科技等方面的交往日益密切频繁，中国需要了解世界，世界也需要了解中国","汉语作为各国人民间传递信息、交流科技文化、加强沟通与了解，且作为世界上使用人口最多的语言、联合国法定的一种工作语言，日益发挥着重要的媒介作用","在世界上形成一股“中国热”的同时，也自然地掀起了学习汉语的热潮，要求学习汉语以了解中国，发展与中国的友好合作关系的人越来越多","因此，人们对对外"],"q":"一、国家和民族的事业随着我国改革开放的不断深入，我国与世界各国在经济、文化、教育和科技等方面的交往日益密切频繁，中国需要了解世界，世界也需要了解中国。汉语作为各国人民间传递信息、交流科技文化、加强沟通与了解，且作为世界上使用人口最多的语言、联合国法定的一种工作语言，日益发挥着重要的媒介作用。在世界上形成一股“中国热”的同时，也自然地掀起了学习汉语的热潮，要求","w":"normal","e":["原书正文"]},{"t":"【原文】汉语教学有了新的认识","y":"教材原文","p":["汉语教学有了新的认识","其意义不仅局限于一种语言教学，它有助于世界人民了解中国，加强各国人民与中国人民的友好交往，有利于人类的和平进步事业","我国国家教委 １９８９年５月《关于印发〈全国对外汉语教学工作会议纪要〉的通知》一文中明确指出：“发展对外汉语教学事业是一项国家和民族的事业"],"q":"汉语教学有了新的认识。其意义不仅局限于一种语言教学，它有助于世界人民了解中国，加强各国人民与中国人民的友好交往，有利于人类的和平进步事业。我国国家教委 １９８９年５月《关于印发〈全国对外汉语教学工作会议纪要〉的通知》一文中明确指出：“发展对外汉语教学事业是一项国家和民族的事业。”","w":"normal","e":["原书正文"]},{"t":"【原文】正是出于上述原因，我国政","y":"教材原文","p":["正是出于上述原因，我国政府高度重视对外汉语教学工作，为了协调各有关方面的力量以加强对这项工作的领导与管理，１９８７年７月国务院批准成立了由国家教委、国务院外事办公室、外交部、文化部、广播电影电视部、新闻出版署、国家语言文字工作委员会等政府部门及北京语言学院组成的“国家对外汉语教学领导小组”(１９９８年已扩展为由１１个政府部门组成)，由当时的国家教委负责人任组长","日常工作由其常设机构“国家对外汉语教学领导小组办公室”(简称“汉办”)负责，第一任办公室主任为北京语言学院院长吕必松","领导小组的成立以及随后所做的一系列工作，特别是国家教委和国家对外汉语教学领导小组于 １９８８年９月联合召开的全国对外汉语教学工作会议，极大地鼓舞和推动了我国对外汉语教学工作的发展","１９９３年国家教委发布的《中国教育改革和发展纲要》中更进一步提出要“大力加强对外汉语教学工作”"],"q":"正是出于上述原因，我国政府高度重视对外汉语教学工作，为了协调各有关方面的力量以加强对这项工作的领导与管理，１９８７年７月国务院批准成立了由国家教委、国务院外事办公室、外交部、文化部、广播电影电视部、新闻出版署、国家语言文字工作委员会等政府部门及北京语言学院组成的“国家对外汉语教学领导小组”(１９９８年已扩展为由１１个政府部门组成)，由当时的国家教委负责人任组","w":"normal","e":["原书正文"]},{"t":"【原文】二、学科地位８０年代以来","y":"教材原文","p":["二、学科地位８０年代以来不少语言学界的专家、学术团体以及政府教育行政部门，就对外汉语教学的学科地位不断发表看法","１９８３年６月参加筹备成立“中国教育学会对外汉语教学研究会”的学者专家们正式提出了“对外汉语教学”的学科名称","中国教育学会在给该研究会成立大会的贺信中指出：“对外汉语教学已发展成为 一个新的学科"],"q":"二、学科地位８０年代以来不少语言学界的专家、学术团体以及政府教育行政部门，就对外汉语教学的学科地位不断发表看法。 １９８３年６月参加筹备成立“中国教育学会对外汉语教学研究会”的学者专家们正式提出了“对外汉语教学”的学科名称。 中国教育学会在给该研究会成立大会的贺信中指出：“对外汉语教学已发展成为 一个新的学科。”","w":"normal","e":["原书正文"]},{"t":"【原文】王力先生于１９８４年题词","y":"教材原文","p":["王力先生于１９８４年题词写道：“对外汉语教学是一门科学","”①① 王 力(1984)为《语言教学与研究》创刊五周年题词，《语言教学与研究》第３期"],"q":"王力先生于１９８４年题词写道：“对外汉语教学是一门科学。”①① 王 力(1984)为《语言教学与研究》创刊五周年题词，《语言教学与研究》第３期。","w":"normal","e":["原书正文"]}]},{"id":"yinlun-c02-s02","t":"第二节 我国对外汉语教学的发展现状","w":"high","n":11,"k":[{"t":"世界汉语教学学会","y":"名词解释","p":["1987年在北京举行第二届国际汉语教学讨论会期间，各国代表协商成立了“世界汉语教学学会”。","该会的成立是为了促进世界汉语教学与研究的交流与合作，推动世界汉语教学与研究的发展。","秘书处也一直设在北京语言学院，首任会长为朱德熙，现有30多个国家和地区的800多名会员。","1999年8月将举行第六届国际汉语教学讨论会。"],"q":"1987年在北京举行第二届国际汉语教学讨论会期间，各国代表协商成立了“世界汉语教学学会”。","w":"high","e":["2019 真题"]},{"t":"中国对外汉语教学学会","y":"名词解释","p":["1983年6月成立的“中国教育学会对外汉语教学研究会”于1988年独立为“中国对外汉语教学学会”，秘书处设在北京语言学院，首任会长为吕必松。","该会现有会员700多人，至今已举行过六届学术讨论会，并组织过多次国内外学术交流活动。","由于教学事业和学科研究发展的需要，1996年又先后成立了北京、华东、华北、华南和东北等五个地区分会。"],"q":"1983年6月成立的“中国教育学会对外汉语教学研究会”于1988年独立为“中国对外汉语教学学会”，秘书处设在北京语言学院，首任会长为吕必松。","w":"high","e":["2021 真题"]},{"t":"汉语言专业","y":"名词解释","p":["1975年，原北京语言学院开始试办以外国留学生为对象、以汉语作为第二语言的教育为特征的四年制“汉语言”专业本科，当初提出的培养目标为汉语教师、翻译和汉语研究人才。","接着南开大学、南京大学、复旦大学等院校也相继设立该专业，现在全国已有20多所大学设立了汉语言本科专业。","1996年北京语言文化大学又开设了外国留学生四年制“中国语言文化”本科专业。"],"q":"1975年，原北京语言学院开始试办以外国留学生为对象、以汉语作为第二语言的教育为特征的四年制“汉语言”专业本科，当初提出的培养目标为汉语教师、翻译和汉语研究人才。","w":"normal","e":["核心概念"]},{"t":"【原文】① 白乐桑(1993)法","y":"教材原文","p":["① 白乐桑(1993)法国汉语教学史浅论，《第四届国际汉语教学讨论会论文选》，北京语言学院出版社"],"q":"① 白乐桑(1993)法国汉语教学史浅论，《第四届国际汉语教学讨论会论文选》，北京语言学院出版社。","w":"normal","e":["原书正文"]},{"t":"【原文】语等作为第二语言的教学，","y":"教材原文","p":["语等作为第二语言的教学，在中学阶段就已打好较坚实基础的情况完全不同","大部分学习者仍把汉语作为选修科目，周课时很少( 一般1~2学时)，在教学方法上又大都强调阅读，以教师讲解语法为主，缺少听说技能的训练，这样就很难培养出能运用汉语的人才","即使是汉语专业的学生，也由于入学时起点太低，课程设置中又强调文学与文化课程，一般只在一、二年级每周有几节真正的汉语课，进行一定的技能训练","三、四年级则把全部精力用于主要是通过母语或媒介语进行的“学术性”的中国文学或文化的教学"],"q":"语等作为第二语言的教学，在中学阶段就已打好较坚实基础的情况完全不同。大部分学习者仍把汉语作为选修科目，周课时很少( 一般1~2学时)，在教学方法上又大都强调阅读，以教师讲解语法为主，缺少听说技能的训练，这样就很难培养出能运用汉语的人才。 即使是汉语专业的学生，也由于入学时起点太低，课程设置中又强调文学与文化课程，一般只在一、二年级每周有几节真正的汉语课，进行","w":"normal","e":["原书正文"]},{"t":"【原文】从上面分析可以看出，世界","y":"教材原文","p":["从上面分析可以看出，世界范围内的汉语作为第二语言的教学虽然有了很大的发展，但其现状与汉语作为世界上最大语种的地位、中国古老文明对世界的影响和今天中国在世界上所发挥的作用很不相称","在期望新世纪中国进一步繁荣昌盛会给汉语教学带来发展新动力的同时，不论是中国对外汉语教学界还是世界汉语教学界的同仁，都需要把大力推广汉语教学、促进汉语教学的大发展作为当前的首要任务"],"q":"从上面分析可以看出，世界范围内的汉语作为第二语言的教学虽然有了很大的发展，但其现状与汉语作为世界上最大语种的地位、中国古老文明对世界的影响和今天中国在世界上所发挥的作用很不相称。在期望新世纪中国进一步繁荣昌盛会给汉语教学带来发展新动力的同时，不论是中国对外汉语教学界还是世界汉语教学界的同仁，都需要把大力推广汉语教学、促进汉语教学的大发展作为当前的首要任务。","w":"normal","e":["原书正文"]},{"t":"【原文】阅读参考文献吕必松 19","y":"教材原文","p":["阅读参考文献吕必松 1990 《对外汉语教学发展概要》，北京语言学院出版社"],"q":"阅读参考文献吕必松 1990 《对外汉语教学发展概要》，北京语言学院出版社。","w":"normal","e":["原书正文"]},{"t":"【原文】施光亨等 １９９４ 《对","y":"教材原文","p":["施光亨等 １９９４ 《对外汉语教学是一门新型的学科》，北京语言学院出版社"],"q":"施光亨等 １９９４ 《对外汉语教学是一门新型的学科》，北京语言学院出版社。","w":"normal","e":["原书正文"]},{"t":"【原文】赵金铭 1996 对外汉","y":"教材原文","p":["赵金铭 1996 对外汉语教学与研究的现状与前瞻，《中国语文》第6期"],"q":"赵金铭 1996 对外汉语教学与研究的现状与前瞻，《中国语文》第6期。","w":"normal","e":["原书正文"]},{"t":"【原文】北京语言学院 1991 ","y":"教材原文","p":["北京语言学院 1991 《世界汉语教学概况》，国际文化出版公司"],"q":"北京语言学院 1991 《世界汉语教学概况》，国际文化出版公司。","w":"normal","e":["原书正文"]},{"t":"【原文】周建民(整理) １９９４","y":"教材原文","p":["周建民(整理) １９９４ 世界部分国家、地区汉语教学综述，《第四届国际汉语教学讨论会论文选》，北京语言学院出版社"],"q":"周建民(整理) １９９４ 世界部分国家、地区汉语教学综述，《第四届国际汉语教学讨论会论文选》，北京语言学院出版社。","w":"normal","e":["原书正文"]}]},{"id":"yinlun-c02-s03","t":"第三节 世界汉语教学的发展特点","w":"normal","n":10,"k":[{"t":"五个“C”","y":"名词解释","p":["文件提出了用来概括21世纪第二语言教育的目标和学习标准的5个“C”：Communication（运用语言进行交际）、Cultures（体认多元文化）、Connections（贯连其他学科）、Comparisons（通过比较了解语言文化的特性）、Communities（应用于国内和国外的多元社区）。","美国“外语教育委员会”(ACTFL)等40多个单位在联邦政府教育部和全美人文基金会的资助下，用了数年的时间于1996年完成了《外语学习的标准：迎接21世纪》的研究项目，提出了新世纪第二语言(外语)教育的纲领。"],"q":"文件提出了用来概括21世纪第二语言教育的目标和学习标准的5个“C”：Communication（运用语言进行交际）、Cultures（体认多元文化）、Connections（贯连其他学科）、Comparisons（通过比较了解语言文化的特性）、Communities（应用于国内和国外的多元社区）。","w":"normal","e":["核心概念"]},{"t":"非普遍教授语言","y":"名词解释","p":["（1）学习汉语的人数迅速增长，教学规模不断扩大，但在世界绝大多数地区汉语仍属“非普遍教授语言”。","当时美国学习外语的大、中学生中91%选择西、法、德三大“普遍教授语言”，其余的所有被称为“非普遍教授语言”的都包括在9%之中。","而汉语与日语、阿语、朝语、东南亚语、非洲语及葡语、北欧语等数十种语言一起，又只占其中的1%不到。"],"q":"（1）学习汉语的人数迅速增长，教学规模不断扩大，但在世界绝大多数地区汉语仍属“非普遍教授语言”。","w":"normal","e":["核心概念"]},{"t":"【原文】所以，交际能力既包括语言","y":"教材原文","p":["所以，交际能力既包括语言能力，也包括语言运用的能力","不仅要求掌握语言规则，也要求掌握语言运用规则","除了语言知识外，还涉及社会、文化、心理等多方面的因素和知识，是多层次的复杂的知识和技能体系","语言能力和语言交际能力的理论，对对外汉语教学有重要的意义：培养汉语交际能力已成为对外汉语教学目标的共识"],"q":"所以，交际能力既包括语言能力，也包括语言运用的能力。不仅要求掌握语言规则，也要求掌握语言运用规则。除了语言知识外，还涉及社会、文化、心理等多方面的因素和知识，是多层次的复杂的知识和技能体系。语言能力和语言交际能力的理论，对对外汉语教学有重要的意义：培养汉语交际能力已成为对外汉语教学目标的共识。第二语言学习过程是创造性的认知过程，要充分发挥学习者的认知能力，使","w":"normal","e":["原书正文"]},{"t":"【原文】2.语言形式和语言功能语","y":"教材原文","p":["2.语言形式和语言功能语言形式通常指语音、语法、词汇等语言的结构体系，也称语言结构","语言功能指语言所能发挥的作用","形式主义语言学注重研究语言的形式结构，所涉及到的语言功能也往往是结构功能和语法功能","如各类语言单位在其上一层次结构中所担任的角色(充当主语或谓语等语法功能)，以及一类语言单位区别于其他语言单位的作用(辨义功能或指称功能等)"],"q":"2.语言形式和语言功能语言形式通常指语音、语法、词汇等语言的结构体系，也称语言结构。语言功能指语言所能发挥的作用。形式主义语言学注重研究语言的形式结构，所涉及到的语言功能也往往是结构功能和语法功能。如各类语言单位在其上一层次结构中所担任的角色(充当主语或谓语等语法功能)，以及一类语言单位区别于其他语言单位的作用(辨义功能或指称功能等)。随着社会语言学的兴起，","w":"normal","e":["原书正文"]},{"t":"【原文】韩礼德认为儿童在语言发展","y":"教材原文","p":["韩礼德认为儿童在语言发展过程中就掌握了七种功能：工具功能----用语言来达到自己的愿望和要求","控制功能———用语言来支配或控制别人的行为","交往功能——用语言与别人交际"],"q":"韩礼德认为儿童在语言发展过程中就掌握了七种功能：工具功能----用语言来达到自己的愿望和要求；控制功能———用语言来支配或控制别人的行为；交往功能——用语言与别人交际；表达个体功","w":"normal","e":["原书正文"]},{"t":"【原文】能——用语言表达自己的个","y":"教材原文","p":["能——用语言表达自己的个性、感情，发现自我","启发功能——用语言询问以认识周围的世界","想像功能——用语言创造自己想像中的世界","信息功能——用语言传递信息，是儿童掌握得最晚的功能"],"q":"能——用语言表达自己的个性、感情，发现自我；启发功能——用语言询问以认识周围的世界；想像功能——用语言创造自己想像中的世界；信息功能——用语言传递信息，是儿童掌握得最晚的功能。他把成人的语言功能归纳为三种：观念功能———表达主观经验和客观经验；交际功能——表达社会关系和私人关系；话语功能-——使语言的组成部分连贯衔接。","w":"normal","e":["原书正文"]},{"t":"【原文】２０年来，对语言功能的研","y":"教材原文","p":["２０年来，对语言功能的研究，特别是对语言功能的分类和对语言功能与语言形式之间的对应关系等方面的研究不断深入，对语言教学也就产生了愈来愈大的影响","语言形式与语言功能是语言的两个重要方面，也是第二语言教学包括对外汉语教学的两项主要内容","长期以来人们只重视语言结构的教学而忽视语言功能的教学","70年代以来，由于功能法的推动，对语言功能的研究和教学已逐渐成为本学科的热点之一"],"q":"２０年来，对语言功能的研究，特别是对语言功能的分类和对语言功能与语言形式之间的对应关系等方面的研究不断深入，对语言教学也就产生了愈来愈大的影响。语言形式与语言功能是语言的两个重要方面，也是第二语言教学包括对外汉语教学的两项主要内容。长期以来人们只重视语言结构的教学而忽视语言功能的教学。70年代以来，由于功能法的推动，对语言功能的研究和教学已逐渐成为本学科的热","w":"normal","e":["原书正文"]},{"t":"【原文】3.话语分析和会话分析传","y":"教材原文","p":["3.话语分析和会话分析传统的语言研究局限于对句子本身及其组成部分的语法分析，而在实际语言交际中仅使用孤立的单个句子的情况并不多","交际活动中所使用的语言单位，一般都是由许多连贯的句子组成的对话或独白","因此要理解语言的意义和语言的交际功能，要运用语言进行交际，仅仅研究句子远远不够","必须研究句子之间、句子与语境之间的关系，研究句子在比其更大的语言单位中的作用"],"q":"3.话语分析和会话分析传统的语言研究局限于对句子本身及其组成部分的语法分析，而在实际语言交际中仅使用孤立的单个句子的情况并不多。交际活动中所使用的语言单位，一般都是由许多连贯的句子组成的对话或独白。因此要理解语言的意义和语言的交际功能，要运用语言进行交际，仅仅研究句子远远不够。必须研究句子之间、句子与语境之间的关系，研究句子在比其更大的语言单位中的作用。仅仅","w":"normal","e":["原书正文"]},{"t":"【原文】(2)*您认识张先生吗?","y":"教材原文","p":["(2)*您认识张先生吗? 我爷爷常常出去散步，今天的电视很糟糕"],"q":"(2)*您认识张先生吗? 我爷爷常常出去散步，今天的电视很糟糕。","w":"normal","e":["原书正文"]},{"t":"【原文】例(1)对话中“您”与“","y":"教材原文","p":["例(1)对话中“您”与“我”衔接，一问一答语义连贯，完成了一次询问或介绍的交际行为，是一个完整的话语","例(2)中的几个句子既无衔接关系，也没有意义上的连贯性，只是杂乱地堆放在一起，除非是文学创作中的意识流手法，不能算作话语","话语从形式上看通常是大于句子的语言单位，可能是句组、段落甚至篇章","也可能只是一个句子，一个短语甚至一个词"],"q":"例(1)对话中“您”与“我”衔接，一问一答语义连贯，完成了一次询问或介绍的交际行为，是一个完整的话语。例(2)中的几个句子既无衔接关系，也没有意义上的连贯性，只是杂乱地堆放在一起，除非是文学创作中的意识流手法，不能算作话语。话语从形式上看通常是大于句子的语言单位，可能是句组、段落甚至篇章；也可能只是一个句子，一个短语甚至一个词。 话语既包括口语，也包括书面语","w":"normal","e":["原书正文"]}]}]},{"id":"yinlun-c03","t":"第三章 对外汉语教学的语言学基础和教育学基础","w":"high","s":[{"id":"yinlun-c03-s01","t":"第一节 对外汉语教学的语言学基础(一)","w":"high","n":13,"k":[{"t":"语言能力","y":"名词解释","p":["乔姆斯基在60年代提出“语言能力”的概念，并将内在的“语言功能”与“语言表现”，即对语言的实际运用做了区分。","所谓“语言能力”是指人们所具有的语言知识，是一种内化了的包括语音、词汇、语法等的语言规则体系。","根据转换生成语言理论，一个人的语言能力主要表现在能正确组合声音和语素；能区分是否合乎语法的句子；能区分结构相同或相似但意义不同的句子等；而最根本之点则是能运用这一有限的规则体系创造出无限的句子。","可见“语言能力”主要是与语言形式结构有关，实际上是一种高度抽象的语法能力，是一种脱离外部语言环境的、人的内部心理机制。"],"q":"乔姆斯基在60年代提出“语言能力”的概念，并将内在的“语言功能”与“语言表现”，即对语言的实际运用做了区分。","w":"high","e":["2018 真题"]},{"t":"语言和言语","y":"名词解释","p":["根据瑞士语言学家索绪尔对语言（langue）和言语（parole）的区分，语言是对言语的抽象和概括，常常指作为社会惯例的语音、词汇、语法的规则系统；言语是语言的表现形式，也可以说是个人对语言在特定环境中的运用。","语言存在于言语之中，通过言语来体现，平常我们接触到(听到、看到)都是具体的言语。","两者的关系好比“人”和张三、李四的关系：张三、李四是“人”的具体表现形式，而“人”是对张三、李四等很多人的特点的抽象。"],"q":"根据瑞士语言学家索绪尔对语言（langue）和言语（parole）的区分，语言是对言语的抽象和概括，常常指作为社会惯例的语音、词汇、语法的规则系统；言语是语言的表现形式，也可以说是个人对语言在特定环境中的运用。","w":"high","e":["2017 真题"]},{"t":"转换生成语法","y":"名词解释","p":["20世纪中期在美国出现了转换生成语法学派，其标志是1957年美国麻省理工学院乔姆斯基的《句法结构》一书的出版。","他提出区分“语言能力”——人们内化了的语言规则体系和“语言表现”——语言能力的实际运用。","为此，他提出“语言习得机制”和“普遍语法”的假说和“深层结构”、“表层结构”的理论。这样就把语言学的触角伸向人类认知领域，探讨语言的心理过程。","转换生成语法学派的出现，称为“乔姆斯基革命”，开拓了语言研究的新领域。"],"q":"20世纪中期在美国出现了转换生成语法学派，其标志是1957年美国麻省理工学院乔姆斯基的《句法结构》一书的出版。","w":"high","e":["2017 真题"]},{"t":"结构主义语言学","y":"名词解释","p":["20世纪初语言学进入新的发展时期。1906年到1911年瑞士语言学家索绪尔在日内瓦大学讲授普通语言学，1916年由他的学生整理出版了他的讲稿《普通语言学教程》。","索绪尔被公认为现代语言学的主要奠基人，其语言理论也成了现代语言学的指导思想。","索绪尔语言理论的核心是语言是符号系统，这一系统由很多小系统组成；符号由“能指”(形式)和“所指”(概念)两部分构成。","在30年代有三个学派：强调语言符号的功能的布拉格功能语言学派，强调语言符号间各种关系的哥本哈根语符学派，强调共时描写语言事实的美国描写语言学派。"],"q":"20世纪初语言学进入新的发展时期。1906年到1911年瑞士语言学家索绪尔在日内瓦大学讲授普通语言学，1916年由他的学生整理出版了他的讲稿《普通语言学教程》。","w":"high","e":["2018 真题"]},{"t":"功能主义语言学","y":"名词解释","p":["60年代末、70年代功能主义语言学兴起，标志着语言研究重点由语言形式转向语言功能，这是语言学研究领域又一次拓宽。","功能主义学派的代表人物有英国的韩礼德、法国的马丁内等著名语言学家，中心在欧洲。","以弗斯为奠基人的伦敦功能结构语言学派认为语言的本质是意义——语言环境中的意义，语义是语言研究的中心，主张从社会的角度去观察、研究语言，强调语言的社会性。","韩礼德继承和发展了弗斯的理论，建立了系统——功能语法理论，以“系统语法”为框架论述语言功能。"],"q":"60年代末、70年代功能主义语言学兴起，标志着语言研究重点由语言形式转向语言功能，这是语言学研究领域又一次拓宽。","w":"high","e":["2020 真题"]},{"t":"【原文】4.教学原则教学原则是从","y":"教材原文","p":["4.教学原则教学原则是从一定的教育和教学目的出发，在教学实践的基础上，根据对教学过程客观规律的认识而制订的指导教学工作的基本要求","教学原则对一切教学活动，包括教学计划的制定、教学内容的选择、教学过程的组织、教学方法手段的运用都有指导作用","教学原则反映了在教学实践中通过发现和处理教学中的各种基本矛盾关系而总结出的教学规律","教学原则有继承性，像早在17世纪由夸美纽斯第一次系统提出的直观性、自觉性、系统性、巩固性、量力性五大教学原则，在一定程度上反映了教学规律，至今仍有指导意义"],"q":"4.教学原则教学原则是从一定的教育和教学目的出发，在教学实践的基础上，根据对教学过程客观规律的认识而制订的指导教学工作的基本要求。教学原则对一切教学活动，包括教学计划的制定、教学内容的选择、教学过程的组织、教学方法手段的运用都有指导作用。教学原则反映了在教学实践中通过发现和处理教学中的各种基本矛盾关系而总结出的教学规律。教学原则有继承性，像早在17世纪由夸美","w":"normal","e":["原书正文"]},{"t":"【原文】(1) 科学性与思想性相","y":"教材原文","p":["(1) 科学性与思想性相结合的原则","指对学生传授的科学知识应体现科学的正确性，能体现本学科的发展水平，同时还要在科学性中包含并渗透思想性","本项原则体现了对学生传授科学知识的同时，要进行思想品德教育","这是两项紧密结合的教学任务"],"q":"(1) 科学性与思想性相结合的原则。指对学生传授的科学知识应体现科学的正确性，能体现本学科的发展水平，同时还要在科学性中包含并渗透思想性。本项原则体现了对学生传授科学知识的同时，要进行思想品德教育。这是两项紧密结合的教学任务。","w":"normal","e":["原书正文"]},{"t":"【原文】(2) 知识传授与智能发","y":"教材原文","p":["(2) 知识传授与智能发展相结合的原则","指既要使学生积累知识，同时又要发展学生的智力，培养能力并使其个性得到发展"],"q":"(2) 知识传授与智能发展相结合的原则。指既要使学生积累知识，同时又要发展学生的智力，培养能力并使其个性得到发展。只有94","w":"normal","e":["原书正文"]},{"t":"【原文】在宽厚专精的知识基础上，","y":"教材原文","p":["在宽厚专精的知识基础上，才能发展智能、个性","另一方面，有了发达的智能与健全的个性，则有利于新知识的积累"],"q":"在宽厚专精的知识基础上，才能发展智能、个性。另一方面，有了发达的智能与健全的个性，则有利于新知识的积累。","w":"normal","e":["原书正文"]},{"t":"【原文】(3) 理论联系实际与理","y":"教材原文","p":["(3) 理论联系实际与理论知识为主导相结合的原则","要求教学中理论与实际的统一","教学过程作为一种特殊的认识过程，其目的是要求学生掌握理论","只有首先掌握理论才说得上联系实际"],"q":"(3) 理论联系实际与理论知识为主导相结合的原则。要求教学中理论与实际的统一。教学过程作为一种特殊的认识过程，其目的是要求学生掌握理论。只有首先掌握理论才说得上联系实际。但如果只停留在掌握理论这一步，则很容易脱离实际。 因此教学中应当首先引导学生掌握基本理论，同时培养运用理论分析、解决实际问题的能力，将所学的知识在实践中运用。","w":"normal","e":["原书正文"]},{"t":"【原文】(4) 教师的主导作用与","y":"教材原文","p":["(4) 教师的主导作用与学生主动性、自觉性相结合的原则","作为有目的、有计划的学校教育，教师在任何情况下都应起主导作用","同时，教学活动的成败又完全体现在学生的学习效果上","学生获得知识要通过自己的思维活动，启发学生学习的主动性、自觉性、积极性就成了完成教学任务的关键"],"q":"(4) 教师的主导作用与学生主动性、自觉性相结合的原则。作为有目的、有计划的学校教育，教师在任何情况下都应起主导作用。同时，教学活动的成败又完全体现在学生的学习效果上。学生获得知识要通过自己的思维活动，启发学生学习的主动性、自觉性、积极性就成了完成教学任务的关键。这条原则体现了教学过程中教师与学生关系的规律。","w":"normal","e":["原书正文"]},{"t":"【原文】(5) 统一的培养要求与","y":"教材原文","p":["(5) 统一的培养要求与因材施教相结合的原则","这反映了人材培养中共性与个性关系的原则","根据培养目标，对学生有统一的、基本的要求和规格，同时要考虑到学生在水平、能力、素质方面的个别差异，进行因材施教","这包括针对不同类型学生的特点进行“有的放矢”的教学"],"q":"(5) 统一的培养要求与因材施教相结合的原则。这反映了人材培养中共性与个性关系的原则。根据培养目标，对学生有统一的、基本的要求和规格，同时要考虑到学生在水平、能力、素质方面的个别差异，进行因材施教。这包括针对不同类型学生的特点进行“有的放矢”的教学；对“优生”及有特殊才能的学生给予特殊的指导以发挥其专长；对“差生”给予特殊的关注使其成才。这就要求教学工作在面","w":"normal","e":["原书正文"]},{"t":"【原文】(6) 系统性与循序渐进","y":"教材原文","p":["(6) 系统性与循序渐进性相结合的原则","任何学科知识都有其逻辑结构形成的科学体系，教给学生的知识必须体现学科知识的系统性","另一方面，学生的认知活动又有其本身的规律性，必须遵循由已知到未知、由浅入深的循序渐进的原则","本原则体现了教学活动中知识的系统性、完整性与学生的认知规律之间的关系"],"q":"(6) 系统性与循序渐进性相结合的原则。任何学科知识都有其逻辑结构形成的科学体系，教给学生的知识必须体现学科知识的系统性。另一方面，学生的认知活动又有其本身的规律性，必须遵循由已知到未知、由浅入深的循序渐进的原则。本原则体现了教学活动中知识的系统性、完整性与学生的认知规律之间的关系。","w":"normal","e":["原书正文"]}]},{"id":"yinlun-c03-s02","t":"第二节 对外汉语教学的语言学基础(二)","w":"high","n":15,"k":[{"t":"话语","y":"名词解释","p":["简单说来，话语是在交际过程中一定语境下表示完整语义的自然语言，是由结构衔接、语义连贯、排列符合逻辑来表达某个主题的连续的句子所构成的语言整体。","话语从形式上看通常是大于句子的语言单位，可能是句组、段落甚至篇章；也可能只是一个句子，一个短语甚至一个词。","话语既包括口语，也包括书面语。"],"q":"简单说来，话语是在交际过程中一定语境下表示完整语义的自然语言，是由结构衔接、语义连贯、排列符合逻辑来表达某个主题的连续的句子所构成的语言整体。","w":"high","e":["2018 真题"]},{"t":"交际能力","y":"名词解释","p":["社会语言学家海姆斯在60年代提出了不同的看法，他认为一个人的语言能力不仅指能否说出合乎语法的句子，还包括能否在一定的语言环境中恰当地使用语言的能力。","海姆斯首次提出了“交际能力”（communicative competence）的概念，即运用语言（或非语言手段)进行社会交往的能力，包括传递信息、交流思想和表达感情。","海姆斯还进一步提出了交际能力的四个特征：语法性——指语法上是否正确；可接受性——在交际中能否被接受；得体性——在一定的语境中是否恰当，是否合乎社会文化习惯；现实性——是否是现实中常用的。","交际能力既包括语言能力，也包括语言运用的能力。"],"q":"社会语言学家海姆斯在60年代提出了不同的看法，他认为一个人的语言能力不仅指能否说出合乎语法的句子，还包括能否在一定的语言环境中恰当地使用语言的能力。","w":"high","e":["2019 真题"]},{"t":"会话分析","y":"名词解释","p":["由于会话是口头表达的一种常见形式，对日常会话的结构与规律进行分析的“会话分析”已成为话语分析的重要组成部分。","70年代美国社会学家萨克斯等分析自然话语，指出会话的特点是“话轮替换”（turn-taking），发话人从头至尾连续的一段话称为一个“话轮”(turn)，会话中每次须保持一人说话。","会话结构的基本单位是“毗邻应对”(adjacency pair)，即会话双方的发话与应对一前一后紧密相连；有时也会出现“插入序列”甚至出现打断发话者的“分岔序列”。"],"q":"由于会话是口头表达的一种常见形式，对日常会话的结构与规律进行分析的“会话分析”已成为话语分析的重要组成部分。","w":"high","e":["2016 真题"]},{"t":"合作原则","y":"名词解释","p":["60年代中期美国语言哲学家格赖斯提出了会话含义理论，他认为会话能顺利进行需要双方互相配合，共同遵守一些基本原则。他提出“合作原则”，包括四项准则。","四项准则：(1)质的准则——所说的话要真实，不要说自知是虚假的话，或缺乏足够证据的话。(2)量的准则——所说的话应包含交谈目的所需要的信息，而不要包含超出需要的信息。(3)关系准则——所说的话必须是有关的，要切题。(4)方式准则——所说的话要清楚，有条理，简练，避免晦涩、歧义。"],"q":"60年代中期美国语言哲学家格赖斯提出了会话含义理论，他认为会话能顺利进行需要双方互相配合，共同遵守一些基本原则。他提出“合作原则”，包括四项准则。","w":"high","e":["2018 真题"]},{"t":"会话含义","y":"名词解释","p":["对“会话含义”（conversational implicature）的研究实际上就是对会话中说话者的言外之意的研究。","所以会话含义是指会话中说话者因违反“合作原则”而产生的言外之意。","但在实际语言交际中，人们常常出于某种礼貌或其他目的，故意违反这些合作原则，从而产生言外之意让听话者去领会。","格赖斯会话含义理论后来不断得到补充和完善。"],"q":"对“会话含义”（conversational implicature）的研究实际上就是对会话中说话者的言外之意的研究。","w":"high","e":["2018 真题"]},{"t":"言语行为理论","y":"名词解释","p":["50年代末英国哲学家奥斯汀提出“言语行为”理论（speech act theory）。","他指出语言不仅是描写、陈述和说明客观世界，提供信息，而且人们说出话语也是一种行为。人们在说话的时候，就是在做一件事，完成一种行为。","奥斯汀认为人们所说出的话语能同时进行三种行为，即言内行为、言外行为和言后行为。","仍以“屋里很热”这句话为例，言内行为是说话人通过发声把这句话说出来；言外行为则是通过这句话来表达隐含的真正意图，也就是言外之意；言后行为则是指这句话对听话人所产生的影响。"],"q":"50年代末英国哲学家奥斯汀提出“言语行为”理论（speech act theory）。","w":"high","e":["2019 真题"]},{"t":"语言形式与语言功能","y":"名词解释","p":["语言形式通常指语音、语法、词汇等语言的结构体系，也称语言结构。语言功能指语言所能发挥的作用。","随着社会语言学的兴起，强调语言作为交际工具的职能，人们更重视语言的交际功能。这里所说的语言功能，就是指用语言做事，或者说用语言完成交际任务。","韩礼德认为儿童在语言发展过程中就掌握了七种功能：工具功能、控制功能、交往功能、表达个体功能、启发功能、想像功能、信息功能。","他把成人的语言功能归纳为三种：观念功能、交际功能、话语功能。"],"q":"语言形式通常指语音、语法、词汇等语言的结构体系，也称语言结构。语言功能指语言所能发挥的作用。","w":"high","e":["2020 真题"]},{"t":"【原文】择性。生活中的某件事情、","y":"教材原文","p":["生活中的某件事情、老师讲的或书本上的某一句话，可能无意中给学习者留下了深刻的印象，以至终生难忘","无意识记在第二语言学习和教学中常常起到意料不到的效果","无意识记需要轻松愉快的气氛和松弛、无压力的精神状态，从而极大地发挥识记的潜能，增强识记的效果","在第二语言学习中创造好的语言环境，让学生多接触目的语，通过无意识记获得第二语言，是第二语言教学中特别需要加强的一个方面"],"q":"择性。生活中的某件事情、老师讲的或书本上的某一句话，可能无意中给学习者留下了深刻的印象，以至终生难忘。无意识记在第二语言学习和教学中常常起到意料不到的效果。无意识记需要轻松愉快的气氛和松弛、无压力的精神状态，从而极大地发挥识记的潜能，增强识记的效果。在第二语言学习中创造好的语言环境，让学生多接触目的语，通过无意识记获得第二语言，是第二语言教学中特别需要加强的","w":"normal","e":["原书正文"]},{"t":"【原文】识记依照材料是否有意义或","y":"教材原文","p":["识记依照材料是否有意义或学习者是否了解其意义，又可分为机械识记和意义识记","机械识记是对没有意义或学习者尚未理解其意义的材料，依靠机械重复进行识记","虽然这是一种仅仅按材料外部联系进行的简单重复的识记，但在第二语言学习中仍是不可少的","如汉语的发音、声调等需要通过机械记忆求得熟练掌握，初期对汉字、词汇及句型的掌握也需要一定的机械记忆"],"q":"识记依照材料是否有意义或学习者是否了解其意义，又可分为机械识记和意义识记。机械识记是对没有意义或学习者尚未理解其意义的材料，依靠机械重复进行识记。虽然这是一种仅仅按材料外部联系进行的简单重复的识记，但在第二语言学习中仍是不可少的。如汉语的发音、声调等需要通过机械记忆求得熟练掌握，初期对汉字、词汇及句型的掌握也需要一定的机械记忆。意义识记则是在对识记材料理解的","w":"normal","e":["原书正文"]},{"t":"【原文】(2) 保持","y":"教材原文","p":["第二语言的保持是对已识记的第二语言知识和技能加以巩固，也是对已形成的暂时神经联系痕迹加以巩固，使之长期存留在脑中以备应用","这是记忆过程中的第二个阶段","从信息加工的观点来看，这是对信息的再加工并储存，即把所识记的东西纳入到自己的知识结构之中","这一环节是为巩固识记所必须，也是再认和重现的必要前提"],"q":"(2) 保持。第二语言的保持是对已识记的第二语言知识和技能加以巩固，也是对已形成的暂时神经联系痕迹加以巩固，使之长期存留在脑中以备应用。这是记忆过程中的第二个阶段。从信息加工的观点来看，这是对信息的再加工并储存，即把所识记的东西纳入到自己的知识结构之中。这一环节是为巩固识记所必须，也是再认和重现的必要前提。","w":"normal","e":["原书正文"]},{"t":"【原文】保持的信息并非一成不变，","y":"教材原文","p":["保持的信息并非一成不变，随着时间的推移以及后来新经验的影响，信息在储存过程中无论质还是量都会有变化","一般比原来识记的内容更为简略概括，也可能由于补充而更加完整合理，甚至会使原识记中的某些特点更为夸张和突出","在量的方面，如果没有复习，常常出现日趋减少的倾向","这是由于遗忘的作用"],"q":"保持的信息并非一成不变，随着时间的推移以及后来新经验的影响，信息在储存过程中无论质还是量都会有变化。一般比原来识记的内容更为简略概括，也可能由于补充而更加完整合理，甚至会使原识记中的某些特点更为夸张和突出。在量的方面，如果没有复习，常常出现日趋减少的倾向。这是由于遗忘的作用。","w":"normal","e":["原书正文"]},{"t":"【原文】(3) 再认和重现","y":"教材原文","p":["(3) 再认和重现","这是记忆的第三个阶段，即恢复记忆的两种形式，是暂时神经联系痕迹或记忆痕迹恢复的过程","从信息加工的观点来看，是信息的提取也是信息的输出","第二语言的再认，是己经识记过的第二语言知识和技能再度呈现时能识别并确认的心理过程"],"q":"(3) 再认和重现。这是记忆的第三个阶段，即恢复记忆的两种形式，是暂时神经联系痕迹或记忆痕迹恢复的过程。从信息加工的观点来看，是信息的提取也是信息的输出。第二语言的再认，是己经识记过的第二语言知识和技能再度呈现时能识别并确认的心理过程。 比如第二语言教学中，对目的语材料的阅读以及是非题、多项选择题等练习都是再认。对再度呈现的第二语言材料，首先要对之进行知觉分","w":"normal","e":["原书正文"]},{"t":"【原文】第二语言的重现也称为回忆","y":"教材原文","p":["第二语言的重现也称为回忆，是指已经识记过的第二语言知识和技能虽然并未再度呈现、但在脑中重新回想起来的心理过程","第二语言学习中的问答、对话、复述、作文等，都含有不同程度的重现","重现按有无目的分为有意重现和无意重现","无意重现是没有预定目的触景生情而自然产生的回忆，有意重现则是自觉地、有目的地回忆"],"q":"第二语言的重现也称为回忆，是指已经识记过的第二语言知识和技能虽然并未再度呈现、但在脑中重新回想起来的心理过程。第二语言学习中的问答、对话、复述、作文等，都含有不同程度的重现。重现按有无目的分为有意重现和无意重现。无意重现是没有预定目的触景生情而自然产生的回忆，有意重现则是自觉地、有目的地回忆。","w":"normal","e":["原书正文"]},{"t":"【原文】系。特别是回忆是以联想为","y":"教材原文","p":["特别是回忆是以联想为基础，并常以联想的形式出现","所谓联想是指由一种事物想到具有某种联系的另一事物的心理活动","联想分：类似联想，如性质相近的第二语言材料的联想(如黄蓝白黑、眼耳鼻口舌等单词的归纳)","对比联想，如相反或对立的第二语言材料的联想(生——死，问——答)"],"q":"系。特别是回忆是以联想为基础，并常以联想的形式出现。所谓联想是指由一种事物想到具有某种联系的另一事物的心理活动。联想分：类似联想，如性质相近的第二语言材料的联想(如黄蓝白黑、眼耳鼻口舌等单词的归纳)；对比联想，如相反或对立的第二语言材料的联想(生——死，问——答)；接近联想，如时间或空间接近的第二语言材料的联想(清华——北大，春天——阳光)；关系联想，由事物","w":"normal","e":["原书正文"]},{"t":"【原文】3.遗忘的规律与加强记忆","y":"教材原文","p":["3.遗忘的规律与加强记忆与第二语言的保持相对的是第二语言的遗忘，即记忆过的内容不能保持也不能正确地再认或重现，暂时神经联系的痕迹不能巩固","从信息加工的观点来看，就是储存的信息不能正确地提取出来","遗忘又分部分遗忘和完全遗忘、暂时遗忘和永久遗忘","暂时遗忘是指识记过的内容一时不能再认或再现，但在一定条件下还可恢复，如一时提笔忘字或话到嘴边说不出来，过一段时间就能想起"],"q":"3.遗忘的规律与加强记忆与第二语言的保持相对的是第二语言的遗忘，即记忆过的内容不能保持也不能正确地再认或重现，暂时神经联系的痕迹不能巩固。从信息加工的观点来看，就是储存的信息不能正确地提取出来。遗忘又分部分遗忘和完全遗忘、暂时遗忘和永久遗忘。暂时遗忘是指识记过的内容一时不能再认或再现，但在一定条件下还可恢复，如一时提笔忘字或话到嘴边说不出来，过一段时间就能想","w":"normal","e":["原书正文"]}]},{"id":"yinlun-c03-s03","t":"第三节 对外汉语教学的教育学基础","w":"high","n":13,"k":[{"t":"启发式","y":"名词解释","p":["教学方法的根本指导思想是“启发式”，即教师从学生的实际出发，采取各种有效的办法调动学生学习的积极性和主动性，引导他们自己去学习。","与之相反的指导思想是“注入式”，教师单方面地向学生灌输知识，学生被动地接受知识。","显然，启发式符合辩证唯物主义内因和外因互相作用的规律。学生自觉、主动的学习是内因，起着决定性的作用；教师的指引、帮助则是外因。","启发式教学不仅有利于具体教学任务的完成，更重要的是培养了学生的学习能力，养成学生的好的学习习惯。"],"q":"教学方法的根本指导思想是“启发式”，即教师从学生的实际出发，采取各种有效的办法调动学生学习的积极性和主动性，引导他们自己去学习。","w":"high","e":["2019 真题"]},{"t":"教学过程","y":"名词解释","p":["教师和学生共同参与的教学活动过程叫教学过程。对教学过程规律的研究也称为过程论，是广义的教学论中的一部分。","教学过程的性质，按照马克思主义的观点是学生的认识过程，而且是一种特殊的认识过程。","其特殊性表现为：(1)学生不是真刀真枪直接同客观事物打交道，而是通过书本和课堂接受前人总结的实践经验；(2)学生的认识活动是在教师的引导下进行的；(3)学生的认识过程不只是知识技能掌握的过程，而且是德智体美全面发展的过程；(4)作为教学过程中学生的认识活动，不是学生自发的、主动的要求，而是在教师和课本影响下进行的。"],"q":"教师和学生共同参与的教学活动过程叫教学过程。对教学过程规律的研究也称为过程论，是广义的教学论中的一部分。","w":"high","e":["2018 真题"]},{"t":"教学原则","y":"名词解释","p":["教学原则是从一定的教育和教学目的出发，在教学实践的基础上，根据对教学过程客观规律的认识而制订的指导教学工作的基本要求。","教学原则对一切教学活动，包括教学计划的制定、教学内容的选择、教学过程的组织、教学方法手段的运用都有指导作用。","教学原则有继承性，像早在17世纪由夸美纽斯第一次系统提出的直观性、自觉性、系统性、巩固性、量力性五大教学原则，在一定程度上反映了教学规律，至今仍有指导意义。","教学原则不能是一般哲学原则或社会政治原则的套用，必须结合教育实际、体现教育的特点。"],"q":"教学原则是从一定的教育和教学目的出发，在教学实践的基础上，根据对教学过程客观规律的认识而制订的指导教学工作的基本要求。","w":"high","e":["2020 真题"]},{"t":"学科课程论","y":"名词解释","p":["学科课程论在我国孔子时代和欧洲的希腊罗马学校中早已有之，17世纪的夸美纽斯和18世纪著名德国教育家赫尔巴特进一步奠定了理论基础，至今仍为我国和世界各国的大多数学校所采用。","这是一种以学科的知识体系为中心的课程理论，强调以各门学科知识固有的逻辑体系来组织课程。","对社会生活实际和学生的兴趣、需要及接受能力考虑不多。"],"q":"学科课程论在我国孔子时代和欧洲的希腊罗马学校中早已有之，17世纪的夸美纽斯和18世纪著名德国教育家赫尔巴特进一步奠定了理论基础，至今仍为我国和世界各国的大多数学校所采用。","w":"high","e":["2026 真题"]},{"t":"活动课程论","y":"名词解释","p":["活动课程论。代表人物是美国实用主义教育家杜威。这是以经验为中心的课程理论，强调学生的生活经验中包括了各方面的知识，课程的编排应与生活经验的发展顺序相一致。","这种课程论强调要让学生掌握解决实际问题的知识，提倡“教育即生活”，“在做中学”，适应以培养能力为主的教学。","活动课程论强调发挥学生学习的主动性，强调教学与社会生活的联系，但对科学知识本身的逻辑体系和逻辑顺序注意不够，不利于学生掌握系统的知识。"],"q":"活动课程论。代表人物是美国实用主义教育家杜威。这是以经验为中心的课程理论，强调学生的生活经验中包括了各方面的知识，课程的编排应与生活经验的发展顺序相一致。","w":"high","e":["2026 真题"]},{"t":"【原文】在跨文化交际中，为了有助","y":"教材原文","p":["在跨文化交际中，为了有助于交际的成功，也有可能出现依附于某一方文化的现象","一般说来应依附于所用语言的文化","比如用汉语交际，应依附于汉语文化","主动依附的一方，往往是对对方文化有"],"q":"在跨文化交际中，为了有助于交际的成功，也有可能出现依附于某一方文化的现象。一般说来应依附于所用语言的文化。 比如用汉语交际，应依附于汉语文化；主动依附的一方，往往是对对方文化有","w":"normal","e":["原书正文"]},{"t":"【原文】较多了解的一方","y":"教材原文","p":["更多情况下，为了保证跨文化交际的成功，双方都应采取向对方文化靠拢的原则"],"q":"较多了解的一方。更多情况下，为了保证跨文化交际的成功，双方都应采取向对方文化靠拢的原则。","w":"normal","e":["原书正文"]},{"t":"【原文】4.交际文化８０年代初，","y":"教材原文","p":["4.交际文化８０年代初，对外汉语教学界的学者张占一等人，从第二语言教学培养交际能力的实际出发，按文化在交际中的功能提出区分“知识文化”和“交际文化”的观点","① 所谓知识文化是指跨文化交际中不直接影响准确传递信息的语言和非语言的文化因素","交际文化则是指跨文化交际中直接影响信息准确传递(即引起偏差或误解)的语言和非语言的文化因素","这一观点的提出者常举的例子是：中国人用筷子吃饭，这是知识文化"],"q":"4.交际文化８０年代初，对外汉语教学界的学者张占一等人，从第二语言教学培养交际能力的实际出发，按文化在交际中的功能提出区分“知识文化”和“交际文化”的观点。① 所谓知识文化是指跨文化交际中不直接影响准确传递信息的语言和非语言的文化因素；交际文化则是指跨文化交际中直接影响信息准确传递(即引起偏差或误解)的语言和非语言的文化因素。这一观点的提出者常举的例子是：中","w":"normal","e":["原书正文"]},{"t":"【原文】交际文化与知识文化概念的","y":"教材原文","p":["交际文化与知识文化概念的提出，加深了人们对语言教学中的文化教学的认识，突出了交际文化在语言教学中的重要性，为第二语言教学如何在浩如烟海的文化中区分轻重缓急、确定主要教学内容特别是教学重点建立了一个标准，对语言教学有实际意义","这一观点不仅在对外汉语教学界，在外语教学界也得到很多学者的赞同","但另一方面，这两种文化的区分也引起了不同意见的争论：除了对交际文化的理论根据和科学性提出质疑外，主要认为只强调交际文化"],"q":"交际文化与知识文化概念的提出，加深了人们对语言教学中的文化教学的认识，突出了交际文化在语言教学中的重要性，为第二语言教学如何在浩如烟海的文化中区分轻重缓急、确定主要教学内容特别是教学重点建立了一个标准，对语言教学有实际意义。这一观点不仅在对外汉语教学界，在外语教学界也得到很多学者的赞同。但另一方面，这两种文化的区分也引起了不同意见的争论：除了对交际文化的理论","w":"normal","e":["原书正文"]},{"t":"【原文】① 张占一(1990)试","y":"教材原文","p":["① 张占一(1990)试议交际文化和知识文化，《语言教学与研究》第3期"],"q":"① 张占一(1990)试议交际文化和知识文化，《语言教学与研究》第3期。","w":"normal","e":["原书正文"]},{"t":"【原文】会造成对知识文化的挤压","y":"教材原文","p":["会造成对知识文化的挤压","①在这场讨论中，不少学者提出了较为宽泛的交际文化的概念","如吕必松指出：“所谓‘语言交际文化’，就是这种隐含在语言系统中的反映出一个民族的心理状态、价值观念、生活方式、思维方式、道德标准、是非标准、风俗习惯、审美情趣等等的一种特殊的文化因素，这种文化因素主要体现在语言的词汇系统、语法系统和语用系统之中","”并认为：“语言中的这类文化因素对语言和语言交际有规范作用，但是本族人往往不容易觉察，只有通过对不同民族的语言和语言交际的对比研究才能揭示出来"],"q":"会造成对知识文化的挤压。①在这场讨论中，不少学者提出了较为宽泛的交际文化的概念。如吕必松指出：“所谓‘语言交际文化’，就是这种隐含在语言系统中的反映出一个民族的心理状态、价值观念、生活方式、思维方式、道德标准、是非标准、风俗习惯、审美情趣等等的一种特殊的文化因素，这种文化因素主要体现在语言的词汇系统、语法系统和语用系统之中。”并认为：“语言中的这类文化因素对","w":"normal","e":["原书正文"]},{"t":"【原文】综上所述，跨文化交际应当","y":"教材原文","p":["综上所述，跨文化交际应当体现互相尊重、互相沟通、互相理解、互相适应的原则","对外汉语教学要达到培养跨文化交际能力的目标，必须处理好语言教学与文化教学的关系，使学习者在掌握汉语的同时也能学习到有关中国文化的知识"],"q":"综上所述，跨文化交际应当体现互相尊重、互相沟通、互相理解、互相适应的原则。对外汉语教学要达到培养跨文化交际能力的目标，必须处理好语言教学与文化教学的关系，使学习者在掌握汉语的同时也能学习到有关中国文化的知识。","w":"normal","e":["原书正文"]},{"t":"【原文】一、对外汉语教学相关的文","y":"教材原文","p":["一、对外汉语教学相关的文化教学在如何对待第二语言教学与文化的关系问题上，国内外都出现过只重视语言结构而忽视有关的文化教学的现象","另一方面也出现过用文化教学取代语言教学或者语言、文化教学并重的观点","在我们学科内部，现在已基本上达成了这样的共识：对外汉语教学应该以语言教学为主，同时紧密结合相关的文化教学","这是因为语言教学离不开文化教学"],"q":"一、对外汉语教学相关的文化教学在如何对待第二语言教学与文化的关系问题上，国内外都出现过只重视语言结构而忽视有关的文化教学的现象；另一方面也出现过用文化教学取代语言教学或者语言、文化教学并重的观点。在我们学科内部，现在已基本上达成了这样的共识：对外汉语教学应该以语言教学为主，同时紧密结合相关的文化教学。这是因为语言教学离不开文化教学。从语言教学的第一课开始，所","w":"normal","e":["原书正文"]}]}]},{"id":"yinlun-c04","t":"第四章 对外汉语教学的心理学基础和文化学基础","w":"high","s":[{"id":"yinlun-c04-s01","t":"第一节 对外汉语教学的心理学基础","w":"high","n":18,"k":[{"t":"记忆","y":"名词解释","p":["记忆是过去的经验在人脑中的保存和提取，是人脑对过去经历过的事物的反映。","第二语言记忆则是指第二语言知识和能力的保持和再现，是第二语言学习者主动积极的活动过程。","记忆按其内容分为形象记忆、逻辑记忆、情绪记忆和运动记忆等，第二语言记忆涉及到所有这些方面。","记忆按保持的状态和时间分为感觉记忆、短时记忆和长时记忆。"],"q":"记忆是过去的经验在人脑中的保存和提取，是人脑对过去经历过的事物的反映。","w":"high","e":["2019 真题"]},{"t":"关键期","y":"名词解释","p":["据此，伦尼伯格于60年代提出语言习得“关键期”（critical period)或称“临界期”假说。","所谓语言习得关键期，就是指在青春期(12岁左右)以前，由于大脑语言功能侧化尚未完成，左脑和右脑都能参与语言习得的这段时期。","此时大脑灵活，可塑性大，因而比较容易习得语言。这是习得母语的最佳时期。","对语言习得关键期的假说，也存在不同看法。有的研究显示，婴儿一出生，大脑左半球就有对语音敏感的倾向，到四五岁大脑功能侧化就已基本完成。"],"q":"据此，伦尼伯格于60年代提出语言习得“关键期”（critical period)或称“临界期”假说。","w":"high","e":["2018 真题"]},{"t":"行为主义","y":"名词解释","p":["20世纪的美国心理学界出现了反对构造主义和机能主义的另一种思潮——行为主义。这是强调学习过程和测量外显行为的心理学派，其创始人是美国心理学家华生，后期主要代表人物是斯金纳。","行为主义有两个主要特点：否认意识，主张心理学只研究人的行为；反对内省，主张采用客观的实验的方法。","华生受俄国巴甫洛夫经典性条件反射学说的影响，建立了刺激——反应模式，成为经典性行为主义理论。新行为主义代表人物之一的斯金纳，则受到操作主义哲学的影响，建立了操作行为主义，和“刺激——反应——强化”的模式。"],"q":"20世纪的美国心理学界出现了反对构造主义和机能主义的另一种思潮——行为主义。这是强调学习过程和测量外显行为的心理学派，其创始人是美国心理学家华生，后期主要代表人物是斯金纳。","w":"high","e":["2026 真题"]},{"t":"短时记忆","y":"名词解释","p":["短时记忆又称操作记忆，典型的例子是人们在拨电话时记住刚查找的号码，打完电话马上就忘掉了。短时记忆是对信息进行操作的系统，是动态系统。","感觉信息在短时记忆中保存一分钟左右，通常是以听觉形式编码，且基本保持逐词逐句的内容。","短时记忆容量有限，信息一次呈现后能在短时记忆中正确回忆起7±2个信息单位，以数字计大约为5至7个数，不相连的字母为7个，无关联的汉字一次则能记住6个。","在第二语言学习中如能在短时记忆中组成有意义的信息单位，如词、句，则记忆容量可以大大增加。"],"q":"短时记忆又称操作记忆，典型的例子是人们在拨电话时记住刚查找的号码，打完电话马上就忘掉了。短时记忆是对信息进行操作的系统，是动态系统。","w":"high","e":["2017 真题"]},{"t":"遗忘曲线","y":"名词解释","p":["这就是德国著名心理学家、记忆与遗忘现象实验研究的创始人艾宾浩斯的遗忘曲线。","遗忘规律启示我们，在第二语言教学中对已识记的材料应赶在遗忘以前迅速地、及时地进行巩固、复习、重现和运用，并且要经常复习，复习的间距由短拉长。","从识记的时间来看，遗忘的进程并不是均衡的。在识记的最初时间遗忘很快，识记后的一小时遗忘率达56％，以后就逐渐放慢，31天后遗忘率达79%，到一定程度就不再遗忘。"],"q":"这就是德国著名心理学家、记忆与遗忘现象实验研究的创始人艾宾浩斯的遗忘曲线。","w":"high","e":["2020 真题"]},{"t":"前摄抑制","y":"名词解释","p":["干扰信息保持的因素有两类：一类是前边的学习活动对现在的记忆的保持所产生的影响，称为前摄抑制，也就是旧的记忆干扰新的记忆；另一类是后边的学习活动对现在的记忆保持所产生的影响，称为倒摄抑制，也就是后边的新的记忆干扰旧的记忆。","实验证明：两种学习活动的内容或材料完全相同或完全不同时，不会引起抑制；只有当二者既有相同又有不同处时才产生因内容类似而引起的抑制，特别是相同与不同各占一半时，引起的抑制最大。","为防止这两类抑制的作用，第二语言教学中尽可能把近似的材料分隔开学习。"],"q":"干扰信息保持的因素有两类：一类是前边的学习活动对现在的记忆的保持所产生的影响，称为前摄抑制，也就是旧的记忆干扰新的记忆；另一类是后边的学习活动对现在的记忆保持所产生的影响，称为倒摄抑制，也就是后边的新的记忆干扰旧的记忆。","w":"high","e":["2018 真题"]},{"t":"认知心理学","y":"名词解释","p":["认知心理学出现在本世纪初，在60年代由于行为主义心理学弱点的暴露而迅速发展起来。1967年美国心理学家奈塞尔发表《认知心理学》一书，标志着现代认知心理学的正式诞生。","广义的认知就是指人的认识活动，认知心理学研究人的认知过程，并把认知作为人的全部心理活动的过程。","认知心理学不是把人看做是刺激的被动接受者，而是信息加工者，一种具有丰富的内在资源并能利用这些资源与周围环境发生相互作用的积极的有机体。"],"q":"认知心理学出现在本世纪初，在60年代由于行为主义心理学弱点的暴露而迅速发展起来。1967年美国心理学家奈塞尔发表《认知心理学》一书，标志着现代认知心理学的正式诞生。","w":"high","e":["2019 真题"]},{"t":"格式塔心理学","y":"名词解释","p":["20世纪初德国出现了反对构造主义的学派，即格式塔心理学，其创始人为韦特海默、考夫卡和柯勒。","德文“格式塔”（Gestalt）的意思是“整体”，又称“完形学派”。","该派反对把意识化解成元素，主张把心理作为一个整体组织来研究。认为整体不能还原为各个部分、各种元素；整体先于部分而存在并制约着部分的性质和意义；部分相加不等于整体，整体大于部分之和。","格式塔学派强调采用综合方法研究心理现象，在研究方法上主要采用演示和主观报告的方法，并在知觉、学习和问题解决等方面展开大量的实验研究。"],"q":"20世纪初德国出现了反对构造主义的学派，即格式塔心理学，其创始人为韦特海默、考夫卡和柯勒。","w":"high","e":["2025 真题"]},{"t":"人本主义心理学","y":"名词解释","p":["人本主义心理学是本世纪60年代才在美国兴起的一个心理学流派，创始人是马斯洛，影响最大的代表人物是罗杰斯。","人本主义心理学强调心理学的首要任务是了解人、揭示人性的本质，认为既不要把人神化，也不要把人兽化。","人本主义心理学强调人的价值和尊严，强调人有自由的意志，有发展自身潜能和自我实现的需要。","在人与人的关系中，情感因素起决定作用，反对强迫、压制的方法，而是要启示人的自我意识，促进人的自我实现。"],"q":"人本主义心理学是本世纪60年代才在美国兴起的一个心理学流派，创始人是马斯洛，影响最大的代表人物是罗杰斯。","w":"high","e":["2020 真题"]},{"t":"长时记忆","y":"名词解释","p":["长时记忆是在头脑中长期保持的记忆，从保持一分钟以上直至终生。","长时记忆的容量是没有限度的，它的信息主要来自短时记忆，也有特别强烈的感知记忆一下子直接进入长时记忆。","短时记忆的信息要进入长时记忆，需要该信息呈现一定的强度(如生动程度)和重复，有的研究认为一个单词要反复10次才能记住。","长时记忆中信息主要以意义的形式保持，而不是逐词逐句的内容，也缺少细节。"],"q":"长时记忆是在头脑中长期保持的记忆，从保持一分钟以上直至终生。","w":"normal","e":["核心概念"]},{"t":"【原文】习理论研究所涉及的不仅是","y":"教材原文","p":["习理论研究所涉及的不仅是语言教学问题，还与语言学、认知科学、心理学、社会学等学科密切相关","它有助于提高人们对语言本质的认识，对人的认知能力和认知过程以及大脑功能的认识","这对很多种学科的发展都有很大的意义，因此已成为这些学科共同关注、积极参与的研究领域","这种多学科交叉渗透的研究，使语言习得理论的研究取得可观的成果"],"q":"习理论研究所涉及的不仅是语言教学问题，还与语言学、认知科学、心理学、社会学等学科密切相关。它有助于提高人们对语言本质的认识，对人的认知能力和认知过程以及大脑功能的认识。这对很多种学科的发展都有很大的意义，因此已成为这些学科共同关注、积极参与的研究领域。这种多学科交叉渗透的研究，使语言习得理论的研究取得可观的成果。","w":"normal","e":["原书正文"]},{"t":"【原文】本章首先介绍作为语言习得","y":"教材原文","p":["本章首先介绍作为语言习得理论基础的一般学习理论，特别是影响较大的行为主义学习理论和认知学习理论","语言习得理论的研究是从儿童第一语言习得的研究开始的","一百多年来，心理学家、语言学家和语言教育家希望通过揭开儿童怎样习得第一语言之谜，了解人的语言能力和交际能力是如何发展的，从而使第二语言教学获得有益的借鉴","他们提出很多第一语言习得的假说"],"q":"本章首先介绍作为语言习得理论基础的一般学习理论，特别是影响较大的行为主义学习理论和认知学习理论。语言习得理论的研究是从儿童第一语言习得的研究开始的。 一百多年来，心理学家、语言学家和语言教育家希望通过揭开儿童怎样习得第一语言之谜，了解人的语言能力和交际能力是如何发展的，从而使第二语言教学获得有益的借鉴。他们提出很多第一语言习得的假说。 本章着重介绍刺激—反应","w":"normal","e":["原书正文"]},{"t":"【原文】一、学习与一般学习理论在","y":"教材原文","p":["一、学习与一般学习理论在探讨语言学习理论之前，需要回顾一下一般学习理论"],"q":"一、学习与一般学习理论在探讨语言学习理论之前，需要回顾一下一般学习理论。","w":"normal","e":["原书正文"]},{"t":"【原文】1.什么是学习学习是人类","y":"教材原文","p":["1.什么是学习学习是人类生活中最重要的活动之一，从出生后的咿呀学语到掌握各种复杂的知识和技能，所谓“活到老学到老”，贯串人生的始终"],"q":"1.什么是学习学习是人类生活中最重要的活动之一，从出生后的咿呀学语到掌握各种复杂的知识和技能，所谓“活到老学到老”，贯串人生的始终。","w":"normal","e":["原书正文"]},{"t":"【原文】作为心理学的概念，学习是","y":"教材原文","p":["作为心理学的概念，学习是指人和动物在生活过程中获得经验而产生行为的比较持久的变化","这是学习的广义概念","人类的学习则是指在人类的社会生活实践中运用语言工具主动地获得社会的和"],"q":"作为心理学的概念，学习是指人和动物在生活过程中获得经验而产生行为的比较持久的变化。这是学习的广义概念。人类的学习则是指在人类的社会生活实践中运用语言工具主动地获得社会的和","w":"normal","e":["原书正文"]},{"t":"【原文】人和动物的行为有两类：一","y":"教材原文","p":["人和动物的行为有两类：一种是生来就会、通过遗传而获得的极为有限的“本能行为”，如婴儿会吸奶，母鸡会孵蛋","更多的则是在后天环境中通过学习而获得的“习得行为”，如海豚的表演、人的各种知识和技能等","人类的行为绝大部分都是学习的结果"],"q":"人和动物的行为有两类：一种是生来就会、通过遗传而获得的极为有限的“本能行为”，如婴儿会吸奶，母鸡会孵蛋；更多的则是在后天环境中通过学习而获得的“习得行为”，如海豚的表演、人的各种知识和技能等。人类的行为绝大部分都是学习的结果。","w":"normal","e":["原书正文"]},{"t":"【原文】2.学习理论的两大流派学","y":"教材原文","p":["2.学习理论的两大流派学习理论又称学习论，是研究学习过程中的心理活动规律，也就是学习规律的理论","这是心理学的传统分支学科，也是心理学中最发达的领域之一","西方学习理论主要有两大派：一是行为主义学习理论，一是认知学习理论","两派之间还有折衷主义学习理论，或称认知一行为主义学习理论"],"q":"2.学习理论的两大流派学习理论又称学习论，是研究学习过程中的心理活动规律，也就是学习规律的理论。这是心理学的传统分支学科，也是心理学中最发达的领域之一。西方学习理论主要有两大派：一是行为主义学习理论，一是认知学习理论。 两派之间还有折衷主义学习理论，或称认知一行为主义学习理论。此外，60年代以来还出现了向传统的两大派挑战的人本主义学习理论。影响最大的行为主义","w":"normal","e":["原书正文"]},{"t":"【原文】(1) 受经验主义哲学影","y":"教材原文","p":["(1) 受经验主义哲学影响的行为主义学习理论认为，学习是人和动物受环境支配、获得经验而被动形成的行为的改变","在这一过程中，完全排斥人的主观思想或思维活动","行为主义学习理论是在经典条件作用与操作性条件作用的基础上建立起来的刺激—反应学习理论，历来是西方学习理论的主体部分","这里需要特别提到桑代克的“尝试—错误学习理论”和斯金纳的“操作学习理论”"],"q":"(1) 受经验主义哲学影响的行为主义学习理论认为，学习是人和动物受环境支配、获得经验而被动形成的行为的改变。在这一过程中，完全排斥人的主观思想或思维活动。行为主义学习理论是在经典条件作用与操作性条件作用的基础上建立起来的刺激—反应学习理论，历来是西方学习理论的主体部分。这里需要特别提到桑代克的“尝试—错误学习理论”和斯金纳的“操作学习理论”。","w":"normal","e":["原书正文"]}]},{"id":"yinlun-c04-s02","t":"第二节 对外汉语教学的文化学基础(一)","w":"high","n":13,"k":[{"t":"文化休克","y":"名词解释","p":["这些表现叫“文化震荡症”，也叫“文化休克”（cultural shock）。","文化休克是指在非本民族文化环境中生活或学习的人，由于文化的冲突和不适应而产生的深度焦虑的精神症状。","在跨文化交际中，或是进入非本民族文化生活环境中，以及学习目的语文化的过程中，文化差异都会引起人们的心理反应，产生一定的文化冲突，经历从文化不适应到适应的过程。这一过程大体上分为四个阶段：蜜月阶段、挫折阶段、调整阶段、适应阶段。","处于异文化环境中的人一般都要经历这一挫折期和文化震荡症。只不过文化震荡症在不同人身上表现的形式和程度不完全相同。"],"q":"这些表现叫“文化震荡症”，也叫“文化休克”（cultural shock）。","w":"high","e":["2025 真题"]},{"t":"交际文化","y":"名词解释","p":["80年代初，对外汉语教学界的学者张占一等人，从第二语言教学培养交际能力的实际出发，按文化在交际中的功能提出区分“知识文化”和“交际文化”的观点。","交际文化则是指跨文化交际中直接影响信息准确传递(即引起偏差或误解)的语言和非语言的文化因素。","所谓知识文化是指跨文化交际中不直接影响准确传递信息的语言和非语言的文化因素。","交际文化则是指两种语言间规约性的文化差异，是以制约信息模式的形式来参与交际的，可能在交际中引起误解或偏差。"],"q":"80年代初，对外汉语教学界的学者张占一等人，从第二语言教学培养交际能力的实际出发，按文化在交际中的功能提出区分“知识文化”和“交际文化”的观点。","w":"high","e":["2018 真题"]},{"t":"知识文化","y":"名词解释","p":["所谓知识文化是指跨文化交际中不直接影响准确传递信息的语言和非语言的文化因素；交际文化则是指跨文化交际中直接影响信息准确传递(即引起偏差或误解)的语言和非语言的文化因素。","知识文化常以“知识”或“内容”的形式参与交际。“知识”的多少也会影响到交际的进行。但懂就是懂，不懂就是不懂，一般不会产生误解。","交际文化与知识文化概念的提出，加深了人们对语言教学中的文化教学的认识。"],"q":"所谓知识文化是指跨文化交际中不直接影响准确传递信息的语言和非语言的文化因素；交际文化则是指跨文化交际中直接影响信息准确传递(即引起偏差或误解)的语言和非语言的文化因素。","w":"high","e":["2018 真题"]},{"t":"文化依附","y":"名词解释","p":["所谓文化依附，是指人们言行所代表和体现的是哪一种文化。","第二语言学习者为了掌握目的语，需要了解和学习目的语文化知识；第二语言教师为了帮助学习者掌握目的语，也需要介绍目的语文化知识。因此在这一过程中，原则上师生都需要依附目的语文化。","以学习汉语的外国学习者为例，为了尽快地学会汉语并正确地、得体地运用汉语，在他们学习期间、特别是在中国生活期间需要依附汉语的文化。","一般说来应依附于所用语言的文化。比如用汉语交际，应依附于汉语文化；主动依附的一方，往往是对对方文化有较多了解的一方。"],"q":"所谓文化依附，是指人们言行所代表和体现的是哪一种文化。","w":"high","e":["2017 真题"]},{"t":"跨文化交际","y":"名词解释","p":["跨文化交际是指不同文化背景的人们之间的交际行为。这种交际主要是通过语言来进行的，称为跨文化语言交际。","影响跨文化语言交际的是不同文化之间的相同之处和不同之处，特别是文化差异。因此跨文化交际中要特别重视并研究文化差异。","跨文化交际的特点：(1)文化的差异与交际障碍；(2)交际原则与价值观念；(3)母语文化的思维定势和对异文化的成见；(4)交际过程中的相互接近和求同趋向；(5)交际的结果：文化的相互影响。","从上述五个特点可以看出，跨文化交际的根本特征是如何发现、认识和对待不同文化之间的差异。"],"q":"跨文化交际是指不同文化背景的人们之间的交际行为。这种交际主要是通过语言来进行的，称为跨文化语言交际。","w":"high","e":["2019 真题"]},{"t":"【原文】② 吕必松(１９９６)《","y":"教材原文","p":["② 吕必松(１９９６)《对外汉语教学概论(讲义)》，内部印行"],"q":"② 吕必松(１９９６)《对外汉语教学概论(讲义)》，内部印行。","w":"normal","e":["原书正文"]},{"t":"【原文】心理活动，识记是有有意识","y":"教材原文","p":["心理活动，识记是有有意识与无意识之分的","本小节详细分析了学习与习得两者的不同，至于两种途径的交叉正说明其相辅相成的关系","学习与习得的区分对改进课堂教学、建立学习与习得相结合的新的教学法体系有很大启示作用"],"q":"心理活动，识记是有有意识与无意识之分的。本小节详细分析了学习与习得两者的不同，至于两种途径的交叉正说明其相辅相成的关系。学习与习得的区分对改进课堂教学、建立学习与习得相结合的新的教学法体系有很大启示作用。","w":"normal","e":["原书正文"]},{"t":"【原文】任何一个生理正常的儿童都","y":"教材原文","p":["任何一个生理正常的儿童都能通过自然习得成功地掌握其第一语言(母语)的口语，如何揭开这一奥秘，这是心理学家、心理语言学家、语言学家和语言教育家们一直非常感兴趣的问题","18世纪末德国学者蒂德曼(D. Tiedemann)最早通过记录的方式，对其小儿子心理和语言的发展进行观察和研究","早期西方的很多学者都采取了用观察日记的方法收集自己子女的语言发展资料，以研究儿童心理的发展","此后经过华生、斯金纳为代表的行为主义心理学阶段，以乔姆斯基为代表的先天论学派和以皮亚杰为代表的认知学派，到本世纪80年代儿童语言发展的研究逐渐成为一门新的学科"],"q":"任何一个生理正常的儿童都能通过自然习得成功地掌握其第一语言(母语)的口语，如何揭开这一奥秘，这是心理学家、心理语言学家、语言学家和语言教育家们一直非常感兴趣的问题。18世纪末德国学者蒂德曼(D. Tiedemann)最早通过记录的方式，对其小儿子心理和语言的发展进行观察和研究。早期西方的很多学者都采取了用观察日记的方法收集自己子女的语言发展资料，以研究儿童心","w":"normal","e":["原书正文"]},{"t":"【原文】一、儿童第一语言的习得过","y":"教材原文","p":["一、儿童第一语言的习得过程儿童第一语言的习得过程大体上有五个阶段"],"q":"一、儿童第一语言的习得过程儿童第一语言的习得过程大体上有五个阶段。","w":"normal","e":["原书正文"]},{"t":"【原文】1. 喃语阶段(半岁至一","y":"教材原文","p":["1. 喃语阶段(半岁至一岁)这是前语言阶段，即婴儿语音的听辨和发声的准备阶段","婴儿出生后很快就有听觉反应，一两个月内就能辨别语音和一般声响的区别，能辨别出父母的声音","婴儿的发声过程从呱呱坠地时开始，几"],"q":"1. 喃语阶段(半岁至一岁)这是前语言阶段，即婴儿语音的听辨和发声的准备阶段。婴儿出生后很快就有听觉反应，一两个月内就能辨别语音和一般声响的区别，能辨别出父母的声音。婴儿的发声过程从呱呱坠地时开始，几","w":"normal","e":["原书正文"]},{"t":"【原文】周后由啼哭阶段进入咕咕之","y":"教材原文","p":["周后由啼哭阶段进入咕咕之声阶段，半岁后进入咿呀学语阶段","这时也能听懂大入的一些指令如“笑一笑”、“跟阿姨再见”等，与成入有了被动的语言交际"],"q":"周后由啼哭阶段进入咕咕之声阶段，半岁后进入咿呀学语阶段。这时也能听懂大入的一些指令如“笑一笑”、“跟阿姨再见”等，与成入有了被动的语言交际。","w":"normal","e":["原书正文"]},{"t":"【原文】2.独词句阶段(一岁左右","y":"教材原文","p":["2.独词句阶段(一岁左右)这是真正语言表达的开始，女孩可能比男孩稍早","幼儿学习用单个词表达意思","如“妈妈”一词可能表示饿、要抱、撒尿等","独词句所用的大量的是普通名词或专有名词，还有一部分动词和修饰词"],"q":"2.独词句阶段(一岁左右)这是真正语言表达的开始，女孩可能比男孩稍早。 幼儿学习用单个词表达意思。 如“妈妈”一词可能表示饿、要抱、撒尿等。 独词句所用的大量的是普通名词或专有名词，还有一部分动词和修饰词。","w":"normal","e":["原书正文"]},{"t":"【原文】3.双词句阶段(一岁半以","y":"教材原文","p":["3.双词句阶段(一岁半以后)儿童语言的迅速发展，出现了由两个词组成的句子","其中有相当 -部分称为轴心结构，即由轴心词和开放词组成，如“要奶”、“要糖”、“要娃娃”,“爸爸好”、“妈妈好”、“宝宝好”等,其中的“要”、“好”就是轴心词"],"q":"3.双词句阶段(一岁半以后)儿童语言的迅速发展，出现了由两个词组成的句子。其中有相当 -部分称为轴心结构，即由轴心词和开放词组成，如“要奶”、“要糖”、“要娃娃”,“爸爸好”、“妈妈好”、“宝宝好”等,其中的“要”、“好”就是轴心词。","w":"normal","e":["原书正文"]}]},{"id":"yinlun-c04-s03","t":"第三节 对外汉语教学的文化学基础(二)","w":"high","n":14,"k":[{"t":"语构文化","y":"名词解释","p":["语构文化指词、词组、句子和话语篇章的构造所体现的文化特点，反映了民族的心理模式和思维方式。","汉语结构最大的特点是重意合而不重形式。","不是用严格的形态变化来体现语法关系和语义信息，而是除了遵照一定的结构规则外，只要在上下文中语义搭配合乎事理，就可以合在一起组成句子、语段。","汉语的意合性也必然带来语言结构的灵活性和简约性。"],"q":"语构文化指词、词组、句子和话语篇章的构造所体现的文化特点，反映了民族的心理模式和思维方式。","w":"high","e":["2019 真题"]},{"t":"语义文化","y":"名词解释","p":["语义文化指语言的语义系统、主要是词汇中所包含的社会文化涵义，它反映了民族的心理模式和思维方式。","这是语言中的文化因素最基本、最大量的表现形式，也是语言教学中文化因素教学的重点之一。","首先是一个民族文化中特有的事物和概念体现在词汇中，而在别的语言中没有对应词语，如不加解释，第二语言学习者就难以理解。","更多的则是某一事物或概念虽在不同的语言中有对应词语，但词义却存在很大差别，因而在语言交际中最容易造成误解和障碍。"],"q":"语义文化指语言的语义系统、主要是词汇中所包含的社会文化涵义，它反映了民族的心理模式和思维方式。","w":"high","e":["2019 真题"]},{"t":"语用文化","y":"名词解释","p":["语用文化指语言用于交际中的语用规则和文化规约，是由不同民族的文化、特别是习俗文化所决定的。","语用文化是培养语言交际能力的主要内容，是对外汉语教学中文化因素教学的重点之一。","可以和功能意念的教学和语用规则的教学结合在一起。对外汉语教学中常用的基本的语用文化包括：称呼；问候和道别；道谢和道歉；敬语与谦辞；褒奖与辞让；宴请与送礼；隐私与禁忌。","如中国人敬老在称呼中加上“老”字如“老大爷”、“老大娘”。"],"q":"语用文化指语言用于交际中的语用规则和文化规约，是由不同民族的文化、特别是习俗文化所决定的。","w":"high","e":["2020 真题"]},{"t":"文化的分类","y":"名词解释","p":["对文化有多种分类方法。按文化的内容常把文化分为物质文化、行为文化、制度文化和观念文化四个部分。","观念文化是人类在社会实践和意识活动中形成的价值观念、伦理道德、审美情趣、宗教情感、思维方式和民族性格……属文化的精神内核，是深层文化。","制度文化是由观念文化所决定的社会规范体系……制度文化与行为文化属中层文化。","行为文化也称习俗文化，是人们交往中约定俗成的社会风俗习惯和行为标准……可以看做是制度文化的一部分。","物质文化指人类创造的、体现一定生活方式的种种物质文明……是表层文化。","此外，还有大写字母C文化(简称大文化)和小写字母c文化(简称小文化)的分法。"],"q":"对文化有多种分类方法。按文化的内容常把文化分为物质文化、行为文化、制度文化和观念文化四个部分。","w":"high","e":["2018 真题"]},{"t":"语言文化因素","y":"名词解释","p":["语言的文化因素是语言教学中的文化教学首先接触的、也是最重要的部分，主要指语言系统各层次的文化内涵和语言使用的社会规约。","语言文化因素主要隐含在词汇系统、语法系统和语用系统之中，在跨文化交际中制约着语言的理解和使用，甚至可能造成一定的交际误解和障碍。","缺少语言文化因素的教学就不能达到语言教学的目的，因此就像语音、词汇、语法和汉字等因素一样，文化因素也是语言中不可或缺的组成部分。","陈光磊把这种文化因素分为语构文化、语义文化和语用文化。"],"q":"语言的文化因素是语言教学中的文化教学首先接触的、也是最重要的部分，主要指语言系统各层次的文化内涵和语言使用的社会规约。","w":"high","e":["2026 真题"]},{"t":"文化教学原则","y":"名词解释","p":["将上述文化教学的内容组织到对外汉语教学中去，需要体现以下原则：(1)要为语言教学服务，与语言教学的阶段相适应；(2)要有针对性；(3)要有代表性；(4)要有发展变化的观点；(5)要把文化知识转化为交际能力。","文化教学必须为语言教学服务，为培养语言交际能力的教学目标服务，这是本学科、本专业的性质所决定的。","文化教学中所介绍的中国文化，应该是主流文化、国家文化或者说是中国人共通的文化，而不是地域文化或部分人群的亚文化。"],"q":"将上述文化教学的内容组织到对外汉语教学中去，需要体现以下原则：(1)要为语言教学服务，与语言教学的阶段相适应；(2)要有针对性；(3)要有代表性；(4)要有发展变化的观点；(5)要把文化知识转化为交际能力。","w":"high","e":["2021 真题"]},{"t":"【原文】6.文化适应假说由舒曼（","y":"教材原文","p":["6.文化适应假说由舒曼（J. Schumann）提出的文化适应假说（the Acculturation The-ory)，从文化与语言的关系出发，把第二语言习得的过程看做是逐步适应目的语文化的过程，把整个第二语言习得看做是文化适应的一部分，认为第二语言学习者对目的语文化的适应程度决定该目的语掌握的程度","所谓文化适应是指学习者与目的语社团的社会和心理的结合，因此，学习者与目的语文化的社会距离与心理距离，就成了影响第二语言习得的主要因素","由缩短的社会距离或由好的社会因素所形成的有利的语言环境，是指第二语言学习者与目的语社团的成员具有平等的社会地位","第二语言学习者本人和目的语社团都希望第二语言学习者被目的语社会同化"],"q":"6.文化适应假说由舒曼（J. Schumann）提出的文化适应假说（the Acculturation The-ory)，从文化与语言的关系出发，把第二语言习得的过程看做是逐步适应目的语文化的过程，把整个第二语言习得看做是文化适应的一部分，认为第二语言学习者对目的语文化的适应程度决定该目的语掌握的程度。所谓文化适应是指学习者与目的语社团的社会和心理的结合，因","w":"normal","e":["原书正文"]},{"t":"【原文】团都希望第二语言学习者能","y":"教材原文","p":["团都希望第二语言学习者能分享目的语国家的社会福利设施","双方在文化上和谐，对对方的态度均为积极的、肯定的","第二语言学习者期望在目的语地区逗留较长时间等","在这样良好的环境中，学习者能接触到较多的目的语输入，促成第二语言的习得"],"q":"团都希望第二语言学习者能分享目的语国家的社会福利设施；双方在文化上和谐，对对方的态度均为积极的、肯定的；第二语言学习者期望在目的语地区逗留较长时间等。在这样良好的环境中，学习者能接触到较多的目的语输入，促成第二语言的习得；否则则起相反的作用。心理距离主要指学习者在情感方面影响到第二语言习得的因素，包括语言障碍带来的焦虑，文化震荡带来的恐惧紧张以及动机、自尊心","w":"normal","e":["原书正文"]},{"t":"【原文】文化适应假说强调文化在第","y":"教材原文","p":["文化适应假说强调文化在第二语言习得中的重要性，这是正确的","要习得一种第二语言，必须了解并习得该目的语文化，缩短与目的语文化的社会和心理距离也确实是第二语言习得的重要条件","但把文化适应看做是第二语言习得的惟一关键因素，把语言习得过程完全等同于文化适应过程，特别是又把文化适应理解为对目的语社团的社会和心理的结合，则未必全面","上一章已经谈到，文化适应并不意味着对异文化的全盘接受和赞同(可以包括一部分虽不能接受但能予以理解的文化内容)，更不等于被异文化的完全同化"],"q":"文化适应假说强调文化在第二语言习得中的重要性，这是正确的。要习得一种第二语言，必须了解并习得该目的语文化，缩短与目的语文化的社会和心理距离也确实是第二语言习得的重要条件。但把文化适应看做是第二语言习得的惟一关键因素，把语言习得过程完全等同于文化适应过程，特别是又把文化适应理解为对目的语社团的社会和心理的结合，则未必全面。上一章已经谈到，文化适应并不意味着对异","w":"normal","e":["原书正文"]},{"t":"【原文】二、第一语言习得和第二语","y":"教材原文","p":["二、第一语言习得和第二语言习得的异同比较本节和上节已分别介绍了有关第二语言习得和第一语言习得的主要理论，现在我们再将儿童第一语言习得与成人第二语言习得的异同点做一比较","儿童习得第一语言包括学龄前的自然习得阶段和入学后的学校教育阶段","成人第二语言习得大都是在学校教育的环境下进行的，也有可能是在目的语环境里的自然习得","这里主要比较的是成人在学校环境下的第二语言习得和儿童人学前在自然环境里的第一语言习得"],"q":"二、第一语言习得和第二语言习得的异同比较本节和上节已分别介绍了有关第二语言习得和第一语言习得的主要理论，现在我们再将儿童第一语言习得与成人第二语言习得的异同点做一比较。儿童习得第一语言包括学龄前的自然习得阶段和入学后的学校教育阶段。成人第二语言习得大都是在学校教育的环境下进行的，也有可能是在目的语环境里的自然习得。这里主要比较的是成人在学校环境下的第二语言习","w":"normal","e":["原书正文"]},{"t":"【原文】(1) 两种语言习得都必","y":"教材原文","p":["(1) 两种语言习得都必须具备一定的主观条件和客观条件","无论是儿童习得第一语言或成入习得第二语言，都是主体和客观环境相互作用的结果","作为主观条件，主体必须具备健全的大脑和语言器官，大脑受损伤或发声器官、视听器官有缺陷，会影响到语言习得","作为客观条件，必须具备一定的语言环境，人具有先天的习得语言的能力，但语言的获得却是后天通过与环境的作用而实现的"],"q":"(1) 两种语言习得都必须具备一定的主观条件和客观条件。无论是儿童习得第一语言或成入习得第二语言，都是主体和客观环境相互作用的结果。作为主观条件，主体必须具备健全的大脑和语言器官，大脑受损伤或发声器官、视听器官有缺陷，会影响到语言习得。作为客观条件，必须具备一定的语言环境，人具有先天的习得语言的能力，但语言的获得却是后天通过与环境的作用而实现的。狼孩由于与人","w":"normal","e":["原书正文"]},{"t":"【原文】① Larsen-Fre","y":"教材原文","p":["① Larsen-Freeman, D. and Long, M. H.(1991) An Introduction to Second Language Acquisition Research, Longman"],"q":"① Larsen-Freeman, D. and Long, M. H.(1991) An Introduction to Second Language Acquisition Research, Longman","w":"normal","e":["原书正文"]},{"t":"【原文】获得语言。成人习得第二语","y":"教材原文","p":["成人习得第二语言也必须有一定的语言环境，即使不能置身于目的语的自然语言环境中，至少也必须有提供一定目的语输人的语言环境(如课堂、教师或对话者)"],"q":"获得语言。成人习得第二语言也必须有一定的语言环境，即使不能置身于目的语的自然语言环境中，至少也必须有提供一定目的语输人的语言环境(如课堂、教师或对话者)。","w":"normal","e":["原书正文"]},{"t":"【原文】(2) 两种语言习得都是","y":"教材原文","p":["(2) 两种语言习得都是为了培养语言交际能力","语言是交际工具，习得语言的目的都是为了交际","儿童习得母语是为了生存和认识周围世界、进行交际活动的需要，成人习得第二语言也是为了从听说读写方面运用目的语进行交际"],"q":"(2) 两种语言习得都是为了培养语言交际能力。语言是交际工具，习得语言的目的都是为了交际。儿童习得母语是为了生存和认识周围世界、进行交际活动的需要，成人习得第二语言也是为了从听说读写方面运用目的语进行交际。","w":"normal","e":["原书正文"]}]}]},{"id":"yinlun-c05","t":"第五章 语言习得理论","w":"high","s":[{"id":"yinlun-c05-s01","t":"第一节 语言学习与习得","w":"high","n":15,"k":[{"t":"顿悟","y":"名词解释","p":["顿悟是指突然觉察到解决问题的办法，要做到这点就必须对整个问题的情境进行知觉，了解构成情境的各要素之间的各种关系。","柯勒认为这是通过顿悟实现了学习，格式塔心理学认为顿悟学习可以避免盲目的试误学习。","格式塔心理学认为，有机体获得的每种经验都是一个有组织的整体，也就是完形——不是孤立的组成部分，也不是各组成部分的简单相加。","由于新经验的发生，对问题的情境以及情境各部分的关系需要进行知觉的重组或认知的重组，即由一种完形改变成另一种完形，从而实现顿悟。"],"q":"顿悟是指突然觉察到解决问题的办法，要做到这点就必须对整个问题的情境进行知觉，了解构成情境的各要素之间的各种关系。","w":"high","e":["2019 真题"]},{"t":"习得","y":"名词解释","p":["“习得”是在自然的语言环境中，通过旨在沟通意义的言语交际活动，不知不觉(潜意识)地获得一种语言，典型的例子是儿童习得第一语言(一般是母语)。","简言之，习得是潜意识的自然的获得。","习得，特别是儿童第一语言的习得，是从本能的要求(生存和交际的需要)开始、与其生理和心理的自然发育、成熟同步进行的过程，儿童是在不知不觉中习得第一语言的。","习得一般是在使用该目的语的社会环境中进行的；习得时注意力主要集中在语言的功能和意义方面。"],"q":"“习得”是在自然的语言环境中，通过旨在沟通意义的言语交际活动，不知不觉(潜意识)地获得一种语言，典型的例子是儿童习得第一语言(一般是母语)。","w":"high","e":["2019 真题"]},{"t":"认知学习理论","y":"名词解释","p":["认知学习理论受哲学上的理性主义的影响，认为学习是学习者对环境和客观事物主动的认识和行为的主动的改变，是主体的认知过程，而不是在外界环境支配下被动地进行刺激—反应的联结和行为习惯的改变。","它强调学习中认知机制所起的作用，着重探讨学习者内部心理结构的形成和改变。","这里主要介绍格式塔心理学的完形说和布鲁纳的认知—发现说。","德国格式塔心理学家柯勒通过猩猩取香蕉实验认为这是通过顿悟实现了学习，顿悟是指突然觉察到解决问题的办法。"],"q":"认知学习理论受哲学上的理性主义的影响，认为学习是学习者对环境和客观事物主动的认识和行为的主动的改变，是主体的认知过程，而不是在外界环境支配下被动地进行刺激—反应的联结和行为习惯的改变。","w":"high","e":["2019 真题"]},{"t":"行为主义学习理论","y":"名词解释","p":["行为主义学习理论受经验主义哲学影响，认为学习是人和动物受环境支配、获得经验而被动形成的行为的改变。在这一过程中，完全排斥人的主观思想或思维活动。","行为主义学习理论是在经典条件作用与操作性条件作用的基础上建立起来的刺激—反应学习理论，历来是西方学习理论的主体部分。","这里需要特别提到桑代克的“尝试—错误学习理论”和斯金纳的“操作学习理论”。","桑代克通过饿猫的“迷箱实验”提出联结试误说；斯金纳提出操作性(也称工具性)条件作用理论。"],"q":"行为主义学习理论受经验主义哲学影响，认为学习是人和动物受环境支配、获得经验而被动形成的行为的改变。在这一过程中，完全排斥人的主观思想或思维活动。","w":"high","e":["2026 真题"]},{"t":"斯金纳通过“迷箱实验”提出了联结试误说。","y":"名词解释","p":["通过饿猫的“迷箱实验”提出联结试误说的是桑代克，而非斯金纳；斯金纳提出的是操作性条件作用理论。"],"q":"错误","w":"high","e":["2020 真题"]},{"t":"直觉掌握","y":"名词解释","p":["苏俄学者用“直觉掌握”和“自觉掌握”两个概念来表述这两种类型的学习。","直觉掌握指在使用语言时，意识所控制的是话语所表达的内容而不是它的语言形式；而自觉掌握则是指在使用语言时，意识所控制的是话语的语言形式而不是它所表达的内容。","与之相关的“直觉学习”指的是单纯模仿，知其然而不知其所以然，“自觉学习”则是指在理解的基础上模仿，不但知其然还要知其所以然。"],"q":"苏俄学者用“直觉掌握”和“自觉掌握”两个概念来表述这两种类型的学习。","w":"normal","e":["核心概念"]},{"t":"____是指突然觉察到解决问题的办法。","y":"名词解释","p":["顿悟"],"q":"顿悟","w":"normal","e":["核心概念"]},{"t":"【原文】(3) 通过偏误分析，学","y":"教材原文","p":["(3) 通过偏误分析，学习者可以更好地检验对所学的语言规则做的假设"],"q":"(3) 通过偏误分析，学习者可以更好地检验对所学的语言规则做的假设。","w":"normal","e":["原书正文"]},{"t":"【原文】对第二语言学习者的错误的","y":"教材原文","p":["对第二语言学习者的错误的分析研究，早在６０年代就开始了","我国对外汉语教学工作者也从６０年代就开始对外国学生学习汉语的病错句进行收集、整理和研究，积累了丰富的成果(集中体现在１９８６年出版、佟慧君编写的《外国人学汉语病句分析》和１９９７年出版、程美珍等编写的《汉语病句辨析九百例》等书中)","但六七十年代只是把学习者的病错句与目的语的标准形式进行词汇学、句法学的对比，指出其结构上或语义上的错误所在并做出语言学的解释，而未能涉及学习者的心理因素和学习规律","中介语理论指导下的偏误分析的研究，在我国对外汉语教学界是从鲁健骥于１９８４年发表《中介语理论与外国人学习汉语的语音偏误分析》一文开始的"],"q":"对第二语言学习者的错误的分析研究，早在６０年代就开始了。我国对外汉语教学工作者也从６０年代就开始对外国学生学习汉语的病错句进行收集、整理和研究，积累了丰富的成果(集中体现在１９８６年出版、佟慧君编写的《外国人学汉语病句分析》和１９９７年出版、程美珍等编写的《汉语病句辨析九百例》等书中)。但六七十年代只是把学习者的病错句与目的语的标准形式进行词汇学、句法学的对","w":"normal","e":["原书正文"]},{"t":"【原文】2.偏误分析的具体步骤和","y":"教材原文","p":["2.偏误分析的具体步骤和偏误的分类科德把偏误分析分为五个步骤："],"q":"2.偏误分析的具体步骤和偏误的分类科德把偏误分析分为五个步骤：","w":"normal","e":["原书正文"]},{"t":"【原文】(1) 搜集供分析的语料","y":"教材原文","p":["(1) 搜集供分析的语料：从第二语言学习者的口头和书面表达中或听力理解中选择供分析用的语料"],"q":"(1) 搜集供分析的语料：从第二语言学习者的口头和书面表达中或听力理解中选择供分析用的语料。","w":"normal","e":["原书正文"]},{"t":"【原文】(2) 鉴别偏误：首先要","y":"教材原文","p":["(2) 鉴别偏误：首先要区分是有规律性的偏误还是偶然的失误(二者的鉴别并不是很容易的事情)，同时还要区分是结构形式的偏误还是语用的偏误"],"q":"(2) 鉴别偏误：首先要区分是有规律性的偏误还是偶然的失误(二者的鉴别并不是很容易的事情)，同时还要区分是结构形式的偏误还是语用的偏误。","w":"normal","e":["原书正文"]},{"t":"【原文】对偏误可以从不同的角度进","y":"教材原文","p":["对偏误可以从不同的角度进行分类","传统的分类方法是按语音、词汇、语法等不同方面的偏误来分类，这是课堂教学中常用的方法，也是教师最习惯的方法","这种只着眼于语言形式的分类方法，往往会忽视语言交际方面的偏误","有的语言教育家根据偏误的严重程度分为整体性偏误(global errors)和局部性偏误(local errors)"],"q":"对偏误可以从不同的角度进行分类。传统的分类方法是按语音、词汇、语法等不同方面的偏误来分类，这是课堂教学中常用的方法，也是教师最习惯的方法。这种只着眼于语言形式的分类方法，往往会忽视语言交际方面的偏误。有的语言教育家根据偏误的严重程度分为整体性偏误(global errors)和局部性偏误(local errors)。前者指涉及到句子总体组织结构的错误(如误用","w":"normal","e":["原书正文"]},{"t":"【原文】充分的考虑时间并在语言知","y":"教材原文","p":["充分的考虑时间并在语言知识的监控下出现的，这类偏误常常反映出学习者的实际语言能力"],"q":"充分的考虑时间并在语言知识的监控下出现的，这类偏误常常反映出学习者的实际语言能力。","w":"normal","e":["原书正文"]},{"t":"【原文】科德提出显性(overt","y":"教材原文","p":["科德提出显性(overt)偏误与隐性(covert)偏误的分类方法","前者指那些明显的带有结构形式错误的句子，后者指语法虽然正确、但在一定的语境或交际情境中显得不恰当的句子","这种分类法强调不能只注重语言形式，要重视语言在交际中的使用","科德还根据中介语的发展过程，把偏误分为三类："],"q":"科德提出显性(overt)偏误与隐性(covert)偏误的分类方法。前者指那些明显的带有结构形式错误的句子，后者指语法虽然正确、但在一定的语境或交际情境中显得不恰当的句子。这种分类法强调不能只注重语言形式，要重视语言在交际中的使用。科德还根据中介语的发展过程，把偏误分为三类：","w":"normal","e":["原书正文"]}]},{"id":"yinlun-c05-s02","t":"第二节 第一语言习得及主要理论和假说","w":"high","n":15,"k":[{"t":"图式","y":"名词解释","p":["认知结构的组成部分又称为图式(schema)，人脑中储存着各种各样的图式，如开车的图式、做饭的图式等。","图式是心理活动的组织结构，也是人类认识事物的基础，是人类向环境学习的产物，同时对新事物的理解和吸收又取决于头脑中已有的图式。","图式随着儿童心理的发展而变化，体现了认知的发展；而认知的发展受同化、顺应、平衡三个基本过程的影响。","图式是通过同化和顺应不断发展的。"],"q":"认知结构的组成部分又称为图式(schema)，人脑中储存着各种各样的图式，如开车的图式、做饭的图式等。","w":"high","e":["2020 真题"]},{"t":"先天论","y":"名词解释","p":["先天论又称“内在论”，代表人物是乔姆斯基，是在乔姆斯基语言学理论、特别是80年代初提出的“普遍语法”理论基础上的儿童第一语言习得理论。","乔氏认为语言不像行为主义者所说的是“习惯的总和”，而是由抽象规则构成的复杂的体系。","人们习得语言绝不是单纯的模仿记忆，而是要把这些复杂的规则“内化”(internalization)，达到自动运用的程度，成为理解和产生言语的基础。","乔氏认为人类先天具有一种习得语言的特殊能力，表现为儿童头脑中有一种受遗传因素决定的“语言习得机制”(language acquisition device，简称LAD)。"],"q":"先天论又称“内在论”，代表人物是乔姆斯基，是在乔姆斯基语言学理论、特别是80年代初提出的“普遍语法”理论基础上的儿童第一语言习得理论。","w":"high","e":["2019 真题"]},{"t":"普遍语法","y":"名词解释","p":["语言习得机制包括两部分：一部分是以待定的参数形式出现的、人类语言所普遍具有的语言原则，又称为“普遍语法”(universal grammar)。","普遍语法反映了人类语言的共性，它不是指那些具体的语法规则或某种语言的语法，而是存在于人类所有语言的深层结构中的语言中最本质的东西。","任何语言都会有元音，都有影响意义的语序，都有主语、谓语、宾语等句子的组成部分，都有表示时间关系的手段。","这些有关语法成分、句法结构以及句法转换等适合所有语言的语言知识和原则，成为“核心”部分，而各种语言本身所具有的特殊结构称为“外围”部分。"],"q":"语言习得机制包括两部分：一部分是以待定的参数形式出现的、人类语言所普遍具有的语言原则，又称为“普遍语法”(universal grammar)。","w":"high","e":["2020 真题"]},{"t":"同化与顺应","y":"名词解释","p":["儿童遇到新事物、新经验，总希望把它结合到原有的图式中，使其成为自身的一部分，这就叫同化(assimilation)。","如果同化成功，就会使认识与外界趋于一致，达到暂时的平衡(equilibrium)；如果不能纳入原有的图式，儿童就要调整原有的图式或创立新的图式以适应环境、同化新事物，这就叫顺应(adaptation)。","顺应的结果也使认识与外界趋于一致，达到新的平衡。","同化是个体对环境的作用，顺应是环境对个体的作用，平衡则总是动态的，由一种较低水平的平衡过渡到一种较高水平的平衡。"],"q":"儿童遇到新事物、新经验，总希望把它结合到原有的图式中，使其成为自身的一部分，这就叫同化(assimilation)。","w":"high","e":["2018 真题"]},{"t":"语言功能论","y":"名词解释","p":["语言功能论以韩礼德为代表，别开生面地从语言交际功能的角度研究儿童语言的发展，是第一语言习得的主要理论之一。","在成人的语言体系中，语言结构只是其中的一部分，只是表达意思的手段之一。","儿童习得语言是为了学会如何表达意思，如何用语言做事、进行交际，因此更为重要的是掌握语言的语义体系和语用体系。","儿童习得母语的过程，应看做是逐步探索并掌握用语言来表示功能的各种方式的过程。"],"q":"语言功能论以韩礼德为代表，别开生面地从语言交际功能的角度研究儿童语言的发展，是第一语言习得的主要理论之一。","w":"high","e":["2019 真题"]},{"t":"刺激—反应论","y":"名词解释","p":["刺激—反应论是行为主义心理学的理论，盛行于40年代和50年代，代表人物是斯金纳，是关于第一语言习得的主要理论之一。","行为主义者认为语言不是先天所有而是后天习得的，强调外部条件在第一语言习得过程中的作用。","这种行为跟人类的其他行为一样，是通过刺激—反应—强化的模式养成习惯而学会的；婴儿来到世界时像一张白纸，对这个世界、对语言没有任何先天的知识，完全由环境来塑造其行为。","儿童学话就是对环境所给予的刺激做出相应的反应，开始是对成人语言的模仿，如果模仿得比较接近，就从成人那儿得到奖励或赞许，这样他的反应就得到了强化。"],"q":"刺激—反应论是行为主义心理学的理论，盛行于40年代和50年代，代表人物是斯金纳，是关于第一语言习得的主要理论之一。","w":"high","e":["2018 真题"]},{"t":"语言习得机制","y":"名词解释","p":["乔氏认为人类先天具有一种习得语言的特殊能力，表现为儿童头脑中有一种受遗传因素决定的“语言习得机制”(language acquisition device，简称LAD)。","这一特殊机制脱离人类的其他功能而独立存在，甚至跟智力没有直接关系，在12岁以前发挥作用。","语言习得机制包括两部分：一部分是以待定的参数形式出现的、人类语言所普遍具有的语言原则，又称为“普遍语法”。","语言习得机制的第二部分是评价语言信息的能力，也就是对所接触到的实际语言的核心部分进行语言参数的定值。"],"q":"乔氏认为人类先天具有一种习得语言的特殊能力，表现为儿童头脑中有一种受遗传因素决定的“语言习得机制”(language acquisition device，简称LAD)。","w":"high","e":["2020 真题"]},{"t":"【原文】二、认知因素语言习得的认","y":"教材原文","p":["二、认知因素语言习得的认知因素主要包括智力、学能、学习策略和交际策略以及认知方式"],"q":"二、认知因素语言习得的认知因素主要包括智力、学能、学习策略和交际策略以及认知方式。","w":"normal","e":["原书正文"]},{"t":"【原文】1.智力什么是智力，现在","y":"教材原文","p":["1.智力什么是智力，现在还没有一个公认的定义","大体说来，智力是人的一种心理机能，是成功地认识客观事物和解决问题的各种心理因素的总和，是由观察力、注意力、记忆力、思维能力、想像力和创造力组成的综合能力","人的智力水平用智商(intelligent quotient, 简称 IQ)来表示","智商中等的占人群中的大多数，智商高的和低的较少"],"q":"1.智力什么是智力，现在还没有一个公认的定义。大体说来，智力是人的一种心理机能，是成功地认识客观事物和解决问题的各种心理因素的总和，是由观察力、注意力、记忆力、思维能力、想像力和创造力组成的综合能力。人的智力水平用智商(intelligent quotient, 简称 IQ)来表示。智商中等的占人群中的大多数，智商高的和低的较少。般说来，智商越高，学习效果也","w":"normal","e":["原书正文"]},{"t":"【原文】在第一语言习得过程中，一","y":"教材原文","p":["在第一语言习得过程中，一般认为智力不是决定性的因素","因为只要不是弱智，任何儿童都能获得自己的母语","智力对第二语言习得的影响，一直是学者们关注的问题，但至今也无定论","有的西方学者认为智力在语言学习中所起的作用在各种因素中只占 16%"],"q":"在第一语言习得过程中，一般认为智力不是决定性的因素。 因为只要不是弱智，任何儿童都能获得自己的母语。智力对第二语言习得的影响，一直是学者们关注的问题，但至今也无定论。有的西方学者认为智力在语言学习中所起的作用在各种因素中只占 16%；有的研究表明，年龄小的学习者在学习第二语言时智力因素的影响小，年龄越大影响也越大。在自然语言环境中习得第二语言，智力没有太大的","w":"normal","e":["原书正文"]},{"t":"【原文】尽管智力不是第二语言学习","y":"教材原文","p":["尽管智力不是第二语言学习决定性的因素，但教师还是应当对学习者的这一个体因素有所了解，注意不同智商的学习者在教学方法和学习方法上的差异，特别要鼓励智力一般或较差的学习者，培养"],"q":"尽管智力不是第二语言学习决定性的因素，但教师还是应当对学习者的这一个体因素有所了解，注意不同智商的学习者在教学方法和学习方法上的差异，特别要鼓励智力一般或较差的学习者，培养","w":"normal","e":["原书正文"]},{"t":"【原文】2.语言学能智力对第二语","y":"教材原文","p":["2.语言学能智力对第二语言习得影响较小的原因，可能在于它所包括的并不都是与语言学习特别相关的能力特征","一般是认知能力对语言学习也同样发生作用","但往往出现这样的情况：有的学生其他科目学得很好，但学外语却十分吃力","这说明第二语言习得需要一些特殊的素质"],"q":"2.语言学能智力对第二语言习得影响较小的原因，可能在于它所包括的并不都是与语言学习特别相关的能力特征。一般是认知能力对语言学习也同样发生作用。但往往出现这样的情况：有的学生其他科目学得很好，但学外语却十分吃力。这说明第二语言习得需要一些特殊的素质。这种学习第二语言所需要的特殊认知素质叫做第二语言学习的能力倾向，也称语言学能（language aptitude","w":"normal","e":["原书正文"]},{"t":"【原文】语言学能测验，根据卡罗尔","y":"教材原文","p":["语言学能测验，根据卡罗尔的观点，主要考查四种能力","这种测验常采用一种人们不熟悉的语言或干脆是人造语言来进行"],"q":"语言学能测验，根据卡罗尔的观点，主要考查四种能力。这种测验常采用一种人们不熟悉的语言或干脆是人造语言来进行。","w":"normal","e":["原书正文"]},{"t":"【原文】(1) 语音编码解码能力","y":"教材原文","p":["(1) 语音编码解码能力","主要指识别语音成分并保持记忆的能力","常采用对一种新的语言从声音辨认符号或从符号辨别声音的试题"],"q":"(1) 语音编码解码能力。主要指识别语音成分并保持记忆的能力。常采用对一种新的语言从声音辨认符号或从符号辨别声音的试题。","w":"normal","e":["原书正文"]},{"t":"【原文】(2) 语法敏感性","y":"教材原文","p":["(2) 语法敏感性","指识别母语句法结构和语法功能的能力","如在试题的句子中找出与例句中某一成分具有相同语法功能的词"],"q":"(2) 语法敏感性。指识别母语句法结构和语法功能的能力。如在试题的句子中找出与例句中某一成分具有相同语法功能的词。","w":"normal","e":["原书正文"]}]},{"id":"yinlun-c05-s03","t":"第三节 第二语言习得理论和假说","w":"high","n":19,"k":[{"t":"化石化","y":"名词解释","p":["中介语的偏误有顽固性，语言中的某一部分可能会停滞不前，产生“僵化”或“化石化”(fossilization)的现象，特别表现在语音方面。","僵化的原因是多方面的。","可能是第一语言的影响无法消除；也可能是学习者意识到该偏误并不妨碍交际、甚至还得到过积极的反馈，便满足于已取得的进步而停滞不前；还可能是对目的语的某些方面形成偏见无法接受等。","第二语言学习者完全达到目的语的彼岸、具有说母语者的水平的情况很少，大部分学习者可能一辈子使用的都是中介语。"],"q":"中介语的偏误有顽固性，语言中的某一部分可能会停滞不前，产生“僵化”或“化石化”(fossilization)的现象，特别表现在语音方面。","w":"high","e":["2020 真题"]},{"t":"内在大纲","y":"名词解释","p":["科德于1967年在其《学习者言语错误的重要意义》一文中提出，第二语言学习者在语言习得的过程中有其自己的内在大纲(built-in syllabus)。","而学习者的种种偏误正是这种内在大纲的反映。","学习者不是被动地服从教师的教学安排、接受所教的语言知识，而是跟儿童习得母语一样，有其自身的规律和顺序。这一顺序并非完全按照语言形式的难易，有迹象显示它与课堂上所教的语法规则的顺序并不一样。","内在大纲实际上是人类掌握语言的客观的、普遍的规律，教师只能在有限的范围内控制教学过程，无法完全控制学习者对输入的语言的内化过程。"],"q":"科德于1967年在其《学习者言语错误的重要意义》一文中提出，第二语言学习者在语言习得的过程中有其自己的内在大纲(built-in syllabus)。","w":"high","e":["2019 真题"]},{"t":"输入假说","y":"名词解释","p":["从70年代末开始，美国语言教育家克拉申对第二语言习得提出了一系列假说，1985年在其著作《输入假说：理论与启示》中正式归纳为习得与学习假说、自然顺序假说、监控假说、输入假说和情感过滤假说等五个系列假说，总称为输入假说理论。","这一理论被认为是第二语言习得研究中论述最全面、影响最大的理论，但同时也是引起很多争议的理论。","输入假说认为人类获得语言的惟一方式是对信息的理解，也就是通过吸收可理解的输入(comprehensible input)习得语言知识；输入的语言信息既不要过难也不要过易，克拉申用“i+1”来表示，i代表学习者目前的语言水平，i+1则是下一阶段应达到的语言结构的水平。","克拉申强调听力活动对语言习得最为重要，语言习得是通过听力理解来实现的，而不是通过“说”获得的。"],"q":"从70年代末开始，美国语言教育家克拉申对第二语言习得提出了一系列假说，1985年在其著作《输入假说：理论与启示》中正式归纳为习得与学习假说、自然顺序假说、监控假说、输入假说和情感过滤假说等五个系列假说，总称为输入假说理论。","w":"high","e":["2025 真题"]},{"t":"监控假说","y":"名词解释","p":["监控假说认为，与习得和学习分别相联系，人的头脑中有两个独立的语言系统，一是潜意识的系统，一是有意识的系统，而且两个系统似乎存在于大脑的不同部位。","流利地运用第二语言靠习得，交际中使用的输出的话语是由潜意识的习得系统引起或“驱动”的。","通过学习所获得的有意识的系统语言知识和规则，并不能使学习者表达得更为流利；有意识的系统在言语行为中只有一项功能，即只能作为一个监督者、一个编辑，起监控(monitor)的作用，对输出的言语形式进行检查和控制。","这种监控可能在说话前，也可能在说话同时甚至是说话之后进行校正。"],"q":"监控假说认为，与习得和学习分别相联系，人的头脑中有两个独立的语言系统，一是潜意识的系统，一是有意识的系统，而且两个系统似乎存在于大脑的不同部位。","w":"high","e":["2020 真题"]},{"t":"习得顺序假说","y":"名词解释","p":["70年代进行的较有影响的研究是杜雷(H. Dulay)和伯特(M. Burt)按照布朗(R. Brown)研究儿童习得母语英语语素顺序的实验方法，率先进行的儿童习得作为第二语言的英语的语素习得顺序(acquisition order)的实验。","这些实验的结果发现，不同母语背景、不同年龄的英语作为第二语言的学习者，有非常相似的英语语素习得顺序。","这一顺序反映在克拉申于1982年列出的九项英语语素习得“自然顺序”表中，他认为从第一组到第四组的习得顺序是固定不变的。","克拉申赞同科德的内在大纲假说，认为人们习得语言规则有一个可以预测的共同顺序：有的先习得，有的后习得。"],"q":"70年代进行的较有影响的研究是杜雷(H. Dulay)和伯特(M. Burt)按照布朗(R. Brown)研究儿童习得母语英语语素顺序的实验方法，率先进行的儿童习得作为第二语言的英语的语素习得顺序(acquisition order)的实验。","w":"high","e":["2019 真题"]},{"t":"情感过滤假说","y":"名词解释","p":["情感过滤假说也称屏蔽效应假说，是克拉申输入假说理论的重要组成部分。","第二语言学习者在学习和生活中有各种各样接触目的语的机会，这都是输入，但输入的语言信息有时并没有被吸收。","人类头脑中这种对语言的堵塞现象，是由于情感对输入的信息起了过滤作用，称为“情感过滤”(the affective filter)，或者说成为把输入挡在外边的屏障。","而造成这种过滤或屏障的主要是一些心理因素，如学习的动力、对所学语言的态度、自信心、是否紧张焦虑、是否处于防卫状态、怕出丑，甚至精神和身体状况不佳都能产生屏蔽效应，挡住输入。"],"q":"情感过滤假说也称屏蔽效应假说，是克拉申输入假说理论的重要组成部分。","w":"high","e":["2025 真题"]},{"t":"文化适应假说","y":"名词解释","p":["文化适应假说由舒曼(J. Schumann)提出，从文化与语言的关系出发，把第二语言习得的过程看做是逐步适应目的语文化的过程。","把整个第二语言习得看做是文化适应的一部分，认为第二语言学习者对目的语文化的适应程度决定该目的语掌握的程度。","所谓文化适应是指学习者与目的语社团的社会和心理的结合，因此，学习者与目的语文化的社会距离与心理距离，就成了影响第二语言习得的主要因素。","心理距离主要指学习者在情感方面影响到第二语言习得的因素，包括语言障碍带来的焦虑，文化震荡带来的恐惧紧张以及动机、自尊心等。"],"q":"文化适应假说由舒曼(J. Schumann)提出，从文化与语言的关系出发，把第二语言习得的过程看做是逐步适应目的语文化的过程。","w":"high","e":["2025 真题"]},{"t":"第二语言习得","y":"名词解释","p":["正因为第二语言学习中也包含有习得的因素，越来越多的人把第二语言学习也称为第二语言习得。","在第二语言学习理论的研究中，特别是西方学者的研究文章中已出现用术语“习得”代替“学习”的趋向。","有关第二语言习得的理论和模式，西方学者已提出不下数十种，从各个不同的角度论述或解释第二语言是如何习得的。","其中有的理论虽然影响不小，但尚未得到足够的科学实验的证实，还只能称为假说。"],"q":"正因为第二语言学习中也包含有习得的因素，越来越多的人把第二语言学习也称为第二语言习得。","w":"high","e":["2019 真题"]},{"t":"正迁移与负迁移","y":"名词解释","p":["迁移(transfer)是心理学的概念，指在学习过程中已获得的知识、技能和方法、态度等对学习新知识、技能的影响。","这种影响有的起积极、促进的作用，叫正迁移(positive transfer)，有的起阻碍的作用，叫负迁移(negative transfer)，也叫干扰。","拉多认为第二语言与第一语言相似的语言成分容易学，不同的成分则难学。","也就是说两种语言结构特征相同之处产生正迁移，两种语言的差异导致负迁移。"],"q":"迁移(transfer)是心理学的概念，指在学习过程中已获得的知识、技能和方法、态度等对学习新知识、技能的影响。","w":"high","e":["2020 真题"]},{"t":"语言原则参数理论","y":"名词解释","p":["普遍语法理论不仅是语法理论，也是语言习得的理论，用来解释第一语言是如何习得的、语言习得机制是如何发挥作用的。","乔氏认为婴儿的“最初语言状态”包括人类语言共有的语言原则和尚未定值的语言参数。","婴儿接触到具体的语言(如母语)通过假设—验证给这些语言参数定值，逐渐形成他母语的规则系统，这就是“语言原则参数”理论。","有实验表明，在第二语言习得中普遍语法仍起作用，人们对所接触到的第二语言的语言参数值可以再定值。"],"q":"普遍语法理论不仅是语法理论，也是语言习得的理论，用来解释第一语言是如何习得的、语言习得机制是如何发挥作用的。","w":"high","e":["2020 真题"]},{"t":"洋泾浜化假说","y":"名词解释","p":["在社会与心理距离太大的情况下，学习者的语言就会停留在初级阶段形成洋泾浜化，即使在自然的语言环境中也不一定能习得目的语，这就是舒曼提出的洋泾浜化假说(Pidginization Hypothesis)。","而社会距离和心理距离二者之间，社会距离又起着主导的作用。","文化适应假说从文化与语言的关系出发，把第二语言习得的过程看做是逐步适应目的语文化的过程。","由缩短的社会距离或由好的社会因素所形成的有利的语言环境，能促成第二语言的习得；否则则起相反的作用。"],"q":"在社会与心理距离太大的情况下，学习者的语言就会停留在初级阶段形成洋泾浜化，即使在自然的语言环境中也不一定能习得目的语，这就是舒曼提出的洋泾浜化假说(Pidginization Hypothesis)。","w":"normal","e":["核心概念"]},{"t":"【原文】第二语言的情感因素与儿童","y":"教材原文","p":["第二语言的情感因素与儿童的不同之处","过高的抑制心理显然不利于第二语言的习得，学习者和教师需要在学习过程中逐步排除这一·心理屏障"],"q":"第二语言的情感因素与儿童的不同之处。过高的抑制心理显然不利于第二语言的习得，学习者和教师需要在学习过程中逐步排除这一·心理屏障。","w":"normal","e":["原书正文"]},{"t":"【原文】(3) 焦虑","y":"教材原文","p":["焦虑是一种性格特征","具有这种性格的人在做事之前或做事之后都可能产生对能否做好事情的焦急、担心和忧虑的情绪","这里所指的是第二语言学习中所产生的焦虑","有的研究表明，38%的学习者认为在第二语言课上比在别的课上更为焦虑"],"q":"(3) 焦虑。焦虑是一种性格特征。具有这种性格的人在做事之前或做事之后都可能产生对能否做好事情的焦急、担心和忧虑的情绪。这里所指的是第二语言学习中所产生的焦虑。有的研究表明，38%的学习者认为在第二语言课上比在别的课上更为焦虑。第二语言学习中的焦虑常表现为交际焦虑、考试焦虑和对负面评价的焦虑几个方面。有关焦虑与第二语言习得的关系，也有相互矛盾的调查结果。一般","w":"normal","e":["原书正文"]},{"t":"【原文】教师在平时要给学生适度的","y":"教材原文","p":["教师在平时要给学生适度的焦虑以促进其学习，但对焦虑过重的学生、特别是性格上容易产生焦虑的学生，则应多做工作","缓解焦虑的有效办法是：事前做好充分准备，对困难有足够的估计并想出克服困难的方法和措施，能看到有利条件和已取得的成绩，对完成任务有信心"],"q":"教师在平时要给学生适度的焦虑以促进其学习，但对焦虑过重的学生、特别是性格上容易产生焦虑的学生，则应多做工作。缓解焦虑的有效办法是：事前做好充分准备，对困难有足够的估计并想出克服困难的方法和措施，能看到有利条件和已取得的成绩，对完成任务有信心。","w":"normal","e":["原书正文"]},{"t":"【原文】(4) 移情","y":"教材原文","p":["移情(empathy)是指设身处地领会别人的思想和感情","这是人与人交往中相互沟通、消除隔阂、达到和谐相处的必要条件","语言是达到移情的主要手段，在语言交际过程中双方都要不断做出假设，揣摸从对方输人的信息所表达的意思以及将要输入的是什么信息，同时还要时刻推测自己输出的信息是否为对方所理解","做出假设和判断就离不开移情"],"q":"(4) 移情。移情(empathy)是指设身处地领会别人的思想和感情。这是人与人交往中相互沟通、消除隔阂、达到和谐相处的必要条件。语言是达到移情的主要手段，在语言交际过程中双方都要不断做出假设，揣摸从对方输人的信息所表达的意思以及将要输入的是什么信息，同时还要时刻推测自己输出的信息是否为对方所理解。做出假设和判断就离不开移情。 由于认知因素和情感因素的差异，","w":"normal","e":["原书正文"]},{"t":"【原文】的情况：一方的话才说出半","y":"教材原文","p":["的情况：一方的话才说出半句，另一方就心领神会，于是谈话就能愉快地、不断地继续下去","反之，如果一方的话会让另一方做出错误判断，产生种种误解，这就出现了“话不投机”的情况而使交际索然无味，甚至无法进行下去","运用第二语言进行交际，除了认知和情感方面的差异外，更存在双方在文化上的差异和语言方面的障碍，更需要双方跨出自我的疆界，运用更多的移情来理解对方的文化特点和语言结构特点"],"q":"的情况：一方的话才说出半句，另一方就心领神会，于是谈话就能愉快地、不断地继续下去。反之，如果一方的话会让另一方做出错误判断，产生种种误解，这就出现了“话不投机”的情况而使交际索然无味，甚至无法进行下去。运用第二语言进行交际，除了认知和情感方面的差异外，更存在双方在文化上的差异和语言方面的障碍，更需要双方跨出自我的疆界，运用更多的移情来理解对方的文化特点和语言","w":"normal","e":["原书正文"]},{"t":"【原文】通过实验对移情与第二语言","y":"教材原文","p":["通过实验对移情与第二语言习得的关系研究所得的结果也不一致","有的学者特别强调移情与第二语言发音能力相关，也有的学者认为移情不仅对语音、而且对词汇、语法等各个方面都是十分重要的","这一观点虽有待于实验的进一步证实，但从常理推测不是没有道理的","掌握一种新的语言、建立新的语言自我，不仅因涉及到对自己的评价而影响到自尊心的问题，而且也必然涉及到性格的其他方面，需要哪怕是暂时地放弃一部分自己的个性特征并建立新的个性特征"],"q":"通过实验对移情与第二语言习得的关系研究所得的结果也不一致。有的学者特别强调移情与第二语言发音能力相关，也有的学者认为移情不仅对语音、而且对词汇、语法等各个方面都是十分重要的。这一观点虽有待于实验的进一步证实，但从常理推测不是没有道理的。掌握一种新的语言、建立新的语言自我，不仅因涉及到对自己的评价而影响到自尊心的问题，而且也必然涉及到性格的其他方面，需要哪怕是","w":"normal","e":["原书正文"]},{"t":"【原文】以上分析了个体因素中的生","y":"教材原文","p":["以上分析了个体因素中的生理因素、认知因素和情感因素","我们可以充分体会到上述诸因素在第二语言习得中的重要作用","不对这些因素进行全面的研究，就很难正确了解第二语言的习得过程与规律，在教学实践中也就心中无数","问题在于尽管西方学者对这些方面的调查研究已进行了二三十年，但所得出的结果很不一致，而且很多情况下缺乏可靠的研究手段，很难用实验方法加以证实"],"q":"以上分析了个体因素中的生理因素、认知因素和情感因素。我们可以充分体会到上述诸因素在第二语言习得中的重要作用。不对这些因素进行全面的研究，就很难正确了解第二语言的习得过程与规律，在教学实践中也就心中无数。问题在于尽管西方学者对这些方面的调查研究已进行了二三十年，但所得出的结果很不一致，而且很多情况下缺乏可靠的研究手段，很难用实验方法加以证实。主要原因在于人的情","w":"normal","e":["原书正文"]},{"t":"【原文】式、动机、态度、性格，或","y":"教材原文","p":["式、动机、态度、性格，或性格中的自尊、抑制、焦虑、移情等分离出来专门加以研究","因此在很多问题上除了根据常理推断或是凭经验而形成一定的看法外，还不能通过精确的实验达成共识，因此也就不能真正了解到这些个体因素对第二语言习得究竟产生何种影响"],"q":"式、动机、态度、性格，或性格中的自尊、抑制、焦虑、移情等分离出来专门加以研究。因此在很多问题上除了根据常理推断或是凭经验而形成一定的看法外，还不能通过精确的实验达成共识，因此也就不能真正了解到这些个体因素对第二语言习得究竟产生何种影响。","w":"normal","e":["原书正文"]}]}]},{"id":"yinlun-c06","t":"第六章 第二语言习得研究","w":"high","s":[{"id":"yinlun-c06-s01","t":"第一节 第二语言习得过程研究","w":"high","n":22,"k":[{"t":"中介语","y":"名词解释","p":["美国语言学家塞林克于1969年提出中介语(interlanguage)的概念，1972年在其著名论文《中介语》中提出的中介语假说。","中介语是指在第二语言习得过程中，学习者通过一定的学习策略，在目的语输入的基础上所形成的一种既不同于其第一语言也不同于目的语、随着学习的进展向目的语逐渐过渡的动态的语言系统。","中介语既指学习者语言发展的任何一个阶段的“静态”语言系统，可以把它看做是某一阶段的“切片”；也是指学习者从零起点到靠近目的语的语言发展轨迹，可以把它看做是各阶段相接而形成的一种连续体。","中介语在其发展过程中的任何一个阶段都是学习者创造的一种介于第一语言和目的语之间的独特的语言系统；中介语不是固定不变的，而是一个不断变化的动态语言系统。"],"q":"美国语言学家塞林克于1969年提出中介语(interlanguage)的概念，1972年在其著名论文《中介语》中提出的中介语假说。","w":"high","e":["2020 真题"]},{"t":"对比分析","y":"名词解释","p":["对比分析(Contrastive Analysis)是将两种语言的系统进行共时比较，以揭示其相同点和不同点的一种语言分析方法。","把对比分析运用到第二语言教学中来，始于40年代的美国；提出第二语言习得的对比分析假说并建立起对比分析的理论系统的，是拉多。","对比分析的语言学理论基础是结构主义语言学，其心理学的理论基础是行为主义心理学和迁移理论。","对比分析大体上按照描写、选择、对比、预测四个步骤进行。"],"q":"对比分析(Contrastive Analysis)是将两种语言的系统进行共时比较，以揭示其相同点和不同点的一种语言分析方法。","w":"high","e":["2019 真题"]},{"t":"偏误分析","y":"名词解释","p":["偏误分析(Error Analysis)是对学习者在第二语言习得过程中所产生的偏误进行系统的分析，研究其来源，揭示学习者的中介语体系，从而了解第二语言习得的过程与规律。","科德是偏误分析最早的倡导者。","偏误分析的心理学基础是认知理论，语言学基础则是乔姆斯基的普遍语法理论。","第二语言习得过程被看成是规则形成的过程，即学习者不断从目的语的输入中尝试对目的语规则做出假设，并进行检验与修正，逐渐向目的语靠近并建构目的语的规则体系。"],"q":"偏误分析(Error Analysis)是对学习者在第二语言习得过程中所产生的偏误进行系统的分析，研究其来源，揭示学习者的中介语体系，从而了解第二语言习得的过程与规律。","w":"high","e":["2020 真题"]},{"t":"运用分析","y":"名词解释","p":["运用分析(Performance Analysis)和话语分析(Discourse Analysis)也始于70年代，到80年代人们才更为重视第二语言习得运用分析与话语分析的研究。","运用分析是对第二语言学习者运用目的语的全部表现(既包括偏误部分也包括正确部分)进行分析，从而揭示中介语的发展轨迹。","迄今为止，西方学者的运用分析研究主要集中于对英语语素习得顺序的研究和对英语某些句法结构发展进程的研究；70年代初开始的语素研究，可以看做是最早的运用分析研究。","对英语某些句法结构如否定句、疑问句、关系从句等发展过程的研究，主要采用对一个或数个被试的语言运用进行较长期的跟踪调查。"],"q":"运用分析(Performance Analysis)和话语分析(Discourse Analysis)也始于70年代，到80年代人们才更为重视第二语言习得运用分析与话语分析的研究。","w":"high","e":["2019 真题"]},{"t":"话语分析","y":"名词解释","p":["话语分析作为一种语言研究方法，在第三章第二节已经做了介绍；70年代末大力倡导把话语分析用于第二语言习得研究的是哈奇(E. Hatch)。","她认为语言习得最重要的途径是语言交际，即第二语言学习者与以该语言为母语者之间的交谈，因此特别强调研究话语分析中的会话分析。","也有的学者认为不仅要研究学习者如何掌握语言形式，还要研究如何恰当地运用这些形式，因而强调研究言语行为和功能(如抱歉、邀请、埋怨等)。","对语言形式和功能的重视，打开了话语分析研究的广阔领域。"],"q":"话语分析作为一种语言研究方法，在第三章第二节已经做了介绍；70年代末大力倡导把话语分析用于第二语言习得研究的是哈奇(E. Hatch)。","w":"high","e":["2020 真题"]},{"t":"偏误与失误","y":"名词解释","p":["科德把学习者所犯的错误分为失误(mistake)和偏误(error)两种。","所谓失误是指偶然产生的口误或笔误，如本想说“甲”，但临时因紧张或是疏忽说成了“乙”。这种错误没有什么规律，即使操本族语的人也常常会发生。","偏误则是指由于目的语掌握不好而产生的一种规律性错误，它偏离了目的语的轨道，反映了说话者的语言能力和水准。","这类规律性的偏误正是中介语特征的反映，是偏误分析要研究的主要内容。"],"q":"科德把学习者所犯的错误分为失误(mistake)和偏误(error)两种。","w":"high","e":["2019 真题"]},{"t":"对比分析法","y":"名词解释","p":["对比分析法是语言研究和语言教学研究最常用的方法，用来对两种或多种语言的相同和相异之点、两种或多种语言的习得或教学规律的相同和相异之点进行对比研究，以加深对所比较的事物的认识，从而发现新的特征和新的规律。","对比分析法有着广阔的天地，可以进行不同事物之间的共时横向比较，也可以进行同一事物的历时纵向比较；可以进行定量比较，也可以进行定性比较；可以进行专项比较，也可以进行综合比较。","具体地说，第一语言习得和第二语言学习的比较，第二语言学习和外语学习的比较，不同母语的学习者学习同一目的语的比较，同一语言学习者学习不同目的语的比较，不同学习策略或不同的教学方法流派的比较等等，都是很好的研究课题。"],"q":"对比分析法是语言研究和语言教学研究最常用的方法，用来对两种或多种语言的相同和相异之点、两种或多种语言的习得或教学规律的相同和相异之点进行对比研究，以加深对所比较的事物的认识，从而发现新的特征和新的规律。","w":"high","e":["2019 真题"]},{"t":"偏误分析法","y":"名词解释","p":["偏误分析已成为第二语言习得过程研究和中介语研究的最重要的方法之一。","不少对外汉语教师正在从事这方面的研究工作，成果相对说来也比较多。","现在应当对这一研究方法进行总结。要避免重复研究或是同一水平上的研究，就需要与其他的研究方法如实验法、话语分析法等相结合，开创研究的新局面。"],"q":"偏误分析已成为第二语言习得过程研究和中介语研究的最重要的方法之一。","w":"high","e":["2019 真题"]},{"t":"对比分析假说","y":"名词解释","p":["对比分析假说由拉多于50年代中期行为主义鼎盛时期提出，认为第二语言的获得也是通过刺激—反应—强化形成习惯的结果。","拉多认为第二语言与第一语言相似的语言成分容易学，不同的成分则难学；两种语言结构特征相同之处产生正迁移，两种语言的差异导致负迁移。","迁移(transfer)是心理学的概念，指在学习过程中已获得的知识、技能和方法、态度等对学习新知识、技能的影响。这种影响有的起积极、促进的作用，叫正迁移，有的起阻碍的作用，叫负迁移，也叫干扰。","负迁移造成第二语言习得的困难和学生的错误，这就是对比分析假说。"],"q":"对比分析假说由拉多于50年代中期行为主义鼎盛时期提出，认为第二语言的获得也是通过刺激—反应—强化形成习惯的结果。","w":"high","e":["2018 真题"]},{"t":"难度等级模式","y":"名词解释","p":["难度等级模式由普拉克特(C. Practor)提出，是一种分类比较简明的语言难度等级模式。","该模式将难度分为六级，从零级到五级，级数愈高难度也愈大。","零级：指两种语言中相同的成分，在学习中产生正迁移，而不会发生困难。如英语和汉语都是“动词＋宾语”的语序。","一级：在第一语言中分开的两个语言项目，在目的语中合成一项。二级：第一语言中有而目的语中没有的语言项目，学生必须避免使用。三级：第一语言中的某个语言项目在目的语中虽有相应的项目，但在项目的形式、分布和使用方面又有着差异。四级：目的语中的某个语言项目，在其第一语言中没有相应的项目，学习者在习得这些全新的项目时会产生阻碍性干扰。五级：第一语言中的一个语言项目到了目的语中分成两个或两个以上的项目，是本模式中难度最高的一项。"],"q":"难度等级模式由普拉克特(C. Practor)提出，是一种分类比较简明的语言难度等级模式。","w":"high","e":["2020 真题"]},{"t":"目的语知识负迁移","y":"名词解释","p":["目的语知识负迁移指学习者把他所学的有限的、不充分的目的语知识，用类推的办法不适当地套用在目的语新的语言现象上，造成了偏误，也称为过度概括(over-generalization)或过度泛化。","这类偏误一般在其母语中找不到根源，而且不同母语背景的学习者常常出现同样的偏误。","如果说由于母语负迁移所造成的偏误在学习的初级阶段占优势，到中级阶段或高级阶段目的语知识负迁移造成的偏误就逐渐占了优势，这是学习者内化规则过程中所产生的偏误。","表现在语音方面，如学习汉语第三声声调先降后升是学习者的一大难点；再如字母ü在 ju、qu、xu、yu等音节的拼写中，上边的两点要省去，学习者常常把这些音节中省去两点的ü读成u。"],"q":"目的语知识负迁移指学习者把他所学的有限的、不充分的目的语知识，用类推的办法不适当地套用在目的语新的语言现象上，造成了偏误，也称为过度概括(over-generalization)或过度泛化。","w":"high","e":["2020 真题"]},{"t":"语内偏误与语际偏误","y":"名词解释","p":["进一步分析，人们把第二语言学习者在学习过程中由于对目的语规则掌握不全面或因错误推断而造成的偏误称为语内偏误。","把由于第一语言的干扰造成的偏误称为语际偏误。","偏误的来源包括母语负迁移、目的语知识负迁移、文化因素负迁移、学习策略和交际策略的影响、学习环境的影响等五个主要方面。","母语负迁移又特别体现在目的语语音的学习中，用学习者第一语言的语音规律代替目的语的语音规律是中介语语音的一大特色。"],"q":"进一步分析，人们把第二语言学习者在学习过程中由于对目的语规则掌握不全面或因错误推断而造成的偏误称为语内偏误。","w":"high","e":["2020 真题"]},{"t":"偏误分析是对比分析的继承和发展。","y":"名词解释","p":["偏误分析是对比分析的继承和发展，在中介语理论影响下，突破了对比分析只强调第一语言干扰的局限，弥补了对比分析的不足。"],"q":"正确","w":"high","e":["2020 真题"]},{"t":"科德把偏误分析分为____个步骤。","y":"名词解释","p":["五"],"q":"五","w":"normal","e":["核心概念"]},{"t":"【原文】直接法的语言观认为语言是","y":"教材原文","p":["直接法的语言观认为语言是习惯，语言的运用是靠感觉和记忆而不是思维，其产生的背景是，当时语言学有了进一步的发展，对欧洲几种主要语言做了比较全面的描述与对比，研究的结果证明不同语言的语法结构和词汇并不存在完全等值的关系，这就动摇了语法翻译法的理论基础","而当时语音学的发展，国际音标的制订，为口语教学创造了条件","直接法主要受到从 18世纪末开始、19世纪末已取得一定成果的对儿童语言发展研究的影响，教学过程模仿幼儿习得母语的自然过程(这也是该法又叫“自然法”的原因)","直接法的心理学基础是联想主义心理学，认为人的学习方式与动物一样，是刺激与反应直接联结，否认意识在其间的作用"],"q":"直接法的语言观认为语言是习惯，语言的运用是靠感觉和记忆而不是思维，其产生的背景是，当时语言学有了进一步的发展，对欧洲几种主要语言做了比较全面的描述与对比，研究的结果证明不同语言的语法结构和词汇并不存在完全等值的关系，这就动摇了语法翻译法的理论基础。而当时语音学的发展，国际音标的制订，为口语教学创造了条件。直接法主要受到从 18世纪末开始、19世纪末已取得一定","w":"normal","e":["原书正文"]},{"t":"【原文】(1)目的语与它所代表的","y":"教材原文","p":["(1)目的语与它所代表的事物直接联系，教学中排除母语，排除翻译，采用各种直观手段用目的语学习目的语(第一批词通过实物、239"],"q":"(1)目的语与它所代表的事物直接联系，教学中排除母语，排除翻译，采用各种直观手段用目的语学习目的语(第一批词通过实物、239","w":"normal","e":["原书正文"]},{"t":"【原文】图画或动作演示来讲授)，","y":"教材原文","p":["图画或动作演示来讲授)，课堂教学常用扮演角色或演戏的方式"],"q":"图画或动作演示来讲授)，课堂教学常用扮演角色或演戏的方式。","w":"normal","e":["原书正文"]},{"t":"【原文】(2)不是先学习语法规则","y":"教材原文","p":["(2)不是先学习语法规则，而是靠直接感知，以模仿、操练、记忆为主形成自动的习惯","在一定阶段对已获得的语言材料中的语法规则进行必要的总结和归纳"],"q":"(2)不是先学习语法规则，而是靠直接感知，以模仿、操练、记忆为主形成自动的习惯。在一定阶段对已获得的语言材料中的语法规则进行必要的总结和归纳。","w":"normal","e":["原书正文"]},{"t":"【原文】(3)以口语教学为基础，","y":"教材原文","p":["(3)以口语教学为基础，先听说后读写","认为口语是第一性的，先学话后学书面语是学习语言的自然途径","重视语音教学，强调语音、语调、语速的规范"],"q":"(3)以口语教学为基础，先听说后读写。认为口语是第一性的，先学话后学书面语是学习语言的自然途径。重视语音教学，强调语音、语调、语速的规范。","w":"normal","e":["原书正文"]},{"t":"【原文】(4) 以句子为教学的基","y":"教材原文","p":["(4) 以句子为教学的基本单位，整句学、整句运用，而不是从单音或孤立的单词开始","句子是言语交际的基本单位，词语的意义只有在句子中才能明确掌握，词语连成句子也便于记忆"],"q":"(4) 以句子为教学的基本单位，整句学、整句运用，而不是从单音或孤立的单词开始。句子是言语交际的基本单位，词语的意义只有在句子中才能明确掌握，词语连成句子也便于记忆。","w":"normal","e":["原书正文"]},{"t":"【原文】(5)以当代通用语言为基","y":"教材原文","p":["(5)以当代通用语言为基本教材，学习生动的、活的语言，而不是文学名著中典雅、但已过时的语言","从有限的常用语言材料开始，对常用词、常用句式按其使用频率进行科学的筛选"],"q":"(5)以当代通用语言为基本教材，学习生动的、活的语言，而不是文学名著中典雅、但已过时的语言。从有限的常用语言材料开始，对常用词、常用句式按其使用频率进行科学的筛选。","w":"normal","e":["原书正文"]},{"t":"【原文】所谓直接法，实际上是指改","y":"教材原文","p":["所谓直接法，实际上是指改革运动前后出现的一些体现以上基本特点、同时又各具特色的第二语言教学法的总称","其中最具代表性、影响最大的是贝力子于１８７８年开始创办的贝力子外语学校所采用的贝力子教学法，这种专门从事短期第二语言教学的贝力子外语学校，遍及欧美各国，第一次世界大战前夕曾达到340所","至今世界上仍有不少贝力子学校在进行外语教学","贝力子口语教学法严格按照幼儿学语的方法，强调演示而避免翻译"],"q":"所谓直接法，实际上是指改革运动前后出现的一些体现以上基本特点、同时又各具特色的第二语言教学法的总称。其中最具代表性、影响最大的是贝力子于１８７８年开始创办的贝力子外语学校所采用的贝力子教学法，这种专门从事短期第二语言教学的贝力子外语学校，遍及欧美各国，第一次世界大战前夕曾达到340所。至今世界上仍有不少贝力子学校在进行外语教学。贝力子口语教学法严格按照幼儿学","w":"normal","e":["原书正文"]}]},{"id":"yinlun-c06-s02","t":"第二节 学习者的个体因素","w":"high","n":21,"k":[{"t":"动机","y":"名词解释","p":["动机(motivation)在情感因素中又占极其重要的地位。动机是激励个体从事某种行为的内在动力，常表现为为达到某种目的而付出努力的愿望。","调查结果发现，在影响第二语言学习的诸因素中，动机占33%，学能占33%，智力占20%，其他占14%。","第二语言习得的动机是推动学习者学习并达到掌握第二语言目的的一种强烈愿望，包括目的、要达到目的的愿望、对学习的态度和努力行动四个方面。","动机有内部动机和外部动机之分，内部动机是个体自身所产生的动力，外部动机是外部因素作用的结果；动机还有近景动机和远景动机之分。"],"q":"动机(motivation)在情感因素中又占极其重要的地位。动机是激励个体从事某种行为的内在动力，常表现为为达到某种目的而付出努力的愿望。","w":"high","e":["2021 真题"]},{"t":"态度","y":"名词解释","p":["态度是构成动机的主要因素之一。它是个体对某种客观事物的评价性反应，是在对事物了解的基础上产生情感上的褒贬好恶，并反映出对之采取行动的倾向性。","西方学者的调查表明，学习第二语言的态度与所取得的学习成绩之间的关系高于学习其他科目的态度与成绩之间的关系。","影响学习态度的几个方面是：对目的语社团和文化的态度、对目的语的态度、对课程和教师、教材的态度。","对大多数学习者来说直接影响其目的语学习态度的还是他们在语言课堂上的感受。"],"q":"态度是构成动机的主要因素之一。它是个体对某种客观事物的评价性反应，是在对事物了解的基础上产生情感上的褒贬好恶，并反映出对之采取行动的倾向性。","w":"high","e":["2019 真题"]},{"t":"移情","y":"名词解释","p":["移情(empathy)是指设身处地领会别人的思想和感情。这是人与人交往中相互沟通、消除隔阂、达到和谐相处的必要条件。","语言是达到移情的主要手段，在语言交际过程中双方都要不断做出假设，揣摸从对方输入的信息所表达的意思以及将要输入的是什么信息。","由于认知因素和情感因素的差异，在同一语言文化的成员之间也需要有一定的移情，理解对方的认知及情感特点和状态，才能使交际顺利进行。","运用第二语言进行交际，除了认知和情感方面的差异外，更存在双方在文化上的差异和语言方面的障碍，更需要双方跨出自我的疆界，运用更多的移情来理解对方的文化特点和语言结构特点。"],"q":"移情(empathy)是指设身处地领会别人的思想和感情。这是人与人交往中相互沟通、消除隔阂、达到和谐相处的必要条件。","w":"high","e":["2020 真题"]},{"t":"抑制","y":"名词解释","p":["与自尊心有着密切关系的是抑制。抑制是个体的一种防御外部伤害、保护自我的心理屏障。","婴儿一生下来没有自我意识，甚至不能区分自我和周围世界；随着年龄的增长，自我意识逐渐形成。","从青少年时期开始，自我意识进一步发展，害怕自我暴露太多而使自尊心受到伤害，于是采用抑制的方法保护自我。","到了青春期随着在生理、认知和情感上受到的挫折增多，个体意识到不仅要认识自己还要认识周围的环境与社会，因而用于自我保护的抑制心理更为增强，而且一直发展到成年期。"],"q":"与自尊心有着密切关系的是抑制。抑制是个体的一种防御外部伤害、保护自我的心理屏障。","w":"high","e":["2020 真题"]},{"t":"语言学能","y":"名词解释","p":["这种学习第二语言所需要的特殊认知素质叫做第二语言学习的能力倾向，也称语言学能(language aptitude)。","一般的智商测验不能准确地预测语言学能，专门用来测量语言学能的是语言学能测验。","有影响的语言学能测验有三种，即由卡罗尔(J. Carroll)和萨彭(S. Sapon)于1959年编制的《现代语言学能考试》和1967年编制的《初级现代语言学能考试》以及由平斯勒(P. Pimsleur)于1966年编制的《语言学能考试》。","语言学能测验，根据卡罗尔的观点，主要考查四种能力：语音编码解码能力、语法敏感性、强记能力、归纳能力。"],"q":"这种学习第二语言所需要的特殊认知素质叫做第二语言学习的能力倾向，也称语言学能(language aptitude)。","w":"high","e":["2020 真题"]},{"t":"学习策略","y":"名词解释","p":["学习策略(learning strategies)是语言学习者为有效地掌握语言规则系统，发展言语技能和语言交际能力，解决学习过程中所遇到的问题而采取的各种计划、途径、步骤、方法、技巧和调节措施。","研究发现，不同学习者所采用的学习策略有很大的一致性和规律性。","综合看来，学习策略大体上可分为认知学习策略和元认知策略(metacognitive strategies)两大类。","根据最早研究学习策略的茹宾(J. Rubin)所提出的六种认知学习策略，可以概括为求解、推理、实践、记忆、监控几个方面。"],"q":"学习策略(learning strategies)是语言学习者为有效地掌握语言规则系统，发展言语技能和语言交际能力，解决学习过程中所遇到的问题而采取的各种计划、途径、步骤、方法、技巧和调节措施。","w":"high","e":["2020 真题"]},{"t":"交际策略","y":"名词解释","p":["交际策略是学习者为顺利进行语言交际活动(即理解对话者的意图和表达自己的意思)有意识采取的计划措施或方法技巧，是语言使用者交际能力的一部分。","西方学者认为一般是在交际中遇到困难，如语言知识不能应付交际需要或缺乏某一特定的语言表达手段，无法按原定计划实现交际目标时，才采用交际策略。","对第二语言学习者来说，其交际活动在一定意义上也是学习活动的一部分，可以获得把学到的语言知识付诸实践进行运用的机会，是实现培养语言交际能力这一目标所不可缺少的。","各种具体的交际策略，实际上也扩充了学习者的语言表现手段。"],"q":"交际策略是学习者为顺利进行语言交际活动(即理解对话者的意图和表达自己的意思)有意识采取的计划措施或方法技巧，是语言使用者交际能力的一部分。","w":"high","e":["2019 真题"]},{"t":"认知方式","y":"名词解释","p":["认知方式(cognitive style)是人们感知和认识世界的方式，对学习者说来，也是其学习方式。","认知方式存在着个体差异，这里着重讨论场独立性和场依存性、审慎与冲动、歧义容忍度等。","场独立性是易于从整体中发现个别的认知方式，善于剖析事物和问题，把部分与整体区别开来，能集中于某一部分而不受其他部分的干扰；场依存性是易于感知事物整体的认知方式，倾向于从宏观上看事物并把事物作为一个整体来对待。","审慎型的人在学习中善于周密地思考，全面分析，反复权衡以后才做决定或反应；冲动型的人在学习中反应快捷，甚至不假思索。"],"q":"认知方式(cognitive style)是人们感知和认识世界的方式，对学习者说来，也是其学习方式。","w":"high","e":["2020 真题"]},{"t":"元认知策略","y":"名词解释","p":["元认知策略就是学习者通过计划、监控和评估等方式对自己的认知过程进行反思和研究。","元认知可以说是对认知的认知，是一种深层次的认知活动，是学习者对自己的能力特点、对认知任务和认知策略的认知。","并通过认知活动中的体验，对认知过程和认知策略进行自我监控和调节，以保证学习活动的成功。","如学习者通过学习成绩的反馈发现自己学习方法的问题，通过与其他人学习策略和学习结果的对比，发现相互之间的差异，从而取长补短提高自己的学习效率。"],"q":"元认知策略就是学习者通过计划、监控和评估等方式对自己的认知过程进行反思和研究。","w":"high","e":["2022 真题"]},{"t":"学习者的个体因素","y":"名词解释","p":["所谓学习者的个体因素，指第二语言学习者个体在习得过程中表现出的、对第二语言习得产生一定影响的生理、认知、情感等方面的特点。","由于语言学习活动必须通过学习者来实现，从这个意义上来说个体因素在语言习得中起决定的作用。","第二语言习得有普遍规律，同时学习者又表现出很多个体因素的特点。","第二语言习得即使是相同年龄、在同一教室的学习者之间，也表现出明显的差异，这种差异直接影响到学习的成绩和最终是否能获得第二语言。"],"q":"所谓学习者的个体因素，指第二语言学习者个体在习得过程中表现出的、对第二语言习得产生一定影响的生理、认知、情感等方面的特点。","w":"high","e":["2019 真题"]},{"t":"场独立性与场依存性","y":"名词解释","p":["场独立性(field independence)是易于从整体中发现个别的认知方式，善于剖析事物和问题，把部分与整体区别开来，能集中于某一部分而不受其他部分的干扰。","场依存性(field dependence)是易于感知事物整体的认知方式，倾向于从宏观上看事物并把事物作为一个整体来对待。","在第二语言学习中，场独立性的学习者由于分析能力强，能从一定的语境中把语言项目分离出来，长于在课堂教学中有意识地学习语言形式；场依存性的学习者则长于在自然语言环境中习得语言，他们关心别人，善于与别人交往。","研究还表明儿童的场依存性倾向大一些，成人的场独立性强，需要在正规的课堂学习环境里学习第二语言。"],"q":"场独立性(field independence)是易于从整体中发现个别的认知方式，善于剖析事物和问题，把部分与整体区别开来，能集中于某一部分而不受其他部分的干扰。","w":"high","e":["2020 真题"]},{"t":"融合型动机与工具型动机","y":"名词解释","p":["对第二语言学习动机的分类影响最大的是由兰伯特(W. Lambert)和加德纳(R. Gardner)所提出的融合型动机和工具型动机。","所谓融合型动机(integrative motivation)是指为了跟目的语社团直接进行交际，与目的语文化有更多的接触、甚至想进一步融合到第二语言社团中成为其一员。","工具型动机(instrumental motivation)是指把第二语言用作工具的实际目的，如查阅资料，进行研究，寻找工作，提高自己的知识水平，改善自己的社会地位等。","一般认为融合型动机更为强烈，所取得的学习效果也更大。"],"q":"对第二语言学习动机的分类影响最大的是由兰伯特(W. Lambert)和加德纳(R. Gardner)所提出的融合型动机和工具型动机。","w":"high","e":["2020 真题"]},{"t":"试论述认知因素对第二语言习得的影响。","y":"名词解释","p":["智力：是成功地认识客观事物和解决问题的各种心理因素的总和，在正式课堂教学中起较大作用","语言学能：学习第二语言所需要的特殊认知素质，主要考查语音编码解码能力、语法敏感性、强记能力、归纳能力","学习策略：大体上可分为认知学习策略和元认知策略两大类","交际策略：是学习者为顺利进行语言交际活动有意识采取的计划措施或方法技巧","认知方式：包括场独立性和场依存性、审慎与冲动、歧义容忍度等","场独立性的学习者长于在课堂教学中有意识地学习语言形式，场依存性的学习者长于在自然语言环境中习得语言"],"q":"语言习得的认知因素主要包括智力、学能、学习策略和交际策略以及认知方式。①智力：智力是人的一种心理机能，是成功地认识客观事物和解决问题的各种心理因素的总和，是由观察力、注意力、记忆力、思维能力、想像力和创造力组成的综合能力。有的西方学者认为智力在语言学习中所起的作用在各种因素中只占16%；在自然语言环","w":"high","e":["2020 真题"]},{"t":"【原文】(1) 自觉性原则","y":"教材原文","p":["(1) 自觉性原则","强调学习者要自觉掌握语法理论知识并理解语义和句子的实际用法，用来指导言语实践活动","可以采取理论先行的方法，也可以用在实践后进行理论概括的方法"],"q":"(1) 自觉性原则。强调学习者要自觉掌握语法理论知识并理解语义和句子的实际用法，用来指导言语实践活动。可以采取理论先行的方法，也可以用在实践后进行理论概括的方法。","w":"normal","e":["原书正文"]},{"t":"【原文】(2)实践性原则","y":"教材原文","p":["(2)实践性原则","第二语言习得的决定性因素是大量的言语实践，７０年代进一步强调交际性的言语实践","这种交际活动不仅是第二语言教学的根本目的，也是主要的教学手段和途径"],"q":"(2)实践性原则。第二语言习得的决定性因素是大量的言语实践，７０年代进一步强调交际性的言语实践。这种交际活动不仅是第二语言教学的根本目的，也是主要的教学手段和途径。","w":"normal","e":["原书正文"]},{"t":"【原文】(3) 功能、情景、题材","y":"教材原文","p":["(3) 功能、情景、题材相结合的原则","在选择和组织语言材料方面，把意念—功能和情景—句型及题材几个方面巧妙地结合在一起，即吸取交际法从语言交际需要出发选择一定语义一功能项目的做法，同时结合结构法在典型情景中选择典型句型的做法，并组织在一定的题材之中"],"q":"(3) 功能、情景、题材相结合的原则。在选择和组织语言材料方面，把意念—功能和情景—句型及题材几个方面巧妙地结合在一起，即吸取交际法从语言交际需要出发选择一定语义一功能项目的做法，同时结合结构法在典型情景中选择典型句型的做法，并组织在一定的题材之中。","w":"normal","e":["原书正文"]},{"t":"【原文】(4)口语领先原则","y":"教材原文","p":["(4)口语领先原则","吸取直接法的主张，特别是在入门和初级阶段体现口语领先原则，在口语教学基础上进行书面语教学"],"q":"(4)口语领先原则。吸取直接法的主张，特别是在入门和初级阶段体现口语领先原则，在口语教学基础上进行书面语教学。","w":"normal","e":["原书正文"]},{"t":"【原文】(5)以句法为基础的原则","y":"教材原文","p":["(5)以句法为基础的原则","与直接法、结构法相同，认为句子是言语的单位，在句子的基础上学习单词和语法有利于培养学习者的言语活动能力"],"q":"(5)以句法为基础的原则。与直接法、结构法相同，认为句子是言语的单位，在句子的基础上学习单词和语法有利于培养学习者的言语活动能力。","w":"normal","e":["原书正文"]},{"t":"【原文】(6)综合性原则","y":"教材原文","p":["(6)综合性原则","语音、词汇、语法、修辞、民俗等方面以及听说读写技能综合进行教学，以培养言语活动能力","但同时也不排除必要的分科教学，在不同阶段对某一方面有所侧重"],"q":"(6)综合性原则。语音、词汇、语法、修辞、民俗等方面以及听说读写技能综合进行教学，以培养言语活动能力。但同时也不排除必要的分科教学，在不同阶段对某一方面有所侧重。","w":"normal","e":["原书正文"]},{"t":"【原文】(7) 考虑母语的原则","y":"教材原文","p":["(7) 考虑母语的原则","课堂上尽可能使用目的语，使目的语与学习者的思维建立联系","在初级阶段不排除有限度地使用学生的母语","翻译和对比可以作为一种教学手段，但翻译不宜作为主要的讲练手段"],"q":"(7) 考虑母语的原则。课堂上尽可能使用目的语，使目的语与学习者的思维建立联系。在初级阶段不排除有限度地使用学生的母语。翻译和对比可以作为一种教学手段，但翻译不宜作为主要的讲练手段；对比应体现在实际言语训练之中，面不是用于讲解。","w":"normal","e":["原书正文"]},{"t":"【原文】以上特点可以看出，自觉实","y":"教材原文","p":["以上特点可以看出，自觉实践法在理论体系上基本应属于直接法一派，但同时吸取了语法翻译法的长处，成为更具综合性的教学方法","自觉实践法体现了60年代以来苏联外语教学改革的经验，也体"],"q":"以上特点可以看出，自觉实践法在理论体系上基本应属于直接法一派，但同时吸取了语法翻译法的长处，成为更具综合性的教学方法。 自觉实践法体现了60年代以来苏联外语教学改革的经验，也体","w":"normal","e":["原书正文"]}]},{"id":"yinlun-c06-s03","t":"第三节 语言学习环境","w":"high","n":10,"k":[{"t":"语言学习环境","y":"名词解释","p":["语言学习环境，是一个内涵与外延较广的概念。可以说，学习者主体以外、与语言学习和运用有关的一切周围事物都是语言学习环境的一部分。","从国家的政治、经济、文化、语言政策、教育政策等所形成的宏观语言环境，到使用目的语的社会大环境和课堂学习小环境。","如果说生理、认知、情感等个体因素是第二语言习得的内部条件的话，环境则是客观存在、影响第二语言习得的外部条件。","不论是一语言或第二语言的获得，都与环境有密切的关系。"],"q":"语言学习环境，是一个内涵与外延较广的概念。可以说，学习者主体以外、与语言学习和运用有关的一切周围事物都是语言学习环境的一部分。","w":"high","e":["2019 真题"]},{"t":"课堂教学与习得的“无关联”与“有关联”","y":"名词解释","p":["克拉申通过英语语素习得研究发现，不论学习者的年龄和母语背景如何，其英语作为第二语言的习得有一固定不变的自然习得顺序，这一习得顺序不受课堂教学的影响。","课堂正式学到的东西也不能变成习得的东西，这是课堂正式教学与第二语言习得“无关联”的观点(non-interface position)。","但是也有不少学者认为尽管正式的课堂教学对学习者的语言习得顺序不起作用，但是获得语法结构的速度却受到正式教学的影响。","这就形成了与克拉申相对的、课堂正式教学与第二语言习得“有关联”的观点(interface position)；其中沙伍德—史密斯与克拉申的观点针锋相对，认为学习先于习得，是习得不可缺少的组成部分。"],"q":"克拉申通过英语语素习得研究发现，不论学习者的年龄和母语背景如何，其英语作为第二语言的习得有一固定不变的自然习得顺序，这一习得顺序不受课堂教学的影响。","w":"high","e":["2020 真题"]},{"t":"【原文】暗示法一期课程共10单元","y":"教材原文","p":["暗示法一期课程共10单元，30天学完，每单元学习3天，其重点是1200单词组成的对话和相关的词汇表、语法注释","暗示法的教学过程--般也分为展示语言材料和运用两个阶段","第一天是展示语言材料，第二天和第三天分别对课文进行初步和进一步讲练和运用","初步练习为对课文对话的模仿、问答、阅读以及对该单元的 150个新词的操练"],"q":"暗示法一期课程共10单元，30天学完，每单元学习3天，其重点是1200单词组成的对话和相关的词汇表、语法注释。暗示法的教学过程--般也分为展示语言材料和运用两个阶段。第一天是展示语言材料，第二天和第三天分别对课文进行初步和进一步讲练和运用。初步练习为对课文对话的模仿、问答、阅读以及对该单元的 150个新词的操练；进一步练习包括鼓励学生根据课文对话进行重组和改","w":"normal","e":["原书正文"]},{"t":"【原文】暗示法对课堂环境的布置有","y":"教材原文","p":["暗示法对课堂环境的布置有特殊要求，把教学环境作为间接教材的一部分","要求教室有可调节的柔和光线，有播放音乐的设备，墙上贴有目的语国家美丽的图片，舒适的软椅排成半圆形，甚至可以用沙发、地毯和床来代替课桌椅","学生或躺或坐，心情松弛、平静而愉快","教师让学生听几段经过特别选择、深沉而富有哲理的古典乐曲或现代轻音乐，使学生进人一定的音乐状态"],"q":"暗示法对课堂环境的布置有特殊要求，把教学环境作为间接教材的一部分。要求教室有可调节的柔和光线，有播放音乐的设备，墙上贴有目的语国家美丽的图片，舒适的软椅排成半圆形，甚至可以用沙发、地毯和床来代替课桌椅。学生或躺或坐，心情松弛、平静而愉快。教师让学生听几段经过特别选择、深沉而富有哲理的古典乐曲或现代轻音乐，使学生进人一定的音乐状态。为了消除紧张心理和一切杂念，","w":"normal","e":["原书正文"]},{"t":"【原文】歇，有时允许学生活动一下","y":"教材原文","p":["歇，有时允许学生活动一下","在第二部分音乐开始之前也有几分钟的静默，教师再朗读课文并要学生合上书听","学生以轻松愉快的心情听教师的朗读，可以产生有意和无意的认知活动，在不知不觉中记住许多语言材料"],"q":"歇，有时允许学生活动一下。在第二部分音乐开始之前也有几分钟的静默，教师再朗读课文并要学生合上书听。学生以轻松愉快的心情听教师的朗读，可以产生有意和无意的认知活动，在不知不觉中记住许多语言材料。","w":"normal","e":["原书正文"]},{"t":"【原文】暗示法特别强调在第二语言","y":"教材原文","p":["暗示法特别强调在第二语言教学中运用心理、生理学规律和心理疗法的方式，对教学过程进行心理组织","是一种颇具特色的教学方法，给第二语言教学带来很多有益的启示，也成为欧洲教学法的一个热门讨论题","汉语作为第二语言教学界也用这一方法进行试验，所以本书做了较详细的介绍"
