<!DOCTYPE html>
<html lang="zh-CN">
<head>

<script>(function(){try{var t=localStorage.getItem("theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(_){}})();</script>
<style>
/* ============================================================
   M3 配色：种子色 0xFF28C840（TreeChat ThemePalette.DEFAULT_GREEN）
   用 OKLCH 复现 HCT Tonal Spot 映射，深色主题下
   primary=tone80 / primaryContainer=tone30 / surface=tone6 这一套配对
   ============================================================ */
:root{
  /* ---------- 温暖手账质感配色 (Warm Journal Paper & Morandi Notes) ---------- */
  --h:85;

  /* 根卡：复古焦糖书皮手账 */
  --primary:            oklch(52% 0.11 55);
  --on-primary:         oklch(98% 0.01 55);
  --primary-container:  oklch(90.5% 0.042 60);
  --on-primary-cont:    oklch(26% 0.08 50);

  /* 章节卡：莫兰迪鼠尾草植物绿便签 */
  --secondary:          oklch(56% 0.08 140);
  --on-secondary:       oklch(98% 0.01 140);
  --secondary-container:oklch(91.8% 0.035 140);
  --on-secondary-cont:  oklch(25% 0.06 140);

  /* 小节卡：莫兰迪暖杏奶白便签 */
  --tertiary:           oklch(62% 0.07 75);
  --tertiary-container: oklch(93.8% 0.028 75);
  --on-tertiary-cont:   oklch(28% 0.06 65);

  /* 真题高频：复古麦穗金高亮便签 */
  --gold:               oklch(68% 0.16 85);
  --gold-container:     oklch(92.5% 0.08 88);

  /* 纸张底色：温暖象牙米白和纸（护眼哑光不刺眼） */
  --surface:            oklch(96.8% 0.016 88);
  --sc-lowest:          oklch(98.5% 0.008 88);
  --sc-low:             oklch(95.5% 0.018 88);
  --sc:                 oklch(94.2% 0.020 88);
  --sc-high:            oklch(92.0% 0.024 88);
  --sc-highest:         oklch(88.5% 0.028 88);

  /* 墨水文字色：浓郁复古钢笔墨水棕黑（极具手写温度） */
  --on-surface:         oklch(22% 0.025 55);
  --on-surface-var:     oklch(46% 0.035 55);
  --outline:            oklch(76% 0.030 80);
  --outline-var:        oklch(86% 0.020 85);

  /* Shape.kt：4/8/12/16/28 */
  --r-xs:4px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:28px;

  /* Compose MotionScheme 对应曲线 */
  --ease-standard: cubic-bezier(0.2,0,0,1);
  --ease-emphasized: cubic-bezier(0.05,0.7,0.1,1);
}

/* ---------- 暗色模式：复古深黛皮革手账 (Dark Leather Journal) ---------- */
[data-theme="dark"]{
  --primary:            oklch(76% 0.14 55);
  --on-primary:         oklch(20% 0.06 55);
  --primary-container:  oklch(30% 0.08 55);
  --on-primary-cont:    oklch(92% 0.05 55);

  --secondary:          oklch(78% 0.08 140);
  --on-secondary:       oklch(20% 0.04 140);
  --secondary-container:oklch(32% 0.05 140);
  --on-secondary-cont:  oklch(92% 0.03 140);

  --tertiary:           oklch(80% 0.09 75);
  --tertiary-container: oklch(32% 0.06 75);
  --on-tertiary-cont:   oklch(93% 0.04 75);

  --gold:               oklch(85% 0.15 85);
  --gold-container:     oklch(34% 0.08 85);

  --surface:            oklch(14% 0.015 60);
  --sc-lowest:          oklch(11% 0.012 60);
  --sc-low:             oklch(16% 0.016 60);
  --sc:                 oklch(19% 0.018 60);
  --sc-high:            oklch(23% 0.020 60);
  --sc-highest:         oklch(28% 0.024 60);

  --on-surface:         oklch(93% 0.012 85);
  --on-surface-var:     oklch(78% 0.022 85);
  --outline:            oklch(52% 0.025 75);
  --outline-var:        oklch(32% 0.018 70);
}
[data-theme="dark"] #grid{
  background-image:radial-gradient(circle, color-mix(in oklch, var(--outline) 30%, transparent) 1.2px, transparent 1.2px);
}
[data-theme="dark"] .card{
  box-shadow:0 1px 3px rgba(0,0,0,.35), 0 4px 12px rgba(0,0,0,.25);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--surface);}
body{
  font-family:-apple-system,"HarmonyOS Sans SC","Noto Sans CJK SC","Source Han Sans SC",
              "PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--on-surface);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}

/* ---------- 画布舞台 ---------- */
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:var(--surface);}
#stage.dragging{cursor:grabbing;}

/* 点阵背景：28px 手账点阵纸，跟随平移但不参与缩放重绘 */
#grid{
  position:absolute;inset:-72px;
  background-image:radial-gradient(circle, color-mix(in oklch, var(--outline) 40%, transparent) 1.2px, transparent 1.2px);
  background-size:28px 28px;
  will-change:transform;
  pointer-events:none;
}

/* 唯一合成层：所有平移缩放都只改这一层的 transform，不触发重排 */
#world{
  position:absolute;left:0;top:0;
  transform-origin:0 0;
  will-change:transform;
  backface-visibility:hidden;
}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;}
#edges path{
  fill:none;stroke-linecap:round;stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
}
#nodes{position:absolute;left:0;top:0;display:flex;align-items:flex-start;}
/* 嵌套 flex 树：对齐交给浏览器，JS 不再计算坐标 */
.tn{display:flex;align-items:center;}
.tc{flex:none;position:relative;}
.tk{display:flex;flex-direction:column;}

/* ---------- 卡片：实体手账便签质感 ---------- */
.card{
  position:relative;
  box-sizing:border-box;          /* 让 COL_W 是含 padding 的实际宽度 */
  border-radius:var(--r-md);
  background:var(--sc-high);
  border:1px solid color-mix(in oklch, var(--outline-var) 85%, transparent);
  padding:3px 7px;
  box-shadow:0 1px 2px rgba(90, 75, 60, 0.08), 0 3px 8px rgba(90, 75, 60, 0.05);
  will-change:transform,opacity;
  contain:layout style;
  transform-origin:0 50%;         /* 树向右生长：从左侧顶点长出 */
  transition:width .26s var(--ease-emphasized),
             background .18s var(--ease-standard),
             border-color .18s var(--ease-standard),
             box-shadow .22s var(--ease-standard),
             transform .14s var(--ease-standard);
}
.card:active{
  transform:scale(0.985);
}
/* 便签轻微抬升效果 */
@media (hover:hover) and (pointer:fine){
  .card:hover{
    box-shadow:0 3px 8px rgba(90, 75, 60, 0.12), 0 8px 18px rgba(90, 75, 60, 0.08);
    border-color:color-mix(in oklch,var(--outline) 65%, var(--outline-var));
  }
}
/* 键盘可达性：MD3 focus ring */
.card:focus-visible{
  outline:2px solid var(--primary);
  outline-offset:2px;
}
/* 分页哨兵：虚线胶囊 */
.card.more{
  background:transparent;
  border:1px dashed color-mix(in oklch,var(--primary) 42%, var(--outline-var));
  box-shadow:none;
  padding:6px 10px;
}
.card.more .label{
  color:var(--primary);font-size:12px;font-weight:600;
  -webkit-line-clamp:1;text-align:center;letter-spacing:.02em;
}
.card.more:hover{background:color-mix(in oklch,var(--primary) 9%, transparent);}
/* 量宽态：label 强制单行 nowrap，让 max-content 能得到真实文本宽度。
   量完立刻移除，用户看不到这一帧。 */
.card.measuring{width:max-content!important;max-width:none!important;}
.card.measuring .label{
  display:block!important;-webkit-line-clamp:unset!important;
  white-space:nowrap!important;overflow:visible!important;flex:none!important;
}
.card.root{
  border-radius:14px;
  background:var(--primary-container);
  border:1.5px solid var(--primary);
  box-shadow:0 4px 14px rgba(70, 45, 25, 0.16), inset 0 1px 0 rgba(255,255,255,0.45);
  padding:10px 13px;
}
.card.chapter{
  background:var(--secondary-container);
  border-color:var(--secondary);
  box-shadow:inset 3px 0 0 var(--secondary), 0 2px 8px rgba(80, 65, 50, 0.08);
}
.card.section{
  background:var(--tertiary-container);
  position:relative;
  border-color:color-mix(in oklch, var(--tertiary) 45%, var(--outline-var));
  box-shadow:inset 3px 0 0 var(--tertiary), 0 1px 4px rgba(80, 65, 50, 0.06);
}
/* section 的两个操作按钮改为「悬停浮现」：绝对定位到卡片右缘外侧，
   不占文档流宽度。实测它们常驻时占 36px，25 张 section 卡合计 900px，
   而 win/doc 属于低频操作，常驻显示纯属浪费面积。 */
.card.section .ibtn.act{
  position:absolute;top:50%;transform:translateY(-50%);
  opacity:0;pointer-events:none;
  background:var(--sc-highest);
  box-shadow:0 1px 3px rgba(0,0,0,.45);
  transition:opacity .16s var(--ease-standard),background .16s var(--ease-standard);
}
.card.section .ibtn.act[data-act="win"]{ right:-19px; }
.card.section .ibtn.act[data-act="para"]{ right:-37px; }
@media (hover:hover) and (pointer:fine){
  .card.section:hover .ibtn.act,
  .card.section:focus-within .ibtn.act{ opacity:1;pointer-events:auto; }
}
/* 触屏没有 hover，直接常驻显示（否则按钮永远点不到） */
@media (hover:none){
  .card.section .ibtn.act{ opacity:.85;pointer-events:auto;position:static;transform:none;right:auto;box-shadow:none;background:transparent; }
}
.card.kp{
  background:var(--sc);
  padding:2px 5px;
  border-color:color-mix(in oklch,var(--outline-var) 70%,transparent);
  box-shadow:none;
}
.card.kp.hot{
  background:var(--gold-container);
  border-color:var(--gold);
}
/* 真题高频：左侧 2px 金色竖条。
   原来用「真题」文字徽标，36px × 3,229 张 = 116,244px，
   占 kp 卡全部装饰宽度的 76.3%。竖条横向不占位，颜色同样能一眼分辨。 */
.card.kp.hot::before{
  content:"";position:absolute;left:0;top:3px;bottom:3px;width:2px;
  border-radius:2px;background:var(--gold);
}

.row{display:flex;align-items:center;gap:2px;}
.label{
  flex:1;min-width:0;
  overflow:hidden;
  /* 两行截断：中文标题不再被压成一行省略号 */
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  white-space:normal;
  word-break:break-word;
  line-height:1.18;
  font-weight:500;letter-spacing:0;
}
.card.root .label{font-size:15px;font-weight:700;color:var(--on-primary-cont);letter-spacing:.02em;}
.card.chapter .label{font-size:13px;font-weight:700;color:var(--on-secondary-cont);}
.card.section .label{font-size:12.5px;font-weight:600;}
.card.kp .label{font-size:13px;font-weight:500;}

.badge{
  flex:none;font-size:8.5px;line-height:1;padding:0 3px;border-radius:var(--r-xs);
  background:var(--tertiary-container);color:var(--on-tertiary-cont);
  letter-spacing:.02em;font-weight:600;
}
.badge.gold{background:var(--gold-container);color:var(--gold);}

/* 纯矢量图标按钮（无 emoji） */
.ibtn{
  flex:none;width:16px;height:16px;border:0;border-radius:50%;
  background:transparent;color:var(--on-surface-var);
  display:grid;place-items:center;cursor:pointer;
  transition:background .16s var(--ease-standard),color .16s var(--ease-standard);
}
.ibtn:hover{background:color-mix(in oklch,var(--on-surface) 10%,transparent);}
.ibtn:active{background:color-mix(in oklch,var(--on-surface) 16%,transparent);}
.ibtn svg{width:16px;height:16px;display:block;}
.ibtn.chev svg{transition:transform .22s var(--ease-standard);}
.card.open > .row > .ibtn.chev svg{transform:rotate(90deg);}

/* 详情行：随 LOD 淡出（源码 tween 180ms，阈值 scale 0.65） */
/* 详情行默认折叠：3,618 张知识点卡片若全部展开要点行，
   画布高度会被放大 3~4 倍，且低缩放下只是 opacity:0 —— 看不见却占着高度。
   现在默认只显示标题，点击才展开。 */
.detail{display:none;}
.card.open > .detail{
  display:block;
  margin-top:4px;font-size:11px;line-height:1.5;color:var(--on-surface-var);
  animation: detailDropIn .22s var(--ease-emphasized) forwards;
  transform-origin: top;
}
@keyframes detailDropIn{
  from{ opacity:0; transform:translateY(-4px); }
  to  { opacity:1; transform:translateY(0); }
}

/* 商业级题型微胶囊标签（Micro Capsule Tag） */
.tag-type{
  display:inline-flex; align-items:center;
  font-size:9.5px; font-weight:600; line-height:1;
  padding:2px 6px; border-radius:10px;
  background:color-mix(in oklch,var(--outline-var) 45%,transparent);
  color:var(--on-surface-var);
  margin-right:4px;
}
.tag-type.hot{
  background:var(--gold-container);
  color:oklch(38% 0.12 85);
  box-shadow:0 1px 2px rgba(180, 140, 40, 0.12);
}
[data-theme="dark"] .tag-type.hot{
  color:var(--gold);
}

.detail .pt{display:flex;gap:6px;margin-top:2px;}
.detail .pt::before{
  content:"";flex:none;width:3px;height:3px;border-radius:50%;
  background:var(--primary);margin-top:8px;
}
.card.kp.hot .detail .pt::before{background:var(--gold);}
.detail .quote{
  margin-top:6px;padding:6px 8px;border-radius:var(--r-sm);
  background:color-mix(in oklch,var(--on-surface) 5%,transparent);
  color:color-mix(in oklch,var(--on-surface) 72%,transparent);
  font-size:11px;line-height:1.6;
  border-left:2px solid var(--outline-var);
}
/* 正文：展开后直接在画布内变宽变高，弹性滑入展开 */
.para{
  margin-top:10px;padding-top:10px;
  border-top:1px dashed color-mix(in oklch,var(--outline-var) 85%,transparent);
  font-size:12.5px;line-height:1.9;
  color:color-mix(in oklch,var(--on-surface) 88%,transparent);
  max-height:min(520px, 62vh);
  overflow-y:auto;overscroll-behavior:contain;
  user-select:text;cursor:text;
  text-align:justify;text-justify:inter-ideograph;
  hanging-punctuation:allow-end;
  animation: paraSpringIn .28s var(--ease-emphasized) forwards;
  transform-origin: top;
}
@keyframes paraSpringIn{
  from{ opacity:0; transform:scaleY(0.9) translateY(-8px); }
  to  { opacity:1; transform:scaleY(1) translateY(0); }
}

/* 手账荧光笔高亮划线（Journal Highlighter Mark） */
.hl-quote{
  background:linear-gradient(180deg, transparent 40%, rgba(254, 230, 150, 0.55) 40%);
  border-radius:2px; padding:0 2px;
  font-weight:600;
  color:var(--on-surface);
}
[data-theme="dark"] .hl-quote{
  background:linear-gradient(180deg, transparent 40%, rgba(212, 160, 40, 0.35) 40%);
}
.para p{
  margin-bottom:10px;
  text-indent:2em;                /* 中文首行缩进 */
  padding-left:34px;              /* 给悬挂的段号留位 */
  text-indent:0;
}
.para p:first-child{margin-top:2px;}
.para .pid{
  display:inline-block;width:30px;margin-left:-34px;
  font-size:9.5px;color:var(--outline);
  font-variant-numeric:tabular-nums;
  vertical-align:baseline;
}
/* 继续加载按钮 */
.para-more{
  display:block;width:100%;margin:10px 0 2px;
  padding:9px 12px;border-radius:var(--r-sm);
  border:1px dashed color-mix(in oklch,var(--primary) 45%, var(--outline-var));
  background:transparent;color:var(--primary);
  font-size:12px;font-weight:600;cursor:pointer;
  font-family:inherit;
  transition:background .16s var(--ease-standard);
}
.para-more:hover{background:color-mix(in oklch,var(--primary) 10%, transparent);}
.para-more:active{background:color-mix(in oklch,var(--primary) 18%, transparent);}

/* ---- 紧凑模式（小屏）---- */
.compact .card{padding:9px 11px;border-radius:10px;}
.compact .card.root .label{font-size:15.5px;}
.compact .card.chapter .label{font-size:13.5px;}
.compact .card.section .label{font-size:13px;}
.compact .card.kp .label{font-size:12.5px;}
.compact .para{font-size:12px;line-height:1.82;max-height:min(440px,58vh);}
.compact .row{gap:6px;}
.compact .badge{font-size:9px;padding:2px 5px;}
.tiny .card{padding:8px 10px;}
.tiny .ibtn{width:22px;height:22px;}
.tiny .ibtn svg{width:14px;height:14px;}
.para::-webkit-scrollbar{width:4px;}
.para::-webkit-scrollbar-thumb{background:var(--outline-var);border-radius:2px;}

/* ---------- 侧边停靠坞（复刻 TreeChat WindowDockBar） ---------- */
#dock{position:fixed;inset:0;pointer-events:none;z-index:9000;}
.dockpin{
  position:absolute;pointer-events:auto;
  display:flex;align-items:center;gap:6px;
  padding:8px 9px;max-width:210px;
  background:var(--sc-high);
  border:1px solid var(--outline-var);
  box-shadow:0 3px 10px rgba(0,0,0,.45);
  cursor:grab;touch-action:none;user-select:none;
  transition:box-shadow .16s var(--ease-standard),transform .16s var(--ease-standard);
}
.dockpin:active{cursor:grabbing;}
.dockpin.dragging{box-shadow:0 9px 24px rgba(0,0,0,.62);transform:scale(.96);}
/* 贴边那侧方、靠内侧两角圆，视觉上"挂"在屏幕边缘 */
.dockpin.right{right:0;border-radius:16px 0 0 16px;border-right:0;}
.dockpin.left {left:0; border-radius:0 16px 16px 0;border-left:0;}
.dockpin svg{flex:none;width:12px;height:12px;display:block;}
.dockpin .dp-t{
  font-size:11.5px;font-weight:600;color:var(--on-surface);
  max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dockpin .dp-x{
  flex:none;width:18px;height:18px;padding:0;border:0;border-radius:50%;
  background:transparent;color:var(--on-surface-var);
  display:grid;place-items:center;cursor:pointer;
  transition:background .16s var(--ease-standard);
}
.dockpin .dp-x:hover{background:color-mix(in oklch,var(--on-surface) 14%,transparent);}
.dockpin .dp-x svg{width:10px;height:10px;}

/* ---------- 顶栏：手账封顶与书签标签 ---------- */
#topbar{
  position:fixed;left:0;right:0;top:0;z-index:20;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
  background:color-mix(in oklch,var(--surface) 90%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid color-mix(in oklch,var(--outline-var) 80%,transparent);
  box-shadow:0 1px 4px rgba(80, 65, 50, 0.05);
  display:flex;flex-direction:column;gap:9px;
  transition:transform .26s var(--ease-emphasized);
}
#topbar.hide{transform:translateY(-100%);}
.tb-row{display:flex;align-items:center;gap:10px;}
.tb-title{
  font-size:15px;font-weight:700;letter-spacing:.02em;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#books{
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  padding-bottom:2px;-webkit-overflow-scrolling:touch;
}
#books::-webkit-scrollbar{display:none;}
.chip{
  flex:none;border:1px solid color-mix(in oklch,var(--outline-var) 85%,transparent);border-radius:var(--r-sm);
  background:var(--sc-lowest);color:var(--on-surface-var);
  padding:6px 12px;font-size:12.5px;font-weight:500;white-space:nowrap;cursor:pointer;
  box-shadow:0 1px 2px rgba(80, 65, 50, 0.04);
  transition:background .2s var(--ease-standard),color .2s var(--ease-standard),border-color .2s var(--ease-standard),box-shadow .2s var(--ease-standard);
}
.chip.on{
  background:var(--secondary-container);color:var(--on-secondary-cont);
  border-color:var(--secondary);font-weight:700;
  box-shadow:0 2px 6px rgba(80, 65, 50, 0.08);
}

/* ---------- 右下工具列 ---------- */
#tools{
  position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:20;
  display:flex;flex-direction:column;gap:10px;
}
.fab{
  width:44px;height:44px;border:1px solid color-mix(in oklch,var(--outline-var) 80%,transparent);border-radius:var(--r-lg);
  background:var(--sc-lowest);color:var(--on-surface);
  display:grid;place-items:center;cursor:pointer;
  box-shadow:0 2px 6px rgba(80, 65, 50, 0.09), 0 6px 16px rgba(80, 65, 50, 0.05);
  transition:background .18s var(--ease-standard),transform .18s var(--ease-emphasized),box-shadow .18s var(--ease-standard);
}
.fab:active{transform:scale(.92);}
.fab svg{width:20px;height:20px;display:block;}
.fab.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary);}

/* ---------- 加载态 ---------- */
#hint{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);
  transform:translateX(-50%);z-index:15;
  padding:8px 16px;border-radius:var(--r-xl);
  background:var(--sc-highest);color:var(--on-surface-var);
  font-size:12px;white-space:nowrap;
  transition:opacity .4s var(--ease-standard);
  pointer-events:none;
}
#hint.gone{opacity:0;}

/* ============================================================
   悬浮小窗（FloatingWindowCard.kt / FloatingWindowManager.kt 复刻）
   小窗 16dp 圆角 + 阴影；真全屏 / 画布伪全屏一律 radius 0、elevation 0
   ============================================================ */
.win{
  position:fixed; left:0; top:0; z-index:40;
  display:flex; flex-direction:column;
  width:400px; height:520px;
  background:var(--sc-high);
  border:1px solid var(--outline-var);
  border-radius:16px;
  box-shadow:0 20px 44px rgba(0,0,0,.52), 0 4px 12px rgba(0,0,0,.34);
  overflow:hidden;
  will-change:transform,opacity;
  contain:layout style;
  transform-origin:50% 50%;
}
.win.full,.win.canvas-full{
  border-radius:0; border-width:0; box-shadow:none;
}

/* 真全屏：元素进入浏览器 top layer，直接铺满物理屏幕。
   这里用 !important 压过 applyWin() 每帧写的 inline transform / width / height，
   否则 JS 的弹簧会把全屏元素又缩回窗口尺寸。 */
.win:fullscreen,
.win:-webkit-full-screen{
  left:0!important; top:0!important;
  width:100%!important; height:100%!important;
  transform:none!important;
  border-radius:0!important; border-width:0!important;
  box-shadow:none!important;
  background:var(--sc-low);
}
.win:fullscreen .rz,
.win:-webkit-full-screen .rz{display:none;}
.win:fullscreen .win-title,
.win:-webkit-full-screen .win-title{cursor:default;}

/* 标题栏 46dp：拖动把手 + 双击进真全屏 */
.win-title{
  flex:none; height:46px;
  display:flex; align-items:center; gap:6px;
  padding:0 10px;
  background:var(--sc-highest);
  border-bottom:1px solid var(--outline-var);
  cursor:grab; touch-action:none; user-select:none;
}
.win-title:active{cursor:grabbing;}
.win.full .win-title,.win.canvas-full .win-title{cursor:default;}
.win-title .t{
  flex:1; min-width:0; font-size:13px; font-weight:600;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.win-title .ibtn{width:28px;height:28px;}
.win-title .ibtn svg{width:16px;height:16px;}
.win-title .ibtn.on{background:var(--primary-container);color:var(--on-primary-cont);}

/* 左上角四个 macOS 风格圆点（关闭 / 收起 / 画布全屏 / 真全屏） */
.win-dots{
  flex:none; display:flex; align-items:center; gap:7px;
  margin-right:6px; padding-left:2px;
}
.dot{
  width:11px; height:11px; padding:0; border:0; border-radius:50%;
  cursor:pointer; flex:none;
  transition:transform .16s var(--ease-standard),
             filter .16s var(--ease-standard),
             box-shadow .16s var(--ease-standard);
}
.dot:hover{transform:scale(1.2);filter:brightness(1.18);}
.dot:active{transform:scale(.9);}
.dot-close {background:oklch(68% 0.19 25);}
.dot-min   {background:oklch(82% 0.16 85);}
.dot-canvas{background:oklch(76% 0.15 150);}
.dot-full  {background:oklch(72% 0.14 235);}
.dot.on{box-shadow:0 0 0 2px color-mix(in oklch,var(--on-surface) 60%,transparent);}

/* 收起：只留标题栏 */
.win.collapsed .win-body{display:none;}
.win.collapsed .rz{display:none;}
.win.collapsed{box-shadow:0 8px 22px rgba(0,0,0,.5);}

/* 内容区 */
.win-body{
  flex:1; min-height:0;
  overflow-y:auto; overscroll-behavior:contain;
  padding:12px 14px 20px;
  user-select:text; cursor:text;
  -webkit-overflow-scrolling:touch;
}
.win-body::-webkit-scrollbar{width:5px;}
.win-body::-webkit-scrollbar-thumb{background:var(--outline-var);border-radius:3px;}
.win-body h4{
  font-size:11.5px; font-weight:700; color:var(--primary);
  margin:14px 0 8px; letter-spacing:.06em;
}
.win-body h4:first-child{margin-top:2px;}
.win-body .para p{
  margin-bottom:9px; font-size:13px; line-height:1.86;
  color:color-mix(in oklch,var(--on-surface) 88%,transparent);
}
.win-body .para .pid{
  font-size:10px; color:var(--outline); margin-right:6px;
  font-variant-numeric:tabular-nums;
}
.win-body .kpitem{
  border:1px solid var(--outline-var); border-radius:10px;
  padding:9px 11px; margin-bottom:9px; background:var(--sc);
}
.win-body .kpitem.hot{background:var(--gold-container);border-color:var(--gold);}
.win-body .kpitem .kt{
  font-size:13px; font-weight:700; margin-bottom:6px;
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
}
.win-body .kpitem .ky{
  font-size:10px; padding:2px 6px; border-radius:4px; font-weight:600;
  background:var(--tertiary-container); color:var(--on-tertiary-cont);
}
.win-body .kpitem.hot .ky{background:var(--gold-container);color:var(--gold);}
.win-body .kpitem .kp-pt{
  font-size:12px; line-height:1.72; color:var(--on-surface-var);
  display:flex; gap:6px; margin-top:3px;
}
.win-body .kpitem .kp-pt::before{
  content:""; flex:none; width:3px; height:3px; border-radius:50%;
  background:var(--primary); margin-top:7px;
}
.win-body .kpitem.hot .kp-pt::before{background:var(--gold);}
.win-body .loading{color:var(--outline);font-size:12.5px;}

/* 边缘缩放热区：右 8dp / 下 8dp / 右下角 16dp（源码热区收窄避免吃掉选词） */
.rz{position:absolute;z-index:3;touch-action:none;}
.rz-r{top:48px;bottom:32px;right:0;width:8px;cursor:ew-resize;}
.rz-b{left:32px;right:32px;bottom:0;height:8px;cursor:ns-resize;}
.rz-c{right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;}
.rz::after{
  content:"";position:absolute;background:var(--outline);
  opacity:0;transition:opacity .16s var(--ease-standard);
}
.rz-r::after{right:3px;top:50%;transform:translateY(-50%);width:3px;height:28px;border-radius:1.5px;}
.rz-b::after{bottom:3px;left:50%;transform:translateX(-50%);height:3px;width:28px;border-radius:1.5px;}
.rz-c::after{right:6px;bottom:6px;width:10px;height:10px;border-radius:2px;}
.win:hover .rz::after{opacity:.55;}
.win.full .rz,.win.canvas-full .rz{display:none;}

/* 吸附预览：Windows 同款影子，从窗口当前位置长出来 */
#snapGhost{
  position:fixed; z-index:38; pointer-events:none;
  border:1.5px solid var(--primary);
  background:color-mix(in oklch,var(--primary) 15%,transparent);
  border-radius:16px; opacity:0;
  transition:opacity .16s var(--ease-standard),
    left .22s var(--ease-emphasized), top .22s var(--ease-emphasized),
    width .22s var(--ease-emphasized), height .22s var(--ease-emphasized);
}
#snapGhost.on{opacity:1;}

/* ---------- 离线包状态胶囊 ---------- */
#pwaChip{
  position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);
  z-index:44; display:flex; align-items:center; gap:8px;
  padding:8px 16px 8px 12px;
  border-radius:var(--r-full);
  background:var(--sc-high); color:var(--on-surface-var);
  border:1px solid var(--outline-var);
  box-shadow:0 2px 6px rgba(0,0,0,.36), 0 8px 24px rgba(0,0,0,.30);
  font-size:12px; line-height:1;
  pointer-events:none;
  opacity:0; transition:opacity .28s var(--ease-standard),
                          transform .28s var(--ease-emphasized);
}
#pwaChip.on{opacity:1;}
#pwaChip[hidden]{display:none;}
#pwaChip .pwa-ico{display:flex;width:16px;height:16px;flex:none;}
#pwaChip .pwa-ico svg{width:16px;height:16px;display:block;}
#pwaChip.ready{color:var(--primary);border-color:color-mix(in oklch,var(--primary) 40%,transparent);}
#pwaChip.offline{color:var(--tertiary);border-color:color-mix(in oklch,var(--tertiary) 45%,transparent);}

/* ---------- 缩放指示 ---------- */
#zoomPct{
  position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom) + 118px);z-index:20;
  font-size:11px;font-variant-numeric:tabular-nums;color:var(--on-surface-var);
  background:var(--sc-lowest);border:1px solid color-mix(in oklch,var(--outline-var) 80%,transparent);border-radius:var(--r-sm);
  padding:2px 8px;pointer-events:none;
  box-shadow:0 1px 3px rgba(80,65,50,0.06);
}

/* ---------- 搜索面板：手账收纳抽屉 ---------- */
#searchPanel{
  position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);
  width:min(560px,calc(100vw - 32px));max-height:60vh;z-index:40;
  background:var(--sc-lowest);border:1px solid color-mix(in oklch,var(--outline-var) 80%,transparent);border-radius:var(--r-lg);
  box-shadow:0 12px 32px rgba(80,65,50,0.14), 0 2px 6px rgba(80,65,50,0.08);display:flex;flex-direction:column;overflow:hidden;
}
#searchPanel[hidden]{display:none;}
#searchInput{
  background:transparent;border:0;border-bottom:1px solid color-mix(in oklch,var(--outline-var) 80%,transparent);
  color:var(--on-surface);font-size:15px;padding:14px 16px;outline:none;
}
#searchList{overflow:auto;padding:6px;}
.sr{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;}
.sr:hover{background:var(--sc-high);}
.sr b{font-size:13px;font-weight:600;color:var(--on-surface);}
.sr span{font-size:11px;color:var(--on-surface-var);}

/* ---------- 面包屑：手账书签便签条 ---------- */
#crumbs{
  position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:15;
  display:flex;gap:6px;align-items:center;max-width:calc(100vw - 120px);
  font-size:12px;color:var(--on-surface-var);overflow:hidden;
  background:color-mix(in oklch,var(--surface) 92%,transparent);
  padding:4px 8px;border-radius:var(--r-sm);
  border:1px solid color-mix(in oklch,var(--outline-var) 80%,transparent);
  box-shadow:0 1px 3px rgba(80,65,50,0.05);
}
#crumbs button{
  background:transparent;border:0;color:inherit;font:inherit;cursor:pointer;
  padding:2px 4px;border-radius:4px;white-space:nowrap;
}
#crumbs button:hover{background:var(--sc-high);}
#crumbs .sep{opacity:.4;flex:none;}

/* ---------- 小屏适配 ---------- */
@media (max-width:600px){
  .tb-title{font-size:14px;}
  .chip{padding:5px 9px;font-size:12px;}
  .fab{width:40px;height:40px;border-radius:12px;}
  #tools{gap:8px;right:10px;}
  #crumbs{font-size:11px;max-width:calc(100vw - 96px);}
  #zoomPct{bottom:calc(env(safe-area-inset-bottom) + 106px);}
}
</style>
</head>

const DATA = [{"d":"culture","t":"中国文化要略（第四版）","c":[{"id":"culture-c01","t":"第一章 简论","w":"high","s":[{"id":"culture-c01-s01","t":"第一节 文化与中国文化","w":"high","n":17,"k":[{"t":"文化结构的四个层次","y":"名词解释","p":["物态文化层：物质产品总和","制度文化层：行为规范准则","行为文化层：约定俗成风俗","心态文化层：社会心理与意识形态（核心）"],"q":"文化结构一般分为四个层次：①物态文化层，指物质生产活动及其产品的总和；②制度文化层，指规范自身行为和调节相互关系的准则；③行为文化层，指长期社会交往中约定俗成的习惯和风俗；④心态文化层，指社会心理和社会意识形态，包括价值观念、审美情趣、思维方式及文学艺术作品，是文化的核心与精华。","w":"high","e":["2019 真题"]},{"t":"观乎人文，以化成天下","y":"名词解释","p":["出自《周易·贲》","以教育感化治理天下","中国人论述文化的开端"],"q":"语出《周易·贲》卦：“观乎天文，以察时变；观乎人文，以化成天下。”这是中国人论述“文化”的开始。意思是统治者通过观察人类社会的各种现象，可以用教育感化的手段来治理天下。此时“文化”二字尚未连用，但已奠定了中国文化重人文教化的基本取向。","w":"high","e":["2016 真题"]},{"t":"试论中国文化的未来走向","y":"名词解释","p":["继承与创新相统一","民族性与世界性相统一","与现代化相适应","坚持马克思主义指导","增强文化自信推动走出去"],"q":"①坚持继承与创新相统一，在批判继承优秀传统的基础上推动创造性转化与创新性发展；②坚持民族性与世界性相统一，既保持民族文化的独特性，又以开放胸怀吸收世界优秀文明成果；③坚持与现代化相适应，使传统文化与市场经济、民主法治、科学技术相协调；④坚持马克思主义指导与中华文化立场，反对全盘西化与复古守旧两种倾向","w":"high","e":["2023 真题"]},{"t":"物态文化层","y":"名词解释","p":["物质生产活动及其产品的总和","看得见摸得着的实体事物","衣食住行为典型代表"],"q":"指人的物质生产活动及其产品的总和，是看得见、摸得着的具体实在的事物，如人们的衣、食、住、行等，属于文化的表层。","w":"normal","e":["核心概念"]},{"t":"制度文化层","y":"名词解释","p":["规范自身行为的准则","调节相互关系的制度规范","介于物态与心态之间"],"q":"指人们在社会实践中建立的规范自身行为和调节相互关系的准则，包括各种社会制度、法律法规、礼仪规范等。","w":"normal","e":["核心概念"]},{"t":"行为文化层","y":"名词解释","p":["长期社会交往中约定俗成","社会的、集体的行为","表现为礼俗民俗风俗"],"q":"指人在长期社会交往中约定俗成的习惯和风俗，它是一种社会的、集体的行为，不是个人的随心所欲，如礼俗、民俗、风俗。","w":"normal","e":["核心概念"]},{"t":"心态文化层","y":"名词解释","p":["社会心理与社会意识形态","价值观念、审美情趣、思维方式","文化的核心与精华"],"q":"指人们的社会心理和社会意识形态，包括人们的价值观念、审美情趣、思维方式以及由此而产生的文学艺术作品，是文化的核心部分，也是文化的精华部分。","w":"normal","e":["核心概念"]},{"t":"泰勒的文化定义","y":"名词解释","p":["英国文化学家泰勒《原始文化》","知识信仰艺术道德法律习俗","能力与习惯的复杂整体"],"q":"英国文化学家泰勒在《原始文化》一书中提出，文化是\"包括知识、信仰、艺术、道德、法律、习俗和任何人作为一名社会成员而获得的能力和习惯在内的复杂整体\"。这一观点在文化史研究方面具有开先河的作用。","w":"normal","e":["核心概念"]},{"t":"为什么说文化的核心问题是人","y":"名词解释","p":["文化由人创造","不同人群创造不同文化","人享受文化也受文化约束","人是文化发展的主动者","研究文化即研究人的创造"],"q":"①文化由人创造，有人才能创造文化、形成文化，文化是人类智慧和创造力的体现；②不同种族、不同民族的人创造不同的文化；③人创造了文化，也享受文化，同时受文化约束，最终又要不断改造文化；④人始终是文化发展中的主动者，没有人的主动创造，文化便失去光彩、活力乃至生命；⑤研究文化实质上就是研究人的创造思想、创造","w":"normal","e":["核心概念"]},{"t":"【原文】ISBN 978-7-5","y":"教材原文","p":["ISBN 978-7-5135-9156-0Ⅰ. ①中… Ⅱ. ①程⋯ Ⅲ. ①中华文化-对外汉语教学一教学参考资料Ⅳ. ①K203"],"q":"ISBN 978-7-5135-9156-0Ⅰ. ①中… Ⅱ. ①程⋯ Ⅲ. ①中华文化-对外汉语教学一教学参考资料Ⅳ. ①K203","w":"normal","e":["原书正文"]},{"t":"【原文】中国版本图书馆CIP 数","y":"教材原文","p":["中国版本图书馆CIP 数据核字(2017)第137028号出 版 人 蔡剑峰责任编辑 李彩霞执行编辑 杨彩霞 郑丽慧装帧设计 姚 军"],"q":"中国版本图书馆CIP 数据核字(2017)第137028号出 版 人 蔡剑峰责任编辑 李彩霞执行编辑 杨彩霞 郑丽慧装帧设计 姚 军","w":"normal","e":["原书正文"]},{"t":"【原文】出版发行 外语教学与研究","y":"教材原文","p":["出版发行 外语教学与研究出版社社 址 北京市西三环北路 19号(100089)网 址 http://www.fltrp.com"],"q":"出版发行 外语教学与研究出版社社 址 北京市西三环北路 19号(100089)网 址 http://www.fltrp.com","w":"normal","e":["原书正文"]},{"t":"【原文】印 刷 三河市北燕印装有","y":"教材原文","p":["印 刷 三河市北燕印装有限公司开 本 730×980 1/16印 张 30版 次 2017年7月第4版 2017年7月第1次印刷"],"q":"印 刷 三河市北燕印装有限公司开 本 730×980 1/16印 张 30版 次 2017年7月第4版 2017年7月第1次印刷","w":"normal","e":["原书正文"]},{"t":"【原文】书 号 ISBN978-","y":"教材原文","p":["书 号 ISBN978-7-5135-9156-0定 价 49.90元购书咨询: (010)88819926 电子邮箱: club@fitrp.com"],"q":"书 号 ISBN978-7-5135-9156-0定 价 49.90元购书咨询: (010)88819926 电子邮箱: club@fitrp.com","w":"normal","e":["原书正文"]},{"t":"【原文】外研书店: https:","y":"教材原文","p":["外研书店: https://waiyants.tmall.com凡印刷、装订质量问题，请联系 我社印制部联系 电话·(010)61207896 电子邮箱: zhijian@fitrp.com"],"q":"外研书店: https://waiyants.tmall.com凡印刷、装订质量问题，请联系 我社印制部联系 电话·(010)61207896 电子邮箱: zhijian@fitrp.com","w":"normal","e":["原书正文"]},{"t":"【原文】凡侵权、盗版书籍线索，请","y":"教材原文","p":["凡侵权、盗版书籍线索，请联系 我社法律事务部举报 电话:(010) 88817519 电子邮箱: banquan@fitrp.com"],"q":"凡侵权、盗版书籍线索，请联系 我社法律事务部举报 电话:(010) 88817519 电子邮箱: banquan@fitrp.com","w":"normal","e":["原书正文"]},{"t":"【原文】从上次修订至今，已经过了","y":"教材原文","p":["从上次修订至今，已经过了四年半时光","其间，中国传统文化的固有体系是不会发生巨大变化的","变化的是一些局部领域，还有某些动态部分，同时还有作者主观认识的提高，这是非常重要的","本次修订主要在历史这一块"],"q":"从上次修订至今，已经过了四年半时光。其间，中国传统文化的固有体系是不会发生巨大变化的。变化的是一些局部领域，还有某些动态部分，同时还有作者主观认识的提高，这是非常重要的。本次修订主要在历史这一块。除了史前叙述之外，历代王朝史部分不再使用朝代演变的叙述手法，而是改用概括的叙述手法，将王朝史中的几个突出点概括出来，同时着重分析了中国历史上“战争与和平”“融合与斗","w":"normal","e":["原书正文"]}]},{"id":"culture-c01-s02","t":"第二节 中国文化的特点与价值","w":"high","n":12,"k":[{"t":"试论中国传统文化的基本特征及其当代价值","y":"名词解释","p":["以人为本的人文精神","大一统的凝聚力与整体辩证思维","崇尚伦理道德与礼治","兼容并包、和而不同","当代价值：文化自信、生态文明、人类命运共同体"],"q":"中国传统文化的基本特征：①以人为本的人文精神，重人伦道德而轻宗教神学；②强大的凝聚力与统一性，大一统观念深入人心；③注重整体思维与辩证方法，如\"天人合一\"\"中庸\"；④崇尚伦理道德，以德治国、以礼立身；⑤兼容并包，善于吸收外来文化。当代价值：为社会主义核心价值观提供文化滋养，为人类命运共同体提供\"和而","w":"high","e":["2018 真题"]},{"t":"文化自觉","y":"名词解释","p":["费孝通提出","对自身文化有自知之明","明白来历、特色与发展趋向","取得文化选择的自主地位"],"q":"文化自觉是费孝通提出的概念，指生活在一定文化中的人对其文化有\"自知之明\"，明白它的来历、形成过程、所具有的特色和发展趋向，不带任何\"文化回归\"的意思，也不主张\"全盘西化\"或\"坚守传统\"。其意义在于加强对文化转型的自主能力，取得决定适应新环境、新时代的文化选择的自主地位。","w":"normal","e":["核心概念"]},{"t":"文化变迁","y":"名词解释","p":["文化内容与结构的变化","内生发明与外来传播两途","积累、传播、融合、冲突、整合","中国文化连续性靠调适与吸纳"],"q":"文化变迁指文化内容与结构发生的整体性或局部性变化，通常由内部发现发明（内生）与外部传播借用（外生）两种途径引起。其形式包括文化积累、文化传播、文化融合、文化冲突与文化整合。文化变迁是社会发展的常态，中国文化的连续性正是通过不断的内部调适与对外吸纳实现的。","w":"normal","e":["核心概念"]},{"t":"文化软实力","y":"名词解释","p":["文化的凝聚力吸引力影响力","通过价值观念与制度模式体现","国家综合国力的重要组成部分"],"q":"指一个国家或地区文化所具有的凝聚力、吸引力和影响力，主要通过价值观念、思想文化、制度模式、文化产品等无形要素体现出来，是国家综合国力的重要组成部分。提高国家文化软实力，关系我国在世界文化格局中的定位和国际影响力。","w":"normal","e":["核心概念"]},{"t":"【原文】(三) 伊斯兰教在中国的","y":"教材原文","p":["(三) 伊斯兰教在中国的传播 / 154(四) 伊斯兰教与中国文化 / 155(五) 现存伊斯兰教胜迹 / 156五、基督教 / 157"],"q":"(三) 伊斯兰教在中国的传播 / 154(四) 伊斯兰教与中国文化 / 155(五) 现存伊斯兰教胜迹 / 156五、基督教 / 157","w":"normal","e":["原书正文"]},{"t":"【原文】(一) 基督教的产生与分","y":"教材原文","p":["(一) 基督教的产生与分裂 / 157(二) 基督教的教义和组织 / 159(三) 基督教在中国的传播 / 160第八章 古代教育 / 163"],"q":"(一) 基督教的产生与分裂 / 157(二) 基督教的教义和组织 / 159(三) 基督教在中国的传播 / 160第八章 古代教育 / 163","w":"normal","e":["原书正文"]},{"t":"【原文】一、古代的学校教育 / ","y":"教材原文","p":["一、古代的学校教育 / 165二、明清时代的国子监 / 169三、书院的兴起与衰落 / 171四、古代的家庭教育 / 176"],"q":"一、古代的学校教育 / 165二、明清时代的国子监 / 169三、书院的兴起与衰落 / 171四、古代的家庭教育 / 176","w":"normal","e":["原书正文"]},{"t":"【原文】五、清代的学塾教育 / ","y":"教材原文","p":["五、清代的学塾教育 / 178第九章 科举制度 / 181一、科举制以前的选士制度 / 182二、科举制的产生与发展 / 185"],"q":"五、清代的学塾教育 / 178第九章 科举制度 / 181一、科举制以前的选士制度 / 182二、科举制的产生与发展 / 185","w":"normal","e":["原书正文"]},{"t":"【原文】四、科举制的影响与功过 ","y":"教材原文","p":["四、科举制的影响与功过 / 190第十章 典籍藏书 / 195一 呼唤清楚地表明了这一点。据笔者个人的观察与分析，当代中国文化的发展需要经历三个阶段：以政治为第一取向的阶段、以经济为第一取向的阶段和以文化为第一取向的阶段。第一个阶段，把政治作为衡量一切的标准，“政治挂帅”是那时公开的口号，以阶级划分社会成员，频繁开展阶级斗","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)88再次，是个人提高素养的需要","孟子说：“无恻隐之心，非人也","无羞恶之心，非人也","无辞让之心，非人也"],"q":"中国文化要略(第4版)中国文化要略(第4版)88再次，是个人提高素养的需要。孟子说：“无恻隐之心，非人也；无羞恶之心，非人也；无辞让之心，非人也；无是非之心，非人也。”(《孟子·公孙丑上》) 这说明孟子已经注意到“人”与“非人”的区别。孟子是主张“性善”的，按他的原意，“恻隐之心”“羞恶之心”“辞让之心”和“是非之心”，属于“人”的“善端”，生来就有。因此，","w":"normal","e":["原书正文"]},{"t":"【原文】高尚的品质。可是，我们仔","y":"教材原文","p":["可是，我们仔细观察今天的社会，依旧还有种种“非人”的现象","难道是经历了数千年，社会没有一点进步吗? 人类没有一点提高吗?当然不是","在任何社会发展阶段，人与人之间，总会存在一种差异，人的文明程度也有一个逐渐提高的过程，因为文化素养不是与生俱来的，而是在社会中通过接受教育和自觉学习取得的","社会向前发展，人也要随着社会前进和提高，更何况人还有责任推动和引领社会"],"q":"高尚的品质。可是，我们仔细观察今天的社会，依旧还有种种“非人”的现象。难道是经历了数千年，社会没有一点进步吗? 人类没有一点提高吗?当然不是。在任何社会发展阶段，人与人之间，总会存在一种差异，人的文明程度也有一个逐渐提高的过程，因为文化素养不是与生俱来的，而是在社会中通过接受教育和自觉学习取得的。社会向前发展，人也要随着社会前进和提高，更何况人还有责任推动和","w":"normal","e":["原书正文"]},{"t":"【原文】简简论论作为中国人，自然","y":"教材原文","p":["简简论论作为中国人，自然就要了解和学习中国文化","这种了解和学习，并不是要求每个人都要精通“国学”，都要读遍孔孟老庄的著作","这是不可能的，也是不现实的","但是有选择地阅读一些研究中国文化的书籍，欣赏一些中国古典诗词和音乐，领略一些京剧、昆曲等传统艺术，参观一些中国古代建筑和文化遗址，从中体会和感受民族文化所包含的精神气质，这并非是办不到的"],"q":"简简论论作为中国人，自然就要了解和学习中国文化。这种了解和学习，并不是要求每个人都要精通“国学”，都要读遍孔孟老庄的著作。这是不可能的，也是不现实的。但是有选择地阅读一些研究中国文化的书籍，欣赏一些中国古典诗词和音乐，领略一些京剧、昆曲等传统艺术，参观一些中国古代建筑和文化遗址，从中体会和感受民族文化所包含的精神气质，这并非是办不到的。也可以从自己喜欢的专项","w":"normal","e":["原书正文"]}]}]},{"id":"culture-c02","t":"第二章 地理概况","w":"high","s":[{"id":"culture-c02-s01","t":"第一节 地理环境与行政区划","w":"high","n":10,"k":[{"t":"行省制度","y":"名词解释","p":["元代创立","行中书省为中书省派出机构","中国省制之始"],"q":"元代创立的地方行政制度，中央设中书省，地方设行中书省（简称行省），作为中书省的派出机构管理地方，明清沿袭并发展为省级行政区，是中国省制的开端。","w":"high","e":["2017 真题"]},{"t":"行省制度由元代创立，是中国省制的开端。","y":"名词解释","p":["元代创立行省","中国省制开端"],"q":"正确。元代设行中书省作为中书省派出机构管理地方，明清沿袭发展为省级行政区。","w":"high","e":["2017 真题"]},{"t":"九州","y":"名词解释","p":["出自《尚书·禹贡》","冀兖青徐扬荆豫梁雍","后世以九州代指中国"],"q":"《尚书·禹贡》将天下分为冀、兖、青、徐、扬、荆、豫、梁、雍九州，这是中国古代最早的行政区划设想，\"九州\"后来成为中国的代称。","w":"normal","e":["核心概念"]},{"t":"郡县制","y":"名词解释","p":["秦统一后全面推行","分天下为三十六郡","中央直接任免、加强中央集权"],"q":"秦始皇统一六国后，废除分封制，在全国推行郡县制，分天下为三十六郡，郡下设县，由中央直接任免官吏，奠定了中国两千多年地方行政制度的基础。","w":"normal","e":["核心概念"]},{"t":"【原文】4. 中国文化未来会怎么","y":"教材原文","p":["4. 中国文化未来会怎么发展? 在全球化大背景下会不会丧失它的特点?"],"q":"4. 中国文化未来会怎么发展? 在全球化大背景下会不会丧失它的特点?","w":"normal","e":["原书正文"]},{"t":"【原文】1.张岱年，方克立.中国","y":"教材原文","p":["1.张岱年，方克立.中国文化概论(修订版). 北京：北京师范大学出版社, 2004."],"q":"1.张岱年，方克立.中国文化概论(修订版). 北京：北京师范大学出版社, 2004.","w":"normal","e":["原书正文"]},{"t":"【原文】任何民族文化的发生和发展","y":"教材原文","p":["任何民族文化的发生和发展，都离不开它所依托的自然环境","不同地域的自然环境往往孕育出不同的文化类型","中国文化自古发生于亚洲东部大陆这块丰饶的土地上，因而也形成了它不同于欧洲文化、美洲文化和阿拉伯文化的许多品格","这是众所周知、无可怀疑的事实"],"q":"任何民族文化的发生和发展，都离不开它所依托的自然环境。不同地域的自然环境往往孕育出不同的文化类型。中国文化自古发生于亚洲东部大陆这块丰饶的土地上，因而也形成了它不同于欧洲文化、美洲文化和阿拉伯文化的许多品格。这是众所周知、无可怀疑的事实。中国文化所处的地域环境，其特点主要有三个 ：第一是内陆辽阔，空间巨大，为民族的生存、发展与创造提供了足够回旋和施展的舞台。","w":"normal","e":["原书正文"]},{"t":"【原文】面。第三是山河壮丽，景色","y":"教材原文","p":["第三是山河壮丽，景色秀美，对中华民族的文化心理及审美趣味产生了深刻影响","中国地域辽阔，山多水多","高山耸立，千峰竞秀，河湖纵横，百川归海，构成一种气度非凡而又深刻隽永的山水环境","中国地名多以山水命名，体现出中华民族依托山水的内在精神"],"q":"面。第三是山河壮丽，景色秀美，对中华民族的文化心理及审美趣味产生了深刻影响。中国地域辽阔，山多水多。高山耸立，千峰竞秀，河湖纵横，百川归海，构成一种气度非凡而又深刻隽永的山水环境。中国地名多以山水命名，体现出中华民族依托山水的内在精神；“山河”“河山”“江山”成为领土与政权的代称，蕴含着中华民族“天人合一”的特殊感情；特别是历代兴盛、经久不衰的“山水诗”“山","w":"normal","e":["原书正文"]},{"t":"【原文】黄河，虽然长度逊于长江，","y":"教材原文","p":["黄河，虽然长度逊于长江，为中国的第二条大河，但它与中国文明发生、发展的关系却更为人们所重视","“黄河是中华民族的摇篮”，这是一种生生不息的民族信念","黄河全长5，464公里，流域面积约75 万平方公里","它的发源地在巴颜喀拉山下的卡日曲，河流从这里开始，将冰雪的融水和雨水汇入两个高原湖泊——扎陵湖和鄂陵湖，然后流转于青藏高原之上，至兰州而展开呈弯弓状，后穿越秦晋两省的黄土高原，因这一带水土流失严重，河水中夹带大量泥沙，呈黄色，遂称“黄河”"],"q":"黄河，虽然长度逊于长江，为中国的第二条大河，但它与中国文明发生、发展的关系却更为人们所重视。“黄河是中华民族的摇篮”，这是一种生生不息的民族信念。黄河全长5，464公里，流域面积约75 万平方公里。它的发源地在巴颜喀拉山下的卡日曲，河流从这里开始，将冰雪的融水和雨水汇入两个高原湖泊——扎陵湖和鄂陵湖，然后流转于青藏高原之上，至兰州而展开呈弯弓状，后穿越秦晋两","w":"normal","e":["原书正文"]},{"t":"【原文】积于河床底部，使河床高出","y":"教材原文","p":["积于河床底部，使河床高出地面4米至5米，有的地方甚至达10米，成为世界上有名的“地上河”，形成“易淤、 易决、 易徙” 的特点，因而造成历代水患","据不完全统计，在过去的2，000余年中，黄河曾先后决口泛滥达1，500余次","治理黄河成为历代治国安民的重大措施"],"q":"积于河床底部，使河床高出地面4米至5米，有的地方甚至达10米，成为世界上有名的“地上河”，形成“易淤、 易决、 易徙” 的特点，因而造成历代水患。据不完全统计，在过去的2，000余年中，黄河曾先后决口泛滥达1，500余次。治理黄河成为历代治国安民的重大措施。","w":"normal","e":["原书正文"]}]},{"id":"culture-c02-s02","t":"第二节 山川名胜与古都","w":"normal","n":11,"k":[{"t":"五岳","y":"名词解释","p":["东岳泰山、西岳华山、南岳衡山、北岳恒山、中岳嵩山","定型于汉代","帝王封禅祭祀之所","承载天人相通的政治礼制"],"q":"五岳是中国古代对五座名山的封禅祭祀体系的合称，指东岳泰山、西岳华山、南岳衡山、北岳恒山、中岳嵩山。五岳之说定型于汉代，历代帝王以五岳为巡狩封禅、祭祀山川神祇之所。五岳不仅是地理概念，更承载了\"天人相通\"的政治礼制与山岳崇拜的文化内涵。","w":"normal","e":["核心概念"]},{"t":"黄河文明","y":"名词解释","p":["以黄河流域为中心","土壤肥沃便于农耕","长期为政治经济文化中心","被称为母亲河"],"q":"指以黄河流域为中心形成的中华文明。黄河全长约5464公里，是中国第二长河，中下游黄土高原与冲积平原土壤肥沃、便于农耕，历史上长期是中国政治经济文化中心。仰韶文化、龙山文化、二里头文化等均分布于黄河流域，故黄河被称为中华民族的“母亲河”。","w":"normal","e":["核心概念"]},{"t":"六大古都","y":"名词解释","p":["西安洛阳南京北京开封杭州","长期作为王朝政治中心","都城文化遗产丰富"],"q":"指中国历史上建都时间较长、影响较大的六座城市：西安（长安）、洛阳、南京（建康/金陵）、北京（燕京/大都）、开封（汴梁）、杭州（临安）。它们长期作为王朝政治中心，留下了丰富的都城文化遗产。","w":"normal","e":["核心概念"]},{"t":"中国历代疆域自秦以后始终保持不变。","y":"名词解释","p":["历代疆域不断变化","清代基本奠定现代疆域"],"q":"错误。中国历代疆域随王朝兴衰而不断变化，秦、汉、唐、元、清各代疆域范围差异很大，总体呈逐步奠定与巩固的趋势。","w":"normal","e":["核心概念"]},{"t":"试论黄河流域成为中华文明核心区的原因","y":"名词解释","p":["黄土肥沃适宜农耕","水源充足便于灌溉","平原相连交通便利","文化序列完整最早进入文明","长期为政治中心"],"q":"①自然条件优越：黄土疏松肥沃、易于耕作，季风气候雨热同期，适宜粟作农业发展；②水源充足：黄河及其支流提供灌溉与生活用水，河谷阶地便于聚落形成；③交通便利：平原相连，便于文化交流与政治整合；④文化积淀深厚：仰韶、龙山、二里头等文化序列完整，最早进入文明门槛；⑤政治中心长期在此：夏商周至汉唐多建都于关中","w":"normal","e":["核心概念"]},{"t":"【原文】重庆，位于四川盆地东南部","y":"教材原文","p":["重庆，位于四川盆地东南部，长江和嘉陵江蜿蜒其间，故称江州，为周初巴国，因隋、唐、宋时三次为渝州治所，故简称“渝”","“重庆”之名，其说有二：一说重庆北宋时为恭州，南宋光宗继位前，于孝宗淳熙十六年(1189年) 被封于此，是年又受禅即帝位，于是取双重庆贺之意，改恭州为“重庆府”","一说因重庆位于绍庆和顺庆之间，合双庆而为府名","1939年被国民党政府划为直辖市，新中国建立初仍为直辖市，后划归四川省"],"q":"重庆，位于四川盆地东南部，长江和嘉陵江蜿蜒其间，故称江州，为周初巴国，因隋、唐、宋时三次为渝州治所，故简称“渝”。“重庆”之名，其说有二：一说重庆北宋时为恭州，南宋光宗继位前，于孝宗淳熙十六年(1189年) 被封于此，是年又受禅即帝位，于是取双重庆贺之意，改恭州为“重庆府”；一说因重庆位于绍庆和顺庆之间，合双庆而为府名。1939年被国民党政府划为直辖市，新中","w":"normal","e":["原书正文"]},{"t":"【原文】河北，即在太行山以东、黄","y":"教材原文","p":["河北，即在太行山以东、黄河以北，古属燕、赵之地，作为行政区划的名称始于唐代设立的“河北道”，五代沿袭不变","宋以后曾分为河北东路、河北西路","元置行中书省，明直属京师，清改称直隶省","1928年，国民党政府改为河北省，新中国成立后仍称之，省会初设天津市，后迁保定市，又迁石家庄市"],"q":"河北，即在太行山以东、黄河以北，古属燕、赵之地，作为行政区划的名称始于唐代设立的“河北道”，五代沿袭不变。宋以后曾分为河北东路、河北西路。元置行中书省，明直属京师，清改称直隶省。1928年，国民党政府改为河北省，新中国成立后仍称之，省会初设天津市，后迁保定市，又迁石家庄市。以其地在《禹贡》中属“冀州”，简称“冀”。","w":"normal","e":["原书正文"]},{"t":"【原文】山西，即在太行山以西，古","y":"教材原文","p":["山西，即在太行山以西，古称“唐”，春秋属晋，战国时分为韩、赵、魏，故称“三晋”，唐代以长安为都，称黄河以东、太行山以西为河东，设河东道，京剧《下河东》即指此","元代以今北京为都城，称太行山以西为山西，设河东山西道宣抚司，属中书省","明清为山西省，沿袭至今","现省会太原市，简称“晋”"],"q":"山西，即在太行山以西，古称“唐”，春秋属晋，战国时分为韩、赵、魏，故称“三晋”，唐代以长安为都，称黄河以东、太行山以西为河东，设河东道，京剧《下河东》即指此。元代以今北京为都城，称太行山以西为山西，设河东山西道宣抚司，属中书省。明清为山西省，沿袭至今。现省会太原市，简称“晋”。","w":"normal","e":["原书正文"]},{"t":"【原文】地理概况地理概况5522","y":"教材原文","p":["地理概况地理概况5522内蒙古自治区，位于我国北部，与蒙古国、俄罗斯接壤","蒙古原为蒙古高原的部族名，唐代已见于文献记载","直到13世纪初，成吉思汗建立蒙古汗国，其后忽必烈南下灭金，建立元朝，称雄一时","明清以来，习惯上将蒙古分为内、外两部分"],"q":"地理概况地理概况5522内蒙古自治区，位于我国北部，与蒙古国、俄罗斯接壤。蒙古原为蒙古高原的部族名，唐代已见于文献记载。直到13世纪初，成吉思汗建立蒙古汗国，其后忽必烈南下灭金，建立元朝，称雄一时。明清以来，习惯上将蒙古分为内、外两部分。内蒙古指大漠以南、长城以北，东起哲里木，西至河套广大地区。1947年5月1日，成立内蒙古自治区，首府呼和浩特市，简称“蒙”","w":"normal","e":["原书正文"]},{"t":"【原文】辽宁，地处辽河流域，战国","y":"教材原文","p":["辽宁，地处辽河流域，战国时属燕，为辽东郡，政治中心在今辽阳市","秦汉置辽东、辽西郡，其后也有称辽东为辽左者","元代设辽阳行省，明代"],"q":"辽宁，地处辽河流域，战国时属燕，为辽东郡，政治中心在今辽阳市。秦汉置辽东、辽西郡，其后也有称辽东为辽左者。元代设辽阳行省，明代","w":"normal","e":["原书正文"]},{"t":"【原文】吉林，位于东北地区中部、","y":"教材原文","p":["吉林，位于东北地区中部、松花江两岸","古为肃慎地，汉属夫余郡，唐为渤海国的一部分，辽、金为上京道或上京路，元属辽阳行省，明为女真族控制，清时在松花江沿岸建吉林乌拉城(今吉林市)，简称吉林，驻吉林将军，清末定为吉林省至今","现省会长春市，简称“吉”"],"q":"吉林，位于东北地区中部、松花江两岸。古为肃慎地，汉属夫余郡，唐为渤海国的一部分，辽、金为上京道或上京路，元属辽阳行省，明为女真族控制，清时在松花江沿岸建吉林乌拉城(今吉林市)，简称吉林，驻吉林将军，清末定为吉林省至今。现省会长春市，简称“吉”。","w":"normal","e":["原书正文"]}]},{"id":"culture-c02-s03","t":"综合考点","w":"normal","n":7,"k":[{"t":"三皇五帝","y":"名词解释","p":["三皇：伏羲、神农、黄帝","五帝：黄帝、颛顼、帝喾、尧、舜","中华民族的人文始祖"],"q":"中国古代传说中的远古帝王。三皇通常指伏羲、神农、黄帝（或燧人、伏羲、神农）；五帝通常指黄帝、颛顼、帝喾、尧、舜。他们被视为中华民族的人文始祖。","w":"normal","e":["核心概念"]},{"t":"【原文】甘肃，位于我国西北地区，","y":"教材原文","p":["甘肃，位于我国西北地区，西北一隅与蒙古国接界","古为雍、梁二州，春秋时属秦和西戎，秦为陇西郡，汉为凉州，西夏时于其境内甘州(今张掖市)、肃州(今酒泉市) 置甘肃监军司，始见“甘肃”之名","元设甘肃行中书省，明隶属陕西省，清置甘肃省","现省会兰州市，简称“甘”或“陇”"],"q":"甘肃，位于我国西北地区，西北一隅与蒙古国接界。古为雍、梁二州，春秋时属秦和西戎，秦为陇西郡，汉为凉州，西夏时于其境内甘州(今张掖市)、肃州(今酒泉市) 置甘肃监军司，始见“甘肃”之名。元设甘肃行中书省，明隶属陕西省，清置甘肃省。现省会兰州市，简称“甘”或“陇”。","w":"normal","e":["原书正文"]},{"t":"【原文】宁夏回族自治区，位于我国","y":"教材原文","p":["宁夏回族自治区，位于我国西北地区，地处黄河中游","秦属北地郡，汉为朔方，宋为西夏国，元置西夏行中书省，后取夏地安宁之意，改名“宁夏行省”，明清为宁夏府，1928年置宁夏省","1958年10月成立宁夏回族自治区，首府银川市，简称“宁”"],"q":"宁夏回族自治区，位于我国西北地区，地处黄河中游。秦属北地郡，汉为朔方，宋为西夏国，元置西夏行中书省，后取夏地安宁之意，改名“宁夏行省”，明清为宁夏府，1928年置宁夏省。1958年10月成立宁夏回族自治区，首府银川市，简称“宁”。","w":"normal","e":["原书正文"]},{"t":"【原文】新疆维吾尔自治区，位于我","y":"教材原文","p":["新疆维吾尔自治区，位于我国西北边疆，与蒙古国、俄罗斯、哈萨克斯坦、吉尔吉斯斯坦、塔吉克斯坦、阿富汗、巴基斯坦、印度等八国交界","汉时为西域都护府，唐设北庭和安西都护府，宋为西辽地，元为察合台汗国及哈喇火州，明为亦力把里部及吐鲁番部","清乾隆时设立伊犁将军，统辖天山南北两路，清政府以其为新辟疆域，故名“新疆”","光绪十年(1884年)置新疆省"],"q":"新疆维吾尔自治区，位于我国西北边疆，与蒙古国、俄罗斯、哈萨克斯坦、吉尔吉斯斯坦、塔吉克斯坦、阿富汗、巴基斯坦、印度等八国交界。汉时为西域都护府，唐设北庭和安西都护府，宋为西辽地，元为察合台汗国及哈喇火州，明为亦力把里部及吐鲁番部。清乾隆时设立伊犁将军，统辖天山南北两路，清政府以其为新辟疆域，故名“新疆”。光绪十年(1884年)置新疆省。1955年10月，成立","w":"normal","e":["原书正文"]},{"t":"【原文】地理概况地理概况2299","y":"教材原文","p":["地理概况地理概况2299台湾，位于我国东南海面上，隔台湾海峡与福建省相望，为我国第一大岛，面积为3.6万平方公里","其名称源于土著民族“台窝湾”","古称“夷岛”“夷州”“琉球”等","三国时的吴国曾派遣将军卫温、诸葛直率甲士万人浮海至夷洲(即夷州)"],"q":"地理概况地理概况2299台湾，位于我国东南海面上，隔台湾海峡与福建省相望，为我国第一大岛，面积为3.6万平方公里。其名称源于土著民族“台窝湾”。古称“夷岛”“夷州”“琉球”等。三国时的吴国曾派遣将军卫温、诸葛直率甲士万人浮海至夷洲(即夷州)。南宋时澎湖列岛已属福建路；元明置巡检司，后被荷兰、西班牙殖民者侵占；明末郑成功收复台湾；清初置台湾府，隶属福建省, 光","w":"normal","e":["原书正文"]},{"t":"【原文】香港特别行政区，位于南海","y":"教材原文","p":["香港特别行政区，位于南海之滨、珠江口东侧，毗邻广东省深圳市，分香港岛、九龙、新界三部分，总面积约为1，104平方公里，清代属广东省新安县(今深圳市)，1842年鸦片战争后被英国占领达150余年","根据1984年中英两国联合声明，香港于1997年7月1日回归祖国，按照“一国两制”的原则，实行“港人治港，高度自治”，中央政府只负责其外交和防务，其"],"q":"香港特别行政区，位于南海之滨、珠江口东侧，毗邻广东省深圳市，分香港岛、九龙、新界三部分，总面积约为1，104平方公里，清代属广东省新安县(今深圳市)，1842年鸦片战争后被英国占领达150余年。根据1984年中英两国联合声明，香港于1997年7月1日回归祖国，按照“一国两制”的原则，实行“港人治港，高度自治”，中央政府只负责其外交和防务，其","w":"normal","e":["原书正文"]},{"t":"【原文】澳门特别行政区，位于珠江","y":"教材原文","p":["澳门特别行政区，位于珠江三角洲南端，北与广东省珠海市相接，原属广东省香山县，由澳门半岛、凼仔岛和路环岛三部分组成，现在总面积为29.5 平方公里","明嘉靖三十二年(1553年)，葡萄牙殖民者借口曝晒水渍货物，强行上岸租占，鸦片战争后不断扩大范围，至清光绪十三年(1887年) 迫使清政府与之签订《中葡里斯本草约》和《中葡和好通商条约》，在澳门实行殖民统治","1987年3月26日中葡两国签署联合声明，宣布 1999年 12月 20日中国恢复对澳门行使主权","1999 年12月20日回归后，成立澳门特别行政区，按照“一国两制”的原则，实行“澳人治澳，高度自治”，由特区政府依照《中华人民共和国澳门特别行政区基本法》进行治理"],"q":"澳门特别行政区，位于珠江三角洲南端，北与广东省珠海市相接，原属广东省香山县，由澳门半岛、凼仔岛和路环岛三部分组成，现在总面积为29.5 平方公里。明嘉靖三十二年(1553年)，葡萄牙殖民者借口曝晒水渍货物，强行上岸租占，鸦片战争后不断扩大范围，至清光绪十三年(1887年) 迫使清政府与之签订《中葡里斯本草约》和《中葡和好通商条约》，在澳门实行殖民统治。198","w":"normal","e":["原书正文"]}]}]},{"id":"culture-c03","t":"第三章 历史纵横","w":"high","s":[{"id":"culture-c03-s01","t":"第一节 上古与先秦制度","w":"high","n":14,"k":[{"t":"三皇五帝","y":"名词解释","p":["三皇多指伏羲女娲神农","五帝指黄帝颛顼帝喾尧舜","被视为人文始祖","反映原始社会历史进程"],"q":"中国古代传说中的远古帝王。三皇说法不一，通常指伏羲、女娲、神农（或燧人、伏羲、神农）；五帝通常指黄帝、颛顼、帝喾、尧、舜。三皇五帝被视为中华民族的人文始祖，其传说反映了原始社会由母系到父系、由采集渔猎到农耕的历史进程。","w":"high","e":["2017 真题"]},{"t":"百家争鸣","y":"名词解释","p":["春秋战国社会大变革背景","儒道墨法等学派林立","围绕治国伦理天人关系论辩","奠定传统思想文化格局"],"q":"春秋战国时期社会大变革背景下出现的学术思想繁荣局面。主要学派有儒家（孔孟荀）、道家（老庄）、墨家（墨子）、法家（商鞅韩非）、名家、阴阳家、纵横家、杂家、农家等。各家围绕治国理政、伦理道德、天人关系展开论辩，奠定了中国传统思想文化的基本格局。","w":"high","e":["2016 真题"]},{"t":"禅让制","y":"名词解释","p":["原始社会末期推举首领","选贤与能、天下为公","禹以后为世袭制取代"],"q":"原始社会末期部落联盟推举首领的制度，即\"天下为公，选贤与能\"，尧传舜、舜传禹即其典型。禹以后传位于子启，禅让制被世袭制取代。","w":"normal","e":["核心概念"]},{"t":"宗法制","y":"名词解释","p":["血缘关系为纽带","嫡长子继承制为核心","周代确立、大宗小宗"],"q":"以血缘关系为纽带、以嫡长子继承制为核心的家族与国家相统一的制度，由周代确立，分大宗小宗，强调尊尊亲亲，对中国传统社会结构影响深远。","w":"normal","e":["核心概念"]},{"t":"分封制","y":"名词解释","p":["周天子分封土地人民","对象为王族功臣先代贵族","诸侯承担纳贡朝觐义务"],"q":"周灭商后，周天子把土地和人民分封给王族、功臣和先代贵族，建立诸侯国，诸侯对天子承担纳贡、朝觐、出兵等义务，以拱卫王室。","w":"normal","e":["核心概念"]},{"t":"井田制","y":"名词解释","p":["商周时期的土地制度","九区如井字，中为公田","八家同耕公田","土地王有，春秋瓦解"],"q":"井田制是商周时期的土地制度，因土地划分为\"井\"字形的九区而得名。中间一区为公田，周围八区为私田，八家同耕公田、私田自收，即\"同养公田，公事毕然后敢治私事\"。井田制以土地王有为前提，与分封制和徭役剥削相结合，春秋时期随着铁器牛耕推广与土地私有化而瓦解。","w":"normal","e":["核心概念"]},{"t":"【原文】(即中央)，中央属土，土","y":"教材原文","p":["(即中央)，中央属土，土呈黄色，故被尊为黄帝","相传他发明衣帽，建造房屋，制为黄帝","相传他发明衣帽，建造房屋，制造车船、 弓箭，他的妻子嫘祖发明养蚕，"],"q":"(即中央)，中央属土，土呈黄色，故被尊为黄帝。相传他发明衣帽，建造房屋，制为黄帝。相传他发明衣帽，建造房屋，制造车船、 弓箭，他的妻子嫘祖发明养蚕，","w":"normal","e":["原书正文"]},{"t":"【原文】造车船、 弓箭，他的妻子","y":"教材原文","p":["造车船、 弓箭，他的妻子嫘祖发明养蚕，史官仓颉创造文字，羲和占日，常仪占月，史官仓颉创造文字，羲和占日，常仪占月，容成作历，开始产生了天文、历法等"],"q":"造车船、 弓箭，他的妻子嫘祖发明养蚕，史官仓颉创造文字，羲和占日，常仪占月，史官仓颉创造文字，羲和占日，常仪占月，容成作历，开始产生了天文、历法等。这","w":"normal","e":["原书正文"]},{"t":"【原文】容成作历，开始产生了天文","y":"教材原文","p":["容成作历，开始产生了天文、历法等","这都说明在黄帝时代，社会文化有了长足的都说明在黄帝时代，社会文化有了长足的进步","这时已进入父系氏族社会，出现了"],"q":"容成作历，开始产生了天文、历法等。这都说明在黄帝时代，社会文化有了长足的都说明在黄帝时代，社会文化有了长足的进步。这时已进入父系氏族社会，出现了","w":"normal","e":["原书正文"]},{"t":"【原文】进步。这时已进入父系氏族","y":"教材原文","p":["这时已进入父系氏族社会，出现了私有财产，开始了贫富分化，因而产生了掠夺和战争","古籍记载说，黄帝8833不但和蚩尤作战，后来还跟炎帝厮杀，最终夺得统治华夏的大权"],"q":"进步。这时已进入父系氏族社会，出现了私有财产，开始了贫富分化，因而产生了掠夺和战争。古籍记载说，黄帝8833不但和蚩尤作战，后来还跟炎帝厮杀，最终夺得统治华夏的大权。相传黄","w":"normal","e":["原书正文"]},{"t":"【原文】不但和蚩尤作战，后来还跟","y":"教材原文","p":["不但和蚩尤作战，后来还跟炎帝厮杀，最终夺得统治华夏的大权","相传黄帝还采铜于荆山(在今河南省灵宝市)，然后炼鼎，以作为国家的象征"],"q":"不但和蚩尤作战，后来还跟炎帝厮杀，最终夺得统治华夏的大权。相传黄帝还采铜于荆山(在今河南省灵宝市)，然后炼鼎，以作为国家的象征。鼎成，","w":"normal","e":["原书正文"]},{"t":"【原文】黄帝乘龙升天，群臣号泣不","y":"教材原文","p":["黄帝乘龙升天，群臣号泣不舍，牵衣不放，至桥山黄帝升天而去，人们葬其衣冠、弓箭，这就是今天位于陕西省黄陵县的“黄帝陵”"],"q":"黄帝乘龙升天，群臣号泣不舍，牵衣不放，至桥山黄帝升天而去，人们葬其衣冠、弓箭，这就是今天位于陕西省黄陵县的“黄帝陵”。这说明，黄帝时","w":"normal","e":["原书正文"]},{"t":"【原文】期已开始进入青铜器时代","y":"教材原文","p":["期已开始进入青铜器时代","据史书记载，黄帝有子25人，其中 14人得12姓，历史上的尧、舜、禹和夏、商、周等诸王，都是他的子孙"],"q":"期已开始进入青铜器时代。据史书记载，黄帝有子25人，其中 14人得12姓，历史上的尧、舜、禹和夏、商、周等诸王，都是他的子孙。现在，全国有","w":"normal","e":["原书正文"]},{"t":"【原文】关黄帝的遗迹很多，分布于","y":"教材原文","p":["关黄帝的遗迹很多，分布于河北、山东、陕西、甘肃、湖南等地，其中尤以河南省新郑市的黄帝遗迹最丰富，是国内外有名的“黄帝故里”，而世界"],"q":"关黄帝的遗迹很多，分布于河北、山东、陕西、甘肃、湖南等地，其中尤以河南省新郑市的黄帝遗迹最丰富，是国内外有名的“黄帝故里”，而世界","w":"normal","e":["原书正文"]}]},{"id":"culture-c03-s02","t":"第二节 王朝更替与变法","w":"normal","n":12,"k":[{"t":"焚书坑儒","y":"名词解释","p":["秦始皇加强思想专制","焚《诗》《书》百家语","坑杀儒生四百六十余人"],"q":"秦始皇为加强思想统治，采纳李斯建议，焚烧《诗》《书》及诸子百家著作，坑杀方士儒生四百六十余人，钳制了思想，摧残了文化。","w":"normal","e":["核心概念"]},{"t":"商鞅变法","y":"名词解释","p":["秦孝公支持、商鞅主持","废井田开阡陌、奖励耕战","推行县制、统一度量衡","使秦富强为统一奠基"],"q":"战国时期商鞅在秦孝公支持下推行的改革，主要内容有废井田开阡陌、奖励耕战、推行县制、统一度量衡、编制户籍等，使秦国富强，为统一奠定基础。","w":"normal","e":["核心概念"]},{"t":"改土归流","y":"名词解释","p":["明清在西南少数民族地区推行","废世袭土司、设流官","雍正朝鄂尔泰主持","加强中央对边疆管辖"],"q":"改土归流是明清时期在西南少数民族地区废除世袭土司、改设流官的政策。土司制度下地方首领世袭割据，中央难以控制；明永乐年间开始局部推行，清雍正年间鄂尔泰大力主持，在云南、贵州、广西、四川等地大规模实施。这一政策加强了中央对边疆的直接管辖，促进了民族地区与内地的交流，但也伴随武力镇压。","w":"normal","e":["核心概念"]},{"t":"试论中国古代王朝更替的基本规律","y":"名词解释","p":["土地兼并引发农民起义","政治腐败制度僵化","边疆压力与军事失控","新王朝重建合法性","治乱循环的王朝周期律"],"q":"①经济基础决定：土地兼并加剧、赋役繁重导致农民起义，是王朝崩溃的常见导火索；②政治腐败与制度僵化：皇权专制下官僚体系腐败、党争内耗、财政危机难以自我革新；③边疆压力与军事失控：外族入侵或藩镇割据加速衰亡；④合法性重建：新王朝多通过“承天受命”、恢复秩序与轻徭薄赋获得认同；⑤周期性循环：治乱兴衰与人口","w":"normal","e":["核心概念"]},{"t":"【原文】历史纵横历史纵横继位皇帝","y":"教材原文","p":["历史纵横历史纵横继位皇帝中的杰出者，在一定程度上有赖于他们的个人才能，但跟他们所处的环境也不无关系","比如秦始皇，13岁继位","当时正值天下七雄互争霸主，而秦国在商鞅变法之后日益强大","这种内外因子的结合，使秦始皇成为一代雄才"],"q":"历史纵横历史纵横继位皇帝中的杰出者，在一定程度上有赖于他们的个人才能，但跟他们所处的环境也不无关系。比如秦始皇，13岁继位。当时正值天下七雄互争霸主，而秦国在商鞅变法之后日益强大。这种内外因子的结合，使秦始皇成为一代雄才。汉武帝也有雄才大略，在“文景之治”的基础上，以其文治武功造就了大汉帝国。唐太宗李世民名为继位，实则参与开国，以虚心纳谏、厉行俭约，达至国泰","w":"normal","e":["原书正文"]},{"t":"【原文】继位皇帝中的杰出者，在一","y":"教材原文","p":["继位皇帝中的杰出者，在一定程度上有赖于他们的个人才能，但跟他们所处的环境也不无关系","比如秦始皇，13岁继位","当时正值天下七雄互争霸主，而秦国在商鞅变法之后日益强大","这种内外因子的结合，使秦始皇成为一代雄才"],"q":"继位皇帝中的杰出者，在一定程度上有赖于他们的个人才能，但跟他们所处的环境也不无关系。比如秦始皇，13岁继位。当时正值天下七雄互争霸主，而秦国在商鞅变法之后日益强大。这种内外因子的结合，使秦始皇成为一代雄才。汉武帝也有雄才大略，在“文景之治”的基础上，以其文治武功造就了大汉帝国。唐太宗李世民名为继位，实则参与开国，以虚心纳谏、厉行俭约，达至国泰民安，开创了著名","w":"normal","e":["原书正文"]},{"t":"【原文】4747(二) 素质平平","y":"教材原文","p":["4747(二) 素质平平的庸才，有一些甚至就是蠢材和杀人魔王","这一类皇帝为数不少，基本上都是继位者","他们“生于深宫之中，长于妇人之手”，锦衣玉食，养尊处优，生性懦弱、顽劣、不通民情世故，甚至在生理和心理"],"q":"4747(二) 素质平平的庸才，有一些甚至就是蠢材和杀人魔王。这一类皇帝为数不少，基本上都是继位者。他们“生于深宫之中，长于妇人之手”，锦衣玉食，养尊处优，生性懦弱、顽劣、不通民情世故，甚至在生理和心理","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)(三) 幼儿皇帝和白痴皇帝，根本还谈不上有什么素质","据统计，自汉代以后所谓正统王朝的幼儿皇帝有29人，即位年龄从出生百日到七八岁不等","这些幼儿皇帝当然不可能理政，只好由母后、外戚或权臣根据自己的政治需要摄政，而将幼儿皇帝玩于股掌之中，甚至取而代之","如果是母后临朝称制，由于其年轻守寡，则会导致后宫淫乱，造成政治黑暗"],"q":"中国文化要略(第4版)中国文化要略(第4版)(三) 幼儿皇帝和白痴皇帝，根本还谈不上有什么素质。据统计，自汉代以后所谓正统王朝的幼儿皇帝有29人，即位年龄从出生百日到七八岁不等。这些幼儿皇帝当然不可能理政，只好由母后、外戚或权臣根据自己的政治需要摄政，而将幼儿皇帝玩于股掌之中，甚至取而代之。如果是母后临朝称制，由于其年轻守寡，则会导致后宫淫乱，造成政治黑暗。","w":"normal","e":["原书正文"]},{"t":"【原文】(三) 幼儿皇帝和白痴皇","y":"教材原文","p":["(三) 幼儿皇帝和白痴皇帝，根本还谈不上有什么素质","据统计，自汉代以后所谓正统王朝的幼儿皇帝有29人，即位年龄从出生百日到七八岁不等","这些幼儿皇帝当然不可能理政，只好由母后、外戚或权臣根据自己的政治需要摄政，而将幼儿皇帝玩于股掌之中，甚至取而代之","如果是母后临朝称制，由于其年轻守寡，则会导致后宫淫乱，造成政治黑暗"],"q":"(三) 幼儿皇帝和白痴皇帝，根本还谈不上有什么素质。据统计，自汉代以后所谓正统王朝的幼儿皇帝有29人，即位年龄从出生百日到七八岁不等。这些幼儿皇帝当然不可能理政，只好由母后、外戚或权臣根据自己的政治需要摄政，而将幼儿皇帝玩于股掌之中，甚至取而代之。如果是母后临朝称制，由于其年轻守寡，则会导致后宫淫乱，造成政治黑暗。北魏的胡太后是最突出的一例。慈禧太后之所以能","w":"normal","e":["原书正文"]},{"t":"【原文】8844(四) 还有一些","y":"教材原文","p":["8844(四) 还有一些帝王，具有其他杰出的才能，譬如说文学艺术之才","宋徽宗赵佶算是一个，作为一位杰出的书画家，他的艺术造诣很高","他创立了中国最早的国家画院，创作了千余册花鸟画，其书法“瘦金体”独树一帜","南唐后主李煜的词作，被历代传颂，千古不朽"],"q":"8844(四) 还有一些帝王，具有其他杰出的才能，譬如说文学艺术之才。宋徽宗赵佶算是一个，作为一位杰出的书画家，他的艺术造诣很高。他创立了中国最早的国家画院，创作了千余册花鸟画，其书法“瘦金体”独树一帜。南唐后主李煜的词作，被历代传颂，千古不朽。梁元帝萧绎，能书善画，擅长作文，研究学术，著作甚多。他曾自我评价说：“我韬于文士，愧于武夫。”但这三位在治国方面一","w":"normal","e":["原书正文"]},{"t":"【原文】三大政治群体，或称政治势","y":"教材原文","p":["三大政治群体，或称政治势力：一是以“宰相”为首的百官，拥有治权，奔走在外朝，是真正管理国家的人员","二是由皇室姻亲组成的外戚，他们享有尊荣的特权，但不拥有治权，除非受皇帝任命担任一定的官职，成为百官之一","三是为皇帝及其家眷服务的后宫男性，称为“宦官”，他们属于被驱使的家奴，更不拥有治权","但是，皇帝出于维护皇权的需要，常常抑此扬彼，用此弃彼，这就造成了中国历史上错综复杂的朝政纷争和乱局，甚至危及王朝的命运"],"q":"三大政治群体，或称政治势力：一是以“宰相”为首的百官，拥有治权，奔走在外朝，是真正管理国家的人员；二是由皇室姻亲组成的外戚，他们享有尊荣的特权，但不拥有治权，除非受皇帝任命担任一定的官职，成为百官之一； 三是为皇帝及其家眷服务的后宫男性，称为“宦官”，他们属于被驱使的家奴，更不拥有治权。但是，皇帝出于维护皇权的需要，常常抑此扬彼，用此弃彼，这就造成了中国历史","w":"normal","e":["原书正文"]},{"t":"【原文】“宰相”是中国封建王朝掌","y":"教材原文","p":["“宰相”是中国封建王朝掌握最高行政执行权的人物，权力仅次于皇帝，所以说“一人之下，万人之上”","“宰”是主宰之意，“相”是辅佐之意","但是在中国历史上真正掌握最高行政执行权的人，恰恰都不称“宰相”(只有契丹族的辽国短暂地用过这一名称)","“宰相”一词，只是习惯性的说法，最早见于《韩非子·显学》“宰相必起于州部，猛将必发于卒伍”，后世一直沿用"],"q":"“宰相”是中国封建王朝掌握最高行政执行权的人物，权力仅次于皇帝，所以说“一人之下，万人之上”。“宰”是主宰之意，“相”是辅佐之意。但是在中国历史上真正掌握最高行政执行权的人，恰恰都不称“宰相”(只有契丹族的辽国短暂地用过这一名称)。“宰相”一词，只是习惯性的说法，最早见于《韩非子·显学》“宰相必起于州部，猛将必发于卒伍”，后世一直沿用。由于王朝更迭，加上“君","w":"normal","e":["原书正文"]}]},{"id":"culture-c03-s03","t":"第三节 庙号谥号年号","w":"normal","n":10,"k":[{"t":"谥号","y":"名词解释","p":["死后依生平事迹给予的称号","相传始于西周","有美谥、恶谥、平谥之别","帝王由礼官议定，臣下由朝廷赐予"],"q":"谥号是古代帝王、诸侯、卿大夫及有名望者死后，依其生平事迹与品德给予的带有褒贬色彩的称号。谥法相传始于西周，如文、武、明、成等为美谥，厉、幽、炀等为恶谥，哀、怀等为平谥。帝王的谥号由礼官议定，臣下的谥号由朝廷赐予，私人门生故吏所议者称私谥。","w":"normal","e":["核心概念"]},{"t":"庙号","y":"名词解释","p":["帝王死后太庙奉祀的名号","始于商代","开国称祖、继嗣称宗","唐以后多用以称帝王"],"q":"庙号是古代帝王死后在太庙立室奉祀时特起的名号，始于商代。一般开国之君称\"祖\"，如汉高祖、唐高祖、明太祖；继嗣之君称\"宗\"，如汉太宗、唐太宗、宋仁宗。唐代以后，因谥号越加冗长，人们多以庙号或年号称呼帝王。庙号的给予有严格礼制，非有大功大德者不得称\"祖\"。","w":"normal","e":["核心概念"]},{"t":"【原文】的一个部分。众所周知的北","y":"教材原文","p":["众所周知的北魏孝文帝拓跋宏，自幼受汉族祖母冯太后的影响，亲政后以“汉化”为国策，改鲜卑姓为汉姓，鼓励鲜卑族与汉族通婚，推行汉族王朝的典章制度，大大加速了鲜卑族融入汉族的进程，在中国历史上写下了耀眼的一页","其他少数民族也在与汉族的混居状态中，逐渐地融入汉族","另一方面，由于北方战乱频繁，中原汉族居民也纷纷向江南迁徙","其中有两次规模最大，即西晋王朝与北宋王朝灭亡时，残余皇族司马氏与赵氏先后南渡，有大批高门士族与民众随迁，他们之中，不乏很高文化教养的士子和深谙耕作技术的农夫"],"q":"的一个部分。众所周知的北魏孝文帝拓跋宏，自幼受汉族祖母冯太后的影响，亲政后以“汉化”为国策，改鲜卑姓为汉姓，鼓励鲜卑族与汉族通婚，推行汉族王朝的典章制度，大大加速了鲜卑族融入汉族的进程，在中国历史上写下了耀眼的一页。其他少数民族也在与汉族的混居状态中，逐渐地融入汉族。这是一方面。另一方面，由于北方战乱频繁，中原汉族居民也纷纷向江南迁徙。其中有两次规模最大，即","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)8855(三) 统一与分裂《三国演义》开篇说：“话说天下大势，分久必合，合久必分","”这说的就是中国历史发展中的统一与分裂","但究竟是分长合短，还是分短合长，目前的学术界有不同看法，这里不做评判","实事求是地讲，中国历史上的统一与分裂，都是相对而言的，因为历代王朝的版图不是一成不变的，即使在某个大一统的王朝里也有割据现象"],"q":"中国文化要略(第4版)中国文化要略(第4版)8855(三) 统一与分裂《三国演义》开篇说：“话说天下大势，分久必合，合久必分。”这说的就是中国历史发展中的统一与分裂。但究竟是分长合短，还是分短合长，目前的学术界有不同看法，这里不做评判。实事求是地讲，中国历史上的统一与分裂，都是相对而言的，因为历代王朝的版图不是一成不变的，即使在某个大一统的王朝里也有割据现象","w":"normal","e":["原书正文"]},{"t":"【原文】这主要表现在以下几个方面","y":"教材原文","p":["这主要表现在以下几个方面：一是统一的时间呈逐步增长的趋势","秦灭六国，统一天下，奠定了中国历史统一的根基","因此，从秦算起，至清灭亡，大统一的王朝有秦、汉、西晋、隋、唐、北宋、元、明、清，时间跨度长达2，132年，其中统一的时间为1，626年，约占总数的76%","分裂的时间为507年，约占24%"],"q":"这主要表现在以下几个方面：一是统一的时间呈逐步增长的趋势。秦灭六国，统一天下，奠定了中国历史统一的根基。因此，从秦算起，至清灭亡，大统一的王朝有秦、汉、西晋、隋、唐、北宋、元、明、清，时间跨度长达2，132年，其中统一的时间为1，626年，约占总数的76%；分裂的时间为507年，约占24%。这期间，大的分裂有四次，即魏、蜀、吴三国鼎立时期，东晋五胡十六国与南","w":"normal","e":["原书正文"]},{"t":"【原文】历史纵横历史纵横9955","y":"教材原文","p":["历史纵横历史纵横9955统一之所以是中国历史发展的主流，或者说是中国历史发展的规律，其原因是多方面的","首先是处于疆域中心的中原地区，最先成为经济、政治、文化与科技中心，对周边民族与地区产生了强烈的吸引力和向心力","其次是中国古代哲学强调“中心与四方”的关系，以中土、中原、中州为中心，四面为四夷(东夷、南蛮、西戎、北狄)，进而延伸为四海、九州与天下，《河图》与《洛书》所表达的正是这一意识","第三是各民族间交互杂居，相互通婚，形成了民族大融合"],"q":"历史纵横历史纵横9955统一之所以是中国历史发展的主流，或者说是中国历史发展的规律，其原因是多方面的。首先是处于疆域中心的中原地区，最先成为经济、政治、文化与科技中心，对周边民族与地区产生了强烈的吸引力和向心力。其次是中国古代哲学强调“中心与四方”的关系，以中土、中原、中州为中心，四面为四夷(东夷、南蛮、西戎、北狄)，进而延伸为四海、九州与天下，《河图》与《","w":"normal","e":["原书正文"]},{"t":"【原文】学习与思考中国文化要略(","y":"教材原文","p":["学习与思考中国文化要略(第4版)中国文化要略(第4版)"],"q":"学习与思考中国文化要略(第4版)中国文化要略(第4版)","w":"normal","e":["原书正文"]},{"t":"【原文】5. 为什么说统一是中国","y":"教材原文","p":["5. 为什么说统一是中国历史的一个规律?参考答案6060相关资料相关资料"],"q":"5. 为什么说统一是中国历史的一个规律?参考答案6060相关资料相关资料","w":"normal","e":["原书正文"]},{"t":"【原文】1.陈致平.中华通史.贵","y":"教材原文","p":["1.陈致平.中华通史.贵阳：贵州教育出版社，2014."],"q":"1.陈致平.中华通史.贵阳：贵州教育出版社，2014.","w":"normal","e":["原书正文"]},{"t":"【原文】这里所说的中国的姓氏制度","y":"教材原文","p":["这里所说的中国的姓氏制度，是指以汉族人为主体的绝大多数中国人所采用的姓氏制度","它有如下一些特点 ：(一) 它是氏族血缘关系的产物，又是宗法制度的表现，其历史渊源非常久远，是世界上最古老的姓氏制度之一","如果某个姓想要追根溯源，差不多可以回到数千年以前","这在世界史上是不多见的"],"q":"这里所说的中国的姓氏制度，是指以汉族人为主体的绝大多数中国人所采用的姓氏制度。它有如下一些特点 ：(一) 它是氏族血缘关系的产物，又是宗法制度的表现，其历史渊源非常久远，是世界上最古老的姓氏制度之一。如果某个姓想要追根溯源，差不多可以回到数千年以前。这在世界史上是不多见的。(二) 在长期的封建社会中，它与封建礼制相结合，标榜同姓同宗，抬高名门大姓，成为维护封","w":"normal","e":["原书正文"]}]},{"id":"culture-c03-s04","t":"第四节 外戚与宦官","w":"high","n":8,"k":[{"t":"外戚与宦官","y":"名词解释","p":["外戚为母族妻族姻亲","宦官为宫廷内侍","东汉唐明多次专权","根源是君主专制下的制衡需要"],"q":"外戚指皇帝的母族、妻族等姻亲势力，宦官指宫廷内侍。中国古代多次出现外戚与宦官交替专权的局面，如东汉中后期外戚与宦官轮流把持朝政，唐代宦官掌握禁军废立皇帝，明代宦官干政（王振、魏忠贤）。其根源在于君主专制下皇权对官僚体系的猜忌与制衡需要。","w":"high","e":["2020 真题"]},{"t":"【原文】以其有弑君之罪，后代深以","y":"教材原文","p":["以其有弑君之罪，后代深以为耻，又因他在庶子中排行第一，改称“孟孙”，以孟为氏，孟子即其后裔","(六) 以爵号、谥号为氏","爵号以王、侯二氏最为突出，特别是王氏的来源不止一处，但都与先祖封王或称王有关，故有姬姓王，子姓王，姒姓王，还有少数民族的王，在中国成为一大姓","谥号如文、武、穆、宣、闵、简等"],"q":"以其有弑君之罪，后代深以为耻，又因他在庶子中排行第一，改称“孟孙”，以孟为氏，孟子即其后裔。(六) 以爵号、谥号为氏。爵号以王、侯二氏最为突出，特别是王氏的来源不止一处，但都与先祖封王或称王有关，故有姬姓王，子姓王，姒姓王，还有少数民族的王，在中国成为一大姓。谥号如文、武、穆、宣、闵、简等。如宋武公之后人以武为氏，宋穆公之后人以穆为氏，齐桓公之后人以桓为氏，","w":"normal","e":["原书正文"]},{"t":"【原文】皇族拓跋氏改为元，其他贵","y":"教材原文","p":["皇族拓跋氏改为元，其他贵族改为穆、陆、贺、刘、楼、于、尉等","隋唐时有西域九姓小国，归唐以后以其国名改为康、曹、石、何、史、安等九姓，安禄山、史思明属其中两姓","事实上，现在的许多姓，如张、王、李、赵、刘、曹、吴、罗、包、何、慕、金、关、佟、康等既是汉族的姓，也是少数民族的姓"],"q":"皇族拓跋氏改为元，其他贵族改为穆、陆、贺、刘、楼、于、尉等；隋唐时有西域九姓小国，归唐以后以其国名改为康、曹、石、何、史、安等九姓，安禄山、史思明属其中两姓。事实上，现在的许多姓，如张、王、李、赵、刘、曹、吴、罗、包、何、慕、金、关、佟、康等既是汉族的姓，也是少数民族的姓。","w":"normal","e":["原书正文"]},{"t":"【原文】在中国的封建社会，姓氏是","y":"教材原文","p":["在中国的封建社会，姓氏是非常重要的一个问题","它不但标志着一个人的血统，还标志着一个人的门第和地位","汉魏以来，盛行门阀制度，姓氏有了高低贵贱之分","帝王、功臣、贵戚之姓拥有尊贵地位，享有社会的某些特权，可以左右当时的政治局面，逐渐形成一些豪门大族"],"q":"在中国的封建社会，姓氏是非常重要的一个问题。它不但标志着一个人的血统，还标志着一个人的门第和地位。汉魏以来，盛行门阀制度，姓氏有了高低贵贱之分。帝王、功臣、贵戚之姓拥有尊贵地位，享有社会的某些特权，可以左右当时的政治局面，逐渐形成一些豪门大族。东汉时，除皇族刘姓为第一大姓外，还有所谓“四姓小侯”，即外戚樊、郭、阴、马四姓。汉明帝曾为四姓子弟单独设立学校。到东","w":"normal","e":["原书正文"]},{"t":"【原文】卢、王仍有很高地位","y":"教材原文","p":["卢、王仍有很高地位","李姓以陇西(今甘肃省陇西县) 为贵，崔姓以博陵(今河北省安平县一带) 为贵，卢姓以范阳(今河北省涿州市) 为贵，郑姓以荥阳(今属河南省) 为贵，王姓则以太原为贵","五姓之外，还有河东(今山西南部) 裴、薛二姓，与五姓并称七家","唐代的宰相及其他高级官员大都出身于这些高门"],"q":"卢、王仍有很高地位。李姓以陇西(今甘肃省陇西县) 为贵，崔姓以博陵(今河北省安平县一带) 为贵，卢姓以范阳(今河北省涿州市) 为贵，郑姓以荥阳(今属河南省) 为贵，王姓则以太原为贵。五姓之外，还有河东(今山西南部) 裴、薛二姓，与五姓并称七家。唐代的宰相及其他高级官员大都出身于这些高门。《西厢记》里的崔小姐原本许配给老夫人的侄子郑公子，但却爱上了张君瑞。老夫","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)由于推崇高门大姓，便产生了所谓的“郡望意识”","“郡望”是指某一姓氏世居某郡而为人们所仰望，实际指某一姓氏的社会影响","人们注重出身，看重门第，是封建社会普遍的社会心理","如唐代作家韩愈自称“昌黎人”，时人称其为韩昌黎，李白为韩愈之父仲卿作碑称其为“南阳人”"],"q":"中国文化要略(第4版)中国文化要略(第4版)由于推崇高门大姓，便产生了所谓的“郡望意识”。“郡望”是指某一姓氏世居某郡而为人们所仰望，实际指某一姓氏的社会影响。人们注重出身，看重门第，是封建社会普遍的社会心理。如唐代作家韩愈自称“昌黎人”，时人称其为韩昌黎，李白为韩愈之父仲卿作碑称其为“南阳人”。实际上韩愈父子为河阳(今河南省孟州市) 人。这是因为当时韩姓以","w":"normal","e":["原书正文"]},{"t":"【原文】由于推崇高门大姓，便产生","y":"教材原文","p":["由于推崇高门大姓，便产生了所谓的“郡望意识”","“郡望”是指某一姓氏世居某郡而为人们所仰望，实际指某一姓氏的社会影响","人们注重出身，看重门第，是封建社会普遍的社会心理","如唐代作家韩愈自称“昌黎人”，时人称其为韩昌黎，李白为韩愈之父仲卿作碑称其为“南阳人”"],"q":"由于推崇高门大姓，便产生了所谓的“郡望意识”。“郡望”是指某一姓氏世居某郡而为人们所仰望，实际指某一姓氏的社会影响。人们注重出身，看重门第，是封建社会普遍的社会心理。如唐代作家韩愈自称“昌黎人”，时人称其为韩昌黎，李白为韩愈之父仲卿作碑称其为“南阳人”。实际上韩愈父子为河阳(今河南省孟州市) 人。这是因为当时韩姓以昌黎和南阳两地为郡望。此外，刘姓以彭城(今江","w":"normal","e":["原书正文"]},{"t":"【原文】8866随着社会的进步，","y":"教材原文","p":["8866随着社会的进步，门阀制度早已衰亡，郡望意识也早已淡化，但由于某些姓氏在社会经济文化进程中的特殊表现和作用，它们在近代直至现代仍有着令人瞩目的影响","比如江浙一带的钱氏，至今仍有重大的影响","江浙钱氏的祖先，为五代吴越国的开国君主钱镠","他的三十多个儿子分赴各州任职，其后裔就在江浙一带分布开来"],"q":"8866随着社会的进步，门阀制度早已衰亡，郡望意识也早已淡化，但由于某些姓氏在社会经济文化进程中的特殊表现和作用，它们在近代直至现代仍有着令人瞩目的影响。比如江浙一带的钱氏，至今仍有重大的影响。江浙钱氏的祖先，为五代吴越国的开国君主钱镠。他的三十多个儿子分赴各州任职，其后裔就在江浙一带分布开来。明清以来的江浙钱姓名人辈出，灿若群星，如明末清初诗人钱谦益，清代","w":"normal","e":["原书正文"]}]},{"id":"culture-c03-s05","t":"综合考点","w":"normal","n":9,"k":[{"t":"避讳","y":"名词解释","p":["对君主尊长之名不得直书直呼","国讳、家讳、圣讳三类","改字、缺笔、空字、改读","造成古籍文字变异"],"q":"避讳是古代为维护等级尊严，对君主、尊长之名不得直书直呼的制度，始于周、成于秦、盛于唐宋。主要有国讳（避帝王名）、家讳（避祖父母、父母名）、圣讳（避孔子等圣贤名）三类。避讳方法有改字、缺笔、空字、改读等。这一制度造成古籍中大量文字变异，是阅读古书必须掌握的知识。","w":"normal","e":["核心概念"]},{"t":"【原文】古人在名字之外还有“号”","y":"教材原文","p":["古人在名字之外还有“号”，这又是中国文化中的一个独特现象","号的起源古人在名字之外还有“号”，这又是中国文化中的一个独特现象"],"q":"古人在名字之外还有“号”，这又是中国文化中的一个独特现象。号的起源古人在名字之外还有“号”，这又是中国文化中的一个独特现象。号的起源","w":"normal","e":["原书正文"]},{"t":"【原文】虽然很早，但其流行乃是唐","y":"教材原文","p":["虽然很早，但其流行乃是唐宋以后，明
