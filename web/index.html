则系统，发展言语技能和语言交际能力，解决学习过程中所遇到的问题而采取的各种计划、途径、步骤、方法、技巧和调节措施。综合看来，学习策略大体上可分为认知学习策略和元认知策略两大类。①认知学习策略实际上是直接影响到第二语言学习的一般性策略，根据最早研究学习策略的茹宾所提出的六种认知学习策","w":"high","e":["2022 真题"]},{"t":"简述影响第二语言习得的主要情感因素。","y":"简答题","p":["情感因素主要指动机、态度和性格","动机是激励个体从事某种行为的内在动力，包括目的、愿望、态度和努力行动四个方面","动机有内部动机和外部动机、近景动机和远景动机之分，以及融合型动机和工具型动机","态度是构成动机的主要因素之一，是个体对某种客观事物的评价性反应","性格主要讨论内向和外向、自尊与抑制、焦虑和移情几个主要个性特征"],"q":"情感因素在第二语言习得中起着极其重要的作用，作为个体因素中的情感因素主要指动机、态度和性格。①动机：动机是激励个体从事某种行为的内在动力，第二语言习得的动机包括目的、要达到目的的愿望、对学习的态度和努力行动四个方面。动机有内部动机和外部动机之分，还有近景动机和远景动机之分；影响最大的是融合型动机和工具型动机。②态度：态","w":"high","e":["2020 真题"]},{"t":"试论述认知因素对第二语言习得的影响。","y":"论述题","p":["智力：是成功地认识客观事物和解决问题的各种心理因素的总和，在正式课堂教学中起较大作用","语言学能：学习第二语言所需要的特殊认知素质，主要考查语音编码解码能力、语法敏感性、强记能力、归纳能力","学习策略：大体上可分为认知学习策略和元认知策略两大类","交际策略：是学习者为顺利进行语言交际活动有意识采取的计划措施或方法技巧","认知方式：包括场独立性和场依存性、审慎与冲动、歧义容忍度等","场独立性的学习者长于在课堂教学中有意识地学习语言形式，场依存性的学习者长于在自然语言环境中习得语言"],"q":"语言习得的认知因素主要包括智力、学能、学习策略和交际策略以及认知方式。①智力：智力是人的一种心理机能，是成功地认识客观事物和解决问题的各种心理因素的总和，是由观察力、注意力、记忆力、思维能力、想像力和创造力组成的综合能力。有的西方学者认为智力在语言学习中所起的作用在各种因素中只占16%；在自然语言环境中习得第二语言，智","w":"high","e":["2020 真题"]},{"t":"【案例】一位来自美国的汉语学习者李华，在课堂上非常活跃，总是抢着举手发言，不怕犯错误；但在书写和语法练习中常常不够细致，出现较多的偏误。他的同学田中来自日本，上课时比较安静，不轻易开口，但听力和阅读理解能力较强，语法知识掌握得比较扎实。两人学习汉语的动机也不相同：李华是因为喜爱中国文化，希望将来能在中国生活和工作；田中是出于工作需要，希望能用汉语与客户交流。\n请结合第二语言习得中学习者个体因素的相关知识分析上述案例。","y":"案例分析","p":["运用认知方式理论：李华体现冲动型认知方式，田中体现审慎型认知方式","冲动型的学习者易犯错误，一般口语听说能力强；审慎型的学习者知识比较扎实，读写能力较强","运用动机理论：李华体现融合型动机，田中体现工具型动机","融合型动机更为强烈，学习效果也可能更大；工具型动机也可能产生很好的学习效果","运用态度和性格理论：态度是构成动机的主要因素之一，李华外向、田中内向","外向型有利于口语能力的提高，内向型有利于听力、阅读和写作能力的提高","教学启示：针对学生特点因材施教，鼓励吸取对立一面的某些特点，扬长避短"],"q":"本案例可以用第二语言习得中学习者个体因素的相关知识进行分析。①认知方式方面：两位学习者表现出不同的认知方式。李华在课堂上“非常活跃，抢着举手”，不怕犯错误，这体现出冲动型认知方式的特点：反应快捷，甚至不假思索，在没有现成答案的情况下宁愿用猜测的办法；冲动型的学习者易犯错误，一般口语听说能力强。田中“上课时比较安静，不轻","w":"high","e":["2020 真题"]}]},{"id":"yinlun-c06-s03","t":"第三节 语言学习环境","w":"high","n":13,"k":[{"t":"语言学习环境","y":"名词解释","p":["语言学习环境，是一个内涵与外延较广的概念。可以说，学习者主体以外、与语言学习和运用有关的一切周围事物都是语言学习环境的一部分。","从国家的政治、经济、文化、语言政策、教育政策等所形成的宏观语言环境，到使用目的语的社会大环境和课堂学习小环境。","如果说生理、认知、情感等个体因素是第二语言习得的内部条件的话，环境则是客观存在、影响第二语言习得的外部条件。","不论是一语言或第二语言的获得，都与环境有密切的关系。"],"q":"语言学习环境，是一个内涵与外延较广的概念。可以说，学习者主体以外、与语言学习和运用有关的一切周围事物都是语言学习环境的一部分。","w":"high","e":["2019 真题"]},{"t":"课堂教学与习得的“无关联”与“有关联”","y":"名词解释","p":["克拉申通过英语语素习得研究发现，不论学习者的年龄和母语背景如何，其英语作为第二语言的习得有一固定不变的自然习得顺序，这一习得顺序不受课堂教学的影响。","课堂正式学到的东西也不能变成习得的东西，这是课堂正式教学与第二语言习得“无关联”的观点(non-interface position)。","但是也有不少学者认为尽管正式的课堂教学对学习者的语言习得顺序不起作用，但是获得语法结构的速度却受到正式教学的影响。","这就形成了与克拉申相对的、课堂正式教学与第二语言习得“有关联”的观点(interface position)；其中沙伍德—史密斯与克拉申的观点针锋相对，认为学习先于习得，是习得不可缺少的组成部分。"],"q":"克拉申通过英语语素习得研究发现，不论学习者的年龄和母语背景如何，其英语作为第二语言的习得有一固定不变的自然习得顺序，这一习得顺序不受课堂教学的影响。","w":"high","e":["2020 真题"]},{"t":"如果说生理、认知、情感等个体因素是第二语言习得的内部条件的话，环境则是客观存在、影响第二语言习得的____条件。","y":"填空题","p":["外部"],"q":"外部","w":"high","e":["2019 真题"]},{"t":"社会环境包括语言环境和____环境两个方面。","y":"填空题","p":["人文"],"q":"人文","w":"normal","e":["核心考点"]},{"t":"课堂正式教学与第二语言习得“无关联”的观点是克拉申提出的，其英文名称是____。","y":"填空题","p":["non-interface position"],"q":"non-interface position","w":"normal","e":["核心考点"]},{"t":"白丽丝托克认为对语言知识掌握有分析性的掌握和____的掌握两种情况。","y":"填空题","p":["自动"],"q":"自动","w":"normal","e":["核心考点"]},{"t":"有无目的语社会环境是第二语言教学和外语教学的主要区别。","y":"判断题","p":["第二语言学习，分为在目的语社会环境中和在非目的语社会环境中两种不同的情况，有无目的语社会环境是第二语言教学和外语教学的主要区别。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"克拉申认为课堂正式教学与第二语言习得“无关联”，课堂正式学到的东西不能变成习得的东西。","y":"判断题","p":["克拉申持课堂正式教学与第二语言习得“无关联”的观点，认为课堂教授语法规则对学习者习得这些规则没有影响，课堂正式学到的东西也不能变成习得的东西。"],"q":"正确","w":"high","e":["2020 真题"]},{"t":"课堂教学最根本的缺陷在于难以提供真实的交际情境，也难以进行真正的交际活动。","y":"判断题","p":["课堂教学最根本的缺陷在于难以提供真实的交际情境，也难以进行真正的交际活动，单靠课堂很难培养语言交际能力。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"持课堂正式教学与第二语言习得“无关联”观点的学者是（　　）。","y":"单项选择题","p":["克拉申持课堂正式教学与第二语言习得“无关联”的观点，认为课堂教学对第二语言习得不起作用。"],"q":"A","w":"high","e":["2020 真题"]},{"t":"简述课堂教学的优势和局限性。","y":"简答题","p":["优势：通过教学大纲和教材进行集中的、有目的、有计划的教学活动，收到短期速成的效果","优势：课堂能有目的地提供更集中、范围更广、形式更为复杂的语言形式","优势：强调教授语言规则，符合成人的思维特点和学习特点","优势：有教师的指导和帮助，可以迅速提供反馈，及时纠正错误","局限：接触目的语时间有限，输入量无法与自然习得相比","局限：难以提供真实的交际情境，单靠课堂很难培养语言交际能力"],"q":"课堂教学的优势在于：①课堂教学能充分利用人们长期积累的对语言本身和语言教学的研究成果，通过教学大纲和教材的精心安排，进行集中的、有目的、有计划的教学活动，收到相对说来短期速成的效果。②课堂教学的重点往往是语言形式的掌握，课堂能有目的地提供比自然语言环境更集中、范围更广、形式更为复杂的语言形式，有利于语言形式的掌握。③课","w":"high","e":["2020 真题"]},{"t":"简述社会环境对目的语学习的影响。","y":"简答题","p":["有无目的语社会环境是第二语言教学和外语教学的主要区别","社会环境包括语言环境和人文环境两个方面","语言环境包括视觉环境和听觉环境，鲜活的目的语口语是最重要的语言环境","人文环境包括目的语社会的物质文明、人际交往、风俗习惯、文化历史传统等","社会环境因素从质和量的方面直接影响到学习者语言的输入、内化和输出的习得过程","非目的语环境中学习第二语言的不利因素可以通过一定方式加以弥补"],"q":"第二语言学习，分为在目的语社会环境中和在非目的语社会环境中两种不同的情况，有无目的语社会环境是第二语言教学和外语教学的主要区别。①社会环境包括语言环境和人文环境两个方面：语言环境又包括视觉环境如报纸、杂志、书籍、电脑、广告和各种标志等和听觉环境如广播、电视、电影、戏剧、录像、录音带等，特别是在该社会中广泛使用的鲜活的目","w":"high","e":["2019 真题"]},{"t":"试论述语言学习环境对第二语言习得的影响，并说明如何充分利用语言环境提高学习效率。","y":"论述题","p":["语言学习环境是学习者主体以外、与语言学习和运用有关的一切周围事物","个体因素是内部条件，环境是影响第二语言习得的外部条件","有无目的语社会环境是第二语言教学和外语教学的主要区别","课堂教学既有优势(集中、有计划、提供复杂语言形式、教师指导)又有局限(难以提供真实交际情境)","充分利用语言环境：建立由课堂教学、课外活动和社会语言环境里的交际活动三个层面组成的新的教学体系","三个层面所组成的是课内与课外相结合、学习与习得相结合的立体教学体系"],"q":"语言学习环境是一个内涵与外延较广的概念，可以说，学习者主体以外、与语言学习和运用有关的一切周围事物都是语言学习环境的一部分；从国家的政治、经济、文化、语言政策、教育政策等所形成的宏观语言环境，到使用目的语的社会大环境和课堂学习小环境。如果说生理、认知、情感等个体因素是第二语言习得的内部条件的话，环境则是客观存在、影响第","w":"high","e":["2020 真题"]}]}]},{"id":"yinlun-c07","t":"第七章 第二语言教学法主要流派与发展趋向","w":"high","s":[{"id":"yinlun-c07-s01","t":"第一节 认知派与经验派教学法","w":"high","n":44,"k":[{"t":"语法翻译法","y":"名词解释","p":["语法翻译法又称“传统法”或“古典法”，是以系统的语法知识教学为纲，依靠母语，通过翻译手段，主要培养第二语言读写能力的教学法。","这是第二语言教学史上最古老的教学法，在欧洲用于教授古希腊语、拉丁语已有千百年的历史。","语法翻译法的语言学基础是历史比较语言学，认为一切语言都起源于一种共同的原始语言，语言规律是共同的，词汇所代表的概念也是相同的，所不同的只是词汇的语音和书写形式。","语法翻译法的心理学基础是18世纪德国的官能心理学，其创始人是德国哲学家沃尔夫(C. Wolff)。","18世纪末、19世纪初，德国语言学家奥伦多夫(H. Ollendorff)等对语法翻译法进行了理论上的总结与阐述，使之成为一种科学的第二语言教学法体系。"],"q":"语法翻译法又称“传统法”或“古典法”，是以系统的语法知识教学为纲，依靠母语，通过翻译手段，主要培养第二语言读写能力的教学法。","w":"high","e":["2018 真题","2021 真题"]},{"t":"直接法","y":"名词解释","p":["直接法又称“改革法”或“自然法”，是主张以口语教学为基础，按幼儿习得母语的自然过程，用目的语直接与客观事物相联系而不依赖母语、不用翻译的一种第二语言教学法。","19世纪末20世纪初产生于西欧，主要是法国和德国。","直接法的语言观认为语言是习惯，语言的运用是靠感觉和记忆而不是思维。","直接法的心理学基础是联想主义心理学，认为人的学习方式与动物一样，是刺激与反应直接联结，否认意识在其间的作用。","直接法早期的代表人物有德国语言教育家菲埃托(V. W. Vietor)、德国教育家贝力子(M. Berlitz)、法国语言教育家古安(F. Gouin)等。"],"q":"直接法又称“改革法”或“自然法”，是主张以口语教学为基础，按幼儿习得母语的自然过程，用目的语直接与客观事物相联系而不依赖母语、不用翻译的一种第二语言教学法。","w":"high","e":["2017 真题","2020 真题"]},{"t":"系列法","y":"名词解释","p":["系列法(Series Method)产生于19世纪后半期，倡导者为法国语言教育家古安。","古安根据对儿童语言行为的观察，发现儿童有强烈的讲述自己经历的要求，而且有依据时间顺序排列事件的能力；事物如具有系列性的特点则有利于根据上下文来理解和联想、记忆，也有利于表达。","他在编写教材中，把学生的日常生活分解成许多意义上有联系同时按顺序排列的小段，从而组成一个个系列，再根据这些系列组织语言材料；其中特别要突出动词的使用，把动词作为语言的中心。"],"q":"系列法(Series Method)产生于19世纪后半期，倡导者为法国语言教育家古安。","w":"normal","e":["核心考点"]},{"t":"情景法","y":"名词解释","p":["情景法是本世纪二三十年代产生于英国的一种以口语能力的培养为基础、强调通过有意义的情景进行目的语基本结构操练的教学法。","情景法早期称为口语法(Oral Approach)，代表人物为英国著名语言教育家帕默(H. E. Palmer)和霍恩比(A. S. Hornby)。","情景法的语言学理论基础是英国的结构主义，口语被认为是语言的基础，准确的结构是说话能力的核心。","情景法的心理学基础是行为主义的习惯形成理论，强调学生通过模仿形成正确的语言习惯。","帕默认为学习语言有两种能力：一种是有意识的学习能力，另一种则是天赋的自然学习能力，这应看做是最早提出的区分语言学习与习得的理论。"],"q":"情景法是本世纪二三十年代产生于英国的一种以口语能力的培养为基础、强调通过有意义的情景进行目的语基本结构操练的教学法。","w":"high","e":["2019 真题"]},{"t":"阅读法","y":"名词解释","p":["阅读法产生于20世纪初，为英国著名语言教育家韦斯特(M. West)在印度从事英语教学工作时所创立，又称韦斯特“新法”，是一种强调通过直接阅读来培养阅读能力的教学法。","与帕默强调“口语是基础”不同，韦斯特强调“阅读是基础”。","韦斯特认为应当通过阅读学会阅读，阅读既是目的也是手段。","阅读法要求学生接触大量的语言材料，在上下文或插图的帮助下直接理解阅读材料的内容；不主张阅读之前先教语法规则，而是阅读后把学习者在阅读中已熟悉的语法项目进行归纳。"],"q":"阅读法产生于20世纪初，为英国著名语言教育家韦斯特(M. West)在印度从事英语教学工作时所创立，又称韦斯特“新法”，是一种强调通过直接阅读来培养阅读能力的教学法。","w":"normal","e":["核心考点"]},{"t":"自觉对比法","y":"名词解释","p":["自觉对比法是主张通过母语与目的语的翻译和结构对比，自觉掌握目的语的一种教学方法。","在本世纪30年代至50年代成为前苏联正统的外语教学法，对东欧和蒙古的外语教学也有较大影响，50年代我国外语教学基本上是以自觉对比法为依据。","自觉对比法是以直接法为对立面，客观上成了语法翻译法的继承和发展。","自觉对比法的理论基础首先是重视德育、把教育教养任务放在首位的苏联教育学思想，还以当时苏联的语言学和心理学理论为基础。"],"q":"自觉对比法是主张通过母语与目的语的翻译和结构对比，自觉掌握目的语的一种教学方法。","w":"high","e":["2020 真题"]},{"t":"听说法","y":"名词解释","p":["听说法是本世纪40年代产生于美国的第二语言教学法，强调通过反复的句型结构操练培养口语听说能力，又称“句型法”或“结构法”。","二次大战后期，美国向海外派遣大批军队，为短期内培养受过基本外语口语训练的人员而制订了军队特别培训课程，所以也称为“军队法”。","听说法的语言学理论基础是主张对活的语言(口语)进行仔细的描写分析、不同语言间进行结构对比的美国结构主义语言学。","其心理学理论基础是把人和动物的行为都纳入到刺激—反应轨道之中的行为主义心理学，特别是斯金纳的操作行为主义。"],"q":"听说法是本世纪40年代产生于美国的第二语言教学法，强调通过反复的句型结构操练培养口语听说能力，又称“句型法”或“结构法”。","w":"high","e":["2018 真题","2019 真题","2021 真题"]},{"t":"视听法","y":"名词解释","p":["视听法是50年代产生于法国的一种第二语言教学法，它强调在一定的情景中听觉(录音)感知与视觉(图片影视)感知相结合的教学方法。","因它首创于法国圣克卢高等师范学院，所以也叫“圣克卢法”，代表人物是古布里纳(P. Guberina)和古根汉(G. Gougenhein)。","视听法来源于直接法和听说法，它继承和发扬了二者的长处。","视听法的理论基础也是结构主义语言学和行为主义心理学，认为掌握了一种语言的结构就是掌握了该语言。","视听法又受到完形心理学的影响，强调完整地感知事物，所以视听法也叫“整体结构法”。"],"q":"视听法是50年代产生于法国的一种第二语言教学法，它强调在一定的情景中听觉(录音)感知与视觉(图片影视)感知相结合的教学方法。","w":"high","e":["2019 真题"]},{"t":"自觉实践法","y":"名词解释","p":["自觉实践法是前苏联20世纪60年代以来广泛采用的外语教学方法，主张学习者在自觉掌握一定语言理论知识基础上，主要通过大量言语实践活动达到直觉运用目的语。","代表人物是前苏联的心理学家别利亚耶夫(Б. B. Беляев)。","自觉实践法主要继承直接法通过大量言语实践培养听说读写技能的本质特点，同时也继承了语法翻译法强调自觉掌握语言规则的正确主张，同时吸取了对立的两大派的长处。","自觉实践法的语言学基础是苏联著名语言学家谢尔巴院士关于区分语言、言语、言语活动的学说。"],"q":"自觉实践法是前苏联20世纪60年代以来广泛采用的外语教学方法，主张学习者在自觉掌握一定语言理论知识基础上，主要通过大量言语实践活动达到直觉运用目的语。","w":"high","e":["2020 真题"]},{"t":"认知法","y":"名词解释","p":["认知法又称认知—符号法(Cognitive-Code Approach)，60年代产生于美国，代表人物是美国心理学家卡鲁尔(J. B. Carroll)。","认知法主张在第二语言教学中发挥学习者智力的作用，通过有意识地学习语音、词汇、语法知识，理解、发现、掌握语言规则，并能从听、说、读、写方面全面地、创造性地运用语言。","认知法的语言学理论基础是乔姆斯基的转换生成语法理论，认为语言是一种受规则支配的体系而不是习惯体系；其心理学基础是认知心理学。","认知法还受到皮亚杰的“发生认识论”以及布鲁纳“学科结构论”和“发现学习论”等心理教育学理论的影响。"],"q":"认知法又称认知—符号法(Cognitive-Code Approach)，60年代产生于美国，代表人物是美国心理学家卡鲁尔(J. B. Carroll)。","w":"high","e":["2018 真题","2021 真题"]},{"t":"语法翻译法是最古老的教学法，其语言学基础是历史比较语言学，心理学基础是18世纪德国的官能心理学。","y":"判断题","p":["语法翻译法的语言学基础是历史比较语言学，认为一切语言都起源于一种共同的原始语言，语言规律是共同的，词汇所代表的概念也是相同的，所不同的只是词汇的语音和书写形式。","语法翻译法的心理学基础是18世纪德国的官能心理学，其创始人是德国哲学家沃尔夫(C. Wolff)。"],"q":"正确","w":"high","e":["2018 真题"]},{"t":"直接法的心理学基础是认知心理学，主张语言是受规则支配的体系。","y":"判断题","p":["直接法的心理学基础是联想主义心理学，认为人的学习方式与动物一样，是刺激与反应直接联结，否认意识在其间的作用。","认为语言是受规则支配的体系而不是习惯体系，是认知法（乔姆斯基转换生成语法）的观点。"],"q":"错误","w":"normal","e":["核心考点"]},{"t":"情景法早期称为口语法，代表人物为英国语言教育家帕默和霍恩比。","y":"判断题","p":["情景法早期称为口语法(Oral Approach)，代表人物为英国著名语言教育家帕默(H. E. Palmer)和霍恩比(A. S. Hornby)。"],"q":"正确","w":"high","e":["2019 真题"]},{"t":"听说法产生于美国，其语言学理论基础是结构主义语言学，心理学理论基础是行为主义心理学。","y":"判断题","p":["听说法的语言学理论基础是主张对活的语言(口语)进行仔细的描写分析、不同语言间进行结构对比的美国结构主义语言学。","其心理学理论基础是把人和动物的行为都纳入到刺激—反应轨道之中的行为主义心理学，特别是斯金纳的操作行为主义。"],"q":"正确","w":"high","e":["2018 真题"]},{"t":"认知法的语言学理论基础是乔姆斯基的转换生成语法理论，心理学基础是认知心理学。","y":"判断题","p":["认知法的语言学理论基础是乔姆斯基的转换生成语法理论。","认知法的心理学基础是认知心理学，强调学习是一个感知、记忆、思维、想像的过程。"],"q":"正确","w":"high","e":["2018 真题"]},{"t":"自觉对比法主张取消母语，绝对排斥翻译对比。","y":"判断题","p":["依靠母语自觉进行翻译对比是自觉对比法最重要的特点，教学全过程都要用母语来讲目的语。","绝对排斥母语是直接法的主张。"],"q":"错误","w":"normal","e":["核心考点"]},{"t":"听说法把“听说领先”作为其基本原则，主张先读写后听说。","y":"判断题","p":["听说法的特点是听说领先，口语是第一位的，书面语是第二位的，读写为辅。","先读写后听说与听说法的主张正好相反。"],"q":"错误","w":"normal","e":["核心考点"]},{"t":"认知法主张教师的讲解不应超过教学活动总时间的五分之一。","y":"判断题","p":["强调在理解、掌握语法规则的基础上，进行大量有意义的练习，提倡演绎法的教学原则。反对机械模仿，同时也反对过多的知识讲解（教师的讲解不应超过教学活动总时间的五分之一）。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"语法翻译法的语言学基础是______，心理学基础是18世纪德国的______。","y":"填空题","p":["语法翻译法的语言学基础是历史比较语言学。","语法翻译法的心理学基础是18世纪德国的官能心理学，其创始人是德国哲学家沃尔夫。"],"q":"历史比较语言学；官能心理学","w":"high","e":["2018 真题"]},{"t":"直接法又称“______”或“自然法”，19世纪末20世纪初产生于西欧，主要是______和德国。","y":"填空题","p":["直接法又称“改革法”或“自然法”，19世纪末20世纪初产生于西欧，主要是法国和德国。"],"q":"改革法；法国","w":"high","e":["2017 真题"]},{"t":"情景法早期称为______，代表人物为英国著名语言教育家______和霍恩比。","y":"填空题","p":["情景法早期称为口语法(Oral Approach)，代表人物为英国著名语言教育家帕默(H. E. Palmer)和霍恩比(A. S. Hornby)。"],"q":"口语法；帕默","w":"high","e":["2019 真题"]},{"t":"听说法又称“______”或“结构法”，其心理学理论基础是______心理学。","y":"填空题","p":["听说法强调通过反复的句型结构操练培养口语听说能力，又称“句型法”或“结构法”。","其心理学理论基础是把人和动物的行为都纳入到刺激—反应轨道之中的行为主义心理学。"],"q":"句型法；行为主义","w":"high","e":["2018 真题"]},{"t":"视听法因首创于法国圣克卢高等师范学院，所以也叫“______”，其理论基础也是结构主义语言学和______心理学。","y":"填空题","p":["视听法是50年代产生于法国的一种第二语言教学法。因它首创于法国圣克卢高等师范学院，所以也叫“圣克卢法”。","视听法的理论基础也是结构主义语言学和行为主义心理学。"],"q":"圣克卢法；行为主义","w":"high","e":["2019 真题"]},{"t":"自觉实践法主张把理论知识及语言规则的讲解压缩到______，而______的时间用于目的语的言语实践活动。","y":"填空题","p":["课堂教学中应严格掌握，把理论知识及语言规则的讲解压缩到15%，而85%的时间则用于目的语的言语实践活动。"],"q":"15%；85%","w":"normal","e":["核心考点"]},{"t":"认知法又称______，60年代产生于美国，代表人物是美国心理学家______。","y":"填空题","p":["认知法又称认知—符号法(Cognitive-Code Approach)，60年代产生于美国，代表人物是美国心理学家卡鲁尔(J. B. Carroll)。"],"q":"认知—符号法；卡鲁尔","w":"high","e":["2018 真题"]},{"t":"系列法产生于19世纪后半期，倡导者为法国语言教育家______。","y":"填空题","p":["系列法(Series Method)产生于19世纪后半期，倡导者为法国语言教育家古安。"],"q":"古安","w":"normal","e":["核心考点"]},{"t":"阅读法的创立者是英国著名语言教育家______，他强调“______是基础”。","y":"填空题","p":["阅读法产生于20世纪初，为英国著名语言教育家韦斯特(M. West)在印度从事英语教学工作时所创立。","与帕默强调“口语是基础”不同，韦斯特强调“阅读是基础”。"],"q":"韦斯特；阅读","w":"normal","e":["核心考点"]},{"t":"第二语言教学法史上第一个完整的教学法体系是（　　）。","y":"单项选择题","p":[],"q":"A","w":"high","e":["2018 真题"]},{"t":"提出“阅读是基础”，认为第二语言教学的首要任务应是培养学生阅读能力的教学法是（　　）。","y":"单项选择题","p":[],"q":"C","w":"normal","e":["核心考点"]},{"t":"下列教学法中，以乔姆斯基的转换生成语法理论为语言学基础的是（　　）。","y":"单项选择题","p":[],"q":"D","w":"high","e":["2018 真题"]},{"t":"强调“听说领先，口语是第一位的，书面语是第二位的，读写为辅”的教学法是（　　）。","y":"单项选择题","p":[],"q":"B","w":"high","e":["2018 真题"]},{"t":"被称为“英国应用语言学之父”、最早提出区分语言学习与习得理论的第二语言教育家是（　　）。","y":"单项选择题","p":[],"q":"D","w":"normal","e":["核心考点"]},{"t":"下列教学法流派中，属于“经验派”的是（　　）。","y":"单项选择题","p":[],"q":"A","w":"high","e":["2021 真题"]},{"t":"下列教学法中，主张“从功能意念到表达形式”的教学路子的是（　　）。","y":"单项选择题","p":[],"q":"D","w":"high","e":["2020 真题"]},{"t":"以联想主义心理学为心理学基础的教学法是（　　）。","y":"单项选择题","p":[],"q":"A","w":"normal","e":["核心考点"]},{"t":"简述语法翻译法的主要特点。","y":"简答题","p":["(1)以理解目的语的书面语言、培养阅读能力和写作能力以及发展智力为主要目标，不重视口语和听力的教学。","(2)以系统的语法知识为教学的主要内容，语法教学采用演绎法。","(3)词汇的选择完全由课文内容所决定，用对译的生词表进行教学；句子是讲授和练习的基本单位。","(4)用母语进行教学，翻译是主要的教学手段、练习手段和评测手段。","(5)强调学习规范的书面语，注重原文，阅读文学名著。"],"q":"语法翻译法的主要特点是：(1)以理解目的语的书面语言、培养阅读能力和写作能力以及发展智力为主要目标，不重视口语和听力的教学；(2)以系统的语法知识为教学的主要内容，语法教学采用演绎法，对语法规则进行详细地分析，要求学生熟记并通过翻译练习加以巩固；(3)词汇的选择完全由课文内容所决定，用对译的生词表进行教学，句子是讲授和","w":"high","e":["2018 真题"]},{"t":"简述直接法的主要特点。","y":"简答题","p":["(1)目的语与它所代表的事物直接联系，教学中排除母语，排除翻译，采用各种直观手段用目的语学习目的语。","(2)不是先学习语法规则，而是靠直接感知，以模仿、操练、记忆为主形成自动的习惯。","(3)以口语教学为基础，先听说后读写。","(4)以句子为教学的基本单位，整句学、整句运用。","(5)以当代通用语言为基本教材，学习生动的、活的语言。"],"q":"直接法的主要特点是：(1)目的语与它所代表的事物直接联系，教学中排除母语，排除翻译，采用各种直观手段用目的语学习目的语，课堂教学常用扮演角色或演戏的方式；(2)不是先学习语法规则，而是靠直接感知，以模仿、操练、记忆为主形成自动的习惯，在一定阶段对已获得的语言材料中的语法规则进行必要的总结和归纳；(3)以口语教学为基础，","w":"high","e":["2020 真题"]},{"t":"简述听说法的主要特点。","y":"简答题","p":["(1)听说领先，口语是第一位的，书面语是第二位的，读写为辅。","(2)反复操练，用模仿、重复、记忆的方法形成习惯。","(3)教学内容以组成语言的基本结构——句型为中心。","(4)排斥或限制使用母语。","(5)对比母语与目的语以及目的语内部的语言结构，找出学习者的难点。","(6)严格、及时地纠正学习者的错误。","(7)利用现代化的教学技术手段。"],"q":"听说法的主要特点是：(1)听说领先，口语是第一位的，书面语是第二位的，读写为辅；(2)反复操练，用模仿、重复、记忆的方法形成习惯；(3)教学内容以组成语言的基本结构——句型为中心，通过句型练习掌握目的语；(4)排斥或限制使用母语，尽量用直观手段或借助于情景、语境，直接用目的语理解或表达；(5)对比母语与目的语以及目的语","w":"high","e":["2018 真题","2019 真题"]},{"t":"简述认知法的主要特点。","y":"简答题","p":["(1)在学习过程中要充分发挥学习者智力的作用。","(2)强调在理解、掌握语法规则的基础上，进行大量有意义的练习，提倡演绎法。","(3)以学生为中心，重视培养学生强烈的学习信心和浓厚的学习兴趣。","(4)听说读写齐头并进。","(5)适当使用学习者的母语。","(6)正确对待学习者的错误，反对有错必纠。"],"q":"认知法的主要特点是：(1)在学习过程中要充分发挥学习者智力的作用，强调通过观察、记忆、思维想像等活动，内化语言的知识体系，反对动物型的刺激—反应的学习；(2)强调在理解、掌握语法规则的基础上，进行大量有意义的练习，提倡演绎法的教学原则，反对机械模仿，同时也反对过多的知识讲解；(3)以学生为中心，重视培养学生强烈的学习信","w":"high","e":["2021 真题"]},{"t":"简述情景法的主要特点。","y":"简答题","p":["(1)教学目的是对听说读写四种言语技能的实际掌握。","(2)语言教学从口语开始，教材先用于口头训练然后再教书面形式。","(3)课堂用语是目的语。","(4)新的语言点要在情景中介绍并操练。","(5)运用词汇选择程序，以确保基本词汇的教学。","(6)按先易后难的原则对语法项目进行分级排列。","(7)在学生具备一定的词汇语法基础后，再进行阅读和写作教学。"],"q":"情景法的主要特点是：(1)教学目的是对听说读写四种言语技能的实际掌握，而言语技能又是通过掌握语言结构而获得的；(2)语言教学从口语开始，教材先用于口头训练然后再教书面形式；(3)课堂用语是目的语；(4)新的语言点要在情景中介绍并操练；(5)运用词汇选择程序，以确保基本词汇的教学；(6)按先易后难的原则对语法项目进行分级","w":"normal","e":["核心考点"]},{"t":"简述视听法的主要特点。","y":"简答题","p":["(1)视觉感知和听觉感知相结合。","(2)语言和情景紧密结合。","(3)整体结构感知。","(4)先口语教学，后书面语教学，听说领先。"],"q":"视听法的主要特点是：(1)视觉感知和听觉感知相结合，利用声光电等现代化技术手段展示语言材料，充分调动大脑两半球的功能；(2)语言和情景紧密结合，从日常生活情景中选择、安排语言材料，并创造接近于真实的情景进行听说读写活动；(3)整体结构感知，通过一组组图像和一段段完整的对话，使语音、语调、词汇、语法在对话中被整体感知，教","w":"normal","e":["核心考点"]},{"t":"简述自觉实践法的主要特点。","y":"简答题","p":["(1)自觉性原则。","(2)实践性原则。","(3)功能、情景、题材相结合的原则。","(4)口语领先原则。","(5)以句法为基础的原则。","(6)综合性原则。","(7)考虑母语的原则。"],"q":"自觉实践法的主要特点是：(1)自觉性原则，强调学习者要自觉掌握语法理论知识并理解语义和句子的实际用法；（2)实践性原则，第二语言习得的决定性因素是大量的言语实践；(3)功能、情景、题材相结合的原则；(4)口语领先原则；(5)以句法为基础的原则；(6)综合性原则；(7)考虑母语的原则。","w":"normal","e":["核心考点"]},{"t":"简述自觉对比法的主要特点。","y":"简答题","p":["(1)依靠母语自觉进行翻译对比是自觉对比法最重要的特点。","(2)重视语言知识的教学，在语言规则的指导下进行实践。","(3)在理解语言形式和意义的基础上再进行模仿、练习。","(4)由分析到综合。","(5)以书面语为基础，以文学语言为基本教材，反对听说领先。"],"q":"自觉对比法的主要特点是：(1)依靠母语自觉进行翻译对比是自觉对比法最重要的特点，教学全过程都要用母语来讲目的语；(2)重视语言知识的教学，在语言规则的指导下进行实践；(3)在理解语言形式和意义的基础上再进行模仿、练习；(4)由分析到综合，先学习构成句子的要素然后再学整句、课文；(5)以书面语为基础，以文学语言为基本教材","w":"normal","e":["核心考点"]},{"t":"试述语法翻译法和直接法的对立与联系，并说明语法翻译法在第二语言教学法史上的地位和影响。","y":"论述题","p":["语法翻译法是以系统的语法知识教学为纲，依靠母语，通过翻译手段，主要培养第二语言读写能力的教学法。","直接法是主张以口语教学为基础，用目的语直接与客观事物相联系而不依赖母语、不用翻译的一种第二语言教学法。","语法翻译法重书面语、重语言知识、重读写、依赖母语、用演绎法、重自觉思维活动；直接法重口语、重言语技能、重听说、排斥母语、用归纳法、重直觉刺激—反应。","语法翻译法是第二语言教学法史上第一个完整的教学法体系，体现了理性派教学法的主要特点。","直接法的出现打破了语法翻译法独霸天下的局面，开经验派教学法的先河。","语法翻译法历史最久，对我国的外语教学及对外汉语教学特别是精读课，也有较大影响。"],"q":"语法翻译法又称“传统法”或“古典法”，是以系统的语法知识教学为纲，依靠母语，通过翻译手段，主要培养第二语言读写能力的教学法；直接法是主张以口语教学为基础，按幼儿习得母语的自然过程，用目的语直接与客观事物相联系而不依赖母语、不用翻译的一种第二语言教学法。两者相互对立：语法翻译法重书面语、重语言知识、重读写、依赖母语、用演","w":"high","e":["2018 真题","2020 真题"]}]},{"id":"yinlun-c07-s02","t":"第二节 人本派与功能派教学法","w":"high","n":30,"k":[{"t":"团体语言学习法","y":"名词解释","p":["团体语言学习法60年代初创立于美国，代表人物为美国心理学家柯伦(C. A. Curran)。","这是一种采用小组集体讨论的形式、教师和学生处于医生和病人的关系并把学习过程看成是咨询过程的第二语言学习方法，也称为咨询法(Counseling Learning)。","团体语言学习法的理论基础是人本主义心理学，强调整体学习观，认为人类学习是完整的人的学习。","团体语言学习法吸取了心理疗法的理论和方法，把教师看做是咨询医生，把学生看做是病人。"],"q":"团体语言学习法60年代初创立于美国，代表人物为美国心理学家柯伦(C. A. Curran)。","w":"normal","e":["核心考点"]},{"t":"默教法","y":"名词解释","p":["默教法是美国教育家加特诺(C. Gattegno)于60年代初首创的一种第二语言教学法，它要求教师在课堂上尽量少说话，尽量鼓励学生多参与言语活动，从而使学生更有效地掌握运用第二语言的能力。","教师的沉默是默教法的最大特点。","默教法的主要理论基础是布鲁纳“发现学习”的教育思想，认为学习应是解决问题式的、创造和发现式的活动。","默教法还从儿童第一语言习得中吸取了不少有益的东西，但同时又认为成人第二语言学习完全不同于儿童母语习得，成功的第二语言学习是受到严格控制的“人为”的方法。"],"q":"默教法是美国教育家加特诺(C. Gattegno)于60年代初首创的一种第二语言教学法，它要求教师在课堂上尽量少说话，尽量鼓励学生多参与言语活动，从而使学生更有效地掌握运用第二语言的能力。","w":"normal","e":["核心考点"]},{"t":"全身反应法","y":"名词解释","p":["全身反应法(简称TPR)于60年代初期产生于美国，盛行于70年代，创始人是美国实验心理学家阿舍尔(James T. Asher)。","这种教学法强调语言学习行为的协调，通过身体动作教授第二语言，主要用于美国移民儿童的英语教育。","全身反应法是以儿童习得第一语言的理论为依据。","其实比阿舍尔早半个世纪，第一次大战时帕默就提出过第二语言听说读写的教学顺序，主张理解能力先于表达能力，还在其著作《通过动作学英语》中竭力提倡在教学的第一阶段让学生做执行教师指令的训练。","逐渐形成了各种以听力领先、从较长期的听力理解训练开始的“领会教学法”(Comprehension Approach)，全身反应法则是其中最具代表性、且影响最大的一种。"],"q":"全身反应法(简称TPR)于60年代初期产生于美国，盛行于70年代，创始人是美国实验心理学家阿舍尔(James T. Asher)。","w":"high","e":["2019 真题"]},{"t":"暗示法","y":"名词解释","p":["暗示法是由保加利亚精神病医学家和心理学家、教育家罗扎诺夫(G. Lozanov)于60年代中期创立的。","这是一种强调通过暗示，开发人的身心两方面的潜力，激发高度的学习动机并创造最佳学习条件，有意识的和无意识的活动相结合，让学习者在放松而又注意力高度集中的心理状态下进行有效学习的教学方法。","暗示法以现代心理学和生理学为其理论基础。","为了把学习者从错误的暗示惯性中解放出来，正确的暗示主要采取两种手段：威信和稚化。","罗扎诺夫还提出教学中充分考虑到心理、生理规律的三个基本原则：学习活动应由整个大脑组织参与；教学中的分析与综合应同时进行；学习者的意识过程和超意识过程应同时地、不可分割地进行。"],"q":"暗示法是由保加利亚精神病医学家和心理学家、教育家罗扎诺夫(G. Lozanov)于60年代中期创立的。","w":"normal","e":["核心考点"]},{"t":"自然法","y":"名词解释","p":["自然法是70年代后期产生于美国的新教学法，其倡导者是美国加州大学西班牙语副教授特雷尔(Tracy Terrell)和美国语言教育家克拉申。","自然法是根据对自然环境中的母语习得和第二语言习得的观察与研究，提出在非自然条件(即课堂教学)中最大限度地扩大对学习者的语言输入、首先集中培养理解能力并强调通过习得掌握第二语言的教学方法。","自然法以语言交际理论和克拉申的有关第二语言习得理论，即“输入”的五个假说为理论基础。","1983年克拉申与特雷尔合作出版了《自然法：课堂中的语言习得》一书，全面阐述了自然法的理论基础和具体实践。"],"q":"自然法是70年代后期产生于美国的新教学法，其倡导者是美国加州大学西班牙语副教授特雷尔(Tracy Terrell)和美国语言教育家克拉申。","w":"high","e":["2018 真题"]},{"t":"交际法","y":"名词解释","p":["交际法又称“交际语言教学”(Communicative Language Teaching)，较早称为“功能法”(Functional Approach)、“意念—功能法”(Notional-Functional Approach)，是以语言功能和意念项目为纲、培养在特定的社会语境中运用语言进行交际能力的一种教学法。","交际法产生于70年代初期西欧共同体国家，中心在英国，创始人为英国语言学家威尔金斯(D. A. Wilkins)。","交际法的语言学理论基础正是60年代兴起、70年代形成高潮的社会语言学，尤其是社会语言学家海姆斯的交际能力理论和功能主义语言学家韩礼德的功能语言理论和话语分析理论，以及威多森的语言交际观。","在心理学方面，交际法受到人本主义心理学和60年代后期兴起的心理语言学的影响，强调以学生为中心。"],"q":"交际法又称“交际语言教学”(Communicative Language Teaching)，较早称为“功能法”(Functional Approach)、“意念—功能法”(Notional-Functional Approach)，是以语言功能和意念项目为纲、培养在特定的社会语境中运用语言进行交际能力的一种教学法。","w":"high","e":["2020 真题"]},{"t":"功能","y":"名词解释","p":["交际法一反其他教学法以语法或句型结构为纲的传统做法，明确提出以功能意念为纲。","功能是用语言做事，完成一定的交际行为。","交际大纲把语言功能分为六类：传达与了解实际情况；表达或了解理智性的态度；表达或了解道义上的态度；表达或了解情感性的态度；请人做事；社交。","以“邮局在哪儿?”这个句子为例，其功能是询问。"],"q":"交际法一反其他教学法以语法或句型结构为纲的传统做法，明确提出以功能意念为纲。","w":"normal","e":["核心考点"]},{"t":"意念","y":"名词解释","p":["意念指功能作用的对象，也就是功能的具体内容，常用来回答“什么”、“谁”的问题。","意念又分为普通意念和特殊意念。","普通意念指与功能相关的时、空、数量等关系，比如表示存在、空间、时间、数量、质量、心理关系、指代等，适用于各种话题和背景，是所有学习者都必须掌握的，与功能称为“共核”。","特殊意念是由话题直接决定的词汇项目，也就是各类词汇，如个人身份、住处、业余爱好、旅行、健康福利等。"],"q":"意念指功能作用的对象，也就是功能的具体内容，常用来回答“什么”、“谁”的问题。","w":"normal","e":["核心考点"]},{"t":"交际法又称功能法或意念—功能法，产生于70年代初的西欧共同体国家，创始人是英国语言学家威尔金斯。","y":"判断题","p":["交际法又称“交际语言教学”，较早称为“功能法”、“意念—功能法”。","交际法产生于70年代初期西欧共同体国家，中心在英国，创始人为英国语言学家威尔金斯(D. A. Wilkins)。"],"q":"正确","w":"high","e":["2020 真题"]},{"t":"自然法的倡导者是美国语言教育家克拉申，其理论基础是克拉申的“输入”五个假说。","y":"判断题","p":["自然法是70年代后期产生于美国的新教学法，其倡导者是美国加州大学西班牙语副教授特雷尔(Tracy Terrell)和美国语言教育家克拉申。","自然法以语言交际理论和克拉申的有关第二语言习得理论，即“输入”的五个假说为理论基础。"],"q":"正确","w":"high","e":["2018 真题"]},{"t":"暗示法主张课堂上教师应多讲解语法规则，对学生的错误有错必纠。","y":"判断题","p":["暗示法通过教师和教学材料的威信以及学习者的稚化，建立高度自信心，鼓励学生大胆运用目的语。","对学习者多表扬、肯定，少纠正错误（错误由教师正面示范，让学习者自己改正），没有强制性的课外作业，更不要给学习者考试的压力。"],"q":"错误","w":"normal","e":["核心考点"]},{"t":"全身反应法的创始人是美国实验心理学家阿舍尔，该法强调通过身体动作教授第二语言。","y":"判断题","p":["全身反应法(简称TPR)于60年代初期产生于美国，盛行于70年代，创始人是美国实验心理学家阿舍尔(James T. Asher)。","这种教学法强调语言学习行为的协调，通过身体动作教授第二语言。"],"q":"正确","w":"high","e":["2019 真题"]},{"t":"交际法又称“______”，较早称为“功能法”、“意念—功能法”，创始人为英国语言学家______。","y":"填空题","p":["交际法又称“交际语言教学”。","交际法产生于70年代初期西欧共同体国家，中心在英国，创始人为英国语言学家威尔金斯(D. A. Wilkins)。"],"q":"交际语言教学；威尔金斯","w":"high","e":["2020 真题"]},{"t":"交际法以______和______项目为纲，培养在特定的社会语境中运用语言进行交际能力。","y":"填空题","p":["交际法……是以语言功能和意念项目为纲、培养在特定的社会语境中运用语言进行交际能力的一种教学法。"],"q":"语言功能；意念","w":"high","e":["2020 真题"]},{"t":"团体语言学习法又称______，代表人物为美国心理学家______。","y":"填空题","p":["这是一种采用小组集体讨论的形式、教师和学生处于医生和病人的关系并把学习过程看成是咨询过程的第二语言学习方法，也称为咨询法(Counseling Learning)。","代表人物为美国心理学家柯伦(C. A. Curran)。"],"q":"咨询法；柯伦","w":"normal","e":["核心考点"]},{"t":"默教法是美国教育家______于60年代初首创的，______是默教法的最大特点。","y":"填空题","p":["默教法是美国教育家加特诺(C. Gattegno)于60年代初首创的一种第二语言教学法。","教师的沉默是默教法的最大特点。"],"q":"加特诺；教师的沉默","w":"normal","e":["核心考点"]},{"t":"全身反应法简称______，创始人是美国实验心理学家______。","y":"填空题","p":["全身反应法(简称TPR)于60年代初期产生于美国，盛行于70年代，创始人是美国实验心理学家阿舍尔(James T. Asher)。"],"q":"TPR；阿舍尔","w":"high","e":["2019 真题"]},{"t":"暗示法是由保加利亚心理学家罗扎诺夫创立的，正确的暗示主要采取两种手段：______和______。","y":"填空题","p":["为了把学习者从错误的暗示惯性中解放出来，正确的暗示主要采取两种手段：威信和稚化。"],"q":"威信；稚化","w":"normal","e":["核心考点"]},{"t":"自然法是70年代后期产生于美国的新教学法，倡导者是美国加州大学西班牙语副教授______和美国语言教育家______。","y":"填空题","p":["自然法是70年代后期产生于美国的新教学法，其倡导者是美国加州大学西班牙语副教授特雷尔(Tracy Terrell)和美国语言教育家克拉申。"],"q":"特雷尔；克拉申","w":"high","e":["2018 真题"]},{"t":"交际大纲把语言功能分为六类，其中“请人做事”包括请求、警告、指令、______等。","y":"填空题","p":["请人做事，如请求、警告、指令、建议等。"],"q":"建议","w":"normal","e":["核心考点"]},{"t":"交际法主张以______为纲，其教学大纲把语言功能分为六类，如“表达或了解情感性的态度”包括高兴、不高兴、喜欢、满意、______、意愿、需要、希望等。","y":"填空题","p":["交际法……明确提出以功能意念为纲。","表达或了解情感性的态度，如高兴、不高兴、喜欢、满意、失望、意愿、需要、希望等。"],"q":"功能意念；失望","w":"normal","e":["核心考点"]},{"t":"交际法的创始人是英国语言学家（　　）。","y":"单项选择题","p":[],"q":"B","w":"high","e":["2020 真题"]},{"t":"主张“教师的沉默是最大特点”的教学法是（　　）。","y":"单项选择题","p":[],"q":"C","w":"normal","e":["核心考点"]},{"t":"以克拉申的第二语言习得理论“输入”的五个假说为理论基础的教学法是（　　）。","y":"单项选择题","p":[],"q":"A","w":"high","e":["2018 真题"]},{"t":"下列教学法中，要求教师“在课堂上尽量少说话，尽量鼓励学生多参与言语活动”的是（　　）。","y":"单项选择题","p":[],"q":"B","w":"normal","e":["核心考点"]},{"t":"交际法教学大纲中，用来回答“什么”、“谁”的问题、指功能的具体内容的是（　　）。","y":"单项选择题","p":[],"q":"B","w":"normal","e":["核心考点"]},{"t":"简述交际法的主要特点。","y":"简答题","p":["(1)明确提出第二语言教学目标是培养创造性地运用语言进行交际的能力。","(2)以功能和意念为纲，选取真实、自然的语言材料。","(3)教学过程交际化，交际既是学习的目的也是学习的手段。","(4)以话语为教学的基本单位。","(5)单项技能训练与综合性技能训练相结合。","(6)按话题螺旋式地安排语言材料。","(7)对学习者的语言错误要有一定的容忍度。","(8)进行“专用语言”的教学。"],"q":"交际法的主要特点是：(1)明确提出第二语言教学目标是培养创造性地运用语言进行交际的能力，不仅要求语言运用的正确性，还要求得体性；(2)以功能和意念为纲，根据学习者的实际需要，选取真实、自然的语言材料；(3)教学过程交际化，交际既是学习的目的也是学习的手段；(4)以言语交际的主要形式——话语为教学的基本单位；(5)单项技","w":"high","e":["2020 真题"]},{"t":"简述团体语言学习法的六个基本要素。","y":"简答题","p":["(1)安全感。","(2)注意力和进取心。","(3)记忆力和思考。","(4)辨别。"],"q":"团体语言学习法强调学习的六个基本要素：(1)安全感，成年人学习外语过程中怕暴露自己的无知，要维护自己的自尊心，只有师生间建立起相互理解的关系，减少学生的紧张和焦虑，形成轻松愉快的气氛；(2)注意力和进取心，在轻松愉快的学习氛围中，学生想学的就容易学会，其主动性和积极性才能得以充分发挥；(3)记忆力和思考，课堂上要有足够","w":"normal","e":["核心考点"]},{"t":"简述全身反应法的主要教学原则。","y":"简答题","p":["(1)教学的总目标是培养学生的口语能力，先进行充分的听力理解训练后才能转入说的训练。","(2)通过全身动作的反应来训练理解能力，用祈使句进行的指令。","(3)在学习者已准备好并有了说目的语的要求时，再让他们开始学习说话。","(4)要减轻学生的心理压力。"],"q":"全身反应法的主要教学原则是：(1)教学的总目标是培养学生的口语能力，但在发展学生的表达能力之前应先培养其对目的语的理解能力，也就是先进行充分的听力理解训练后才能转入说的训练；(2)通过全身动作的反应来训练理解能力，用祈使句进行的指令既是基本的语言交际行为，也是有效的语言训练方法；(3)在学习者已准备好并有了说目的语的要","w":"normal","e":["核心考点"]},{"t":"试分析交际法与听说法的主要区别。","y":"论述题","p":["(1)目标：听说法培养语言能力，强调语言的正确性；功能法培养语言交际能力，强调语言的流利性、可接受性和得体性。","(2)重点：听说法对结构和形式的重视超过意义，句子是基本教学单位；功能法意义和功能压倒一切，话语是基本教学单位。","(3)内容：听说法教学顺序由语言结构的复杂性决定；功能法教学顺序主要由学习者对内容、功能或意义的需要和兴趣决定。","(4)方法：听说法操练是主要的方法，追求“过度学习”；功能法通过交际活动掌握目的语系统。","(5)母语：听说法尽可能避免使用母语；功能法在需要时允许适当用一些母语。","(6)师生：听说法以教师为中心；功能法以学生为中心。"],"q":"交际法与听说法的区别主要体现在以下六个方面：(1)目标。听说法是培养语言能力，强调语言的正确性，追求达到说母语者的发音水平；功能法是培养语言交际能力，更强调语言的流利性、可接受性和得体性，而正确性要由语境来决定。(2)重点。听说法对结构和形式的重视超过意义，句子是基本教学单位；功能法则意义和功能压倒一切，话语是基本教学","w":"high","e":["2020 真题"]}]},{"id":"yinlun-c07-s03","t":"第三节 第二语言教学法的发展趋向","w":"high","n":13,"k":[{"t":"教学法流派","y":"名词解释","p":["教学法流派，指在一定的理论指导下在教学实践中逐渐形成的、包括其理论基础、教学目标、教学原则、教学内容、教学过程、教学形式、教学方法和技巧、教学手段、教师与学生的作用和评估方法等方面的教学法体系。","一种教学法流派的形成除了受当时的时代背景，特别是政治、经济等因素的影响外，更直接地受这一阶段的语言学理论、心理学理论、教育学理论以及一些其他相邻学科发展的影响。","各种不同教学法流派之间的差异，主要是由于对语言本质特征和对语言学习规律有不同认识，因而对教学规律有不同看法。","它影响到教学大纲的制订、教材的编写、课程教学程序和方法的确定，以及测试评估手段的选择等。"],"q":"教学法流派，指在一定的理论指导下在教学实践中逐渐形成的、包括其理论基础、教学目标、教学原则、教学内容、教学过程、教学形式、教学方法和技巧、教学手段、教师与学生的作用和评估方法等方面的教学法体系。","w":"high","e":["2021 真题"]},{"t":"路子、设计、步骤","y":"名词解释","p":["美国教学法家理查德和罗杰斯(Jack C. Richards and Theodore S. Rodgers)提出了一个比较全面的描述和分析第二语言教学法流派的模式。","这一模式分三个层次：①路子(approach)，即该教学法所依据的语言理论和语言学习理论；②设计(design)，由路子所决定的语言教学计划和安排，实质上反映了主要教学原则；③步骤(procedure)，实现教学设计的具体方法技巧和课堂的活动。","分析教学法流派主要应从三方面入手，即教学法的理论基础、所体现的主要教学原则和采取的主要教学方法。","前两节我们已基本上根据这一模式，特别是上述三个主要方面分述了各教学法的特点。"],"q":"美国教学法家理查德和罗杰斯(Jack C. Richards and Theodore S. Rodgers)提出了一个比较全面的描述和分析第二语言教学法流派的模式。","w":"high","e":["2021 真题"]},{"t":"综合法","y":"名词解释","p":["50年来我国对外汉语教学界在辩证唯物主义思想指导下，正是从汉语教学的实际出发，吸取了国外第二语言教学法各流派的优秀成分，摈弃其极端化、片面化的做法，不拘一格走一条综合化的路子。","今天本学科大部分教师和学者仍主张继续进行“综合法”的研究。","具体说来，这种综合法既应重视语言功能的教学和交际能力的培养，又应加强语言结构规则的教学；既强调语法知识的理解和掌握，又重视通过模仿操练形成习惯；既重视课堂上的自觉学习，并以此为主；又重视课堂和课下的自然习得，不排斥其辅助作用。","既强调以学生为中心、充分调动学习者的主动性积极性，又重视教师的主导作用；教材既要用规范、循序渐进、有利于学习的材料，也要逐步增加“真实”教材的比重。"],"q":"50年来我国对外汉语教学界在辩证唯物主义思想指导下，正是从汉语教学的实际出发，吸取了国外第二语言教学法各流派的优秀成分，摈弃其极端化、片面化的做法，不拘一格走一条综合化的路子。","w":"high","e":["2019 真题"]},{"t":"分阶段教学法","y":"名词解释","p":["美国学者黎天睦(T. Light)提出了“分阶段教学法”的主张，即根据不同学习阶段的特点，采用适当的教学法。","由于教学目的、教学对象、教学阶段和教学条件的不同，事实上不可能有适应各种情况的万能教学法。","很多学者主张应该根据不同的情况，选择不同的教学法。","黎天睦提出：初级阶段宜用听说法，中级阶段宜用交际法，高级阶段则用认知法或语法翻译法；同一阶段也可以几种教学法交叉使用。"],"q":"美国学者黎天睦(T. Light)提出了“分阶段教学法”的主张，即根据不同学习阶段的特点，采用适当的教学法。","w":"normal","e":["核心考点"]},{"t":"理查德和罗杰斯提出的分析第二语言教学法流派的三层次模式是：路子—设计—步骤。","y":"判断题","p":["这一模式分三个层次：①路子(approach)，即该教学法所依据的语言理论和语言学习理论；②设计(design)，由路子所决定的语言教学计划和安排；③步骤(procedure)，实现教学设计的具体方法技巧和课堂的活动。"],"q":"正确","w":"high","e":["2021 真题"]},{"t":"新旧教学法之间是互相取代的关系，新教学法的兴起必然导致旧教学法的消亡。","y":"判断题","p":["新旧教学法没有互相取代，而是长期共存。","不同教学法的侧重点不同，各有所长，都拥有相对真理，从不同的方面为第二语言教学理论的发展做出了贡献，也都能满足特定的社会需要和教学需要。因而新教学法的兴起并未导致旧教学法的消亡，连最古老的语法翻译法今天也仍然为人们所采用。"],"q":"错误","w":"normal","e":["核心考点"]},{"t":"美国教学法家理查德和罗杰斯提出的描述和分析第二语言教学法流派的模式分为三个层次：______、______、步骤。","y":"填空题","p":["这一模式分三个层次：①路子(approach)；②设计(design)；③步骤(procedure)。"],"q":"路子；设计","w":"high","e":["2021 真题"]},{"t":"美国学者______提出了“分阶段教学法”的主张，即初级阶段宜用______，中级阶段宜用交际法，高级阶段则用认知法或语法翻译法。","y":"填空题","p":["美国学者黎天睦(T. Light)提出了“分阶段教学法”的主张。","初级阶段宜用听说法，中级阶段宜用交际法，高级阶段则用认知法或语法翻译法。"],"q":"黎天睦；听说法","w":"normal","e":["核心考点"]},{"t":"美国学者黎天睦提出“分阶段教学法”，认为中级阶段宜采用的教学法是（　　）。","y":"单项选择题","p":[],"q":"C","w":"normal","e":["核心考点"]},{"t":"20世纪70年代以来，第二语言教学理论研究的重点转向（　　）。","y":"单项选择题","p":[],"q":"B","w":"high","e":["2021 真题"]},{"t":"简述20世纪60年代以来第二语言教学法发展的主要趋向。","y":"简答题","p":["(1)不同教学法流派在保持自己特色的同时，出现了综合化的趋向。","(2)在探讨习得规律的基础上研究教学规律，第二语言习得研究为教学法的发展提供了更科学的基础。","(3)培养运用目的语进行交际的能力正成为第二语言教学目的的共识。","(4)以学生为中心，重视教学中的情感因素和人际关系是重要的教学原则。","(5)加强教学手段现代化，迎接信息社会和网络时代的挑战。"],"q":"20世纪60年代以来第二语言教学法的发展出现了一些新趋向：(1)不同教学法流派在保持自己特色的同时，出现了综合化的趋向，教学法研究的重点转向指导教学的基本原则；(2)在探讨习得规律的基础上研究教学规律，第二语言习得研究为教学法的发展提供了更科学的基础；(3)培养运用目的语进行交际的能力正成为第二语言教学目的的共识；(4","w":"high","e":["2021 真题"]},{"t":"试论如何正确认识和对待各种第二语言教学法流派。","y":"论述题","p":["(1)首先应该看到各种教学法的产生有其必然性和合理性。","(2)各种教学法之间存在着对立、排斥的关系，同时又有继承和发展的关系。","(3)各种教学法都有长处，也都有短处。","(4)新旧教学法没有互相取代，而是长期共存。"],"q":"正确认识和对待各种第二语言教学法流派，应做到：(1)首先应该看到各种教学法的产生有其必然性和合理性。每种教学法的出现都不是偶然的，都是一定历史条件的产物，都是为了适应社会对语言教学的某种需求，各有其产生的原因和所负的使命，而且受到一定的语言学、心理学、教育学理论的影响。(2)各种教学法之间存在着对立、排斥的关系，同时又","w":"normal","e":["核心考点"]},{"t":"病例：某高校对外汉语教师张老师长期采用一种教学方法：课堂上以教师讲解语法规则为主，先讲词法再讲句法，用演绎法对语法规则进行详细分析，要求学生熟记并通过翻译练习加以巩固；教学主要用学生的母语进行，以翻译为主要的教学手段和评测手段；教学重点是原著和文学名著的阅读。一个学期下来，学生们阅读和翻译能力提高很快，但课堂上从不张嘴说汉语，到中国餐馆点菜、问路时仍无法用汉语与中国人沟通。请分析：张老师采用的是哪种教学法？结合其理论基础，分析该教学法的优点和不足，并给出改进建议。","y":"案例分析题","p":["张老师采用的是语法翻译法。","语法翻译法是以系统的语法知识教学为纲，依靠母语，通过翻译手段，主要培养第二语言读写能力的教学法；语言学基础是历史比较语言学，心理学基础是官能心理学。","优点是第一个完整的教学法体系，能较好培养阅读和翻译能力，注重智力发展。","不足是忽视口语教学和语音教学，缺乏听说能力训练，过分依赖母语和翻译，不利于语言交际能力的培养。","改进建议：加强听说训练，引入情景法、听说法、交际法等方法，以培养汉语交际能力为目标，走综合化路子。"],"q":"张老师采用的是语法翻译法。语法翻译法又称“传统法”或“古典法”，是以系统的语法知识教学为纲，依靠母语，通过翻译手段，主要培养第二语言读写能力的教学法；其语言学基础是历史比较语言学，心理学基础是18世纪德国的官能心理学。优点：语法翻译法是第二语言教学法史上第一个完整的教学法体系，它强调对语法规则的掌握，注重学生智力的发展","w":"high","e":["2020 真题"]}]}]},{"id":"yinlun-c08","t":"第八章 对外汉语教学理论与应用(上)","w":"high","s":[{"id":"yinlun-c08-s01","t":"第一节 对外汉语教学目的与课程设计","w":"high","n":21,"k":[{"t":"对外汉语教学目的","y":"名词解释","p":["对外汉语教学的教学目的应归纳为：掌握汉语基础知识和听说读写基本技能，培养运用汉语进行交际的能力；增强学习汉语的兴趣和动力，发展智力，培养汉语的自学能力；掌握汉语的文化因素，熟悉基本的中国国情和文化背景知识，提高文化素养。","不同的学习阶段、不同学习期限在要求上应有所区别，但都应从这三方面来考虑教学目的。","掌握汉语基础知识和听说读写基本技能，培养运用汉语进行交际的能力，这是最直接、最根本的教学目的，体现了语言教学的根本任务。","语言交际能力包括语法(语言)能力、社会语言能力、话语能力和策略能力，因此要培养语言交际能力必须掌握汉语的基础知识和听说读写基本技能，以及语用规则和相关的文化知识。"],"q":"对外汉语教学的教学目的应归纳为：掌握汉语基础知识和听说读写基本技能，培养运用汉语进行交际的能力；增强学习汉语的兴趣和动力，发展智力，培养汉语的自学能力；掌握汉语的文化因素，熟悉基本的中国国情和文化背景知识，提高文化素养。","w":"high","e":["2020 真题","2021 真题"]},{"t":"总体设计","y":"名词解释","p":["总体设计是吕必松在80年代初根据对外汉语教学事业创立时期教学活动处于经验型的探索阶段、缺乏科学性和规范性的实际情况提出的理论。","他把对外汉语教学看做是一项系统工程，认为总体设计是“根据语言规律、语言学习规律和语言教学规律，在全面分析第二语言教学的各种主客观条件、综合考虑各种可能的教学措施的基础上选择最佳方案，对教学对象、教学目标、教学内容、教学途径、教学原则以及教师的分工和对教师的要求等做出明确的规定，以便指导教材编写(或选择)、课堂教学和成绩测试，使各个教学环节成为一个互相衔接的、统一的整体，使全体教学人员根据不同的分工在教学上进行协调行动”。","他并把总体设计以及根据总体设计而进行的教材编写、课堂教学和语言测试看做是对外汉语教学活动的四大环节。"],"q":"总体设计是吕必松在80年代初根据对外汉语教学事业创立时期教学活动处于经验型的探索阶段、缺乏科学性和规范性的实际情况提出的理论。","w":"high","e":["2019 真题"]},{"t":"教学计划","y":"名词解释","p":["教学计划是根据教育目的和培养目标所制定的全面指导某专业教与学活动的规范性文件。","教学计划是以课程设计为核心的总体设计的具体体现，主要包括专业培养目标、学习年限、课程设置及其主要教学方式和学时分配。","其中，课程体系是主要内容，教学计划也可以看做是课程设置的总体规划，决定该专业课程的结构与方向。","教学计划常由国家教育行政部门组织制订，对有关专业的教学工作和教学活动提出统一的要求，因此教学计划是编制教学大纲和编写教材的主要依据，也是进行教学活动、评估教学工作的主要依据。"],"q":"教学计划是根据教育目的和培养目标所制定的全面指导某专业教与学活动的规范性文件。","w":"high","e":["2021 真题"]},{"t":"教学大纲","y":"名词解释","p":["教学大纲是根据教学计划、以纲要形式制定的、对具体课程的教学目的、教学内容、教学进度和教学方法进行规范的指导性文件。","教学大纲通常分说明、本文和附录三部分。","说明部分阐明本课程的教学对象、教学目的要求、教学方式、本课程在专业中的地位和作用等；本文部分按课、章、节详细规定教学内容及其定量分级、主要教学环节；附录部分是各种教学参考资料和附表(如语言学科的词汇表、汉字表、功能项目表等)。","根据语言教学的特点，有的教学大纲按语言要素分别制订，就有关方面的教学内容做出规范，如语法大纲、句型大纲、词汇大纲、情景大纲、功能大纲、意念大纲等。"],"q":"教学大纲是根据教学计划、以纲要形式制定的、对具体课程的教学目的、教学内容、教学进度和教学方法进行规范的指导性文件。","w":"high","e":["2021 真题"]},{"t":"课程设计","y":"名词解释","p":["课程设计，简单说来就是制定课程。","课程设计是在教育目的和具体教学目的的指导下，从学习者的特点和需要出发，根据专业对知识结构和能力结构的要求，最优化地选择教学内容、组织教学进程，形成合理的、相互配合的课程体系。","课程设计不能只考虑教学内容一个方面，它涉及到对教学需求和教学条件的分析、课程与大纲设计理论的选择、教学目标、教学内容、教学进度、教学方法、教学评估和教学管理等多方面问题的确定，直到课程计划和教学大纲的制订。"],"q":"课程设计，简单说来就是制定课程。","w":"normal","e":["核心考点"]},{"t":"教学内容","y":"名词解释","p":["第二语言教学是为了培养语言交际能力，这一教学目的决定了教学内容。","从语言能力和语言交际能力的构成因素出发，吕必松曾提出语言教学的教学内容应包括“语言要素、语用规则、言语技能、言语交际技能和相关文化知识”。","这样，对外汉语教学内容可以概括为四个方面：(1)语言要素(汉语语音、词汇、语法、汉字)；(2)言语技能(汉语听、说、读、写)；(3)言语交际技能(汉语语用规则、话语规则、交际策略)；(4)相关文化知识(汉语的文化因素、中国基本国情和文化背景知识)。","语言要素、言语技能、言语交际技能和相关文化知识就构成了语言交际能力的基础。"],"q":"第二语言教学是为了培养语言交际能力，这一教学目的决定了教学内容。","w":"high","e":["2020 真题"]},{"t":"吕必松在80年代初提出了总体设计的理论，把对外汉语教学看做是一项系统工程，并把总体设计以及教材编写、课堂教学和语言测试看做是对外汉语教学活动的四大环节。","y":"判断题","p":["80年代初，吕必松根据对外汉语教学事业创立时期教学活动处于经验型的探索阶段、缺乏科学性和规范性的实际情况，提出了总体设计的理论。他把对外汉语教学看做是一项系统工程。","他把总体设计以及根据总体设计而进行的教材编写、课堂教学和语言测试看做是对外汉语教学活动的四大环节。"],"q":"正确","w":"high","e":["2019 真题"]},{"t":"教学目的是总体设计中的首要问题，教学目的一经确定，将决定教学内容、课程设置、教学原则、教学过程、教学方法直到测试评估等一系列问题。","y":"判断题","p":["教学目的是总体设计中的首要问题。教学目的一经确定，将决定教学内容、课程设置、教学原则、教学过程、教学方法直到测试评估等一系列问题。"],"q":"正确","w":"high","e":["2021 真题"]},{"t":"根据语言教学的特点，教学大纲通常分说明、本文和附录三部分。","y":"判断题","p":["教学大纲通常分说明、本文和附录三部分。","说明部分阐明本课程的教学对象、教学目的要求、教学方式、本课程在专业中的地位和作用等；本文部分按课、章、节详细规定教学内容及其定量分级、主要教学环节；附录部分是各种教学参考资料和附表。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"对外汉语教学目的可归纳为：掌握汉语基础知识和______基本技能，培养运用汉语进行交际的能力；增强学习汉语的兴趣和动力，发展智力，培养汉语的______能力；掌握汉语的文化因素，熟悉基本的中国国情和文化背景知识，提高文化素养。","y":"填空题","p":["掌握汉语基础知识和听说读写基本技能，培养运用汉语进行交际的能力；增强学习汉语的兴趣和动力，发展智力，培养汉语的自学能力；掌握汉语的文化因素，熟悉基本的中国国情和文化背景知识，提高文化素养。"],"q":"听说读写；自学","w":"high","e":["2020 真题"]},{"t":"吕必松把总体设计以及根据总体设计而进行的______、______和语言测试看做是对外汉语教学活动的四大环节。","y":"填空题","p":["他并把总体设计以及根据总体设计而进行的教材编写、课堂教学和语言测试看做是对外汉语教学活动的四大环节。"],"q":"教材编写；课堂教学","w":"high","e":["2019 真题"]},{"t":"以课程设置为主要内容而制定的全面指导某一专业教与学活动的规范性文件，称为______；对具体课程所制订的指导性文件，称为______。","y":"填空题","p":["以课程设置为主要内容而制定的全面指导某一专业教与学活动的规范性文件，称为教学计划。对具体课程所制订的指导性文件，称为教学大纲。"],"q":"教学计划；教学大纲","w":"normal","e":["核心考点"]},{"t":"对外汉语教学基础阶段的主要课程，大体上分为三类：______课、汉语言知识课和______课。","y":"填空题","p":["对外汉语教学基础阶段的主要课程，大体上分为三类：(1)汉语技能课，又分为综合技能课(原称为精读课)和专项技能课(即听、说、读、写技能课)。(2)汉语言知识课，即语音、词汇、语法、汉字知识课。(3)中国文化知识课，包括中国基本国情、中国文化知识。"],"q":"汉语技能；中国文化知识","w":"normal","e":["核心考点"]},{"t":"对外汉语教学内容可以概括为四个方面：语言要素、______、言语交际技能和______。","y":"填空题","p":["从语言能力和语言交际能力的构成因素出发，吕必松曾提出语言教学的教学内容应包括“语言要素、语用规则、言语技能、言语交际技能和相关文化知识”。"],"q":"言语技能；相关文化知识","w":"high","e":["2020 真题"]},{"t":"80年代以前，对外汉语教学主要是进行非学历教育的预备教育和短期教育。______年该校率先试办外国留学生汉语本科专业，更加紧了对课程设置的研究与试验。","y":"填空题","p":["特别是1975年该校率先试办外国留学生汉语本科专业(当时叫现代汉语专业)，更加紧了对课程设置的研究与试验。"],"q":"1975","w":"normal","e":["核心考点"]},{"t":"提出总体设计理论、把对外汉语教学活动的四大环节概括为总体设计、教材编写、课堂教学和语言测试的学者是（　　）。","y":"单项选择题","p":[],"q":"B","w":"high","e":["2019 真题"]},{"t":"教学目的、课程设置、教学原则和教材编写的首要问题是（　　）。","y":"单项选择题","p":[],"q":"A","w":"high","e":["2021 真题"]},{"t":"从语言能力和语言交际能力的构成因素出发，提出语言教学教学内容应包括“语言要素、语用规则、言语技能、言语交际技能和相关文化知识”的学者是（　　）。","y":"单项选择题","p":[],"q":"B","w":"normal","e":["核心考点"]},{"t":"简述对外汉语教学的教学目的。","y":"简答题","p":["(1)掌握汉语基础知识和听说读写基本技能，培养运用汉语进行交际的能力。","(2)增强学习汉语的兴趣和动力，发展智力，培养汉语的自学能力。","(3)掌握汉语的文化因素，熟悉基本的中国国情和文化背景知识，提高文化素养。"],"q":"对外汉语教学的教学目的应归纳为：(1)掌握汉语基础知识和听说读写基本技能，培养运用汉语进行交际的能力；(2)增强学习汉语的兴趣和动力，发展智力，培养汉语的自学能力；(3)掌握汉语的文化因素，熟悉基本的中国国情和文化背景知识，提高文化素养。不同的学习阶段、不同学习期限在要求上应有所区别，但都应从这三方面来考虑教学目的。其","w":"high","e":["2020 真题","2021 真题"]},{"t":"简述对外汉语教学内容可以概括的四个方面。","y":"简答题","p":["(1)语言要素。","(2)言语技能。","(3)言语交际技能。","(4)相关文化知识。"],"q":"对外汉语教学内容可以概括为四个方面：(1)语言要素(汉语语音、词汇、语法、汉字)；(2)言语技能(汉语听、说、读、写)；(3)言语交际技能(汉语语用规则、话语规则、交际策略)；(4)相关文化知识(汉语的文化因素、中国基本国情和文化背景知识)。语言要素、言语技能、言语交际技能和相关文化知识就构成了语言交际能力的基础。","w":"high","e":["2020 真题"]},{"t":"简述对外汉语教学基础阶段的主要课程类型。","y":"简答题","p":["(1)汉语技能课。","(2)汉语言知识课。","(3)中国文化知识课。"],"q":"对外汉语教学基础阶段的主要课程，大体上分为三类：(1)汉语技能课，又分为综合技能课(原称为精读课)和专项技能课(即听、说、读、写技能课)；(2)汉语言知识课，即语音、词汇、语法、汉字知识课；(3)中国文化知识课，包括中国基本国情、中国文化知识。作为学历教育的专业课程设置，上述各类课程的安排比较全面、合理，对非学历教育的","w":"normal","e":["核心考点"]}]},{"id":"yinlun-c08-s02","t":"第二节 对外汉语教学的基本教学原则","w":"high","n":23,"k":[{"t":"教学原则","y":"名词解释","p":["第二语言教学原则是人们从一定的教育和教学目的出发，在第二语言教学实践基础上、根据对语言规律、语言学习规律和语言教学规律的认识而制订的指导整个教学过程和全部教学活动的原则。","科学的教学原则反映了人们对语言教学客观规律全面、正确的认识，成为教学活动必须遵循的基本要求，用来处理教学活动中各种矛盾和关系。","因此，教学原则是教学法体系的灵魂。上一章所介绍的各种教学法流派，其差别和争论也主要体现在教学原则上。","对外汉语教学原则不是凭空确定的，而是理论与实践相结合的产物。"],"q":"第二语言教学原则是人们从一定的教育和教学目的出发，在第二语言教学实践基础上、根据对语言规律、语言学习规律和语言教学规律的认识而制订的指导整个教学过程和全部教学活动的原则。","w":"high","e":["2020 真题"]},{"t":"结构、功能、文化相结合原则","y":"名词解释","p":["这是近年来我国学者根据从事对外汉语教学的经验，总结、研究得出的一条教学原则。","“结构”是指语言的结构，包括语法结构和语义结构；“功能”指用语言做事，即语言在一定的情景中所能完成的交际任务；“文化”也是指语言教学范围里的文化，主要是在跨文化交际中由于文化差异而影响到交际的语言文化因素以及目的语国家的基本国情和文化背景知识。","结构与功能这对矛盾既是对立的，又是相互依存的。结构是用来表达功能的，功能离开了结构也就无法实现，在语言交际中两者是紧密结合在一起的。","结构、功能、文化“三结合”的意思是：(1)结构是基础；(2)功能是目的；(3)文化教学要为语言教学服务。"],"q":"这是近年来我国学者根据从事对外汉语教学的经验，总结、研究得出的一条教学原则。","w":"high","e":["2020 真题","2021 真题"]},{"t":"精讲多练","y":"名词解释","p":["“精讲多练”是60年代初北京语言学院教师总结出的一条对外汉语课堂教学原则。","“精讲”是对教师的知识讲授而言，适当的理论知识和语言规则的介绍，对成人学习第二语言是必不可少的；练习也必须是在理论和知识指导下进行。","知识不能不讲但要讲得少而精；讲解的方法，我们提倡归纳法，但也不排除演绎法。","“多练”是指学生在课上、课下要进行大量的练习，培养语言运用的熟巧度。练习方法，我们提倡综合性、交际性的练习，但也需要单项练习。","“精讲多练”体现了我们长期以来主张的“实践性”原则。"],"q":"“精讲多练”是60年代初北京语言学院教师总结出的一条对外汉语课堂教学原则。","w":"high","e":["2019 真题"]},{"t":"以学生为中心、教师为主导原则","y":"名词解释","p":["这条原则是针对教与学的关系而提出的，是一条根本的原则。","强调学生是学习活动的主体，“教”只有通过“学”才能起到作用；“教”必须为“学”服务。","这条原则主要体现在：(1)从学生的特点和需要出发，制订课程计划、教学大纲并确定教学内容、教材和教学方法；(2)研究学生的个体差异，因材施教；(3)课堂要营造轻松愉快的气氛，加强趣味性；(4)让学生参与设计教学活动；(5)对待学生的偏误应采取严格纠正的态度，但纠错要根据其性质和发生的场合区别对待。"],"q":"这条原则是针对教与学的关系而提出的，是一条根本的原则。","w":"high","e":["2019 真题","2021 真题"]},{"t":"强化汉语学习环境原则","y":"名词解释","p":["强化汉语学习环境，加大汉语输入，自觉学习与自然习得相结合，是对外汉语教学的基本教学原则之一。","语言交际能力不是仅仅靠课堂教学就能培养成的。语言环境的有无与好坏，学习者对目的语的接触面及目的语的输入量的多与少，都会直接影响到语言学习的效果。","尽管对克拉申学习与习得的区分有不同的看法，但这一假说以及自然法、暗示法等教学法的经验，对我们还是有很大启示。","在正规、自觉的课堂学习为主的情况下，自觉学习和自然习得相结合，以利于培养交际能力。"],"q":"强化汉语学习环境，加大汉语输入，自觉学习与自然习得相结合，是对外汉语教学的基本教学原则之一。","w":"normal","e":["核心考点"]},{"t":"教学原则是教学法体系的灵魂，上一章所介绍的各种教学法流派的差别和争论也主要体现在教学原则上。","y":"判断题","p":["因此，教学原则是教学法体系的灵魂。上一章所介绍的各种教学法流派，其差别和争论也主要体现在教学原则上。"],"q":"正确","w":"high","e":["2020 真题"]},{"t":"在结构、功能、文化三结合原则中，结构是基础，功能是目的，文化教学要为语言教学服务。","y":"判断题","p":["结构、功能、文化“三结合”的意思是：(1)结构是基础；(2)功能是目的；(3)文化教学要为语言教学服务。"],"q":"正确","w":"high","e":["2020 真题"]},{"t":"“精讲多练”是60年代初北京语言学院教师总结出的一条对外汉语课堂教学原则，“精讲多练”体现了实践性原则。","y":"判断题","p":["“精讲多练”是60年代初北京语言学院教师总结出的一条对外汉语课堂教学原则。","“精讲多练”体现了我们长期以来主张的“实践性”原则。"],"q":"正确","w":"high","e":["2019 真题"]},{"t":"对外汉语教学应完全排除母语或媒介语，课堂上绝不能使用母语。","y":"判断题","p":["利用母语或媒介语，主要指在教材编写和教师备课中进行语言对比分析，以确定教学重点；同时也是指在十分必要的情况下，教师在课堂上可以少量地用母语或媒介语进行难点讲解。","但课堂上教师对母语或媒介语的使用必须很好地控制，能不用就不用。"],"q":"错误","w":"normal","e":["核心考点"]},{"t":"在语体上，初级阶段既不宜过于口语化，也不宜过于书面语化，要注意学习口语和书面语都能用到的“中性”语体。","y":"判断题","p":["在语体上，初级阶段既不宜过于口语化(不利于掌握基本结构)，也不宜过于书面语化(难于掌握，也缺少现实的交际价值)，要注意学习口语和书面语都能用到的“中性”语体。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"对外汉语教材都是利用拼音方案，使用简化字，教普通话。","y":"判断题","p":["我国规范、通用的汉语是普通话，规范、通用的标注音素读音的符号是《汉语拼音方案》，规范、通用的汉字是我国正式公布的简化字。","对外汉语教材都是利用拼音方案，使用简化字，教普通话。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"对外汉语教学的基本教学原则之一是：以______为中心，______为主导，重视情感因素，充分发挥学生主动性、创造性。","y":"填空题","p":["以学生为中心、教师为主导，重视情感因素，充分发挥学生主动性、创造性原则。"],"q":"学生；教师","w":"high","e":["2019 真题"]},{"t":"“结构、功能、文化”三结合原则中，结构是______，功能是______，文化教学要为语言教学服务。","y":"填空题","p":["(1)结构是基础。……(2)功能是目的。……(3)文化教学要为语言教学服务。"],"q":"基础；目的","w":"high","e":["2020 真题"]},{"t":"“精讲多练”是60年代初______教师总结出的一条对外汉语课堂教学原则。“精讲”是对教师的______而言。","y":"填空题","p":["“精讲多练”是60年代初北京语言学院教师总结出的一条对外汉语课堂教学原则。","“精讲”是对教师的知识讲授而言，适当的理论知识和语言规则的介绍，对成人学习第二语言是必不可少的。"],"q":"北京语言学院；知识讲授","w":"normal","e":["核心考点"]},{"t":"听、说、读、写全面要求，分阶段侧重，口语、书面语协调发展原则中，______阶段听说读写并重。","y":"填空题","p":["中级阶段听说读写并重。高级阶段侧重读写，但听说训练仍要紧抓不放。"],"q":"中级","w":"normal","e":["核心考点"]},{"t":"“结构、功能、文化”三结合原则中，处于基础地位的是（　　）。","y":"单项选择题","p":[],"q":"A","w":"high","e":["2020 真题"]},{"t":"“精讲多练”这条教学原则是哪个年代由北京语言学院教师总结出来的？（　　）","y":"单项选择题","p":[],"q":"A","w":"normal","e":["核心考点"]},{"t":"“认识到的教学原则不应把它固定化、模式化，要容许以不同方式来运用这些教学原则”，这体现了确立对外汉语教学原则的哪一指导思想？（　　）","y":"单项选择题","p":[],"q":"C","w":"normal","e":["核心考点"]},{"t":"对外汉语教学原则中，“以学生为中心、教师为主导”这条原则是针对什么关系提出的？（　　）","y":"单项选择题","p":[],"q":"A","w":"normal","e":["核心考点"]},{"t":"简述对外汉语教学的基本教学原则。","y":"简答题","p":["(1)掌握汉语的基础知识和基本技能，培养运用汉语进行交际的能力原则。","(2)以学生为中心、教师为主导，重视情感因素，充分发挥学生主动性、创造性原则。","(3)结构、功能、文化相结合原则。","(4)强化汉语学习环境，加大汉语输入，自觉学习与自然习得相结合原则。","(5)精讲多练，在语言知识的指导下以言语技能和言语交际技能的训练为中心原则。","(6)以句子和话语为重点，语音、语法、词汇、汉字综合教学原则。","(7)听、说、读、写全面要求，分阶段侧重，口语、书面语协调发展原则。","(8)利用母语进行与汉语的对比分析，课堂教学严格控制使用母语或媒介语原则。","(9)循序渐进，螺旋式提高，加强重现原则。","(10)加强直观性，充分利用现代化教学技术手段原则。"],"q":"对外汉语教学的基本教学原则主要有：(1)掌握汉语的基础知识和基本技能，培养运用汉语进行交际的能力原则；(2)以学生为中心、教师为主导，重视情感因素，充分发挥学生主动性、创造性原则；(3)结构、功能、文化相结合原则；(4)强化汉语学习环境，加大汉语输入，自觉学习与自然习得相结合原则；(5)精讲多练，在语言知识的指导下以言","w":"high","e":["2020 真题","2021 真题"]},{"t":"简述确立对外汉语教学原则的指导思想。","y":"简答题","p":["(1)从相邻学科中汲取理论营养。","(2)要研究第二语言教学的共同规律，更要研究汉语教学的特殊规律。","(3)从学习者的实际出发，根据不同的教学目的灵活运用教学原则。"],"q":"探讨对外汉语教学原则，应该考虑到以下几个方面：(1)从相邻学科中汲取理论营养。语言学理论为最直接的理论依据，对语言特征的看法直接决定教学原则；心理学理论和语言学习理论所提出的第二语言学习中学习者的心理活动规律、个体因素的作用以及学习过程等，涉及到教与学的关系原则；最直接的影响还是来自教育学所提出的普遍教学原则；跨文化交","w":"normal","e":["核心考点"]},{"t":"试述“结构、功能、文化相结合”原则的内涵及其在教学中的具体体现。","y":"论述题","p":["“结构”是指语言的结构，包括语法结构和语义结构；“功能”指用语言做事；“文化”指语言教学范围里的文化。","结构与功能既是对立的，又是相互依存的，结构是用来表达功能的。","(1)结构是基础。","(2)功能是目的。","(3)文化教学要为语言教学服务。","结构、功能、文化的结合应贯串语言教学的始终：初级阶段以结构为主，中级阶段要加强功能并巩固、扩展结构，高级阶段文化教学分量应逐渐加大。"],"q":"“结构、功能、文化相结合”是近年来我国学者根据从事对外汉语教学的经验，总结、研究得出的一条教学原则。“结构”是指语言的结构，包括语法结构和语义结构。“功能”指用语言做事，即语言在一定的情景中所能完成的交际任务。这里所说的“文化”指语言教学范围里的文化，主要是在跨文化交际中由于文化差异而影响到交际的语言文化因素以及目的语","w":"high","e":["2020 真题"]},{"t":"病例：某高校对外汉语初级班王老师在教学《汉语教程》第一册时，为了尽快提高学生的交际能力，课堂上几乎全部采用真实材料教学，把街上的店名、标志、火车时刻表、菜单等作为教材的主体，很少进行语音、词汇、语法的系统教学，也很少组织句型操练。一个学期下来，学生的学习兴趣有所提高，但语音语调问题较多，掌握的语言结构零散、不成体系，学生反映“学了很多，但说不成句”。请结合对外汉语教学的基本原则，分析王老师教学中的问题，并给出改进建议。","y":"案例分析题","p":["王老师违反了“掌握汉语的基础知识和基本技能，培养运用汉语进行交际的能力原则”，把真实材料作为教材主体是极端做法，不利于初学者对语言的掌握。","违反了“精讲多练，在语言知识的指导下以言语技能和言语交际技能的训练为中心原则”，很少进行系统教学和句型操练。","违反了“结构、功能、文化相结合原则”，初级阶段忽视结构教学会给汉语学习带来极其不利的影响。","改进建议：初级阶段以结构为基础，系统进行语音、词汇、语法教学并组织必要的句型操练，逐步加强功能和交际性训练。"],"q":"王老师教学中的问题主要违反了对外汉语教学的基本原则：(1)违反了“掌握汉语的基础知识和基本技能，培养运用汉语进行交际的能力原则”。原则指出：能力的培养离不开知识的掌握和技能的训练，语言知识的学习、语言规则的内化是形成语言交际能力必不可少的条件；要重视基础知识的教学。且培养交际能力需要运用真实语言材料，即使在初级阶段也应","w":"high","e":["2020 真题"]}]},{"id":"yinlun-c08-s03","t":"第三节 对外汉语教材的编写与选用","w":"high","n":33,"k":[{"t":"教材","y":"名词解释","p":["教材是教师教学和学生学习所依据的材料，与教学计划和教学大纲构成学校教学内容的有机组成部分。","在教学活动的四大环节中，教材占有很重要的地位。它是总体设计的具体体现，反映了培养目标、教学要求、教学内容、教学原则；同时教材又是课堂教学和测试的依据。","狭义的教材指教科书，广义的教材除了教科书外还包括教学参考书、讲义、讲授提纲、图表、各种教学音像资料等。","教材体现了语言教学最根本的两个方面：教什么和如何教。教材水平的高低不仅能反映教学理论和教学法研究的深度，而且在很大程度上决定教与学的效果。"],"q":"教材是教师教学和学生学习所依据的材料，与教学计划和教学大纲构成学校教学内容的有机组成部分。","w":"high","e":["2021 真题"]},{"t":"针对性","y":"名词解释","p":["针对性是教材编写和选用的原则之一。","教材要适合使用对象的特点。最基本的特点是，不同母语、母语文化背景与目的语、目的语文化对比所确定的教学重点不同。","针对性包括：(1)学习者的年龄、国别、文化程度特点；(2)学习者学习目的的不同；(3)学习者学习的起点不同，根据学习者原有的目的语水平分为初、中、高三级教材；(4)学习时限的不同。"],"q":"针对性是教材编写和选用的原则之一。","w":"normal","e":["核心考点"]},{"t":"实用性","y":"名词解释","p":["实用性是教材编写和选用的原则之一。","第二语言教材不同于语言学教材，主要用于培养语言技能和能力；语言知识要通过教学转化为技能，是为培养能力服务的。","实用性主要体现在：(1)教材内容要从学习者的需要出发，是学习者进行交际活动所必需的，是在生活中能马上应用的，要避免“教科书语言”和“教室语言”；(2)语言材料必须来源于生活、来源于现实，要有真实性；(3)要有利于贯彻精讲多练的原则；(4)要有利于开展交际活动，使教学过程交际化。"],"q":"实用性是教材编写和选用的原则之一。","w":"normal","e":["核心考点"]},{"t":"科学性","y":"名词解释","p":["科学性是对外汉语教材编写和选用的原则之一。","针对性、实用性以及趣味性、系统性也都属于科学性的范围。","科学性特别强调以下几点：(1)要教规范、通用的语言，我国规范、通用的汉语是普通话，规范、通用的标注音素读音的符号是《汉语拼音方案》，规范、通用的汉字是我国正式公布的简化字；(2)教材内容的组织要符合语言教学的规律；(3)对语言现象的解释要注意准确性，避免造成对学习者的误导；(4)教材内容要反映出学科理论研究的新水平，及时更换陈旧内容。"],"q":"科学性是对外汉语教材编写和选用的原则之一。","w":"high","e":["2020 真题"]},{"t":"趣味性","y":"名词解释","p":["趣味性是对外汉语教材编写和选用的原则之一。","教材内容和形式生动有趣，能吸引学习者，使学习者产生学习兴趣和动力，让相对说来比较枯燥的语言学习过程变得轻松愉快。","趣味性主要体现在：(1)教材的趣味性与教材的实用性、交际性紧密相关；(2)教材内容要反映现实，是学习者所关注的话题；(3)教材内容要逐步加大文化内涵，多方面介绍目的语文化；(4)多样化是形成趣味性的重要因素。"],"q":"趣味性是对外汉语教材编写和选用的原则之一。","w":"normal","e":["核心考点"]},{"t":"系统性","y":"名词解释","p":["系统性是对外汉语教材编写和选用的原则之一。","首先是指教材内容在基本知识介绍和技能训练方面，也就是语音、词汇、语法、汉字等语言要素和听、说、读、写言语技能的安排方面，要平衡协调、有一定的章法。","学生用书、教师手册、练习本、单元试题各部分要分工合理，相互呼应。纵的方面，初级、中级、高级不同阶段教材要衔接；横的方面，综合技能课与听、说、读、写专项技能课教材要配合。还要考虑图片、幻灯、声、像、电脑辅助教材的提供。从而形成系列的、立体的教材体系。"],"q":"系统性是对外汉语教材编写和选用的原则之一。","w":"normal","e":["核心考点"]},{"t":"直线式","y":"名词解释","p":["直线式指教材的语法结构或话题内容排列的一种方式。","直线式安排就是将语法点或句型按难易排列，从第一课开始一课教一个或几个语法点，直到最后一课。除了在课文中重现外，同一语法点除个别因用法较复杂而分作连续几课介绍外，作为讲练的重点一般不会出现两次。","这种方法的缺点十分明显。编者企图一次就把某一语法点介绍清楚，并设想学了这一次，学习者就能基本掌握该语法点。这种一个问题一个问题依次解决的方式不符合语言学习的规律。直线式的另一个缺点是按难易程度安排语法点往往是主观的，而且与学生的实际需要脱节。"],"q":"直线式指教材的语法结构或话题内容排列的一种方式。","w":"normal","e":["核心考点"]},{"t":"螺旋式","y":"名词解释","p":["螺旋式是交际法主张的教材安排方式，也叫圆周式安排。","即将话题和句型结构根据交际需要并适当照顾难易度分成几个圈，每圈都将主要话题和句型结构出现一遍，而圈与圈之间又逐步加深难度，呈螺旋式上升或是同心圆扩大之势。","这样安排既能使学习者在较短的时间(一圈中)接触较多的话题和句型结构，便于及早地运用和交际，又能使同一话题和结构多次出现，反复巩固加深，符合认知规律和第二语言学习的特点。"],"q":"螺旋式是交际法主张的教材安排方式，也叫圆周式安排。","w":"normal","e":["核心考点"]},{"t":"结构—功能型教材","y":"名词解释","p":["结构—功能型是教材按遵循的主要教学原则划分的一种类型。","结构与功能相结合，以结构安排为基础，同时考虑到结构所表达的功能，使结构应用于一定的功能。比较适合于初级阶段的第二语言学习。","这是80年代以来我国对外汉语教材编写的主要路子。目的是为了弥补纯结构型和纯功能型教材的不足，并吸取两者的优点。","但这类教材也未能很好地解决结构与功能的结合问题，容易让结构成为支配的因素，功能则成为附属，可有可无。"],"q":"结构—功能型是教材按遵循的主要教学原则划分的一种类型。","w":"normal","e":["核心考点"]},{"t":"《汉语教科书》","y":"名词解释","p":["新中国的第一部对外汉语教材《汉语教科书》(邓懿等编写)在经过较长时间的试用后于1958年正式出版。","这部教材比较典型地体现了我国结构法教材的特点：教学内容以语法为纲，以词汇、语法为中心，重视系统的语言知识的讲授(初期教学中曾用母语翻译)，采用演绎法通过大量的练习掌握语法知识。","与传统的语法翻译法不同的是，在重视语法知识系统性的同时又特别强调听说读写技能训练，这一点又明显受到听说法的影响。","这套教材的最大功绩在于把汉语作为第二语言的教学从汉语作为母语的教学中分离出来，从外国人学习汉语的实际出发，第一次提出了独具特色的对外汉语教学语法体系。"],"q":"新中国的第一部对外汉语教材《汉语教科书》(邓懿等编写)在经过较长时间的试用后于1958年正式出版。","w":"high","e":["2019 真题"]},{"t":"《实用汉语课本》","y":"名词解释","p":["1981～1982年，受教育部委托，专门为我国教师在国外进行汉语教学编写的基础汉语教材《实用汉语课本》第一、二册(北京语言学院刘珣、邓恩明、刘社会编著)由商务印书馆出版。","第一套贯彻结构、情景及功能相结合原则的教材是《实用汉语课本》。“从选材到练习内容和练习方式都经过精心设计，在贯彻交际性原则和加强文化知识的教学等方面进行了不少有益的创造，使对外汉语教材的编写原则和编写方法向前迈进了一步。”","该教材出版后，很快就得到国外汉语教学界的重视，1983年9月德国现代汉语讨论会发表的公报中认为这是“中国到现在为止最先进的对外汉语教材”。","1987年成为我国第一部获奖的对外汉语教材。出版20年来，该教材除了国内不少学校使用外，还行销五大洲，成为世界上使用最广的基础汉语教材之一。"],"q":"1981～1982年，受教育部委托，专门为我国教师在国外进行汉语教学编写的基础汉语教材《实用汉语课本》第一、二册(北京语言学院刘珣、邓恩明、刘社会编著)由商务印书馆出版。","w":"high","e":["2019 真题","2021 真题"]},{"t":"结构法教材时期","y":"名词解释","p":["回顾半个世纪对外汉语教材发展的历史，我们已经走过了50年代到70年代的结构法教材时期，和80年代到90年代的结构与功能相结合教材时期，现在正跨入结构、功能、文化相结合时期。","结构法教材指以语言结构(语法)为纲的教材。对外汉语教学结构法教材强调理解和掌握语法规则，并在基本语法知识的指导下培养听说读写基本技能。","对外汉语教材从50年代至70年代经过30年的探索，总共出版约10部。尽管数量不算多，但由于每部教材都是精心制作，每一部都在前一部的基础上有所发展，使我们在编写结构法教材方面积累了较为丰富的经验，并达到了相当的水平。"],"q":"回顾半个世纪对外汉语教材发展的历史，我们已经走过了50年代到70年代的结构法教材时期，和80年代到90年代的结构与功能相结合教材时期，现在正跨入结构、功能、文化相结合时期。","w":"normal","e":["核心考点"]},{"t":"教材是教师教学和学生学习所依据的材料，是总体设计的具体体现，同时又是课堂教学和测试的依据。","y":"判断题","p":["教材是教师教学和学生学习所依据的材料，与教学计划和教学大纲构成学校教学内容的有机组成部分。","它是总体设计的具体体现，反映了培养目标、教学要求、教学内容、教学原则；同时教材又是课堂教学和测试的依据。"],"q":"正确","w":"high","e":["2021 真题"]},{"t":"编写和选用对外汉语教材要遵循的原则可概括为“五性”：针对性、实用性、科学性、趣味性和系统性。","y":"判断题","p":["结合教材的特点，还可以概括为“五性”：针对性、实用性、科学性、趣味性和系统性。"],"q":"正确","w":"high","e":["2020 真题"]},{"t":"直线式安排是交际法主张的教材编写方式，也叫圆周式安排。","y":"判断题","p":["螺旋式是交际法主张的教材安排方式，也叫圆周式安排。","直线式安排就是将语法点或句型按难易排列，从第一课开始一课教一个或几个语法点，直到最后一课。"],"q":"错误","w":"normal","e":["核心考点"]},{"t":"结合教材的特点，对外汉语教材编写和选用的原则可概括为“五性”：______、实用性、______、趣味性和系统性。","y":"填空题","p":["结合教材的特点，还可以概括为“五性”：针对性、实用性、科学性、趣味性和系统性。"],"q":"针对性；科学性","w":"high","e":["2020 真题"]},{"t":"新中国的第一部对外汉语教材是《______》，于______年正式出版。","y":"填空题","p":["新中国的第一部对外汉语教材《汉语教科书》(邓懿等编写)在经过较长时间的试用后于1958年正式出版。"],"q":"汉语教科书；1958","w":"high","e":["2019 真题"]},{"t":"第一套贯彻结构、情景及功能相结合原则的教材是《______》，1987年成为我国第一部______的对外汉语教材。","y":"填空题","p":["“第一套贯彻结构、情景及功能相结合原则的教材是《实用汉语课本》”。","1987年成为我国第一部获奖的对外汉语教材。"],"q":"实用汉语课本；获奖","w":"high","e":["2021 真题"]},{"t":"教材种类按遵循的主要教学原则分，有课文型、结构型、______、结构—功能型、______、话题型和文化型。","y":"填空题","p":["(3)功能型。以功能为纲，根据功能项目的常用程度安排教学内容及其顺序。(5)功能—结构型。在结构与功能相结合中，由功能占支配地位，在一定的功能项目下教结构。"],"q":"功能型；功能—结构型","w":"normal","e":["核心考点"]},{"t":"对外汉语教材的语法结构或话题内容排列方式，有______和______两种。","y":"填空题","p":["(3)直线式和螺旋式。这是指教材的语法结构或话题内容排列的方式。","交际法主张的螺旋式安排，也叫圆周式安排。"],"q":"直线式；螺旋式","w":"normal","e":["核心考点"]},{"t":"交际法主张的螺旋式安排，也叫______安排。","y":"填空题","p":["交际法主张的螺旋式安排，也叫圆周式安排。"],"q":"圆周式","w":"normal","e":["核心考点"]},{"t":"新中国的第一部对外汉语教材是（　　）。","y":"单项选择题","p":[],"q":"A","w":"high","e":["2019 真题"]},{"t":"第一套贯彻结构、情景及功能相结合原则的对外汉语教材是（　　）。","y":"单项选择题","p":[],"q":"D","w":"high","e":["2021 真题"]},{"t":"成为结构法教材时期集大成者、代表了80年代以前我国对外汉语基础教材最高水平的教材是（　　）。","y":"单项选择题","p":[],"q":"C","w":"normal","e":["核心考点"]},{"t":"交际法主张的教材安排方式是（　　）。","y":"单项选择题","p":[],"q":"B","w":"normal","e":["核心考点"]},{"t":"以功能为纲、根据功能项目的常用程度安排教学内容及其顺序的教材属于（　　）。","y":"单项选择题","p":[],"q":"C","w":"normal","e":["核心考点"]},{"t":"我国第一部完全以功能为纲的中级口语教材是（　　）。","y":"单项选择题","p":[],"q":"A","w":"normal","e":["核心考点"]},{"t":"下列教材中，属于第一套对外汉语教学分技能系列教材的是（　　）。","y":"单项选择题","p":[],"q":"C","w":"normal","e":["核心考点"]},{"t":"简述对外汉语教材编写和选用的“五性”原则。","y":"简答题","p":["(1)针对性。","(2)实用性。","(3)科学性。","(4)趣味性。","(5)系统性。"],"q":"对外汉语教材编写和选用的原则可概括为“五性”：(1)针对性：教材要适合使用对象的特点，最基本的特点是不同母语、母语文化背景与目的语、目的语文化对比所确定的教学重点不同；(2)实用性：第二语言教材主要用于培养语言技能和能力，语言知识要通过教学转化为技能，是为培养能力服务的；(3)科学性：要教规范、通用的语言，教材内容的组","w":"high","e":["2020 真题"]},{"t":"简述对外汉语教材建设中存在的主要问题。","y":"简答题","p":["(1)教材的质量和品种都不能很好地满足教学的需要。","(2)缺乏基础研究，影响到教材的科学性。","(3)教学法的大胆探索不够，教材缺乏多样化。","(4)利用现代化教学技术手段不够。"],"q":"对外汉语教材建设中存在的主要问题有：(1)教材的质量和品种都不能很好地满足教学的需要。就质量而言，教材雷同和粗制滥造的现象比较严重；就品种而言，对外汉语教材的品种仍十分单调。(2)缺乏基础研究，影响到教材的科学性。相当长一段时期里，很多教材都是在没有词汇、语法、汉字大纲，没有功能意念大纲以及文化大纲的情况下编写的。(3","w":"normal","e":["核心考点"]},{"t":"简述我国对外汉语教材发展经历的三个时期。","y":"简答题","p":["(1)50年代到70年代的结构法教材时期。","(2)80年代到90年代的结构与功能相结合教材时期。","(3)现在正跨入结构、功能、文化相结合时期。"],"q":"回顾半个世纪对外汉语教材发展的历史，我们已经走过了50年代到70年代的结构法教材时期，和80年代到90年代的结构与功能相结合教材时期，现在正跨入结构、功能、文化相结合时期。结构法教材指以语言结构(语法)为纲的教材，对外汉语教学结构法教材强调理解和掌握语法规则，并在基本语法知识的指导下培养听说读写基本技能。结构与功能相结","w":"high","e":["2021 真题"]},{"t":"简述对外汉语教材编写的依据。","y":"简答题","p":["(1)语言学、心理学、教育学是理论基础。","(2)语言教学理论和学习理论是直接理论依据。","(3)目的语语言学和目的语文化是教材内容的源泉。","(4)教学计划与教学大纲是教材编写的直接依据。"],"q":"对外汉语教材编写的依据主要有：(1)语言学、心理学、教育学是理论基础。教材编者要具有理论语言学、心理语言学、社会语言学、心理学、教育学等方面的理论知识，并用以指导教材的编写。(2)语言教学理论和学习理论是直接理论依据。编写教材一定要受某种教学法理论、特别是教学原则的指导。(3)目的语语言学和目的语文化是教材内容的源泉。","w":"normal","e":["核心考点"]},{"t":"试述对外汉语教材的重要作用。","y":"论述题","p":["教材是教师教学和学生学习所依据的材料，与教学计划和教学大纲构成学校教学内容的有机组成部分。","教材是总体设计的具体体现，同时又是课堂教学和测试的依据，在第二语言教学中起着纽带的重要作用。","教材体现了语言教学最根本的两个方面：教什么和如何教。","教材水平的高低在很大程度上决定教与学的效果。","教材在学科发展中也发挥着特殊作用，是教学理论研究和学科发展的前沿阵地和突破口。"],"q":"教材是教师教学和学生学习所依据的材料，与教学计划和教学大纲构成学校教学内容的有机组成部分。在教学活动的四大环节中，教材占有很重要的地位。它是总体设计的具体体现，反映了培养目标、教学要求、教学内容、教学原则；同时教材又是课堂教学和测试的依据。因此，在第二语言教学中教材起着纽带的重要作用。教材体现了语言教学最根本的两个方面","w":"normal","e":["核心考点"]}]}]},{"id":"yinlun-c09","t":"第九章 对外汉语教学理论与应用(下)","w":"high","s":[{"id":"yinlun-c09-s01","t":"第一节 对外汉语教学过程与课堂教学","w":"high","n":20,"k":[{"t":"对外汉语教学过程","y":"名词解释","p":["对外汉语教学过程是根据教学计划和教学大纲的规定，教师和学生共同参与的对外汉语教学活动的过程，也是实施教学、全面完成教学任务的过程。","在这一过程中，学习者在教师的指导和帮助下，逐步培养运用汉语进行交际的能力，对中国文化的了解得以加深，文化素养得到进一步提高，同时其智力也得到发展，从而实现教育的总目的。","教学过程的实质是学习者对目的语和目的语文化的认识过程，是学习者感觉、知觉、记忆、想像、思维、情感等一系列心理活动的过程。在这一过程中，教师和学生是教学活动的两主体。","对外汉语教学过程主要通过课堂教学和课外活动来实现。课堂教学是对外汉语教学的基本组织形式，课外活动是辅助形式。"],"q":"对外汉语教学过程是根据教学计划和教学大纲的规定，教师和学生共同参与的对外汉语教学活动的过程，也是实施教学、全面完成教学任务的过程。","w":"high","e":["2019 真题"]},{"t":"教学过程的四个基本阶段","y":"名词解释","p":["从第二语言教学特点出发，对外汉语教学过程分为四个基本阶段，即感知阶段、理解阶段、巩固阶段和运用阶段。","感知阶段的特点是，感性的语言材料通过视、听、读等途径被学生感知，进入大脑形成表象。","理解阶段的特点是，从感知的表象中进一步认识事物的内部结构和内在联系，是从感性认识发展到理性认识的阶段，也是识记、特别是有意义的识记的完成和记忆保持的开始。","巩固阶段是从理论到实践的阶段，其特点是从识记、理解的大量语言材料中归纳出目的语的规则和用法，扩大、完善目的语的知识结构，并通过各种练习和交际实践，内化这些规则并形成言语技能。","运用阶段是指在真实的语言情境中进行的言语交际活动，也是记忆的再认阶段，是以培养学生创造力和想像力为特点的阶段。"],"q":"从第二语言教学特点出发，对外汉语教学过程分为四个基本阶段，即感知阶段、理解阶段、巩固阶段和运用阶段。","w":"high","e":["2020 真题"]},{"t":"课堂教学","y":"名词解释","p":["课堂教学是指教师根据教学大纲规定的目的、任务和教材，运用恰当的教学方法，在规定的时间内对固定班级的学生进行某门课程教学的形式。","在学校教育中，课堂是实施教学的主要场所。对外汉语课堂教学是对外汉语教学的基本组织形式，集中地体现了对外汉语教学过程。","教学过程的感知、理解、巩固、运用阶段主要在课堂教学中完成。实施教学计划，贯彻教学原则，运用教学方法，完成课程教学并实现教学目标，主要都是靠课堂教学。","在教学活动的四大环节中，课堂教学是中心环节。要提高教学效果，就要提高课堂教学质量。"],"q":"课堂教学是指教师根据教学大纲规定的目的、任务和教材，运用恰当的教学方法，在规定的时间内对固定班级的学生进行某门课程教学的形式。","w":"high","e":["2019 真题"]},{"t":"教师的语言","y":"名词解释","p":["这里的“教师的语言”(teacher talk)是一个特定的概念，是指第二语言教师为了达到交际的目的，对该语言的非母语学习者在课堂教学和课外交往中有意识使用的目的语系统的变体。","正因为它是教师主要在课堂中使用的语言，因此关系到能否成功地执行教学计划，同时也成为学生(特别是在非目的语环境中学习)所能获得的可理解输入的主要来源，直接影响到他们的目的语习得。","总的说来有三大特点：一是慢，放慢语速，增加停顿；二是简化，使用简单的词汇、句子；三是详细化，输入更多信息包括多余信息，采用重复、释义、迂回的办法，目的是为了便于学习者理解，成为可理解的输入。","教师的语言对学习者有示范和引导作用，推动其中介语向目的语靠拢，因此必须是规范的。"],"q":"这里的“教师的语言”(teacher talk)是一个特定的概念，是指第二语言教师为了达到交际的目的，对该语言的非母语学习者在课堂教学和课外交往中有意识使用的目的语系统的变体。","w":"high","e":["2020 真题"]},{"t":"课堂教学的主要环节","y":"名词解释","p":["课堂教学的主要环节，以教学过程的感知、理解、巩固、运用四个阶段为基础。","这里仅就一般语言课的教学提出五个主要环节，即组织教学、复习检查、讲练新内容、巩固新内容和布置课外作业。","组织教学的目的是稳定学生的情绪，集中学生的注意力，创造有利于学习的和谐气氛。复习检查的目的是了解学生对已学内容的掌握情况，获得反馈，发现并弥补教学中的缺陷。讲练新内容是课堂教学中的重点环节。巩固新内容与新内容讲练紧密相连。布置课外作业用以巩固课堂所学内容、督促学生及时复习旧课和预习新课。"],"q":"课堂教学的主要环节，以教学过程的感知、理解、巩固、运用四个阶段为基础。","w":"high","e":["2020 真题"]},{"t":"板书","y":"名词解释","p":["板书是课堂教学的重要教学手段。除了帮助学生理解并记笔记外，还可以使课堂教学纲目清楚，更具条理性，也可以突出重点引起学生的注意。","对外汉语教学的板书，还有将听说技能训练与读写技能训练相联系、给学生提供更多的认读汉字和学习汉字机会的作用。","板书应当注意：(1)汉字一定要正确、规范，笔顺应与教材一致，字形要美观，至少要端正，给学生以示范的作用；(2)板书要很好地设计，黑板当中五分之三用于书写新课内容；(3)板书要鲜明、醒目，适当运用彩色粉笔突出重点。"],"q":"板书是课堂教学的重要教学手段。除了帮助学生理解并记笔记外，还可以使课堂教学纲目清楚，更具条理性，也可以突出重点引起学生的注意。","w":"normal","e":["核心考点"]},{"t":"对外汉语教学过程分为四个基本阶段，即感知阶段、理解阶段、巩固阶段和运用阶段。","y":"判断题","p":["从第二语言教学特点出发，对外汉语教学过程分为四个基本阶段，即感知阶段、理解阶段、巩固阶段和运用阶段。"],"q":"正确","w":"high","e":["2020 真题"]},{"t":"在教学活动的四大环节中，课堂教学是中心环节。","y":"判断题","p":["在教学活动的四大环节中，课堂教学是中心环节。要提高教学效果，就要提高课堂教学质量。"],"q":"正确","w":"high","e":["2019 真题"]},{"t":"对外汉语课堂教学的五个主要环节是：组织教学、复习检查、讲练新内容、巩固新内容和布置课外作业。","y":"判断题","p":["这里仅就一般语言课的教学提出五个主要环节，即组织教学、复习检查、讲练新内容、巩固新内容和布置课外作业。"],"q":"正确","w":"high","e":["2020 真题"]},{"t":"“教师的语言”是指第二语言教师对该语言的非母语学习者在课堂教学和课外交往中有意识使用的目的语系统的变体。","y":"判断题","p":["这里的“教师的语言”(teacher talk)是一个特定的概念，是指第二语言教师为了达到交际的目的，对该语言的非母语学习者在课堂教学和课外交往中有意识使用的目的语系统的变体。"],"q":"正确","w":"high","e":["2020 真题"]},{"t":"对外汉语教学过程分为四个基本阶段，即感知阶段、______、巩固阶段和______。","y":"填空题","p":["从第二语言教学特点出发，对外汉语教学过程分为四个基本阶段，即感知阶段、理解阶段、巩固阶段和运用阶段。"],"q":"理解阶段；运用阶段","w":"high","e":["2020 真题"]},{"t":"对外汉语课堂教学的五个主要环节是：______、复习检查、讲练新内容、巩固新内容和______。","y":"填空题","p":["这里仅就一般语言课的教学提出五个主要环节，即组织教学、复习检查、讲练新内容、巩固新内容和布置课外作业。"],"q":"组织教学；布置课外作业","w":"high","e":["2020 真题"]},{"t":"“教师的语言”有三大特点：一是慢；二是______；三是______。","y":"填空题","p":["总的说来有三大特点：一是慢，放慢语速，增加停顿；二是简化，使用简单的词汇、句子；三是详细化，输入更多信息包括多余信息，采用重复、释义、迂回的办法。"],"q":"简化；详细化","w":"high","e":["2020 真题"]},{"t":"对外汉语教学过程主要通过______和课外活动来实现。课堂教学是对外汉语教学的基本组织形式，课外活动是______形式。","y":"填空题","p":["对外汉语教学过程主要通过课堂教学和课外活动来实现。课堂教学是对外汉语教学的基本组织形式，课外活动是辅助形式。"],"q":"课堂教学；辅助","w":"normal","e":["核心考点"]},{"t":"按要求，前一堂课知识技能的巩固率应达到______，才能进入新课的学习。","y":"填空题","p":["按要求，前一堂课知识技能的巩固率应达到80%，才能进入新课的学习。"],"q":"80%","w":"normal","e":["核心考点"]},{"t":"在教学活动的四大环节中，处于中心环节的是（　　）。","y":"单项选择题","p":[],"q":"C","w":"high","e":["2019 真题"]},{"t":"对外汉语课堂教学的五个主要环节中，时间应占最多、在100分钟中应占一半或一半以上的是（　　）。","y":"单项选择题","p":[],"q":"C","w":"normal","e":["核心考点"]},{"t":"“教师的语言”的三大特点不包括（　　）。","y":"单项选择题","p":[],"q":"D","w":"normal","e":["核心考点"]},{"t":"简述对外汉语课堂教学的特点。","y":"简答题","p":["(1)课堂教学原则：更强调把知识转化为技能，以学生为主体。","(2)课堂教学方式：以学习者的活动为主，进行高密度、快节奏、多形式的语言操练活动和交际活动。","(3)课堂教学气氛：营造轻松愉快的气氛。","(4)课堂教学环节：以每节课内的教学内容来划分，常有交叉，呈多层次性。","(5)课堂教学语言：要求课堂使用的教学语言是正在学习的目的语。"],"q":"对外汉语课堂教学除了体现一般课堂教学规律外，还有很多特点：(1)课堂教学原则。更强调把知识转化为技能，以培养技能和能力为最终目的，因而更多地要求以学生为主体，充分发挥学生的主动性、积极性和创造性。(2)课堂教学方式。要以学习者的活动为主，主要不是靠逻辑推理、论证和分析，而是要进行高密度、快节奏、多形式的语言操练活动和交","w":"high","e":["2020 真题"]},{"t":"简述对外汉语课堂教学的主要环节。","y":"简答题","p":["(1)组织教学。","(2)复习检查。","(3)讲练新内容。","(4)巩固新内容。","(5)布置课外作业。"],"q":"课堂教学的主要环节，以教学过程的感知、理解、巩固、运用四个阶段为基础。这里仅就一般语言课的教学提出五个主要环节，即组织教学、复习检查、讲练新内容、巩固新内容和布置课外作业。(1)组织教学，目的是稳定学生的情绪，集中学生的注意力，创造有利于学习的和谐气氛。(2)复习检查，目的是了解学生对已学内容的掌握情况，获得反馈，发现","w":"high","e":["2020 真题"]}]},{"id":"yinlun-c09-s02","t":"第二节 对外汉语语音、词汇、语法、汉字教学","w":"high","n":22,"k":[{"t":"语音教学","y":"名词解释","p":["对外汉语语音教学的任务是让学习者掌握汉语语音的基本知识和汉语普通话正确、流利的发音，为用口语进行交际打下基础。","语音是语言的物质外壳。语音的重要性决定了语音教学是第二语言教学的基础，是掌握听说读写技能和交际能力的前提。","语音教学原则主要有：(1)短期集中教学与长期严格要求相结合；(2)音素教学与语流教学相结合；(3)通过语音对比突出重点和难点；(4)声韵调结合教学，循序渐进；(5)听说结合，先听后说；(6)以模仿和练习为主、语音知识讲解为辅；(7)机械性练习与有意义练习相结合。"],"q":"对外汉语语音教学的任务是让学习者掌握汉语语音的基本知识和汉语普通话正确、流利的发音，为用口语进行交际打下基础。","w":"high","e":["2020 真题"]},{"t":"词汇教学","y":"名词解释","p":["对外汉语词汇教学的任务是根据教学大纲的要求，在有关汉语词汇知识的指导下，掌握一定数量的汉语词汇的音、义、形和基本用法，培养在语言交际中对词汇的正确理解和表达能力。","词汇是语言的建筑材料，是句子的基本结构单位。没有词汇就无法传递信息，也就无从交际。","词汇教学原则主要有：(1)要认真掌握每一个词语的具体意义和用法；(2)词的教学应与句子教学相结合，在一定的语境中掌握词汇；(3)利用词的聚合和组合关系在系统中学习词；(4)掌握汉语构词法，重视语素教学，词与字(语素)教学相结合；(5)不同的言语技能对词的掌握有不同的要求；(6)加强词汇的重现与复习，减少遗忘。"],"q":"对外汉语词汇教学的任务是根据教学大纲的要求，在有关汉语词汇知识的指导下，掌握一定数量的汉语词汇的音、义、形和基本用法，培养在语言交际中对词汇的正确理解和表达能力。","w":"high","e":["2019 真题"]},{"t":"语法教学","y":"名词解释","p":["语法教学是对目的语的词组、句子以及话语的组织规律的教学，用以指导言语技能训练并培养正确运用目的语进行交际的能力。","不掌握目的语遣词造句的规则，就难以正确理解和表达。语法教学一直处于第二语言教学的中心地位。","语法教学原则主要有：(1)通过语言对比突出语法的重点和难点；(2)从句型入手，句型操练与语法知识的归纳相结合；(3)由句子扩大到话语；(4)语法结构的教学与语义、语用和功能的教学相结合；(5)精讲多练，以练习为主；(6)先易后难、循序渐进地安排语法项目；(7)重视纠正学习者的语法错误，并把病错句的分析作为课堂教学内容的一个部分。"],"q":"语法教学是对目的语的词组、句子以及话语的组织规律的教学，用以指导言语技能训练并培养正确运用目的语进行交际的能力。","w":"high","e":["2020 真题","2021 真题"]},{"t":"汉字教学","y":"名词解释","p":["汉字是用来记录汉语的书写符号系统。","汉字教学的任务是，以汉字形、音、义的构成特点和规律为教学内容，帮助学习者获得认读和书写汉字的技能。汉字教学是汉语教学的重要组成部分，不掌握汉字就学不好汉语。汉字教学是汉语作为第二语言教学最显著的特点。","汉字又被认为是汉语学习最大的难点。这是由于由笔画组成的方块汉字是记录语素的语素文字，是与世界上大多数民族使用的、以记录音素的字母拼写的拼音文字根本不同的文字系统。","汉字教学原则主要有：(1)语和文先分后合，初期汉字应按自身规律独立教学；(2)强化汉字教学，字与词教学相结合；(3)把握汉字的构成规律和基本理论，利用汉字的表意和表音功能识记汉字；(4)按笔画、部件、整字三个层次，从笔画、笔顺、部件、间架结构四个方面进行汉字教学；(5)重视对比，加强复习，通过书写识记汉字。"],"q":"汉字是用来记录汉语的书写符号系统。","w":"high","e":["2020 真题"]},{"t":"语音是语言的物质外壳，错误的语音最容易“化石化”，以后很难纠正，所以第二语言教学应严格要求学好语音。","y":"判断题","p":["语音是语言的物质外壳。语音的重要性决定了语音教学是第二语言教学的基础。","语音基础没有打好，一旦形成了习惯，错误的语音最容易“化石化”，以后就很难纠正。所以第二语言教学，不论学习者带有何种学习目的，都应严格要求学好语音。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"汉字是记录语素的语素文字，是与拼音文字根本不同的文字系统，汉字教学是汉语作为第二语言教学最显著的特点。","y":"判断题","p":["汉字教学是汉语教学的重要组成部分，不掌握汉字就学不好汉语。汉字教学是汉语作为第二语言教学最显著的特点。","这是由于由笔画组成的方块汉字是记录语素的语素文字，是与世界上大多数民族使用的、以记录音素的字母拼写的拼音文字根本不同的文字系统。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"词汇教学中，不同的言语技能对词的掌握有不同的要求，“说”要求的词汇量最大，阅读要求的词汇量最小。","y":"判断题","p":["“说”要求的词汇量最小，头1000词是口语词汇的核心……阅读词汇量最大，一般在7000以上。"],"q":"错误","w":"normal","e":["核心考点"]},{"t":"语音教学原则中，要做到______教学与______教学相结合。","y":"填空题","p":["音素教学与语流教学相结合。在语音阶段有两种教学方法：一种是音素教学，强调打好语音基本功；一种是语流教学，强调从会话入手。"],"q":"音素；语流","w":"high","e":["2020 真题"]},{"t":"语法教学的方法有______、______和演绎与归纳相结合三种。","y":"填空题","p":["(1)归纳法。让学习者先接触具体的语言材料、进行大量的练习，然后在教师的启发下总结出语法规则，再运用这些规则进一步练习。(2)演绎法。先讲清语法规则，使学习者对语法结构有清楚的了解，然后在语法规则的指导下进行练习。(3)演绎与归纳相结合。"],"q":"归纳法；演绎法","w":"normal","e":["核心考点"]},{"t":"汉字有基本笔画(横、竖、撇、点、捺、提)______种，派生笔画______种。","y":"填空题","p":["汉字有基本笔画(横、竖、撇、点、捺、提)6种，派生笔画25种。"],"q":"6；25","w":"normal","e":["核心考点"]},{"t":"词汇教学中，一般说来，新词至少需要______次重现，才能初步掌握。","y":"填空题","p":["一般说来，新词至少需要6~8次重现，才能初步掌握。结构主义教材和读物，新词要平均出现30~40次。"],"q":"6~8","w":"normal","e":["核心考点"]},{"t":"对外汉语语法教学的原则之一是：从句型入手，______与语法知识的归纳相结合。","y":"填空题","p":["(2)从句型入手，句型操练与语法知识的归纳相结合。句型是从大量句子中总结出来的典型句式。"],"q":"句型操练","w":"normal","e":["核心考点"]},{"t":"对外汉语词汇教学的任务是掌握一定数量的汉语词汇的______和基本用法，培养在语言交际中对词汇的正确理解和表达能力。","y":"填空题","p":["对外汉语词汇教学的任务是根据教学大纲的要求，在有关汉语词汇知识的指导下，掌握一定数量的汉语词汇的音、义、形和基本用法，培养在语言交际中对词汇的正确理解和表达能力。"],"q":"音、义、形","w":"normal","e":["核心考点"]},{"t":"“教什么考什么”是下列哪种测试的特点？（　　）","y":"单项选择题","p":[],"q":"B","w":"normal","e":["核心考点"]},{"t":"被称为汉语作为第二语言教学最显著的特点的是（　　）。","y":"单项选择题","p":[],"q":"A","w":"high","e":["2020 真题"]},{"t":"对外汉语语音教学原则中，“语流——单音素——语流”这一具体做法体现的是（　　）。","y":"单项选择题","p":[],"q":"B","w":"normal","e":["核心考点"]},{"t":"语法教学中，先讲清语法规则，然后在语法规则的指导下进行练习，通过实践学会运用语法规则的方法是（　　）。","y":"单项选择题","p":[],"q":"B","w":"normal","e":["核心考点"]},{"t":"简述对外汉语语音教学的原则。","y":"简答题","p":["(1)短期集中教学与长期严格要求相结合。","(2)音素教学与语流教学相结合。","(3)通过语音对比突出重点和难点。","(4)声韵调结合教学，循序渐进。","(5)听说结合，先听后说。","(6)以模仿和练习为主、语音知识讲解为辅。","(7)机械性练习与有意义练习相结合。"],"q":"对外汉语语音教学的原则主要有：(1)短期集中教学与长期严格要求相结合；(2)音素教学与语流教学相结合，具体做法是语流——单音素——语流；(3)通过语音对比突出重点和难点；(4)声韵调结合教学，循序渐进；(5)听说结合，先听后说；(6)以模仿和练习为主、语音知识讲解为辅；(7)机械性练习与有意义练习相结合。","w":"high","e":["2020 真题"]},{"t":"简述对外汉语词汇教学的原则。","y":"简答题","p":["(1)要认真掌握每一个词语的具体意义和用法。","(2)词的教学应与句子教学相结合，在一定的语境中掌握词汇。","(3)利用词的聚合和组合关系在系统中学习词。","(4)掌握汉语构词法，重视语素教学，词与字教学相结合。","(5)不同的言语技能对词的掌握有不同的要求。","(6)加强词汇的重现与复习，减少遗忘。"],"q":"对外汉语词汇教学的原则主要有：(1)要认真掌握每一个词语的具体意义和用法；(2)词的教学应与句子教学相结合，在一定的语境中掌握词汇，提倡“词不离句”；(3)利用词的聚合和组合关系在系统中学习词；(4)掌握汉语构词法，重视语素教学，词与字(语素)教学相结合；(5)不同的言语技能对词的掌握有不同的要求，要区分积极掌握词汇和","w":"normal","e":["核心考点"]},{"t":"简述对外汉语语法教学的原则。","y":"简答题","p":["(1)通过语言对比突出语法的重点和难点。","(2)从句型入手，句型操练与语法知识的归纳相结合。","(3)由句子扩大到话语。","(4)语法结构的教学与语义、语用和功能的教学相结合。","(5)精讲多练，以练习为主。","(6)先易后难、循序渐进地安排语法项目。","(7)重视纠正学习者的语法错误。"],"q":"对外汉语语法教学的原则主要有：(1)通过语言对比突出语法的重点和难点；(2)从句型入手，句型操练与语法知识的归纳相结合；(3)由句子扩大到话语；(4)语法结构的教学与语义、语用和功能的教学相结合；(5)精讲多练，以练习为主；(6)先易后难、循序渐进地安排语法项目；(7)重视纠正学习者的语法错误，并把病错句的分析作为课堂","w":"high","e":["2021 真题"]},{"t":"简述对外汉语汉字教学的原则。","y":"简答题","p":["(1)语和文先分后合，初期汉字应按自身规律独立教学。","(2)强化汉字教学，字与词教学相结合。","(3)把握汉字的构成规律和基本理论，利用汉字的表意和表音功能识记汉字。","(4)按笔画、部件、整字三个层次，从笔画、笔顺、部件、间架结构四个方面进行汉字教学。","(5)重视对比，加强复习，通过书写识记汉字。"],"q":"对外汉语汉字教学的原则主要有：(1)语和文先分后合，初期汉字应按自身规律独立教学；(2)强化汉字教学，字与词教学相结合，要特别强化作为形音义结合体的“字”的教学；(3)把握汉字的构成规律和基本理论，利用汉字的表意和表音功能识记汉字；(4)按笔画、部件、整字三个层次，从笔画、笔顺、部件、间架结构四个方面进行汉字教学；(5","w":"high","e":["2020 真题"]},{"t":"试述对外汉语教学中语法教学的主要方法及其适用性。","y":"论述题","p":["(1)归纳法：由具体到抽象、由实践到理论然后再回到实践的方法，符合人的认识规律，对不太难的语法点有很大优越性。","(2)演绎法：先讲清语法规则，然后在语法规则的指导下进行练习，适合成年人学习第二语言，对一些较难语法点的学习效果尤好，缺点是容易流于注入式教学。","(3)演绎与归纳相结合：先采用演绎法简要揭示语法规则，然后通过大量练习再做进一步的归纳总结。","语法教学应注意充分利用生动形象的直观手段创造情景，以利于学习者对语法规则的感知和理解。"],"q":"对外汉语语法教学的方法主要有三种：(1)归纳法。让学习者先接触具体的语言材料、进行大量的练习，然后在教师的启发下总结出语法规则，再运用这些规则进一步练习。这是一种由具体到抽象、由实践到理论然后再回到实践的方法。这种方法符合人的认识规律，突出了大量的练习实践，调动了学习者的主动性，有利于培养学习者的分析、观察能力。直接法","w":"normal","e":["核心考点"]}]},{"id":"yinlun-c09-s03","t":"第三节 语言测试","w":"high","n":37,"k":[{"t":"语言测试","y":"名词解释","p":["语言测试是根据一定的评估目的，以抽样方式通过有限试题来诱导出受试者的言语行为，然后借助于定量描述来推断受试者掌握的该语言的知识和能力。","从心理学的角度来看，上述定义表明，测试的任务在于如何诱导出体现受试者语言知识和能力的言语行为，并对这种行为进行量化和说明解释。","语言测试具有间接性、片面性、主观性和偶然性四个特点。","测试是教育评估的主要手段，也是教学活动的主要环节之一。测试是第二语言教学四大环节的重要组成部分。"],"q":"语言测试是根据一定的评估目的，以抽样方式通过有限试题来诱导出受试者的言语行为，然后借助于定量描述来推断受试者掌握的该语言的知识和能力。","w":"high","e":["2020 真题","2021 真题"]},{"t":"水平测试","y":"名词解释","p":["水平测试又称能力测试，目的在于测量受试者现有的整体的语言实际运用能力，以评定是否达到胜任某项任务的要求。","水平测试不考虑受试者的学历，也不以任何大纲、课程或教材为依据，而是根据语言交际能力的标准，或是某一特定任务的要求来命题。这是一种回顾兼预示的测试。","水平测试具有较高的区分性，受试者的分数反映了他在全体受试者中的位置。水平测试常常是大规模标准化测试，如我国的汉语水平考试(HSK)、英语水平考试(EPT)，美国的托福考试，英国的剑桥英语水平考试等。"],"q":"水平测试又称能力测试，目的在于测量受试者现有的整体的语言实际运用能力，以评定是否达到胜任某项任务的要求。","w":"high","e":["2019 真题","2021 真题"]},{"t":"成绩测试","y":"名词解释","p":["成绩测试又称课程测试，是一门课程或课型的测试，目的是检查学习者在某一教学阶段是否掌握了教学大纲和教材所规定的教学内容，在学习上取得什么成果。","测试的内容以课程的教学大纲和教材为依据，教什么考什么。","这是一种回顾性的测试，目的在于了解学习者目前所达到的程度，是与一个较长期的目标相联系的。受试者获得的成绩是绝对的。","成绩测试是教学中用得最多的测试，学校的期中期末考试、毕业考试等都属于这一类。"],"q":"成绩测试又称课程测试，是一门课程或课型的测试，目的是检查学习者在某一教学阶段是否掌握了教学大纲和教材所规定的教学内容，在学习上取得什么成果。","w":"high","e":["2019 真题","2021 真题"]},{"t":"学能测试","y":"名词解释","p":["学能测试又称潜能测试或性向测试，目的在于了解受试者学习第二语言的潜在能力和素质。","学习语言的潜能包括：语音的编码、解码能力，语法敏感性，语言的记忆能力，综合归纳能力等。","学能测试是一种预示性的测试。","在决定学习一种语言之前，了解学习者先天条件和素质，对学习者本人和学校都是有价值的。学能测试属于常模参照测试。"],"q":"学能测试又称潜能测试或性向测试，目的在于了解受试者学习第二语言的潜在能力和素质。","w":"normal","e":["核心考点"]},{"t":"诊断测试","y":"名词解释","p":["诊断测试是为了了解受试者在学习某一具体内容或在较短的一段学习时间里所存在的问题而进行的测试。","目的是迅速直接地获得反馈信息，及时改进教学。这也是一种回顾兼预示性的测试，常常是与一具体的短期目标相联系。","学校中的小考、小测验都属于这一类。诊断测试是非正式的测试，命题、评分都比较灵活，一般也不用作衡量学生水平的主要依据。"],"q":"诊断测试是为了了解受试者在学习某一具体内容或在较短的一段学习时间里所存在的问题而进行的测试。","w":"normal","e":["核心考点"]},{"t":"效度","y":"名词解释","p":["效度又称有效性，指测试的有效程度，即测试的内容和方法是否能测出预定要测量的东西。","效度又分为表面效度、内容效度、结构效度和经验效度(效标关联效度)。","表面效度指某个测验或考试从表面看来是否测了它旨在测量的东西，有没有缺漏的部分，有没有偏题怪题。","内容效度指测试的内容是否是应该考查的，是否反映了这项测试的要求，或者说试题所包含的内容代表性、准确度和覆盖面如何。","结构效度又称理论效度，指考试的结果在多大程度上符合我们根据某种理论做出的预测。","效标关联效度是指确定一种能反映测试效度的参照标准，然后考察某一考试与该标准之间的相关程度。"],"q":"效度又称有效性，指测试的有效程度，即测试的内容和方法是否能测出预定要测量的东西。","w":"high","e":["2020 真题"]},{"t":"信度","y":"名词解释","p":["信度又称可靠性，指测试结果的可靠程度或稳定性，也就是考试成绩是否反映了受试者的实际水平。","测量的工具要固定。松紧带不能用来作测量的尺子。语言测试是测量语言的工具，这把尺子也要固定。","一般从三个方面衡量测试的信度：(1)测试的稳定性(stability)，也称再测信度；(2)测试的等值性(equivalence)，也称为复本信度；(3)测试的内部一致性(internal consistency)，常用分半法。","影响信度的因素有：测试的题量、试题的同质性、试题的区分性、受试者水平的多样性、评分的客观性。"],"q":"信度又称可靠性，指测试结果的可靠程度或稳定性，也就是考试成绩是否反映了受试者的实际水平。","w":"high","e":["2021 真题"]},{"t":"区分性","y":"名词解释","p":["区分性指测试区分受试者知识和能力差别的性能，是试题的质量标准。","如果受试者的水平高低不同而测试的成绩却很接近，不能把水平高和水平低的受试者区分开来，说明该考试的区分性差。","测试的区分性从试题的难易度和试题的区分度两方面考虑。","试题的难易度指试卷中应包括适当比例的难易程度不同的试题。试题的区分度指试题能区分受试者水平差异的程度，它与难易度相关，是更重要的指标。"],"q":"区分性指测试区分受试者知识和能力差别的性能，是试题的质量标准。","w":"normal","e":["核心考点"]},{"t":"多项选择题","y":"名词解释","p":["多项选择题一般是先提出情景(称为题干)，并提出四个答案的备选项，让受试者选择其中的一个(其余三个叫干扰)，所以也称四项选择题。","这是考查阅读理解和听力理解等语言技能的常用题型，可以考词汇也可考语法。","多项选择题最大的优点是评分客观，因而信度大。可以直接考出编制者想考的问题，使受试者无法回避，因而效度也大。由于答题迅速，因此题量可大。","缺点是不能测表达能力，有25%猜对的概率，命题费时费力。"],"q":"多项选择题一般是先提出情景(称为题干)，并提出四个答案的备选项，让受试者选择其中的一个(其余三个叫干扰)，所以也称四项选择题。","w":"high","e":["2019 真题"]},{"t":"综合填充题","y":"名词解释","p":["综合填充是完形测试(cloze tests)的基本形式。即在一篇短文中隔一定的字数删去一个词，让受试者补上。","它是以格式塔的完形心理学派理论为基础，认为心理学的基本特征是在意识经验中所体现的结构性或整体性。","“完形倾向”使人具有填补空缺的心理，而填补空缺的过程中必须对整体及其组成部分有充分的认识。","最早是选用三四百字短文，除了第一句和最后一句外，每隔5或7、9、11个字就留出一个空格，每道试题约25～50个空格。后来改为从出题的需要出发不定距离留空，并采用综合填充与多项选择相结合的办法。"],"q":"综合填充是完形测试(cloze tests)的基本形式。即在一篇短文中隔一定的字数删去一个词，让受试者补上。","w":"high","e":["2020 真题"]},{"t":"分立式测试","y":"名词解释","p":["分立式测试是对语言要素(语音、词汇、语法等)和言语技能(听、说、读、写)分别进行单项测试，如填空、完成句子、多项选择。","其理论基础是结构主义语言学。认为语言是由各种成分组成的，掌握一种语言就是掌握这些成分和技能。","分立式试题的长处在于想考什么就能考什么，受试者无法回避，而且大多采用客观试题。","缺点是只能测量各个孤立项目的知识和技能。而各个单项知识、技能之和不一定等于其总体语言能力。"],"q":"分立式测试是对语言要素(语音、词汇、语法等)和言语技能(听、说、读、写)分别进行单项测试，如填空、完成句子、多项选择。","w":"normal","e":["核心考点"]},{"t":"标准化测试","y":"名词解释","p":["标准化测试是以现代教育测量学的理论为依据，按照系统的科学程序对考试的全过程(设计、命题、施测、评分、分析等)实行标准化处理，对误差进行严格控制，有较高效度、信度，能测出受试者真实水平的测试。","这种测试由权威机构和专业队伍研制。","为了保证严密的科学性，标准化测试通常是以客观性试题为主的常模参照测试。","标准化语言测试的过程大体上有四个步骤，即设计命题、考试实施、阅卷评分和统计分析。"],"q":"标准化测试是以现代教育测量学的理论为依据，按照系统的科学程序对考试的全过程(设计、命题、施测、评分、分析等)实行标准化处理，对误差进行严格控制，有较高效度、信度，能测出受试者真实水平的测试。","w":"high","e":["2020 真题"]},{"t":"后效作用","y":"名词解释","p":["测试是用来检查教学效果的，但同时又不可避免地给教学以影响，这就是测试的后效作用。","特别是一些大型的、重要的考试，如升学考试，常常对教学起指挥棒的作用。为了使学习者能通过这类考试获得好的成绩，教学反而向测试看齐，甚至出现教学为考试服务的本末倒置现象。","好的测试符合教学规律，能给教学以正确的引导，对学生的学习起检查和督促的作用，产生积极的后效。","如果考试背离了教学规律和学习规律，就会对教学产生有害的影响。"],"q":"测试是用来检查教学效果的，但同时又不可避免地给教学以影响，这就是测试的后效作用。","w":"high","e":["2021 真题"]},{"t":"语言测试具有间接性、片面性、主观性和偶然性四个特点。","y":"判断题","p":["从以上分析可以看出，语言测试的研制既涉及到许多理论问题，也有实际操作问题。","语言测试具有间接性、片面性、主观性和偶然性。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"结构效度是最重要的效度，是效度的核心问题。","y":"判断题","p":["结构效度是最重要的效度，是效度的核心问题。"],"q":"正确","w":"high","e":["2020 真题"]},{"t":"信度是效度的前提，信度高就意味着效度一定高。","y":"判断题","p":["(1)信度是效度的前提。如果测试的结果不可靠，不能反映受试者的实际水平，就谈不上有效性。","(2)信度高并不意味着效度一定高。可靠的语法项目考试不一定能测出受试者的理解能力。"],"q":"错误","w":"high","e":["2021 真题"]},{"t":"成绩测试属于标准参照测试，要求有较高的内容效度。","y":"判断题","p":["(1)标准参照测试(criterion-referenced tests)。标准参照测试是测定受试者是否达到教学大纲所规定的标准的一种测试……成绩测试属于这类测试。","成绩测试和诊断测试要求有较高的内容效度，水平测试要求有较高的共时效度和预示效度。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"多项选择题最大的优点是评分客观，因而信度大，而且可以直接考出编制者想考的问题，因而效度也大。","y":"判断题","p":["多项选择题最大的优点是评分客观，因而信度大。可以直接考出编制者想考的问题，使受试者无法回避，因而效度也大。由于答题迅速(只要在正确答案上划勾)，因此题量可大。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"语言测试的评析标准主要有：______、______、区分性、可行性和后效作用。","y":"填空题","p":["语言测试质量评析，可以从效度(有效性)、信度(可靠性)、区分性、可行性及反馈作用几个方面进行。"],"q":"效度；信度","w":"high","e":["2021 真题"]},{"t":"效度又分为表面效度、______、结构效度和______。","y":"填空题","p":["效度又分为表面效度、内容效度、结构效度和经验效度。"],"q":"内容效度；经验效度","w":"high","e":["2020 真题"]},{"t":"语言测试按用途分为学能测试、______、水平测试和______。","y":"填空题","p":["(1)学能测试。(2)成绩测试。(3)水平测试。(4)诊断测试。"],"q":"成绩测试；诊断测试","w":"high","e":["2019 真题"]},{"t":"综合填充是______测试的基本形式。","y":"填空题","p":["综合填充是完形测试(cloze tests)的基本形式。"],"q":"完形","w":"normal","e":["核心考点"]},{"t":"我国的汉语水平考试(HSK)，对外汉语教学界于______年开始研制，于______年完成第一套试题。","y":"填空题","p":["对外汉语教学界则于1984年开始研制汉语水平考试(HSK)，于1985年完成第一套试题。经过十多年的努力，HSK已发展为世界上影响最大的汉语水平考试。"],"q":"1984；1985","w":"normal","e":["核心考点"]},{"t":"标准化测试通常是以______试题为主的______测试。","y":"填空题","p":["为了保证严密的科学性，标准化测试通常是以客观性试题为主的常模参照测试。"],"q":"客观性；常模参照","w":"normal","e":["核心考点"]},{"t":"目的在于测量受试者现有的整体的语言实际运用能力，不以任何大纲、课程或教材为依据的测试是（　　）。","y":"单项选择题","p":[],"q":"C","w":"high","e":["2019 真题","2021 真题"]},{"t":"又称“有效性”，指测试的内容和方法是否能测出预定要测量的东西的评析标准是（　　）。","y":"单项选择题","p":[],"q":"A","w":"high","e":["2020 真题"]},{"t":"效度的核心问题是（　　）。","y":"单项选择题","p":[],"q":"C","w":"high","e":["2020 真题"]},{"t":"以格式塔的完形心理学派理论为基础的测试题型是（　　）。","y":"单项选择题","p":[],"q":"B","w":"high","e":["2020 真题"]},{"t":"用同一套试题在较短的间隔和尽可能相似的环境中对同一批受试者测试两次，然后计算两次测试分数的相关系数，这种信度是（　　）。","y":"单项选择题","p":[],"q":"A","w":"normal","e":["核心考点"]},{"t":"下列测试中属于常模参照测试的是（　　）。","y":"单项选择题","p":[],"q":"C","w":"normal","e":["核心考点"]},{"t":"在标准化语言测试的四个步骤中，最后一步是（　　）。","y":"单项选择题","p":[],"q":"D","w":"normal","e":["核心考点"]},{"t":"认为“语言是由各种成分组成的，掌握一种语言就是掌握这些成分和技能”的测试是（　　）。","y":"单项选择题","p":[],"q":"A","w":"normal","e":["核心考点"]},{"t":"简述语言测试的作用。","y":"简答题","p":["(1)评估教学，提供反馈信息。","(2)评估人材，提供用人的重要依据。","(3)是语言教学研究和语言研究的重要手段。","(4)推广母语教学，扩大母语影响。"],"q":"语言测试的作用主要有：(1)评估教学，提供反馈信息。测试是第二语言教学四大环节的重要组成部分。通过测试，学生可以了解自己掌握目的语知识和能力的情况，教师可以检查自己的教学效果，教学管理者可以把测试结果作为检验教学大纲、教材和教学方法的重要参考。(2)评估人材，提供用人的重要依据。(3)是语言教学研究和语言研究的重要手段","w":"normal","e":["核心考点"]},{"t":"简述语言测试的评析标准。","y":"简答题","p":["(1)效度(有效性)。","(2)信度(可靠性)。","(3)区分性。","(4)可行性。","(5)后效作用。"],"q":"语言测试质量评析，可以从效度(有效性)、信度(可靠性)、区分性、可行性及反馈作用几个方面进行。(1)效度又称有效性，指测试的有效程度，即测试的内容和方法是否能测出预定要测量的东西，效度又分为表面效度、内容效度、结构效度和经验效度。(2)信度又称可靠性，指测试结果的可靠程度或稳定性。(3)区分性指测试区分受试者知识和能力","w":"high","e":["2021 真题"]},{"t":"简述语言测试按用途划分的种类。","y":"简答题","p":["(1)学能测试。","(2)成绩测试。","(3)水平测试。","(4)诊断测试。"],"q":"第二语言测试按用途分为：(1)学能测试(aptitude tests)，又称潜能测试或性向测试，目的在于了解受试者学习第二语言的潜在能力和素质，是一种预示性的测试。(2)成绩测试(achievement tests)，又称课程测试，目的是检查学习者在某一教学阶段是否掌握了教学大纲和教材所规定的教学内容，是一种回顾性的测","w":"high","e":["2019 真题"]},{"t":"试述效度和信度的关系。","y":"论述题","p":["效度又称有效性，指测试的有效程度；信度又称可靠性，指测试结果的可靠程度或稳定性。","(1)信度是效度的前提。","(2)信度高并不意味着效度一定高。","(3)效度不高，信度高也没有意义。","测试的可靠性与有效性是测试的两大评析标准，两者关系密切且十分复杂。"],"q":"效度又称有效性，指测试的有效程度，即测试的内容和方法是否能测出预定要测量的东西。信度又称可靠性，指测试结果的可靠程度或稳定性，也就是考试成绩是否反映了受试者的实际水平。测试的可靠性与有效性是测试的两大评析标准，两者都很重要，两者关系密切且十分复杂：(1)信度是效度的前提。如果测试的结果不可靠，不能反映受试者的实际水平，","w":"high","e":["2021 真题"]},{"t":"病例：某高校对外汉语教研组编写了一套初级汉语期末考试试卷。该试卷全部采用单项选择题，共20道题，主要考查语法点和词汇；听力部分也全部采用多项选择题。考试结束后，教研组发现：学生的考试成绩普遍很高，平均分达92分；但学生们的口语表达、汉字书写能力依然很差，任课教师反映学生的写作水平与考试成绩严重不符；此外，试卷中的语法题集中在个别几个考点上，而教学大纲要求的很多内容没有涉及。请结合语言测试的评析标准，分析这份试卷存在的问题，并给出改进建议。","y":"案例分析题","p":["这份试卷效度不高。效度指测试的有效程度，即测试的内容和方法是否能测出预定要测量的东西。全部采用多项选择题不能测表达能力，且考点集中于个别内容，内容效度低。","成绩测试应与教学目的相一致，全面涵盖语言要素、言语技能和言语交际技能。试题应在教学大纲或考试大纲范围之内，覆盖教学的主要内容。","成绩普遍很高但实际能力很差，说明信度高并不代表效度高，效度不高时信度高也没有意义。","改进建议：提高内容效度，扩大覆盖面，成绩测试应客观测试和主观测试相结合，适当增加作文、口试等主观性试题以提高效度。"],"q":"这份试卷存在的问题主要涉及语言测试的效度、信度与题型选用等方面：(1)效度方面存在严重问题。效度指测试的有效程度，即测试的内容和方法是否能测出预定要测量的东西。这份试卷全部采用多项选择题，多项选择题的缺点是不能测表达能力，只有25%猜对的概率；本试卷“主要考查语法点和词汇”，而且“语法题集中在个别几个考点上，而教学大纲","w":"high","e":["2020 真题"]}]}]},{"id":"yinlun-c10","t":"第十章 对外汉语教学的学科建设","w":"high","s":[{"id":"yinlun-c10-s01","t":"第一节 对外汉语教学研究方法","w":"high","n":39,"k":[{"t":"方法论","y":"名词解释","p":["方法论是在哲学层次上探讨科学方法的一般理论，是对科学方法的高度抽象与概括，研究如何把世界观的基本观点变为认识世界和改造世界的根本方法理论。","方法论一般就是指哲学方法论。","最普遍、最根本、最具有通用性的方法是哲学方法，它适用于自然科学、社会科学和思维科学，成为所有方法的基础，对其他各种方法起指导作用。","除了作为根本方法的哲学方法外，数学等横断科学作为运用于各个领域的一般方法，也起着方法论的作用，对各学科都有方法论的指导意义。"],"q":"方法论是在哲学层次上探讨科学方法的一般理论，是对科学方法的高度抽象与概括，研究如何把世界观的基本观点变为认识世界和改造世界的根本方法理论。","w":"normal","e":["核心考点"]},{"t":"观察法","y":"名词解释","p":["观察法是科学研究也是教育研究中最基本、最普遍的方法。","它是在自然的条件下，有目的有计划地通过观察而感知研究对象以获得实例的方法。可以作为参与者观察，也可以作为旁观者观察。","观察的范围通常是从开放式到逐步缩小、聚焦。","从事语言教学的研究者和教师正是通过课上、课下和社会实践活动，对学生或别的教师进行观察和记录。这样所获得的第一手资料，常常成为用其他方法特别是经验总结法进行研究的基础。"],"q":"观察法是科学研究也是教育研究中最基本、最普遍的方法。","w":"normal","e":["核心考点"]},{"t":"经验总结法","y":"名词解释","p":["经验总结法可以说是本学科用得最多的方法。","从现存的早期论文《教非汉族学生学习汉语的一些问题》(周祖谟，1953)，到文革前对外汉语教学的全面总结《15年汉语教学经验总结》(钟梫，1965)，以及近十多年来各种学术会议和期刊论文的绝大部分，都是运用经验总结的方法写成的。","这在学科发展的一定阶段是一种正常的现象。","由经验型向科学型过渡也是一般学科发展的必由之路。"],"q":"经验总结法可以说是本学科用得最多的方法。","w":"normal","e":["核心考点"]},{"t":"调查法","y":"名词解释","p":["调查法是根据一定的目的，有计划地从一定量的样本中搜集有关研究对象的资料，从而对研究对象的整体进行推断的方法。","与观察法相同之处是两者都是在自然状态中获得实例。不同之处在于调查法是一种间接的观察法，因而不受时空的限制，既可以调查现状，也可以调查历史资料，可以调查国内国外的情况，有观察法和其他方法难以达到的广度。","调查的具体方法有访谈法、问卷法和测试法等。","本学科已成功地进行过一些大型的调查项目，如《北京口语调查》(常宝儒等，1992)，《汉语中介语语料库系统》(储诚志等，1995)，《外国人学习与使用汉语情况调查研究报告》(高彦德等，1993)。"],"q":"调查法是根据一定的目的，有计划地从一定量的样本中搜集有关研究对象的资料，从而对研究对象的整体进行推断的方法。","w":"normal","e":["核心考点"]},{"t":"文献研究法","y":"名词解释","p":["文献研究法是通过对文献资料的阅读、分析、研究以获取信息并得出一定结论的方法。","常用于介绍或评述某一学术问题。","文献研究法的典型例子如《第二语言习得研究的回顾与展望》(袁博平，1995)，《国外外语教学学科发展的过去和现状》(孙德坤，1994)等。"],"q":"文献研究法是通过对文献资料的阅读、分析、研究以获取信息并得出一定结论的方法。","w":"normal","e":["核心考点"]},{"t":"实验法","y":"名词解释","p":["实验法是有意识地使一个变量(自变量)发生变化，并观察对另一个变量(因变量)所产生的影响的研究方法。","实验法是国外第二语言习得和教学研究的主要方法，也一直为我国心理学和教育学研究者所使用。","实验法的关键在于：首先必须有作为实验目的的假说，并根据这一假说进行精确的实验设计；第二，在实验过程中对被试要进行随机抽样，要控制自变量，同时对非研究变量要进行控制；第三，对实验获得的数据和资料进行分析，对一些理论问题进行讨论并对假说进行检验。","实验方法是科学研究最重要、最基本的方法。"],"q":"实验法是有意识地使一个变量(自变量)发生变化，并观察对另一个变量(因变量)所产生的影响的研究方法。","w":"high","e":["2020 真题"]},{"t":"个案研究法","y":"名词解释","p":["个案研究是指对某个人或某件事等限定系统进行集中、深入、全面的研究，常用于定性研究，也用于描述性研究。","就语言教学研究来说，常常是对一个学生或教师、一个学校或团体、一门课或一个事件进行纵向的跟踪研究。","根据马克思主义哲学有关个性与共性、个别与一般的论述，典型的个案研究有助于认识同类事物的全貌。","个案研究最早用于儿童语言习得和语言人类学。有名的范例如赵元任先生50年代初发表的、对他的孙女学话过程的跟踪观察与研究。"],"q":"个案研究是指对某个人或某件事等限定系统进行集中、深入、全面的研究，常用于定性研究，也用于描述性研究。","w":"normal","e":["核心考点"]},{"t":"相关分析法","y":"名词解释","p":["相关分析法是对研究对象群体特征的定量分析，以研究各特征之间或多元因素之间的相互关系。","比如某变量的变化与另一变量的变化之间存在的一定的规律性。","相关分析通常研究两个或多个变量之间是否相关：是正相关还是负相关?相关程度如何?相关程度常用-1.0到+1.0的相关系数表示。多个变量之间的关系分析也称“多元回归分析”。"],"q":"相关分析法是对研究对象群体特征的定量分析，以研究各特征之间或多元因素之间的相互关系。","w":"normal","e":["核心考点"]},{"t":"对比分析法","y":"名词解释","p":["对比分析法是语言研究和语言教学研究最常用的方法，用来对两种或多种语言的相同和相异之点、两种或多种语言的习得或教学规律的相同和相异之点进行对比研究，以加深对所比较的事物的认识，从而发现新的特征和新的规律。","对比分析法有着广阔的天地，可以进行不同事物之间的共时横向比较，也可以进行同一事物的历时纵向比较；可以进行定量比较，也可以进行定性比较；可以进行专项比较，也可以进行综合比较。","具体地说，第一语言习得和第二语言学习的比较，第二语言学习和外语学习的比较，不同母语的学习者学习同一目的语的比较，同一语言学习者学习不同目的语的比较，不同学习策略或不同的教学方法流派的比较等等，都是很好的研究课题。"],"q":"对比分析法是语言研究和语言教学研究最常用的方法，用来对两种或多种语言的相同和相异之点、两种或多种语言的习得或教学规律的相同和相异之点进行对比研究，以加深对所比较的事物的认识，从而发现新的特征和新的规律。","w":"high","e":["2019 真题"]},{"t":"偏误分析法","y":"名词解释","p":["偏误分析已成为第二语言习得过程研究和中介语研究的最重要的方法之一。","不少对外汉语教师正在从事这方面的研究工作，成果相对说来也比较多。","现在应当对这一研究方法进行总结。要避免重复研究或是同一水平上的研究，就需要与其他的研究方法如实验法、话语分析法等相结合，开创研究的新局面。"],"q":"偏误分析已成为第二语言习得过程研究和中介语研究的最重要的方法之一。","w":"high","e":["2019 真题"]},{"t":"话语分析法","y":"名词解释","p":["话语分析法，即对超出句子层面的语言和语言教学的研究方法。","这在语言学界和语言教学界都还是一种新的事物。它是随着对语言的语用研究、对语言习得的社会文化因素的研究以及语言教学交际性原则的研究的发展，而成为最重要的研究方法。","这也反映了对语言和语言学习的更为广阔的新视野。","话语分析法几乎能用于语言习得与教学的所有课题，并能带来“柳暗花明又一村”的境界。在对外汉语教学界，这一方法的运用几乎还未开始，特别需要做一些勇敢的探索。"],"q":"话语分析法，即对超出句子层面的语言和语言教学的研究方法。","w":"normal","e":["核心考点"]},{"t":"科学研究是一门学科赖以建立和发展的基础和动力。","y":"判断题","p":["科学研究是一门学科赖以建立和发展的基础和动力。对外汉语教学作为一门新兴学科，其理论体系还有待进一步完善。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"70年代以前第二语言教学研究集中于教学法，70年代以后转向第二语言习得研究，大大拓宽了研究范围。","y":"判断题","p":["从世界第二语言教学研究的情况来看，近几十年来研究范围有很大拓展。70年代以前集中于教学法，70年代以后转向第二语言习得研究，大大拓宽了研究范围。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"实验方法与思辨方法是水火不相容的，在科学研究中不能同时使用。","y":"判断题","p":["但科学的发展使人们认识到，这两种科学方法并非水火不相容，而是相辅相成的，在科学研究中起着互补的作用。","思辨与实证在科学研究的不同阶段发挥着各自的作用，二者不能互相替代，是缺一不可的。"],"q":"错误","w":"normal","e":["核心考点"]},{"t":"一门科学从定性分析发展到定量分析，标志着这门科学已达到比较成熟的阶段。","y":"判断题","p":["只有对事物的量的规定性进行分析，才能精确地认识事物及其规律。因此一门科学从定性分析发展到定量分析，标志着这门科学已达到比较成熟的阶段；而定量分析主要用的是数学方法，进行统计和实验。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"观察法是科学研究也是教育研究中最基本、最普遍的方法。","y":"判断题","p":["观察法是科学研究也是教育研究中最基本、最普遍的方法。它是在自然的条件下，有目的有计划地通过观察而感知研究对象以获得实例的方法。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"经验总结法可以说是对外汉语教学学科用得最多的方法。","y":"判断题","p":["经验总结法可以说是本学科用得最多的方法。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"调查法与观察法的不同之处在于调查法是一种间接的观察法，因而不受时空的限制。","y":"判断题","p":["与观察法相同之处是两者都是在自然状态中获得实例。不同之处在于调查法是一种间接的观察法，因而不受时空的限制，既可以调查现状，也可以调查历史资料，可以调查国内国外的情况。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"话语分析法是对超出句子层面的语言和语言教学的研究方法。","y":"判断题","p":["话语分析法，即对超出句子层面的语言和语言教学的研究方法。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"对外汉语教学学科研究的重点是该学科的基础理论和应用研究，基础理论包括汉语语言学、汉语习得理论、汉语教学理论和______等。","y":"填空题","p":["当然学科研究的重点还是该学科的基础理论和应用研究，就是汉语语言学、汉语习得理论、汉语教学理论和研究方法学等基础理论和总体设计、教材编写、课堂教学、测试评估、教学管理和教师培养等应用研究。"],"q":"研究方法学","w":"normal","e":["核心考点"]},{"t":"对外汉语教学学科研究应汲取的方法论原则包括：从实践出发，理论联系实践；提倡实验方法，______相结合；重视数学方法，定性研究与______相结合；强调系统观点，综合与分析相结合。","y":"填空题","p":["1.从实践出发，理论联系实践。2.提倡实验方法，实证与思辨相结合。3.重视数学方法，定性研究与定量研究相结合。4.强调系统观点，综合与分析相结合。"],"q":"实证与思辨；定量研究","w":"high","e":["2020 真题"]},{"t":"实验法是有意识地使一个变量(______)发生变化，并观察对另一个变量(______)所产生的影响的研究方法。","y":"填空题","p":["实验法是有意识地使一个变量(自变量)发生变化，并观察对另一个变量(因变量)所产生的影响的研究方法。"],"q":"自变量；因变量","w":"normal","e":["核心考点"]},{"t":"调查的具体方法有______、______和测试法等。","y":"填空题","p":["调查的具体方法有访谈法、问卷法和测试法等。"],"q":"访谈法；问卷法","w":"normal","e":["核心考点"]},{"t":"相关程度常用______到______的相关系数表示。","y":"填空题","p":["相关程度常用﹣1.0到+1.0的相关系数表示。"],"q":"﹣1.0；+1.0","w":"normal","e":["核心考点"]},{"t":"个案研究所得出的结论不一定具有普遍意义，因此需要与______研究相参照。","y":"填空题","p":["这一方法的弱点除了费时费力以外，是它所得出的结论不一定具有普遍意义，因此需要与横向规模研究(即对一定规模的群体在某一相同时刻的情况的研究)相参照。"],"q":"横向规模","w":"normal","e":["核心考点"]},{"t":"对外汉语教学研究首先是教育研究，教育学和行为科学的研究方法都可以运用。而______、______、话语分析法则更带有语言教学研究的特色。","y":"填空题","p":["而对比分析法、偏误分析法、话语分析法则更带有语言教学研究的特色。"],"q":"对比分析法；偏误分析法","w":"normal","e":["核心考点"]},{"t":"科学实验方法总是先有一定的______或推论作为其思想基础或实验目标，通过精确的实验设计对非研究变量进行适当的控制。","y":"填空题","p":["而科学实验方法则不同，它总是先有一定的假说或推论作为其思想基础或实验目标，通过精确的实验设计对非研究变量进行适当的控制。"],"q":"假说","w":"normal","e":["核心考点"]},{"t":"对外汉语教学研究使用最多、作为学科用得最多的方法是（　　）。","y":"单项选择题","p":[],"q":"B","w":"high","e":["2019 真题"]},{"t":"对外汉语教学研究要求研究者有意识地使一个变量(自变量)发生变化，并观察对另一个变量(因变量)所产生的影响，这种方法是（　　）。","y":"单项选择题","p":[],"q":"C","w":"high","e":["2020 真题"]},{"t":"下列研究方法中，属于间接的观察法、不受时空限制、有观察法难以达到的广度的是（　　）。","y":"单项选择题","p":[],"q":"B","w":"normal","e":["核心考点"]},{"t":"著名语言学家赵元任先生50年代初发表的、对他的孙女学话过程的跟踪观察与研究，属于下列哪种研究方法？（　　）","y":"单项选择题","p":[],"q":"D","w":"normal","e":["核心考点"]},{"t":"把介于定性分析和定量分析之间的研究方法称为（　　）。","y":"单项选择题","p":[],"q":"C","w":"normal","e":["核心考点"]},{"t":"下列研究方法中，能够进行共时横向比较，也可以进行历时纵向比较的是（　　）。","y":"单项选择题","p":[],"q":"C","w":"normal","e":["核心考点"]},{"t":"“对超出句子层面的语言和语言教学的研究方法”指的是（　　）。","y":"单项选择题","p":[],"q":"D","w":"normal","e":["核心考点"]},{"t":"简述对外汉语教学学科研究的方法论原则。","y":"简答题","p":["(1)从实践出发，理论联系实践。","(2)提倡实验方法，实证与思辨相结合。","(3)重视数学方法，定性研究与定量研究相结合。","(4)强调系统观点，综合与分析相结合。"],"q":"针对对外汉语教学的现状，我们应当汲取的方法论原则主要有：(1)从实践出发，理论联系实践。从实践出发，为实践服务，这是学科研究的根本目的和根本方向；强调实践的观点并不意味着忽视理论的深度。(2)提倡实验方法，实证与思辨相结合。实验方法是科学发展的土壤和理论产生的源泉，而理性的思辨又是进行实验活动、从事科学研究不可缺少的要","w":"high","e":["2020 真题"]},{"t":"简述对外汉语教学学科研究中常用的具体方法。","y":"简答题","p":["(1)观察法。(2)经验总结法。(3)调查法。(4)文献研究法。(5)实验法。(6)个案研究法。(7)相关分析法。(8)对比分析法。(9)偏误分析法。(10)话语分析法。"],"q":"对外汉语教学研究首先是教育研究，教育学和行为科学的研究方法都可以运用。一般的研究方法如观察法、调查法、经验总结法、文献研究法、实验法、个案研究法、相关分析法等，也是本学科通用的研究方法。而对比分析法、偏误分析法、话语分析法则更带有语言教学研究的特色。其中观察法是最基本、最普遍的方法；经验总结法是本学科用得最多的方法；调","w":"normal","e":["核心考点"]},{"t":"简述近几十年世界第二语言教学研究出现的新趋势。","y":"简答题","p":["(1)研究重点从语言扩展到学习者，特别是习得的心理过程和学习者的个体因素。","(2)从仅仅依赖语言学理论扩大为多学科的支持。","(3)对教学内容的研究从语言结构形式发展到意义和功能的研究。","(4)科研方法从定性研究转向定量研究，并提倡定性与定量相结合。"],"q":"从世界第二语言教学研究的情况来看，近几十年来研究范围有很大拓展，呈现一些新的趋势：首先是研究重点从作为语言教育学科客体的语言，扩展到作为学科主体的学习者，特别是学习者第二语言习得的心理过程和学习者的个体因素。第二，学科的研究从仅仅依赖于语言学理论的指导，扩大为从心理学、教育学、心理语言学、社会语言学、文化语言学、跨文化","w":"normal","e":["核心考点"]},{"t":"简述对外汉语教学学科研究的内容。","y":"简答题","p":["学科研究的内容包括学科体系中的各个组成部分。","重点是该学科的基础理论和应用研究。","基础理论包括汉语语言学、汉语习得理论、汉语教学理论和研究方法学等。","应用研究包括总体设计、教材编写、课堂教学、测试评估、教学管理和教师培养等。"],"q":"对外汉语教学学科研究的范围很广，学科体系中的组成部分都是该学科研究的内容。学科研究的重点是该学科的基础理论和应用研究，就是汉语语言学、汉语习得理论、汉语教学理论和研究方法学等基础理论和总体设计、教材编写、课堂教学、测试评估、教学管理和教师培养等应用研究。而课堂教学又分为语音、词汇、语法和汉字教学和听、说、读、写技能训练","w":"normal","e":["核心考点"]},{"t":"试述对外汉语教学学科研究应遵循的方法论原则。","y":"论述题","p":["(1)从实践出发，理论联系实践，这是学科研究的根本目的和根本方向。","(2)提倡实验方法，实证与思辨相结合，实验方法与思辨方法相辅相成、互补。","(3)重视数学方法，定性研究与定量研究相结合，从定性发展到定量标志着科学比较成熟。","(4)强调系统观点，综合与分析相结合，形成“综合——分析——综合”的公式。"],"q":"从事科学研究不能不讲求方法。科学研究方法不仅仅指具体的方法、手段、技巧，更主要的是指正确进行科学研究的理论、原则、方法和手段，它本身就是一个多层次的理论系统。针对对外汉语教学的现状，我们应当汲取的方法论原则主要有：(1)从实践出发，理论联系实践。从实践出发，为实践服务，这是学科研究的根本目的和根本方向。实践的观点是马克","w":"high","e":["2020 真题"]}]},{"id":"yinlun-c10-s02","t":"第二节 对外汉语教学学科建设的任务","w":"high","n":17,"k":[{"t":"学科建设的三项任务","y":"名词解释","p":["吕必松早在1987年就提出了本学科建设的三项任务：改革和完善教学法体系、加强理论研究和加强教师队伍的建设。","十多年来，我们在这三方面已取得了很大成绩，但显然这三项任务仍是我们今天和今后一段时期中的任务。","改革和完善教学法体系，首先必须进行教学法改革。加强理论研究，首先是加强汉语教学理论的研究。加强教师队伍建设，是整个汉语作为第二语言教学领域的当务之急。"],"q":"吕必松早在1987年就提出了本学科建设的三项任务：改革和完善教学法体系、加强理论研究和加强教师队伍的建设。","w":"high","e":["2019 真题"]},{"t":"教学法体系","y":"名词解释","p":["改革和完善教学法体系是本学科建设的三项任务之一。","中外汉语教学工作者普遍对目前汉语教学效果不满意。达到同样的程度，学习汉语所花的时间和精力往往超过学习其他第二语言。","根本原因可能还在于我们没有完全找到针对汉语特点的学习规律与教学规律，汉语作为第二语言的教学法体系还不完善，教学方法还需进一步改革。","目前我国流行的对外汉语教学模式是在80年代中期定型的，它反映的是60~70年代国际语言教学的认识水平。"],"q":"改革和完善教学法体系是本学科建设的三项任务之一。","w":"normal","e":["核心考点"]},{"t":"教师队伍建设","y":"名词解释","p":["加强教师队伍建设是学科建设的三项任务之一。","无论是教学工作还是理论研究工作，都需要人来做。有一支能胜任教学工作、科研工作和教学科研管理工作的高素质的教师队伍，是汉语教学事业发展的最根本的条件。","目前我们的教师队伍的状况远不能适应新世纪汉语教学发展的需要。","除了通过本科和研究生的学历教育培养本专业新一代的教师外，更为重要的、切实可行的措施是在职教师的培训。当前需要大力加强对在职教师的培训。"],"q":"加强教师队伍建设是学科建设的三项任务之一。","w":"high","e":["2020 真题"]},{"t":"加强理论研究","y":"名词解释","p":["加强理论研究是学科建设的三项任务之一。","教学体系的建立，教学效率的提高，有赖于理论的指导。加强理论研究，首先是加强汉语教学理论的研究。","除了教学理论的研究外，语言习得的研究也将是21世纪本学科理论研究的重点。","理论研究的第三个重要方面是对作为第二语言学习和教学内容的汉语的研究。"],"q":"加强理论研究是学科建设的三项任务之一。","w":"normal","e":["核心考点"]},{"t":"吕必松早在1987年就提出了本学科建设的三项任务：改革和完善教学法体系、加强理论研究和加强教师队伍的建设。","y":"判断题","p":["吕必松早在1987年就提出了本学科建设的三项任务：改革和完善教学法体系、加强理论研究和加强教师队伍的建设。"],"q":"正确","w":"high","e":["2019 真题"]},{"t":"加强教师队伍建设是整个汉语作为第二语言教学领域的当务之急。","y":"判断题","p":["加强教师队伍建设是整个汉语作为第二语言教学领域的当务之急。"],"q":"正确","w":"high","e":["2020 真题"]},{"t":"目前我国流行的对外汉语教学模式是在80年代中期定型的，它反映的是60~70年代国际语言教学的认识水平。","y":"判断题","p":["正如一些学者所指出，目前我国流行的对外汉语教学模式是在80年代中期定型的，它反映的是60~70年代国际语言教学的认识水平。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"语言习得的研究也将是21世纪本学科理论研究的重点。","y":"判断题","p":["除了教学理论的研究外，语言习得的研究也将是21世纪本学科理论研究的重点。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"吕必松早在1987年就提出了本学科建设的三项任务：______、加强理论研究和______。","y":"填空题","p":["吕必松早在1987年就提出了本学科建设的三项任务：改革和完善教学法体系、加强理论研究和加强教师队伍的建设。"],"q":"改革和完善教学法体系；加强教师队伍的建设","w":"high","e":["2019 真题"]},{"t":"加强理论研究，首先是加强______的研究。","y":"填空题","p":["加强理论研究，首先是加强汉语教学理论的研究。"],"q":"汉语教学理论","w":"normal","e":["核心考点"]},{"t":"除了通过本科和研究生的学历教育培养本专业新一代的教师外，更为重要的、切实可行的措施是在职教师的______。","y":"填空题","p":["除了通过本科和研究生的学历教育培养本专业新一代的教师外，更为重要的、切实可行的措施是在职教师的培训。当前需要大力加强对在职教师的培训。"],"q":"培训","w":"normal","e":["核心考点"]},{"t":"下列不属于吕必松1987年提出的学科建设三项任务的是（　　）。","y":"单项选择题","p":[],"q":"D","w":"high","e":["2019 真题"]},{"t":"被认为是汉语教学事业发展最根本的条件是（　　）。","y":"单项选择题","p":[],"q":"C","w":"normal","e":["核心考点"]},{"t":"提高教学效率、建立教学体系，有赖于（　　）。","y":"单项选择题","p":[],"q":"B","w":"normal","e":["核心考点"]},{"t":"简述对外汉语教学学科建设的三项任务。","y":"简答题","p":["(1)改革和完善教学法体系。","(2)加强理论研究。","(3)加强教师队伍的建设。"],"q":"吕必松早在1987年就提出了本学科建设的三项任务：改革和完善教学法体系、加强理论研究和加强教师队伍的建设。(1)改革和完善教学法体系。中外汉语教学工作者普遍对目前汉语教学效果不满意，根本原因可能还在于我们没有完全找到针对汉语特点的学习规律与教学规律，汉语作为第二语言的教学法体系还不完善，教学方法还需进一步改革。(2)加","w":"high","e":["2019 真题"]},{"t":"简述改革和完善对外汉语教学法体系的主要措施。","y":"简答题","p":["(1)改革教学方法，首先应当研究并借鉴其他第二语言教学行之有效的原则和方法。","(2)改革教学方法，需要很好地处理教学中的一系列关系问题。","(3)改革教学方法，特别需要针对汉语的特点，加强对汉语特殊规律的研究。","(4)改革教学法需要教学手段现代化。"],"q":"改革和完善对外汉语教学法体系，首先必须进行教学法改革，主要措施有：(1)改革教学方法，首先应当研究并借鉴其他第二语言教学行之有效的原则和方法，当前第二语言教学界强调培养跨文化的语言交际能力。(2)改革教学方法，需要很好地处理教学中的一系列关系问题，如“以学生为中心”和“以教师为主导”的关系，语言知识教学和语言技能训练的","w":"normal","e":["核心考点"]},{"t":"病例：小王是某高校对外汉语专业的研究生，准备以“外国留学生汉语写作能力的发展”为题撰写学位论文。他打算这样研究：先根据自己平时上课的感受写一篇论文，结合几篇国外文献，把自己的经验和思考罗列出来，得出结论。他的导师建议他改进研究方法。请根据对外汉语教学的研究方法论原则和具体方法，分析小王研究设计的问题，并为他提出改进建议。","y":"案例分析题","p":["小王的研究违反了“从实践出发，理论联系实践”的方法论原则，只罗
