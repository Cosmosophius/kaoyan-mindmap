。","w":"high","e":["2024 真题"]},{"t":"中介语","y":"名词解释","p":["美国语言学家塞林克于1969年提出中介语(interlanguage)的概念，1972年在其著名论文《中介语》中提出的中介语假说。","中介语是指在第二语言习得过程中，学习者通过一定的学习策略，在目的语输入的基础上所形成的一种既不同于其第一语言也不同于目的语、随着学习的进展向目的语逐渐过渡的动态的语言系统。","中介语既指学习者语言发展的任何一个阶段的“静态”语言系统，可以把它看做是某一阶段的“切片”；也是指学习者从零起点到靠近目的语的语言发展轨迹，可以把它看做是各阶段相接而形成的一种连续体。","中介语在其发展过程中的任何一个阶段都是学习者创造的一种介于第一语言和目的语之间的独特的语言系统；中介语不是固定不变的，而是一个不断变化的动态语言系统。"],"q":"11.中介语不是固定不变的，而是一个不断变化的动态的 。","w":"high","e":["2020 真题"]},{"t":"中秋节","y":"名词解释","p":["农历八月十五，居秋季之中","赏月、吃月饼、家人团聚","源于古代秋分祭月","嫦娥奔月神话"],"q":"29.中秋节【解析】三大传统节日：春节、端午、中秋。","w":"high","e":["2018 真题"]},{"t":"中轴线","y":"名词解释","p":["都城规划核心原则","南北纵贯对称布局","南起永定门北至钟鼓楼","体现皇权至上居中为尊"],"q":"10.宗教祭祀建筑，其中除清真寺仍保留较多外来影响外，其他多仿照中国宫殿和居住建筑风格，如中轴线突出，左右整齐对称。","w":"high","e":["2024 真题"]},{"t":"临时语境义","y":"名词解释","p":["临时语境义是指一个词在具体语言环境中所派生出的新的临时性词义。","它对语言环境依赖性很大，脱离了具体语境就不存在了。它的产生一般源于人们在特定语境下追求某种特殊的表达效果。"],"q":"(2)词义的内容包括：客观概念义、主观色彩义、固定修辞义、时间空间义以及临时语境义。","w":"high","e":["教材高频"]},{"t":"义素","y":"名词解释","p":["义素是词义系统中不能独立运用的最小的意义单位，是构成义位的区别性语义特征，是从词义分析中抽象出来的观念成分。","义位是可以独立使用的最小意义单位，是词义的最基本构成单位。而义素是不能独立使用的最小意义单位，是构成义位的区别性特征。","义位分解形成义素，不同的义素组合起来形成义位才能构成一个独立运用的意义，义位与义素的关系是整体与部分的关系。"],"q":"13.义素分析的基本原则是 性原则、 性原则和简明性原则。","w":"high","e":["教材高频"]},{"t":"义项","y":"名词解释","p":["义项是字典、词典中按照一个词意义数量分列的项目。","义项有两类：一是可以独立运用的词义，也就是义位；一类是不能独立运用，只是作为构成词或固定短语的语素义。","义位在词典里必定表现为义项，但是义项并不完全等于义位，关键是有的义项只是语素义，不是词义。"],"q":"16.词的反义关系是以义项为基本单位的，所以“老”既是“少(年)”的反义词，又是“新(房子)”的反义词。","w":"high","e":["教材高频"]},{"t":"习得","y":"名词解释","p":["“习得”是在自然的语言环境中，通过旨在沟通意义的言语交际活动，不知不觉(潜意识)地获得一种语言，典型的例子是儿童习得第一语言(一般是母语)。","简言之，习得是潜意识的自然的获得。","习得，特别是儿童第一语言的习得，是从本能的要求(生存和交际的需要)开始、与其生理和心理的自然发育、成熟同步进行的过程，儿童是在不知不觉中习得第一语言的。","习得一般是在使用该目的语的社会环境中进行的；习得时注意力主要集中在语言的功能和意义方面。"],"q":"5.语言习得关键期就是指在青春期以前，由于大脑 侧化尚未完成，左脑和右脑都参与语言习得的这段时期。","w":"high","e":["2019 真题"]},{"t":"习得顺序假说","y":"名词解释","p":["70年代进行的较有影响的研究是杜雷(H. Dulay)和伯特(M. Burt)按照布朗(R. Brown)研究儿童习得母语英语语素顺序的实验方法，率先进行的儿童习得作为第二语言的英语的语素习得顺序(acquisition order)的实验。","这些实验的结果发现，不同母语背景、不同年龄的英语作为第二语言的学习者，有非常相似的英语语素习得顺序。","这一顺序反映在克拉申于1982年列出的九项英语语素习得“自然顺序”表中，他认为从第一组到第四组的习得顺序是固定不变的。","克拉申赞同科德的内在大纲假说，认为人们习得语言规则有一个可以预测的共同顺序：有的先习得，有的后习得。"],"q":"5.内在大纲和习得顺序假说是塞林格提出的。","w":"high","e":["2019 真题"]},{"t":"乡试","y":"名词解释","p":["省级考试三年一次","秋八月举行称秋闱","考中者称举人","第一名称解元"],"q":"3.科举考试中，“连中三元”指的是一个人在乡试、 和殿试中都考取第一名。","w":"high","e":["2024 真题"]},{"t":"书院","y":"名词解释","p":["始于唐、盛于宋","名师主持、学术自由、教研结合","四大书院与朱熹学规"],"q":"9.南宋四大书院是指( )书院、白鹿洞书院、丽泽书院及象山书院。","w":"high","e":["2022 真题"]},{"t":"二十四节气","y":"名词解释","p":["按太阳黄道位置划分","完整见于《淮南子·天文训》","反映季节气候物候变化","2016年列入人类非遗"],"q":"16.二十四节气歌谣里，“春惊春清谷天”中的“清”指的是 。","w":"high","e":["2020 真题"]},{"t":"五大名窑","y":"名词解释","p":["汝、官、哥、钧、定","汝窑天青釉为诸窑之冠","钧窑窑变万彩","定窑白瓷印花刻花"],"q":"25.宋代是中国瓷器发展史上的繁荣阶段，出现了( )、汝窑、官窑、哥窑、钧窑等五大名窑。","w":"high","e":["2023 真题","2018 真题"]},{"t":"五斗米道","y":"名词解释","p":["东汉张陵创立","入道交五斗米得名","又称天师道","尊老子为教主","道教正式形成的标志"],"q":"东汉末年出现大量道教组织，著名的有太平道、五斗米道。","w":"high","e":["2017 真题"]},{"t":"交际文化","y":"名词解释","p":["80年代初，对外汉语教学界的学者张占一等人，从第二语言教学培养交际能力的实际出发，按文化在交际中的功能提出区分“知识文化”和“交际文化”的观点。","交际文化则是指跨文化交际中直接影响信息准确传递(即引起偏差或误解)的语言和非语言的文化因素。","所谓知识文化是指跨文化交际中不直接影响准确传递信息的语言和非语言的文化因素。","交际文化则是指两种语言间规约性的文化差异，是以制约信息模式的形式来参与交际的，可能在交际中引起误解或偏差。"],"q":"9.张占一等人提出了知识文化和交际文化。","w":"high","e":["2018 真题"]},{"t":"交际法","y":"名词解释","p":["交际法又称“交际语言教学”(Communicative Language Teaching)，较早称为“功能法”(Functional Approach)、“意念—功能法”(Notional-Functional Approach)，是以语言功能和意念项目为纲、培养在特定的社会语境中运用语言进行交际能力的一种教学法。","交际法产生于70年代初期西欧共同体国家，中心在英国，创始人为英国语言学家威尔金斯(D. A. Wilkins)。","交际法的语言学理论基础正是60年代兴起、70年代形成高潮的社会语言学，尤其是社会语言学家海姆斯的交际能力理论和功能主义语言学家韩礼德的功能语言理论和话语分析理论，以及威多森的语言交际观。","在心理学方面，交际法受到人本主义心理学和60年代后期兴起的心理语言学的影响，强调以学生为中心。"],"q":"7.交际法最有名的教材是《英语900句》。","w":"high","e":["2020 真题"]},{"t":"交际策略","y":"名词解释","p":["交际策略是学习者为顺利进行语言交际活动(即理解对话者的意图和表达自己的意思)有意识采取的计划措施或方法技巧，是语言使用者交际能力的一部分。","西方学者认为一般是在交际中遇到困难，如语言知识不能应付交际需要或缺乏某一特定的语言表达手段，无法按原定计划实现交际目标时，才采用交际策略。","对第二语言学习者来说，其交际活动在一定意义上也是学习活动的一部分，可以获得把学到的语言知识付诸实践进行运用的机会，是实现培养语言交际能力这一目标所不可缺少的。","各种具体的交际策略，实际上也扩充了学习者的语言表现手段。"],"q":"7.学习者因交际策略而产坐的偏误的主要类型大致有回避、简化、语言转换。","w":"high","e":["2019 真题","2022 445 二、教育学、心理"]},{"t":"交际能力","y":"名词解释","p":["社会语言学家海姆斯在60年代提出了不同的看法，他认为一个人的语言能力不仅指能否说出合乎语法的句子，还包括能否在一定的语言环境中恰当地使用语言的能力。","海姆斯首次提出了“交际能力”（communicative competence）的概念，即运用语言（或非语言手段)进行社会交往的能力，包括传递信息、交流思想和表达感情。","海姆斯还进一步提出了交际能力的四个特征：语法性——指语法上是否正确；可接受性——在交际中能否被接受；得体性——在一定的语境中是否恰当，是否合乎社会文化习惯；现实性——是否是现实中常用的。","交际能力既包括语言能力，也包括语言运用的能力。"],"q":"6.( )是以语言功能和意念项目为纲、培养在特定的社会语境中运用语言进行交际能力一种教学法。","w":"high","e":["2019 真题"]},{"t":"人本主义心理学","y":"名词解释","p":["人本主义心理学是本世纪60年代才在美国兴起的一个心理学流派，创始人是马斯洛，影响最大的代表人物是罗杰斯。","人本主义心理学强调心理学的首要任务是了解人、揭示人性的本质，认为既不要把人神化，也不要把人兽化。","人本主义心理学强调人的价值和尊严，强调人有自由的意志，有发展自身潜能和自我实现的需要。","在人与人的关系中，情感因素起决定作用，反对强迫、压制的方法，而是要启示人的自我意识，促进人的自我实现。"],"q":"5.人本主义心理学是咨询法、默教法等教学法流派的理论基础。","w":"high","e":["2020 真题"]},{"t":"介词","y":"名词解释","p":["多是从动词虚化而来，又叫“副动词”","引进跟谓词有关的对象","跟名词组合成介词短语","主要作状语，也可以作补语"],"q":"17.“把”字句是一种比较特殊的句式，它是用介词“把”将 提到动词的前面的句式。","w":"high","e":["教材高频"]},{"t":"代词","y":"名词解释","p":["具有替代和指示作用","包括人称代词、指示代词、疑问代词三类","不是按照语法功能划分出来的词类，只是在“指代”这一点上有共同点"],"q":"14.代词的主要作用是替代和 。","w":"high","e":["2020 真题"]},{"t":"会意","y":"名词解释","p":["用两个或几个物体的图形的组合产生字义。","会意字是在象形字基础上创造的，所表示的字义可从几个象形字组合的关系上显示出来，所以能把没法直接描画的一些动作、状态表示出来。","这种造字方法，现在仍在少量地应用。"],"q":"A.象形字 B.指事字C.会意字 D.形声字","w":"high","e":["2014 真题"]},{"t":"会试","y":"名词解释","p":["乡试次年春三月京城举行","称春闱或礼闱","考中者称贡士","第一名称会元"],"q":"5.明清会试是全国范围内的考试，每( )年举行一次。","w":"high","e":["2024 真题"]},{"t":"会话分析","y":"名词解释","p":["由于会话是口头表达的一种常见形式，对日常会话的结构与规律进行分析的“会话分析”已成为话语分析的重要组成部分。","70年代美国社会学家萨克斯等分析自然话语，指出会话的特点是“话轮替换”（turn-taking），发话人从头至尾连续的一段话称为一个“话轮”(turn)，会话中每次须保持一人说话。","会话结构的基本单位是“毗邻应对”(adjacency pair)，即会话双方的发话与应对一前一后紧密相连；有时也会出现“插入序列”甚至出现打断发话者的“分岔序列”。"],"q":"3.会话分析(六)简答题(每小题5分，共15分)","w":"high","e":["2016 真题"]},{"t":"会话含义","y":"名词解释","p":["对“会话含义”（conversational implicature）的研究实际上就是对会话中说话者的言外之意的研究。","所以会话含义是指会话中说话者因违反“合作原则”而产生的言外之意。","但在实际语言交际中，人们常常出于某种礼貌或其他目的，故意违反这些合作原则，从而产生言外之意让听话者去领会。","格赖斯会话含义理论后来不断得到补充和完善。"],"q":"30.目前，语用学的研究，据莱文森的归纳，有指示语、会话含义、前提、言语行为和会话结构五个方面。","w":"high","e":["2018 真题","2023 354 一、名词解释（每"]},{"t":"传承词","y":"名词解释","p":["传承词是指从古代、近代汉民族语言词汇中流传下来而为现代汉语词汇所承接的词。","传承词是现代汉语词汇的核心部分，属于基本词汇。传承词所指称的事物和现象从古代到现代都与人们的日常生活息息相关，因此具有较强的生命力。","传承词主要包括表示自然现象和事物、生产和生活资料、时量和空间概念、事物性质状态、人体部位和器官、动作行为和变化、亲属人称指代、事物或行为关系等八类。传承词具有共时的普遍性、历时的稳定性、构词的能产性三个特点。"],"q":"传承词，是指古代、晋代汉民族语言词汇中流传下来而为现代汉语词汇所承接的词。","w":"high","e":["教材高频"]},{"t":"信度","y":"名词解释","p":["信度又称可靠性，指测试结果的可靠程度或稳定性，也就是考试成绩是否反映了受试者的实际水平。","测量的工具要固定。松紧带不能用来作测量的尺子。语言测试是测量语言的工具，这把尺子也要固定。","一般从三个方面衡量测试的信度：(1)测试的稳定性(stability)，也称再测信度；(2)测试的等值性(equivalence)，也称为复本信度；(3)测试的内部一致性(internal consistency)，常用分半法。","影响信度的因素有：测试的题量、试题的同质性、试题的区分性、受试者水平的多样性、评分的客观性。"],"q":"13.测试的信度一般可以测试的同质性、区分性、客观性三个方面衡量。","w":"high","e":["2021 真题"]},{"t":"假借","y":"名词解释","p":["本无其字依声托事","借用同音字记录新词","如“其”借为代词","属用字法"],"q":"7. B【解析】古代汉字有象形、指事、会意、形声四种造字法，还有转注、假借两种用字法。","w":"high","e":["2011 真题"]},{"t":"偏旁","y":"名词解释","p":["偏旁就是用二分法对合体字进行一次性切分而获得的结构单位，可分为“形旁”和“声旁”两类。","形旁通常表示该字的意义类别，声旁通常表示该字的大致读音。","多数形声字由一个形旁和一个声旁组成；会意字的两个偏旁都属于形旁。","通用汉字的偏旁约有1500个。"],"q":"5.部首是指具有字形归类作用的偏旁。","w":"high","e":["2012 真题","2018 真题"]},{"t":"偏误分析","y":"名词解释","p":["偏误分析(Error Analysis)是对学习者在第二语言习得过程中所产生的偏误进行系统的分析，研究其来源，揭示学习者的中介语体系，从而了解第二语言习得的过程与规律。","科德是偏误分析最早的倡导者。","偏误分析的心理学基础是认知理论，语言学基础则是乔姆斯基的普遍语法理论。","第二语言习得过程被看成是规则形成的过程，即学习者不断从目的语的输入中尝试对目的语规则做出假设，并进行检验与修正，逐渐向目的语靠近并建构目的语的规则体系。"],"q":"14.偏误分析的心理学基础是( )理论，语言学基础是乔姆斯基的普遍语法理论。","w":"high","e":["2020 真题"]},{"t":"偏误分析是对比分析的继承和发展。","y":"判断题","p":["偏误分析是对比分析的继承和发展，在中介语理论影响下，突破了对比分析只强调第一语言干扰的局限，弥补了对比分析的不足。"],"q":"(1)偏误分析是对比分析的继承和发展。","w":"high","e":["2020 真题"]},{"t":"儿化音节","y":"名词解释","p":["现代汉语书面语中还有少量用两个汉字记录一个音节的，例如“花儿”（huār）、“画儿”（huàr）等，这类音节在汉语中称为儿化音节，是在一个音节的末尾附加卷舌动作。","这个卷舌动作发出的音并不构成一个独立完整的音节。","一个汉字记录的语音单位基本上是一个音节。"],"q":"用汉语拼音字母拼写儿化音节，只需在原来的音节之后加上“r”(表示卷舌作用) 就可以了。","w":"high","e":["教材高频"]},{"t":"元曲四大家","y":"名词解释","p":["关汉卿、白朴、马致远、郑光祖","关汉卿为四大家之首，代表作《窦娥冤》","与唐诗宋词并称"],"q":"19.王实甫是元曲四大家之一。","w":"high","e":["2020 真题"]},{"t":"元认知策略","y":"名词解释","p":["元认知策略就是学习者通过计划、监控和评估等方式对自己的认知过程进行反思和研究。","元认知可以说是对认知的认知，是一种深层次的认知活动，是学习者对自己的能力特点、对认知任务和认知策略的认知。","并通过认知活动中的体验，对认知过程和认知策略进行自我监控和调节，以保证学习活动的成功。","如学习者通过学习成绩的反馈发现自己学习方法的问题，通过与其他人学习策略和学习结果的对比，发现相互之间的差异，从而取长补短提高自己的学习效率。"],"q":"15.评估【解析】考查元认知策略的四大步骤。","w":"high","e":["2022 真题","2026 445 二、教育学、心理"]},{"t":"元音","y":"名词解释","p":["气流振动声带","发音部位不受阻碍","又叫母音","主要功能是构成音节的韵母"],"q":"2.汉语的音节结构， 必不可少，它是音节中的主要元音。","w":"high","e":["2012 真题","2018 真题"]},{"t":"先天论","y":"名词解释","p":["先天论又称“内在论”，代表人物是乔姆斯基，是在乔姆斯基语言学理论、特别是80年代初提出的“普遍语法”理论基础上的儿童第一语言习得理论。","乔氏认为语言不像行为主义者所说的是“习惯的总和”，而是由抽象规则构成的复杂的体系。","人们习得语言绝不是单纯的模仿记忆，而是要把这些复杂的规则“内化”(internalization)，达到自动运用的程度，成为理解和产生言语的基础。","乔氏认为人类先天具有一种习得语言的特殊能力，表现为儿童头脑中有一种受遗传因素决定的“语言习得机制”(language acquisition device，简称LAD)。"],"q":"9.第一语言习得的“先天论”又称“内在论”，代表人物是奥古斯都。","w":"high","e":["2019 真题"]},{"t":"全身反应法","y":"名词解释","p":["全身反应法(简称TPR)于60年代初期产生于美国，盛行于70年代，创始人是美国实验心理学家阿舍尔(James T. Asher)。","这种教学法强调语言学习行为的协调，通过身体动作教授第二语言，主要用于美国移民儿童的英语教育。","全身反应法是以儿童习得第一语言的理论为依据。","其实比阿舍尔早半个世纪，第一次大战时帕默就提出过第二语言听说读写的教学顺序，主张理解能力先于表达能力，还在其著作《通过动作学英语》中竭力提倡在教学的第一阶段让学生做执行教师指令的训练。","逐渐形成了各种以听力领先、从较长期的听力理解训练开始的“领会教学法”(Comprehension Approach)，全身反应法则是其中最具代表性、且影响最大的一种。"],"q":"全身反应法是心理学教授詹姆士·阿歇尔(James Asher)1966年提出的一种教学方法。","w":"high","e":["2019 真题","2021 445 二、教育学、心理"]},{"t":"六书","y":"名词解释","p":["“六书”是指象形、指事、会意、形声、假借、转注。","目前主流看法认为假借、转注是用字手段，象形、指事、会意、形声才是造字方法。","造字法，通常采用传统的“六书”来分析。"],"q":"1. “六书”是指《诗经》、《尚书》、《礼记》、《周易》、《乐经》、《春秋》。","w":"high","e":["2011 真题","2017 真题","2017 真题","2023 真题"]},{"t":"六礼","y":"名词解释","p":["《仪礼·士昏礼》所载六道程序","纳采、问名、纳吉、纳征、请期、亲迎","纳征送聘礼，亲迎为最后环节","确立传统婚姻礼仪规范"],"q":"1.从周代起，嫁娶时需行“六礼”：采纳、问名、 、纳征、请期、亲迎。","w":"high","e":["2017 真题"]},{"t":"关键期","y":"名词解释","p":["据此，伦尼伯格于60年代提出语言习得“关键期”（critical period)或称“临界期”假说。","所谓语言习得关键期，就是指在青春期(12岁左右)以前，由于大脑语言功能侧化尚未完成，左脑和右脑都能参与语言习得的这段时期。","此时大脑灵活，可塑性大，因而比较容易习得语言。这是习得母语的最佳时期。","对语言习得关键期的假说，也存在不同看法。有的研究显示，婴儿一出生，大脑左半球就有对语音敏感的倾向，到四五岁大脑功能侧化就已基本完成。"],"q":"5.语言习得关键期就是指在青春期以前，由于大脑 侧化尚未完成，左脑和右脑都参与语言习得的这段时期。","w":"high","e":["2018 真题"]},{"t":"兼语词组","y":"名词解释","p":["由一个述宾词组跟一个主谓词组套叠而成","述宾词组的宾语兼任主谓词组的主语","典型兼语词组的谓语动词往往带有使动性"],"q":"17.下列短语中( )是兼语词组。","w":"high","e":["教材高频"]},{"t":"内在大纲","y":"名词解释","p":["科德于1967年在其《学习者言语错误的重要意义》一文中提出，第二语言学习者在语言习得的过程中有其自己的内在大纲(built-in syllabus)。","而学习者的种种偏误正是这种内在大纲的反映。","学习者不是被动地服从教师的教学安排、接受所教的语言知识，而是跟儿童习得母语一样，有其自身的规律和顺序。这一顺序并非完全按照语言形式的难易，有迹象显示它与课堂上所教的语法规则的顺序并不一样。","内在大纲实际上是人类掌握语言的客观的、普遍的规律，教师只能在有限的范围内控制教学过程，无法完全控制学习者对输入的语言的内化过程。"],"q":"5.内在大纲和习得顺序假说是塞林格提出的。","w":"high","e":["2019 真题"]},{"t":"分封制","y":"名词解释","p":["周天子分封土地人民","对象为王族功臣先代贵族","诸侯承担纳贡朝觐义务"],"q":"3.分封制和宗法制是商末周初形成的。","w":"high","e":["2022 445 一、中外文化及跨"]},{"t":"制度文化层","y":"名词解释","p":["规范自身行为的准则","调节相互关系的制度规范","介于物态与心态之间"],"q":"5. B【解析】制度文化层，由人类在社会实践中建立的各种社会规范构成。","w":"high","e":["2025 445 一、中外文化及跨"]},{"t":"刺激—反应论","y":"名词解释","p":["刺激—反应论是行为主义心理学的理论，盛行于40年代和50年代，代表人物是斯金纳，是关于第一语言习得的主要理论之一。","行为主义者认为语言不是先天所有而是后天习得的，强调外部条件在第一语言习得过程中的作用。","这种行为跟人类的其他行为一样，是通过刺激—反应—强化的模式养成习惯而学会的；婴儿来到世界时像一张白纸，对这个世界、对语言没有任何先天的知识，完全由环境来塑造其行为。","儿童学话就是对环境所给予的刺激做出相应的反应，开始是对成人语言的模仿，如果模仿得比较接近，就从成人那儿得到奖励或赞许，这样他的反应就得到了强化。"],"q":"心理学基础是行为主义心理学的刺激-反应论，认为言语行为是通过刺激与反应的联结并加以强化而形成习惯，强调第二语言教学要通过大量的模仿和反复操练养成新的语言习惯。","w":"high","e":["2018 真题"]},{"t":"前摄抑制","y":"名词解释","p":["干扰信息保持的因素有两类：一类是前边的学习活动对现在的记忆的保持所产生的影响，称为前摄抑制，也就是旧的记忆干扰新的记忆；另一类是后边的学习活动对现在的记忆保持所产生的影响，称为倒摄抑制，也就是后边的新的记忆干扰旧的记忆。","实验证明：两种学习活动的内容或材料完全相同或完全不同时，不会引起抑制；只有当二者既有相同又有不同处时才产生因内容类似而引起的抑制，特别是相同与不同各占一半时，引起的抑制最大。","为防止这两类抑制的作用，第二语言教学中尽可能把近似的材料分隔开学习。"],"q":"7.旧的记忆干扰新的记忆，或者说前边的学习活动对现在的记忆的保持产生的影响称为前摄抑制。","w":"high","e":["2018 真题"]},{"t":"功能","y":"名词解释","p":["交际法一反其他教学法以语法或句型结构为纲的传统做法，明确提出以功能意念为纲。","功能是用语言做事，完成一定的交际行为。","交际大纲把语言功能分为六类：传达与了解实际情况；表达或了解理智性的态度；表达或了解道义上的态度；表达或了解情感性的态度；请人做事；社交。","以“邮局在哪儿?”这个句子为例，其功能是询问。"],"q":"21.区别词的主要语法功能是做定语，不能做谓语。","w":"high","e":["2019 真题","2020 真题","2021 真题"]},{"t":"功能主义语言学","y":"名词解释","p":["60年代末、70年代功能主义语言学兴起，标志着语言研究重点由语言形式转向语言功能，这是语言学研究领域又一次拓宽。","功能主义学派的代表人物有英国的韩礼德、法国的马丁内等著名语言学家，中心在欧洲。","以弗斯为奠基人的伦敦功能结构语言学派认为语言的本质是意义——语言环境中的意义，语义是语言研究的中心，主张从社会的角度去观察、研究语言，强调语言的社会性。","韩礼德继承和发展了弗斯的理论，建立了系统——功能语法理论，以“系统语法”为框架论述语言功能。"],"q":"6.对比分析的语言学理论基础是功能主义语言学。","w":"high","e":["2020 真题"]},{"t":"动机","y":"名词解释","p":["动机(motivation)在情感因素中又占极其重要的地位。动机是激励个体从事某种行为的内在动力，常表现为为达到某种目的而付出努力的愿望。","调查结果发现，在影响第二语言学习的诸因素中，动机占33%，学能占33%，智力占20%，其他占14%。","第二语言习得的动机是推动学习者学习并达到掌握第二语言目的的一种强烈愿望，包括目的、要达到目的的愿望、对学习的态度和努力行动四个方面。","动机有内部动机和外部动机之分，内部动机是个体自身所产生的动力，外部动机是外部因素作用的结果；动机还有近景动机和远景动机之分。"],"q":"10.外部动机是指与学习活动直接联系、具体、局部的动机。","w":"high","e":["2021 真题"]},{"t":"助词","y":"名词解释","p":["黏着在词或短语上面，表示附加意义","附着在后面的一律读轻声","结构助词：的、地、得","时态助词：了、着、过","其他助词：似的、所、给、看、来、把、们、第、初、等"],"q":"12.不能充当句子成分的词叫 ，包括介词、 、助词和 。","w":"high","e":["2017 真题"]},{"t":"化石化","y":"名词解释","p":["中介语的偏误有顽固性，语言中的某一部分可能会停滞不前，产生“僵化”或“化石化”(fossilization)的现象，特别表现在语音方面。","僵化的原因是多方面的。","可能是第一语言的影响无法消除；也可能是学习者意识到该偏误并不妨碍交际、甚至还得到过积极的反馈，便满足于已取得的进步而停滞不前；还可能是对目的语的某些方面形成偏见无法接受等。","第二语言学习者完全达到目的语的彼岸、具有说母语者的水平的情况很少，大部分学习者可能一辈子使用的都是中介语。"],"q":"语言中的某一部分可能会停滞不前，产生“僵化”或“化石化”(fossilization) 的现象,特别表现在语音方面。","w":"high","e":["2020 真题"]},{"t":"区分性","y":"名词解释","p":["区分性指测试区分受试者知识和能力差别的性能，是试题的质量标准。","如果受试者的水平高低不同而测试的成绩却很接近，不能把水平高和水平低的受试者区分开来，说明该考试的区分性差。","测试的区分性从试题的难易度和试题的区分度两方面考虑。","试题的难易度指试卷中应包括适当比例的难易程度不同的试题。试题的区分度指试题能区分受试者水平差异的程度，它与难易度相关，是更重要的指标。"],"q":"13.测试的信度一般可以测试的同质性、区分性、客观性三个方面衡量。","w":"high","e":["2021 真题"]},{"t":"区别词","y":"名词解释","p":["又叫“非谓形容词”","不能作谓语、主语、宾语，也不能受数量短语修饰","单独只能作定语","跟“的”构成“的”字结构"],"q":"21.区别词的主要语法功能是做定语，不能做谓语。","w":"high","e":["2018 真题"]},{"t":"单义词","y":"名词解释","p":["单义词是指一个语音形式只有一个意义的词。","单义词主要包括以下类型：事物名词、专有名词、科学术语、称谓名称。"],"q":"20.“桌子、茶杯、钢笔”是单义词，“头、记录、结晶”是多义词。","w":"high","e":["教材高频"]},{"t":"单纯词","y":"名词解释","p":["由一个语素构成的词是单纯词，不存在内部构造问题，但可以根据构词语素的音节特征来划分类型。","根据音节的数量，单纯词可以分为单音节、双音节和多音节三类。","双音节单纯词包括联绵词、叠音词、音译词和拟声词四类。"],"q":"16.“慷慨”和“激昂”都是单纯词。","w":"high","e":["教材高频"]},{"t":"单音单义字","y":"名词解释","p":["单音单义字：即一形对一音一义。这样的字多半不是常用字，而是专用字或较冷僻的字。","现代汉字中许多字只有一个读音。","《汉字信息字典》所收7785个字中，单音字共7038个，占90%。"],"q":"(1)单音单义字：即一形对一音一义。","w":"high","e":["教材高频"]},{"t":"反义词","y":"名词解释","p":["反义词就是属于同一范畴的意义相反或相对的一组词。","根据反义词在意义上是相反的矛盾关系还是相对的反对关系，可以分成两类：绝对反义词和相对反义词。","绝对反义词：肯定一方必否定另一方，否定一方必肯定另一方，二者属于矛盾关系；相对反义词：肯定一方必否定另一方，否定一方不一定肯定另一方，二者属于反对关系。"],"q":"18.“好————不好”“漂亮————不漂亮”是两组反义词。","w":"high","e":["教材高频"]},{"t":"叠音词","y":"名词解释","p":["叠音词是同一个音节重叠而成的单纯词。","叠音词属于双音节单纯词，与重叠式合成词（如“爸爸、常常”）不同。"],"q":"单纯词可分为连绵词、叠音词、音译外来词。","w":"high","e":["教材高频"]},{"t":"古语词","y":"名词解释","p":["古语词是指在古代、近代汉语中使用，而现代汉语出于特殊需要偶尔使用的词语。","根据指称事物的特点，主要包括两类：历史古语词和文言古语词。","历史古语词所指称的事物、现象和观念在历史上曾经存在过或流传过而现在已经不存在或不流传了；文言古语词所指称的事物、现象和观念在现实生活中依然存在，但古代和近代用文言词来表示，而现在用现代汉语词语来表示。"],"q":"一般词汇包括古语词、方言词、外来词、行业语和隐语组成。","w":"high","e":["教材高频"]},{"t":"司母戊鼎","y":"名词解释","p":["商代后期青铜方鼎","1939年安阳武官村出土","重832.84公斤最重青铜器","现藏中国国家博物馆"],"q":"4.在殷墟王陵出土的“后母戊鼎”(原称“司母戊鼎”代表了商代青铜器的最高水平。","w":"high","e":["2019 真题"]},{"t":"合体字","y":"名词解释","p":["合体字是由两个或两个以上部件组合而成的汉字。","象形字、指事字一般属于独体字，会意字、形声字通常属于合体字。","独体和合体在汉字形体演变过程中会互变。"],"q":"8.一般来说，合体字的基本结构关系主要有 结构、 结构和内外结构。","w":"high","e":["2015 真题"]},{"t":"合作原则","y":"名词解释","p":["60年代中期美国语言哲学家格赖斯提出了会话含义理论，他认为会话能顺利进行需要双方互相配合，共同遵守一些基本原则。他提出“合作原则”，包括四项准则。","四项准则：(1)质的准则——所说的话要真实，不要说自知是虚假的话，或缺乏足够证据的话。(2)量的准则——所说的话应包含交谈目的所需要的信息，而不要包含超出需要的信息。(3)关系准则——所说的话必须是有关的，要切题。(4)方式准则——所说的话要清楚，有条理，简练，避免晦涩、歧义。"],"q":"18.会话合作原则由四条准则组成，它们是数量准则、质量准则、 准则和方式准则。","w":"high","e":["2018 真题"]},{"t":"同义词","y":"名词解释","p":["同义词就是意义相同或相近的词。","根据意义相同的程度，同义词可以分成两类：等义词和近义词。","等义词是指意义完全相同的词；近义词是指意义基本相同，但在意义、功能或色彩上存在细微差别的词。"],"q":"14.“天、天空”和“静、安静”分别为单音词和双音词，所以不能构成同义词。","w":"high","e":["教材高频"]},{"t":"同形词","y":"名词解释","p":["同形词是指书写形式相同，语音形式和意义不同的词。","根据语音形式的差异，同形词主要包括四类：声母、韵母相同而声调不同；声母相同而韵母不同或韵母、声调都不同；韵母相同而声母不同或声母、声调都不同；第一个音节相同，第二个音节有轻声与否的差别。"],"q":"9.同形词是指 相同，语音不同，意义也不同的词。","w":"high","e":["教材高频"]},{"t":"同音字","y":"名词解释","p":["同音字是指两个或两个以上的汉字，读音相同、意义不同而且意义没有联系。","同音字按字形是否相同可以分为同形同音异义字和异形同音异义字两类。","狭义的同音字只指同形同音异义字；广义的同音字，除了同形同音字之外，还包括了异形同音字。"],"q":"【解析】同音字是语音形式相同而意义不同的一组词。","w":"high","e":["2014 真题","2021 真题"]},{"t":"同音词","y":"名词解释","p":["同音词是指语音形式(声母、韵母和声调)相同而意义完全不同的词。","同音词包括两类：同音同形词，是指语音形式相同，书写形式也相同而意义不同的词；同音异形词，是指语音形式相同，书写形式和意义都不相同的词。","同音词就来源来说主要有两类：词源不同发音偶合的同音词；词源相同，词义分化而成的同音词。"],"q":"11.同音词是指几个语音相同而 完全不同的词。","w":"high","e":["教材高频"]},{"t":"听说法","y":"名词解释","p":["听说法是本世纪40年代产生于美国的第二语言教学法，强调通过反复的句型结构操练培养口语听说能力，又称“句型法”或“结构法”。","二次大战后期，美国向海外派遣大批军队，为短期内培养受过基本外语口语训练的人员而制订了军队特别培训课程，所以也称为“军队法”。","听说法的语言学理论基础是主张对活的语言(口语)进行仔细的描写分析、不同语言间进行结构对比的美国结构主义语言学。","其心理学理论基础是把人和动物的行为都纳入到刺激—反应轨道之中的行为主义心理学，特别是斯金纳的操作行为主义。"],"q":"6. 的主张与听说法相对立，而重新肯定语法翻译法。","w":"high","e":["2018 真题","2019 真题","2021 真题"]},{"t":"启发式","y":"名词解释","p":["教学方法的根本指导思想是“启发式”，即教师从学生的实际出发，采取各种有效的办法调动学生学习的积极性和主动性，引导他们自己去学习。","与之相反的指导思想是“注入式”，教师单方面地向学生灌输知识，学生被动地接受知识。","显然，启发式符合辩证唯物主义内因和外因互相作用的规律。学生自觉、主动的学习是内因，起着决定性的作用；教师的指引、帮助则是外因。","启发式教学不仅有利于具体教学任务的完成，更重要的是培养了学生的学习能力，养成学生的好的学习习惯。"],"q":"4.教学方法中，与“注入式”相对立的教学指导思想是“启发式”。","w":"high","e":["2019 真题"]},{"t":"唐三彩","y":"名词解释","p":["唐代低温铅釉陶器","以黄绿白三色为主","多为随葬明器","造型有马、骆驼、人物"],"q":"14.唐三彩是唐代彩陶的通称，因为唐代彩陶只用三种釉色故名“唐三彩”。","w":"high","e":["2021 真题"]},{"t":"唐宋八大家","y":"名词解释","p":["唐代韩愈、柳宗元，宋代欧阳修、三苏、王安石、曾巩","倡导古文运动，反对骈文","主张文以明道","确立平易畅达的散文传统"],"q":"13.位居唐宋八大家之首的是 。","w":"high","e":["2023 真题","2017 真题"]},{"t":"四呼","y":"名词解释","p":["开口呼、齐齿呼、合口呼、撮口呼","韵母的分类","有利于揭示声韵配合规律"],"q":"5. n、1跟四呼都能相拼。","w":"high","e":["2012 真题","2016 真题","2022 真题"]},{"t":"四大发明","y":"名词解释","p":["造纸术—东汉蔡伦改进","印刷术—唐雕版、宋活字","火药—唐炼丹、宋军用","指南针—战国司南、宋航海"],"q":"7.中国的四大发明中，对欧洲航海业产生影响的是 。","w":"high","e":["2016 真题"]},{"t":"四大名著","y":"名词解释","p":["《三国演义》《水浒传》《西游记》《红楼梦》","《三国演义》为第一部长篇章回体小说","《红楼梦》前八十回曹雪芹，后四十回高鹗续"],"q":"29.欧洲文学的四大名著是：荷马史诗、《神曲》、《哈姆莱特》、歌德的 。","w":"high","e":["2022 真题","2016 真题"]},{"t":"四定","y":"名词解释","p":["现代汉字规范主要表现在定量、定形、定音和定序上，俗称“四定”。","2001年1月1日起施行的《中华人民共和国国家通用语言文字法》明确规定：“国家推广普通话，推行规范汉字。”"],"q":"12.在汉字标准化工作中，“四定”指的是定量、定形、定音、( )。","w":"high","e":["2013 真题","2020 真题"]},{"t":"四部分类法","y":"名词解释","p":["经史子集四部","经部儒家经典史部历史","子部诸子科技集部诗文","《隋书·经籍志》定型","《四库全书总目》集大成"],"q":"12.子【解析】经、史、子、集四部分类法，始于隋朝，是中国传统文化的产物，适用于传统文化典籍。","w":"high","e":["2017 真题","2022 真题"]},{"t":"固定修辞义","y":"名词解释","p":["固定修辞义是指一个词频繁用作一定的修辞手段并凝固在词义系统中成为词典义项之一。","根据修辞手段的不同，主要分为三类：比喻义、借代义和委婉义。","具有比喻义的如：爪牙、桃李、龙头；具有借代义的如：红娘、纨绔、杜康；具有委婉义的如：有喜、绿帽子、驾崩。"],"q":"(2)词义的内容包括：客观概念义、主观色彩义、固定修辞义、时间空间义以及临时语境义。","w":"high","e":["教材高频"]},{"t":"固定短语","y":"名词解释","p":["固定短语是词与词的固定组合，在长期使用过程中形成了相对完整的意义，在实际使用时作用相当于一个词。","其特点是：(1)其中的词和词序一般不能自由变化；(2)整个短语的意义往往不能按字面意义去理解；(3)与词一样不能拆开，并且具有独立运用能力。","可见，固定短语具有结构的固定性、意义的整体性、功能的独立性。","固定短语主要有两类：一是专用短语，指特定的人物、地方、机构、活动以及会议等的名称；二是惯用熟语，指成语、谚语、歇后语与习用语。"],"q":"15.( )是语言的建筑材料，是词和固定短语的集合体。","w":"high","e":["教材高频"]},{"t":"国子监","y":"名词解释","p":["隋炀帝始设","兼具最高教育行政机关与最高学府","明代监生制度"],"q":"1.王懿荣【解析】1899年秋天，清代国子监祭酒(国子监是我国元、明、清三代设立国家管理教育的最高行政机构和最高学府，国子监祭酒就是这个机构的最高主管者)王懿荣犯疟疾，请太医诊治，太医给他开了一张处方，其中一味药是“龙骨”。","w":"high","e":["2024 真题"]},{"t":"国家对外汉语教学领导小组","y":"名词解释","p":["1987年7月国务院批准成立了由国家教委、国务院外事办公室、外交部、文化部、广播电影电视部、新闻出版署、国家语言文字工作委员会等政府部门及北京语言学院组成的“国家对外汉语教学领导小组”（1998年已扩展为由11个政府部门组成），由当时的国家教委负责人任组长。","日常工作由其常设机构“国家对外汉语教学领导小组办公室”（简称“汉办”）负责，第一任办公室主任为北京语言学院院长吕必松。","1993年国家教委发布的《中国教育改革和发展纲要》中更进一步提出要“大力加强对外汉语教学工作”。"],"q":"28.孔子学院【解析】孔子学院(Confucius Institute),是中国国家对外汉语教学领导小组办公室在世界各地设立的推广汉语和传播中国文化与国学的教育和文化交流机构。","w":"high","e":["2018 真题"]},{"t":"图式","y":"名词解释","p":["认知结构的组成部分又称为图式(schema)，人脑中储存着各种各样的图式，如开车的图式、做饭的图式等。","图式是心理活动的组织结构，也是人类认识事物的基础，是人类向环境学习的产物，同时对新事物的理解和吸收又取决于头脑中已有的图式。","图式随着儿童心理的发展而变化，体现了认知的发展；而认知的发展受同化、顺应、平衡三个基本过程的影响。","图式是通过同化和顺应不断发展的。"],"q":"(2)指范畴成员的概括性图示的表征，原型是范畴的平均属性或几种趋势，是对范畴进行抽象的图式表征。","w":"high","e":["2020 真题"]},{"t":"声母","y":"名词解释","p":["音节开头的辅音","普通话22个辅音有21个可作声母"],"q":"3.声母b p m能同 的韵母相拼，不能同 韵母相拼。","w":"high","e":["2014 真题","2020 真题"]},{"t":"声调","y":"名词解释","p":["音节读音的高低升降","区别意义的重要手段","汉语区别于其他语言的重要特征之一"],"q":"7.虽然汉语词汇丰富，造句千变万化，但汉字的字音却只等于加声调音节的数目，共有1332个。","w":"high","e":["2013 真题","2019 真题"]},{"t":"复合词","y":"名词解释","p":["复合式合成词指由至少两个不同词根组合而成的合成词，这是现代汉语最重要的构词法。","根据词根与词根的意义与结构关系，复合词主要有五种类型：联合型、偏正型、述宾型、补充型、主谓型。","联合型由两个意义相同、相近、相关或相反的词根并列组合而成；偏正型前一个词根修饰限制后一个词根；述宾型前后词根构成支配与被支配的关系；补充型后一个词根补充说明前一个词根；主谓型前一个词根是被陈述对象，后一个表示陈述。"],"q":"9.下列( )组词都属于复合词。","w":"high","e":["教材高频"]},{"t":"外来词","y":"名词解释","p":["外来词是指从外国语或外族语中连音带义吸收来的词语。","在汉语发展史上，外来词的大规模借入主要有四个时期：一是借入西域诸国事物类词语的两汉时期；二是借入佛教词语的魏晋南北朝至唐宋时期；三是借入西方哲学、政治和科技词语的近代时期；四是全面借入外来词的改革开放时期。","现代汉语外来词主要来源于英语、日语、法语、俄语、德语以及境内少数民族语言。"],"q":"12.“可口可乐”是一个音译兼意译的外来词。","w":"high","e":["教材高频"]},{"t":"多义词","y":"名词解释","p":["多义词是指一个语音形式有两个或两个以上既有联系又不相同的意义的词。","多义词的一个意义也被称为一个义项，多义词的各个义项具有以下特点：一是固定性，不是因语境而产生的临时意义；二是关联性，不同的义项之间存在着一定的联系；三是区别性，各个义项保持着自己的特点。","根据多义词所包含的义位和语素义情况，可以分成三种类型：所有义项都是词义的多义词；有些义项是词义而有些义项是语素义的多义词；所有义项都是语素义的多义不成词语素。"],"q":"20.“桌子、茶杯、钢笔”是单义词，“头、记录、结晶”是多义词。","w":"high","e":["教材高频"]},{"t":"多音多义字","y":"名词解释","p":["多音多义字：即一形对数音数义。","所谓多音多义字就是同一个字形却记录不同的读音和不同的字义。","有人统计，在1988年发布的《现代汉语常用字表》3500个常用字中，有多音多义字405个，占总数的11.6%。","多音字节省了造字数量，但同时带来一字异读的麻烦。"],"q":"6.多音多义字【出处】《现代汉语》上册第225页，同音词是音同，但没意义联系。","w":"high","e":["2012 真题","2019 真题"]},{"t":"多音字","y":"名词解释","p":["所谓多音字，是指一个汉字可以有两个或两个以上的读音。","同一个汉字可以有不止一个读音，同一个读音也可以由多个字形共同拥有。","现代汉字中许多字只有一个读音，例如《汉字信息字典》所收7785个字中，单音字共7038个，占90%，而另外10%的字则是多音字。"],"q":"黯然销魂(暗然销魂)班门弄斧(搬门弄斧)破釜沉舟(破斧沉舟)按部就班(按步就班)四、多音字(一)多音多义字所谓多音多义字就是同一个字形却记录不同的读音和不同的字义。","w":"high","e":["2011 真题","2017 真题"]},{"t":"多项选择题","y":"名词解释","p":["多项选择题一般是先提出情景(称为题干)，并提出四个答案的备选项，让受试者选择其中的一个(其余三个叫干扰)，所以也称四项选择题。","这是考查阅读理解和听力理解等语言技能的常用题型，可以考词汇也可考语法。","多项选择题最大的优点是评分客观，因而信度大。可以直接考出编制者想考的问题，使受试者无法回避，因而效度也大。由于答题迅速，因此题量可大。","缺点是不能测表达能力，有25%猜对的概率，命题费时费力。"],"q":"(三)多项选择题(每题2分，共20分)","w":"high","e":["2019 真题"]},{"t":"太学","y":"名词解释","p":["汉武帝设、董仲舒建议","以五经为教学内容","标志封建官学制度确立"],"q":"18.汉代官学有中央办的“太学”和“鸿都门学”，地方政府办的“郡国学”和校、庠、( )等。","w":"high","e":["2017 真题"]},{"t":"字义","y":"名词解释","p":["汉字字形跟字义的关系大致有三类：1.字形记录的是词义；2.字形记录的是语素义；3.字形记录的仅仅是一个音节，它没有字义。","一个汉字在多数情况下，记录的是现代汉语的一个语素。字义也就是语素义。","现代汉字中也有少数用会意法造出来的字还是可以直接从字形推知字义的。"],"q":"10.形声是由表示字义的形旁和表示字音的声旁组合成新字的造字方法。","w":"high","e":["2015 真题"]},{"t":"字体","y":"名词解释","p":["字体指的是同一种文字的各种不同体式。","例如汉字的楷书、行书、草书，印刷的宋体、仿宋体、楷体、黑体等。","至于书法艺术上的种种字体，例如欧体、颜体、柳体，指的是书法的派别，又称“书体”，不属于严格文字学的范围。"],"q":"20.秦始皇统一中国后，下令全国通用的汉字标准字体是 。","w":"high","e":["2013 真题","2019 真题"]},{"t":"字序","y":"名词解释","p":["字序就是汉字排列的先后顺序。","汉字字序的复杂性表现为汉字的排序具有多样性和互补性的特点。","汉字序列法主要有两种：音序法、形序法，形序法又分部首法、笔画法和笔形法。"],"q":"11.目前通行的现代汉字序列法主要是音序法和形序法。","w":"high","e":["2012 真题","2019 真题"]},{"t":"字母词","y":"名词解释","p":["字母词是指汉语中由拉丁字母、希腊字母等西文字母构成的或由它们与符号、数字或汉字混合构成的词。","字母词主要包括三类：英文字母词（包括英语词和英语首字母缩略语）、汉语拼音字母缩略形式、以字母表形的字母词。","字母词的大量出现主要有两个方面的原因：从社会生活考虑，一是国际交流的日趋频繁，二是社会文化水平的普遍提高，三是计算机及其网络的普遍运用；从语言文字本身着眼，一是某些外来词语难以翻译，二是字母词书写经济简便。"],"q":"⑤借音借形词。通常称字母词。例如：OK(行)、WTO(世界贸易组织)、UFO(不明飞行物)、VCD(影碟)、e-mail(电子邮件)、SOS(求较信号)、BP机等。","w":"high","e":["教材高频"]},{"t":"字种","y":"名词解释","p":["所谓的“字种”是指汉字的个体种类(即不同的汉字)，异体字、繁体字、简体字和变体字都不影响字种的数量。","例如“群、羣”以及“众、衆”都只算一个字种。","从汉代到现代，各个时代实际使用的汉字总数都不曾超出一万字。"],"q":"6.世界上文字种类很多，大致可以分为 文字、 文字和语素文字三种。","w":"high","e":["教材高频"]},{"t":"学习策略","y":"名词解释","p":["学习策略(learning strategies)是语言学习者为有效地掌握语言规则系统，发展言语技能和语言交际能力，解决学习过程中所遇到的问题而采取的各种计划、途径、步骤、方法、技巧和调节措施。","研究发现，不同学习者所采用的学习策略有很大的一致性和规律性。","综合看来，学习策略大体上可分为认知学习策略和元认知策略(metacognitive strategies)两大类。","根据最早研究学习策略的茹宾(J. Rubin)所提出的六种认知学习策略，可以概括为求解、推理、实践、记忆、监控几个方面。"],"q":"14.认知学习策略可以概括为求解、 、实践、记忆、监控等几个方面。","w":"high","e":["2020 真题"]},{"t":"学能测试","y":"名词解释","p":["学能测试又称潜能测试或性向测试，目的在于了解受试者学习第二语言的潜在能力和素质。","学习语言的潜能包括：语音的编码、解码能力，语法敏感性，语言的记忆能力，综合归纳能力等。","学能测试是一种预示性的测试。","在决定学习一种语言之前，了解学习者先天条件和素质，对学习者本人和学校都是有价值的。学能测试属于常模参照测试。"],"q":"9.第二语言的测试，按用途可以分为学能测试、成绩测试、( )测试及诊断测试。","w":"high","e":["2019 真题"]},{"t":"宋明理学","y":"名词解释","p":["以儒学为基础吸收佛道","程朱：理在事先、格物致知","陆王：心即是理、致良知、知行合一"],"q":"可以说，宋明理学对汉代以后整个中国文化的发展有一个新的反省，并通过这种反省致力于儒学的复兴。","w":"high","e":["2015 真题","2021 真题"]},{"t":"宗法制","y":"名词解释","p":["血缘关系为纽带","嫡长子继承制为核心","周代确立、大宗小宗"],"q":"3.分封制和宗法制是商末周初形成的。","w":"high","e":["2022 445 一、中外文化及跨"]},{"t":"定位语素","y":"名词解释","p":["一个语素同别的语素组合成词时，位置固定的语素叫定位语素。","根据位置的前后，又分为前置定位语素和后置定位语素。","前缀如：非(非常、非凡、非法、非分等)；后缀如：者(读者、记者、作者、学者等)、化(绿化、美化、净化、激化等)。","一个语素同别的语素组合成词时，位置不固定的语素叫不定位语素，如“电”可以前置（电器、电子、电影），也可以后置（闪电、雷电、水电）。"],"q":"13.语素“电”构词时位置不固定，所以它是一个不定位语素。","w":"high","e":["教材高频","2024 354 一、名词解释（每"]},{"t":"定音","y":"名词解释","p":["定音就是确定现代汉字的规范字音。","《汉语拼音方案》（1958）确定了普通话的声、韵、调系统。","《普通话异读词审音表》（1985年修订稿）对一千多条异读词作了审订和修订，为字音的标准化打下了基础。"],"q":"12.在汉字标准化工作中，“四定”指的是定量、定形、定音、( )。","w":"high","e":["教材高频"]},{"t":"客观概念义","y":"名词解释","p":["从反映对象上看，词义反映的是人们对客观存在的事物、现象及其关系的本质属性的理性认识，理性认识一旦获得语音形式及其书写形式的物质外壳，就成为词义的客观概念义。","概念义也称为客观义、理据义和指称义。客观概念义大致分为两类：指称事物、动作和性质的概念义，可称为实体概念义；指称事物与现象之间关系的概念义，可称为关系概念义。"],"q":"(2)词义的内容包括：客观概念义、主观色彩义、固定修辞义、时间空间义以及临时语境义。","w":"high","e":["教材高频"]},{"t":"对外汉语教学","y":"名词解释","p":["《中国大百科全书·语言文字》中写道：“对外汉语教学是指对外国人的汉语教学。”","实际上也包括对第一语言不是汉语的海外华人进行的汉语教学。","这一名称基本上体现了这个学科的特点和内涵，在国外也产生了广泛的影响，而且简洁上口、符合汉语习惯，因此从1982年提出一直使用至今。","但是十多年的使用也发现这一名称有一定的局限性：它只突出了主要教学对象，未能全面、准确地反映学科性质——第二语言教学。"],"q":"1.从第二语言教学特点出发，对外汉语教学过程可以分为感知、理解、巩固和( )四个阶段。","w":"high","e":["2015 真题","2021 真题"]},{"t":"对外汉语教学过程","y":"名词解释","p":["对外汉语教学过程是根据教学计划和教学大纲的规定，教师和学生共同参与的对外汉语教学活动的过程，也是实施教学、全面完成教学任务的过程。","在这一过程中，学习者在教师的指导和帮助下，逐步培养运用汉语进行交际的能力，对中国文化的了解得以加深，文化素养得到进一步提高，同时其智力也得到发展，从而实现教育的总目的。","教学过程的实质是学习者对目的语和目的语文化的认识过程，是学习者感觉、知觉、记忆、想像、思维、情感等一系列心理活动的过程。在这一过程中，教师和学生是教学活动的两主体。","对外汉语教学过程主要通过课堂教学和课外活动来实现。课堂教学是对外汉语教学的基本组织形式，课外活动是辅助形式。"],"q":"1.从第二语言教学特点出发，对外汉语教学过程可以分为感知、理解、巩固和( )四个阶段。","w":"high","e":["2019 真题"]},{"t":"对外汉语教育学","y":"名词解释","p":["从教育的高度研究对外汉语教学，反映到本学科的名称上，本书主张应与其他学科教育学的名称相一致，即用“对外汉语教育学”比较规范。","这一名称还能更清楚地体现出本学科的性质及其科学定位。","当然，提出“对外汉语教育”并不意味着、实际上也不可能用它来取代已使用近20年之久、早已深入人心的“对外汉语教学”这一名称。"],"q":"4、答案：✔解析：《对外汉语教育学引论》","w":"high","e":["2016 真题"]},{"t":"对比分析","y":"名词解释","p":["对比分析(Contrastive Analysis)是将两种语言的系统进行共时比较，以揭示其相同点和不同点的一种语言分析方法。","把对比分析运用到第二语言教学中来，始于40年代的美国；提出第二语言习得的对比分析假说并建立起对比分析的理论系统的，是拉多。","对比分析的语言学理论基础是结构主义语言学，其心理学的理论基础是行为主义心理学和迁移理论。","对比分析大体上按照描写、选择、对比、预测四个步骤进行。"],"q":"6.对比分析的语言学理论基础是功能主义语言学。","w":"high","e":["2019 真题"]},{"t":"对比分析假说","y":"名词解释","p":["对比分析假说由拉多于50年代中期行为主义鼎盛时期提出，认为第二语言的获得也是通过刺激—反应—强化形成习惯的结果。","拉多认为第二语言与第一语言相似的语言成分容易学，不同的成分则难学；两种语言结构特征相同之处产生正迁移，两种语言的差异导致负迁移。","迁移(transfer)是心理学的概念，指在学习过程中已获得的知识、技能和方法、态度等对学习新知识、技能的影响。这种影响有的起积极、促进的作用，叫正迁移，有的起阻碍的作用，叫负迁移，也叫干扰。","负迁移造成第二语言习得的困难和学生的错误，这就是对比分析假说。"],"q":"8.对比分析假说认为，第二语言学习的主要障碍来自第一语言的干扰。","w":"high","e":["2018 真题","2022 445 二、教育学、心理"]},{"t":"层次分析法","y":"名词解释","p":["分析句法结构层次的方法","是句法分析最基本、最有效的方法之一","正式学名叫“直接成分分析法”（IC）","由布龙菲尔德系统运用到句法结构分析上","分析时尽可能采取二分，俗称“二分法”"],"q":"2.用层次分析法分析下列句子或短语的结构(每小题2分，共计6分)","w":"high","e":["2012 真题","2016 真题","2020 真题"]},{"t":"常用字","y":"名词解释","p":["常用字就是书写现代汉语时经常要用到的字。","汉字总字数很多，通用字的数量也不少，可是人们经常使用的字量并不多，往往只集中在有限的两三千个字种上。","现代汉语常用字的特点：常用性、能产性、稳定性、简易性。"],"q":"10.《现代汉语常用字表》和《现代汉语通用字表》收字分别是 个和 个。","w":"high","e":["2015 真题","2022 真题"]},{"t":"庠序","y":"名词解释","p":["尧舜时期出现的早期学校","庠：养老与教育之所","序：习射之所","后世泛指学校"],"q":"18、答案：序解析：庠序校都是当时的学校。","w":"high","e":["2016 真题"]},{"t":"异体字","y":"名词解释","p":["异体字（也叫异形字）：即数形对一音一义。不同字形之间没有任何音义差别。","经过整理，规定正体字，淘汰异体字形。","异体字指音义都相同仅形不同的字。"],"q":"一、现代汉字形音义分析(一)现代汉字形音义关系的种类现代汉字学的术语中，例如“多音多义字、同音字、异读字、异体字、繁简字、同形字”等，它们的内涵有一些交叉或重叠，这是因为给这些名称命名时的出发点不同，其中考虑到字形、字音、字义这三个方面。","w":"high","e":["教材高频"]},{"t":"异形词","y":"名词解释","p":["异形词是指语义相同或相近，而词的书写形式和语音形式不同的词。","书写形式不同的词主要分为三类：同素颠倒词、异形等义词、异形外来词。","同素颠倒词指语素相同而词序相反的异形词，可以分成取A弃B类、AB并存类、AB分工类；异形等义词指一个语素位置和字形相同，另一个语素位置相同而字形不同的异形词；异形外来词指因引进方法不同或引进地区不同而造成外来词在书写形式和发音形式上都不同。"],"q":"12.“百叶窗”和“百页窗”是异形词，应当规范。","w":"high","e":["教材高频"]},{"t":"异读字","y":"名词解释","p":["异读字：即一形对数音一义。不同读音之间一般没有语义差别，仅仅是不同的人、不同的习惯读法。","异读字原则上应该统读。少数文白异读，目前还保留着。","异读字即多音同形同义字。"],"q":"8.同一个字形记录数音一义，这样的字叫异读字，异读字原则上应该统读。","w":"high","e":["教材高频"]},{"t":"异读词","y":"名词解释","p":["异读词是指意义和书写形式都相同而读音形式不同的词。","造成异读词的原因主要有以下几个方面：(1)读书音(文读)和口语音(白读)的分歧；(2)方言读音的影响；(3)古代汉语多音字沿用至今；(4)语音的自然发展；(5)讹读的影响。","规范异读词读音的三个原则是：合并原则、从俗原则、区别原则。"],"q":"1985年 12月27 日国家语言文字工作委员会、国家教育委员会和广播电视部联合发布了《普通话异读词审音表》，除了少数异读词在实际使用中还有保留的必要外，多数异读词已经统一为一个读音。","w":"high","e":["教材高频"]},{"t":"引申义","y":"名词解释","p":["引申义是引申发展出来的意义。","引申义可以分为三种情况：从本义(基本义)发展出来的引申义；从基本义发展出来的引申义；从引申义发展出来的引申义。"],"q":"比如：词的引申义和比喻义不同，松竹梅在汉语象征人的品德高洁，而在英语中无此意义。","w":"high","e":["教材高频"]},{"t":"形声","y":"名词解释","p":["由形旁与声旁组成，形旁表示大致的字义或字义的类属，声旁提示字的读音或近似的读音。","形声法是汉字最主要的造字方法。","形声法综合利用字形表义和字形表音这两种手段。"],"q":"10.形声是由表示字义的形旁和表示字音的声旁组合成新字的造字方法。","w":"high","e":["2011 真题","2016 真题","2020 真题","2016 真题"]},{"t":"形序法","y":"名词解释","p":["形序法是按照字形的各个方面特点来排列字序的方法。","形序法包括部首法、笔画法、四角号码法等，其中部首法历史最悠久，使用也最普遍。","目前大都采用混合法：A.“笔画——笔形法”，B.“笔形——笔画法”。"],"q":"11.目前通行的现代汉字序列法主要是音序法和形序法。","w":"high","e":["教材高频"]},{"t":"态度","y":"名词解释","p":["态度是构成动机的主要因素之一。它是个体对某种客观事物的评价性反应，是在对事物了解的基础上产生情感上的褒贬好恶，并反映出对之采取行动的倾向性。","西方学者的调查表明，学习第二语言的态度与所取得的学习成绩之间的关系高于学习其他科目的态度与成绩之间的关系。","影响学习态度的几个方面是：对目的语社团和文化的态度、对目的语的态度、对课程和教师、教材的态度。","对大多数学习者来说直接影响其目的语学习态度的还是他们在语言课堂上的感受。"],"q":"24.“今天星期五”和“态度热情”都是主谓词组。","w":"high","e":["2019 真题"]},{"t":"总体设计","y":"名词解释","p":["总体设计是吕必松在80年代初根据对外汉语教学事业创立时期教学活动处于经验型的探索阶段、缺乏科学性和规范性的实际情况提出的理论。","他把对外汉语教学看做是一项系统工程，认为总体设计是“根据语言规律、语言学习规律和语言教学规律，在全面分析第二语言教学的各种主客观条件、综合考虑各种可能的教学措施的基础上选择最佳方案，对教学对象、教学目标、教学内容、教学途径、教学原则以及教师的分工和对教师的要求等做出明确的规定，以便指导教材编写(或选择)、课堂教学和成绩测试，使各个教学环节成为一个互相衔接的、","他并把总体设计以及根据总体设计而进行的教材编写、课堂教学和语言测试看做是对外汉语教学活动的四大环节。"],"q":"4.错【解析】教材是总体设计的具体体现，反映了培养目标、教学要求、教学内容、教学原则；","w":"high","e":["2019 真题"]},{"t":"情态色彩义","y":"名词解释","p":["情态色彩义是指附着在词义上与其概念义同时存在的主观情感和态度。","情态色彩义主要分成两类：情感色彩和态度色彩。","情感色彩主要分为褒义词和贬义词，大部分词义不带固定的情感色彩，属于中性词。态度色彩主要是指人的态度倾向，如表谦虚、客气、敬重、鄙薄、强硬等态度。"],"q":"②主观色彩义，分为情态色彩义和语体色彩义。","w":"high","e":["教材高频"]},{"t":"情感过滤假说","y":"名词解释","p":["情感过滤假说也称屏蔽效应假说，是克拉申输入假说理论的重要组成部分。","第二语言学习者在学习和生活中有各种各样接触目的语的机会，这都是输入，但输入的语言信息有时并没有被吸收。","人类头脑中这种对语言的堵塞现象，是由于情感对输入的信息起了过滤作用，称为“情感过滤”(the affective filter)，或者说成为把输入挡在外边的屏障。","而造成这种过滤或屏障的主要是一些心理因素，如学习的动力、对所学语言的态度、自信心、是否紧张焦虑、是否处于防卫状态、怕出丑，甚至精神和身体状况不佳都能产生屏蔽效应，挡住输入。"],"q":"监控模式中的五个理论假说，分别是：输人假说、习得/学习假说、监控假说、自然顺序假说、情感过滤假说。","w":"high","e":["2025 真题","2023 445 二、教育学心理学"]},{"t":"情景法","y":"名词解释","p":["情景法是本世纪二三十年代产生于英国的一种以口语能力的培养为基础、强调通过有意义的情景进行目的语基本结构操练的教学法。","情景法早期称为口语法(Oral Approach)，代表人物为英国著名语言教育家帕默(H. E. Palmer)和霍恩比(A. S. Hornby)。","情景法的语言学理论基础是英国的结构主义，口语被认为是语言的基础，准确的结构是说话能力的核心。","情景法的心理学基础是行为主义的习惯形成理论，强调学生通过模仿形成正确的语言习惯。","帕默认为学习语言有两种能力：一种是有意识的学习能力，另一种则是天赋的自然学习能力，这应看做是最早提出的区分语言学习与习得的理论。"],"q":"1.情景法的心理学基础是行为主义的 。","w":"high","e":["2019 真题"]},{"t":"惯用语","y":"名词解释","p":["惯用语是群众口头创造并通过修辞手段准确、生动、形象、概括地揭示某些社会现象和某种行为的熟语。","从结构上看，典型的惯用语以三音节的动宾结构为主，也有部分偏正短语，少数主谓短语。","惯用语的整体意义不是其构成成分简单相加的意义，而是通过比喻、借代、夸张、比拟等手法所表达的修辞意义。"],"q":"7.现代汉语惯用语特点是形式整齐，结构定型。","w":"high","e":["教材高频"]},{"t":"意念","y":"名词解释","p":["意念指功能作用的对象，也就是功能的具体内容，常用来回答“什么”、“谁”的问题。","意念又分为普通意念和特殊意念。","普通意念指与功能相关的时、空、数量等关系，比如表示存在、空间、时间、数量、质量、心理关系、指代等，适用于各种话题和背景，是所有学习者都必须掌握的，与功能称为“共核”。","特殊意念是由话题直接决定的词汇项目，也就是各类词汇，如个人身份、住处、业余爱好、旅行、健康福利等。"],"q":"6.( )是以语言功能和意念项目为纲、培养在特定的社会语境中运用语言进行交际能力一种教学法。","w":"high","e":["2020 真题"]},{"t":"意符","y":"名词解释","p":["凡是跟整字在意义上有联系的部件，称为“意符”。","对现代汉字构形成分进行分析，得到的是构字部件；构字部件的属性，指的是部件跟整字在音义上的关系，这可以分为三类：意符、音符和记号。","汉字的意符，也叫形旁，在传递语义信息上的功能，是单纯的表音文字所不具备的。"],"q":"4.偏旁一般分为形旁(意符)和声旁(形符)两类，会意字因为没有声旁，所以分析不出偏旁来。","w":"high","e":["教材高频"]},{"t":"成绩测试","y":"名词解释","p":["成绩测试又称课程测试，是一门课程或课型的测试，目的是检查学习者在某一教学阶段是否掌握了教学大纲和教材所规定的教学内容，在学习上取得什么成果。","测试的内容以课程的教学大纲和教材为依据，教什么考什么。","这是一种回顾性的测试，目的在于了解学习者目前所达到的程度，是与一个较长期的目标相联系的。受试者获得的成绩是绝对的。","成绩测试是教学中用得最多的测试，学校的期中期末考试、毕业考试等都属于这一类。"],"q":"15.成绩测试和诊断测试要求有较高的 效度。","w":"high","e":["2019 真题","2021 真题"]},{"t":"成词语素","y":"名词解释","p":["能够独立成词的语素是成词语素。","不能独立成词的语素是不成词语素，它只是词语的构成单位。","成词语素如：他、书、看、来、好、就、很、也、了、被、呢、吗、葡萄、牡丹、啰唆、朦胧等；不成词语素如：童(心)、日(子)、衣(服)、朗(读)、历(史)、肃(清)、(人)民、(丢)失等。"],"q":"13.语素可分为成词语素和不成词语素两种。","w":"high","e":["教材高频"]},{"t":"成语","y":"名词解释","p":["成语是人们从历史上传承下来并长期使用的结构凝固、语义精辟且具有民族特点的熟语。","成语是熟语中最重要的一种，主要有四个特点：历史的传承性、结构的凝固性、意义的整体性、习用的民族性。","成语主要来源包括神话寓言、历史故事、诗文语句、口头俗语。"],"q":"16.成语基本特征有意义的整体性和 ( )。","w":"high","e":["教材高频"]},{"t":"扩展法","y":"名词解释","p":["扩展法就是在一个语言单位内部插入其他成分，来观察语言单位的意义是否发生了改变。","如果语言单位的意义改变了或者不合法，则说明该语言单位在意义上是最小的，是词，否则就是短语。","词的意义具有凝固性和专指性，不可以扩展，而短语的意义具有分析性，可以扩展。因此，“扩展法”是区别词和短语的基本方法。"],"q":"区别词和短语的方法是扩展法，词是不能扩展的，即在词中间一般不能再插入别的成分，即使两个成词语素组成的词也是不能分开的，如“骑兵”、“热心”、“冰箱”、“白菜”。","w":"high","e":["教材高频"]},{"t":"抑制","y":"名词解释","p":["与自尊心有着密切关系的是抑制。抑制是个体的一种防御外部伤害、保护自我的心理屏障。","婴儿一生下来没有自我意识，甚至不能区分自我和周围世界；随着年龄的增长，自我意识逐渐形成。","从青少年时期开始，自我意识进一步发展，害怕自我暴露太多而使自尊心受到伤害，于是采用抑制的方法保护自我。","到了青春期随着在生理、认知和情感上受到的挫折增多，个体意识到不仅要认识自己还要认识周围的环境与社会，因而用于自我保护的抑制心理更为增强，而且一直发展到成年期。"],"q":"8.心理学中关于遗忘的 认为由记忆所建立的暂时神经联系的痕迹，由于受到其他刺激的干扰而产生抑制，所以产生遗忘。","w":"high","e":["2020 真题"]},{"t":"指事","y":"名词解释","p":["用抽象符号来提示字义。","这类字可以分两种：1.纯符号的；2.在具体事物的图形上添加抽象符号。","这种方法造的汉字局限性很大，所以字数极少，纯符号的指事字更少。"],"q":"9.“瓜”是象形字，“见”是指事字。","w":"high","e":["教材高频"]},{"t":"描写语法","y":"名词解释","p":["又叫“结构主义语法”","创始人为瑞士语言学家索绪尔","经典著作是《普通语言学教程》","提出“组合”和“聚合”两大结构关系","运用“直接成分分析法”对句法结构进行层次分析"],"q":"A 描写语法B 功能语法C 生成语法 D 传统语法","w":"high","e":["2014 真题"]},{"t":"撮口呼","y":"名词解释","p":["韵母以元音ü开头","共4个：ü、üe、üan、ün"],"q":"5. j、q、x只能与 、撮口呼相拼。","w":"high","e":["2025 真题"]},{"t":"效度","y":"名词解释","p":["效度又称有效性，指测试的有效程度，即测试的内容和方法是否能测出预定要测量的东西。","效度又分为表面效度、内容效度、结构效度和经验效度(效标关联效度)。","表面效度指某个测验或考试从表面看来是否测了它旨在测量的东西，有没有缺漏的部分，有没有偏题怪题。","内容效度指测试的内容是否是应该考查的，是否反映了这项测试的要求，或者说试题所包含的内容代表性、准确度和覆盖面如何。","结构效度又称理论效度，指考试的结果在多大程度上符合我们根据某种理论做出的预测。","效标关联效度是指确定一种能反映测试效度的参照标准，然后考察某一考试与该标准之间的相关程度。"],"q":"15.成绩测试和诊断测试要求有较高的 效度。","w":"high","e":["2020 真题"]},{"t":"教学内容","y":"名词解释","p":["第二语言教学是为了培养语言交际能力，这一教学目的决定了教学内容。","从语言能力和语言交际能力的构成因素出发，吕必松曾提出语言教学的教学内容应包括“语言要素、语用规则、言语技能、言语交际技能和相关文化知识”。","这样，对外汉语教学内容可以概括为四个方面：(1)语言要素(汉语语音、词汇、语法、汉字)；(2)言语技能(汉语听、说、读、写)；(3)言语交际技能(汉语语用规则、话语规则、交际策略)；(4)相关文化知识(汉语的文化因素、中国基本国情和文化背景知识)。","语言要素、言语技能、言语交际技能和相关文化知识就构成了语言交际能力的基础。"],"q":"10.教学过程的三个基本要素是教师、学生和教学内容。","w":"high","e":["2020 真题"]},{"t":"教学原则","y":"名词解释","p":["教学原则是从一定的教育和教学目的出发，在教学实践的基础上，根据对教学过程客观规律的认识而制订的指导教学工作的基本要求。","教学原则对一切教学活动，包括教学计划的制定、教学内容的选择、教学过程的组织、教学方法手段的运用都有指导作用。","教学原则有继承性，像早在17世纪由夸美纽斯第一次系统提出的直观性、自觉性、系统性、巩固性、量力性五大教学原则，在一定程度上反映了教学规律，至今仍有指导意义。","教学原则不能是一般哲学原则或社会政治原则的套用，必须结合教育实际、体现教育的特点。"],"q":"5.夸美纽斯第一次系统提出的五大教学原则有直观性、自觉性、系统性、巩固性、 性。","w":"high","e":["2020 真题","2020 真题"]},{"t":"教学大纲","y":"名词解释","p":["教学大纲是根据教学计划、以纲要形式制定的、对具体课程的教学目的、教学内容、教学进度和教学方法进行规范的指导性文件。","教学大纲通常分说明、本文和附录三部分。","说明部分阐明本课程的教学对象、教学目的要求、教学方式、本课程在专业中的地位和作用等；本文部分按课、章、节详细规定教学内容及其定量分级、主要教学环节；附录部分是各种教学参考资料和附表(如语言学科的词汇表、汉字表、功能项目表等)。","根据语言教学的特点，有的教学大纲按语言要素分别制订，就有关方面的教学内容做出规范，如语法大纲、句型大纲、词汇大纲、情景大纲、功能大纲、意念大纲等。"],"q":"通过教材的使用还能反馈教学效果，引起对教学大纲和教学理论的进一步思考。","w":"high","e":["2021 真题"]},{"t":"教学法体系","y":"名词解释","p":["改革和完善教学法体系是本学科建设的三项任务之一。","中外汉语教学工作者普遍对目前汉语教学效果不满意。达到同样的程度，学习汉语所花的时间和精力往往超过学习其他第二语言。","根本原因可能还在于我们没有完全找到针对汉语特点的学习规律与教学规律，汉语作为第二语言的教学法体系还不完善，教学方法还需进一步改革。","目前我国流行的对外汉语教学模式是在80年代中期定型的，它反映的是60~70年代国际语言教学的认识水平。"],"q":"2.语法翻译法不是第二语言教学法史上第一个完整的教学法体系。","w":"high","e":["2018 真题"]},{"t":"教学法流派","y":"名词解释","p":["教学法流派，指在一定的理论指导下在教学实践中逐渐形成的、包括其理论基础、教学目标、教学原则、教学内容、教学过程、教学形式、教学方法和技巧、教学手段、教师与学生的作用和评估方法等方面的教学法体系。","一种教学法流派的形成除了受当时的时代背景，特别是政治、经济等因素的影响外，更直接地受这一阶段的语言学理论、心理学理论、教育学理论以及一些其他相邻学科发展的影响。","各种不同教学法流派之间的差异，主要是由于对语言本质特征和对语言学习规律有不同认识，因而对教学规律有不同看法。","它影响到教学大纲的制订、教材的编写、课程教学程序和方法的确定，以及测试评估手段的选择等。"],"q":"15. 是听说法、视听法等教学法流派的心理学理论基础。","w":"high","e":["2021 真题"]},{"t":"教学计划","y":"名词解释","p":["教学计划是根据教育目的和培养目标所制定的全面指导某专业教与学活动的规范性文件。","教学计划是以课程设计为核心的总体设计的具体体现，主要包括专业培养目标、学习年限、课程设置及其主要教学方式和学时分配。","其中，课程体系是主要内容，教学计划也可以看做是课程设置的总体规划，决定该专业课程的结构与方向。","教学计划常由国家教育行政部门组织制订，对有关专业的教学工作和教学活动提出统一的要求，因此教学计划是编制教学大纲和编写教材的主要依据，也是进行教学活动、评估教学工作的主要依据。"],"q":"而今年我国高校也开始关注大规模网络在线教育，一些知名学府如北京大学和清华大学正式加入了edX网络在线教学计划，复旦大学和上海交通大学也加入了 Coursera大规模在线教育平台。","w":"high","e":["2021 真题"]},{"t":"教学过程","y":"名词解释","p":["教师和学生共同参与的教学活动过程叫教学过程。对教学过程规律的研究也称为过程论，是广义的教学论中的一部分。","教学过程的性质，按照马克思主义的观点是学生的认识过程，而且是一种特殊的认识过程。","其特殊性表现为：(1)学生不是真刀真枪直接同客观事物打交道，而是通过书本和课堂接受前人总结的实践经验；(2)学生的认识活动是在教师的引导下进行的；(3)学生的认识过程不只是知识技能掌握的过程，而且是德智体美全面发展的过程；(4)作为教学过程中学生的认识活动，不是学生自发的、主动的要求，而是在教师和课本影响下进行的。"],"q":"10.教学过程的三个基本要素是教师、学生和教学内容。","w":"high","e":["2018 真题"]},{"t":"教材","y":"名词解释","p":["教材是教师教学和学生学习所依据的材料，与教学计划和教学大纲构成学校教学内容的有机组成部分。","在教学活动的四大环节中，教材占有很重要的地位。它是总体设计的具体体现，反映了培养目标、教学要求、教学内容、教学原则；同时教材又是课堂教学和测试的依据。","狭义的教材指教科书，广义的教材除了教科书外还包括教学参考书、讲义、讲授提纲、图表、各种教学音像资料等。","教材体现了语言教学最根本的两个方面：教什么和如何教。教材水平的高低不仅能反映教学理论和教学法研究的深度，而且在很大程度上决定教与学的效果。"],"q":"7.交际法最有名的教材是《英语900句》。","w":"high","e":["2021 真题"]},{"t":"文化休克","y":"名词解释","p":["这些表现叫“文化震荡症”，也叫“文化休克”（cultural shock）。","文化休克是指在非本民族文化环境中生活或学习的人，由于文化的冲突和不适应而产生的深度焦虑的精神症状。","在跨文化交际中，或是进入非本民族文化生活环境中，以及学习目的语文化的过程中，文化差异都会引起人们的心理反应，产生一定的文化冲突，经历从文化不适应到适应的过程。这一过程大体上分为四个阶段：蜜月阶段、挫折阶段、调整阶段、适应阶段。","处于异文化环境中的人一般都要经历这一挫折期和文化震荡症。只不过文化震荡症在不同人身上表现的形式和程度不完全相同。"],"q":"5.“文化休克”的定义是由文化人类学家 提出的。","w":"high","e":["2025 真题"]},{"t":"文化适应假说","y":"名词解释","p":["文化适应假说由舒曼(J. Schumann)提出，从文化与语言的关系出发，把第二语言习得的过程看做是逐步适应目的语文化的过程。","把整个第二语言习得看做是文化适应的一部分，认为第二语言学习者对目的语文化的适应程度决定该目的语掌握的程度。","所谓文化适应是指学习者与目的语社团的社会和心理的结合，因此，学习者与目的语文化的社会距离与心理距离，就成了影响第二语言习得的主要因素。","心理距离主要指学习者在情感方面影响到第二语言习得的因素，包括语言障碍带来的焦虑，文化震荡带来的恐惧紧张以及动机、自尊心等。"],"q":"A 第三空间 1B 编码规则C 语言决定论D文化适应假说(四)列举题(每小题5分，共40分)","w":"high","e":["2025 真题"]},{"t":"新造词","y":"名词解释","p":["新造词是指为指称新事物、新概念或新现象而创造的词语。","新造词的产生与社会生活的变化有着密切的关系，社会变化越剧烈，新造词的产生就越频繁，有些新造词会随着使用频率的增加和范围的扩大而进入现代汉语词汇中，成为基本词汇成员，有些则随着使用频率的减少而逐渐消亡。","新词与旧词具有一定的相对性。以20世纪70年代末的改革开放为起点，在现代汉语中出现了大量新造词。"],"q":"6.新造词、外来词、方言词和行业词之间是平行关系。","w":"high","e":["教材高频"]},{"t":"方块字","y":"名词解释","p":["汉字是一种平面性文字，它的构成成分是从横和纵展开，形成平面布局。","在一个平面内，不管有多少个构成成分都要均衡地分布在方方正正的框架里，呈现为方块形式，所以汉字又叫作“方块字”。","汉字从隶书发展为楷书，形象性减弱，符号性加强。"],"q":"汉字是方块字，表意，单音节，而汉语中最基本、最活跃的部分就是由单音字组成的单音词，如天、地、日、月、风、云、山、水、多、少、先、后、上、下、春、秋、有、无、来、去，等等。","w":"high","e":["教材高频"]},{"t":"方法论","y":"名词解释","p":["方法论是在哲学层次上探讨科学方法的一般理论，是对科学方法的高度抽象与概括，研究如何把世界观的基本观点变为认识世界和改造世界的根本方法理论。","方法论一般就是指哲学方法论。","最普遍、最根本、最具有通用性的方法是哲学方法，它适用于自然科学、社会科学和思维科学，成为所有方法的基础，对其他各种方法起指导作用。","除了作为根本方法的哲学方法外，数学等横断科学作为运用于各个领域的一般方法，也起着方法论的作用，对各学科都有方法论的指导意义。"],"q":"13.✔【解析】孔子的“中庸”思想，既具有哲学方法论的意义，又具有品德修养的意义。","w":"high","e":["2020 真题"]},{"t":"方言词","y":"名词解释","p":["方言词是指来源于某一方言且仅限于该方言地域内使用的词语。","根据交际的需要，方言词会不断地有选择地被吸收到现代汉语词汇中。当一个方言词可在全社会使用并稳定下来时，就成了现代汉语词汇的方言词。","方言词进入现代汉语词汇的速度和数量，与该方言地域的政治、经济、文化、人口等因素有密不可分的关系。"],"q":"2.吸收方言词进入普通话必须考虑必要性、普遍性和明确性。","w":"high","e":["教材高频"]},{"t":"无为而治","y":"名词解释","p":["道家老子的政治主张","道常无为而无不为","顺应自然不妄加干预","无为非不为而是不妄为"],"q":"老子乃世界文化名人，世界百位历史名人之一，存世有《道德经》(又称《老子》)，其作品的精华是朴素的辨证法，主张无为而治，其学说对中国哲学发展具有深刻影响。","w":"high","e":["2018 真题"]},{"t":"春节","y":"名词解释","p":["农历正月初一，又称过年","源于上古岁首祭祀","贴春联、守岁、拜年、压岁钱","象征辞旧迎新、阖家团圆"],"q":"1.“春节”名称古时候没有，是在1911年辛亥革命后才把农历新年改称“春节”的。","w":"high","e":["2016 真题"]},{"t":"普遍语法","y":"名词解释","p":["语言习得机制包括两部分：一部分是以待定的参数形式出现的、人类语言所普遍具有的语言原则，又称为“普遍语法”(universal grammar)。","普遍语法反映了人类语言的共性，它不是指那些具体的语法规则或某种语言的语法，而是存在于人类所有语言的深层结构中的语言中最本质的东西。","任何语言都会有元音，都有影响意义的语序，都有主语、谓语、宾语等句子的组成部分，都有表示时间关系的手段。","这些有关语法成分、句法结构以及句法转换等适合所有语言的语言知识和原则，成为“核心”部分，而各种语言本身所具有的特殊结构称为“外围”部分。"],"q":"14.偏误分析的心理学基础是( )理论，语言学基础是乔姆斯基的普遍语法理论。","w":"high","e":["2020 真题"]},{"t":"本义","y":"名词解释","p":["本义是文献记载的词的最初意义。","有些多义词的本义已经消失，在一般词典中不再列为义项；有些多义词的本义作为语素义至今保留，但只出现在合成词或固定结构中；有些多义词的本义，至今仍然是最常用最主要的意义，这时多义词的本义与基本义就一致了。"],"q":"“禾”与粮食有关，有了粮食，心就安定了，本义安定、平稳。","w":"high","e":["教材高频"]},{"t":"本族语","y":"名词解释","p":["本族语就是本民族的语言，因此这一术语与“母语”可以通用","这是按言语社团、通常是民族的界限来区分的。非本族语是指本民族以外的语言，可能是外语，也可能是指本国其他民族的语言。"],"q":"但第一语言不同于母语，也不同于本族语。","w":"high","e":["2019 真题"]},{"t":"构词法","y":"名词解释","p":["构词法是指语素构成词的方式和方法，是对已有词的音节特征和结构关系进行静态的分析和分类。","“构词法”和“造词法”组成了词汇的两大构造系统。","构词法是研究语素如何构成词的方法。"],"q":"11. B【解析】派生法是英语主要的构词法。","w":"high","e":["教材高频"]},{"t":"格式塔心理学","y":"名词解释","p":["20世纪初德国出现了反对构造主义的学派，即格式塔心理学，其创始人为韦特海默、考夫卡和柯勒。","德文“格式塔”（Gestalt）的意思是“整体”，又称“完形学派”。","该派反对把意识化解成元素，主张把心理作为一个整体组织来研究。认为整体不能还原为各个部分、各种元素；整体先于部分而存在并制约着部分的性质和意义；部分相加不等于整体，整体大于部分之和。","格式塔学派强调采用综合方法研究心理现象，在研究方法上主要采用演示和主观报告的方法，并在知觉、学习和问题解决等方面展开大量的实验研究。"],"q":"14.格式塔心理学派在研究方法上主要采用演示和 的方法","w":"high","e":["2025 真题","2025 445 二、教育学、心理"]},{"t":"楚辞","y":"名词解释","p":["屈原为代表的楚国新诗体","句式长短参差，多用“兮”字","刘向辑录成书，浪漫主义源头"],"q":"1.《诗经》与《楚辞》历来合称“ ”，是中国古代诗歌的两大源头。","w":"high","e":["2018 真题"]},{"t":"楷书","y":"名词解释","p":["楷书是现代通行的汉字手写正体字，也叫正楷。“楷”是楷模、法式的意思。","楷书笔画分明，笔形规整，结构端庄，字形方正，是汉字的标准字体。","现代汉字手写体主要有楷书、草书、行书等三种。"],"q":"8.在日本，简化楷书，取其片断，形成的是平假名。","w":"high","e":["教材高频"]},{"t":"歇后语","y":"名词解释","p":["歇后语是指人们口头流传的由像谜面和谜底的前后两部分组成的通俗、风趣、形象而带有隐语性质的熟语。","前一部分是比喻或说出一个事物，类似于谜语的“谜面”，而后一部分则是解释说明，类似于“谜底”，前后两部分在话语中有停顿间歇，后一部分有时不说出来，让人去猜想其含义，所以称为歇后语。","根据歇后语前后两部分的关系以及后一部分与歇后语真实意义的关系，可以分成两类：喻意类和谐音类。"],"q":"10.现代汉语的熟语主要包括： 、谚语、 和歇后语。","w":"high","e":["教材高频"]},{"t":"殿试","y":"名词解释","p":["皇帝亲自主持的最高一级","始于武则天宋代定制","一甲三名状元榜眼探花","录取者统称进士"],"q":"19.明清两代科举实行 、会试和殿试三级考试，考试内容以八股为主。","w":"high","e":["2019 真题"]},{"t":"母语","y":"名词解释","p":["母语是指本国、本民族的语言","这是按国家的界限来区分的。","外语是指外国的语言。一般情况下母语是人们的第一语言；但对一些移居国外的人来说，其子女出生后首先接触并获得的语言有可能是居住国的语言而不是母语。"],"q":"10.第一语言对第二语言学习产生影响，出此产生的迁移叫母语负迁移。","w":"high","e":["2019 真题"]},{"t":"比喻义","y":"名词解释","p":["比喻义就是把词的比喻用法固定下来的意义。","本义、基本义、引申义都可以产生比喻义。","“口”的本义和基本义是“人和动物进食、发声的器官”，发展出比喻义义项“出入通过的部位”。"],"q":"比如：词的引申义和比喻义不同，松竹梅在汉语象征人的品德高洁，而在英语中无此意义。","w":"high","e":["教材高频"]},{"t":"水平测试","y":"名词解释","p":["水平测试又称能力测试，目的在于测量受试者现有的整体的语言实际运用能力，以评定是否达到胜任某项任务的要求。","水平测试不考虑受试者的学历，也不以任何大纲、课程或教材为依据，而是根据语言交际能力的标准，或是某一特定任务的要求来命题。这是一种回顾兼预示的测试。","水平测试具有较高的区分性，受试者的分数反映了他在全体受试者中的位置。水平测试常常是大规模标准化测试，如我国的汉语水平考试(HSK)、英语水平考试(EPT)，美国的托福考试，英国的剑桥英语水平考试等。"],"q":"8.水平测试是了解受试者现有的整体语言实际运用能力的一种测试。","w":"high","e":["2019 真题","2021 真题","2024 445 二、教育学心理学"]},{"t":"汉字","y":"名词解释","p":["汉字是汉民族在长期的劳动生产和社会实践中为适应交际需要而独立创造出来的书面交际工具。","汉字是一种重要而独特的文字系统，在记录语言的方法、造字的方式、字形的结构、字体的呈现等诸方面都有鲜明的特点。","汉字是世界上历史最悠久的一种独立发展的文字，曾形成“汉字文化圈”。"],"q":"6.汉字的造字法，古有 之说。","w":"high","e":["2016 真题"]},{"t":"汉字信息处理","y":"名词解释","p":["汉字信息处理就是利用计算机对汉字符号系统进行处理的一项科学技术。","所谓语言信息处理就是指用计算机对自然语言的形、音、义等信息进行处理。","汉字信息处理不等同于中文信息处理。汉字信息处理系统则是中文信息处理系统中一个关键和基础的部分。","汉字信息处理，对使用者来说，最主要的是汉字信息的输入与输出。"],"q":"10.解决汉字信息输入计算机的问题，是进行汉字信息处理的基础。","w":"high","e":["2014 真题","2019 真题"]},{"t":"汉字教学","y":"名词解释","p":["汉字是用来记录汉语的书写符号系统。","汉字教学的任务是，以汉字形、音、义的构成特点和规律为教学内容，帮助学习者获得认读和书写汉字的技能。汉字教学是汉语教学的重要组成部分，不掌握汉字就学不好汉语。汉字教学是汉语作为第二语言教学最显著的特点。","汉字又被认为是汉语学习最大的难点。这是由于由笔画组成的方块汉字是记录语素的语素文字，是与世界上大多数民族使用的、以记录音素的字母拼写的拼音文字根本不同的文字系统。","汉字教学原则主要有：(1)语和文先分后合，初期汉字应按自身规律独立教学；(2)强化汉字教学，字与词教学相结合；(3)把握汉字的构成规律和基本理论，利用汉字的表意和表音功能识记汉字；(4)按笔画、部件、整字三个层次，从笔画、笔顺、部件、间架结构四个方面进行汉字教学；(5)重视对比，加强复习，通过书写识记汉字。"],"q":"14.先语后文是指先进行口语和听说教学，后进行汉字和书面语教学，把口语和汉字教学分开。","w":"high","e":["2020 真题"]},{"t":"汉语习得理论","y":"名词解释","p":["汉语习得理论是对对外汉语教学的主体——学习者的研究，即侧重从心理学的角度研究教学对象的学习过程和学习规律。","随着认知心理学和教育心理学的发展和语言习得研究本身的进展，人们逐渐认识到“教”的成功与否决定性的因素还在“学”的方面，对“学”的研究是对“教”的研究的基础和前提。"],"q":"3.汉语习得理论侧重于从( )的角度研究教学对象的学习过程和学习规律。","w":"high","e":["2019 真题"]},{"t":"活动课程论","y":"名词解释","p":["活动课程论。代表人物是美国实用主义教育家杜威。这是以经验为中心的课程理论，强调学生的生活经验中包括了各方面的知识，课程的编排应与生活经验的发展顺序相一致。","这种课程论强调要让学生掌握解决实际问题的知识，提倡“教育即生活”，“在做中学”，适应以培养能力为主的教学。","活动课程论强调发挥学生学习的主动性，强调教学与社会生活的联系，但对科学知识本身的逻辑体系和逻辑顺序注意不够，不利于学生掌握系统的知识。"],"q":"4.活动课程论【解析】活动教学法，也称活动型教学法，是十种新型的教学方法，一般是指教师根据教学要求和学生获取知识的过程为学生提供适当的教学情境，根据学生身心发展的程度和特点设置，让学生凭自己的能力参与阅读、讨论游戏、学具操作等去学习知识的课堂教学方法或过程。","w":"high","e":["2026 真题","2026 445 二、教育学、心理"]},{"t":"派生词","y":"名词解释","p":["派生式合成词是指由词根和词缀组合而成的词。","根据词缀的位置，可以分成前缀、后缀、中缀三种类型。","汉语里典型词缀并不太丰富，但是存在比较多的“类词缀”，特点是类似于词缀，意义有不同程度的虚化，但还不彻底。"],"q":"A.词组 B.派生词C.偏正式复合词 D.补充式复合词","w":"high","e":["教材高频"]},{"t":"海上丝绸之路","y":"名词解释","p":["古代海上贸易与文化通道","形成秦汉，繁荣宋元","泉州、广州、宁波为始发港","输出丝绸瓷器，输入香料珠宝"],"q":"6.习近平于2013年9月7日，在哈萨克斯坦访问时提出建设“新丝绸之路经济带”构想，又在2013年 10月 3日，出访印度尼西亚时提出建设“21世纪海上丝绸之路”的构想。","w":"high","e":["2024 445 一、中外文化及跨"]},{"t":"清明节","y":"名词解释","p":["二十四节气与传统节日","扫墓祭祖与踏青郊游","融合寒食节禁火冷食习俗"],"q":"24.答案：清明节【解析】清明最早只是一种节气的名称，其变成纪念祖先的节日与寒食节有关。","w":"high","e":["2019 真题"]},{"t":"熟语","y":"名词解释","p":["现代汉语的熟语系统包括五小类：成语、谚语、歇后语、惯用语和习用语。","熟语的特点：(1)结构的定型性；(2)语义的整合性；(3)功能的多样性；(4)语用的民族性。","结构的定型性指熟语的构成成分及其结构关系是固定的；语义的整合性指熟语的意义不是构成成分意义的简单相加；功能的多样性指熟语可以跟词一样按照一定的语法规则组织起来充当多种句子成分；语用的民族性指熟语的形成和使用受民族文化传统的影响。"],"q":"10.现代汉语的熟语主要包括： 、谚语、 和歇后语。","w":"high","e":["教材高频"]},{"t":"独体字","y":"名词解释","p":["独体字是指无法分离出两个或两个以上部件的汉字。","有些字笔画相交，结构呈镶嵌式，即使笔画很多，由于从字形上不能分解出相离的部件，因而也是独体字；有些字分解后就是相离而又对称或平行的笔画，这类字也宜看作独体字。","独体字在现代汉字中约占3%——5%，绝对数量为三百上下，它们是构成现代汉字字形的基础。"],"q":"6.下列 ()组汉字都是独体字。","w":"high","e":["2013 真题","2019 真题"]},{"t":"玄奘","y":"名词解释","p":["唐代高僧、法相宗创始人","西行求法十七年","译经七十五部一千三百余卷","口述《大唐西域记》"],"q":"24.唐代僧人玄奘所著的 是中外文化交流史上的不朽之作。","w":"high","e":["2020 真题"]},{"t":"现代汉字","y":"名词解释","p":["现代汉字指现阶段正在使用的汉字，它记录的主要对象是现代汉语，与传统汉字相对应。","判断一种文字符号体系的性质，首要的是研究这种文字与它所记录的语言之间的关系。","考察现代汉字的特点，还必须跟拼音文字符号体系进行比较。"],"q":"9.现代汉字的标准化应做到“ 、 、字有定音、字有定序。","w":"high","e":["2013 真题","2019 真题"]},{"t":"现代汉字形音义的关系","y":"名词解释","p":["字形是文字的物质外壳，是文字层面上的要素；字音和字义是文字所记录语言的音和义，是语言层面上的要素。","字形与字音以及字义这三者之间形成了错综复杂的关系。","现代汉字学的术语中，例如“多音多义字、同音字、异读字、异体字、繁简字、同形字”等，它们的内涵有一些交叉或重叠，这是因为给这些名称命名时的出发点不同。"],"q":"3.举例说明现代汉字形音义的关系。","w":"high","e":["2014 真题"]},{"t":"白鹿洞书院","y":"名词解释","p":["位于江西庐山","朱熹重修并主讲","制定《白鹿洞书院揭示》","学规成为后世典范"],"q":"9.南宋四大书院是指( )书院、白鹿洞书院、丽泽书院及象山书院。","w":"high","e":["2022 真题"]},{"t":"监控假说","y":"名词解释","p":["监控假说认为，与习得和学习分别相联系，人的头脑中有两个独立的语言系统，一是潜意识的系统，一是有意识的系统，而且两个系统似乎存在于大脑的不同部位。","流利地运用第二语言靠习得，交际中使用的输出的话语是由潜意识的习得系统引起或“驱动”的。","通过学习所获得的有意识的系统语言知识和规则，并不能使学习者表达得更为流利；有意识的系统在言语行为中只有一项功能，即只能作为一个监督者、一个编辑，起监控(monitor)的作用，对输出的言语形式进行检查和控制。","这种监控可能在说话前，也可能在说话同时甚至是说话之后进行校正。"],"q":"“监控假说是克拉申输入假说的一部分，它与习得和学习假说紧密相关。","w":"high","e":["2020 真题"]},{"t":"目的语知识负迁移","y":"名词解释","p":["目的语知识负迁移指学习者把他所学的有限的、不充分的目的语知识，用类推的办法不适当地套用在目的语新的语言现象上，造成了偏误，也称为过度概括(over-generalization)或过度泛化。","这类偏误一般在其母语中找不到根源，而且不同母语背景的学习者常常出现同样的偏误。","如果说由于母语负迁移所造成的偏误在学习的初级阶段占优势，到中级阶段或高级阶段目的语知识负迁移造成的偏误就逐渐占了优势，这是学习者内化规则过程中所产生的偏误。","表现在语音方面，如学习汉语第三声声调先降后升是学习者的一大难点；再如字母ü在 ju、qu、xu、yu等音节的拼写中，上边的两点要省去，学习者常常把这些音节中省去两点的ü读成u。"],"q":"第二、目的语知识负迁移。","w":"high","e":["2020 真题"]},{"t":"直接法","y":"名词解释","p":["直接法又称“改革法”或“自然法”，是主张以口语教学为基础，按幼儿习得母语的自然过程，用目的语直接与客观事物相联系而不依赖母语、不用翻译的一种第二语言教学法。","19世纪末20世纪初产生于西欧，主要是法国和德国。","直接法的语言观认为语言是习惯，语言的运用是靠感觉和记忆而不是思维。","直接法的心理学基础是联想主义心理学，认为人的学习方式与动物一样，是刺激与反应直接联结，否认意识在其间的作用。","直接法早期的代表人物有德国语言教育家菲埃托(V. W. Vietor)、德国教育家贝力子(M. Berlitz)、法国语言教育家古安(F. Gouin)等。"],"q":"13.教学法中的直接法于十九世纪末二十世纪初产生于美国。","w":"high","e":["2017 真题","2020 真题"]},{"t":"相对反义词","y":"名词解释","p":["相对反义词：肯定一方必否定另一方，否定一方不一定肯定另一方，二者属于反对关系。","相对反义词属于反义词的一类，与绝对反义词相对。"],"q":"5. BDE【出处】《现代汉语》上册第249页【解析】反义词就是两个意思相反的词，包括：绝对反义词和相对反义词。","w":"high","e":["教材高频"]},{"t":"知识文化","y":"名词解释","p":["所谓知识文化是指跨文化交际中不直接影响准确传递信息的语言和非语言的文化因素；交际文化则是指跨文化交际中直接影响信息准确传递(即引起偏差或误解)的语言和非语言的文化因素。","知识文化常以“知识”或“内容”的形式参与交际。“知识”的多少也会影响到交际的进行。但懂就是懂，不懂就是不懂，一般不会产生误解。","交际文化与知识文化概念的提出，加深了人们对语言教学中的文化教学的认识。"],"q":"9.张占一等人提出了知识文化和交际文化。","w":"high","e":["2018 真题"]},{"t":"短时记忆","y":"名词解释","p":["短时记忆又称操作记忆，典型的例子是人们在拨电话时记住刚查找的号码，打完电话马上就忘掉了。短时记忆是对信息进行操作的系统，是动态系统。","感觉信息在短时记忆中保存一分钟左右，通常是以听觉形式编码，且基本保持逐词逐句的内容。","短时记忆容量有限，信息一次呈现后能在短时记忆中正确回忆起7±2个信息单位，以数字计大约为5至7个数，不相连的字母为7个，无关联的汉字一次则能记住6个。","在第二语言学习中如能在短时记忆中组成有意义的信息单位，如词、句，则记忆容量可以大大增加。"],"q":"4.记忆按其内容分为感觉记忆、短时记忆和长时记忆。","w":"high","e":["2017 真题"]},{"t":"短语","y":"名词解释","p":["由两个或两个以上单词构成的句法结构单位","在语义上能逐层贯通，在结构上能逐层搭配起来","没有句调的一组词","短语有两类：词组和结构"],"q":"10.实词能同别的词结合超来组会成短语和句子，充当短语和句子的 。","w":"high","e":["2015 真题","2021 真题"]},{"t":"社会属性","y":"名词解释","p":["语音最重要的特点","世界上其他任何声音所不具备","约定俗成","系统性","民族特征和地域特征"],"q":"3.音位是从语音的社会属性划分出来的最小语音单位。","w":"high","e":["2014 真题","2018 真题","2022 真题"]},{"t":"社区色彩义","y":"名词解释","p":["时间空间义是指语言因在一定的时代、地域中使用而产生的意义，主要有古今色彩义和社区色彩义两种。","社区色彩义指只在某个社区流通并反映该社区政治、经济、文化特色的词义。","香港的社区词如：公屋、居屋、夹屋、丁屋、抽水、通水；台湾的社区词如：泛蓝、泛绿、飞弹、辅育院、劈腿。"],"q":"④时间空间义，主要有古今色彩义和社区色彩义两种。","w":"high","e":["教材高频"]},{"t":"社区词","y":"名词解释","p":["社区词是指反映某一社区政治、经济、文化特点并只在该社区流通的特有词语。","由于不同的政治制度、经济体制、文化教育和心理状态，中国大陆、香港特区、澳门特区、台湾地区以及不同的海外华人社区就会在政治、经济、文化、教育、生活等方面出现各不相同的事物、观念和现象，从而出现只在该社区使用的社区词。"],"q":"A.行业词 B.外来词 C.新造词 D.社区词","w":"high","e":["教材高频"]},{"t":"禅宗","y":"名词解释","p":["达摩传入、慧能大兴","不立文字直指人心见性成佛","主张顿悟、自性即佛","《坛经》为唯一中国僧人所撰之\"经\""],"q":"A.禅宗 B.华严宗(C.法相宗 D.天台宗","w":"high","e":["2019 真题"]},{"t":"离合词","y":"名词解释","p":["有些双音节词在中间可以插入别的成分而变成短语，这类可以插入别的成分变成短语的词叫“离合词”。","常见的离合词有“洗澡、站岗、生气、结亲、伤心、帮忙、随便、游泳、推翻、说服、打倒、看见”等。"],"q":"A 离合词 B 单纯词C 缩略词 D 外来词","w":"high","e":["教材高频"]},{"t":"科举制","y":"名词解释","p":["隋大业元年设进士科始","1905年废止历时1300年","以考试成绩为录取标准","打破门第限制"],"q":"2.中国文官制度的基础是科举制。","w":"high","e":["2015 真题","2019 真题","2024 真题"]},{"t":"科学性","y":"名词解释","p":["科学性是对外汉语教材编写和选用的原则之一。","针对性、实用性以及趣味性、系统性也都属于科学性的范围。","科学性特别强调以下几点：(1)要教规范、通用的语言，我国规范、通用的汉语是普通话，规范、通用的标注音素读音的符号是《汉语拼音方案》，规范、通用的汉字是我国正式公布的简化字；(2)教材内容的组织要符合语言教学的规律；(3)对语言现象的解释要注意准确性，避免造成对学习者的误导；(4)教材内容要反映出学科理论研究的新水平，及时更换陈旧内容。"],"q":"12.造成学习者语言偏误的不良学习环境包括教材的科学性不强或编排不当。","w":"high","e":["2020 真题"]},{"t":"移情","y":"名词解释","p":["移情(empathy)是指设身处地领会别人的思想和感情。这是人与人交往中相互沟通、消除隔阂、达到和谐相处的必要条件。","语言是达到移情的主要手段，在语言交际过程中双方都要不断做出假设，揣摸从对方输入的信息所表达的意思以及将要输入的是什么信息。","由于认知因素和情感因素的差异，在同一语言文化的成员之间也需要有一定的移情，理解对方的认知及情感特点和状态，才能使交际顺利进行。","运用第二语言进行交际，除了认知和情感方面的差异外，更存在双方在文化上的差异和语言方面的障碍，更需要双方跨出自我的疆界，运用更多的移情来理解对方的文化特点和语言结构特点。"],"q":"A.交际 B.移情 C.认同 D.抑制七、案例分析与写作(共40分)请根据以下材料，按照“发现问题——————分析问题——————解决问题”的思路，写一篇1500字以上的案例分析，要求：结构完整，格式正确，条理清楚，语言规范，观点明确，材料充实，卷面整洁。","w":"high","e":["2020 真题"]},{"t":"程朱理学","y":"名词解释","p":["二程与朱熹为代表","理为宇宙本原","理在事先","格物致知","存天理灭人欲","元明清官方哲学"],"q":"继后有程颢和程颐等人继续发展，最终由南宋朱熹集其大成，因此这种理学常被称为“程朱理学”。","w":"high","e":["2024 真题","2015 真题"]},{"t":"端午节","y":"名词解释","p":["农历五月初五，又称端阳节","纪念屈原投汨罗江","赛龙舟、吃粽子、挂艾草"],"q":"9.在中国，端午节常常举行 、包粽子等习俗活动。","w":"high","e":["2021 真题"]},{"t":"笔形","y":"名词解释","p":["依据笔势和走向，现代汉字的笔画可以有31种不同的形式，笔画的形式简称为笔形。","现代汉字的笔形可以有概括的和细致的两种分类法：概括的分类法把笔形分为八类或五类；细致的分类法先把笔形分为基本笔形和派生笔形（也称复合笔形）两个大类。","书写时，笔画的方向自始至终没有变化的笔形是基本笔形，笔画的方向有所变化的是派生笔形。"],"q":"7.汉字序列法中的()又分部首法、笔画法和笔形法。","w":"high","e":["教材高频"]},{"t":"笔画","y":"名词解释","p":["笔画是构成楷书字形的最小单位。","就书写过程而言，笔画是有起止的线条，从落笔到下一次提笔的过程中写出的点和线就叫一笔或一画。","在不同的字体中，笔画的表现形式可能不完全相同。","这里所说的笔画是以印刷体的主流字体宋体、楷体作为分析对象的。"],"q":"20.“凸”字的笔画数为 。","w":"high","e":["2012 真题","2018 真题"]},{"t":"笔顺","y":"名词解释","p":["书写汉字时笔画的走向和次序叫作笔顺。","笔顺包括两方面内容：一是笔画的走向，也有人称“笔势”，例如横（一）是从左到右，竖（丨）是从上到下；二是笔画出现的先后次序，也有人称“笔序”。","笔势和笔序合起来称为笔顺。"],"q":"(9)“里”的笔顺是 ( )。","w":"high","e":["2014 真题","2020 真题"]},{"t":"第一语言","y":"名词解释","p":["人出生以后首先接触并获得的语言","第二语言指人们在获得第一语言以后再学习和使用的另一种语言。","这是按人们获得语言的先后顺序来区分的两个概念，也是语言教学理论中用得最多的术语。"],"q":"3.第一语言是指人出生以后首先接触并获得的语言。","w":"high","e":["2013 真题","2019 真题"]},{"t":"第二语言","y":"名词解释","p":["指人们在获得第一语言以后再学习和使用的另一种语言","由于学习这些语言的规律与学习第二语言有很多共同之处，所以一般不再细分而统称第二语言。","广义的“第二语言”是指任何一种在第一语言获得以后学习和使用的语言，包括外语。"],"q":"13.学习第二语言所需要的特殊 素质叫做语言学能，也叫做第二语言学习能力倾向。","w":"high","e":["2019 真题"]},{"t":"第二语言习得","y":"名词解释","p":["正因为第二语言学习中也包含有习得的因素，越来越多的人把第二语言学习也称为第二语言习得。","在第二语言学习理论的研究中，特别是西方学者的研究文章中已出现用术语“习得”代替“学习”的趋向。","有关第二语言习得的理论和模式，西方学者已提出不下数十种，从各个不同的角度论述或解释第二语言是如何习得的。","其中有的理论虽然影响不小，但尚未得到足够的科学实验的证实，还只能称为假说。"],"q":"3.第二语言教学法中的自然法以语言交际理论和( )的有关第二语言习得的理论为理论基础。","w":"high","e":["2019 真题"]},{"t":"简化字","y":"名词解释","p":["简化字专指政府有关部门公布的规范的简体字。","“简体字”则有特定的含义，指由国家明文规定取代繁体字而推广使用的简体字。","1956年1月，国务院通过并发布了《汉字简化方案》；1964年重新整理、编制了《简化字总表》；1986年10月重新发表《简化字总表》，共收录简化字2235个。","同一个字有几个形体，笔画比较多的叫繁体字，笔画比较少的叫简体字。"],"q":"10.“后”是“後”的简化字，因此，“皇后”这个词的繁体字书写形式就是“皇後”。","w":"high","e":["2014 真题","2021 真题"]},{"t":"类义词","y":"名词解释","p":["类义词就是根据同一意义标准划分出来的属于同一上位词的一组下位词。","根据同位关系的严密程度，类义词主要包括两种类型：严格的基于科学分类的类义词；非严格的基于日常运用的类义词。","类义词划分必须同一标准，类义词之间必须互相排斥。"],"q":"类义词，就是表示同类概念的一组词，例如“牛”和“人”都属于“动物类”，就具有同类关系；","w":"high","e":["教材高频"]},{"t":"类书","y":"名词解释","p":["采摭群书按类编排的工具书","述而不作，辑录原文","《艺文类聚》《太平御览》《永乐大典》","具有文献辑佚价值"],"q":"6.明代最大规模的类书是 ( )。","w":"high","e":["2019 真题"]},{"t":"系统性","y":"名词解释","p":["系统性是对外汉语教材编写和选用的原则之一。","首先是指教材内容在基本知识介绍和技能训练方面，也就是语音、词汇、语法、汉字等语言要素和听、说、读、写言语技能的安排方面，要平衡协调、有一定的章法。","学生用书、教师手册、练习本、单元试题各部分要分工合理，相互呼应。纵的方面，初级、中级、高级不同阶段教材要衔接；横的方面，综合技能课与听、说、读、写专项技能课教材要配合。还要考虑图片、幻灯、声、像、电脑辅助教材的提供。从而形成系列的、立体的教材体系。"],"q":"5.夸美纽斯第一次系统提出的五大教学原则有直观性、自觉性、系统性、巩固性、 性。","w":"high","e":["2020 真题"]},{"t":"繁简字","y":"名词解释","p":["繁简字：即一为笔画比较多的字，一为笔画比较少的字，字音和字义都相同。","《简化字总表》的2235个简化字，在简繁转换中有95.5%是一对一的关系。","“简体字”则有特定的含义，指由国家明文规定取代繁体字而推广使用的简体字。"],"q":"一、现代汉字形音义分析(一)现代汉字形音义关系的种类现代汉字学的术语中，例如“多音多义字、同音字、异读字、异体字、繁简字、同形字”等，它们的内涵有一些交叉或重叠，这是因为给这些名称命名时的出发点不同，其中考虑到字形、字音、字义这三个方面。","w":"high","e":["教材高频"]},{"t":"经史子集","y":"名词解释","p":["经部：儒家经典与小学","史部：各类史书","子部：诸子与科技艺术","集部：文学总集别集"],"q":"37.“经史子集”四部分类始于隋朝，其中，“ ”包括历代作家的文学作品。","w":"high","e":["2023 真题","2019 真题"]},{"t":"结构主义语言学","y":"名词解释","p":["20世纪初语言学进入新的发展时期。1906年到1911年瑞士语言学家索绪尔在日内瓦大学讲授普通语言学，1916年由他的学生整理出版了他的讲稿《普通语言学教程》。","索绪尔被公认为现代语言学的主要奠基人，其语言理论也成了现代语言学的指导思想。","索绪尔语言理论的核心是语言是符号系统，这一系统由很多小系统组成；符号由“能指”(形式)和“所指”(概念)两部分构成。","在30年代有三个学派：强调语言符号的功能的布拉格功能语言学派，强调语言符号间各种关系的哥本哈根语符学派，强调共时描写语言事实的美国描写语言学派。"],"q":"13.听说教学法的语言学基础是结构主义语言学，心理学基础是行为主义心理学。","w":"high","e":["2018 真题"]},{"t":"绝对反义词","y":"名词解释","p":["绝对反义词：肯定一方必否定另一方，否定一方必肯定另一方，二者属于矛盾关系。","绝对反义词属于反义词的一类，与相对反义词相对。"],"q":"15.“黑”和“白”是一对绝对反义词。","w":"high","e":["教材高频"]},{"t":"联绵词","y":"名词解释","p":["联绵词是从古代汉语中流传下来的，由两个没有意义的音节连缀成义而形成的词。","根据联绵词两个音节的声母、韵母关系，联绵词可以分为三类：双声词、叠韵词、非双声叠韵词。","双声词指声母相同的联绵词；叠韵词指韵母相同的联绵词；非双声叠韵词指声母和韵母都不相同或不相近的联绵词。"],"q":"A 联绵词 B 口语词C 音译词 D 社区词","w":"high","e":["教材高频"]},{"t":"自然法","y":"名词解释","p":["自然法是70年代后期产生于美国的新教学法，其倡导者是美国加州大学西班牙语副教授特雷尔(Tracy Terrell)和美国语言教育家克拉申。","自然法是根据对自然环境中的母语习得和第二语言习得的观察与研究，提出在非自然条件(即课堂教学)中最大限度地扩大对学习者的语言输入、首先集中培养理解能力并强调通过习得掌握第二语言的教学方法。","自然法以语言交际理论和克拉申的有关第二语言习得理论，即“输入”的五个假说为理论基础。","1983年克拉申与特雷尔合作出版了《自然法：课堂中的语言习得》一书，全面阐述了自然法的理论基础和具体实践。"],"q":"3.第二语言教学法中的自然法以语言交际理论和( )的有关第二语言习得的理论为理论基础。","w":"high","e":["2018 真题"]},{"t":"自觉实践法","y":"名词解释","p":["自觉实践法是前苏联20世纪60年代以来广泛采用的外语教学方法，主张学习者在自觉掌握一定语言理论知识基础上，主要通过大量言语实践活动达到直觉运用目的语。","代表人物是前苏联的心理学家别利亚耶夫(Б. B. Беляев)。","自觉实践法主要继承直接法通过大量言语实践培养听说读写技能的本质特点，同时也继承了语法翻译法强调自觉掌握语言规则的正确主张，同时吸取了对立的两大派的长处。","自觉实践法的语言学基础是苏联著名语言学家谢尔巴院士关于区分语言、言语、言语活动的学说。"],"q":"14自觉实践法是西欧20世纪60年代以来广泛采用的外语教学方法。","w":"high","e":["2020 真题"]},{"t":"自觉对比法","y":"名词解释","p":["自觉对比法是主张通过母语与目的语的翻译和结构对比，自觉掌握目的语的一种教学方法。","在本世纪30年代至50年代成为前苏联正统的外语教学法，对东欧和蒙古的外语教学也有较大影响，50年代我国外语教学基本上是以自觉对比法为依据。","自觉对比法是以直接法为对立面，客观上成了语法翻译法的继承和发展。","自觉对比法的理论基础首先是重视德育、把教育教养任务放在首位的苏联教育学思想，还以当时苏联的语言学和心理学理论为基础。"],"q":"4.第二语言教学法中的自觉对比法以当时( )的语言学和心理学理论为基础。","w":"high","e":["2020 真题"]},{"t":"舌位","y":"名词解释","p":["舌头收紧隆起的发音部位"],"q":"A.发音部位 B.发音方法 C.气流强弱 D.舌位高低和前后E.唇形圆与不圆","w":"high","e":["2018 真题"]},{"t":"行业词","y":"名词解释","p":["行业词是指在不同学科专业和行业中使用的专门用语，是表达学科专业和行业概念的重要方式。","行业词包括专业术语和行业用语。","随着人们文化知识水平的普遍提高以及跨学科和跨行业交流的增加，许多行业词逐渐泛化而成为普通的现代汉语词汇。"],"q":"6.新造词、外来词、方言词和行业词之间是平行关系。","w":"high","e":["教材高频"]},{"t":"行为主义","y":"名词解释","p":["20世纪的美国心理学界出现了反对构造主义和机能主义的另一种思潮——行为主义。这是强调学习过程和测量外显行为的心理学派，其创始人是美国心理学家华生，后期主要代表人物是斯金纳。","行为主义有两个主要特点：否认意识，主张心理学只研究人的行为；反对内省，主张采用客观的实验的方法。","华生受俄国巴甫洛夫经典性条件反射学说的影响，建立了刺激——反应模式，成为经典性行为主义理论。新行为主义代表人物之一的斯金纳，则受到操作主义哲学的影响，建立了操作行为主义，和“刺激——反应——强化”的模式。"],"q":"13.听说教学法的语言学基础是结构主义语言学，心理学基础是行为主义心理学。","w":"high","e":["2026 真题","2026 445 二、教育学、心理"]},{"t":"行为主义学习理论","y":"名词解释","p":["行为主义学习理论受经验主义哲学影响，认为学习是人和动物受环境支配、获得经验而被动形成的行为的改变。在这一过程中，完全排斥人的主观思想或思维活动。","行为主义学习理论是在经典条件作用与操作性条件作用的基础上建立起来的刺激—反应学习理论，历来是西方学习理论的主体部分。","这里需要特别提到桑代克的“尝试—错误学习理论”和斯金纳的“操作学习理论”。","桑代克通过饿猫的“迷箱实验”提出联结试误说；斯金纳提出操作性(也称工具性)条件作用理论。"],"q":"1.行为主义学习理论来源于哲学上的理性主义。","w":"high","e":["2026 真题"]},{"t":"视听法","y":"名词解释","p":["视听法是50年代产生于法国的一种第二语言教学法，它强调在一定的情景中听觉(录音)感知与视觉(图片影视)感知相结合的教学方法。","因它首创于法国圣克卢高等师范学院，所以也叫“圣克卢法”，代表人物是古布里纳(P. Guberina)和古根汉(G. Gougenhein)。","视听法来源于直接法和听说法，它继承和发扬了二者的长处。","视听法的理论基础也是结构主义语言学和行为主义心理学，认为掌握了一种语言的结构就是掌握了该语言。","视听法又受到完形心理学的影响，强调完整地感知事物，所以视听法也叫“整体结构法”。"],"q":"15. 是听说法、视听法等教学法流派的心理学理论基础。","w":"high","e":["2019 真题"]},{"t":"言语行为理论","y":"名词解释","p":["50年代末英国哲学家奥斯汀提出“言语行为”理论（speech act theory）。","他指出语言不仅是描写、陈述和说明客观世界，提供信息，而且人们说出话语也是一种行为。人们在说话的时候，就是在做一件事，完成一种行为。","奥斯汀认为人们所说出的话语能同时进行三种行为，即言内行为、言外行为和言后行为。","仍以“屋里很热”这句话为例，言内行为是说话人通过发声把这句话说出来；言外行为则是通过这句话来表达隐含的真正意图，也就是言外之意；言后行为则是指这句话对听话人所产生的影响。"],"q":"5.“言语行为理论”的“言内行为”是说话人通过发声把话说出来，它所直接表达的是字面的意思。","w":"high","e":["2019 真题"]},{"t":"认知学习理论","y":"名词解释","p":["认知学习理论受哲学上的理性主义的影响，认为学习是学习者对环境和客观事物主动的认识和行为的主动的改变，是主体的认知过程，而不是在外界环境支配下被动地进行刺激—反应的联结和行为习惯的改变。","它强调学习中认知机制所起的作用，着重探讨学习者内部心理结构的形成和改变。","这里主要介绍格式塔心理学的完形说和布鲁纳的认知—发现说。","德国格式塔心理学家柯勒通过猩猩取香蕉实验认为这是通过顿悟实现了学习，顿悟是指突然觉察到解决问题的办法。"],"q":"11.答案：认知学习【解析】认知学习理论是通过研究人的认知过程来探索学习规律的学习理论。","w":"high","e":["2019 真题"]},{"t":"认知方式","y":"名词解释","p":["认知方式(cognitive style)是人们感知和认识世界的方式，对学习者说来，也是其学习方式。","认知方式存在着个体差异，这里着重讨论场独立性和场依存性、审慎与冲动、歧义容忍度等。","场独立性是易于从整体中发现个别的认知方式，善于剖析事物和问题，把部分与整体区别开来，能集中于某一部分而不受其他部分的干扰；场依存性是易于感知事物整体的认知方式，倾向于从宏观上看事物并把事物作为一个整体来对待。","审慎型的人在学习中善于周密地思考，全面分析，反复权衡以后才做决定或反应；冲动型的人在学习中反应快捷，甚至不假思索。"],"q":"①认知方式没有优劣好坏之分，只是表现为学生对信息加工方式的某种偏爱，主要影响学生的学习方式。","w":"high","e":["2020 真题"]},{"t":"认知法","y":"名词解释","p":["认知法又称认知—符号法(Cognitive-Code Approach)，60年代产生于美国，代表人物是美国心理学家卡鲁尔(J. B. Carroll)。","认知法主张在第二语言教学中发挥学习者智力的作用，通过有意识地学习语音、词汇、语法知识，理解、发现、掌握语言规则，并能从听、说、读、写方面全面地、创造性地运用语言。","认知法的语言学理论基础是乔姆斯基的转换生成语法理论，认为语言是一种受规则支配的体系而不是习惯体系；其心理学基础是认知心理学。","认知法还受到皮亚杰的“发生认识论”以及布鲁纳“学科结构论”和“发现学习论”等心理教育学理论的影响。"],"q":"10. 是认知法教学流派的心理学理论基础。","w":"high","e":["2018 真题","2021 真题"]},{"t":"记忆","y":"名词解释","p":["记忆是过去的经验在人脑中的保存和提取，是人脑对过去经历过的事物的反映。","第二语言记忆则是指第二语言知识和能力的保持和再现，是第二语言学习者主动积极的活动过程。","记忆按其内容分为形象记忆、逻辑记忆、情绪记忆和运动记忆等，第二语言记忆涉及到所有这些方面。","记忆按保持的状态和时间分为感觉记忆、短时记忆和长时记忆。"],"q":"8.心理学中关于遗忘的 认为由记忆所建立的暂时神经联系的痕迹，由于受到其他刺激的干扰而产生抑制，所以产生遗忘。","w":"high","e":["2019 真题"]},{"t":"诊断测试","y":"名词解释","p":["诊断测试是为了了解受试者在学习某一具体内容或在较短的一段学习时间里所存在的问题而进行的测试。","目的是迅速直接地获得反馈信息，及时改进教学。这也是一种回顾兼预示性的测试，常常是与一具体的短期目标相联系。","学校中的小考、小测验都属于这一类。诊断测试是非正式的测试，命题、评分都比较灵活，一般也不用作衡量学生水平的主要依据。"],"q":"15.成绩测试和诊断测试要求有较高的 效度。","w":"high","e":["2026 445 二、教育学、心理"]},{"t":"词义的主观性","y":"名词解释","p":["词义的主观性主要表现为两个方面：一是使用主体的民族性；二是词义理解的个体性。","不同民族在用不同的词语记录客观世界和主观世界的事物现象时，由于民族思维、语言系统、生活习惯等方面的差异，决定了词义的民族差异。","即使同一个民族，在对事物认识基本一致的情况下，也会因年龄、生活环境、文化水平和认知能力等差异，造成词义理解的个体差异。"],"q":"②词义的主观性主要表现为两个方面：一是使用主体的民族性；","w":"high","e":["教材高频"]},{"t":"词义的客观性","y":"名词解释","p":["词义的特征主要有客观性、主观性、概括性和演变性。","词义的客观性主要表现在两个方面：一是反映对象的客观存在性；二是词义形成的约定俗成性。","从反映对象上看，无论是客观世界的山川草木，还是主观世界的爱恨情仇，都是客观存在的。","从词义形成来看，什么样的语音形式及其书写形式表示什么事物、现象及其关系的意义，是基于社会成员客观存在的共同认知而约定俗成的。","当然，词义的客观性并非客观存在或约定俗成本身，也不与客观存在的事物、现象及其关系完全符合或等同。"],"q":"①词义的客观性主要表现在两个方面：一是反映对象的客观存在性；","w":"high","e":["教材高频"]},{"t":"词根","y":"名词解释","p":["词根是构成合成词的有实在意义的不定位语素。","合成词是由两个或两个以上语素构成的词。根据语素在合成词中的表义作用，把语素分为词根和词缀。","词缀是构成合成词的附着在词根前后或中间表示附加意义的定位语素。"],"q":"9.由两个不同的词根组合而成的词叫 ，由词根和词缀组合而成的词叫 。","w":"high","e":["教材高频"]},{"t":"词汇","y":"名词解释","p":["词汇也称语汇，是语言中能独立运用的最小的音义结合单位的集合，有时也可以指特定领域中词语的集合。","词语是能够独立运用的音义结合的最小语言单位。词语包括词和固定短语，词是词汇的主体部分，而固定短语是词汇的重要组成部分。","词语的总和形成词汇，词汇与词语的关系是集合与个体的关系。","根据语言差异，词汇可分为汉语词汇、英语词汇、德语词汇等；根据领域不同，词汇可分为政治词汇、经济词汇、法律词汇等。"],"q":"9.一个词的词汇意义主要可分两种，一是 ，一是色彩义。","w":"high","e":["教材高频"]},{"t":"词汇教学","y":"名词解释","p":["对外汉语词汇教学的任务是根据教学大纲的要求，在有关汉语词汇知识的指导下，掌握一定数量的汉语词汇的音、义、形和基本用法，培养在语言交际中对词汇的正确理解和表达能力。","词汇是语言的建筑材料，是句子的基本结构单位。没有词汇就无法传递信息，也就无从交际。","词汇教学原则主要有：(1)要认真掌握每一个词语的具体意义和用法；(2)词的教学应与句子教学相结合，在一定的语境中掌握词汇；(3)利用词的聚合和组合关系在系统中学习词；(4)掌握汉语构词法，重视语素教学，词与字(语素)教学相结合；(5)不同的言语技能对词的掌握有不同的要求；(6)加强词汇的重现与复习，减少遗忘。"],"q":"语义文化常常和词汇教学结合在一起。","w":"high","e":["2019 真题"]},{"t":"词类","y":"名词解释","p":["词类专指词的语法类别","不同的词类在形态、意义和功能等方面表现出区别性特点","划分词类的目的是为了说明语言的构造规则","词类是一个有层次的系统"],"q":"20.汉语词类的划分，主要依靠词的语法功能，即词的组合能力。","w":"high","e":["2013 真题","2018 真题"]},{"t":"词缀","y":"名词解释","p":["词缀是构成合成词的附着在词根前后或中间表示附加意义的定位语素。","合成词根据词缀的位置，可以分成前缀、后缀、中缀三种类型。","汉语里典型词缀并不太丰富，但是存在比较多的“类词缀”，特点是类似于词缀，意义有不同程度的虚化，但还不彻底；构词功能很强，有组合泛化趋势；其中，后缀与类后缀型最为丰富，中缀和类中缀最少。"],"q":"9.由两个不同的词根组合而成的词叫 ，由词根和词缀组合而成的词叫 。","w":"high","e":["教材高频"]},{"t":"话语","y":"名词解释","p":["简单说来，话语是在交际过程中一定语境下表示完整语义的自然语言，是由结构衔接、语义连贯、排列符合逻辑来表达某个主题的连续的句子所构成的语言整体。","话语从形式上看通常是大于句子的语言单位，可能是句组、段落甚至篇章；也可能只是一个句子，一个短语甚至一个词。","话语既包括口语，也包括书面语。"],"q":"7.奥斯汀的“言语行为理论”认为人们的话语能同时进行三种行为，即言内行为、 、言后行为","w":"high","e":["2018 真题"]},{"t":"话语分析","y":"名词解释","p":["话语分析作为一种语言研究方法，在第三章第二节已经做了介绍；70年代末大力倡导把话语分析用于第二语言习得研究的是哈奇(E. Hatch)。","她认为语言习得最重要的途径是语言交际，即第二语言学习者与以该语言为母语者之间的交谈，因此特别强调研究话语分析中的会话分析。","也有的学者认为不仅要研究学习者如何掌握语言形式，还要研究如何恰当地运用这些形式，因而强调研究言语行为和功能(如抱歉、邀请、埋怨等)。","对语言形式和功能的重视，打开了话语分析研究的广阔领域。"],"q":"会话分析是对日常会话的结构与规律进行的分析，已经成为话语分析的重要组成部分。","w":"high","e":["2020 真题"]},{"t":"语义场","y":"名词解释","p":["语义场就是在共时条件下，在同一个语义系统中具有意义联系的词的聚合体，语义场是义素分析的依据。","义位之间的意义关联性是义素对比分析的基本条件，义素对比分析的对象必须是具有意义关联性的同一语义场的义位。","根据语义场内义位之间的关系，可以把语义场分为分类语义场、顺序语义场、关系语义场、反义语义场、同义语义场。语义场具有联系性、民族性、层次性三个特征。"],"q":"15.属于同一语义场的词，既具有相同的义素，又具有不同的义素。","w":"high","e":["教材高频"]},{"t":"语义文化","y":"名词解释","p":["语义文化指语言的语义系统、主要是词汇中所包含的社会文化涵义，它反映了民族的心理模式和思维方式。","这是语言中的文化因素最基本、最大量的表现形式，也是语言教学中文化因素教学的重点之一。","首先是一个民族文化中特有的事物和概念体现在词汇中，而在别的语言中没有对应词语，如不加解释，第二语言学习者就难以理解。","更多的则是某一事物或概念虽在不同的语言中有对应词语，但词义却存在很大差别，因而在语言交际中最容易造成误解和障碍。"],"q":"2.语义文化对词语教学有何影响?","w":"high","e":["2019 真题"]},{"t":"语体色彩义","y":"名词解释","p":["语体色彩义是指词义所反映的适用于不同交际场合和文体的语体特征。","词义的语体色彩可以分为两类：口语语体色彩和书面语体色彩，书面语体色彩还可以进一步分为文艺语体、科技语体、政论语体、公文语体四类。","大多数词语既可以用于口语语体，也可以用于书面语体，具有通用的中性语体色彩。"],"q":"②主观色彩义，分为情态色彩义和语体色彩义。","w":"high","e":["教材高频"]},{"t":"语气词","y":"名词解释","p":["一般用于句末","表示陈述、疑问、祈使、感叹等语气","永远黏着、后附、轻声"],"q":"”这句话中的“的”是语气词。","w":"high","e":["2016 真题","2020 真题"]},{"t":"语法","y":"名词解释","p":["制约着句子组合合法性的规则就是“语法”","语法是语言不可缺少的有机的组成部分","语音是语言的物质外壳，词汇是语言的建筑材料，语法是语言的构造规则","词语的组合绝不是任意的，符合规则句子就合法，否则就不合法"],"q":"13.短语是由两个或两个以上的 ，按照一定的 组合起来，并且产生一定的语法关系的语言单位。","w":"high","e":["2016 真题","2019 真题"]},{"t":"语法功能","y":"名词解释","p":["词的组合能力","能否与其他的词组合成短语","以什么顺序组合","组合以后表示什么关系","作句法成分的能力"],"q":"21.区别词的主要语法功能是做定语，不能做谓语。","w":"high","e":["教材高频"]},{"t":"语法教学","y":"名词解释","p":["语法教学是对目的语的词组、句子以及话语的组织规律的教学，用以指导言语技能训练并培养正确运用目的语进行交际的能力。","不掌握目的语遣词造句的规则，就难以正确理解和表达。语法教学一直处于第二语言教学的中心地位。","语法教学原则主要有：(1)通过语言对比突出语法的重点和难点；(2)从句型入手，句型操练与语法知识的归纳相结合；(3)由句子扩大到话语；(4)语法结构的教学与语义、语用和功能的教学相结合；(5)精讲多练，以练习为主；(6)先易后难、循序渐进地安排语法项目；(7)重视纠正学习者的语法错误，并把病错句的分析作为课堂教学内容的一个部分。"],"q":"到了18——19世纪，西欧一些国家确定了翻译法的教学地位，因此法重视语法教学而被称为语法法或语法翻译法，因继承了拉丁语的传统又称传统法。","w":"high","e":["2020 真题","2021 真题"]},{"t":"语法翻译法","y":"名词解释","p":["语法翻译法又称“传统法”或“古典法”，是以系统的语法知识教学为纲，依靠母语，通过翻译手段，主要培养第二语言读写能力的教学法。","这是第二语言教学史上最古老的教学法，在欧洲用于教授古希腊语、拉丁语已有千百年的历史。","语法翻译法的语言学基础是历史比较语言学，认为一切语言都起源于一种共同的原始语言，语言规律是共同的，词汇所代表的概念也是相同的，所不同的只是词汇的语音和书写形式。","语法翻译法的心理学基础是18世纪德国的官能心理学，其创始人是德国哲学家沃尔夫(C. Wolff)。","18世纪末、19世纪初，德国语言学家奥伦多夫(H. Ollendorff)等对语法翻译法进行了理论上的总结与阐述，使之成为一种科学的第二语言教学法体系。"],"q":"15.教学法中的语法翻译法是第二语言教学史上最古老的教学法。","w":"high","e":["2018 真题","2021 真题"]},{"t":"语用文化","y":"名词解释","p":["语用文化指语言用于交际中的语用规则和文化规约，是由不同民族的文化、特别是习俗文化所决定的。","语用文化是培养语言交际能力的主要内容，是对外汉语教学中文化因素教学的重点之一。","可以和功能意念的教学和语用规则的教学结合在一起。对外汉语教学中常用的基本的语用文化包括：称呼；问候和道别；道谢和道歉；敬语与谦辞；褒奖与辞让；宴请与送礼；隐私与禁忌。","如中国人敬老在称呼中加上“老”字如“老大爷”、“老大娘”。"],"q":"以上一小节所谈的语用文化为例，近年来“谢谢”就用得越来越多，回答别人的夸奖(甚至对女孩子服饰、容貌的夸奖)，也常常用“谢谢”，而不一定非用“哪里，哪里”。","w":"high","e":["2020 真题"]},{"t":"语素","y":"名词解释","p":["语素是语言中最小的音义结合的构词单位，是最基本的语言单位。","一个语素必须是语音与语义结合，而且不能再拆分。其中，具有一定的语义是判断语素的最基本条件。","汉语绝大多数语素是一个有意义的音节。如“床”的语音形式是chuáng，它的语义内容是“供人躺在上面睡觉的家具”，那么，“床”就是一个语素。","有少数语素是由两个无意义的音节合成的。如“玻璃”，它的语音形式是bōli，语义是“一种质地硬而脆的透明物体”。“玻”和“璃”虽然都有语音形式，但都没有单独的语义，因此都不是语素；只有“玻璃”才是一个语素。"],"q":"12.从形式上看，语素可以分为单音节语素、双音节语素和多音节语素。","w":"high","e":["教材高频"]},{"t":"语素文字","y":"名词解释","p":["从汉字符号记录语言的单位来看，现代汉字是一种语素文字。","表音文字根据文字所记录的语言单位的不同，可以分为音素文字和音节文字两种类型。","汉字在记录语言时，利用了语素音义兼顾的特点，用能产性极强的形声字分别记录语素意义所属的类别和语素的音节。"],"q":"6.世界上文字种类很多，大致可以分为 文字、 文字和语素文字三种。","w":"high","e":["2018 真题"]},{"t":"语言习得机制","y":"名词解释","p":["乔氏认为人类先天具有一种习得语言的特殊能力，表现为儿童头脑中有一种受遗传因素决定的“语言习得机制”(language acquisition device，简称LAD)。","这一特殊机制脱离人类的其他功能而独立存在，甚至跟智力没有直接关系，在12岁以前发挥作用。","语言习得机制包括两部分：一部分是以待定的参数形式出现的、人类语言所普遍具有的语言原则，又称为“普遍语法”。","语言习得机制的第二部分是评价语言信息的能力，也就是对所接触到的实际语言的核心部分进行语言参数的定值。"],"q":"出一个“语言习得机制”假说来解释语言学习过程，区分了语言能力和语言行为。","w":"high","e":["2020 真题"]},{"t":"语言和言语","y":"名词解释","p":["根据瑞士语言学家索绪尔对语言（langue）和言语（parole）的区分，语言是对言语的抽象和概括，常常指作为社会惯例的语音、词汇、语法的规则系统；言语是语言的表现形式，也可以说是个人对语言在特定环境中的运用。","语言存在于言语之中，通过言语来体现，平常我们接触到(听到、看到)都是具体的言语。","两者的关系好比“人”和张三、李四的关系：张三、李四是“人”的具体表现形式，而“人”是对张三、李四等很多人的特点的抽象。"],"q":"索绪尔还区分了“语言”和“言语”，区分“内部语言学”(语言本身的结构)和“外部语言学”(语言与社会、民族、文化、政治等的关系)。","w":"high","e":["2017 真题"]},{"t":"语言学习环境","y":"名词解释","p":["语言学习环境，是一个内涵与外延较广的概念。可以说，学习者主体以外、与语言学习和运用有关的一切周围事物都是语言学习环境的一部分。","从国家的政治、经济、文化、语言政策、教育政策等所形成的宏观语言环境，到使用目的语的社会大环境和课堂学习小环境。","如果说生理、认知、情感等个体因素是第二语言习得的内部条件的话，环境则是客观存在、影响第二语言习得的外部条件。","不论是一语言或第二语言的获得，都与环境有密切的关系。"],"q":"1.答案：预测【解析】对比分析是通过对比不同语言(如第一语言和第二语言)来确定潜在错误的方法，从而把第二语言学习环境下必须学习的和不必学习的东西最终区分开来。","w":"high","e":["2019 真题"]},{"t":"语言学能","y":"名词解释","p":["这种学习第二语言所需要的特殊认知素质叫做第二语言学习的能力倾向，也称语言学能(language aptitude)。","一般的智商测验不能准确地预测语言学能，专门用来测量语言学能的是语言学能测验。","有影响的语言学能测验有三种，即由卡罗尔(J. Carroll)和萨彭(S. Sapon)于1959年编制的《现代语言学能考试》和1967年编制的《初级现代语言学能考试》以及由平斯勒(P. Pimsleur)于1966年编制的《语言学能考试》。","语言学能测验，根据卡罗尔的观点，主要考查四种能力：语音编码解码能力、语法敏感性、强记能力、归纳能力。"],"q":"13.学习第二语言所需要的特殊 素质叫做语言学能，也叫做第二语言学习能力倾向。","w":"high","e":["2020 真题"]},{"t":"语言测试","y":"名词解释","p":["语言测试是根据一定的评估目的，以抽样方式通过有限试题来诱导出受试者的言语行为，然后借助于定量描述来推断受试者掌握的该语言的知识和能力。","从心理学的角度来看，上述定义表明，测试的任务在于如何诱导出体现受试者语言知识和能力的言语行为，并对这种行为进行量化和说明解释。","语言测试具有间接性、片面性、主观性和偶然性四个特点。","测试是教育评估的主要手段，也是教学活动的主要环节之一。测试是第二语言教学四大环节的重要组成部分。"],"q":"13.语言测试有间接性、片面性、主观性和 等特点，结果很难客观、准确、真实。","w":"high","e":["2020 真题","2021 真题"]},{"t":"语言能力","y":"名词解释","p":["乔姆斯基在60年代提出“语言能力”的概念，并将内在的“语言功能”与“语言表现”，即对语言的实际运用做了区分。","所谓“语言能力”是指人们所具有的语言知识，是一种内化了的包括语音、词汇、语法等的语言规则体系。","根据转换生成语言理论，一个人的语言能力主要表现在能正确组合声音和语素；能区分是否合乎语法的句子；能区分结构相同或相似但意义不同的句子等；而最根本之点则是能运用这一有限的规则体系创造出无限的句子。","可见“语言能力”主要是与语言形式结构有关，实际上是一种高度抽象的语法能力，是一种脱离外部语言环境的、人的内部心理机制。"],"q":"Lenneberg把儿童习得语言的优势归因于生理因素，认为语言是大脑的产物，语言能力的发展受到人的生理基础的严格制约。","w":"high","e":["2018 真题"]},{"t":"语音","y":"名词解释","p":["由人的发音器官发出","不同的语音代表不同的意义","作用是进行社会交际，具有“社会”的属性"],"q":"1.语音是由人的发音器官发出来的，发音器官的部位和活动方式不同，发出的声音也相异。","w":"high","e":["2016 真题","2020 真题"]},{"t":"语音教学","y":"名词解释","p":["对外汉语语音教学的任务是让学习者掌握汉语语音的基本知识和汉语普通话正确、流利的发音，为用口语进行交际打下基础。","语音是语言的物质外壳。语音的重要性决定了语音教学是第二语言教学的基础，是掌握听说读写技能和交际能力的前提。","语音教学原则主要有：(1)短期集中教学与长期严格要求相结合；(2)音素教学与语流教学相结合；(3)通过语音对比突出重点和难点；(4)声韵调结合教学，循序渐进；(5)听说结合，先听后说；(6)以模仿和练习为主、语音知识讲解为辅；(7)机械性练习与有意义练习相结合。"],"q":"6.语音教学要把短期 教学和长期严格求结合起来。","w":"high","e":["2020 真题"]},{"t":"说文解字","y":"名词解释","p":["东汉许慎所著","中国第一部系统分析字形的字典","收字9353，按540部首编排","首创部首检字法"],"q":"6.东汉的许慎写成《说文解字》一书，系统分析了汉字的构造。","w":"high","e":["2018 真题"]},{"t":"课堂教学","y":"名词解释","p":["课堂教学是指教师根据教学大纲规定的目的、任务和教材，运用恰当的教学方法，在规定的时间内对固定班级的学生进行某门课程教学的形式。","在学校教育中，课堂是实施教学的主要场所。对外汉语课堂教学是对外汉语教学的基本组织形式，集中地体现了对外汉语教学过程。","教学过程的感知、理解、巩固、运用阶段主要在课堂教学中完成。实施教学计划，贯彻教学原则，运用教学方法，完成课程教学并实现教学目标，主要都是靠课堂教学。","在教学活动的四大环节中，课堂教学是中心环节。要提高教学效果，就要提高课堂教学质量。"],"q":"2.通过课堂教学接触目的语的( )是极有限的，目的语的输入量也无法与自然习得相比。","w":"high","e":["2019 真题"]},{"t":"调值","y":"名词解释","p":["音节读音高低、升降、曲折、长短的具体变化值"],"q":"5.普通话的调值一般采用( )来表示。","w":"high","e":["2014 真题","2020 真题"]},{"t":"调号","y":"名词解释","p":["声调的标志符号","把五度标调法图形简化","“-、ˊ、ˇ、`”分别表示阴平、阳平、上声、去声"],"q":"4.在拼音中，凡标有调号的元音就是主要元音，即韵腹。","w":"high","e":["2013 真题","2017 真题","2023 真题"]},{"t":"调类","y":"名词解释","p":["声调的类别","把调值相同的音节归在一起","根据区别意义的不同声调调值建立","有多少个不同调值就有多少个调类"],"q":"4.调类 调值【出处】《现代汉语》上册79页。","w":"high","e":["2015 真题","2021 真题"]},{"t":"谚语","y":"名词解释","p":["谚语是民间基于深刻的社会生活经验而提炼出来的通俗、上口、精练、形象而有一定警示或教育意义的熟语。","谚语是人民智慧的结晶，能以浅显的语言表达深刻的道理。","根据谚语所反映的内容，谚语主要包括六种类型：农业谚语、气象谚语、规诫谚语、常识谚语、讽颂谚语、风土谚语。"],"q":"10.现代汉语的熟语主要包括： 、谚语、 和歇后语。","w":"high","e":["教材高频"]},{"t":"象形","y":"名词解释","p":["用线条描画出事物的形象，其字形与字义的联系比较具体、紧密。","这类字大多表示自然界和日常生活中的实物。","许多事物用几根线条很难画出，所以用这种方法造出来的字并不多。","由于字形历史演变等原因，这类字的形体象形意味现在大为减弱，不少已经失去了跟字义的直接联系，有些还变成了记号。"],"q":"9.“瓜”是象形字，“见”是指事字。","w":"high","e":["2012 真题"]},{"t":"趣味性","y":"名词解释","p":["趣味性是对外汉语教材编写和选用的原则之一。","教材内容和形式生动有趣，能吸引学习者，使学习者产生学习兴趣和动力，让相对说来比较枯燥的语言学习过程变得轻松愉快。","趣味性主要体现在：(1)教材的趣味性与教材的实用性、交际性紧密相关；(2)教材内容要反映现实，是学习者所关注的话题；(3)教材内容要逐步加大文化内涵，多方面介绍目的语文化；(4)多样化是形成趣味性的重要因素。"],"q":"过于机械操练，忽略汉字学习的趣味性等)。","w":"high","e":["2020 真题"]},{"t":"跨文化交际","y":"名词解释","p":["跨文化交际是指不同文化背景的人们之间的交际行为。这种交际主要是通过语言来进行的，称为跨文化语言交际。","影响跨文化语言交际的是不同文化之间的相同之处和不同之处，特别是文化差异。因此跨文化交际中要特别重视并研究文化差异。","跨文化交际的特点：(1)文化的差异与交际障碍；(2)交际原则与价值观念；(3)母语文化的思维定势和对异文化的成见；(4)交际过程中的相互接近和求同趋向；(5)交际的结果：文化的相互影响。","从上述五个特点可以看出，跨文化交际的根本特征是如何发现、认识和对待不同文化之间的差异。"],"q":"壹中外文化及跨文化交际基础知识(共80分)一、填空题(每小题1分，共40分)","w":"high","e":["2019 真题"]},{"t":"辅音","y":"名词解释","p":["气流在发音部位受到明显的阻碍","又叫子音","主要功能是担当声母或韵尾"],"q":"4.发辅音时，气流在口腔或鼻腔中要受到这样或那样的阻碍，声带不一定颤动，声音一般不响亮。","w":"high","e":["2012 真题","2018 真题"]},{"t":"输入假说","y":"名词解释","p":["从70年代末开始，美国语言教育家克拉申对第二语言习得提出了一系列假说，1985年在其著作《输入假说：理论与启示》中正式归纳为习得与学习假说、自然顺序假说、监控假说、输入假说和情感过滤假说等五个系列假说，总称为输入假说理论。","这一理论被认为是第二语言习得研究中论述最全面、影响最大的理论，但同时也是引起很多争议的理论。","输入假说认为人类获得语言的惟一方式是对信息的理解，也就是通过吸收可理解的输入(comprehensible input)习得语言知识；输入的语言信息既不要过难也不要过易，克拉申用“i+1”来表示，i代表学习者目前的语言水平，i+1则是下一阶段应达到的语言结构的水平。","克拉申强调听力活动对语言习得最为重要，语言习得是通过听力理解来实现的，而不是通过“说”获得的。"],"q":"3.自然顺序假说是克拉申输入假说理论基础。","w":"high","e":["2025 真题","2025 445 二、教育学、心理"]},{"t":"近义词","y":"名词解释","p":["近义词是指意义基本相同，但在意义、功能或色彩上存在细微差别的词。","近义词属于同义词，同义词辨析可运用色彩分析法、意义分析法、功能分析法。"],"q":"五、近义词辨析(每题5分，共20分)","w":"high","e":["教材高频"]},{"t":"近形字","y":"名词解释","p":["近形字也称形近字，是指字形相近而音、义有别的字。","近形字会给汉字的使用带来种种不便。","近形字的差异大体表现在以下四个方面：1.笔画数的微小差异；2.个别笔形的差异；3.笔画组合关系的差异；4.构字部件有局部差异。"],"q":"二、近形字(一)近形字的形成近形字也称形近字，是指字形相近而音、义有别的字。","w":"high","e":["2011 真题","2018 真题"]},{"t":"连中三元","y":"名词解释","p":["乡试解元、会试会元、殿试状元","三级皆第一为连中三元","历史上极为罕见"],"q":"3.科举考试中，“连中三元”指的是一个人在乡试、 和殿试中都考取第一名。","w":"high","e":["2020 真题"]},{"t":"道教","y":"名词解释","p":["中国本土宗教、尊老子为教主","东汉张陵创五斗米道（天师道）","追求长生久视、得道成仙","金元后分全真道与正一道"],"q":"3.《老子》、《 》二书被奉为道教经典，称《道德真经》与《南华真经》。","w":"high","e":["2017 真题"]},{"t":"遗忘曲线","y":"名词解释","p":["这就是德国著名心理学家、记忆与遗忘现象实验研究的创始人艾宾浩斯的遗忘曲线。","遗忘规律启示我们，在第二语言教学中对已识记的材料应赶在遗忘以前迅速地、及时地进行巩固、复习、重现和运用，并且要经常复习，复习的间距由短拉长。","从识记的时间来看，遗忘的进程并不是均衡的。在识记的最初时间遗忘很快，识记后的一小时遗忘率达56％，以后就逐渐放慢，31天后遗忘率达79%，到一定程度就不再遗忘。"],"q":"12.艾宾浩斯的遗忘曲线告近人们，在识记的 时间遗忘得快。","w":"high","e":["2020 真题"]},{"t":"郑和下西洋","y":"名词解释","p":["明永乐至宣德年间七次远航","最远到达非洲东海岸","途经30余国","比哥伦布早87年","宣德化柔远人的朝贡贸易"],"q":"20.答案：郑和下西洋一家专注汉硕考研的店铺【解析】郑和下西洋是中国古代规模最大、船只最多(240多艘)、海员最多、时间最久的海上航行，比欧洲多个国家航海时间早几十年，是明朝强盛的直接体现。","w":"high","e":["2017 真题","2022 真题"]},{"t":"郡县制","y":"名词解释","p":["秦统一后全面推行","分天下为三十六郡","中央直接任免、加强中央集权"],"q":"2.在行政区划上，元、明、清三代实行郡县制。","w":"high","e":["2025 445 一、中外文化及跨"]},{"t":"部件","y":"名词解释","p":["部件是由笔画组成的、能独立运用的、具有组配汉字功能的构字单位。","部件也可以看作是对整字进行一次或几次切分后得出来的构字单位。","大多数部件是由一些笔画组合成的“构件”，它们可以独立运用；有少数部件本身就是一个字；也有少数部件本身就是一个笔画。"],"q":"6.由两个或两个以上的部件构成的汉字就是合体字。","w":"high","e":["2013 真题","2019 真题"]},{"t":"部位","y":"名词解释","p":["要确定部件的名称，还要给汉字字形结构的各个位置定名，这就叫部位。可以分为八类。","八类部位可以编成16字口诀：上“头”下“底”，左“旁”右“边”，内“心”外“框”，中“腰”四“角”。","使用统一规范的部件和部位名称，可以把一个结构复杂的汉字称说得既准确又清楚，这就叫“部件识字法”。"],"q":"1.语音是由人的发音器官发出来的，发音器官的部位和活动方式不同，发出的声音也相异。","w":"high","e":["教材高频"]},{"t":"部首","y":"名词解释","p":["“部首”是指可以成批构字的一部分部件。含有同一部件的字，在“字集”中均排列在一起，该部件作为领头单位排在开头，成为查字的依据。","部首一般包括两类：一是形旁，例如“栋”“梁”的部首都是“木”；二是某些笔画，例如“头”的第一笔“、”就是部首。","《说文解字》的部首是540个，《现代汉语词典》（第6版）的部首是201个。"],"q":"5.部首是指具有字形归类作用的偏旁。","w":"high","e":["2014 真题","2021 真题"]},{"t":"部首法","y":"名词解释","p":["部首法是东汉许慎在《说文解字》中首创的。","《说文解字》把汉字按其来源分为540部，每部把共同傍从的形旁字列在开头，称为部首。","部首法自创立以后千百年来一直为编纂字书的人所采用，只是分部的多少和字的归部原则有所不同。","语文学界把214部的部首系统称为“传统部首”，而把改变214部的现代各种部首系统称为“改良部首”。"],"q":"7.汉字序列法中的()又分部首法、笔画法和笔形法。","w":"high","e":["2013 真题","2020 真题"]},{"t":"重叠词","y":"名词解释","p":["重叠式合成词是通过同一词根的重叠而形成合成词的方式。","重叠词主要分两种：AA型（如爸爸、常常）和AABB型（如骂骂咧咧、花花绿绿）。","AABB型重叠式合成词既没有对应的AB型词，也没有因重叠而增加语法上的意义，属于词法学的构词重叠；而“漂漂亮亮、大大方方”都有对应词“漂亮、大方”，重叠形式具有“程度加强”的语法意义，属于语法学的构形重叠。"],"q":"11.“猩猩”是一个重叠词。","w":"high","e":["教材高频"]},{"t":"鉴真","y":"名词解释","p":["唐代高僧、律宗传人","六次东渡，双目失明","754年抵日，传戒授律","创建唐招提寺，日本律宗初祖"],"q":"31.鉴真【解析】扬州大明寺位于江苏省扬州市蜀冈中峰。","w":"high","e":["2017 真题"]},{"t":"鉴真东渡","y":"名词解释","p":["唐代高僧六次东渡日本","双目失明仍矢志不渝","传授戒律建筑医药","主持修建唐招提寺"],"q":"唐天宝元年，名僧鉴真东渡日本前，即在此传经授戒，该寺因此名闻天下。","w":"high","e":["2017 真题"]},{"t":"针对性","y":"名词解释","p":["针对性是教材编写和选用的原则之一。","教材要适合使用对象的特点。最基本的特点是，不同母语、母语文化背景与目的语、目的语文化对比所确定的教学重点不同。","针对性包括：(1)学习者的年龄、国别、文化程度特点；(2)学习者学习目的的不同；(3)学习者学习的起点不同，根据学习者原有的目的语水平分为初、中、高三级教材；(4)学习时限的不同。"],"q":"【解析】这是特指问的简略格式，在形式上没有疑问代词出现，但在句末用疑问语气词“呢”，而且要求有针对性的回答。","w":"high","e":["2020 真题"]},{"t":"难度等级模式","y":"名词解释","p":["难度等级模式由普拉克特(C. Practor)提出，是一种分类比较简明的语言难度等级模式。","该模式将难度分为六级，从零级到五级，级数愈高难度也愈大。","零级：指两种语言中相同的成分，在学习中产生正迁移，而不会发生困难。如英语和汉语都是“动词＋宾语”的语序。","一级：在第一语言中分开的两个语言项目，在目的语中合成一项。二级：第一语言中有而目的语中没有的语言项目，学生必须避免使用。三级：第一语言中的某个语言项目在目的语中虽有相应的项目，但在项目的形式、分布和使用方面又有着差异。四级：目的语中的某个语言项目，在其第一语言中没有相应的项目，学习者在习得这些全新的项目时会产生阻碍性干扰。五级：第一语言中的一个语言项目到了目"],"q":"13.普拉克特的难度等级模式分为一级到六级。","w":"high","e":["2020 真题"]},{"t":"零声母","y":"名词解释","p":["没有辅音开头的音节","韵母独自形成音节","y、w不是真正的声母，而是隔音字母"],"q":"1.合口呼零声母音节，拼写的时候，一律把u改写成w。","w":"high","e":["2016 真题","2022 真题"]},{"t":"青铜器","y":"名词解释","p":["铜锡铅合金","夏代始，商周鼎盛","礼器乐器兵器生活用器","饕餮纹、司母戊鼎、四羊方尊"],"q":"2.青铜器兴盛于中国的 时期。","w":"high","e":["2019 真题","2015 真题"]},{"t":"青铜礼器","y":"名词解释","p":["商周祭祀宴飨礼仪用器","藏礼于器的宗法等级体现","鼎簋尊卣爵觚等","列鼎制度天子九鼎"],"q":"5.商周青铜礼器分为食器、酒器和水器，如鼎、爵、盘等。","w":"high","e":["2017 真题"]},{"t":"音序法","y":"名词解释","p":["音序法是按照字音来排列字序的方法。","汉字的音序法经历了声韵序列法、注音字母序列法和汉语拼音字母序列法三个阶段。","汉语拼音序列法内部还有两种：单纯的字母序列法与“音节·汉字·字母分层序列法”。","用音序法排检汉字简单、迅速，一查即得。"],"q":"11.目前通行的现代汉字序列法主要是音序法和形序法。","w":"high","e":["教材高频"]},{"t":"音强","y":"名词解释","p":["就是声音的强弱","主要取决于发音体的振幅"],"q":"A.音高 B.音长 C.音强 D.音色","w":"high","e":["2013 真题"]},{"t":"音符","y":"名词解释","p":["凡是跟整字在读音上有联系的部件，称为“音符”。","汉字的音符，也叫声旁，同表音文字的音符有很大的区别。","前者是非专职的，是借用本来既有音又有义的现成字符充当的，而后者则是专职的。","现代汉字中音符的数量很多，超过一千个。"],"q":"8.汉字声旁的表音功能相当于拼音文字的音符。","w":"high","e":["教材高频"]},{"t":"音素","y":"名词解释","p":["从音色（音值）角度划分","最小语音单位"],"q":"1.音素可以根据发音特点分为 两大类。","w":"high","e":["2015 真题","2021 真题"]},{"t":"音节","y":"名词解释","p":["人们听感容易分辨出来的最小语音片断","发音肌肉经历一次从紧张到松弛的过程","听感上有一个明显的响度中心","普通话除儿化音外一个汉字读音就是一个音节"],"q":"2.汉语的音节结构， 必不可少，它是音节中的主要元音。","w":"high","e":["2013 真题","2019 真题"]},{"t":"音高","y":"名词解释","p":["就是声音的高低","决定于发音体振动的频率","取决于声带紧张的程度"],"q":"A.音高 B.音长 C.音强 D.音色","w":"high","e":["2013 真题"]},{"t":"韵尾","y":"名词解释","p":["韵腹后的元音或辅音","位于韵母的最后","表示主要元音发音时的滑动方向或归结所在","只能由i、u(o)和n、ng 4个音素充当"],"q":"7.音节“yun”的声母是“y”, 韵腹是“u”, 韵尾是“n”。","w":"high","e":["2014 真题"]},{"t":"韵母","y":"名词解释","p":["一个音节声母后面的部分","由元音或元音加鼻辅音构成","普通话共有39个韵母"],"q":"3.声母b p m能同 的韵母相拼，不能同 韵母相拼。","w":"high","e":["2011 真题","2017 真题"]},{"t":"韵腹","y":"名词解释","p":["韵母的主干，也指主要元音","
