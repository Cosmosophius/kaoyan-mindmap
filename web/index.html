Chinese Teaching) 主要指对海外华裔子弟的汉语教学","学习者虽在国外学汉语，无中国国内的汉语环境，但他们的家人或环境有人使用汉语，尽管可能不是普通话","因此，其学习环境既不是典型的目的语 (汉语) 环境，也不是典型的非目的语环境","因民族、血缘关系，学习者跟中国有密切关系"],"q":"华语(华文) 教学 (Chinese Teaching) 主要指对海外华裔子弟的汉语教学。学习者虽在国外学汉语，无中国国内的汉语环境，但他们的家人或环境有人使用汉语，尽管可能不是普通话。因此，其学习环境既不是典型的目的语 (汉语) 环境，也不是典型的非目的语环境。因民族、血缘关系，学习者跟中国有密切关系。学习内容有汉语，也有大量中华文化传统知识； 对非华裔的","w":"normal","e":["原书正文"]},{"t":"【原文】面向跟目标语民族相同的学","y":"教材原文","p":["面向跟目标语民族相同的学习者的语言教学，有学者称为“传承语教学”(heritage language teaching)","目前， 传承语教学在全球已成为语言教学和语言教学研究的一个热点"],"q":"面向跟目标语民族相同的学习者的语言教学，有学者称为“传承语教学”(heritage language teaching)。目前， 传承语教学在全球已成为语言教学和语言教学研究的一个热点。","w":"normal","e":["原书正文"]},{"t":"【原文】汉语作为第二语言教学 (","y":"教材原文","p":["汉语作为第二语言教学 (Teaching Chinese as Second Language) 此名称在科学研究中经常使用，使用地点、场合不受限制，国内国外都可以用","不足之处有二：一是名称太长，音律上不那么平衡","二是意思上包含了对国内少数民族的汉语教学"],"q":"汉语作为第二语言教学 (Teaching Chinese as Second Language) 此名称在科学研究中经常使用，使用地点、场合不受限制，国内国外都可以用。不足之处有二：一是名称太长，音律上不那么平衡； 二是意思上包含了对国内少数民族的汉语教学。","w":"normal","e":["原书正文"]},{"t":"【原文】对外汉语(Chinese","y":"教材原文","p":["对外汉语(Chinese as a Second Language) 一些学者认为, 外国人说的汉语有自己的系统，跟母语者说的汉语不同","学科应该研究这种独特的汉语","英语作为第二语言教学也常常称 English as Second Language, 美国一些大学有 Department of English as Sec- ond Language， 没有“教学”二字","北京语言大学有“对外汉语研究中心”， 是我国该专业唯一的教育部研究基地"],"q":"对外汉语(Chinese as a Second Language) 一些学者认为, 外国人说的汉语有自己的系统，跟母语者说的汉语不同。学科应该研究这种独特的汉语。英语作为第二语言教学也常常称 English as Second Language, 美国一些大学有 Department of English as Sec- ond Language， 没有“","w":"normal","e":["原书正文"]},{"t":"【原文】对外汉语教育学 (Chi","y":"教材原文","p":["对外汉语教育学 (Chinese Education to Foreigners) 一些国家把本国语言的第二语言教学称为“教育”，如日本，“国语教育”是面向国内母语者的，“日本语教育”是面向国外非母语者的","“对外汉语教育学”强调“教育”的内涵，用“学”突出学科性质","但有学者认为，外语教学很难承担德智体美等综合素质的培养，尤其是面向境外的非母语者"],"q":"对外汉语教育学 (Chinese Education to Foreigners) 一些国家把本国语言的第二语言教学称为“教育”，如日本，“国语教育”是面向国内母语者的，“日本语教育”是面向国外非母语者的。 “对外汉语教育学”强调“教育”的内涵，用“学”突出学科性质。但有学者认为，外语教学很难承担德智体美等综合素质的培养，尤其是面向境外的非母语者。","w":"normal","e":["原书正文"]},{"t":"【原文】汉语作为外语教学(Tea","y":"教材原文","p":["汉语作为外语教学(Teaching Chinese as a Foreign Language) 用此名称有两个原因","第一，汉语对学习者来说基本是外语，可排除国内少数民族的汉语教学","第二，有学者认为“汉语作为第二语言教学”的名称不准确","目标语在目标语环境里学是“第二语言”，在非目标语环境里学是“外语”"],"q":"汉语作为外语教学(Teaching Chinese as a Foreign Language) 用此名称有两个原因。第一，汉语对学习者来说基本是外语，可排除国内少数民族的汉语教学。第二，有学者认为“汉语作为第二语言教学”的名称不准确。目标语在目标语环境里学是“第二语言”，在非目标语环境里学是“外语”。目前在国外学汉语者占绝大多数，应称“外语”。它的不足是，","w":"normal","e":["原书正文"]}]},{"id":"rumen-c02-s05","t":"第五节 创新型教学法","w":"normal","n":8,"k":[{"t":"【原文】(4) 多词句阶段：2~","y":"教材原文","p":["(4) 多词句阶段：2~3岁，能用两个以上的词组句，有时会将句子构造过程说出来"],"q":"(4) 多词句阶段：2~3岁，能用两个以上的词组句，有时会将句子构造过程说出来。","w":"normal","e":["原书正文"]},{"t":"【原文】(5) 复杂句和语篇阶段","y":"教材原文","p":["(5) 复杂句和语篇阶段：4~5岁，掌握基本语法，会用多种虚词和简单复句","词汇量超过2500个","到了5岁，语言程度跟大人没有本质区别"],"q":"(5) 复杂句和语篇阶段：4~5岁，掌握基本语法，会用多种虚词和简单复句。词汇量超过2500个。到了5岁，语言程度跟大人没有本质区别。","w":"normal","e":["原书正文"]},{"t":"【原文】2. 习得理论强化论(r","y":"教材原文","p":["2. 习得理论强化论(reinforcement theory) 理论依据是行为主义的刺激反应论, 代表人物是斯金纳 (B. F. Skinner)","认为儿童学习说话就是对环境或成人话语做出合适的反应，反应正确，就会得到奖励，使之受到强化并形成语言习惯","它重形式轻意义，难以解释复杂一些的习得现象"],"q":"2. 习得理论强化论(reinforcement theory) 理论依据是行为主义的刺激反应论, 代表人物是斯金纳 (B. F. Skinner)。认为儿童学习说话就是对环境或成人话语做出合适的反应，反应正确，就会得到奖励，使之受到强化并形成语言习惯。它重形式轻意义，难以解释复杂一些的习得现象。","w":"normal","e":["原书正文"]},{"t":"【原文】传递论(mediatio","y":"教材原文","p":["传递论(mediation theory) 理论基础同上, 代表人物是奥斯古德 (C. E. Osgood)","认为反应有两类：一是外部刺激下产生的外部反应，如房子失火引起的反应","二是内在刺激产生的内部反应，如听见“失火”这个词引起的危险感","后一种可以称为“传递性刺激”，可以用来解释语言媒介如何表现不在眼前发生的事，以及根本没有发生的事"],"q":"传递论(mediation theory) 理论基础同上, 代表人物是奥斯古德 (C. E. Osgood)。认为反应有两类：一是外部刺激下产生的外部反应，如房子失火引起的反应； 二是内在刺激产生的内部反应，如听见“失火”这个词引起的危险感。后一种可以称为“传递性刺激”，可以用来解释语言媒介如何表现不在眼前发生的事，以及根本没有发生的事。","w":"normal","e":["原书正文"]},{"t":"【原文】内在论(innate t","y":"教材原文","p":["内在论(innate theory) 理论基础是心灵主义，代表人物是乔姆斯基(A. N. Chomsky)","认为儿童天生具有语言习得机制，使其能对接触的语料进行处理","当他发现了语言的深层结构并将之转换为表层结构的规则时，就可以创造性地应用语言了","内在论认为语言是一种以规则为基础的复杂系统，儿童习得语言就是将这些规则“内在化”"],"q":"内在论(innate theory) 理论基础是心灵主义，代表人物是乔姆斯基(A. N. Chomsky)。认为儿童天生具有语言习得机制，使其能对接触的语料进行处理。当他发现了语言的深层结构并将之转换为表层结构的规则时，就可以创造性地应用语言了。内在论认为语言是一种以规则为基础的复杂系统，儿童习得语言就是将这些规则“内在化”。但它忽视环境的作用； 而且语言习","w":"normal","e":["原书正文"]},{"t":"【原文】认知论 (cogniti","y":"教材原文","p":["认知论 (cognitive theory) 代表人物是皮亚杰(J. Piaget)","认为人有两种组织功能：一是遗传的心理功能，决定如何与环境相互作用并向环境学习，称为“功能不变式”","二是“功能不变式”跟环境相互作用的产物，是人向环境学习而产生的，随着人的心理发展而系统增长，称为“认知图式”","儿童的语言发展，是天生能力和客观经验相互作用的结果"],"q":"认知论 (cognitive theory) 代表人物是皮亚杰(J. Piaget)。认为人有两种组织功能：一是遗传的心理功能，决定如何与环境相互作用并向环境学习，称为“功能不变式”； 二是“功能不变式”跟环境相互作用的产物，是人向环境学习而产生的，随着人的心理发展而系统增长，称为“认知图式”。儿童的语言发展，是天生能力和客观经验相互作用的结果。认知论重视主","w":"normal","e":["原书正文"]},{"t":"【原文】(二) 学习学习 (le","y":"教材原文","p":["(二) 学习学习 (learning) 指从阅读、听讲、研究、实践、训练中获得知识和技能","多指在专门场所由专门教师实施的专门教学，有教学计划、教材、教学实施和测试"],"q":"(二) 学习学习 (learning) 指从阅读、听讲、研究、实践、训练中获得知识和技能。多指在专门场所由专门教师实施的专门教学，有教学计划、教材、教学实施和测试。语文、数","w":"normal","e":["原书正文"]},{"t":"【原文】学等知识和相应能力就是通","y":"教材原文","p":["学等知识和相应能力就是通过学习获得的","在许多情况下，成人第二语言是通过学校正规教育，通过系统的学习获得的","如中国学生在国内学校接受正规教育来学习、掌握英语"],"q":"学等知识和相应能力就是通过学习获得的。在许多情况下，成人第二语言是通过学校正规教育，通过系统的学习获得的。如中国学生在国内学校接受正规教育来学习、掌握英语。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c02-s06","t":"第六节 教学法的发展趋势","w":"normal","n":8,"k":[{"t":"【原文】专业课程的学习实行学分制","y":"教材原文","p":["专业课程的学习实行学分制，要求总学分不低于32学分","其中必修课占10学分，内容包括汉语语言学导论、汉语作为二语教学法、第二语言习得、中华文化、跨文化交际、课堂教学研究等","教学实习占4学分，包括汉语教学设计、观摩与实践，其中课堂教学实习不低于40学时","其他学分为公共课和选修课学分"],"q":"专业课程的学习实行学分制，要求总学分不低于32学分。其中必修课占10学分，内容包括汉语语言学导论、汉语作为二语教学法、第二语言习得、中华文化、跨文化交际、课堂教学研究等。教学实习占4学分，包括汉语教学设计、观摩与实践，其中课堂教学实习不低于40学时。其他学分为公共课和选修课学分。","w":"normal","e":["原书正文"]},{"t":"【原文】学位论文以国际汉语教育实","y":"教材原文","p":["学位论文以国际汉语教育实践中发现的问题为导向，要求紧密结合实践来选题","论文可以是专题研究、调研报告、案例分析、教学设计等"],"q":"学位论文以国际汉语教育实践中发现的问题为导向，要求紧密结合实践来选题。论文可以是专题研究、调研报告、案例分析、教学设计等。","w":"normal","e":["原书正文"]},{"t":"【原文】(六) 科学学位硕士生博","y":"教材原文","p":["(六) 科学学位硕士生博士生培养以培养国际汉语教师和汉语作为外语/二语教学研究人才为目标","教学对象包含中外学生","硕士生学习的主要课程有：语言学理论 (概论)，应用语言学概论，对外汉语教学概论，现代汉语，心理学，教育学，语言教学法，第二语言习得，语言对比，偏误分析，中介语研究，语言调查与实验，教学评估与语言测试，教学资源评估与建设，语言统计，计算机，语料库建设，国际汉语教育史"],"q":"(六) 科学学位硕士生博士生培养以培养国际汉语教师和汉语作为外语/二语教学研究人才为目标。教学对象包含中外学生。硕士生学习的主要课程有：语言学理论 (概论)，应用语言学概论，对外汉语教学概论，现代汉语，心理学，教育学，语言教学法，第二语言习得，语言对比，偏误分析，中介语研究，语言调查与实验，教学评估与语言测试，教学资源评估与建设，语言统计，计算机，语料库建设","w":"normal","e":["原书正文"]},{"t":"【原文】这些硕士点、博士点分布在","y":"教材原文","p":["这些硕士点、博士点分布在不同一级、二级学科，如中国语言文学(语言学及应用语言学)、外国语言文学(外国语言学及应用语言学)、教育学(课程与教学论)"],"q":"这些硕士点、博士点分布在不同一级、二级学科，如中国语言文学(语言学及应用语言学)、外国语言文学(外国语言学及应用语言学)、教育学(课程与教学论)。有","w":"normal","e":["原书正文"]},{"t":"【原文】的学校自设二级学科，如北","y":"教材原文","p":["的学校自设二级学科，如北京语言大学、北京外国语大学、厦门大学的“汉语国际教育”，中央民族大学的“国际汉语教学”，华东师范大学的“国际汉语教育”，四川大学的“中华文化国际传播”，等等 (王祖嫘、吴应辉，2015)"],"q":"的学校自设二级学科，如北京语言大学、北京外国语大学、厦门大学的“汉语国际教育”，中央民族大学的“国际汉语教学”，华东师范大学的“国际汉语教育”，四川大学的“中华文化国际传播”，等等 (王祖嫘、吴应辉，2015)。","w":"normal","e":["原书正文"]},{"t":"【原文】对外汉语教学是一门新兴的","y":"教材原文","p":["对外汉语教学是一门新兴的学科","它的产生，是多学科交叉的结果","它的发展，跟相关学科的发展更是有着密切联系","下面具体介绍相关学科及其研究成果"],"q":"对外汉语教学是一门新兴的学科。它的产生，是多学科交叉的结果； 它的发展，跟相关学科的发展更是有着密切联系。下面具体介绍相关学科及其研究成果。","w":"normal","e":["原书正文"]},{"t":"【原文】一、语言学语言学理论是对","y":"教材原文","p":["一、语言学语言学理论是对外汉语教学学科基础理论之一，可直接指导汉语作为外语/二语教学","反过来，汉语教学又为语言学提供新的应用空间，提出新问题以促进语言学发展"],"q":"一、语言学语言学理论是对外汉语教学学科基础理论之一，可直接指导汉语作为外语/二语教学。反过来，汉语教学又为语言学提供新的应用空间，提出新问题以促进语言学发展。","w":"normal","e":["原书正文"]},{"t":"【原文】(一) 语言学对汉语教学","y":"教材原文","p":["(一) 语言学对汉语教学的指导普通语言学揭示语言的普遍规律，汉语语言学揭示汉语规律","语言是人类最重要的交际工具","因此，对外汉语教学的目的应该是培养学习者的交际能力"],"q":"(一) 语言学对汉语教学的指导普通语言学揭示语言的普遍规律，汉语语言学揭示汉语规律。语言是人类最重要的交际工具。因此，对外汉语教学的目的应该是培养学习者的交际能力。","w":"normal","e":["原书正文"]}]}]},{"id":"rumen-c03","t":"第三章 课堂教学","w":"normal","s":[{"id":"rumen-c03-s01","t":"第一节 备课","w":"normal","n":8,"k":[{"t":"【原文】26 对外汉语教学入门 ","y":"教材原文","p":["26 对外汉语教学入门 (第三版)受反方向大脑半球的控制","实验还表明，右耳对语音的敏感度随着年龄的增长而提高，10~12岁达到高峰，此后逐步下降","这个实验结果跟语言习得临界期的说法大体吻合"],"q":"26 对外汉语教学入门 (第三版)受反方向大脑半球的控制。实验还表明，右耳对语音的敏感度随着年龄的增长而提高，10~12岁达到高峰，此后逐步下降。这个实验结果跟语言习得临界期的说法大体吻合。","w":"normal","e":["原书正文"]},{"t":"【原文】美国学者从20世纪30年","y":"教材原文","p":["美国学者从20世纪30年代起对一些病人实施大脑半球切除手术，并进行跟踪观测","结果表明，许多不到10岁的儿童大脑左半球切除后，暂时失去语言能力，但一年以后语言能力逐渐恢复","原因是控制语言的功能转移到右半球相应的区域","但这种转移的时期最迟是10岁，超过10岁，左半球切除者的语言功能就永远丧失了"],"q":"美国学者从20世纪30年代起对一些病人实施大脑半球切除手术，并进行跟踪观测。结果表明，许多不到10岁的儿童大脑左半球切除后，暂时失去语言能力，但一年以后语言能力逐渐恢复。原因是控制语言的功能转移到右半球相应的区域。但这种转移的时期最迟是10岁，超过10岁，左半球切除者的语言功能就永远丧失了。之所以不能再实现语言优势的转移，是因为大脑右半球的相应区域已经承担了","w":"normal","e":["原书正文"]},{"t":"【原文】(三) 学习不同语言的神","y":"教材原文","p":["(三) 学习不同语言的神经生理差异关于汉语加工的研究发现，汉语加工的认知神经机制与其他语言系统存在差异","对汉语母语者认知神经加工机制发展的研究表明，随着阅读量增多，阅读技能不断提高，母语者对汉字正字法表征越来越精确，语言发展引发中文阅读时双侧视觉正字法区(bilateral visual orthographic areas) 的激活明显增强 (Cao, Lee, Shu, et al. , 2010","Cao, Peng, Liu, et al., 2009)","右侧视觉正字法区的激活程度与其他语言存在显著差异，该区域主要负责文字空间关系的识别，因而对中文的加工尤为重要"],"q":"(三) 学习不同语言的神经生理差异关于汉语加工的研究发现，汉语加工的认知神经机制与其他语言系统存在差异。对汉语母语者认知神经加工机制发展的研究表明，随着阅读量增多，阅读技能不断提高，母语者对汉字正字法表征越来越精确，语言发展引发中文阅读时双侧视觉正字法区(bilateral visual orthographic areas) 的激活明显增强 (Cao, L","w":"normal","e":["原书正文"]},{"t":"【原文】关于非汉语母语者汉语加工","y":"教材原文","p":["关于非汉语母语者汉语加工机制的研究发现，随着汉语水平的提高，汉语学习者会逐渐适应中文书写的特异性，形成与中文相适应的加工机制","来自事件相关电位(ERP) 的证据发现，经过汉语学习后，非汉语母语者的词汇识别的时程表现出与汉语母语者一样的特性(Liu, Perfetti, Wang, 2006","Liu, Wang, Perfetti, 2007)","来自功能性核磁共振成像(fMRI) 的证据表明，非汉语母语者在经过汉字书写练习后，会增强对汉字在视觉空间结构上的表征，表现出与汉语母语者相似的脑区加工方式，双侧梭状回 (bilateral fusiform gyrus)、双侧顶上小叶 (bilateral SPLs)、左侧顶下小叶 (left in- ferior parietal lobule) 和左侧额中回 (left middle frontal gyrus) 的激活都会加强 (Cao, Vu, Chan, et al. , 2013), 这些区域与中文加工有密切关系"],"q":"关于非汉语母语者汉语加工机制的研究发现，随着汉语水平的提高，汉语学习者会逐渐适应中文书写的特异性，形成与中文相适应的加工机制。来自事件相关电位(ERP) 的证据发现，经过汉语学习后，非汉语母语者的词汇识别的时程表现出与汉语母语者一样的特性(Liu, Perfetti, Wang, 2006; Liu, Wang, Perfetti, 2007)。来自功能性核","w":"normal","e":["原书正文"]},{"t":"【原文】五、社会语言学社会语言学","y":"教材原文","p":["五、社会语言学社会语言学将语言和社会结合起来研究，在传统语言学研究各种语言形式及其使用第一章 总论 27规则的基础上，把言语交际的过程纳入语言分析中","社会语言学家认为，语言是人类的交际工具，更是社会交际的工具","语言的作用不仅限于表达思想和陈述事实，还在于完成各种“言语行为”(speech act)","社会语言学研究的重点就是人类运用语言所进行的实实在在的社会交际活动，研究人们的言语行为与其背后起支配和制约作用的社会交际规则的关系"],"q":"五、社会语言学社会语言学将语言和社会结合起来研究，在传统语言学研究各种语言形式及其使用第一章 总论 27规则的基础上，把言语交际的过程纳入语言分析中。社会语言学家认为，语言是人类的交际工具，更是社会交际的工具。语言的作用不仅限于表达思想和陈述事实，还在于完成各种“言语行为”(speech act)。社会语言学研究的重点就是人类运用语言所进行的实实在在的社会交","w":"normal","e":["原书正文"]},{"t":"【原文】社会语言学主要研究如何应","y":"教材原文","p":["社会语言学主要研究如何应用语言，而不是语言形式的准确","这跟语用学部分重叠","其研究内容和成果，如“合作原则” “礼貌原则” “得体性原则”，格莱斯(H. P. Grice)的“会话准则”，也是语用学研究的内容和成果，跟国际汉语教学密切相关","《教师标准》指出：教师应理解语用学知识，并将有关知识应用于培养学生交际能力的教学实践中"],"q":"社会语言学主要研究如何应用语言，而不是语言形式的准确。这跟语用学部分重叠。其研究内容和成果，如“合作原则” “礼貌原则” “得体性原则”，格莱斯(H. P. Grice)的“会话准则”，也是语用学研究的内容和成果，跟国际汉语教学密切相关。《教师标准》指出：教师应理解语用学知识，并将有关知识应用于培养学生交际能力的教学实践中； 提出教师要掌握的七个基本概念范畴","w":"normal","e":["原书正文"]},{"t":"【原文】(一) 交际能力人生活在","y":"教材原文","p":["(一) 交际能力人生活在一个特定的社会环境中，作为一个社会成员，其言行举止必须符合社会的规则，这其中就包括语言的使用规则"],"q":"(一) 交际能力人生活在一个特定的社会环境中，作为一个社会成员，其言行举止必须符合社会的规则，这其中就包括语言的使用规则。","w":"normal","e":["原书正文"]},{"t":"【原文】语言能力是先天的，而交际","y":"教材原文","p":["语言能力是先天的，而交际能力是后天在人的社会化过程中逐渐获得的","儿童在开始学语言时就同时开始学习说话的规矩，学习怎样跟不同的人打交道，懂得什么时候该说什么话，什么话能对谁说，什么话怎么说才合适","如一个孩子学会了说话，但如果他在得到礼物或帮助时不会说“谢谢”，见了客人不会称呼对方，我们就会说这孩子不懂礼貌、不会交际","由此可见，语言能力和交际能力是两个东西"],"q":"语言能力是先天的，而交际能力是后天在人的社会化过程中逐渐获得的。儿童在开始学语言时就同时开始学习说话的规矩，学习怎样跟不同的人打交道，懂得什么时候该说什么话，什么话能对谁说，什么话怎么说才合适。如一个孩子学会了说话，但如果他在得到礼物或帮助时不会说“谢谢”，见了客人不会称呼对方，我们就会说这孩子不懂礼貌、不会交际。由此可见，语言能力和交际能力是两个东西。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c03-s02","t":"第二节 讲述与倾听技能","w":"normal","n":8,"k":[{"t":"【原文】[40] 祝畹瑾. 社会","y":"教材原文","p":["[40] 祝畹瑾. 社会语言学概论[M].湖南: 湖南教育出版社, 1994.[41] Cao F, Lee R, Shu H, et al. Cultural constraints on brain development: Evidence from a development-"],"q":"[40] 祝畹瑾. 社会语言学概论[M].湖南: 湖南教育出版社, 1994.[41] Cao F, Lee R, Shu H, et al. Cultural constraints on brain development: Evidence from a development-","w":"normal","e":["原书正文"]},{"t":"【原文】tal study of","y":"教材原文","p":["tal study of visual word processing in mandarin Chinese [J]. Cereb Cortex, 2010,20 (5): 1223-1233. doi: 10.1093/ cercor/bhp186."],"q":"tal study of visual word processing in mandarin Chinese [J]. Cereb Cortex, 2010,20 (5): 1223-1233. doi: 10.1093/ cercor/bhp186.","w":"normal","e":["原书正文"]},{"t":"【原文】[42] Cao F, ","y":"教材原文","p":["[42] Cao F, Peng D, Liu L, et al. Developmental differences of neurocognitive networks for phonological and semantic processing in Chinese word reading [J]. Human Brain Mapping, 2009,30 (3): 797-809. doi: 10.1002/ hbm.20546."],"q":"[42] Cao F, Peng D, Liu L, et al. Developmental differences of neurocognitive networks for phonological and semantic processing in Chinese word reading [J]. Human Brain Mapping, 20","w":"normal","e":["原书正文"]},{"t":"【原文】[43] Cao F, ","y":"教材原文","p":["[43] Cao F, Vu M, Chan D H, et al. Writing affects the brain network of reading in Chinese: A functional magnetic resonance imaging study [J]. Human Brain Mapping, 2013, 34 (7): 1670-1684. doi:10.1002/ hbm.22."],"q":"[43] Cao F, Vu M, Chan D H, et al. Writing affects the brain network of reading in Chinese: A functional magnetic resonance imaging study [J]. Human Brain Mapping, 2013, 34 (7): 16","w":"normal","e":["原书正文"]},{"t":"【原文】[44] Guan C ","y":"教材原文","p":["[44] Guan C Q, Liu Y, Chan D H L, et al. Writing strengthens orthography and alphabetic-coding strength- ens phonology in learning to read Chinese [J]. Journal of Educational Psychology, 2011, 103 (3):509-522. doi: 10.1037/a0023730."],"q":"[44] Guan C Q, Liu Y, Chan D H L, et al. Writing strengthens orthography and alphabetic-coding strength- ens phonology in learning to read Chinese [J]. Journal of Educational Psych","w":"normal","e":["原书正文"]},{"t":"【原文】[45] Liu Y, ","y":"教材原文","p":["[45] Liu Y, Perfetti C A, Wang M. Visual analysis and lexical access of Chinese characters by Chinese as second language readers [J]. Language and Linguistics, 2006, 7 (3): 637-657."],"q":"[45] Liu Y, Perfetti C A, Wang M. Visual analysis and lexical access of Chinese characters by Chinese as second language readers [J]. Language and Linguistics, 2006, 7 (3): 637-657","w":"normal","e":["原书正文"]},{"t":"【原文】[46] Liu Y, ","y":"教材原文","p":["[46] Liu Y, Wang M, Perfetti C A. Threshold style processing of Chinese characters for adult second-lan- guage learners [J]. Memory & Cognition, 2007, 35 (3): 471-480."],"q":"[46] Liu Y, Wang M, Perfetti C A. Threshold style processing of Chinese characters for adult second-lan- guage learners [J]. Memory & Cognition, 2007, 35 (3): 471-480.","w":"normal","e":["原书正文"]},{"t":"【原文】[47] Naiman ","y":"教材原文","p":["[47] Naiman N, Frohlich M, Stern H H, et al. The good language learner [M]. Clevedon, England: Multilingual Matters, 1996."],"q":"[47] Naiman N, Frohlich M, Stern H H, et al. The good language learner [M]. Clevedon, England: Multilingual Matters, 1996.","w":"normal","e":["原书正文"]}]},{"id":"rumen-c03-s03","t":"第三节 提问与组织讨论技能","w":"normal","n":8,"k":[{"t":"【原文】三、咨询法咨询法(Cou","y":"教材原文","p":["三、咨询法咨询法(Counseling Learning) 又名社团语言学习法 (Community Language Learn- ing), 产生于20世纪60年代初, 创始人为古兰 (C. Curran)"],"q":"三、咨询法咨询法(Counseling Learning) 又名社团语言学习法 (Community Language Learn- ing), 产生于20世纪60年代初, 创始人为古兰 (C. Curran)。","w":"normal","e":["原书正文"]},{"t":"【原文】其教学形式是学生围成一个","y":"教材原文","p":["其教学形式是学生围成一个圈，教师坐在圈外","一个学生想用目的语表达一个意思，就用母语问教师，如：“我想知道‘书桌’在英语里怎么说?”教师告诉他：“‘书桌’叫‘desk’","”然后让该学生重复并做相应的练习","另一个学生再问其他问题，教师回答后让他做相应的练习"],"q":"其教学形式是学生围成一个圈，教师坐在圈外。一个学生想用目的语表达一个意思，就用母语问教师，如：“我想知道‘书桌’在英语里怎么说?”教师告诉他：“‘书桌’叫‘desk’。”然后让该学生重复并做相应的练习。另一个学生再问其他问题，教师回答后让他做相应的练习。问的可以是词，也可以是句子或语段，还可以是其他问题。答问时可以很简单，也可以有一些解释。其他学生听，也可以","w":"normal","e":["原书正文"]},{"t":"【原文】开始，学生基本上依赖教师","y":"教材原文","p":["开始，学生基本上依赖教师","以后慢慢独立，可以用目的语说一些句子和语段，同学之间可以进行一些交际","到最后，基本上能够自由地谈话，教师只是偶尔当一下顾问"],"q":"开始，学生基本上依赖教师。以后慢慢独立，可以用目的语说一些句子和语段，同学之间可以进行一些交际。到最后，基本上能够自由地谈话，教师只是偶尔当一下顾问。","w":"normal","e":["原书正文"]},{"t":"【原文】咨询法的特点是：①教学过","y":"教材原文","p":["咨询法的特点是：①教学过程以学生为中心，学生是“病人”，教师是顾问、辅导者，必须注意和满足学生的需要","②只学口语，不学书面语","③依赖母语，学生在学习过程中逐步实现由母语到目的语的过渡"],"q":"咨询法的特点是：①教学过程以学生为中心，学生是“病人”，教师是顾问、辅导者，必须注意和满足学生的需要； ②只学口语，不学书面语； ③依赖母语，学生在学习过程中逐步实现由母语到目的语的过渡。","w":"normal","e":["原书正文"]},{"t":"【原文】咨询法的心理学依据是人本","y":"教材原文","p":["咨询法的心理学依据是人本主义心理学","它认为学生本身有某种学习要求时，学习效果最好","不是教师要学生学什么，而是学生要教师教什么，这样能减少来自教师的压力和学生之间的竞争带来的紧张感"],"q":"咨询法的心理学依据是人本主义心理学。它认为学生本身有某种学习要求时，学习效果最好。不是教师要学生学什么，而是学生要教师教什么，这样能减少来自教师的压力和学生之间的竞争带来的紧张感。","w":"normal","e":["原书正文"]},{"t":"【原文】交际型教学法产生于20世","y":"教材原文","p":["交际型教学法产生于20世纪60年代","当时传统教学法受到冷遇，以交际为导向的教学法应运而生","交际型教学法有几类, 英文可以统称为 Communicative Teaching Ap- proach"],"q":"交际型教学法产生于20世纪60年代。当时传统教学法受到冷遇，以交际为导向的教学法应运而生。交际型教学法有几类, 英文可以统称为 Communicative Teaching Ap- proach。","w":"normal","e":["原书正文"]},{"t":"【原文】一、功能法功能法 (Fu","y":"教材原文","p":["一、功能法功能法 (Functional Approach) 又称为交际法","20世纪 70年代末, 美国纽约州教育部门完成了《现代语言交际大纲》","该大纲反映了功能教学法的主要内容，产生了广泛影响"],"q":"一、功能法功能法 (Functional Approach) 又称为交际法。20世纪 70年代末, 美国纽约州教育部门完成了《现代语言交际大纲》。该大纲反映了功能教学法的主要内容，产生了广泛影响。","w":"normal","e":["原书正文"]},{"t":"【原文】功能法的主要理念是：①外","y":"教材原文","p":["功能法的主要理念是：①外语教学的中心任务是培养学生用外语交际的能力，让他们在目的语文化语境中实现有效交际","②不强调用语言学途径教授语言，而是强调交际途径","不让学生孤立地记生词和语法规则，而是帮助学生在特定情景、特定话题中完成交际任务，注意力放在用目的语去“做什么”和“如何做”","③文化作为交际中的有机"],"q":"功能法的主要理念是：①外语教学的中心任务是培养学生用外语交际的能力，让他们在目的语文化语境中实现有效交际。②不强调用语言学途径教授语言，而是强调交际途径。不让学生孤立地记生词和语法规则，而是帮助学生在特定情景、特定话题中完成交际任务，注意力放在用目的语去“做什么”和“如何做”。③文化作为交际中的有机","w":"normal","e":["原书正文"]}]},{"id":"rumen-c03-s04","t":"第四节 非语言表达技能","w":"normal","n":8,"k":[{"t":"【原文】[10] 刘壮，等. 任","y":"教材原文","p":["[10] 刘壮，等. 任务式教学法给对外汉语教学的启示 [J].世界汉语教学，2007 (2).[11] 卢伟，等. 功能和形式的关系及其处理原则 [C] //中国对外汉语教学学会. 中国对外汉语教学学会第四次学术讨论会论文选，北京：北京语言学院出版社，1993."],"q":"[10] 刘壮，等. 任务式教学法给对外汉语教学的启示 [J].世界汉语教学，2007 (2).[11] 卢伟，等. 功能和形式的关系及其处理原则 [C] //中国对外汉语教学学会. 中国对外汉语教学学会第四次学术讨论会论文选，北京：北京语言学院出版社，1993.","w":"normal","e":["原书正文"]},{"t":"【原文】[12] 吕必松. 对外","y":"教材原文","p":["[12] 吕必松. 对外汉语教学发展纲要 [M].北京：北京语言学院出版社，1990.[13] 吕必松. 吕必松自选集 [M].北京: 北京语言学院出版社, 1994."],"q":"[12] 吕必松. 对外汉语教学发展纲要 [M].北京：北京语言学院出版社，1990.[13] 吕必松. 吕必松自选集 [M].北京: 北京语言学院出版社, 1994.","w":"normal","e":["原书正文"]},{"t":"【原文】[14] 马箭飞. 任务","y":"教材原文","p":["[14] 马箭飞. 任务式大纲与汉语交际任务 [J].语言教学与研究, 2002 (4).[15] 潘文晋. 体裁教学法与大学英语阅读教学[J].三峡大学学报：人文社会科学版，2009 (1)."],"q":"[14] 马箭飞. 任务式大纲与汉语交际任务 [J].语言教学与研究, 2002 (4).[15] 潘文晋. 体裁教学法与大学英语阅读教学[J].三峡大学学报：人文社会科学版，2009 (1).","w":"normal","e":["原书正文"]},{"t":"【原文】[16] 盛炎. 语言教","y":"教材原文","p":["[16] 盛炎. 语言教学原理 [M]. 重庆: 重庆出版社, 1990.[17] 東定芳，庄智象，现代外语教学———理论、实践与方法 [M].上海：上海外语教育出版社, 1996."],"q":"[16] 盛炎. 语言教学原理 [M]. 重庆: 重庆出版社, 1990.[17] 東定芳，庄智象，现代外语教学———理论、实践与方法 [M].上海：上海外语教育出版社, 1996.","w":"normal","e":["原书正文"]},{"t":"【原文】[18] 王立非. 现代","y":"教材原文","p":["[18] 王立非. 现代外语教学论 (A Survey of Modern Second Language Learning & Teaching) [M]. 上海: 上海教育出版社, 2000."],"q":"[18] 王立非. 现代外语教学论 (A Survey of Modern Second Language Learning & Teaching) [M]. 上海: 上海教育出版社, 2000.","w":"normal","e":["原书正文"]},{"t":"【原文】[19] 袁洪婵. 全语","y":"教材原文","p":["[19] 袁洪婵. 全语言———理论基础、实践、启示 [J]. 外语与外语教学, 2001 (8).第三章 课堂教学 49"],"q":"[19] 袁洪婵. 全语言———理论基础、实践、启示 [J]. 外语与外语教学, 2001 (8).第三章 课堂教学 49","w":"normal","e":["原书正文"]},{"t":"【原文】语言教学是一门科学，也是","y":"教材原文","p":["语言教学是一门科学，也是一门艺术","教学艺术需要学习，更需要培育、修养","课堂教学主要由教师、学生、教学内容和教学环境组成","教师需要科学运用各种教学技能，利用教学环境，把教学内容传授给学生"],"q":"语言教学是一门科学，也是一门艺术。教学艺术需要学习，更需要培育、修养。课堂教学主要由教师、学生、教学内容和教学环境组成。教师需要科学运用各种教学技能，利用教学环境，把教学内容传授给学生。这种传授要依赖良好的师生交流和生生交流。汉语作为外语/外语教学的特殊性，要求教师能跟不同水平的学习者交流互动，有效地传授汉语交际技能和知识。","w":"normal","e":["原书正文"]},{"t":"【原文】备课是保证教学质量的关键","y":"教材原文","p":["备课是保证教学质量的关键","主要包括两个工作：了解与上课相关的信息，编写教案"],"q":"备课是保证教学质量的关键。主要包括两个工作：了解与上课相关的信息，编写教案。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c03-s05","t":"第五节 表扬与批评技能","w":"normal","n":8,"k":[{"t":"【原文】师：你去鞋店买 Nike","y":"教材原文","p":["师：你去鞋店买 Nike运动鞋，怎么问?生：请问有没有41码的 Nike运动鞋?师：售货员给你拿了一双41码的，你试了试，感觉长短不合适，你怎么说?"],"q":"师：你去鞋店买 Nike运动鞋，怎么问?生：请问有没有41码的 Nike运动鞋?师：售货员给你拿了一双41码的，你试了试，感觉长短不合适，你怎么说?","w":"normal","e":["原书正文"]},{"t":"【原文】生1：这双有点儿大，有没","y":"教材原文","p":["生1：这双有点儿大，有没有40码的?生2：这双有点儿小，有没有42码的?生3：这双有点儿小，有没有大一点儿的?生4：这双有点儿大，有没有小一点儿的?"],"q":"生1：这双有点儿大，有没有40码的?生2：这双有点儿小，有没有42码的?生3：这双有点儿小，有没有大一点儿的?生4：这双有点儿大，有没有小一点儿的?","w":"normal","e":["原书正文"]},{"t":"【原文】同样的语境，还可问服装类","y":"教材原文","p":["同样的语境，还可问服装类的款式、颜色、长短等问题，既实用，又能诱发学生兴趣"],"q":"同样的语境，还可问服装类的款式、颜色、长短等问题，既实用，又能诱发学生兴趣。","w":"normal","e":["原书正文"]},{"t":"【原文】(五) 叫答方式灵活多样","y":"教材原文","p":["(五) 叫答方式灵活多样叫答方式有指定叫答和自由叫答两种"],"q":"(五) 叫答方式灵活多样叫答方式有指定叫答和自由叫答两种。","w":"normal","e":["原书正文"]},{"t":"【原文】指定叫答，又分规则叫答、","y":"教材原文","p":["指定叫答，又分规则叫答、随机叫答两种","前者按一定形式(如座位) 依次请学生回答，是可预见的","后者则看不出什么规律","两种方式各有优劣"],"q":"指定叫答，又分规则叫答、随机叫答两种。前者按一定形式(如座位) 依次请学生回答，是可预见的； 后者则看不出什么规律。两种方式各有优劣。规则叫答可减轻学生的焦虑感，在轻松的氛围中学习； 但有的学生只想着自己要回答的问题，不听别人的","w":"normal","e":["原书正文"]},{"t":"【原文】56 对外汉语教学入门 ","y":"教材原文","p":["56 对外汉语教学入门 (第三版)发言","随机叫答可以使所有学生一直集中注意力，学习效率高","但可能会让学生过于紧张"],"q":"56 对外汉语教学入门 (第三版)发言。随机叫答可以使所有学生一直集中注意力，学习效率高； 但可能会让学生过于紧张。","w":"normal","e":["原书正文"]},{"t":"【原文】两种方法可交替进行：读生","y":"教材原文","p":["两种方法可交替进行：读生词、课文和替换练习时，可规则叫答","讲解、分析语段、语篇时，可随机叫答","还可以针对水平不同的学生，随机提问不同难度的问题"],"q":"两种方法可交替进行：读生词、课文和替换练习时，可规则叫答； 讲解、分析语段、语篇时，可随机叫答。还可以针对水平不同的学生，随机提问不同难度的问题。","w":"normal","e":["原书正文"]},{"t":"【原文】自由叫答，比较适用于较难","y":"教材原文","p":["自由叫答，比较适用于较难的问题","如用接龙法做词汇扩展练习时，教师先说一个词，如“教师”，然后用自由叫答方式让学生一个接一个地说下去："],"q":"自由叫答，比较适用于较难的问题。如用接龙法做词汇扩展练习时，教师先说一个词，如“教师”，然后用自由叫答方式让学生一个接一个地说下去：","w":"normal","e":["原书正文"]}]},{"id":"rumen-c03-s06","t":"第六节 课堂组织与管理","w":"normal","n":8,"k":[{"t":"【原文】二、多媒体多媒体教学以声","y":"教材原文","p":["二、多媒体多媒体教学以声像俱佳、图文并茂、动静皆宜的表现形式，以跨越时空的表现力，增强了学生对事物的理解与感受","运用多媒体教学时要注意以下问题"],"q":"二、多媒体多媒体教学以声像俱佳、图文并茂、动静皆宜的表现形式，以跨越时空的表现力，增强了学生对事物的理解与感受。运用多媒体教学时要注意以下问题。","w":"normal","e":["原书正文"]},{"t":"【原文】(一) 选择多媒体教学的","y":"教材原文","p":["(一) 选择多媒体教学的依据课文中的文化题材和时事要闻，包括神话传说、旅游胜地和器物、历史人物等，以及新闻、名人、流行活动等，都可以利用图片和视频等多媒体手段，让学生体验","如《初级汉语精读教程Ⅰ》第三十六课中提到“川菜”“冰灯”，《初级汉语精读教程Ⅱ》第三十课中提到《西游记》等， 《中级汉语精读教程Ⅰ》第十八课《梁山伯与祝英台》等"],"q":"(一) 选择多媒体教学的依据课文中的文化题材和时事要闻，包括神话传说、旅游胜地和器物、历史人物等，以及新闻、名人、流行活动等，都可以利用图片和视频等多媒体手段，让学生体验。如《初级汉语精读教程Ⅰ》第三十六课中提到“川菜”“冰灯”，《初级汉语精读教程Ⅱ》第三十课中提到《西游记》等， 《中级汉语精读教程Ⅰ》第十八课《梁山伯与祝英台》等。","w":"normal","e":["原书正文"]},{"t":"【原文】抽象词汇和语法点的讲解，","y":"教材原文","p":["抽象词汇和语法点的讲解，也可以利用多媒体进行辅助教学","例如“把”字句和“复合趋向补语”的教学，可以使用动画和小视频，展示一系列动作，用以说明句式"],"q":"抽象词汇和语法点的讲解，也可以利用多媒体进行辅助教学。例如“把”字句和“复合趋向补语”的教学，可以使用动画和小视频，展示一系列动作，用以说明句式。","w":"normal","e":["原书正文"]},{"t":"【原文】在练习阶段，教师也可以利","y":"教材原文","p":["在练习阶段，教师也可以利用多媒体手段，给学生布置交际任务","如练习方位词时，要求学生使用在线卫星地图寻找自己家的位置，并描述方位","练习价格的表达时，让学生利用购物网站，对比各种商品在不同国家的价格等"],"q":"在练习阶段，教师也可以利用多媒体手段，给学生布置交际任务。如练习方位词时，要求学生使用在线卫星地图寻找自己家的位置，并描述方位； 练习价格的表达时，让学生利用购物网站，对比各种商品在不同国家的价格等。","w":"normal","e":["原书正文"]},{"t":"【原文】(二) 多媒体教学的原则","y":"教材原文","p":["(二) 多媒体教学的原则利用多媒体课件上课，信息量大，可视性、可感性强","使用时需要考虑以下原则："],"q":"(二) 多媒体教学的原则利用多媒体课件上课，信息量大，可视性、可感性强。使用时需要考虑以下原则：","w":"normal","e":["原书正文"]},{"t":"【原文】(1) 辅助性","y":"教材原文","p":["在课堂的语言技能教学中，多媒体是辅助性的","教师应该设计好每节课的教学内容和教学环节，明确哪些内容可以用PPT 辅助教学，哪些内容要通过传统方式教学"],"q":"(1) 辅助性。在课堂的语言技能教学中，多媒体是辅助性的。教师应该设计好每节课的教学内容和教学环节，明确哪些内容可以用PPT 辅助教学，哪些内容要通过传统方式教学。","w":"normal","e":["原书正文"]},{"t":"【原文】(2) 针对性","y":"教材原文","p":["教学对象不同，社会生活和语言环境也在不断变化","教师应该根据实际情况，不断更新、完善课件","有的教师做了课件后，只要教材不换，课件就不改","这种做法不利于教学"],"q":"(2) 针对性。教学对象不同，社会生活和语言环境也在不断变化。教师应该根据实际情况，不断更新、完善课件。有的教师做了课件后，只要教材不换，课件就不改。这种做法不利于教学。","w":"normal","e":["原书正文"]},{"t":"【原文】(3) 交互性","y":"教材原文","p":["多媒体课件有一个弱点：即时交互性弱","现在许多教师用PPT上课，从上课到下课看着课件讲，与学生没有互动，更不会根据学生提出的问题进行板书","这样上语言技能交际课，效果肯定不好","教师应发挥粉笔、黑/白板、普通教具等传统教"],"q":"(3) 交互性。多媒体课件有一个弱点：即时交互性弱。现在许多教师用PPT上课，从上课到下课看着课件讲，与学生没有互动，更不会根据学生提出的问题进行板书。这样上语言技能交际课，效果肯定不好。教师应发挥粉笔、黑/白板、普通教具等传统教","w":"normal","e":["原书正文"]}]},{"id":"rumen-c03-s07","t":"第七节 板书和多媒体","w":"normal","n":8,"k":[{"t":"【原文】2. 相似度相似度 (d","y":"教材原文","p":["2. 相似度相似度 (degree of similarity) 指两种语言中对应的语言点表面相似, 实际上有一些区别","当存在这种“关键相似度”(a crucial similarity measure) 时, 干扰更可能引发偏误","如英语和旁遮普语都有含 of的所属结构，旁遮普母语者学习英语时容易出错","而英语和旁遮普语介词的位置、句中动词有明显区别，则偏误不多"],"q":"2. 相似度相似度 (degree of similarity) 指两种语言中对应的语言点表面相似, 实际上有一些区别。当存在这种“关键相似度”(a crucial similarity measure) 时, 干扰更可能引发偏误。如英语和旁遮普语都有含 of的所属结构，旁遮普母语者学习英语时容易出错。而英语和旁遮普语介词的位置、句中动词有明显区别，则偏误不","w":"normal","e":["原书正文"]},{"t":"【原文】越南语有声调，越南学生的","y":"教材原文","p":["越南语有声调，越南学生的声调感比母语没有声调的学生好得多","但到了中、高级阶段，仍有一些学生发第四声时降得不到位","原因是越南语有两个降调，一个32，另一个是331","学习者受它们影响，发四声下降不到位"],"q":"越南语有声调，越南学生的声调感比母语没有声调的学生好得多。但到了中、高级阶段，仍有一些学生发第四声时降得不到位。原因是越南语有两个降调，一个32，另一个是331。学习者受它们影响，发四声下降不到位。","w":"normal","e":["原书正文"]},{"t":"【原文】相似度与对比等级4级相关","y":"教材原文","p":["相似度与对比等级4级相关","学生容易看到相同点，忽略差异","如越南语被动句标志词“được”(如意) 和“bị”(不如意), 可对应汉语“被”:"],"q":"相似度与对比等级4级相关。学生容易看到相同点，忽略差异。如越南语被动句标志词“được”(如意) 和“bị”(不如意), 可对应汉语“被”:","w":"normal","e":["原书正文"]},{"t":"【原文】a. Nó bị thầ","y":"教材原文","p":["a. Nó bị thầy giáo phê bình một trận.对译：他 被 老师 批评 一 顿意译：他被老师批评了一顿"],"q":"a. Nó bị thầy giáo phê bình một trận.对译：他 被 老师 批评 一 顿意译：他被老师批评了一顿。","w":"normal","e":["原书正文"]},{"t":"【原文】b. Chị ấy đư","y":"教材原文","p":["b. Chị ấy được bầu làm b í thưthành uỳ.对译： 她 被 选 作 书记 市 委意译：她被选为市委书记"],"q":"b. Chị ấy được bầu làm b í thưthành uỳ.对译： 她 被 选 作 书记 市 委意译：她被选为市委书记。","w":"normal","e":["原书正文"]},{"t":"【原文】表面看，此类情况似乎应归","y":"教材原文","p":["表面看，此类情况似乎应归入对比等级2级，不难学习","但越南学生常出现以下偏误：*他昨天被感冒了"],"q":"表面看，此类情况似乎应归入对比等级2级，不难学习。但越南学生常出现以下偏误：*他昨天被感冒了。/*我被迷路了。","w":"normal","e":["原书正文"]},{"t":"【原文】为何困难等级低，偏误却比","y":"教材原文","p":["为何困难等级低，偏误却比较多? 原因是以上对比忽略了一个重要事实：越南语用 bi、 dugc的句子，谓语动词可以是不及物动词："],"q":"为何困难等级低，偏误却比较多? 原因是以上对比忽略了一个重要事实：越南语用 bi、 dugc的句子，谓语动词可以是不及物动词：","w":"normal","e":["原书正文"]},{"t":"【原文】a. Tôi bị ốm","y":"教材原文","p":["a. Tôi bị ốm rồi.对译： 我被 病了意译：我病了"],"q":"a. Tôi bị ốm rồi.对译： 我被 病了意译：我病了。","w":"normal","e":["原书正文"]}]}]},{"id":"rumen-c04","t":"第四章 第二语言习得","w":"normal","s":[{"id":"rumen-c04-s01","t":"第一节 第一语言的作用与对比分析","w":"normal","n":8,"k":[{"t":"【原文】汉语和外语的上述异同，给","y":"教材原文","p":["汉语和外语的上述异同，给学习造成困难，是引发学习者生成偏误的原因之一"],"q":"汉语和外语的上述异同，给学习造成困难，是引发学习者生成偏误的原因之一。","w":"normal","e":["原书正文"]},{"t":"【原文】可见，基于偏误分析的研究","y":"教材原文","p":["可见，基于偏误分析的研究，对汉语语法的本体研究有重要的启发","偏误研究及整个对外汉语教学的需求，是推动汉语语法研究的动力"],"q":"可见，基于偏误分析的研究，对汉语语法的本体研究有重要的启发； 偏误研究及整个对外汉语教学的需求，是推动汉语语法研究的动力。","w":"normal","e":["原书正文"]},{"t":"【原文】(四) 偏误分析的不足偏","y":"教材原文","p":["(四) 偏误分析的不足偏误分析只考察偏误","而二语习得要全面考察学习者的中介语及其发展 (连续体)，包括跟目标语一致的地方","这样才能看出习得轨迹","如英语特指问句二语习得阶段："],"q":"(四) 偏误分析的不足偏误分析只考察偏误。而二语习得要全面考察学习者的中介语及其发展 (连续体)，包括跟目标语一致的地方。这样才能看出习得轨迹。如英语特指问句二语习得阶段：","w":"normal","e":["原书正文"]},{"t":"【原文】a. What's he","y":"教材原文","p":["a. What's he doing? b. What he is doing?c. What is he doing? d. What's he doing?"],"q":"a. What's he doing? b. What he is doing?c. What is he doing? d. What's he doing?","w":"normal","e":["原书正文"]},{"t":"【原文】a句，学习者把 What","y":"教材原文","p":["a句，学习者把 What's 当作一个语块来习得，不知道它是 what 和 is 的缩写形式","b句虽然错误，却是一种进步，开始将 what和 is分开","d句并非A句的简单重复，而是在c句基础上的发展","只分析偏误，则看不出学习者整个习得过程"],"q":"a句，学习者把 What's 当作一个语块来习得，不知道它是 what 和 is 的缩写形式。b句虽然错误，却是一种进步，开始将 what和 is分开。d句并非A句的简单重复，而是在c句基础上的发展。只分析偏误，则看不出学习者整个习得过程。","w":"normal","e":["原书正文"]},{"t":"【原文】二、偏误分析的步骤以下以","y":"教材原文","p":["二、偏误分析的步骤以下以语法偏误为例解释偏误分析的步骤"],"q":"二、偏误分析的步骤以下以语法偏误为例解释偏误分析的步骤。","w":"normal","e":["原书正文"]},{"t":"【原文】(一) 语料收集语料有自","y":"教材原文","p":["(一) 语料收集语料有自然语料 (作文、对话录音等) 和非自然语料 (语音、词汇、语法练习等)","要考虑样本的大小、类别(如口语还是书面语、随意语体还是谨慎语体)、一致性 (学习者年龄、母语、学习阶段) 等因素"],"q":"(一) 语料收集语料有自然语料 (作文、对话录音等) 和非自然语料 (语音、词汇、语法练习等)。要考虑样本的大小、类别(如口语还是书面语、随意语体还是谨慎语体)、一致性 (学习者年龄、母语、学习阶段) 等因素。","w":"normal","e":["原书正文"]},{"t":"【原文】(二) 偏误识辨第一, ","y":"教材原文","p":["(二) 偏误识辨第一, 要区分“失误” (lapse) 和“偏误” (error)","前者源于一时疏忽, 后者因为缺乏语言能力","区分标准有两条：一是频率","偶尔出现可能是失误，出现较多则可能是偏误"],"q":"(二) 偏误识辨第一, 要区分“失误” (lapse) 和“偏误” (error)。前者源于一时疏忽, 后者因为缺乏语言能力。区分标准有两条：一是频率。偶尔出现可能是失误，出现较多则可能是偏误。二是生成者能否自纠。可以自纠是失误，不能自纠是偏误。偏误分析的对象主要是后者。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c04-s02","t":"第二节 偏误分析","w":"normal","n":8,"k":[{"t":"【原文】(二) 动态性动态性指中","y":"教材原文","p":["(二) 动态性动态性指中介语的规则是以渐进方式逐步扩展的","汉语特指问句的习得有一个较长的过程，疑问代词是逐步扩散的","第一阶段是“怎么样、什么” (你怎么样? 这是什么?)，第二阶段是“多少/几、哪里、谁，(多少/几个人? 去哪里? 他是谁?)，第三阶段是“怎么+动词”(怎么去?)，第四阶段是“多+A”(多长、多高)"],"q":"(二) 动态性动态性指中介语的规则是以渐进方式逐步扩展的。汉语特指问句的习得有一个较长的过程，疑问代词是逐步扩散的； 第一阶段是“怎么样、什么” (你怎么样? 这是什么?)，第二阶段是“多少/几、哪里、谁，(多少/几个人? 去哪里? 他是谁?)，第三阶段是“怎么+动词”(怎么去?)，第四阶段是“多+A”(多长、多高)。","w":"normal","e":["原书正文"]},{"t":"【原文】(三) 系统性系统性指中","y":"教材原文","p":["(三) 系统性系统性指中介语的语音、词汇、语法都有一套规则","学习者出现的中介语现象并不是偶然的，也不是随心所欲的","中介语规则不能只用目标语的术语来进行评估","从目标语语法规则来看，不少中介语现象是偏误，但它们可能符合中介语规则"],"q":"(三) 系统性系统性指中介语的语音、词汇、语法都有一套规则。学习者出现的中介语现象并不是偶然的，也不是随心所欲的。中介语规则不能只用目标语的术语来进行评估。从目标语语法规则来看，不少中介语现象是偏误，但它们可能符合中介语规则。如“他是高”，虽不符合汉语，但对于某些汉语二语者来说，它符合中介语规则，习得过程中必然要出现。","w":"normal","e":["原书正文"]},{"t":"【原文】二、中介语的变异变异在自","y":"教材原文","p":["二、中介语的变异变异在自然语言中存在，在中介语中同样存在，只是在程度上、范围上有所不同"],"q":"二、中介语的变异变异在自然语言中存在，在中介语中同样存在，只是在程度上、范围上有所不同。","w":"normal","e":["原书正文"]},{"t":"【原文】(一) 社交情景变异由于","y":"教材原文","p":["(一) 社交情景变异由于社交情景变化导致的变异，跟母语使用者的风格变异相似","对汉语作为二语学习者的考察发现，“着” “不” “没”等词语的使用，在口语表达中的偏误较多，在书面语表达(描述情景) 中的偏误较少，在书面语法练习中最少","社交情景下的中介语连续体可以用图4.2表示"],"q":"(一) 社交情景变异由于社交情景变化导致的变异，跟母语使用者的风格变异相似。对汉语作为二语学习者的考察发现，“着” “不” “没”等词语的使用，在口语表达中的偏误较多，在书面语表达(描述情景) 中的偏误较少，在书面语法练习中最少。社交情景下的中介语连续体可以用图4.2表示。","w":"normal","e":["原书正文"]},{"t":"【原文】(二) 语境变异语境变异","y":"教材原文","p":["(二) 语境变异语境变异指语言的内部语境变化，导致学习者使用了多种不同的语言形式"],"q":"(二) 语境变异语境变异指语言的内部语境变化，导致学习者使用了多种不同的语言形式。","w":"normal","e":["原书正文"]},{"t":"【原文】陈小荷 (1996) 发","y":"教材原文","p":["陈小荷 (1996) 发现，经过一段时间学习，一般情况下学习者很少把“也”放在主语前，但在以下几种情况下容易出现偏误："],"q":"陈小荷 (1996) 发现，经过一段时间学习，一般情况下学习者很少把“也”放在主语前，但在以下几种情况下容易出现偏误：","w":"normal","e":["原书正文"]},{"t":"【原文】*小明也半个瓜吃完了","y":"教材原文","p":["*小明也半个瓜吃完了","/*电脑鼠标坏了，也屏幕不行了"],"q":"*小明也半个瓜吃完了。/*电脑鼠标坏了，也屏幕不行了。","w":"normal","e":["原书正文"]},{"t":"【原文】句子主语前都有其他成分(","y":"教材原文","p":["句子主语前都有其他成分(时间、处所状语，主谓谓语句大主语，前一复句)，这些成分就是诱发“也”错位的语言情景"],"q":"句子主语前都有其他成分(时间、处所状语，主谓谓语句大主语，前一复句)，这些成分就是诱发“也”错位的语言情景。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c04-s03","t":"第三节 中介语及其发展过程","w":"normal","n":8,"k":[{"t":"【原文】(三) 第一语言习得是否","y":"教材原文","p":["(三) 第一语言习得是否跟二语习得相似第一语言习得都是儿童，二语习得大多是成人","年龄区别在生理、认知、情感等方面都有明显的表现","Cook (1977)发现，处理含定语从句的句子时，因记忆负担过重，说母语的儿童、成人和成年外语学习者使用同样的策略，都把句中第一个名词当作主语，把动词后的第一个名词当作宾语"],"q":"(三) 第一语言习得是否跟二语习得相似第一语言习得都是儿童，二语习得大多是成人。年龄区别在生理、认知、情感等方面都有明显的表现。Cook (1977)发现，处理含定语从句的句子时，因记忆负担过重，说母语的儿童、成人和成年外语学习者使用同样的策略，都把句中第一个名词当作主语，把动词后的第一个名词当作宾语。","w":"normal","e":["原书正文"]},{"t":"【原文】汉语的二语习得和第一语言","y":"教材原文","p":["汉语的二语习得和第一语言习得也会出现相同的顺序","如疑问句的习得，赵果(2003) 对15名美国留学生为期四个月的四次调查发现，“吗”字是非问在第一次调查中便出现，在四次调查中数量都最多，分别占所有问句总数的42.8%、31.5%、38.3%、45.9%","“吧”字是非问到第四次调查才出现，且仅出现一例","李宇明、陈前瑞(1998) 对儿童问句系统的调查表明，“吗”是非问的理解时间 (1岁4个月)、发生时间 (2岁)，都早于“吧”是非问 (1岁5个月理解，2岁1个月发生)"],"q":"汉语的二语习得和第一语言习得也会出现相同的顺序。如疑问句的习得，赵果(2003) 对15名美国留学生为期四个月的四次调查发现，“吗”字是非问在第一次调查中便出现，在四次调查中数量都最多，分别占所有问句总数的42.8%、31.5%、38.3%、45.9%。“吧”字是非问到第四次调查才出现，且仅出现一例。李宇明、陈前瑞(1998) 对儿童问句系统的调查表明，“吗","w":"normal","e":["原书正文"]},{"t":"【原文】1. 外国式语言与互动调","y":"教材原文","p":["1. 外国式语言与互动调节外国式语言 (foreigner talk) 是本族人对外族人说的话语","其特点是：①合乎语法第四章 第二语言习得 87"],"q":"1. 外国式语言与互动调节外国式语言 (foreigner talk) 是本族人对外族人说的话语。其特点是：①合乎语法第四章 第二语言习得 87","w":"normal","e":["原书正文"]},{"t":"【原文】的简化。如减慢语速，小心","y":"教材原文","p":["如减慢语速，小心清楚地发音，使用简单词汇，多用是非问句","②不合语法的简化","如对初学者说：“这是昨天买 [ ]"],"q":"的简化。如减慢语速，小心清楚地发音，使用简单词汇，多用是非问句。②不合语法的简化。如对初学者说：“这是昨天买 [ ]。”","w":"normal","e":["原书正文"]},{"t":"【原文】跟非本族人交际时，为了让","y":"教材原文","p":["跟非本族人交际时，为了让对方听懂，操本族语者要进行多种类型的调节："],"q":"跟非本族人交际时，为了让对方听懂，操本族语者要进行多种类型的调节：","w":"normal","e":["原书正文"]},{"t":"【原文】第一, 确认性检查 (c","y":"教材原文","p":["第一, 确认性检查 (confirmation checks):外国留学生：我去银行了","中国学生：银行?第二, 理解力检查 (comprehension checks):"],"q":"第一, 确认性检查 (confirmation checks):外国留学生：我去银行了。 中国学生：银行?第二, 理解力检查 (comprehension checks):","w":"normal","e":["原书正文"]},{"t":"【原文】中国学生：老师出差了","y":"教材原文","p":["中国学生：老师出差了","“出差”，你听懂了吗?第三, 澄清 (clarification requests):外国留学生：我想试下那双裤子","中国店员：什么?"],"q":"中国学生：老师出差了。“出差”，你听懂了吗?第三, 澄清 (clarification requests):外国留学生：我想试下那双裤子。 中国店员：什么?","w":"normal","e":["原书正文"]},{"t":"【原文】第四, 重复 (repe","y":"教材原文","p":["第四, 重复 (repetitions):外国留学生：我去北京路了","中国朋友：哦，你去北京路了"],"q":"第四, 重复 (repetitions):外国留学生：我去北京路了。 中国朋友：哦，你去北京路了。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c04-s04","t":"第四节 输入、输出与互动","w":"normal","n":8,"k":[{"t":"【原文】1) 显性纠正","y":"教材原文","p":["老师简单解释“不”和“没”的区别，引导学生用“没有”","或只口头刺激，问：“他昨天病了，不上课?”重读“昨天” “不”，诱发学生记忆规则，说出正确句"],"q":"1) 显性纠正。老师简单解释“不”和“没”的区别，引导学生用“没有”。或只口头刺激，问：“他昨天病了，不上课?”重读“昨天” “不”，诱发学生记忆规则，说出正确句。","w":"normal","e":["原书正文"]},{"t":"【原文】2) 隐性纠正","y":"教材原文","p":["老师问 (澄清请求)： “你说什么? 我不太明白","”或重复： “他昨天病了，不上课?”并疑惑地看着对方"],"q":"2) 隐性纠正。老师问 (澄清请求)： “你说什么? 我不太明白。”或重复： “他昨天病了，不上课?”并疑惑地看着对方。","w":"normal","e":["原书正文"]},{"t":"【原文】3. 教学实施纠正性反馈","y":"教材原文","p":["3. 教学实施纠正性反馈可以引起学生注意到自己的输出跟目标语的“差距”，通过“修正输出”，让修正后的特征进一步融入中介语系统中，实现“领会”吸收","因此，一些教学法，如听说法，很推崇纠正性反馈，认为它可以大大促进二语习得","不少研究也证明，正确实施纠正性反馈，可以提高教学效益","当然，也有研究认为，过度的纠正性反馈会有负面作用"],"q":"3. 教学实施纠正性反馈可以引起学生注意到自己的输出跟目标语的“差距”，通过“修正输出”，让修正后的特征进一步融入中介语系统中，实现“领会”吸收。因此，一些教学法，如听说法，很推崇纠正性反馈，认为它可以大大促进二语习得。不少研究也证明，正确实施纠正性反馈，可以提高教学效益。当然，也有研究认为，过度的纠正性反馈会有负面作用。","w":"normal","e":["原书正文"]},{"t":"【原文】哪种类型的纠正性反馈效果","y":"教材原文","p":["哪种类型的纠正性反馈效果好? Long(2007) 认为，“重述” (前述“输入式纠正反馈”中的“隐性纠正”) 不仅给学习者提供错误的负面证据，而且提供了正确表达的正面证据，把学习者注意力聚焦在形式上，对二语学习特别有效","另有学者认为，显性反馈，尤其是提供简要的规则解释(元语言信息)，不但能引起学习者对错误和正确形式的关注，还能提高学习者对错误本质的认识","Lyster (2004) 认为， “提示性语言”(prompts)，即诱发学习者自我修复/修正的纠正性反馈(前述“输出式纠正反馈”)，效果比“重述”要显著"],"q":"哪种类型的纠正性反馈效果好? Long(2007) 认为，“重述” (前述“输入式纠正反馈”中的“隐性纠正”) 不仅给学习者提供错误的负面证据，而且提供了正确表达的正面证据，把学习者注意力聚焦在形式上，对二语学习特别有效。另有学者认为，显性反馈，尤其是提供简要的规则解释(元语言信息)，不但能引起学习者对错误和正确形式的关注，还能提高学习者对错误本质的认识。L","w":"normal","e":["原书正文"]},{"t":"【原文】此外，Sheen (20","y":"教材原文","p":["此外，Sheen (2010) 认为，“输入式”“输出式”纠正性反馈也可以用于书面语教学","如果教师创造机会把“领会/修正输出”等运用到书面语教学中，让学习者对文本进行修正，肯定会提高学习者的书面语表达能力"],"q":"此外，Sheen (2010) 认为，“输入式”“输出式”纠正性反馈也可以用于书面语教学。如果教师创造机会把“领会/修正输出”等运用到书面语教学中，让学习者对文本进行修正，肯定会提高学习者的书面语表达能力。","w":"normal","e":["原书正文"]},{"t":"【原文】在纠正时间上，如果重视语","y":"教材原文","p":["在纠正时间上，如果重视语言表达的流畅性，多用延迟纠正","如果重视语言表达的准确性，多用及时纠正","此外，纠正哪类错误 (参考本章第二节)，如何纠正错误 (见以上反馈类型)，由谁来纠正错误，都可能对纠正性反馈的效应有一定影响(徐锦芬，2015)"],"q":"在纠正时间上，如果重视语言表达的流畅性，多用延迟纠正； 如果重视语言表达的准确性，多用及时纠正。此外，纠正哪类错误 (参考本章第二节)，如何纠正错误 (见以上反馈类型)，由谁来纠正错误，都可能对纠正性反馈的效应有一定影响(徐锦芬，2015)。","w":"normal","e":["原书正文"]},{"t":"【原文】1. 互动假说互动假说 ","y":"教材原文","p":["1. 互动假说互动假说 (Interaction Hypothesis) 由 Long(1983) 提出, 是对克拉申的语言输入假说的拓展(图4.4)","互动假说认为，输入的可理解性是在意义协商过程中通过交际实现的，而且也可以实现学习者的可理解输出","因此，二语习得应该创造以信息传递为主的双向交际的情境"],"q":"1. 互动假说互动假说 (Interaction Hypothesis) 由 Long(1983) 提出, 是对克拉申的语言输入假说的拓展(图4.4)。互动假说认为，输入的可理解性是在意义协商过程中通过交际实现的，而且也可以实现学习者的可理解输出。因此，二语习得应该创造以信息传递为主的双向交际的情境。","w":"normal","e":["原书正文"]},{"t":"【原文】Ellis (1994)","y":"教材原文","p":["Ellis (1994) 根据 Gass(1979) 的理论, 发展了二语习得模式 (图4.5)","该模式认为，感知输入依靠的是频率、百科知识、注意力(观察语言对比)、情感 (动机、态度等)，理解输入依靠的是普遍语法、母语和二语知识，吸收依靠的是元语言知识储存和内隐语言知识/中介语系统的形成"],"q":"Ellis (1994) 根据 Gass(1979) 的理论, 发展了二语习得模式 (图4.5)。该模式认为，感知输入依靠的是频率、百科知识、注意力(观察语言对比)、情感 (动机、态度等)，理解输入依靠的是普遍语法、母语和二语知识，吸收依靠的是元语言知识储存和内隐语言知识/中介语系统的形成。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c04-s05","t":"第五节 学习者个体差异","w":"normal","n":8,"k":[{"t":"【原文】(二) 动机动机 (mo","y":"教材原文","p":["(二) 动机动机 (motivation)指行为的整体目标和方向","对动机有不同的分类","一种是将动机划分为三小类：整体动机 (二语学习的整体目标方向)，情景动机 (课堂学习/自然学习)，任务动机 (完成某个具体学习任务)"],"q":"(二) 动机动机 (motivation)指行为的整体目标和方向。对动机有不同的分类。一种是将动机划分为三小类：整体动机 (二语学习的整体目标方向)，情景动机 (课堂学习/自然学习)，任务动机 (完成某个具体学习任务)。","w":"normal","e":["原书正文"]},{"t":"【原文】原一川等 (2008) ","y":"教材原文","p":["原一川等 (2008) 对云南某高校来自泰国、云南、缅甸等国家的44位留学生发放问卷，调查后认为，对东南亚留学生来说，最重要的七种动机分别为教学因素动机、合作/竞争学习动机、家长支持动机、融合型动机、对外国语言/文化的态度、社会责任动机、学习愿望，影响汉语学习成绩最重要的四个因子分别为学习努力程度、学汉语的态度、对本民族认同的态度、家长支持动机"],"q":"原一川等 (2008) 对云南某高校来自泰国、云南、缅甸等国家的44位留学生发放问卷，调查后认为，对东南亚留学生来说，最重要的七种动机分别为教学因素动机、合作/竞争学习动机、家长支持动机、融合型动机、对外国语言/文化的态度、社会责任动机、学习愿望，影响汉语学习成绩最重要的四个因子分别为学习努力程度、学汉语的态度、对本民族认同的态度、家长支持动机。","w":"normal","e":["原书正文"]},{"t":"【原文】五、个性与情感过滤(一)","y":"教材原文","p":["五、个性与情感过滤(一) 个性个性 (personality) 是由一系列个人特性集合成的个体性格","个性通常有一系列的对立因素：冷漠/热情，害羞/大胆，不自信/有统治欲，内向/外向，神经质/稳定"],"q":"五、个性与情感过滤(一) 个性个性 (personality) 是由一系列个人特性集合成的个体性格。个性通常有一系列的对立因素：冷漠/热情，害羞/大胆，不自信/有统治欲，内向/外向，神经质/稳定。","w":"normal","e":["原书正文"]},{"t":"【原文】例如，外向学习者很容易跟","y":"教材原文","p":["例如，外向学习者很容易跟使用目标语的人(包括本族语者和非本族语者) 接触，自然会接受更多的目标语输入","研究显示，口语流利的程度与性格的内向外向相关，性格外向者二语流利程度比性格内向者要高","有学者做了八个测量自然交际语言的研究，其中六个研究表明，外向型学习者占优势","Chastian (1975) 的研究发现，学习者性格开朗程度和他们的德语以及西班牙语成绩有显著相关"],"q":"例如，外向学习者很容易跟使用目标语的人(包括本族语者和非本族语者) 接触，自然会接受更多的目标语输入。研究显示，口语流利的程度与性格的内向外向相关，性格外向者二语流利程度比性格内向者要高。有学者做了八个测量自然交际语言的研究，其中六个研究表明，外向型学习者占优势。Chastian (1975) 的研究发现，学习者性格开朗程度和他们的德语以及西班牙语成绩有显著","w":"normal","e":["原书正文"]},{"t":"【原文】(二) 情感过滤情感过滤","y":"教材原文","p":["(二) 情感过滤情感过滤假说 (the Affective Filter Hypothesis) 认为, 语言习得主要依靠可理解的输入","但是，它也受到情感因素的影响，出现情感过滤","情感过滤越强，输入能进入主管语言机制的大脑部分变成语言能力的比例就越低","反之，情感过滤越弱，输入能进入主管语言机制的大脑部分变成语言能力的比例就越高"],"q":"(二) 情感过滤情感过滤假说 (the Affective Filter Hypothesis) 认为, 语言习得主要依靠可理解的输入； 但是，它也受到情感因素的影响，出现情感过滤。情感过滤越强，输入能进入主管语言机制的大脑部分变成语言能力的比例就越低； 反之，情感过滤越弱，输入能进入主管语言机制的大脑部分变成语言能力的比例就越高。其过程如下所示：","w":"normal","e":["原书正文"]},{"t":"【原文】100|对外汉语教学入门","y":"教材原文","p":["100|对外汉语教学入门 (第三版)影响情感过滤的因素主要有学习动力、自信心和焦虑感等","钱旭菁 (1999) 通过“外语课堂焦虑等级模式”的调查也发现焦虑对留学生学习汉语具有负面影响，主要表现在口语方面","具体地说，口语成绩和焦虑感成反比：焦虑感越强，口语成绩越差","焦虑感越弱，口语成绩越好"],"q":"100|对外汉语教学入门 (第三版)影响情感过滤的因素主要有学习动力、自信心和焦虑感等。钱旭菁 (1999) 通过“外语课堂焦虑等级模式”的调查也发现焦虑对留学生学习汉语具有负面影响，主要表现在口语方面。具体地说，口语成绩和焦虑感成反比：焦虑感越强，口语成绩越差； 焦虑感越弱，口语成绩越好。年龄、性别、学习汉语的时间、是否华裔以及期望值等因素和焦虑没有明显关","w":"normal","e":["原书正文"]},{"t":"【原文】1. 显性知识显性知识 ","y":"教材原文","p":["1. 显性知识显性知识 (explicit knowledge) 是指学习者能够有意识地表达出来的知识，即学习者不但知其然，而且知其所以然 (Ellis，2004)","例如学习者可以表达“我比他高”，知道“我”是主语，“高”是谓语，“比他”是状语","又如看到“*我认识了三个同学们”，学习者能纠正，知道错误原因在“三个”与“们”不能共现"],"q":"1. 显性知识显性知识 (explicit knowledge) 是指学习者能够有意识地表达出来的知识，即学习者不但知其然，而且知其所以然 (Ellis，2004)。例如学习者可以表达“我比他高”，知道“我”是主语，“高”是谓语，“比他”是状语； 又如看到“*我认识了三个同学们”，学习者能纠正，知道错误原因在“三个”与“们”不能共现。","w":"normal","e":["原书正文"]},{"t":"【原文】2. 显性学习显性学习 ","y":"教材原文","p":["2. 显性学习显性学习 (explicit learning) 是指通过显性手段 (如记忆法、语法分析) 学习语言内容 (如词汇、语法)，是通过有意识的方式进行的，学会的知识以显性方式储存，使用起来用意识进行控制(戴曼纯，2005)","例如学习者在学习新词“读者”时，意识到“者”是一个表示人的词缀，“读者”就是阅读书刊文章的人，并通过这样的分析存储该词"],"q":"2. 显性学习显性学习 (explicit learning) 是指通过显性手段 (如记忆法、语法分析) 学习语言内容 (如词汇、语法)，是通过有意识的方式进行的，学会的知识以显性方式储存，使用起来用意识进行控制(戴曼纯，2005)。例如学习者在学习新词“读者”时，意识到“者”是一个表示人的词缀，“读者”就是阅读书刊文章的人，并通过这样的分析存储该词。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c04-s06","t":"第六节 学习和学习者的策略","w":"normal","n":8,"k":[{"t":"【原文】社交策略 (social","y":"教材原文","p":["社交策略 (social strategy) 是与别人合作学习的策略，包括提问、与他人合作等"],"q":"社交策略 (social strategy) 是与别人合作学习的策略，包括提问、与他人合作等。","w":"normal","e":["原书正文"]},{"t":"【原文】106对外汉语教学入门 ","y":"教材原文","p":["106对外汉语教学入门 (第三版)例如，学习者听不懂授课内容时直接问教师，在课内外活动中积极用汉语与同学交流与沟通，等等"],"q":"106对外汉语教学入门 (第三版)例如，学习者听不懂授课内容时直接问教师，在课内外活动中积极用汉语与同学交流与沟通，等等。","w":"normal","e":["原书正文"]},{"t":"【原文】情感策略 (affect","y":"教材原文","p":["情感策略 (affective strategy) 是用来管理、规范情绪的, 包括克服焦虑、鼓励自己、控制情绪等","例如，学习者在遇到学习困难时，进行自我鼓励，或者是与别人谈论自己的感受等","(参见本章第五节“五、个性与情感过滤”)"],"q":"情感策略 (affective strategy) 是用来管理、规范情绪的, 包括克服焦虑、鼓励自己、控制情绪等。例如，学习者在遇到学习困难时，进行自我鼓励，或者是与别人谈论自己的感受等。(参见本章第五节“五、个性与情感过滤”)","w":"normal","e":["原书正文"]},{"t":"【原文】(三) 直接策略和间接策","y":"教材原文","p":["(三) 直接策略和间接策略Oxford(1990) 根据策略与语言心理加工的关系， 将策略分为两大类： 直接策略和间接策略"],"q":"(三) 直接策略和间接策略Oxford(1990) 根据策略与语言心理加工的关系， 将策略分为两大类： 直接策略和间接策略。","w":"normal","e":["原书正文"]},{"t":"【原文】1. 直接策略直接策略与","y":"教材原文","p":["1. 直接策略直接策略与目的语学习加工直接相关，包括记忆策略、认知策略和补偿策略"],"q":"1. 直接策略直接策略与目的语学习加工直接相关，包括记忆策略、认知策略和补偿策略。","w":"normal","e":["原书正文"]},{"t":"【原文】记忆策略(memory ","y":"教材原文","p":["记忆策略(memory strategy) 是用来记忆和复习新知识的，包括联想、利用图像和声音、有计划的复习、使用动作等","例如，学习者在学习生词时，将它和熟悉的词语联系起来记忆","制作生词卡片，帮助记忆","背诵一些语言片断，为参加戏剧表演做准备"],"q":"记忆策略(memory strategy) 是用来记忆和复习新知识的，包括联想、利用图像和声音、有计划的复习、使用动作等。例如，学习者在学习生词时，将它和熟悉的词语联系起来记忆； 制作生词卡片，帮助记忆； 背诵一些语言片断，为参加戏剧表演做准备；等等。","w":"normal","e":["原书正文"]},{"t":"【原文】补偿策略 (compen","y":"教材原文","p":["补偿策略 (compensation strategy) 使学习者在新语言知识有限的情况下能运用多种方法，如合理猜测等来弥补缺陷和不足","遇到生词时，可利用上下文、构词语素以及汉字中表意的形旁来猜测词义","不会使用某些新学会的词语时，就使用同义词、近义词来代替，如："],"q":"补偿策略 (compensation strategy) 使学习者在新语言知识有限的情况下能运用多种方法，如合理猜测等来弥补缺陷和不足。遇到生词时，可利用上下文、构词语素以及汉字中表意的形旁来猜测词义。不会使用某些新学会的词语时，就使用同义词、近义词来代替，如：","w":"normal","e":["原书正文"]},{"t":"【原文】老板，有没有放在床上可以","y":"教材原文","p":["老板，有没有放在床上可以变热的被子? (电热毯)我觉得中国菜味道比较深的","(重)口语无法表达清楚时，就使用手势语等"],"q":"老板，有没有放在床上可以变热的被子? (电热毯)我觉得中国菜味道比较深的。(重)口语无法表达清楚时，就使用手势语等。如：","w":"normal","e":["原书正文"]}]},{"id":"rumen-c04-s07","t":"第七节 语言普遍性假说","w":"normal","n":8,"k":[{"t":"【原文】三、语言普遍性和二语习得","y":"教材原文","p":["三、语言普遍性和二语习得普遍语法对二语习得的影响比对一语习得的影响要复杂，因为前者最少涉及两种语言","学习者会把两种知识带入学习中：普遍语法知识和第一语言特有的语法知识"],"q":"三、语言普遍性和二语习得普遍语法对二语习得的影响比对一语习得的影响要复杂，因为前者最少涉及两种语言。学习者会把两种知识带入学习中：普遍语法知识和第一语言特有的语法知识。","w":"normal","e":["原书正文"]},{"t":"【原文】(一) 语言普遍性和中介","y":"教材原文","p":["(一) 语言普遍性和中介语发展关于中介语发展中语言普遍性的作用有三种假设：①中介语像其他自然语言一样，受语言普遍性的制约","②蕴含普遍性可用来预测第二语言项目在中介语里的出现顺序","③学习者先习得无标记(或弱标记) 特征，再习得有标记(或强标记) 特征"],"q":"(一) 语言普遍性和中介语发展关于中介语发展中语言普遍性的作用有三种假设：①中介语像其他自然语言一样，受语言普遍性的制约； ②蕴含普遍性可用来预测第二语言项目在中介语里的出现顺序；③学习者先习得无标记(或弱标记) 特征，再习得有标记(或强标记) 特征。","w":"normal","e":["原书正文"]},{"t":"【原文】112 对外汉语教学入门","y":"教材原文","p":["112 对外汉语教学入门 (第三版)Schmidt(1980) 对不同背景二语学习者省略英语并列结构中某些元素的情况进行了考察","英语可能出现的省略类型见表4.10","她收集的语料中没有发现非自然 (即语言中不存在) 的省略类型","最难习得的省略类型是第三类，因为宾语省略比主语或动词省略标记性强"],"q":"112 对外汉语教学入门 (第三版)Schmidt(1980) 对不同背景二语学习者省略英语并列结构中某些元素的情况进行了考察。英语可能出现的省略类型见表4.10。她收集的语料中没有发现非自然 (即语言中不存在) 的省略类型。最难习得的省略类型是第三类，因为宾语省略比主语或动词省略标记性强。虽然有的自然语言允许主句宾语省略(如英语) 和允许从句主语省略 (如","w":"normal","e":["原书正文"]},{"t":"【原文】表4.10 英语中并列句","y":"教材原文","p":["表4.10 英语中并列句中的省略类型省略类型例 句并列从句中主语省略John sang a song and played a guitar."],"q":"表4.10 英语中并列句中的省略类型省略类型例 句并列从句中主语省略John sang a song and played a guitar.","w":"normal","e":["原书正文"]},{"t":"【原文】并列从句中动词省略Joh","y":"教材原文","p":["并列从句中动词省略John plays the piano and Mary the violin.主句中主宾省略John typed and Mary mailed the letter."],"q":"并列从句中动词省略John plays the piano and Mary the violin.主句中主宾省略John typed and Mary mailed the letter.","w":"normal","e":["原书正文"]},{"t":"【原文】Gass (1979)调","y":"教材原文","p":["Gass (1979)调查了以英语为二语的成人学习者关系分句的习得情况","她将不同关系代词的正确率顺序与 Comrie 和 Keenan (1979) 的可及性等级(见表4.9) 进行对比,发现二者之间有密切关联","即最容易对应的位置是主语，其次是直接宾语","唯一例外的是属格，它比按等级位置所预测的难度要容易些"],"q":"Gass (1979)调查了以英语为二语的成人学习者关系分句的习得情况。她将不同关系代词的正确率顺序与 Comrie 和 Keenan (1979) 的可及性等级(见表4.9) 进行对比,发现二者之间有密切关联。即最容易对应的位置是主语，其次是直接宾语； 唯一例外的是属格，它比按等级位置所预测的难度要容易些。Gass认为这也许是因为“whose”(谁的) 是","w":"normal","e":["原书正文"]},{"t":"【原文】对多种语言的调查显示，“","y":"教材原文","p":["对多种语言的调查显示，“否定+动词”最常用，使用地域最广，是无标记或弱标记形式","德语、日语否定词都在动词后，但德语、日语母语者学汉语时，很容易学会动词前否定的句式"],"q":"对多种语言的调查显示，“否定+动词”最常用，使用地域最广，是无标记或弱标记形式。德语、日语否定词都在动词后，但德语、日语母语者学汉语时，很容易学会动词前否定的句式。","w":"normal","e":["原书正文"]},{"t":"【原文】简单问句是弱标记的，嵌入","y":"教材原文","p":["简单问句是弱标记的，嵌入问句是强标记的","相对来说，“他去北京吗?”“他去不去北京?”都比较容易学","嵌入问句的习得就难一些，生硬地套入就可能出现偏误："],"q":"简单问句是弱标记的，嵌入问句是强标记的。相对来说，“他去北京吗?”“他去不去北京?”都比较容易学。嵌入问句的习得就难一些，生硬地套入就可能出现偏误：","w":"normal","e":["原书正文"]}]},{"id":"rumen-c04-s08","t":"第八节 其他语言习得假说","w":"normal","n":8,"k":[{"t":"【原文】2. 外部界面的习得疑问","y":"教材原文","p":["2. 外部界面的习得疑问代词的话题化涉及“句法——语篇”，即外部界面","一般情况下，汉语疑问代词在问句中位于初始位置 (你吃什么?)","但在特定语篇条件下，疑问代词可以移位到句首作话题，如“什么菜你没有吃?”，此时，菜的范围已被限定在上文提到的菜式中","Yuan和 Dugarova(2012) 的研究表明， 以英语为母语的学习者能够掌握汉语疑问代词话题化的语篇条件，即只允许与语篇相关的疑问词话题化，不允许与语篇无关的疑问词话题化"],"q":"2. 外部界面的习得疑问代词的话题化涉及“句法——语篇”，即外部界面。一般情况下，汉语疑问代词在问句中位于初始位置 (你吃什么?)。但在特定语篇条件下，疑问代词可以移位到句首作话题，如“什么菜你没有吃?”，此时，菜的范围已被限定在上文提到的菜式中。 Yuan和 Dugarova(2012) 的研究表明， 以英语为母语的学习者能够掌握汉语疑问代词话题化的语篇条","w":"normal","e":["原书正文"]},{"t":"【原文】袁博平 (2015) 指","y":"教材原文","p":["袁博平 (2015) 指出，二语习得中的不稳定性和不确定性，原因不一定是界面类型，而是界面所需的信息处理量","一种界面所需协调、整合的信息量越大，学习者的二语就越可能出现不稳定性和不确定性"],"q":"袁博平 (2015) 指出，二语习得中的不稳定性和不确定性，原因不一定是界面类型，而是界面所需的信息处理量。一种界面所需协调、整合的信息量越大，学习者的二语就越可能出现不稳定性和不确定性。","w":"normal","e":["原书正文"]},{"t":"【原文】四、动态系统理论Lars","y":"教材原文","p":["四、动态系统理论Larsen-Freeman(1997) 将动态系统理论 (Dynamic Systems Theory) 引入语言学,认为语言学习并不是单纯的线性发展过程，而是充满停滞、倒退或者跳跃前进的动态系统行为"],"q":"四、动态系统理论Larsen-Freeman(1997) 将动态系统理论 (Dynamic Systems Theory) 引入语言学,认为语言学习并不是单纯的线性发展过程，而是充满停滞、倒退或者跳跃前进的动态系统行为。","w":"normal","e":["原书正文"]},{"t":"【原文】(一) 全面联结性影响语","y":"教材原文","p":["(一) 全面联结性影响语言发展的不仅有语音、词汇、句法这些语言系统要素，还包括认知环境(记忆力、语言学能、学习动机等)、社会环境 (对二语的接触、受教育程度、社会关系等)、教学环境 (课程、教材、教学法等)、社会政治环境、客观物质条件等(De Bot, et al., 2007","Larsen-Freeman & Cameron, 2008","郑咏滟, 2011)","这些子系统相互影响"],"q":"(一) 全面联结性影响语言发展的不仅有语音、词汇、句法这些语言系统要素，还包括认知环境(记忆力、语言学能、学习动机等)、社会环境 (对二语的接触、受教育程度、社会关系等)、教学环境 (课程、教材、教学法等)、社会政治环境、客观物质条件等(De Bot, et al., 2007; Larsen-Freeman & Cameron, 2008; 郑咏滟, 20","w":"normal","e":["原书正文"]},{"t":"【原文】(二) 开放性每个系统都","y":"教材原文","p":["(二) 开放性每个系统都有开放性，一些新的事物和影响因素会随着时间、环境变化不断被纳入这个系统，进一步增加系统的复杂性","新的词汇、句法点融入学习者二语系统中，会对原有词汇、句法项产生影响","由于学习过程中不断有新的影响因素纳入系统，研究者应该考虑、预测某个特定因素是如何影响学习者，以及这些因素是如何交互作用的"],"q":"(二) 开放性每个系统都有开放性，一些新的事物和影响因素会随着时间、环境变化不断被纳入这个系统，进一步增加系统的复杂性。新的词汇、句法点融入学习者二语系统中，会对原有词汇、句法项产生影响。由于学习过程中不断有新的影响因素纳入系统，研究者应该考虑、预测某个特定因素是如何影响学习者，以及这些因素是如何交互作用的。","w":"normal","e":["原书正文"]},{"t":"【原文】(三) 非线性发展在一个","y":"教材原文","p":["(三) 非线性发展在一个系统中，原因和结果不是简单的线性关系","学习了两年汉语的学习者的水平并不一定比只学了一年汉语的学习者高一倍","学习者对某一语言项目的学习常常呈U 形发展模型","陈默、王建勤 (2010) 考察了不同母语背景的汉语学习者双字组声调发展情况，发现学习者在学习初期，五项声调特征(调值、调形、调长、调强、调域)的得分呈现出五种类型：直线型，下降型，上升型，U型和倒U型"],"q":"(三) 非线性发展在一个系统中，原因和结果不是简单的线性关系。学习了两年汉语的学习者的水平并不一定比只学了一年汉语的学习者高一倍。学习者对某一语言项目的学习常常呈U 形发展模型。陈默、王建勤 (2010) 考察了不同母语背景的汉语学习者双字组声调发展情况，发现学习者在学习初期，五项声调特征(调值、调形、调长、调强、调域)的得分呈现出五种类型：直线型，下降型，","w":"normal","e":["原书正文"]},{"t":"【原文】(四) 不可预测性语言系","y":"教材原文","p":["(四) 不可预测性语言系统中某个初始变量细微、偶然的变化，可能引起其他变量的变化，引发整个系统变化","这种变量间的复杂互动，使系统的行为和发展路径变得不可预测","两个母语背景、智力、语言初始水平没有差异的学习者，可能仅仅因为其中一个偶然听了歌曲《茉莉花》而另一位没有，从而引起他们对中国文化的认同出现差异，进而使他们在后续的汉语学习中表现迥异"],"q":"(四) 不可预测性语言系统中某个初始变量细微、偶然的变化，可能引起其他变量的变化，引发整个系统变化。这种变量间的复杂互动，使系统的行为和发展路径变得不可预测。两个母语背景、智力、语言初始水平没有差异的学习者，可能仅仅因为其中一个偶然听了歌曲《茉莉花》而另一位没有，从而引起他们对中国文化的认同出现差异，进而使他们在后续的汉语学习中表现迥异。","w":"normal","e":["原书正文"]},{"t":"【原文】从这个意义上讲，个体语言","y":"教材原文","p":["从这个意义上讲，个体语言发展难以预测","但整体发展趋势在某种程度上是可预测的"],"q":"从这个意义上讲，个体语言发展难以预测。但整体发展趋势在某种程度上是可预测的。","w":"normal","e":["原书正文"]}]}]},{"id":"rumen-c05","t":"第五章 语言测试与成绩分析","w":"normal","s":[{"id":"rumen-c05-s01","t":"第一节 语言测试的性质与目的","w":"normal","n":8,"k":[{"t":"【原文】[25] 钱旭菁. 词义","y":"教材原文","p":["[25] 钱旭菁. 词义猜测过程和猜测所用的知识 [J].世界汉语教学，2005 (4).[26] 施家炜. 外国留学生22类现代汉语句式的习得顺序研究[J].世界汉语教学，1998 (4)."],"q":"[25] 钱旭菁. 词义猜测过程和猜测所用的知识 [J].世界汉语教学，2005 (4).[26] 施家炜. 外国留学生22类现代汉语句式的习得顺序研究[J].世界汉语教学，1998 (4).","w":"normal","e":["原书正文"]},{"t":"【原文】[27] 田善继, 外国","y":"教材原文","p":["[27] 田善继, 外国人汉语非对比性偏误分析 [J].汉语学习, 1995 (6).[28] 佟慧君，外国人学汉语病句分析[M].北京：北京语言学院出版社，1986."],"q":"[27] 田善继, 外国人汉语非对比性偏误分析 [J].汉语学习, 1995 (6).[28] 佟慧君，外国人学汉语病句分析[M].北京：北京语言学院出版社，1986.","w":"normal","e":["原书正文"]},{"t":"【原文】[29] 王初明. 读后","y":"教材原文","p":["[29] 王初明. 读后续写——提高外语学习效率的一种有效方法 [J].外语界，2012 (5).[30] 王建勤、汉语“不”和“没”否定结构的习得过程 [M] //王建勤，汉语作为第二语言的习得研究. 北京：北京语言文化大学出版社，1997."],"q":"[29] 王初明. 读后续写——提高外语学习效率的一种有效方法 [J].外语界，2012 (5).[30] 王建勤、汉语“不”和“没”否定结构的习得过程 [M] //王建勤，汉语作为第二语言的习得研究. 北京：北京语言文化大学出版社，1997.","w":"normal","e":["原书正文"]},{"t":"【原文】[31] 王添淼. 场独","y":"教材原文","p":["[31] 王添淼. 场独立与场依存型认知风格与对外汉语教学 [J].云南师范大学学报：对外汉语教学与研究版, 2007 (6)."],"q":"[31] 王添淼. 场独立与场依存型认知风格与对外汉语教学 [J].云南师范大学学报：对外汉语教学与研究版, 2007 (6).","w":"normal","e":["原书正文"]},{"t":"【原文】124 对外汉语教学入门","y":"教材原文","p":["124 对外汉语教学入门 (第三版)[32] 肖奚强. 外国学生汉字偏误分析 [J].世界汉语教学, 2002 (2)."],"q":"124 对外汉语教学入门 (第三版)[32] 肖奚强. 外国学生汉字偏误分析 [J].世界汉语教学, 2002 (2).","w":"normal","e":["原书正文"]},{"t":"【原文】[33] 熊文. 论二语","y":"教材原文","p":["[33] 熊文. 论二语教学中的简化原则 [M]//柳英绿，金基石. 对外汉语教学的理论与实践. 延吉：延边大学出版社，1997."],"q":"[33] 熊文. 论二语教学中的简化原则 [M]//柳英绿，金基石. 对外汉语教学的理论与实践. 延吉：延边大学出版社，1997.","w":"normal","e":["原书正文"]},{"t":"【原文】[34] 徐锦芬. 纠正","y":"教材原文","p":["[34] 徐锦芬. 纠正性反馈与外语教学 [J].二语学习研究, 2015 (1).[35] 徐子亮. 外国学生汉语学习策略的认知心理分析 [J].世界汉语教学，1999 (4)."],"q":"[34] 徐锦芬. 纠正性反馈与外语教学 [J].二语学习研究, 2015 (1).[35] 徐子亮. 外国学生汉语学习策略的认知心理分析 [J].世界汉语教学，1999 (4).","w":"normal","e":["原书正文"]},{"t":"【原文】[36] 薛小芳，施春宏","y":"教材原文","p":["[36] 薛小芳，施春宏. 语块的性质及汉语语块系统的层级关系 [J].当代修辞学，2013 (3).[37] 杨连瑞. 二语学习中的习得复杂性[J].二语学习研究, 2015 (1)."],"q":"[36] 薛小芳，施春宏. 语块的性质及汉语语块系统的层级关系 [J].当代修辞学，2013 (3).[37] 杨连瑞. 二语学习中的习得复杂性[J].二语学习研究, 2015 (1).","w":"normal","e":["原书正文"]}]},{"id":"rumen-c05-s02","t":"第二节 语言测试的类别","w":"normal","n":8,"k":[{"t":"【原文】[100] Sincla","y":"教材原文","p":["[100] Sinclair J, Coulthard R M. Towards an analysis of discourse [M]. Oxford: Oxford University Press, 1975."],"q":"[100] Sinclair J, Coulthard R M. Towards an analysis of discourse [M]. Oxford: Oxford University Press, 1975.","w":"normal","e":["原书正文"]},{"t":"【原文】[101] Sorace","y":"教材原文","p":["[101] Sorace A, Filiaci F. Anaphora resolution in near-native speakers of Italian [J]. Second Language Re- search, 2006, 22: 339-368."],"q":"[101] Sorace A, Filiaci F. Anaphora resolution in near-native speakers of Italian [J]. Second Language Re- search, 2006, 22: 339-368.","w":"normal","e":["原书正文"]},{"t":"【原文】[102] Sorace","y":"教材原文","p":["[102] Sorace A, Serratrice L. Internal and external interfaces in bilingual language development: Beyond structural overlap [J]. International Journal of Bilingualism, 2009, 13: 195-210."],"q":"[102] Sorace A, Serratrice L. Internal and external interfaces in bilingual language development: Beyond structural overlap [J]. International Journal of Bilingualism, 2009, 13: 19","w":"normal","e":["原书正文"]},{"t":"【原文】[103] Stockw","y":"教材原文","p":["[103] Stockwell R, Bowen J, Martin J. The srammatical structures of English and Spanish [M]. Chicago: Chicago University Press, 1965."],"q":"[103] Stockwell R, Bowen J, Martin J. The srammatical structures of English and Spanish [M]. Chicago: Chicago University Press, 1965.","w":"normal","e":["原书正文"]},{"t":"【原文】[104] Swain ","y":"教材原文","p":["[104] Swain M. Communicative competence: Some roles of comprehensible input and comprehensible output in its development [M] // Gass S, Madden C. Input in second language acquisition. Cambridge,MA: Newburry House, 1985."],"q":"[104] Swain M. Communicative competence: Some roles of comprehensible input and comprehensible output in its development [M] // Gass S, Madden C. Input in second language acquisiti","w":"normal","e":["原书正文"]},{"t":"【原文】[105] Tarone","y":"教材原文","p":["[105] Tarone E. Communication strategies, foreigner talk and repair in interlanguage [J]. Language Learn- ing, 1980, 30: 417-431."],"q":"[105] Tarone E. Communication strategies, foreigner talk and repair in interlanguage [J]. Language Learn- ing, 1980, 30: 417-431.","w":"normal","e":["原书正文"]},{"t":"【原文】[106] White ","y":"教材原文","p":["[106] White L. The responsibility of grammatical theory to acquisitional data [M] // Hornstein N and Light- foot D. Explanation in linguistics: The logical problem of language acquisition. London: Longman, 1981."],"q":"[106] White L. The responsibility of grammatical theory to acquisitional data [M] // Hornstein N and Light- foot D. Explanation in linguistics: The logical problem of language acqu","w":"normal","e":["原书正文"]},{"t":"【原文】[107] White ","y":"教材原文","p":["[107] White L. Grammatical theory: Interfaces and L2 knowledge [M] // Bhatia T K, Ritchie W C. The new handbook of second language acquisition. Bingley: Emerald Group Publishing Limited, 2009."],"q":"[107] White L. Grammatical theory: Interfaces and L2 knowledge [M] // Bhatia T K, Ritchie W C. The new handbook of second language acquisition. Bingley: Emerald Group Publishing Li","w":"normal","e":["原书正文"]}]},{"id":"rumen-c05-s03","t":"第三节 语言测试的原则和特点","w":"normal","n":8,"k":[{"t":"【原文】(3) 共时","y":"教材原文","p":["用两种不同方法对同一种内容进行测试，所得结果相关程度高，就具有较高的共时有效性","例如，用两种方法测试考生的阅读能力，看考试结果是否一样，有多少差距"],"q":"(3) 共时。用两种不同方法对同一种内容进行测试，所得结果相关程度高，就具有较高的共时有效性。例如，用两种方法测试考生的阅读能力，看考试结果是否一样，有多少差距。","w":"normal","e":["原书正文"]},{"t":"【原文】(4) 预测","y":"教材原文","p":["指显示学生未来发展能力的准确性","例如，学能测试结果显示一个考生语言学习能力很强","之后几个月以至一两年，该考生的语言发展证明了这一点，说明这一测试有较高的预测有效性"],"q":"(4) 预测。指显示学生未来发展能力的准确性。例如，学能测试结果显示一个考生语言学习能力很强。之后几个月以至一两年，该考生的语言发展证明了这一点，说明这一测试有较高的预测有效性。","w":"normal","e":["原书正文"]},{"t":"【原文】影响有效性的因素很多，但","y":"教材原文","p":["影响有效性的因素很多，但主要因素有：试题是否清楚明了，试题语言是否简明易懂，难易度及其排列顺序是否合适，试题含义和答案是否单一，考试时间的选择和长短是否适当，技能和知识的比率是否合理，等等","在计算机辅助语言测试日益盛行的今天，计算机和多媒体的使用会对效度和构念产生什么样的影响? 纸笔测试和计算机测试有何可比性? 计算机自动评分的效度如何，怎样提高? 测试公平性与效度之间的关系是怎样的? 这些问题都值得我们进一步探索"],"q":"影响有效性的因素很多，但主要因素有：试题是否清楚明了，试题语言是否简明易懂，难易度及其排列顺序是否合适，试题含义和答案是否单一，考试时间的选择和长短是否适当，技能和知识的比率是否合理，等等。在计算机辅助语言测试日益盛行的今天，计算机和多媒体的使用会对效度和构念产生什么样的影响? 纸笔测试和计算机测试有何可比性? 计算机自动评分的效度如何，怎样提高? 测试公平","w":"normal","e":["原书正文"]},{"t":"【原文】四、实用性实用性主要指测","y":"教材原文","p":["四、实用性实用性主要指测试的可操作性，即使用起来是否方便、俭省","具体来说，包括以下几个方面："],"q":"四、实用性实用性主要指测试的可操作性，即使用起来是否方便、俭省。具体来说，包括以下几个方面：","w":"normal","e":["原书正文"]},{"t":"【原文】(1) 考试的进行","y":"教材原文","p":["(1) 考试的进行","考试的方式、场所、设施等因素都会影响考试的进行","一般来说，书面考试比较容易实施，而口语尤其是中高级阶段的某种交际场所中语言技能的测试比较难以实施","现在一些能力水平测试如托福，可以随时在电脑上进行并即时得到分数，具有较高的实用性"],"q":"(1) 考试的进行。考试的方式、场所、设施等因素都会影响考试的进行。一般来说，书面考试比较容易实施，而口语尤其是中高级阶段的某种交际场所中语言技能的测试比较难以实施。现在一些能力水平测试如托福，可以随时在电脑上进行并即时得到分数，具有较高的实用性。","w":"normal","e":["原书正文"]},{"t":"【原文】(2) 判卷评分的难易度","y":"教材原文","p":["(2) 判卷评分的难易度","例如，多项选择题的评分，很容易操作，甚至可以用机器进行","口语和写作的评分则难得多","因此大规模的测试一般不包括口语测试，写作测"],"q":"(2) 判卷评分的难易度。例如，多项选择题的评分，很容易操作，甚至可以用机器进行； 口语和写作的评分则难得多。因此大规模的测试一般不包括口语测试，写作测","w":"normal","e":["原书正文"]},{"t":"【原文】(3) 管理的方便和俭省","y":"教材原文","p":["(3) 管理的方便和俭省","指整个考试过程和考试前后的工作便于管理，省时省力，经济俭省","例如，目前的托福考试在全世界进行，其试卷一般都是邮寄，比较节省","汉语水平考试的试卷主要靠人亲自携带，花费比较大"],"q":"(3) 管理的方便和俭省。指整个考试过程和考试前后的工作便于管理，省时省力，经济俭省。例如，目前的托福考试在全世界进行，其试卷一般都是邮寄，比较节省； 汉语水平考试的试卷主要靠人亲自携带，花费比较大。","w":"normal","e":["原书正文"]},{"t":"【原文】成绩分析是为了对测试情况","y":"教材原文","p":["成绩分析是为了对测试情况做出解释","要对测试成绩进行分析，通常要用到描述性的统计学知识，描述我们所得到的数据的集中趋势以及离散度","下面对这两种统计数据的处理做一个简单的介绍"],"q":"成绩分析是为了对测试情况做出解释。要对测试成绩进行分析，通常要用到描述性的统计学知识，描述我们所得到的数据的集中趋势以及离散度。下面对这两种统计数据的处理做一个简单的介绍。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c05-s04","t":"第四节 测试成绩分析","w":"normal","n":8,"k":[{"t":"【原文】A 500A 500tà","y":"教材原文","p":["A 500A 500tài màn méi wèn tíB 太 慢 C 没 问题tài màn méi wèn tíB 太 慢 C 没 问题"],"q":"A 500A 500tài màn méi wèn tíB 太 慢 C 没 问题tài màn méi wèn tíB 太 慢 C 没 问题" 遍，呈螺旋状上升。例如，将话题分为个人、亲属与朋友、学校、社会、世界等五大类。第一循环分五课，先学最简单的五个话题； 第二循环难度增加一些，然后一直上升到最高级别。某教材第一册的“时间和天气”单元有三课：现在几点，我的生日，今天不冷； 第二册的“时间和天气”单元也有三课：明天有小雨 ，在公","w":"normal","e":["原书正文"]},{"t":"【原文】一、教材评估的定义教材评","y":"教材原文","p":["一、教材评估的定义教材评估，就是对教材的使用效果进行评判，对学习型教材的价值进行测量(Tomlison & Masuhara, 2007)","评估可从两个角度考虑:"],"q":"一、教材评估的定义教材评估，就是对教材的使用效果进行评判，对学习型教材的价值进行测量(Tomlison & Masuhara, 2007)。评估可从两个角度考虑:","w":"normal","e":["原书正文"]},{"t":"【原文】第一，能否达成某一门课程","y":"教材原文","p":["第一，能否达成某一门课程的教学目的，是否满足学习者的需求 (赵金铭，1998)","例如，内容是否值得教，能否引起学生和老师兴趣","编写是否有灵活性，可供教师进行适当修改以适应学习者和学习环境"],"q":"第一，能否达成某一门课程的教学目的，是否满足学习者的需求 (赵金铭，1998)。例如，内容是否值得教，能否引起学生和老师兴趣； 编写是否有灵活性，可供教师进行适当修改以适应学习者和学习环境； 等等。","w":"normal","e":["原书正文"]},{"t":"【原文】第二，根据特定标准、原则","y":"教材原文","p":["第二，根据特定标准、原则对教材设计优劣高下进行评估","例如，该有的是否有，有的是否合理，合理的是否创新，创新的是否突出，等等 (李泉，2012)","这个角度包括跟同类教材的对比"],"q":"第二，根据特定标准、原则对教材设计优劣高下进行评估。例如，该有的是否有，有的是否合理，合理的是否创新，创新的是否突出，等等 (李泉，2012)。这个角度包括跟同类教材的对比。","w":"normal","e":["原书正文"]},{"t":"【原文】二、评估类型(一) 使用","y":"教材原文","p":["二、评估类型(一) 使用前评估使用前评估指决定使用什么教材时进行的评估 (周小兵，2009)","评估的考量点通常有：课程需要，学生对知识技能的需求，学生实际水平，评价者对教材的初步认识"],"q":"二、评估类型(一) 使用前评估使用前评估指决定使用什么教材时进行的评估 (周小兵，2009)。评估的考量点通常有：课程需要，学生对知识技能的需求，学生实际水平，评价者对教材的初步认识。","w":"normal","e":["原书正文"]},{"t":"【原文】这种评估缺少教学实践检验","y":"教材原文","p":["这种评估缺少教学实践检验，容易受直觉和经验影响，因而要注意避免出现“随第六章 教材的评估、使用与开发 149意的印象性评价”(程晓堂等，2011)","例如，被教材版式、插图、练习设计等方面吸引，或者被前言中教材介绍和说明影响，主观、片面地认为该教材适用或者不适用"],"q":"这种评估缺少教学实践检验，容易受直觉和经验影响，因而要注意避免出现“随第六章 教材的评估、使用与开发 149意的印象性评价”(程晓堂等，2011)。例如，被教材版式、插图、练习设计等方面吸引，或者被前言中教材介绍和说明影响，主观、片面地认为该教材适用或者不适用。","w":"normal","e":["原书正文"]},{"t":"【原文】因此，评估前应先理清教学","y":"教材原文","p":["因此，评估前应先理清教学理念，确定具体的考量标准，提高评估的有效性和系统性"],"q":"因此，评估前应先理清教学理念，确定具体的考量标准，提高评估的有效性和系统性。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c06-s02","t":"第二节 教材评估的基本内容与方法","w":"normal","n":8,"k":[{"t":"【原文】丁级词：气功超纲词：白薯","y":"教材原文","p":["丁级词：气功超纲词：白薯、圆圈、按摩、镯、飞碟、石膏、信物"],"q":"丁级词：气功超纲词：白薯、圆圈、按摩、镯、飞碟、石膏、信物","w":"normal","e":["原书正文"]},{"t":"【原文】(2) 数量","y":"教材原文","p":["生词数量是评估教材的另一个指标","请看三部中级精读教材的生词数量情况 (表6.2)","A教材平均每课生词接近
