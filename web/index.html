,"但正如有的西方学者所说，暗示法受到最热烈欢迎的同时也受到最尖锐的批评"],"q":"暗示法特别强调在第二语言教学中运用心理、生理学规律和心理疗法的方式，对教学过程进行心理组织。是一种颇具特色的教学方法，给第二语言教学带来很多有益的启示，也成为欧洲教学法的一个热门讨论题。汉语作为第二语言教学界也用这一方法进行试验，所以本书做了较详细的介绍。但正如有的西方学者所说，暗示法受到最热烈欢迎的同时也受到最尖锐的批评。该法强调了记忆，而对语言知识的系统","w":"normal","e":["原书正文"]},{"t":"【原文】五、自然法 (Natur","y":"教材原文","p":["五、自然法 (Natural Approach)自然法是７０年代后期产生于美国的新教学法，其倡导者是美国加州大学西班牙语副教授特雷尔(Tracy Terrell)和美国语言教育家克拉申","1977年特雷尔根据自己的教学实验并结合克拉申第二语言习得理论，首次提出了“自然法”的主张","1983年克拉申与特雷尔合作出版了《自然法：课堂中的语言习得》一书，全面阐述了自然法的理论基础和具体实践"],"q":"五、自然法 (Natural Approach)自然法是７０年代后期产生于美国的新教学法，其倡导者是美国加州大学西班牙语副教授特雷尔(Tracy Terrell)和美国语言教育家克拉申。1977年特雷尔根据自己的教学实验并结合克拉申第二语言习得理论，首次提出了“自然法”的主张。1983年克拉申与特雷尔合作出版了《自然法：课堂中的语言习得》一书，全面阐述了自然","w":"normal","e":["原书正文"]},{"t":"【原文】自然法所说的“自然”是指","y":"教材原文","p":["自然法所说的“自然”是指成功的第二语言习得的自然原则","自然法是根据对自然环境中的母语习得和第二语言习得的观察与研究，提出在非自然条件(即课堂教学)中最大限度地扩大对学习者的语言输入、首先集中培养理解能力并强调通过习得掌握第二语言的教学方法","特雷尔与克拉申提倡的自然法与２０世纪初作为直接法"],"q":"自然法所说的“自然”是指成功的第二语言习得的自然原则。 自然法是根据对自然环境中的母语习得和第二语言习得的观察与研究，提出在非自然条件(即课堂教学)中最大限度地扩大对学习者的语言输入、首先集中培养理解能力并强调通过习得掌握第二语言的教学方法。特雷尔与克拉申提倡的自然法与２０世纪初作为直接法","w":"normal","e":["原书正文"]},{"t":"【原文】别称的“自然法”在崇尚语","y":"教材原文","p":["别称的“自然法”在崇尚语言学习的自然原则这一点有共同之处","但两者又有很大的不同","直接法只强调模仿儿童母语习得过程，强调通过大量的操练获得准确性","而自然法则强调可理解的输入，强调交际"],"q":"别称的“自然法”在崇尚语言学习的自然原则这一点有共同之处。但两者又有很大的不同。直接法只强调模仿儿童母语习得过程，强调通过大量的操练获得准确性；而自然法则强调可理解的输入，强调交际。","w":"normal","e":["原书正文"]},{"t":"【原文】自然法以语言交际理论和克","y":"教材原文","p":["自然法以语言交际理论和克拉申的有关第二语言习得理论，即“输入”的五个假说为理论基础","自然法认为应当把培养用语言进行有效交际的能力、而不是把语法上的完美无缺作为初级语言教学的目标","在课堂条件下，甚至从较早的时候开始，学习用目的语进行交际是可能的","问题是必须降低对语言结构准确性的要求"],"q":"自然法以语言交际理论和克拉申的有关第二语言习得理论，即“输入”的五个假说为理论基础。 自然法认为应当把培养用语言进行有效交际的能力、而不是把语法上的完美无缺作为初级语言教学的目标。在课堂条件下，甚至从较早的时候开始，学习用目的语进行交际是可能的。问题是必须降低对语言结构准确性的要求。学习者的中介语不可能是完美无缺的，在有意义的语境中语法错误并不会造成太多的交","w":"normal","e":["原书正文"]}]}]},{"id":"yinlun-c07","t":"第七章 第二语言教学法主要流派与发展趋向","w":"high","s":[{"id":"yinlun-c07-s01","t":"第一节 认知派与经验派教学法","w":"high","n":23,"k":[{"t":"直接法","y":"名词解释","p":["直接法又称“改革法”或“自然法”，是主张以口语教学为基础，按幼儿习得母语的自然过程，用目的语直接与客观事物相联系而不依赖母语、不用翻译的一种第二语言教学法。","19世纪末20世纪初产生于西欧，主要是法国和德国。","直接法的语言观认为语言是习惯，语言的运用是靠感觉和记忆而不是思维。","直接法的心理学基础是联想主义心理学，认为人的学习方式与动物一样，是刺激与反应直接联结，否认意识在其间的作用。","直接法早期的代表人物有德国语言教育家菲埃托(V. W. Vietor)、德国教育家贝力子(M. Berlitz)、法国语言教育家古安(F. Gouin)等。"],"q":"直接法又称“改革法”或“自然法”，是主张以口语教学为基础，按幼儿习得母语的自然过程，用目的语直接与客观事物相联系而不依赖母语、不用翻译的一种第二语言教学法。","w":"high","e":["2017 真题","2020 真题"]},{"t":"情景法","y":"名词解释","p":["情景法是本世纪二三十年代产生于英国的一种以口语能力的培养为基础、强调通过有意义的情景进行目的语基本结构操练的教学法。","情景法早期称为口语法(Oral Approach)，代表人物为英国著名语言教育家帕默(H. E. Palmer)和霍恩比(A. S. Hornby)。","情景法的语言学理论基础是英国的结构主义，口语被认为是语言的基础，准确的结构是说话能力的核心。","情景法的心理学基础是行为主义的习惯形成理论，强调学生通过模仿形成正确的语言习惯。","帕默认为学习语言有两种能力：一种是有意识的学习能力，另一种则是天赋的自然学习能力，这应看做是最早提出的区分语言学习与习得的理论。"],"q":"情景法是本世纪二三十年代产生于英国的一种以口语能力的培养为基础、强调通过有意义的情景进行目的语基本结构操练的教学法。","w":"high","e":["2019 真题"]},{"t":"听说法","y":"名词解释","p":["听说法是本世纪40年代产生于美国的第二语言教学法，强调通过反复的句型结构操练培养口语听说能力，又称“句型法”或“结构法”。","二次大战后期，美国向海外派遣大批军队，为短期内培养受过基本外语口语训练的人员而制订了军队特别培训课程，所以也称为“军队法”。","听说法的语言学理论基础是主张对活的语言(口语)进行仔细的描写分析、不同语言间进行结构对比的美国结构主义语言学。","其心理学理论基础是把人和动物的行为都纳入到刺激—反应轨道之中的行为主义心理学，特别是斯金纳的操作行为主义。"],"q":"听说法是本世纪40年代产生于美国的第二语言教学法，强调通过反复的句型结构操练培养口语听说能力，又称“句型法”或“结构法”。","w":"high","e":["2018 真题","2019 真题","2021 真题"]},{"t":"视听法","y":"名词解释","p":["视听法是50年代产生于法国的一种第二语言教学法，它强调在一定的情景中听觉(录音)感知与视觉(图片影视)感知相结合的教学方法。","因它首创于法国圣克卢高等师范学院，所以也叫“圣克卢法”，代表人物是古布里纳(P. Guberina)和古根汉(G. Gougenhein)。","视听法来源于直接法和听说法，它继承和发扬了二者的长处。","视听法的理论基础也是结构主义语言学和行为主义心理学，认为掌握了一种语言的结构就是掌握了该语言。","视听法又受到完形心理学的影响，强调完整地感知事物，所以视听法也叫“整体结构法”。"],"q":"视听法是50年代产生于法国的一种第二语言教学法，它强调在一定的情景中听觉(录音)感知与视觉(图片影视)感知相结合的教学方法。","w":"high","e":["2019 真题"]},{"t":"认知法","y":"名词解释","p":["认知法又称认知—符号法(Cognitive-Code Approach)，60年代产生于美国，代表人物是美国心理学家卡鲁尔(J. B. Carroll)。","认知法主张在第二语言教学中发挥学习者智力的作用，通过有意识地学习语音、词汇、语法知识，理解、发现、掌握语言规则，并能从听、说、读、写方面全面地、创造性地运用语言。","认知法的语言学理论基础是乔姆斯基的转换生成语法理论，认为语言是一种受规则支配的体系而不是习惯体系；其心理学基础是认知心理学。","认知法还受到皮亚杰的“发生认识论”以及布鲁纳“学科结构论”和“发现学习论”等心理教育学理论的影响。"],"q":"认知法又称认知—符号法(Cognitive-Code Approach)，60年代产生于美国，代表人物是美国心理学家卡鲁尔(J. B. Carroll)。","w":"high","e":["2018 真题","2021 真题"]},{"t":"交际法","y":"名词解释","p":["交际法又称“交际语言教学”(Communicative Language Teaching)，较早称为“功能法”(Functional Approach)、“意念—功能法”(Notional-Functional Approach)，是以语言功能和意念项目为纲、培养在特定的社会语境中运用语言进行交际能力的一种教学法。","交际法产生于70年代初期西欧共同体国家，中心在英国，创始人为英国语言学家威尔金斯(D. A. Wilkins)。","交际法的语言学理论基础正是60年代兴起、70年代形成高潮的社会语言学，尤其是社会语言学家海姆斯的交际能力理论和功能主义语言学家韩礼德的功能语言理论和话语分析理论，以及威多森的语言交际观。","在心理学方面，交际法受到人本主义心理学和60年代后期兴起的心理语言学的影响，强调以学生为中心。"],"q":"交际法又称“交际语言教学”(Communicative Language Teaching)，较早称为“功能法”(Functional Approach)、“意念—功能法”(Notional-Functional Approach)，是以语言功能和意念项目为纲、培养在特定的社会语境中运用语言进行交际","w":"high","e":["2020 真题"]},{"t":"语法翻译法","y":"名词解释","p":["语法翻译法又称“传统法”或“古典法”，是以系统的语法知识教学为纲，依靠母语，通过翻译手段，主要培养第二语言读写能力的教学法。","这是第二语言教学史上最古老的教学法，在欧洲用于教授古希腊语、拉丁语已有千百年的历史。","语法翻译法的语言学基础是历史比较语言学，认为一切语言都起源于一种共同的原始语言，语言规律是共同的，词汇所代表的概念也是相同的，所不同的只是词汇的语音和书写形式。","语法翻译法的心理学基础是18世纪德国的官能心理学，其创始人是德国哲学家沃尔夫(C. Wolff)。","18世纪末、19世纪初，德国语言学家奥伦多夫(H. Ollendorff)等对语法翻译法进行了理论上的总结与阐述，使之成为一种科学的第二语言教学法体系。"],"q":"语法翻译法又称“传统法”或“古典法”，是以系统的语法知识教学为纲，依靠母语，通过翻译手段，主要培养第二语言读写能力的教学法。","w":"high","e":["2018 真题","2021 真题"]},{"t":"自觉对比法","y":"名词解释","p":["自觉对比法是主张通过母语与目的语的翻译和结构对比，自觉掌握目的语的一种教学方法。","在本世纪30年代至50年代成为前苏联正统的外语教学法，对东欧和蒙古的外语教学也有较大影响，50年代我国外语教学基本上是以自觉对比法为依据。","自觉对比法是以直接法为对立面，客观上成了语法翻译法的继承和发展。","自觉对比法的理论基础首先是重视德育、把教育教养任务放在首位的苏联教育学思想，还以当时苏联的语言学和心理学理论为基础。"],"q":"自觉对比法是主张通过母语与目的语的翻译和结构对比，自觉掌握目的语的一种教学方法。","w":"high","e":["2020 真题"]},{"t":"自觉实践法","y":"名词解释","p":["自觉实践法是前苏联20世纪60年代以来广泛采用的外语教学方法，主张学习者在自觉掌握一定语言理论知识基础上，主要通过大量言语实践活动达到直觉运用目的语。","代表人物是前苏联的心理学家别利亚耶夫(Б. B. Беляев)。","自觉实践法主要继承直接法通过大量言语实践培养听说读写技能的本质特点，同时也继承了语法翻译法强调自觉掌握语言规则的正确主张，同时吸取了对立的两大派的长处。","自觉实践法的语言学基础是苏联著名语言学家谢尔巴院士关于区分语言、言语、言语活动的学说。"],"q":"自觉实践法是前苏联20世纪60年代以来广泛采用的外语教学方法，主张学习者在自觉掌握一定语言理论知识基础上，主要通过大量言语实践活动达到直觉运用目的语。","w":"high","e":["2020 真题"]},{"t":"教学法流派","y":"名词解释","p":["教学法流派，指在一定的理论指导下在教学实践中逐渐形成的、包括其理论基础、教学目标、教学原则、教学内容、教学过程、教学形式、教学方法和技巧、教学手段、教师与学生的作用和评估方法等方面的教学法体系。","一种教学法流派的形成除了受当时的时代背景，特别是政治、经济等因素的影响外，更直接地受这一阶段的语言学理论、心理学理论、教育学理论以及一些其他相邻学科发展的影响。","各种不同教学法流派之间的差异，主要是由于对语言本质特征和对语言学习规律有不同认识，因而对教学规律有不同看法。","它影响到教学大纲的制订、教材的编写、课程教学程序和方法的确定，以及测试评估手段的选择等。"],"q":"教学法流派，指在一定的理论指导下在教学实践中逐渐形成的、包括其理论基础、教学目标、教学原则、教学内容、教学过程、教学形式、教学方法和技巧、教学手段、教师与学生的作用和评估方法等方面的教学法体系。","w":"high","e":["2021 真题"]},{"t":"试分析交际法与听说法的主要区别。","y":"名词解释","p":["(1)目标：听说法培养语言能力，强调语言的正确性；功能法培养语言交际能力，强调语言的流利性、可接受性和得体性。","(2)重点：听说法对结构和形式的重视超过意义，句子是基本教学单位；功能法意义和功能压倒一切，话语是基本教学单位。","(3)内容：听说法教学顺序由语言结构的复杂性决定；功能法教学顺序主要由学习者对内容、功能或意义的需要和兴趣决定。","(4)方法：听说法操练是主要的方法，追求“过度学习”；功能法通过交际活动掌握目的语系统。","(5)母语：听说法尽可能避免使用母语；功能法在需要时允许适当用一些母语。","(6)师生：听说法以教师为中心；功能法以学生为中心。"],"q":"交际法与听说法的区别主要体现在以下六个方面：(1)目标。听说法是培养语言能力，强调语言的正确性，追求达到说母语者的发音水平；功能法是培养语言交际能力，更强调语言的流利性、可接受性和得体性，而正确性要由语境来决定。(2)重点。听说法对结构和形式的重视超过意义，句子是基本教学单位；功能法则意义和功能压倒","w":"high","e":["2020 真题"]},{"t":"系列法","y":"名词解释","p":["系列法(Series Method)产生于19世纪后半期，倡导者为法国语言教育家古安。","古安根据对儿童语言行为的观察，发现儿童有强烈的讲述自己经历的要求，而且有依据时间顺序排列事件的能力；事物如具有系列性的特点则有利于根据上下文来理解和联想、记忆，也有利于表达。","他在编写教材中，把学生的日常生活分解成许多意义上有联系同时按顺序排列的小段，从而组成一个个系列，再根据这些系列组织语言材料；其中特别要突出动词的使用，把动词作为语言的中心。"],"q":"系列法(Series Method)产生于19世纪后半期，倡导者为法国语言教育家古安。","w":"normal","e":["核心概念"]},{"t":"阅读法","y":"名词解释","p":["阅读法产生于20世纪初，为英国著名语言教育家韦斯特(M. West)在印度从事英语教学工作时所创立，又称韦斯特“新法”，是一种强调通过直接阅读来培养阅读能力的教学法。","与帕默强调“口语是基础”不同，韦斯特强调“阅读是基础”。","韦斯特认为应当通过阅读学会阅读，阅读既是目的也是手段。","阅读法要求学生接触大量的语言材料，在上下文或插图的帮助下直接理解阅读材料的内容；不主张阅读之前先教语法规则，而是阅读后把学习者在阅读中已熟悉的语法项目进行归纳。"],"q":"阅读法产生于20世纪初，为英国著名语言教育家韦斯特(M. West)在印度从事英语教学工作时所创立，又称韦斯特“新法”，是一种强调通过直接阅读来培养阅读能力的教学法。","w":"normal","e":["核心概念"]},{"t":"教学法体系","y":"名词解释","p":["改革和完善教学法体系是本学科建设的三项任务之一。","中外汉语教学工作者普遍对目前汉语教学效果不满意。达到同样的程度，学习汉语所花的时间和精力往往超过学习其他第二语言。","根本原因可能还在于我们没有完全找到针对汉语特点的学习规律与教学规律，汉语作为第二语言的教学法体系还不完善，教学方法还需进一步改革。","目前我国流行的对外汉语教学模式是在80年代中期定型的，它反映的是60~70年代国际语言教学的认识水平。"],"q":"改革和完善教学法体系是本学科建设的三项任务之一。","w":"normal","e":["核心概念"]},{"t":"分阶段教学法","y":"名词解释","p":["美国学者黎天睦(T. Light)提出了“分阶段教学法”的主张，即根据不同学习阶段的特点，采用适当的教学法。","由于教学目的、教学对象、教学阶段和教学条件的不同，事实上不可能有适应各种情况的万能教学法。","很多学者主张应该根据不同的情况，选择不同的教学法。","黎天睦提出：初级阶段宜用听说法，中级阶段宜用交际法，高级阶段则用认知法或语法翻译法；同一阶段也可以几种教学法交叉使用。"],"q":"美国学者黎天睦(T. Light)提出了“分阶段教学法”的主张，即根据不同学习阶段的特点，采用适当的教学法。","w":"normal","e":["核心概念"]},{"t":"【原文】(2)设计层面","y":"教材原文","p":["设计包括教学目标、教学大纲、学与教的活动类型、学习者的作用、教师的作用、教材的作用等方而，实际上体现了该教学法的主要教学原则"],"q":"(2)设计层面。设计包括教学目标、教学大纲、学与教的活动类型、学习者的作用、教师的作用、教材的作用等方而，实际上体现了该教学法的主要教学原则。","w":"normal","e":["原书正文"]},{"t":"【原文】从教学目标来看，上述两大","y":"教材原文","p":["从教学目标来看，上述两大类教学法有明显的不同","重语言结构规则的一类，强调语音语法词汇知识的教学和口语听说技能的训练，追求语法语音的准确性","重语言功能意义一类则强调语言交际能力的培养，追求在交际中能成功地表达自己和理解别入"],"q":"从教学目标来看，上述两大类教学法有明显的不同。重语言结构规则的一类，强调语音语法词汇知识的教学和口语听说技能的训练，追求语法语音的准确性；重语言功能意义一类则强调语言交际能力的培养，追求在交际中能成功地表达自己和理解别入。","w":"normal","e":["原书正文"]},{"t":"【原文】在教学大纲的制订即教学内","y":"教材原文","p":["在教学大纲的制订即教学内容的选择和顺序安排方而，重语言结构规则的一类(最典型的如情景法、听说法等)着重语言点的学习，教学内容强调“如何说”，并根据内容的难易程度或出现的频率确定教学顺序，这一顺序对所有学习者都是相同的","重语言功能意义一类(如功能法特别是专用英语教学)着重题材的学习，教学内容强调“说"],"q":"在教学大纲的制订即教学内容的选择和顺序安排方而，重语言结构规则的一类(最典型的如情景法、听说法等)着重语言点的学习，教学内容强调“如何说”，并根据内容的难易程度或出现的频率确定教学顺序，这一顺序对所有学习者都是相同的；重语言功能意义一类(如功能法特别是专用英语教学)着重题材的学习，教学内容强调“说","w":"normal","e":["原书正文"]},{"t":"【原文】什么”，教学顺序由学习者","y":"教材原文","p":["什么”，教学顺序由学习者交际的需要来确定","两者的差别甚至从大纲的模式就能区分出来","重结构规则的大纲往往带有语法项目表、词汇结构表和词汇表","而重功能意义的教学大纲则规定出用于交际的功能、意念、话题，也包括语法和词汇内容"],"q":"什么”，教学顺序由学习者交际的需要来确定。两者的差别甚至从大纲的模式就能区分出来。重结构规则的大纲往往带有语法项目表、词汇结构表和词汇表；而重功能意义的教学大纲则规定出用于交际的功能、意念、话题，也包括语法和词汇内容。人本派教学法较少使用大纲一词，团体语言学习法根本没有事前准备的语言教学大纲，从观察实际课堂教学分析，该教学法所侧重的还是词汇语法即“如何说”的","w":"normal","e":["原书正文"]},{"t":"【原文】学与教的活动类型反映了教","y":"教材原文","p":["学与教的活动类型反映了教学过程","绝大部分教学法特别是重结构规则的教学法，其教学过程都以传授式为主，在教师的主导下系统地传授知识(作为语言教学当然也包括语言技能的操练)，从最古老的语法翻译法到直接法、情景法、听说法、视听法等都体现了这一特点","人本派教学法则更多受到发现式学习的影响，主张在学习学科知识的同时让学习者通过自己的活动去发现知识、总结规律，这已成为团体语言学习法、默教法、全身反应法、暗示法、自然法等教学法的主要特征之一","不同教学法所经常采用的活动类型也不同"],"q":"学与教的活动类型反映了教学过程。绝大部分教学法特别是重结构规则的教学法，其教学过程都以传授式为主，在教师的主导下系统地传授知识(作为语言教学当然也包括语言技能的操练)，从最古老的语法翻译法到直接法、情景法、听说法、视听法等都体现了这一特点。人本派教学法则更多受到发现式学习的影响，主张在学习学科知识的同时让学习者通过自己的活动去发现知识、总结规律，这已成为团体","w":"normal","e":["原书正文"]},{"t":"【原文】学习者的作用主要指学习者","y":"教材原文","p":["学习者的作用主要指学习者对学习过程所起的作用，表现为学习者对学习内容的控制程度、对学习活动的参与程度以及学习者在学习方面相互影响的程度","在情景法、听说法、视听法中学习者只是一种刺激一反应的机器，几乎发挥不了任何作用","而在交际法中首先强调要分析学习者对目的语的需要，弄清学习者未来要用目的语从事什么样的活动，需要什么样的运用目的语的能力，让他学习他所需要的内容","教学过程交际化决定了学习者在整个教学活动中处于主体的地位，体现“自我学习”的过程，强调学习者个人经验在课堂学"],"q":"学习者的作用主要指学习者对学习过程所起的作用，表现为学习者对学习内容的控制程度、对学习活动的参与程度以及学习者在学习方面相互影响的程度。在情景法、听说法、视听法中学习者只是一种刺激一反应的机器，几乎发挥不了任何作用。而在交际法中首先强调要分析学习者对目的语的需要，弄清学习者未来要用目的语从事什么样的活动，需要什么样的运用目的语的能力，让他学习他所需要的内容。","w":"normal","e":["原书正文"]},{"t":"【原文】习中的作用。在自然法中，","y":"教材原文","p":["在自然法中，学习者根据其学习目标和学习进展情况，自行决定何时“开口”，决定讲什么和运用哪些表达形式，甚至像语法、语音练习的时间教师都必须与他商量","在团体语言学习法中，也是由学习者自己决定学习的内容和方式"],"q":"习中的作用。在自然法中，学习者根据其学习目标和学习进展情况，自行决定何时“开口”，决定讲什么和运用哪些表达形式，甚至像语法、语音练习的时间教师都必须与他商量。在团体语言学习法中，也是由学习者自己决定学习的内容和方式。","w":"normal","e":["原书正文"]},{"t":"【原文】与学习者的作用紧密相关的","y":"教材原文","p":["与学习者的作用紧密相关的是教师的地位和作用","教师对教学过程所起的作用，体现在他所扮演的角色是指导者还是顾问、他对教学过程的控制程度和对决定教学内容所负的责任以及师生交互活动的方式","从语法翻译法到听说法、视听法等大部分教学法中，教学都完全依赖教师，把教师看做是知识的来源和教学的主宰","而功能派和人本派教学法中，教师只是起学习的促进者、顾问、引导者和示范者作用，师生之间的关系体现为医生与病人、教练与运动员的关系，甚至朋友、同事和队友的关系"],"q":"与学习者的作用紧密相关的是教师的地位和作用。教师对教学过程所起的作用，体现在他所扮演的角色是指导者还是顾问、他对教学过程的控制程度和对决定教学内容所负的责任以及师生交互活动的方式。从语法翻译法到听说法、视听法等大部分教学法中，教学都完全依赖教师，把教师看做是知识的来源和教学的主宰；而功能派和人本派教学法中，教师只是起学习的促进者、顾问、引导者和示范者作用，师","w":"normal","e":["原书正文"]}]},{"id":"yinlun-c07-s02","t":"第二节 人本派与功能派教学法","w":"high","n":15,"k":[{"t":"自然法","y":"名词解释","p":["自然法是70年代后期产生于美国的新教学法，其倡导者是美国加州大学西班牙语副教授特雷尔(Tracy Terrell)和美国语言教育家克拉申。","自然法是根据对自然环境中的母语习得和第二语言习得的观察与研究，提出在非自然条件(即课堂教学)中最大限度地扩大对学习者的语言输入、首先集中培养理解能力并强调通过习得掌握第二语言的教学方法。","自然法以语言交际理论和克拉申的有关第二语言习得理论，即“输入”的五个假说为理论基础。","1983年克拉申与特雷尔合作出版了《自然法：课堂中的语言习得》一书，全面阐述了自然法的理论基础和具体实践。"],"q":"自然法是70年代后期产生于美国的新教学法，其倡导者是美国加州大学西班牙语副教授特雷尔(Tracy Terrell)和美国语言教育家克拉申。","w":"high","e":["2018 真题"]},{"t":"全身反应法","y":"名词解释","p":["全身反应法(简称TPR)于60年代初期产生于美国，盛行于70年代，创始人是美国实验心理学家阿舍尔(James T. Asher)。","这种教学法强调语言学习行为的协调，通过身体动作教授第二语言，主要用于美国移民儿童的英语教育。","全身反应法是以儿童习得第一语言的理论为依据。","其实比阿舍尔早半个世纪，第一次大战时帕默就提出过第二语言听说读写的教学顺序，主张理解能力先于表达能力，还在其著作《通过动作学英语》中竭力提倡在教学的第一阶段让学生做执行教师指令的训练。","逐渐形成了各种以听力领先、从较长期的听力理解训练开始的“领会教学法”(Comprehension Approach)，全身反应法则是其中最具代表性、且影响最大的一种。"],"q":"全身反应法(简称TPR)于60年代初期产生于美国，盛行于70年代，创始人是美国实验心理学家阿舍尔(James T. Asher)。","w":"high","e":["2019 真题"]},{"t":"功能","y":"名词解释","p":["交际法一反其他教学法以语法或句型结构为纲的传统做法，明确提出以功能意念为纲。","功能是用语言做事，完成一定的交际行为。","交际大纲把语言功能分为六类：传达与了解实际情况；表达或了解理智性的态度；表达或了解道义上的态度；表达或了解情感性的态度；请人做事；社交。","以“邮局在哪儿?”这个句子为例，其功能是询问。"],"q":"交际法一反其他教学法以语法或句型结构为纲的传统做法，明确提出以功能意念为纲。","w":"normal","e":["核心概念"]},{"t":"意念","y":"名词解释","p":["意念指功能作用的对象，也就是功能的具体内容，常用来回答“什么”、“谁”的问题。","意念又分为普通意念和特殊意念。","普通意念指与功能相关的时、空、数量等关系，比如表示存在、空间、时间、数量、质量、心理关系、指代等，适用于各种话题和背景，是所有学习者都必须掌握的，与功能称为“共核”。","特殊意念是由话题直接决定的词汇项目，也就是各类词汇，如个人身份、住处、业余爱好、旅行、健康福利等。"],"q":"意念指功能作用的对象，也就是功能的具体内容，常用来回答“什么”、“谁”的问题。","w":"normal","e":["核心概念"]},{"t":"默教法","y":"名词解释","p":["默教法是美国教育家加特诺(C. Gattegno)于60年代初首创的一种第二语言教学法，它要求教师在课堂上尽量少说话，尽量鼓励学生多参与言语活动，从而使学生更有效地掌握运用第二语言的能力。","教师的沉默是默教法的最大特点。","默教法的主要理论基础是布鲁纳“发现学习”的教育思想，认为学习应是解决问题式的、创造和发现式的活动。","默教法还从儿童第一语言习得中吸取了不少有益的东西，但同时又认为成人第二语言学习完全不同于儿童母语习得，成功的第二语言学习是受到严格控制的“人为”的方法。"],"q":"默教法是美国教育家加特诺(C. Gattegno)于60年代初首创的一种第二语言教学法，它要求教师在课堂上尽量少说话，尽量鼓励学生多参与言语活动，从而使学生更有效地掌握运用第二语言的能力。","w":"normal","e":["核心概念"]},{"t":"暗示法","y":"名词解释","p":["暗示法是由保加利亚精神病医学家和心理学家、教育家罗扎诺夫(G. Lozanov)于60年代中期创立的。","这是一种强调通过暗示，开发人的身心两方面的潜力，激发高度的学习动机并创造最佳学习条件，有意识的和无意识的活动相结合，让学习者在放松而又注意力高度集中的心理状态下进行有效学习的教学方法。","暗示法以现代心理学和生理学为其理论基础。","为了把学习者从错误的暗示惯性中解放出来，正确的暗示主要采取两种手段：威信和稚化。","罗扎诺夫还提出教学中充分考虑到心理、生理规律的三个基本原则：学习活动应由整个大脑组织参与；教学中的分析与综合应同时进行；学习者的意识过程和超意识过程应同时地、不可分割地进行。"],"q":"暗示法是由保加利亚精神病医学家和心理学家、教育家罗扎诺夫(G. Lozanov)于60年代中期创立的。","w":"normal","e":["核心概念"]},{"t":"团体语言学习法","y":"名词解释","p":["团体语言学习法60年代初创立于美国，代表人物为美国心理学家柯伦(C. A. Curran)。","这是一种采用小组集体讨论的形式、教师和学生处于医生和病人的关系并把学习过程看成是咨询过程的第二语言学习方法，也称为咨询法(Counseling Learning)。","团体语言学习法的理论基础是人本主义心理学，强调整体学习观，认为人类学习是完整的人的学习。","团体语言学习法吸取了心理疗法的理论和方法，把教师看做是咨询医生，把学生看做是病人。"],"q":"团体语言学习法60年代初创立于美国，代表人物为美国心理学家柯伦(C. A. Curran)。","w":"normal","e":["核心概念"]},{"t":"【原文】汉语专项技能课有：汉语听","y":"教材原文","p":["汉语专项技能课有：汉语听力、汉语读写、汉语阅读、汉语口语、汉语视听、写作人门(以上第一学年)","汉语听力口语、汉语泛读、汉语写作基础、中国报刊语言基础、新闻听力、翻译基础(以上第二学年)","汉语高级口语、汉语写作、中国报刊阅读、翻译(以上第三学年)","翻译、当代中国话题(以上第四学年)"],"q":"汉语专项技能课有：汉语听力、汉语读写、汉语阅读、汉语口语、汉语视听、写作人门(以上第一学年)。 汉语听力口语、汉语泛读、汉语写作基础、中国报刊语言基础、新闻听力、翻译基础(以上第二学年)。汉语高级口语、汉语写作、中国报刊阅读、翻译(以上第三学年)。翻译、当代中国话题(以上第四学年)。","w":"normal","e":["原书正文"]},{"t":"【原文】汉语知识课有：现代汉语语","y":"教材原文","p":["汉语知识课有：现代汉语语音、汉字概论(以上第二学年)","现代汉语词汇、古代汉语(以上第三学年)","现代汉语语法、汉语语法修辞(以上第四学年)"],"q":"汉语知识课有：现代汉语语音、汉字概论(以上第二学年)。现代汉语词汇、古代汉语(以上第三学年)。现代汉语语法、汉语语法修辞(以上第四学年)。","w":"normal","e":["原书正文"]},{"t":"【原文】文化知识课有：中国近代史","y":"教材原文","p":["文化知识课有：中国近代史、中国现代史、中国地理(以上第二学年)","中国古代史、中国现代文学史、中国文化史、中国哲学史(以上第三学年)","中国古代文学史、汉语古籍选读(以上第四学年)"],"q":"文化知识课有：中国近代史、中国现代史、中国地理(以上第二学年)。中国古代史、中国现代文学史、中国文化史、中国哲学史(以上第三学年)。中国古代文学史、汉语古籍选读(以上第四学年)。","w":"normal","e":["原书正文"]},{"t":"【原文】其他课程：中华武术(第二","y":"教材原文","p":["其他课程：中华武术(第二学年)、中文电脑编辑、实习、讲座、学士学位论文(以上第四学年)"],"q":"其他课程：中华武术(第二学年)、中文电脑编辑、实习、讲座、学士学位论文(以上第四学年)。","w":"normal","e":["原书正文"]},{"t":"【原文】作为学历教育的专业课程设","y":"教材原文","p":["作为学历教育的专业课程设置，上述各类课程的安排比较全面、合理，反映了在长期对外汉语教学实践基础上的课程研究成果，对非学历教育的各类对外汉语教学也有参考价值","非学历教育的对外汉语教学课程设置，同样需要处理好不同教学要求、不同阶段各类课程的比重，要处理好语言知识课与言语技能课的关系、综合技能课与专项技能课的关系、语言课与文化课的关系、课内课程与课外课程的关"],"q":"作为学历教育的专业课程设置，上述各类课程的安排比较全面、合理，反映了在长期对外汉语教学实践基础上的课程研究成果，对非学历教育的各类对外汉语教学也有参考价值。非学历教育的对外汉语教学课程设置，同样需要处理好不同教学要求、不同阶段各类课程的比重，要处理好语言知识课与言语技能课的关系、综合技能课与专项技能课的关系、语言课与文化课的关系、课内课程与课外课程的关","w":"normal","e":["原书正文"]},{"t":"【原文】3.教学计划与教学大纲教","y":"教材原文","p":["3.教学计划与教学大纲教学计划是根据教育目的和培养目标所制定的全面指导某专业教与学活动的规范性文件","教学计划是以课程设计为核心的总体设计的具体体现，主要包括专业培养目标、学习年限、课程设置及其主要教学方式和学时分配","其中，课程体系是主要内容，教学计划也可以看做是课程设置的总体规划，决定该专业课程的结构与方向","教学计划常由国家教育行政部门组织制订，对有关专业的教学工作和教学活动提出统一的要求，因此教学计划是编制教学大纲和编写教材的主要依据，也是进行教学活动、评估教学工作的主要依据"],"q":"3.教学计划与教学大纲教学计划是根据教育目的和培养目标所制定的全面指导某专业教与学活动的规范性文件。教学计划是以课程设计为核心的总体设计的具体体现，主要包括专业培养目标、学习年限、课程设置及其主要教学方式和学时分配。其中，课程体系是主要内容，教学计划也可以看做是课程设置的总体规划，决定该专业课程的结构与方向。教学计划常由国家教育行政部门组织制订，对有关专业的","w":"normal","e":["原书正文"]},{"t":"【原文】教学大纲是根据教学计划、","y":"教材原文","p":["教学大纲是根据教学计划、以纲要形式制定的、对具体课程的教学目的、教学内容、教学进度和教学方法进行规范的指导性文件","教学大纲通常分说明、本文和附录三部分","说明部分阐明本课程的教学对象、教学目的要求、教学方式、本课程在专业中的地位和作用等","本文部分按课、章、节详细规定教学内容及其定量分级、主要教学环节"],"q":"教学大纲是根据教学计划、以纲要形式制定的、对具体课程的教学目的、教学内容、教学进度和教学方法进行规范的指导性文件。教学大纲通常分说明、本文和附录三部分。说明部分阐明本课程的教学对象、教学目的要求、教学方式、本课程在专业中的地位和作用等；本文部分按课、章、节详细规定教学内容及其定量分级、主要教学环节；附录部分是各种教学参考资料和附表(如语言学科的词汇表、汉字表","w":"normal","e":["原书正文"]},{"t":"【原文】教学计划和教学大纲都是教","y":"教材原文","p":["教学计划和教学大纲都是教学工作指导性文件，教师在教学活动中应该严格遵守、认真执行"],"q":"教学计划和教学大纲都是教学工作指导性文件，教师在教学活动中应该严格遵守、认真执行。","w":"normal","e":["原书正文"]}]},{"id":"yinlun-c07-s03","t":"第三节 第二语言教学法的发展趋向","w":"high","n":10,"k":[{"t":"综合法","y":"名词解释","p":["50年来我国对外汉语教学界在辩证唯物主义思想指导下，正是从汉语教学的实际出发，吸取了国外第二语言教学法各流派的优秀成分，摈弃其极端化、片面化的做法，不拘一格走一条综合化的路子。","今天本学科大部分教师和学者仍主张继续进行“综合法”的研究。","具体说来，这种综合法既应重视语言功能的教学和交际能力的培养，又应加强语言结构规则的教学；既强调语法知识的理解和掌握，又重视通过模仿操练形成习惯；既重视课堂上的自觉学习，并以此为主；又重视课堂和课下的自然习得，不排斥其辅助作用。","既强调以学生为中心、充分调动学习者的主动性积极性，又重视教师的主导作用；教材既要用规范、循序渐进、有利于学习的材料，也要逐步增加“真实”教材的比重。"],"q":"50年来我国对外汉语教学界在辩证唯物主义思想指导下，正是从汉语教学的实际出发，吸取了国外第二语言教学法各流派的优秀成分，摈弃其极端化、片面化的做法，不拘一格走一条综合化的路子。","w":"high","e":["2019 真题"]},{"t":"路子、设计、步骤","y":"名词解释","p":["美国教学法家理查德和罗杰斯(Jack C. Richards and Theodore S. Rodgers)提出了一个比较全面的描述和分析第二语言教学法流派的模式。","这一模式分三个层次：①路子(approach)，即该教学法所依据的语言理论和语言学习理论；②设计(design)，由路子所决定的语言教学计划和安排，实质上反映了主要教学原则；③步骤(procedure)，实现教学设计的具体方法技巧和课堂的活动。","分析教学法流派主要应从三方面入手，即教学法的理论基础、所体现的主要教学原则和采取的主要教学方法。","前两节我们已基本上根据这一模式，特别是上述三个主要方面分述了各教学法的特点。"],"q":"美国教学法家理查德和罗杰斯(Jack C. Richards and Theodore S. Rodgers)提出了一个比较全面的描述和分析第二语言教学法流派的模式。","w":"high","e":["2021 真题"]},{"t":"【原文】(3)要有利于贯彻精讲多","y":"教材原文","p":["(3)要有利于贯彻精讲多练的原则","既要提供必要的理论知识，更要提供大量的、充分的练习","练习是获得技能和能力的主要途径之一，是教材中的主要部分","练习要生动有趣，在形式和层次上要多样化"],"q":"(3)要有利于贯彻精讲多练的原则。既要提供必要的理论知识，更要提供大量的、充分的练习。练习是获得技能和能力的主要途径之一，是教材中的主要部分。练习要生动有趣，在形式和层次上要多样化。","w":"normal","e":["原书正文"]},{"t":"【原文】3. 科学性针对性、实用","y":"教材原文","p":["3. 科学性针对性、实用性以及后面谈到的趣味性、系统性也都属于科学性的范围","这里要特别强调以下几点："],"q":"3. 科学性针对性、实用性以及后面谈到的趣味性、系统性也都属于科学性的范围。这里要特别强调以下几点：","w":"normal","e":["原书正文"]},{"t":"【原文】(1) 要教规范、通用的","y":"教材原文","p":["(1) 要教规范、通用的语言","我国规范、通用的汉语是普通话，规范、通用的标注音素读音的符号是《汉语拼音方案》，规范、通用的汉字是我国正式公布的简化字","对外汉语教材都是利用拼音方案，使用简化字，教普通话","为了特殊的需要，才会教某种方言(如广东话)"],"q":"(1) 要教规范、通用的语言。我国规范、通用的汉语是普通话，规范、通用的标注音素读音的符号是《汉语拼音方案》，规范、通用的汉字是我国正式公布的简化字。对外汉语教材都是利用拼音方案，使用简化字，教普通话。 为了特殊的需要，才会教某种方言(如广东话)。在高年级为了从实际出发培养听力，可能有意识地安排带方言味的普通话听力训练。考虑到海外华人社会的现实需要，一般教材","w":"normal","e":["原书正文"]},{"t":"【原文】(2)教材内容的组织要符","y":"教材原文","p":["(2)教材内容的组织要符合语言教学的规律","顺序的安排要循序渐进，做到由易到难，由简到繁，由浅入深","题材内容也应从日常生活交际开始，由近及远，逐步扩大到社会生活、政治经济、文化传统等","新词语和语法点要分布均匀、合理，难点分散"],"q":"(2)教材内容的组织要符合语言教学的规律。顺序的安排要循序渐进，做到由易到难，由简到繁，由浅入深。题材内容也应从日常生活交际开始，由近及远，逐步扩大到社会生活、政治经济、文化传统等。新词语和语法点要分布均匀、合理，难点分散。要特别注意词汇和句型的重现率，循环复习，加强记忆。","w":"normal","e":["原书正文"]},{"t":"【原文】(3)对语言现象(语音、","y":"教材原文","p":["(3)对语言现象(语音、词汇、语法、语义、语用等)的解释要注意准确性，避免造成对学习者的误导"],"q":"(3)对语言现象(语音、词汇、语法、语义、语用等)的解释要注意准确性，避免造成对学习者的误导。","w":"normal","e":["原书正文"]},{"t":"【原文】(4)教材内容要反映出学","y":"教材原文","p":["(4)教材内容要反映出学科理论研究的新水平，及时更换陈旧内容","另一方面，语言研究的新成果进入教材，又要持慎重态度，这也是科学性的体现"],"q":"(4)教材内容要反映出学科理论研究的新水平，及时更换陈旧内容。 另一方面，语言研究的新成果进入教材，又要持慎重态度，这也是科学性的体现。","w":"normal","e":["原书正文"]},{"t":"【原文】4. 趣味性教材内容和形","y":"教材原文","p":["4. 趣味性教材内容和形式生动有趣，能吸引学习者，使学习者产生学习兴趣和动力，让相对说来比较枯燥的语言学习过程变得轻松愉快","教材的趣味性是十分重要的原则，也是长期以来教材编者感到难度最大的原则之一","尤其在初级阶段，加强趣味性往往被认为只有增加教材的难度才能做到","或者与此相反，把儿童教材中有趣的东西简单地搬到成人教材中，使成人教材内容“稚化”(这不同于暗示法主张的学习者课堂活动方式的稚化)"],"q":"4. 趣味性教材内容和形式生动有趣，能吸引学习者，使学习者产生学习兴趣和动力，让相对说来比较枯燥的语言学习过程变得轻松愉快。教材的趣味性是十分重要的原则，也是长期以来教材编者感到难度最大的原则之一。尤其在初级阶段，加强趣味性往往被认为只有增加教材的难度才能做到；或者与此相反，把儿童教材中有趣的东西简单地搬到成人教材中，使成人教材内容“稚化”(这不同于暗示法主","w":"normal","e":["原书正文"]},{"t":"【原文】(1) 教材的趣味性与教","y":"教材原文","p":["(1) 教材的趣味性与教材的实用性、交际性紧密相关","尤其在初级阶段，要紧密结合学生的生活与交际，使教材的内容正是学习者316"],"q":"(1) 教材的趣味性与教材的实用性、交际性紧密相关。尤其在初级阶段，要紧密结合学生的生活与交际，使教材的内容正是学习者316","w":"normal","e":["原书正文"]}]}]},{"id":"yinlun-c08","t":"第八章 对外汉语教学理论与应用(上)","w":"high","s":[{"id":"yinlun-c08-s01","t":"第一节 对外汉语教学目的与课程设计","w":"high","n":14,"k":[{"t":"总体设计","y":"名词解释","p":["总体设计是吕必松在80年代初根据对外汉语教学事业创立时期教学活动处于经验型的探索阶段、缺乏科学性和规范性的实际情况提出的理论。","他把对外汉语教学看做是一项系统工程，认为总体设计是“根据语言规律、语言学习规律和语言教学规律，在全面分析第二语言教学的各种主客观条件、综合考虑各种可能的教学措施的基础上选择最佳方案，对教学对象、教学目标、教学内容、教学途径、教学原则以及教师的分工和对教师的要求等做出明确的规定，以便指导教材编写(或选择)、课堂教学和成绩测试，使各个教学环节成为一个互相衔接的、统一的整体，使全体教学人员根据不同的分工在教学上进行协调行动”。","他并把总体设计以及根据总体设计而进行的教材编写、课堂教学和语言测试看做是对外汉语教学活动的四大环节。"],"q":"总体设计是吕必松在80年代初根据对外汉语教学事业创立时期教学活动处于经验型的探索阶段、缺乏科学性和规范性的实际情况提出的理论。","w":"high","e":["2019 真题"]},{"t":"教学计划","y":"名词解释","p":["教学计划是根据教育目的和培养目标所制定的全面指导某专业教与学活动的规范性文件。","教学计划是以课程设计为核心的总体设计的具体体现，主要包括专业培养目标、学习年限、课程设置及其主要教学方式和学时分配。","其中，课程体系是主要内容，教学计划也可以看做是课程设置的总体规划，决定该专业课程的结构与方向。","教学计划常由国家教育行政部门组织制订，对有关专业的教学工作和教学活动提出统一的要求，因此教学计划是编制教学大纲和编写教材的主要依据，也是进行教学活动、评估教学工作的主要依据。"],"q":"教学计划是根据教育目的和培养目标所制定的全面指导某专业教与学活动的规范性文件。","w":"high","e":["2021 真题"]},{"t":"教学大纲","y":"名词解释","p":["教学大纲是根据教学计划、以纲要形式制定的、对具体课程的教学目的、教学内容、教学进度和教学方法进行规范的指导性文件。","教学大纲通常分说明、本文和附录三部分。","说明部分阐明本课程的教学对象、教学目的要求、教学方式、本课程在专业中的地位和作用等；本文部分按课、章、节详细规定教学内容及其定量分级、主要教学环节；附录部分是各种教学参考资料和附表(如语言学科的词汇表、汉字表、功能项目表等)。","根据语言教学的特点，有的教学大纲按语言要素分别制订，就有关方面的教学内容做出规范，如语法大纲、句型大纲、词汇大纲、情景大纲、功能大纲、意念大纲等。"],"q":"教学大纲是根据教学计划、以纲要形式制定的、对具体课程的教学目的、教学内容、教学进度和教学方法进行规范的指导性文件。","w":"high","e":["2021 真题"]},{"t":"教学内容","y":"名词解释","p":["第二语言教学是为了培养语言交际能力，这一教学目的决定了教学内容。","从语言能力和语言交际能力的构成因素出发，吕必松曾提出语言教学的教学内容应包括“语言要素、语用规则、言语技能、言语交际技能和相关文化知识”。","这样，对外汉语教学内容可以概括为四个方面：(1)语言要素(汉语语音、词汇、语法、汉字)；(2)言语技能(汉语听、说、读、写)；(3)言语交际技能(汉语语用规则、话语规则、交际策略)；(4)相关文化知识(汉语的文化因素、中国基本国情和文化背景知识)。","语言要素、言语技能、言语交际技能和相关文化知识就构成了语言交际能力的基础。"],"q":"第二语言教学是为了培养语言交际能力，这一教学目的决定了教学内容。","w":"high","e":["2020 真题"]},{"t":"对外汉语教学目的","y":"名词解释","p":["对外汉语教学的教学目的应归纳为：掌握汉语基础知识和听说读写基本技能，培养运用汉语进行交际的能力；增强学习汉语的兴趣和动力，发展智力，培养汉语的自学能力；掌握汉语的文化因素，熟悉基本的中国国情和文化背景知识，提高文化素养。","不同的学习阶段、不同学习期限在要求上应有所区别，但都应从这三方面来考虑教学目的。","掌握汉语基础知识和听说读写基本技能，培养运用汉语进行交际的能力，这是最直接、最根本的教学目的，体现了语言教学的根本任务。","语言交际能力包括语法(语言)能力、社会语言能力、话语能力和策略能力，因此要培养语言交际能力必须掌握汉语的基础知识和听说读写基本技能，以及语用规则和相关的文化知识。"],"q":"对外汉语教学的教学目的应归纳为：掌握汉语基础知识和听说读写基本技能，培养运用汉语进行交际的能力；增强学习汉语的兴趣和动力，发展智力，培养汉语的自学能力；掌握汉语的文化因素，熟悉基本的中国国情和文化背景知识，提高文化素养。","w":"high","e":["2020 真题","2021 真题"]},{"t":"课程设计","y":"名词解释","p":["课程设计，简单说来就是制定课程。","课程设计是在教育目的和具体教学目的的指导下，从学习者的特点和需要出发，根据专业对知识结构和能力结构的要求，最优化地选择教学内容、组织教学进程，形成合理的、相互配合的课程体系。","课程设计不能只考虑教学内容一个方面，它涉及到对教学需求和教学条件的分析、课程与大纲设计理论的选择、教学目标、教学内容、教学进度、教学方法、教学评估和教学管理等多方面问题的确定，直到课程计划和教学大纲的制订。"],"q":"课程设计，简单说来就是制定课程。","w":"normal","e":["核心概念"]},{"t":"【原文】以上就对外汉语教材编写的","y":"教材原文","p":["以上就对外汉语教材编写的前两个时期(1993年以前)出版的部分有影响、有特色的教材做了简单的介绍","限于篇幅，还有不少好教材没有提到","正是由于上述教材和其他一些优秀教材在不同方面所做的成功探索，为我国对外汉语教材建设做出了贡献，也为今后的教材编写积累了宝贵的经验，并在一定程度上预示了新时期教材的编写方向","同时我们也应看到，对外汉语教材在编写的理论和实践方面仍存在不少问题"],"q":"以上就对外汉语教材编写的前两个时期(1993年以前)出版的部分有影响、有特色的教材做了简单的介绍。 限于篇幅，还有不少好教材没有提到。正是由于上述教材和其他一些优秀教材在不同方面所做的成功探索，为我国对外汉语教材建设做出了贡献，也为今后的教材编写积累了宝贵的经验，并在一定程度上预示了新时期教材的编写方向。同时我们也应看到，对外汉语教材在编写的理论和实践方面仍","w":"normal","e":["原书正文"]},{"t":"【原文】1. 教材的质量和品种都","y":"教材原文","p":["1. 教材的质量和品种都不能很好地满足教学的需要就质量而言，教材雷同和粗制滥造的现象比较严重","在出版的数以百计的教材中，有创意的、为人们所选用的好教材只占一小部分，不少教材特别是零起点的教材在构思、体例、选用的语料方面都"],"q":"1. 教材的质量和品种都不能很好地满足教学的需要就质量而言，教材雷同和粗制滥造的现象比较严重。在出版的数以百计的教材中，有创意的、为人们所选用的好教材只占一小部分，不少教材特别是零起点的教材在构思、体例、选用的语料方面都","w":"normal","e":["原书正文"]},{"t":"【原文】是大同小异，看不出有什么","y":"教材原文","p":["是大同小异，看不出有什么新意，甚至看不出为什么要编这套教材","显然，这类教材在编写前的设计、论证中缺乏明确的编写目标，更没有在理论和实践上的新探索，甚至缺少对已有教材的认真研究","仅仅为了某种具体的目的就轻易动手，把教材编写这一复杂而细致的工程看得非常简单容易","这样产生的教材只能是低水平的重复，很难为人们所重视，有时甚至连编者自己都未必用，在书库堆积成山(值得注意的是这种现象在我国语文教学界和外语教学界似乎都没有出现过)"],"q":"是大同小异，看不出有什么新意，甚至看不出为什么要编这套教材。显然，这类教材在编写前的设计、论证中缺乏明确的编写目标，更没有在理论和实践上的新探索，甚至缺少对已有教材的认真研究。仅仅为了某种具体的目的就轻易动手，把教材编写这一复杂而细致的工程看得非常简单容易。这样产生的教材只能是低水平的重复，很难为人们所重视，有时甚至连编者自己都未必用，在书库堆积成山(值得注","w":"normal","e":["原书正文"]},{"t":"【原文】就品种而言，对外汉语教材","y":"教材原文","p":["就品种而言，对外汉语教材的品种仍十分单调，不能很好地满足多方面的学习汉语的需要","数以百计的教材大都是初级教材和口语教材，中高级教材十分缺乏","为成人特别是大学生编写的教材很多，而为中小学生编写的教材极少","为零起点学习者编写的教材很多，而为非真正零起点者(faulse beginners)，也就是为有一定家庭汉语环境的海外华裔子女、甚至其第一语言就是汉语的新移民子女编写的教材则更少"],"q":"就品种而言，对外汉语教材的品种仍十分单调，不能很好地满足多方面的学习汉语的需要。数以百计的教材大都是初级教材和口语教材，中高级教材十分缺乏；为成人特别是大学生编写的教材很多，而为中小学生编写的教材极少；为零起点学习者编写的教材很多，而为非真正零起点者(faulse beginners)，也就是为有一定家庭汉语环境的海外华裔子女、甚至其第一语言就是汉语的新移民","w":"normal","e":["原书正文"]},{"t":"【原文】2. 缺乏基础研究，影响","y":"教材原文","p":["2. 缺乏基础研究，影响到教材的科学性相当长一段时期里，我们很多教材都是在没有词汇、语法、汉字大纲，没有功能意念大纲以及文化大纲的情况下编写的，这是历史的局限性造成的","今天这些大纲正在研制中，有的已经初步完成，但尚不够成熟","上述基础研究的不足，必然影响到教材的科学性","以我们最擅长的语法结构部分而论，现有的教材基本上沿袭了50年代开始形成的对外汉语教学语法体系"],"q":"2. 缺乏基础研究，影响到教材的科学性相当长一段时期里，我们很多教材都是在没有词汇、语法、汉字大纲，没有功能意念大纲以及文化大纲的情况下编写的，这是历史的局限性造成的。今天这些大纲正在研制中，有的已经初步完成，但尚不够成熟。上述基础研究的不足，必然影响到教材的科学性。以我们最擅长的语法结构部分而论，现有的教材基本上沿袭了50年代开始形成的对外汉语教学语法体系","w":"normal","e":["原书正文"]},{"t":"【原文】也未能落实。汉字教学的研","y":"教材原文","p":["汉字教学的研究长期以来一直未受重视","反映在教材中，除了一个汉字笔顺表外，我们没有想出更多的办法来解决大多数外国学习者最感困难的汉字认、写问题","现在客观形势已要求我们要加快对汉字学习规律的研究","对语言教学中功能系统和文化系统的研究更为时尚短，认识也还是初步的"],"q":"也未能落实。汉字教学的研究长期以来一直未受重视。反映在教材中，除了一个汉字笔顺表外，我们没有想出更多的办法来解决大多数外国学习者最感困难的汉字认、写问题。现在客观形势已要求我们要加快对汉字学习规律的研究。对语言教学中功能系统和文化系统的研究更为时尚短，认识也还是初步的。","w":"normal","e":["原书正文"]},{"t":"【原文】3.教学法的大胆探索不够","y":"教材原文","p":["3.教学法的大胆探索不够，教材缺乏多样化每种教材都是以一定的教学法为依据，教材是教学法的具体体现","近２０年来我们在教学法的改革探索方面下的功夫不够","教学模式非常单一，也就导致教材编写路子的单一化","比如我们认同了结构与功能相结合的编写原则，在两者如何结合的问题上又比较倾向于“结构为主”的路子，因而80~90年代编写的“两结合”初级汉语教材，除了个别情况外，几乎都是清一色的“结构一功能”型"],"q":"3.教学法的大胆探索不够，教材缺乏多样化每种教材都是以一定的教学法为依据，教材是教学法的具体体现。近２０年来我们在教学法的改革探索方面下的功夫不够。教学模式非常单一，也就导致教材编写路子的单一化。 比如我们认同了结构与功能相结合的编写原则，在两者如何结合的问题上又比较倾向于“结构为主”的路子，因而80~90年代编写的“两结合”初级汉语教材，除了个别情况外，几","w":"normal","e":["原书正文"]},{"t":"【原文】4. 利用现代化教学技术","y":"教材原文","p":["4. 利用现代化教学技术手段不够我们大部分教材仍是以一本书、一支粉笔为教学手段，甚至连学生用书和教师用书(教师手册)都未能配备齐全","在充分利用音、像特别是电脑、多媒体技术方面，更远远落在其他第二语言教学的后边"],"q":"4. 利用现代化教学技术手段不够我们大部分教材仍是以一本书、一支粉笔为教学手段，甚至连学生用书和教师用书(教师手册)都未能配备齐全。在充分利用音、像特别是电脑、多媒体技术方面，更远远落在其他第二语言教学的后边。","w":"normal","e":["原书正文"]}]},{"id":"yinlun-c08-s02","t":"第二节 对外汉语教学的基本教学原则","w":"high","n":13,"k":[{"t":"教学原则","y":"名词解释","p":["第二语言教学原则是人们从一定的教育和教学目的出发，在第二语言教学实践基础上、根据对语言规律、语言学习规律和语言教学规律的认识而制订的指导整个教学过程和全部教学活动的原则。","科学的教学原则反映了人们对语言教学客观规律全面、正确的认识，成为教学活动必须遵循的基本要求，用来处理教学活动中各种矛盾和关系。","因此，教学原则是教学法体系的灵魂。上一章所介绍的各种教学法流派，其差别和争论也主要体现在教学原则上。","对外汉语教学原则不是凭空确定的，而是理论与实践相结合的产物。"],"q":"第二语言教学原则是人们从一定的教育和教学目的出发，在第二语言教学实践基础上、根据对语言规律、语言学习规律和语言教学规律的认识而制订的指导整个教学过程和全部教学活动的原则。","w":"high","e":["2020 真题"]},{"t":"精讲多练","y":"名词解释","p":["“精讲多练”是60年代初北京语言学院教师总结出的一条对外汉语课堂教学原则。","“精讲”是对教师的知识讲授而言，适当的理论知识和语言规则的介绍，对成人学习第二语言是必不可少的；练习也必须是在理论和知识指导下进行。","知识不能不讲但要讲得少而精；讲解的方法，我们提倡归纳法，但也不排除演绎法。","“多练”是指学生在课上、课下要进行大量的练习，培养语言运用的熟巧度。练习方法，我们提倡综合性、交际性的练习，但也需要单项练习。","“精讲多练”体现了我们长期以来主张的“实践性”原则。"],"q":"“精讲多练”是60年代初北京语言学院教师总结出的一条对外汉语课堂教学原则。","w":"high","e":["2019 真题"]},{"t":"结构、功能、文化相结合原则","y":"名词解释","p":["这是近年来我国学者根据从事对外汉语教学的经验，总结、研究得出的一条教学原则。","“结构”是指语言的结构，包括语法结构和语义结构；“功能”指用语言做事，即语言在一定的情景中所能完成的交际任务；“文化”也是指语言教学范围里的文化，主要是在跨文化交际中由于文化差异而影响到交际的语言文化因素以及目的语国家的基本国情和文化背景知识。","结构与功能这对矛盾既是对立的，又是相互依存的。结构是用来表达功能的，功能离开了结构也就无法实现，在语言交际中两者是紧密结合在一起的。","结构、功能、文化“三结合”的意思是：(1)结构是基础；(2)功能是目的；(3)文化教学要为语言教学服务。"],"q":"这是近年来我国学者根据从事对外汉语教学的经验，总结、研究得出的一条教学原则。","w":"high","e":["2020 真题","2021 真题"]},{"t":"以学生为中心、教师为主导原则","y":"名词解释","p":["这条原则是针对教与学的关系而提出的，是一条根本的原则。","强调学生是学习活动的主体，“教”只有通过“学”才能起到作用；“教”必须为“学”服务。","这条原则主要体现在：(1)从学生的特点和需要出发，制订课程计划、教学大纲并确定教学内容、教材和教学方法；(2)研究学生的个体差异，因材施教；(3)课堂要营造轻松愉快的气氛，加强趣味性；(4)让学生参与设计教学活动；(5)对待学生的偏误应采取严格纠正的态度，但纠错要根据其性质和发生的场合区别对待。"],"q":"这条原则是针对教与学的关系而提出的，是一条根本的原则。","w":"high","e":["2019 真题","2021 真题"]},{"t":"强化汉语学习环境原则","y":"名词解释","p":["强化汉语学习环境，加大汉语输入，自觉学习与自然习得相结合，是对外汉语教学的基本教学原则之一。","语言交际能力不是仅仅靠课堂教学就能培养成的。语言环境的有无与好坏，学习者对目的语的接触面及目的语的输入量的多与少，都会直接影响到语言学习的效果。","尽管对克拉申学习与习得的区分有不同的看法，但这一假说以及自然法、暗示法等教学法的经验，对我们还是有很大启示。","在正规、自觉的课堂学习为主的情况下，自觉学习和自然习得相结合，以利于培养交际能力。"],"q":"强化汉语学习环境，加大汉语输入，自觉学习与自然习得相结合，是对外汉语教学的基本教学原则之一。","w":"normal","e":["核心概念"]},{"t":"【原文】2. 课堂组织管理课堂教","y":"教材原文","p":["2. 课堂组织管理课堂教学成功与否关键在于如何处理好以学生为中心和以教师为主导的辩证关系","我们既反对教师主宰一切、学生被动接受灌输的教学模式","也不主张反其道面行之，由学生决定一切、教师盲目跟"],"q":"2. 课堂组织管理课堂教学成功与否关键在于如何处理好以学生为中心和以教师为主导的辩证关系。我们既反对教师主宰一切、学生被动接受灌输的教学模式；也不主张反其道面行之，由学生决定一切、教师盲目跟","w":"normal","e":["原书正文"]},{"t":"【原文】随学生的极端做法","y":"教材原文","p":["随学生的极端做法","只有在教师很好地起到组织管理的主导作用的情况下，才能更有利于发挥学生的主动性和积极性，使课堂既生动活泼又井然有序"],"q":"随学生的极端做法。 只有在教师很好地起到组织管理的主导作用的情况下，才能更有利于发挥学生的主动性和积极性，使课堂既生动活泼又井然有序。","w":"normal","e":["原书正文"]},{"t":"【原文】(1) 排除心理障碍，创","y":"教材原文","p":["(1) 排除心理障碍，创造生动活泼的课堂气氛","语言教学中可能出现的畏难情绪、厌烦情绪或是抑制、焦虑、自信心不足等情感屏障，都是影响学习的心理障碍","要克服消极心理、激发学习者的学习动力，轻松活泼、愉快热烈的课堂气氛是必不可少的","每节课中虽然不应刻意追求，但有几次笑声以活跃课堂气氛还是很必要的"],"q":"(1) 排除心理障碍，创造生动活泼的课堂气氛。语言教学中可能出现的畏难情绪、厌烦情绪或是抑制、焦虑、自信心不足等情感屏障，都是影响学习的心理障碍。要克服消极心理、激发学习者的学习动力，轻松活泼、愉快热烈的课堂气氛是必不可少的。每节课中虽然不应刻意追求，但有几次笑声以活跃课堂气氛还是很必要的。 良好的课堂气氛的形成，除了教学内容和步骤的精心安排给学习者以安全感","w":"normal","e":["原书正文"]},{"t":"【原文】(2)集中学生的注意力，","y":"教材原文","p":["(2)集中学生的注意力，自始至终驾驭课堂","在一两节课长达50~100分钟的时间里，如何集中学生的注意力，按教案的设计顺利完成各个环节，这是课堂教学的又一个重要问题","集中学生注意力的实质，是主导课堂教学的教师能自始至终掌握全场，成为学生注意的中心","这井不意味着教师从头至尾站在讲台正中滔滔不绝地讲授，而是指即使在以学生活动为主或几个小组同时展开活动的环节，教师仍应成为全课堂注意的中心"],"q":"(2)集中学生的注意力，自始至终驾驭课堂。在一两节课长达50~100分钟的时间里，如何集中学生的注意力，按教案的设计顺利完成各个环节，这是课堂教学的又一个重要问题。集中学生注意力的实质，是主导课堂教学的教师能自始至终掌握全场，成为学生注意的中心。这井不意味着教师从头至尾站在讲台正中滔滔不绝地讲授，而是指即使在以学生活动为主或几个小组同时展开活动的环节，教师仍","w":"normal","e":["原书正文"]},{"t":"【原文】要集中学生的注意力，除了","y":"教材原文","p":["要集中学生的注意力，除了教学内容实用、生动、有趣、程度适宜外，还要注意教学环节安排的张弛起伏、引人人胜","教师自己要全神贯注而不能漫不经心，为此应离开教案甚至能背诵(不太长的)课文内容，这样就能抛开剧本，投人角色","教师的语言和表情动作要有感染力","与学生交流要普遍而不能表现出好恶，更不能留有“死角”"],"q":"要集中学生的注意力，除了教学内容实用、生动、有趣、程度适宜外，还要注意教学环节安排的张弛起伏、引人人胜。教师自己要全神贯注而不能漫不经心，为此应离开教案甚至能背诵(不太长的)课文内容，这样就能抛开剧本，投人角色。教师的语言和表情动作要有感染力。 与学生交流要普遍而不能表现出好恶，更不能留有“死角”。 有的学者提出“表演教学法，”即教师和学生都充当一定的角色，","w":"normal","e":["原书正文"]},{"t":"【原文】(3)稳定课堂秩序","y":"教材原文","p":["(3)稳定课堂秩序","就--般情况而言，对外汉语教学课堂上出现学生破坏纪律的现象较少，但交头接耳、思想开小差、做其他事情、学生之何发生争执或者疲倦打瞌睡等现象倒时有发生","在这种情况下，教师应负起稳定课堂秩序的责任，除了比较严重的秩序混乱不得不正面指出外，为了维护课堂的和谐气氛，应更多地采取突然提问的办法","最经常发生又难于解决的问题还是迟到和缺课"],"q":"(3)稳定课堂秩序。就--般情况而言，对外汉语教学课堂上出现学生破坏纪律的现象较少，但交头接耳、思想开小差、做其他事情、学生之何发生争执或者疲倦打瞌睡等现象倒时有发生。在这种情况下，教师应负起稳定课堂秩序的责任，除了比较严重的秩序混乱不得不正面指出外，为了维护课堂的和谐气氛，应更多地采取突然提问的办法。最经常发生又难于解决的问题还是迟到和缺课。这种现象比较普","w":"normal","e":["原书正文"]},{"t":"【原文】说来，迟到缺席的现象会随","y":"教材原文","p":["说来，迟到缺席的现象会随着学习的进展而逐步解决","但对个别完全由于主观不努力、教育无效的学生，则应当按学生管理办法严肃处理"],"q":"说来，迟到缺席的现象会随着学习的进展而逐步解决；但对个别完全由于主观不努力、教育无效的学生，则应当按学生管理办法严肃处理。","w":"normal","e":["原书正文"]},{"t":"【原文】3.教师的语言这里的“教","y":"教材原文","p":["3.教师的语言这里的“教师的语言”(teacher talk)是一个特定的概念，是指第二语言教师为了达到交际的目的，对该语言的非母语学习者在课堂教学和课外交往中有意识使用的目的语系统的变体","正因为它是教师主要在课堂中使用的语言，因此关系到能否成功地执行教学计划，同时也成为学生(特别是在非目的语环境中学习)所能获得的可理解输入的主要来源，直接影响到他们的目的语习得","对教师语言的研究，也是对学习者语言输入研究和第二语言习得过程研究的重要内容，同时正如对“保姆式语言”（care-take r speech）、“对外国入讲话的语言”(foreign talk)一样，已成为跨文化语言交际的专门研究课题"],"q":"3.教师的语言这里的“教师的语言”(teacher talk)是一个特定的概念，是指第二语言教师为了达到交际的目的，对该语言的非母语学习者在课堂教学和课外交往中有意识使用的目的语系统的变体。正因为它是教师主要在课堂中使用的语言，因此关系到能否成功地执行教学计划，同时也成为学生(特别是在非目的语环境中学习)所能获得的可理解输入的主要来源，直接影响到他们的目的语","w":"normal","e":["原书正文"]}]},{"id":"yinlun-c08-s03","t":"第三节 对外汉语教材的编写与选用","w":"high","n":21,"k":[{"t":"教材","y":"名词解释","p":["教材是教师教学和学生学习所依据的材料，与教学计划和教学大纲构成学校教学内容的有机组成部分。","在教学活动的四大环节中，教材占有很重要的地位。它是总体设计的具体体现，反映了培养目标、教学要求、教学内容、教学原则；同时教材又是课堂教学和测试的依据。","狭义的教材指教科书，广义的教材除了教科书外还包括教学参考书、讲义、讲授提纲、图表、各种教学音像资料等。","教材体现了语言教学最根本的两个方面：教什么和如何教。教材水平的高低不仅能反映教学理论和教学法研究的深度，而且在很大程度上决定教与学的效果。"],"q":"教材是教师教学和学生学习所依据的材料，与教学计划和教学大纲构成学校教学内容的有机组成部分。","w":"high","e":["2021 真题"]},{"t":"科学性","y":"名词解释","p":["科学性是对外汉语教材编写和选用的原则之一。","针对性、实用性以及趣味性、系统性也都属于科学性的范围。","科学性特别强调以下几点：(1)要教规范、通用的语言，我国规范、通用的汉语是普通话，规范、通用的标注音素读音的符号是《汉语拼音方案》，规范、通用的汉字是我国正式公布的简化字；(2)教材内容的组织要符合语言教学的规律；(3)对语言现象的解释要注意准确性，避免造成对学习者的误导；(4)教材内容要反映出学科理论研究的新水平，及时更换陈旧内容。"],"q":"科学性是对外汉语教材编写和选用的原则之一。","w":"high","e":["2020 真题"]},{"t":"汉语教科书","y":"名词解释","p":["新中国的第一部对外汉语教材《汉语教科书》(邓懿等编写)在经过较长时间的试用后于1958年正式出版。","这部教材比较典型地体现了我国结构法教材的特点：教学内容以语法为纲，以词汇、语法为中心，重视系统的语言知识的讲授(初期教学中曾用母语翻译)，采用演绎法通过大量的练习掌握语法知识。","与传统的语法翻译法不同的是，在重视语法知识系统性的同时又特别强调听说读写技能训练，这一点又明显受到听说法的影响。","这套教材的最大功绩在于把汉语作为第二语言的教学从汉语作为母语的教学中分离出来，从外国人学习汉语的实际出发，第一次提出了独具特色的对外汉语教学语法体系。"],"q":"新中国的第一部对外汉语教材《汉语教科书》(邓懿等编写)在经过较长时间的试用后于1958年正式出版。","w":"high","e":["2019 真题"]},{"t":"实用汉语课本","y":"名词解释","p":["1981～1982年，受教育部委托，专门为我国教师在国外进行汉语教学编写的基础汉语教材《实用汉语课本》第一、二册(北京语言学院刘珣、邓恩明、刘社会编著)由商务印书馆出版。","第一套贯彻结构、情景及功能相结合原则的教材是《实用汉语课本》。“从选材到练习内容和练习方式都经过精心设计，在贯彻交际性原则和加强文化知识的教学等方面进行了不少有益的创造，使对外汉语教材的编写原则和编写方法向前迈进了一步。”","该教材出版后，很快就得到国外汉语教学界的重视，1983年9月德国现代汉语讨论会发表的公报中认为这是“中国到现在为止最先进的对外汉语教材”。","1987年成为我国第一部获奖的对外汉语教材。出版20年来，该教材除了国内不少学校使用外，还行销五大洲，成为世界上使用最广的基础汉语教材之一。"],"q":"1981～1982年，受教育部委托，专门为我国教师在国外进行汉语教学编写的基础汉语教材《实用汉语课本》第一、二册(北京语言学院刘珣、邓恩明、刘社会编著)由商务印书馆出版。","w":"high","e":["2019 真题","2021 真题"]},{"t":"针对性","y":"名词解释","p":["针对性是教材编写和选用的原则之一。","教材要适合使用对象的特点。最基本的特点是，不同母语、母语文化背景与目的语、目的语文化对比所确定的教学重点不同。","针对性包括：(1)学习者的年龄、国别、文化程度特点；(2)学习者学习目的的不同；(3)学习者学习的起点不同，根据学习者原有的目的语水平分为初、中、高三级教材；(4)学习时限的不同。"],"q":"针对性是教材编写和选用的原则之一。","w":"normal","e":["核心概念"]},{"t":"实用性","y":"名词解释","p":["实用性是教材编写和选用的原则之一。","第二语言教材不同于语言学教材，主要用于培养语言技能和能力；语言知识要通过教学转化为技能，是为培养能力服务的。","实用性主要体现在：(1)教材内容要从学习者的需要出发，是学习者进行交际活动所必需的，是在生活中能马上应用的，要避免“教科书语言”和“教室语言”；(2)语言材料必须来源于生活、来源于现实，要有真实性；(3)要有利于贯彻精讲多练的原则；(4)要有利于开展交际活动，使教学过程交际化。"],"q":"实用性是教材编写和选用的原则之一。","w":"normal","e":["核心概念"]},{"t":"趣味性","y":"名词解释","p":["趣味性是对外汉语教材编写和选用的原则之一。","教材内容和形式生动有趣，能吸引学习者，使学习者产生学习兴趣和动力，让相对说来比较枯燥的语言学习过程变得轻松愉快。","趣味性主要体现在：(1)教材的趣味性与教材的实用性、交际性紧密相关；(2)教材内容要反映现实，是学习者所关注的话题；(3)教材内容要逐步加大文化内涵，多方面介绍目的语文化；(4)多样化是形成趣味性的重要因素。"],"q":"趣味性是对外汉语教材编写和选用的原则之一。","w":"normal","e":["核心概念"]},{"t":"系统性","y":"名词解释","p":["系统性是对外汉语教材编写和选用的原则之一。","首先是指教材内容在基本知识介绍和技能训练方面，也就是语音、词汇、语法、汉字等语言要素和听、说、读、写言语技能的安排方面，要平衡协调、有一定的章法。","学生用书、教师手册、练习本、单元试题各部分要分工合理，相互呼应。纵的方面，初级、中级、高级不同阶段教材要衔接；横的方面，综合技能课与听、说、读、写专项技能课教材要配合。还要考虑图片、幻灯、声、像、电脑辅助教材的提供。从而形成系列的、立体的教材体系。"],"q":"系统性是对外汉语教材编写和选用的原则之一。","w":"normal","e":["核心概念"]},{"t":"直线式","y":"名词解释","p":["直线式指教材的语法结构或话题内容排列的一种方式。","直线式安排就是将语法点或句型按难易排列，从第一课开始一课教一个或几个语法点，直到最后一课。除了在课文中重现外，同一语法点除个别因用法较复杂而分作连续几课介绍外，作为讲练的重点一般不会出现两次。","这种方法的缺点十分明显。编者企图一次就把某一语法点介绍清楚，并设想学了这一次，学习者就能基本掌握该语法点。这种一个问题一个问题依次解决的方式不符合语言学习的规律。直线式的另一个缺点是按难易程度安排语法点往往是主观的，而且与学生的实际需要脱节。"],"q":"直线式指教材的语法结构或话题内容排列的一种方式。","w":"normal","e":["核心概念"]},{"t":"螺旋式","y":"名词解释","p":["螺旋式是交际法主张的教材安排方式，也叫圆周式安排。","即将话题和句型结构根据交际需要并适当照顾难易度分成几个圈，每圈都将主要话题和句型结构出现一遍，而圈与圈之间又逐步加深难度，呈螺旋式上升或是同心圆扩大之势。","这样安排既能使学习者在较短的时间(一圈中)接触较多的话题和句型结构，便于及早地运用和交际，又能使同一话题和结构多次出现，反复巩固加深，符合认知规律和第二语言学习的特点。"],"q":"螺旋式是交际法主张的教材安排方式，也叫圆周式安排。","w":"normal","e":["核心概念"]},{"t":"结构法教材时期","y":"名词解释","p":["回顾半个世纪对外汉语教材发展的历史，我们已经走过了50年代到70年代的结构法教材时期，和80年代到90年代的结构与功能相结合教材时期，现在正跨入结构、功能、文化相结合时期。","结构法教材指以语言结构(语法)为纲的教材。对外汉语教学结构法教材强调理解和掌握语法规则，并在基本语法知识的指导下培养听说读写基本技能。","对外汉语教材从50年代至70年代经过30年的探索，总共出版约10部。尽管数量不算多，但由于每部教材都是精心制作，每一部都在前一部的基础上有所发展，使我们在编写结构法教材方面积累了较为丰富的经验，并达到了相当的水平。"],"q":"回顾半个世纪对外汉语教材发展的历史，我们已经走过了50年代到70年代的结构法教材时期，和80年代到90年代的结构与功能相结合教材时期，现在正跨入结构、功能、文化相结合时期。","w":"normal","e":["核心概念"]},{"t":"结构—功能型教材","y":"名词解释","p":["结构—功能型是教材按遵循的主要教学原则划分的一种类型。","结构与功能相结合，以结构安排为基础，同时考虑到结构所表达的功能，使结构应用于一定的功能。比较适合于初级阶段的第二语言学习。","这是80年代以来我国对外汉语教材编写的主要路子。目的是为了弥补纯结构型和纯功能型教材的不足，并吸取两者的优点。","但这类教材也未能很好地解决结构与功能的结合问题，容易让结构成为支配的因素，功能则成为附属，可有可无。"],"q":"结构—功能型是教材按遵循的主要教学原则划分的一种类型。","w":"normal","e":["核心概念"]},{"t":"试述对外汉语教材的重要作用。","y":"名词解释","p":["教材是教师教学和学生学习所依据的材料，与教学计划和教学大纲构成学校教学内容的有机组成部分。","教材是总体设计的具体体现，同时又是课堂教学和测试的依据，在第二语言教学中起着纽带的重要作用。","教材体现了语言教学最根本的两个方面：教什么和如何教。","教材水平的高低在很大程度上决定教与学的效果。","教材在学科发展中也发挥着特殊作用，是教学理论研究和学科发展的前沿阵地和突破口。"],"q":"教材是教师教学和学生学习所依据的材料，与教学计划和教学大纲构成学校教学内容的有机组成部分。在教学活动的四大环节中，教材占有很重要的地位。它是总体设计的具体体现，反映了培养目标、教学要求、教学内容、教学原则；同时教材又是课堂教学和测试的依据。因此，在第二语言教学中教材起着纽带的重要作用。教材体现了语言","w":"normal","e":["核心概念"]},{"t":"【原文】(6)加强词汇的重现与复","y":"教材原文","p":["(6)加强词汇的重现与复习，减少遗忘","语音、语法都需要重现才能不断巩固","词汇由于数量太大，更需要加强重视","一般说来，新词至少需要6~8次重现，才能初步掌握"],"q":"(6)加强词汇的重现与复习，减少遗忘。语音、语法都需要重现才能不断巩固。词汇由于数量太大，更需要加强重视。一般说来，新词至少需要6~8次重现，才能初步掌握。结构主义教材和读物，新词要平均出现30~40次。根据心理学对遗忘的研究(第四章)，在词汇教学中应注意每个生词的首次感知。从展示单词开始就用直观、形象的教学方法集中学习者的注意力，给学生留下深刻的印象。考虑","w":"normal","e":["原书正文"]},{"t":"【原文】讲授新词时还应注意以旧带","y":"教材原文","p":["讲授新词时还应注意以旧带新","这样采用多种多样的复习方式"],"q":"讲授新词时还应注意以旧带新。这样采用多种多样的复习方式。","w":"normal","e":["原书正文"]},{"t":"【原文】(1)直接法","y":"教材原文","p":["表示具体意义的词语(指事物或动作)，常用直观法，便于声音与概念直接联系","无法直接用实物展示的，也应尽量用目的语直接进行描述或解释","如用已学过的“互相”、“帮助”来解释“互助”"],"q":"(1)直接法。表示具体意义的词语(指事物或动作)，常用直观法，便于声音与概念直接联系。无法直接用实物展示的，也应尽量用目的语直接进行描述或解释。 如用已学过的“互相”、“帮助”来解释“互助”。","w":"normal","e":["原书正文"]},{"t":"【原文】(2)翻译法","y":"教材原文","p":["在用目的语难以解释的情况下，若母语与目的语的词对应明显，可以通过母语翻译，一点就通，免得绕圈子","但要注意两种语言词汇的义项很少是一对一的，完全的“等价词”是不多的，词义范围大小常常不同，最好的翻译也只是近似的","要避免误导还需要联系大量的例句"],"q":"(2)翻译法。在用目的语难以解释的情况下，若母语与目的语的词对应明显，可以通过母语翻译，一点就通，免得绕圈子。 但要注意两种语言词汇的义项很少是一对一的，完全的“等价词”是不多的，词义范围大小常常不同，最好的翻译也只是近似的。要避免误导还需要联系大量的例句。","w":"normal","e":["原书正文"]},{"t":"【原文】(3) 情景法","y":"教材原文","p":["把新词放在语境中，也就是联系句子、话语和一定的社会文化背景来理解","如要区别“家”的两个含义，可以用问答来解释清楚：“你家有几口人?”(指家庭)，“你今天回家吗?”(指家庭住处)"],"q":"(3) 情景法。把新词放在语境中，也就是联系句子、话语和一定的社会文化背景来理解。 如要区别“家”的两个含义，可以用问答来解释清楚：“你家有几口人?”(指家庭)，“你今天回家吗?”(指家庭住处)。","w":"normal","e":["原书正文"]},{"t":"【原文】(4)语素义法","y":"教材原文","p":["前边已经提到，利用汉语构词法的特点，用语素义解释词义，把学习者的注意力从词引到语素上来"],"q":"(4)语素义法。前边已经提到，利用汉语构词法的特点，用语素义解释词义，把学习者的注意力从词引到语素上来。","w":"normal","e":["原书正文"]},{"t":"【原文】(5)搭配法","y":"教材原文","p":["通过词与词的搭配来理解词义并学会正确使用","有的词用法很难记，也说不出太多的道理，如量词与名词的关系、某些动词与宾语的关系，直接采用名量搭配、动宾搭配较易于掌握"],"q":"(5)搭配法。通过词与词的搭配来理解词义并学会正确使用。有的词用法很难记，也说不出太多的道理，如量词与名词的关系、某些动词与宾语的关系，直接采用名量搭配、动宾搭配较易于掌握。","w":"normal","e":["原书正文"]},{"t":"【原文】(6)话语联结法","y":"教材原文","p":["(6)话语联结法","指在话语中学习词汇，特别是关联词语的用法，宜于在话语中掌握"],"q":"(6)话语联结法。指在话语中学习词汇，特别是关联词语的用法，宜于在话语中掌握。","w":"normal","e":["原书正文"]}]}]},{"id":"yinlun-c09","t":"第九章 对外汉语教学理论与应用(下)","w":"high","s":[{"id":"yinlun-c09-s01","t":"第一节 对外汉语教学过程与课堂教学","w":"high","n":14,"k":[{"t":"课堂教学","y":"名词解释","p":["课堂教学是指教师根据教学大纲规定的目的、任务和教材，运用恰当的教学方法，在规定的时间内对固定班级的学生进行某门课程教学的形式。","在学校教育中，课堂是实施教学的主要场所。对外汉语课堂教学是对外汉语教学的基本组织形式，集中地体现了对外汉语教学过程。","教学过程的感知、理解、巩固、运用阶段主要在课堂教学中完成。实施教学计划，贯彻教学原则，运用教学方法，完成课程教学并实现教学目标，主要都是靠课堂教学。","在教学活动的四大环节中，课堂教学是中心环节。要提高教学效果，就要提高课堂教学质量。"],"q":"课堂教学是指教师根据教学大纲规定的目的、任务和教材，运用恰当的教学方法，在规定的时间内对固定班级的学生进行某门课程教学的形式。","w":"high","e":["2019 真题"]},{"t":"教师的语言","y":"名词解释","p":["这里的“教师的语言”(teacher talk)是一个特定的概念，是指第二语言教师为了达到交际的目的，对该语言的非母语学习者在课堂教学和课外交往中有意识使用的目的语系统的变体。","正因为它是教师主要在课堂中使用的语言，因此关系到能否成功地执行教学计划，同时也成为学生(特别是在非目的语环境中学习)所能获得的可理解输入的主要来源，直接影响到他们的目的语习得。","总的说来有三大特点：一是慢，放慢语速，增加停顿；二是简化，使用简单的词汇、句子；三是详细化，输入更多信息包括多余信息，采用重复、释义、迂回的办法，目的是为了便于学习者理解，成为可理解的输入。","教师的语言对学习者有示范和引导作用，推动其中介语向目的语靠拢，因此必须是规范的。"],"q":"这里的“教师的语言”(teacher talk)是一个特定的概念，是指第二语言教师为了达到交际的目的，对该语言的非母语学习者在课堂教学和课外交往中有意识使用的目的语系统的变体。","w":"high","e":["2020 真题"]},{"t":"对外汉语教学过程","y":"名词解释","p":["对外汉语教学过程是根据教学计划和教学大纲的规定，教师和学生共同参与的对外汉语教学活动的过程，也是实施教学、全面完成教学任务的过程。","在这一过程中，学习者在教师的指导和帮助下，逐步培养运用汉语进行交际的能力，对中国文化的了解得以加深，文化素养得到进一步提高，同时其智力也得到发展，从而实现教育的总目的。","教学过程的实质是学习者对目的语和目的语文化的认识过程，是学习者感觉、知觉、记忆、想像、思维、情感等一系列心理活动的过程。在这一过程中，教师和学生是教学活动的两主体。","对外汉语教学过程主要通过课堂教学和课外活动来实现。课堂教学是对外汉语教学的基本组织形式，课外活动是辅助形式。"],"q":"对外汉语教学过程是根据教学计划和教学大纲的规定，教师和学生共同参与的对外汉语教学活动的过程，也是实施教学、全面完成教学任务的过程。","w":"high","e":["2019 真题"]},{"t":"课堂教学的主要环节","y":"名词解释","p":["课堂教学的主要环节，以教学过程的感知、理解、巩固、运用四个阶段为基础。","这里仅就一般语言课的教学提出五个主要环节，即组织教学、复习检查、讲练新内容、巩固新内容和布置课外作业。","组织教学的目的是稳定学生的情绪，集中学生的注意力，创造有利于学习的和谐气氛。复习检查的目的是了解学生对已学内容的掌握情况，获得反馈，发现并弥补教学中的缺陷。讲练新内容是课堂教学中的重点环节。巩固新内容与新内容讲练紧密相连。布置课外作业用以巩固课堂所学内容、督促学生及时复习旧课和预习新课。"],"q":"课堂教学的主要环节，以教学过程的感知、理解、巩固、运用四个阶段为基础。","w":"high","e":["2020 真题"]},{"t":"教学过程的四个基本阶段","y":"名词解释","p":["从第二语言教学特点出发，对外汉语教学过程分为四个基本阶段，即感知阶段、理解阶段、巩固阶段和运用阶段。","感知阶段的特点是，感性的语言材料通过视、听、读等途径被学生感知，进入大脑形成表象。","理解阶段的特点是，从感知的表象中进一步认识事物的内部结构和内在联系，是从感性认识发展到理性认识的阶段，也是识记、特别是有意义的识记的完成和记忆保持的开始。","巩固阶段是从理论到实践的阶段，其特点是从识记、理解的大量语言材料中归纳出目的语的规则和用法，扩大、完善目的语的知识结构，并通过各种练习和交际实践，内化这些规则并形成言语技能。","运用阶段是指在真实的语言情境中进行的言语交际活动，也是记忆的再认阶段，是以培养学生创造力和想像力为特点的阶段。"],"q":"从第二语言教学特点出发，对外汉语教学过程分为四个基本阶段，即感知阶段、理解阶段、巩固阶段和运用阶段。","w":"high","e":["2020 真题"]},{"t":"板书","y":"名词解释","p":["板书是课堂教学的重要教学手段。除了帮助学生理解并记笔记外，还可以使课堂教学纲目清楚，更具条理性，也可以突出重点引起学生的注意。","对外汉语教学的板书，还有将听说技能训练与读写技能训练相联系、给学生提供更多的认读汉字和学习汉字机会的作用。","板书应当注意：(1)汉字一定要正确、规范，笔顺应与教材一致，字形要美观，至少要端正，给学生以示范的作用；(2)板书要很好地设计，黑板当中五分之三用于书写新课内容；(3)板书要鲜明、醒目，适当运用彩色粉笔突出重点。"],"q":"板书是课堂教学的重要教学手段。除了帮助学生理解并记笔记外，还可以使课堂教学纲目清楚，更具条理性，也可以突出重点引起学生的注意。","w":"normal","e":["核心概念"]},{"t":"【原文】(3)水平测试(prof","y":"教材原文","p":["(3)水平测试(proficiency tests)","水平测试又称能力测试","目的在于测量受试者现有的整体的语言实际运用能力，以评定是否达到胜任某项任务的要求","水平测试不考虑受试者的学历，也不以任何大纲、课程或教材为依据，而是根据语言交际能力的标准，或是某一特定任务的要求来命题"],"q":"(3)水平测试(proficiency tests)。水平测试又称能力测试。 目的在于测量受试者现有的整体的语言实际运用能力，以评定是否达到胜任某项任务的要求。水平测试不考虑受试者的学历，也不以任何大纲、课程或教材为依据，而是根据语言交际能力的标准，或是某一特定任务的要求来命题。这是一种回顾兼预示的测试。它具有较高的区分性，受试者的分数反映了他在全体受试者中","w":"normal","e":["原书正文"]},{"t":"【原文】(4)诊断测试(diag","y":"教材原文","p":["(4)诊断测试(diagnostic tests)","诊断测试是为了了解受试者在学习某一具体内容或在较短的一段学习时间里所存在的问题而进行的测试","目的是迅速直接地获得反馈信息，及时改进教学","这也是一种回顾兼预示性的测试，常常是与一具体的短期目标相联系"],"q":"(4)诊断测试(diagnostic tests)。诊断测试是为了了解受试者在学习某一具体内容或在较短的一段学习时间里所存在的问题而进行的测试。 目的是迅速直接地获得反馈信息，及时改进教学。 这也是一种回顾兼预示性的测试，常常是与一具体的短期目标相联系。学校中的小考、小测验都属于这一类。诊断测试是非正式的测试，命题、评分都比较灵活，一般也不用作衡量学生水平的","w":"normal","e":["原书正文"]},{"t":"【原文】从上述四种测试可以看出，","y":"教材原文","p":["从上述四种测试可以看出，不同的测试有不同的用途","水平测试很重要，但不能将学校的各种测试都向水平测试靠拢，更不能让水平测试指挥教学","对学校教学来说，成绩测试和诊断测试更具有直接意义"],"q":"从上述四种测试可以看出，不同的测试有不同的用途。水平测试很重要，但不能将学校的各种测试都向水平测试靠拢，更不能让水平测试指挥教学。对学校教学来说，成绩测试和诊断测试更具有直接意义。","w":"normal","e":["原书正文"]},{"t":"【原文】(1) 客观性测试(ob","y":"教材原文","p":["(1) 客观性测试(objective tests)","客观性测试的试题答案是固定的","评分是客观的，不受评卷人主观认识和个人兴趣的影响，不论是谁评分结果都一样，甚至可以用机器评分","多项选择题、正误判断题等都是客观性试题"],"q":"(1) 客观性测试(objective tests)。客观性测试的试题答案是固定的；评分是客观的，不受评卷人主观认识和个人兴趣的影响，不论是谁评分结果都一样，甚至可以用机器评分。 多项选择题、正误判断题等都是客观性试题。客观性测试测量的结果比较客观，分数可靠；试题覆盖面大，针对性较强，能进行多方面的考查；阅卷方便，适用于大规模考试。缺点是命题较难，而且只能测","w":"normal","e":["原书正文"]},{"t":"【原文】(2)主观性测试(sub","y":"教材原文","p":["(2)主观性测试(subjective tests)","主观性测试每个试题允许不止一个答案，评分在很大程度上取决于评卷者的主观判断，不同的评卷者由于认识的不同会得出不同的结论","问答、翻译、作文、口试等都属主观性试题","主观性测试更有深度，能测出受试者的表达技能、综合语言能力和运用语言进行交际的能力"],"q":"(2)主观性测试(subjective tests)。 主观性测试每个试题允许不止一个答案，评分在很大程度上取决于评卷者的主观判断，不同的评卷者由于认识的不同会得出不同的结论。 问答、翻译、作文、口试等都属主观性试题。主观性测试更有深度，能测出受试者的表达技能、综合语言能力和运用语言进行交际的能力。主观性测试命题比较容易，可以防止靠猜测得分和作弊。缺点是阅卷","w":"normal","e":["原书正文"]},{"t":"【原文】(1)分立式测试(dis","y":"教材原文","p":["(1)分立式测试(discrete-point tests)","分立式测试是对语言要素(语音、词汇、语法等)和言语技能(听、说、读、写)分别进行单项测试，如填空、完成句子、多项选择","其理论基础是结构主义语言学","认为语言是由各种成分组成的，掌握一种语言就是掌握这些成分和技能"],"q":"(1)分立式测试(discrete-point tests)。分立式测试是对语言要素(语音、词汇、语法等)和言语技能(听、说、读、写)分别进行单项测试，如填空、完成句子、多项选择。其理论基础是结构主义语言学。认为语言是由各种成分组成的，掌握一种语言就是掌握这些成分和技能。而这些成分和技能都可以分别进行单项测试，以确定受试者的总体语言能力。分立式试题的长处在于","w":"normal","e":["原书正文"]},{"t":"【原文】(2)综合性测试(int","y":"教材原文","p":["(2)综合性测试(integrative tests)","综合性测试是对语言知识和言语技能进行整体的综合性的测试，以测量受试者综合运用语言知识和言语技能的能力","综合性测试认为语言是个整体，人们在实际使用中不可能只运用某一方面的知识或一种技能，而是各种语言要素和言语技能综合运用","完形填充、阅读理解、听写等都是综合性试题"],"q":"(2)综合性测试(integrative tests)。综合性测试是对语言知识和言语技能进行整体的综合性的测试，以测量受试者综合运用语言知识和言语技能的能力。综合性测试认为语言是个整体，人们在实际使用中不可能只运用某一方面的知识或一种技能，而是各种语言要素和言语技能综合运用。完形填充、阅读理解、听写等都是综合性试题。","w":"normal","e":["原书正文"]},{"t":"【原文】(3)交际性测试(com","y":"教材原文","p":["(3)交际性测试(communicative tests)","交际性测试是测定受试者在实际生活中运用语言进行交际的能力","其理论基础是语言功能和语言交际理论，强调语言教学的目的是培养语言交际能力","交际性测试不仅具有更强的综合性，而且要全面考查在一定的社会情景中正确、得体地运用语言进行交际的能力"],"q":"(3)交际性测试(communicative tests)。交际性测试是测定受试者在实际生活中运用语言进行交际的能力。其理论基础是语言功能和语言交际理论，强调语言教学的目的是培养语言交际能力。交际性测试不仅具有更强的综合性，而且要全面考查在一定的社会情景中正确、得体地运用语言进行交际的能力。面谈、应用性写作都属于","w":"normal","e":["原书正文"]}]},{"id":"yinlun-c09-s02","t":"第二节 对外汉语语音、词汇、语法、汉字教学","w":"high","n":12,"k":[{"t":"语音教学","y":"名词解释","p":["对外汉语语音教学的任务是让学习者掌握汉语语音的基本知识和汉语普通话正确、流利的发音，为用口语进行交际打下基础。","语音是语言的物质外壳。语音的重要性决定了语音教学是第二语言教学的基础，是掌握听说读写技能和交际能力的前提。","语音教学原则主要有：(1)短期集中教学与长期严格要求相结合；(2)音素教学与语流教学相结合；(3)通过语音对比突出重点和难点；(4)声韵调结合教学，循序渐进；(5)听说结合，先听后说；(6)以模仿和练习为主、语音知识讲解为辅；(7)机械性练习与有意义练习相结合。"],"q":"对外汉语语音教学的任务是让学习者掌握汉语语音的基本知识和汉语普通话正确、流利的发音，为用口语进行交际打下基础。","w":"high","e":["2020 真题"]},{"t":"词汇教学","y":"名词解释","p":["对外汉语词汇教学的任务是根据教学大纲的要求，在有关汉语词汇知识的指导下，掌握一定数量的汉语词汇的音、义、形和基本用法，培养在语言交际中对词汇的正确理解和表达能力。","词汇是语言的建筑材料，是句子的基本结构单位。没有词汇就无法传递信息，也就无从交际。","词汇教学原则主要有：(1)要认真掌握每一个词语的具体意义和用法；(2)词的教学应与句子教学相结合，在一定的语境中掌握词汇；(3)利用词的聚合和组合关系在系统中学习词；(4)掌握汉语构词法，重视语素教学，词与字(语素)教学相结合；(5)不同的言语技能对词的掌握有不同的要求；(6)加强词汇的重现与复习，减少遗忘。"],"q":"对外汉语词汇教学的任务是根据教学大纲的要求，在有关汉语词汇知识的指导下，掌握一定数量的汉语词汇的音、义、形和基本用法，培养在语言交际中对词汇的正确理解和表达能力。","w":"high","e":["2019 真题"]},{"t":"语法教学","y":"名词解释","p":["语法教学是对目的语的词组、句子以及话语的组织规律的教学，用以指导言语技能训练并培养正确运用目的语进行交际的能力。","不掌握目的语遣词造句的规则，就难以正确理解和表达。语法教学一直处于第二语言教学的中心地位。","语法教学原则主要有：(1)通过语言对比突出语法的重点和难点；(2)从句型入手，句型操练与语法知识的归纳相结合；(3)由句子扩大到话语；(4)语法结构的教学与语义、语用和功能的教学相结合；(5)精讲多练，以练习为主；(6)先易后难、循序渐进地安排语法项目；(7)重视纠正学习者的语法错误，并把病错句的分析作为课堂教学内容的一个部分。"],"q":"语法教学是对目的语的词组、句子以及话语的组织规律的教学，用以指导言语技能训练并培养正确运用目的语进行交际的能力。","w":"high","e":["2020 真题","2021 真题"]},{"t":"汉字教学","y":"名词解释","p":["汉字是用来记录汉语的书写符号系统。","汉字教学的任务是，以汉字形、音、义的构成特点和规律为教学内容，帮助学习者获得认读和书写汉字的技能。汉字教学是汉语教学的重要组成部分，不掌握汉字就学不好汉语。汉字教学是汉语作为第二语言教学最显著的特点。","汉字又被认为是汉语学习最大的难点。这是由于由笔画组成的方块汉字是记录语素的语素文字，是与世界上大多数民族使用的、以记录音素的字母拼写的拼音文字根本不同的文字系统。","汉字教学原则主要有：(1)语和文先分后合，初期汉字应按自身规律独立教学；(2)强化汉字教学，字与词教学相结合；(3)把握汉字的构成规律和基本理论，利用汉字的表意和表音功能识记汉字；(4)按笔画、部件、整字三个层次，从笔画、笔顺、部件、间架结构四个方面进行汉字教学；(5)重视对比，加强复习，通过书写识记汉字。"],"q":"汉字是用来记录汉语的书写符号系统。","w":"high","e":["2020 真题"]},{"t":"【原文】(5)注意题内上下文之间","y":"教材原文","p":["(5)注意题内上下文之间的关系，避免给答题留暗示"],"q":"(5)注意题内上下文之间的关系，避免给答题留暗示。","w":"normal","e":["原书正文"]},{"t":"【原文】5. 作文多项选择题无法","y":"教材原文","p":["5. 作文多项选择题无法测量语言表达能力，综合填充虽然与语言表达能力非常相关，但毕竟不是直接表达","因此，传统的作文仍是不可替代的题型","作文能全面反映受试者的语言水平，反映其语法、词汇、标点符号运用水平和汉字书写水平以及成段表达能力(话语能力)","作文的致命弱点是阅卷费时、评分难免主观性，因此很多大规模标准化测试都不敢采用这一题型"],"q":"5. 作文多项选择题无法测量语言表达能力，综合填充虽然与语言表达能力非常相关，但毕竟不是直接表达。因此，传统的作文仍是不可替代的题型。作文能全面反映受试者的语言水平，反映其语法、词汇、标点符号运用水平和汉字书写水平以及成段表达能力(话语能力)。作文的致命弱点是阅卷费时、评分难免主观性，因此很多大规模标准化测试都不敢采用这一题型。 另一方面人们为解决这一问题已","w":"normal","e":["原书正文"]},{"t":"【原文】(1)将作文评阅标准细化","y":"教材原文","p":["(1)将作文评阅标准细化、量化","从文章论点、结构直到错别字、标点符号具体列出得分(扣分)标准","不同的阅卷者都要照章评分"],"q":"(1)将作文评阅标准细化、量化。从文章论点、结构直到错别字、标点符号具体列出得分(扣分)标准。标准愈细愈客观。不同的阅卷者都要照章评分。","w":"normal","e":["原书正文"]},{"t":"【原文】(2)多人集体评分","y":"教材原文","p":["(2)多人集体评分","同一篇文章由几个人阅卷，并经讨论或用平均分定分"],"q":"(2)多人集体评分。同一篇文章由几个人阅卷，并经讨论或用平均分定分。","w":"normal","e":["原书正文"]},{"t":"【原文】(3)流水评分","y":"教材原文","p":["每个阅卷人负责作文评阅的某一项，以保证该项掌握的标准一致，然后把多人评的各项分数相加就是总分"],"q":"(3)流水评分。每个阅卷人负责作文评阅的某一项，以保证该项掌握的标准一致，然后把多人评的各项分数相加就是总分。","w":"normal","e":["原书正文"]},{"t":"【原文】(4)比较评分","y":"教材原文","p":["不规定具体标准，而是单凭印象将文章进行比较","先分为三大等，然后每大等再细分为若干等","这期间还可以反复调整文章的等级","名次排定以后，以某一等为准，定为及格，其他各等依次评分"],"q":"(4)比较评分。不规定具体标准，而是单凭印象将文章进行比较。先分为三大等，然后每大等再细分为若干等。这期间还可以反复调整文章的等级。名次排定以后，以某一等为准，定为及格，其他各等依次评分。如经多个阅卷者讨论确定得分，则更为客观。","w":"normal","e":["原书正文"]},{"t":"【原文】6. 口试目前大多数水平","y":"教材原文","p":["6. 口试目前大多数水平测试都只是测量听、读的能力，较少测量写的能力","而测量说的能力，由于技术方面的原因，难于大规模进行","这是因为如采用而对面的人工考试方法过于费时费力，成千上万人的考试难以操作","用录音方式又很不自然，对受试者的心理有影响"],"q":"6. 口试目前大多数水平测试都只是测量听、读的能力，较少测量写的能力。而测量说的能力，由于技术方面的原因，难于大规模进行。这是因为如采用而对面的人工考试方法过于费时费力，成千上万人的考试难以操作。 用录音方式又很不自然，对受试者的心理有影响。 因此测量说的能力一直被排除在很多标准化考试之外。但口语表达能力是最直接、最重要的语言交际能力。不包括口语的水平测试，","w":"normal","e":["原书正文"]},{"t":"【原文】(1)准备(warm-u","y":"教材原文","p":["(1)准备(warm-up)","通过轻松的寒暄，营造愉快的气氛，使受试者情绪放松"],"q":"(1)准备(warm-up)。通过轻松的寒暄，营造愉快的气氛，使受试者情绪放松。","w":"normal","e":["原书正文"]}]},{"id":"yinlun-c09-s03","t":"第三节 语言测试","w":"high","n":23,"k":[{"t":"效度","y":"名词解释","p":["效度又称有效性，指测试的有效程度，即测试的内容和方法是否能测出预定要测量的东西。","效度又分为表面效度、内容效度、结构效度和经验效度(效标关联效度)。","表面效度指某个测验或考试从表面看来是否测了它旨在测量的东西，有没有缺漏的部分，有没有偏题怪题。","内容效度指测试的内容是否是应该考查的，是否反映了这项测试的要求，或者说试题所包含的内容代表性、准确度和覆盖面如何。","结构效度又称理论效度，指考试的结果在多大程度上符合我们根据某种理论做出的预测。","效标关联效度是指确定一种能反映测试效度的参照标准，然后考察某一考试与该标准之间的相关程度。"],"q":"效度又称有效性，指测试的有效程度，即测试的内容和方法是否能测出预定要测量的东西。","w":"high","e":["2020 真题"]},{"t":"信度","y":"名词解释","p":["信度又称可靠性，指测试结果的可靠程度或稳定性，也就是考试成绩是否反映了受试者的实际水平。","测量的工具要固定。松紧带不能用来作测量的尺子。语言测试是测量语言的工具，这把尺子也要固定。","一般从三个方面衡量测试的信度：(1)测试的稳定性(stability)，也称再测信度；(2)测试的等值性(equivalence)，也称为复本信度；(3)测试的内部一致性(internal consistency)，常用分半法。","影响信度的因素有：测试的题量、试题的同质性、试题的区分性、受试者水平的多样性、评分的客观性。"],"q":"信度又称可靠性，指测试结果的可靠程度或稳定性，也就是考试成绩是否反映了受试者的实际水平。","w":"high","e":["2021 真题"]},{"t":"语言测试","y":"名词解释","p":["语言测试是根据一定的评估目的，以抽样方式通过有限试题来诱导出受试者的言语行为，然后借助于定量描述来推断受试者掌握的该语言的知识和能力。","从心理学的角度来看，上述定义表明，测试的任务在于如何诱导出体现受试者语言知识和能力的言语行为，并对这种行为进行量化和说明解释。","语言测试具有间接性、片面性、主观性和偶然性四个特点。","测试是教育评估的主要手段，也是教学活动的主要环节之一。测试是第二语言教学四大环节的重要组成部分。"],"q":"语言测试是根据一定的评估目的，以抽样方式通过有限试题来诱导出受试者的言语行为，然后借助于定量描述来推断受试者掌握的该语言的知识和能力。","w":"high","e":["2020 真题","2021 真题"]},{"t":"水平测试","y":"名词解释","p":["水平测试又称能力测试，目的在于测量受试者现有的整体的语言实际运用能力，以评定是否达到胜任某项任务的要求。","水平测试不考虑受试者的学历，也不以任何大纲、课程或教材为依据，而是根据语言交际能力的标准，或是某一特定任务的要求来命题。这是一种回顾兼预示的测试。","水平测试具有较高的区分性，受试者的分数反映了他在全体受试者中的位置。水平测试常常是大规模标准化测试，如我国的汉语水平考试(HSK)、英语水平考试(EPT)，美国的托福考试，英国的剑桥英语水平考试等。"],"q":"水平测试又称能力测试，目的在于测量受试者现有的整体的语言实际运用能力，以评定是否达到胜任某项任务的要求。","w":"high","e":["2019 真题","2021 真题"]},{"t":"成绩测试","y":"名词解释","p":["成绩测试又称课程测试，是一门课程或课型的测试，目的是检查学习者在某一教学阶段是否掌握了教学大纲和教材所规定的教学内容，在学习上取得什么成果。","测试的内容以课程的教学大纲和教材为依据，教什么考什么。","这是一种回顾性的测试，目的在于了解学习者目前所达到的程度，是与一个较长期的目标相联系的。受试者获得的成绩是绝对的。","成绩测试是教学中用得最多的测试，学校的期中期末考试、毕业考试等都属于这一类。"],"q":"成绩测试又称课程测试，是一门课程或课型的测试，目的是检查学习者在某一教学阶段是否掌握了教学大纲和教材所规定的教学内容，在学习上取得什么成果。","w":"high","e":["2019 真题","2021 真题"]},{"t":"后效作用","y":"名词解释","p":["测试是用来检查教学效果的，但同时又不可避免地给教学以影响，这就是测试的后效作用。","特别是一些大型的、重要的考试，如升学考试，常常对教学起指挥棒的作用。为了使学习者能通过这类考试获得好的成绩，教学反而向测试看齐，甚至出现教学为考试服务的本末倒置现象。","好的测试符合教学规律，能给教学以正确的引导，对学生的学习起检查和督促的作用，产生积极的后效。","如果考试背离了教学规律和学习规律，就会对教学产生有害的影响。"],"q":"测试是用来检查教学效果的，但同时又不可避免地给教学以影响，这就是测试的后效作用。","w":"high","e":["2021 真题"]},{"t":"多项选择题","y":"名词解释","p":["多项选择题一般是先提出情景(称为题干)，并提出四个答案的备选项，让受试者选择其中的一个(其余三个叫干扰)，所以也称四项选择题。","这是考查阅读理解和听力理解等语言技能的常用题型，可以考词汇也可考语法。","多项选择题最大的优点是评分客观，因而信度大。可以直接考出编制者想考的问题，使受试者无法回避，因而效度也大。由于答题迅速，因此题量可大。","缺点是不能测表达能力，有25%猜对的概率，命题费时费力。"],"q":"多项选择题一般是先提出情景(称为题干)，并提出四个答案的备选项，让受试者选择其中的一个(其余三个叫干扰)，所以也称四项选择题。","w":"high","e":["2019 真题"]},{"t":"综合填充题","y":"名词解释","p":["综合填充是完形测试(cloze tests)的基本形式。即在一篇短文中隔一定的字数删去一个词，让受试者补上。","它是以格式塔的完形心理学派理论为基础，认为心理学的基本特征是在意识经验中所体现的结构性或整体性。","“完形倾向”使人具有填补空缺的心理，而填补空缺的过程中必须对整体及其组成部分有充分的认识。","最早是选用三四百字短文，除了第一句和最后一句外，每隔5或7、9、11个字就留出一个空格，每道试题约25～50个空格。后来改为从出题的需要出发不定距离留空，并采用综合填充与多项选择相结合的办法。"],"q":"综合填充是完形测试(cloze tests)的基本形式。即在一篇短文中隔一定的字数删去一个词，让受试者补上。","w":"high","e":["2020 真题"]},{"t":"标准化测试","y":"名词解释","p":["标准化测试是以现代教育测量学的理论为依据，按照系统的科学程序对考试的全过程(设计、命题、施测、评分、分析等)实行标准化处理，对误差进行严格控制，有较高效度、信度，能测出受试者真实水平的测试。","这种测试由权威机构和专业队伍研制。","为了保证严密的科学性，标准化测试通常是以客观性试题为主的常模参照测试。","标准化语言测试的过程大体上有四个步骤，即设计命题、考试实施、阅卷评分和统计分析。"],"q":"标准化测试是以现代教育测量学的理论为依据，按照系统的科学程序对考试的全过程(设计、命题、施测、评分、分析等)实行标准化处理，对误差进行严格控制，有较高效度、信度，能测出受试者真实水平的测试。","w":"high","e":["2020 真题"]},{"t":"试述效度和信度的关系。","y":"名词解释","p":["效度又称有效性，指测试的有效程度；信度又称可靠性，指测试结果的可靠程度或稳定性。","(1)信度是效度的前提。","(2)信度高并不意味着效度一定高。","(3)效度不高，信度高也没有意义。","测试的可靠性与有效性是测试的两大评析标准，两者关系密切且十分复杂。"],"q":"效度又称有效性，指测试的有效程度，即测试的内容和方法是否能测出预定要测量的东西。信度又称可靠性，指测试结果的可靠程度或稳定性，也就是考试成绩是否反映了受试者的实际水平。测试的可靠性与有效性是测试的两大评析标准，两者都很重要，两者关系密切且十分复杂：(1)信度是效度的前提。如果测试的结果不可靠，不能反","w":"high","e":["2021 真题"]},{"t":"区分性","y":"名词解释","p":["区分性指测试区分受试者知识和能力差别的性能，是试题的质量标准。","如果受试者的水平高低不同而测试的成绩却很接近，不能把水平高和水平低的受试者区分开来，说明该考试的区分性差。","测试的区分性从试题的难易度和试题的区分度两方面考虑。","试题的难易度指试卷中应包括适当比例的难易程度不同的试题。试题的区分度指试题能区分受试者水平差异的程度，它与难易度相关，是更重要的指标。"],"q":"区分性指测试区分受试者知识和能力差别的性能，是试题的质量标准。","w":"normal","e":["核心概念"]},{"t":"学能测试","y":"名词解释","p":["学能测试又称潜能测试或性向测试，目的在于了解受试者学习第二语言的潜在能力和素质。","学习语言的潜能包括：语音的编码、解码能力，语法敏感性，语言的记忆能力，综合归纳能力等。","学能测试是一种预示性的测试。","在决定学习一种语言之前，了解学习者先天条件和素质，对学习者本人和学校都是有价值的。学能测试属于常模参照测试。"],"q":"学能测试又称潜能测试或性向测试，目的在于了解受试者学习第二语言的潜在能力和素质。","w":"normal","e":["核心概念"]},{"t":"诊断测试","y":"名词解释","p":["诊断测试是为了了解受试者在学习某一具体内容或在较短的一段学习时间里所存在的问题而进行的测试。","目的是迅速直接地获得反馈信息，及时改进教学。这也是一种回顾兼预示性的测试，常常是与一具体的短期目标相联系。","学校中的小考、小测验都属于这一类。诊断测试是非正式的测试，命题、评分都比较灵活，一般也不用作衡量学生水平的主要依据。"],"q":"诊断测试是为了了解受试者在学习某一具体内容或在较短的一段学习时间里所存在的问题而进行的测试。","w":"normal","e":["核心概念"]},{"t":"分立式测试","y":"名词解释","p":["分立式测试是对语言要素(语音、词汇、语法等)和言语技能(听、说、读、写)分别进行单项测试，如填空、完成句子、多项选择。","其理论基础是结构主义语言学。认为语言是由各种成分组成的，掌握一种语言就是掌握这些成分和技能。","分立式试题的长处在于想考什么就能考什么，受试者无法回避，而且大多采用客观试题。","缺点是只能测量各个孤立项目的知识和技能。而各个单项知识、技能之和不一定等于其总体语言能力。"],"q":"分立式测试是对语言要素(语音、词汇、语法等)和言语技能(听、说、读、写)分别进行单项测试，如填空、完成句子、多项选择。","w":"normal","e":["核心概念"]},{"t":"综合填充是______测试的基本形式。","y":"名词解释","p":["综合填充是完形测试(cloze tests)的基本形式。"],"q":"完形","w":"normal","e":["核心概念"]},{"t":"【原文】二、加强理论研究教学体系","y":"教材原文","p":["二、加强理论研究教学体系的建立，教学效率的提高，有赖于理论的指导","加强理论研究，首先是加强汉语教学理论的研究","汉语作为第二语言教学与英、法、德语等作为第二语言教学相比，起步较晚，在教学理论研究的广度、深度方面还有一定的差距","另一方面，汉语具有很多与印欧系语言不同的特点，对汉语教学的研究不但可以印证、而且可以大大地丰富人们对语言教学规律的认识，因此汉语教学理论的研究对整个第二语言教学理论的发展具有特殊的意义"],"q":"二、加强理论研究教学体系的建立，教学效率的提高，有赖于理论的指导。加强理论研究，首先是加强汉语教学理论的研究。汉语作为第二语言教学与英、法、德语等作为第二语言教学相比，起步较晚，在教学理论研究的广度、深度方面还有一定的差距。 另一方面，汉语具有很多与印欧系语言不同的特点，对汉语教学的研究不但可以印证、而且可以大大地丰富人们对语言教学规律的认识，因此汉语教学理","w":"normal","e":["原书正文"]},{"t":"【原文】除了教学理论的研究外，语","y":"教材原文","p":["除了教学理论的研究外，语言习得的研究也将是２１世纪本学科理论研究的重点","研究语言习得，是为了揭示学习规律，也是为了使我们学科更好地与心理学相结合，更好地体现跨学科的特点和学科的发展方向"],"q":"除了教学理论的研究外，语言习得的研究也将是２１世纪本学科理论研究的重点。研究语言习得，是为了揭示学习规律，也是为了使我们学科更好地与心理学相结合，更好地体现跨学科的特点和学科的发展方向。","w":"normal","e":["原书正文"]},{"t":"【原文】理论研究的第三个重要方面","y":"教材原文","p":["理论研究的第三个重要方面是对作为第二语言学习和教学内容的汉语的研究","前面已经谈到，汉语作为第二语言的研究是汉语研究的--部分，但它有很多区别于汉语作为母语研究的特点"],"q":"理论研究的第三个重要方面是对作为第二语言学习和教学内容的汉语的研究。前面已经谈到，汉语作为第二语言的研究是汉语研究的--部分，但它有很多区别于汉语作为母语研究的特点。在语言","w":"normal","e":["原书正文"]},{"t":"【原文】学家和汉语教学界专家的共","y":"教材原文","p":["学家和汉语教学界专家的共同努力下，这方面的研究已取得很多成果，反映在汉语作为第二语言的语音教学体系、词汇教学体系和语法教学体系中","这些体系还存在不少问题，教学实践又不断地提出新的问题","加强对汉语作为第二语言教学体系的研究，继续完善这一体系，将是下一个世纪本学科理论研究的重要任务之一","作为教学内容的组成部分，除了对汉语语言结构的研究外，还包括对功能的研究和对文化因素的研究"],"q":"学家和汉语教学界专家的共同努力下，这方面的研究已取得很多成果，反映在汉语作为第二语言的语音教学体系、词汇教学体系和语法教学体系中。这些体系还存在不少问题，教学实践又不断地提出新的问题。加强对汉语作为第二语言教学体系的研究，继续完善这一体系，将是下一个世纪本学科理论研究的重要任务之一。作为教学内容的组成部分，除了对汉语语言结构的研究外，还包括对功能的研究和对文","w":"normal","e":["原书正文"]},{"t":"【原文】三、加强教师队伍建设无论","y":"教材原文","p":["三、加强教师队伍建设无论是教学工作还是理论研究工作，都需要人来做","有一支能胜任教学工作、科研工作和教学科研管理工作的高素质的教师队伍，是汉语教学事业发展的最根本的条件","目前我们的教师队伍的状况远不能适应新世纪汉语教学发展的需要","中国存在这个问题，海外汉语教学在很多国家也都面临着培养和提高本国汉语教师的任务"],"q":"三、加强教师队伍建设无论是教学工作还是理论研究工作，都需要人来做。有一支能胜任教学工作、科研工作和教学科研管理工作的高素质的教师队伍，是汉语教学事业发展的最根本的条件。目前我们的教师队伍的状况远不能适应新世纪汉语教学发展的需要。中国存在这个问题，海外汉语教学在很多国家也都面临着培养和提高本国汉语教师的任务。有的国家刚刚恢复了中断多年的汉语教学，因而出现汉语教","w":"normal","e":["原书正文"]},{"t":"【原文】四、在世界范围内确立学科","y":"教材原文","p":["四、在世界范围内确立学科地位正如英、法、德语等作为第二语言教学是一门专门的学科一样，世界范围的汉语作为第二语言的教学也是一门专门的学科","目前在中国，这门学科虽已确立，但仍处于创立阶段，学科建设还刚刚开始","在海外，汉语教学是否应取得独立发展的学科资格，可能尚未形成共识","我们认为，各国汉语教学工作者和研究工作者需要进一步协调教学和科研工作，加强合作与交流，共同努力把这门学科树立起来，并把它建设好"],"q":"四、在世界范围内确立学科地位正如英、法、德语等作为第二语言教学是一门专门的学科一样，世界范围的汉语作为第二语言的教学也是一门专门的学科。 目前在中国，这门学科虽已确立，但仍处于创立阶段，学科建设还刚刚开始。在海外，汉语教学是否应取得独立发展的学科资格，可能尚未形成共识。我们认为，各国汉语教学工作者和研究工作者需要进一步协调教学和科研工作，加强合作与交流，共同","w":"normal","e":["原书正文"]},{"t":"【原文】问题，有没有学科意识，对","y":"教材原文","p":["问题，有没有学科意识，对这项事业发展的影响还是大不一样的","我们希望在２１世纪的第一个十年内能看到像其他第二语言教育学科一样蓬勃发展的汉语作为第二语言的教育学科"],"q":"问题，有没有学科意识，对这项事业发展的影响还是大不一样的。我们希望在２１世纪的第一个十年内能看到像其他第二语言教育学科一样蓬勃发展的汉语作为第二语言的教育学科。","w":"normal","e":["原书正文"]},{"t":"【原文】阅读参考文献崔永华 19","y":"教材原文","p":["阅读参考文献崔永华 1999 基础汉语教学模式的改革，《世界汉语教学》第1期"],"q":"阅读参考文献崔永华 1999 基础汉语教学模式的改革，《世界汉语教学》第1期。","w":"normal","e":["原书正文"]}]}]},{"id":"yinlun-c10","t":"第十章 对外汉语教学的学科建设","w":"high","s":[{"id":"yinlun-c10-s01","t":"第一节 对外汉语教学研究方法","w":"high","n":17,"k":[{"t":"实验法","y":"名词解释","p":["实验法是有意识地使一个变量(自变量)发生变化，并观察对另一个变量(因变量)所产生的影响的研究方法。","实验法是国外第二语言习得和教学研究的主要方法，也一直为我国心理学和教育学研究者所使用。","实验法的关键在于：首先必须有作为实验目的的假说，并根据这一假说进行精确的实验设计；第二，在实验过程中对被试要进行随机抽样，要控制自变量，同时对非研究变量要进行控制；第三，对实验获得的数据和资料进行分析，对一些理论问题进行讨论并对假说进行检验。","实验方法是科学研究最重要、最基本的方法。"],"q":"实验法是有意识地使一个变量(自变量)发生变化，并观察对另一个变量(因变量)所产生的影响的研究方法。","w":"high","e":["2020 真题"]},{"t":"方法论","y":"名词解释","p":["方法论是在哲学层次上探讨科学方法的一般理论，是对科学方法的高度抽象与概括，研究如何把世界观的基本观点变为认识世界和改造世界的根本方法理论。","方法论一般就是指哲学方法论。","最普遍、最根本、最具有通用性的方法是哲学方法，它适用于自然科学、社会科学和思维科学，成为所有方法的基础，对其他各种方法起指导作用。","除了作为根本方法的哲学方法外，数学等横断科学作为运用于各个领域的一般方法，也起着方法论的作用，对各学科都有方法论的指导意义。"],"q":"方法论是在哲学层次上探讨科学方法的一般理论，是对科学方法的高度抽象与概括，研究如何把世界观的基本观点变为认识世界和改造世界的根本方法理论。","w":"normal","e":["核心概念"]},{"t":"观察法","y":"名词解释","p":["观察法是科学研究也是教育研究中最基本、最普遍的方法。","它是在自然的条件下，有目的有计划地通过观察而感知研究对象以获得实例的方法。可以作为参与者观察，也可以作为旁观者观察。","观察的范围通常是从开放式到逐步缩小、聚焦。","从事语言教学的研究者和教师正是通过课上、课下和社会实践活动，对学生或别的教师进行观察和记录。这样所获得的第一手资料，常常成为用其他方法特别是经验总结法进行研究的基础。"],"q":"观察法是科学研究也是教育研究中最基本、最普遍的方法。","w":"normal","e":["核心概念"]},{"t":"调查法","y":"名词解释","p":["调查法是根据一定的目的，有计划地从一定量的样本中搜集有关研究对象的资料，从而对研究对象的整体进行推断的方法。","与观察法相同之处是两者都是在自然状态中获得实例。不同之处在于调查法是一种间接的观察法，因而不受时空的限制，既可以调查现状，也可以调查历史资料，可以调查国内国外的情况，有观察法和其他方法难以达到的广度。","调查的具体方法有访谈法、问卷法和测试法等。","本学科已成功地进行过一些大型的调查项目，如《北京口语调查》(常宝儒等，1992)，《汉语中介语语料库系统》(储诚志等，1995)，《外国人学习与使用汉语情况调查研究报告》(高彦德等，1993)。"],"q":"调查法是根据一定的目的，有计划地从一定量的样本中搜集有关研究对象的资料，从而对研究对象的整体进行推断的方法。","w":"normal","e":["核心概念"]},{"t":"经验总结法","y":"名词解释","p":["经验总结法可以说是本学科用得最多的方法。","从现存的早期论文《教非汉族学生学习汉语的一些问题》(周祖谟，1953)，到文革前对外汉语教学的全面总结《15年汉语教学经验总结》(钟梫，1965)，以及近十多年来各种学术会议和期刊论文的绝大部分，都是运用经验总结的方法写成的。","这在学科发展的一定阶段是一种正常的现象。","由经验型向科学型过渡也是一般学科发展的必由之路。"],"q":"经验总结法可以说是本学科用得最多的方法。","w":"normal","e":["核心概念"]},{"t":"文献研究法","y":"名词解释","p":["文献研究法是通过对文献资料的阅读、分析、研究以获取信息并得出一定结论的方法。","常用于介绍或评述某一学术问题。","文献研究法的典型例子如《第二语言习得研究的回顾与展望》(袁博平，1995)，《国外外语教学学科发展的过去和现状》(孙德坤，1994)等。"],"q":"文献研究法是通过对文献资料的阅读、分析、研究以获取信息并得出一定结论的方法。","w":"normal","e":["核心概念"]},{"t":"个案研究法","y":"名词解释","p":["个案研究是指对某个人或某件事等限定系统进行集中、深入、全面的研究，常用于定性研究，也用于描述性研究。","就语言教学研究来说，常常是对一个学生或教师、一个学校或团体、一门课或一个事件进行纵向的跟踪研究。","根据马克思主义哲学有关个性与共性、个别与一般的论述，典型的个案研究有助于认识同类事物的全貌。","个案研究最早用于儿童语言习得和语言人类学。有名的范例如赵元任先生50年代初发表的、对他的孙女学话过程的跟踪观察与研究。"],"q":"个案研究是指对某个人或某件事等限定系统进行集中、深入、全面的研究，常用于定性研究，也用于描述性研究。","w":"normal","e":["核心概念"]},{"t":"相关分析法","y":"名词解释","p":["相关分析法是对研究对象群体特征的定量分析，以研究各特征之间或多元因素之间的相互关系。","比如某变量的变化与另一变量的变化之间存在的一定的规律性。","相关分析通常研究两个或多个变量之间是否相关：是正相关还是负相关?相关程度如何?相关程度常用-1.0到+1.0的相关系数表示。多个变量之间的关系分析也称“多元回归分析”。"],"q":"相关分析法是对研究对象群体特征的定量分析，以研究各特征之间或多元因素之间的相互关系。","w":"normal","e":["核心概念"]},{"t":"话语分析法","y":"名词解释","p":["话语分析法，即对超出句子层面的语言和语言教学的研究方法。","这在语言学界和语言教学界都还是一种新的事物。它是随着对语言的语用研究、对语言习得的社会文化因素的研究以及语言教学交际性原则的研究的发展，而成为最重要的研究方法。","这也反映了对语言和语言学习的更为广阔的新视野。","话语分析法几乎能用于语言习得与教学的所有课题，并能带来“柳暗花明又一村”的境界。在对外汉语教学界，这一方法的运用几乎还未开始，特别需要做一些勇敢的探索。"],"q":"话语分析法，即对超出句子层面的语言和语言教学的研究方法。","w":"normal","e":["核心概念"]},{"t":"【原文】桂诗春 1988 《应用","y":"教材原文","p":["桂诗春 1988 《应用语言学》，湖南教育出版社"],"q":"桂诗春 1988 《应用语言学》，湖南教育出版社。","w":"normal","e":["原书正文"]},{"t":"【原文】于根元(主编) １９９９","y":"教材原文","p":["于根元(主编) １９９９ 《应用语言学理论纲要》，华语教学出版社"],"q":"于根元(主编) １９９９ 《应用语言学理论纲要》，华语教学出版社。","w":"normal","e":["原书正文"]},{"t":"【原文】章兼中 1993 《外语","y":"教材原文","p":["章兼中 1993 《外语教育学》，浙江教育出版社"],"q":"章兼中 1993 《外语教育学》，浙江教育出版社。","w":"normal","e":["原书正文"]},{"t":"【原文】束定芳等 １９９６ 《现","y":"教材原文","p":["束定芳等 １９９６ 《现代外语教学》，上海外语教育出版社"],"q":"束定芳等 １９９６ 《现代外语教学》，上海外语教育出版社。","w":"normal","e":["原书正文"]},{"t":"【原文】胡春洞 1990 《英语","y":"教材原文","p":["胡春洞 1990 《英语教学法》，高等教育出版社"],"q":"胡春洞 1990 《英语教学法》，高等教育出版社。","w":"normal","e":["原书正文"]},{"t":"【原文】王才仁 1996 《英语","y":"教材原文","p":["王才仁 1996 《英语教学交际论》，广西教育出版社"],"q":"王才仁 1996 《英语教学交际论》，广西教育出版社。","w":"normal","e":["原书正文"]},{"t":"【原文】(英)亚历山大 1982","y":"教材原文","p":["(英)亚历山大 1982 《语言教学法十讲》，北京语言学院"],"q":"(英)亚历山大 1982 《语言教学法十讲》，北京语言学院。","w":"normal","e":["原书正文"]},{"t":"【原文】(加)W. F.麦基 1","y":"教材原文","p":["(加)W. F.麦基 1990 《语言教学分析》，北京语言学院出版社"],"q":"(加)W. F.麦基 1990 《语言教学分析》，北京语言学院出版社。","w":"normal","e":["原书正文"]}]},{"id":"yinlun-c10-s02","t":"第二节 对外汉语教学学科建设的任务","w":"high","n":11,"k":[{"t":"教师队伍建设","y":"名词解释","p":["加强教师队伍建设是学科建设的三项任务之一。","无论是教学工作还是理论研究工作，都需要人来做。有一支能胜任教学工作、科研工作和教学科研管理工作的高素质的教师队伍，是汉语教学事业发展的最根本的条件。","目前我们的教师队伍的状况远不能适应新世纪汉语教学发展的需要。","除了通过本科和研究生的学历教育培养本专业新一代的教师外，更为重要的、切实可行的措施是在职教师的培训。当前需要大力加强对在职教师的培训。"],"q":"加强教师队伍建设是学科建设的三项任务之一。","w":"high","e":["2020 真题"]},{"t":"学科建设的三项任务","y":"名词解释","p":["吕必松早在1987年就提出了本学科建设的三项任务：改革和完善教学法体系、加强理论研究和加强教师队伍的建设。","十多年来，我们在这三方面已取得了很大成绩，但显然这三项任务仍是我们今天和今后一段时期中的任务。","改革和完善教学法体系，首先必须进行教学法改革。加强理论研究，首先是加强汉语教学理论的研究。加强教师队伍建设，是整个汉语作为第二语言教学领域的当务之急。"],"q":"吕必松早在1987年就提出了本学科建设的三项任务：改革和完善教学法体系、加强理论研究和加强教师队伍的建设。","w":"high","e":["2019 真题"]},{"t":"加强理论研究","y":"名词解释","p":["加强理论研究是学科建设的三项任务之一。","教学体系的建立，教学效率的提高，有赖于理论的指导。加强理论研究，首先是加强汉语教学理论的研究。","除了教学理论的研究外，语言习得的研究也将是21世纪本学科理论研究的重点。","理论研究的第三个重要方面是对作为第二语言学习和教学内容的汉语的研究。"],"q":"加强理论研究是学科建设的三项任务之一。","w":"normal","e":["核心概念"]},{"t":"【原文】赵金铭(主编) １９９７","y":"教材原文","p":["赵金铭(主编) １９９７ 《新视角汉语语法研究》，北京语言文化大学出版社"],"q":"赵金铭(主编) １９９７ 《新视角汉语语法研究》，北京语言文化大学出版社。","w":"normal","e":["原书正文"]},{"t":"【原文】佟慧君 1986 《外国","y":"教材原文","p":["佟慧君 1986 《外国人学汉语病句分析》，北京语言学院出版社"],"q":"佟慧君 1986 《外国人学汉语病句分析》，北京语言学院出版社。","w":"normal","e":["原书正文"]},{"t":"【原文】程美珍等 １９９７ 《汉","y":"教材原文","p":["程美珍等 １９９７ 《汉语病句辨析九百例》，华语教学出版社"],"q":"程美珍等 １９９７ 《汉语病句辨析九百例》，华语教学出版社。","w":"normal","e":["原书正文"]},{"t":"【原文】李大遂 1993 《简明","y":"教材原文","p":["李大遂 1993 《简明实用汉字学》，北京大学出版社"],"q":"李大遂 1993 《简明实用汉字学》，北京大学出版社。","w":"normal","e":["原书正文"]},{"t":"【原文】郝恩美 1995 《汉字","y":"教材原文","p":["郝恩美 1995 《汉字教学的规律和方法》，浙江教育出版社"],"q":"郝恩美 1995 《汉字教学的规律和方法》，浙江教育出版社。","w":"normal","e":["原书正文"]},{"t":"【原文】吕必松(主编) １９９９","y":"教材原文","p":["吕必松(主编) １９９９ 《汉字与汉字教学研究论文选》，北京大学出版社"],"q":"吕必松(主编) １９９９ 《汉字与汉字教学研究论文选》，北京大学出版社。","w":"normal","e":["原书正文"]},{"t":"【原文】王 还 1995 《汉英","y":"教材原文","p":["王 还 1995 《汉英对比论文集》，华语教学出版社"],"q":"王 还 1995 《汉英对比论文集》，华语教学出版社。","w":"normal","e":["原书正文"]},{"t":"【原文】赵永新 1996 《语言","y":"教材原文","p":["赵永新 1996 《语言对比研究与对外汉语教学》，北京语言文化大学出版社"],"q":"赵永新 1996 《语言对比研究与对外汉语教学》，北京语言文化大学出版社。","w":"normal","e":["原书正文"]}]}]}]},{"d":"xdhy_up","t":"现代汉语通论（上册）","c":[{"id":"xdhy_up-c01","t":"第一章 语音","w":"high","s":[{"id":"xdhy_up-c01-s01","t":"第一节 现代汉语语音概述","w":"high","n":35,"k":[{"t":"语音","y":"名词解释","p":["由人的发音器官发出","不同的语音代表不同的意义","作用是进行社会交际，具有“社会”的属性"],"q":"语音是指人类通过发音器官发出来的、具有一定意义的、目的是用来进行社会交际的声音。语音具有三大属性：发音的生理属性、物理属性（音高、音强、音长、音色）和社会属性。其中社会属性是语音最重要的特点，是世界上其他任何声音所不具备的属性。社会属性主要表现为三点：①约定俗成；②系统性；③语音具备一定的民族特征和","w":"high","e":["2016 真题","2020 真题"]},{"t":"音高","y":"名词解释","p":["就是声音的高低","决定于发音体振动的频率","取决于声带紧张的程度"],"q":"音高就是声音的高低，音高决定于发音体振动的频率，即取决于声带紧张的程度。作为语音物理属性四要素（音高、音强、音长、音色）之一，音高在汉语中具有区别意义的作用，是构成声调的基础。声带越紧，振动频率越高，声音就越高；声带越松，声音越低。","w":"high","e":["2013 真题"]},{"t":"音强","y":"名词解释","p":["就是声音的强弱","主要取决于发音体的振幅"],"q":"音强就是声音的强弱，主要取决于发音体的振幅。音强是语音物理属性的四要素之一，与音高、音长、音色并列。振幅越大，声音越强；振幅越小，声音越弱。普通话中的轻声，其物理表现之一即为音强减弱。","w":"high","e":["2013 真题"]},{"t":"音节","y":"名词解释","p":["人们听感容易分辨出来的最小语音片断","发音肌肉经历一次从紧张到松弛的过程","听感上有一个明显的响度中心","普通话除儿化音外一个汉字读音就是一个音节"],"q":"音节是人们听感容易分辨出来的最小语音片断。从发音角度来说，每个音节的发音肌肉均经历了一次从紧张到松弛的过程；从听感角度来说，每一个音节都有一个明显的响度中心。普通话除儿化音音节外，一个汉字的读音就是一个音节。“现代汉语”四个汉字读出来就是[sian⁵¹ tai⁵¹ xan⁵¹ y³⁵]四个音节。","w":"high","e":["2013 真题","2019 真题"]},{"t":"元音","y":"名词解释","p":["气流振动声带","发音部位不受阻碍","又叫母音","主要功能是构成音节的韵母"],"q":"元音是指发音时气流振动声带，发音部位不受阻碍而形成的音。元音又叫母音。元音的主要功能是构成音节的韵母。普通话的 a、o、e、i、u、ü 等均为元音。","w":"high","e":["2012 真题","2018 真题"]},{"t":"辅音","y":"名词解释","p":["气流在发音部位受到明显的阻碍","又叫子音","主要功能是担当声母或韵尾"],"q":"辅音是指发音时气流在发音部位受到明显的阻碍而形成的音。辅音又叫子音。辅音的主要功能是担当音节的声母或韵母的韵尾。普通话里的22个辅音有21个可以用来作声母。普通话的 b、p、m、f、d、t、n、l 等均为辅音。","w":"high","e":["2012 真题","2018 真题"]},{"t":"声母","y":"名词解释","p":["音节开头的辅音","普通话22个辅音有21个可作声母"],"q":"声母是指音节开头的辅音。普通话里的22个辅音有21个可以用来作声母。在教学中常常在声母的后边加上一个元音，实际上已组成了一个音节，以方便不同声母的称读，这就是呼读音。普通话 21 个辅音声母为 b、p、m、f、d、t、n、l、g、k、h、j、q、x、zh、ch、sh、r、z、c、s。","w":"high","e":["2014 真题","2020 真题"]},{"t":"韵母","y":"名词解释","p":["一个音节声母后面的部分","由元音或元音加鼻辅音构成","普通话共有39个韵母"],"q":"韵母是指一个音节声母后面的部分。韵母由元音或元音加鼻辅音构成。普通话共有39个韵母。普通话韵母可分为韵头、韵腹、韵尾三部分，其中“韵腹”是核心，是韵母必不可少的部分。普通话音节 lian 中，声母是 l，韵母是 ian，它由韵头 i、韵腹 a、韵尾 n 构成。","w":"high","e":["2011 真题","2017 真题"]},{"t":"声调","y":"名词解释","p":["音节读音的高低升降","区别意义的重要手段","汉语区别于其他语言的重要特征之一"],"q":"声调是指音节读音的高低升降。汉语是有声调的语言，声调是区别意义的重要手段，这是汉语区别于其他语言的重要特征之一。事(shì)——实(shí)、买(mǎi)——卖(mài)、收(shōu)——受(shòu)，均靠声调区别意义。","w":"high","e":["2013 真题","2019 真题"]},{"t":"零声母","y":"名词解释","p":["没有辅音开头的音节","韵母独自形成音节","y、w不是真正的声母，而是隔音字母"],"q":"零声母音节是指没有辅音开头的音节。某些音节并不需要辅音充当声母，而是韵母独自形成音节。汉语拼音中 y、w 两个字母只出现在零声母音节的开头，但它们不是真正的声母，而是起隔开音节作用的字母。“衣、乌、鱼、安、鹅”等字的读音都是零声母音节。","w":"high","e":["2016 真题","2022 真题"]},{"t":"社会属性","y":"名词解释","p":["语音最重要的特点","世界上其他任何声音所不具备","约定俗成","系统性","民族特征和地域特征"],"q":"语音的社会属性是语音最重要的特点，是世界上其他任何声音所不具备的属性。其特点主要有三个：①约定俗成——单纯的声音并无语言价值，只有跟一定的社会意义结合起来的声音才能成为语音；②系统性——系统内所包含的音素数目及其相互关系是有序的；③语音具备一定的民族特征和地域特征。系统性示例：英语共有24个辅音、2","w":"high","e":["2014 真题","2018 真题","2022 真题"]},{"t":"汉语拼音方案","y":"名词解释","p":["用拉丁字母拼写现代汉语普通话语音的方案","基本功能是解决汉字、词语等语言单位的规范读音与拼写","专门为普通话读音设计，只适用于普通话"],"q":"《汉语拼音方案》是一个用拉丁字母拼写现代汉语普通话语音的方案，其基本功能是帮助解决汉字、词语等语言单位的规范读音与拼写。从这个意义上说，它是专门为普通话读音而设计的一套语音注读方案，而且只适用于普通话。方案共分字母表、声母表、韵母表及说明、声调符号、隔音符号五部分。方案使用“-、ˊ、ˇ、`”分别表示","w":"high","e":["2011 真题","2017 真题"]},{"t":"语音的表象功能","y":"名词解释","p":["表象是感知觉形象的表现","语音的表象功能能向我们提供一定的感知觉形象","汉语中的拟声词是语音实现表象功能的主要手段"],"q":"表象指的是感知觉形象的表现，包括听觉形象、视觉形象、味觉形象、嗅觉形象、触觉形象等。语音的表象功能能够跟绘画、雕塑、音乐一样，向我们提供一定的感知觉形象。","w":"high","e":["2021 真题"]},{"t":"试比较辅音l与n的发音区别。","y":"名词解释","p":["n是鼻音，气流从鼻腔冲出","l是边音，气流从舌的两边通过","发音部位相同（舌尖中），发音方法不同"],"q":"l与n的区别在于发音方法不同：n是鼻音，成阻部位完全堵塞口腔气流通道，声带振动，让发音气流从鼻腔冲出形成鼻腔共鸣；l是边音，舌尖抵住上齿龈始终接触成阻，声带振动，让气流从舌的两边通过。二者发音部位相同（均为舌尖中），但发音方法不同。","w":"high","e":["2013 真题","2019 真题"]},{"t":"试比较辅音z与r的发音区别。","y":"名词解释","p":["z是塞擦音，r是擦音","z是清音，r是浊音"],"q":"z与r都是舌尖后音，区别在于：z是塞擦音，发音部位先完全封闭，然后打开一条窄缝，让发音气流从中挤出，成阻时为塞音状态，除阻时为擦音状态；r是擦音，成阻部位不完全封闭气流通道，其间留有一条窄缝，让发音气流挤出窄缝摩擦成声。此外，z是清音（声带不振动），r是浊音（声带振动）。","w":"high","e":["2015 真题"]},{"t":"语音共鸣腔分口腔、鼻腔与咽腔。","y":"名词解释","p":["错误","共鸣器官包括喉腔、咽腔、鼻腔和口腔四部分"],"q":"×。原文指出：共鸣器官主要包括喉腔、咽腔、鼻腔和口腔四部分。题干漏掉了“喉腔”。","w":"high","e":["2013 真题"]},{"t":"写出普通话四个声调的调值、调型与调号。","y":"名词解释","p":["阴平55（高平）","阳平35（高升）","上声214（曲折）","去声51（全降）"],"q":"普通话里qing这个音节有四种声调：清：高而平，标为55；晴：由中升到高，标为35；请：由次低降到低再升至次高，标为214；庆：由高降到低，标为51。调型方面，55为高平调型，35为高升调型，214为先降后升曲折调型，51为全降调型。调号即声调的标志符号，汉语拼音方案使用“-、ˊ、ˇ、`”分别表示“","w":"high","e":["2013 真题","2017 真题","2023 真题"]},{"t":"汉语拼音中y、w两个字母是真正的声母。","y":"名词解释","p":["错误","y、w不是真正的声母","起隔开音节作用的字母"],"q":"×。原文指出：汉语拼音中y、w两个字母只出现在零声母音节的开头，但它们不是真正的声母，而是起隔开音节作用的字母。","w":"high","e":["2016 真题"]},{"t":"普通话里的22个辅音都可以用来作声母。","y":"名词解释","p":["错误","22个辅音有21个可作声母","ng只能作韵尾不能作声母"],"q":"×。原文指出：普通话里的22个辅音有21个可以用来作声母；其中n还可以充当韵尾，第22个辅音是后鼻辅音ng，只能作韵尾，不能作声母。","w":"high","e":["2014 真题","2019 真题"]},{"t":"韵头可以由i、u、ü、a四个元音充当。","y":"名词解释","p":["错误","韵头只有i、u、ü3个元音可以充当"],"q":"×。原文指出：普通话中的韵头只有i、u、ü3个元音可以充当。","w":"high","e":["2015 真题"]},{"t":"在区别语义作用上，语音关注的是绝对音高。","y":"名词解释","p":["错误","语音注重的是相对音高"],"q":"×。原文指出：不同的言语者、不同的语境下，每个人均有自己成规律的相对音高显示，并不影响彼此间的说话与传意。可见语音注重的是“相对音高”。","w":"high","e":["2010 真题","2015 真题"]},{"t":"普通话的音节总数只有______个左右。","y":"名词解释","p":["400个左右"],"q":"400","w":"high","e":["2012 真题","2018 真题"]},{"t":"儿化音节","y":"名词解释","p":["现代汉语书面语中还有少量用两个汉字记录一个音节的，例如“花儿”（huār）、“画儿”（huàr）等，这类音节在汉语中称为儿化音节，是在一个音节的末尾附加卷舌动作。","这个卷舌动作发出的音并不构成一个独立完整的音节。","一个汉字记录的语音单位基本上是一个音节。"],"q":"现代汉语书面语中还有少量用两个汉字记录一个音节的，例如“花儿”（huār）、“画儿”（huàr）等，这类音节在汉语中称为儿化音节，是在一个音节的末尾附加卷舌动作。","w":"high","e":["教材高频"]},{"t":"双音节化","y":"名词解释","p":["汉语词汇发展的一个明显的趋势就是“双音节化”。","现代汉语的语素以单音节为主，词则以多音节为主。古代汉语中，以单音节词为主，而现代汉语则以多音节词为主，特别是双音节词占绝大多数。","其原因主要有以下三个：一是有助于避免大量同音词的出现；二是双音节词使词义的表达更为细腻、精确；三是双音节读起来往往带有一种乐感，轻重之间形成一种节奏，悦耳动听。"],"q":"汉语词汇发展的一个明显的趋势就是“双音节化”。","w":"high","e":["教材高频"]},{"t":"汉字的语音识别输入","y":"名词解释","p":["汉字的语音识别输入就是通过与计算机连接的传声装置，利用语音分析技术，抽取语音特征参数，由计算机进行辨识并形成汉字内部码。","语音识别的原理是把语音先根据语法规则切词，根据语音规则切音段，再根据语境、语用和语义规则辨别词句。","根据输入者的身份，语音识别可分为特定人的语音识别和非特定人的语音识别两类。根据输入者的发音方式，语音识别又可分为孤立词语音识别和连续语音识别两类。"],"q":"汉字的语音识别输入就是通过与计算机连接的传声装置，利用语音分析技术，抽取语音特征参数，由计算机进行辨识并形成汉字内部码。","w":"high","e":["教材高频"]},{"t":"音长","y":"名词解释","p":["就是声音的长短","决定于发音体振动持续时间的长短"],"q":"音长就是声音的长短，它决定于发音体振动持续时间的长短。音长是语音物理属性的四要素之一。普通话中，音长对区别意义的作用不如音高重要，但在轻声、语气等方面有表现。上声在语流中常常变短，轻声音节也明显短于一般音节。","w":"normal","e":["核心概念"]},{"t":"所有的单元音都可以直接作韵母。","y":"名词解释","p":["错误","舌尖元音不能单独成音节"],"q":"×。原文指出：舌尖元音不能单独成音节，舌尖前元音-i只出现在z、c、s声母后面；舌尖后元音-i只出现在zh、ch、sh、r声母后面。","w":"normal","e":["核心概念"]},{"t":"【原文】教育部“十二五”国家级规","y":"教材原文","p":["教育部“十二五”国家级规划教材教育部“十二五”国家级规划教材教育部“十一五”国家级规划教材教育部“十一五”国家级规划教材"],"q":"教育部“十二五”国家级规划教材教育部“十二五”国家级规划教材教育部“十一五”国家级规划教材教育部“十一五”国家级规划教材","w":"normal","e":["原书正文"]},{"t":"【原文】XIANDAI HANY","y":"教材原文","p":["XIANDAI HANYU TONGLUNXIANDAI HANYU TONGLUN现代汉语通论现代汉语通论主编：邵敬敏"],"q":"XIANDAI HANYU TONGLUNXIANDAI HANYU TONGLUN现代汉语通论现代汉语通论主编：邵敬敏","w":"normal","e":["原书正文"]},{"t":"【原文】主编：邵敬敏(第三版)(","y":"教材原文","p":["主编：邵敬敏(第三版)(第三版)上上上海教育出版社上海教育出版社教育部“十二五”国家级规划教材教育部“十一五”国家级规划教材"],"q":"主编：邵敬敏(第三版)(第三版)上上上海教育出版社上海教育出版社教育部“十二五”国家级规划教材教育部“十一五”国家级规划教材","w":"normal","e":["原书正文"]},{"t":"【原文】国家汉办教师资格证书考试","y":"教材原文","p":["国家汉办教师资格证书考试推荐书目现代汉语通论(第三版)(上册)主编：邵敬敏(暨南大学)顾问：胡裕树(复旦大学)陆俭明(北京大学)"],"q":"国家汉办教师资格证书 的措施和较强的推行力度，因此成绩尤为突出。其他，比如汉字、词汇、语法等方面也都取得了一些成绩。","w":"normal","e":["原书正文"]},{"t":"【原文】现代汉语规范化是顺应时代","y":"教材原文","p":["现代汉语规范化是顺应时代发展的需要，是建设新时期社会文明的需要","要努力形成一种集体的语言规范意识，努力形成人人都重视语言规范、人人都遵守语言规范的局面","在上世纪50年代，我国明确提出了现代汉民族共同语的规范化标准：语音方面以北京语音为标准，词汇方面以北方方言为基础，语法方面以典范的现代白话文著作为规范","这一规范原则对于作为现代汉民族共同语的普通话的形成和普及起到了非常重要的作用"],"q":"现代汉语规范化是顺应时代发展的需要，是建设新时期社会文明的需要。要努力形成一种集体的语言规范意识，努力形成人人都重视语言规范、人人都遵守语言规范的局面。在上世纪50年代，我国明确提出了现代汉民族共同语的规范化标准：语音方面以北京语音为标准，词汇方面以北方方言为基础，语法方面以典范的现代白话文著作为规范。这一规范原则对于作为现代汉民族共同语的普通话的形成和普及","w":"normal","e":["原书正文"]},{"t":"【原文】练习题一、怎么理解广义与","y":"教材原文","p":["练习题一、怎么理解广义与狭义的现代汉语?普通话的标准是什么?请结合自己的亲身体会予以说明"],"q":"练习题一、怎么理解广义与狭义的现代汉语?普通话的标准是什么?请结合自己的亲身体会予以说明。","w":"normal","e":["原书正文"]},{"t":"【原文】二、请结合自己的亲身经历","y":"教材原文","p":["二、请结合自己的亲身经历，说说学普通话有什么作用"],"q":"二、请结合自己的亲身经历，说说学普通话有什么作用。","w":"normal","e":["原书正文"]},{"t":"【原文】三、举例简述现代汉语书面","y":"教材原文","p":["三、举例简述现代汉语书面语和口语的来源及其发展情况"],"q":"三、举例简述现代汉语书面语和口语的来源及其发展情况。","w":"normal","e":["原书正文"]},{"t":"【原文】四、现代汉语有各种地域变","y":"教材原文","p":["四、现代汉语有各种地域变体，请结合自己的方言举例说明跟普通话的差异"],"q":"四、现代汉语有各种地域变体，请结合自己的方言举例说明跟普通话的差异。","w":"normal","e":["原书正文"]},{"t":"【原文】思考题一、汉语，在不同场","y":"教材原文","p":["思考题一、汉语，在不同场合、不同对象、不同需要的条件下，还可以称为普通话、华语、中文","请说说各自使用的特点和背景"],"q":"思考题一、汉语，在不同场合、不同对象、不同需要的条件下，还可以称为普通话、华语、中文。请说说各自使用的特点和背景。","w":"normal","e":["原书正文"]}]},{"id":"xdhy_up-c01-s03","t":"第三节 音节分析：声母和韵母","w":"high","n":13,"k":[{"t":"韵腹","y":"名词解释","p":["韵母的主干，也指主要元音","位于韵头、韵尾之间","常由a、o、e、ê充当","韵母必不可少的部分"],"q":"韵腹指韵母的主干，也指主要元音。如果韵母还有韵头、韵尾，则韵腹位于这两者之间。韵腹常由 a、o、e、ê 充当；当没有 a、o、e、ê 时，可由 i、u、ü、-i、er 单独充当。韵腹是韵母必不可少的部分。在韵母 iao 中，i 是韵头、a 是韵腹、o 是韵尾；在韵母 en 中，e 是韵腹、n 是韵尾","w":"high","e":["2013 真题","2019 真题"]},{"t":"韵尾","y":"名词解释","p":["韵腹后的元音或辅音","位于韵母的最后","表示主要元音发音时的滑动方向或归结所在","只能由i、u(o)和n、ng 4个音素充当"],"q":"韵尾指韵腹后的元音或辅音，它位于韵母的最后。韵尾在韵母中表示主要元音发音时的滑动方向或归结所在。普通话的韵尾只能由元音 i、u(o) 和鼻辅音 n、ng 4个音素充当。韵母 ai、ei 的韵尾是 i；ao、ou 的韵尾是 u(o)；an、en 的韵尾是 n；ang、eng 的韵尾是 ng。","w":"high","e":["2014 真题"]},{"t":"四呼","y":"名词解释","p":["开口呼、齐齿呼、合口呼、撮口呼","韵母的分类","有利于揭示声韵配合规律"],"q":"中国传统语音学把汉语的韵母分为四类：“开口呼”“齐齿呼”“合口呼”“撮口呼”，简称“四呼”。普通话声母与韵母的拼合有一定的选择性，不同的声母只与“四呼”中的某些韵母拼合，而不能与其他韵母拼合。“四呼”分类有利于揭示普通话声母和韵母的配合规律。1.开口呼：凡韵母开头的元音不是 i、u、ü 的均属于开口","w":"high","e":["2012 真题","2016 真题","2022 真题"]},{"t":"撮口呼","y":"名词解释","p":["韵母以元音ü开头","共4个：ü、üe、üan、ün"],"q":"撮口呼指凡韵母以元音 ü 开头的均属于撮口呼韵母，共4个：ü、üe、üan、ün。撮口呼是“四呼”之一，与开口呼、齐齿呼、合口呼并列，是普通话声韵拼合规律的重要一环。撮口呼韵母 ü、üe、üan、ün 只能与 j、q、x、n、l 等少数声母相拼，如 ju（居）、que（缺）、xuan（宣）、jun（","w":"high","e":["2025 真题"]},{"t":"呼读音","y":"名词解释","p":["在声母后边加上一个元音","已组成一个音节","方便不同声母的称读"],"q":"在教学中常常在声母的后边加上一个元音，实际上已组成了一个音节，以方便不同声母的称读，这就是呼读音。呼读音是针对声母“本音”（即辅音的实际发音）而言的，本音不便于称读，故教学上采用呼读音。b 的呼读音是 bo，p 的呼读音是 po，m 的呼读音是 mo，f 的呼读音是 fo。","w":"normal","e":["核心概念"]},{"t":"【原文】四、辅音的发音原理普通话","y":"教材原文","p":["四、辅音的发音原理普通话里的辅音共有22个，辅音的分类由形成阻碍的部位(发音部位)和克服阻碍的方式(发音方法)两个方面来区分"],"q":"四、辅音的发音原理普通话里的辅音共有22个，辅音的分类由形成阻碍的部位(发音部位)和克服阻碍的方式(发音方法)两个方面来区分。","w":"normal","e":["原书正文"]},{"t":"【原文】(一)发音部位发音部位是","y":"教材原文","p":["(一)发音部位发音部位是指发音时气流受到阻碍的部位","普通话22个辅音共分七种不同的发音部位："],"q":"(一)发音部位发音部位是指发音时气流受到阻碍的部位。普通话22个辅音共分七种不同的发音部位：","w":"normal","e":["原书正文"]},{"t":"【原文】1.双唇音，由上下唇构成","y":"教材原文","p":["1.双唇音，由上下唇构成气流阻碍而发出的音：b[p]、 、m[m]"],"q":"1.双唇音，由上下唇构成气流阻碍而发出的音：b[p]、 、m[m]。","w":"normal","e":["原书正文"]},{"t":"【原文】2.唇齿音，由上齿与下唇","y":"教材原文","p":["2.唇齿音，由上齿与下唇构成气流阻碍而发出的音：f[f]"],"q":"2.唇齿音，由上齿与下唇构成气流阻碍而发出的音：f[f]。","w":"normal","e":["原书正文"]},{"t":"【原文】3.舌尖前音，由舌尖与上","y":"教材原文","p":["3.舌尖前音，由舌尖与上齿背构成气流阻碍而发出的音：z[ts]、c[ts‘]、s[s]"],"q":"3.舌尖前音，由舌尖与上齿背构成气流阻碍而发出的音：z[ts]、c[ts‘]、s[s]。","w":"normal","e":["原书正文"]},{"t":"【原文】4. 舌尖中音,由舌尖与","y":"教材原文","p":["4. 舌尖中音,由舌尖与上齿龈构成气流阻碍而发出的音:d[t]、t[t']、n[n]、l[l]"],"q":"4. 舌尖中音,由舌尖与上齿龈构成气流阻碍而发出的音:d[t]、t[t']、n[n]、l[l]。","w":"normal","e":["原书正文"]},{"t":"【原文】5. 舌尖后音,由舌尖与","y":"教材原文","p":["5. 舌尖后音,由舌尖与硬腭部位构成气流阻碍而发出的音: zh[ts]、 ch[ts‘]、 sh[s]、"],"q":"5. 舌尖后音,由舌尖与硬腭部位构成气流阻碍而发出的音: zh[ts]、 ch[ts‘]、 sh[s]、 。","w":"normal","e":["原书正文"]},{"t":"【原文】6. 舌面音,由前舌面与","y":"教材原文","p":["6. 舌面音,由前舌面与硬腭构成气流阻碍而发出的音:j[tc]、q[tc‘]、x[c]"],"q":"6. 舌面音,由前舌面与硬腭构成气流阻碍而发出的音:j[tc]、q[tc‘]、x[c]。","w":"normal","e":["原书正文"]}]},{"id":"xdhy_up-c01-s04","t":"第四节 普通话声调","w":"high","n":13,"k":[{"t":"调值","y":"名词解释","p":["音节读音高低、升降、曲折、长短的具体变化值"],"q":"调值是指音节读音高低、升降、曲折、长短的具体变化值。声调主要是凭着人们的听觉比较来判断不同音节高低升降的区别。通过对不同声调的起点、终点和高低变化的比较，寻找它们在模式上的相对差别。普通话阴平调值为55，阳平为35，上声为214，去声为51。","w":"high","e":["2014 真题","2020 真题"]},{"t":"调类","y":"名词解释","p":["声调的类别","把调值相同的音节归在一起","根据区别意义的不同声调调值建立","有多少个不同调值就有多少个调类"],"q":"调类是声调的类别，即把调值相同的音节归在一起所建立起来的类别。也就是说，调类是一种语言或方言中，根据能够区别意义的不同声调调值建立起来的类。一种语言或方言里有多少个不同声调调值，就有多少个调类。普通话有阴平、阳平、上声、去声四个调类；各方言调类数目不等，如粤语有九个调类。","w":"high","e":["2015 真题","2021 真题"]},{"t":"调型","y":"名词解释","p":["声调高低、升降的变化模式","55高平、35高升、214曲折、51全降"],"q":"调型指声调高低、升降的变化模式。55 为高平调型；35 为高升调型；214 为先降后升曲折调型；51 为全降调型。阴平“妈”(55)是高平调型；阳平“麻”(35)是高升调型；上声“马”(214)是曲折调型；去声“骂”(51)是全降调型。","w":"high","e":["2017 真题"]},{"t":"五度标调法","y":"名词解释","p":["赵元任设计","用从1到5的5度竖轴表示相对音高","1最低、2次低、3中高、4次高、5最高"],"q":"对具体调值的确定，通常采用赵元任设计的“五度标调法”，方法是建立一个坐标，用从1到5的5度竖轴表示相对音高，用横轴表示音长。其中1表示音高最低点，2表示次低，3表示中高，4表示次高，5表示最高。普通话四声用五度值标记为：阴平55、阳平35、上声214、去声51。","w":"high","e":["2013 真题","2020 真题"]},{"t":"调号","y":"名词解释","p":["声调的标志符号","把五度标调法图形简化","“-、ˊ、ˇ、`”分别表示阴平、阳平、上声、去声"],"q":"调号即声调的标志符号，指标写声调所用的简单明了的符号，即把五度标调法的图形简化为一种不标刻度的声调符号。汉语拼音方案使用“-、ˊ、ˇ、`”分别表示“阴平、阳平、上声、去声”四个声调。mā（阴平）、má（阳平）、mǎ（上声）、mà（去声）。","w":"normal","e":["核心概念"]},{"t":"【原文】1.单元音韵母：由一个元","y":"教材原文","p":["1.单元音韵母：由一个元音构成的韵母叫单元音韵母","普通话单元音韵母有10个："],"q":"1.单元音韵母：由一个元音构成的韵母叫单元音韵母。普通话单元音韵母有10个：","w":"normal","e":["原书正文"]},{"t":"【原文】dàshà(大厦) nǎ","y":"教材原文","p":["dàshà(大厦) nǎpà(哪怕) fādá(发达) lǎba(喇叭)20第一章 语音o[o]：舌面后、中高、圆唇元音韵母"],"q":"dàshà(大厦) nǎpà(哪怕) fādá(发达) lǎba(喇叭)20第一章 语音o[o]：舌面后、中高、圆唇元音韵母。","w":"normal","e":["原书正文"]},{"t":"【原文】bómó(薄膜) póp","y":"教材原文","p":["bómó(薄膜) pópo(婆婆) pōmò(泼墨) mómo(馍馍)e[x]：舌面后、半高、不圆唇元音韵母"],"q":"bómó(薄膜) pópo(婆婆) pōmò(泼墨) mómo(馍馍)e[x]：舌面后、半高、不圆唇元音韵母。","w":"normal","e":["原书正文"]},{"t":"【原文】hégé(合格) tès","y":"教材原文","p":["hégé(合格) tèsè(特色) gēge(哥哥) kèchē(客车)i[i]：舌面前、高、不圆唇元音韵母"],"q":"hégé(合格) tèsè(特色) gēge(哥哥) kèchē(客车)i[i]：舌面前、高、不圆唇元音韵母。","w":"normal","e":["原书正文"]},{"t":"【原文】bǐj 轻 盈 柳 暗 花 明"],"q":"清 凉 爽 快 坑 蒙 拐 骗 光 明 磊 落万 感 丛 生 笑 里 藏 奸 剑 胆 琴 心两 地 姻 缘 舞 袖 轻 盈 柳 暗 花 明","w":"normal","e":["原书正文"]},{"t":"【原文】云 山 雾 绕 严 肃 ","y":"教材原文","p":["云 山 雾 绕 严 肃 紧 张 姹 紫 嫣 红二、阅读下列词语，并注上汉字"],"q":"云 山 雾 绕 严 肃 紧 张 姹 紫 嫣 红二、阅读下列词语，并注上汉字。","w":"normal","e":["原书正文"]},{"t":"【原文】bǎituō————bà","y":"教材原文","p":["bǎituō————bàituō cáihuá————càihuā cáijué-cǎijué jìngyì---jīngyì"],"q":"bǎituō————bàituō cáihuá————càihuā cáijué-cǎijué jìngyì---jīngyì","w":"normal","e":["原书正文"]}]}]},{"id":"xdhy_up-c02","t":"第二章 汉字","w":"high","s":[{"id":"xdhy_up-c02-s01","t":"第一节 现代汉字概述","w":"high","n":29,"k":[{"t":"汉字","y":"名词解释","p":["汉字是汉民族在长期的劳动生产和社会实践中为适应交际需要而独立创造出来的书面交际工具。","汉字是一种重要而独特的文字系统，在记录语言的方法、造字的方式、字形的结构、字体的呈现等诸方面都有鲜明的特点。","汉字是世界上历史最悠久的一种独立发展的文字，曾形成“汉字文化圈”。"],"q":"汉字是汉民族在长期的劳动生产和社会实践中为适应交际需要而独立创造出来的书面交际工具。","w":"high","e":["2016 真题"]},{"t":"六书","y":"名词解释","p":["“六书”是指象形、指事、会意、形声、假借、转注。","目前主流看法认为假借、转注是用字手段，象形、指事、会意、形声才是造字方法。","造字法，通常采用传统的“六书”来分析。"],"q":"“六书”是指象形、指事、会意、形声、假借、转注。","w":"high","e":["2011 真题","2017 真题"]},{"t":"象形","y":"名词解释","p":["用线条描画出事物的形象，其字形与字义的联系比较具体、紧密。","这类字大多表示自然界和日常生活中的实物。","许多事物用几根线条很难画出，所以用这种方法造出来的字并不多。","由于字形历史演变等原因，这类字的形体象形意味现在大为减弱，不少已经失去了跟字义的直接联系，有些还变成了记号。"],"q":"用线条描画出事物的形象，其字形与字义的联系比较具体、紧密。","w":"high","e":["2012 真题"]},{"t":"会意","y":"名词解释","p":["用两个或几个物体的图形的组合产生字义。","会意字是在象形字基础上创造的，所表示的字义可从几个象形字组合的关系上显示出来，所以能把没法直接描画的一些动作、状态表示出来。","这种造字方法，现在仍在少量地应用。"],"q":"用两个或几个物体的图形的组合产生字义。","w":"high","e":["2014 真题"]},{"t":"形声","y":"名词解释","p":["由形旁与声旁组成，形旁表示大致的字义或字义的类属，声旁提示字的读音或近似的读音。","形声法是汉字最主要的造字方法。","形声法综合利用字形表义和字形表音这两种手段。"],"q":"由形旁与声旁组成，形旁表示大致的字义或字义的类属，声旁提示字的读音或近似的读音。","w":"high","e":["2011 真题","2016 真题","2020 真题"]},{"t":"字体","y":"名词解释","p":["字体指的是同一种文字的各种不同体式。","例如汉字的楷书、行书、草书，印刷的宋体、仿宋体、楷体、黑体等。","至于书法艺术上的种种字体，例如欧体、颜体、柳体，指的是书法的派别，又称“书体”，不属于严格文字学的范围。"],"q":"字体指的是同一种文字的各种不同体式。","w":"high","e":["2013 真题","2019 真题"]},{"t":"隶变","y":"名词解释","p":["由甲骨文、金文发展到小篆，是一个简化的过程。小篆又简化为隶书，隶书又简化为草书和楷书，楷书又跟草书结合为行书。","隶变在字体演变史上的地位最为重要，它是古今汉字的分水岭。","汉字字体演变的总趋势是由繁难变为简易。"],"q":"由甲骨文、金文发展到小篆，是一个简化的过程。小篆又简化为隶书，隶书又简化为草书和楷书，楷书又跟草书结合为行书。","w":"high","e":["2015 真题","2021 真题"]},{"t":"现代汉字","y":"名词解释","p":["现代汉字指现阶段正在使用的汉字，它记录的主要对象是现代汉语，与传统汉字相对应。","判断一种文字符号体系的性质，首要的是研究这种文字与它所记录的语言之间的关系。","考察现代汉字的特点，还必须跟拼音文字符号体系进行比较。"],"q":"现代汉字指现阶段正在使用的汉字，它记录的主要对象是现代汉语，与传统汉字相对应。","w":"high","e":["2013 真题","2019 真题"]},{"t":"意音文字","y":"名词解释","p":["汉字记录汉语则兼用三种方法，即从义入手、从音入手或同时从音义入手。","汉字是一种兼顾意音的文字，可以简称为“意音文字”。","汉字绝大多数都是兼用表音和表义的方法，所以形声字约占全部汉字的90%左右。","现代汉字的意符和音符所起的表义标音作用已经有限。"],"q":"汉字记录汉语则兼用三种方法，即从义入手、从音入手或同时从音义入手。汉字是一种兼顾意音的文字，可以简称为“意音文字”。","w":"high","e":["2015 真题"]},{"t":"语素文字","y":"名词解释","p":["从汉字符号记录语言的单位来看，现代汉字是一种语素文字。","表音文字根据文字所记录的语言单位的不同，可以分为音素文字和音节文字两种类型。","汉字在记录语言时，利用了语素音义兼顾的特点，用能产性极强的形声字分别记录语素意义所属的类别和语素的音节。"],"q":"从汉字符号记录语言的单位来看，现代汉字是一种语素文字。","w":"high","e":["2018 真题"]},{"t":"多部件字","y":"名词解释","p":["多部件字主要有三类：合成意符字、意符音符字、合成记号字。","合成意符字由两个或两个以上意符构成，从现代汉字字形看，可以说是合字表义。","意符音符字由意符和音符构成，从意符可以大致知道字义的类别，从音符可以大致读出字音。","合成记号字组合成字的部件都是既不表示字音又不表示字义的记号。"],"q":"多部件字主要有三类：合成意符字、意符音符字、合成记号字。","w":"high","e":["2017 真题"]},{"t":"辨析“造字法”与“用字手段”。","y":"名词解释","p":["造字法：象形、指事、会意、形声四种","用字手段：假借、转注两种","区别：造字法使字形从无到有，用字手段借用已有字形"],"q":"造字法，通常采用传统的“六书”来分析，“六书”是指象形、指事、会意、形声、假借、转注。目前主流看法认为假借、转注是用字手段，象形、指事、会意、形声才是造字方法。二者的区别在于：造字法解决一个字形如何从无到有地造出来，包括象形、指事、会意、形声四种；用字手段是借用已有的字形去记录别的语词，包括假借和转","w":"high","e":["2011 真题"]},{"t":"试论述现代汉字的性质与基本特点。","y":"名词解释","p":["判断文字性质要研究文字与所记录语言的关系","现代汉字是一种意音文字（兼用三种方法）","现代汉字基本上是一种语素文字","现代汉字在形体上呈现为方块形式","总论：兼表意音的语素文字"],"q":"现代汉字指现阶段正在使用的汉字，它记录的主要对象是现代汉语，与传统汉字相对应。判断一种文字符号体系的性质，首要的是研究这种文字与它所记录的语言之间的关系；考察现代汉字的特点，还必须跟拼音文字符号体系进行比较。现代汉字的基本特点有三：(一)现代汉字是一种意音文字。汉字记录汉语兼用三种方法：从义入手，用","w":"high","e":["2011 真题","2016 真题"]},{"t":"指事","y":"名词解释","p":["用抽象符号来提示字义。","这类字可以分两种：1.纯符号的；2.在具体事物的图形上添加抽象符号。","这种方法造的汉字局限性很大，所以字数极少，纯符号的指事字更少。"],"q":"用抽象符号来提示字义。","w":"high","e":["教材高频"]},{"t":"意符","y":"名词解释","p":["凡是跟整字在意义上有联系的部件，称为“意符”。","对现代汉字构形成分进行分析，得到的是构字部件；构字部件的属性，指的是部件跟整字在音义上的关系，这可以分为三类：意符、音符和记号。","汉字的意符，也叫形旁，在传递语义信息上的功能，是单纯的表音文字所不具备的。"],"q":"凡是跟整字在意义上有联系的部件，称为“意符”。","w":"high","e":["教材高频"]},{"t":"音符","y":"名词解释","p":["凡是跟整字在读音上有联系的部件，称为“音符”。","汉字的音符，也叫声旁，同表音文字的音符有很大的区别。","前者是非专职的，是借用本来既有音又有义的现成字符充当的，而后者则是专职的。","现代汉字中音符的数量很多，超过一千个。"],"q":"凡是跟整字在读音上有联系的部件，称为“音符”。","w":"high","e":["教材高频"]},{"t":"记号","y":"名词解释","p":["凡是跟整字在意义和读音上都没有联系的部件，称为“记号”。","单部件字有：意符字和记号字；多部件字主要有三类：合成意符字、意符音符字、合成记号字。","组合成字的部件都是既不表示字音又不表示字义的记号。"],"q":"凡是跟整字在意义和读音上都没有联系的部件，称为“记号”。","w":"high","e":["教材高频"]},{"t":"楷书","y":"名词解释","p":["楷书是现代通行的汉字手写正体字，也叫正楷。“楷”是楷模、法式的意思。","楷书笔画分明，笔形规整，结构端庄，字形方正，是汉字的标准字体。","现代汉字手写体主要有楷书、草书、行书等三种。"],"q":"楷书是现代通行的汉字手写正体字，也叫正楷。“楷”是楷模、法式的意思。","w":"high","e":["教材高频"]},{"t":"方块字","y":"名词解释","p":["汉字是一种平面性文字，它的构成成分是从横和纵展开，形成平面布局。","在一个平面内，不管有多少个构成成分都要均衡地分布在方方正正的框架里，呈现为方块形式，所以汉字又叫作“方块字”。","汉字从隶书发展为楷书，形象性减弱，符号性加强。"],"q":"汉字是一种平面性文字，它的构成成分是从横和纵展开，形成平面布局。","w":"high","e":["教材高频"]},{"t":"单部件字","y":"名词解释","p":["根据现代汉字构字部件的数量，可以把现代汉字字形分为单部件字和多部件字两大类；单部件字有：意符字和记号字。","由一个意符单独构成，从现代汉字的字形上就可以大致读出字义，这是意符字。","由一个记号单独构成，从现代汉字的字形上，既不能知道读音，也不能读出字义，这是记号字。"],"q":"根据现代汉字构字部件的数量，可以把现代汉字字形分为单部件字和多部件字两大类；单部件字有：意符字和记号字。","w":"high","e":["教材高频"]},{"t":"辨析“汉字的意符”与“汉字的音符”。","y":"名词解释","p":["意符：跟整字意义上有联系的部件，也叫形旁","音符：跟整字读音上有联系的部件，也叫声旁","意符表义，音符表音，二者在形声字中互补","汉字音符非专职、数量多"],"q":"凡是跟整字在意义上有联系的部件，称为“意符”；凡是跟整字在读音上有联系的部件，称为“音符”。汉字的意符也叫形旁，在传递语义信息上的功能，是单纯的表音文字所不具备的；尽管绝大多数意符只能提示语义的类别或范围，但现代汉字的意符反映了字义的系统性。汉字的音符也叫声旁，同表音文字的音符有很大的区别：前者是非","w":"normal","e":["核心概念"]},{"t":"【原文】[ε]前半低不圆唇舌面元","y":"教材原文","p":["[ε]前半低不圆唇舌面元音","出现在i和n之间，如“烟、鞭、尖、冤、捐、宣”等字的韵母 ian、üan 里做主要元音"],"q":"[ε]前半低不圆唇舌面元音。出现在i和n之间，如“烟、鞭、尖、冤、捐、宣”等字的韵母 ian、üan 里做主要元音。","w":"normal","e":["原书正文"]},{"t":"【原文】2. /x/的主要音位变","y":"教材原文","p":["2. /x/的主要音位变体有[x]、[ə][x]后半高不圆唇舌面元音","出现在e韵母中，如“哥、遮”等字的韵母的元音","也出现在韵尾-ng前，充当 eng、ueng韵母的主要原音，如“灯”“翁”等字主要元音"],"q":"2. /x/的主要音位变体有[x]、[ə][x]后半高不圆唇舌面元音。出现在e韵母中，如“哥、遮”等字的韵母的元音。也出现在韵尾-ng前，充当 eng、ueng韵母的主要原音，如“灯”“翁”等字主要元音。","w":"normal","e":["原书正文"]},{"t":"【原文】[ə]央中不圆唇舌面元音","y":"教材原文","p":["[ə]央中不圆唇舌面元音","出现在“分、恩、温、滚”等字的韵母 en、uen中做主要元音","也出现于助词“的”“地”“得”轻声音节韵母中充当主要元音"],"q":"[ə]央中不圆唇舌面元音。出现在“分、恩、温、滚”等字的韵母 en、uen中做主要元音。也出现于助词“的”“地”“得”轻声音节韵母中充当主要元音。","w":"normal","e":["原书正文"]},{"t":"【原文】3. /ə/音位的音位变","y":"教材原文","p":["3. /ə/音位的音位变体有[ɔ']和[er][ə']央中卷舌元音，出现在 er音节阳平、上声音节中","如“儿、耳”等字的元音"],"q":"3. /ə/音位的音位变体有[ɔ']和[er][ə']央中卷舌元音，出现在 er音节阳平、上声音节中。如“儿、耳”等字的元音。","w":"normal","e":["原书正文"]},{"t":"【原文】[ver]次低卷舌元音，","y":"教材原文","p":["[ver]次低卷舌元音，出现在er音节去声中","如“二”字的元音"],"q":"[ver]次低卷舌元音，出现在er音节去声中。如“二”字的元音。","w":"normal","e":["原书正文"]},{"t":"【原文】(三)普通话声调音位辅音","y":"教材原文","p":["(三)普通话声调音位辅音音位和元音音位都是由音素成分构成的对立，音素之间的差异是音值，所以一般把辅音音位和元音音位称为音色音位","由于它们出现在语流中固定的音段上，所以又叫音段音位","声调的差异是音高起落的不同，例如普通话中的“妈”mā、“麻”má、“马”mǎ、“骂”mà四者的不同只在声调，可见汉语声调有区别意义的功能，也是一种音位体现"],"q":"(三)普通话声调音位辅音音位和元音音位都是由音素成分构成的对立，音素之间的差异是音值，所以一般把辅音音位和元音音位称为音色音位。由于它们出现在语流中固定的音段上，所以又叫音段音位。声调的差异是音高起落的不同，例如普通话中的“妈”mā、“麻”má、“马”mǎ、“骂”mà四者的不同只在声调，可见汉语声调有区别意义的功能，也是一种音位体现。","w":"normal","e":["原书正文"]},{"t":"【原文】普通话音系中有阴平、阳平","y":"教材原文","p":["普通话音系中有阴平、阳平、上声、去声四个声调，调值分别是55、35、214、51，且都能承担区别意义的功能，所以同样能归纳出四个不同的音位，简称“调位”："],"q":"普通话音系中有阴平、阳平、上声、去声四个声调，调值分别是55、35、214、51，且都能承担区别意义的功能，所以同样能归纳出四个不同的音位，简称“调位”：","w":"normal","e":["原书正文"]},{"t":"【原文】/55/、/35/、/2","y":"教材原文","p":["/55/、/35/、/214/、/51/调位不是音素的音值差异所形成的对立，所以“调位”属于非音色音位或超音段音位"],"q":"/55/、/35/、/214/、/51/调位不是音素的音值差异所形成的对立，所以“调位”属于非音色音位或超音段音位。","w":"normal","e":["原书正文"]}]},{"id":"xdhy_up-c02-s02","t":"第二节 现代汉字的字形","w":"high","n":20,"k":[{"t":"笔画","y":"名词解释","p":["笔画是构成楷书字形的最小单位。","就书写过程而言，笔画是有起止的线条，从落笔到下一次提笔的过程中写出的点和线就叫一笔或一画。","在不同的字体中，笔画的表现形式可能不完全相同。","这里所说的笔画是以印刷体的主流字体宋体、楷体作为分析对象的。"],"q":"笔画是构成楷书字形的最小单位。","w":"high","e":["2012 真题","2018 真题"]},{"t":"笔顺","y":"名词解释","p":["书写汉字时笔画的走向和次序叫作笔顺。","笔顺包括两方面内容：一是笔画的走向，也有人称“笔势”，例如横（一）是从左到右，竖（丨）是从上到下；二是笔画出现的先后次序，也有人称“笔序”。","笔势和笔序合起来称为笔顺。"],"q":"书写汉字时笔画的走向和次序叫作笔顺。","w":"high","e":["2014 真题","2020 真题"]},{"t":"部件","y":"名词解释","p":["部件是由笔画组成的、能独立运用的、具有组配汉字功能的构字单位。","部件也可以看作是对整字进行一次或几次切分后得出来的构字单位。","大多数部件是由一些笔画组合成的“构件”，它们可以独立运用；有少数部件本身就是一个字；也有少数部件本身就是一个笔画。"],"q":"部件是由笔画组成的、能独立运用的、具有组配汉字功能的构字单位。","w":"high","e":["2013 真题","2019 真题"]},{"t":"偏旁","y":"名词解释","p":["偏旁就是用二
