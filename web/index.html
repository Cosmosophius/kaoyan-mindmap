列材料、堆砌事实，缺少分析概括，没有总结出规律来；也可能只是生搬硬套国外理论。","小王的研究没有综合运用多种科学研究方法，应运用观察法、调查法、实验法、个案研究法、相关分析法、话语分析法等。","遵循“重视数学方法，定性研究与定量研究相结合”的原则，获取客观数据。","改进建议：采用实验法，先提出假说，进行精确的实验设计，控制自变量和非研究变量；结合个案研究法进行纵向跟踪研究；采用相关分析法等。"],"q":"小王的研究设计存在以下问题：(1)违反了“从实践出发，理论联系实践”的方法论原则。强调实践的观点并不意味着忽视理论的深度，科学研究不能只是现象和过程的描述或说明，而是要在研究事实的基础上，找出规律性的东西，通过揭示较深层次的规律来解决实践中的问题。小王“根据自己平时上课的感受写一篇论文，结合几篇国外文献，把自己的经验和","w":"normal","e":["核心考点"]}]}]}]},{"d":"xdhy_up","t":"现代汉语通论（上册）","c":[{"id":"xdhy_up-c01","t":"第一章 语音","w":"high","s":[{"id":"xdhy_up-c01-s01","t":"第一节 现代汉语语音概述","w":"high","n":33,"k":[{"t":"语音","y":"名词解释","p":["由人的发音器官发出","不同的语音代表不同的意义","作用是进行社会交际，具有“社会”的属性"],"q":"语音是指人类通过发音器官发出来的、具有一定意义的、目的是用来进行社会交际的声音。语音具有三大属性：发音的生理属性、物理属性（音高、音强、音长、音色）和社会属性。其中社会属性是语音最重要的特点，是世界上其他任何声音所不具备的属性。社会属性主要表现为三点：①约定俗成；②系统性；③语音具备一定的民族特征和地域特征。不同语言的","w":"high","e":["2016 真题","2020 真题"]},{"t":"音高","y":"名词解释","p":["就是声音的高低","决定于发音体振动的频率","取决于声带紧张的程度"],"q":"音高就是声音的高低，音高决定于发音体振动的频率，即取决于声带紧张的程度。作为语音物理属性四要素（音高、音强、音长、音色）之一，音高在汉语中具有区别意义的作用，是构成声调的基础。声带越紧，振动频率越高，声音就越高；声带越松，声音越低。","w":"high","e":["2013 真题"]},{"t":"音强","y":"名词解释","p":["就是声音的强弱","主要取决于发音体的振幅"],"q":"音强就是声音的强弱，主要取决于发音体的振幅。音强是语音物理属性的四要素之一，与音高、音长、音色并列。振幅越大，声音越强；振幅越小，声音越弱。普通话中的轻声，其物理表现之一即为音强减弱。","w":"high","e":["2013 真题"]},{"t":"音长","y":"名词解释","p":["就是声音的长短","决定于发音体振动持续时间的长短"],"q":"音长就是声音的长短，它决定于发音体振动持续时间的长短。音长是语音物理属性的四要素之一。普通话中，音长对区别意义的作用不如音高重要，但在轻声、语气等方面有表现。上声在语流中常常变短，轻声音节也明显短于一般音节。","w":"normal","e":["核心考点"]},{"t":"音色（音值）","y":"名词解释","p":["又叫音值","指具体发出来的音素","主要取决于发声与共鸣的形式"],"q":"音色又叫音值，在语音学上是指具体发出来的音素，主要取决于发声与共鸣的形式。音色是语音物理属性的四要素之一。音素可以从音色（音值）角度划分出来，因此音色是区分不同音素的主要依据。同一个音高、音强的[i]和[u]之所以不同，就是音色不同。","w":"high","e":["2015 真题"]},{"t":"社会属性","y":"名词解释","p":["语音最重要的特点","世界上其他任何声音所不具备","约定俗成","系统性","民族特征和地域特征"],"q":"语音的社会属性是语音最重要的特点，是世界上其他任何声音所不具备的属性。其特点主要有三个：①约定俗成——单纯的声音并无语言价值，只有跟一定的社会意义结合起来的声音才能成为语音；②系统性——系统内所包含的音素数目及其相互关系是有序的；③语音具备一定的民族特征和地域特征。系统性示例：英语共有24个辅音、21个元音，没有声调；","w":"high","e":["2014 真题","2018 真题","2022 真题"]},{"t":"《汉语拼音方案》","y":"名词解释","p":["用拉丁字母拼写现代汉语普通话语音的方案","基本功能是解决汉字、词语等语言单位的规范读音与拼写","专门为普通话读音设计，只适用于普通话"],"q":"《汉语拼音方案》是一个用拉丁字母拼写现代汉语普通话语音的方案，其基本功能是帮助解决汉字、词语等语言单位的规范读音与拼写。从这个意义上说，它是专门为普通话读音而设计的一套语音注读方案，而且只适用于普通话。方案共分字母表、声母表、韵母表及说明、声调符号、隔音符号五部分。方案使用“-、ˊ、ˇ、`”分别表示“阴平、阳平、上声、","w":"high","e":["2011 真题","2017 真题"]},{"t":"简述语音跟自然界其他声音的区别。","y":"简答题","p":["由人的发音器官发出来的","不同的语音代表不同的意义","作用在于社会交际，具有“社会”的属性"],"q":"语音跟自然界其他声音的区别有三：第一，语音是由人的发音器官发出来的；第二，不同的语音代表不同的意义；第三，其作用在于社会交际，具有“社会”的属性。","w":"high","e":["2015 真题"]},{"t":"语音具有哪三个重要属性？其物理属性包括哪四个要素？","y":"简答题","p":["物理属性、生理属性与社会属性","音高、音强、音长、音色（音值）四个要素"],"q":"语音具有三个重要属性：物理属性、生理属性与社会属性。物理属性方面，语音具备音高、音强、音长、音色（音值）四个要素。","w":"high","e":["2010 真题","2016 真题"]},{"t":"简述语音的社会属性主要表现在哪几方面。","y":"简答题","p":["约定俗成","系统性","语音具备一定的民族特征和地域特征"],"q":"（1）约定俗成。单纯的声音并无语言价值，只有跟一定的社会意义结合起来的声音才能成为语音；语音的形式和意义间没有必然的联系，同一个声音在不同的语言社会中往往表示不同的意义；用什么样的语音形式来表达什么样的内容不是个人的意志，完全是语言社会成员约定俗成的结果。（2）系统性。每一种语言的语音都有自己的一套相对独立的系统，内部","w":"high","e":["2014 真题","2018 真题","2022 真题"]},{"t":"简述人的发音器官包括哪几部分。","y":"简答题","p":["呼吸器官","发声器官","共鸣器官"],"q":"人的发音器官包括：呼吸器官、发声器官和共鸣器官三大部分。（1）呼吸器官主要由肺、支气管、气管组成，肺是语音发音气流产生的动力器官；（2）发声器官包括喉头和声带；（3）共鸣器官主要包括喉腔、咽腔、鼻腔和口腔四部分。","w":"high","e":["2010 真题","2014 真题"]},{"t":"简述《汉语拼音方案》的组成部分及制订、通过的时间。","y":"简答题","p":["字母表、声母表、韵母表及说明、声调符号、隔音符号五部分","1955年由国务院批准设计","1958年2月11日经第一届全国人民代表大会第五次会议审议通过"],"q":"《汉语拼音方案》共分字母表、声母表、韵母表及说明、声调符号、隔音符号五部分。该方案1955年由国务院批准设计，1958年2月11日经第一届全国人民代表大会第五次会议审议通过。","w":"high","e":["2013 真题"]},{"t":"简述语音的系统性主要表现在哪几个方面。","y":"简答题","p":["音素数目及其相互关系是有序的","同一音素在不同语音系统中功能和地位不同","系统性是语音内部规则的体现"],"q":"（1）系统内所包含的音素数目及其相互关系是有序的，例如英语共有24个辅音、21个元音、没有声调；汉语普通话有21个辅音声母、39个韵母、四个声调。（2）即使是彼此共有的同一个音素，在不同的语音系统中的功能和地位也并不一样。系统性是语音内部规则的体现。","w":"normal","e":["核心考点"]},{"t":"有人认为语音的物理属性和生理属性也是语音的重要特点，也有人认为只有社会属性才是语音的本质属性。请结合教材观点谈谈你的看法。","y":"辨析题","p":["语音具有物理属性、生理属性与社会属性三个重要属性","音高音强音长音色为所有发声体共有","生理属性非人类语音独有","只有社会属性是人类语言独有，是本质属性","社会属性体现在约定俗成、系统性、民族与地域特征"],"q":"（一）语音具有物理属性、生理属性与社会属性三个重要属性。（二）物理属性是就发音体发音的特点而言，语音同样具备音高、音强、音长、音色（音值）四个要素；生理属性方面，语音是由人的发音器官发出来的，发音器官活动的部位和方法不同，都会造成不同的声音。（三）但是，音高、音强、音长、音色（音值）是所有发声体共有的特征，生理属性也不","w":"high","e":["2012 真题","2019 真题","2023 真题"]},{"t":"试述《汉语拼音方案》的产生背景、内容及使用影响。","y":"论述题","p":["汉字表意体系，无法直接读出字音","注音字母不是音素标音，不能与国际接轨","五部分内容与1955、1958两个时间","应用于教育、工具书、少数民族文字","联合国与ISO国际标准"],"q":"（一）产生背景：汉字是表意体系的文字，从字形上无法直接读出字音。古人曾使用过“直音”“读若”或“反切”等注音法，但用来注读的仍然是汉字；此后又产生了一套“注音字母”，但因不是音素标音，也没采用拉丁字母符号，仍不能准确地反映规范语音的面貌，也无法与国际通用的拼音符号接轨，因此《汉语拼音方案》的诞生就成了势在必行。（二）内","w":"high","e":["2017 真题"]},{"t":"在区别语义作用上，语音关注的是绝对音高。","y":"判断题","p":["错误","语音注重的是相对音高"],"q":"×。原文指出：不同的言语者、不同的语境下，每个人均有自己成规律的相对音高显示，并不影响彼此间的说话与传意。可见语音注重的是“相对音高”。","w":"high","e":["2010 真题","2015 真题"]},{"t":"语音共鸣腔分口腔、鼻腔与咽腔。","y":"判断题","p":["错误","共鸣器官包括喉腔、咽腔、鼻腔和口腔四部分"],"q":"×。原文指出：共鸣器官主要包括喉腔、咽腔、鼻腔和口腔四部分。题干漏掉了“喉腔”。","w":"high","e":["2013 真题"]},{"t":"“音高”指振动体的振动频率，音长指振动体振动的幅度。","y":"判断题","p":["错误","音长取决于振动持续时间，取决于振幅的是音强"],"q":"×。原文指出：音高就是声音的高低，音高决定于发音体振动的频率；音长就是声音的长短，它决定于发音体振动持续时间的长短。题干将“音长”与“音强”混淆。","w":"normal","e":["核心考点"]},{"t":"语音的“音色”就像笛子与胡琴的不同，主要指声音的色彩。","y":"判断题","p":["错误","语音学上的音色指具体发出来的音素","主要取决于发声与共鸣的形式"],"q":"×。原文指出：音色又叫音值，在语音学上是指具体发出来的音素，主要取决于发声与共鸣的形式。语音学关心的是发音方法与共鸣方法的不同而形成的不同音色（音值），以表示不同的意义。题干只取“声音的特色”这一传统意义，未指明语音学的界定。","w":"normal","e":["核心考点"]},{"t":"语音具有三个重要属性：______、______与______。","y":"填空题","p":["物理属性","生理属性","社会属性"],"q":"物理属性、生理属性、社会属性","w":"high","e":["2011 真题","2016 真题"]},{"t":"人的发音器官包括：______、______和______三大部分。","y":"填空题","p":["呼吸器官","发声器官","共鸣器官"],"q":"呼吸器官、发声器官、共鸣器官","w":"high","e":["2010 真题","2014 真题"]},{"t":"语音的发音体是人的______；肺是语音发音气流产生的______器官。","y":"填空题","p":["声带","动力"],"q":"声带；动力","w":"high","e":["2018 真题"]},{"t":"语音的四个物理要素是音高、音强、______和______。","y":"填空题","p":["音长","音色（音值）"],"q":"音长、音色（音值）","w":"high","e":["2016 真题"]},{"t":"口腔中的上腭主要由______、上齿、上齿龈、硬腭、______和小舌六部分组成。","y":"填空题","p":["上唇","软腭"],"q":"上唇；软腭","w":"normal","e":["核心考点"]},{"t":"舌头可以分为______、______和______三部分。","y":"填空题","p":["舌尖","舌面","舌根"],"q":"舌尖、舌面、舌根","w":"normal","e":["核心考点"]},{"t":"语音的发音体是（　　）。","y":"单项选择题","p":[],"q":"A","w":"high","e":["2012 真题","2017 真题"]},{"t":"下列各项中，不属于语音物理属性四要素的是（　　）。","y":"单项选择题","p":[],"q":"C","w":"high","e":["2015 真题"]},{"t":"下列关于语音四要素的表述，正确的一项是（　　）。","y":"单项选择题","p":[],"q":"C","w":"normal","e":["核心考点"]},{"t":"《汉语拼音方案》共分五部分，下列不属于其组成部分的是（　　）。","y":"单项选择题","p":[],"q":"C","w":"high","e":["2013 真题"]},{"t":"语音区别于其他一切声音的本质属性是（　　）。","y":"单项选择题","p":[],"q":"C","w":"high","e":["2014 真题","2020 真题"]},{"t":"试从“语音的社会属性”角度，分析为什么同一读音在不同语言中可以表示不同的意义。","y":"分析题","p":["语音的形式和意义间没有必然的联系","同一声音在不同语言社会中表示不同意义","同一内容可用不同语音形式表达","完全是语言社会成员约定俗成的结果"],"q":"依据原文：语音的形式和意义间没有必然的联系，同一个声音在不同的语言社会中往往表示不同的意义，如[iaŋ]在汉语中表示“羊”，在英语中表示“年轻”(young)；同样的内容在不同的语言社会里往往可用不同的语音形式来表达，如汉语普通话把装订成册的著作称为“书”，英语为 book[buːk]。这说明用什么样的语音形式来表达什","w":"high","e":["2021 真题"]},{"t":"人发出的所有声音是否都是语音？为什么？","y":"分析题","p":["不是所有声音都是语音","语音须具有一定意义","语音的目的是进行社会交际","没有约定俗成意义的声音不是语音"],"q":"不是。原文指出：语音是指人类通过发音器官发出来的、具有一定意义的、目的是用来进行社会交际的声音。语音跟自然界其他声音的区别有三：第一，语音是由人的发音器官发出来的；第二，不同的语音代表不同的意义；第三，其作用在于社会交际，具有“社会”的属性。人发出的一些声音（如打鼾声）没有约定俗成的意义，因此不是语音。","w":"high","e":["2012 真题"]},{"t":"人发出的所有声音是否都是语音？为什么？","y":"分析题","p":["不是所有声音都是语音","语音须具有一定意义","语音的目的是进行社会交际","没有约定俗成意义的声音不是语音"],"q":"不是。原文指出：语音是指人类通过发音器官发出来的、具有一定意义的、目的是用来进行社会交际的声音。语音跟自然界其他声音的区别有三：第一，语音是由人的发音器官发出来的；第二，不同的语音代表不同的意义；第三，其作用在于社会交际，具有“社会”的属性。人发出的一些声音（如打鼾声）没有约定俗成的意义，因此不是语音。","w":"high","e":["2012 真题"]}]},{"id":"xdhy_up-c01-s02","t":"第二节 音节分析：元音和辅音","w":"high","n":25,"k":[{"t":"音节","y":"名词解释","p":["人们听感容易分辨出来的最小语音片断","发音肌肉经历一次从紧张到松弛的过程","听感上有一个明显的响度中心","普通话除儿化音外一个汉字读音就是一个音节"],"q":"音节是人们听感容易分辨出来的最小语音片断。从发音角度来说，每个音节的发音肌肉均经历了一次从紧张到松弛的过程；从听感角度来说，每一个音节都有一个明显的响度中心。普通话除儿化音音节外，一个汉字的读音就是一个音节。“现代汉语”四个汉字读出来就是[sian⁵¹ tai⁵¹ xan⁵¹ y³⁵]四个音节。","w":"high","e":["2013 真题","2019 真题"]},{"t":"音素","y":"名词解释","p":["从音色（音值）角度划分","最小语音单位"],"q":"音素是从音色（音值）角度划分出来的最小语音单位。音素是语音的最小单位，它从音色角度划分，不考虑音高、音强、音长等因素的变化。汉语音节 ma 由 m 和 a 两个音素构成；英语 big 由 b、i、g 三个音素构成。","w":"high","e":["2015 真题","2021 真题"]},{"t":"元音","y":"名词解释","p":["气流振动声带","发音部位不受阻碍","又叫母音","主要功能是构成音节的韵母"],"q":"元音是指发音时气流振动声带，发音部位不受阻碍而形成的音。元音又叫母音。元音的主要功能是构成音节的韵母。普通话的 a、o、e、i、u、ü 等均为元音。","w":"high","e":["2012 真题","2018 真题"]},{"t":"辅音","y":"名词解释","p":["气流在发音部位受到明显的阻碍","又叫子音","主要功能是担当声母或韵尾"],"q":"辅音是指发音时气流在发音部位受到明显的阻碍而形成的音。辅音又叫子音。辅音的主要功能是担当音节的声母或韵母的韵尾。普通话里的22个辅音有21个可以用来作声母。普通话的 b、p、m、f、d、t、n、l 等均为辅音。","w":"high","e":["2012 真题","2018 真题"]},{"t":"舌位","y":"名词解释","p":["舌头收紧隆起的发音部位"],"q":"元音发音时，舌头的某个部位会收紧隆起，舌头收紧隆起的发音部位称作“舌位”。舌位是描写和区分元音的重要参数，与唇形的圆展、口腔的开合共同构成元音分类的三个维度。发[i]时舌位高而前，发[a]时舌位低而前，发[u]时舌位高而后。","w":"high","e":["2018 真题"]},{"t":"简述元音与辅音的主要差异（四点）。","y":"简答题","p":["是否受阻碍","声带是否一定振动","肌肉紧张状态（均衡/局部）","气流强弱"],"q":"元音与辅音的主要差异有四点：（1）元音发音时，气流通过发音部位不受阻碍；辅音发音时，气流通过发音部位时受到明显的阻碍。（2）元音发音时，声带一定振动，声音总是比较响亮，并且能延长；辅音发音时，声带不一定振动。（3）元音发音时，发音器官肌肉保持均衡的紧张状态；辅音发音时，发音器官肌肉局部（成阻部位）紧张。（4）元音发音时","w":"high","e":["2011 真题","2016 真题","2022 真题"]},{"t":"按成阻和除阻的方式，普通话辅音可分为哪几类？各有多少个？","y":"简答题","p":["塞音6个","擦音6个","塞擦音6个","鼻音3个","边音1个"],"q":"按成阻和除阻的方式，普通话的辅音可分为5类：（1）塞音，共有6个：b[p]、p[p']、d[t]、t[t']、g[k]、k[k']；（2）擦音，共有6个：f[f]、s[s]、sh[s]、r[z]、x[c]、h[x]；（3）塞擦音，共有6个：z[ts]、c[ts']、zh[ts]、ch[ts']、j[tɕ]、q[tɕ']","w":"high","e":["2012 真题","2018 真题"]},{"t":"普通话辅音按声带振动与否可分为哪几类？各包括哪些音？","y":"简答题","p":["清音：声带不振动，共17个","浊音：声带振动，共5个（m、n、ng、l、r）"],"q":"按声带振动与否，普通话的辅音可以分为清音、浊音两类。（1）清音：发音时声带不振动的辅音叫清音，共有17个：b[p]、p[p']、f[f]、d[t]、t[t']、g[k]、k[k']、h[x]、j[tɕ]、q[tɕ']、x[ɕ]、zh[ts]、ch[ts']、sh[s]、z[ts]、c[ts']、s[s]。（2）浊音：发","w":"high","e":["2013 真题","2019 真题"]},{"t":"普通话辅音按发音时呼出气流的强弱可分为哪几类？各包括哪些音？","y":"简答题","p":["不送气音6个：b、d、g、j、zh、z","送气音6个：p、t、k、q、ch、c"],"q":"按发音时呼出气流的强弱，普通话辅音可以分为不送气、送气两类。（1）不送气音：发音时吐出气流较弱的音称为不送气音，共有6个：b[p]、d[t]、g[k]、j[tɕ]、zh[ts]、z[ts]。（2）送气音：发音时呼出气流较强的音称为送气音，共有6个：p[p']、t[t']、k[k']、q[tɕ']、ch[ts']、c[t","w":"high","e":["2014 真题","2020 真题"]},{"t":"元音发音声带一定振动；辅音发音声带一定不振动。","y":"判断题","p":["错误","辅音发音时声带不一定振动","浊辅音声带振动"],"q":"×。原文指出：元音发音时，声带一定振动，声音总是比较响亮，并且能延长；辅音发音时，声带不一定振动（清辅音不振动，浊辅音振动）。","w":"high","e":["2013 真题","2018 真题"]},{"t":"辅音的发音方法分塞音、塞擦音、擦音、鼻音、边音五种。","y":"判断题","p":["错误","发音方法包括成阻除阻方式、声带振动与否、气流强弱三方面","五类只是按成阻和除阻方式划分"],"q":"×。原文指出：发音方法应包括三个方面的内容：（1）成阻和除阻的方式；（2）声带振动与否；（3）呼出气流的强弱。塞音、塞擦音、擦音、鼻音、边音五类只是按“成阻和除阻的方式”划分的，并非发音方法的全部。","w":"normal","e":["核心考点"]},{"t":"普通话的音节总数只有______个左右。","y":"填空题","p":["400个左右"],"q":"400","w":"high","e":["2012 真题","2018 真题"]},{"t":"普通话里一个音节最多只能有______个音素。","y":"填空题","p":["四个"],"q":"四个","w":"high","e":["2013 真题","2019 真题"]},{"t":"辅音中可以充当声母和韵尾的是______，只能当韵尾而不能作声母的是______。","y":"填空题","p":["n既可作声母又可作韵尾","ng只能作韵尾"],"q":"n；ng","w":"high","e":["2015 真题","2021 真题"]},{"t":"下列辅音中，属于浊音的一组是（　　）。","y":"单项选择题","p":[],"q":"C","w":"high","e":["2014 真题","2020 真题"]},{"t":"普通话辅音中，边音只有（　　）个。","y":"单项选择题","p":[],"q":"A","w":"high","e":["2016 真题"]},{"t":"下列辅音中，属于塞擦音的是（　　）。","y":"单项选择题","p":[],"q":"C","w":"high","e":["2013 真题","2019 真题"]},{"t":"根据提供的发音条件，“双唇、浊、鼻音”对应的辅音是（　　）。","y":"单项选择题","p":[],"q":"B","w":"high","e":["2012 真题","2018 真题"]},{"t":"根据提供的发音条件，“舌面、送气、清、塞擦音”对应的辅音是（　　）。","y":"单项选择题","p":[],"q":"B","w":"high","e":["2015 真题","2021 真题"]},{"t":"根据提供的发音条件，“唇齿、清、擦音”对应的辅音是（　　）。","y":"单项选择题","p":[],"q":"B","w":"high","e":["2016 真题"]},{"t":"“央、低、不圆唇舌面元音”是（　　）。","y":"单项选择题","p":[],"q":"A","w":"high","e":["2014 真题"]},{"t":"现代汉语普通话舌面元音共有（　　）个。","y":"单项选择题","p":[],"q":"B","w":"high","e":["2017 真题"]},{"t":"卷舌元音er中的“r”表示（　　）。","y":"单项选择题","p":[],"q":"C","w":"normal","e":["核心考点"]},{"t":"试比较辅音l与n的发音区别。","y":"分析题","p":["n是鼻音，气流从鼻腔冲出","l是边音，气流从舌的两边通过","发音部位相同（舌尖中），发音方法不同"],"q":"l与n的区别在于发音方法不同：n是鼻音，成阻部位完全堵塞口腔气流通道，声带振动，让发音气流从鼻腔冲出形成鼻腔共鸣；l是边音，舌尖抵住上齿龈始终接触成阻，声带振动，让气流从舌的两边通过。二者发音部位相同（均为舌尖中），但发音方法不同。","w":"high","e":["2013 真题","2019 真题"]},{"t":"试比较辅音z与r的发音区别。","y":"分析题","p":["z是塞擦音，r是擦音","z是清音，r是浊音"],"q":"z与r都是舌尖后音，区别在于：z是塞擦音，发音部位先完全封闭，然后打开一条窄缝，让发音气流从中挤出，成阻时为塞音状态，除阻时为擦音状态；r是擦音，成阻部位不完全封闭气流通道，其间留有一条窄缝，让发音气流挤出窄缝摩擦成声。此外，z是清音（声带不振动），r是浊音（声带振动）。","w":"high","e":["2015 真题"]}]},{"id":"xdhy_up-c01-s03","t":"第三节 音节分析：声母和韵母","w":"high","n":25,"k":[{"t":"声母","y":"名词解释","p":["音节开头的辅音","普通话22个辅音有21个可作声母"],"q":"声母是指音节开头的辅音。普通话里的22个辅音有21个可以用来作声母。在教学中常常在声母的后边加上一个元音，实际上已组成了一个音节，以方便不同声母的称读，这就是呼读音。普通话 21 个辅音声母为 b、p、m、f、d、t、n、l、g、k、h、j、q、x、zh、ch、sh、r、z、c、s。","w":"high","e":["2014 真题","2020 真题"]},{"t":"零声母","y":"名词解释","p":["没有辅音开头的音节","韵母独自形成音节","y、w不是真正的声母，而是隔音字母"],"q":"零声母音节是指没有辅音开头的音节。某些音节并不需要辅音充当声母，而是韵母独自形成音节。汉语拼音中 y、w 两个字母只出现在零声母音节的开头，但它们不是真正的声母，而是起隔开音节作用的字母。“衣、乌、鱼、安、鹅”等字的读音都是零声母音节。","w":"high","e":["2016 真题","2022 真题"]},{"t":"韵母","y":"名词解释","p":["一个音节声母后面的部分","由元音或元音加鼻辅音构成","普通话共有39个韵母"],"q":"韵母是指一个音节声母后面的部分。韵母由元音或元音加鼻辅音构成。普通话共有39个韵母。普通话韵母可分为韵头、韵腹、韵尾三部分，其中“韵腹”是核心，是韵母必不可少的部分。普通话音节 lian 中，声母是 l，韵母是 ian，它由韵头 i、韵腹 a、韵尾 n 构成。","w":"high","e":["2011 真题","2017 真题"]},{"t":"韵腹","y":"名词解释","p":["韵母的主干，也指主要元音","位于韵头、韵尾之间","常由a、o、e、ê充当","韵母必不可少的部分"],"q":"韵腹指韵母的主干，也指主要元音。如果韵母还有韵头、韵尾，则韵腹位于这两者之间。韵腹常由 a、o、e、ê 充当；当没有 a、o、e、ê 时，可由 i、u、ü、-i、er 单独充当。韵腹是韵母必不可少的部分。在韵母 iao 中，i 是韵头、a 是韵腹、o 是韵尾；在韵母 en 中，e 是韵腹、n 是韵尾。","w":"high","e":["2013 真题","2019 真题"]},{"t":"韵头（介音）","y":"名词解释","p":["韵腹前的元音","又叫介音","只有i、u、ü3个元音可以充当"],"q":"韵头指韵腹前的元音，因它们介于声母与韵腹之间，又叫介音。普通话中的韵头只有 i、u、ü 3个元音可以充当。韵母 ia、ua、üan 中的 i、u、ü 都是韵头。","w":"high","e":["2015 真题","2021 真题"]},{"t":"韵尾","y":"名词解释","p":["韵腹后的元音或辅音","位于韵母的最后","表示主要元音发音时的滑动方向或归结所在","只能由i、u(o)和n、ng 4个音素充当"],"q":"韵尾指韵腹后的元音或辅音，它位于韵母的最后。韵尾在韵母中表示主要元音发音时的滑动方向或归结所在。普通话的韵尾只能由元音 i、u(o) 和鼻辅音 n、ng 4个音素充当。韵母 ai、ei 的韵尾是 i；ao、ou 的韵尾是 u(o)；an、en 的韵尾是 n；ang、eng 的韵尾是 ng。","w":"high","e":["2014 真题"]},{"t":"四呼","y":"名词解释","p":["开口呼、齐齿呼、合口呼、撮口呼","韵母的分类","有利于揭示声韵配合规律"],"q":"中国传统语音学把汉语的韵母分为四类：“开口呼”“齐齿呼”“合口呼”“撮口呼”，简称“四呼”。普通话声母与韵母的拼合有一定的选择性，不同的声母只与“四呼”中的某些韵母拼合，而不能与其他韵母拼合。“四呼”分类有利于揭示普通话声母和韵母的配合规律。1.开口呼：凡韵母开头的元音不是 i、u、ü 的均属于开口呼韵母，共16个；2","w":"high","e":["2012 真题","2016 真题","2022 真题"]},{"t":"撮口呼","y":"名词解释","p":["韵母以元音ü开头","共4个：ü、üe、üan、ün"],"q":"撮口呼指凡韵母以元音 ü 开头的均属于撮口呼韵母，共4个：ü、üe、üan、ün。撮口呼是“四呼”之一，与开口呼、齐齿呼、合口呼并列，是普通话声韵拼合规律的重要一环。撮口呼韵母 ü、üe、üan、ün 只能与 j、q、x、n、l 等少数声母相拼，如 ju（居）、que（缺）、xuan（宣）、jun（军）。","w":"high","e":["2025 真题"]},{"t":"呼读音","y":"名词解释","p":["在声母后边加上一个元音","已组成一个音节","方便不同声母的称读"],"q":"在教学中常常在声母的后边加上一个元音，实际上已组成了一个音节，以方便不同声母的称读，这就是呼读音。呼读音是针对声母“本音”（即辅音的实际发音）而言的，本音不便于称读，故教学上采用呼读音。b 的呼读音是 bo，p 的呼读音是 po，m 的呼读音是 mo，f 的呼读音是 fo。","w":"normal","e":["核心考点"]},{"t":"简述普通话声母呼读音的发音规律。","y":"简答题","p":["b、p、m、f后加o","d、t、n、l、g、k、h后加e","j、q、x后加i","zh、ch、sh、r后加舌尖后元音-i","z、c、s后加舌尖前元音-i"],"q":"（1）在b、p、m、f的后面加上元音o，读成“bo（玻）、po（坡）、mo（摸）、fo（佛）”。（2）在d、t、n、l、g、k、h的后面加上元音e，读成“de（得）、te（特）、ne（讷）、le（勒）、ge（哥）、ke（科）、he（喝）”。（3）在j、q、x的后面加上元音i，读成“ji（基）、qi（欺）、xi（希）”。","w":"high","e":["2015 真题","2021 真题"]},{"t":"简述普通话韵母的结构类型。","y":"简答题","p":["韵头、韵腹、韵尾三部分，韵腹是核心","六种结构类型"],"q":"普通话韵母可分为韵头、韵腹、韵尾三部分，其中“韵腹”是核心，是韵母必不可少的部分。韵母的结构大致有以下几种类型：（1）韵腹（元音），如衣yī、乌wū、鱼yú；（2）韵头+韵腹（元音+元音），如蛙wā、窝wō、牙yá、越yuè；（3）韵腹+韵尾（元音+元音），如爱ài、澳ào、欧ōu；（4）韵腹+韵尾（元音+辅音），如恩","w":"high","e":["2013 真题","2019 真题"]},{"t":"按结构特点，普通话韵母可划分为哪三类？各有多少个？","y":"简答题","p":["单元音韵母10个","复元音韵母13个","鼻韵母16个"],"q":"按结构特点，韵母可划分为三类：（1）单元音韵母：由一个元音构成的韵母叫单元音韵母，普通话单元音韵母有10个；（2）复元音韵母：由两个或三个元音组合而成的韵母叫复合元音韵母，共13个；（3）鼻韵母：由元音与鼻辅音n或者ng组合而成的韵母叫鼻韵母，共16个。","w":"high","e":["2014 真题","2020 真题"]},{"t":"简述“四呼”的分类及其各类所包括的韵母。","y":"简答题","p":["开口呼：开头元音不是i、u、ü，共16个","齐齿呼：以i开头，共10个","合口呼：以u开头，共9个","撮口呼：以ü开头，共4个"],"q":"中国传统语音学把汉语的韵母分为“开口呼”“齐齿呼”“合口呼”“撮口呼”四类，简称“四呼”。（1）开口呼：凡韵母开头的元音不是i、u、ü的均属于开口呼韵母，共16个：a、o、e、ê、ai、ei、ao、ou、an、ang、en、eng、ong、-i、-i、er。（2）齐齿呼：凡韵母以元音i开头的均属于齐齿呼韵母，共10个：","w":"high","e":["2012 真题","2016 真题","2022 真题"]},{"t":"所有的单元音都可以直接作韵母。","y":"判断题","p":["错误","舌尖元音不能单独成音节"],"q":"×。原文指出：舌尖元音不能单独成音节，舌尖前元音-i只出现在z、c、s声母后面；舌尖后元音-i只出现在zh、ch、sh、r声母后面。","w":"normal","e":["核心考点"]},{"t":"汉语拼音中y、w两个字母是真正的声母。","y":"判断题","p":["错误","y、w不是真正的声母","起隔开音节作用的字母"],"q":"×。原文指出：汉语拼音中y、w两个字母只出现在零声母音节的开头，但它们不是真正的声母，而是起隔开音节作用的字母。","w":"high","e":["2016 真题"]},{"t":"普通话里的22个辅音都可以用来作声母。","y":"判断题","p":["错误","22个辅音有21个可作声母","ng只能作韵尾不能作声母"],"q":"×。原文指出：普通话里的22个辅音有21个可以用来作声母；其中n还可以充当韵尾，第22个辅音是后鼻辅音ng，只能作韵尾，不能作声母。","w":"high","e":["2014 真题","2019 真题"]},{"t":"韵头可以由i、u、ü、a四个元音充当。","y":"判断题","p":["错误","韵头只有i、u、ü3个元音可以充当"],"q":"×。原文指出：普通话中的韵头只有i、u、ü3个元音可以充当。","w":"high","e":["2015 真题"]},{"t":"普通话的韵尾只能由元音i、u和非鼻辅音充当。","y":"判断题","p":["错误","韵尾只能由i、u(o)和n、ng4个音素充当"],"q":"×。原文指出：普通话的韵尾只能由元音i、u(o)和鼻辅音n、ng4个音素充当。","w":"normal","e":["核心考点"]},{"t":"普通话共有______个声母，______个韵母。","y":"填空题","p":["21个声母","39个韵母"],"q":"21；39","w":"high","e":["2011 真题","2017 真题","2022 真题"]},{"t":"韵母可分为韵头、______、韵尾三部分，其中______是核心，是韵母必不可少的部分。","y":"填空题","p":["韵腹","韵腹是核心"],"q":"韵腹；韵腹","w":"high","e":["2013 真题","2020 真题"]},{"t":"普通话的韵头只有______、______、______3个元音可以充当。","y":"填空题","p":["i、u、ü"],"q":"i、u、ü","w":"high","e":["2015 真题"]},{"t":"普通话单元音韵母有______个，复元音韵母有______个，鼻韵母有______个。","y":"填空题","p":["10个单元音韵母","13个复元音韵母","16个鼻韵母"],"q":"10；13；16","w":"high","e":["2014 真题"]},{"t":"“撮口呼”韵母指的是（　　）。","y":"单项选择题","p":[],"q":"C","w":"high","e":["2025 真题"]},{"t":"请判别下列音节韵母的“四呼”归属：zhi、er、jiang、wan、yun、ying、en、yuan。","y":"分析题","p":["开口呼：zhi、er、en","齐齿呼：jiang、ying","合口呼：wan","撮口呼：yun、yuan"],"q":"依据“四呼”定义：开口呼指韵母开头的元音不是i、u、ü的韵母，共16个；齐齿呼指韵母以元音i开头的韵母，共10个；合口呼指韵母以元音u开头的韵母，共9个；撮口呼指韵母以元音ü开头的韵母，共4个（ü、üe、üan、ün）。故：zhi为开口呼（-i舌尖后属开口呼）；er为开口呼；jiang为齐齿呼（iang）；wan为合口","w":"high","e":["2019 真题","2025 真题"]},{"t":"请从音色（音值）特点与音节的结构关系上说明普通话i[i]、-i（舌尖前）、-i（舌尖后）3个韵母的区别。","y":"分析题","p":["i[i]是舌面前、高、不圆唇元音","-i（舌尖前）为前、高、不圆唇舌尖元音","-i（舌尖后）为后、高、不圆唇舌尖元音","舌尖元音不能单独成音节，只出现在特定声母后"],"q":"依据原文：卷舌元音与舌尖元音的分类来看，i[i]是舌面前、高、不圆唇元音；-i（舌尖前）是前、高、不圆唇舌尖元音；-i（舌尖后）是后、高、不圆唇舌尖元音。从音节结构关系看，舌尖元音不能单独成音节，舌尖前元音-i只出现在z、c、s声母后面；舌尖后元音-i只出现在zh、ch、sh、r声母后面。","w":"high","e":["2016 真题"]}]},{"id":"xdhy_up-c01-s04","t":"第四节 普通话声调","w":"high","n":11,"k":[{"t":"声调","y":"名词解释","p":["音节读音的高低升降","区别意义的重要手段","汉语区别于其他语言的重要特征之一"],"q":"声调是指音节读音的高低升降。汉语是有声调的语言，声调是区别意义的重要手段，这是汉语区别于其他语言的重要特征之一。事(shì)——实(shí)、买(mǎi)——卖(mài)、收(shōu)——受(shòu)，均靠声调区别意义。","w":"high","e":["2013 真题","2019 真题"]},{"t":"调值","y":"名词解释","p":["音节读音高低、升降、曲折、长短的具体变化值"],"q":"调值是指音节读音高低、升降、曲折、长短的具体变化值。声调主要是凭着人们的听觉比较来判断不同音节高低升降的区别。通过对不同声调的起点、终点和高低变化的比较，寻找它们在模式上的相对差别。普通话阴平调值为55，阳平为35，上声为214，去声为51。","w":"high","e":["2014 真题","2020 真题"]},{"t":"调类","y":"名词解释","p":["声调的类别","把调值相同的音节归在一起","根据区别意义的不同声调调值建立","有多少个不同调值就有多少个调类"],"q":"调类是声调的类别，即把调值相同的音节归在一起所建立起来的类别。也就是说，调类是一种语言或方言中，根据能够区别意义的不同声调调值建立起来的类。一种语言或方言里有多少个不同声调调值，就有多少个调类。普通话有阴平、阳平、上声、去声四个调类；各方言调类数目不等，如粤语有九个调类。","w":"high","e":["2015 真题","2021 真题"]},{"t":"调型","y":"名词解释","p":["声调高低、升降的变化模式","55高平、35高升、214曲折、51全降"],"q":"调型指声调高低、升降的变化模式。55 为高平调型；35 为高升调型；214 为先降后升曲折调型；51 为全降调型。阴平“妈”(55)是高平调型；阳平“麻”(35)是高升调型；上声“马”(214)是曲折调型；去声“骂”(51)是全降调型。","w":"high","e":["2017 真题"]},{"t":"调号","y":"名词解释","p":["声调的标志符号","把五度标调法图形简化","“-、ˊ、ˇ、`”分别表示阴平、阳平、上声、去声"],"q":"调号即声调的标志符号，指标写声调所用的简单明了的符号，即把五度标调法的图形简化为一种不标刻度的声调符号。汉语拼音方案使用“-、ˊ、ˇ、`”分别表示“阴平、阳平、上声、去声”四个声调。mā（阴平）、má（阳平）、mǎ（上声）、mà（去声）。","w":"normal","e":["核心考点"]},{"t":"五度标调法","y":"名词解释","p":["赵元任设计","用从1到5的5度竖轴表示相对音高","1最低、2次低、3中高、4次高、5最高"],"q":"对具体调值的确定，通常采用赵元任设计的“五度标调法”，方法是建立一个坐标，用从1到5的5度竖轴表示相对音高，用横轴表示音长。其中1表示音高最低点，2表示次低，3表示中高，4表示次高，5表示最高。普通话四声用五度值标记为：阴平55、阳平35、上声214、去声51。","w":"high","e":["2013 真题","2020 真题"]},{"t":"写出普通话四个声调的调值、调型与调号。","y":"简答题","p":["阴平55（高平）","阳平35（高升）","上声214（曲折）","去声51（全降）"],"q":"普通话里qing这个音节有四种声调：清：高而平，标为55；晴：由中升到高，标为35；请：由次低降到低再升至次高，标为214；庆：由高降到低，标为51。调型方面，55为高平调型，35为高升调型，214为先降后升曲折调型，51为全降调型。调号即声调的标志符号，汉语拼音方案使用“-、ˊ、ˇ、`”分别表示“阴平、阳平、上声、去","w":"high","e":["2013 真题","2017 真题","2023 真题"]},{"t":"简述普通话和方言在声调上的差异。","y":"简答题","p":["调类的数目不同","调类相同但调值不同","北方方言4个左右，南方方言6-8个"],"q":"普通话和方言声调上的差异，主要表现在调类和调值两个方面：（1）调类的数目不同。北方方言声调的数目比较少，最少可以只有三个（河北滦县），最多为五个，一般是四个；大多数方言点没有入声，且同调类的调值相差很大。南方方言的声调数目比较多，最少是五个，最多有十个（广西玉林），一般是六到八个声调，大多数南方方言都有入声。（2）调类","w":"high","e":["2016 真题"]},{"t":"普通话四个声调的调值分别是阴平______、阳平______、上声______、去声______。","y":"填空题","p":["阴平55","阳平35","上声214","去声51"],"q":"55；35；214；51","w":"high","e":["2013 真题","2017 真题","2023 真题"]},{"t":"对具体调值的确定，通常采用赵元任设计的“______”。","y":"填空题","p":["五度标调法"],"q":"五度标调法","w":"high","e":["2013 真题","2020 真题"]},{"t":"普通话上声的调值是（　　）。","y":"单项选择题","p":[],"q":"C","w":"high","e":["2013 真题","2017 真题"]}]},{"id":"xdhy_up-c01-s05","t":"第二章 元音","w":"normal","n":1,"k":[{"t":"根据提供的发音条件，“前、高、不圆唇舌尖元音”对应的韵母是（　　）。","y":"单项选择题","p":[],"q":"B","w":"normal","e":["核心考点"]}]}]},{"id":"xdhy_up-c02","t":"第二章 汉字","w":"high","s":[{"id":"xdhy_up-c02-s01","t":"第一节 现代汉字概述","w":"high","n":44,"k":[{"t":"汉字","y":"名词解释","p":["汉字是汉民族在长期的劳动生产和社会实践中为适应交际需要而独立创造出来的书面交际工具。","汉字是一种重要而独特的文字系统，在记录语言的方法、造字的方式、字形的结构、字体的呈现等诸方面都有鲜明的特点。","汉字是世界上历史最悠久的一种独立发展的文字，曾形成“汉字文化圈”。"],"q":"汉字是汉民族在长期的劳动生产和社会实践中为适应交际需要而独立创造出来的书面交际工具。","w":"high","e":["2016 真题"]},{"t":"现代汉字","y":"名词解释","p":["现代汉字指现阶段正在使用的汉字，它记录的主要对象是现代汉语，与传统汉字相对应。","判断一种文字符号体系的性质，首要的是研究这种文字与它所记录的语言之间的关系。","考察现代汉字的特点，还必须跟拼音文字符号体系进行比较。"],"q":"现代汉字指现阶段正在使用的汉字，它记录的主要对象是现代汉语，与传统汉字相对应。","w":"high","e":["2013 真题","2019 真题"]},{"t":"意音文字","y":"名词解释","p":["汉字记录汉语则兼用三种方法，即从义入手、从音入手或同时从音义入手。","汉字是一种兼顾意音的文字，可以简称为“意音文字”。","汉字绝大多数都是兼用表音和表义的方法，所以形声字约占全部汉字的90%左右。","现代汉字的意符和音符所起的表义标音作用已经有限。"],"q":"汉字记录汉语则兼用三种方法，即从义入手、从音入手或同时从音义入手。汉字是一种兼顾意音的文字，可以简称为“意音文字”。","w":"high","e":["2015 真题"]},{"t":"语素文字","y":"名词解释","p":["从汉字符号记录语言的单位来看，现代汉字是一种语素文字。","表音文字根据文字所记录的语言单位的不同，可以分为音素文字和音节文字两种类型。","汉字在记录语言时，利用了语素音义兼顾的特点，用能产性极强的形声字分别记录语素意义所属的类别和语素的音节。"],"q":"从汉字符号记录语言的单位来看，现代汉字是一种语素文字。","w":"high","e":["2018 真题"]},{"t":"方块字","y":"名词解释","p":["汉字是一种平面性文字，它的构成成分是从横和纵展开，形成平面布局。","在一个平面内，不管有多少个构成成分都要均衡地分布在方方正正的框架里，呈现为方块形式，所以汉字又叫作“方块字”。","汉字从隶书发展为楷书，形象性减弱，符号性加强。"],"q":"汉字是一种平面性文字，它的构成成分是从横和纵展开，形成平面布局。","w":"high","e":["教材高频"]},{"t":"六书","y":"名词解释","p":["“六书”是指象形、指事、会意、形声、假借、转注。","目前主流看法认为假借、转注是用字手段，象形、指事、会意、形声才是造字方法。","造字法，通常采用传统的“六书”来分析。"],"q":"“六书”是指象形、指事、会意、形声、假借、转注。","w":"high","e":["2011 真题","2017 真题"]},{"t":"象形","y":"名词解释","p":["用线条描画出事物的形象，其字形与字义的联系比较具体、紧密。","这类字大多表示自然界和日常生活中的实物。","许多事物用几根线条很难画出，所以用这种方法造出来的字并不多。","由于字形历史演变等原因，这类字的形体象形意味现在大为减弱，不少已经失去了跟字义的直接联系，有些还变成了记号。"],"q":"用线条描画出事物的形象，其字形与字义的联系比较具体、紧密。","w":"high","e":["2012 真题"]},{"t":"指事","y":"名词解释","p":["用抽象符号来提示字义。","这类字可以分两种：1.纯符号的；2.在具体事物的图形上添加抽象符号。","这种方法造的汉字局限性很大，所以字数极少，纯符号的指事字更少。"],"q":"用抽象符号来提示字义。","w":"high","e":["教材高频"]},{"t":"会意","y":"名词解释","p":["用两个或几个物体的图形的组合产生字义。","会意字是在象形字基础上创造的，所表示的字义可从几个象形字组合的关系上显示出来，所以能把没法直接描画的一些动作、状态表示出来。","这种造字方法，现在仍在少量地应用。"],"q":"用两个或几个物体的图形的组合产生字义。","w":"high","e":["2014 真题"]},{"t":"形声","y":"名词解释","p":["由形旁与声旁组成，形旁表示大致的字义或字义的类属，声旁提示字的读音或近似的读音。","形声法是汉字最主要的造字方法。","形声法综合利用字形表义和字形表音这两种手段。"],"q":"由形旁与声旁组成，形旁表示大致的字义或字义的类属，声旁提示字的读音或近似的读音。","w":"high","e":["2011 真题","2016 真题","2020 真题"]},{"t":"意符","y":"名词解释","p":["凡是跟整字在意义上有联系的部件，称为“意符”。","对现代汉字构形成分进行分析，得到的是构字部件；构字部件的属性，指的是部件跟整字在音义上的关系，这可以分为三类：意符、音符和记号。","汉字的意符，也叫形旁，在传递语义信息上的功能，是单纯的表音文字所不具备的。"],"q":"凡是跟整字在意义上有联系的部件，称为“意符”。","w":"high","e":["教材高频"]},{"t":"音符","y":"名词解释","p":["凡是跟整字在读音上有联系的部件，称为“音符”。","汉字的音符，也叫声旁，同表音文字的音符有很大的区别。","前者是非专职的，是借用本来既有音又有义的现成字符充当的，而后者则是专职的。","现代汉字中音符的数量很多，超过一千个。"],"q":"凡是跟整字在读音上有联系的部件，称为“音符”。","w":"high","e":["教材高频"]},{"t":"记号","y":"名词解释","p":["凡是跟整字在意义和读音上都没有联系的部件，称为“记号”。","单部件字有：意符字和记号字；多部件字主要有三类：合成意符字、意符音符字、合成记号字。","组合成字的部件都是既不表示字音又不表示字义的记号。"],"q":"凡是跟整字在意义和读音上都没有联系的部件，称为“记号”。","w":"high","e":["教材高频"]},{"t":"单部件字","y":"名词解释","p":["根据现代汉字构字部件的数量，可以把现代汉字字形分为单部件字和多部件字两大类；单部件字有：意符字和记号字。","由一个意符单独构成，从现代汉字的字形上就可以大致读出字义，这是意符字。","由一个记号单独构成，从现代汉字的字形上，既不能知道读音，也不能读出字义，这是记号字。"],"q":"根据现代汉字构字部件的数量，可以把现代汉字字形分为单部件字和多部件字两大类；单部件字有：意符字和记号字。","w":"high","e":["教材高频"]},{"t":"多部件字","y":"名词解释","p":["多部件字主要有三类：合成意符字、意符音符字、合成记号字。","合成意符字由两个或两个以上意符构成，从现代汉字字形看，可以说是合字表义。","意符音符字由意符和音符构成，从意符可以大致知道字义的类别，从音符可以大致读出字音。","合成记号字组合成字的部件都是既不表示字音又不表示字义的记号。"],"q":"多部件字主要有三类：合成意符字、意符音符字、合成记号字。","w":"high","e":["2017 真题"]},{"t":"字体","y":"名词解释","p":["字体指的是同一种文字的各种不同体式。","例如汉字的楷书、行书、草书，印刷的宋体、仿宋体、楷体、黑体等。","至于书法艺术上的种种字体，例如欧体、颜体、柳体，指的是书法的派别，又称“书体”，不属于严格文字学的范围。"],"q":"字体指的是同一种文字的各种不同体式。","w":"high","e":["2013 真题","2019 真题"]},{"t":"隶变","y":"名词解释","p":["由甲骨文、金文发展到小篆，是一个简化的过程。小篆又简化为隶书，隶书又简化为草书和楷书，楷书又跟草书结合为行书。","隶变在字体演变史上的地位最为重要，它是古今汉字的分水岭。","汉字字体演变的总趋势是由繁难变为简易。"],"q":"由甲骨文、金文发展到小篆，是一个简化的过程。小篆又简化为隶书，隶书又简化为草书和楷书，楷书又跟草书结合为行书。","w":"high","e":["2015 真题","2021 真题"]},{"t":"楷书","y":"名词解释","p":["楷书是现代通行的汉字手写正体字，也叫正楷。“楷”是楷模、法式的意思。","楷书笔画分明，笔形规整，结构端庄，字形方正，是汉字的标准字体。","现代汉字手写体主要有楷书、草书、行书等三种。"],"q":"楷书是现代通行的汉字手写正体字，也叫正楷。“楷”是楷模、法式的意思。","w":"high","e":["教材高频"]},{"t":"简述汉字的历史功绩。","y":"简答题","p":["维护民族团结、国家统一","保存无比丰富的文化遗产","促进中外文化交流、发展人类文化","计算机输入输出存储难题已经解决"],"q":"汉字在漫长的历史进程中建立了不可磨灭的功绩：首先，它为维护民族团结、国家统一发挥过并继续发挥着积极的作用；其次，它为中华民族保存了无比丰富的文化遗产；第三，它还为促进中外文化交流、发展人类文化作出过巨大贡献。汉字的计算机输入、输出和存储这一难题，现在已经解决。","w":"normal","e":["核心考点"]},{"t":"现代汉字记录汉语兼用哪三种方法？请举例说明。","y":"简答题","p":["从义入手，用意符（形旁）记录语言","从音入手，用音符记录语言","同时从音义入手，兼用音符和意符"],"q":"汉字记录汉语兼用三种方法：(1)从义入手，用意符（形旁）记录语言。例如用侧身而立的人形来记录rén(人)这个名词，用“采”来记录cǎi(采)这个动词，用“三”（三条横线）来记录sān(三)这个数词。(2)从音入手，用音符记录语言。例如“亦”的古字形像人臂下的胳肢窝，后借去记录副词yì；“须”的古字形像胡须，后借去记录副","w":"high","e":["2016 真题"]},{"t":"现代汉字呈方块形式的特点，有哪些优点和缺点？","y":"简答题","p":["优点：结构紧凑，节省篇幅和目力","优点：形体差异度大，视觉分辨率高，利于快速阅读","缺点：笔画多向分散，影响书写速度","缺点：信息处理程序复杂，影响计算机处理效率"],"q":"优点主要表现在阅读上：(1)方块组合比线性排列结构紧凑，占用空间小，能够节省篇幅，节省目力，有利于阅读。(2)方块形式的汉字，不管笔画多少，都分布在大小相同的方块形平面之中，造成单位面积内笔画密集程度不一，因此，汉字符号之间在形体上的差异度较大，视觉分辨率较高，有利于快速阅读。缺点主要表现在书写上：(1)方块形式的汉字","w":"high","e":["2013 真题","2019 真题"]},{"t":"简述“六书”的内容，并说明哪几种是造字方法。","y":"简答题","p":["六书：象形、指事、会意、形声、假借、转注","假借、转注是用字手段","象形、指事、会意、形声才是造字方法"],"q":"造字法，通常采用传统的“六书”来分析，“六书”是指象形、指事、会意、形声、假借、转注。目前主流看法认为假借、转注是用字手段，象形、指事、会意、形声才是造字方法。","w":"high","e":["2011 真题","2017 真题"]},{"t":"现代新造字有哪些不同于传统的造字方法？请举例说明。","y":"简答题","p":["切音合形造字法（如“甭”）","省形的切音合形造字法（如“巯”）","省形造字法（如“乒”“乓”）"],"q":"现代新造的字，它们的造字法主要是继承传统，但也有少数是新创造的：(1)切音合形造字法。把两个字合成一个字，字义也合，读音则利用切音方法记录。例如“甭”，音béng，是“不”和“用”的切音，字义为“不用”。(2)省形的切音合形造字法。字音和字义跟上面的方法相同，只是字形各取其半。例如“巯”，音qiú，是“氢”和“硫”的切","w":"normal","e":["核心考点"]},{"t":"简述古今汉字字体的演变过程及其总趋势。","y":"简答题","p":["字体先后有甲骨文、金文、小篆、隶书、草书、楷书、行书","总趋势是由繁难变为简易","隶变是古今汉字的分水岭"],"q":"汉字的字体经过了漫长的演变过程，先后出现过甲骨文、金文、小篆、隶书、草书、楷书、行书等各具特点的字体。汉字字体演变的总趋势是由繁难变为简易。由甲骨文、金文发展到小篆，是一个简化的过程。小篆又简化为隶书，隶书又简化为草书和楷书，楷书又跟草书结合为行书。其中，隶变在字体演变史上的地位最为重要，它是古今汉字的分水岭。","w":"high","e":["2013 真题","2019 真题"]},{"t":"汉字字体演变的根本原因是什么？","y":"简答题","p":["根本原因是人们的社会交际需要","要求书写快捷、辨认清晰、印刷方便","其次是书写工具的改进以及政治上的需要"],"q":"汉字字体的演变，其根本原因是人们的社会交际需要，即要求文字高效率地服务，要求书写快捷、辨认清晰、印刷方便。其次的原因才是书写工具的改进以及政治上的需要。从甲骨文以来，汉字的书写速度和辨识效率一直是字体发展的矛盾着的两个方面，两者互相制约又互相促进，在竞争中达到新的平衡，从而形成了汉字的多种字体。","w":"normal","e":["核心考点"]},{"t":"现代汉字的印刷体主要有哪几种？各有什么特点？","y":"简答题","p":["宋体：笔画严谨，横细竖粗，书报正文常用","仿宋体：笔画粗细一致，多用于特殊场合","楷体：笔画浑圆，用于通俗读物、课本","黑体：笔画粗重，用于标题、标语","宋体和楷体是最常用的印刷体"],"q":"现代汉字印刷体主要有宋体、仿宋体、楷体、黑体四种。(1)宋体又称老宋体。笔画严谨，横细竖粗，结构紧密，字形方正。书报的正文一般都用宋体。(2)仿宋体是采用宋体的结构、楷书的笔法而成的。笔画粗细一致，结构匀称，字形清秀。(3)楷体又称活体。笔画浑圆，笔调灵活，结构端正，字形美观。(4)黑体又称粗体、方头体。笔画粗重，横平","w":"normal","e":["核心考点"]},{"t":"试论述现代汉字的性质与基本特点。","y":"论述题","p":["判断文字性质要研究文字与所记录语言的关系","现代汉字是一种意音文字（兼用三种方法）","现代汉字基本上是一种语素文字","现代汉字在形体上呈现为方块形式","总论：兼表意音的语素文字"],"q":"现代汉字指现阶段正在使用的汉字，它记录的主要对象是现代汉语，与传统汉字相对应。判断一种文字符号体系的性质，首要的是研究这种文字与它所记录的语言之间的关系；考察现代汉字的特点，还必须跟拼音文字符号体系进行比较。现代汉字的基本特点有三：(一)现代汉字是一种意音文字。汉字记录汉语兼用三种方法：从义入手，用意符（形旁）记录语言","w":"high","e":["2011 真题","2016 真题"]},{"t":"试从“意音文字”和“语素文字”两个角度论述现代汉字的性质，并说明与表音文字的区别。","y":"论述题","p":["文字记录语言有从音、从义、兼用音义三种入口","汉字兼用三种方法，形声字占90%左右，是意音文字","汉字音符非专职、数量多，区别于表音文字音符","汉字意符具有表音文字不具备的表义功能","从记录语言的单位看，汉字是语素文字"],"q":"语言是音义的结合体。文字记录语言的时候，或者从音入手，或者从义入手，或者同时从音义入手。拼音文字记录语言都是从音入手的，即用音符记录语言。汉字记录汉语则兼用三种方法：1.从义入手，用意符（形旁）记录语言；2.从音入手，用音符记录语言；3.同时从音义入手，兼用音符和意符记录语言。汉字绝大多数都是兼用表音和表义的方法，所以","w":"high","e":["2013 真题","2019 真题"]},{"t":"试论述汉字的字体演变过程、演变原因及演变规律。","y":"论述题","p":["字体演变过程：甲骨文、金文、小篆、隶书、草书、楷书、行书","总趋势是由繁难变为简易，隶变是分水岭","简化趋势表现：结构归并省减、符号性增强、线条变笔画","字体演变缓慢渐进，新旧字体并存","根本原因是社会交际需要，其次是书写工具改进和政治需要"],"q":"汉字的字体经过了漫长的演变过程，先后出现过甲骨文、金文、小篆、隶书、草书、楷书、行书等各具特点的字体。汉字字体演变的总趋势是由繁难变为简易。由甲骨文、金文发展到小篆，是一个简化的过程。小篆又简化为隶书，隶书又简化为草书和楷书，楷书又跟草书结合为行书。其中，隶变在字体演变史上的地位最为重要，它是古今汉字的分水岭。汉字字体","w":"high","e":["2013 真题","2019 真题"]},{"t":"辨析“造字法”与“用字手段”。","y":"辨析题","p":["造字法：象形、指事、会意、形声四种","用字手段：假借、转注两种","区别：造字法使字形从无到有，用字手段借用已有字形"],"q":"造字法，通常采用传统的“六书”来分析，“六书”是指象形、指事、会意、形声、假借、转注。目前主流看法认为假借、转注是用字手段，象形、指事、会意、形声才是造字方法。二者的区别在于：造字法解决一个字形如何从无到有地造出来，包括象形、指事、会意、形声四种；用字手段是借用已有的字形去记录别的语词，包括假借和转注。例如“亦”“须”","w":"high","e":["2011 真题"]},{"t":"辨析“汉字的意符”与“汉字的音符”。","y":"辨析题","p":["意符：跟整字意义上有联系的部件，也叫形旁","音符：跟整字读音上有联系的部件，也叫声旁","意符表义，音符表音，二者在形声字中互补","汉字音符非专职、数量多"],"q":"凡是跟整字在意义上有联系的部件，称为“意符”；凡是跟整字在读音上有联系的部件，称为“音符”。汉字的意符也叫形旁，在传递语义信息上的功能，是单纯的表音文字所不具备的；尽管绝大多数意符只能提示语义的类别或范围，但现代汉字的意符反映了字义的系统性。汉字的音符也叫声旁，同表音文字的音符有很大的区别：前者是非专职的，是借用本来既","w":"normal","e":["核心考点"]},{"t":"判断：汉字是一种意音文字，也是一种语素文字。","y":"判断题","p":["正确","意音文字：兼用表音和表义，形声字占90%左右","语素文字：从记录语言的单位看"],"q":"正确。现代汉字是一种意音文字：汉字记录汉语兼用三种方法，汉字绝大多数都是兼用表音和表义的方法，所以形声字约占全部汉字的90%左右，现代汉字是一种兼顾意音的文字。同时，从汉字符号记录语言的单位来看，现代汉字是一种语素文字。因此，现代汉字是一种兼表意音的语素文字。","w":"high","e":["2016 真题"]},{"t":"判断：隶变是古今汉字的分水岭。","y":"判断题","p":["正确","隶变在字体演变史上地位最重要","是古今汉字的分水岭"],"q":"正确。小篆又简化为隶书，隶书又简化为草书和楷书，楷书又跟草书结合为行书。其中，隶变在字体演变史上的地位最为重要，它是古今汉字的分水岭。","w":"high","e":["2015 真题"]},{"t":"判断：象形、指事、会意、形声、假借、转注都是造字方法。","y":"判断题","p":["错误","假借、转注是用字手段","象形、指事、会意、形声才是造字方法"],"q":"错误。目前主流看法认为假借、转注是用字手段，象形、指事、会意、形声才是造字方法。","w":"high","e":["2011 真题"]},{"t":"判断：现代汉字中，形声字约占全部汉字的50%。","y":"判断题","p":["错误","形声字约占全部汉字的90%左右","汉字绝大多数兼用表音表义"],"q":"错误。汉字绝大多数都是兼用表音和表义的方法，所以形声字约占全部汉字的90%左右。","w":"normal","e":["核心考点"]},{"t":"判断：独体字在现代汉字中约占30%——50%。","y":"判断题","p":["错误","独体字约占3%——5%","绝对数量为三百上下","是构成现代汉字字形的基础"],"q":"错误。独体字在现代汉字中约占3%——5%，绝对数量为三百上下，它们是构成现代汉字字形的基础。","w":"normal","e":["核心考点"]},{"t":"现代汉字是一种兼表意音的______文字。","y":"填空题","p":["现代汉字是兼表意音的语素文字"],"q":"语素","w":"high","e":["2016 真题"]},{"t":"“六书”是指象形、指事、会意、形声、______、______。","y":"填空题","p":["六书：象形、指事、会意、形声、假借、转注"],"q":"假借、转注","w":"high","e":["2011 真题"]},{"t":"汉字字体演变的总趋势是由繁难变为______，其中______是古今汉字的分水岭。","y":"填空题","p":["总趋势由繁难变为简易","隶变是古今汉字的分水岭"],"q":"简易；隶变","w":"high","e":["2013 真题"]},{"t":"现代汉字是一种（　）。","y":"单项选择题","p":["现代汉字是兼表意音的语素文字"],"q":"(2)兼表意音的语素文字","w":"high","e":["2016 真题"]},{"t":"汉字字体演变史上地位最重要、被称为古今汉字分水岭的是（　）。","y":"单项选择题","p":["隶变是古今汉字的分水岭"],"q":"(2)隶变","w":"high","e":["2015 真题"]},{"t":"《说文解字》里形声字已占（　）。","y":"单项选择题","p":["《说文解字》里形声字已占82%"],"q":"(3)82%","w":"normal","e":["核心考点"]},{"t":"分析下列汉字的造字方法：湖、休、末、衣、亦。","y":"分析题","p":["湖：形声字（形旁氵+声旁胡）","休：会意字（亻+木，人依木）","末：指事字（树木顶端加短横）","衣：象形字（像一件衣服）","亦：假借字（借字形记录副词）"],"q":"(1)“湖”是形声字，由形旁与声旁组成，用“氵”（三点水）表示字义跟水有关，用“胡”注明字的读音。(2)“休”是会意字，由“亻”和“木”两个意符组合而成，用人倚靠树旁来记录“休(息)”的语义。(3)“末”是指事字，在具体事物的图形上添加抽象符号，在树木的顶端加一短横，指示那里是树梢。(4)“衣”是象形字，用线条描画出事","w":"high","e":["2011 真题","2017 真题"]},{"t":"分析下列字的造字方法并各举出同类的4——5个例字：森、淼。","y":"分析题","p":["森、淼都用会意法造字，由三个相同部件组合，属品字结构","森表示树多貌，淼表示大水貌","同类例字：晶、焱、垚、犇、羴等"],"q":"(1)“森”由三个“木”组合而成，“淼”由三个“水”组合而成，二者都用会意法造字，即用两个或几个物体的图形的组合产生字义，属品字结构。“森”表示树多貌，“淼”表示大水貌。(2)运用同样造字法（会意、品字结构）的例字还有：晶（三个“日”，表示光亮）、焱（三个“火”，表示火花、火焰）、垚（三个“土”，表示山高）、犇（三头牛","w":"normal","e":["核心考点"]}]},{"id":"xdhy_up-c02-s02","t":"第二节 现代汉字的字形","w":"high","n":37,"k":[{"t":"笔画","y":"名词解释","p":["笔画是构成楷书字形的最小单位。","就书写过程而言，笔画是有起止的线条，从落笔到下一次提笔的过程中写出的点和线就叫一笔或一画。","在不同的字体中，笔画的表现形式可能不完全相同。","这里所说的笔画是以印刷体的主流字体宋体、楷体作为分析对象的。"],"q":"笔画是构成楷书字形的最小单位。","w":"high","e":["2012 真题","2018 真题"]},{"t":"笔形","y":"名词解释","p":["依据笔势和走向，现代汉字的笔画可以有31种不同的形式，笔画的形式简称为笔形。","现代汉字的笔形可以有概括的和细致的两种分类法：概括的分类法把笔形分为八类或五类；细致的分类法先把笔形分为基本笔形和派生笔形（也称复合笔形）两个大类。","书写时，笔画的方向自始至终没有变化的笔形是基本笔形，笔画的方向有所变化的是派生笔形。"],"q":"依据笔势和走向，现代汉字的笔画可以有31种不同的形式，笔画的形式简称为笔形。","w":"high","e":["教材高频"]},{"t":"笔顺","y":"名词解释","p":["书写汉字时笔画的走向和次序叫作笔顺。","笔顺包括两方面内容：一是笔画的走向，也有人称“笔势”，例如横（一）是从左到右，竖（丨）是从上到下；二是笔画出现的先后次序，也有人称“笔序”。","笔势和笔序合起来称为笔顺。"],"q":"书写汉字时笔画的走向和次序叫作笔顺。","w":"high","e":["2014 真题","2020 真题"]},{"t":"部件","y":"名词解释","p":["部件是由笔画组成的、能独立运用的、具有组配汉字功能的构字单位。","部件也可以看作是对整字进行一次或几次切分后得出来的构字单位。","大多数部件是由一些笔画组合成的“构件”，它们可以独立运用；有少数部件本身就是一个字；也有少数部件本身就是一个笔画。"],"q":"部件是由笔画组成的、能独立运用的、具有组配汉字功能的构字单位。","w":"high","e":["2013 真题","2019 真题"]},{"t":"基础部件","y":"名词解释","p":["最小的不再拆分的部件叫基础部件，又叫单纯部件；由于基础部件总是处在组字的最低层次，所以又称末级部件。","由两个和两个以上基础部件组成的部件叫合成部件。"],"q":"最小的不再拆分的部件叫基础部件，又叫单纯部件；由于基础部件总是处在组字的最低层次，所以又称末级部件。","w":"high","e":["教材高频"]},{"t":"部位","y":"名词解释","p":["要确定部件的名称，还要给汉字字形结构的各个位置定名，这就叫部位。可以分为八类。","八类部位可以编成16字口诀：上“头”下“底”，左“旁”右“边”，内“心”外“框”，中“腰”四“角”。","使用统一规范的部件和部位名称，可以把一个结构复杂的汉字称说得既准确又清楚，这就叫“部件识字法”。"],"q":"要确定部件的名称，还要给汉字字形结构的各个位置定名，这就叫部位。可以分为八类。","w":"high","e":["教材高频"]},{"t":"偏旁","y":"名词解释","p":["偏旁就是用二分法对合体字进行一次性切分而获得的结构单位，可分为“形旁”和“声旁”两类。","形旁通常表示该字的意义类别，声旁通常表示该字的大致读音。","多数形声字由一个形旁和一个声旁组成；会意字的两个偏旁都属于形旁。","通用汉字的偏旁约有1500个。"],"q":"偏旁就是用二分法对合体字进行一次性切分而获得的结构单位，可分为“形旁”和“声旁”两类。","w":"high","e":["2012 真题","2018 真题"]},{"t":"部首","y":"名词解释","p":["“部首”是指可以成批构字的一部分部件。含有同一部件的字，在“字集”中均排列在一起，该部件作为领头单位排在开头，成为查字的依据。","部首一般包括两类：一是形旁，例如“栋”“梁”的部首都是“木”；二是某些笔画，例如“头”的第一笔“、”就是部首。","《说文解字》的部首是540个，《现代汉语词典》（第6版）的部首是201个。"],"q":"“部首”是指可以成批构字的一部分部件。含有同一部件的字，在“字集”中均排列在一起，该部件作为领头单位排在开头，成为查字的依据。","w":"high","e":["2014 真题","2021 真题"]},{"t":"独体字","y":"名词解释","p":["独体字是指无法分离出两个或两个以上部件的汉字。","有些字笔画相交，结构呈镶嵌式，即使笔画很多，由于从字形上不能分解出相离的部件，因而也是独体字；有些字分解后就是相离而又对称或平行的笔画，这类字也宜看作独体字。","独体字在现代汉字中约占3%——5%，绝对数量为三百上下，它们是构成现代汉字字形的基础。"],"q":"独体字是指无法分离出两个或两个以上部件的汉字。","w":"high","e":["2013 真题","2019 真题"]},{"t":"合体字","y":"名词解释","p":["合体字是由两个或两个以上部件组合而成的汉字。","象形字、指事字一般属于独体字，会意字、形声字通常属于合体字。","独体和合体在汉字形体演变过程中会互变。"],"q":"合体字是由两个或两个以上部件组合而成的汉字。","w":"high","e":["2015 真题"]},{"t":"合体字结构模式","y":"名词解释","p":["按照层次分析法分析出的合体字基本结构模式，有三大类：(1)左右结构；(2)上下结构；(3)里外结构。","此外，还有一些从基本结构变化出来的派生结构：(4)左中右结构；(5)上中下结构；(6)品字结构；(7)镶嵌（或对称，或框架）结构；(8)半包围结构。","据统计，左右结构的字占现代汉字的大多数。"],"q":"按照层次分析法分析出的合体字基本结构模式，有三大类：(1)左右结构；(2)上下结构；(3)里外结构。","w":"high","e":["2016 真题","2022 真题"]},{"t":"准确计算汉字笔画数需要注意哪些规则？","y":"简答题","p":["统计对象必须是规范字形","遵守汉字书写的基本规则","左上角相接分作两笔","左下角相接全包围分作两笔、非全包围连作一笔","右上角相接连作一笔","右下角相接分作两笔"],"q":"准确计算每个汉字的笔画数，需要两个条件：一是统计的对象必须是规范字形。二是要遵守汉字书写的基本规则。如同一个笔画，笔尖只能走一次，不能来回走。又如横笔的走向只能从左到右，不能从右到左；竖笔、撇笔、捺笔的走向只能从上到下，不能从下到上。为了正确计算笔画数，还要注意以下规则：(1)笔画与笔画在字的左上角相接时，分作两笔，例","w":"high","e":["2014 真题","2020 真题"]},{"t":"汉字笔形八类说和五类说分别指什么？二者有何关系？","y":"简答题","p":["八类笔形：点、横、竖、撇、捺、提、折、钩（“永”字八法）","五类笔形：横、竖、撇、点、折（“札”字法）","五类说把可能变形的笔画并入非变形笔画","五类说常用于工具书排序"],"q":"八类笔形是指：点、横、竖、撇、捺、提、折、钩。因为楷体“永”字刚好含有这八种笔形，书法界就有“‘永’字八法”之说。五类笔形是指：横、竖、撇、点、折。因为“札”字刚好含有这五种笔形，就有“‘札’字法”的名称。五类说是把八类说中有可能是变形的笔画并入了非变形笔画，因而减少了类别数目。例如把“提”并入“横”，把“捺”并入“点","w":"high","e":["2015 真题"]},{"t":"现代汉字笔画的组合关系有哪几种？请举例说明。","y":"简答题","p":["相离关系（如“三、八、川、小”）","相接关系（如“工、刀、厂、口”）","相交关系（如“十、九、丈、车”）","组合关系也是构成不同字形的重要手段"],"q":"现代汉字笔画的组合关系有三种：(1)相离关系：例如“三、八、川、小”等字，它们的笔画之间都有或大或小的距离。(2)相接关系：例如“工、刀、厂、口”等字，前一笔和后一笔都是互相连接的关系。(3)相交关系：例如“十、九、丈、车”等字，前一笔和后一笔都是相互交叉的关系。笔画数目和笔画形状相同，只因为笔画的组合关系不同就可以构","w":"high","e":["2012 真题","2019 真题"]},{"t":"笔顺的基本规则可以概括为哪10条？","y":"简答题","p":["从左到右","从上到下","先横后竖","先竖后横","先撇后捺","先撇后折","先外后内","先外后内再封口","先中间后两边","包在主体内的点和右上角的点最后写"],"q":"笔顺的基本规则，可以概括为以下10条：(1)从左到右；(2)从上到下；(3)先横后竖；(4)先竖后横；(5)先撇后捺；(6)先撇后折；(7)先外后内；(8)先外后内再封口；(9)先中间后两边；(10)包在主体内的点和右上角的点最后写。","w":"high","e":["2014 真题","2021 真题"]},{"t":"部件可以从哪几个角度进行分类？","y":"简答题","p":["单笔部件/多笔部件","成字部件/不成字部件","基础部件/合成部件"],"q":"部件可以从多个角度予以分类：(1)单笔部件/多笔部件：只有一个笔画的部件，叫单笔部件；由两个和两个以上笔画组成的部件叫多笔部件。(2)成字部件/不成字部件：可以独立成字的部件，叫成字部件；不能独立成字的部件，叫不成字部件。(3)基础部件/合成部件：最小的不再拆分的部件叫基础部件，又叫单纯部件；由两个和两个以上基础部件组","w":"high","e":["2013 真题","2020 真题"]},{"t":"请比较“偏旁”“部件”“部首”三个概念的联系和区别。","y":"简答题","p":["偏旁：二分法一次性切分获得的结构单位，分形旁和声旁","部件：适应现代汉字字形分析需要，可大可小","部首：可以成批构字的一部分部件，是查字的依据","三者的数量不同，是三个不同的概念"],"q":"偏旁就是用二分法对合体字进行一次性切分而获得的结构单位，可分为“形旁”和“声旁”两类。“部件”这个术语是适应现代汉字分析字形的需要而提出来的，部件这个概念可大可小。“部首”是指可以成批构字的一部分部件，含有同一部件的字，在“字集”中均排列在一起，该部件作为领头单位排在开头，成为查字的依据。通用汉字的偏旁约有1500个。","w":"high","e":["2013 真题","2019 真题"]},{"t":"什么是独体字和合体字？请举例说明。","y":"简答题","p":["独体字：无法分离出两个或两个以上部件的汉字","合体字：由两个或两个以上部件组合而成的汉字","独体字约占3%——5%，是构成现代汉字字形的基础","象形字、指事字一般属于独体字，会意字、形声字通常属于合体字"],"q":"现代汉字的结构类型可以分为两类：独体字和合体字。独体字是指无法分离出两个或两个以上部件的汉字。例如“广”“手”“甘”“禾”。有些字笔画相交，结构呈镶嵌式，即使笔画很多，由于从字形上不能分解出相离的部件，因而也是独体字，例如“串”“东”“夷”“事”“重”等。有些字分解后就是相离而又对称或平行的笔画，这类字也宜看作独体字，","w":"high","e":["2013 真题","2019 真题"]},{"t":"现代汉字合体字的基本结构模式和派生结构模式有哪些？","y":"简答题","p":["基本结构模式：左右结构、上下结构、里外结构","派生结构：左中右结构、上中下结构、品字结构、镶嵌结构、半包围结构","据统计，左右结构的字占现代汉字的大多数"],"q":"按照层次分析法分析出的合体字基本结构模式，有三大类：(1)左右结构：休、到、江、杨；(2)上下结构：分、盅、花、家；(3)里外结构：因、回、团、困。此外，还有一些从基本结构变化出来的派生结构，主要有：(4)左中右结构：街、辫、斑、辩；(5)上中下结构：裹、禀、帚、莽；(6)品字结构：晶、淼、森、焱；(7)镶嵌（或对称，","w":"high","e":["2016 真题","2022 真题"]},{"t":"部位的名称分为哪八类？请举例说明。","y":"简答题","p":["头、底、旁、边、心、框、腰、角八类","16字口诀：上头下底，左旁右边，内心外框，中腰四角","例如“赢”称说为亡字头、口字腰、贝字底、左下月字角、右下凡字角"],"q":"要确定部件的名称，还要给汉字字形结构的各个位置定名，这就叫部位。可以分为八类：(1)头：上下结构的上部。(2)底：上下结构的下部。(3)旁：左右结构的左边。(4)边：左右结构的右边。(5)心：内外结构的内部。(6)框：内外结构的外部。(7)腰：左中右或上中下结构的中间部分。(8)角：上下结构的四角。综合起来，可以把汉字","w":"normal","e":["核心考点"]},{"t":"试论述现代汉字的字形构成层次及其分析方法。","y":"论述题","p":["字形构成分层次：整字→部件→笔画，或笔画→部件→整字","笔画是构成楷书字形的最小单位，笔形有概括和细致两种分类法","笔画组合关系有相离、相接、相交三种","部件是能独立运用的具有组配汉字功能的构字单位","整字分独体字和合体字，合体字有基本和派生结构模式","左右结构字占大多数"],"q":"现代汉字的字形构成是分层次的，可以逐层进行分析。从整字分解出部件，从部件分解出笔画；也可以反过来说，由笔画组合成部件，由部件组合成汉字。一、笔画与笔顺。笔画是构成楷书字形的最小单位，就书写过程而言，笔画是有起止的线条。依据笔势和走向，现代汉字的笔画可以有31种不同的形式，笔画的形式简称为笔形；现代汉字的笔形可以有概括的","w":"high","e":["2013 真题","2020 真题"]},{"t":"辨析“偏旁”“部件”“部首”三个概念。","y":"辨析题","p":["偏旁：二分法一次性切分的结构单位，分形旁声旁","部件：现代汉字构形单位，可大可小","部首：成批构字的一部分部件，是查字依据","三者数量不同，是三个不同概念"],"q":"偏旁就是用二分法对合体字进行一次性切分而获得的结构单位，可分为“形旁”和“声旁”两类。“部件”是适应现代汉字分析字形的需要而提出来的，可大可小：有时相当于偏旁，有时小于偏旁。“部首”是指可以成批构字的一部分部件，含有同一部件的字在“字集”中均排列在一起，该部件作为领头单位排在开头，成为查字的依据。三者的区别是：偏旁是传","w":"high","e":["2013 真题","2019 真题"]},{"t":"判断：笔画是构成楷书字形的最小单位。","y":"判断题","p":["正确","笔画是构成楷书字形的最小单位","笔画是有起止的线条"],"q":"正确。笔画是构成楷书字形的最小单位。就书写过程而言，笔画是有起止的线条，从落笔到下一次提笔的过程中写出的点和线就叫一笔或一画。","w":"high","e":["2012 真题"]},{"t":"判断：部件是由笔画组成的、能独立运用的、具有组配汉字功能的构字单位。","y":"判断题","p":["正确","部件由笔画组成","能独立运用","具有组配汉字功能","构字单位"],"q":"正确。部件是由笔画组成的、能独立运用的、具有组配汉字功能的构字单位。部件也可以看作是对整字进行一次或几次切分后得出来的构字单位。","w":"high","e":["2013 真题"]},{"t":"判断：左右结构的字占现代汉字的大多数。","y":"判断题","p":["正确","左右结构字占大多数","《汉字信息字典》统计占64.93%","其次为上下结构占21.11%"],"q":"正确。据统计，左右结构的字占现代汉字的大多数。《汉字信息字典》统计了7785字，左右结构的字共5055字，占64.93%，其次是上下结构的字，共1643字，占21.11%。","w":"normal","e":["核心考点"]},{"t":"判断：汉字字形的各个位置定名，即部位，分为八类，可编成16字口诀。","y":"判断题","p":["正确","部位分八类：头、底、旁、边、心、框、腰、角","16字口诀：上头下底，左旁右边，内心外框，中腰四角"],"q":"正确。要确定部件的名称，还要给汉字字形结构的各个位置定名，这就叫部位。可以分为八类：头、底、旁、边、心、框、腰、角。综合起来，可以编成16字口诀：上“头”下“底”，左“旁”右“边”，内“心”外“框”，中“腰”四“角”。","w":"normal","e":["核心考点"]},{"t":"准确计算汉字笔画数的四条规则是：(1)左上角相接______，(2)左下角相接______，(3)右上角相接______，(4)右下角相接______。","y":"填空题","p":["左上角相接分作两笔","左下角相接全包围分作两笔、非全包围连作一笔","右上角相接连作一笔","右下角相接分作两笔"],"q":"(1)分作两笔；(2)全包围结构的分作两笔，非全包围结构的连作一笔；(3)连作一笔；(4)分作两笔","w":"high","e":["2014 真题"]},{"t":"五类笔形是指______、______、______、______、______。","y":"填空题","p":["五类笔形：横、竖、撇、点、折"],"q":"横、竖、撇、点、折","w":"high","e":["2015 真题"]},{"t":"部件是______、______、______的构字单位。","y":"填空题","p":["部件由笔画组成","能独立运用","具有组配汉字功能"],"q":"由笔画组成的、能独立运用的、具有组配汉字功能的","w":"high","e":["2013 真题"]},{"t":"现代汉字合体字的基本结构模式有______、______、______，派生结构模式有______、______、______、______、______。","y":"填空题","p":["基本结构：左右、上下、里外","派生结构：左中右、上中下、品字、镶嵌、半包围"],"q":"基本结构模式有左右结构、上下结构、里外结构；派生结构模式有左中右结构、上中下结构、品字结构、镶嵌结构、半包围结构","w":"normal","e":["核心考点"]},{"t":"独体字是______，合体字是______。","y":"填空题","p":["独体字：无法分离出两个或两个以上部件","合体字：由两个或两个以上部件组合而成"],"q":"独体字是指无法分离出两个或两个以上部件的汉字；合体字是由两个或两个以上部件组合而成的汉字","w":"normal","e":["核心考点"]},{"t":"构成楷书字形的最小单位是（　）。","y":"单项选择题","p":["笔画是构成楷书字形的最小单位"],"q":"(1)笔画","w":"high","e":["2012 真题"]},{"t":"“永”字含有八种笔形，书法界称（　）。","y":"单项选择题","p":["八类笔形因“永”字含八种笔形而有“永字八法”之说"],"q":"(2)永字八法","w":"normal","e":["核心考点"]},{"t":"据统计，现代汉字中占大多数的结构类型是（　）。","y":"单项选择题","p":["左右结构的字占现代汉字的大多数"],"q":"(1)左右结构","w":"normal","e":["核心考点"]},{"t":"下列汉字中属于品字结构的是（　）。","y":"单项选择题","p":["品字结构如“晶、淼、森、焱”"],"q":"(2)晶","w":"normal","e":["核心考点"]},{"t":"根据汉字的结构模式，逐层分析下列汉字的结构关系：蕊、咖、焱、膏、匠。","y":"分析题","p":["蕊：品字结构","咖：左右结构","焱：品字结构","膏：上下结构","匠：半包围结构（上左下包围）"],"q":"现代汉字合体字的结构模式可以用层次法分析。基本结构模式有三大类：左右结构、上下结构、里外结构，另有派生结构。(1)“蕊”：品字结构（三个“心”组成）。(2)“咖”：左右结构（“口”与“加”左右并立）。(3)“焱”：品字结构（三个“火”组成）。(4)“膏”：上下结构（上部为“高”，下部为“月”）。(5)“匠”：半包围结构","w":"high","e":["2016 真题"]},{"t":"指出下列汉字各属于独体字还是合体字，并说明理由：广、串、的、晶、八、翼。","y":"分析题","p":["广：独体字（无法分离部件）","串：独体字（镶嵌式，笔画相交）","的：合体字（白+勺）","晶：合体字（三个日）","八：独体字（相离对称平行的笔画）","翼：合体字"],"q":"现代汉字的结构类型可以分为独体字和合体字两类。独体字是指无法分离出两个或两个以上部件的汉字；合体字是由两个或两个以上部件组合而成的汉字。(1)“广”：独体字，无法分离出两个部件。(2)“串”：独体字，笔画相交，结构呈镶嵌式，从字形上不能分解出相离的部件。(3)“的”：合体字，由“白”与“勺”两个部件组合而成。(4)“晶","w":"normal","e":["核心考点"]}]},{"id":"xdhy_up-c02-s03","t":"第三节 现代汉字的字音","w":"high","n":12,"k":[{"t":"儿化音节","y":"名词解释","p":["现代汉语书面语中还有少量用两个汉字记录一个音节的，例如“花儿”（huār）、“画儿”（huàr）等，这类音节在汉语中称为儿化音节，是在一个音节的末尾附加卷舌动作。","这个卷舌动作发出的音并不构成一个独立完整的音节。","一个汉字记录的语音单位基本上是一个音节。"],"q":"现代汉语书面语中还有少量用两个汉字记录一个音节的，例如“花儿”（huār）、“画儿”（huàr）等，这类音节在汉语中称为儿化音节，是在一个音节的末尾附加卷舌动作。","w":"high","e":["教材高频"]},{"t":"多音字","y":"名词解释","p":["所谓多音字，是指一个汉字可以有两个或两个以上的读音。","同一个汉字可以有不止一个读音，同一个读音也可以由多个字形共同拥有。","现代汉字中许多字只有一个读音，例如《汉字信息字典》所收7785个字中，单音字共7038个，占90%，而另外10%的字则是多音字。"],"q":"所谓多音字，是指一个汉字可以有两个或两个以上的读音。","w":"high","e":["2011 真题","2017 真题"]},{"t":"全表音声旁","y":"名词解释","p":["严格的标准是：声旁必须和整字的声母、韵母、声调全部相同。这种声旁就叫“全表音声旁”。","统计结果，字音与声旁的声、韵、调全部相同的只占26.3%。","宽松的标准是：把部首以外的另外半边一概看作声旁，只要声母、韵母相同就看作有表音功能，这样统计的结果，现代汉字声旁的有效表音率也只占39%。"],"q":"严格的标准是：声旁必须和整字的声母、韵母、声调全部相同。这种声旁就叫“全表音声旁”。","w":"high","e":["2018 真题"]},{"t":"现代汉字中，很多字光凭字形不能准确地读出字音来，原因是什么？","y":"简答题","p":["约10%的字字形本身不提供任何字音信息","形声字表音作用有限：声旁不是专职的","有的声旁消失了或不全了","不同的声旁记录同一音节，同一声旁记录不同音节"],"q":"现代汉字中，很多字光凭字形不能准确地读出字音来。其原因是：(1)现代汉字中约有10%的字，字形本身不提供任何字音信息，例如“大”“小”“书”“头”“又”等。(2)形声字虽有标音的声旁，但是，表音作用有限：1)汉字的声旁不是专职的，例如“刀”在“叨”“召”“忉”“鱽”中是声旁，在“切”“分”“剪”“劈”等字中又是形旁了；","w":"high","e":["2012 真题","2018 真题"]},{"t":"现代汉字形声字的表音功能可分为哪几种情况？","y":"简答题","p":["声、韵、调完全相同","声、韵相同，声调不同","声母相同，韵母不同","韵母相同，声母不同","声、韵、调完全不同或只是声调相同"],"q":"形声字的表音功能可分五种情况：(1)字音跟声旁的读音在声、韵、调上完全相同，即声旁能准确地表示字音。例如：包(bāo)——胞(bāo)、青(qīng)——清(qīng)。(2)字音与声旁的声母、韵母相同，声调不同。例如：元(yuán)——远(yuǎn)。(3)字音与声旁的声母相同，韵母不同。例如：贝(bèi)——坝(b","w":"high","e":["2015 真题","2021 真题"]},{"t":"声旁表示字音的情况可以分为哪三种类型？各自的组字率如何？","y":"简答题","p":["全表音声旁，只占全部形声字的7.17%","半表音声旁，只能猜读字音","不表音声旁，占13.3%，构成的形声字最容易误读"],"q":"声旁表示字音的情况大致有以下三种类型：全表音、半表音、不表音。(1)全表音声旁：只要记住声旁的读音，就可以准确读出它所构成的形声字的字音，可惜这些声旁的组字率不高，只占全部形声字的7.17%。(2)半表音声旁：是指在一部分形声字中能准确表音，而在另一部分形声字中不能准确表音或只能近似表音的声旁。(3)不表音声旁：声旁不","w":"normal","e":["核心考点"]},{"t":"如何充分发挥形声字声旁的积极作用？","y":"简答题","p":["利用声旁类推，帮助记忆成组字音","利用声旁认读生僻字","利用声旁分辨字形","充分利用形声字的系统性"],"q":"尽管现代汉字形声字声旁的表音能力不高，但可以充分发掘并发挥声旁的积极作用：(1)利用声旁类推，帮助记忆成组的普通话字音。例如“正”(zhèng)的声母是zh，用“正”作声旁的一组字“政、整、证、症、征、怔、钲”的声母也都是zh。(2)利用声旁认读生僻字。在现代汉字中，生僻形声字的声旁表音率往往高于常用形声字。(3)利用","w":"normal","e":["核心考点"]},{"t":"判断：现代汉字形声字声旁的有效表音率很高，可以据此准确读认字音。","y":"判断题","p":["错误","声旁有效表音率不高","严格标准下全表音只占26.3%","宽松标准下有效表音率也只占39%"],"q":"错误。现代汉字中可以通过声旁准确读认字音的比例是不高的。严格的标准下字音与声旁的声、韵、调全部相同的只占26.3%；宽松的标准下现代汉字声旁的有效表音率也只占39%。如果用“秀才识字读半边”的办法去读汉字，大约有四分之三的误读概率。","w":"normal","e":["核心考点"]},{"t":"判断：一个汉字记录的语音单位基本上是一个音节。","y":"判断题","p":["正确","一个汉字记录的语音单位基本上是一个音节","曾有过复音字但已被淘汰"],"q":"正确。一个汉字记录的语音单位基本上是一个音节。在汉字里，也曾有过少数汉字用一个字形记录两个音节的情况，例如“瓩”记录的是qiānwǎ两个音节，1977年7月，中国文字改革委员会和国家标准计量局发布规定，淘汰了这类复音字。","w":"normal","e":["核心考点"]},{"t":"严格标准下，字音与声旁的声、韵、调全部相同的形声字占（　）。","y":"单项选择题","p":["严格标准下字音与声旁声韵调全部相同的只占26.3%"],"q":"(3)26.3%","w":"normal","e":["核心考点"]},{"t":"宽松标准下，现代汉字声旁的有效表音率是（　）。","y":"单项选择题","p":["宽松标准下现代汉字声旁的有效表音率只占39%"],"q":"(4)39%","w":"normal","e":["核心考点"]},{"t":"分析下列由相同声旁构成的形声字，从声、韵、调三方面与声旁进行比较：(1)“工”(gōng)：江、空、肛；(2)“且”(qiě)：祖、租、阻。","y":"分析题","p":["“江”(jiāng)与“工”：声母不同、韵母不同","“空”(kōng)与“工”：韵母相同、声母不同","“肛”(gāng)与“工”：声母相同、韵母不同","“祖”“租”“阻”声母均为z、韵母均为u","归纳后声旁仍可起提示读音的作用"],"q":"声旁表音功能可分五种情况。(1)以“工”(gōng)为声旁：“江”(jiāng)与声旁“工”声母不同、韵母不同；“空”(kōng)与声旁“工”声母不同、韵母相同；“肛”(gāng)与声旁“工”声母相同、韵母不同。可见同一声旁可以记录不同的音节。(2)以“且”(qiě)为声旁：“祖”(zǔ)、“租”(zū)、“阻”(zǔ","w":"normal","e":["核心考点"]}]},{"id":"xdhy_up-c02-s04","t":"第四节 现代汉字的字义","w":"high","n":10,"k":[{"t":"字义","y":"名词解释","p":["汉字字形跟字义的关系大致有三类：1.字形记录的是词义；2.字形记录的是语素义；3.字形记录的仅仅是一个音节，它没有字义。","一个汉字在多数情况下，记录的是现代汉语的一个语素。字义也就是语素义。","现代汉字中也有少数用会意法造出来的字还是可以直接从字形推知字义的。"],"q":"汉字字形跟字义的关系大致有三类：1.字形记录的是词义；2.字形记录的是语素义；3.字形记录的仅仅是一个音节，它没有字义。","w":"high","e":["2015 真题"]},{"t":"形旁表义","y":"名词解释","p":["在形声字中，形旁主要提示跟字义有一定联系的信息。形声字的形旁和整字字义的关系有以下几种：(1)形旁完全表义；(2)形旁基本表义；(3)形旁不表义。","形旁基本表义可分为三种：形旁表示字义的大致类别；形旁与字义直接相关；形旁与字义间接有关。","在现代汉字中，表义部件的主要作用有二：一是提示，二是区别。","形旁的总体表义率为43.79%。"],"q":"在形声字中，形旁主要提示跟字义有一定联系的信息。形声字的形旁和整字字义的关系有以下几种：(1)形旁完全表义；(2)形旁基本表义；(3)形旁不表义。","w":"high","e":["2013 真题","2020 真题"]},{"t":"汉字字形跟字义的关系大致有哪三类？请举例说明。","y":"简答题","p":["字形记录的是词义（如“书、笔、走”）","字形记录的是语素义（如“民、丽、月”）","字形记录的仅仅是一个音节，没有字义（如“仿”“佛”）"],"q":"汉字字形跟字义的关系大致有三类：(1)字形记录的是词义。一个汉字记录单音节语素，而且可以独立成词，因此，字义实际上就是语素义，也是词义。例如：“书、笔、走、说、美、香、很、最、不、但”。(2)字形记录的是语素义。一个汉字只记录一个语素，而这个语素在现代汉语中不能单独构成一个词。例如:“民、丽、月、耳、道、习、历、释”。","w":"high","e":["2015 真题","2020 真题"]},{"t":"形声字的形旁和整字字义的关系有哪几种？请举例说明。","y":"简答题","p":["形旁完全表义（如舟—船）","形旁基本表义：表示大致类别、直接相关、间接有关","形旁不表义，变成记号（如女—始、牛—特）"],"q":"在形声字中，形旁主要提示跟字义有一定联系的信息。形声字的形旁和整字字义的关系有以下几种：(1)形旁完全表义，即形旁跟字义相同。例如：舟一船、父——爸、光——辉、香——馥。(2)形旁基本表义，可分为三种：1)形旁表示字义的大致类别。例如：鸟——鹊、金——钢、木——柏、心——忍。2)形旁与字义直接相关。例如：扌——打、火—","w":"high","e":["2016 真题","2022 真题"]},{"t":"在现代汉字中，表义部件的主要作用是什么？请举例说明。","y":"简答题","p":["作用一：提示，帮助联想到语素义或词义的大致范围","作用二：区别，区别同音字（读音、声旁相同的字）","举例：姑、菇、估、咕、沽等"],"q":"在现代汉字中，表义部件的主要作用有二：一是提示，二是区别。“提示”是指表义部件帮助人们联想到该字所记录的语素义或词义的大致范围，这就增加了现代汉字的理据性；“区别”是指用表义部件区别同音字，尤其是那些读音相同声旁也相同的字。例如：姑——菇——估——咕——沽——牯——钴；铜——桐——筒——酮——侗——峒。","w":"high","e":["2018 真题"]},{"t":"字义与词义有什么关系？为什么不能过分依赖字义来理解词义？","y":"简答题","p":["字义多数情况下就是语素义","有的字仅代表一个音节，没有字义","有的字在某个词中无意义，在其他词中有意义","词义不等于字义的简单相加，不能过分依赖字义，防止“望文生义”"],"q":"一个汉字在多数情况下，记录的是现代汉语的一个语素，字义也就是语素义。要注意两点：(1)有的字仅仅代表一个音节，并不代表语素，这时，汉字也就没有字义。(2)有的字在某个词语中没有意义，但是在另外一个词语中却是有意义的。当语素和语素组合成词时，新词的词义往往不等于字义和字义的简单相加。由于语素与语素在组合时的情况比较复杂，","w":"normal","e":["核心考点"]},{"t":"判断：汉字字形跟字义的关系是单一的，一个字总是记录一个词义。","y":"判断题","p":["错误","字形跟字义关系有三类","记录词义、记录语素义、仅记录音节无字义"],"q":"错误。汉字字形跟字义的关系大致有三类：1.字形记录的是词义；2.字形记录的是语素义；3.字形记录的仅仅是一个音节，它没有字义。所以汉字字形与字义的关系不是单一的。","w":"normal","e":["核心考点"]},{"t":"判断：形旁表义功能的强弱与汉字的使用频度成正比关系。","y":"判断题","p":["错误","形旁表义功能与使用频度成反比关系","常用字字义变化比罕用字大"],"q":"错误。形旁表义功能的强弱，与汉字的使用频度成反比关系。常用字字义的变化比罕用字大，不少常用形声字，由于客观事物或字形、字义的发展变化，其形旁早已失去它的表义作用。","w":"normal","e":["核心考点"]},{"t":"形旁的总体表义率为（　）。","y":"单项选择题","p":["形旁的总体表义率为43.79%"],"q":"(3)43.79%","w":"normal","e":["核心考点"]},{"t":"分析下列形声字形旁与字义的关系，并指出各属于哪一种：(1)舟—船；(2)鸟—鹊；(3)扌—打；(4)艹—芳；(5)女—始。","y":"分析题","p":["舟—船：形旁完全表义","鸟—鹊：形旁表示字义的大致类别","扌—打：形旁与字义直接相关","艹—芳：形旁与字义间接有关","女—始：形旁不表义，变成记号"],"q":"形声字的形旁和整字字义的关系有几种：(1)“舟—船”属于形旁完全表义，即形旁跟字义相同。(2)“鸟—鹊”“扌—打”属于形旁基本表义：“鸟—鹊”是形旁表示字义的大致类别，“扌—打”是形旁与字义直接相关。(3)“艹—芳”属于形旁基本表义中的形旁与字义间接有关，花草的香味与“艹”间接相关。(4)“女—始”属于形旁不表义，即形","w":"high","e":["2016 真题"]}]},{"id":"xdhy_up-c02-s05","t":"第五节 现代汉字形音义的关系","w":"high","n":21,"k":[{"t":"现代汉字形音义的关系","y":"名词解释","p":["字形是文字的物质外壳，是文字层面上的要素；字音和字义是文字所记录语言的音和义，是语言层面上的要素。","字形与字音以及字义这三者之间形成了错综复杂的关系。","现代汉字学的术语中，例如“多音多义字、同音字、异读字、异体字、繁简字、同形字”等，它们的内涵有一些交叉或重叠，这是因为给这些名称命名时的出发点不同。"],"q":"字形是文字的物质外壳，是文字层面上的要素；字音和字义是文字所记录语言的音和义，是语言层面上的要素。","w":"high","e":["2014 真题"]},{"t":"异读字","y":"名词解释","p":["异读字：即一形对数音一义。不同读音之间一般没有语义差别，仅仅是不同的人、不同的习惯读法。","异读字原则上应该统读。少数文白异读，目前还保留着。","异读字即多音同形同义字。"],"q":"异读字：即一形对数音一义。不同读音之间一般没有语义差别，仅仅是不同的人、不同的习惯读法。","w":"high","e":["教材高频"]},{"t":"异体字","y":"名词解释","p":["异体字（也叫异形字）：即数形对一音一义。不同字形之间没有任何音义差别。","经过整理，规定正体字，淘汰异体字形。","异体字指音义都相同仅形不同的字。"],"q":"异体字（也叫异形字）：即数形对一音一义。不同字形之间没有任何音义差别。","w":"high","e":["教材高频"]},{"t":"繁简字","y":"名词解释","p":["繁简字：即一为笔画比较多的字，一为笔画比较少的字，字音和字义都相同。","《简化字总表》的2235个简化字，在简繁转换中有95.5%是一对一的关系。","“简体字”则有特定的含义，指由国家明文规定取代繁体字而推广使用的简体字。"],"q":"繁简字：即一为笔画比较多的字，一为笔画比较少的字，字音和字义都相同。","w":"high","e":["教材高频"]},{"t":"单音单义字","y":"名词解释","p":["单音单义字：即一形对一音一义。这样的字多半不是常用字，而是专用字或较冷僻的字。","现代汉字中许多字只有一个读音。","《汉字信息字典》所收7785个字中，单音字共7038个，占90%。"],"q":"单音单义字：即一形对一音一义。这样的字多半不是常用字，而是专用字或较冷僻的字。","w":"high","e":["教材高频"]},{"t":"多音多义字","y":"名词解释","p":["多音多义字：即一形对数音数义。","所谓多音多义字就是同一个字形却记录不同的读音和不同的字义。","有人统计，在1988年发布的《现代汉语常用字表》3500个常用字中，有多音多义字405个，占总数的11.6%。","多音字节省了造字数量，但同时带来一字异读的麻烦。"],"q":"多音多义字：即一形对数音数义。","w":"high","e":["2012 真题","2019 真题"]},{"t":"近形字","y":"名词解释","p":["近形字也称形近字，是指字形相近而音、义有别的字。","近形字会给汉字的使用带来种种不便。","近形字的差异大体表现在以下四个方面：1.笔画数的微小差异；2.个别笔形的差异；3.笔画组合关系的差异；4.构字部件有局部差异。"],"q":"近形字也称形近字，是指字形相近而音、义有别的字。","w":"high","e":["2011 真题","2018 真题"]},{"t":"同音字","y":"名词解释","p":["同音字是指两个或两个以上的汉字，读音相同、意义不同而且意义没有联系。","同音字按字形是否相同可以分为同形同音异义字和异形同音异义字两类。","狭义的同音字只指同形同音异义字；广义的同音字，除了同形同音字之外，还包括了异形同音字。"],"q":"同音字是指两个或两个以上的汉字，读音相同、意义不同而且意义没有联系。","w":"high","e":["2014 真题","2021 真题"]},{"t":"现代汉字形音义关系的种类有哪些？请说明。","y":"简答题","p":["单音单义字：一形对一音一义","多音多义字：一形对数音数义","异读字：一形对数音一义","异体字：数形对一音一义","繁简字","同音字","同形字"],"q":"现代汉字形音义关系的种类有：(1)单音单义字：即一形对一音一义，如“灸”(jiǔ)、悼(dào)。(2)多音多义字：即一形对数音数义，如“打”“量”。(3)异读字：即一形对数音一义，如“械”“法”。(4)异体字（也叫异形字）：即数形对一音一义，如“拿”和“拏挐㧱”。(5)繁简字：即一为笔画比较多的字，一为笔画比较少的字","w":"high","e":["2014 真题","2020 真题"]},{"t":"近形字的差异主要表现在哪四个方面？请举例说明。","y":"简答题","p":["笔画数的微小差异","个别笔形的差异","笔画组合关系的差异","构字部件有局部差异"],"q":"近形字也称形近字，是指字形相近而音、义有别的字。近形字的差异大体表现在以下四个方面：1.笔画数的微小差异。例如“乌”和“鸟”、“卯”和“卵”、“夕”和“歹”、“日”和“目”、“免”和“兔”、“戊”和“戍”。2.个别笔形的差异。例如“旧”和“归”、“母”和“毋”；“土”和“士”、“己”“巳”和“已”。3.笔画组合关系的差","w":"high","e":["2011 真题","2018 真题"]},{"t":"同音字按字形是否相同可以分为哪几类？请举例说明。","y":"简答题","p":["狭义：同形同音异义字（如三个“是”）","广义：还包括异形同音异义字（如读jī的41个字）","同音字指读音相同、意义不同而且意义没有联系的字"],"q":"同音字按字形是否相同可以分为同形同音异义字和异形同音异义字两类。狭义的同音字只指同形同音异义字，例如“(1)实事求是 (2)他是教师 (3)唯你是问”中的三个“是”，字形和字音虽然相同，但从字义看，三者完全不同，而且没有什么联系。广义的同音字，除了同形同音字之外，还包括了异形同音字，即读音完全一样，而字形、字义不同的一","w":"normal","e":["核心考点"]},{"t":"同音字有哪些积极作用和消极影响？","y":"简答题","p":["积极作用：同音字注音、谐音双关、谐音别解等修辞效果","日常交际一般不妨碍，阅读时因字形不同不混淆","听说时可能出现交际障碍（治癌/致癌、越剧/粤剧）","书写时误用同音字会写别字"],"q":"同音字也有一定的积极作用，如可用同音字注音，此外，谐音双关、谐音别解等修辞手段具有特殊的表达效果。例如：年画中画两条鱼，表示“吉庆有余(鱼)”，歇后语“小葱拌豆腐——一青(清)二白”等。同音字一般不会妨碍交际，阅读时，由于字形不同，不会产生混淆。但听、说的过程中有时会出现一些交际障碍，例如把“治癌”听成“致癌”，把“越","w":"normal","e":["核心考点"]},{"t":"试论述现代汉字形、音、义三者之间的错综复杂关系。","y":"论述题","p":["字形是文字层面要素，字音字义是语言层面要素","三要素交叉组合形成各种汉字学术语","分别说明单音单义字、多音多义字、异读字、异体字、繁简字、同音字、同形字","术语命名出发点不同导致内涵交叉重叠"],"q":"字形是文字的物质外壳，是文字层面上的要素；字音和字义是文字所记录语言的音和义，是语言层面上的要素。字形与字音以及字义这三者之间形成了错综复杂的关系。文字的一个形体如果只记录语言单位的一个读音、一个语义，那么事情就简单了。可是实际上，文字同语言的关系不是那么单一。现代汉字学的术语中，例如“多音多义字、同音字、异读字、异体","w":"normal","e":["核心考点"]},{"t":"辨析“异体字”与“繁简字”两个概念。","y":"辨析题","p":["异体字：数形对一音一义，字形间无音义差别","繁简字：笔画多少不同，字音字义相同","异体字整理原则是从俗从简","繁简字由国家明文规定简化规则"],"q":"异体字（也叫异形字）：即数形对一音一义。不同字形之间没有任何音义差别。例如“拿”和“拏挐㧱”，经过整理，规定“拿”为正体字，淘汰了后三个字形。繁简字：即一为笔画比较多的字，一为笔画比较少的字，字音和字义都相同。例如“國”和“国”是繁体和简体的关系，都读guó，它们的字义都是“国家；代表国家的，属于本国的”。二者的区别在","w":"normal","e":["核心考点"]},{"t":"辨析“多音多义字”与“异读字”。","y":"辨析题","p":["多音多义字：一形对数音数义，音义皆别","异读字：一形对数音一义，仅读法习惯不同","异读字原则上应统读，少数文白异读保留","多音多义字如“长”“参”，异读字如“械”“法”"],"q":"多音多义字：即一形对数音数义，即同一个字形却记录不同的读音和不同的字义。例如“长”cháng长短/zhǎng生长，“参”cān参加/shēn人参/cēn参差。异读字：即一形对数音一义，不同读音之间一般没有语义差别，仅仅是不同的人、不同的习惯读法。例如“械”，有人读xiè，有人读jiè，经过审音，规定统读xiè。二者的区","w":"high","e":["2012 真题","2019 真题"]},{"t":"辨析“同音字”与“同形字”。","y":"辨析题","p":["同音字：读音相同、意义不同且无联系，分同形/异形两类","同形字：书写形式相同，语音形式可同可不同","同形字音同义不同相当于狭义同音字，音义都不同相当于多音多义字"],"q":"同音字是指两个或两个以上的汉字，读音相同、意义不同而且意义没有联系。狭义的同音字只指同形同音异义字；广义的同音字还包括异形同音字。同形字：一是音相同，义不同，相当于狭义的同音字，例如“乘”动乘马、乘船与“乘”动进行乘法运算；二是音不同，义不同，相当于多音多义字，例如“打”(dǎ)动打仗、打球与“打”(dá)十二个为一打","w":"normal","e":["核心考点"]},{"t":"判断：异读字的不同读音之间一般没有语义差别。","y":"判断题","p":["正确","异读字一形对数音一义","读音间一般没有语义差别","异读字原则上应统读"],"q":"正确。异读字即一形对数音一义，不同读音之间一般没有语义差别，仅仅是不同的人、不同的习惯读法。例如“械”有人读xiè，有人读jiè，经过审音，规定统读xiè。异读字原则上应该统读，少数文白异读目前还保留着。","w":"normal","e":["核心考点"]},{"t":"异读字即一形对______；异体字即数形对______；繁简字即一为笔画比较多的字，一为笔画比较少的字，______相同。","y":"填空题","p":["异读字一形对数音一义","异体字数形对一音一义","繁简字字音和字义都相同"],"q":"数音一义；一音一义；字音和字义都","w":"normal","e":["核心考点"]},{"t":"下列说法中，属于“一形对数音一义”的是（　）。","y":"单项选择题","p":["异读字即一形对数音一义"],"q":"(3)异读字","w":"high","e":["2012 真题","2019 真题"]},{"t":"辨析下列各组近形字，并说明它们属于近形字差异的哪一种类型：(1)乌—鸟；(2)土—士；(3)冈—内；(4)拴—栓。","y":"分析题","p":["乌—鸟：笔画数的微小差异","土—士：个别笔形的差异（笔画长短高低）","冈—内：笔画组合关系的差异","拴—栓：构字部件有局部差异"],"q":"(1)“乌”和“鸟”属于笔画数的微小差异（“鸟”比“乌”多一点）。(2)“土”和“士”属于个别笔形的差异，它们仅仅在笔画的长短和高低上有差别。(3)“冈”和“内”属于笔画组合关系的差异。(4)“拴”和“栓”属于构字部件有局部差异。近形字也称形近字，是指字形相近而音、义有别的字，其差异大体表现在笔画数、个别笔形、笔画组合","w":"high","e":["2011 真题","2018 真题"]},{"t":"分析下列各字，指出分别属于现代汉字形音义关系中的哪种类型：打(dǎ/dá)、國—国、拿—拏、波(bō)、张—章。","y":"分析题","p":["打(dǎ/dá)：多音多义字（一形对数音数义）","國—国：繁简字","拿—拏：异体字（数形对一音一义）","波(bō)：异读字（一形对数音一义）","张—章：异形同音字（广义同音字）"],"q":"(1)“打(dǎ/dá)”属于多音多义字，即一形对数音数义：“打”(dǎ)动打仗、打球，“打”(dá)量十二个为一打。(2)“國—国”属于繁简字，即一为笔画比较多的字，一为笔画比较少的字，字音和字义都相同。(3)“拿—拏”属于异体字，即数形对一音一义，不同字形之间没有任何音义差别。(4)“波(bō)”属于异读字，即一形","w":"high","e":["2014 真题"]}]},{"id":"xdhy_up-c02-s06","t":"第六节 现代汉字的规范","w":"high","n":38,"k":[{"t":"四定","y":"名词解释","p":["现代汉字规范主要表现在定量、定形、定音和定序上，俗称“四定”。","2001年1月1日起施行的《中华人民共和国国家通用语言文字法》明确规定：“国家推广普通话，推行规范汉字。”"],"q":"现代汉字规范主要表现在定量、定形、定音和定序上，俗称“四定”。","w":"high","e":["2013 真题","2020 真题"]},{"t":"规范汉字","y":"名词解释","p":["“规范汉字”指经过系统整理、由国家发布、通行于大陆现代社会一般应用领域的标准汉字。","“经过系统整理”保证了科学性，“由国家发布”标明权威性，“通行于大陆”确定地域性，“通行于现代社会”指明时代性，“通行于一般应用领域”明确使用层面。"],"q":"“规范汉字”指经过系统整理、由国家发布、通行于大陆现代社会一般应用领域的标准汉字。","w":"high","e":["2019 真题"]},{"t":"字种","y":"名词解释","p":["所谓的“字种”是指汉字的个体种类(即不同的汉字)，异体字、繁体字、简体字和变体字都不影响字种的数量。","例如“群、羣”以及“众、衆”都只算一个字种。","从汉代到现代，各个时代实际使用的汉字总数都不曾超出一万字。"],"q":"所谓的“字种”是指汉字的个体种类(即不同的汉字)，异体字、繁体字、简体字和变体字都不影响字种的数量。","w":"high","e":["教材高频"]},{"t":"通用汉字","y":"名词解释","p":["通用汉字就是书写现代汉语通常要用到的字，也就是除去有特定使用范围的专用字和罕用的生僻字以后的那一部分字。","从商代到现代，一般通用层面使用的汉字数量没有显著变化，可能一直在五六千个左右。","通用字是相对于专用字而言的。"],"q":"通用汉字就是书写现代汉语通常要用到的字，也就是除去有特定使用范围的专用字和罕用的生僻字以后的那一部分字。","w":"high","e":["教材高频"]},{"t":"常用字","y":"名词解释","p":["常用字就是书写现代汉语时经常要用到的字。","汉字总字数很多，通用字的数量也不少，可是人们经常使用的字量并不多，往往只集中在有限的两三千个字种上。","现代汉语常用字的特点：常用性、能产性、稳定性、简易性。"],"q":"常用字就是书写现代汉语时经常要用到的字。","w":"high","e":["2015 真题","2022 真题"]},{"t":"简化字","y":"名词解释","p":["简化字专指政府有关部门公布的规范的简体字。","“简体字”则有特定的含义，指由国家明文规定取代繁体字而推广使用的简体字。","1956年1月，国务院通过并发布了《汉字简化方案》；1964年重新整理、编制了《简化字总表》；1986年10月重新发表《简化字总表》，共收录简化字2235个。","同一个字有几个形体，笔画比较多的叫繁体字，笔画比较少的叫简体字。"],"q":"简化字专指政府有关部门公布的规范的简体字。“简体字”则有特定的含义，指由国家明文规定取代繁体字而推广使用的简体字。","w":"high","e":["2014 真题","2021 真题"]},{"t":"异体字整理","y":"名词解释","p":["异体字指音义都相同仅形不同的字。","整理异体字时，主要采用“从俗从简”的原则。","1955年发布的《第一批异体字整理表》，除了符合严式定义的异体字外，还有包孕关系的异体字、交叉关系的异体字。","从俗，即去生留熟；从简，即选用笔画相对较少的字形。当从俗从简不一致时，往往依据从俗。"],"q":"异体字指音义都相同仅形不同的字。整理异体字时，主要采用“从俗从简”的原则。","w":"high","e":["教材高频"]},{"t":"字形整理","y":"名词解释","p":["以前，我国出版物上使用的汉字字形相当混乱，除了繁体、简体的问题外，还存在字形的小差异。","有些字的结构和轮廓相同，笔画数目和笔形却有少量差异。","1965年1月，文化部和中国文字改革委员会联合发布《印刷通用汉字字形表》，为6196个通用汉字规定了通用字体的印刷规范字形。","之后，人们就把《印刷通用汉字字形表》规定的字形称为新字形。"],"q":"以前，我国出版物上使用的汉字字形相当混乱，除了繁体、简体的问题外，还存在字形的小差异。","w":"high","e":["教材高频"]},{"t":"定音","y":"名词解释","p":["定音就是确定现代汉字的规范字音。","《汉语拼音方案》（1958）确定了普通话的声、韵、调系统。","《普通话异读词审音表》（1985年修订稿）对一千多条异读词作了审订和修订，为字音的标准化打下了基础。"],"q":"定音就是确定现代汉字的规范字音。","w":"high","e":["教材高频"]},{"t":"字序","y":"名词解释","p":["字序就是汉字排列的先后顺序。","汉字字序的复杂性表现为汉字的排序具有多样性和互补性的特点。","汉字序列法主要有两种：音序法、形序法，形序法又分部首法、笔画法和笔形法。"],"q":"字序就是汉字排列的先后顺序。","w":"high","e":["2012 真题","2019 真题"]},{"t":"音序法","y":"名词解释","p":["音序法是按照字音来排列字序的方法。","汉字的音序法经历了声韵序列法、注音字母序列法和汉语拼音字母序列法三个阶段。","汉语拼音序列法内部还有两种：单纯的字母序列法与“音节·汉字·字母分层序列法”。","用音序法排检汉字简单、迅速，一查即得。"],"q":"音序法是按照字音来排列字序的方法。","w":"high","e":["教材高频"]},{"t":"形序法","y":"名词解释","p":["形序法是按照字形的各个方面特点来排列字序的方法。","形序法包括部首法、笔画法、四角号码法等，其中部首法历史最悠久，使用也最普遍。","目前大都采用混合法：A.“笔画——笔形法”，B.“笔形——笔画法”。"],"q":"形序法是按照字形的各个方面特点来排列字序的方法。","w":"high","e":["教材高频"]},{"t":"部首法","y":"名词解释","p":["部首法是东汉许慎在《说文解字》中首创的。","《说文解字》把汉字按其来源分为540部，每部把共同傍从的形旁字列在开头，称为部首。","部首法自创立以后千百年来一直为编纂字书的人所采用，只是分部的多少和字的归部原则有所不同。","语文学界把214部的部首系统称为“传统部首”，而把改变214部的现代各种部首系统称为“改良部首”。"],"q":"部首法是东汉许慎在《说文解字》中首创的。《说文解字》把汉字按其来源分为540部，每部把共同傍从的形旁字列在开头，称为部首。","w":"high","e":["2013 真题","2020 真题"]},{"t":"《通用规范汉字表》","y":"名词解释","p":["《通用规范汉字表》于2013年6月5日由国务院发布。","《通用规范汉字表》收字8105个，分为三级。","该表发布后，社会一般应用领域的汉字使用应以此表为准，原有相关字表全部停止使用。","一级字表共收3500字，是使用频度最高的常用字集；二级字表共收3000字；一、二级字表合计6500字；三级字表收字1605个。","总体特点：整合多个规范，调适内部矛盾；照顾不同需要，科学划分字级；预测信息储备需要，增加特殊领域用字；促进海峡两岸信息互通，分解简繁对应关系。"],"q":"《通用规范汉字表》于2013年6月5日由国务院发布。《通用规范汉字表》收字8105个，分为三级。","w":"high","e":["2016 真题","2021 真题"]},{"t":"20世纪50年代以来，主要通过哪几条途径来精简汉字的字数？","y":"简答题","p":["淘汰异体字（《第一批异体字整理表》淘汰1053个）","更改地名生僻字（精简15个地名字）","统一计量单位名称用字（精简20个字）","通用层面被精简的汉字总数达上千个"],"q":"20世纪50年代以来，主要通过以下途径来精简汉字字数：(1)淘汰异体字。1955年12月，文化部和中国文字改革委员会联合发布了《第一批异体字整理表》，对810组异体字进行整理，淘汰了其中重复多余的异体字1053个。(2)更改地名生僻字。从1956年到1964年，经国务院批准，用同音的常用字代替了35个县级以上地名中的生","w":"high","e":["2014 真题","2021 真题"]},{"t":"现代汉语常用字有哪些特点？","y":"简答题","p":["常用性：出现频率高","能产性：构词能力强","稳定性：最常用的字相对稳定","简易性：书写简易，高频趋简"],"q":"现代汉语常用字有四个特点：(1)常用性。主要的依据是该字出现的频率，例如“的、一、是、在、不、了、有、和、人、这”等字在各家的统计资料中出现频率都是名列前茅的。(2)能产性。常用字大都构词能力比较强，由于能产性强，经常被选作记录新词语的构成成分。例如“电”字，由它参与构成的词多达数百个。(3)稳定性。虽然社会发生了很大","w":"high","e":["2013 真题","2020 真题"]},{"t":"汉字简化方法从形体结构上可以归纳为哪三种？请举例说明。","y":"简答题","p":["局部删除（如術—术、廣—广）","偏旁更换（如癥—症、慶—庆）","整字替换（如釁—衅、聽—听）"],"q":"单纯从形体结构上分析，比较繁体字和简体字，可以归纳为三种简化方法：(1)局部删除。即在原繁体字的基础上，作局部的删除。如“術——术”“廣——广”“穩——稳”。(2)偏旁更换。如“癥——症”“慶——庆”“樹——树”。(3)整字替换。简化字和繁体字的结构模式完全不同。如“釁一衅”“聽一听”“竈一灶”“衛一卫”。","w":"high","e":["2015 真题"]},{"t":"从简化字的来源分析，简化方法可以分为哪三类？","y":"简答题","p":["起用古字（如從—从、雲—云）","草书楷化（如書—书、農—农）","同音替代（如鬆—松、麵—面）"],"q":"还可以从简化字来源来分析简化方法，大概有三类：(1)起用古字。即重新起用笔画相对比较少的古字。例如：從一从、雲一云、禮一礼、衆一众。(2)草书楷化。即把繁体字的草书写法用楷体笔法呈现出来。例如：書一书、農一农、為一为、專一专。(3)同音替代。即用现成的笔画简单的同音、近音字代替繁体字。例如：鬆一松、籲一吁、麵一面、齣一","w":"normal","e":["核心考点"]},{"t":"整理异体字的原则是什么？请举例说明。","y":"简答题","p":["从俗：去生留熟，选用通行字形","从简：选用笔画相对较少的字形","从俗从简不一致时往往依据从俗"],"q":"整理异体字时，主要采用“从俗从简”的原则。从俗，即去生留熟，选用社会和出版物上比较通行的字形，例如选“针”去[鋮]，选“仙”去[僊]，选“脚”去[腳]，选“蝶”去[蜨]。从简，即选用笔画相对较少的字形，例如选“捆”去[綑]，选“猫”去[貓]，选“升”去[昇/陞]，选“窑”去[窯/窰]。当从俗从简不一致时，往往依据从俗，","w":"normal","e":["核心考点"]},{"t":"简述简化字与繁体字的对应问题。","y":"简答题","p":["95.5%是一对一的关系","4.5%一个简化字对应两个或三个繁体字","误转类型：一对二、简繁同形、同音替代同形、简化偏旁类推问题"],"q":"据统计，《简化字总表》的2235个简化字，在简繁转换中有95.5%是一对一的关系，就是一个简化字形只对应一个繁体字形。还有4.5%，一个简化字要对应两个或三个繁体字（或传承字）。例如“发(發/髮)”“里(裏)”“台(臺/檯/颱)”。这样的简化字约有100个，在简繁转换时经常会出现差错。这种误转的类型大致有四种：(1)一","w":"normal","e":["核心考点"]},{"t":"汉字字序的复杂性表现在哪些方面？","y":"简答题","p":["排序的多样性：有形序法、音序法、义序法","排序的互补性：各成系统又互为补充","必须同时运用几种序列法，分层次地处理"],"q":"汉字字序的复杂性表现为汉字的排序具有多样性和互补性的特点：排序的多样性是指汉字的序列法多种多样，有形序法、音序法、义序法。每种序列法都自成系统。排序的互补性是指众多序列法各成系统又互为补充。也就是说，汉字的每一种序列法都有用，但又都往往不能单独地依靠一种序列法来完全解决汉字的排序问题。事实上，由于需要排序的汉字数量较多","w":"high","e":["2012 真题","2019 真题"]},{"t":"部首法的分歧主要表现在哪些方面？","y":"简答题","p":["设部的分歧：部首总数的差异、设立哪些部首","归部的分歧：从义取部还是从位取部","还有同一部首内汉字的排序问题"],"q":"部首法的分歧主要表现在设部和归部两个问题上。设部的分歧主要有两点：一是设立部首总数的差异（有214部、189部、250部、201部、200部五种）；二是应该设立哪些部首，不设立哪些部首。归部的分歧主要是从义取部为主，还是从位取部为主。此外，还有同一部首内汉字的排序问题。在设部和归部上产生分歧的原因，是各家设部和归部的原","w":"normal","e":["核心考点"]},{"t":"《通用规范汉字表》有哪些总体特点？","y":"简答题","p":["整合多个规范，调适内部矛盾","照顾不同需要，科学划分字级","预测信息储备需要，增加特殊领域用字","促进海峡两岸信息互通，分解简繁对应关系"],"q":"《通用规范汉字表》的总体特点是：(1)整合多个规范，调适内部矛盾。它在整合《第一批异体字整理表》(1955)、《简化字总表》(1986)、《现代汉语常用字表》(1988)、《现代汉语通用字表》(1988)的基础上制订。(2)照顾不同需要，科学划分字级。字表把规范汉字分为三个字级。(3)预测信息储备需要，增加特殊领域用字","w":"normal","e":["核心考点"]},{"t":"请说明《通用规范汉字表》的整体结构。","y":"简答题","p":["收字8105个，分为三级","一级字表3500字，满足基础教育和文化普及","二级字表3000字，一二级合计6500字","三级字表1605个，满足专门领域用字需要"],"q":"《通用规范汉字表》收字8105个，分为三级。一级字表共收3500字，是使用频度最高的常用字集，主要满足基础教育和文化普及的基本用字需要。二级字表共收3000字，使用频度仅次于一级字。一、二级字表合计6500字，主要满足出版印刷、辞书编纂和信息处理等方面的一般用字需要。三级字表收字1605个，是姓氏人名、地名、科学技术术","w":"high","e":["2016 真题","2021 真题"]},{"t":"试论述现代汉字规范的主要内容（“四定”），并说明其重要性。","y":"论述题","p":["规范汉字定义与《国家通用语言文字法》规定","定量：确定字量，精简汉字字数","定形：繁体简化、异体整理、字形整理","定音：以《汉语拼音方案》和审音表为依据","定序：音序法和形序法","《通用规范汉字表》是现行核心标准，规范化意义重大"],"q":"2001年1月1日起施行的《中华人民共和国国家通用语言文字法》明确规定：“国家推广普通话，推行规范汉字。”现代汉字规范主要表现在定量、定形、定音和定序上，俗称“四定”。一、定量。就是确定现代汉字的字量。汉字的总量庞大，但实际使用的字量集中在有限的两三千个字种上；现代汉语常用字具有常用性、能产性、稳定性、简易性四个特点。","w":"high","e":["2014 真题","2020 真题"]},{"t":"判断：《通用规范汉字表》收字8105个，分为三级。","y":"判断题","p":["正确","收字8105个，分为三级","一级字表3500字","二级字表3000字","三级字表1605个"],"q":"正确。《通用规范汉字表》于2013年6月5日由国务院发布，收字8105个，分为三级。一级字表共收3500字，是使用频度最高的常用字集；二级字表共收3000字；一、二级字表合计6500字；三级字表收字1605个。","w":"high","e":["2016 真题","2021 真题"]},{"t":"判断：部首法是东汉许慎在《说文解字》中首创的。","y":"判断题","p":["正确","部首法由东汉许慎首创","《说文解字》分为540部"],"q":"正确。部首法是东汉许慎在《说文解字》中首创的。《说文解字》把汉字按其来源分为540部，每部把共同傍从的形旁字列在开头，称为部首。","w":"high","e":["2013 真题"]},{"t":"判断：现代汉字的“四定”是指定量、定形、定音、定序。","y":"判断题","p":["正确","四定指定量、定形、定音、定序","依据《国家通用语言文字法》"],"q":"正确。现代汉字规范主要表现在定量、定形、定音和定序上，俗称“四定”。2001年1月1日起施行的《中华人民共和国国家通用语言文字法》明确规定：“国家推广普通话，推行规范汉字。”","w":"high","e":["2013 真题","2020 真题"]},{"t":"判断：所谓“字种”是指汉字的个体种类，异体字、繁体字、简体字和变体字都不影响字种的数量。","y":"判断题","p":["正确","字种是汉字的个体种类","异体字等不影响字种数量","“群、羣”只算一个字种"],"q":"正确。所谓的“字种”是指汉字的个体种类(即不同的汉字)，异体字、繁体字、简体字和变体字都不影响字种的数量。例如“群、羣”以及“众、衆”都只算一个字种。","w":"normal","e":["核心考点"]},{"t":"现代汉字的标准化包括四个方面的内容：______、______、______、______。","y":"填空题","p":["现代汉字规范：定量、定形、定音、定序"],"q":"定量、定形、定音、定序","w":"high","e":["2014 真题","2020 真题"]},{"t":"《通用规范汉字表》收字______个，其中一级字表收字______个，二级字表收字______个，三级字表收字______个。","y":"填空题","p":["《通用规范汉字表》收字8105个","一级字表3500字","二级字表3000字","三级字表1605个"],"q":"8105；3500；3000；1605","w":"high","e":["2021 真题"]},{"t":"《说文解字》把9353个汉字归为______部，《字汇》和《康熙字典》把部首归并为______部，《新华字典》和新《辞海》分别把部首定为______部和______部，而《汉语大字典》又把部首定为______部。","y":"填空题","p":["《说文解字》部首540个","《字汇》和《康熙字典》214部","《新华字典》189部","新《辞海》250部","《汉语大字典》200部"],"q":"540；214；189；250；200","w":"normal","e":["核心考点"]},{"t":"《通用规范汉字表》共收二级字（　）。","y":"单项选择题","p":["《通用规范汉字表》二级字表共收3000字"],"q":"(4)3000个","w":"high","e":["2021 真题"]},{"t":"常用字最根本的特点是（　）。","y":"单项选择题","p":["常用性主要的依据是该字出现的频率，是最根本的特点"],"q":"(2)常用性","w":"normal","e":["核心考点"]},{"t":"部首法的分歧主要表现在（　）。","y":"单项选择题","p":["部首法的分歧主要表现在设部和归部两个问题上"],"q":"(1)设部和归部","w":"normal","e":["核心考点"]},{"t":"《说文解字》首创了（　）。","y":"单项选择题","p":["部首法是东汉许慎在《说文解字》中首创的"],"q":"(1)部首法","w":"normal","e":["核心考点"]},{"t":"指出下列简化字的简化方法（从形体结构分析）：术(術)、广(廣)、庆(慶)、听(聽)、树(樹)。","y":"分析题","p":["術—术：局部删除（删除大半）","廣—广：局部删除（删除中间，保留轮廓）","慶—庆：偏旁更换","聽—听：整字替换","樹—树：偏旁更换（更换成记号）"],"q":"从形体结构上分析，比较繁体字和简体字，可以归纳为三种简化方法：(1)“術——术”“廣——广”属于局部删除，即在原繁体字的基础上作局部的删除（“术”是删除大半，“广”是删除中间、保留轮廓）。(2)“慶——庆”“樹——树”属于偏旁更换，更换后的偏旁便于称说或便于书写。(3)“聽——听”属于整字替换，简化字和繁体字的结构模式","w":"normal","e":["核心考点"]},{"t":"“从群众中来，到羣衆中去。”一句中含有多少个不同的字种？请分析。","y":"分析题","p":["字种是汉字的个体种类，异体字不影响字种数量","“群”与“羣”只算一个字种","“众”与“衆”只算一个字种","全句共7个不同的字种：从、群、众、中、来、到、去"],"q":"字种是指汉字的个体种类(即不同的汉字)，异体字、繁体字、简体字和变体字都不影响字种的数量。该句中“群”与“羣”是异体字关系，只算一个字种；“众”与“衆”是异体字关系，也只算一个字种。因此，“从、群、众、中、来、到、去”共7个不同的字种。","w":"normal","e":["核心考点"]}]},{"id":"xdhy_up-c02-s07","t":"第七节 现代汉字的信息处理","w":"high","n":22,"k":[{"t":"汉字信息处理","y":"名词解释","p":["汉字信息处理就是利用计算机对汉字符号系统进行处理的一项科学技术。","所谓语言信息处理就是指用计算机对自然语言的形、音、义等信息进行处理。","汉字信息处理不等同于中文信息处理。汉字信息处理系统则是中文信息处理系统中一个关键和基础的部分。","汉字信息处理，对使用者来说，最主要的是汉字信息的输入与输出。"],"q":"汉字信息处理就是利用计算机对汉字符号系统进行处理的一项科学技术。","w":"high","e":["2014 真题","2019 真题"]},{"t":"整字输入法","y":"名词解释","p":["整字输入法是把整个汉字作为输入符号。一般是把几千个汉字按照一定的顺序排列在一个大键盘上，使用者用键盘击打或电笔点触输入。","汉字键盘输入方式大体上经历了三个发展阶段：整字输入法、汉字编码输入法、汉语拼音输入法。","这种大键盘输入方式的优点是一字一键，无重码，直观性好，操作简单；缺点是需要特制键盘，速度较慢，设备笨重，成本昂贵，难以普及。"],"q":"整字输入法是把整个汉字作为输入符号。一般是把几千个汉字按照一定的顺序排列在一个大键盘上，使用者用键盘击打或电笔点触输入。","w":"high","e":["教材高频"]},{"t":"汉字编码输入法","y":"名词解释","p":["汉字编码输入法是把每个汉字编成一个代码，然后利用国际通用小键盘把代码输入计算机。","这种输入法需要进行专门的学习和训练，优点是速度快、重码少，但是写作过程不断受到干扰，使用起来十分不便。","根据抽取汉字信息特征的不同，汉字编码方案可分为音码、形码、音形结合码三类。"],"q":"汉字编码输入法是把每个汉字编成一个代码，然后利用国际通用小键盘把代码输入计算机。","w":"high","e":["教材高频"]},{"t":"音码","y":"名词解释","p":["音码是按照汉字字音编码输入的设计。音码输入实际上是一种拼音转换法，即利用现行的汉语拼音方案输入拼音，把汉字转换成国际通用的拼音编码输入计算机，再由计算机自动转换为汉字。","拼音编码输入法在具体实施中有两种不同的方案：一种是全拼式，一种是双拼式。","音码的优点在于它可以使用计算机上的通用键盘，并且只要使用者基本掌握汉语拼音方案和普通话语音即可进行操作，不需要专门培训。缺点在于同音字需要二次选择，影响输入速度。"],"q":"音码是按照汉字字音编码输入的设计。音码输入实际上是一种拼音转换法，即利用现行的汉语拼音方案输入拼音，把汉字转换成国际通用的拼音编码输入计算机，再由计算机自动转换为汉字。","w":"high","e":["教材高频"]},{"t":"形码","y":"名词解释","p":["形码是按照汉字字形编码输入的设计。它将汉字的形体分解为若干字元（例如笔画、部件、偏旁、部首），再利用字元代码表和字元排列顺序规则得到汉字编码，然后在键盘上输入。","形码着眼于汉字形体，有效地避免了同音字的问题，因此输入速度大大提高。其缺点在于掌握字形编码方案需要专门训练。","常见的字形编码方案有笔形编码、部件编码、部首编码和四角编码等四种。"],"q":"形码是按照汉字字形编码输入的设计。它将汉字的形体分解为若干字元（例如笔画、部件、偏旁、部首），再利用字元代码表和字元排列顺序规则得到汉字编码，然后在键盘上输入。","w":"high","e":["教材高频"]},{"t":"音形结合码","y":"名词解释","p":["为了克服形码和音码各自的缺点，形音结合的输入法应运而生。这类编码方案又可分为两种：一种是以字形为主字音为辅的形音码，一种是以字音为主字形为辅的音形码。","形音码与纯形码的不同在于还要利用某些字音信息，即在形码上附加音码。","在实际操作过程中，音形信息的转换往往影响使用者思想的连贯性。"],"q":"为了克服形码和音码各自的缺点，形音结合的输入法应运而生。这类编码方案又可分为两种：一种是以字形为主字音为辅的形音码，一种是以字音为主字形为辅的音形码。","w":"high","e":["教材高频"]},{"t":"汉语拼音输入法","y":"名词解释","p":["汉语拼音输入是以汉语拼音连续输入为手段，而由计算机自动转换为汉字的一种计算机汉字处理技术。","汉语拼音输入法的优越性：不需要编码规则；体现语言中以词为单位的特点；输入与思维同步进行；有利于学习普通话和汉语拼音；有利于国际的信息交流。","汉语拼音输入法符合我国国策，是发展方向。其中减少同音选择是完善汉语拼音输入法的关键。"],"q":"汉语拼音输入是以汉语拼音连续输入为手段，而由计算机自动转换为汉字的一种计算机汉字处理技术。","w":"high","e":["2015 真题","2021 真题"]},{"t":"汉字的字形识别输入","y":"名词解释","p":["汉字的字形识别输入就是通过特定的文图扫描装置，对印刷在纸上或写在纸上的汉字字符进行分类判别。它用光学字符识别器“扫描仪”抽取汉字字形特征，将纸面上的汉字信息转换成离散的电信号，然后再送入计算机识别，形成汉字内部码。","汉字识别在学科上属于模式识别和人工智能范畴，在应用上属于汉字信息处理系统的一种高速输入方式。","目前比较成熟的识别方法有图形匹配法和结构分析法两种。"],"q":"汉字的字形识别输入就是通过特定的文图扫描装置，对印刷在纸上或写在纸上的汉字字符进行分类判别。它用光学字符识别器“扫描仪”抽取汉字字形特征，将纸面上的汉字信息转换成离散的电信号，然后再送入计算机识别，形成汉字内部码。","w":"high","e":["教材高频"]},{"t":"汉字的语音识别输入","y":"名词解释","p":["汉字的语音识别输入就是通过与计算机连接的传声装置，利用语音分析技术，抽取语音特征参数，由计算机进行辨识并形成汉字内部码。","语音识别的原理是把语音先根据语法规则切词，根据语音规则切音段，再根据语境、语用和语义规则辨别词句。","根据输入者的身份，语音识别可分为特定人的语音识别和非特定人的语音识别两类。根据输入者的发音方式，语音识别又可分为孤立词语音识别和连续语音识别两类。"],"q":"汉字的语音识别输入就是通过与计算机连接的传声装置，利用语音分析技术，抽取语音特征参数，由计算机进行辨识并形成汉字内部码。","w":"high","e":["教材高频"]},{"t":"点阵法","y":"名词解释","p":["点阵法是最早使用的一种字形描述方法。","汉字打印机、汉字显示终端以及计算机——激光汉字编辑排版系统等汉字输出设备，都要把汉字字形变成数字化的点阵。","点阵利用位于一定栅格内的黑点和白点来存储、显示和打印汉字字形。"],"q":"点阵法是最早使用的一种字形描述方法。","w":"high","e":["教材高频"]},{"t":"汉字键盘输入方式大体上经历了哪三个发展阶段？各有什么优缺点？","y":"简答题","p":["整字输入法：一字一键、无重码，但设备笨重、难普及","汉字编码输入法：速度快、重码少，但需专门训练","汉语拼音输入法：无编码规则、简单易学，是发展方向"],"q":"汉字键盘输入方式大体上经历了三个发展阶段：整字输入法、汉字编码输入法、汉语拼音输入法。(1)整字输入法是把整个汉字作为输入符号，优点是一字一键，无重码，直观性好，操作简单；缺点是需要特制键盘，速度较慢，设备笨重，成本昂贵，难以普及。(2)汉字编码输入法是把每个汉字编成一个代码，优点是速度快、重码少，但写作过程不断受到干","w":"high","e":["2014 真题","2019 真题"]},{"t":"汉字编码方案根据抽取汉字信息特征的不同可分为哪几类？各有何优缺点？","y":"简答题","p":["音码：简单易学、可盲打，但同音字难处理","形码：按形取码，输入速度快，但规则多难掌握","音形结合码：兼顾字形与字音信息"],"q":"根据抽取汉字信息特征的不同，汉字编码方案可分为音码、形码、音形结合码三类。形码的优点是按形取码，不涉及字音，因此不认识的字也同样可以编码输入，输入速度较快；但汉字形体结构复杂，分解标准不一，主观随意性太强。音码的优点是简单易学，可以盲打，缺点是不认识的字输入较困难，同音字较难处理。音形结合码是为了克服形码和音码各自的缺","w":"normal","e":["核心考点"]},{"t":"汉字编码方案的选优评定标准主要有哪几条？","y":"简答题","p":["基本符号少，能实现盲打","规则简单易记，操作方便易学","一字一码，没有重码","输入和处理效率高，设备经济实用"],"q":"汉字编码方案的标准化，即一般所说的选优工作。关于选优的评定标准主要有四条：1)基本符号少，能实现盲打；2)规则简单易记，操作方便易学；3)一字一码，没有重码；4)输入和处理效率高，设备经济实用。根据上述要求优选制订出最佳方案推广试用，在试用中进一步完善，从而形成汉字输入编码方案的国家标准。","w":"normal","e":["核心考点"]},{"t":"汉语拼音输入法有哪些优越性？","y":"简答题","p":["不需要编码规则","体现语言中以词为单位的特点","输入与思维同步进行","有利于学习普通话和汉语拼音","有利于国际的信息交流"],"q":"汉语拼音输入法的优越性：(1)不需要编码规则。汉语拼音输入法是一种无编码方案，使用者无须记忆编码规则。(2)体现语言中以词为单位的特点。它的词库里贮存大量现代汉语的词汇，这样就在很大程度上弥补了同音字多的不足。(3)输入与思维同步进行。(4)有利于学习普通话和汉语拼音。(5)有利于国际的信息交流。汉语拼音输入法符合我国","w":"high","e":["2015 真题","2021 真题"]},{"t":"汉字信息处理中，汉字的输入方式和输出方式各有哪些？","y":"简答题","p":["输入方式：键盘输入、字形识别输入、语音识别输入","输出方式：汉字字形输出、汉字语音输出","点阵法是最早使用的字形描述方法"],"q":"汉字信息处理，对使用者来说，最主要的是汉字信息的输入与输出。汉字的输入方式主要有三种：汉字的键盘输入、汉字的字形识别输入、汉字的语音识别输入。汉字信息的输出可分为汉字字形输出和汉字语音输出两大类，其中点阵法是最早使用的一种字形描述方法。","w":"normal","e":["核心考点"]},{"t":"什么是汉字字形识别输入？其识别方法有哪些？","y":"简答题","p":["定义：通过文图扫描装置对汉字字符进行分类判别","图形匹配法：与标准字形配比求相似度","结构分析法：提取特征量判定字种归属","分为印刷体汉字自动识别和手写体汉字自动识别两类"],"q":"汉字的字形识别输入就是通过特定的文图扫描装置，对印刷在纸上或写在纸上的汉字字符进行分类判别。它用光学字符识别器“扫描仪”抽取汉字字形特征，将纸面上的汉字信息转换成离散的电信号，然后再送入计算机识别，形成汉字内部码。目前比较成熟的识别方法有图形匹配法和结构分析法两种。汉字字形识别可以分为印刷体汉字自动识别和手写体汉字自动","w":"normal","e":["核心考点"]},{"t":"判断：汉语拼音输入法是一种无编码方案，不需要记忆编码规则。","y":"判断题","p":["正确","汉语拼音输入法是无编码方案","不需要记忆编码规则","减少同音选择是关键"],"q":"正确。汉语拼音输入法是一种无编码方案，使用者无须记忆编码规则，只要掌握汉语拼音和普通话，就能应用自如。汉语拼音输入法符合我国国策，是发展方向，其中减少同音选择是完善汉语拼音输入法的关键。","w":"normal","e":["核心考点"]},{"t":"汉字键盘输入方式大体上经历了三个发展阶段：(1)______、(2)______、(3)______。","y":"填空题","p":["汉字键盘输入三个发展阶段：整字输入法、汉字编码输入法、汉语拼音输入法"],"q":"整字输入法；汉字编码输入法；汉语拼音输入法","w":"high","e":["2014 真题"]},{"t":"汉字编码方案根据抽取汉字信息特征的不同，可分为______、______、______三类。","y":"填空题","p":["汉字编码方案分为音码、形码、音形结合码"],"q":"音码、形码、音形结合码","w":"normal","e":["核心考点"]},{"t":"计算机汉字输入方式主要有______、______和______。","y":"填空题","p":["汉字输入方式：键盘输入、字形识别输入、语音识别输入"],"q":"汉字的键盘输入、汉字的字形识别输入、汉字的语音识别输入","w":"normal","e":["核心考点"]},{"t":"王永民的五笔字型码属于（　）。","y":"单项选择题","p":["部件编码以王永民的五笔字型码为代表"],"q":"(1)部件码","w":"normal","e":["核心考点"]},{"t":"完善汉语拼音输入法的关键是（　）。","y":"单项选择题","p":["减少同音选择是完善汉语拼音输入法的关键"],"q":"(3)减少同音字选择","w":"normal","e":["核心考点"]}]}]},{"id":"xdhy_up-c03","t":"第三章 词汇","w":"high","s":[{"id":"xdhy_up-c03-s01","t":"第一节 现代汉语词汇概述","w":"high","n":32,"k":[{"t":"词汇","y":"名词解释","p":["词汇也称语汇，是语言中能独立运用的最小的音义结合单位的集合，有时也可以指特定领域中词语的集合。","词语是能够独立运用的音义结合的最小语言单位。词语包括词和固定短语，词是词汇的主体部分，而固定短语是词汇的重要组成部分。","词语的总和形成词汇，词汇与词语的关系是集合与个体的关系。","根据语言差异，词汇可分为汉语词汇、英语词汇、德语词汇等；根据领域不同，词汇可分为政治词汇、经济词汇、法律词汇等。"],"q":"词汇也称语汇，是语言中能独立运用的最小的音义结合单位的集合，有时也可以指特定领域中词语的集合。","w":"high","e":["教材高频"]},{"t":"语素","y":"名词解释","p":["语素是语言中最小的音义结合的构词单位，是最基本的语言单位。","一个语素必须是语音与语义结合，而且不能再拆分。其中，具有一定的语义是判断语素的最基本条件。","汉语绝大多数语素是一个有意义的音节。如“床”的语音形式是chuáng，它的语义内容是“供人躺在上面睡觉的家具”，那么，“床”就是一个语素。","有少数语素是由两个无意义的音节合成的。如“玻璃”，它的语音形式是bōli，语义是“一种质地硬而脆的透明物体”。“玻”和“璃”虽然都有语音形式，但都没有单独的语义，因此都不是语素；只有“玻璃”才是一个语素。"],"q":"语素是语言中最小的音义结合的构词单位，是最基本的语言单位。一个语素必须是语音与语义结合，而且不能再拆分。其中，具有一定的语义是判断语素的最基本条件。","w":"high","e":["教材高频"]},{"t":"成词语素","y":"名词解释","p":["能够独立成词的语素是成词语素。","不能独立成词的语素是不成词语素，它只是词语的构成单位。","成词语素如：他、书、看、来、好、就、很、也、了、被、呢、吗、葡萄、牡丹、啰唆、朦胧等；不成词语素如：童(心)、日(子)、衣(服)、朗(读)、历(史)、肃(清)、(人)民、(丢)失等。"],"q":"能够独立成词的语素是成词语素。","w":"high","e":["教材高频"]},{"t":"定位语素","y":"名词解释","p":["一个语素同别的语素组合成词时，位置固定的语素叫定位语素。","根据位置的前后，又分为前置定位语素和后置定位语素。","前缀如：非(非常、非凡、非法、非分等)；后缀如：者(读者、记者、作者、学者等)、化(绿化、美化、净化、激化等)。","一个语素同别的语素组合成词时，位置不固定的语素叫不定位语素，如“电”可以前置（电器、电子、电影），也可以后置（闪电、雷电、水电）。"],"q":"一个语素同别的语素组合成词时，位置固定的语素叫定位语素。","w":"high","e":["教材高频"]},{"t":"扩展法","y":"名词解释","p":["扩展法就是在一个语言单位内部插入其他成分，来观察语言单位的意义是否发生了改变。","如果语言单位的意义改变了或者不合法，则说明该语言单位在意义上是最小的，是词，否则就是短语。","词的意义具有凝固性和专指性，不可以扩展，而短语的意义具有分析性，可以扩展。因此，“扩展法”是区别词和短语的基本方法。"],"q":"扩展法就是在一个语言单位内部插入其他成分，来观察语言单位的意义是否发生了改变。","w":"high","e":["教材高频"]},{"t":"意义整合","y":"名词解释","p":["词的意义比较凝固，往往不是语素意义的简单相加，具有综合性。","自由短语的意义往往可以从组成成分及其意义关系上给予解释，其组成成分在意义上具有相对独立性，短语的整体意义是组合成分意义的加合，具有分析性。","比如：指称一种蔬菜的“白菜”不等于“白色的菜”，指称一种教具的“黑板”不等于“黑色的板”；而“白布”就是“白色的布”，“门窗”就是指“门”和“窗”。"],"q":"词的意义比较凝固，往往不是语素意义的简单相加，具有综合性。","w":"high","e":["教材高频"]},{"t":"离合词","y":"名词解释","p":["有些双音节词在中间可以插入别的成分而变成短语，这类可以插入别的成分变成短语的词叫“离合词”。","常见的离合词有“洗澡、站岗、生气、结亲、伤心、帮忙、随便、游泳、推翻、说服、打倒、看见”等。"],"q":"有些双音节词在中间可以插入别的成分而变成短语，这类可以插入别的成分变成短语的词叫“离合词”。","w":"high","e":["教材高频"]},{"t":"固定短语","y":"名词解释","p":["固定短语是词与词的固定组合，在长期使用过程中形成了相对完整的意义，在实际使用时作用相当于一个词。","其特点是：(1)其中的词和词序一般不能自由变化；(2)整个短语的意义往往不能按字面意义去理解；(3)与词一样不能拆开，并且具有独立运用能力。","可见，固定短语具有结构的固定性、意义的整体性、功能的独立性。","固定短语主要有两类：一是专用短语，指特定的人物、地方、机构、活动以及会议等的名称；二是惯用熟语，指成语、谚语、歇后语与习用语。"],"q":"固定短语是词与词的固定组合，在长期使用过程中形成了相对完整的意义，在实际使用时作用相当于一个词。","w":"high","e":["教材高频"]},{"t":"双音节化","y":"名词解释","p":["汉语词汇发展的一个明显的趋势就是“双音节化”。","现代汉语的语素以单音节为主，词则以多音节为主。古代汉语中，以单音节词为主，而现代汉语则以多音节词为主，特别是双音节词占绝大多数。","其原因主要有以下三个：一是有助于避免大量同音词的出现；二是双音节词使词义的表达更为细腻、精确；三是双音节读起来往往带有一种乐感，轻重之间形成一种节奏，悦耳动听。"],"q":"汉语词汇发展的一个明显的趋势就是“双音节化”。","w":"high","e":["教材高频"]},{"t":"什么是语素？判断一个语言单位是不是语素的标准是什么？","y":"简答题","p":["语素是语言中最小的音义结合的构词单位","一个语素必须是语音与语义结合且不能再拆分","具有一定的语义是判断语素的最基本条件","同形替代法是基本验证方法","两个基本标准：具有独立意义、与整体意义有联系"],"q":"语素是语言中最小的音义结合的构词单位，是最基本的语言单位。一个语素必须是语音与语义结合，而且不能再拆分，其中，具有一定的语义是判断语素的最基本条件。鉴定一个词语由几个语素构成，通常采用“同形替代法”。词语中的一个成分要作为语素必须满足两个基本标准：一是该词语分解出的这个成分必须具有独立的意义；二是这个成分的意义必须与该","w":"high","e":["2012 真题","2017 真题"]},{"t":"根据不同的标准，语素可以分为哪些类别？","y":"简答题","p":["根据音节数量：单音节、双音节、多音节","根据构词能力：成词语素、不成词语素","根据构词位置：定位语素、不定位语素"],"q":"语素可以根据音节数量、构词能力和构词位置分成不同的类别。根据音节数量，语素可以分为单音节、双音节和多音节三类；根据构词能力，语素可以分为成词语素、不成词语素两类；根据构词位置，语素可以分为定位语素、不定位语素两类。","w":"high","e":["教材高频"]},{"t":"同一个汉字与语素之间存在哪些对应关系？","y":"简答题","p":["同一汉字语音不同意义不同，代表不同语素","同一汉字语音相同意义不同，代表不同语素","同一汉字在不同词语中有的(不)是语素"],"q":"同一个汉字与语素的对应关系主要有三种：1.同一个汉字，语音不同，意义不同，代表不同的语素，如“乐”在“快乐(lè)”“音乐(yuè)”中；2.同一个汉字，语音相同，意义不同，代表不同的语素，如“会”在“会中文”“开会”中；3.同一个汉字，在不同词语中，有的是语素，有的不是语素，如“马”在“马匹”中是语素，在“马达”中是","w":"normal","e":["核心考点"]},{"t":"词的内涵有哪三个显著特点？它们分别有什么区别作用？","y":"简答题","p":["一是具有独立运用的能力","二是音义相结合，二者不可缺一","三是最小的语言单位","第一点把词与语素区别开来","第二点把词跟非语素音节区别开来","第三点把词与自由短语区别开来"],"q":"词是能够独立运用的音义结合的最小语言单位。词的内涵有三个显著特点：一是具有独立运用的能力；二是音义相结合，二者不可缺一；三是最小的语言单位。第一点把词与语素区别开来；第二点把词跟非语素音节区别开来；第三点把词与自由短语区别开来。","w":"high","e":["2014 真题"]},{"t":"词与短语的区别可以从哪三个方面进行？","y":"简答题","p":["意义整合：词具有综合性，短语具有分析性","语音停顿：词不允许内部停顿，短语可以有内部停顿","语法功能：词不可扩展，短语可扩展，扩展法是基本方法"],"q":"词与短语的区别可以从意义整合、语音停顿和语法功能三个方面进行区分。意义整合方面，词的意义比较凝固，具有综合性，而短语的意义具有分析性；语音停顿方面，词的语音结构具有整体性，不允许内部有停顿，而短语则可以有内部语音停顿；语法功能方面，词的意义具有凝固性和专指性，不可以扩展，而短语的意义具有分析性，可以扩展，因此“扩展法”","w":"high","e":["教材高频"]},{"t":"什么是词的鉴定方法？请简述四种鉴定方法。","y":"简答题","p":["单说法：依据能否单独回答问题","成分法：依据能否作六大句子成分","扩展法：依据插入别的成分后是否合法","剩余法：对确定虚词非常有效"],"q":"有关词的界定及其与语素、短语的区别，综合起来主要有四种鉴定方法：1.单说法，依据能否单独回答问题来确定词，对确定一个语素可否为词很有效；2.成分法，依据能否作“主、谓、宾、定、状、补”六大句子成分来确定词，对检测不能单说的语言单位是否为词很有效；3.扩展法，依据插入别的语言成分后的语言单位是否合法来确定词，如果不合法该","w":"high","e":["教材高频"]},{"t":"什么是固定短语？它有哪些特点？可分为哪两类？","y":"简答题","p":["固定短语是词与词的固定组合，作用相当于一个词","特点：词和词序不能自由变化；意义不能按字面理解；不能拆开且有独立运用能力","归纳为结构的固定性、意义的整体性、功能的独立性","分类：专用短语和惯用熟语"],"q":"固定短语是词与词的固定组合，在长期使用过程中形成了相对完整的意义，在实际使用时作用相当于一个词。其特点是：(1)其中的词和词序一般不能自由变化；(2)整个短语的意义往往不能按字面意义去理解；(3)与词一样不能拆开，并且具有独立运用能力。可见，固定短语具有结构的固定性、意义的整体性、功能的独立性。固定短语主要有两类：一是","w":"normal","e":["核心考点"]},{"t":"现代汉语词语双音节化的原因是什么？其途径有哪些？","y":"简答题","p":["原因：避免同音词；表达更细腻精确；有乐感、节奏","途径1：加辅助性相关成分","途径2：添加没有实体意义的附加成分","途径3：同义近义单音节语素联合","途径4：三音节省略一个音节","途径5：四音节以上采用缩略法"],"q":"汉语词汇发展的一个明显的趋势就是“双音节化”，其原因主要有三个：一是有助于避免大量同音词的出现；二是双音节词使词义的表达更为细腻、精确；三是双音节读起来往往带有一种乐感，轻重之间形成一种节奏，悦耳动听。双音节化的途径包括：1.以一个单音节语素为主，在前面或后面加上一个辅助性的相关成分；2.单音节语素的前后添加没有实体意","w":"high","e":["2010 真题","2018 真题"]},{"t":"试论述现代汉语语素、词、短语、固定短语之间的关系。","y":"论述题","p":["语素：最小的音义结合的构词单位","词：独立运用的音义结合的最小语言单位（三个特点）","短语：两个或两个以上词组合而成，可扩展","固定短语：词与词的固定组合，作用相当于一个词","层级关系：由小到大、由不自由到自由"],"q":"现代汉语的词汇单位包括语素、词和固定短语，它们处于不同的层级。（一）语素是语言中最小的音义结合的构词单位，是最基本的语言单位；一个语素必须是语音与语义结合，而且不能再拆分。（二）词是能够独立运用的音义结合的最小语言单位，词的内涵有三个显著特点：一是具有独立运用的能力，二是音义相结合，三是语言中最小能独立运用的语言单位。","w":"high","e":["教材高频"]},{"t":"辨析“语素”“词”“短语”三个概念。","y":"辨析题","p":["语素：最小的音义结合的构词单位，不能独立运用","词：独立运用的音义结合的最小语言单位","短语：两个或两个以上词组合而成，可扩展","三者是不同层级的语言单位"],"q":"三者的区别主要在层级和功能上。(1)语素是语言中最小的音义结合的构词单位，是最基本的语言单位，一个语素必须是语音与语义结合而且不能再拆分；语素是构词成分，不能独立运用。(2)词是能够独立运用的音义结合的最小语言单位，具有独立运用能力，可以独立作语法结构成分或独立起语法作用；所有的词都是由语素组成的，但并非所有的语素都能","w":"normal","e":["核心考点"]},{"t":"语素是能够独立运用的最小的音义结合的语言单位。（  ）","y":"判断题","p":["判断：错误","“独立运用的音义结合的最小语言单位”是词","语素是最小的音义结合的构词单位"],"q":"错误。“能够独立运用的音义结合的最小语言单位”是词的定义，不是语素。语素是语言中最小的音义结合的构词单位，是最基本的语言单位，语素不能独立运用。","w":"normal","e":["核心考点"]},{"t":"所有的语素都能单独成词。（  ）","y":"判断题","p":["判断：错误","语素分为成词语素和不成词语素","不成词语素不能单独成词"],"q":"错误。有些语素具有独立运用能力，可以单独成词，叫成词语素；有些语素本身不能单独成词，叫不成词语素，它们可与其他语素或词缀组合，组成具有独立运用能力的词。如“童、朗、历、肃”等都是不成词语素。","w":"normal","e":["核心考点"]},{"t":"“白菜”的意义是“白色的菜”，“黑板”的意义是“黑色的板”。（  ）","y":"判断题","p":["判断：错误","词的意义具有综合性，不是语素意义的简单相加","“白菜”≠“白色的菜”，“黑板”≠“黑色的板”"],"q":"错误。词的意义比较凝固，往往不是语素意义的简单相加。指称一种蔬菜的“白菜”不等于“白色的菜”，指称一种教具的“黑板”不等于“黑色的板”。可见，语素与语素在组合成词的过程中，语素意义已经发生了质的变化，具有了“综合性”。","w":"normal","e":["核心考点"]},{"t":"“鞠个躬”“达得到”这类双音节词可以插入别的成分而变成短语，这类词叫离合词。（  ）","y":"判断题","p":["判断：正确","离合词可以插入别的成分而变成短语","举例：鞠躬→鞠个躬"],"q":"正确。有些双音节词在中间可以插入别的成分而变成短语，这类可以插入别的成分变成短语的词叫“离合词”。如：鞠躬→鞠个躬→鞠个九十度的躬；达到→达得到→达不到。常见的离合词有洗澡、站岗、生气、帮忙、游泳等。","w":"normal","e":["核心考点"]},{"t":"语素是语言中最小的______结合的构词单位，是最基本的语言单位。","y":"填空题","p":["音义"],"q":"音义。语素是语言中最小的音义结合的构词单位，是最基本的语言单位。一个语素必须是语音与语义结合，而且不能再拆分。","w":"normal","e":["核心考点"]},{"t":"词是能够______运用的音义结合的最小语言单位。","y":"填空题","p":["独立"],"q":"独立。词是能够独立运用的音义结合的最小语言单位。词的内涵有三个显著特点：一是具有独立运用的能力；二是音义相结合；三是最小的语言单位。","w":"normal","e":["核心考点"]},{"t":"要鉴定一个词语由几个语素构成，通常采用“______法”。","y":"填空题","p":["同形替代"],"q":"同形替代。“同形替代法”是验证一个词语由几个语素构成的基本方法。如通过用“相、容、外”来替换“礼貌”的前一个成分，替换后的词语仍有意义，那就证明被替换的单位“礼、貌”都是语素。","w":"normal","e":["核心考点"]},{"t":"词与短语的区别可以从意义整合、______和语法功能三个方面进行区分。","y":"填空题","p":["语音停顿"],"q":"语音停顿。词与短语的区别可以从意义整合、语音停顿和语法功能三个方面进行区分。词的语音结构具有整体性，不允许内部有停顿，而短语则可以有内部语音停顿。","w":"normal","e":["核心考点"]},{"t":"汉语词汇发展的一个明显的趋势就是“______化”。","y":"填空题","p":["双音节"],"q":"双音节。汉语词汇发展的一个明显的趋势就是“双音节化”。古代汉语中，以单音节词为主，而现代汉语则以多音节词为主，特别是双音节词占绝大多数。","w":"normal","e":["核心考点"]},{"t":"下列语言单位中，属于语素的是（  ）。","y":"单项选择题","p":["B","语素是最小的音义结合的构词单位","“巧克力”是一个语素"],"q":"B。语素是语言中最小的音义结合的构词单位。“玻”“琵”等音节都没有单独的语义，不是语素；“巧克力”是一个语素；“沙发”整体是一个语素；只有“葡萄”整体是一个语素。但选项中“玻”不是语素，“巧克力”是一个语素，“沙发”是一个语素。正确答案为B“巧克力”。","w":"normal","e":["核心考点"]},{"t":"下列各组词中，全是离合词的一组是（  ）。","y":"单项选择题","p":["A","离合词可以插入别的成分而变成短语","洗澡、站岗、生气、帮忙、游泳都是离合词"],"q":"A。离合词是可以插入别的成分而变成短语的词，如洗澡、站岗、生气、帮忙、游泳等。B组中“琵琶”“玻璃”是单纯词，不能离合；C组“思想”“语言”是联合型合成词，不能离合；D组“扩大”“提高”是补充型复合词，不能离合。","w":"normal","e":["核心考点"]},{"t":"运用“同形替代法”分析“礼貌”由几个语素构成。","y":"分析题","p":["同形替代法是验证语素构成的方法","用“相、容、外”替换“礼”，得到相貌、容貌、外貌","用“节、堂、拜”替换“貌”，得到礼节、礼堂、礼拜","替换后仍有意义，故“礼、貌”都是语素","结论：“礼貌”由两个语素构成"],"q":"“同形替代法”是验证一个词语由几个语素构成的基本方法。通过用有意义的语言单位“相、容、外”来替换“礼貌”的前一个成分（如“相貌”“容貌”“外貌”），再用“节、堂、拜”来替换该词的后一成分（如“礼节”“礼堂”“礼拜”），替换后的词语仍有意义，那就证明被替换的单位“礼、貌”都是语素。因此，“礼貌”由“礼”和“貌”两个语素构","w":"normal","e":["核心考点"]},{"t":"运用“扩展法”分析下列语言单位，判断哪些是词，哪些是短语：大家/大树、海马/海边、扩大/吃饱、杀手/杀猪。","y":"分析题","p":["扩展法是区别词和短语的基本方法","大家/大树：大家是词，大树是短语","海马/海边：海马是词，海边是短语","扩大/吃饱：扩大是词，吃饱是短语","杀手/杀猪：杀手是词，杀猪是短语"],"q":"扩展法就是在一个语言单位内部插入其他成分，来观察语言单位的意义是否发生了改变。如果意义改变了或者不合法，则该语言单位是词；如果合法且意义基本不变，则是短语。(1)“大家”不能扩展为“大的家”，“大树”可扩展为“大的树”，故“大家”是词，“大树”是短语。(2)“海马”不能扩展为“海的马”，“海边”可扩展为“海的边”，故“","w":"normal","e":["核心考点"]}]},{"id":"xdhy_up-c03-s02","t":"第二节 构词法与造词法","w":"high","n":37,"k":[{"t":"构词法","y":"名词解释","p":["构词法是指语素构成词的方式和方法，是对已有词的音节特征和结构关系进行静态的分析和分类。","“构词法”和“造词法”组成了词汇的两大构造系统。","构词法是研究语素如何构成词的方法。"],"q":"构词法是指语素构成词的方式和方法，是对已有词的音节特征和结构关系进行静态的分析和分类。","w":"high","e":["教材高频"]},{"t":"造词法","y":"名词解释","p":["造词法是指人们创造新词的方式和方法，是对新造词的形成方式进行动态的分析和分类。","造词法解决了一个词从无到有的问题，即为了命名新事物和新现象而创造新词的方法。","人们在命名事物和现象而创造新词时，可以根据本民族的语言习惯和对事物现象的认识，运用现有的语言材料创造并组合各种各样的新词。"],"q":"造词法是指人们创造新词的方式和方法，是对新造词的形成方式进行动态的分析和分类。","w":"high","e":["教材高频"]},{"t":"单纯词","y":"名词解释","p":["由一个语素构成的词是单纯词，不存在内部构造问题，但可以根据构词语素的音节特征来划分类型。","根据音节的数量，单纯词可以分为单音节、双音节和多音节三类。","双音节单纯词包括联绵词、叠音词、音译词和拟声词四类。"],"q":"由一个语素构成的词是单纯词，不存在内部构造问题，但可以根据构词语素的音节特征来划分类型。","w":"high","e":["教材高频"]},{"t":"联绵词","y":"名词解释","p":["联绵词是从古代汉语中流传下来的，由两个没有意义的音节连缀成义而形成的词。","根据联绵词两个音节的声母、韵母关系，联绵词可以分为三类：双声词、叠韵词、非双声叠韵词。","双声词指声母相同的联绵词；叠韵词指韵母相同的联绵词；非双声叠韵词指声母和韵母都不相同或不相近的联绵词。"],"q":"联绵词是从古代汉语中流传下来的，由两个没有意义的音节连缀成义而形成的词。","w":"high","e":["教材高频"]},{"t":"叠音词","y":"名词解释","p":["叠音词是同一个音节重叠而成的单纯词。","叠音词属于双音节单纯词，与重叠式合成词（如“爸爸、常常”）不同。"],"q":"叠音词是同一个音节重叠而成的单纯词。","w":"high","e":["教材高频"]},{"t":"词根","y":"名词解释","p":["词根是构成合成词的有实在意义的不定位语素。","合成词是由两个或两个以上语素构成的词。根据语素在合成词中的表义作用，把语素分为词根和词缀。","词缀是构成合成词的附着在词根前后或中间表示附加意义的定位语素。"],"q":"词根是构成合成词的有实在意义的不定位语素。","w":"high","e":["教材高频"]},{"t":"词缀","y":"名词解释","p":["词缀是构成合成词的附着在词根前后或中间表示附加意义的定位语素。","合成词根据词缀的位置，可以分成前缀、后缀、中缀三种类型。","汉语里典型词缀并不太丰富，但是存在比较多的“类词缀”，特点是类似于词缀，意义有不同程度的虚化，但还不彻底；构词功能很强，有组合泛化趋势；其中，后缀与类后缀型最为丰富，中缀和类中缀最少。"],"q":"词缀是构成合成词的附着在词根前后或中间表示附加意义的定位语素。","w":"high","e":["教材高频"]},{"t":"复合词","y":"名词解释","p":["复合式合成词指由至少两个不同词根组合而成的合成词，这是现代汉语最重要的构词法。","根据词根与词根的意义与结构关系，复合词主要有五种类型：联合型、偏正型、述宾型、补充型、主谓型。","联合型由两个意义相同、相近、相关或相反的词根并列组合而成；偏正型前一个词根修饰限制后一个词根；述宾型前后词根构成支配与被支配的关系；补充型后一个词根补充说明前一个词根；主谓型前一个词根是被陈述对象，后一个表示陈述。"],"q":"复合式合成词指由至少两个不同词根组合而成的合成词，这是现代汉语最重要的构词法。","w":"high","e":["教材高频"]},{"t":"派生词","y":"名词解释","p":["派生式合成词是指由词根和词缀组合而成的词。","根据词缀的位置，可以分成前缀、后缀、中缀三种类型。","汉语里典型词缀并不太丰富，但是存在比较多的“类词缀”，特点是类似于词缀，意义有不同程度的虚化，但还不彻底。"],"q":"派生式合成词是指由词根和词缀组合而成的词。","w":"high","e":["教材高频"]},{"t":"重叠词","y":"名词解释","p":["重叠式合成词是通过同一词根的重叠而形成合成词的方式。","重叠词主要分两种：AA型（如爸爸、常常）和AABB型（如骂骂咧咧、花花绿绿）。","AABB型重叠式合成词既没有对应的AB型词，也没有因重叠而增加语法上的意义，属于词法学的构词重叠；而“漂漂亮亮、大大方方”都有对应词“漂亮、大方”，重叠形式具有“程度加强”的语法意义，属于语法学的构形重叠。"],"q":"重叠式合成词是通过同一词根的重叠而形成合成词的方式。","w":"high","e":["教材高频"]},{"t":"摹音式","y":"名词解释","p":["摹音式是用汉语的语音形式模拟事物发出的声音或外语词的发音来创造新词的方法。","摹音式是语音指称法的一种，分为指音型、指情型、指物型、译音型。","指音型通过模仿事物发出的声音来指称该声音；指情型通过模仿人发出的声音来指称人之情感；指物型通过模仿事物发出的声音来指称该事物；译音型通过汉字来记录外语词的发音。"],"q":"摹音式是用汉语的语音形式模拟事物发出的声音或外语词的发音来创造新词的方法。","w":"high","e":["教材高频"]},{"t":"语义关联法","y":"名词解释","p":["语义关联法主要是以概念与概念之间的语义关联为基础，通过组合或比拟等手段来直指或喻指事物现象的方法。","语义关联法分为直指式和喻指式两类。","直指式通过概念之间的关联直指事物现象；喻指式通过概念之间的关联喻指事物现象，包括比喻型、引申型、借代型。"],"q":"语义关联法主要是以概念与概念之间的语义关联为基础，通过组合或比拟等手段来直指或喻指事物现象的方法。","w":"high","e":["教材高频"]},{"t":"类推型","y":"名词解释","p":["类推型是根据与已有概念的语义关系类推成词的方法。","类推型是直指式的一种，分类义类推和反义类推。","类义类推如：雨衣→风衣；文盲→科盲、法盲、音盲、色盲；反义类推如：空姐→空嫂、空哥；国手→国脚；冷门儿→热门儿。"],"q":"类推型是根据与已有概念的语义关系类推成词的方法。","w":"high","e":["教材高频"]},{"t":"短语缩略法","y":"名词解释","p":["短语缩略法是指基于交际的经济性原则，通过简缩部分语素或词使短语缩略成词的造词方法。","短语缩略法包括五种方式：分段简缩式、截段简缩式、综合简缩式、取异合同式、数字概括式。","分段简缩式把短语分段，每段取一个成分；截段简缩式取其中具有区别性特征的一段；综合简缩式把分段与截段相结合；取异合同式保留差异成分，把相同成分合一；数字概括式用数字概括相同的成分，省略不同的成分。"],"q":"短语缩略法是指基于交际的经济性原则，通过简缩部分语素或词使短语缩略成词的造词方法。","w":"high","e":["教材高频"]},{"t":"构词法与造词法有什么区别和联系？","y":"简答题","p":["构词法：语素构成词的方式方法，静态分析","造词法：创造新词的方式方法，动态分析","构词法研究语素如何构成词","造词法解决新词从无到有的问题","二者一静一动，互为补充"],"q":"“构词法”和“造词法”组成了词汇的两大构造系统。构词法是指语素构成词的方式和方法，是对已有词的音节特征和结构关系进行静态的分析和分类；造词法是指人们创造新词的方式和方法，是对新造词的形成方式进行动态的分析和分类。构词法是研究语素如何构成词的方法；造词法解决了一个词从无到有的问题，即为了命名新事物和新现象而创造新词的方法","w":"high","e":["教材高频"]},{"t":"什么是单纯词？它可以分为哪些类型？","y":"简答题","p":["单纯词由一个语素构成","根据音节数量分为单音节、双音节、多音节三类","单音节：传承词、音译词、拟声词","双音节：联绵词、叠音词、音译词、拟声词","多音节：音译词、拟声词"],"q":"由一个语素构成的词是单纯词，不存在内部构造问题，但可以根据构词语素的音节特征来划分类型。根据音节的数量，单纯词可以分为单音节、双音节和多音节三类。单音节单纯词包括传承词、音译词、拟声词；双音节单纯词包括联绵词、叠音词、音译词、拟声词；多音节单纯词包括音译词、拟声词。","w":"high","e":["教材高频"]},{"t":"什么是联绵词？它可以分为哪几类？各举例说明。","y":"简答题","p":["联绵词由两个没有意义的音节连缀成义","双声词：声母相同，如伶俐、参差","叠韵词：韵母相同，如骆驼、汹涌","非双声叠韵词：如妯娌、玛瑙"],"q":"联绵词是从古代汉语中流传下来的，由两个没有意义的音节连缀成义而形成的词。根据联绵词两个音节的声母、韵母关系，联绵词可以分为三类：A.双声词，指声母相同的联绵词，如伶俐、参差、仿佛；B.叠韵词，指韵母相同的联绵词，如骆驼、汹涌、窈窕；C.非双声叠韵词，指声母和韵母都不相同或不相近的联绵词，如妯娌、玛瑙、芙蓉。","w":"high","e":["教材高频"]},{"t":"什么是合成词中的词根和词缀？复合词可分为哪五种类型？","y":"简答题","p":["词根：有实在意义的不定位语素","词缀：表示附加意义的定位语素","复合词五种类型：联合型、偏正型、述宾型、补充型、主谓型"],"q":"合成词是由两个或两个以上语素构成的词。根据语素在合成词中的表义作用，把语素分为词根和词缀：词根是构成合成词的有实在意义的不定位语素，而词缀是构成合成词的附着在词根前后或中间表示附加意义的定位语素。根据词根与词根的意义与结构关系，复合词主要有五种类型：联合型、偏正型、述宾型、补充型、主谓型。","w":"high","e":["2013 真题"]},{"t":"联合型复合词可以分成哪几种关系？请举例说明。","y":"简答题","p":["相近关系：词根意义相同相近，如思想、道路","相关关系：词根意义相关并列，如眉目、矛盾","相反关系：词根意义相反对立，如东西、始终","偏义关系：一个词根意义消失，如国家、窗户"],"q":"联合型复合词由两个意义相同、相近、相关或相反的词根并列组合而成，可分为四种关系：A.相近关系，词根意义相同、相近，可以互为说明，如思想、道路、教授；B.相关关系，词根意义相关、并列，构成一个新的词义，如眉目、矛盾、领袖；C.相反关系，词根意义相反、对立，构成一个新的词义，如东西、始终、开关；D.偏义关系，词根意义相关或","w":"normal","e":["核心考点"]},{"t":"派生词中的类词缀有什么特点？","y":"简答题","p":["类词缀类似于词缀，意义有不同程度的虚化但还不彻底","构词功能很强，有组合泛化趋势","后缀与类后缀型最为丰富，中缀和类中缀最少"],"q":"派生式合成词是指由词根和词缀组合而成的词，根据词缀的位置，可以分成前缀、后缀、中缀三种类型。汉语里典型词缀并不太丰富，但是存在比较多的“类词缀”，特点有三：一是类似于词缀，意义有不同程度的虚化，但还不彻底；二是构词功能很强，有组合泛化趋势；三是其中后缀与类后缀型最为丰富，中缀和类中缀最少。","w":"normal","e":["核心考点"]},{"t":"重叠式合成词主要分为哪两种？AABB型构词重叠与构形重叠有何区别？","y":"简答题","p":["重叠式合成词分AA型和AABB型","AABB型构词重叠无对应AB型词，也无增加的语法意义","构形重叠有对应词，重叠形式具有“程度加强”的语法意义"],"q":"重叠式合成词是通过同一词根的重叠而形成合成词的方式，主要分两种：AA型和AABB型。AABB型重叠式合成词既没有对应的AB型词（如“骂咧、哭啼、跌撞、花绿”都不是词），也没有因重叠而增加语法上的意义，属于词法学的构词重叠；而“漂漂亮亮、大大方方、整整齐齐、高高兴兴”都有对应词“漂亮、大方、整齐、高兴”，重叠形式具有“程","w":"normal","e":["核心考点"]},{"t":"造词法主要有哪些？请简述语义关联法。","y":"简答题","p":["造词法主要有语音指称法、音义结合法、语义关联法、短语缩略法","语义关联法以概念间的语义关联为基础","分
