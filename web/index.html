调值的确定，通常采用赵元任设计的“五度标调法”，方法是建立一个坐标，用从1到5的5度竖轴表示相对音高，用横轴表示音长","其中1表示音高最低点，2表示次低，3表示中高，4表示次高，5表示最高","普通话四声用五度值标记为：阴平55、阳平35、上声214、去声51"],"q":"如果用五度标调法，汉语普通话的调类和调值是：阴平(第一声)，高平调，调值是55, 如 dōng(东)、fēng(风); 阳平(第二声), 中升调, 调值是35, 如 mín (民)、zú(族)；上声(第三声)，降升调，调值是214（但根据最新研究成果，人们在日常交流中普遍都是发成212或211），如hǎo(好)； 去声 (第四声)，高降调，调值是51, 如xià(下)。","w":"high","e":["教材高频"]},{"t":"连读变调","y":"名词解释","p":["连读变调是音节连读时声调发生的变化","例如，两个上声相连，前一个变为阳平，如měihǎo美好→méihǎo","上声和非上声相连，前一个上声则变为半上，调值为21"],"q":"在一些特定情况下，声调会发生变化，即“连读变调”。例如，两个上声相连，前一个变为阳平，如měihǎo 美好→méihǎo； 上声和非上声相连，前一个上声则变为半上, 调值为21。","w":"high","e":["教材高频"]},{"t":"汉语普通话中的轻声音节和一般音节的区别，主要在于音强的不同。","y":"判断题","p":["音强构成语言的重音、轻音和语调","汉语普通话中的轻声音节和一般音节的区别，主要在于音强的不同","如“孙子”表示“儿子的儿子”时“子”读轻声，《孙子兵法》中的“子”不读轻声"],"q":"音强构成语言的重音、轻音和语调。汉语普通话中的轻声音节和一般音节的区别，主要在于音强的不同。","w":"normal","e":["核心考点"]},{"t":"在语音的四种性质中，音质是最基本的属性；音高、音强、音长属于语音的韵律特征，必须依附于音质才能起作用。","y":"判断题","p":["音质在语言中的作用比音高、音强、音长都重要，它可以区分不同的语音","在语音的四种性质中，音质是最基本的属性","音高、音强、音长属于语音的韵律特征，必须依附于音质才能起作用"],"q":"音质在语言中的作用比音高、音强、音长都重要，它可以区分不同的语音。可以说，在语音的四种性质中，音质是最基本的属性； 音高、音强、音长属于语音的韵律特征，必须依附于音质才能起作用。","w":"normal","e":["核心考点"]},{"t":"汉语共有____个辅音；汉语共有____个韵母；汉语的声母通常认为是____个。","y":"填空题","p":[],"q":"汉语共有22个声母，其中21个是由辅音充当的； 另有一类音节没辅音声母，我们把它们称作“零声母音节”……汉语共有39个韵母，由元音或元音加鼻韵尾充当。","w":"high","e":["教材高频"]}]},{"id":"rumen-c09-s02","t":"第二节 语音教学的原则","w":"high","n":7,"k":[{"t":"从第二语言的角度看，语音教学目标有哪三个？它们各自针对什么教学对象？","y":"简答题","p":["三个目标：技能训练、教授汉语、研究汉语，具有层次性","技能训练针对汉语初学者或语言进修生的汉语教师（语言机构教师、海外本土教师）","教授汉语针对汉语作为二语教学专业的本科生或硕士生","研究汉语主要针对汉语语音研究的研究生"],"q":"从第二语言的角度看，语音教学目标可能有三个：技能训练，教授汉语，研究汉语。这三个目标是有层次性的：第一个目标针对的是汉语初学者或单纯的语言进修生作为教学对象的汉语教师……第二个目标针对的是汉语作为二语教学专业的本科生或硕士生；第三个目标主要针对汉语语音研究的研究生。","w":"high","e":["教材高频"]},{"t":"请简述汉外语音对比的四类情况，并说明各类的学习难度。","y":"简答题","p":["母语有目的语没有：注意避免近似的母语语音负迁移","母语和目的语一样：可利用正迁移，难度较小","母语没有目的语有：学习与教授难度较高，需多种方法训练听音辨音发音","母语和目的语相似：表面相似不易察觉，偏误易固化，学习难度不低"],"q":"母语跟目标语的语音对比，可以从元音、辅音、音节、声调、重音、语调等多方面进行……对比一般有四类情况。(一)母语有，目的语没有……(二)母语和目的语一样……(三)母语没有，目的语有……(四)母语和目的语相似。","w":"high","e":["教材高频"]},{"t":"对外汉语语音教学中贯彻“循序渐进”原则，应从哪三方面考虑语音学习难度？","y":"简答题","p":["对比难度：根据语音对比判定难度并安排学习次序，先擦音后塞擦音、先不送气后送气","发展难度：四声难度不同，第一声最易，第三声最难，可按一定次序分别教","认知难度：由语言的自然度因素引起，与生理心理因素有关","如单塞音、单擦音比塞擦音容易，直线调比曲折调容易"],"q":"其实，循序渐进的主要依据是学习难度。以下从三方面讨论语音学习难度。(一) 对比难度……(二) 发展难度……(三) 认知难度。","w":"high","e":["教材高频"]},{"t":"为什么可以按照“第一声→第四声、第二声→第三声”的顺序教汉语四声？","y":"简答题","p":["四声发音难度不同：第一声最易，第四声、第二声次之，第三声最难","汉族幼儿习得次序与留学生一致，说明由语言习得一般规律决定","教学做法：先教第一声定调高，再松声带发第四声，再紧声带逆推第二声，最后发第三声","分开发可减少声调混淆"],"q":"根据上述规律，遵循由易到难的原则，可以依照第一声→第四声、第二声→第三声的次序分别教这四个声调。首先教第一声，因为它能为其他声调定下调子的高低……最后用较低的调高读一个低降第四声，紧接着发一个轻而短促的升调，就能发出第三声。","w":"high","e":["教材高频"]},{"t":"语音教学强调“足量的操练实践”，进行实际语音操练时应注意哪几点？","y":"简答题","p":["技能训练为主，知识讲解为辅","自觉模仿，勤于实践，模仿对象多样","两个教学阶段：集中语音教学阶段（以音节为基本单位）和后语音教学阶段（以句子为基本单位）","教学要形成自动化的听说模式，训练要达到需要的量"],"q":"《国际汉语教师标准》就明确提出语音教学应当注重“有意义的、大量的、多样的实际操练”。在进行实际的语音操练时，应该注意以下几点。(一) 技能训练为主，知识讲解为辅……(二) 自觉模仿，勤于实践……(三) 两个教学阶段。","w":"normal","e":["核心考点"]},{"t":"根据教学实践，汉语四个声调的发音难度不一样，____最容易，____、____次之，____最难。","y":"填空题","p":[],"q":"根据我们对留学生的教学实践，第一声最容易，第四声、第二声次之，第三声最难。","w":"high","e":["教材高频"]},{"t":"试述对外汉语语音教学应遵循的基本原则，并举例说明如何将这些原则落实到实际教学中。","y":"论述题","p":["目标明确：技能训练、教授汉语、研究汉语三个层次","汉外对比：四类对比情况，预测难点，避免负迁移、利用正迁移","循序渐进：按对比难度、发展难度、认知难度安排次序，如先擦音后塞擦音、按四声难度排序","足量的操练实践：技能训练为主、知识讲解为辅，两个教学阶段","结合具体语言点综合运用模仿法、夸张法、演示法、对比法、带音法、分辨法等"],"q":"《教师标准》将“注重利用多种手段展开语音教学”纳入语音教学的基本原则……本节分两部分讨论。","w":"high","e":["教材高频"]}]},{"id":"rumen-c09-s03","t":"第三节 语音教学方法与技巧","w":"high","n":13,"k":[{"t":"模仿法","y":"名词解释","p":["模仿法是语音教学的基本方法，可分为集体模仿和个别模仿","集体模仿是全班学生或部分学生一起模仿录音或教师的发音","个别模仿是学生单个地模仿录音或教师的发音"],"q":"(一) 模仿法 可分为集体模仿和个别模仿。1. 集体模仿 全班学生或部分学生一起模仿录音或教师的发音……2. 个别模仿 学生单个地模仿录音或教师的发音。","w":"normal","e":["核心考点"]},{"t":"夸张法","y":"名词解释","p":["夸张法是在展示发音部位和发音方法、指导学生听音发音时，为加强学生的印象，适当用夸张的方法","它可以突出音素与音素之间、声调与声调之间的区别，促进学生理解和模仿正确的发音","具体包括口形夸张、响度与音程夸张、板书夸张等"],"q":"在展示发音部位和发音方法、指导学生听音发音时，为加强学生的印象，应该适当用夸张的方法。它可以突出音素与音素之间、声调与声调之间的区别，促进学生理解和模仿正确的发音。","w":"normal","e":["核心考点"]},{"t":"带音法","y":"名词解释","p":["带音法是以旧带新，以易带难","先读已经学过的或学生母语中有的音素，这个音素跟将要学习的音素比，或者发音部位相同、相似，或者发音方法相同、相似","学习新语音时，只要改变发音部位(或其中的一小部分)，改变发音方法(或其中一小部分)，就可以顺利带出新的音"],"q":"以旧带新，以易带难。先读已经学过的或学生母语中有的音素，这个音素跟将要学习的音素比，或者发音部位相同、相似，或者发音方法相同、相似； 学习新语音时，只要改变发音部位(或其中的一小部分)，改变发音方法 (或其中一小部分)，就可以顺利带出新的音。","w":"high","e":["教材高频"]},{"t":"分辨法","y":"名词解释","p":["分辨法主要是让学生仔细辨别相近的音素或声调","按语音要素分，有声母、韵母、声调等","按技能、方法分，有辨听、辨认、辨读等"],"q":"主要是让学生仔细辨别相近的音素或声调。按语音要素分，有声母、韵母、声调等； 按技能、方法分，有辨听、辨认、辨读等。","w":"normal","e":["核心考点"]},{"t":"请简述汉语语音难点（声母、韵母、声调）的教学方法。","y":"简答题","p":["声母：送气不送气成对操练（吹纸片法）、清浊对比、舌尖后音综合多法、舌面音动作演示","韵母：i的三个读音随声母教，ü用带音法由i圆唇带出","声调：主要难点是二声上不去、四声下不去、三声不会拐弯","声调教法：对比法（Let's go的go发第四声）、三声按212教并重视语流变调"],"q":"对学习者语音学习中的问题和难点应当有针对性地进行教学……(一) 声母 主要有送气不送气、清浊、舌尖前和舌尖后等几类……(二) 韵母……(三) 声调 汉语声调是多数国家留学生的学习难点，教学中必须给以最大的重视……外国学生的主要困难：第二声上不去，第四声下不去，第三声不会拐弯。","w":"high","e":["教材高频"]},{"t":"如何教留学生掌握汉语的送气音和不送气音？","y":"简答题","p":["问题：许多语言没有明显吐气音，学生常把吐气音发成不吐气音","教法：送气音与不送气音成对操练，用纸片放在嘴前演示气流强弱","练习：韵母声调相同的音节成对操练（bō—pō、dā—tā等）","进行有意义的双音节词训练（pùbù、gāokǎo等）"],"q":"许多语言中没有明显的吐气音，因此不少外国人对吐气音掌握得不好，常常把吐气音发成不吐气音：本来要说“他很快”，却说成了“他很怪”。通常的教法是将吐气音和不吐气音成对进行操作。教师常常用一张纸片放在嘴前……","w":"high","e":["教材高频"]},{"t":"舌尖后音zh、ch、sh、r是大部分学生的学习难点，教学中应如何综合运用多种方法？","y":"简答题","p":["先用直观的发音器官图找准发音部位（舌尖与硬腭）","用双手模拟发音过程，分清zh、ch、sh的不同发音方法","教师带读，学生模仿练习","对不同国家学生通过对比教学：泰语卷舌音、英语r带出，并讲清区别"],"q":"不少语言中没有类似 zh、ch、sh的音，因此，这几个音是大部分学生学习的难点。教学时，必须综合运用多种方法教这几个音。先用直观的发音器官图 (图9.7)，让学生找准这几个音的发音部位 (舌尖与硬腭)，弄清舌头的形状； 然后用双手模拟发音过程，分清 zh、ch、sh三者的不同发音方法； 最后由教师带读，学生模仿练习。","w":"high","e":["教材高频"]},{"t":"英语母语者在学习普通话声母b、d、g时可能出现哪些问题？应该如何纠正？","y":"简答题","p":["问题：受英语清浊对立影响，学生把汉语清音b、d、g发成浊音，如“不”读成[bu]","纠正：将汉语b、d、g与英语发音部位相同的浊辅音对比，明确汉语发音时声带不颤动","通过对比消除母语负迁移"],"q":"英语有20对清浊对立的辅音。因此，母语为英语的学生容易把b、d、g、zh、ch、sh等都发成浊音……在教英语学生学习b、d、g等清辅音时，可以将它们跟英语发音部位相同的浊辅音对比，使学生明白汉语这些音在发音部位上跟英语相似，发音时声带不颤动。","w":"high","e":["教材高频"]},{"t":"留学生在学习普通话韵母ü时常出现什么问题？应该如何纠正？","y":"简答题","p":["问题：很多语言没有ü，学生感到困难、容易发不准","方法：用带音法，先教i（前高不圆唇元音，绝大多数语言都有）","由i延长发音，嘴唇逐步变圆前突，带出ü","ü是前高圆唇元音，重点是圆唇"],"q":"很多语言没有ü，教起来比较困难。较好的办法是用带音法，先教i，然后嘴唇逐步变圆前突，就可以比较容易地发出ū了。","w":"normal","e":["核心考点"]},{"t":"留学生学习普通话声调的主要难点是什么？请结合实例说明如何进行声调教学。","y":"简答题","p":["主要困难：第二声上不去，第四声下不去，第三声不会拐弯","对比法：用英语Let's go！中go对比发第四声（吕必松）","第三声：用模仿法、演示法，解释声带松紧过程，最好按212调值教","重视语流中的声调变化规则，上声变调用音高线演示对比","半上声（21）可用标调法强化"],"q":"汉语声调是多数国家留学生的学习难点，教学中必须给以最大的重视，使用多种有效的办法。外国学生的主要困难：第二声上不去，第四声下不去，第三声不会拐弯。1. 对比法 一些学生发第四声时总下不去。吕必松 (1996) 提过一个方法。英语的 Let'sgo！中 go很像汉语第四声的发音。","w":"high","e":["教材高频"]},{"t":"下列关于语音教学方法说法错误的是（  ）。A.集体模仿的优点是所有人都开口，能提高开口率 B.带音法是以旧带新、以易带难 C.夸张法要求学生保持自然口形不作变化 D.分辨法主要让学生辨别相近的音素或声调","y":"单项选择题","p":["夸张法是为加强印象而适当夸张口形、响度、音程等，突出区别，而非要求保持自然口形","A、B、D均符合教材表述"],"q":"在展示发音部位和发音方法、指导学生听音发音时，为加强学生的印象，应该适当用夸张的方法。它可以突出音素与音素之间、声调与声调之间的区别。","w":"normal","e":["核心考点"]},{"t":"被誉为“以旧带新、以易带难”的语音教学方法是（  ）。A.带音法 B.夸张法 C.演示法 D.对比法","y":"单项选择题","p":["带音法以旧带新、以易带难，先读已学过或母语中有的音素，改变发音部位或方法带出新音","如先教i再带出ü，先教s再带出z、c、sh、zh、ch、r"],"q":"以旧带新，以易带难。先读已经学过的或学生母语中有的音素……就可以顺利带出新的音。","w":"normal","e":["核心考点"]},{"t":"案例分析：\n某汉语教师给一班以英语为母语的初级留学生上语音课。教学发现：（1）学生常把汉语b、d、g发成英语那样的浊音，如把“不”发成[bu]；（2）学生发第四声时总是降不下去，第二声上不去，第三声不会拐弯；（3）学生对声母zh、ch、sh掌握不好；（4）学生抄写拼音时经常把声调标错位置。\n请结合本章语音教学原则与方法，分析这些问题产生的原因，并给出针对性的教学建议。","y":"案例分析题","p":["问题1：英语清浊对立导致b、d、g浊化，用汉外对比消除负迁移，手触喉头感受声带振动","问题2：声调难点（二声上不去、四声下不去、三声不会拐弯），用对比法（Let's go的go）、演示法，三声按212教","问题3：zh、ch、sh是多数学生难点，用发音器官图+双手模拟+带读模仿，先舌尖前音后舌尖后音","问题4：调号只标韵腹上，需专门讲解标调规则","总原则：目标明确、汉外对比、循序渐进、足量操练；技能训练为主、知识讲解为辅；两阶段教学"],"q":"英语有20对清浊对立的辅音。因此，母语为英语的学生容易把b、d、g、zh、ch、sh等都发成浊音……外国学生的主要困难：第二声上不去，第四声下不去，第三声不会拐弯。","w":"high","e":["教材高频"]}]}]},{"id":"rumen-c10","t":"第十章 词汇教学","w":"high","s":[{"id":"rumen-c10-s01","t":"第一节 现代汉语词汇的特点","w":"high","n":7,"k":[{"t":"词汇","y":"名词解释","p":["词汇是语言的建筑材料，是词和固定短语的集合体","词是最小的能够独立运用的语言单位，由语素构成，如“天、地、高兴、游泳、当然”等","固定短语是词与词的组合，相当于一个词，主要由专门用语、熟语和缩略语组成"],"q":"词汇是语言的建筑材料，是词和固定短语的集合体。词是最小的能够独立运用的语言单位，由语素构成，如“天、地、高兴、游泳、当然”等。固定短语是词与词的组合，相当于一个词，主要由专门用语、熟语和缩略语组成。","w":"high","e":["教材高频"]},{"t":"离合词","y":"名词解释","p":["离合词是汉语中既像短语又像词的一类特殊词语，如“照相、散步、见面、结婚”","它增加了汉语词界的模糊性，是词和短语界限不清的表现之一"],"q":"此外，汉语还有不少像“照相、散步、见面、结婚”这样既像短语又像词的“离合词”，更是增加了汉语词界的模糊性。","w":"high","e":["教材高频"]},{"t":"简述现代汉语词汇的主要特点。","y":"简答题","p":["双音节词是主体，单音节词使用频率高、占有重要地位","复合法构词为主，偏正式最多（约占复合合成词56%）","词汇与非词汇界限模糊，切词困难","语素造词理据性强，词语表意明确","包含共同语素的近义词数量多","有叠音词和带叠音形式的词，叠音形式多样"],"q":"现代汉语词汇主要有以下几方面的特点。一、双音节词是主体，单音节词仍占有重要地位……六、有叠音词和带叠音形式的词，叠音形式多样。","w":"high","e":["教材高频"]},{"t":"现代汉语双音节词约占70%，单音节词占27%，且单音节词的使用频率远高于双音节词。","y":"判断题","p":["根据对现代汉语8000个高频词的统计，双音节词约占70%，单音节词占27%，三音节及三音节以上的词只占3%","6285个双音节词的使用频率平均为60次，2400个单音节词的使用频率则高达350次","现代汉语单音节词的数量虽然没有双音节词多，但在口语交际中，其使用频率远高于双音节词"],"q":"根据对现代汉语8000个高频词的统计，双音节词约占70%，单音节词占27%……可见，现代汉语单音节词的数量虽然没有双音节词多，但在口语交际中，其使用频率远高于双音节词。","w":"normal","e":["核心考点"]},{"t":"现代汉语合成词的构词方式主要有三种：____、派生(附加)式和复合式；其中复合词约占合成词的____。","y":"填空题","p":[],"q":"合成词由两个或两个以上语素构成，构词方式主要有以下三种：重叠式————词根的重叠，如“爸爸、妈妈、星星”……现代汉语的词汇以合成词为主，而合成词中绝大多数为复合式合成词，约占合成词的97%。","w":"normal","e":["核心考点"]},{"t":"叠音词","y":"名词解释","p":["叠音词是由两个相同的音相叠而构成的词，如“猩猩、姥姥、匆匆”等","现代汉语词汇里还存在一些带叠音形式的词，名词、数词、量词、形容词、副词、动词都有，叠音形式多样"],"q":"叠音词是由两个相同的音相叠而构成的词，如“猩猩、姥姥、匆匆”等。现代汉语词汇里还存在一些带叠音形式的词，名词、数词、量词、形容词、副词、动词都有。","w":"normal","e":["核心考点"]},{"t":"现代汉语词汇中，单音节词的数量虽没有双音节词多，但在口语交际中其使用频率远高于双音节词。","y":"判断题","p":["正确","单音节词使用频率远高于双音节词"],"q":"可见，现代汉语单音节词的数量虽然没有双音节词多，但在口语交际中，其使用频率远高于双音节词。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c10-s02","t":"第二节 词汇教学的重要性和任务","w":"high","n":4,"k":[{"t":"复用式词语","y":"名词解释","p":["复用式词语也称复用式掌握词语，要求听、说、读、写“四会”，即不仅要理解，还要能运用","词汇教学中，词语可以分为复用式和领会式"],"q":"词汇教学中，词语可以分为复用式和领会式。复用式词语也称复用式掌握词语，要求听、说、读、写“四会”，即不仅要理解，还要能运用。","w":"high","e":["教材高频"]},{"t":"对外汉语词汇教学的任务是什么？如何判断学生是否掌握了某个词语？","y":"简答题","p":["任务：根据教学大纲，在词汇知识指导下掌握一定数量汉语词汇的音、义、形和基本用法，培养正确理解和表达能力","任务：帮助二语者掌握复用式和领会式词语，缩小二者差距","判断标准(Nation)：了解词的形式、意义、位置、功能","词语知识分接受性知识和产出性知识，从识别理解到使用是连续体"],"q":"刘珣 (2000) 曾指出对外汉语词汇教学应该“根据教学大纲的要求，(使学习者)在有关汉语词汇知识的指导下，掌握一定数量的汉语词汇的音、义、形和基本用法，培养其在语言交际中对词汇的正确理解和表达能力”。","w":"high","e":["教材高频"]},{"t":"语言交际中，只要运用了合适的词汇，即使音发不准，语法不正确，也能完成一定的交际任务。","y":"判断题","p":["词汇是学习、掌握一种语言的重要内容","语言交际中，一个人只要运用了合适的词汇，即使音发不准，语法不正确，也能完成一定的交际任务","对二语者来说，词汇是学习的基础和核心，“掌握词汇量越大，用外语进行听说读写的自由度也就越大”（陆俭明，2005）"],"q":"词汇是学习、掌握一种语言的重要内容。语言交际中，一个人只要运用了合适的词汇，即使音发不准，语法不正确，也能完成一定的交际任务。","w":"normal","e":["核心考点"]},{"t":"简述词汇教学的任务。","y":"简答题","p":["刘珣：掌握一定数量的汉语词汇的音、义、形和基本用法，培养正确理解和表达能力","词语分为复用式（四会）和领会式（三会/二会/一会）两类","任务：帮助掌握一定数量的复用式和领会式词语，缩小二者差距","分轻重主次：复用式精讲多练，领会式少花力气","指导词汇学习策略，培养自学能力"],"q":"刘珣 (2000) 曾指出对外汉语词汇教学应该“根据教学大纲的要求，(使学习者)在有关汉语词汇知识的指导下，掌握一定数量的汉语词汇的音、义、形和基本用法……词汇教学的任务，就是帮助二语者掌握一定数量的复用式词语和一定数量的领会式词语。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c10-s03","t":"第三节 教学词汇的选择和控制","w":"high","n":7,"k":[{"t":"词汇选择与控制主要包括哪五个方面？如何实现词汇的选择和控制？","y":"简答题","p":["五个方面：目标词的选取、词汇量的控制、词汇等级的控制、词汇重现率的控制、领会式与复用式词语的确定","考虑教学大纲、教材、学生水平和特点、二语学习规律","通过教材：编者要有词汇控制意识，使词汇数量、等级符合大纲要求","通过教师：明确教哪些词、区分复用式和领会式、使用已学词语、谨慎使用超纲词"],"q":"词汇选择与控制主要包括五个方面：目标词的选取，词汇量的控制，词汇等级的控制，词汇重现率的控制，领会式词语和复用式词语的确定。","w":"high","e":["教材高频"]},{"t":"词汇重现率","y":"名词解释","p":["词汇重现率是指词汇在教材和教学中反复出现的频率","词汇的重现对词汇的巩固和积累有重要作用","研究表明，“新词至少需要6~8次重现，才能初步掌握”(刘珣，2000)","《国际汉语教师标准》把“注重教学中词汇的科学重现”作为词汇教学的一个原则"],"q":"词汇的重现对词汇的巩固和积累有重要作用。一个词语反复出现多次，学生才能记住。研究表明，“新词至少需要6~8次重现，才能初步掌握” (刘珣，2000)。","w":"high","e":["教材高频"]},{"t":"国家汉办2009年的《新汉语水平考试大纲》将词汇分为六级，一级____个，二级____个，三级600个。","y":"填空题","p":[],"q":"国家汉办2009年的《新汉语水平考试大纲》将词汇分为六级，总词汇量有所减少: 一级150个, 二级300个, 三级600个, 四级1200个, 五级2500个, 六级5000个及以上。","w":"normal","e":["核心考点"]},{"t":"领会式词语","y":"名词解释","p":["领会式词语与复用式词语相对，是指只要求达到领会式掌握的词语，即指听、说、读“三会”，听、读“二会”或听“一会”的词语","相对而言，领会式词语是次常用词语，像“配合、普遍、平等、侵略、批准、完整”等是初级阶段的领会式词语，学生理解其意思就可以了","领会式词语还可以区分两类：一类是需要掌握其音形义及常用搭配的词语","另一类是只需要能读懂或听懂的词语"],"q":"词汇教学中，词语可以分为复用式和领会式。复用式词语也称复用式掌握词语，要求听、说、读、写“四会”……领会式词语是指只要求达到领会式掌握的词语，即指听、说、读“三会”，听、读“二会”或听“一会”的词语。","w":"normal","e":["核心考点"]},{"t":"词汇选择与控制主要包括哪几个方面？如何实现？","y":"简答题","p":["五个方面：目标词选取、词汇量控制、词汇等级控制、词汇重现率控制、领会式与复用式词语的确定","通过教材实现（编写者要有词汇控制意识，参考大纲处理语料）","通过教师实现（明确教什么、区分复用式与领会式、使用已学词语、谨慎使用超纲词）"],"q":"词汇选择与控制主要包括五个方面：目标词的选取，词汇量的控制，词汇等级的控制，词汇重现率的控制，领会式词语和复用式词语的确定。……第一通过教材。……第二通过教师。","w":"normal","e":["核心考点"]},{"t":"根据教学经验，中级班精读课每堂课的词汇教学量大致为（　　）。","y":"单项选择题","p":["B"],"q":"根据教学经验，对一堂课的词汇教学量，我们提出自己的意见：初级班读写课: 15~20个; 中级班精读课: 20~25个; 阅读课: 15~20个; 听力课: 10~15个; 口语课：10个以内。","w":"normal","e":["核心考点"]},{"t":"研究表明，新词至少需要______次重现，才能初步掌握（刘珣，2000）。","y":"填空题","p":["6~8"],"q":"研究表明，“新词至少需要6~8次重现，才能初步掌握” (刘珣，2000)。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c10-s04","t":"第四节 词汇教学的重点与难点","w":"high","n":8,"k":[{"t":"对外汉语词汇教学的重点和难点主要有哪几类？","y":"简答题","p":["近义词","多义词","用法特殊的词语","容易混淆的词语（易混淆词）","熟语（成语、惯用语、歇后语）"],"q":"复用式词语当然是教学重点。但并非所有复用式词语都是难点，有些复用式词语容易掌握，不必花太多力气。从教学实践看，对二语者来说，以下几类词语是难点，应该重点讲练。一、近义词 二、多义词 三、用法特殊的词语 四、容易混淆的词语 五、熟语","w":"high","e":["教材高频"]},{"t":"易混淆词","y":"名词解释","p":["易混淆词是指二语学习者容易混淆的词语","易混淆词与同(近)义词有交叉关系，它不仅包括容易混淆的同义词、近义词，还包括语义关系较远或没有同(近)义关系而二语者却经常混用或误用的词（张博，2005、2007）"],"q":"易混淆词，是指二语学习者容易混淆的词语。易混淆词与同(近) 义词有交叉关系，它不仅包括容易混淆的同义词、近义词，还包括语义关系较远或没有同(近) 义关系而二语者却经常混用或误用的词(张博，2005、2007)。","w":"high","e":["教材高频"]},{"t":"最小差异对","y":"名词解释","p":["“最小差异对”就是一组句子除了出现在同一位置上的某个词语不同之外，其余部分完全一样，这组句子因为使用了不同的词语而使得句子的意思不同或导致某个句子不成立","教学中可以利用“最小差异对”来讲练易混淆词"],"q":"教学中可以利用“最小差异对”来讲练。“最小差异对”就是一组句子除了出现在同一位置上的某个词语不同之外，其余部分完全一样，这组句子因为使用了不同的词语而使得句子的意思不同或导致某个句子不成立。","w":"high","e":["教材高频"]},{"t":"易混淆词包括哪些类型？教学中应如何讲练易混淆词？","y":"简答题","p":["母语一词多义对应的汉语词（know→认识/知道/了解）","母语汉字词与对应的汉语词（同形异义）","声音或字形相同、相近的词（文明—闻名、丈夫—大夫）","有相同语素的词（发现/发生）","教学法：利用“最小差异对”讲练，凸显区别"],"q":"张博 (2008) 认为常见的易混淆词除了同义词、近义词以外，还包括以下几类……教学中可以利用“最小差异对”来讲练。","w":"high","e":["教材高频"]},{"t":"案例分析：\n留学生常出现以下偏误：\n(1) *老师，我下午要见面一个朋友。\n(2) *上周我回老家拜访了我奶奶。\n(3) *我要信任我自己，我一定能行。\n(4) *我往往去旅行。/*这个学期，他往往迟到。\n请分析这些偏误产生的原因，并结合本章词汇教学的重点难点，提出针对性的教学建议。","y":"案例分析题","p":["偏误1：离合词“见面”对象不能后置，用介词“跟”引出；教离合词要讲清其离析用法","偏误2：近义词“拜访/看望”语体、对象差异，讲近义词要抓区别性差异与形式区别","偏误3：易混淆词“信任/相信”有相同语素而混用，用“最小差异对”讲练","偏误4：近义词“常常/往往”区别性差异（往往需条件结果、句中需相关成分）","总原则：浅显讲解、难点分化；结合语境、精讲巧练；语素教学与整词教学相结合","通过展示、释义、练习环节，用多种练习形式强化"],"q":"教师可通过例句展示词语的功能与使用条件，引导学生了解词语的用法。如“见面”: 我们以前见过面。/昨天我跟朋友见了一面……针对这类近义词进行讲练，能提高词汇教学效率。","w":"high","e":["教材高频"]},{"t":"案例分析：\n一位汉语教师在中级词汇课上要讲练“常常—通常”和“不—没”两组近义词。学生已学过多年的汉语，但偏误仍然不少。\n请结合本章近义词教学的相关理论，回答：(1)近义词讲练应考虑哪些方面？(2)请为“常常—通常”和“不—没”设计具体的讲练思路。","y":"案例分析题","p":["近义词讲练考虑：常用近义词、用法多差异多的近义词、考察学习偏误、讲练重点是区别性差异","除意义区别外，特别注意形式区别（语法功能、组合搭配、使用范围、句型句式）","常常—通常五点区别：通常需相关成分、过去/将来时间只能用常常、对比、句首位置、作定语","不—没五点差异：将来/过去、与过/了配合、性质形容词、助动词、是/像/等于/属于/知道","抓住主要差异，后两点可先不讲练"],"q":"从二语学习者的角度看，近义词讲练应考虑以下几点。(一) 常用近义词…… (四) 讲练重点是区别性差异……如“不一没”主要有五个差异。","w":"high","e":["教材高频"]},{"t":"易混淆词","y":"名词解释","p":["易混淆词是指二语学习者容易混淆的词语","易混淆词与同（近）义词有交叉关系，它不仅包括容易混淆的同义词、近义词，还包括语义关系较远或没有同（近）义关系而二语者却经常混用或误用的词","张博认为常见的易混淆词除了同义词、近义词以外，还包括：母语一词多义对应的汉语词","母语汉字词与对应的汉语词","声音相同或相近、字形相同或相近的词"],"q":"易混淆词，是指二语学习者容易混淆的词语。易混淆词与同(近)义词有交叉关系，它不仅包括容易混淆的同义词、近义词，还包括语义关系较远或没有同(近)义关系而二语者却经常混用或误用的词。","w":"normal","e":["核心考点"]},{"t":"简述汉语词汇教学中近义词讲练应考虑的几个方面。","y":"简答题","p":["常用近义词（初、中级近义词，偏误多，反复讲练）","用法多、差异多的近义词（三类，后两类是重点难点）","考察学习偏误（经常混淆的即重点）","讲练重点是区别性差异"],"q":"从二语学习者的角度看，近义词讲练应考虑以下几点。(一) 常用近义词 …… (二) 用法多、差异多的近义词 …… (三) 考察学习偏误 …… (四) 讲练重点是区别性差异","w":"normal","e":["核心考点"]}]},{"id":"rumen-c10-s05","t":"第五节 词汇教学的基本原则","w":"high","n":5,"k":[{"t":"简述《国际汉语教师标准》提出的词汇教学六条基本原则。","y":"简答题","p":["汉字形、音、义相结合","解词的浅显、具体、准确、易懂","结合具体语境","理解概念意义和特定语境下的含义","利用对比、组合等多种手段及游戏、阅读等多种方式","词汇的科学重现"],"q":"《国际汉语教师标准》提出词汇教学的六条基本原则：第一，注重利用汉字形、音、义相结合的特点进行词汇教学；第二，注重教学中解词的浅显、具体、准确、易懂；第三，注重结合具体语境进行词汇教学；第四，注重理解词汇的概念意义和特定语境下的含义；第五，注重利用对比、组合等多种手段以及游戏、阅读等多种方式进行词汇教学；第六，注重教学中词汇的科学重现。","w":"high","e":["教材高频"]},{"t":"什么是语素教学？它与整词教学应如何结合？","y":"简答题","p":["语素教学：利用汉语语素构词优势，将词和语素学习结合，通过语素义解释词义、扩展生词、猜测词义","依据：合成词意义大多与语素义存在联系，可依据语素义推求理解","语义透明度高的词（如“面试”）适合语素教学","语义透明度低（疲惫、小说、马虎、点心）或音译外来词（幽默、克隆）需整词教学","实际教学中多种方法综合运用（如“足球”翻译法+语素分解）"],"q":"语素教学，就是利用汉语语素构词的优势，将词和语素的学习结合起来……值得注意的是，“面试”这样的词，语义透明度比较高，适合利用语素进行教学。但是，汉语有些词，语义透明度比较低，如“疲惫、小说、马虎、点心”等，就需要进行整词教学。","w":"high","e":["教材高频"]},{"t":"多义词教学应一次性把所有义项都教给学生，以节省时间。","y":"判断题","p":["多义词教学应特别注意不同义项的教学顺序，遵循常用原则，分阶段教学","初级阶段，教师一般根据某个多义词在课文中的意思和用法进行相应讲解，不应一次性将各个义项教给学生","如“想”有四个主要义项，应结合课文内容语境分开讲练，在学生接触多个义项后再归纳总结"],"q":"多义词教学，应特别注意不同义项的教学顺序，遵循常用原则，分阶段教学。初级阶段，教师一般根据某个多义词在课文中的意思和用法进行相应讲解，不应一次性将各个义项教给学生。","w":"normal","e":["核心考点"]},{"t":"下列哪一项不属于《国际汉语教师标准》提出的词汇教学基本原则？（  ）A.注重利用汉字形、音、义相结合的特点进行词汇教学 B.注重教学中解词的浅显、具体、准确、易懂 C.注重结合具体语境进行词汇教学 D.注重每节课只教复用式词语，避免讲解领会式词语","y":"单项选择题","p":["《国际汉语教师标准》六条原则：形音义结合、解词浅显具体准确易懂、结合具体语境、理解概念义与语境义、利用对比组合及多种方式、词汇科学重现","词汇教学应合理区分复用式与领会式词语，而非只教复用式词语"],"q":"《国际汉语教师标准》提出词汇教学的六条基本原则：第一，注重利用汉字形、音、义相结合的特点进行词汇教学……第六，注重教学中词汇的科学重现。","w":"normal","e":["核心考点"]},{"t":"词汇教学应遵循的基本原则包括浅显讲解、难点分化，结合语境、精讲巧练，以及______与______相结合。","y":"填空题","p":["语素教学","整词教学"],"q":"三、语素教学与整词教学相结合。语素教学，就是利用汉语语素构词的优势，将词和语素的学习结合起来。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c10-s06","t":"第六节 词汇教学的环节和技巧","w":"high","n":9,"k":[{"t":"词汇教学一般有哪几个小环节？展示生词有哪几种排列顺序？","y":"简答题","p":["三个环节：展示生词、解释词义及用法、词语练习","排列顺序两种：按生词表出现先后顺序；按词语特点及联系重新调整分组","分组排列方式：按构字部件排列、按词类排列、按相关意义排列"],"q":"下面我们以小环节表示：环节1，展示生词； 环节2，解释词义及用法； 环节3，词语练习……展示的排列顺序一般有两种，一种是按照生词在课文生词表中出现的先后顺序来排列； 另一种则是根据词语的特点以及词与词之间的联系，重新调整生词表中的生词顺序，并按照新顺序进行分组教学。","w":"normal","e":["核心考点"]},{"t":"请列举并简述词汇教学中讲解词义的主要方法（至少八种）。","y":"简答题","p":["利用形象（实物、图片、动作表情）","利用汉字字形（偏旁部首）","利用近义词或反义词","借助旧词学习新词","利用语素","利用词组","利用上下文语境","利用情景","举例","翻译法","利用图形、符号"],"q":"词汇意义是词汇教学的重点……下面讨论讲解词义的具体方法。1. 利用形象 2. 利用汉字字形 3. 利用近义词或反义词 4. 借助旧词学习新词 5. 利用语素 6. 利用词组 7. 利用上下文语境 8. 利用情景 9. 举例 10. 翻译法 11. 利用图形、符号","w":"high","e":["教材高频"]},{"t":"翻译法","y":"名词解释","p":["翻译法是用外语解释汉语词语的方法","有一些词，用汉语难以解释清楚而用外语解释更方便","还有外来词语，也是用翻译法好，如“幽默：humour”“浪漫：romantic”“圣诞节：christmas”"],"q":"有一些词，用汉语难以解释清楚而用外语解释更方便； 还有外来词语，也是用翻译法好。如：幽默: humour 浪漫: romantic 圣诞节: christmas 钢琴: piano","w":"normal","e":["核心考点"]},{"t":"吕必松提出的五种词汇练习类型分别是什么？请简要说明。","y":"简答题","p":["感知练习：语音感知和词形感知","理解性练习：考查对词义的理解（听义说词、组合搭配等）","模仿性练习：模仿语音、书写和用法（跟读、临写、模仿造句）","记忆性练习：记住发音、意义及用法（听写、词语接龙、传悄悄话）","应用性练习：通过实际运用掌握用法（搭配、改错、改写、造句）"],"q":"关于词汇练习，吕必松先生的《对外汉语教学概论》 (1996) 提到五种不同的练习。（一）感知练习 （二）理解性练习 （三）模仿性练习 （四）记忆性练习 （五）应用性练习","w":"normal","e":["核心考点"]},{"t":"“举世闻名：很有名，全世界都知道”，这采用的词义解释方法是（  ）。A.利用语素 B.借助旧词学习新词 C.利用上下文语境 D.翻译法","y":"单项选择题","p":["借助旧词学习新词是用已学词语解释生词，是中级词汇教学的常用方法","以旧释新法特别适用于成语、俗语、习语等很难用外语解释的词语"],"q":"用已学词语解释生词，是中级词汇教学的常用方法……举世闻名：很有名，全世界都知道。聚精会神：注意力非常集中、非常专心。铁饭碗：比喻稳定可靠的工作。","w":"normal","e":["核心考点"]},{"t":"试述对外汉语词汇教学的环节和技巧，并举例说明如何对初级阶段的生词进行教学。","y":"论述题","p":["三个环节：展示生词、解释词义及用法、词语练习","展示生词：语音展示和词形展示，排列顺序有两种","释义方法多样（形象、字形、近反义词、旧词、语素、词组、语境、情景、举例、翻译、图形符号）","讲解用法用举例法，重视组合搭配","五种练习：感知、理解、模仿、记忆、应用性练习","举例说明初级阶段生词教学，如“足球”翻译法+语素分解+直观法"],"q":"如果把一课书作为一个教学单位，生词教学可以当成一个教学环节……环节1，展示生词； 环节2，解释词义及用法； 环节3，词语练习。","w":"high","e":["教材高频"]},{"t":"展示生词","y":"名词解释","p":["展示生词是把要学的词语通过范读、领读、板书等方法介绍给学生，并让学生认读，从而在词语的书面形式及语音上认识词语，感知词语的过程","包括展示词语的语音和展示词语的词形两方面：展示语音的方式有教师带读、学生集体跟读、小组跟读、个人跟读等","展示词形可以用板书、PPT或生词卡来展示，分为独词展示和分组展示两种"],"q":"把要学的词语通过范读、领读、板书等方法介绍给学生，并让学生认读，从而在词语的书面形式及语音上认识词语，感知词语，这个过程就是展示生词。","w":"normal","e":["核心考点"]},{"t":"词语释义（讲解词义）有哪些主要方法？","y":"简答题","p":["利用形象（实物、图片、动作表情）","利用汉字字形（偏旁部首）","利用近义词或反义词","借助旧词学习新词","利用语素","利用词组、上下文语境、情景","举例、翻译法、利用图形符号"],"q":"下面讨论讲解词义的具体方法。1. 利用形象 …… 2. 利用汉字字形 …… 3. 利用近义词或反义词 …… 4. 借助旧词学习新词 …… 5. 利用语素 …… 6. 利用词组 …… 7. 利用上下文语境 …… 8. 利用情景 …… 9. 举例 …… 10. 翻译法 …… 11. 利用图形、符号","w":"normal","e":["核心考点"]},{"t":"吕必松提出词汇练习有哪五种？请简要说明。","y":"简答题","p":["感知练习（语音感知、词形感知）","理解性练习（听义说词、组合搭配、选择义项等）","模仿性练习（跟读、描红、临写、模仿造句）","记忆性练习（听写、词语接龙、传悄悄话）","应用性练习（搭配、改错、选位置、改写句子、造句）"],"q":"吕必松先生的《对外汉语教学概论》(1996) 提到五种不同的练习。(一) 感知练习 …… (二) 理解性练习…… (三) 模仿性练习 …… (四) 记忆性练习 …… (五) 应用性练习","w":"normal","e":["核心考点"]}]}]},{"id":"rumen-c11","t":"第十一章 语法教学","w":"high","s":[{"id":"rumen-c11-s01","t":"第一节 语法的含义和类别","w":"high","n":8,"k":[{"t":"语法","y":"名词解释","p":["语法，指语言的结构法则","具体来说，指最小音义结合体，构成上一层单位的组织、结构规则，包括语素构成词的规则、词构成短语的规则、词和短语构成句子的规则","从教学的角度来看，语法通常指一种语言中词形变化和组词造句的规则，包括词法（词的构造、变化、分类）和句法（句子的结构、成分、类型）两部分"],"q":"语法，指语言的结构法则。具体来说，指最小音义结合体，构成上一层单位的组织、结构规则……从教学的角度来看，语法通常指一种语言中词形变化和组词造句的规则，包括词法(词的构造、变化、分类) 和句法 (句子的结构、成分、类型) 两部分。","w":"high","e":["教材高频"]},{"t":"教学语法","y":"名词解释","p":["教学语法，指为掌握本族语和外语的语法规则而编写的语法体系，有较强的规定性","如早期的传统语法","与理论语法相比，教学语法的目的是“致语法的用”，分类不要求严格，以说明用途为主，例子力求详实，本身就是学习的材料，对象是语言学习者"],"q":"理论语法，指各种语言学流派的研究成果……理论语法的目的是“建立语言结构的普遍理论或描述各语言的普遍理论框架”。教学语法，指为掌握本族语和外语的语法规则而编写的语法体系，有较强的规定性。如早期的传统语法。","w":"high","e":["教材高频"]},{"t":"请简述理论语法与教学语法的区别。","y":"简答题","p":["理论语法：目标是明语法的理，分类要求概括性和排他性，以最少足够例子说明类别，对象是语言研究者","教学语法：目的是致语法的用，分类不要求严格、以说明用途为主，例子详实本身是学习材料，对象是语言学习者","区别体现在研究目标、分类、例子、对象及条件方面","区分不清的表现：将理论语法照搬进教学语法，带来负面影响"],"q":"许国璋 (1986) 论述过二者的区别：供语言学研究的语法，目标是明语法的理； 分类要求有概括性和排他性； 以最少而又足够的例子说明类别； 对象是语言研究者，学术兴趣比较一致。教学用的语法，目的是致语法的用……","w":"high","e":["教材高频"]},{"t":"周小兵(2002)提出的第二语言汉语教学语法的特点有哪些？","y":"简答题","p":["实用第一","形式和意义并重","考虑篇章和语用因素","语法规则的细化和使用条件的充分","注重描写基础上的解释","注重语际对比（个性与共性）","注重习得研究","使用统计方法和实验方法"],"q":"具体而言，周小兵 (2002) 提出第二语言的汉语教学语法的八个特点：(1) 实用第一。一切从易教易学出发。(2) 形式和意义并重……(8) 使用统计方法和实验方法。","w":"high","e":["教材高频"]},{"t":"描写语法与解释语法","y":"名词解释","p":["描写语法，从特定角度用特定方法对语言结构进行描写，被描写的内容是说本族语者实际遵循的规则，目的是建立某种理论","解释语法，从多种角度对语法现象进行合理解释，主要解释语法现象和规则产生的原因","描写语法回答语法规则“是什么”，解释语法回答语法规则“为什么”"],"q":"描写语法，从特定角度用特定方法对语言结构进行描写……解释语法，从多种角度对语法现象进行合理解释，主要解释语法现象和规则产生的原因……描写语法回答语法规则“是什么”，解释语法回答语法规则“为什么”。","w":"normal","e":["核心考点"]},{"t":"教学语法","y":"名词解释","p":["教学语法指为掌握本族语和外语的语法规则而编写的语法体系，有较强的规定性，如早期的传统语法","它与理论语法相对：理论语法指各种语言学流派的研究成果，目的是“建立语言结构的普遍理论或描述各语言的普遍理论框架”","许国璋论述过二者的区别：供语言学研究的语法，目标是明语法的理","教学用的语法，目的是致语法的用","对外汉语教学语法是第二语言教学语法，周小兵提出其实用第一、形式和意义并重、考虑篇章和语用因素等八个特点"],"q":"教学语法，指为掌握本族语和外语的语法规则而编写的语法体系，有较强的规定性。如早期的传统语法。……供语言学研究的语法，目标是明语法的理……教学用的语法，目的是致语法的用。","w":"normal","e":["核心考点"]},{"t":"描写语法与解释语法","y":"名词解释","p":["描写语法，从特定角度用特定方法对语言结构进行描写，被描写的内容是说本族语者实际遵循的规则，描写的目的是建立某种理论","解释语法，从多种角度对语法现象进行合理解释，主要解释语法现象和规则产生的原因，主张综合采用语言学的方法，并兼用社会学、人类学、心理学、逻辑学等多学科方法","描写语法回答语法规则“是什么”，解释语法回答语法规则“为什么”","描写语法是所有语法的基础"],"q":"描写语法，从特定角度用特定方法对语言结构进行描写。……解释语法，从多种角度对语法现象进行合理解释……描写语法回答语法规则“是什么”，解释语法回答语法规则“为什么”。","w":"normal","e":["核心考点"]},{"t":"简述理论语法和教学语法的区别。","y":"简答题","p":["理论语法：目标是明语法的理，分类有概括性和排他性，对象是语言研究者","教学语法：目的是致语法的用，分类不要求严格，以说明用途为主，对象是语言学习者","区别体现在研究目标、分类、例子、对象及条件等多方面","区分不清会将理论语法照搬进教学语法，带来负面影响"],"q":"许国璋 (1986) 论述过二者的区别：供语言学研究的语法，目标是明语法的理；分类要求有概括性和排他性……教学用的语法，目的是致语法的用；分类不要求严格，以说明用途为主……","w":"normal","e":["核心考点"]}]},{"id":"rumen-c11-s02","t":"第二节 汉语语法的特点","w":"high","n":11,"k":[{"t":"从语法教学的角度看，汉语语法有哪些主要特点？","y":"简答题","p":["词序和语序重要（话题凸显、语序隐含逻辑关系变化）","修饰成分的位置比较固定（定语、状语都在被修饰成分前）","有一些特殊词类和特殊的词（个体量词、语气词、方位词、介词）","狭义形态少（名词无性数格，代词无性和格，动词无形态变化）","特殊的动词结构（动补结构、动宾离合词）","句子成分跟词类既对应又不对应"],"q":"对汉语的语法特点，有许多不完全相同的说法……本节主要从语法教学的角度来讨论汉语语法特点。一、词序和语序重要 二、修饰成分的位置比较固定 三、有一些特殊词类和特殊的词 四、狭义形态少 五、特殊的动词结构 六、句子成分跟词类既对应又不对应","w":"high","e":["教材高频"]},{"t":"话题凸显","y":"名词解释","p":["话题凸显是指汉语的句子结构特点是“话题—说明”，而不是“主语—谓语”","只要是话题（陈述对象），无论是施事、受事、非施事非受事（时间词、处所词、介词结构等）都可以成为话题放在句首","如“今天星期四”“桌子上放着一本书”“在这个地方可以休息”"],"q":"不少学者认为，汉话句子结构的特点是话题凸显，即句子结构是“话题一说明”，而不是“主语—谓语”。只要是话题 (陈述对象)，无论是施事、受事、非施事非受事(时间词、处所词、介词结构等) 都可以成为话题放在句首。","w":"normal","e":["核心考点"]},{"t":"动宾离合词","y":"名词解释","p":["动宾离合词指“见面、鞠躬、洗澡、跑步、结婚、帮忙”等语言单位","它们看起来像一个词，但跟一般动词相比，有一些非词的特点：①表体态的词语往往放在中间，而不是放在最后","②中间还可以插入表数量、性质的词语","不少人认为它们介乎词和词组之间，既有词的特征，又有词组的特征，因此称之为离合词"],"q":"动宾离合词指下面一些语言单位：见面 鞠躬 洗澡 跑步 结婚 帮忙。它们看起来像一个词，但跟一般动词相比，有一些非词的特点：①表体态的词语往往放在中间，而不是放在最后； ②中间还可以插入表数量、性质的词语。","w":"high","e":["教材高频"]},{"t":"汉语的“们”跟英语表复数的s一样，都是典型的复数形式。","y":"判断题","p":["汉语部分指人或指动物的名词后可加“们”，但此时也不等同于印欧语的数","汉语的“们”只能加在部分指人或指动物的名词后边，结合面比英语的s窄得多","汉语没有“三个教师们”的说法，即名词后加“们”和名词前的数量词不能同现","汉语的“们”跟英语表复数的s不同，不是典型的复数形式"],"q":"由此可见，汉语的“们”跟英语表复数的s不同，不是典型的复数形式。","w":"normal","e":["核心考点"]},{"t":"为什么说汉语语法的狭义形态少？请举例说明。","y":"简答题","p":["名词没有性、数、格（“们”不等同于英语s，不能与数量词同现）","代词没有性和格、人称代词与物主代词的区别","动词没有形态变化（“着”与英语-ing有差异，进行义多由“在、正在”承担）","“们+N”与英语N+s功能不同"],"q":"四、狭义形态少 这一条主要是跟印欧语系对比得出的……第一，名词没有性、数、格……第二，汉语代词没有性和格、人称代词与物主代词的区别。第三，汉语动词没有形态变化。","w":"normal","e":["核心考点"]},{"t":"汉语中语序比较灵活，意味着语序可以随意变化。","y":"判断题","p":["汉语语序比较灵活，并不是说语序可随意变化","在许多场合下，语序不同，往往显示的语义语用不同","如“张三到图书馆拿书”与“张三拿书到图书馆”动作发生的先后不同"],"q":"汉语语序比较灵活，并不是说语序可随意变化。恰恰相反，在许多场合下，语序不同，往往显示的语义语用不同。这正是汉语词序语序重要的第二个表现。","w":"normal","e":["核心考点"]},{"t":"话题凸显","y":"名词解释","p":["话题凸显是汉语（及一些语言）句子结构的特点，即句子结构是“话题—说明”，而不是“主语—谓语”","不少学者认为，只要是话题（陈述对象），无论是施事、受事、非施事非受事（时间词、处所词、介词结构等）都可以成为话题放在句首","话题跟说明之间没有严密的语法关系，关联比较松散，不像印欧语系中主语、谓语的关系那么密切","如“今天星期四”“桌子上放着一本书”“在这个地方可以休息”"],"q":"不少学者认为，汉话句子结构的特点是话题凸显，即句子结构是“话题一说明”，而不是“主语—谓语”。只要是话题 (陈述对象)，无论是施事、受事、非施事非受事……都可以成为话题放在句首。","w":"normal","e":["核心考点"]},{"t":"从语法教学的角度，简述汉语语法的主要特点。","y":"简答题","p":["词序和语序重要（话题凸显；语序隐含逻辑关系；泛指特指）","修饰成分的位置比较固定（定语、状语都在前）","有特殊词类和特殊的词（个体量词、语气词、方位词、把）","狭义形态少","特殊的动词结构（动补结构、动宾离合词）","句子成分跟词类既对应又不对应"],"q":"本节主要从语法教学的角度来讨论汉语语法特点。一、词序和语序重要 二、修饰成分的位置比较固定 三、有一些特殊词类和特殊的词 四、狭义形态少 五、特殊的动词结构 六、句子成分跟词类既对应又不对应","w":"normal","e":["核心考点"]},{"t":"动宾离合词","y":"名词解释","p":["动宾离合词指“见面、鞠躬、洗澡、跑步、结婚、帮忙”等语言单位","它们看起来像一个词，但跟一般动词相比，有一些非词的特点：①表体态的词语往往放在中间，而不是放在最后，如“见了面、见了两次面”","②中间还可以插入表数量、性质的词语，如“洗了澡、洗热水澡”","在某种条件下它们还可以错位，即后边的单位移位到前面，如“这个面我不见”“澡洗完了”","不少人认为它们介乎词和词组之间，既有词的特征，又有词组的特征，因此称之为离合词"],"q":"动宾离合词指下面一些语言单位：见面 鞠躬 洗澡 跑步 结婚 帮忙。它们看起来像一个词，但跟一般动词相比，有一些非词的特点……因此称之为离合词。","w":"normal","e":["核心考点"]},{"t":"汉语修饰成分的位置比较固定，无论是定语还是状语，一般都在被修饰成分前边。","y":"判断题","p":["正确","修饰成分一般都在被修饰成分前边"],"q":"汉语的修饰成分一般都在被修饰成分前边，无论是定语还是状语。","w":"normal","e":["核心考点"]},{"t":"下列句中“什么”表达“……的时候”的意思的是（　　”。","y":"单项选择题","p":["考查汉语特殊句式特点"],"q":"所谓不对应，指在狭义形态不改变的情况下，谓词性成分可以当主语、宾语，体词性成分可以当谓语。如：说起来容易，做起来就难了。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c11-s03","t":"第三节 语法教学的原则","w":"high","n":10,"k":[{"t":"语法教学的项目选择涉及“教什么”，学习难点应如何确定？","y":"简答题","p":["体现语法体系总体特征的项目","学习难点应作为必选项目，通过语言对比和教学实践确定","难度等级：低难度（母语目的语相同，可不讲或少讲）","难度等级：中等难度（部分对应，如被动句）","难度等级：高难度（母语没有目的语有、一对多、表层相同深层不同）","中等难度和高等难度的语法点应作为教学项目"],"q":"语法项目的选择进一步涉及“教什么”的问题。可以分为两类：1. 体现语法体系总体特征的项目 2. 学习难点……学习项目往往可以分成难度等级……中等难度和高等难度的语法点应该作为教学中的语法项目。","w":"high","e":["教材高频"]},{"t":"语法点的排列次序应考虑哪些方面？请举例说明。","y":"简答题","p":["由易到难（兼顾结构、交际、心理难度；如“把书打开”与“把书放在桌子上”）","从交际出发（如“了₂”先于“了₁”）","参照使用频率（如“着₂”先于“着₁”）","相关语法点组成系列（如各类比较句）","复杂的语法点分阶段教学（如“了”、含“着”的句型）"],"q":"语法点的排列次序，涉及先教什么、后教什么的问题……可以分几点来讨论。(一) 由易到难 (二) 从交际出发 (三) 参照使用频率 (四) 相关语法点组成系列 (五) 复杂的语法点分阶段教学","w":"high","e":["教材高频"]},{"t":"汉外对比","y":"名词解释","p":["汉外对比是语法教学的重要原则和方法，指将汉语跟学生母语的语法规则进行对比，找出不同点和相同点，以克服负迁移、利用正迁移","包括不同点对比、相同点对比、表层结构不同而深层语义结构相同的对比"],"q":"(一) 汉外对比 1. 不同点对比 汉外对比当然要讲汉语跟学生母语的区别……2. 相同点对比 不同的语言之间其实还有许多共同点……3. 表层结构不同、深层语义结构相同的对比","w":"high","e":["教材高频"]},{"t":"从交际出发是功能教学法的原则。理论语法把“了”分为“了₁”和“了₂”，学生的习得顺序是先习得____，后习得____。","y":"填空题","p":[],"q":"以前的对外汉语教材通常按照理论语法的顺序，先教“了：”，再教“了₂”。但学生的习得顺序正好相反。","w":"high","e":["教材高频"]},{"t":"汉语的介词有60多个，其中特殊介词最典型的是“____”。还有“被、在”等。","y":"填空题","p":[],"q":"一种是特殊介词，数量不多，最典型的“把”，还有“被、在”等。介词“把”，在许多语言中没有相应的词。","w":"normal","e":["核心考点"]},{"t":"下列不属于语法点排列次序应考虑方面的是（  ）。A.由易到难 B.从交际出发 C.参照使用频率 D.完全按照《汉语拼音方案》的顺序","y":"单项选择题","p":["语法点排列次序从五方面考虑：由易到难、从交际出发、参照使用频率、相关语法点组成系列、复杂的语法点分阶段教学","《汉语拼音方案》顺序是针对声母教学的说法，不属于语法点排列次序"],"q":"(一) 由易到难 (二) 从交际出发 (三) 参照使用频率 (四) 相关语法点组成系列 (五) 复杂的语法点分阶段教学","w":"normal","e":["核心考点"]},{"t":"试述对外汉语语法教学应遵循的基本原则，并举例说明如何选择语法项目、安排教学次序。","y":"论述题","p":["目的：用汉语交际、教汉语、研究汉语三个层次","内容：词构成、词组构成、句子构成、篇章及语法形式语义语用的关系规则","项目选择：体现总体特征的项目+学习难点（难度分低中高三级）","排列次序：由易到难、从交际出发、参照使用频率、组成系列、分阶段教学","教学方法：情景化、生成式、对比教学","教学技巧：展示、讲解与多种练习类型"],"q":"《国际汉语教师标准》指出，语法教学要注重结构、语义、功能相结合，注重针对学习者的语法偏误进行。以下结合《教师标准》提出的若干原则进行讨论。","w":"high","e":["教材高频"]},{"t":"简述周小兵提出的第二语言汉语教学语法的特点。","y":"简答题","p":["实用第一","形式和意义并重","考虑篇章和语用因素","语法规则的细化和使用条件的充分","注重描写基础上的解释","注重语际对比（个性与共性）","注重习得研究","使用统计方法和实验方法"],"q":"周小兵 (2002) 提出第二语言的汉语教学语法的八个特点：(1) 实用第一。……(2) 形式和意义并重。……(3) 考虑篇章和语用因素。……(4) 语法规则的细化和使用条件的充分。……(5) 注重描写基础上的解释。……(6) 注重语际对比……(7) 注重习得研究。……(8) 使用统计方法和实验方法。","w":"normal","e":["核心考点"]},{"t":"语法点的排列次序应考虑哪些方面？","y":"简答题","p":["由易到难（从语言学、交际、心理学多角度测定难度）","从交际出发（功能教学法原则，最基本交际的先教）","参照使用频率","相关语法点组成系列","复杂的语法点分阶段教学"],"q":"语法点的排列次序，涉及先教什么、后教什么的问题……(一) 由易到难 …… (二) 从交际出发 …… (三) 参照使用频率 …… (四) 相关语法点组成系列 …… (五) 复杂的语法点分阶段教学","w":"normal","e":["核心考点"]},{"t":"根据施家炜的调查，关于“把书打开”和“把书放在桌子上”的习得顺序，学生的实际掌握情况是（　　）。","y":"单项选择题","p":["B"],"q":"施家炜 (1998) 根据北京语言大学汉语中介语语料库的资料统计发现，即使先教A，后教B，学生也是先掌握B，后掌握 A。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c11-s04","t":"第四节 语法教学的方法","w":"high","n":5,"k":[{"t":"情景化教学","y":"名词解释","p":["情景，原指话语出现和使用的特定场合","情景化教学，指利用和创造特定句子或更大语言单位出现的情景，使学生沉浸在丰富的、自然或半自然的语言习得环境中，接触、输入、习得相关的语言材料，并生成、输出相应的话语","情景化教学可以用在词汇教学中，也可以用在语法教学中"],"q":"情景，原指话语出现和使用的特定场合。情景化教学，指利用和创造特定句子或更大语言单位出现的情景，使学生沉浸在丰富的、自然或半自然的语言习得环境中，接触、输入、习得相关的语言材料，并生成、输出相应的话语。","w":"high","e":["教材高频"]},{"t":"生成式教学","y":"名词解释","p":["生成式教学的出发点是：复杂句式是由简单句式扩展或紧缩而成","教学中可以将经过压缩或扩展的句型回复原状，使学生容易学习和使用","生成式教学包括扩展式生成和紧缩式生成"],"q":"生成式教学的出发点是：复杂句式是由简单句式扩展或紧缩而成； 教学中可以将经过压缩或扩展的句型回复原状，使学生容易学习和使用(周小兵，1996a)。","w":"high","e":["教材高频"]},{"t":"语法教学有哪些基本方法？请简要说明。","y":"简答题","p":["情景化教学（利用人的情景、事物、动作）","生成式教学（扩展式生成、紧缩式生成）","对比教学（汉外对比：不同点、相同点、表层不同深层相同）","对比教学（汉语内部对比：有和无、同位置近义词、同词不同位置、不同词同位置、相同结构语义）"],"q":"一、情景化教学 二、生成式教学 三、对比教学 (一) 汉外对比 (二) 汉语内部对比","w":"high","e":["教材高频"]},{"t":"情景化教学","y":"名词解释","p":["情景，原指话语出现和使用的特定场合","情景化教学，指利用和创造特定句子或更大语言单位出现的情景，使学生沉浸在丰富的、自然或半自然的语言习得环境中，接触、输入、习得相关的语言材料，并生成、输出相应的话语","情景化教学可以用在词汇教学中，也可以用在语法教学中，可以利用人的情景、利用事物、利用动作来进行"],"q":"情景化教学，指利用和创造特定句子或更大语言单位出现的情景，使学生沉浸在丰富的、自然或半自然的语言习得环境中，接触、输入、习得相关的语言材料，并生成、输出相应的话语。","w":"normal","e":["核心考点"]},{"t":"简述生成式教学法的两种方式。","y":"简答题","p":["生成式教学出发点：复杂句式由简单句式扩展或紧缩而成","扩展式生成：由简单句逐步扩展为复杂句，训练状语","紧缩式生成：较长单位通过删除、替换紧缩为较短单位","紧缩式由易到难（如“连”字句、居然句）"],"q":"生成式教学的出发点是：复杂句式是由简单句式扩展或紧缩而成；教学中可以将经过压缩或扩展的句型回复原状。(一) 扩展式生成 (二) 紧缩式生成","w":"normal","e":["核心考点"]}]},{"id":"rumen-c11-s05","t":"第五节 语法点的教学技巧","w":"high","n":6,"k":[{"t":"语法点的展示","y":"名词解释","p":["展示语法点，就是通常说的“引入”语法点","引入要生动、自然、确切、到位","要用合适的方法展示将要学的语法点，让学生对它的形式、意义、功能有初步印象","主要方法有：结合实际情景的对话、图片和多种教具的使用、行为动作演示"],"q":"展示语法点，就是通常说的“引入”语法点。引入要生动、自然、确切、到位。要用合适的方法展示将要学的语法点，让学生对它的形式、意义、功能有初步印象。","w":"normal","e":["核心考点"]},{"t":"解释语法点有哪些方法？请简要说明。","y":"简答题","p":["列出公式","借助图片和其他教具","利用、创造情景","表演","内部对比","新旧知识的对比","发现式的语法教学"],"q":"(二) 解释语法点的方法 1. 列出公式 2. 借助图片和其他教具 3. 利用、创造情景 4. 表演 5. 内部对比 6. 新旧知识的对比 7. 发现式的语法教学","w":"high","e":["教材高频"]},{"t":"语法点的练习有哪几种类型？请简要说明。","y":"简答题","p":["机械练习（重复、替换、扩展）","有意义的练习（变换、复述、翻译、补足、情景描述、修改病句）","交际练习（定向问答、描述、叙述；特点真实、有信息差）","游戏和有意义的课堂活动（用中学、做中学、体验中学）"],"q":"(一) 机械练习 (二) 有意义的练习 (三) 交际练习 (四) 游戏和有意义的课堂活动","w":"high","e":["教材高频"]},{"t":"“机械练习”主要不包括下列哪项？（  ）A.重复练习 B.替换练习 C.扩展练习 D.修改病句练习","y":"单项选择题","p":["机械练习主要指不怎么需要理解的练习项目，如模仿、重复、替换、扩展等","机械练习形式有重复练习、替换练习、扩展练习","修改病句练习属于有意义的练习"],"q":"机械练习主要指不怎么需要理解的练习项目，如模仿、重复、替换、扩展等练习……(1) 重复练习 (2) 替换练习 (3) 扩展练习","w":"normal","e":["核心考点"]},{"t":"案例分析：\n母语为英语的留学生出现以下偏误：\n(1) *我昨天见面了一个中国同学。\n(2) *他碰见了三个老师们。\n(3) *这件衣服比那件10块钱贵。\n(4) *我把衣服洗。\n(5) *玛丽看书在图书馆。\n请分析这些偏误产生的原因，并结合汉语语法特点和语法教学方法，提出针对性的教学建议。","y":"案例分析题","p":["偏误1：离合词不能带宾语，对象用“跟”引出（讲离合词用法条件）","偏误2：汉语狭义形态少，“们”不能与数量词同现（汉外对比“们”与英语s）","偏误3：“比”字句度量差比句语序，用对比教学+分阶段系列教学","偏误4：“把”字句缺少必要成分，情景化教学+形式意义并重","偏误5：状语语序偏误，汉语修饰成分在动词前（汉外对比讲解）","总原则：结构语义功能相结合，针对偏误教学，综合运用对比、情景化、生成式教学等"],"q":"教师在进行语法讲解时应做到能够恰当选用不同的教学策略、方法和技巧，根据不同学习者、不同教学环境对汉语语法教学方法加以综合、发展和创新。","w":"high","e":["教材高频"]},{"t":"语法点的练习可分为哪几类？请说明。","y":"简答题","p":["机械练习（模仿、重复、替换、扩展）","有意义的练习（变换、复述、翻译、补足、情景描述、修改病句）","交际练习（定向问答、描述、叙述；特点是真实；最重要）","游戏和有意义的课堂活动"],"q":"(一) 机械练习 …… (二) 有意义的练习 …… (三) 交际练习 …… (四) 游戏和有意义的课堂活动","w":"normal","e":["核心考点"]}]}]},{"id":"rumen-c12","t":"第十二章 汉字教学","w":"high","s":[{"id":"rumen-c12-s01","t":"第一节 汉字教学的地位和重要性","w":"high","n":7,"k":[{"t":"为什么说汉字教学在对外汉语教学中占有重要地位？","y":"简答题","p":["汉字是获得汉语书面交际能力必不可少的工具，要获得系统全面交际能力无法回避汉字","汉字特殊：表义性和一定表音性、书写系统层次性、特殊大脑机制","汉语语素以单音节占主体，语素和“字”基本重合，“字”是最基本的语义单位","学会一个字，就较容易理解由该字组成的复合词","汉字在对外汉语教学体系中应占有重要的一席"],"q":"作为汉语书写符号系统的汉字，是获得汉语书面交际能力必不可少的工具……语素及其书面形式汉字与汉语之间特殊的关系，决定了汉语作为第二语言的教学不同于印欧语系的语言，汉字在对外汉语教学体系中应占有重要的一席。","w":"high","e":["教材高频"]},{"t":"汉字的表义性","y":"名词解释","p":["汉字的表义性指汉字是记录汉语的书写符号系统，现代汉字由古老的象形表义文字发展而来","虽然汉字中有表示语音的部件(声旁)，但从本质上来说仍是表意文字","汉字的字形记录语义，这一点与拼音文字的字母直接记录语音不同"],"q":"汉字是记录汉语的书写符号系统，现代汉字由古老的象形表义文字发展而来。虽然汉字中有表示语音的部件(声旁)，但从本质上来说仍是表意文字。汉字的字形记录语义，这一点与拼音文字的字母直接记录语音不同。","w":"high","e":["教材高频"]},{"t":"为什么说汉字的表音性是有局限性的？","y":"简答题","p":["声旁与整字读音完全一致的汉字并不多，声旁与整字读音关系十分复杂","汉字里没有专职表音的部件，形声字的声旁本质上首先是一个表义单位","现行常用汉字表音表义的有效性都在50%左右，有相当一部分是记号字","大量记号字的存在带来了汉字教学的困难"],"q":"但我们要认识到，汉字的表音性是有局限性的。首先，声旁与整字读音完全一致的汉字并不是很多……另外，汉字里并没有专职表音的部件，即使是形声字的声旁，本质上也首先是一个表义单位。","w":"normal","e":["核心考点"]},{"t":"汉字在书写系统上有什么层次性？这给外国学生带来什么困难？","y":"简答题","p":["汉字是由笔画组成的方块文字，结构在平面组合，区别于线性排列的拼音文字","简单结构：上下、左右、包围、半包围","复杂结构：上中下、左中右、框架结构，结构内还包含其他结构","汉字形体结构复杂，造成外国学生视觉和书写两方面的困难"],"q":"首先，有上下 (要、盘、费)、左右(认、快、放)、包围 (国、园、回)、半包围 (还、区、同) 这些简单结构。其次，还有上中下 (意、累、参)、左中右(谢、做、哪)、框架结构 (噩、巫) 这种比较复杂的结构……这就造成了外国学生在视觉和书写两方面的困难。","w":"normal","e":["核心考点"]},{"t":"认知心理学研究发现，拼音文字的认知一般只涉及大脑的左半球，而汉字认知要涉及大脑的两个半球和比较复杂的加工传递程序。","y":"判断题","p":["拼音文字的认知一般只涉及大脑的左半球","汉字认知要涉及大脑的两个半球和比较复杂的加工传递程序","由于汉字既包含抽象的语义，又有形象的结构，所以汉字的加工表现出两脑均势的现象"],"q":"认知心理学研究发现：拼音文字的认知一般只涉及大脑的左半球，而汉字认知要涉及大脑的两个半球和比较复杂的加工传递程序。","w":"normal","e":["核心考点"]},{"t":"汉字的表义性","y":"名词解释","p":["汉字是记录汉语的书写符号系统，现代汉字由古老的象形表义文字发展而来","虽然汉字中有表示语音的部件（声旁），但从本质上来说仍是表意文字","汉字的字形记录语义，这一点与拼音文字的字母直接记录语音不同","如汉字“女”在甲骨文中像一个敛手跪着的人形，表示女性、女人，与“男”相对","现代汉字的“女”虽然已失去象形特征，仍是字形直接对应字义，不需要经由字音的中转"],"q":"汉字是记录汉语的书写符号系统，现代汉字由古老的象形表义文字发展而来。虽然汉字中有表示语音的部件(声旁)，但从本质上来说仍是表意文字。汉字的字形记录语义，这一点与拼音文字的字母直接记录语音不同。","w":"normal","e":["核心考点"]},{"t":"汉字的层次性（书写系统的层次性）","y":"名词解释","p":["从汉字形体和书写的角度来说，汉字是由笔画组成的方块文字，其结构是平面组合的，这与线性排列的拼音文字存在根本差异","平面组合的汉字，从结构来说存在各种复杂的结构关系：首先有上下、左右、包围、半包围这些简单结构","其次还有上中下、左中右、框架结构这种比较复杂的结构，甚至一种结构的内部还会包含其他的结构","跟拼音文字单一的线性结构相比，汉字的形体结构复杂得多，这就造成了外国学生在视觉和书写两方面的困难"],"q":"从汉字形体和书写的角度来说，汉字是由笔画组成的方块文字，其结构是在平面组合的。这与线性排列的拼音文字存在根本的差异。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c12-s02","t":"第二节 对外汉字教学的特点","w":"high","n":3,"k":[{"t":"简述对外汉字教学的特点。","y":"简答题","p":["“对外”的特点：学习者零起点、形音义同步，教学初期特别强调同音字辨别","零起点学习者往往知音知义不知形，产生同音替代偏误","对成人的教学特点：成人归纳推理能力强，应重视理性教学，但要把好度","对非母语儿童的教学特点：尽量不引入理论知识，充分发挥趣味性作用"],"q":"传统汉字教学的经验可以借鉴，但不能全盘搬入对外汉语教学的课堂，因为教学对象不同……汉字教学一定要充分考虑学习者的特点。一、“对外” 的特点 二、对成人的教学特点 三、对非母语儿童的教学特点","w":"high","e":["教材高频"]},{"t":"针对成年学习者的汉字教学，为什么要重视理性教学？","y":"简答题","p":["成人有既定认知模式，理解能力和逻辑能力强","母语文字经验会产生负迁移，但归纳推理能力有助于汉字学习","应重视理性教学，充分利用汉字自身的规律和特点进行系统知识教学","如汉字结构分析、以偏旁为线索的形声字分析、同音异形字归纳整理","要把握度，不能把对外汉字教学上成汉字理论课"],"q":"针对成年学习者归纳推理能力强的优势，我们应该重视理性教学。在强调刺激、强化训练的同时，充分利用汉字自身的规律和特点，进行系统的知识和理论的教学。","w":"normal","e":["核心考点"]},{"t":"简述对外汉字教学“对外”的特点。","y":"简答题","p":["学习者是没有汉语基础的外国人，汉语汉字完全陌生","本族儿童学习关键是字形，外国学生要同时学习形、音、义","对外汉字教学务必形、音、义同步，缺一不可","大量同音字是外国学习者的最大困难之一，出现知音知义不知形","教学初期要特别强调同音字的辨别，熟悉形义相通"],"q":"学一个汉字时，对本族儿童来说，关键是字形；外国学生则是同时学习形、音、义，这势必更加困难。针对这一特点，对外汉字教学务必要形、音、义同步，缺一不可。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c12-s03","t":"第三节 汉字教学的原则","w":"high","n":16,"k":[{"t":"汉字分流","y":"名词解释","p":["汉字分流是周小兵(1999)提出的方法，指对学习者掌握汉字的要求在认读和书写方面要有所区分，不能要求每个汉字都达到四会(听说读写)的程度","常用字、字形结构简单鲜明的字要达到能读能写的程度","有些字则要求学习者能认读即可，如笔画繁多、结构复杂的字——“矮、戴、橘、嘴”等","另外一些不那么常用的字或者连绵词中的汉字，能到在词语中或上下文中理解即可"],"q":"周小兵 (1999) 提出“分流”的方法，很有启发意义。他提出，对学习者掌握汉字的要求在认读和书写方面要有所区分，不能要求每个汉字都达到四会 (听说读写)的程度。","w":"high","e":["教材高频"]},{"t":"汉字教学的内容包括哪些方面？","y":"简答题","p":["一定数目的汉字：本族人日常使用3000多字覆盖99.9%，大纲收字3000字以内","约950字覆盖一般书报90%，教学教的只是最基本的高频汉字","汉字构形知识：笔画、部件、偏旁等构成要素，结构方式，象形指事会意形声","汉字表音表义的方式和程度：形声字分析、以声(形)旁为系的系统整理","汉字教学内容以初级汉字为纬线、汉字知识为经线"],"q":"汉字教学的内容应该像一张网，以大纲的初级(甲级) 汉字为纬线，以汉字知识为经线。(一) 一定数目的汉字 (二) 关于汉字的知识","w":"high","e":["教材高频"]},{"t":"汉字教学中的顺序关系有哪些？","y":"简答题","p":["先认读后书写，多认读少书写（注重先认后写）","书写教学先教基本笔画名称、再教书写规则","常用字在先，先独体后合体（由易到难）","常用但字形复杂的汉字可“先认后写”或“只认不写”"],"q":"三、汉字教学中的几个顺序关系 (一) 先认读后书写，多认读少书写 (二) 书写教学先教基本笔画名称，再教书写规则 (三) 常用字在先，先独体后合体","w":"high","e":["教材高频"]},{"t":"部件","y":"名词解释","p":["部件是现代汉字字形的构字单位","它介于笔画和整字之间，大于或等于笔画，小于或等于整字","“以部件为中心”是合体字阶段的基本教学原则，即以部件为基本点，以点带面，有系统地进行汉字教学"],"q":"部件是现代汉字字形的构字单位。它介于笔画和整字之间，大于或等于笔画，小于或等于整字。“以部件为中心”是合体字阶段的基本教学原则，即以部件为基本点，以点带面，有系统地进行汉字教学。","w":"high","e":["教材高频"]},{"t":"“以部件为中心”的汉字教学包括哪些具体方法？","y":"简答题","p":["从结构分析入手，通过归纳部件进行学习","强化部件的位置","抓住声旁形旁，强化形声字意识","对形似部件进行专门的归纳对比","对同音字适时通过部件分析进行归纳复习","及时归纳复习，强化记忆，防止遗忘","以部件为中心不等于以部件为教学单位"],"q":"(一) 从汉字结构分析入手，通过归纳部件进行学习 (二) 强化部件的位置 (三) 抓住声旁形旁，强化形声字意识 (四) 对形似部件，要进行专门的归纳对比 (五) 对同音字，要适时地通过部件的分析进行归纳复习 (六) 及时归纳复习，强化记忆，防止遗忘 (七) 以部件为中心并不等于以部件为教学单位","w":"high","e":["教材高频"]},{"t":"“以部件为中心”意味着教学中要以部件为教学单位，逐个讲解每个部件。","y":"判断题","p":["以部件为中心是合体字阶段的基本教学原则，即以部件为基本点，以点带面","以部件为中心并不等于以部件为教学单位","部件分析是一个教学手段，归纳部件的目的是帮助学习者形成部件意识，而不是在记忆汉字的同时还要记忆汉字的每个部件"],"q":"(七) 以部件为中心并不等于以部件为教学单位 最后要强调的是：教学过程中，部件分析是一个教学手段，部件是从汉字中分析出来的，归纳部件的目的是帮助学习者形成部件意识，而不是在记忆汉字的同时还要记忆汉字的每个部件。","w":"normal","e":["核心考点"]},{"t":"据有关数据统计，大概____个字就覆盖了一般书报的90%；本族人日常使用的也不过____多字，已经覆盖了常见书报的99.9%。","y":"填空题","p":["3000"],"q":"据有关数据统计，大概950个字就覆盖了一般书报的90%，这个数目大约对应于《教学大纲》的初等阶段汉字和《等级大纲》的甲级字。","w":"normal","e":["核心考点"]},{"t":"下列不属于汉字教学顺序关系的是（  ）。A.先认读后书写，多认读少书写 B.书写教学先教基本笔画名称，再教书写规则 C.常用字在先，先独体后合体 D.先教繁体字，后教简体字","y":"单项选择题","p":["汉字教学的顺序关系包括：先认读后书写、书写教学先教笔画名称再教书写规则、常用字在先先独体后合体","教材未提出“先教繁体字后教简体字”"],"q":"三、汉字教学中的几个顺序关系 (一) 先认读后书写，多认读少书写 (二) 书写教学先教基本笔画名称，再教书写规则 (三) 常用字在先，先独体后合体","w":"normal","e":["核心考点"]},{"t":"试述对外汉字教学应遵循的基本原则，并结合实例说明如何进行以部件为中心的汉字教学。","y":"论述题","p":["汉字教学目的要求：认写分流，不能要求每个字都达到四会","内容：一定数目汉字+汉字知识","顺序关系：先认读后书写、先笔画名称再书写规则、常用字在先先独体后合体","以部件为中心的教学原则及具体方法（结构分析、位置、声旁形旁、形似部件、同音字、复习归纳）","以部件为中心不等于以部件为教学单位","结合实例：单人旁“亻”、声旁“青”的归纳教学"],"q":"“以部件为中心”是合体字阶段的基本教学原则，即以部件为基本点，以点带面，有系统地进行汉字教学。","w":"high","e":["教材高频"]},{"t":"以部件为中心的汉字教学","y":"名词解释","p":["“以部件为中心”是合体字阶段的基本教学原则，即以部件为基本点，以点带面，有系统地进行汉字教学","部件是现代汉字字形的构字单位，它介于笔画和整字之间，大于或等于笔画，小于或等于整字","汉字习得研究发现，相当一部分汉字偏误都是部件的偏误，因此把部件作为汉字教学的一个重要内容，是符合汉字认知和习得规律的","以部件为中心包括从汉字结构分析入手归纳部件、强化部件位置、抓住声旁形旁强化形声字意识、对形似部件专门归纳对比等","需注意以部件为中心并不等于以部件为教学单位"],"q":"“以部件为中心”是合体字阶段的基本教学原则，即以部件为基本点，以点带面，有系统地进行汉字教学。部件是现代汉字字形的构字单位。它介于笔画和整字之间，大于或等于笔画，小于或等于整字。","w":"normal","e":["核心考点"]},{"t":"简述汉字教学中的几个顺序关系。","y":"简答题","p":["先认读后书写，多认读少书写（认写分流，注重先认后写）","书写教学先教基本笔画名称，再教书写规则","常用字在先，先独体后合体（由易到难）"],"q":"三、汉字教学中的几个顺序关系 (一) 先认读后书写，多认读少书写 …… (二) 书写教学先教基本笔画名称，再教书写规则 …… (三) 常用字在先，先独体后合体","w":"normal","e":["核心考点"]},{"t":"简述“对成人的教学特点”。","y":"简答题","p":["国内对外汉字教学对象主要是成年人","成人既受母语文字经验负迁移影响，又有较强归纳推理能力","针对优势重视理性教学，利用汉字规律进行系统的知识和理论教学","把握度，不能上成汉字理论课"],"q":"成人具备了关于母语语言文字的知识，形成了既定的认知模式，具备较强的理解能力和逻辑能力。……针对成年学习者归纳推理能力强的优势，我们应该重视理性教学。","w":"normal","e":["核心考点"]},{"t":"简述汉字教学的内容。","y":"简答题","p":["一定数目的汉字（高频汉字约950个覆盖90%）","关于汉字的知识：汉字构形知识（笔画、部件、偏旁、结构方式、造字方式）","汉字表音表义的方式和程度（形声字分析、系统整理）","内容像一张网：以初级(甲级)汉字为纬线，以汉字知识为经线"],"q":"二、汉字教学的内容 (一) 一定数目的汉字 …… (二) 关于汉字的知识 …… 总之，汉字教学的内容应该像一张网，以大纲的初级(甲级) 汉字为纬线，以汉字知识为经线。","w":"normal","e":["核心考点"]},{"t":"《高等学校外国留学生汉语教学大纲（长期进修）》共收汉字（　　）个。","y":"单项选择题","p":["C"],"q":"《高等学校外国留学生汉语教学大纲 (长期进修)》……共收汉字2605个，其中初等阶段1414个，中等阶段700个，高等阶段491个。","w":"normal","e":["核心考点"]},{"t":"汉字教学要教的只是最基本的高频汉字。据有关数据统计，大概______个字就覆盖了一般书报的90%。","y":"填空题","p":["950"],"q":"在大纲所要求的汉字中，并非所有的汉字都要通过教学来教给学生，汉字教学要教的只是最基本的高频汉字。据有关数据统计，大概950个字就覆盖了一般书报的90%。","w":"normal","e":["核心考点"]},{"t":"汉字教学要贯彻“认写分流”的原则，即“______、______”。","y":"填空题","p":["多认少写"],"q":"要贯彻“认写分流”的原则，“多认少写”。既让学习者掌握基本汉字书写能力……又把拓宽学生识字量作为重点。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c12-s04","t":"第四节 汉字教学的技巧","w":"high","n":6,"k":[{"t":"展示汉字有哪些技巧？","y":"简答题","p":["板书展示：最常用最方便，能同时展示书写过程（以笔画、结构、部件、同音、形似为系）","图片展示：生动直观，适用于字义容易以图画描摹的汉字","卡片展示：正反两面展示形音义，灵活机动，适合初期认读教学"],"q":"一、展示汉字的技巧 展示汉字就是把汉字展现给学生看，要求简单清晰。(一) 板书展示 (二) 图片展示 (三) 卡片展示","w":"normal","e":["核心考点"]},{"t":"教授汉字字形、字义、字音各有哪些技巧？","y":"简答题","p":["教字形：笔画（箭头标示运笔方向、展示书写过程）","教字形：结构（田字格教左右结构、强调半包围结构书写顺序）","教字义：核心是“以形释义”，借助实物、图片、形旁、古文字、俗字源与联想","教字音：注意同音字和近音字的辨析，重视形声字的声旁类推读音及其局限"],"q":"(一) 教写字形的技巧 (二) 讲解字义的技巧 字义讲解技巧的核心就是“以形释义”，目的是建立形义之间的联系。(三) 教字音的技巧","w":"high","e":["教材高频"]},{"t":"练习汉字主要有哪些方式？","y":"简答题","p":["认读练习：强化刺激，把形音义作为一个整体掌握（特别注意同音字、近音字、形似字）","字形练习：笔画练习、结构练习、部件练习","综合练习：填空练习、改错练习、听写练习、猜字练习"],"q":"三、练习汉字的技巧 (一) 认读练习 (二) 字形练习 (三) 综合练习","w":"normal","e":["核心考点"]},{"t":"字义讲解技巧的核心是（  ）。A.笔画分析 B.以形释义 C.声旁类推 D.字形展示","y":"单项选择题","p":["字义讲解技巧的核心就是“以形释义”，目的是建立形义之间的联系","字义讲解可借助实物释义、图片释义、利用形旁释字、借助古文字形体释字、俗字源和联想释字"],"q":"字义讲解技巧的核心就是“以形释义”，目的是建立形义之间的联系。","w":"normal","e":["核心考点"]},{"t":"案例分析：\n某教师给零起点的欧美留学生上汉字课，发现学生出现以下问题：\n(1) 学生把“好”写成两个独立的字“女子”；\n(2) 学生把同音字混淆，如把“新”写作“信”、“直”写作“只”；\n(3) 学生写“想”字时把上面的“相”写成“目”在左、“木”在右；\n(4) 学生把带“辶”的“越”写成左右结构。\n请结合本章汉字教学的特点、原则与技巧，分析这些问题产生的原因，并给出针对性的教学建议。","y":"案例分析题","p":["问题1：左右结构字与两个汉字混淆，用田字格训练字感","问题2：零起点学习者知音知义不知形，产生同音替代偏误，教学初期强调同音字辨别、用部件分析归纳复习","问题3：部件位置偏误，强化部件的位置，形成正字法意识","问题4：左下包围半包围结构被写成左右结构，强调书写顺序（先写里面再写辶）","总原则：形音义同步、重视理性教学、以部件为中心、认写分流、常用字在先"],"q":"第二种是左下包围的半包围结构。汉字偏误分析发现，这类字特别容易被学习者写成左右结构……针对这个问题，在教带有“辶”旁的半包围结构汉字时，教师应该特别强调书写的顺序。","w":"high","e":["教材高频"]},{"t":"“以部件为中心”的汉字教学就是以部件为教学单位，逐个讲解每个部件。","y":"判断题","p":["错误","以部件为中心不等于以部件为教学单位","归纳部件的目的是帮助形成部件意识"],"q":"最后要强调的是：教学过程中，部件分析是一个教学手段，部件是从汉字中分析出来的，归纳部件的目的是帮助学习者形成部件意识，而不是在记忆汉字的同时还要记忆汉字的每个部件。不能把部件作为独立的教学单位。","w":"normal","e":["核心考点"]}]}]},{"id":"rumen-c13","t":"第十三章 跨文化交际与文化教学","w":"high","s":[{"id":"rumen-c13-s01","t":"第一节 跨文化交际","w":"high","n":24,"k":[{"t":"跨文化交际（跨文化交流）","y":"名词解释","p":["跨文化交际也叫跨文化交流（inter-cultural communication或cross-cultural communication），就是跨越两种不同文化的交际，发生在两种不同文化背景的人们之间的交流","不同文化背景既可以是本民族与非本民族，也可以是同一民族中文化背景有差异的人","不同民族、国家的人相互之间的交流是最常见的跨文化交流"],"q":"跨文化交际, 也叫跨文化交流 (inter-cultural communication 或 cross-cultural commu- nication)，就是跨越两种不同文化的交际， 发生在两种不同文化背景的人们之间的交流。","w":"high","e":["教材高频"]},{"t":"文化","y":"名词解释","p":["文化是'人类在社会历史发展过程中所创造的物质财富和精神财富的总和，特指精神财富，如文学、艺术、教育、科学等'","物质财富指人类创造的各种物质文明，是可直接观察的显性文化","精神财富主要体现在制度文化和心理文化上，是不可见的隐性文化","物质财富和精神财富互为表里"],"q":"文化是“人类在社会历史发展过程中所创造的物质财富和精神财富的总和，特指精神财富，如文学、艺术、教育、科学等”。","w":"high","e":["教材高频"]},{"t":"主流文化与亚文化","y":"名词解释","p":["主流文化又称官方文化，是一个社会群体中发挥主要影响，被最大群体认同的，受到政府提倡的文化","亚文化又称小文化、副文化、集体文化，是大的文化中由于不同阶层、职业、地域、年龄、性别等差异而形成的小的群体文化","亚文化属于主流文化所代表的那个大群体，可能拥有单属于自己的观念和行为，有时还可能与主流文化有很大的不同"],"q":"主流文化(mainstream culture), 又称官方文化, 是一个社会群体中发挥主要影响,被最大群体认同的，受到政府提倡的文化。","w":"normal","e":["核心考点"]},{"t":"高语境文化与低语境文化","y":"名词解释","p":["爱德华·霍尔在1976年出版的《超越文化》中提出高语境文化和低语境文化的概念","高语境文化中，说话者的言语或行为的意义更多地依赖说话者当时所处的语境来表达，信息被包裹在语境之中，甚至语言本身有时都变得不那么重要","低语境文化恰恰相反，交际双方关注的是双方交流的内容，一切信息都需要用语言或其他交际信号清楚明示，没有弦外之音，直截了当","中国、日本、阿拉伯等属于高语境国家，斯堪的纳维亚国家、德国、瑞士等属于低语境国家"],"q":"爱德华·霍尔在1976 年出版的《超越文化》中提出高语境(high context) 文化和低语境(lowcontext) 文化的概念。","w":"high","e":["教材高频"]},{"t":"霍夫斯泰德文化维度理论","y":"名词解释","p":["荷兰心理学家吉尔特·霍夫斯泰德提出了一个测量不同国家间文化差异的框架，称为霍夫斯泰德文化维度理论","他从五个基本的文化价值观来考察不同文化间的差异：权力距离、不确定性规避、个人主义与集体主义、男性化与女性化、长期取向与短期取向","虽然用该理论考察各国文化差异不够精确，带有明显的西方视角，但它提供了对文化差异进行量化的工具"],"q":"荷兰心理学家吉尔特·霍夫斯泰德(Geert Hofstede) 提出了一个测量不同国家间文化差异的框架，这一理论被称为霍夫斯泰德文化维度理论，在世界上有广泛的影响。","w":"high","e":["教材高频"]},{"t":"言语交际","y":"名词解释","p":["语言是人类最重要的交流工具，言语交际是用语言来向对方表达我们的意愿、情感的方式","言语交际主体在言语交际活动中会根据交际对象、交际环境等因素选择最合适的言语方式，并在交际过程中随时调整自己的言语行为，以完成交际任务，达到交际目的","言语交际受文化影响很大，不同的文化有不同的言语交际形式"],"q":"言语交际是用语言来向对方表达我们的意愿、情感的方式。","w":"normal","e":["核心考点"]},{"t":"非言语交际","y":"名词解释","p":["非言语交际是不借助言语进行的交际行为","通常人们通过举止、语调、表情、目光、接触等身体语言进行交流，甚至通过停顿、沉默、空间距离来传递某种信息，除此以外，借助符号也能进行交际，如旗语、信号等","非言语行为在信息沟通中作用巨大，可以修饰言语交际行为，起到加强、削弱或否定言语交际的作用","有研究显示，只有7%的信息由言语传递，93%靠非言语来传递"],"q":"非言语交际是不借助言语进行的交际行为。通常人们通过举止、语调、表情、目光、接触等身体语言进行交流，甚至通过停顿、沉默、空间距离来传递某种信息。","w":"high","e":["教材高频"]},{"t":"文化休克","y":"名词解释","p":["文化休克又叫'文化震荡''文化震惊'（cultural shock），是1958年美国人类学家奥博格（Kalvero Oberg）创造的一个概念","文化休克指一个人身处一个不熟悉的文化环境之中，由于失去了自己所熟悉的文化象征符号和社会交流手段，尤其是语言交际能力的丧失而产生的一种失落、紧张、迷失、沮丧、排斥、无助乃至恐惧的感觉","文化休克包括蜜月阶段、沮丧阶段、恢复调整阶段、适应阶段等阶段，它不是一种病，而是一种复杂的个人文化体验"],"q":"“文化休克”, 又叫“文化震荡”“文化震惊” (cultural shock), 是1958年美国人类学家奥博格 (KalveroOberg)创造的一个概念。","w":"high","e":["教材高频"]},{"t":"文化适应模式","y":"名词解释","p":["'文化适应模式'（Acculturation Model）的基本假设是：第二语言习得只是文化适应的一个方面，一个学习者对目的语社会文化适应的程度将会决定他习得第二语言的程度（Schumann，1978）","该模式通过社会距离的八个因素和心理距离的四个因素来分析和阐述文化适应的程度","社会距离关注二语学习者群体和目的语群体的社会关系","心理距离关注个体学习者对目的语群体的整体情感因素"],"q":"“文化适应模式” (Acculturation Model)的基本假设是：第二语言习得只是文化适应的一个方面，一个学习者对目的语社会文化适应的程度将会决定他习得第二语言的程度(Schumann，1978)。","w":"high","e":["教材高频"]},{"t":"简述文化的主要特点。","y":"简答题","p":["文化是群体的","文化是不能遗传的","文化是综合的","文化是象征的","文化是可以传递的"],"q":"文化是一个复杂的系统，主要的特点是：(1) 文化是群体的。……(5) 文化是可以传递的。","w":"high","e":["教材高频"]},{"t":"简述霍夫斯泰德文化维度理论的五个维度。","y":"简答题","p":["权力距离","不确定性规避","个人主义与集体主义","男性化与女性化","长期取向与短期取向"],"q":"他从五个基本的文化价值观来考察不同文化间的差异：(1) 权力距离(power distance)。……(5) 长期取向与短期取向。","w":"high","e":["教材高频"]},{"t":"如何理解跨文化交际中的编码和解码？","y":"简答题","p":["交际是编码和解码的过程","编码赋予意愿情感思想","解码是还原或解释","反馈完成交际","同一文化解码顺利","跨文化编码往往不能被很好解码造成障碍"],"q":"交际可以被理解成一个编码和解码的过程。……在同一个文化中，编码通常可以被较好地解码，不会产生大的问题。但是在跨文化交际中，编码往往不能被很好地解码，最终造成交际障碍。","w":"high","e":["教材高频"]},{"t":"简述非言语交际的形式及其文化差异。","y":"简答题","p":["非言语交际定义","手势","姿态","服饰","眼神","表情","体距","触摸","音量"],"q":"下面列举几种非言语交际的形式：手势，姿态，服饰，眼神，表情，体距，触摸，音量。","w":"high","e":["教材高频"]},{"t":"简述文化休克的表现、阶段及其克服方法。","y":"简答题","p":["文化休克定义","具体表现","四个阶段","不是病而是文化体验","多了解新环境","乐观自信积极参与","寻求支持系统"],"q":"文化休克包括蜜月阶段、沮丧阶段、恢复调整阶段、适应阶段等阶段。……有效的方法有很多，如：多了解新文化、新环境，提高自身的语言和文化应变能力……","w":"high","e":["教材高频"]},{"t":"简述文化适应模式中的社会距离因素。","y":"简答题","p":["社会距离关注群体关系","社会主导模式","融合策略","封闭性","凝聚性","群体规模","文化一致性","群体态度","打算居留时限"],"q":"社会距离关注的是二语学习者群体和目的语群体的社会关系，包括：(1) 社会主导模式……(8) 打算居留时限。","w":"normal","e":["核心考点"]},{"t":"简述文化适应模式中的心理距离因素。","y":"简答题","p":["心理距离关注个体情感因素","语言休克","文化休克","学习动机","自我渗透性"],"q":"心理距离关注个体学习者对目的语群体的整体情感因素，与个体学习者对学习任务的适应程度有关，包括：(1) 语言休克……(4) 自我渗透性。","w":"normal","e":["核心考点"]},{"t":"文化是可以通过遗传传给下一代的。","y":"判断题","p":["文化是不能遗传的，任何文化都是人们在后天习得的和接受的，可以被创造但不能通过遗传传给下一代。"],"q":"(2) 文化是不能遗传的。任何文化都是人们在后天习得的和接受的，文化可以被创造，但不能通过遗传传给下一代。","w":"normal","e":["核心考点"]},{"t":"文化休克是一种精神疾病。","y":"判断题","p":["文化休克不是一种病，而是一种复杂的个人文化体验，个体差异很大，造成的影响也很不相同。"],"q":"文化休克不是一种病，而是一种复杂的个人文化体验，个体差异很大，造成的影响也很不相同。","w":"high","e":["教材高频"]},{"t":"中国、日本、阿拉伯等属于低语境的国家。","y":"判断题","p":["中国、日本、阿拉伯等属于高语境的国家，而斯堪的纳维亚国家、德国、瑞士等属于低语境国家。"],"q":"中国、日本、阿拉伯等属于高语境的国家，而斯堪的纳维亚国家、德国、瑞士等属于低语境国家。","w":"high","e":["教材高频"]},{"t":"荷兰心理学家吉尔特·霍夫斯泰德提出了____理论，从五个基本的文化价值观来考察不同文化间的差异。","y":"填空题","p":["霍夫斯泰德文化维度理论。"],"q":"荷兰心理学家吉尔特·霍夫斯泰德(Geert Hofstede) 提出了一个测量不同国家间文化差异的框架，这一理论被称为霍夫斯泰德文化维度理论，在世界上有广泛的影响。","w":"high","e":["教材高频"]},{"t":"有研究显示，只有____的信息由言语传递，____靠非言语来传递。","y":"填空题","p":["7%的信息由言语传递，93%靠非言语来传递。"],"q":"有研究显示, 只有7%的信息由言语传递, 93%靠非言语来传递。","w":"normal","e":["核心考点"]},{"t":"'文化休克'是1958年美国人类学家____创造的一个概念，它包括蜜月阶段、沮丧阶段、恢复调整阶段、____等阶段。","y":"填空题","p":["'文化休克'是1958年美国人类学家奥博格创造的一个概念，包括蜜月阶段、沮丧阶段、恢复调整阶段、适应阶段等。"],"q":"“文化休克”, 又叫“文化震荡”“文化震惊” (cultural shock), 是1958年美国人类学家奥博格 (KalveroOberg)创造的一个概念。","w":"high","e":["教材高频"]},{"t":"提出高语境文化和低语境文化概念的是（　　）。A.霍夫斯泰德　B.爱德华·霍尔　C.奥博格　D.科豪尔斯","y":"单项选择题","p":["高语境文化和低语境文化由爱德华·霍尔在1976年出版的《超越文化》中提出。"],"q":"爱德华·霍尔在1976 年出版的《超越文化》中提出高语境(high context) 文化和低语境(lowcontext) 文化的概念。","w":"high","e":["教材高频"]},{"t":"'文化适应模式'的基本假设是：第二语言习得只是文化适应的一个方面，一个学习者对目的语社会文化适应的程度将会决定他习得第二语言的程度。这一模式由（　　）提出。A.Schumann　B.Brown　C.Hymes　D.Hall","y":"单项选择题","p":["'文化适应模式'（Acculturation Model）由Schumann（1978）提出。"],"q":"“文化适应模式” (Acculturation Model)的基本假设是：第二语言习得只是文化适应的一个方面，一个学习者对目的语社会文化适应的程度将会决定他习得第二语言的程度(Schumann，1978)。","w":"high","e":["教材高频"]}]},{"id":"rumen-c13-s02","t":"第二节 价值观和文化","w":"high","n":1,"k":[{"t":"历时文化与共时文化","y":"名词解释","p":["历时文化是'从纵的方面考察某一文化或文化现象的起源、发展、演变，它的阶段性和规律性'","共时文化是'从横的方面考察某一文化或文化现象在某一历史阶段的表象和特征'","跟第二语言教学密切结合的，主要是当代共时文化","原因是语言教学的主要目的是使学生用目的语进行有效的交际，脱离当代共时文化的教学对实现这一目的没有多少帮助"],"q":"历时文化是“从纵的方面考察某一文化或文化现象的起源、发展、演变，它的阶段性和规律性”，共时文化是“从横的方面考察某一文化或文化现象在某一历史阶段的表象和特征”。","w":"high","e":["教材高频"]}]},{"id":"rumen-c13-s03","t":"第三节 汉语教学中的文化教学","w":"high","n":6,"k":[{"t":"语言技能教学中的文化教学","y":"名词解释","p":["汉语教学中的文化教学有两方面的内容：一是语言教学中的文化教学，即包含在汉语技能教学中的文化教学，如语言技能教材中包含的文化内容、语言本身所包含的文化内容等","二是文化课教学，即以文化本身为教学内容的教学","语言技能课的主要任务是通过听、说、读、写等技能和语言运用能力的训练来培养交际能力，其中心不是文化教学，语言课上语言技能为教学重点的原则不能改变"],"q":"汉语教学中的文化教学有两方面的内容：一是语言教学中的文化教学，即包含在汉语技能教学中的文化教学，如语言技能教材中包含的文化内容、语言本身所包含的文化内容等； 二是文化课教学，即以文化本身为教学内容的教学。","w":"normal","e":["核心考点"]},{"t":"简述文化教学对教师的要求。","y":"简答题","p":["了解中华文化基本知识","了解中国基本国情并客观介绍","具有跨文化意识","具有跨文化交际能力","运用学生母语能力","国际视野与关注热点"],"q":"中国文化与跨文化交际课程对教师的要求可以分为四个部分：①了解中华文化基本知识，具备文化阐释和传播的基本能力； ②了解中国基本国情，能客观、准确地介绍中国； ③具有跨文化意识； ④具有跨文化交际能力。","w":"normal","e":["核心考点"]},{"t":"文化教学的基本内容有哪些？","y":"简答题","p":["中国历史介绍","中国国情介绍","中国地理介绍","中国民俗介绍"],"q":"文化教学的基本内容：中国历史介绍、中国国情介绍、中国地理介绍、中国民俗介绍。","w":"normal","e":["核心考点"]},{"t":"简述文化教学的方法和材料。","y":"简答题","p":["灵活处理跨文化交际中的问题","应用现身说法和对比法","教材应多采用当代内容","三个平衡","科学设计练习"],"q":"(一) 灵活处理跨文化交际中产生的问题……(二) 应用现身说法和对比法启发学生思考……(三) 教材应多采用当代的内容。","w":"normal","e":["核心考点"]},{"t":"汉语教学中的文化教学有两方面的内容：一是____，二是____。","y":"填空题","p":["一是语言教学中的文化教学，即包含在汉语技能教学中的文化教学；二是文化课教学，即以文化本身为教学内容的教学。"],"q":"汉语教学中的文化教学有两方面的内容：一是语言教学中的文化教学，即包含在汉语技能教学中的文化教学……二是文化课教学，即以文化本身为教学内容的教学。","w":"normal","e":["核心考点"]},{"t":"结合教材，论述汉语教学中的文化教学应如何实施。","y":"论述题","p":["区分语言教学中的文化教学与文化课教学","针对不同水平学生实施不同文化教学","语言技能课以语言技能为教学重点不改变","文化课系统学习文化知识","对教师的四方面要求","文化教学基本内容（历史/国情/地理/民俗）","文化教学方法与三个平衡"],"q":"汉语教学中的文化教学有两方面的内容：一是语言教学中的文化教学……二是文化课教学……对初级水平的学生应该实施语言教学中的文化教学，辅之以文化体验； 对中高级水平的学生则可以实施专门的文化课教学。","w":"high","e":["教材高频"]}]},{"id":"rumen-c13-s04","t":"第四节 跨文化交际与文化教学的基本态度和方法","w":"high","n":4,"k":[{"t":"'三个平衡'","y":"名词解释","p":["'三个平衡'是文化教学教材编写中应做到的原则，包括：传统文化与现代文化的平衡，即文化教学的内容应该和现实生活紧密结合，做到'学以致用'","知识文化与观念文化的平衡，也可以说是知识和理解的平衡，更希望学习者对中国文化的精神、中国人的价值观有所了解","语言技能和文化内容的平衡，即汉语教材都应十分关注学生的语言能力和接受程度，尽可能降低语言难度"],"q":"比较好的做法是做到“三个平衡”。","w":"normal","e":["核心考点"]},{"t":"文化教学应持有哪些对不同文化的基本态度？","y":"简答题","p":["反对民族虚无主义和文化沙龙主义","客观公正评价中国文化","注意内容的现实性和可接受性","具有宽容的文化观","有跨文化交际意识","妥善处理敏感话题"],"q":"(一) 反对民族虚无主义和文化沙龙主义。……(二) 注意文化教学内容的现实性和可接受性……(二) 有跨文化交际的意识。","w":"normal","e":["核心考点"]},{"t":"教材应多采用当代的内容，比较好的做法是做到'三个平衡'，以下不属于'三个平衡'的是（　　）。A.传统文化与现代文化的平衡　B.知识文化与观念文化的平衡　C.语言技能和文化内容的平衡　D.历时文化与共时文化的平衡","y":"单项选择题","p":["'三个平衡'指：传统文化与现代文化的平衡、知识文化与观念文化的平衡、语言技能和文化内容的平衡。"],"q":"(1) 传统文化与现代文化的平衡。……(2) 知识文化与观念文化的平衡。……(3) 语言技能和文化内容的平衡。","w":"normal","e":["核心考点"]},{"t":"【案例】一位在美国任教的汉语教师教'男女平等'一课。学完后挨个儿问学生：在家里是你做饭还是你女朋友做饭？是你爸爸还是你妈妈做饭？有的回答说我做，有的说我女朋友或者男朋友做，教师就引导他们这就叫男女平等。当教师问一个男生时，他说：'我爱人做饭。'教师问：'你结婚了吗？'他说：'没有。'教师说：'没结婚不能叫爱人，那是你女朋友。'他突然说：'老师，是男朋友。'这时全班都安静了下来，教师也愣了一下。教师马上说：那这样就叫做人人平等。所以我们不但可以说男女平等，也可以说人人平等。本来准备笑的几个学生也不笑了，就继续正常上课。\n请运用本章跨文化交际与文化教学的知识，分析这位教师的处理是否得当，并谈谈国际汉语教师应如何应对此类跨文化交际问题。","y":"案例分析题","p":["判断教师处理得当（刘逸云2017案例）","运用编码解码/文化差异分析","教师应具有跨文化交际意识并尊重多元文化","不以自身价值观评判他人文化","注意文化教学内容的现实性和可接受性","灵活处理问题、现身说法与对比法","了解学生文化背景、具有灵活处理能力"],"q":"这个教师处理得非常得当，在遇到问题，尤其是遇到与我们的道德认知非常不同的问题时，没有大惊小怪，而是巧妙地化解。","w":"high","e":["教材高频"]}]}]},{"id":"rumen-c14","t":"第十四章 汉语综合课教学","w":"high","s":[{"id":"rumen-c14-s01","t":"第一节 性质和特点","w":"high","n":8,"k":[{"t":"汉语综合课","y":"名词解释","p":["汉语综合课是承担系统的语言能力教学任务的主要课型，是进行听说读写综合训练的课型","在国内高校汉语教学课程设置中，综合课有不同的称呼：'基础汉语课''汉语精读课''读写课'等","综合课将读写技能培训跟语言知识传授结合起来，而听说技能的培养主要放在专门的听力课、说话课（口语课）完成","海外的汉语教学，听说读写各技能的训练主要通过综合课来完成"],"q":"《高等学校外国留学生汉语专业教学大纲》和《高等学校外国留学生汉语教学大纲 (长期进修)》……称之为“承担系统的语言能力教学任务的主要课型，是进行听说读写综合训练的课型”。","w":"high","e":["教材高频"]},{"t":"初级汉语读写课","y":"名词解释","p":["初级汉语读写课在初级汉语教学中地位重要：课时量最大，系统传授语音、词汇、语法、汉字等知识","此阶段，听、说、读、写技能训练很难像中高级阶段那样由各个不同的专项技能课来完成，尤其在零起点阶段，听说领先，读写很难完全分开训练","因此，读写课要全面提高学生的各项语言技能，不能忽视听说技能","其主要目标是让学生熟练掌握跟汉语交际技能密切相关的语言要素（语音、词汇、语法），并重点培养学生初步的读写技能"],"q":"初级汉语读写课 (以下简称读写课) 在初级汉语教学中地位重要：课时量最大，系统传授语音、词汇、语法、汉字等知识。","w":"high","e":["教材高频"]},{"t":"中高级汉语精读课","y":"名词解释","p":["中高级汉语精读课的主要任务是系统学习汉语知识，尤其是词汇、语法、语篇知识，主要方式是精讲、精读、精练，特点是基础性、综合性相结合","基础性，是通过学习语言知识，为技能课的训练提供语言基础和技能基础","综合性，是通过讲解读写技能、听说读写训练让学生掌握语言知识","简言之，精读课要以基础语言知识为中心进行综合训练","各种技能中，精读课侧重读写，侧重提高阅读能力和书面表达能力"],"q":"中高级汉语精读课(以下简称精读课) 的主要任务是系统学习汉语知识，尤其是词汇、语法、语篇知识，主要方式是精讲、精读、精练，特点是基础性、综合性相结合。","w":"high","e":["教材高频"]},{"t":"简述初级汉语读写课的特点。","y":"简答题","p":["课时量最大，系统传授语音词汇语法汉字","全面提高各项语言技能，不能忽视听说","强化教学以建立规范","实践为主","针对儿童对象突出趣味性、形象性"],"q":"初级汉语读写课……在初级汉语教学中地位重要：课时量最大，系统传授语音、词汇、语法、汉字等知识。……(一) 强化教学以建立规范……(二) 实践为主。","w":"high","e":["教材高频"]},{"t":"简述中高级汉语精读课的性质。","y":"简答题","p":["主要任务是系统学习汉语知识（词汇、语法、语篇）","主要方式精讲、精读、精练","基础性与综合性相结合","以基础语言知识为中心进行综合训练","侧重读写","学生调研支持"],"q":"中高级汉语精读课(以下简称精读课) 的主要任务是系统学习汉语知识，尤其是词汇、语法、语篇知识，主要方式是精讲、精读、精练，特点是基础性、综合性相结合。","w":"high","e":["教材高频"]},{"t":"综合课在初级阶段就是零起点的语音教学，课文的汉字不多，教学重点是让学生对汉语语音系统有初步认识。","y":"判断题","p":["零起点的汉语教学就是语音教学。课文的汉字不多，教学重点就是让学生对汉语语音系统有初步认识，能比较准确地发音，能识认汉语拼音并用拼音进行拼写。"],"q":"零起点的汉语教学就是语音教学。课文的汉字不多，教学重点就是让学生对汉语语音系统有初步认识，能比较准确地发音，能识认汉语拼音并用拼音进行拼写。","w":"normal","e":["核心考点"]},{"t":"国内汉语教学一般在初级阶段开'基础汉语课'或'读写课'，中高级阶段开____，其基本功能跟综合课相似。","y":"填空题","p":["中高级阶段开'精读课'。"],"q":"国内汉语教学一般在初级阶段开“基础汉语课”或“读写课”，中高级阶段开“精读课”，其基本功能跟综合课相似。","w":"normal","e":["核心考点"]},{"t":"《长期教学大纲》对生词学习有不同的要求，其中'复用式掌握'指的是（　　）。A.一会　B.两会　C.三会　D.听说读写四会","y":"单项选择题","p":["领会式掌握（'一会''两会'或'三会'）和复用式掌握（听说读写四会）。"],"q":"《长期教学大纲》对生词学习有不同的要求：领会式掌握 (“一会”“两会”或“三会”) 和复用式掌握(听说读写四会)。","w":"high","e":["教材高频"]}]},{"id":"rumen-c14-s02","t":"第二节 教学内容和教学原则","w":"high","n":18,"k":[{"t":"实践为主（初级阶段教学原则）","y":"名词解释","p":["实践为主是初级阶段教学最重要的手段和原则","吕叔湘先生说过：'学习语言不是学一套知识，而是学一种技能","'语言技能的学习，就是排除母语干扰，形成新的语言习惯","实践就是训练，就是依据习得理论，科学、高效地培养新的语言习惯，在训练中体会、掌握、应用语法规则","科学，就是制定符合语言教学规律的教学活动"],"q":"实践是初级阶段教学最重要的手段和原则。……成功的教学就是要让课堂成为操练场而不是只有一个人表演的说书场。","w":"high","e":["教材高频"]},{"t":"复用式掌握与领会式掌握","y":"名词解释","p":["这是《长期教学大纲》对生词学习提出的两种不同要求：领会式掌握（'一会''两会'或'三会'）和复用式掌握（听说读写四会）","这两类词语的讲解和练习是有区别的","复用式词语必须得到较多的重复和练习，使它们及时转入长时记忆","因此，对每课生词应找出重点词语，补充例句，介绍用法，并进行大量练习"],"q":"《长期教学大纲》对生词学习有不同的要求：领会式掌握 (“一会”“两会”或“三会”) 和复用式掌握(听说读写四会)。","w":"high","e":["教材高频"]},{"t":"词汇场","y":"名词解释","p":["词汇场是扩大词汇量时考虑语义类聚而形成的一组语义相关的词语","如以'味道'为核心形成词汇场：'酸、甜、苦、辣'","'身体不适感'的词汇场如'累、困、饿、渴、疼、痒、酸'","词汇场要有所控制，不能扩得太大","词汇扩大要结合构词法进行，使学生对所学词汇有更深的认识"],"q":"扩大词汇可以考虑语义类聚。如以“味道”为核心形成词汇场：“酸、甜、苦、辣”；“身体不适感”的词汇场如“累、困、饿、渴、疼、痒、酸”。词汇场要有所控制，不能扩得太大。","w":"normal","e":["核心考点"]},{"t":"动宾离合词","y":"名词解释","p":["动宾离合词是教学中一个难点","如'见面、请假、洗澡、跑步、结婚'等，看起来像一个词，但跟一般动词比，又有一些非词的特点：①表示体、态的词语往往在中间，如'见过面，结了婚'","②中间可插入表示数量、性质的词语，如'跑了一小时步，请个假'","③表示对象的语言单位，有时可放在中间，如'见他一面'","因此，不少人认为它们介乎词和短语（词组）之间，既有词的特征，又有短语（词组）的特征"],"q":"动宾离合词也是一个教学难点。如“见面、请假、洗澡、跑步、结婚”等，看起来像一个词，但跟一般动词比，又有一些非词的特点。","w":"high","e":["教材高频"]},{"t":"简述语音教学的特点及内容方法。","y":"简答题","p":["严格规范的语音训练","有错必纠，教标准普通话，杜绝洋腔洋调","内容包括声母、韵母、声调、音节、语调","展示—模仿—指导—纠正","适当夸张、直观展示区别性特征","声调是难点，加强认辨听辨","结合语流音变在实际语言中训练"],"q":"此阶段语音教学的特点，就是严格规范的语音训练。……语音教学内容包括声母、韵母、声调、音节和语调。","w":"high","e":["教材高频"]},{"t":"初级阶段的汉字教学可以采用哪些方法？","y":"简答题","p":["先认后写，多认少写","熟悉基本构件","注意偏旁位置，注重声符义符","敢于拆字分析","讲授笔画偏旁名称与笔顺","强化声符义符辨认","纠正常见错误","教手写体书写方式"],"q":"汉字教学可考虑以下四点：①先认后写，多认少写； ②熟悉基本构件； ③注意偏旁位置，注重声符义符； ④敢于拆字分析。","w":"high","e":["教材高频"]},{"t":"简述初级阶段词汇教学的主要内容。","y":"简答题","p":["侧重常用词的音与形、基本意思及常用搭配","生词的书写和语音（领读、跟读、听写）","生词的复现和归类","注重常用语素的学习","讲练词语的常用搭配"],"q":"相对来说，初级阶段的词汇教学内容比较简单，侧重常用词的音与形、基本意思及常用搭配。……4. 讲练词语的常用搭配。","w":"high","e":["教材高频"]},{"t":"初级阶段语法教学应注意哪些方面？","y":"简答题","p":["准确理解语法","形式意义相结合，写出公式","高效强化的重复练习","重视搭配训练"],"q":"初级阶段语法教学的内容包括汉语词类、短语、句子基本成分、单句、复句、特殊句式等。……1. 准确理解语法……2. 形式意义相结合……3. 高效强化的重复练习……4. 重视搭配训练。","w":"high","e":["教材高频"]},{"t":"中高级阶段重点词语的学习主要包括哪些内容？","y":"简答题","p":["近义词的语义与用法辨析","多义词的义项和用法","常用副词、虚词和相关结构","用法特殊或兼跨词类的常用词语","熟语、文言词、习用词组及固定格式"],"q":"重点词语的学习主要包括：(1) 近义词的语义，特别是用法辨析。……(5) 熟语、文言词、习用词组及固定格式。","w":"high","e":["教材高频"]},{"t":"中高级阶段如何进行构词法教学？","y":"简答题","p":["汉语构词形式有限且与句法结构一致","掌握构词法有助于扩大词汇量、促进语法教学","优先讲练偏正式、联合式（占70%以上）","明确修饰语素和中心语素的位置","结合语素猜词，培养语感"],"q":"汉语词语的构词形式不多，也就是偏正、联合、补充、述宾、主谓、重叠等有限的几种……讲解构词法要优先讲练偏正式、联合式，因为它们占所有汉语复合词的70%以上。","w":"high","e":["教材高频"]},{"t":"中高级阶段为什么要重视词语复现？如何进行？","y":"简答题","p":["不同语境中复习可减少遗忘","新词至少需要6~8次复现","用已学词语解释生词、联系旧词","用生词讲故事/编故事","设置练习重现前几课词语"],"q":"增加词语复现，让学生在不同语境中复习，可减少遗忘。一般说来，新词至少需要6~8次复现，才能初步掌握。","w":"normal","e":["核心考点"]},{"t":"中高级阶段扩大词汇量应注意哪些问题？","y":"简答题","p":["扩大的度和量要有考虑，不能超能力盲目扩大","补充高频词","利用词汇场进行语义类聚","结合构词法进行扩大","对扩大的词汇有意识复习操练"],"q":"扩大词汇量，是词汇教学的需要，是学生学习、交际的需要。但是，扩大的度和量要有所考虑，不能超过学生的能力盲目扩大。……(1) 高频词。……(2) 词汇场。……","w":"normal","e":["核心考点"]},{"t":"中高级精读课的语法教学包括哪两方面内容？","y":"简答题","p":["巩固初等阶段所学语法知识","进一步扩展和深化新语法知识","设立语法专题集中讲练难点"],"q":"一方面，通过归纳总结式的讲练，巩固初等阶段所学语法知识。……另一方面，学生在初级阶段所学的语法知识还远远不能满足交际需要，需要在中高级阶段进一步扩展和深化。","w":"high","e":["教材高频"]},{"t":"一般说来，新词至少需要6~8次复现，才能初步掌握。","y":"判断题","p":["增加词语复现可减少遗忘。一般说来，新词至少需要6~8次复现，才能初步掌握。"],"q":"一般说来，新词至少需要6~8次复现，才能初步掌握。","w":"high","e":["教材高频"]},{"t":"中高级精读课的语法教学只讲授新语法知识，不必再重现和巩固初级阶段所学过的语法点。","y":"判断题","p":["中高级精读课的语法教学包括两方面：一方面通过归纳总结式的讲练巩固初等阶段所学语法知识；另一方面进一步扩展和深化新语法知识。初级阶段学过的语法点中高级阶段学生常常出现偏误，应继续讲练。"],"q":"一方面，通过归纳总结式的讲练，巩固初等阶段所学语法知识。……另一方面，学生在初级阶段所学的语法知识还远远不能满足交际需要，需要在中高级阶段进一步扩展和深化。","w":"normal","e":["核心考点"]},{"t":"以下不属于初级阶段语法教学中需准确辨析的近义语法点的是（　　）。A.'或者'与'还是'　B.'能'与'会'　C.'才'与'就'　D.'在'与'从'","y":"单项选择题","p":["初级阶段要教的语法点如'或者'与'还是'、'能'与'会'、'一点'与'有点'、'比较'与'比'、'才'与'就'等。"],"q":"像“或者” 与“还是”、 “能” 与“会”、 “一点” 与“有点”、 “比较”与“比”、“才”与“就”等，都是初级阶段要教的语法点。","w":"normal","e":["核心考点"]},{"t":"'见面、请假、洗澡、跑步、结婚'等词在汉语语法中被称为（　　）。A.单纯词　B.动宾离合词　C.联合式合成词　D.偏正式合成词","y":"单项选择题","p":["动宾离合词看起来像一个词，但中间可插入体态词语、数量词语、对象等，介乎词和短语之间。"],"q":"动宾离合词也是一个教学难点。如“见面、请假、洗澡、跑步、结婚”等，看起来像一个词，但跟一般动词比，又有一些非词的特点。","w":"high","e":["教材高频"]},{"t":"结合教材，论述初级阶段与中高级阶段汉语综合课在教学上的区别。","y":"论述题","p":["课型与性质不同（读写课vs精读课）","教学方式与原则不同（强化规范、实践为主vs语言知识讲练）","语音、词汇、语法、语篇教学内容不同","课文处理方式不同","学生需求差异"],"q":"汉语教学的初级阶段跟中高级阶段综合课的教学内容、方法区别很大。因此，我们采取“初级汉语读写课”  “中高级汉语精读课”的名称探讨不同阶段汉语综合课的特点。","w":"high","e":["教材高频"]}]},{"id":"rumen-c14-s03","t":"第三节 教学环节和教学方法","w":"high","n":10,"k":[{"t":"综合课的教学环节","y":"名词解释","p":["综合课教学通常可分为以下环节：导入新课，讲练生词，讲练语言点，讲练课文，归纳总结，练习","每个教学环节由若干教学步骤组成","例如，讲解语法点，可由导入语法点、解释语法点、练习语法点等组成","完成教学环节和步骤，可采用不同的教学方法","例如语法点，可用归纳法（先举例句后归纳语法知识），也可用演绎法（先解释语法知识后举例说明）"],"q":"综合课教学通常可分为以下环节：导入新课，讲练生词，讲练语言点，讲练课文，归纳总结，练习。","w":"high","e":["教材高频"]},{"t":"综合课的讲练生词应如何安排？","y":"简答题","p":["生词表的教学，讲解词语的形音义","初级阶段：认读、讲练、巩固三步骤，讲练结合","初级阶段要求复用式掌握","中高级阶段：切分课文与生词表","有选择有针对性地教学，难词结合语境"],"q":"讲练生词实际就是生词表的教学。在预习的基础上，根据课文内容和生词的特点对生词表中的词语进行针对性的讲解，通过多种方法让学生了解和熟悉所学词语的形音义。","w":"normal","e":["核心考点"]},{"t":"综合课的语言点操练有哪些方法？","y":"简答题","p":["机械练习、改说句子、复述、问答、生词连句连篇","利用教室和学生的真实情景","口头扩展替换练习","模拟情景对话练习","归纳法与演绎法结合"],"q":"操练应形式多样，灵活使用。如机械练习、改说句子、复述、问答、生词连句连篇等。","w":"normal","e":["核心考点"]},{"t":"综合课的课文教学有哪些基本步骤？","y":"简答题","p":["朗读课文","课文串讲","课文练习","讲练课文语言点","中高级课文切分成意义完整的部分"],"q":"课文的基本教学步骤是； 朗读课文，课文串讲，课文练习。","w":"high","e":["教材高频"]},{"t":"中高级阶段如何进行语篇教学（口头成段表达）？","y":"简答题","p":["指导学生掌握成段成篇表达的语法手段和词汇手段","就课文内容进行理解性问答","复述课文（给出提示词、语篇衔接词语）","就课文话题进行讨论","用指定词语叙述、描写或评论"],"q":"语篇教学。主要是指导学生掌握构成语段语篇的语法手段和词汇手段，能运用所学语言知识就某一方面的内容或话题进行书面或口头的成段成篇表达。……口头成段表达是语篇教学的重点。","w":"high","e":["教材高频"]},{"t":"综合课的课堂练习有哪些方式？","y":"简答题","p":["听写生词、短语、句子或段落","复习课文内容、生词、语言点","利用卡片、选词填空等复习","设计交际性练习","用指定词语问答、介绍课文、讨论话题"],"q":"课堂练习包括：听写生词、短语、句子或段落，复习课文内容，复习生词、语言点，完成课本上的练习。……教师还要在课堂上设计一些交际性练习。","w":"normal","e":["核心考点"]},{"t":"综合课的考核应注意什么？","y":"简答题","p":["考核是教学重要内容，不能忽略","初级阶段每课听写，中高级听写句子","听写也是听力训练","学习几课后进行单元测试","考核要有实用性、符合二语学习特点","避免纯语法知识考察"],"q":"考核是教学的重要内容，形式多种多样，可长可短，但不能忽略。尤其在初级阶段。……考核要注意二语学习特点和实用性。","w":"normal","e":["核心考点"]},{"t":"综合课教学通常可分为以下环节：导入新课，____，讲练语言点，讲练课文，归纳总结，练习。","y":"填空题","p":["综合课教学环节：导入新课，讲练生词，讲练语言点，讲练课文，归纳总结，练习。"],"q":"综合课教学通常可分为以下环节：导入新课，讲练生词，讲练语言点，讲练课文，归纳总结，练习。","w":"high","e":["教材高频"]},{"t":"课文的基本教学步骤是：____，____，____。","y":"填空题","p":["课文的基本教学步骤是：朗读课文，课文串讲，课文练习。"],"q":"课文的基本教学步骤是； 朗读课文，课文串讲，课文练习。","w":"high","e":["教材高频"]},{"t":"【案例】某教师给初级班讲解'把'字句。他先直接写出语法规则'把字句表示对人或事物的处置'，然后让学生用'把'字句自由造句。结果学生造句时错误百出，有的说'*我把书看看'，有的说'*他把饭吃了三碗'，还有的干脆回避使用'把'字句。\n请结合本章综合课语言点教学的知识，分析这位教师教学存在的问题，并提出改进建议。","y":"案例分析题","p":["未做到形式意义相结合、未给出公式","未讲清把字句的使用条件","缺乏高效强化的重复练习","练习设计不当、未全员参与","未采用归纳法/情景化教学","改进建议：讲清结构语义条件、多样化操练、对比把与被、创设语境复现"],"q":"语法讲解要注意形式意义相结合，用简单明了的符号写出“公式”，便于学生操练。如“把”字句，要解释清楚：①句式表达重点是致使； ②致使对象一般是有定的；③谓语动词一般不是单个动词，后边通常有其他成分。","w":"high","e":["教材高频"]}]}]},{"id":"rumen-c15","t":"第十五章 听力技能课","w":"high","s":[{"id":"rumen-c15-s01","t":"第一节 听力课课型特点","w":"high","n":23,"k":[{"t":"听力理解","y":"名词解释","p":["听力理解的本质，是通过语音对言语信息的接收，并通过大脑对信息进行解码","即听话者感知说话者语流中的每一个音节及其他言语信息（重音、语调、停顿等），运用原有知识（包括词汇、句法、语义等方面）对这些言语信息做出解释，进而揭示所接收的语音的含义","这其实是一个语音建构意义的过程","通过听觉来感知言语信息的过程可称为'输入'"],"q":"听力理解的本质，是通过语音对言语信息的接收，并通过大脑对信息进行解码。……这其实是一个语音建构意义的过程。","w":"high","e":["教材高频"]},{"t":"可懂输入","y":"名词解释","p":["在保证语音输入足量的基础上，听力课还得注重可懂输入，把'可懂输入与信息差相结合'","这样，才能使输入被理解和吸收，成为有效的输入","为保证可懂输入，教学要从学生实际水平出发，听力语料的难度要适合学生听力水平","一般来说，应该基本上让学生听懂语料，尤其是在讲解、学习该语料中的生词和新表达法之后"],"q":"在保证语音输入足量的基础上，听力课还得注重可懂输入，把“可懂输入与信息差相结合”。这样，才能使输入被理解和吸收，成为有效的输入。","w":"high","e":["教材高频"]},{"t":"听力微技能","y":"名词解释","p":["听力微技能是从训练、提高听力技能入手的各项具体能力","影响较大的是杨惠元提出的八点（1996）","初级阶段应掌握的听力微技能包括：辨音辨调能力、对句法结构形式及其意义的领会、对语境的理解、抓细节提高精听能力、捕捉主要信息、联想猜测、记忆存储、快速反应","中级阶段则包括辨音辨调（重点在语调句调）、义群理解与语流切分、抓细节、跳越障碍抓关键词语、联想猜测、预测、检索监听、记忆存储、概括总结、快速反应等"],"q":"关于听力微技能。影响较大的是杨惠元提出的八点 (1996)。……我们觉得可以做以下的概括(不能全尽，但应是主要的)。","w":"high","e":["教材高频"]},{"t":"联想、猜测与预测","y":"名词解释","p":["联想是指接收到一个信号（这里指语音）以后，马上跟其他相关信号（语流中的相关信号或记忆库中的相关信号）建立起联系的心理活动","猜测指对已经接收到的信息（语音信息）进行评判、估计的心理过程","预测则是指根据当下的感知（语音信号）和以往的经验，对即将接受的信息（语境表示的语义）做出推测、估计和预想的心理过程","三者都属于听力微技能"],"q":"联想是指接收到一个信号 (这里指语音) 以后，马上跟其他相关信号 (语流中的相关信号或记忆库中的相关信号) 建立起联系的心理活动； 猜测指对已经接收到的信息(语音信息) 进行评判、估计的心理过程； 预测则是指根据当下的感知 (语音信号)和以往的经验，对即将接受的信息(语境表示的语义) 做出推测、估计和预想的心理过程。","w":"normal","e":["核心考点"]},{"t":"检索监听","y":"名词解释","p":["检索监听是听力微技能之一，有几个方面的含义：（1）有明确的目的性，在听语料时，带着问题听，在语料中检索，只记住有关问题的部分","如听'全国天气预报'中注意自己想知道的城市的天气情况","（2）接收到有关信号，在自己的记忆库中检索，寻找有关的音义交汇点","如听到'孕妇忌服'检索出'怀孕'","（3）对一些同音词以及语料中的某些语言片段，虽然辨音没有问题，但必须在记忆库中检索出符合语义、语法的相关语词，才能算是理解了语料的意思"],"q":"检索监听有几个方面的含义。……(1) 有明确的目的性，在听语料时，带着问题听，在语料中检索，只记住有关问题的部分。","w":"normal","e":["核心考点"]},{"t":"义群理解、语流切分","y":"名词解释","p":["义群理解、语流切分是指识别句中停顿、对语流进行切分从而正确理解长句的能力，是中级阶段的听力微技能之一","这一点对于长句的理解尤为重要","例如'我一九八一年来过中国'，如果学生把'一'划归'我'，自然就想不到是'一九八一'了，原因之一是主谓之间的停顿不明显"],"q":"(2) 义群理解，识别句中停顿的能力 (语流切分)。","w":"normal","e":["核心考点"]},{"t":"'以听为主，听说结合'","y":"名词解释","p":["'以听为主，听说结合'是《教师标准》提出的听力教学的基本原则之一，要求教师在听力课上贯彻执行","听力课以听'为主'，但不能光听，还得有说、读、写作为辅助手段，这些手段都应该为'听'服务","'说'在听力课上用得最多，听力课上的'说'与口语课的'说'不同，它不是为功能训练，不在于表达得正确和得体，而是为了：①检查听的质量和效果","②帮助记忆","③避免过多、过于单调的听力刺激"],"q":"《教师标准》把“以听为主，听说结合”作为听力教学的另一条基本原则，要求教师在听力课上贯彻执行。","w":"high","e":["教材高频"]},{"t":"为什么说'输入是输出的基础和前提'？","y":"简答题","p":["听说读写分属输入与输出范畴","听说是口语交际，读写是书面语交际","听先于说","输入是输出的基础和前提","输入应先于、多于输出","输入的目的也是为了输出"],"q":"在听说读写四种技能中，听、读属于接受领会范畴，以“输入”为主； 说、写属于表达和应用范畴，以“输出”为主。……因此，输入是输出的基础和前提； 输入应先于输出，多于输出。","w":"high","e":["教材高频"]},{"t":"简述听力课以语音输入为主的特点。","y":"简答题","p":["听力语料的足量输入","语料来源多样（课本与补充材料）","注重大量输入和不断练习","为语音输入和理解服务的其他技能训练","以听为主，听说结合，说读写为听服务"],"q":"听力课的特点就是以语音输入为主。这可从两方面理解。1. 听力语料的足量输入……2. 为语音输入和理解服务的其他技能训练。","w":"high","e":["教材高频"]},{"t":"听力课上的'说'与口语课的'说'有何不同？","y":"简答题","p":["听力课的'说'不为功能训练","不要求表达正确得体","目的：检查听的质量和效果","帮助记忆","避免过多单调的听力刺激","课堂互动的需要"],"q":"听力课上的“说”与口语课的“说”不同，它不是为了功能训练，不在于表达得正确和得体，而是出于以下目的：①检查听的质量和效果； ②帮助记忆； ③避免过多、过于单调的听力刺激； ④课堂互动的需要。","w":"high","e":["教材高频"]},{"t":"初级班和中级班听力课各有何特点？","y":"简答题","p":["初级班四点特点（不讲新语法、只讲语料义、以听为主、以领会理解为主）","初级班是附属型技能训练课","中级班听力课有相对独立性","书面语成分增加","可适当讲解新语言点但不宜扩展","重点训练语段篇章理解"],"q":"基于这种情况，初级班听力课应有以下的特点：①基本不讲新的语法知识……中级班听力课的情况是：①听力课有相对独立性……④在单句理解的基础上，重点训练对语段和篇章的理解。","w":"high","e":["教材高频"]},{"t":"简述初级阶段应掌握的听力微技能。","y":"简答题","p":["辨音辨调能力","对句法结构形式及其意义的领会","对语境的理解","抓细节提高精听能力","捕捉主要信息","联想猜测","记忆存储","快速反应","三个层面（语言知识/语用/思维科学）"],"q":"1. 初级阶段：(1) 辨音辨调能力……(8) 快速反应……以上概括分属于三个不同的层面：(1) (2) 主要是语言知识的层面，(3) 是语用的层面， (4) ~(8) 则是思维科学的层面。","w":"high","e":["教材高频"]},{"t":"简述中级阶段应掌握的听力微技能。","y":"简答题","p":["辨音辨调（重点在语调句调）","义群理解与语流切分","抓细节","跳越障碍抓关键词语","联想猜测","预测（语义/语法）","检索监听","记忆存储","概括总结","快速反应"],"q":"2. 中级阶段：(1) 辨音辨调能力，重点在语调、句调方面……(10) 快速反应能力。","w":"high","e":["教材高频"]},{"t":"简述影响听力的主要因素，并说明听力课与阅读课的区别。","y":"简答题","p":["影响听力的六项因素","阅读是视觉输入可回读","听力语料转瞬即逝无回听主动权","听力课需教师发挥主导作用","听力课要求高度集中注意力","听力课时间不宜过长（两节课为单位）"],"q":"影响听力的因素主要有：①近似的音和调； ②生词； ③长句； ④语速； ⑤话题陌生。……听力课的时间一般不宜过长，以两节课为一个单位时间较为合适。","w":"high","e":["教材高频"]},{"t":"听力课上'说'的练习应与口语课一样，要求表达清楚、得体。","y":"判断题","p":["听力课上的'说'与口语课的'说'不同，它不是为功能训练，不在于表达得正确和得体。只要学习者说出听到的主要意思，用词不正确、声调不准确、语法有问题等都可以不追究。"],"q":"听力课上的“说”与口语课的“说”不同，它不是为了功能训练，不在于表达得正确和得体……只要学习者说出听到的主要意思，用词不正确、声调不准确、语法有问题等，都可以不追究。","w":"high","e":["教材高频"]},{"t":"听力课的时间一般不宜过长，以两节课为一个单位时间较为合适。","y":"判断题","p":["以语音形式出现的语料转瞬即逝，要求学生在听力课上保持高度集中的精神状态。因此，听力课的时间一般不宜过长，以两节课为一个单位时间较为合适。"],"q":"因此，听力课的时间一般不宜过长，以两节课为一个单位时间较为合适。","w":"normal","e":["核心考点"]},{"t":"'听语素组词'是一种非常适合在听力课上做的练习。","y":"判断题","p":["有些练习不适合在听力课上做，如'听语素组词'(业：工~、农~、商~……)，因为输入量太少。"],"q":"有些练习不适合在听力课上做，如“听语素组词” (业：工~、农~、商~……)，因为输入量太少。","w":"normal","e":["核心考点"]},{"t":"在听说读写四种技能中，听、读属于接受领会范畴，以____为主；说、写属于表达和应用范畴，以____为主。","y":"填空题","p":["听、读以'输入'为主；说、写以'输出'为主。"],"q":"在听说读写四种技能中，听、读属于接受领会范畴，以“输入”为主； 说、写属于表达和应用范畴，以“输出”为主。","w":"high","e":["教材高频"]},{"t":"《教师标准》把'____，____'作为听力教学的基本原则之一。","y":"填空题","p":["'注重大量输入和不断练习'是《国际汉语教师标准》提出的听力教学基本原则之一。"],"q":"“注重大量输入和不断练习”，是《国际汉语教师标准》 (国家汉办，2007，以下简称《教师标准》)提出的听力教学基本原则之一。","w":"normal","e":["核心考点"]},{"t":"提出汉语听力微技能'八点'的学者是（　　）。A.刘颂浩　B.杨惠元　C.吕必松　D.潘兆明","y":"单项选择题","p":["关于听力微技能，影响较大的是杨惠元提出的八点(1996)。"],"q":"关于听力微技能。影响较大的是杨惠元提出的八点 (1996)。","w":"high","e":["教材高频"]},{"t":"在听力课上用得最多的辅助技能是（　　）。A.说　B.读　C.写　D.译","y":"单项选择题","p":["说、读、写三种技能中，'说'在听力课上用得最多。《教师标准》把'以听为主，听说结合'作为听力教学的基本原则之一。"],"q":"说、读、写三种技能中，“说”在听力课上用得最多。《教师标准》把“以听为主，听说结合”作为听力教学的另一条基本原则，要求教师在听力课上贯彻执行。","w":"normal","e":["核心考点"]},{"t":"以下不属于影响听力因素的是（　　）。A.近似的音和调　B.生词　C.语速　D.字体大小","y":"单项选择题","p":["影响听力的因素主要有：①近似的音和调；②生词；③长句；④语速；⑤话题陌生；⑥选择项太难、太长、不易明白。"],"q":"影响听力的因素主要有：①近似的音和调； ②生词； ③长句； ④语速； ⑤话题陌生。如果再从听力练习、听力考试的角度看，还应该考虑⑥选择项太难、太长、不易明白的问题。","w":"normal","e":["核心考点"]},{"t":"结合教材，论述听力课的课型特点。","y":"论述题","p":["以语音输入为主（足量输入、听说结合）","重现主打课语言点，适量适度学习语言知识","训练听力微技能是主要目的","注重可懂输入","强化突出语音输入形式，与阅读课的区别"],"q":"听力课的特点就是以语音输入为主。……二、重现主打课语言点，适量、适度学习语言知识……三、训练听力技能……四、强化、突出语音输入形式。","w":"high","e":["教材高频"]}]},{"id":"rumen-c15-s02","t":"第二节 听力课的课堂教学","w":"high","n":10,"k":[{"t":"听力教学的'六有'","y":"名词解释","p":["'六有'是听力教学要注意的问题，包括：课前有准备，课上有讲解分析，有重点，有变化，有交流，课后有要求","课前有准备指备课不一定要写出很正式的教案，但一定要熟悉教材，心中有数","课上有讲解分析指听力课也应讲解分析，要找对切入点，不能只是放录音、对答案","有重点指要有一个总体安排","有变化指教学方法、教学步骤不要千篇一律"],"q":"“六有”包括：课前有准备，课上有讲解分析，有重点，有变化，有交流，课后有要求。","w":"high","e":["教材高频"]},{"t":"听力教学的'三忌'","y":"名词解释","p":["'三忌'是听力教学中要避免的三种做法，包括：一忌单调刺激，单调刺激学生容易打瞌睡，应该以听为主，听说、听写、听做结合","二忌反复死听、只对答案，要启发引导学生，录音带子不是每次都从头至尾播放，做了练习要检查讲解","三忌放羊式上课，要因人施教，尽量调动学生的积极性，如让程度高者回答难题、程度低者回答容易的题，鼓励学生主动回答问题"],"q":"1. 忌单调刺激……2. 忌反复死听、只对答案……3. 忌放羊式上课，要因人施教，尽量调动学生的积极性。","w":"high","e":["教材高频"]},{"t":"听力课教学如何听、讲生词？","y":"简答题","p":["一般先预习生词、解决障碍","中级班可不预习，培养交际技能","只讲没学过的词，引用语料例句","离开课本听读生词进行记忆检索","用生词串句子学习用法","听带生词的句子跟读或回答"],"q":"(1) 一般的做法是先布置学生预习生词，教师在听、解语料之前先解决生词的障碍。……(5) 听带有生词的句子，跟读，或回答相关问题，理解语料。","w":"normal","e":["核心考点"]},{"t":"听力课听、解语料的方法有哪些？","y":"简答题","p":["抓好句子、段落、语篇三个层级","抓关键词语法","串连法（语法成分/生词/关联词/数字）","句型类比法","提纲提示法","化解课文难点段落"],"q":"以下几种方法在听、解语料时比较常用、有效。前三种主要用于听、解句子，后两种主要用于听、解语篇。1. 抓关键词语法……5. 化解课文难点段落。","w":"high","e":["教材高频"]},{"t":"听力课教学环节与教学步骤是如何安排的？","y":"简答题","p":["两节课为单位：开头、展开、总结三环节","一课书为单位：复习旧知识、导入、学生词及语言点、听正文、做练习、总结六环节","初级班归并为四大环节","听正文与做练习交叉进行是重点"],"q":"如果把一个教学单位时间 (两节课) 作为一个教学单位的话，可以有开头……和总结三个环节。如果把一课书的内容作为一个教学单位的话，可以有复习旧知识……总结六个教学环节。","w":"normal","e":["核心考点"]},{"t":"听力课如何进行操练和安排练习？","y":"简答题","p":["练习与听、讲解语料交叉进行","听一段做一段","题序灵活安排，有增有减","总结概括性题目放后边","不适合的练习（听语素组词、听写、长篇复述、长时讨论）"],"q":"练习其实是与听、讲解语料交叉进行的，边听边练，听一段做一段。练习题目的次序可以依照正文理解的需要灵活安排，有增有减。一般来说，总结概括性的题目放在后边完成。","w":"normal","e":["核心考点"]},{"t":"听力课'课前有准备'具体包括哪些内容？","y":"简答题","p":["浏览整册教材（说明、体例、重点难点等）","了解前两课内容","了解主打课（读写课）相关内容","熟悉当课教学内容","梳理练习项目、发现难点","决定是否补充材料和练习"],"q":"(1) 接手某一个年级的课时，首先要浏览一遍教材……(6) 决定是否需要补充材料和练习项目。","w":"normal","e":["核心考点"]},{"t":"听力教学的'六有'包括：课前有准备，课上有____，有重点，有变化，有交流，课后有要求。","y":"填空题","p":["课上有讲解分析。听力课也应讲解分析，要找对切入点，做到有针对性地讲解，不能只是放录音、对答案。"],"q":"“六有”包括：课前有准备，课上有讲解分析，有重点，有变化，有交流，课后有要求。","w":"high","e":["教材高频"]},{"t":"听力教学的'三忌'是：忌____，忌反复死听、只对答案，忌____。","y":"填空题","p":["'三忌'：一忌单调刺激；二忌反复死听、只对答案；三忌放羊式上课，要因人施教。"],"q":"1. 忌单调刺激……2. 忌反复死听、只对答案……3. 忌放羊式上课，要因人施教，尽量调动学生的积极性。","w":"high","e":["教材高频"]},{"t":"【案例】一位新手教师上初级听力课。他把录音带从头至尾播放了两遍，然后逐题对答案，对完答案就让学生自己看书。学生反映课堂枯燥、收获不大。\n请结合本章听力课教学的知识，分析这位教师的教学问题，并给出改进建议。","y":"案例分析题","p":["犯了'三忌'之反复死听、只对答案","犯了'单调刺激'的毛病","违背'六有'（有讲解分析、有交流）","改进：课前准备、课上有讲解有重点有变化有交流","讲究播放技巧","遵循以听为主、听说结合","因人施教"],"q":"2. 忌反复死听、只对答案……(2) 录音带子不是每次都从头至尾播放，中间什么地方不懂了，就该重播什么地方。(3) 做了练习要检查，有了检查就有讲解的契机，有与学生对话的机会，课堂就不会冷清。","w":"high","e":["教材高频"]}]}]},{"id":"rumen-c16","t":"第十六章 口语课教学","w":"high","s":[{"id":"rumen-c16-s01","t":"第一节 口语教学原则","w":"high","n":26,"k":[{"t":"'i+1'原则","y":"名词解释","p":["i代表学生已有的汉语水平，+1指略高于学生水平的语言输入","'i+1'的输入对于学生来说，是可懂的输入","根据领会教学法（comprehension approach），人是通过可懂输入习得语言的","'i+1'是外语教学的一般原则，对于口语教学，特别是初级阶段的口语教学来说尤其重要","好的教材应该符合'i+1'原则"],"q":"i代表学生已有的汉语水平，+1指略高于学生水平的语言输入。“i+1”的输入对于学生来说, 是可懂的输入。根据领会教学法 (comprehension approach) (罗勃特·布莱尔，1987)，人是通过可懂输入习得语言的。","w":"high","e":["教材高频"]},{"t":"交际原则","y":"名词解释","p":["根据《国际汉语教师标准》，口语教学的第一条基本原则就是'以培养口语交际能力为目标'","交际既是口语课的目的，也是其手段","教学过程就是师生交际的过程，练习过程既包括师生交际，也包括学生之间的交际","学习和大部分的课堂活动应该为诱发真正的交际而设计","交际原则包括功能导向和任务设计两个方面"],"q":"根据《国际汉语教师标准》 (国家汉办，2007，以下简称《教师标准》)，口语教学的第一条基本原则就是“以培养口语交际能力为目标”。交际既是口语课的目的，也是其手段。","w":"high","e":["教材高频"]},{"t":"功能导向","y":"名词解释","p":["功能导向是交际原则的一个方面","《301》以功能为经为纲，以语法为纬为目，这种体例要求说话课教学要着眼于交际情景中的交际功能，让学生掌握在什么时候什么场合谁对谁说什么","教功能项目时，不仅要教一些简单的套话，还要让学生掌握完成特定交际功能的程序","如《301》第二十三课把道歉的程序分解为两个步骤：（1）对什么事情道歉","（2）进一步解释原因"],"q":"《301》以功能为经为纲，以语法为纬为目。这种体例要求说话课教学要着眼于交际情景中的交际功能，让学生掌握在什么时候什么场合谁对谁说什么。","w":"high","e":["教材高频"]},{"t":"任务教学法（信息差任务）","y":"名词解释","p":["任务教学法（task-based language teaching）最适合口语教学","任务设计使得交际功能得以落实","如以《301》第十一课《我要买橘子》为例，先给学生提供水果价目表、规定每组预算为50元，将每三四个学生分为一组，讨论自己喜欢吃的水果并选出三四种，计算每种水果应该买多少才能买到每个人都喜欢吃的且用的钱最接近50元","《阶梯汉语·中级口语》中'交际活动'都设计为信息差（information gap）任务：给交际双方每一方的信息和指令都是不同的，只有通过对话才能获得对方的信息、完成交际任务","这种信息差任务突出了交际的真实性"],"q":"任务教学法 (task-based language teaching) 最适合口语教学。任务设计使得交际功能得以落实。……这种信息差任务突出了交际的真实性，是该教材获得成功的一大亮点。","w":"high","e":["教材高频"]},{"t":"个性化原则（个人化与地方化）","y":"名词解释","p":["个性化是《教师标准》提出的另一条口语教学基本原则，即'教学活动和交际任务的设计应该接近学习者的实际生活'","个性化原则分为个人化和地方化两个方面：个人化（personalization）涉及学习者本身，就是在口语教学中要让学生谈自己所熟悉的事情，讲自己的故事，让学生从虚拟的课文里走出来，回到学生亲历的现实世界中","地方化（localization）涉及学习者的实际生活环境，就是把焦点放在学生所生活学习的地方，对特定教材进行地方化处理"],"q":"《教师标准》提出的另一条口语教学基本原则是“教学活动和交际任务的设计应该接近学习者的实际生活”……个性化原则分为个人化和地方化两个方面，个人化涉及学习者本身，而地方化涉及学习者的实际生活环境。","w":"high","e":["教材高频"]},{"t":"精讲多练原则","y":"名词解释","p":["精讲多练是《教师标准》规定的口语教学第二条基本原则，即'注重精讲多练，提高学生开口率'","《对外汉语教学初级阶段课程规范》则将精讲多练量化，精讲多练的比例应为3：7，这样自然就提高了学生的开口率","口语课的精讲应当立足于功能，即讲清特定情景下的特定交际功能，以及完成特定功能的语言项目，以功能统语法","多练即以任务为纲来组织课堂活动，可以将课堂的学生活动切分为各自准备、双人练习、小组讨论、班级活动等"],"q":"《教师标准》规定的口语教学第二条基本原则就是“注重精讲多练，提高学生开口率”。《对外汉语教学初级阶段课程规范》则将精讲多练量化，精讲多练的比例应为3：7，这样自然就提高了学生的开口率。","w":"high","e":["教材高频"]},{"t":"IRF结构","y":"名词解释","p":["IRF是口语课堂教学中师生互动的话语基本结构，即引发——反应——反馈（initiation-response-feedback）","这一结构在具体运用时可以进一步扩展：教师向学生发问，学生应答时有偏误，教师做出哪怕最简单的反馈：'嗯?'，学生改正过来，教师给予积极的反馈：'很好!'，这样就扩展为'引发——反应₁——反馈₁——反应₂——反馈₂'（IR₁F₁R₂F₂）结构","IRF是教师提问模式，还有教师指令模式I-RS-F、多向互动模式等多种互动模式"],"q":"教学过程中要注意师生互动 (interaction)。教学过程就是师生交际的过程。这一过程的话语基本结构为: 引发——反应——反馈(IRF: initiation-response-feedback)。","w":"high","e":["教材高频"]},{"t":"口语教学应遵循哪些基本原则？","y":"简答题","p":["'i+1'原则","交际原则（以培养口语交际能力为目标）","个性化原则（接近学习者实际生活）","精讲多练原则（3：7）","机械操练与实际应用相结合"],"q":"第一节 口语教学原则……一、“i+1”原则……二、交际原则……三、个性化原则……四、精讲多练原则。","w":"high","e":["教材高频"]},{"t":"举例说明如何在口语课中运用'i+1'原则。","y":"简答题","p":["i与+1的含义","可懂输入","了解学生的i并注意变化","控制教学用语和语速","用已学词语语法解释生词课文","以'工作'教学为例说明"],"q":"在教学过程中，特别是在初级阶段，熟手教师会基于“i+1”原则，有意识地控制课堂教学用语及其语速，用学生已经掌握的词语和语法点，来解释生词、课文，回答学生的问题。","w":"high","e":["教材高频"]},{"t":"口语教学中如何贯彻个性化原则？","y":"简答题","p":["个性化原则的含义","个人化的含义与做法","个人化的作用","地方化的含义","地方化的实例（本地名菜、动物园等）"],"q":"(一) 个人化……个人化(personalization) 就是在口语教学中要让学生谈自己所熟悉的事情，讲自己的故事。……(二) 地方化……地方化原则就是把焦点放在学生所生活学习的地方。","w":"high","e":["教材高频"]},{"t":"口语课如何做到精讲多练？","y":"简答题","p":["精讲多练原则及3：7比例","精讲：立足于情景结合的功能","精讲：口语用法","多练：多样化练习方式","多练：强化教学重点","多练：考虑年龄因素"],"q":"口语课的精讲应当立足于功能，即讲清特定情景下的特定交际功能，以及完成特定功能的语言项目，以功能统语法。多练即以任务为纲来组织课堂活动。","w":"high","e":["教材高频"]},{"t":"《对外汉语教学初级阶段课程规范》将精讲多练的比例量化为3：7。","y":"判断题","p":["《对外汉语教学初级阶段课程规范》将精讲多练量化，精讲多练的比例应为3：7，这样自然就提高了学生的开口率。"],"q":"《对外汉语教学初级阶段课程规范》(王钟华，1999：37) 则将精讲多练量化，精讲多练的比例应为3：7，这样自然就提高了学生的开口率。","w":"high","e":["教材高频"]},{"t":"'祝'与'祝贺'的功能相同，可以随意替换。","y":"判断题","p":["'祝'表示祝愿(wish)，是未然性的；祝贺是congratulation，是已然性的。两者不能随意替换。如考完试成绩全班第一说'祝贺你'；明天要考试说'祝你取得好成绩'。"],"q":"“祝”表示祝愿(wish)，是未然性的；祝贺是 congratulation, 是已然性的。……考完试了，成绩全班第一，说“祝贺你”； 明天要考试，说“祝你取得好成绩”。两者不能随意替换。","w":"high","e":["教材高频"]},{"t":"根据《国际汉语教师标准》，口语教学的第一条基本原则就是'____'。","y":"填空题","p":["口语教学的第一条基本原则就是'以培养口语交际能力为目标'。交际既是口语课的目的，也是其手段。"],"q":"根据《国际汉语教师标准》……口语教学的第一条基本原则就是“以培养口语交际能力为目标”。","w":"high","e":["教材高频"]},{"t":"口语课堂教学中师生互动的话语基本结构IRF，即____——____——____。","y":"填空题","p":["IRF即引发——反应——反馈（initiation-response-feedback）。"],"q":"这一过程的话语基本结构为: 引发——反应——反馈(IRF: initiation-response-feedback)。","w":"high","e":["教材高频"]},{"t":"个性化原则分为____和____两个方面，前者涉及学习者本身，后者涉及学习者的实际生活环境。","y":"填空题","p":["个性化原则分为个人化和地方化两个方面。"],"q":"个性化原则分为个人化和地方化两个方面，个人化涉及学习者本身，而地方化涉及学习者的实际生活环境。","w":"high","e":["教材高频"]},{"t":"以下不属于口语教学基本原则的是（　　）。A.交际原则　B.个性化原则　C.精讲多练原则　D.淡化语法原则","y":"单项选择题","p":["口语教学的基本原则包括'i+1'原则、交际原则、个性化原则、精讲多练原则、注重机械操练与实际应用相结合。"],"q":"第一节 口语教学原则……一、“i+1”原则……二、交际原则……三、个性化原则……四、精讲多练原则。","w":"normal","e":["核心考点"]},{"t":"'教学活动和交际任务的设计应该接近学习者的实际生活'是《教师标准》提出的口语教学的（　　）。A.'i+1'原则　B.交际原则　C.个性化原则　D.精讲多练原则","y":"单项选择题","p":["《教师标准》提出的另一条口语教学基本原则是'教学活动和交际任务的设计应该接近学习者的实际生活'，即个性化原则。"],"q":"《教师标准》提出的另一条口语教学基本原则是“教学活动和交际任务的设计应该接近学习者的实际生活”。","w":"high","e":["教材高频"]},{"t":"《阶梯汉语·中级口语》中'交际活动'都设计为（　　）任务。A.复述　B.信息差　C.朗读　D.听写","y":"单项选择题","p":["《阶梯汉语·中级口语》中'交际活动'都设计为信息差(information gap)任务，交际者的信息互不相通，只有通过对话才能获得对方的信息、完成交际任务。"],"q":"《阶梯汉语·中级口语》中“交际活动”都设计为信息差 (information gap) 任务。……这种信息差任务突出了交际的真实性，是该教材获得成功的一大亮点。","w":"high","e":["教材高频"]},{"t":"个性化原则","y":"名词解释","p":["个性化原则是《教师标准》提出的口语教学基本原则之一，指教学活动和交际任务的设计应该接近学习者的实际生活","个性化原则分为个人化和地方化两个方面","个人化（personalization）就是在口语教学中要让学生谈自己所熟悉的事情，讲自己的故事，让学生从虚拟的课文里走出来，回到学生亲历的现实世界中","地方化（localization）原则就是把焦点放在学生所生活学习的地方，在使用特定教材时进行地方化的处理"],"q":"个性化原则分为个人化和地方化两个方面，个人化涉及学习者本身，而地方化涉及学习者的实际生活环境。","w":"normal","e":["核心考点"]},{"t":"IRF结构","y":"名词解释","p":["IRF结构是口语教学过程中师生互动的话语基本结构，即引发——反应——反馈（IRF: initiation-response-feedback）","这一结构在具体运用时可以进一步扩展：教师向学生发问，学生应答时有偏误，教师做出哪怕最简单的反馈“嗯?”，学生改正过来，教师给予积极的反馈“很好!”，这样就扩展为“引发——反应₁——反馈₁——反应₂——反馈₂”（IR₁F₁R₂F₂）结构","除IRF外，还有教师指令模式I-RS-F、多向互动模式、转述模式、传递模式、学生引发模式、学生协助引发模式等互动模式"],"q":"这一过程的话语基本结构为: 引发——反应——反馈(IRF: initiation-response-feedback)。这一结构在具体运用时可以进一步扩展……(IR₁F₁R₂F₂)结构。","w":"normal","e":["核心考点"]},{"t":"简述口语教学的交际原则。","y":"简答题","p":["《教师标准》：以培养口语交际能力为目标，交际既是目的也是手段","教学过程是师生交际的过程，活动为诱发真正的交际而设计","功能导向：着眼于交际情景中的交际功能","任务设计：任务教学法最适合口语教学，落实交际功能","不要上成对话体的读写课或精读课"],"q":"根据《国际汉语教师标准》……口语教学的第一条基本原则就是“以培养口语交际能力为目标”。交际既是口语课的目的，也是其手段。……学习和大部分的课堂活动应该为诱发真正的交际而设计。","w":"normal","e":["核心考点"]},{"t":"简述口语教学的精讲多练原则。","y":"简答题","p":["《教师标准》：注重精讲多练，提高学生开口率","精讲多练比例应为3:7","精讲立足于功能，以功能统语法","多练以任务为纲组织课堂活动（各自准备、双人练习、小组讨论、班级活动）","注意师生互动，话语基本结构为IRF"],"q":"《教师标准》规定的口语教学第二条基本原则就是“注重精讲多练，提高学生开口率”。《对外汉语教学初级阶段课程规范》则将精讲多练量化，精讲多练的比例应为3：7。","w":"normal","e":["核心考点"]},{"t":"口语课词汇讲解有哪些主要方法？","y":"简答题","p":["口语课词语抓住两类：情景功能相关词语、口语色彩词语","直接法、类聚法、情景法、描述法（用于课文前专门讲解）","答疑法、提问法（适合课文串讲之中）"],"q":"词汇讲解方法有：(1) 直接法……(2) 类聚法……(3) 情景法……(4) 描述法……(5) 答疑法……(6) 提问法……上述六种方法，(1)~(4)适用于课文之前专门进行的生词讲解，(5)(6)适合于在课文串讲之中进行。","w":"normal","e":["核心考点"]},{"t":"口语教学的自由表达环节中，教师的作用相当于一个电影导演，教师的话不宜过多，点到即止。","y":"判断题","p":["正确","教师作用相当于电影导演，话不宜过多，点到即止"],"q":"在自由表达的训练中，教师的作用相当于一个电影导演。……在参与过程中，教师的话不宜过多，点到即止。教师应时刻记住，课堂教学应以学生为中心。","w":"normal","e":["核心考点"]},{"t":"《对外汉语教学初级阶段课程规范》将精讲多练量化，精讲多练的比例应为______。","y":"填空题","p":["3：7"],"q":"《对外汉语教学初级阶段课程规范》(王钟华，1999：37) 则将精讲多练量化，精讲多练的比例应为3：7。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c16-s02","t":"第二节 口语教学环节","w":"high","n":14,"k":[{"t":"口语教学的导入环节有哪些方式？","y":"简答题","p":["导入环节简短，约5分钟","复习导入","话题导入"],"q":"导入是一个简短的环节，通常5分钟左右，为学习新课做好铺垫。(一) 复习导入……(二) 话题导入……","w":"normal","e":["核心考点"]},{"t":"口语课处理课文时，如何抓住语言点（语音、生词、表达式）？","y":"简答题","p":["语音：注重流利性和准确性结合，示范—模仿—再示范—再模仿","生词：抓两类词（情景功能相关、口语色彩）","生词：两种讲解时间与六种讲解方法","表达式：介绍功能、设置情景、尝试运用"],"q":"1. 语音……对口语课语音教学，赵金铭(2006：42) 总结出一条“示范—模仿—再示范—再模仿”的路子……2. 生词……3. 表达式……","w":"high","e":["教材高频"]},{"t":"口语课的词汇讲解有哪些方法？","y":"简答题","p":["直接法","类聚法","情景法","描述法","答疑法","提问法","（1）~（4）适用专门讲解，（5）（6）适合课文串讲中"],"q":"词汇讲解方法有：(1) 直接法……(2) 类聚法……(3) 情景法……(4) 描述法……(5) 答疑法……(6) 提问法……","w":"normal","e":["核心考点"]},{"t":"口语课语言点练习环节有哪些类型？","y":"简答题","p":["替换练习（机械操练，不宜持续太长）","变换练习（多种句式变换）","完成句子（半机械半自由）","完成会话（根据上下文补足）","归纳公式帮助掌握"],"q":"语言点的练习一般包括替换练习、变换练习、完成句子、完成会话等类型。","w":"normal","e":["核心考点"]},{"t":"口语课如何进行自由表达环节的训练？","y":"简答题","p":["注重机械操练与实际应用相结合","根据情景会话（双人练习、课堂表演）","谈一谈/说话（独白、小组活动）","中级阶段兼顾情景对话与成段表达","高级阶段以成段表达为主","教师作用相当于导演，以学生为中心"],"q":"根据《教师标准》，口语教学的最后一条基本原则就是“注重机械操练与实际应用相结合”。……《301》中“根据实际情况回答问题”“根据情景会话”“谈一谈/说话”等就是自由表达，是接近实际应用的交际任务。","w":"high","e":["教材高频"]},{"t":"口语课如何通过问答掌握课文内容？","y":"简答题","p":["通过问答方式掌握课文内容","提出理解性问题","运用突然提问技巧","就同样内容再次提问，照顾水平较差学生","综合回答进行复述练习","板书功能程序提纲"],"q":"可以通过问答的方式来掌握课文内容。……可以运用突然提问技巧，教师先提问题，再叫名字，请学生即时回答。……最后板书“相约”功能的程序提纲。","w":"normal","e":["核心考点"]},{"t":"在自由表达的训练中，教师应多说话，充分讲解，以学生为中心。","y":"判断题","p":["在自由表达的训练中，教师的作用相当于一个电影导演，学生的话要在教师的监控下进行；同时教师作为参与者与学生处于平等地位，但教师的话不宜过多，点到即止，课堂教学应以学生为中心。"],"q":"值得指出的是，在参与过程中，教师的话不宜过多，点到即止。教师应时刻记住，课堂教学应以学生为中心。","w":"normal","e":["核心考点"]},{"t":"赵金铭总结出口语课语音教学的一条路子是'____—模仿—再示范—再模仿'。","y":"填空题","p":["对口语课语音教学，赵金铭总结出一条'示范—模仿—再示范—再模仿'的路子。"],"q":"对口语课语音教学，赵金铭(2006：42) 总结出一条“示范—模仿—再示范—再模仿”的路子。","w":"normal","e":["核心考点"]},{"t":"结合教材，论述口语课的教学环节及每个环节的主要做法。","y":"论述题","p":["导入环节（复习导入、话题导入）","课文处理环节：抓住语言点（语音、生词、表达式）","课文处理环节：抓住课文内容（问答、突然提问、复述、提纲）","语言点练习环节（替换、变换、完成句子/会话）","自由表达环节（情景会话、谈一谈、成段表达）"],"q":"第二节 口语教学环节……一、导入环节……二、课文处理环节……三、语言点练习环节……四、自由表达环节。","w":"high","e":["教材高频"]},{"t":"【案例】某教师上初级口语课《买东西》。他先花大半节课逐词讲解生词表，把每个生词的词性、用法、例句都详细写在黑板上，学生只是听和记笔记。然后让学生分角色朗读课文、背诵课文，最后对答案。下课铃响时，学生几乎没有自己开口完成任务的机会，课堂气氛沉闷。\n请结合本章口语教学原则和环节的知识，分析这位教师教学存在的问题，并提出改进建议。","y":"案例分析题","p":["违反精讲多练（应为3：7，开口率低）","违反交际原则（未诱发真正交际，像读写/精读课）","未落实'i+1'及个性化原则","不符合口语课教学环节（缺导入、自由表达）","改进：精讲立足功能","改进：多练以任务为纲、信息差任务","改进：运用个人化地方化、按环节组织教学"],"q":"《教师标准》规定的口语教学第二条基本原则就是“注重精讲多练，提高学生开口率”。《对外汉语教学初级阶段课程规范》则将精讲多练量化，精讲多练的比例应为3：7，这样自然就提高了学生的开口率。","w":"high","e":["教材高频"]},{"t":"简述口语教学的基本环节。","y":"简答题","p":["导入环节（复习导入、话题导入）","课文处理环节（抓语言点：语音、生词、表达式；抓课文内容：问答、复述、提纲）","语言点练习环节（替换、变换、完成句子、完成会话）","自由表达环节（情景会话、谈一谈/说话，机械操练与实际应用相结合）"],"q":"第二节 口语教学环节 一、导入环节……二、课文处理环节……三、语言点练习环节……四、自由表达环节","w":"normal","e":["核心考点"]},{"t":"在口语课课文处理环节，如何抓住课文的语言点？","y":"简答题","p":["语音：示范—模仿—再示范—再模仿，练习声韵调和音节连读","语音错误不及时纠正会出现石化现象","生词：抓情景功能相关词语和口语色彩词语","表达式：介绍功能—设置情景引出例句—让学生尝试运用"],"q":"(一) 抓住语言点 1. 语音……2. 生词……3. 表达式 口语教学要抓住有口语特点的表达式。……(1) 介绍功能……(2) 设置情景，引出例句……(3) 让学生尝试用特定表达式完成在某种情景下的功能。","w":"normal","e":["核心考点"]},{"t":"口语课语言点练习环节一般包括哪些练习类型？请举例说明。","y":"简答题","p":["替换练习（机械操练，持续时间不宜太长）","变换练习（肯定/否定、陈述/疑问、把字句/被字句、单句/复句）","完成句子（半机械半自由）","完成会话（根据上下文补足，先个人后两人）","可归纳公式帮助学生掌握"],"q":"语言点的练习一般包括替换练习、变换练习、完成句子、完成会话等类型。替换练习是一种机械操练，持续时间不宜太长。……变换练习可以有多种形式……","w":"normal","e":["核心考点"]},{"t":"口语教学中的导入环节通常______分钟左右，有______导入和______导入两种方式。","y":"填空题","p":["5","复习","话题"],"q":"导入是一个简短的环节，通常5分钟左右，为学习新课做好铺垫。(一) 复习导入 (二) 话题导入","w":"normal","e":["核心考点"]}]}]},{"id":"rumen-c17","t":"第十七章 阅读课教学","w":"high","s":[{"id":"rumen-c17-s01","t":"第一节 读者是如何阅读的？","w":"high","n":10,"k":[{"t":"阅读习得的简易模型","y":"名词解释","p":["阅读习得的简易模型（Simple View of Reading）（Hoover & Gough，1990）定义了阅读发展所需的两大认知基础：R（阅读）=LC（语言理解）×D（文字解码）","第一，该模型认为阅读发展的首要基础是语言理解，学习者在口语发展中建立起一种对语言结构有意识地觉察和操纵的能力，包括语音、语素和正字法意识三项子技能","第二，该模型认为阅读发展的重要基础是文字解码，即识字，被视为一种脱离了内文情境的阅读","弱读者通常表现出识字速度慢、遗忘速度快、识字量难以达到同年级标准等特征"],"q":"阅读习得的简易模型 (Simple View of Reading) (Hoover & Gough, 1990) 定义了阅读发展所需的两大认知基础：R(阅读) =LC (语言理解) ×D (文字解码)。","w":"high","e":["教材高频"]},{"t":"词频","y":"名词解释","p":["词频指的是词在社会上流通时出现的次数","这个意义上的词频是对全社会整体而言的，而每个人的心理词典中的词频又各不相同","心理学家认为对于读者来说，高频词就是新近看到过的词，反之就是低频词","一个低频词经过重复后就会产生高频词效应","词频与语境对读者的词汇识别起重要作用"],"q":"词频指的是词在社会上流通时出现的次数。……一个低频词经过重复后就会产生高频词效应。","w":"normal","e":["核心考点"]},{"t":"语境","y":"名词解释","p":["语境在阅读心理学研究中指的是上下文，包括目标词前后的词、句子以及整个篇章","心理学家通过实验发现，在目标词与语境一致的时候，语境能促进目标词的识别","上述的研究告诉我们，阅读教学中，词汇在合适的、不同的语境中反复地出现是让阅读者自然习得词汇的最佳途径"],"q":"语境在阅读心理学研究中指的是上下文，包括目标词前后的词、句子以及整个篇章。心理学家通过实验发现，在目标词与语境一致的时候，语境能促进目标词的识别。","w":"normal","e":["核心考点"]},{"t":"句法策略与语义策略","y":"名词解释","p":["读者运用句法策略和语义策略来进行句子理解","句法策略是指读者利用句子中提供的句法结构方面的经验性知识对句子进行加工，包括利用有结构意义的词的了解、根据语序、利用基本的句型知识（如'把'字句、'被'字句）来进行句子理解","语义策略是指读者利用句子中已知的语义信息预测后面部分的意义，并进一步做句子加工，可以依靠日常逻辑来进行预测，语境也在句子理解中起重要作用","在实际阅读中，上述两种策略无法截然分开，两者交互起作用"],"q":"读者运用句法策略和语义策略来进行句子理解。……在实际阅读中，上述两种策略是无法截然分开的，两者交互起作用。","w":"high","e":["教材高频"]},{"t":"宏观策略与微观策略（篇章理解）","y":"名词解释","p":["读者理解篇章的策略可分为宏观和微观两个层次","宏观策略包括结构策略、背景策略、文化策略和标题策略，是一种自上而下的加工策略","结构策略是读者通过文章结构来预测篇章内容的发展，如根据新闻'金字塔结构'来处理阅读","微观策略包括忽略细节、抓关键词和概括与推论，是一种自下而上的加工策略","忽略细节和抓关键词是同时进行的，熟练的读者能够迅速地找到文章的内容关键词进行重点阅读"],"q":"读者理解篇章的策略可分为宏观和微观两个层次。宏观策略包括结构策略、背景策略、文化策略和标题策略。……微观策略包括忽略细节、抓关键词和概括与推论。","w":"high","e":["教材高频"]},{"t":"图式","y":"名词解释","p":["图式是一种知识单位，是心理对客观世界的反映","常见的图式有：①事件图式，如去餐厅的图式（进餐厅、找桌子、坐下、叫服务员、要菜单⋯⋯结账）","②场景图式，每个不同的场景都有特定的道具，如图书馆","③角色图式，如'贤妻良母'的行为举止语言、外表性格","④范畴图式，如现实中桌子的样式何止千万，但我们总能指认出'桌子'"],"q":"图式是一种知识单位，是心理对客观世界的反映。常见的图式有：①事件图式……②场景图式……③角色图式……④范畴图式。","w":"high","e":["教材高频"]},{"t":"宏观策略是一种自下而上的加工策略，微观策略是一种自上而下的加工策略。","y":"判断题","p":["宏观策略（结构策略、背景策略、文化策略、标题策略）是一种自上而下的加工策略；微观策略（忽略细节、抓关键词、概括与推论）是一种自下而上的加工策略。"],"q":"宏观策略是一种自上而下的加工策略。……微观策略是一种自下而上的加工策略。","w":"high","e":["教材高频"]},{"t":"阅读习得的简易模型可表示为R（阅读）=LC（____）×D（____）。","y":"填空题","p":["R(阅读)=LC(语言理解)×D(文字解码)。"],"q":"阅读习得的简易模型 (Simple View of Reading) (Hoover & Gough, 1990) 定义了阅读发展所需的两大认知基础：R(阅读) =LC (语言理解) ×D (文字解码)。","w":"high","e":["教材高频"]},{"t":"以下不属于常见图式类型的是（　　）。A.事件图式　B.场景图式　C.角色图式　D.语音图式","y":"单项选择题","p":["常见的图式有：①事件图式；②场景图式；③角色图式；④范畴图式。"],"q":"常见的图式有：①事件图式……②场景图式……③角色图式……④范畴图式。","w":"normal","e":["核心考点"]},{"t":"以下不属于句法策略的是（　　）。A.利用有结构意义的词　B.根据语序理解　C.利用基本句型知识　D.依靠日常逻辑预测","y":"单项选择题","p":["句法策略包括利用有结构意义的词的了解、根据语序、利用基本的句型知识；依靠日常逻辑来对阅读内容进行预测属于语义策略。"],"q":"句法策略是指读者利用句子中提供的句法结构方面的经验性知识对句子进行加工。首先，读者能够利用对某些有结构意义的词的了解来进行句子理解……其次，读者也常常根据语序来进行句子理解……最后，读者还会利用基本的句型知识来进行阅读理解。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c17-s02","t":"第二节 怎么上阅读课？","w":"high","n":11,"k":[{"t":"通读、查读、略读、眺读","y":"名词解释","p":["通读要求学生通过阅读，既能抓住文章的中心意思，又能掌握比较重要的细节","既能明确文章的脉络，又能理解具体的描述","最后，对文体风格和作者的态度也有所了解","查读是寻找特定细节信息的阅读","略读是浏览大意式的阅读"],"q":"所谓通读，就是要求学生通过阅读，既能抓住文章的中心意思，又能掌握比较重要的细节……这些阅读策略包括：寻找特定细节信息的查读，浏览大意式的略读，为进一步阅读打前站的眺读。","w":"high","e":["教材高频"]},{"t":"阅读课的教学目标是什么？","y":"简答题","p":["增加学生的词汇量（促进伴随性词汇习得）","培养学生的阅读技能","提高学生的阅读速度"],"q":"阅读课的教学目标主要包括：第一，增加学生的词汇量。通过大量阅读，促进学生的伴随性词汇习得。第二，培养学生的阅读技能。……第三，提高学生的阅读速度。","w":"hi
