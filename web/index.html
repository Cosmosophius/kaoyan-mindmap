","团长：受事/结果"],"q":"这四例都属于语义组合歧义中的“语义角色不同”：（1）“这个人谁都不认识”中“这个人”既可能是施事，也可能是受事。（2）“开刀的是他的父亲”中“他的父亲”既可能是施事（医生），也可能是受事（病人）。（3）“汽车运走了”中“汽车”既可能是受事，也可能是工具。（4）“提拔团长”中“团长”既可能是受事，也可能是结果。分化方法可","w":"high","e":["教材高频"]},{"t":"简述消除歧义的手段。","y":"简答题","p":["借助语音差异(轻声、重音、停顿)","改换词语或改变句式","借助语境"],"q":"在言语交际中，真正能产生歧义的句子并不多见，这是因为我们可以运用一定的手段、利用一定的条件来消除歧义。消除歧义的手段大致有以下几种：（1）借助语音差异：A.轻声，如“他爬过山没有?”中“过”读去声是趋向动词，读轻声是动态助词；B.重音，如“'他最喜欢游泳”与“他最喜欢'游泳”语义指向不同；C.停顿，停顿可以显示结构层次","w":"high","e":["教材高频"]},{"t":"“鸡不吃了”有歧义，请说明如何借助语境消除其歧义。","y":"分析题","p":["“鸡不吃了”有歧义","b借助下文“钻到鸡窝里”消除，指鸡不吃食","c借助下文“我吃饱了”消除，指人不吃鸡","利用上下文语义制约消除歧义"],"q":"“鸡不吃了”是有歧义的句子，可以借助语境来消除：(1)a.鸡不吃了。(有歧义)b.鸡不吃了，钻到鸡窝里去了。(无歧义，指鸡不吃食了)c.鸡不吃了，我已经吃饱了。(无歧义，指人不吃鸡了)。这说明利用上下文的语义制约能够消除有歧义的句子。此外，还可以利用交际时具体语境的制约，包括说话时具体的对象、场景、身份等来消除歧义。","w":"high","e":["教材高频"]},{"t":"【名词解释】框式结构","y":"名词解释","p":["前后有两个不连贯的词语相互照应、相互依存","形成框架式结构","具有特殊的语法意义和特定的语用功能"],"q":"典型的框式结构，指前后有两个不连贯的词语相互照应，相互依存，形成一个框架式结构，具有特殊的语法意义和特定的语用功能。如果去除其中一个(主要是后面一个)，该结构便会散架。","w":"high","e":["教材高频"]},{"t":"简述汉语框式结构的三个主要特点。","y":"简答题","p":["由不变成分和可变成分组成","具有整体性的特殊语法意义(语义增值)","跟语境结合紧密，表示特定语用功能"],"q":"汉语框式结构的特点主要有三点：（1）它们都由不变成分以及可变成分两部分组成。不变成分构成“框架”，起到定位以及标记作用，识别率特别高；可变成分是可供选择、替换的“变项”，因此整个框式结构具有一定的生成能力。（2）具有整体性的特殊语法意义。框式结构的结构意义，不是组合成分语义的简单相加，而往往产生出新的意义，这一新义是该","w":"high","e":["教材高频"]},{"t":"简述框式结构按照结构形式特点划分的四个类型。","y":"简答题","p":["双项双框式(单体封闭式/前后照应式)","单项双框式(插入式)","双项单框式","单项单框式"],"q":"框式结构按照它们的结构形式特点可以分为以下四个类型：（1）双项双框式，也就是单体封闭式。有两个前后可变项，不变项也有前项和后项两个，例如：为A所B、连A带B、又A又B、一A不B、说A就A等；还有一种是前后照应式，例如：A也好，不A也好；与其A，不如B；宁可A，也要B；A是A，B是B。（2）单项双框式，也就是插入式。一个","w":"normal","e":["核心考点"]},{"t":"试论述框式结构的语法意义(结构义不是成分义简单相加)，并结合“没A没B”加以分析。","y":"论述题","p":["结构义不等于成分义之和，是语义增值","同义/近义AB：加合否定，凸显程度高","反义名词AB：派生否定，表示不分AB","反义形容词AB：深层否定，暗含责怪义"],"q":"框式结构往往言简意赅，形式相对简略，语义比较特殊。框式结构的结构义，不等于各个部分成分语义之和。换言之，框式结构的结构义是结构整体拥有的，是语义增值的结果。以“没A没B”为例，其语义不等于“没A”加上“没B”，不是简单的并列关系，不是一般的双重否定，而是格式赋予它新的含义，起到强调凸显的作用，显示了说话人的主观意图，语","w":"normal","e":["核心考点"]},{"t":"“他在车厢上贴标语”产生歧义的原因是（　　）。","y":"单项选择题","p":["语义指向不同","状语“在车厢上”指向“他”或“贴标语”"],"q":"D","w":"high","e":["教材高频"]},{"t":"判断：框式结构的结构义等于各个部分成分语义之和。（　）","y":"判断题","p":["框式结构结构义是语义增值","不等于成分语义之和"],"q":"错误。框式结构的结构义，不等于各个部分成分语义之和。框式结构的结构义是结构整体拥有的，是语义增值的结果。比如“没A没B”的语义不等于“没A”加上“没B”，而是格式赋予它新的含义，起到强调凸显的作用。","w":"high","e":["教材高频"]}]},{"id":"xdhy_down-c01-s10","t":"第十节 认知解释与动态变化","w":"high","n":16,"k":[{"t":"【名词解释】原型范畴","y":"名词解释","p":["具有该类范畴典型属性和特点的成员的集合","原型与非原型之间逐步过渡","形成一个连续统"],"q":"所谓原型范畴是指具有该类范畴典型属性和特点的成员的集合。在原型和非原型之间没有不可逾越的鸿沟，从最典型成员到最不典型成员，按照典型程度的高低逐步过渡，从而形成一个连续统。","w":"high","e":["教材高频"]},{"t":"试运用原型范畴理论分析汉语中名词和动词的划分问题。","y":"论述题","p":["名词、动词存在难以归类的中间成员","树立原型范畴，建立核心成员集合","名词动态性程度的连续统：静态名词到动词","采取柔性处理而非刚性处理"],"q":"运用原型范畴理论可以较好地处理汉语名词和动词的划分问题。在汉语里，名词和动词的界限似乎比较清楚，帽子、书包、树木、房子等都是名词，走、吃、打扫、敲打等都是动词。但是实际上还有一些词语，很难归类，例如：(1)学习英语/学习园地/理论学习(2)演出话剧/演出人员/文艺演出。“学习、演出”等既可以带宾语，也可以修饰名词做定语","w":"high","e":["教材高频"]},{"t":"【名词解释】象似性原则","y":"名词解释","p":["两个事物之间外形、属性、特点相似","借以认识隐蔽、未知事物","转喻和隐喻两种方法"],"q":"象似性是指两个事物之间，或者某部分外形，或者某种属性，或者某种特点比较相似，我们就把这种联系称之为象似性关系。借助象似性原则，我们主要采用了转喻和隐喻的方法。","w":"normal","e":["核心考点"]},{"t":"简述转喻和隐喻的认知机制，并各举两例。","y":"简答题","p":["转喻：依赖临近性与关联性，同一认知域转指","隐喻：用具体熟悉概念隐喻抽象陌生概念","空间隐喻时间"],"q":"借助于象似性原则，我们主要采用了转喻和隐喻的方法。（1）转喻：依赖于A和B的临近性与关联性，把A看作相关的B，属于同一个认知域的转指，用局部指称整体，用来源指称结果等。比如一个国家的首都往往是该国的政治中心、经济中心、文化中心，也是政府的所在地，所以用首都来替代整个国家是个惯例，好比“国际上非常重视北京的声音”，其中的","w":"high","e":["教材高频"]},{"t":"【名词解释】图形与背景","y":"名词解释","p":["把直接对象作为图形","把另一事物作为背景","图形又叫目的物，背景又叫参照物"],"q":"我们感知两个事物之间的空间关系时，往往把一个事物A作为直接对象“图形”，而把另外一个事物B当作“背景”。图形又叫“目的物”，背景又叫“参照物”。","w":"normal","e":["核心考点"]},{"t":"运用图形与背景的认知理论解释汉语偏正短语中定语、状语总在前、中心语总在后的道理。","y":"分析题","p":["图形凸显、可移动、易辨认；背景不凸显、较大、静态","汉语存在背景先于图形的趋势","偏正短语排列是“背景——图形”，故定语状语在前、中心语在后"],"q":"图形与背景是认知语法的重要概念：感知两个事物之间的空间关系时，把直接对象作为“图形”，另一事物作“背景”。图形是凸显的、较小的、居于中心位置的、可移动的、容易引起注意的；背景是不凸显的、较大的、居于边缘位置的、静态的、不容易引起注意的。汉语的结构组合实际上存在着背景往往先于图形出现的趋势。这也就是为什么偏正短语中定语、","w":"high","e":["教材高频"]},{"t":"【名词解释】移位","y":"名词解释","p":["改变句子常规语序","句法结构不变","语义关系基本不变"],"q":"移位是指改变句子常规语序，但句法结构不变，语义关系也基本不变的现象。口语交际时为了表情达意的需要，或由于其他原因，常常改变常规语序。","w":"high","e":["教材高频"]},{"t":"简述口语里移位句的特点。","y":"简答题","p":["被移位的两部分可以还原，还原后意思不变","语义重心在前置部分，后置部分轻读、带注释补充性","句末语气词附加在前置部分之后"],"q":"口语里的移位句具有下列特点：第一，移位句中被移位的两个部分可以还原，还原以后句子的意思不变。例如：喜欢吗，你?→你喜欢吗?他来了吧，大概。→他大概来了吧。第二，移位句的语义重心在前置部分上，后置部分不会成为强调的对象，只是带有注释或补充的性质。因此，语句的重音就在前置部分上，后置部分轻读；书面上两部分之间一般用逗号隔开","w":"high","e":["教材高频"]},{"t":"【名词解释】省略","y":"名词解释","p":["一定语境中省去一些成分","由上下文或语境制约造成","所省略成分确定无疑、可补回","补出后语义基本不变"],"q":"人们在运用语言时为了达到简洁的目的，在一定语境中常常省去一些成分，这就叫省略。省略必须符合三个条件：第一，是言语交际中由上下文或语境条件制约而造成的；第二，所省略的成分是确定无疑的，可以补回来的；第三，补出省略成分以后，句子的语义基本不变。","w":"high","e":["教材高频"]},{"t":"简述省略与隐含、重合的区别，并说明省略句与非主谓句的关系。","y":"简答题","p":["省略可确定补出且只有一种方式","隐含、重合无法或不必补出","省略是动态现象，非主谓句是静态结构类型","二者关系交叉","判断省略需结合语境"],"q":"（1）省略的成分是可以肯定地补出来，并且只能有一种补出方式，省略要跟隐含、重合区别开来，因为后两者虽然在语义上可以体会出来，但是在实际语言中无法补出来，或不必补出来。例如“他要求放他走”中“放”的前面隐含了“别人”，但“别人”根本就不必补出；“这地方我去得，你去不得”中“去得”是“去得得”两个“得”重合了，实际上也补不","w":"high","e":["教材高频"]},{"t":"简述省略的类型(按语言环境)和省略的成分。","y":"简答题","p":["承前省","蒙后省","对话省","自述省","省略的成分：主语/谓语/宾语/修饰语"],"q":"根据省略的语言环境，可以把省略分为四类：（1）承前省。被省略的词语已在上文出现过。例如：老渔民长得高大结实，( )留着花白胡子。（2）蒙后省。被省略的词语可以在下文中找到。例如：( )写完信，他就上床休息了。（3）对话省。在对话中，一些指称性的代词经常会省略。例如：“( )到哪儿去?”“( )到教室去。”（4）自述省。","w":"normal","e":["核心考点"]},{"t":"【名词解释】插说","y":"名词解释","p":["临时打断原来句子结构","插入内容对前文说明、补充或改正"],"q":"在说话过程中，临时想起了什么，而有意打断原来句子的结构，插入某些内容，对前文予以说明、补充或改正，这就是插说。","w":"normal","e":["核心考点"]},{"t":"简述插说的五种类型，并说明插说与插入语的区别。","y":"简答题","p":["说明型","补充型","逻辑型","评述型","修正型","插入语是固定特殊成分，插说是动态变化现象"],"q":"插说大体上有五种类型：（1）说明型，对前文某个词语进行必要的注释或说明。例如：他————钱先生————呆呆地看着。（2）补充型，对前文从不同的角度进行补充。例如：公立学校————或者应当说，中国人办的学校————的前途怎么样，谁也不敢说。（3）逻辑型，对前文从逻辑语义方面进行限制，包括条件、递进、选择、转折等。例如：再","w":"normal","e":["核心考点"]},{"t":"【名词解释】追补","y":"名词解释","p":["话说出来后追加补充","因为不够完整、准确或有错误","三种类型：补充型、注释型、修正型"],"q":"当话说出来以后，才发现不够完整、不够准确，甚至有错误，说话人马上在话语之后追加补充，这就叫追补。追补主要有三种类型：补充型、注释型、修正型。","w":"normal","e":["核心考点"]},{"t":"认知的三个原则与方法是＿＿＿＿、＿＿＿＿、＿＿＿＿。","y":"填空题","p":["原型范畴","象似性原则","图形与背景"],"q":"原型范畴；象似性原则；图形与背景","w":"high","e":["教材高频"]},{"t":"“把利好的股市叫作‘牛市’”运用的认知方式是（　　）。","y":"单项选择题","p":["隐喻","用具体概念隐喻抽象概念"],"q":"B","w":"normal","e":["核心考点"]}]},{"id":"xdhy_down-c01-s11","t":"第十一节 复句类型","w":"high","n":22,"k":[{"t":"【名词解释】复句","y":"名词解释","p":["两个或两个以上分句构成","意义上密切相关","结构上互不包含","表示一定的逻辑语义关系"],"q":"由两个或两个以上在意义上密切相关，结构上互不包含的分句所构成的语言单位，就叫复句。复句内部由两个或两个以上的分句构成，并且表示一定的逻辑语义关系。","w":"high","e":["教材高频"]},{"t":"简述复句和单句的区别。","y":"简答题","p":["句法结构上互不包含","关联词语是重要的语法标志","停顿是分句与分句之间的重要形式标志"],"q":"分句是一种单句形式，分句的构造与一般单句的构造基本上是一致的，只是分句没有完全独立的语调，不能表达一个完整的意思。区别单句和复句可以从三个方面进行：（1）句法结构上互不包含。主谓短语是最适合充当分句的，但要特别注意并不是所有的主谓短语都是句子，它如果处于被别的句法结构包含的地位，就不是句子了。例如“谁去都一样”“他记得","w":"high","e":["教材高频"]},{"t":"【名词解释】意合法","y":"名词解释","p":["不用任何关联词语","依靠语序","依靠前后分句的语义制约"],"q":"有一些复句不用任何关联词语，完全依靠语序以及前后分句的语义制约构成，这就叫“意合法”。","w":"normal","e":["核心考点"]},{"t":"简述复句分为四个大类、十个小类的依据和具体类型。","y":"简答题","p":["客观世界：时间(顺承)、空间(并列)","主观世界比较关系：平等、轻重","主观世界事理关系：顺理、违理","四大类十小类：平等、轻重、顺理、违理"],"q":"客观世界离不开“时间”与“空间”两大基本要素，观察客观世界里各种事物、现象或事件之间的联系也离不开这两大要素。在主观世界里，一个现象或一个事件作为认知的出发点，与另一个现象或事件形成一定的语义联系，主要有两类：第一，比较关系，即两者或者是“平等”(均衡)，或者是“轻重”(主次)的关系；第二，事理关系，即符合事理的“顺理","w":"high","e":["教材高频"]},{"t":"【名词解释】并列复句","y":"名词解释","p":["先提出参照物","后续分句提出并存、平行或对立的事情","分句之间是“参事——并事”关系"],"q":"并列复句的前行分句先提出一件事情作为“参照物”，后续分句则相应提出在意义上并存、平行或对立的事情，全句同时说明或描写几件事情或同一事情的几个方面。分句之间是“参事——并事”关系。","w":"high","e":["教材高频"]},{"t":"简述选择复句的两大类型及各自的小类。","y":"简答题","p":["取舍未定：取舍任选式(或者/要么)、取舍必选式(不是……就是)","取舍已定：先取后舍式(宁可……也不)、先舍后取式(与其……不如)"],"q":"选择复句的几个分句分别说出几个待选项，并表示可以从中进行选择。分句与分句之间是“选事1——选事2”的关系。选择复句实际上可以分为“取舍未定”和“取舍已定”两大类型：（1）取舍未定，前后项关系是平等的。又可以分为两种：A.取舍任选式，几个分句说出若干待选项，但没有明确的取舍倾向，分句之间是“任取——任舍”关系，常用“或者","w":"high","e":["教材高频"]},{"t":"【名词解释】递进复句","y":"名词解释","p":["前行分句提出情况","后续分句更推进一层","分句之间是“基事——递事”关系"],"q":"递进复句的前行分句提出一个情况，后续分句以此为基准，在数量、程度、范围、时间、功能或者其他方面更推进一层。分句之间是“基事——递事”关系。","w":"high","e":["教材高频"]},{"t":"简述递进复句的四个特殊类型，并各举一例。","y":"简答题","p":["多重递进：不但……而且……甚至","逆向递进：不但不……而且不(没)","反向递进：不但不……反而","让步递进：尚且……何况"],"q":"递进复句有几个特殊类型：（1）多重递进，即在第一层递进的基础上，把第二分句继续作为基事，后面再出现进一步的递进，即递进再递进，常用“不但……，而且……，甚至/还……”框架表示。例如：来这家大型食品超市购物的不仅有当地的家庭主妇，而且有附近街区的居民，甚至京津地区也有驱车前来采购的。（2）逆向递进，基事分句和递事分句都是","w":"high","e":["教材高频"]},{"t":"【名词解释】补充复句","y":"名词解释","p":["前行分句表示主要意思","后续分句对前者追补或解说","分句之间是“主事——补事”关系"],"q":"补充复句的前行分句表示一个主要意思，后续分句对前者进行追补或解说。分句之间是“主事——补事”关系。","w":"normal","e":["核心考点"]},{"t":"【名词解释】连贯复句","y":"名词解释","p":["前行分句先陈述一种情况","后续分句陈述接着发生的另一种情况","分句之间是“先事——后事”关系"],"q":"连贯复句的前行分句首先陈述一种情况，后续分句随后陈述接着发生的另一种情况。分句之间是“先事——后事”关系。","w":"high","e":["教材高频"]},{"t":"试比较并列复句和连贯复句的异同。","y":"简答题","p":["并列是齐头并进、雁行式，次序可互换","连贯是相继进行、鱼贯式，一般不能换位","并列着眼于空间，连贯着眼于时间"],"q":"并列复句是齐头并进，雁行式，有时候次序可以互换而意义不变；连贯复句是相继进行，鱼贯式，由于时间上前后分明，一般不能换位。一个是横的并列，一个是纵的发展；一个着眼于空间，一个着眼于时间。从语义关系上说，并列复句分句之间是“参事——并事”关系，连贯复句分句之间是“先事——后事”关系。","w":"high","e":["教材高频"]},{"t":"【名词解释】因果复句","y":"名词解释","p":["前行分句说出原因","后续分句说出结果","分句之间是“原因——结果”关系"],"q":"因果复句的前行分句说出原因，后续分句说出由此而产生的结果。分句之间是“原因——结果”关系。因果复句分为说明性因果和推论性因果两类。","w":"high","e":["教材高频"]},{"t":"请区分下列复句是说明性因果还是推论性因果：(1)这一阵子因为老是停电，所以蜡烛、煤油灯竟然畅销起来。(2)既然主场客场都输了，就得承认我们确实技不如人。","y":"分析题","p":["(1)说明性因果，“因为……所以”，引出必然结果","(2)推论性因果，“既然……就”，推断应该发生的结果"],"q":"（1）“这一阵子因为老是停电，所以蜡烛、煤油灯竟然畅销起来”是说明性因果。前句用已知的事实指出这是产生后句事实的原因，后句则引出某种必然的结果，常用关联词语是“因为……，所以……”。（2）“既然主场客场都输了，就得承认我们确实技不如人”是推论性因果。前行分句说出一个已经发生的情况，后续分句以此为前提，推断出一个应该发生","w":"high","e":["教材高频"]},{"t":"【名词解释】条件复句","y":"名词解释","p":["前行分句显示某种条件","后续分句推导出可能的结果","分句之间是“条件——结果”关系"],"q":"条件复句的前行分句显示某种条件，后续分句从该条件推导出可能的结果。分句之间是“条件——结果”关系。条件复句有假设条件句、特定条件句、周遍条件句三种类型。","w":"high","e":["教材高频"]},{"t":"简述特定条件句的三种类型及各自的关联框架。","y":"简答题","p":["充足条件句：只要……就","必要条件句：只有……才、除非……否则……不","周遍条件句：无论/不管……也/都"],"q":"特定条件句有三类：（1）充足条件句，代表性框架是“只要……，就……”，前行分句表示充足条件，后续分句表示一旦满足了这个条件，就必然产生后续分句的结果，但并不排斥其他条件，分句之间是“充足条件——结果”关系。（2）必要条件句，代表性框架是“只有……，才……”，前行分句表示必要条件，必须满足这一条件，才会产生后续分句的结果","w":"high","e":["教材高频"]},{"t":"【名词解释】目的复句","y":"名词解释","p":["一个分句表示目的","另一个分句表示达到目的的行为事件","分句之间是“目的——行为”关系"],"q":"目的复句中一个分句表示目的，另一个分句表示为达到这一目的而发生的行为事件。分句之间是“目的——行为”关系。","w":"normal","e":["核心考点"]},{"t":"【名词解释】转折复句","y":"名词解释","p":["前行分句承认某种客观事实作为让步","后续分句的结果违背常理","分句之间是“事实——转折”关系"],"q":"转折复句的前行分句先姑且承认某种客观事实作为让步，后续分句提出的结果却是违背常理的，与前一分句形成转折语义。两个分句之间是“事实——转折”关系。","w":"high","e":["教材高频"]},{"t":"【名词解释】让步复句","y":"名词解释","p":["前行分句提出假设的事实并姑且承认","后续分句结果违背常理","分句之间是“假设——转折”关系"],"q":"让步复句的前行分句先提出一种假设的事实，并姑且退让一步姑且承认这个假设的真实性，后续分句提出的结果却是违背常理的，与前一分句形成转折语义。分句之间是“假设——转折”关系。常用的关联词语是“即使……，也……”。","w":"high","e":["教材高频"]},{"t":"试比较让步复句和转折复句的异同。","y":"简答题","p":["相同点：语义都转到相反相对方面，是反预期、有转折意","不同点：让步复句前句是假设的，转折复句前句是真实的","让步复句“假设——转折”，转折复句“事实——转折”"],"q":"让步复句和转折复句的相同点在于：后句跟前句相比，语义上都转到它的相反相对方面去了，是反预期的，都有转折的意思。两者不同点在于：让步复句的前句是假设的，转折复句的前句是真实的。让步复句分句之间是“假设——转折”关系，常用关联词语是“即使……，也……”；转折复句分句之间是“事实——转折”关系，常用关联词语是“虽然……，但是","w":"high","e":["教材高频"]},{"t":"“无论/不管……，也/都……”是（　　）的代表性框架。","y":"单项选择题","p":["周遍条件句","无论/不管……也/都……"],"q":"C","w":"high","e":["教材高频"]},{"t":"下列属于“违理”大类复句的是（　　）。A.因果复句 B.转折复句 C.条件复句 D.递进复句","y":"单项选择题","p":["违理大类含转折复句和让步复句","因果、条件属顺理","递进属轻重"],"q":"B。“违理”大类复句主要包括转折复句、让步复句。“违理”即前后分句语义违背常理。","w":"high","e":["教材高频"]},{"t":"指出下列复句的类型：(1)这些手编工艺品一些用来做礼品送人，一些拿到宫外的市场上换取日用品。(2)大别山区不但矿产很丰富，而且自然景色很美。(3)既然主场客场都输了，就得承认我们确实技不如人。(4)尚春兰先生虽然不再登台演出了，但是早起练功吊嗓子的习惯没有改。","y":"分析题","p":["(1)并列复句","(2)递进复句","(3)推论性因果复句","(4)转折复句"],"q":"（1）“这些手编工艺品一些用来做礼品送人，一些拿到宫外的市场上换取日用品”是并列复句，分句之间是“参事——并事”关系，表示相关的几种情况并存。（2）“大别山区不但矿产很丰富，而且自然景色很美”是递进复句，分句之间是“基事——递事”关系，典型格式是“不但……而且……”。（3）“既然主场客场都输了，就得承认我们确实技不如人","w":"high","e":["教材高频"]}]},{"id":"xdhy_down-c01-s12","t":"第十二节 多重复句与紧缩复句","w":"high","n":12,"k":[{"t":"【名词解释】多重复句","y":"名词解释","p":["三个或三个以上分句","两个以上层次上组合","有几个层次就叫几重复句"],"q":"三个或三个以上的分句在两个以上的层次上组合起来的复句叫做多重复句。复句有几个层次，就叫几重复句，比如二重复句、三重复句、四重复句等。","w":"high","e":["教材高频"]},{"t":"【名词解释】划线分析法","y":"名词解释","p":["把层次分析法运用到多重复句分析","标出层次并标明关系"],"q":"划线分析法是把层次分析法的原则和方法运用到多重复句的分析上，标出层次并标明关系的分析方法。复句分析的目标有两个：一是确定分句之间的关系，二是划分复句内部的层次。","w":"high","e":["教材高频"]},{"t":"简述多重复句分析的操作程序(四个步骤)。","y":"简答题","p":["确定是单句还是复句、简单复句还是多重复句","确定分句数量，用竖线划开","确定分句两两之间的关系，标出基本复句类型","确定复句内部层次，竖线数表示层次"],"q":"多重复句分析的具体操作程序可以分为四步：第一，确定是单句还是复句，如果是复句，再确定是简单复句，还是多重复句；如果是多重复句，再分析它的层次和关系。第二，确定这个多重复句有几个分句构成，在分句之间用一根竖线划开，其关键是搞清楚单句与复句的界限，不要把单句内部的停顿误判为分句之间的停顿。第三，根据关联词语、语序以及分句之","w":"high","e":["教材高频"]},{"t":"简述分析多重复句的辅助方法。","y":"简答题","p":["看切分后两部分语义是否相对完整","用换位法看分句关系是否合理","借助句中标点符号(分号是最大层次分界处)","多重复句也有多切分结构"],"q":"分析多重复句的辅助方法主要有三种：（1）看切分以后的两部分的语义是否相对完整。例如“孔乙己是这样的使人快活(A)，可是没有他(B)，别人也这么过(C)”，如果按照“A∥B|C”切分，“孔乙己是这样的使人快活，可是没有他”根本就不成话，所以这种切分错。（2）运用换位的方法看分句之间的关系是否合理。例如“封锁虽严(A)，冒","w":"normal","e":["核心考点"]},{"t":"用划线分析法分析下列多重复句：(1)因为李洼乡资源贫乏(A)，交通也很闭塞(B)，所以这么多年总是摘不掉贫困乡镇的帽子(C)。(2)高尔基在自学的过程中，既没有名师指点(A)，更没有资料可供查阅(B)，碰到的困难当然就比寻常人更多(C)，但是疑难总是吓不倒他的(D)。","y":"分析题","p":["(1)A∥B(并列)|C(因果)","(2)A ⅢB(递进)∥C(因果)|D(转折)","注意单句内部停顿不要误判为分句停顿"],"q":"（1）“因为李洼乡资源贫乏(A)，交通也很闭塞(B)，所以这么多年总是摘不掉贫困乡镇的帽子(C)。”A与B是并列关系，B与C是因果关系，是第一层次(用一条竖线)，A与B是第二层次(用两条竖线)。其层次组合是：“A∥B|C”，并列|因果。（2）“高尔基在自学的过程中，既没有名师指点(A)，更没有资料可供查阅(B)，碰到的","w":"high","e":["教材高频"]},{"t":"【名词解释】紧缩复句","y":"名词解释","p":["分句间语音停顿取消","省略了一些关联词语","简称紧缩句"],"q":"一般的复句在分句与分句之间的语音停顿取消了，并且省略了一些关联词语，那就变成了紧缩复句，简称“紧缩句”。“紧缩”有两层意思：“紧”是紧凑，取消了语音停顿；“缩”是简缩，去掉了一些关联词语。","w":"high","e":["教材高频"]},{"t":"简述紧缩复句的常见固定格式及其所表示的关系。","y":"简答题","p":["不……不……：假设","不……就……：假设","不……也……：让步","再……也……：让步","一……就……：承接/条件","非……不/才……：条件","越……越……：条件(倚变)"],"q":"紧缩句常用成对、成套的关联词语(副词)构成一些定型的框架，常见的比如：（1）“不……不……”，表示假设关系，相当于“如果不……就不……”。例如：钟不敲不响。（2）“不……就……”，表示假设关系，相当于“要是不……就……”。例如：他不想去就别勉强他。（3）“不……也……”，表示让步关系，相当于“即使不……也……”。例如：","w":"high","e":["教材高频"]},{"t":"【名词解释】“一……就……”格式","y":"名词解释","p":["紧缩复句常见固定格式","表示承接关系","表示条件关系"],"q":"“一……就……”是紧缩复句的常见固定格式，有两种作用：一是表示承接关系，例如“老王一吃过晚饭就散步去了”；二是表示条件关系，相当于“只要……就……”，例如“他一来就没好事”。","w":"normal","e":["核心考点"]},{"t":"分析下列紧缩句中前后主语的出现情况：(1)你走你就走。(2)他一不高兴就发脾气。(3)越干他越来劲。(4)多做练习才能提高成绩。(5)你去我也不去。(6)一响我吓一跳。","y":"分析题","p":["(1)(5)前后主语都出现","(2)主语相同只出现前主语","(3)(6)只出现后主语","(4)主语相同都未出现"],"q":"紧缩句的主语可以相同，也可以不同；可以全部出现，可以部分出现，也可以全不出现：（1）“你走你就走”前后主语相同，都出现。（2）“他一不高兴就发脾气”前后主语相同，只出现前一主语。（3）“越干他越来劲”前后主语相同，只出现后一主语。（4）“多做练习才能提高成绩”前后主语相同，都未出现。（5）“你去我也不去”前后主语不同，","w":"normal","e":["核心考点"]},{"t":"“钟不敲不响。”属于紧缩复句的固定格式（　　）。","y":"单项选择题","p":["“不……不……”格式","表示假设关系"],"q":"A","w":"normal","e":["核心考点"]},{"t":"判断：在并列、连贯、选择等复句中，分句数量的增加只会延伸复句的长度，不会增加复句的层次。（　）","y":"判断题","p":["并列/连贯/选择复句增加分句不增层次","因果/转折/让步/条件复句增加分句也增层次"],"q":"正确。分句的数量，同复句的层次数量有两种关系：第一，没有必然的联系，在并列、连贯、选择等复句中，分句数量的增加只会延伸复句的长度，不会增加复句的层次；第二，在因果、转折、让步、条件等复句中，分句数量的增加，不仅延伸了复句的长度，也增加了复句的层次。","w":"high","e":["教材高频"]},{"t":"简述多重复句分析的基本原则和划线分析法与层次分析法的关系。","y":"简答题","p":["基本原则：形式和意义相结合","意义包括内容、关系意义、主观意义、语境意义","形式包括关联词语、句序","原理与层次分析法一致"],"q":"多重复句分析的基本原则是形式和意义相结合。意义包括复句表述的内容、分句之间的关系意义、说话人的主观意义、语境意义等，形式包括关联词语、句序等。分析多重复句可以先从形式上入手，根据形式确定复句的类型与层次，然后从意义方面加以验证；也可先从意义方面入手，根据逻辑语义关系确定复句的类型，进而决定层次，然后再从形式方面加以验证","w":"high","e":["教材高频"]}]}]},{"id":"xdhy_down-c02","t":"第五章 语用","w":"high","s":[{"id":"xdhy_down-c02-s01","t":"第一节 现代汉语语用概述","w":"high","n":17,"k":[{"t":"名词解释：语用学","y":"名词解释","p":["语用学探讨语言符号及其使用者与语境三者之间的关系","研究不同语境中话语交际时表达和理解语言的基本规律","语用即语言使用者在不同语境中话语交际的实际运用，包括表达和理解"],"q":"语用学探讨的是语言符号及其使用者与语境三者之间的关系；研究人们在不同语境中话语交际时表达和理解语言的基本规律，就是语用学。","w":"high","e":["2019 真题","2022 真题"]},{"t":"名词解释：语用分析","y":"名词解释","p":["对语言使用者在不同语境中话语意义准确地表达和理解的基本规律进行分析","旨在揭示各种语言符号和非语言因素如何被调动以达到交际目的"],"q":"对语言使用者在不同语境中话语意义准确地表达和理解的基本规律进行分析，就是语用分析。","w":"high","e":["2021 真题"]},{"t":"名词解释：语境","y":"名词解释","p":["语境是人们运用语言进行言语交际的具体环境","语境是语用分析中极为重要的因素","语境分为语内环境和语外环境"],"q":"语境是人们运用语言进行言语交际的具体环境。语境是语用分析中极为重要的因素。","w":"high","e":["2018 真题","2020 真题","2023 真题"]},{"t":"名词解释：语内环境","y":"名词解释","p":["语内环境是语言符号所构成的环境","即前言后语(口语)或上下文(书面语)","包括词语语境、句子语境、语篇语境"],"q":"语内环境指的是语言符号所构成的环境，即通常说的前言后语(口语)或上下文(书面语)，包括词语语境、句子语境、语篇语境。","w":"high","e":["2019 真题"]},{"t":"名词解释：语外环境","y":"名词解释","p":["语外环境是语言交际中的非语言因素","包括现场、情境、背景知识三个方面"],"q":"语外环境指的是语言交际中的非语言因素，主要有三个方面：现场、情境、背景知识。","w":"high","e":["2020 真题","2022 真题"]},{"t":"语用的四个基本要素是：发话者、受话者、______和______。","y":"填空题","p":["语用由发话者、受话者、话语内容、语境四个基本要素构成"],"q":"话语内容；语境","w":"high","e":["2018 真题","2021 真题"]},{"t":"发话者只包括口语说话者，不包括书面语作者。","y":"判断题","p":["发话者指语言信息的发出者","包括口语说话者和书面语作者"],"q":"错误。发话者指语言信息的发出者，包括口语说话者和书面语作者。","w":"normal","e":["核心考点"]},{"t":"下列不属于语用的基本要素的是（　　）","y":"单项选择题","p":["语用的四个基本要素是发话者、受话者、话语内容、语境"],"q":"D。语用的四个基本要素是发话者、受话者、话语内容、语境，辞格不属于语用基本要素。","w":"normal","e":["核心考点"]},{"t":"名词解释：话语","y":"名词解释","p":["发话者用语音表达的口语或文字表达的书面语的具体内容叫作话语","话语也叫超句体","话语以传递信息为主要目的，有激发型、传授型、宣泄型等类型"],"q":"发话者用语音表达的口语或文字表达的书面语的具体内容叫作“话语”，也叫“超句体”。","w":"normal","e":["核心考点"]},{"t":"简述语境对话语交际的作用。","y":"简答题","p":["从已知信息到未知信息：发话者以受话者已有信息为出发点，再传达未知信息","语境优先：语境能提供的信息优先于话语本身的信息，可从语境获得的信息原则上可不表现为语言形式"],"q":"语境对话语交际的作用主要有：第一，从已知信息到未知信息。发话者表达时必须选择受话者已有信息作为出发点，然后再传达受话者的未知信息。第二，语境优先。语境能够提供的信息要优先于话语本身的信息，凡受话者可以从语境中获得的信息，原则上都可以不表现为语言形式。","w":"high","e":["2019 真题","2022 真题"]},{"t":"什么是语内的语境知识？为什么说共同的语境知识是表达和理解的重要基础？请举例论述。","y":"论述题","p":["语言交际要达到最佳效果，最关键的条件是发话方和受话方必须拥有相同的语境知识","共同的语境知识有的已贮存在记忆中，有的可以临时获得","交际各方必须要有共同语境知识作为谈话的出发点或基础","举例：缺少共同球赛语境信息则交际无法进行；熟悉身份话题才能理解“你呢?”"],"q":"语言交际要达到最佳效果，最关键的条件是发话方和受话方必须拥有相同的语境知识，这是表达和理解的重要基础。这些共同的语境知识，有的已经贮存在记忆中，有的可以临时获得，不管如何，交际各方必须要有共同语境知识作为谈话的出发点或基础。例如甲说“昨天那场球实在太精彩了！”，乙答“什么?”，因甲和乙缺少共同的球赛语境信息，交际就无法","w":"high","e":["2020 真题"]},{"t":"名词解释：字面意义","y":"名词解释","p":["离开语境时词或词组表示的意义称为字面意义","话语的字面意义通常跟真实意思不一样","发话者通常利用字面意义传达话语意义"],"q":"在离开语境的情况下，语言意义(词或词组表示的意义)称为字面意义。","w":"high","e":["2018 真题","2021 真题"]},{"t":"名词解释：话语意义","y":"名词解释","p":["特定语境下话语所传递的真实意思称为话语意义","话语意义是语用分析的主要目的","表达能力是发话者利用语境表达话语意义的能力，理解能力是受话者利用语境获取话语意义的能力"],"q":"在特定语境下话语所传递的真实意思，称为话语意义。话语意义是语用分析的主要目的。","w":"high","e":["2019 真题","2023 真题"]},{"t":"简述发话者话语意义的表达策略。","y":"简答题","p":["预先策略：交际之前把表达内容和表达方式准备好","临时策略：交际时瞬间来不及周密思考作出的决策","模糊策略：不想表示、难于表示或摸不清对方意图时在瞬间采取的策略"],"q":"发话者的真实意图是“为什么说”，在特定语境中选择某种方式恰当地表达是“怎么说”，可以有不同的策略。第一，预先策略，指的是交际之前把表达内容和表达方式准备好，比如会议报告、诗歌或小说创作、制定谈判主题等；第二，临时策略，指的是交际时瞬间来不及周密思考作出的决策，发话者会利用一些表达方式尽量避免出现失误；第三，模糊策略，一","w":"high","e":["2021 真题"]},{"t":"请分析下面话语中受话者如何理解发话者的话语意义：甲：面条里要放辣油吗？乙：我是地道的四川人。","y":"分析题","p":["受话者通过相关语境知识来理解、推求话语意义","“我是地道的四川人”暗示的语境信息中只有“四川人爱吃辣”与问话相关","推断出“辣油不但要放而且要多放”的话语意义"],"q":"“我是地道的四川人”所能暗示的语境信息有许多，但其中只有“四川人爱吃辣”与问话要求相关，受话者通过相关语境知识来理解、推求，从而促使对方推断出“辣油不但要放而且要多放”的话语意义来。受话者对话语的理解并不是一个被动过程，在整个交际过程中，会一直处于主动探索、积极捕捉的心态中。","w":"normal","e":["核心考点"]},{"t":"受话者对话语的理解是一个被动过程。","y":"判断题","p":["受话者对话语的理解不是被动过程","受话者在整个交际过程中处于主动探索、积极捕捉的心态"],"q":"错误。受话者对话语的理解并不是一个被动过程，恰恰相反，在整个交际过程中，会一直处于主动探索、积极捕捉的心态中。","w":"normal","e":["核心考点"]},{"t":"语用分析的主要内容包括哪三个方面？","y":"简答题","p":["语境对话语交际起重要作用","字面意义和话语意义","话语结构及连贯规律"],"q":"语用分析的主要内容有以下三个方面：（一）语境对话语交际起重要作用；（二）字面意义和话语意义；（三）话语结构及连贯规律。","w":"high","e":["2022 真题"]}]},{"id":"xdhy_down-c02-s02","t":"第二节 话语意义","w":"high","n":23,"k":[{"t":"话语意义的基本表现形式有哪三类？","y":"简答题","p":["指称和指示","会话含意","前提","指称指示涉及字面意义，会话含意和前提隐含在字面意义背后需借助语境推导"],"q":"话语意义基本表现形式有三类：“指称”和“指示”“会话含意”“前提”。其中“指称”和“指示”是涉及字面意义的话语意义，而“会话含意”“前提”则不同，是隐含在字面意义背后、需要借助于语境推导的话语意义。","w":"high","e":["2019 真题","2021 真题"]},{"t":"名词解释：指称","y":"名词解释","p":["指称主要是名词的功能","用名词的概括性词义去确定特定语境中的所指对象","指称表现在有指无指、实指泛指、全指别指、定指不定指等情形"],"q":"指称主要是名词的功能，用名词的概括性词义去确定特定语境中的所指对象，同时用相应的语音去称呼它。","w":"high","e":["2020 真题","2022 真题"]},{"t":"指称在表达中有哪些不同的情形？","y":"简答题","p":["有指和无指","实指和泛指","全指和别指","定指和不定指"],"q":"指称在表达中有以下不同的情形：（1）有指和无指；（2）实指和泛指；（3）全指和别指；（4）定指和不定指。","w":"high","e":["2019 真题","2023 真题"]},{"t":"辨析“有指”与“无指”。","y":"辨析题","p":["有指：名词跟语境中特定对象联系起来","无指：名词仅用来表示一种性质，语义作用表示属性","例：“打碎了一块玻璃”的“玻璃”是有指；“玻璃窗子”的“玻璃”是无指"],"q":"指称主要是名词的功能，但名词的使用未必一定是指称。有指指名词跟语境中特定对象联系起来的指称用法，无指指名词仅用来表示一种性质、其语义作用表示属性的用法。例(1)“他打碎了一块玻璃”中的“玻璃”是有指称的；例(2)“他卸下了一扇玻璃窗子”中有指称的是“窗子”，“玻璃”却是无指。专有名词的所指对象是独一无二的，通常“有指”","w":"high","e":["2021 真题"]},{"t":"辨析“实指”与“泛指”。","y":"辨析题","p":["实指和泛指是有指的两种情况","实指：与发话者心目中已有确定目标的对象联系","泛指：与语境中任意的对象联系","例：“我的笔”是实指，“借支笔”的“笔”是泛指"],"q":"“实指”和“泛指”是“有指”的两种情况。普通名词的所指对象都是一个庞大的集合，其“有指”用法一是通过“实指”用法与语境中一些确切的对象、也就是发话者心目中已有确定目标的对象联系起来；二是通过“泛指”用法与语境中任意的对象联系起来。例(4)“请把我的笔递给我”中的“笔”是发话者心目中确有所指的一支笔，属于“实指”；例(5","w":"high","e":["2019 真题","2022 真题"]},{"t":"辨析“全指”与“别指”。","y":"辨析题","p":["全指和别指都属于实指","全指：把词语与所指对象的整个集合联系起来，确定目标是集合中的所有成员","别指：指称集合中某些确切的对象，与别的对象有所区别"],"q":"在“实指”用法中，有“全指”与“别指”的区别。它们的共同点在于所指的都是有确定目标的对象，但“全指”的用法把词语与所指对象的整个集合联系起来，确定目标是集合中的所有成员；“别指”指称集合中某些确切的对象，与别的对象有所区别。例(6)“腊梅冬天开花”的“腊梅”是指所有的腊梅，用法是“全指”；例(7)“最近图书馆进了不少书","w":"high","e":["2020 真题"]},{"t":"辨析“定指”与“不定指”。","y":"辨析题","p":["定指：发话者认为受话者已经了解，把对象作为已知事物陈述","不定指：发话者认为受话者并不了解，把对象作为陌生事物陈述","不定指一般通过数词“一”与量词组成数量短语再修饰名词来实现"],"q":"“别指”可以区分为“定指”和“不定指”。对发话者而言，某一或某些对象对发话者来说都是已知的，可是对受话者而言有两种可能：一是发话者可能认为受话者已经了解，于是就把对象作为已知事物向受话者陈述，这就是“定指”的用法；二是发话者也可能认为受话者并不了解，于是就把对象作为陌生事物向受话者陈述，这就是“不定指”的用法，暗示受话","w":"high","e":["2018 真题","2021 真题"]},{"t":"分析下列两句中“小偷”的指称类型：（10）小偷从后门进来了。（11）后门来了个小偷。","y":"分析题","p":["主语位置上的名词倾向于定指","宾语位置上的名词倾向于不定指","例(10)“小偷”是定指，例(11)“(一)个小偷”是不定指"],"q":"在没有数量短语的情况下，出现在主语位置上的名词倾向于“定指”，而出现在宾语位置上倾向于“不定指”。例(10)“小偷”是定指，例(11)“(一)个小偷”是不定指。","w":"high","e":["2019 真题"]},{"t":"名词解释：指示语","y":"名词解释","p":["指示语以具体交际情景要素作为参照点获得词义的所指对象","指示语以发话者为基准，在语境中有明确的指示对象和具体的意义","指示主要有四类：人称指示、时间指示、空间指示、话语指示"],"q":"某些词语以具体交际情景要素(说话者、说话时间、说话地点等)作为参照点，获得词义的所指对象，这些词语称为“指示语”。","w":"high","e":["2020 真题","2022 真题"]},{"t":"指示主要有四类：人称指示、时间指示、______和______。","y":"填空题","p":["指示分四类：人称指示、时间指示、空间指示、话语指示"],"q":"空间指示；话语指示","w":"high","e":["2019 真题","2022 真题"]},{"t":"名词解释：人称指示","y":"名词解释","p":["用人称指示语表示言语行为参与者所承担的角色","分第一人称、第二人称、第三人称三类"],"q":"用指示语表示言语行为参与者(交际各方)所承担的角色，就是人称指示。通常分为三类：第一人称、第二人称及第三人称。","w":"high","e":["2021 真题"]},{"t":"名词解释：时间指示","y":"名词解释","p":["用指示语表示发话者说话时的各种时间","分三类：指示说话的时间、指示说话时间之前的时间、指示说话时间之后的时间"],"q":"用指示语表示发话者说话时的各种时间，就是时间指示。时间指示有三大类：第一，指示说话的时间；第二，指示说话时间之前的时间；第三，指示说话时间之后的时间。","w":"high","e":["2020 真题"]},{"t":"名词解释：空间指示","y":"名词解释","p":["用指示语表示发话者说话时所在地点的各种空间位置","现代汉语只用近指、远指两种指示方式","动态形式用动词“来”“去”表示"],"q":"用指示语表示发话者说话时所在地点的各种空间位置，就是空间指示。现代汉语只用近指、远指两种指示方式。","w":"high","e":["2021 真题"]},{"t":"名词解释：话语指示","y":"名词解释","p":["用指示语表示发话者表达过程中指语言符号链条中某一部分","话语指示分三类：正说写的话语、之前的话语、之后的话语"],"q":"用指示语表示发话者表达过程中指语言符号链条中某一部分称为话语指示。由于话语都是按时间顺序展开的，所以话语指示与时间指示一样分三类。","w":"normal","e":["核心考点"]},{"t":"请分析下列话语中指示语的参照点：“现在解散，十分钟后，我们在这里集合！”","y":"分析题","p":["指示语以发话者此时的言语行为作为参照点","“现在”是说出该词的时刻，“十分钟后”据此确定","“我们”是发话者加上受话者","“这里”是发话者正在说话的地方"],"q":"学生们要理解老师的这句话，就要先确定“现在”“我们”“这里”要以老师此时的言语行为作为参照点：“现在”就是老师说出“现在”这个词的时刻，有了它，“十分钟后”是什么时间也就得到了确定，而“我们”就是说出“我们”这个词的老师加上上体育课的学生，“这里”就是老师正在说话的地方。离开了老师这些言语行为，孤立地听到这样一句话，学","w":"high","e":["2019 真题","2022 真题"]},{"t":"试述“指称”与“指示”的联系与区别。","y":"论述题","p":["指示词语的话语意义分为指称和指示两种，必定与具体语境中的特指对象相联系","指称主要是名词的功能，被指称对象必须具备指称词词义所概括的本质特征","指示以交际情景要素为参照点，以发话者为基准","指示比指称更能体现话语与语境的紧密联系","前后互指关系不是指示"],"q":"指示词语的话语意义可以分为两种：第一是“指称”，第二是“指示”，它们必定与具体语境中的特指对象相联系。指称主要是名词的功能，用名词的概括性词义去确定特定语境中的所指对象，同时用相应的语音去称呼它；指称的最大特点在于，被指称对象必须具备指称词的词义所概括的本质特征。指示是某些词语以具体交际情景要素(说话者、说话时间、说话","w":"high","e":["2020 真题","2023 真题"]},{"t":"名词解释：会话含意","y":"名词解释","p":["发话者在特定语境中没有用字面意义表达出来的意义","要靠受话者推求出来","也就是一般人所说的“言外之意”"],"q":"发话者在特定语境中没有用字面意义表达出来，而要靠受话者推求出来的话语意义，称为会话含意，也就是一般人所说的“言外之意”。","w":"high","e":["2018 真题","2020 真题","2022 真题"]},{"t":"名词解释：前提","y":"名词解释","p":["前提也称为预设，指交际各方共有的语境知识","是受话者正确理解、推导会话含意必须具备的先决条件和根据","前提处于具体话语产生之前，蕴藏在字面意义里"],"q":"前提，也称为预设，指交际各方共有的语境知识。这是受话者正确理解、推导会话含意必须具备的先决条件和根据。","w":"high","e":["2019 真题","2021 真题"]},{"t":"辨析“前提”与“会话含意”。","y":"辨析题","p":["前提是交际各方共有的语境知识，是推导会话含意的先决条件","前提处于具体话语产生之前，蕴藏在字面意义里","会话含意是要靠受话者推求出来的话语意义","前提是基础，会话含意是推导结果"],"q":"前提，也称为预设，指交际各方共有的语境知识，是受话者正确理解、推导会话含意必须具备的先决条件和根据，在时间上前提的存在处于具体话语产生之前，由发话者预先设定，蕴藏在字面意义里。会话含意是发话者在特定语境中没有用字面意义表达出来、而要靠受话者推求出来的话语意义，即“言外之意”。二者都要依靠语境，但前提是推导会话含意的基础","w":"high","e":["2020 真题","2022 真题"]},{"t":"请分析“小张的妹妹考取了清华大学”这句话所包含的前提。","y":"分析题","p":["有一个叫小张的人","小张有个妹妹","有一所叫清华大学的学校","小张的妹妹有能力去考大学"],"q":"这句话除了它本身意义之外，还包含了：a.有一个叫小张的人；b.小张有个妹妹；c.有一所叫清华大学的学校；d.小张的妹妹有能力去考大学。在发话者说这句话的时候，预先设定受话者可能同样已经知道这些前提，才能明白这句话的字面意义，从而进一步推导话语的会话含意。","w":"high","e":["2019 真题","2023 真题"]},{"t":"简述前提在日常话语交际中的作用。","y":"简答题","p":["提高话语交际的效果，避免令人烦闷的语句，便于推求言外之意","对话语语义的连贯性具有积极作用，使话语语义得以接续、生长"],"q":"前提在日常话语交际中有着必不可少的作用：第一，通过前提，我们可以提高话语交际的效果。发话者可以把与受话者共同熟悉的语境信息作为前提，不直接表达出来，不仅可以避免令人烦闷的语句，受话者又可以根据共有的已知语境知识推求出发话者的“言外之意”。第二，前提对话语语义的连贯性具有积极作用。按照话语语义“已知→未知”的传递规律，前","w":"high","e":["2021 真题"]},{"t":"会话含意是隐含在字面意义背后、需要借助于语境推导的话语意义，而指称和指示是涉及字面意义的话语意义。","y":"判断题","p":["指称和指示涉及字面意义","会话含意和前提隐含在字面意义背后，需要借助语境推导"],"q":"正确。虽然都要依靠语境，不过“指称”和“指示”是涉及字面意义的话语意义，而“会话含意”“前提”则不同，是隐含在字面意义背后、需要借助于语境推导的话语意义。","w":"high","e":["2020 真题"]},{"t":"“指示语使用有两个阶段”，其第一阶段是（　　）","y":"单项选择题","p":["第一阶段：确定以言语行为中的哪一要素为参照点","第二阶段：确定某一指示语所指什么"],"q":"B。指示语使用有两个阶段：首先确定以言语行为中的哪一要素为参照点，在此基础之上再去确定某一指示语所指什么。","w":"normal","e":["核心考点"]}]},{"id":"xdhy_down-c02-s03","t":"第三节 言语行为与会话原则","w":"high","n":32,"k":[{"t":"名词解释：言语行为","y":"名词解释","p":["言语行为指用言语来施行、达到交际意图的行为","整个过程由言内行为、言外行为、言后行为构成","过程可描述为言之发、示言之力、收言后之果"],"q":"话语交际可以看成人类的一种“言语行为”，指的是用言语来施行、达到交际意图的行为。","w":"high","e":["2018 真题","2020 真题","2022 真题"]},{"t":"名词解释：言内行为","y":"名词解释","p":["言内行为指言语表达(说、写)这一行为本身","即“以言指事”，又称为“以言表意”"],"q":"言内行为指言语表达(说、写)这一行为本身，“以言指事”。","w":"high","e":["2019 真题","2021 真题"]},{"t":"名词解释：言外行为","y":"名词解释","p":["言外行为指用言语表达来体现发话者意图的一种行为","即“以言行事”"],"q":"言外行为指用言语表达(说、写)来体现发话者意图的一种行为，即“以言行事”。","w":"high","e":["2018 真题","2021 真题"]},{"t":"名词解释：言后行为","y":"名词解释","p":["言后行为指受话者接收话语之后所受到的影响","即话语所带来的实际结果","也就是“以言取效”"],"q":"言后行为指受话者接收发话者话语之后所受到的影响，也就是话语所带来的实际结果，即“以言取效”。","w":"high","e":["2019 真题","2022 真题"]},{"t":"辨析“言外行为”与“言后行为”。","y":"辨析题","p":["言外行为是以言行事，以语言意义的力量就能完成","言后行为是以言取效，其效果不仅仅是语言的范围","例：“承诺”是言外行为，“放心”是言后行为"],"q":"言外行为指用言语表达来体现发话者意图的一种行为，即“以言行事”；言后行为指受话者接收发话者话语之后所受到的影响，也就是话语所带来的实际结果，即“以言取效”。二者的区别在于：言外行为以语言意义的力量就能完成，而言后行为所产生的效果，不仅仅是语言的范围了。例如“你放心，我明天会来的”，其“承诺”是言外行为，受话者听了之后“","w":"high","e":["2020 真题","2023 真题"]},{"t":"人们运用语言进行交际的整个过程，实际上是由一个接一个的言语行为构成的，即：言内行为————______————______，最后达到发话者的交际意图。","y":"填空题","p":["言语行为过程：言内行为—言外行为—言后行为"],"q":"言外行为；言后行为","w":"high","e":["2019 真题"]},{"t":"请用言语行为理论分析下面话语：“哥哥，你不要这样。人家是好心好意来安慰我们。”","y":"分析题","p":["“说出这句话”是言内行为","“劝告”是言外行为","“不要对周冲勃然大怒”是言后行为","以言表意、以言行事完成，但以言取效失败"],"q":"这是曹禺《雷雨》第三幕的一个场景：当周冲到四凤家探视，而四凤的哥哥鲁大海对他很不客气，四凤对哥哥说出这句话(言内行为)，真正目的是“劝告”(言外行为)她哥哥不要对周冲勃然大怒(言后行为)，鲁大海听明白了四凤的意思，但最后却没有按四凤的劝告去做，仍然对着周冲发火。所以，四凤的“以言表意”“以言行事”虽然完成了，可是“以言","w":"high","e":["2021 真题"]},{"t":"名词解释：会话合作原则","y":"名词解释","p":["会话合作原则是反映普遍规律的基本原则，由四条准则组成","包括数量准则、质量准则、关联准则、方式准则"],"q":"成功的话语交际都有赖于交际各方的密切合作，会话合作原则就是这样一个反映了普遍规律的基本原则，它由四条准则组成。","w":"high","e":["2018 真题","2020 真题","2022 真题"]},{"t":"简述会话合作原则的四条准则。","y":"简答题","p":["数量准则：信息量与交谈所需信息量一致","质量准则：信息内容与语境中的实际情况一致","关联准则：话语之间及话语与话题之间相互关联","方式准则：表达方式让受话者易于理解"],"q":"会话合作原则由四条准则组成：（一）数量准则：话语所含信息量与本次交谈所需信息量应该一致。（二）质量准则：话语提供的信息内容必须跟语境中的实际情况相一致。（三）关联准则：话语之间以及话语与话题之间应该相互关联。（四）方式准则：话语的表达方式让受话者易于理解。","w":"high","e":["2019 真题","2021 真题","2023 真题"]},{"t":"名词解释：数量准则","y":"名词解释","p":["话语所含信息量与本次交谈所需信息量应该一致","发话者应提供适量信息，既不能太少也不能太多","受话者相信发话者正是这样做的"],"q":"话语所含信息量与本次交谈所需信息量应该一致。发话者应根据语境要求向受话者提供适量信息，既不能太少，也不能太多；同时受话者也相信发话者正是这样做的。","w":"high","e":["2019 真题"]},{"t":"名词解释：质量准则","y":"名词解释","p":["话语提供的信息内容必须跟语境中的实际情况相一致","发话者所提供的信息真实可靠，不说假话","受话者的合作表现在他相信发话者说的是真话"],"q":"话语提供的信息内容必须跟语境中的实际情况相一致。也就是说，发话者所提供的信息真实可靠，不说假话。","w":"high","e":["2020 真题"]},{"t":"名词解释：关联准则","y":"名词解释","p":["话语之间以及话语与话题之间应该相互关联","发话者按“已知→未知”认知顺序组织、展开话语","受话者相信发话者有诚意，努力搜寻可能存在的联系"],"q":"话语之间以及话语与话题之间应该相互关联。","w":"high","e":["2018 真题","2022 真题"]},{"t":"名词解释：方式准则","y":"名词解释","p":["话语的表达方式让受话者易于理解","尽量避免歧义、晦涩、啰唆、含混等现象","追求通晓流畅、条理分明、易于理解的表达方式"],"q":"话语的表达方式让受话者易于理解。发话者在说话时应尽量避免歧义、晦涩、啰唆、含混等现象，而追求通晓流畅、条理分明、易于理解的表达方式。","w":"high","e":["2021 真题"]},{"t":"名词解释：礼貌原则","y":"名词解释","p":["礼貌原则指尽量把不礼貌的表达方式减低到最低限度","礼貌原则也称为得体原则","礼貌原则处在比合作原则更高的层次上","礼貌原则比合作原则具有更大的灵活性"],"q":"礼貌原则指在其他条件相同的情况下，尽量把不礼貌的表达方式减低到最低限度。礼貌原则也称为得体原则。","w":"high","e":["2018 真题","2020 真题","2022 真题"]},{"t":"从礼貌角度给言语行为分类，可以分为哪几类？","y":"简答题","p":["竞争类：命令、要求、批评、禁止等","冲突类：训斥、咒骂、威胁等","和谐类：邀请、祝贺、感谢、道歉等","合作类：报告、讲述、宣布、介绍等"],"q":"根据对礼貌的不同要求，言语行为可分类如下：1.竞争类言语行为，如“命令”“要求”“批评”“禁止”等；2.冲突类言语行为，如“训斥”“咒骂”“威胁”等；3.和谐类言语行为，如“邀请”“祝贺”“感谢”“道歉”等；4.合作类言语行为，如“报告”“讲述”“宣布”“介绍”等。","w":"high","e":["2019 真题","2021 真题"]},{"t":"名词解释：竞争类言语行为","y":"名词解释","p":["竞争类言语行为有病“命令”“要求”“批评”“禁止”等","行为形式本身是失礼的","对语言方式并没有严格要求，发话者可以选择"],"q":"竞争类言语行为，这类行为有“命令”“要求”“批评”“禁止”等。这些行为形式本身之所以是失礼的，是因为与发话者想达到的目的和礼貌要求之间的关系不太协调。","w":"high","e":["2020 真题"]},{"t":"和谐类言语行为从语用意图到语言方式都必须是礼貌的。","y":"判断题","p":["和谐类言语行为从语用意图到语言方式都必须是礼貌的","如“邀请”“祝贺”“感谢”“道歉”等"],"q":"正确。和谐类言语行为如“邀请”“祝贺”“感谢”“道歉”等，它们从语用意图到语言方式都必须是礼貌的，不可能不礼貌地感谢，更不可能不礼貌地祝贺。","w":"normal","e":["核心考点"]},{"t":"简述礼貌原则的三条准则。","y":"简答题","p":["慷慨准则：尽量少表达利己的和有损于对方的看法","谦虚准则：在话语中尽量少赞誉自己并少贬低对方","一致准则：尽力缩小与对方的分歧，尽量夸大与对方的一致"],"q":"礼貌原则也体现为一些具体准则：1.慷慨准则：尽量少表达利己的和有损于对方的看法，话语交际内容尽量使他人受惠最大而受损最小，尽量使自己受惠最小而受损最大；2.谦虚准则：在话语中尽量少赞誉自己并少贬低对方；3.一致准则：在话语中尽量缩小与对方的分歧，尽量夸大与对方的一致。","w":"high","e":["2019 真题","2022 真题"]},{"t":"名词解释：慷慨准则","y":"名词解释","p":["慷慨准则即尽量少表达利己的和有损于对方的看法","使他人受惠最大而受损最小，使自己受惠最小而受损最大","用疑问句表示祈使是一种委婉的表达方式"],"q":"慷慨准则，指尽量少表达利己的和有损于对方的看法。话语交际内容尽量使他人受惠最大而受损最小，尽量使自己受惠最小而受损最大。","w":"high","e":["2020 真题"]},{"t":"名词解释：谦虚准则","y":"名词解释","p":["谦虚准则即在话语中尽量少赞誉自己并少贬低对方","对受话一方多赞扬，少指责；对自己避免炫耀，甚至适当贬低自己","不同民族对谦虚准则有不同的理解"],"q":"谦虚准则，指在话语中尽量少赞誉自己并少贬低对方。","w":"normal","e":["核心考点"]},{"t":"名词解释：一致准则","y":"名词解释","p":["一致准则即尽量缩小与对方的分歧，尽量夸大与对方的一致","分歧和一致可以是观点上的，也可以是情感上的"],"q":"一致准则，指在话语中尽量缩小与对方的分歧，尽量夸大与对方的一致。","w":"high","e":["2021 真题"]},{"t":"请从礼貌原则的角度分析下面五个句子的礼貌程度差异：（1）把自行车钥匙拿来！（2）把自行车借给我。（3）请把自行车借给我。（4）能把自行车借给我吗？（5）您下午用自行车吗？我下午想到亲戚家去，可是那里没通公交车。","y":"分析题","p":["礼貌的普遍原则：语言表达方式越间接，话语就越显得礼貌","从例(1)到例(5)礼貌程度依次增加","例(1)最直接、最没礼貌；例(5)最间接、最有礼貌","例(3)加“请”后礼貌程度增加"],"q":"礼貌有一个普遍适用的原则：语言表达方式越间接，话语就越显得礼貌。从例(1)到例(5)礼貌程度依次增加。这里发话者最直接的目的是把自行车钥匙拿到手，所以例(1)在表达方式上最直接，因而也就最没礼貌。(5)简直没有说出具体的要求，而是让受话者体会其中的会话含意，所以最有礼貌。除了表达方式的直接与间接，还有专门的礼貌用语可以","w":"high","e":["2020 真题","2023 真题"]},{"t":"语言表达方式越间接，话语就越显得礼貌。","y":"判断题","p":["语言表达方式越间接，话语就越显得礼貌"],"q":"正确。礼貌有一个普遍适用的原则：语言表达方式越间接，话语就越显得礼貌。","w":"high","e":["2019 真题"]},{"t":"名词解释：会话含意的推理","y":"名词解释","p":["会话含意的推理是语用分析主要的任务和目的","故意违反合作原则就是言外之意的推理信号","受话者从字面意义出发，根据语境去努力推导出真正意图"],"q":"会话含意在交际中有重要价值，是语用的核心内容，所以，会话含意的推理是语用分析主要的任务和目的。故意违反合作原则就是言外之意的推理信号。","w":"high","e":["2019 真题","2022 真题"]},{"t":"故意违反合作原则可以引发哪些会话含意？请分别说明。","y":"简答题","p":["违反数量准则引发会话含意","违反质量准则引发会话含意","违反关联准则引发会话含意","违反方式准则引发会话含意"],"q":"故意违反合作原则就是言外之意的推理信号，具体情况有四种：1.违反数量准则引发会话含意，如乙回答提供了过多的信息；2.违反质量准则引发会话含意，如发现对方说假话，那就是有言外之意；3.违反关联准则引发会话含意，如答话没有针对问话直接回答；4.违反方式准则引发会话含意，如使用晦涩甚至近乎废话的表达方式。","w":"high","e":["2018 真题","2021 真题"]},{"t":"请分析下面答话如何违反数量准则并推导会话含意：甲：听说你隔壁来了位新同学?乙：他姓陈，是哲学系的，我已经带他看过校园了，还领他办理入学手续，昨天跟他一起去看电影呢！","y":"分析题","p":["乙提供了过多的信息，违反数量准则","甲认为乙确有说话诚意，提供过多信息一定有原因","推导出言外之意：乙不仅知道来了新同学，而且跟他关系比较熟悉"],"q":"按常理，乙回答是否来了新同学就可以了，可是乙却向甲说了他自己跟这位新同学做了什么事情，这显然是违反数量准则，提供了过多的信息。但甲如果认为乙确有说话诚意，那么，他提供过多信息一定是有原因的，甲就通过乙的字面意义进行推理发现他的言外之意，得出结论：乙不仅知道来了一位新同学，而且跟他的关系还比较熟悉。","w":"normal","e":["核心考点"]},{"t":"名词解释：会话含意推理的过程","y":"名词解释","p":["会话含意的推理是一种演绎式的推理","需要有大前提(一般性的知识)和小前提(针对特定对象的具体知识)","被选定的相关语境知识是大前提，字面意义是小前提","推理就是从大前提推导出针对特定对象的新结论"],"q":"会话含意的推理是一种演绎式的推理，它的进行需要有大前提(一般性的知识)，还需要有小前提(针对特定对象的具体知识)。被选定的相关语境知识是大前提，字面意义是小前提，推理就是从大前提推导出针对特定对象的新结论。","w":"high","e":["2020 真题","2022 真题"]},{"t":"请说明会话含意推理的四个环节。","y":"简答题","p":["推理的起点：字面意义","推理的依据：相关的前提","推理的过程：字面意义与语境信息相互作用","推理的结果：会话含意"],"q":"会话含意的推理可以分为四个环节：1.推理的起点：字面意义；2.推理的依据：相关的前提；3.推理的过程：字面意义与语境信息相互作用；4.推理的结果：会话含意。","w":"high","e":["2019 真题","2021 真题"]},{"t":"请分析下面会话含意的推理过程：甲：小王的文字功夫怎么样?乙：她当过办公室秘书。","y":"分析题","p":["大前提：秘书经常要起草很多文件","小前提：小王当过办公室秘书","结论：小王写作能力应该不错"],"q":"大前提(相关的语境知识)：秘书经常要起草很多文件；小前提(字面意义)：小王当过办公室秘书；结论(会话含意)：小王写作能力应该不错。从答话者乙的语句“她当过办公室秘书”字面意义出发，受话者就会寻找共同已知的语境知识，关于“秘书”一般具有一些前提，其中只有“秘书经常要起草很多文件”与谈话主题相关，所以它可作为推理的依据，从","w":"high","e":["2020 真题","2023 真题"]},{"t":"试述合作原则与礼貌原则的关系。","y":"论述题","p":["礼貌原则是在合作原则基础之上提出的，为合作原则保驾护航","礼貌原则处在比合作原则更高的层次上","只有遵循了礼貌原则，才谈得上真正遵循合作原则","有时为了维护礼貌原则，人们甚至不惜牺牲合作原则的某一准则","礼貌原则比合作原则具有更大的灵活性"],"q":"礼貌原则是语用另一个核心内容，它是在合作原则基础之上提出的，为了给合作原则“保驾护航”，使其交际效率最高，效果最好，也为了更合理解释话语交际上的复杂现象。礼貌原则处在比合作原则更高的层次上。只有遵循了礼貌原则，才谈得上真正遵循合作原则，因为礼貌原则维护了交际各方的均等地位和友好关系，受话者更愿意去配合发话者，发话者的交","w":"high","e":["2018 真题","2021 真题","2023 真题"]},{"t":"下列属于冲突类言语行为的是（　　）","y":"单项选择题","p":["冲突类言语行为有“训斥”“咒骂”“威胁”等"],"q":"C。“训斥”“咒骂”“威胁”等属于冲突类言语行为；“报告”属于合作类，“感谢”属于和谐类，“要求”属于竞争类。","w":"high","e":["2020 真题"]},{"t":"“关联性准则”的重要作用就在于能解释会话含意的推理信号问题。","y":"判断题","p":["关联性准则的重要作用在于能解释会话含意的推理信号问题","话语关联程度降低就是促使受话者进行言外之意推理的信号"],"q":"正确。人们通过违背合作原则中的某一个准则来推导言外之意，关联性准则起着重要作用，“关联性准则”的重要作用就在于能解释会话含意的推理信号问题。","w":"high","e":["2019 真题"]}]},{"id":"xdhy_down-c02-s04","t":"第四节 话语结构","w":"high","n":32,"k":[{"t":"名词解释：话语衔接","y":"名词解释","p":["话语衔接是通过种种语言手段把句子衔接成一个结构整体","特点是衔接、衔接手段和连贯性","衔接其实是一种语义联系"],"q":"话语衔接就是通过种种语言手段，把句子衔接成一个结构整体。在受话者理解话语时的心理感受中，就出现了一种连贯性。","w":"high","e":["2019 真题","2022 真题"]},{"t":"话语衔接主要有哪五种类型？","y":"简答题","p":["指代关系","省略关系","逻辑关系","替代关系","词义关系"],"q":"话语衔接主要有以下五种：1.指代关系；2.省略关系；3.逻辑关系；4.替代关系；5.词义关系。","w":"high","e":["2018 真题","2020 真题","2023 真题"]},{"t":"名词解释：指代关系","y":"名词解释","p":["指代关系依靠代词与先行词之间的联系把话语的两部分衔接起来","特殊情形下也可以是后行词","代词衔接作用最强，是最常用的衔接手段"],"q":"指代关系依靠代词与先行词之间的联系把话语的两部分衔接起来，在一些特殊的情形下也可以是后行词。","w":"high","e":["2020 真题"]},{"t":"名词解释：省略关系","y":"名词解释","p":["省略也是衔接，句子结构成分如主语、宾语的省略可衔接话语","受话者到前文中寻找相关信息，一旦找到话语就被衔接起来","零形态代词的衔接方式称为零形指代"],"q":"省略也是衔接。有的句子结构成分会省略，例如主语、宾语。这时受话者就会努力地到前文中去寻找与之相关的信息，一旦找到，话语也就被衔接了起来。","w":"high","e":["2019 真题","2022 真题"]},{"t":"名词解释：逻辑关系","y":"名词解释","p":["逻辑关系由各种各样的关联词语来体现","话语中某一部分有关联词语出现，就必须到与之关联的另一部分去寻找相关信息","关联词语包括表时间、空间关系及其他关系的词语"],"q":"逻辑关系可以由各种各样的关联词语来体现，凡是话语中某一部分有关联词语出现，就必须到与之关联的另一部分去寻找相关信息，在这样的过程中话语就被衔接起来了。","w":"high","e":["2020 真题"]},{"t":"名词解释：替代关系","y":"名词解释","p":["同一个指称对象在前后句子里用不同的词语来指称形成替代关系","后出现的必须跟先出现的联系起来才能确认同指关系","有同指关系的两个词语可以在语言形式上完全不同"],"q":"同一个指称对象，在前后句子里用不同的词语来指称，这两个或几个不同的词语就形成了替代关系。","w":"high","e":["2021 真题"]},{"t":"名词解释：词义关系","y":"名词解释","p":["词语在意义上有着极为错综复杂的关系","除同义、近义、反义、上下位义外，还有构成关系、同现关系、受动关系、结果关系等"],"q":"词语在意义上有着极为错综复杂的关系，除了平时常说的同义、近义、反义、上下位义等关系之外，常见的还有构成关系、同现关系、受动关系、结果关系等许许多多的语义关系。","w":"high","e":["2019 真题"]},{"t":"名词解释：话题","y":"名词解释","p":["话题指的是发话者表述的出发点或对象","述题指的是对话题出发点或对象进行的说明","汉语是一种话题凸显的语言","话题具有交际定向作用，承载已知信息"],"q":"“话题”指的是发话者表述的出发点或对象，“述题”指的是对话题出发点或对象进行的说明。","w":"high","e":["2018 真题","2021 真题"]},{"t":"名词解释：话题链","y":"名词解释","p":["话题跟话题的联系及其方式构为话题链","作用是显示出话语语义推进的线索和话语中心的整合","话题链分三类：同题链、异题链、包题链"],"q":"话题跟话题的联系及其方式，构为“话题链”，其作用是显示出话语语义推进的线索和话语中心的整合。","w":"high","e":["2019 真题","2022 真题"]},{"t":"“话题链”分为哪三类？各有什么作用？","y":"简答题","p":["同题链：后一句的话题是前一句话题的延伸","异题链：上文的话题跟下文的话题不相同","包题链：由有包容关系的话题形成","三类可以相套，形成更复杂的类型"],"q":"“话题链”一般分为三类：A.同题链，上文的话题延伸到下文来，后一句的话题就是前一句话题的延伸，语言形式可以完整转移，也可以有一定改变，同题链常常用来表述同一事物的不同方面或者连续的动作等；B.异题链，上文的话题跟下文的话题不相同，作用较广泛，可以表示不同事物的不同方面或者情况，同一事物的不同方面或情况；C.包题链，由有","w":"high","e":["2020 真题","2023 真题"]},{"t":"名词解释：同题链","y":"名词解释","p":["同题链是上文的话题延伸到下文来","后一句的话题就是前一句话题的延伸","语言形式可以完整转移，也可以有一定改变"],"q":"同题链，上文的话题延伸到下文来，这时，后一句的话题就是前一句话题的延伸，不过，语言形式可以完整转移，也可以有一定改变。同题链常常用来表述同一事物的不同方面或者连续的动作等。","w":"high","e":["2021 真题"]},{"t":"名词解释：异题链","y":"名词解释","p":["异题链是上文的话题跟下文的话题不相同","作用较广泛，可表示不同事物的不同方面或情况，也可表示同一事物的不同方面或情况"],"q":"异题链，上文的话题跟下文的话题不相同。异题链作用较广泛，可以表示不同事物的不同方面或者情况，同一事物的不同方面或情况。","w":"high","e":["2020 真题"]},{"t":"名词解释：包题链","y":"名词解释","p":["包题链由有包容关系的话题形成","作用在于在一定范围内揭示或者概括一个事物的不同部分"],"q":"包题链，由有包容关系的话题形成。“包题链”的作用在于在一定范围内揭示或者概括一个事物的不同部分。","w":"high","e":["2019 真题"]},{"t":"话题推进有哪几种方式？","y":"简答题","p":["话题延伸式推进（平行式、派生式）","述题延伸式推进（线性式、分叉式）","综合延伸式推进"],"q":"话题推进方式有：1.话题延伸式推进，话语中各后继语句的话题都是来源于首句话题的延伸，按方式分平行式和派生式两类；2.述题延伸式推进，各后继语句的话题都来源于首句述题的延伸，分线性式和分叉式；3.综合延伸式推进，由前句的话题和述题结合作为后句新话题而延伸推进。","w":"high","e":["2020 真题","2022 真题"]},{"t":"名词解释：平行式推进","y":"名词解释","p":["平行式是各后继句都直接以首句的话题为话题","分别引出不同的述题，各话题之间是平行关系","语言形式上允许改变，可用代词、零形指代、同指词语替代"],"q":"平行式，各后继句都直接以首句的话题为话题，分别引出不同的述题，各话题之间是平行关系。不过，语言形式上允许改变，例如下句话题用代词、零形指代、有同指关系的词语替代等指代上句的话题。","w":"high","e":["2021 真题"]},{"t":"名词解释：派生式推进","y":"名词解释","p":["派生式是从上文语句话题中派生出后继语句各个话题","分属不同层次：原话题属上位，后续句话题属下位","它们之间并不能构成平行关系"],"q":"派生式，从上文语句话题中派生出后继语句各个话题，不过分属不同层次：原话题属上位，后续句话题属下位，它们之间并不能构成平行关系。","w":"high","e":["2019 真题"]},{"t":"名词解释：线性式推进","y":"名词解释","p":["线性式依靠前一句的述题或述题的一部分延伸为后一句的话题","前句与后句形成一环扣一环的线性推进关系","修辞格的顶针就是这样形成的"],"q":"线性式，依靠前一句的述题或述题的一部分延伸为后一句的话题，前句与后句就形成了一环扣一环的线性推进关系。","w":"high","e":["2020 真题"]},{"t":"名词解释：分叉式推进","y":"名词解释","p":["分叉式是前一语句的述题中延伸出来的话题不止一个","这些话题之间有着并列关系，形成分叉推进","分叉推进就是下位层次的平行推进或派生推进"],"q":"分叉式，从前一语句的述题中延伸出来的话题如果不止一个，而这些话题之间又有着并列关系，形成分叉推进。分叉推进其实就是下位层次的平行推进或派生推进。","w":"high","e":["2021 真题"]},{"t":"名词解释：综合延伸式推进","y":"名词解释","p":["综合延伸式推进由前句的话题和述题结合作为后句新话题而延伸推进","总要借助一个总括性词语来接纳前句"],"q":"综合延伸式推进，由前句的话题和述题结合作为后句新话题而延伸推进。","w":"high","e":["2020 真题"]},{"t":"名词解释：话轮","y":"名词解释","p":["会话参与者各方不断互换角色轮番说话","每一个参与者一次连续说的话就是一个话轮","话轮至少是一个句子"],"q":"会话的参与者各方不断互换角色轮番说话，每一个参与者一次连续说的话，就是一个话轮。","w":"high","e":["2019 真题","2022 真题"]},{"t":"名词解释：话对","y":"名词解释","p":["话对是前后相邻、内容相关的两个话轮构成的会话单位","内容相关指两个话轮在功能上对应","如提问与回答、提议与认可或谢绝等"],"q":"话对，前后相邻、内容相关的两个话轮构成的会话单位称为话对。","w":"high","e":["2020 真题"]},{"t":"名词解释：话段","y":"名词解释","p":["话段是围绕着同一个主题展开的一组话对","一个话段具有多少个话对没有上限","只要发生会话主题的转换，话段也随之转到下一个话段"],"q":"话段，围绕着同一个主题展开的一组话对构成一个话段。","w":"high","e":["2021 真题"]},{"t":"会话的主体围绕主题而展开，它的形式主要有话轮、话对、话段三种。","y":"判断题","p":["会话主体的形式主要有话轮、话对、话段三种"],"q":"正确。会话的主体围绕主题而展开，它的形式主要有话轮、话对、话段三种。","w":"high","e":["2018 真题"]},{"t":"会话的整体结构由哪几部分组成？会话的结尾一般由哪几部分组成？","y":"简答题","p":["会话由开端、主体、结尾三个部分组成","开端采用“召唤——回应”的结构方式","主体形式有话轮、话对、话段","结尾由结束信号语、前置收尾语和收尾语组成"],"q":"通常一次会话由开端、主体、结尾三个部分组成。会话的开端一般采用“召唤————回应”的结构方式。会话的主体的形式主要有话轮、话对、话段三种。会话的结尾一般由三个部分组成：结束信号语、前置收尾语和收尾语。","w":"high","e":["2020 真题","2023 真题"]},{"t":"名词解释：会话的开端","y":"名词解释","p":["会话开端的功能是发话者引起对方注意并邀请参与，受话者表示愿意参与","一般采用“召唤————回应”的结构方式"],"q":"会话的开端具有两方面的功能：发话者用一定的手段引起对方的注意，并表示邀请参与这次言语活动的意向；受话者则表示已经把注意力转移过来，并愿意参与这次言语活动，因此一般采用“召唤————回应”的结构方式。","w":"high","e":["2021 真题"]},{"t":"名词解释：会话的结尾","y":"名词解释","p":["会话结尾由结束信号语、前置收尾语和收尾语三部分组成","结束信号语率先发出结束信号，另一方回应","前置收尾语从礼貌上提供缓冲时间","收尾语是会话正式结束的标志"],"q":"结尾一般由三个部分组成：结束信号语、前置收尾语和收尾语。","w":"high","e":["2019 真题","2022 真题"]},{"t":"会话有哪些典型的轮换方式？","y":"简答题","p":["发话者点明下一个发话者","发话者点明接下来的主题","自由抉择"],"q":"会话还有它自身需要遵守的轮换原则，一个说完了另一个接着说。典型的轮换方式有：1.发话者点明下一个发话者；2.发话者点明接下来的主题；3.自由抉择。","w":"high","e":["2020 真题"]},{"t":"名词解释：话轮延伸标记","y":"名词解释","p":["话轮延伸标记有两种：延续性词语和显示话语整体结构的词语","延续性词语如“嗯……”“这个，这个……”","显示话语整体结构的词语如“第一……，第二……，第三……”"],"q":"所谓的话轮延伸标记，主要有两种：第一，延续性词语，如“嗯……”“这个，这个……”等；第二，显示话语整体结构的词语，如“第一……，第二……，第三……”等。","w":"high","e":["2021 真题"]},{"t":"名词解释：话轮结束标记","y":"名词解释","p":["话轮结束标记有话轮结束停顿和体态语两种","话轮结束时的停顿较长，语速放慢，语气加强","通过目光和手势等体态语判断话语是否结束"],"q":"所谓的话轮结束标记主要有：第一，话轮结束停顿。第二，体态语。","w":"high","e":["2020 真题"]},{"t":"试述话语衔接与话题推进的关系。","y":"论述题","p":["“已知信息——未知信息”的心理顺序在语句中对应为“话题——述题”","话语衔接中的衔接部分负载未知信息，被衔接部分成理解的关键","衔接手段是帮助受话者找回已知信息的语言机制","话题————述题形成话语的结构框架，显示话语线索"],"q":"话语一经衔接，语义理解就变得通达顺畅，这就是连贯性。人在接受信息、获取经验时具有从已知信息出发接受未知信息的特点，这使我们一旦面对新信息时，就会不由自主地去语境中回溯寻觅相关的已知信息，然后再从已知信息出发去接受理解新信息。这种“已知信息————未知信息”的心理顺序，在语句中对应为“话题————述题”，就形成了话语衔接","w":"high","e":["2019 真题","2022 真题"]},{"t":"请分析下面话语使用了哪一种衔接手段：“著名表演艺术家赵丽蓉昨天早晨7时30分在北京家中溘然辞世，享年73岁。老人临终时，三个儿子及两个孙子都在身边。”","y":"分析题","p":["使用了替代关系","“老人”与“著名表演艺术家赵丽蓉”有同指关系","有同指关系的两个词语可以在语言形式上完全不同"],"q":"这是替代关系。“老人”与“著名表演艺术家赵丽蓉”有同指关系，所以在下文要提及赵丽蓉时可用“老人”来替代。有同指关系的两个词语，可以在语言形式上完全不同。后出现的“老人”必须把它跟先出现的“著名表演艺术家赵丽蓉”联系起来，才能确认它们之间的同指关系，这样的确认过程也就成了话语衔接的过程。","w":"high","e":["2021 真题"]},{"t":"请分析下面话语属于何种话题链推进方式，并说明结构：“大屋就在苏忆视线所及的地方，它默默地伫立在灰尘蔽天的路旁，昔日的雕梁画栋不仅脱尽了当初华丽的色彩，且给人一种苍老莫名暗自忧伤的感觉。”","y":"分析题","p":["“大屋”与“它”是话题平行推进","“昔日的雕梁画栋”是对“大屋”的话题派生推进","末句零形指代与“雕梁画栋”形成话题平行推进","两种平行推进不在一个层次上"],"q":"“大屋”与“它”是话题平行推进的关系，而“昔日的雕梁画栋”的出现又是对“大屋”的一个话题派生推进，而末句有一个对“雕梁画栋”的零形指代，它与语言形态的“雕梁画栋”又形成了一对话题平行推进，而话语中的两个话题平行推进又不在一个层次上。在汉语实际话语中，以上这些推进方式往往会交错出现，从而使话题推进呈现出非常复杂的状况。","w":"normal","e":["核心考点"]}]},{"id":"xdhy_down-c02-s05","t":"第五节 语言要素的修辞","w":"high","n":19,"k":[{"t":"名词解释：修辞","y":"名词解释","p":["修辞是为增强语用表达效果对语言要素进行的选择、加工和调整","修辞是交际过程中有效运用语言要素的一种语用策略","注重语音、词语、语法三要素的巧妙配合"],"q":"修辞，是指为了增强语用表达效果，对语言要素进行的选择、加工和调整。修辞是交际过程中有效地运用语言要素的一种语用策略。","w":"high","e":["2018 真题","2020 真题","2022 真题"]},{"t":"汉语语音的音乐美主要体现在哪两个方面？","y":"简答题","p":["节奏的匀称感：要求重复，由相同的语音成分重复出现彼此呼应而造成","音韵的和谐感：要求变化，由不同的语音成分相互对比映衬而造成"],"q":"汉语语音的音乐美主要体现在两个方面：第一，节奏的匀称感，它要求重复，由于相同的语音成分重复出现彼此呼应而造成；第二，音韵的和谐感，它要求变化，由于不同的语音成分相互对比映衬而造成。","w":"high","e":["2019 真题","2021 真题"]},{"t":"简述节奏的匀称感的基本表现。","y":"简答题","p":["语音节奏的语言学基础：语音是声音流的时间切分","双声叠韵现象","押韵现象","音节组合及呼应造成节奏感（双音节化、四字格趋势）"],"q":"节奏的匀称感表现为：第一，语音节奏的语言学基础，语音是声音流的时间切分，语音音节的节奏首先是这一种语法结构和语义规律的体现；第二，双声叠韵现象，是汉语节奏感的特有体现；第三，押韵现象，是句子之间节奏感的充分表现；第四，音节组合及呼应造成节奏感，现代汉语中有两个比较明显的节奏倾向：一是构词上的“双音节化”，二是语言使用上","w":"high","e":["2020 真题"]},{"t":"名词解释：语音的表象功能","y":"名词解释","p":["表象是感知觉形象的表现","语音的表象功能能向我们提供一定的感知觉形象","汉语中的拟声词是语音实现表象功能的主要手段"],"q":"表象指的是感知觉形象的表现，包括听觉形象、视觉形象、味觉形象、嗅觉形象、触觉形象等。语音的表象功能能够跟绘画、雕塑、音乐一样，向我们提供一定的感知觉形象。","w":"high","e":["2021 真题"]},{"t":"名词解释：押韵","y":"名词解释","p":["押韵以句子为节奏单位","押韵不要求韵母完全相同，通常只是韵腹或韵腹韵尾相同","押韵方式有偶韵、奇韵、排韵、随韵、交韵等"],"q":"押韵以句子为节奏单位，这就大大扩展了节奏感在营造语言音乐美的过程中的作用。押韵并不一定要求韵母完全相同，通常只是韵腹或韵腹韵尾相同。","w":"high","e":["2019 真题"]},{"t":"简述词语与修辞中词语的选择问题。","y":"简答题","p":["古人特别讲究“炼字”，重视词语的选择","语用策略关键在于掌握词的意义和在语境中的用法","汉语不少词语本身就有感情色彩","词语修辞最容易碰到的表达问题就是近义词选择"],"q":"古人特别讲究“炼字”，也就是重视词语的选择，据说“推敲”这个词就是从一句诗里主要动词到底是用“推”好还是用“敲”好发展而来的。汉语词语有丰富的表现力，语用策略关键在于善于掌握词的意义和在语境中的用法两个方面。汉语不少词语本身就有感情色彩，例如：“超人”“恶棍”“傻瓜”“万人迷”等。这些名词语义本身就有感情评价因素，汉语","w":"high","e":["2020 真题"]},{"t":"名词解释：文化含义","y":"名词解释","p":["词在反映所指对象时还会蕴含相应的传统观念、文化心态甚至于社会偏见","形成了这个词的文化含义","了解词的文化含义必须把词语意义放在整个社会的文化大背景中去考察"],"q":"词在反映所指对象时还会蕴含相应的传统观念、文化心态甚至于社会偏见，形成了这个词的文化含义。","w":"high","e":["2021 真题"]},{"t":"名词解释：联想意义","y":"名词解释","p":["词语以语言意义为基础，在具体语境中表现出相关的语义内容产生联想意义","分为时代的联想意义、地域的联想意义、社群的联想意义、语体的联想意义"],"q":"话语交际中的词语以语言意义为基础，在具体语境中表现出相关的语义内容，于是产生了联想意义。","w":"high","e":["2019 真题"]},{"t":"名词解释：形象意义","y":"名词解释","p":["词与词在形象的表现功能上是有极大差异的","表象功能是通过词义与所指对象之间的联系而实现的","构词语素的不同会造成形象意义的强弱和性质差异"],"q":"词与词在形象的表现功能上是有极大差异的，它们的表象功能是通过词义与所指对象之间的联系而实现的。","w":"high","e":["2020 真题"]},{"t":"汉语语序的变化一般可分为哪三种类型？","y":"简答题","p":["语义变化而语法结构关系不变","语序变化同时引起语法关系的变化，称为语法语序的变化","没有引起语法关系的变化，称为语用语序的变化"],"q":"汉语语序的变化一般可分为三种类型：一种是词语语序变化后，语法结构关系不变，但是语义却变化了；一种是语序变化同时引起了语法关系的变化，称为语法语序的变化；一种是没有引起语法关系的变化，称为语用语序的变化。","w":"high","e":["2019 真题","2022 真题"]},{"t":"名词解释：语法语序的变化","y":"名词解释","p":["语序变化引起语法关系的变化","目的一是话题化，为了强调","目的二是为了上下文的连贯衔接，满足已知信息到未知信息的传递规律"],"q":"语序变化同时引起了语法关系的变化，称为语法语序的变化。相对于常规语序来说，变化语序在表达上总是有一定目的：第一，最常见的就是话题化，这是为了强调；第二，是为了上下文的连贯衔接。","w":"high","e":["2020 真题","2023 真题"]},{"t":"名词解释：语用语序的变化","y":"名词解释","p":["语用语序变化后词语所处的位置不是正常的，能产生特殊的修辞效果","一是强调后移成分，多见于书面语","二是强调前移成分，多见于口语","语法关系没有变化，主语还是主语，宾语还是宾语"],"q":"语用语序的变化，最大的特点就在于变化后词语所处的位置不是正常的，正因为它不正常，就能产生特殊的修辞效果。","w":"high","e":["2021 真题"]},{"t":"请分析下面句子中语用语序变化的修辞效果：“终于过去了，中国人民哭泣的日子，中国人民低垂着头的日子。”","y":"分析题","p":["主语跑到谓语之后的句尾，属于语用语序变化","句尾是信息焦点所在的位置，把主语放在句尾，信息被置于最突出的位置","打破人们熟悉的语序，带来较强烈的冲击力和语义吸引力"],"q":"无论哪一种主语，既为主语就必须处在句首，起码也要在动词之前。可是在语用变化中，主语却可以跑到谓语之后的句尾。例中“……日子”很长，移到句子后部，突出了句义的重点。句尾的位置是信息焦点所在的位置，把主语放在句尾，它所承载的信息就被放在了最突出的位置上，从而促使人们去感受它、体验它。而且人们熟悉的语序一旦打破，带来的就是一","w":"high","e":["2020 真题"]},{"t":"一个句子从简单变得复杂，主要有哪三个途径？","y":"简答题","p":["添枝加叶","局部发达","前后衔接"],"q":"一个句子从简单变得复杂，主要有三个途径：添枝加叶，局部发达，前后衔接。","w":"high","e":["2019 真题"]},{"t":"名词解释：紧凑句","y":"名词解释","p":["一群句子受到某种结构关系的严密控制，或彼此结构方式相同或相近，关系紧密","这样的一群句子就是紧凑句","所有的紧缩复句其实是一种关系更为密切的紧凑句"],"q":"一群句子，如果受到了某种结构关系的严密控制，或者彼此之间的结构方式相同或相近，从而给人一种关系紧密的感觉，这样的一群句子就是紧凑句；相反则是松缓句。","w":"high","e":["2021 真题"]},{"t":"试述简单句与复杂句的修辞效果差异。","y":"论述题","p":["句子从简单变复杂有三个途径：添枝加叶、局部发达、前后衔接","复杂句的修辞效果是严谨缜密，一气呵成","论证辩驳中气势逼人，叙述描写中细致绵密","简单句的效果是轻松随意，活泼自如","复杂句多见于书面语，简单句多见于口语"],"q":"如果一个句子从简单变得复杂，主要有三个途径：添枝加叶，局部发达，前后衔接。如果有某种比较复杂的内容要表达，可以尽量把它压缩在一个句子中，这时不仅需要利用每一种句子成分，而且每一个句子成分都必须承载相当多的语义分量，这时句子的结构就可能会很复杂。复杂句的修辞效果是严谨缜密，一气呵成，用在论证辩驳中则气势逼人，不容置疑；用","w":"high","e":["2019 真题","2022 真题"]},{"t":"“2+2的四音节”是现代汉语的一种重要节奏倾向，而不是唯一的节奏形式。","y":"判断题","p":["“2+2的四音节”是重要的节奏倾向，不是唯一的节奏形式","什么样的音节组合能成为节奏单位取决于音节组合的相互关系"],"q":"正确。“2+2的四音节”是现代汉语的一种重要节奏倾向，而不是唯一的节奏形式。事实上什么样的音节组合能成为节奏单位，并不取决于音节本身，而是决定于音节组合的相互关系。","w":"high","e":["2020 真题"]},{"t":"下列不属于汉语语序变化三种类型的是（　　）","y":"单项选择题","p":["语序变化三类型：语义变化、语法语序变化、语用语序变化"],"q":"D。汉语语序的变化一般可分为三种类型：语义变化而语法结构关系不变、语法语序的变化、语用语序的变化。","w":"normal","e":["核心考点"]},{"t":"现代汉语中有两个比较明显的节奏倾向：一是构词上的“______”，二是语言使用上的“______”。","y":"填空题","p":["两个节奏倾向：构词上的双音节化、语言使用上的四字格趋势"],"q":"双音节化；四字格趋势","w":"high","e":["2019 真题"]}]},{"id":"xdhy_down-c02-s06","t":"第六节 语用效果与辞格","w":"high","n":27,"k":[{"t":"名词解释：辞格","y":"名词解释","p":["辞格是为了达到某种语用效果而有意识地突破语言组合常规、进行超常搭配的特定格式","是言语行为中对语言规则或语用规则进行有效偏离的特定格式","分两大类：语义内容的超常表达、结构形式的偏离表达"],"q":"为了达到某种语用效果，人们通常在语言交际中有意识地突破语言组合的常规，进行超常的搭配，以达到特定的修辞效果。这种在言语行为中对语言规则或语用规则进行有效偏离的特定格式，就是辞格。","w":"high","e":["2018 真题","2020 真题","2022 真题"]},{"t":"辞格大致可以分为哪两大类？","y":"简答题","p":["语义内容的超常表达（超常搭配：比喻、比拟、移就、拈连；超常理解：夸张、双关、反语、借代）","结构形式的偏离表达（对偶、排比、顶真、回环、反复）"],"q":"辞格大致上可以分为两类：一是语义内容的超常表达，分为两种：第一是超常搭配，例如比喻、比拟、移就、拈连等；第二是超常理解，例如夸张、双关、反语、借代等。这类辞格在结构上形式标志不特别明显。二是结构形式的偏离表达，从而激发受话人的认知心理，以达到特定的语用效果，例如对偶、排比、顶真、回环、反复等。这类辞格在结构上往往有形式","w":"high","e":["2019 真题","2021 真题"]},{"t":"名词解释：比喻","y":"名词解释","p":["用与本体本质不同但有相似性的喻体来描写或说明本体","比喻由四个要素构成：本体、喻体、喻词、相似点","分为明喻、暗喻和借喻三种类型"],"q":"用与本体(甲)本质不同但有相似性的喻体(乙)来描写或说明本体，这种辞格叫比喻。","w":"high","e":["2018 真题","2020 真题","2023 真题"]},{"t":"比喻由哪四个要素构成？根据表达形式特征可以分为哪几种类型？","y":"简答题","p":["四个要素：本体、喻体、喻词、相似点","相似点是比喻形成的关键要素","根据表达形式特征分为明喻、暗喻、借喻三种"],"q":"从结构上说，比喻应由四个要素构成：本体、喻体、喻词、相似点。本体是被描写或说明的对象，喻体是用来作比的对象，喻词是用来联结本体和喻体的词语，本体与喻体应有相似点————相似点是比喻形成的关键要素。根据表达形式特征，比喻主要可以分为明喻、暗喻和借喻三种类型。","w":"high","e":["2019 真题","2022 真题"]},{"t":"辨析比喻中的“明喻”“暗喻”和“借喻”。","y":"辨析题","p":["明喻：甲像乙，有比喻词联结","暗喻：甲是乙，用“是”“成为”等动词联结","借喻：不出现本体和喻词，直接用喻体替代本体"],"q":"明喻是直接明白地用喻体来描写或说明本体，有“像”“似”“如”“宛如”“宛然”“仿佛”“一般”等比喻词来联结本体和喻体，典型结构式是：甲像乙。暗喻是直接将本体等同于喻体，常用“是”“成为”“成了”“等于”等动词联结本体和喻体，典型结构式是：甲是乙。借喻是不出现本体和喻词，直接用喻体替代本体来描写或说明，典型结构式为：乙(","w":"high","e":["2020 真题","2023 真题"]},{"t":"名词解释：比拟","y":"名词解释","p":["运用联想，直接将本体当作拟体进行描写或说明","比拟包含三个要素：本体、拟体、拟词","比拟只出现本体和拟词，拟体并不出现","分为拟人和拟物两类"],"q":"运用联想，直接将本体当作拟体进行描写或说明，这种辞格叫比拟。","w":"high","e":["2018 真题","2021 真题"]},{"t":"名词解释：移就","y":"名词解释","p":["将本不能描写甲事物的词语描写甲，构成修饰语与中心语的偏正关系","语义上却是描写与甲相关的人或事","分为移情式和移觉式两类"],"q":"将本不能描写甲事物的词语描写甲，构成修饰语与中心语的偏正关系，但在语义上却是描写与甲相关的人或事，这种辞格叫移就。","w":"high","e":["2019 真题"]},{"t":"名词解释：拈连","y":"名词解释","p":["将用于甲事物的词语顺势搭配到乙事物上","产生两个相关联的陈述或描写结构","分为完整式和缺省式两类"],"q":"将用于甲事物的词语顺势搭配到乙事物上，产生两个相关联的陈述或描写结构，这样的辞格叫拈连。","w":"high","e":["2020 真题"]},{"t":"名词解释：夸张","y":"名词解释","p":["故意对事物或属性的范围、数量、程度等方面进行超出或缩小等的描述","分为扩大夸张和缩小夸张两类"],"q":"故意对事物或属性的范围、数量、程度等方面进行超出或者缩小等的描述，这种辞格叫夸张。","w":"high","e":["2019 真题"]},{"t":"名词解释：双关","y":"名词解释","p":["在特定语境中利用语言要素使同一语句具有“语内”和“语外”两层意义","分为谐音式、语义式、对象式三类"],"q":"在特定的语境中，利用语言要素，使同一语句具有“语内”和“语外”两层意义，这种辞格叫双关。","w":"high","e":["2018 真题","2021 真题"]},{"t":"名词解释：反语","y":"名词解释","p":["故意使用相反的词句来表达真正意思","也叫反话","分为讽刺反语和风趣反语两类"],"q":"故意使用相反的词句来表达真正意思，这样的辞格叫反语，也叫反话。","w":"high","e":["2020 真题"]},{"t":"名词解释：借代","y":"名词解释","p":["用与本体相关的事物(代体)来指称本体","有六种常见类型：特征借代、成分借代、地名借代、作者借代、品牌借代、材料借代"],"q":"用与本体相关的事物(代体)来指称本体，这种辞格叫借代。","w":"high","e":["2019 真题","2022 真题"]},{"t":"借代有哪六种常见类型？","y":"简答题","p":["特征借代","成分借代","地名借代","作者借代","品牌借代","材料借代"],"q":"借代有以下六种常见类型：1.特征借代，用本体的某一特征指称本体；2.成分借代，用本体组成成分指称本体；3.地名借代，用与本体相关的地名指称本体；4.作者借代，用作者姓名指称其作品；5.品牌借代，用商品的品牌指称该商品；6.材料借代，用本体的材质指称本体。","w":"high","e":["2020 真题"]},{"t":"名词解释：对偶","y":"名词解释","p":["将字数相等、结构相同或相似、意义相关的两个句子或短语并举","有严式与宽式的区别","从内容上分为正对、反对、串对三类"],"q":"将字数相等、结构相同或相似、意义相关的两个句子(或短语)并举，这种辞格叫对偶。","w":"high","e":["2018 真题","2021 真题"]},{"t":"名词解释：排比","y":"名词解释","p":["用三个以上字数大体相等、结构相似、语气一致的短语或句子排列起来","分为平排和递排两类"],"q":"用三个以上字数大体相等、结构相似、语气一致的短语或句子排列起来，这种辞格叫排比。","w":"high","e":["2019 真题","2022 真题"]},{"t":"名词解释：顶真","y":"名词解释","p":["前一个句子的结尾部分作后一个句子的开头","使相邻的两个句子头尾蝉联，前后串联","也称顶针、联珠","分为词和短语顶真、句子顶真两类"],"q":"前一个句子的结尾部分作后一个句子的开头，使相邻的两个句子头尾蝉联，前后串联，这种辞格叫顶真，也称顶针、联珠。","w":"high","e":["2020 真题"]},{"t":"名词解释：回环","y":"名词解释","p":["前一个句子或句子的一部分次序颠倒，形成第二个句子","使前后两个句子内容循环往复，紧密相关","结构式是：甲+乙→乙+甲","分为严式回环和宽式回环"],"q":"前一个句子或句子的一部分次序颠倒，形成第二个句子，使前后两个句子内容循环往复，紧密相关。这种辞格叫回环。回环的结构式是：甲+乙→乙+甲。","w":"high","e":["2019 真题"]},{"t":"名词解释：反复","y":"名词解释","p":["同一个词语或句子使用两次以上","对同一语义的强化表达，以宣泄特定的感情、思想","分为连续反复和间隔反复两类"],"q":"同一个词语或句子使用两次以上，这种辞格叫反复。对同一语义的强化表达，以宣泄特定的感情、思想。","w":"high","e":["2021 真题"]},{"t":"辞格的综合运用有哪三种情形？","y":"简答题","p":["辞格连用：一个或几个辞格前后连续性地出现（同格连用、异格连用）","辞格兼用：两种或两种以上的辞格融合到一起","辞格套用：一个辞格中包含另一个或多个其他辞格"],"q":"在实际语言表达中，更为常见的是辞格综合使用。一般说来，可以有连用、兼用和套用三种情形。辞格连用：在一句话内，一个或几个辞格前后连续性地出现，可以分为同格连用和异格连用两类。辞格兼用：两种或者两种以上的辞格融合到一起。辞格套用：一个辞格中包含着另一个或多个其他的辞格。","w":"high","e":["2020 真题","2023 真题"]},{"t":"辨析“辞格连用”“辞格兼用”和“辞格套用”。","y":"辨析题","p":["连用：一个或几个辞格前后连续性地出现（同格连用、异格连用）","兼用：两种或两种以上的辞格融合到一起","套用：一个辞格中包含着另一个或多个其他的辞格","例：“史学家是凸面镜……史剧家是凹面镜”用对偶包含比喻"],"q":"辞格连用指在一句话内，一个或几个辞格前后连续性地出现，可以分为同格连用和异格连用两类。辞格兼用指两种或者两种以上的辞格融合到一起，例如“黄河，你千百年来坚韧地浇灌着华北大地……”同时融合了比拟和比喻。辞格套用指一个辞格中包含着另一个或多个其他的辞格，例如“史学家是凸面镜……史剧家是凹面镜……”用对偶包含比喻。三者的区别","w":"high","e":["2019 真题","2022 真题"]},{"t":"请分析下面话语综合使用了什么辞格及其特点：“人生有限，知识无穷。当你用汗水敬献她的时候，她和你携手前进；当你用懒惰讨好她的时候，她和你分道扬镳。”","y":"分析题","p":["综合使用了对偶、比拟和借代","前后两个对偶连用","后一个对偶套用，包含着比拟兼借代","比拟和借代是兼用"],"q":"该例综合使用了对偶、比拟和借代。前后两个对偶连用；后一个对偶套用————包含着比拟兼借代，而比拟和借代是兼用。综合使用辞格，使话语表达感情强烈，既具体形象，又音律和谐，使受话者易于理解和受到感染，从而推导发话者的交际意图。","w":"high","e":["2021 真题"]},{"t":"请指出下面句子所用的辞格并说明其修辞作用：“夕阳映照下的西湖湖面上洒满了碎银，波光粼粼，熠熠生辉。”","y":"分析题","p":["使用了借喻","“碎银”是喻体，直接替代了没有出现的本体","借喻不出现本体和喻词","典型结构式为乙代替甲"],"q":"该句使用了借喻。“碎银”是喻体，直接替代了没有出现的本体（波光/水光）。借喻是一种超常搭配，不出现本体和喻词，直接用喻体替代本体来描写或说明，其典型结构式为：乙(代替没有出现的甲)。这样描写使湖面波光具体形象、生动可感。","w":"high","e":["2020 真题"]},{"t":"名词解释：辞格连用","y":"名词解释","p":["在一句话内，一个或几个辞格前后连续性地出现","分为同格连用和异格连用两类"],"q":"在一句话内，一个或几个辞格前后连续性地出现，叫辞格的连用。它可以分为两类：同格连用和异格连用。","w":"high","e":["2019 真题"]},{"t":"名词解释：辞格兼用","y":"名词解释","p":["两种或者两种以上的辞格融合到一起","如比拟和比喻融合、夸张和比喻融合"],"q":"两种或者两种以上的辞格融合到一起，这种现象叫辞格的兼用。","w":"high","e":["2020 真题"]},{"t":"名词解释：辞格套用","y":"名词解释","p":["一个辞格中包含着另一个或多个其他的辞格","如对偶包含比喻、排比包含比喻"],"q":"一个辞格中包含着另一个或多个其他的辞格，这种现象叫辞格的套用。","w":"high","e":["2021 真题"]},{"t":"“孔夫子搬家————尽是书”运用的辞格是（　　）","y":"单项选择题","p":["借助同音词“书”与“输”形成谐音式双关"],"q":"B。例(1)借助孔夫子搬家特点“书”多，引出同音词“输”，属于谐音式双关。","w":"high","e":["2020 真题"]},{"t":"“史学家是凸面镜……史剧家是凹面镜……”用对偶包含了比喻，属于辞格的套用。","y":"判断题","p":["对偶包含比喻属于辞格的套用","清晰形象地描画出史学家与史剧家的不同特征"],"q":"正确。例(1)用对偶包含比喻，清晰而又形象地描画出史学家与史剧家的不同特征，属于辞格的套用。","w":"high","e":["2019 真题"]}]},{"id":"xdhy_down-c02-s07","t":"第七节 语体的分类与功能","w":"high","n":18,"k":[{"t":"名词解释：语体","y":"名词解释","p":["语体是语言在长期使用过程中形成的语言表达体系","为适应不同的交际语境的需要（内容、目的、对象、场合、方式等）","具有不同风格特点","通常分为口语语体和书面语体"],"q":"语体是语言在长期的使用过程中，为适应不同的交际语境的需要(内容、目的、对象、场合、方式等)而形成的具有不同风格特点的语言表达体系。","w":"high","e":["2018 真题","2020 真题","2022 真题"]},{"t":"语体有哪些基本属性？","y":"简答题","p":["系统性：由各种语言材料和手段构成的特征体系","稳定性：一旦形成便对该语体的表达形式具有约束效应","开放性：随着社会生活的变化、分工的细密而进一步分化"],"q":"语体的基本属性有：1.系统性。从形式上看，语体是由言语行为所运用的各种语言材料和手段，如词语、句子以及修辞手段等构成的特征体系。2.稳定性。语体是语言符号在长期的使用过程中形成的，一旦形成，便在一个相当长的时期对该语体的表达形式具有约束效应。3.开放性。作为语言符号的交际功能变体，语体是在运用中形成的，同时，它也将随着","w":"high","e":["2019 真题","2021 真题"]},{"t":"从语言系统性特征给语体分类，语体可以分为口头语体和书面语体。口头语体又可分为______和______。","y":"填空题","p":["口头语体分日常谈话语体、正式演说语体"],"q":"日常谈话语体；正式演说语体","w":"high","e":["2020 真题"]},{"t":"口语语体等于口语，书面语体等于书面语。","y":"判断题","p":["口语语体不等于口语，书面语体不等于书面语","划分主要根据是语言符号组织构成的系统特征","而不是根据语音/文字的传递方式"],"q":"错误。口语语体不等于口语(口头表达)，书面语体也不等于书面语(文字表达)。口语语体和书面语体划分主要根据，是语言符号组织构成的系统特征，而不是根据语音/文字的传递方式。书面语体可用口头语音表达，口语语体也可以用文字写出。","w":"high","e":["2019 真题","2022 真题"]},{"t":"简述口头语体的主要特点。","y":"简答题","p":["辅助言语手段的参与","语音手段的充分运用","通俗易懂的生活化用词","灵活多变、简短轻便的句子形式","极富生活化的修辞格式","游离的话题中心、随机不定的话轮转换"],"q":"口头语体指为适应现场交际语境的需要而形成的口头话语表达体系。其主要特点是：1.辅助言语手段的参与；2.语音手段的充分运用；3.通俗易懂的生活化用词；4.灵活多变、简短轻便的句子形式；5.极富生活化的修辞格式；6.游离的话题中心、随机不定的话轮转换。","w":"high","e":["2020 真题","2023 真题"]},{"t":"简述书面语体的主要特点。","y":"简答题","p":["常用词语、术语及文言词的选用","句子结构成分完备，较少省略、跳脱，限制语及修饰语复杂","语序结构总体上相对固定，合乎常规","强调形式上的均衡、对称效果","话题中心突出，分话题围绕总话题展开","丰富多彩、形式齐备的辞格表达"],"q":"书面语体是指为适应不同交际语境的需要而形成的书面话语表达体系。其特点有：1.常用词语、术语及文言词的选用；2.句子结构成分完备，较少省略、跳脱，限制语及修饰语复杂；3.语序结构总体上相对固定，合乎常规；4.强调形式上的均衡、对称效果；5.话题中心突出，分话题围绕总话题展开；6.丰富多彩、形式齐备的辞格表达。","w":"high","e":["2019 真题","2022 真题"]},{"t":"六种主要语体分别是哪六种？","y":"简答题","p":["日常谈话语体","正式演说语体","大众传播语体","公文事务语体","科学技术语体","文艺语体"],"q":"六种主要语体是：日常谈话语体、正式演说语体、大众传播语体、公文事务语体、科学技术语体、文艺语体。","w":"high","e":["2018 真题","2021 真题"]},{"t":"名词解释：公文事务语体","y":"名词解释","p":["公文事务语体是在社会公众语境中关涉公务或行政管理主题的话语表达体系","又称公文体","只能是书面语体","有四个特点：书面语色彩浓厚、用词客观准确、以陈述句和祈使句为主、固定的行文格式"],"q":"公文事务语体，是指在社会公众语境中关涉公务或行政管理主题的话语表达体系，又称公文体。","w":"high","e":["2020 真题"]},{"t":"名词解释：科学技术语体","y":"名词解释","p":["科学技术语体是关涉科学研究、教育等主题进行交际所形成的话语表达体系","又称科技体、智慧体或知识体","特点包括特殊符号、专业术语外来语、结构紧凑多用复句、风格平实朴素"],"q":"科学技术语体，指关涉科学研究、教育等主题进行交际所形成的话语表达体系。科学技术语体又称科技体、智慧体或知识体。","w":"high","e":["2019 真题"]},{"t":"名词解释：文艺语体","y":"名词解释","p":["文艺语体是以语言文字为工具、形象化地反映客观现实的话语表达体系","也称文学语体、艺术语体","通过作者情感直接或间接的表达，感染受话者引起共鸣","有六个主要特征：韵律美、强调色彩形象、句式活泼、语言规则变异、大量使用辞格、话题中心含蓄"],"q":"文艺语体是以语言文字为工具，形象化地反映客观现实的话语表达体系，也称为“文学语体”“艺术语体”。","w":"high","e":["2019 真题","2022 真题"]},{"t":"名词解释：网络语体","y":"名词解释","p":["网络语体是利用互联网即时通讯工具和社交平台进行交际而形成的话语表达体系","兼有口语语体和书面语体的特点","具有视觉性、即时性和非当面性等特征","体现网络用户崇尚个性、追求新奇、戏谑娱乐、热衷模仿等社交心态"],"q":"网络语体，指的是利用互联网即时通讯工具和社交平台进行交际而形成的话语表达体系。","w":"high","e":["2020 真题","2023 真题"]},{"t":"网络语体有哪些语言特征？","y":"简答题","p":["词语创新立异","句式混用","辞格兼用"],"q":"网络语体的语言特征主要有：1.词语创新立异，除了使用规范词语之外，也自造很多词语，追求视觉上的冲击力；2.句式混用，句式表达形式较随意，有时会不按传统规则写句，例如出现多语混合句或句法不规范的现象；3.辞格兼用，网络语体追求表达的独特和效果，积极吸收、模仿传统的修辞格式，创造出富有想象力的生动、幽默的形式。","w":"high","e":["2021 真题"]},{"t":"名词解释：网络流行体","y":"名词解释","p":["网络流行体是在网络交际中快速传播、具有一定时效性的文本模块","通常根据其特征被称为“体”","起源于文学作品、影视节目、社会事件、网民原创等","篇幅短小，格式固定，内容新颖，易于复制"],"q":"网络流行体指的是在网络交际中快速传播，具有一定时效性的文本模块，通常根据其特征被称为“体”。","w":"high","e":["2020 真题"]},{"t":"名词解释：正式演说语体","y":"名词解释","p":["演说语体是说明事理、表明自己观点的话语表达体系","有鲜明的话题中心","句式简短，表情色彩强烈"],"q":"演说语体指的是说明事理，表明自己观点的话语表达体系。它句式简短，表情色彩强烈，普遍使用具有表情色彩和描绘色彩的词句。","w":"high","e":["2019 真题"]},{"t":"名词解释：大众传播语体","y":"名词解释","p":["大众传播语体是在公众生活语境中关涉大众和社会生活主题的话语表达体系","带有明显的公众性和有备性","语言表达上有倾向性和感染力"],"q":"大众传播语体，是指在公众生活语境中关涉大众和社会生活主题的话语表达体系。","w":"high","e":["2020 真题"]},{"t":"名词解释：日常谈话语体","y":"名词解释","p":["谈话语体是人们日常交谈活动的话语表达体系","对语言环境的依赖性强","经常使用省略形式，句子比较简短","语音上常夹杂超语言的剩余部分，允许音变"],"q":"谈话语体指的是人们日常交谈活动的话语表达体系，所用词语极为丰富。","w":"high","e":["2019 真题"]},{"t":"下列不属于书面语体分类的是（　　）","y":"单项选择题","p":["日常谈话语体属于口头语体，不属于书面语体"],"q":"D。口头语体可分为日常谈话语体、正式演说语体；书面语体可分为大众传播语体、公文事务语体、科学技术语体。","w":"high","e":["2020 真题"]},{"t":"网络语体兼有口语语体和书面语体的特点。","y":"判断题","p":["网络语体兼有口语语体和书面语体的特点","具有视觉性、即时性和非当面性等特征"],"q":"正确。网络语体兼有口语语体和书面语体的特点，具有视觉性、即时性和非当面性等特征。","w":"high","e":["2021 真题"]}]},{"id":"xdhy_down-c02-s08","t":"第八节 病句的类型与修改","w":"high","n":33,"k":[{"t":"名词解释：病句","y":"名词解释","p":["病句指不合规范的句子","规范包括三个方面：符合语法组合规则、符合语义搭配要求、符合语用表达习惯","产生病句的原因可能涉及语法、语义和语用多个层面"],"q":"所谓病句，就是指不合规范的句子；所谓规范，一是要符合语法组合规则，二是要符合语义的搭配要求，三是要符合语用的表达习惯。","w":"high","e":["2019 真题","2022 真题"]},{"t":"确定一个句子是否病句，要注意哪几点？","y":"简答题","p":["语言是复杂的，不要用片面教条衡量","语言是发展的，要具有历史的发展的眼光","语言常常是超越逻辑的"],"q":"确定一个句子是否病句，要注意几点：第一，语言是复杂的。语言规则是多方面的，千万不要用某种现成的但却是片面的教条来作为衡量句子是不是合乎规范的标准。第二，语言是发展的。当年认为是不规范的句子，由于群众的广泛使用，这种句子的用法逐渐已经被接受，因此我们必须具有历史的发展的眼光。第三，语言常常是超越逻辑的。任何一个合法的句子","w":"high","e":["2020 真题"]},{"t":"修改病句有哪几条原则？","y":"简答题","p":["忠于原意的原则","从简不从繁的原则","尽量维持原句结构的原则","修改跟造成病句的原因保持一致的原则","以“忠于原意”的原则为根本"],"q":"修改病句有四原则：1.忠于原意的原则；2.从简不从繁的原则；3.尽量维持原句结构的原则；4.修改跟造成病句的原因保持一致的原则。修改病句的四原则，是以“忠于原意”的原则为根本的一个有机整体。","w":"high","e":["2018 真题","2021 真题","2023 真题"]},{"t":"名词解释：从简不从繁的原则","y":"名词解释","p":["从简不从繁指在修改病句时以改动最少为准则","只需调动语序的就不随意加减词语","只需加减一个词语的就不加减两个词语"],"q":"所谓从简不从繁，就是指在修改病句时，以改动最少为准则。凡是只需要调动语序的就不随意加减词语，凡是只需要加减一个词语的，就不加减两个词语。","w":"high","e":["2019 真题"]},{"t":"名词解释：紧缩法","y":"名词解释","p":["紧缩法是先检查句子的“主干”再检查句子“枝叶”的一种方法","首先检查主语中心、谓语中心、宾语中心之间能否搭配、有无残缺或多余","再检查定语、状语或补语与其中心语等能否搭配"],"q":"紧缩法是先检查句子的“主干”再检查句子“枝叶”的一种方法。其步骤是首先检查主语(中心)、谓语(中心)、宾语(中心)之间能否搭配、有无残缺或多余等。","w":"high","e":["2020 真题","2022 真题"]},{"t":"名词解释：类比法","y":"名词解释","p":["类比法是造出一些相类似的格式来同原句比较、以判断原句正误的方法"],"q":"类比法是造出一些相类似的格式来同原句比较，以判断原句正误的一种方法。","w":"high","e":["2019 真题","2021 真题"]},{"t":"语法病句可以分为哪几种类型？","y":"简答题","p":["词性不对","虚词不妥","成分残缺","结构杂糅"],"q":"语法病句类型有：1.词性不对，指在某个句法位置上应该出现这类词，却用了另外一类词；2.虚词不妥，汉语的虚词极为丰富，不仅用法复杂，而且语义微妙，稍微不注意，就会用错；3.成分残缺，指不符合隐含、省略的条件而缺少应有的句法成分；4.结构杂糅，指把两种不同的说法硬凑在一起，把两种不同的结构套叠在一起，以致造成结构不合法则，","w":"high","e":["2019 真题","2022 真题"]},{"t":"名词解释：成分残缺","y":"名词解释","p":["成分残缺指不符合隐含、省略的条件而缺少应有的句法成分","出现一个成分，与之匹配的另一个成分就必须出现","包括主语残缺、谓语残缺、宾语残缺、修饰语残缺、补语残缺"],"q":"句法成分残缺，是指不符合隐含、省略的条件而缺少应有的句法成分。","w":"high","e":["2020 真题"]},{"t":"名词解释：结构杂糅","y":"名词解释","p":["结构杂糅指把两种不同的说法硬凑在一起，把两种不同的结构套叠在一起","造成结构不合法则，语义混乱费解","包括格式套叠和句式杂糅两类"],"q":"所谓的句法结构杂糅，是指把两种不同的说法硬凑在一起，把两种不同的结构套叠在一起，以致造成结构不合法则，语义混乱费解。","w":"high","e":["2019 真题"]},{"t":"语义病句可以分为哪几种类型？","y":"简答题","p":["搭配不当：主谓搭配不当、述宾搭配不当、主宾搭配不当、偏正搭配不当、述补搭配不当","表述歧义"],"q":"语义病句类型有：1.搭配不当，指相互搭配的成分在语义上不能贯通，包括主谓搭配不当、述宾搭配不当、主宾搭配不当、偏正搭配不当、述补搭配不当；2.表述歧义，语义的表达要明确，不能有歧义。","w":"high","e":["2020 真题","2022 真题"]},{"t":"名词解释：搭配不当","y":"名词解释","p":["搭配不当指相互搭配的成分在语义上不能贯通","涉及主语与谓语、述语与宾语、述语和补语、修饰语与中心语","语法上合法并不一定语义上能搭配"],"q":"所谓的搭配不当，通常情况下，是指这些相互搭配的成分在语义上不能贯通。","w":"high","e":["2019 真题","2021 真题"]},{"t":"语用病句可以分为哪几种类型？","y":"简答题","p":["成分多余：主语多余、谓语多余、宾语多余、修饰语多余、补语多余","语序有误：定心错位、定状错置、状补错置、状语错位、误补为定、多层定语语序混乱、多层状语语序混乱"],"q":"语用病句类型有：1.成分多余，指句子中的语义相同的成分重复出现，或者出现了不应该出现的成分，以致造成语义啰唆甚至不合逻辑，包括主语多余、谓语多余、宾语多余、修饰语多余、补语多余；2.语序有误，指一些句子成分倒置了应有的语序，以致造成语义模糊或不合逻辑，包括定心错位、定状错置、状补错置、状语错位、误补为定、多层定语语序混","w":"high","e":["2020 真题","2023 真题"]},{"t":"名词解释：成分多余","y":"名词解释","p":["成分多余指句子中语义相同的成分重复出现或出现了不应该出现的成分","造成语义啰唆甚至不合逻辑","包括主语多余、谓语多余、宾语多余、修饰语多余、补语多余"],"q":"所谓的成分多余，是指句子中的语义相同的成分重复出现，或者出现了不应该出现的成分，以致造成语义啰唆甚至不合逻辑。","w":"high","e":["2019 真题"]},{"t":"名词解释：语序有误","y":"名词解释","p":["语序有误指一些句子成分倒置了应有的语序","造成语义模糊或不合逻辑","包括定心错位、定状错置、状补错置、状语错位、误补为定、多层定语/状语语序混乱"],"q":"所谓的语序有误，是指一些句子成分倒置了应有的语序，以致造成语义模糊或不合逻辑。","w":"high","e":["2020 真题"]},{"t":"复句常见的病句类型主要发生在哪三个方面？","y":"简答题","p":["分句间意义上缺乏联系","分句间次序层次混乱","关联词语使用不当"],"q":"复句常见的病句类型，跟单句有所不同。主要发生在分句间意义上缺乏联系，分句间次序层次混乱以及关联词语使用不当这三个方面。","w":"high","e":["2019 真题","2022 真题"]},{"t":"关联词语使用不当包括哪几种情况？","y":"简答题","p":["关联词语与分句间的逻辑意义相悖","关联词语滥用","关联词语欠用","关联词语搭配不当","关联词语位置有误"],"q":"关联词语使用不当包括：1.关联词语与分句间的逻辑意义相悖；2.关联词语滥用；3.关联词语欠用；4.关联词语搭配不当；5.关联词语位置有误。","w":"high","e":["2020 真题"]},{"t":"请用紧缩法分析并修改下面的病句：“建桥工人充分发扬了不怕苦、不怕累的精神和团结互助的友情。”","y":"分析题","p":["紧缩为“工人发扬……精神和……友情”","“发扬”与“精神”能搭配，但与“友情”不能搭配","属于动宾搭配中顾此失彼的毛病","改为“发扬了不怕苦、不怕累的精神和团结互助的风格”"],"q":"紧缩法是先检查句子的“主干”再检查句子“枝叶”的一种方法。A句紧缩为“工人发扬……精神和……友情”后，即可发现，“发扬”与“精神”能够搭配，但与“友情”不能搭配，属于动宾搭配中顾此失彼的毛病，可改为“建桥工人充分发扬了不怕苦、不怕累的精神和团结互助的风格”。","w":"high","e":["2019 真题","2021 真题"]},{"t":"请用类比法分析下面的句子是否有毛病：“歌声突然变得格外亲切而且动人多了。”","y":"分析题","p":["类比原句格式仿造若干句子进行判断","A、B、C三式都有毛病，“十分”“特别”“格外”与“多”语义重复","B式和C式还犯了结构杂糅的毛病","D句正确，据此修改为“歌声突然变得格外亲切，而且动人多了”"],"q":"该例似是而非，一时难于判定其正误。那么，就可以类比原句格式“格外亲切而且动人多了”来仿造若干个句子：A.*十分整齐、干净多了。B.*特别香甜可口多了。C.*格外美丽而且雄伟多了。D.分外明亮，而且清洁多了。A、B、C三式都有毛病，因为“十分”“特别”“格外”与“多”语义重复；B式和C式还把状心短语和述补短语套合在一起，","w":"high","e":["2020 真题"]},{"t":"请指出下面病句的类型并修改：“秋天的北京是一年中最长最美的季节。”","y":"分析题","p":["属于主宾搭配不当","主语中心语是“北京”，不可能是“季节”","改为“北京的秋天是……季节”"],"q":"该句属于搭配不当中的主宾搭配不当。主语中心语是“北京”，所以不可能是“季节”，可能是受到“秋天”的误导，应改为“北京的秋天是……季节”。","w":"high","e":["2021 真题"]},{"t":"请指出下面病句的类型并修改：“一阵急促的敲门声打破了宁静的夜晚。”","y":"分析题","p":["属于定心错位","定心错位指定语与中心语的语序错误地颠倒","宾语“宁静的夜晚”应改为“夜晚的宁静”"],"q":"该句属于语序有误中的定心错位。所谓定心错位，是指定语与中心语的语序错误地颠倒了。宾语“宁静的夜晚”应改为“夜晚的宁静”。","w":"high","e":["2020 真题"]},{"t":"请指出下面病句的类型并修改：“只有从思想上解决为什么人的问题，就能更好地为人民服务。”","y":"分析题","p":["属于关联词语搭配不当","“只有”不能跟“就”配搭","可改为“只有……才”或“只要……就”"],"q":"该句属于复句病句中的关联词语搭配不当。关联词语“只有”不能跟“就”配搭，可改为“只有……才”，或改为“只要……就”。","w":"high","e":["2019 真题"]},{"t":"语言是发展的，请举例说明有些当年被认为是病句的说法现在已经被接受。","y":"分析题","p":["语言是发展的，要具有历史的发展的眼光","《语法修辞讲话》曾批评“战机”“劳改”是“生造词语”","曾批评“转变”是不及物动词不能带宾语","现在这些用法已被接受"],"q":"确定一个句子是否病句，要具有历史的发展的眼光。例如20世纪50年代初《语法修辞讲话》曾经批评过“我军为寻找有利战机……”“释放的释放，劳改的劳改⋯⋯”，认为其中“战机”“劳改”是“生造词语”，还批评“转变了过去站在生产之外，空喊保证生产的作风”中的“转变”是不及物动词，所以不能带宾语，而现在我们再也不认为“战机”“劳改","w":"high","e":["2021 真题"]},{"t":"试述修改病句的四条原则及其相互关系。","y":"论述题","p":["忠于原意的原则","从简不从繁的原则","尽量维持原句结构的原则","修改跟造成病句的原因保持一致的原则","四原则是以“忠于原意”为根本的有机整体，违背一个往往也违背其他三个"],"q":"修改病句有四原则：1.忠于原意的原则，就是修改后的病句，应该尽量保持句子原来的意义。2.从简不从繁的原则，指在修改病句时以改动最少为准则，凡是只需要调动语序的就不随意加减词语，凡是只需要加减一个词语的，就不加减两个词语。3.尽量维持原句结构的原则，指在修改病句中，不调整原句语法结构就足以把句子改通顺时，就不要轻易地变动","w":"high","e":["2018 真题","2020 真题","2022 真题"]},{"t":"确定一个句子是否病句时，可以用某种现成的但却是片面的教条来作为衡量句子是不是合乎规范的标准。","y":"判断题","p":["语言规则是多方面的","不能用现成而片面的教条作为衡量句子是否合乎规范的标准"],"q":"错误。语言是复杂的，语言规则是多方面的，千万不要用某种现成的但却是片面的教条来作为衡量句子是不是合乎规范的标准。","w":"high","e":["2019 真题"]},{"t":"“由于计算机应用技术的提高，为高校文科开展多媒体教学研究打下良好的技术基础。”属于（　　）","y":"单项选择题","p":["因滥用介词而造成主语残缺","去掉介词“由于”就可以了"],"q":"B。例中因滥用介词“由于”而造成主语残缺，只要去掉介词“由于”就可以了。","w":"high","e":["2020 真题"]},{"t":"修改病句常用的两种辅助方法是______和______。","y":"填空题","p":["修改病句有两种常用的辅助方法：紧缩法、类比法"],"q":"紧缩法；类比法","w":"high","e":["2019 真题"]},{"t":"名词解释：表述歧义","y":"名词解释","p":["语义的表达要明确，不能有歧义","产生歧义的原因很复杂","不管哪种歧义在表达上都要力求避免"],"q":"语义的表达要明确，不能有歧义。产生歧义的原因是很复杂的，但是不管哪种歧义，在表达上都是要力求避免的。","w":"high","e":["2021 真题"]},{"t":"请指出下面句子的歧义并修改：“国庆晚会上，十几个少数民族的同学跳起了欢快的民族舞蹈。”","y":"分析题","p":["“十几个少数民族的同学”可以有两种切分","“十几个少数民族的/同学”或“十几个/少数民族的同学”","改为“少数民族的十几个同学”或“分属十几个少数民族的同学”"],"q":"关键是“十几个少数民族的同学”可以有两种切分，“十几个少数民族的/同学”或“十几个/少数民族的同学”，所以要改为“少数民族的十几个同学”或“分属十几个少数民族的同学”。这属于表述歧义。","w":"high","e":["2020 真题"]},{"t":"名词解释：虚词不妥","y":"名词解释","p":["虚词不妥指汉语虚词用法复杂、语义微妙，容易用错","属于语法病句类型之一"],"q":"虚词不妥，是指汉语的虚词极为丰富，不仅用法复杂，而且语义微妙，稍微不注意，就会用错。","w":"high","e":["2019 真题"]},{"t":"名词解释：词性不对","y":"名词解释","p":["词性不对指在某个句法位置上应该出现这类词却用了另外一类词","属于语法病句类型之一"],"q":"词性不对是指在某个句法位置上应该出现这类词，却用了另外一类词。","w":"high","e":["2020 真题"]},{"t":"请指出下面病句的类型并修改：“湖面上倒影着点点白帆。”","y":"分析题","p":["属于词性不对","“倒影”是名词，不能带宾语","应改为“倒映”"],"q":"该句属于词性不对。“倒影”是名词，不能带宾语，应该改为“倒映”。","w":"high","e":["2019 真题"]},{"t":"请指出下面病句的类型并修改：“他丰富的发言，吸引着所有的听众。”","y":"分析题","p":["属于偏正搭配不当","定语“丰富”与中心语“发言”语义上不照应","应改为“精彩的发言”"],"q":"该句属于搭配不当中的偏正搭配不当。定语“丰富”与中心语“发言”，语义上不照应，应改为“精彩的发言”。","w":"high","e":["2020 真题"]},{"t":"“大家先把这个问题考虑，以后再抽时间研究。”可以改为（　　）","y":"单项选择题","p":["把字句对谓语部分必须是复杂的","改为主动句则结构变化、处置义消失","正确改法为“大家先把这个问题考虑一下”"],"q":"C。A句不符合把字句对谓语部分必须是复杂的基本要求；如果改成B句，虽然通顺了，但由于改成了主动句，结构发生了变化，处置义也没有了，正确的改法应该是C句。","w":"high","e":["2021 真题"]}]}]}]},{"d":"rumen","t":"对外汉语教学入门（第3版）","c":[{"id":"rumen-c01","t":"第一章 总论","w":"high","s":[{"id":"rumen-c01-s01","t":"第一节 学科性质","w":"high","n":7,"k":[{"t":"对外汉语教学","y":"名词解释","p":["对外汉语教学，指教师将汉语交际技能及相关汉语知识传授给海外非母语者的过程。","作为一门新兴学科，对外汉语教学是在20世纪80年代出现的。","它并不是一门独立学科，而是一门交叉学科。"],"q":"对外汉语教学，指教师将汉语交际技能及相关汉语知识传授给海外非母语者的过程。作为一门新兴学科，对外汉语教学是在20世纪80年代出现的。它并不是一门独立学科，而是一门交叉学科。","w":"high","e":["教材高频"]},{"t":"广义应用语言学","y":"名词解释","p":["广义应用语言学，原来指把语言学的理论、方法、知识应用于其他学科领域，解决某一单独学科无法解决的问题。","随着社会发展和学科交叉日益成熟，广义应用语言学的含义有所扩大。","从严格意义上来讲，广义的应用语言学并不是一门学科。"],"q":"广义应用语言学，原来指把语言学的理论、方法、知识应用于其他学科领域，解决某一单独学科无法解决的问题。例如，把语言学应用于社会学，研究不同社会阶层、行业、群体在语言使用中的区别，从而形成社会语言学。","w":"normal","e":["核心考点"]},{"t":"狭义应用语言学","y":"名词解释","p":["狭义应用语言学，主要指语言教学，尤指第二语言或外语教学。","赵金铭(2001)认为，中国应用语言学(语言教学)有两个分支：汉语教学和外语教学。","被应用的知识主要有两个方面：理论语言学与描写语言学；跟语言学相关的学科。"],"q":"狭义应用语言学，主要指语言教学，尤指第二语言或外语教学。赵金铭 (2001)认为，中国应用语言学(语言教学) 有两个分支：汉语教学和外语教学。","w":"normal","e":["核心考点"]},{"t":"汉语国际教育","y":"名词解释","p":["汉语国际教育最早出现在为培养汉语师资的硕士生培养方案中。","2007年初，国务院学位办批准试办汉语国际教育硕士专业学位。","2014年，原有的培养汉语教师本科专业的名称从“对外汉语”改为“汉语国际教育”。"],"q":"汉语国际教育 (Teaching Chinese to Speakers of Other Languages)  最早出现在为培养汉语师资的硕士生培养方案中。2007 年初，国务院学位办批准试办汉语国际教育硕士专业学位。","w":"normal","e":["核心考点"]},{"t":"华语(华文)教学","y":"名词解释","p":["华语(华文)教学主要指对海外华裔子弟的汉语教学。","因民族、血缘关系，学习者跟中国有密切关系。","学习内容有汉语，也有大量中华文化传统知识。"],"q":"华语(华文) 教学 (Chinese Teaching)  主要指对海外华裔子弟的汉语教学。","w":"normal","e":["核心考点"]},{"t":"对外汉语教学作为一门学科，有哪三个含义?","y":"简答题","p":["教学：教学是“教师把知识、技能传授给学生的过程”。这个教学过程涉及四个部分：总体设计，教材编写，教学实施，测试。","学科：作为一个学科，对外汉语教学包括教学，也包括跟教学相关的理论研究和系统研究。其基础学科是语言学、心理学、教育学。","事业：对外汉语教学是国家、民族的事业。1987年成立由国务院11个部门组成的国家对外汉语教学领导小组，下设办公室(国家汉办)。"],"q":"三、对外汉语教学的三个含义 (一) 教学 教学是“教师把知识、技能传授给学生的过程”……(二) 学科 作为一个学科，对外汉语教学包括教学，也包括跟教学相关的理论研究和系统研究……(三) 事业 对外汉语教学是国家、民族的事业。","w":"high","e":["教材高频"]},{"t":"简述“教什么”“如何学”“怎么教”三者的含义及其关系。","y":"简答题","p":["教什么，指选择什么知识、技能让学生学习，必须考虑可学性，不能把中国人掌握的都教给学生。","怎样教，指用什么教学方法、教学顺序、教学手段，才能取得最佳教学效果。","怎么学，指学生按什么顺序、用什么策略机制学习语言知识，掌握交际技能。","如果不研究这三者，就可能将对母语汉语者的教学内容放进非母语者的教学，或把语言研究中语言项目的次序搬到对外汉语教学中。"],"q":"具体来说，可以研究“教什么”“如何学”“怎么教”，研究这三者之间的关系……教什么，指选择什么知识、技能让学生学习，必须考虑可学性……怎样教，指用什么教学方法、教学顺序、教学手段，才能取得最佳教学效果； 怎么学，指学生按什么顺序、用什么策略机制学习语言知识，掌握交际技能。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c01-s02","t":"第二节 语言学习的基本概念","w":"high","n":13,"k":[{"t":"目的语","y":"名词解释","p":["目标语(target language)指学习者正在学习的语言。","它涵盖性强，可以包括第一语言、第二语言、母语、外语、本族语、非本族语、标准语、方言等。","不管是什么语言，只要是一个人正在学习的语言，都可以称为目的语。"],"q":"目标语(target language) 指学习者正在学习的语言。它涵盖性强，可以包括第一语言、第二语言、母语、外语、本族语、非本族语、标准语、方言等。","w":"high","e":["教材高频"]},{"t":"第一语言","y":"名词解释","p":["第一语言(first language)通常指孩子最早习得的语言，也就是从父母或其他人那里自然习得的语言。","第一语言跟母语、本族语有一定区别。母语传统上指本国或本民族的语言，本族语指本民族的语言。","从语言学习角度看，“第一语言”的概念较为科学，更有包容性。"],"q":"第一语言(first language) 通常指孩子最早习得的语言，也就是从父母或其他人那里自然习得的语言。第一语言跟母语、本族语有一定区别。","w":"high","e":["教材高频"]},{"t":"第二语言","y":"名词解释","p":["第二语言(second language)指在第一语言之后再学习的其他语言。","在应用语言学领域，第一语言之外学习的其他语言统称为第二语言。","第二语言指在目的语环境中学习的外语，外语指在非目的语语言环境里学习的外语。"],"q":"第二语言 (second language) 指在第一语言之后再学习的其他语言。在双语、多语流行地区，不少人在第二语言之外，还学习其他语言。……第二语言指在目的语(所学语言) 环境中学习的外语，如外国人在中国学习的汉语。","w":"high","e":["教材高频"]},{"t":"习得","y":"名词解释","p":["习得(acquisition)指从周围环境中自然学习获得某种能力。","习得无需专门的教师和教学。人的第一语言都是通过习得方式掌握的。","第二语言也可能自然习得。儿童少年习得第二语言比较容易。"],"q":"习得 (acquisition) 指从周围环境中自然学习获得某种能力。如幼儿站立、行走、饮食的能力，就是自然习得的。习得无需专门的教师和教学。","w":"high","e":["教材高频"]},{"t":"学习","y":"名词解释","p":["学习(learning)指从阅读、听讲、研究、实践、训练中获得知识和技能。","多指在专门场所由专门教师实施的专门教学，有教学计划、教材、教学实施和测试。","在许多情况下，成人第二语言是通过学校正规教育，通过系统的学习获得的。"],"q":"学习 (learning) 指从阅读、听讲、研究、实践、训练中获得知识和技能。多指在专门场所由专门教师实施的专门教学，有教学计划、教材、教学实施和测试。","w":"normal","e":["核心考点"]},{"t":"强化论","y":"名词解释","p":["强化论理论依据是行为主义的刺激反应论，代表人物是斯金纳。","认为儿童学习说话就是对环境或成人话语做出合适的反应，反应正确，就会得到奖励，使之受到强化并形成语言习惯。","它重形式轻意义，难以解释复杂一些的习得现象。"],"q":"强化论(reinforcement theory)  理论依据是行为主义的刺激反应论, 代表人物是斯金纳 (B. F. Skinner)。认为儿童学习说话就是对环境或成人话语做出合适的反应，反应正确，就会得到奖励，使之受到强化并形成语言习惯。","w":"normal","e":["核心考点"]},{"t":"内在论","y":"名词解释","p":["内在论理论基础是心灵主义，代表人物是乔姆斯基。","认为儿童天生具有语言习得机制，使其能对接触的语料进行处理。","内在论认为语言是一种以规则为基础的复杂系统，儿童习得语言就是将这些规则“内在化”。"],"q":"内在论(innate theory)   理论基础是心灵主义，代表人物是乔姆斯基(A. N. Chomsky)。认为儿童天生具有语言习得机制，使其能对接触的语料进行处理。","w":"normal","e":["核心考点"]},{"t":"认知论","y":"名词解释","p":["认知论代表人物是皮亚杰。","认为人有两种组织功能：“功能不变式”和“认知图式”。","儿童的语言发展，是天生能力和客观经验相互作用的结果。"],"q":"认知论 (cognitive theory)  代表人物是皮亚杰(J. Piaget)。认为人有两种组织功能：一是遗传的心理功能，决定如何与环境相互作用并向环境学习，称为“功能不变式”。","w":"normal","e":["核心考点"]},{"t":"简述儿童第一语言习得和成人第二语言学习在主体、动机、环境、方式等方面的差异。","y":"简答题","p":["主体：第一语言习得的主体是儿童，可塑性强，能自然习得地道的发音；第二语言学习的主体主要是成年人，过了语言学习的临界期，语言学习能力逐步下降。","动机：儿童习得母语出于生存本能，动力天然；成人学习第二语言目的不一，动机相对没有儿童那么强。","环境：儿童是在自然环境中习得母语；成人学习第二语言大多在课堂，接触时间有限。","方式：儿童把母语和概念以及概念之间的关系联系在一起进行学习；成人常要通过母语来联结概念与声音的关系。"],"q":"二者有许多共同点，如都是为了获得语言交际能力，都要经过理解、模仿、记忆、应用等阶段……下面主要讨论儿童第一语言习得和成人第二语言学习的区别。(一) 主体……(二) 动机……(三) 环境……(四) 方式……","w":"high","e":["教材高频"]},{"t":"母语、本族语和第一语言三个概念完全相同。","y":"判断题","p":["母语传统上指本国或本民族的语言，本族语指本民族的语言，第一语言指孩子最早习得的语言。","三者在移民、双语环境中可能分离，例如中国汉族人移居美国，其后代先习得英语，英语是其第一语言和本国语，但不是本族语。","从语言学习角度看，“第一语言”的概念较为科学，更有包容性。"],"q":"第一语言跟母语、本族语有一定区别。母语传统上指本国或本民族的语言，本族语指本民族的语言。表面看这三个概念有一些重叠，有时似乎一样。其实不然。","w":"normal","e":["核心考点"]},{"t":"第二语言指在目的语环境中学习的外语；____指在非目的语语言环境里学习的外语。","y":"填空题","p":["第二语言指在目的语(所学语言)环境中学习的外语，如外国人在中国学习的汉语。","外语指在非目的语语言环境里学习的外语，如中国人在国内学习的英语。"],"q":"第二语言和外语的区别还可根据另一个标准区分：第二语言指在目的语(所学语言) 环境中学习的外语，如外国人在中国学习的汉语，中国人在法国学习的法语；外语指在非目的语语言环境里学习的外语。","w":"normal","e":["核心考点"]},{"t":"按时间顺序，幼儿习得第一语言的正确顺序是（　）。","y":"单项选择题","p":["(1)前语言阶段：婴儿出生1~2个月后就可以分辨出语音和非语音的区别。","(2)单词句阶段：1~1.5岁，开始说话。","(3)双词句阶段：1.5~2岁，有了初步语法。","(4)多词句阶段：2~3岁，能用两个以上的词组句。","(5)复杂句和语篇阶段：4~5岁，掌握基本语法。"],"q":"(1) 前语言阶段……(2) 单词句阶段：1~1.5岁，开始说话……(3) 双词句阶段：1.5~2岁，有了初步语法……(4) 多词句阶段：2~3岁……(5) 复杂句和语篇阶段：4~5岁，掌握基本语法。","w":"normal","e":["核心考点"]},{"t":"心理学家加涅(R. M. Gagné)将学习分成由低级到高级的八种类型，其中前五种属行为主义心理学的是（　）。","y":"单项选择题","p":["信号学习、刺激——反应学习、连锁学习、多种辨别学习、言语联结学习属行为主义心理学。","概念学习、原理学习、解决问题的学习属认知心理学。","有些应该在上学前掌握，有些则是小学教育的内容。"],"q":"上述八类学习，前五种属行为主义心理学，后三种属认知心理学。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c01-s03","t":"第三节 第二语言教学的性质、任务和类别","w":"high","n":10,"k":[{"t":"第二语言教学","y":"名词解释","p":["第二语言教学(以下简称二语教学)是指在学校进行的正规教学活动。","这种教学活动应该有教学大纲和教学计划，有配套的教材，有经过专门学习和训练的教师，有经过某种筛选后进行学习的学生。","二语教学跟一般语言习得不同，都主要在课堂上进行，有一套正规的教学程序和方法。"],"q":"第二语言教学(以下简称二语教学) 是指在学校进行的正规教学活动。这种教学活动应该有教学大纲和教学计划，有配套的教材，有课室和其他教学场所，有配套的教学设施，有经过专门学习和训练的教师……","w":"high","e":["教材高频"]},{"t":"二语教学跟一般语言习得、跟一般学校的非外语教学有何区别?","y":"简答题","p":["二语教学跟一般语言习得不同：一般的语言习得主要是在目的语环境里接触目的语而自然地掌握，没有专门的教师和教材，不需要正规的教育；二语教学不管在不在目的语环境里，都主要在课堂上进行，有一套正规的教学程序和方法。","二语教学跟一般学校的非外语教学不同：非外语教学主要是传授有关的知识系统，测试主要考查学生掌握所学知识的程度；二语教学注重的是学习者对第二语言能力的掌握，包括具体的言语交际能力和技巧。"],"q":"二语教学跟一般语言习得不同。一般的语言习得主要是在目的语环境里接触目的语而自然地掌握，没有专门的教师和教材……二语教学跟一般学校的非外语教学不同。一般学校的非外语教学，主要是传授有关的知识系统……","w":"high","e":["教材高频"]},{"t":"简述二语教学的目标和任务，以及语言教学理论涉及的六个问题。","y":"简答题","p":["短期速成教学，主要是培养具有一定的听说能力、能应付一般日常生活需要或能应付某个特定交际领域内简单交流需要的人；长期进修和汉语专业教学，则要求培养具有听说读写多种交际能力的人才。","专用汉语可分为两类：一是专业汉语，如医学汉语、科技汉语；二是职业汉语，如商务汉语、旅游汉语、法律汉语。","语言教学理论至少涉及六个问题：谁(who)、什么(what)、怎样(how)、何时(when)、哪里(where)、为什么(why)。"],"q":"二语教学的目标可以用一句话概括：培养出能用目的语进行交际的人才。……一般认为，语言教学理论至少涉及六个问题：(1) 谁(who)……(2) 什么(what)……(3) 怎样 (how)……(4) 何时(when)……(5) 哪里(where)……(6) 为什么(why)。","w":"normal","e":["核心考点"]},{"t":"专用汉语","y":"名词解释","p":["专用汉语(Chinese for specific purposes)人才的需求日益增加。","专业汉语，培养学习者在中国高校用汉语学习某个专业的能力，如医学汉语、科技汉语等。","职业汉语，培养学生用汉语从事某个行业的能力，如商务汉语、旅游汉语、法律汉语等。"],"q":"专用汉语可分为两类：一是专业汉语，培养学习者在中国高校用汉语(跟中国学生一起) 学习某个专业的能力，如医学汉语(培养学生用汉语学习医科的能力)、科技汉语等； 二是职业汉语，培养学生用汉语 (含中文) 从事某个行业的能力，如商务汉语、旅游汉语、法律汉语等。","w":"normal","e":["核心考点"]},{"t":"预备教学","y":"名词解释","p":["预备教学的对象是准备在中国高等院校学习非汉语专业的外国留学生。","其目标是提高学生汉语语言能力和交际能力，尤其是用汉语学习专业知识的能力。","预备教学不但有基础汉语教学，还包括专业名词术语及相关表达方面的教学。"],"q":"(一) 预备教学 对象是准备在中国高等院校学习非汉语专业的外国留学生。它是中华人民共和国对外汉语教学开创时期最早的教学类型。","w":"normal","e":["核心考点"]},{"t":"进修教学","y":"名词解释","p":["进修教学是不以获取文凭为目的的汉语教学。短期1周至3个月，长期半年至3年。","其目标是提高汉语语言能力和汉语交际能力。","课程分语言技能训练课和语言文化知识课两大类。"],"q":"(二) 进修教学 不以获取文凭为目的的汉语教学。短期1周至3个月，长期半年至3年。其目标是提高汉语语言能力和汉语交际能力。","w":"normal","e":["核心考点"]},{"t":"预备教学也参照长期进修大纲进行，进入理工医等本科的预备教学，对应于长期进修的初等教学。","y":"判断题","p":["预备教学也参照这个大纲进行。","进入理工医等本科的预备教学，对应于长期进修的初等教学。","进入文科、中医本科的预备教学，对应于长期进修的初等、中等教学。"],"q":"预备教学也参照这个大纲进行。进入理工医等本科的预备教学，对应于长期进修的初等教学； 进入文科、中医本科的预备教学，对应于长期进修的初等、中等教学。","w":"normal","e":["核心考点"]},{"t":"汉语言本科专业1975年设立，学制4年，要求修满____学时、150~160个学分。","y":"填空题","p":["汉语言本科专业1975年设立，目标是培养适应现代国际社会需要、具备良好综合素质、全面发展的汉语专门人才。","学制4年，要求修满2800~3000学时、150~160个学分，并进行语言实习，撰写毕业论文。"],"q":"汉语言本科专业1975年设立，目标是培养适应现代国际社会需要、具备良好综合素质、全面发展的汉语专门人才。学制4年，要求修满2800~3000学时、150~160个学分，并进行语言实习，撰写毕业论文。","w":"normal","e":["核心考点"]},{"t":"汉语国际教育硕士专业学位创立于（　）年，要求总学分不低于（　）学分。","y":"单项选择题","p":["汉语国际教育硕士专业学位2007年创立，目标是培养具备海外汉语教学能力、中华文化传播能力和跨文化交际能力的教师人才。","专业课程的学习实行学分制，要求总学分不低于32学分。其中必修课占10学分，教学实习占4学分，其中课堂教学实习不低于40学时。"],"q":"汉语国际教育硕士专业学位2007年创立……专业课程的学习实行学分制，要求总学分不低于32学分。其中必修课占10学分。","w":"normal","e":["核心考点"]},{"t":"对外汉语教学的基础学科是语言学、心理学、____。","y":"填空题","p":["对外汉语教学的基础学科是语言学、心理学、教育学。","作为交叉学科，对外汉语教学至少涉及四个层面：语言层面，心理层面，教育层面和技术层面。"],"q":"对外汉语教学的基础学科是语言学、心理学、教育学。作为学科研究，当然要进行理论研究……作为交叉学科，对外汉语教学至少涉及四个层面：语言层面，心理层面，教育层面和技术层面。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c01-s04","t":"第四节 基础学科和相关学科","w":"high","n":10,"k":[{"t":"对比分析","y":"名词解释","p":["对比语言学，任务是对两种或多种语言进行共时对比，描述它们的异同，总结规则。","它可以帮助教师有的放矢地进行教学，帮助学生有效掌握目的语规则。","对比语言学与行为主义心理学相结合，在二语教学界出现“对比分析”假说。"],"q":"对比语言学，任务是对两种或多种语言进行共时对比，描述它们的异同，总结规则。它可以帮助教师有的放矢地进行教学……对比语言学与行为主义心理学相结合，在二语教学界出现“对比分析”假说。","w":"high","e":["教材高频"]},{"t":"简述二语学习的心理过程研究中的两种解释，以及产生语言学习偏误的四个心理原因。","y":"简答题","p":["逐步重组论(progressive restructuring)：认为学习者处在一个逐步调整母语系统，使之渐渐接近目标的过程，学习上的进步意味着学习者正在用目的语的特征逐步代替母语的特征。","重新创造论(recreation)：认为学习者处于一个和母语习得基本相同的过程，学习上的进步意味着目的语正在从简单到复杂地向前发展。","产生偏误的四个心理原因：①过度概括；②规则限制的忽略；③规则片面应用；④错误概念的形成。"],"q":"关于二语学习的心理过程，存在两种不同的解释。一种是逐步重组论 (progressive  restructuring)……另一种解释是重新创造论(recreation)……产生语言学习偏误的心理原因有四个: ①过度概括……②规则限制的忽略……③规则片面应用……④错误概念的形成……","w":"normal","e":["核心考点"]},{"t":"语言学习动机","y":"名词解释","p":["语言学习动机是加拿大学者在对双语制地区的学习者进行研究后提出的。","一是融入型动机(integrative motivation)，不但要学语言，而且还要准备接受和使用跟这种语言密切相关的文化和生活方式。","二是工具型动机(instrumental motivation)，学语言是为了某些实际目的，如阅读科技文献、寻找工作等。"],"q":"语言学习动机(language learning motivation)  加拿大学者在对双语制地区的学习者进行研究后, 提出两种典型的学习动机: 一是融入型动机(integrative motivation)……二是工具型动机 (instrumental motivation), 学语言是为了某些实际目的。","w":"high","e":["教材高频"]},{"t":"学习迁移","y":"名词解释","p":["母语影响：二语学习受到的母语影响被称作学习迁移。","如果学习者第一语言和第二语言相差不大，利用相同点去促进二语学习，就是正迁移。","如果第一语言跟第二语言相差很远，学习者用母语知识去类推第二语言而出现偏误，就是负迁移。"],"q":"母语影响 二语学习受到的母语影响被称作学习迁移 (transfer of learning)。如果学习者第一语言和第二语言相差不大……学习者利用两种语言中的相同点去促进二语学习，就是正迁移 (positive transfer)……就是负迁移(negative  transfer)。","w":"high","e":["教材高频"]},{"t":"交际能力","y":"名词解释","p":["合语法性，指语言形式合乎语言规则。","可接受性，表现在有时有些句子语法没有问题，但是听话人心理上不能接受。","适合性，指说话人要懂得什么样的话适合在什么场合说。","可能性，指说话人要懂得某一语言形式使用的可能性有多大。"],"q":"美国语言学家海姆斯 (H. D. Hymes)提出语言学还应该研究人的交际能力，包括四个方面: 合语法性(grammaticality), 可接受性(acceptability), 适合性 (appropriate- ness) 和可能性 (probability)。","w":"high","e":["教材高频"]},{"t":"合作原则","y":"名词解释","p":["质量准则，即不说自己认为不真实或者没有证据的话。","数量准则，即提供的信息要满足会话的目的，但又不超出会话的需要。","相关准则，即所说的话必须是相关的，不能答非所问。","方式准则，即表达上要简明、有条理，避免模糊和歧义。"],"q":"格莱斯指出，会话双方都应该遵守“合作原则”。这包括以下准则：①质量准则……②数量准则……③相关准则……④方式准则……","w":"normal","e":["核心考点"]},{"t":"简述学习者对目的语文化的接受过程的四个阶段。","y":"简答题","p":["蜜月期(2~3个月)：学习者对新的语言和文化充满了好奇，感觉一切都很美好。","挫折期(4~5个月)：由于语言障碍，挫折感强烈，伴随着文化上的不适应(也叫文化休克)。","逐渐适应期(4~5个月以后)：学习者语言能力有所提高，逐渐适应和熟悉新的环境，开始结交目的语国家的朋友，孤独感得到缓解。","接近或完全复原期(半年之后)：学习者接受了第二文化，在新的文化环境中学习，充满了自信心。"],"q":"学习者对目的语文化的接受过程，可分为四个阶段 (盛炎，1990): (1) 蜜月期 (2~3个月)……(2) 挫折期 (4~5个月)：由于语言障碍，挫折感强烈，伴随着文化上的不适应(也叫文化休克)……(3) 逐渐适应期……(4) 接近或完全复原期 (半年之后)……","w":"high","e":["教材高频"]},{"t":"试述语言学的相关理论及其对汉语教学的指导作用。","y":"论述题","p":["普通语言学揭示语言的普遍规律，汉语语言学揭示汉语规律。语言是人类最重要的交际工具，因此对外汉语教学的目的应该是培养学习者的交际能力。","对比语言学，任务是对两种或多种语言进行共时对比，描述它们的异同，总结规则。它可以帮助教师有的放矢地进行教学，帮助学生有效掌握目的语规则。","对比分析假说认为从第一语言到第二语言的迁移必然发生，语言差异点造成学习困难并导致偏误，可以帮助找出偏误原因，从而确定教学内容、学习难点和教学项目的次序。","对外汉语教学不能照搬语言学理论。教学实践要求语言理论与现象解释具备形式化、外显化的特点，方便教师教学，易于学生理解、接受，可操作性强。","对外汉语教学提出的问题，也会促进汉语本体研究，如马真(1983)对“反而”的研究。"],"q":"语言学理论是对外汉语教学学科基础理论之一，可直接指导汉语作为外语/二语教学。反过来，汉语教学又为语言学提供新的应用空间……对外汉语教学不能照搬语言学理论。教学实践要求语言理论与现象解释具备形式化、外显化的特点……对外汉语教学提出的问题，也会促进汉语本体研究。","w":"high","e":["教材高频"]},{"t":"行为主义心理学指导下的教学方法认为言语行为的基本特征是创新而不是模仿。","y":"判断题","p":["这是建构主义心理学的观点。建构主义心理学认为言语行为的基本特征是创新而不是模仿，理解是习得语言知识的基础。","行为主义心理学认为学习就是通过强化，在刺激和反应之间建立联结的过程，强调模仿、重复、强化三种手段。"],"q":"行为主义心理学认为学习就是通过强化，在刺激和反应之间建立联结的过程。在行为主义心理学指导下的教学方法强调模仿、重复、强化三种手段……建构主义心理学认为学习是学习者在活动中不断修正自己心理结构的过程。","w":"normal","e":["核心考点"]},{"t":"一位英语母语者学习汉语时，常说出“我学习汉语在中国”“我去了学校昨天”这样的句子。请运用对比分析理论，分析这些偏误产生的原因，并提出教学对策。","y":"案例分析题","p":["偏误分析：英语处所短语和时间状语一般在动词后(如 I learnt Chinese in China / I went to the school yesterday)，学习者把英语语序迁移到汉语中，生成“我学习汉语在中国”“我去了学校昨天”。","对比原因：汉语中时间状语和工具成分在动词前边，英语在动词后边，形成镜像关系。汉语为“时间状语——工具成分——谓语动词词组”，英语为“谓语动词词组——工具成分——时间状语”。","理论依据：对比分析假说(拉多提出，心理学基础是行为主义)认为从第一语言到第二语言的迁移必然发生，语言差异点造成学习困难并导致偏误；对比等级越高，难度越大。","教学对策：通过科学、恰当的讲解和练习，让学生掌握汉语表达方式，讲清汉英状语位置的异同并适当操练，有利于学习者克服负迁移；对成年学习者，适当进行对比教学，效果更好。"],"q":"时间状语和工具成分，汉语在动词前边，英语在动词后边，形成镜像关系：汉语：时间状语——工具成分——谓语动词词组。英语：谓语动词词组——工具成分——时间状语……如“*我学习汉语在中国。”是各国初学者常见的偏误。这个表达，许多语言的处所短语都在句末。","w":"high","e":["教材高频"]}]}]},{"id":"rumen-c02","t":"第二章 外语教学法","w":"high","s":[{"id":"rumen-c02-s01","t":"第一节 教学法概述","w":"normal","n":2,"k":[{"t":"直接法和听说法比较适合成人，认知法比较适合少年儿童。","y":"判断题","p":["一般来说，直接法和听说法比较适合少年儿童，认知法比较适合成人。","如果只是为了阅读工具书，语法——翻译法和阅读法比较适用；如果是为了职业，如当语言教师，翻译法和认知法比较适用。"],"q":"例如，某一教学法适合于哪些教学对象，成人还是非成人? 一般来说，直接法和听说法比较适合少年儿童，认知法比较适合成人。","w":"normal","e":["核心考点"]},{"t":"在分配师生开口的比例时，要求老师少讲、学生多讲的教学法是（　）。","y":"单项选择题","p":["语法——翻译法和阅读法要求老师多讲。","功能法要求师生开口比例大致相同。","静默法要求老师少讲，学生多讲。","暗示法尽量使学生在极度放松甚至在临近睡眠的状况下学习。"],"q":"在分配师生开口的比例时，语法一翻译法和阅读法要求老师多讲； 功能法要求师生开口比例大致相同； 静默法要求老师少讲，学生多讲。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c02-s02","t":"第二节 传统教学法","w":"high","n":11,"k":[{"t":"语法——翻译法","y":"名词解释","p":["语法——翻译法盛行于18世纪末，代表人物是奥伦多夫。","教学语言基本上是学生的母语，教学方式以翻译为主，大量的笔头翻译练习是为了巩固和检验语法教学。","其语言学基础是传统语言学，注重语言规则的归纳和列举。"],"q":"语法一翻译法 (Grammar-Translation Method) 盛行于18 世纪末, 代表人物是奥伦多夫 (H. G. Ollendorff)。语法一翻译法的教学语言基本上是学生的母语，教学方式以翻译为主。","w":"high","e":["教材高频"]},{"t":"阅读法","y":"名词解释","p":["阅读法产生于20世纪初，是魏斯特在进行英语教学试验时创造的一种专项教学法。","二语学习的第一个目标是培养学生的直接阅读能力。","魏斯特把阅读分为精读和泛读，要求前者每分钟400个词，后者每分钟可达1200个词。"],"q":"阅读法(Reading Method) 产生于20世纪初, 是魏斯特 (M. West) 在进行英语教学试验时创造的一种专项教学法。阅读法认为，二语学习的第一个目标，是培养学生的直接阅读能力。","w":"normal","e":["核心考点"]},{"t":"直接法","y":"名词解释","p":["直接法产生于20世纪后半叶，其含义就是不用母语翻译，直接用目的语教学。","基本教学原则：建立语言与客观世界的直接联系；用口语伴随动作或图画展示教学内容；让学生通过模仿重复所学语句；口语领先。","直接法的心理学基础是联结主义心理学。"],"q":"直接法 (Direct Method) 产生于20世纪后半叶，其含义就是不用母语翻译，直接用目的语教学。代表人物有贝立兹 (M. D. Berlitz)、帕尔默等。","w":"high","e":["教材高频"]},{"t":"听说法","y":"名词解释","p":["听说法产生于20世纪40年代的美国。","新课内容以会话形式展开，用模仿、记忆、重复等方式学习，以养成语言习惯。","句型结构反复操练，语法教学用归纳法进行类推，很少语法解释；词汇量严格控制。","其心理学基础是行为主义的刺激反应论。"],"q":"听说法(Audiolingual Method) 产生于20世纪40年代的美国。……听说法的教学特点是：①新课内容以会话形式展开； ②用模仿、记忆、重复等方式学习，以养成语言习惯……听说法的心理学基础是行为主义的刺激反应论。","w":"high","e":["教材高频"]},{"t":"认知法","y":"名词解释","p":["认知法产生于20世纪60年代，代表人物卡鲁尔。","外语教育是对其语音、语法和词汇的各种形式进行学习、分析并获得有意识的控制的一种过程。","培养学生的语言能力是教学的主要目标；母语是学习者已有的知识，应该加以利用；听说读写并进。","心理学基础是认知心理学，语言学依据是乔姆斯基的生成语法。"],"q":"认知法 (Cognitive Approach) 产生于 20 世纪 60 年代。代表人物卡鲁尔(J. B. Carroll) 认为：“外语教育是对其语音、语法和词汇的各种形式进行学习、分析并获得有意识的控制的一种过程。”","w":"high","e":["教材高频"]},{"t":"全身反应法","y":"名词解释","p":["全身反应法产生于20世纪60年代，创始人是美国心理学家阿舍尔。","该法强调通过身体动作教授第二语言，开始主要用于美国的移民儿童。","先有充分的理解性能力的听，才能自然地转移到说；全身动作是发展理解性能力的关键；指令是基本的交际。","以儿童习得母语理论为基础。"],"q":"全身反应法 (Total Physical Response) 产生于20世纪60年代, 创始人是美国心理学家阿舍尔 (J. T. Asher)。该法强调通过身体动作教授第二语言，开始主要用于美国的移民儿童。","w":"normal","e":["核心考点"]},{"t":"语法——翻译法和听说法各有哪些优缺点?","y":"简答题","p":["语法——翻译法的优点：注重语言规则的归纳和列举，通过翻译练习辨别目的语和母语的异同，达到对目的语的理解和掌握，利于培养阅读和翻译能力。缺点：不重视口语教学，不注重当下语言。","听说法的优点：有一套较完整的教学体系，有一些较成熟的教材，培养出大批第二语言人才，还促成了其他教学法(如视听法)的产生。缺点：过分强调听；不准用母语，不讲语法规则；句型练习太枯燥，影响学习积极性；一些学生把句型背得滚瓜烂熟，在现实生活中却无法运用。"],"q":"语法一翻译法在二语教学中曾占主导地位。后来，这一地位被直接法、听说法取代。原因是语法一翻译法不重视口语教学，不注重当下语言。……听说法……其不足之处是：过分强调听； 不准用母语，不讲语法规则； 句型练习太枯燥，影响学习积极性。","w":"high","e":["教材高频"]},{"t":"听说法产生于20世纪40年代的美国，其心理学基础是____的刺激反应论。","y":"填空题","p":["听说法产生于20世纪40年代的美国。","听说法的心理学基础是行为主义的刺激反应论，认为人们学习语言，就是通过刺激反应进而养成语言习惯。"],"q":"听说法(Audiolingual Method) 产生于20世纪40年代的美国。……听说法的心理学基础是行为主义的刺激反应论，认为人们学习语言，就是通过刺激反应进而养成语言习惯。","w":"normal","e":["核心考点"]},{"t":"认知法的语言学依据是乔姆斯基的生成语法，其基本观点之一是语言有共性，语言教学应注重共性，启发学生把母语知识用于二语学习。","y":"判断题","p":["认知法的语言学依据是乔姆斯基的生成语法。","基本观点：语言由无限的句子构成，无限的句子由有限规则生成；语言有共性，语言教学应注重共性，启发学生把母语知识用于二语学习。","个人语言包括语言能力和语言表现。"],"q":"认知法的语言学依据是乔姆斯基的生成语法。其基本观点是：①语言由无限的句子构成，无限的句子由有限规则生成……②语言有共性。语言教学应注重共性，启发学生把母语知识用于二语学习。","w":"normal","e":["核心考点"]},{"t":"直接法的心理学基础是____心理学，注重语言跟客体和环境的直接联结。","y":"填空题","p":["直接法的心理学基础是联结主义心理学，注重语言跟客体和环境的直接联结。","同时又认为学习外语跟习得母语一样，都是靠人的自然能力。"],"q":"直接法的心理学基础是联结主义心理学，注重语言跟客体和环境的直接联结。同时又认为学习外语跟习得母语一样，都是靠人的自然能力。","w":"normal","e":["核心考点"]},{"t":"试从教学对象、教学目标、教学语言、口语与书面语的关系等方面比较语法——翻译法、直接法和听说法的异同，并说明其对汉语教学的启示。","y":"论述题","p":["教学语言：语法——翻译法的教学语言基本上是学生的母语，教学方式以翻译为主；直接法不用母语翻译，直接用目的语教学；听说法也不准用母语。","口语与书面语：语法——翻译法注重读写和翻译能力的提高，不重视口语教学；直接法和听说法主张不使用母语，着重口语的操练，注重听力和口语能力的提高，听说法按听、说、读、写的顺序安排教学。","教学对象：直接法和听说法比较适合少年儿童，语法——翻译法适合需要阅读工具书或从事翻译的学习者。","心理学基础：语法——翻译法的心理学基础是官能心理学，直接法的心理学依据是联结主义心理学和幼儿语言习得论，听说法的理论基础是行为主义心理学。","启示：汉语教学应结合学习者对象和目标灵活选择教学法，初级阶段重视口语操练，同时不应完全排斥母语和语法规则的适当讲解。"],"q":"语法一翻译法主张使用学生母语，着重原文和语法知识的讲解，注重学生翻译能力的提高。直接法和听说法主张不使用母语，着重口语的操练，注重听力和口语能力的提高。","w":"high","e":["教材高频"]}]},{"id":"rumen-c02-s03","t":"第三节 人本主义教学法","w":"normal","n":4,"k":[{"t":"静默法","y":"名词解释","p":["静默法产生于20世纪60年代，是英国数学家和心理学家加特诺创造的。","静默法重视大脑的作用，注重开发学生的智力学习第二语言，认为创造性的发现学习优于重复式的记忆学习。","学生是主体，教师是启蒙者；在课堂教学中，教师少说(即静默)，启发学生多说。","口语领先，让学生自己纠正错误。"],"q":"静默法(Silent Way) 产生于20世纪60年代，是英国数学家和心理学家加特诺(C. Gattegno) 创造的。静默法重视大脑的作用，注重开发学生的智力学习第二语言。","w":"normal","e":["核心考点"]},{"t":"启示法","y":"名词解释","p":["启示法产生于20世纪60年代中期，创始人是保加利亚心理学研究所所长罗扎诺夫。","启示法认为人的大脑在无忧无虑的状况下，能在有意无意之中产生超常的认知能力和记忆能力。","操作分展示阶段、运用阶段；创造舒畅愉快的环境气氛，让学习者大脑的两个半球同时发挥作用。"],"q":"启示法(Suggestopedia) 产生于20世纪60年代中期，创始人是保加利亚心理学研究所所长罗扎诺夫 (G. Lozanov)。启示法认为人的大脑在无忧无虑的状况下，能在有意无意之中产生超常的认知能力和记忆能力，提高学习效果。","w":"normal","e":["核心考点"]},{"t":"咨询法","y":"名词解释","p":["咨询法又名社团语言学习法，产生于20世纪60年代初，创始人为古兰。","教学过程以学生为中心，学生是“病人”，教师是顾问、辅导者，必须注意和满足学生的需要。","只学口语，不学书面语；依赖母语，学生在学习过程中逐步实现由母语到目的语的过渡。"],"q":"咨询法(Counseling Learning) 又名社团语言学习法 (Community Language Learn- ing), 产生于20世纪60年代初, 创始人为古兰 (C. Curran)。……咨询法的特点是：①教学过程以学生为中心，学生是“病人”，教师是顾问、辅导者。","w":"normal","e":["核心考点"]},{"t":"人本主义教学法包括哪些类别?其共同点是什么?","y":"简答题","p":["人本主义教学法包括静默法、启示法和咨询法等类别。","其共同点是重视学习者内在自我的发展和过程教学，强调学习自主性的培养，明显地带有人本心理学的理论特征。","静默法重视大脑的作用，注重开发学生的智力学习第二语言；启示法认为人的大脑在无忧无虑的状况下能产生超常的认知能力和记忆能力；咨询法以学生为中心，教师是顾问。"],"q":"人本主义教学法认为，学习者是既有认知需求也有情感需求的完整的人，教学应该体现对人的情感因素的深切关注。人本主义教学法包括静默法、启示法和咨询法等类别，其共同点是重视学习者内在自我的发展和过程教学，强调学习自主性的培养，明显地带有人本心理学的理论特征。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c02-s04","t":"第四节 交际型教学法","w":"high","n":7,"k":[{"t":"功能法","y":"名词解释","p":["功能法又称为交际法。20世纪70年代末，美国纽约州教育部门完成了《现代语言交际大纲》。","外语教学的中心任务是培养学生用外语交际的能力，让他们在目的语文化语境中实现有效交际。","不强调用语言学途径教授语言，而是强调交际途径；文化作为交际中的有机成分。","课堂教学以学生为中心，学习和使用新语言项目的时间各占50%。"],"q":"功能法 (Functional Approach) 又称为交际法。20世纪 70年代末, 美国纽约州教育部门完成了《现代语言交际大纲》。……功能法的教学实施：老师的教应以表演为基础，课堂教学以学生为中心。","w":"high","e":["教材高频"]},{"t":"任务式教学法","y":"名词解释","p":["任务式教学法最早产生于20世纪80年代的英国，代表人物有伯拉胡、纽南。","教学活动以学生为中心，教师设计具体的、带有明确目标的活动，让学生用目的语通过协商、讨论，达到学习目的。","教学原则是“用中学”(learning in using)。","任务设计三个程序：任务前活动、完成任务的活动、任务后活动。"],"q":"任务式教学法 (Task-based Approach) 最早产生于20世纪80年代的英国, 代表人物有伯拉胡 (N. S. Prabhu)、纽南 (D. Nunan)。它实际上是交际法的新发展。教学活动以学生为中心……教学原则是“用中学”(learning in using)。","w":"high","e":["教材高频"]},{"t":"内容教学法","y":"名词解释","p":["内容教学法注重通过专题内容的学习，培养学习者的语言交际能力。","它要求对学习者输入他们感兴趣且难度略高于学习者当前语言水平的内容。","遵循三个原则：以不同的专题为中心组织课程；课程核心材料选自母语说话者的作品；学习内容和活动符合学生的语言、认知和情感需要。"],"q":"内容教学法注重通过专题内容的学习，培养学习者的语言交际能力。它要求对学习者输入他们感兴趣且难度略高于学习者当前语言水平的内容，以便满足语言教学多方面的目的。","w":"normal","e":["核心考点"]},{"t":"3P教学法","y":"名词解释","p":["3P教学法是20世纪70年代交际语言教学模式下的产物。","它把语言教学分为三个阶段：呈现(presentation)，操练(practice)，运用(production)。","教师先呈现某一个语言点，解释并示范新语言点的意义和形式；接着学生操练；然后进入运用。"],"q":"3P 教学法(Presentation, Practice, Production) 是20世纪70年代交际语言教学模式下的产物。它把语言教学分为三个阶段: 呈现(presentation), 操练(practice), 运用(production)。","w":"normal","e":["核心考点"]},{"t":"任务式教学法所遵循的原则有哪些?如何贯彻实施?","y":"简答题","p":["四个基本原则：①语言、情景真实；②形式功能结合；③任务层层递进；④以做促学。","任务设计三个程序：①任务前活动，先确定任务，再确定执行任务需要的语言项目，接着对这些词汇、句型、表达方式等进行训练；②完成任务的活动，以小组方式相互咨询、解释、澄清、陈述、互动；③任务后活动，以表达的形式展示任务结果，对任务完成情况进行检验评估。","任务式教学法的特点：将真实语言材料引入学习环境，把课内语言学习跟课外社会语言活动结合起来；意义优先，交际优先；以是否完成交际任务作为评估标准。"],"q":"在课堂教学活动中，任务式教学法强调四个基本原则：①语言、情景真实……②形式功能结
