分法对合体字进行一次性切分而获得的结构单位，可分为“形旁”和“声旁”两类。","形旁通常表示该字的意义类别，声旁通常表示该字的大致读音。","多数形声字由一个形旁和一个声旁组成；会意字的两个偏旁都属于形旁。","通用汉字的偏旁约有1500个。"],"q":"偏旁就是用二分法对合体字进行一次性切分而获得的结构单位，可分为“形旁”和“声旁”两类。","w":"high","e":["2012 真题","2018 真题"]},{"t":"部首","y":"名词解释","p":["“部首”是指可以成批构字的一部分部件。含有同一部件的字，在“字集”中均排列在一起，该部件作为领头单位排在开头，成为查字的依据。","部首一般包括两类：一是形旁，例如“栋”“梁”的部首都是“木”；二是某些笔画，例如“头”的第一笔“、”就是部首。","《说文解字》的部首是540个，《现代汉语词典》（第6版）的部首是201个。"],"q":"“部首”是指可以成批构字的一部分部件。含有同一部件的字，在“字集”中均排列在一起，该部件作为领头单位排在开头，成为查字的依据。","w":"high","e":["2014 真题","2021 真题"]},{"t":"独体字","y":"名词解释","p":["独体字是指无法分离出两个或两个以上部件的汉字。","有些字笔画相交，结构呈镶嵌式，即使笔画很多，由于从字形上不能分解出相离的部件，因而也是独体字；有些字分解后就是相离而又对称或平行的笔画，这类字也宜看作独体字。","独体字在现代汉字中约占3%——5%，绝对数量为三百上下，它们是构成现代汉字字形的基础。"],"q":"独体字是指无法分离出两个或两个以上部件的汉字。","w":"high","e":["2013 真题","2019 真题"]},{"t":"合体字","y":"名词解释","p":["合体字是由两个或两个以上部件组合而成的汉字。","象形字、指事字一般属于独体字，会意字、形声字通常属于合体字。","独体和合体在汉字形体演变过程中会互变。"],"q":"合体字是由两个或两个以上部件组合而成的汉字。","w":"high","e":["2015 真题"]},{"t":"合体字结构模式","y":"名词解释","p":["按照层次分析法分析出的合体字基本结构模式，有三大类：(1)左右结构；(2)上下结构；(3)里外结构。","此外，还有一些从基本结构变化出来的派生结构：(4)左中右结构；(5)上中下结构；(6)品字结构；(7)镶嵌（或对称，或框架）结构；(8)半包围结构。","据统计，左右结构的字占现代汉字的大多数。"],"q":"按照层次分析法分析出的合体字基本结构模式，有三大类：(1)左右结构；(2)上下结构；(3)里外结构。","w":"high","e":["2016 真题","2022 真题"]},{"t":"辨析“偏旁”“部件”“部首”三个概念。","y":"名词解释","p":["偏旁：二分法一次性切分的结构单位，分形旁声旁","部件：现代汉字构形单位，可大可小","部首：成批构字的一部分部件，是查字依据","三者数量不同，是三个不同概念"],"q":"偏旁就是用二分法对合体字进行一次性切分而获得的结构单位，可分为“形旁”和“声旁”两类。“部件”是适应现代汉字分析字形的需要而提出来的，可大可小：有时相当于偏旁，有时小于偏旁。“部首”是指可以成批构字的一部分部件，含有同一部件的字在“字集”中均排列在一起，该部件作为领头单位排在开头，成为查字的依据。三","w":"high","e":["2013 真题","2019 真题"]},{"t":"笔形","y":"名词解释","p":["依据笔势和走向，现代汉字的笔画可以有31种不同的形式，笔画的形式简称为笔形。","现代汉字的笔形可以有概括的和细致的两种分类法：概括的分类法把笔形分为八类或五类；细致的分类法先把笔形分为基本笔形和派生笔形（也称复合笔形）两个大类。","书写时，笔画的方向自始至终没有变化的笔形是基本笔形，笔画的方向有所变化的是派生笔形。"],"q":"依据笔势和走向，现代汉字的笔画可以有31种不同的形式，笔画的形式简称为笔形。","w":"high","e":["教材高频"]},{"t":"部位","y":"名词解释","p":["要确定部件的名称，还要给汉字字形结构的各个位置定名，这就叫部位。可以分为八类。","八类部位可以编成16字口诀：上“头”下“底”，左“旁”右“边”，内“心”外“框”，中“腰”四“角”。","使用统一规范的部件和部位名称，可以把一个结构复杂的汉字称说得既准确又清楚，这就叫“部件识字法”。"],"q":"要确定部件的名称，还要给汉字字形结构的各个位置定名，这就叫部位。可以分为八类。","w":"high","e":["教材高频"]},{"t":"基础部件","y":"名词解释","p":["最小的不再拆分的部件叫基础部件，又叫单纯部件；由于基础部件总是处在组字的最低层次，所以又称末级部件。","由两个和两个以上基础部件组成的部件叫合成部件。"],"q":"最小的不再拆分的部件叫基础部件，又叫单纯部件；由于基础部件总是处在组字的最低层次，所以又称末级部件。","w":"high","e":["教材高频"]},{"t":"【原文】四、有人说：所有念轻声的","y":"教材原文","p":["四、有人说：所有念轻声的字都有本调的，你认为这种说法对不对?为什么?五、有人认为：普通话轻声是第五个声调，你认为如何?为什么?"],"q":"四、有人说：所有念轻声的字都有本调的，你认为这种说法对不对?为什么?五、有人认为：普通话轻声是第五个声调，你认为如何?为什么?","w":"normal","e":["原书正文"]},{"t":"【原文】学习要点：了解普通话常用","y":"教材原文","p":["学习要点：了解普通话常用节律重音、断连和句调等形式特点与基本功能，并能运用节律的一般知识指导普通话表达"],"q":"学习要点：了解普通话常用节律重音、断连和句调等形式特点与基本功能，并能运用节律的一般知识指导普通话表达。","w":"normal","e":["原书正文"]},{"t":"【原文】节律是运用言语的节奏和语","y":"教材原文","p":["节律是运用言语的节奏和语声规律正确体现语言结构关系、语义关系与逻辑关系的一种表达手段","节律受语义、语法的制约，它将相互关联的语言材料组合成既彼此层次分明，又连接有序的表达单位，是言语过程中不可或缺的表达手段","如“史书/记千古”与“史书记/千古”两者就是运用不同的节律组合成不同的语法结构单位、显示不同的语义，以供表达题旨的需要"],"q":"节律是运用言语的节奏和语声规律正确体现语言结构关系、语义关系与逻辑关系的一种表达手段。节律受语义、语法的制约，它将相互关联的语言材料组合成既彼此层次分明，又连接有序的表达单位，是言语过程中不可或缺的表达手段。如“史书/记千古”与“史书记/千古”两者就是运用不同的节律组合成不同的语法结构单位、显示不同的语义，以供表达题旨的需要。","w":"normal","e":["原书正文"]},{"t":"【原文】节律的体现形式是语音，但","y":"教材原文","p":["节律的体现形式是语音，但节律的语音形式不同于声母韵母等可以独立存在的音素成分，表现节律的语音形式不能单独存在，它附加于语言建筑材料之上，是对具体语言建筑材料的组合运用，以体现具体的语义、语法与语用功能"],"q":"节律的体现形式是语音，但节律的语音形式不同于声母韵母等可以独立存在的音素成分，表现节律的语音形式不能单独存在，它附加于语言建筑材料之上，是对具体语言建筑材料的组合运用，以体现具体的语义、语法与语用功能。","w":"normal","e":["原书正文"]},{"t":"【原文】汉语的节律形式是多样的，","y":"教材原文","p":["汉语的节律形式是多样的，常用的节律形式主要是重音、断连与句调"],"q":"汉语的节律形式是多样的，常用的节律形式主要是重音、断连与句调。","w":"normal","e":["原书正文"]},{"t":"【原文】一、重音在实际话语里，因","y":"教材原文","p":["一、重音在实际话语里，因语义、语法的需要，往往有些音节或词语读得重一些，有些读得轻一些，重读的音节就叫重音","重音和轻音是相对而言的，重音一般都是重要语义的负载所在","单音节的实词不存在结构类型，所以不存在轻重读","单音节虚词(如助词“着、了、过，的、地、得”)因语义的虚化，不可能重读"],"q":"一、重音在实际话语里，因语义、语法的需要，往往有些音节或词语读得重一些，有些读得轻一些，重读的音节就叫重音。重音和轻音是相对而言的，重音一般都是重要语义的负载所在。单音节的实词不存在结构类型，所以不存在轻重读；单音节虚词(如助词“着、了、过，的、地、得”)因语义的虚化，不可能重读。语音实验结果表明，体现重音的主要成分是音长和音高，音强的作用是次要的，因命名的","w":"normal","e":["原书正文"]},{"t":"【原文】(一)语法重音语法重音又","y":"教材原文","p":["(一)语法重音语法重音又叫基本重音，它是在不受上下文或具体语境规定下，由语言单位自身的结构关系、语义内涵所规定的重音","换句话说，语法重音是体现语言单位结构关系与语义关系的重音，所以比较有规律，也相对稳定","语法重音是言语表达首先必须掌握的重音，它关系到表达者对语义的理解与把握，所以比较重要","语法重音呈现在词、短语与句子三级语言单位中，尤以前两者为主"],"q":"(一)语法重音语法重音又叫基本重音，它是在不受上下文或具体语境规定下，由语言单位自身的结构关系、语义内涵所规定的重音。换句话说，语法重音是体现语言单位结构关系与语义关系的重音，所以比较有规律，也相对稳定。语法重音是言语表达首先必须掌握的重音，它关系到表达者对语义的理解与把握，所以比较重要。语法重音呈现在词、短语与句子三级语言单位中，尤以前两者为主。","w":"normal","e":["原书正文"]},{"t":"【原文】1.词重音。指双音节或多","y":"教材原文","p":["指双音节或多音节词的基本轻重格式","词的不同轻重读音格式主要依据于词的结构形式与口语化的程度","词的重读音直接落在构成词的相关语素(音节)上","普通话词的轻重格式按音节多寡的不同可分以下几种情况："],"q":"1.词重音。指双音节或多音节词的基本轻重格式。词的不同轻重读音格式主要依据于词的结构形式与口语化的程度。词的重读音直接落在构成词的相关语素(音节)上。普通话词的轻重格式按音节多寡的不同可分以下几种情况：","w":"normal","e":["原书正文"]}]},{"id":"xdhy_up-c02-s03","t":"第三节 现代汉字的字音","w":"high","n":10,"k":[{"t":"多音字","y":"名词解释","p":["所谓多音字，是指一个汉字可以有两个或两个以上的读音。","同一个汉字可以有不止一个读音，同一个读音也可以由多个字形共同拥有。","现代汉字中许多字只有一个读音，例如《汉字信息字典》所收7785个字中，单音字共7038个，占90%，而另外10%的字则是多音字。"],"q":"所谓多音字，是指一个汉字可以有两个或两个以上的读音。","w":"high","e":["2011 真题","2017 真题"]},{"t":"全表音声旁","y":"名词解释","p":["严格的标准是：声旁必须和整字的声母、韵母、声调全部相同。这种声旁就叫“全表音声旁”。","统计结果，字音与声旁的声、韵、调全部相同的只占26.3%。","宽松的标准是：把部首以外的另外半边一概看作声旁，只要声母、韵母相同就看作有表音功能，这样统计的结果，现代汉字声旁的有效表音率也只占39%。"],"q":"严格的标准是：声旁必须和整字的声母、韵母、声调全部相同。这种声旁就叫“全表音声旁”。","w":"high","e":["2018 真题"]},{"t":"【原文】6.累死了思考题一、现代","y":"教材原文","p":["6.累死了思考题一、现代汉语的节律系统里所有起作用的语音形式有哪一些?能够区别语义与语言结构的有哪几种?举例说明"],"q":"6.累死了思考题一、现代汉语的节律系统里所有起作用的语音形式有哪一些?能够区别语义与语言结构的有哪几种?举例说明。","w":"normal","e":["原书正文"]},{"t":"【原文】二、语句重音有哪两种，各","y":"教材原文","p":["二、语句重音有哪两种，各有什么特点?三、词重音与短语重音、语句重音之间是什么关系?四、举例说明顿断与连延节律的作用"],"q":"二、语句重音有哪两种，各有什么特点?三、词重音与短语重音、语句重音之间是什么关系?四、举例说明顿断与连延节律的作用。","w":"normal","e":["原书正文"]},{"t":"【原文】五、疑问语气是否都是升调","y":"教材原文","p":["五、疑问语气是否都是升调?为什么?参考文献徐世荣(1980)《普通话语音知识》第四章，文字改革出版社"],"q":"五、疑问语气是否都是升调?为什么?参考文献徐世荣(1980)《普通话语音知识》第四章，文字改革出版社。","w":"normal","e":["原书正文"]},{"t":"【原文】罗常培 王 均(1981","y":"教材原文","p":["罗常培 王 均(1981)《普通语音学纲要》，商务印书馆"],"q":"罗常培 王 均(1981)《普通语音学纲要》，商务印书馆。","w":"normal","e":["原书正文"]},{"t":"【原文】林 焘 王理嘉(1992","y":"教材原文","p":["林 焘 王理嘉(1992)《语音学教程》，北京大学出版社"],"q":"林 焘 王理嘉(1992)《语音学教程》，北京大学出版社。","w":"normal","e":["原书正文"]},{"t":"【原文】石 锋(1994)《语音","y":"教材原文","p":["石 锋(1994)《语音丛稿》，北京语言学院出版社"],"q":"石 锋(1994)《语音丛稿》，北京语言学院出版社。","w":"normal","e":["原书正文"]},{"t":"【原文】傅国通 殷作炎(1998","y":"教材原文","p":["傅国通 殷作炎(1998)《普通话导学》，浙江教育出版社"],"q":"傅国通 殷作炎(1998)《普通话导学》，浙江教育出版社。","w":"normal","e":["原书正文"]},{"t":"【原文】王洪君(1999)《汉语","y":"教材原文","p":["王洪君(1999)《汉语非线性音系学》，北京大学出版社"],"q":"王洪君(1999)《汉语非线性音系学》，北京大学出版社。","w":"normal","e":["原书正文"]}]},{"id":"xdhy_up-c02-s04","t":"第四节 现代汉字的字义","w":"high","n":10,"k":[{"t":"字义","y":"名词解释","p":["汉字字形跟字义的关系大致有三类：1.字形记录的是词义；2.字形记录的是语素义；3.字形记录的仅仅是一个音节，它没有字义。","一个汉字在多数情况下，记录的是现代汉语的一个语素。字义也就是语素义。","现代汉字中也有少数用会意法造出来的字还是可以直接从字形推知字义的。"],"q":"汉字字形跟字义的关系大致有三类：1.字形记录的是词义；2.字形记录的是语素义；3.字形记录的仅仅是一个音节，它没有字义。","w":"high","e":["2015 真题"]},{"t":"形旁表义","y":"名词解释","p":["在形声字中，形旁主要提示跟字义有一定联系的信息。形声字的形旁和整字字义的关系有以下几种：(1)形旁完全表义；(2)形旁基本表义；(3)形旁不表义。","形旁基本表义可分为三种：形旁表示字义的大致类别；形旁与字义直接相关；形旁与字义间接有关。","在现代汉字中，表义部件的主要作用有二：一是提示，二是区别。","形旁的总体表义率为43.79%。"],"q":"在形声字中，形旁主要提示跟字义有一定联系的信息。形声字的形旁和整字字义的关系有以下几种：(1)形旁完全表义；(2)形旁基本表义；(3)形旁不表义。","w":"high","e":["2013 真题","2020 真题"]},{"t":"【原文】根据统计,《通用规范汉字","y":"教材原文","p":["根据统计,《通用规范汉字表》收字8105个,9画的字最多(899个),其次是10画(826个)和11画(816个)的字"],"q":"根据统计,《通用规范汉字表》收字8105个,9画的字最多(899个),其次是10画(826个)和11画(816个)的字。","w":"normal","e":["原书正文"]},{"t":"【原文】2.笔画的类别依据笔势和","y":"教材原文","p":["2.笔画的类别依据笔势和走向，现代汉字的笔画可以有31种不同的形式","笔画的形式简称为笔形","现代汉字的笔形可以有概括的和细致的两种分类法：概括的分类法把笔形分为八类或五类","细致的分类法先把笔形分为基本笔形和派生笔形(也称复合笔形)两个大类，然后再分出小类"],"q":"2.笔画的类别依据笔势和走向，现代汉字的笔画可以有31种不同的形式。笔画的形式简称为笔形。现代汉字的笔形可以有概括的和细致的两种分类法：概括的分类法把笔形分为八类或五类；细致的分类法先把笔形分为基本笔形和派生笔形(也称复合笔形)两个大类，然后再分出小类。","w":"normal","e":["原书正文"]},{"t":"【原文】(1)汉字笔形八类说和五","y":"教材原文","p":["(1)汉字笔形八类说和五类说八类笔形是指：点、横、竖、撇、捺、提、折、钩","因为楷体“永”字刚好含有这八种笔形，书法界就有“‘永’"],"q":"(1)汉字笔形八类说和五类说八类笔形是指：点、横、竖、撇、捺、提、折、钩。因为楷体“永”字刚好含有这八种笔形，书法界就有“‘永’","w":"normal","e":["原书正文"]},{"t":"【原文】五类笔形是指：横、竖、撇","y":"教材原文","p":["五类笔形是指：横、竖、撇、点、折","因为“札”字刚好含有这五种笔形，就有“‘札’字法”的名称"],"q":"五类笔形是指：横、竖、撇、点、折。因为“札”字刚好含有这五种笔形，就有“‘札’字法”的名称。","w":"normal","e":["原书正文"]},{"t":"【原文】五类说是把八类说中有可能","y":"教材原文","p":["五类说是把八类说中有可能是变形的笔画并入了非变形笔画，因而减少了类别数目","例如把“提”并入“横”，因为“提笔”大都出现在左旁的末笔(例如“孙”“站”“耻”“转”等字的左旁末笔)，当左旁部件独立成字或置于其他部位时，这些“提笔”都要改成“横笔”","又如把“捺”并入“点”，独立的“木”“又”“米”“火”等字中，当它们处于字的右旁或下方时，都是“捺”，但当它们处于字的左旁时，例如“林”“欢”“粘”“焰”中，“捺笔”就改成了“点笔”","由于五类说对笔形的分类更为概括，所以经常用于工具书的排序"],"q":"五类说是把八类说中有可能是变形的笔画并入了非变形笔画，因而减少了类别数目。例如把“提”并入“横”，因为“提笔”大都出现在左旁的末笔(例如“孙”“站”“耻”“转”等字的左旁末笔)，当左旁部件独立成字或置于其他部位时，这些“提笔”都要改成“横笔”。又如把“捺”并入“点”，独立的“木”“又”“米”“火”等字中，当它们处于字的右旁或下方时，都是“捺”，但当它们处于字","w":"normal","e":["原书正文"]},{"t":"【原文】(2)基本笔形和派生笔形","y":"教材原文","p":["(2)基本笔形和派生笔形的类别书写时，笔画的方向自始至终没有变化的笔形是基本笔形，笔画的方向有所变化的是派生笔形","派生笔形是指各式各样的折笔","基本笔形、派生笔形的类别，目前还没有国家标准作为依据","下表中所列可作参考："],"q":"(2)基本笔形和派生笔形的类别书写时，笔画的方向自始至终没有变化的笔形是基本笔形，笔画的方向有所变化的是派生笔形。派生笔形是指各式各样的折笔。基本笔形、派生笔形的类别，目前还没有国家标准作为依据。下表中所列可作参考：","w":"normal","e":["原书正文"]},{"t":"【原文】现代汉字笔画(笔形)表序","y":"教材原文","p":["现代汉字笔画(笔形)表序 号笔画(笔形)类别名 称例字123456基本笔形一l丿、({横竖撇点捺提十的第1笔中的第4笔人的第1笔"],"q":"现代汉字笔画(笔形)表序 号笔画(笔形)类别名 称例字123456基本笔形一l丿、({横竖撇点捺提十的第1笔中的第4笔人的第1笔","w":"normal","e":["原书正文"]},{"t":"【原文】主的第1笔大的第3笔江的","y":"教材原文","p":["主的第1笔大的第3笔江的第3笔12345678910111213派生笔形7フ宀0121乙乙了3弓1横折横撇横钩横折钩横折提"],"q":"主的第1笔大的第3笔江的第3笔12345678910111213派生笔形7フ宀0121乙乙了3弓1横折横撇横钩横折钩横折提","w":"normal","e":["原书正文"]}]},{"id":"xdhy_up-c02-s05","t":"第五节 现代汉字形音义的关系","w":"high","n":19,"k":[{"t":"近形字","y":"名词解释","p":["近形字也称形近字，是指字形相近而音、义有别的字。","近形字会给汉字的使用带来种种不便。","近形字的差异大体表现在以下四个方面：1.笔画数的微小差异；2.个别笔形的差异；3.笔画组合关系的差异；4.构字部件有局部差异。"],"q":"近形字也称形近字，是指字形相近而音、义有别的字。","w":"high","e":["2011 真题","2018 真题"]},{"t":"同音字","y":"名词解释","p":["同音字是指两个或两个以上的汉字，读音相同、意义不同而且意义没有联系。","同音字按字形是否相同可以分为同形同音异义字和异形同音异义字两类。","狭义的同音字只指同形同音异义字；广义的同音字，除了同形同音字之外，还包括了异形同音字。"],"q":"同音字是指两个或两个以上的汉字，读音相同、意义不同而且意义没有联系。","w":"high","e":["2014 真题","2021 真题"]},{"t":"多音多义字","y":"名词解释","p":["多音多义字：即一形对数音数义。","所谓多音多义字就是同一个字形却记录不同的读音和不同的字义。","有人统计，在1988年发布的《现代汉语常用字表》3500个常用字中，有多音多义字405个，占总数的11.6%。","多音字节省了造字数量，但同时带来一字异读的麻烦。"],"q":"多音多义字：即一形对数音数义。","w":"high","e":["2012 真题","2019 真题"]},{"t":"现代汉字形音义的关系","y":"名词解释","p":["字形是文字的物质外壳，是文字层面上的要素；字音和字义是文字所记录语言的音和义，是语言层面上的要素。","字形与字音以及字义这三者之间形成了错综复杂的关系。","现代汉字学的术语中，例如“多音多义字、同音字、异读字、异体字、繁简字、同形字”等，它们的内涵有一些交叉或重叠，这是因为给这些名称命名时的出发点不同。"],"q":"字形是文字的物质外壳，是文字层面上的要素；字音和字义是文字所记录语言的音和义，是语言层面上的要素。","w":"high","e":["2014 真题"]},{"t":"辨析“多音多义字”与“异读字”。","y":"名词解释","p":["多音多义字：一形对数音数义，音义皆别","异读字：一形对数音一义，仅读法习惯不同","异读字原则上应统读，少数文白异读保留","多音多义字如“长”“参”，异读字如“械”“法”"],"q":"多音多义字：即一形对数音数义，即同一个字形却记录不同的读音和不同的字义。例如“长”cháng长短/zhǎng生长，“参”cān参加/shēn人参/cēn参差。异读字：即一形对数音一义，不同读音之间一般没有语义差别，仅仅是不同的人、不同的习惯读法。例如“械”，有人读xiè，有人读jiè，经过审音，规定","w":"high","e":["2012 真题","2019 真题"]},{"t":"异读字","y":"名词解释","p":["异读字：即一形对数音一义。不同读音之间一般没有语义差别，仅仅是不同的人、不同的习惯读法。","异读字原则上应该统读。少数文白异读，目前还保留着。","异读字即多音同形同义字。"],"q":"异读字：即一形对数音一义。不同读音之间一般没有语义差别，仅仅是不同的人、不同的习惯读法。","w":"high","e":["教材高频"]},{"t":"异体字","y":"名词解释","p":["异体字（也叫异形字）：即数形对一音一义。不同字形之间没有任何音义差别。","经过整理，规定正体字，淘汰异体字形。","异体字指音义都相同仅形不同的字。"],"q":"异体字（也叫异形字）：即数形对一音一义。不同字形之间没有任何音义差别。","w":"high","e":["教材高频"]},{"t":"繁简字","y":"名词解释","p":["繁简字：即一为笔画比较多的字，一为笔画比较少的字，字音和字义都相同。","《简化字总表》的2235个简化字，在简繁转换中有95.5%是一对一的关系。","“简体字”则有特定的含义，指由国家明文规定取代繁体字而推广使用的简体字。"],"q":"繁简字：即一为笔画比较多的字，一为笔画比较少的字，字音和字义都相同。","w":"high","e":["教材高频"]},{"t":"单音单义字","y":"名词解释","p":["单音单义字：即一形对一音一义。这样的字多半不是常用字，而是专用字或较冷僻的字。","现代汉字中许多字只有一个读音。","《汉字信息字典》所收7785个字中，单音字共7038个，占90%。"],"q":"单音单义字：即一形对一音一义。这样的字多半不是常用字，而是专用字或较冷僻的字。","w":"high","e":["教材高频"]},{"t":"辨析“同音字”与“同形字”。","y":"名词解释","p":["同音字：读音相同、意义不同且无联系，分同形/异形两类","同形字：书写形式相同，语音形式可同可不同","同形字音同义不同相当于狭义同音字，音义都不同相当于多音多义字"],"q":"同音字是指两个或两个以上的汉字，读音相同、意义不同而且意义没有联系。狭义的同音字只指同形同音异义字；广义的同音字还包括异形同音字。同形字：一是音相同，义不同，相当于狭义的同音字，例如“乘”动乘马、乘船与“乘”动进行乘法运算；二是音不同，义不同，相当于多音多义字，例如“打”(dǎ)动打仗、打球与“打”","w":"normal","e":["核心概念"]},{"t":"辨析“异体字”与“繁简字”两个概念。","y":"名词解释","p":["异体字：数形对一音一义，字形间无音义差别","繁简字：笔画多少不同，字音字义相同","异体字整理原则是从俗从简","繁简字由国家明文规定简化规则"],"q":"异体字（也叫异形字）：即数形对一音一义。不同字形之间没有任何音义差别。例如“拿”和“拏挐㧱”，经过整理，规定“拿”为正体字，淘汰了后三个字形。繁简字：即一为笔画比较多的字，一为笔画比较少的字，字音和字义都相同。例如“國”和“国”是繁体和简体的关系，都读guó，它们的字义都是“国家；代表国家的，属于本","w":"normal","e":["核心概念"]},{"t":"【原文】(2)字音与声旁的声母、","y":"教材原文","p":["(2)字音与声旁的声母、韵母相同，声调不同"],"q":"(2)字音与声旁的声母、韵母相同，声调不同。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】元(yuán)————远","y":"教材原文","p":["元(yuán)————远(yuǎn) 北(běi)————背(bèi)昌(chāng)————唱(chàng) 非(fēi) —— —— 匪(fěi)"],"q":"元(yuán)————远(yuǎn) 北(běi)————背(bèi)昌(chāng)————唱(chàng) 非(fēi) —— —— 匪(fěi)","w":"normal","e":["原书正文"]},{"t":"【原文】贝(bèi)————坝(","y":"教材原文","p":["贝(bèi)————坝(bà) 叉(chā)————钗(chāi)既(jì)————厩(jiù) 去(qù)————怯(qiè)"],"q":"贝(bèi)————坝(bà) 叉(chā)————钗(chāi)既(jì)————厩(jiù) 去(qù)————怯(qiè)","w":"normal","e":["原书正文"]},{"t":"【原文】寿(shòu)————筹","y":"教材原文","p":["寿(shòu)————筹(chóu) 户(hù)————雇(gù)山(shān)————灿(càn) 延(yán)————诞(dàn)"],"q":"寿(shòu)————筹(chóu) 户(hù)————雇(gù)山(shān)————灿(càn) 延(yán)————诞(dàn)","w":"normal","e":["原书正文"]},{"t":"【原文】(5)字音与声旁在声、韵","y":"教材原文","p":["(5)字音与声旁在声、韵、调上完全不同，或只是声调相同"],"q":"(5)字音与声旁在声、韵、调上完全不同，或只是声调相同。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】斥(chì)————诉(","y":"教材原文","p":["斥(chì)————诉(sù) 工(gōng)————江(jiāng)寺(sì)————特(tè) 者(zhě)————都(dōu)"],"q":"斥(chì)————诉(sù) 工(gōng)————江(jiāng)寺(sì)————特(tè) 者(zhě)————都(dōu)","w":"normal","e":["原书正文"]},{"t":"【原文】(二)统计声旁表音功能的","y":"教材原文","p":["(二)统计声旁表音功能的标准统计声旁的表音功能有严、宽两种不同的标准"],"q":"(二)统计声旁表音功能的标准统计声旁的表音功能有严、宽两种不同的标准。","w":"normal","e":["原书正文"]},{"t":"【原文】严格的标准是：声旁必须和","y":"教材原文","p":["严格的标准是：声旁必须和整字的声母、韵母、声调全部相同","这种声旁就叫“全表音声旁”","《现代汉字形声字字汇》(倪海曙编著，文字改革出版社1975)收正字5990个，声旁共1552个，其中成字声旁为1260个","成字声旁中除去多音声旁(例如“参”“长”等)外，一音声旁1090个"],"q":"严格的标准是：声旁必须和整字的声母、韵母、声调全部相同。这种声旁就叫“全表音声旁”。《现代汉字形声字字汇》(倪海曙编著，文字改革出版社1975)收正字5990个，声旁共1552个，其中成字声旁为1260个。成字声旁中除去多音声旁(例如“参”“长”等)外，一音声旁1090个。统计结果，字音与声旁的声、韵、调全部相同的只占26.3%。","w":"normal","e":["原书正文"]}]},{"id":"xdhy_up-c02-s06","t":"第六节 现代汉字的规范","w":"high","n":23,"k":[{"t":"四定","y":"名词解释","p":["现代汉字规范主要表现在定量、定形、定音和定序上，俗称“四定”。","2001年1月1日起施行的《中华人民共和国国家通用语言文字法》明确规定：“国家推广普通话，推行规范汉字。”"],"q":"现代汉字规范主要表现在定量、定形、定音和定序上，俗称“四定”。","w":"high","e":["2013 真题","2020 真题"]},{"t":"字序","y":"名词解释","p":["字序就是汉字排列的先后顺序。","汉字字序的复杂性表现为汉字的排序具有多样性和互补性的特点。","汉字序列法主要有两种：音序法、形序法，形序法又分部首法、笔画法和笔形法。"],"q":"字序就是汉字排列的先后顺序。","w":"high","e":["2012 真题","2019 真题"]},{"t":"常用字","y":"名词解释","p":["常用字就是书写现代汉语时经常要用到的字。","汉字总字数很多，通用字的数量也不少，可是人们经常使用的字量并不多，往往只集中在有限的两三千个字种上。","现代汉语常用字的特点：常用性、能产性、稳定性、简易性。"],"q":"常用字就是书写现代汉语时经常要用到的字。","w":"high","e":["2015 真题","2022 真题"]},{"t":"简化字","y":"名词解释","p":["简化字专指政府有关部门公布的规范的简体字。","“简体字”则有特定的含义，指由国家明文规定取代繁体字而推广使用的简体字。","1956年1月，国务院通过并发布了《汉字简化方案》；1964年重新整理、编制了《简化字总表》；1986年10月重新发表《简化字总表》，共收录简化字2235个。","同一个字有几个形体，笔画比较多的叫繁体字，笔画比较少的叫简体字。"],"q":"简化字专指政府有关部门公布的规范的简体字。“简体字”则有特定的含义，指由国家明文规定取代繁体字而推广使用的简体字。","w":"high","e":["2014 真题","2021 真题"]},{"t":"部首法","y":"名词解释","p":["部首法是东汉许慎在《说文解字》中首创的。","《说文解字》把汉字按其来源分为540部，每部把共同傍从的形旁字列在开头，称为部首。","部首法自创立以后千百年来一直为编纂字书的人所采用，只是分部的多少和字的归部原则有所不同。","语文学界把214部的部首系统称为“传统部首”，而把改变214部的现代各种部首系统称为“改良部首”。"],"q":"部首法是东汉许慎在《说文解字》中首创的。《说文解字》把汉字按其来源分为540部，每部把共同傍从的形旁字列在开头，称为部首。","w":"high","e":["2013 真题","2020 真题"]},{"t":"规范汉字","y":"名词解释","p":["“规范汉字”指经过系统整理、由国家发布、通行于大陆现代社会一般应用领域的标准汉字。","“经过系统整理”保证了科学性，“由国家发布”标明权威性，“通行于大陆”确定地域性，“通行于现代社会”指明时代性，“通行于一般应用领域”明确使用层面。"],"q":"“规范汉字”指经过系统整理、由国家发布、通行于大陆现代社会一般应用领域的标准汉字。","w":"high","e":["2019 真题"]},{"t":"通用规范汉字表","y":"名词解释","p":["《通用规范汉字表》于2013年6月5日由国务院发布。","《通用规范汉字表》收字8105个，分为三级。","该表发布后，社会一般应用领域的汉字使用应以此表为准，原有相关字表全部停止使用。","一级字表共收3500字，是使用频度最高的常用字集；二级字表共收3000字；一、二级字表合计6500字；三级字表收字1605个。","总体特点：整合多个规范，调适内部矛盾；照顾不同需要，科学划分字级；预测信息储备需要，增加特殊领域用字；促进海峡两岸信息互通，分解简繁对应关系。"],"q":"《通用规范汉字表》于2013年6月5日由国务院发布。《通用规范汉字表》收字8105个，分为三级。","w":"high","e":["2016 真题","2021 真题"]},{"t":"请说明《通用规范汉字表》的整体结构。","y":"名词解释","p":["收字8105个，分为三级","一级字表3500字，满足基础教育和文化普及","二级字表3000字，一二级合计6500字","三级字表1605个，满足专门领域用字需要"],"q":"《通用规范汉字表》收字8105个，分为三级。一级字表共收3500字，是使用频度最高的常用字集，主要满足基础教育和文化普及的基本用字需要。二级字表共收3000字，使用频度仅次于一级字。一、二级字表合计6500字，主要满足出版印刷、辞书编纂和信息处理等方面的一般用字需要。三级字表收字1605个，是姓氏人","w":"high","e":["2016 真题","2021 真题"]},{"t":"字种","y":"名词解释","p":["所谓的“字种”是指汉字的个体种类(即不同的汉字)，异体字、繁体字、简体字和变体字都不影响字种的数量。","例如“群、羣”以及“众、衆”都只算一个字种。","从汉代到现代，各个时代实际使用的汉字总数都不曾超出一万字。"],"q":"所谓的“字种”是指汉字的个体种类(即不同的汉字)，异体字、繁体字、简体字和变体字都不影响字种的数量。","w":"high","e":["教材高频"]},{"t":"定音","y":"名词解释","p":["定音就是确定现代汉字的规范字音。","《汉语拼音方案》（1958）确定了普通话的声、韵、调系统。","《普通话异读词审音表》（1985年修订稿）对一千多条异读词作了审订和修订，为字音的标准化打下了基础。"],"q":"定音就是确定现代汉字的规范字音。","w":"high","e":["教材高频"]},{"t":"音序法","y":"名词解释","p":["音序法是按照字音来排列字序的方法。","汉字的音序法经历了声韵序列法、注音字母序列法和汉语拼音字母序列法三个阶段。","汉语拼音序列法内部还有两种：单纯的字母序列法与“音节·汉字·字母分层序列法”。","用音序法排检汉字简单、迅速，一查即得。"],"q":"音序法是按照字音来排列字序的方法。","w":"high","e":["教材高频"]},{"t":"形序法","y":"名词解释","p":["形序法是按照字形的各个方面特点来排列字序的方法。","形序法包括部首法、笔画法、四角号码法等，其中部首法历史最悠久，使用也最普遍。","目前大都采用混合法：A.“笔画——笔形法”，B.“笔形——笔画法”。"],"q":"形序法是按照字形的各个方面特点来排列字序的方法。","w":"high","e":["教材高频"]},{"t":"通用汉字","y":"名词解释","p":["通用汉字就是书写现代汉语通常要用到的字，也就是除去有特定使用范围的专用字和罕用的生僻字以后的那一部分字。","从商代到现代，一般通用层面使用的汉字数量没有显著变化，可能一直在五六千个左右。","通用字是相对于专用字而言的。"],"q":"通用汉字就是书写现代汉语通常要用到的字，也就是除去有特定使用范围的专用字和罕用的生僻字以后的那一部分字。","w":"high","e":["教材高频"]},{"t":"字形整理","y":"名词解释","p":["以前，我国出版物上使用的汉字字形相当混乱，除了繁体、简体的问题外，还存在字形的小差异。","有些字的结构和轮廓相同，笔画数目和笔形却有少量差异。","1965年1月，文化部和中国文字改革委员会联合发布《印刷通用汉字字形表》，为6196个通用汉字规定了通用字体的印刷规范字形。","之后，人们就把《印刷通用汉字字形表》规定的字形称为新字形。"],"q":"以前，我国出版物上使用的汉字字形相当混乱，除了繁体、简体的问题外，还存在字形的小差异。","w":"high","e":["教材高频"]},{"t":"异体字整理","y":"名词解释","p":["异体字指音义都相同仅形不同的字。","整理异体字时，主要采用“从俗从简”的原则。","1955年发布的《第一批异体字整理表》，除了符合严式定义的异体字外，还有包孕关系的异体字、交叉关系的异体字。","从俗，即去生留熟；从简，即选用笔画相对较少的字形。当从俗从简不一致时，往往依据从俗。"],"q":"异体字指音义都相同仅形不同的字。整理异体字时，主要采用“从俗从简”的原则。","w":"high","e":["教材高频"]},{"t":"【原文】(6)同音字：狭义的同音","y":"教材原文","p":["(6)同音字：狭义的同音字指同形同音异义字，例如“打仗”的“打”和“打哪里来”的“打”，字形、字音相同，字义不同","广义的同音字指异形同音异义字，例如“张”“章”“漳”“蟑”，字形不同，字音都是zhāng，字义各异"],"q":"(6)同音字：狭义的同音字指同形同音异义字，例如“打仗”的“打”和“打哪里来”的“打”，字形、字音相同，字义不同。广义的同音字指异形同音异义字，例如“张”“章”“漳”“蟑”，字形不同，字音都是zhāng，字义各异。","w":"normal","e":["原书正文"]},{"t":"【原文】(7)同形字：一是音相同","y":"教材原文","p":["(7)同形字：一是音相同，义不同，相当于狭义的同音字","例如“乘”，动乘马，乘船","“乘”，动进行乘法运算","二是音不同，义不同，相当于多音多义字"],"q":"(7)同形字：一是音相同，义不同，相当于狭义的同音字。例如“乘”，动乘马，乘船；“乘”，动进行乘法运算。二是音不同，义不同，相当于多音多义字。例如“打”(dǎ)，动打仗，打球；“打”(dǎ)，打哪儿来。/“打”(dá),十二个为一打。","w":"normal","e":["原书正文"]},{"t":"【原文】(1)单音单义字一形：一","y":"教材原文","p":["(1)单音单义字一形：一音一义灸jiǔ艾绒熏烤穴位"],"q":"(1)单音单义字一形：一音一义灸jiǔ艾绒熏烤穴位","w":"normal","e":["原书正文"]},{"t":"【原文】(2)多音多义字一形：数","y":"教材原文","p":["(2)多音多义字一形：数音数义打dá音译量词，十二个为一打dǎ动词，“打铁”之类介词，“打哪儿来?”"],"q":"(2)多音多义字一形：数音数义打dá音译量词，十二个为一打dǎ动词，“打铁”之类介词，“打哪儿来?”","w":"normal","e":["原书正文"]},{"t":"【原文】(3)异读字一形：数音一","y":"教材原文","p":["(3)异读字一形：数音一义械xiè规范读音jiè此音已淘汰"],"q":"(3)异读字一形：数音一义械xiè规范读音jiè此音已淘汰","w":"normal","e":["原书正文"]},{"t":"【原文】(4)异体字数形：一音一","y":"教材原文","p":["(4)异体字数形：一音一义A. “拿”和“拏挐舒”"],"q":"(4)异体字数形：一音一义A. “拿”和“拏挐舒”","w":"normal","e":["原书正文"]},{"t":"【原文】(6)同音字一形：一音数","y":"教材原文","p":["(6)同音字一形：一音数义数形：一音数义“打”(打仗)和“打”(打哪儿来)“张、章、彰、樟、蟑”，字义各异"],"q":"(6)同音字一形：一音数义数形：一音数义“打”(打仗)和“打”(打哪儿来)“张、章、彰、樟、蟑”，字义各异","w":"normal","e":["原书正文"]},{"t":"【原文】(7)同形字一形：一音数","y":"教材原文","p":["(7)同形字一形：一音数义一形：数音数义“乘”(乘船)和“乘”(进行乘法运算)“中”(zhōng跟四周距离相等、中国)和“中”(zhòng正对上、受到)"],"q":"(7)同形字一形：一音数义一形：数音数义“乘”(乘船)和“乘”(进行乘法运算)“中”(zhōng跟四周距离相等、中国)和“中”(zhòng正对上、受到)","w":"normal","e":["原书正文"]}]},{"id":"xdhy_up-c02-s07","t":"第七节 现代汉字的信息处理","w":"high","n":17,"k":[{"t":"汉字信息处理","y":"名词解释","p":["汉字信息处理就是利用计算机对汉字符号系统进行处理的一项科学技术。","所谓语言信息处理就是指用计算机对自然语言的形、音、义等信息进行处理。","汉字信息处理不等同于中文信息处理。汉字信息处理系统则是中文信息处理系统中一个关键和基础的部分。","汉字信息处理，对使用者来说，最主要的是汉字信息的输入与输出。"],"q":"汉字信息处理就是利用计算机对汉字符号系统进行处理的一项科学技术。","w":"high","e":["2014 真题","2019 真题"]},{"t":"汉语拼音输入法","y":"名词解释","p":["汉语拼音输入是以汉语拼音连续输入为手段，而由计算机自动转换为汉字的一种计算机汉字处理技术。","汉语拼音输入法的优越性：不需要编码规则；体现语言中以词为单位的特点；输入与思维同步进行；有利于学习普通话和汉语拼音；有利于国际的信息交流。","汉语拼音输入法符合我国国策，是发展方向。其中减少同音选择是完善汉语拼音输入法的关键。"],"q":"汉语拼音输入是以汉语拼音连续输入为手段，而由计算机自动转换为汉字的一种计算机汉字处理技术。","w":"high","e":["2015 真题","2021 真题"]},{"t":"音码","y":"名词解释","p":["音码是按照汉字字音编码输入的设计。音码输入实际上是一种拼音转换法，即利用现行的汉语拼音方案输入拼音，把汉字转换成国际通用的拼音编码输入计算机，再由计算机自动转换为汉字。","拼音编码输入法在具体实施中有两种不同的方案：一种是全拼式，一种是双拼式。","音码的优点在于它可以使用计算机上的通用键盘，并且只要使用者基本掌握汉语拼音方案和普通话语音即可进行操作，不需要专门培训。缺点在于同音字需要二次选择，影响输入速度。"],"q":"音码是按照汉字字音编码输入的设计。音码输入实际上是一种拼音转换法，即利用现行的汉语拼音方案输入拼音，把汉字转换成国际通用的拼音编码输入计算机，再由计算机自动转换为汉字。","w":"high","e":["教材高频"]},{"t":"形码","y":"名词解释","p":["形码是按照汉字字形编码输入的设计。它将汉字的形体分解为若干字元（例如笔画、部件、偏旁、部首），再利用字元代码表和字元排列顺序规则得到汉字编码，然后在键盘上输入。","形码着眼于汉字形体，有效地避免了同音字的问题，因此输入速度大大提高。其缺点在于掌握字形编码方案需要专门训练。","常见的字形编码方案有笔形编码、部件编码、部首编码和四角编码等四种。"],"q":"形码是按照汉字字形编码输入的设计。它将汉字的形体分解为若干字元（例如笔画、部件、偏旁、部首），再利用字元代码表和字元排列顺序规则得到汉字编码，然后在键盘上输入。","w":"high","e":["教材高频"]},{"t":"点阵法","y":"名词解释","p":["点阵法是最早使用的一种字形描述方法。","汉字打印机、汉字显示终端以及计算机——激光汉字编辑排版系统等汉字输出设备，都要把汉字字形变成数字化的点阵。","点阵利用位于一定栅格内的黑点和白点来存储、显示和打印汉字字形。"],"q":"点阵法是最早使用的一种字形描述方法。","w":"high","e":["教材高频"]},{"t":"整字输入法","y":"名词解释","p":["整字输入法是把整个汉字作为输入符号。一般是把几千个汉字按照一定的顺序排列在一个大键盘上，使用者用键盘击打或电笔点触输入。","汉字键盘输入方式大体上经历了三个发展阶段：整字输入法、汉字编码输入法、汉语拼音输入法。","这种大键盘输入方式的优点是一字一键，无重码，直观性好，操作简单；缺点是需要特制键盘，速度较慢，设备笨重，成本昂贵，难以普及。"],"q":"整字输入法是把整个汉字作为输入符号。一般是把几千个汉字按照一定的顺序排列在一个大键盘上，使用者用键盘击打或电笔点触输入。","w":"high","e":["教材高频"]},{"t":"音形结合码","y":"名词解释","p":["为了克服形码和音码各自的缺点，形音结合的输入法应运而生。这类编码方案又可分为两种：一种是以字形为主字音为辅的形音码，一种是以字音为主字形为辅的音形码。","形音码与纯形码的不同在于还要利用某些字音信息，即在形码上附加音码。","在实际操作过程中，音形信息的转换往往影响使用者思想的连贯性。"],"q":"为了克服形码和音码各自的缺点，形音结合的输入法应运而生。这类编码方案又可分为两种：一种是以字形为主字音为辅的形音码，一种是以字音为主字形为辅的音形码。","w":"high","e":["教材高频"]},{"t":"汉字编码输入法","y":"名词解释","p":["汉字编码输入法是把每个汉字编成一个代码，然后利用国际通用小键盘把代码输入计算机。","这种输入法需要进行专门的学习和训练，优点是速度快、重码少，但是写作过程不断受到干扰，使用起来十分不便。","根据抽取汉字信息特征的不同，汉字编码方案可分为音码、形码、音形结合码三类。"],"q":"汉字编码输入法是把每个汉字编成一个代码，然后利用国际通用小键盘把代码输入计算机。","w":"high","e":["教材高频"]},{"t":"汉字的字形识别输入","y":"名词解释","p":["汉字的字形识别输入就是通过特定的文图扫描装置，对印刷在纸上或写在纸上的汉字字符进行分类判别。它用光学字符识别器“扫描仪”抽取汉字字形特征，将纸面上的汉字信息转换成离散的电信号，然后再送入计算机识别，形成汉字内部码。","汉字识别在学科上属于模式识别和人工智能范畴，在应用上属于汉字信息处理系统的一种高速输入方式。","目前比较成熟的识别方法有图形匹配法和结构分析法两种。"],"q":"汉字的字形识别输入就是通过特定的文图扫描装置，对印刷在纸上或写在纸上的汉字字符进行分类判别。它用光学字符识别器“扫描仪”抽取汉字字形特征，将纸面上的汉字信息转换成离散的电信号，然后再送入计算机识别，形成汉字内部码。","w":"high","e":["教材高频"]},{"t":"【原文】系：“系统”“中文系”(","y":"教材原文","p":["系：“系统”“中文系”(非简化字)","“关系(係)”“系(繋)绳子”(简化字)"],"q":"系：“系统”“中文系”(非简化字)；“关系(係)”“系(繋)绳子”(简化字)。","w":"normal","e":["原书正文"]},{"t":"【原文】干：“干支”“相干”(非","y":"教材原文","p":["干：“干支”“相干”(非简化字)","“干(乾)净”“干(幹)活儿”(简化字)"],"q":"干：“干支”“相干”(非简化字)；“干(乾)净”“干(幹)活儿”(简化字)。","w":"normal","e":["原书正文"]},{"t":"【原文】有的人不了解这种同形字现","y":"教材原文","p":["有的人不了解这种同形字现象，遇到要写繁体字的场合，就会产生差错","电脑进行简繁体自动转换时，也时常出现这类毛病："],"q":"有的人不了解这种同形字现象，遇到要写繁体字的场合，就会产生差错。电脑进行简繁体自动转换时，也时常出现这类毛病：","w":"normal","e":["原书正文"]},{"t":"【原文】窗明幾净(应是“窗明几净","y":"教材原文","p":["窗明幾净(应是“窗明几净”)、封麺設計(应是“封面设计”)聖賢故裏(应是“聖賢故里”)、詩雲子曰(应是“詩云子曰”)"],"q":"窗明幾净(应是“窗明几净”)、封麺設計(应是“封面设计”)聖賢故裏(应是“聖賢故里”)、詩雲子曰(应是“詩云子曰”)","w":"normal","e":["原书正文"]},{"t":"【原文】(4)简化偏旁的类推可能","y":"教材原文","p":["(4)简化偏旁的类推可能出现问题","因为汉字简化时，为了求简，汉字构字的系统性常常会有所突破：一是相同的偏旁部件简化后，却分化为不同的偏旁，例如“卢(盧)”“泸(瀘)”“颅(顱)”“鲈(鱸)”“炉(爐)”“庐(廬)”“芦(蘆)”“驴(驢)”，声符“盧”简化后分化为“卢”和“户”","二是繁体字中不同的偏旁简化后，反而成为相同的偏旁，例如“邓(鄧)”“对(對)”“难(難)”“欢(歡)”“戏(戲)”，左偏旁都简化成了“又”","不熟悉简化字的人要特别注意这类情况，防止不恰当的简化偏旁类推"],"q":"(4)简化偏旁的类推可能出现问题。因为汉字简化时，为了求简，汉字构字的系统性常常会有所突破：一是相同的偏旁部件简化后，却分化为不同的偏旁，例如“卢(盧)”“泸(瀘)”“颅(顱)”“鲈(鱸)”“炉(爐)”“庐(廬)”“芦(蘆)”“驴(驢)”，声符“盧”简化后分化为“卢”和“户”；二是繁体字中不同的偏旁简化后，反而成为相同的偏旁，例如“邓(鄧)”“对(對)”“难","w":"normal","e":["原书正文"]},{"t":"【原文】1.异体字的定义异体字指","y":"教材原文","p":["1.异体字的定义异体字指音义都相同仅形不同的字","例如“吸yān”的yān，至少有三种写法：“烟/煙/菸”","这三个字形互为异体字，经过整理以后，正字规定为“烟”，称为“选用字”，而把另外两个非选用字“煙/菸”称为“异体字”"],"q":"1.异体字的定义异体字指音义都相同仅形不同的字。例如“吸yān”的yān，至少有三种写法：“烟/煙/菸”。这三个字形互为异体字，经过整理以后，正字规定为“烟”，称为“选用字”，而把另外两个非选用字“煙/菸”称为“异体字”。","w":"normal","e":["原书正文"]},{"t":"【原文】1955年发布的《第一批","y":"教材原文","p":["1955年发布的《第一批异体字整理表》，除了符合严式定义的异体字外，还有包孕关系的异体字，即甲字的音义多于乙字，例如“豆”“荳”只在“黄豆、绿豆的豆”这个音义上构成异体字关系","还有交叉关系的异体字，即甲字只有部分音义跟乙字的部分音义相同，例如“夹”“挟”只在字音是jiā、字义是“夹在胳膊底下”时构成异体字关系"],"q":"1955年发布的《第一批异体字整理表》，除了符合严式定义的异体字外，还有包孕关系的异体字，即甲字的音义多于乙字，例如“豆”“荳”只在“黄豆、绿豆的豆”这个音义上构成异体字关系；还有交叉关系的异体字，即甲字只有部分音义跟乙字的部分音义相同，例如“夹”“挟”只在字音是jiā、字义是“夹在胳膊底下”时构成异体字关系。","w":"normal","e":["原书正文"]},{"t":"【原文】《第一批异体字整理表》把","y":"教材原文","p":["《第一批异体字整理表》把“包孕异体字”“交叉异体字”也作为整理对象，且采用淘汰的办法，曾给社会用字带来不便","典型的例子是“熔[鎔]”，这两个字仅在字义同为“熔化”时构成异体字关系，而“鎔”还有“铸器的模型”“矛类武器”等字义","不恰当地淘汰了“鎔”，一度给报刊报道有关“朱镕基”的消息时造成诸多麻烦"],"q":"《第一批异体字整理表》把“包孕异体字”“交叉异体字”也作为整理对象，且采用淘汰的办法，曾给社会用字带来不便。典型的例子是“熔[鎔]”，这两个字仅在字义同为“熔化”时构成异体字关系，而“鎔”还有“铸器的模型”“矛类武器”等字义。不恰当地淘汰了“鎔”，一度给报刊报道有关“朱镕基”的消息时造成诸多麻烦。","w":"normal","e":["原书正文"]}]}]},{"id":"xdhy_up-c03","t":"第三章 词汇","w":"high","s":[{"id":"xdhy_up-c03-s01","t":"第一节 现代汉语词汇概述","w":"high","n":15,"k":[{"t":"词汇","y":"名词解释","p":["词汇也称语汇，是语言中能独立运用的最小的音义结合单位的集合，有时也可以指特定领域中词语的集合。","词语是能够独立运用的音义结合的最小语言单位。词语包括词和固定短语，词是词汇的主体部分，而固定短语是词汇的重要组成部分。","词语的总和形成词汇，词汇与词语的关系是集合与个体的关系。","根据语言差异，词汇可分为汉语词汇、英语词汇、德语词汇等；根据领域不同，词汇可分为政治词汇、经济词汇、法律词汇等。"],"q":"词汇也称语汇，是语言中能独立运用的最小的音义结合单位的集合，有时也可以指特定领域中词语的集合。","w":"high","e":["教材高频"]},{"t":"语素","y":"名词解释","p":["语素是语言中最小的音义结合的构词单位，是最基本的语言单位。","一个语素必须是语音与语义结合，而且不能再拆分。其中，具有一定的语义是判断语素的最基本条件。","汉语绝大多数语素是一个有意义的音节。如“床”的语音形式是chuáng，它的语义内容是“供人躺在上面睡觉的家具”，那么，“床”就是一个语素。","有少数语素是由两个无意义的音节合成的。如“玻璃”，它的语音形式是bōli，语义是“一种质地硬而脆的透明物体”。“玻”和“璃”虽然都有语音形式，但都没有单独的语义，因此都不是语素；只有“玻璃”才是一个语素。"],"q":"语素是语言中最小的音义结合的构词单位，是最基本的语言单位。一个语素必须是语音与语义结合，而且不能再拆分。其中，具有一定的语义是判断语素的最基本条件。","w":"high","e":["教材高频"]},{"t":"扩展法","y":"名词解释","p":["扩展法就是在一个语言单位内部插入其他成分，来观察语言单位的意义是否发生了改变。","如果语言单位的意义改变了或者不合法，则说明该语言单位在意义上是最小的，是词，否则就是短语。","词的意义具有凝固性和专指性，不可以扩展，而短语的意义具有分析性，可以扩展。因此，“扩展法”是区别词和短语的基本方法。"],"q":"扩展法就是在一个语言单位内部插入其他成分，来观察语言单位的意义是否发生了改变。","w":"high","e":["教材高频"]},{"t":"离合词","y":"名词解释","p":["有些双音节词在中间可以插入别的成分而变成短语，这类可以插入别的成分变成短语的词叫“离合词”。","常见的离合词有“洗澡、站岗、生气、结亲、伤心、帮忙、随便、游泳、推翻、说服、打倒、看见”等。"],"q":"有些双音节词在中间可以插入别的成分而变成短语，这类可以插入别的成分变成短语的词叫“离合词”。","w":"high","e":["教材高频"]},{"t":"成词语素","y":"名词解释","p":["能够独立成词的语素是成词语素。","不能独立成词的语素是不成词语素，它只是词语的构成单位。","成词语素如：他、书、看、来、好、就、很、也、了、被、呢、吗、葡萄、牡丹、啰唆、朦胧等；不成词语素如：童(心)、日(子)、衣(服)、朗(读)、历(史)、肃(清)、(人)民、(丢)失等。"],"q":"能够独立成词的语素是成词语素。","w":"high","e":["教材高频"]},{"t":"定位语素","y":"名词解释","p":["一个语素同别的语素组合成词时，位置固定的语素叫定位语素。","根据位置的前后，又分为前置定位语素和后置定位语素。","前缀如：非(非常、非凡、非法、非分等)；后缀如：者(读者、记者、作者、学者等)、化(绿化、美化、净化、激化等)。","一个语素同别的语素组合成词时，位置不固定的语素叫不定位语素，如“电”可以前置（电器、电子、电影），也可以后置（闪电、雷电、水电）。"],"q":"一个语素同别的语素组合成词时，位置固定的语素叫定位语素。","w":"high","e":["教材高频"]},{"t":"意义整合","y":"名词解释","p":["词的意义比较凝固，往往不是语素意义的简单相加，具有综合性。","自由短语的意义往往可以从组成成分及其意义关系上给予解释，其组成成分在意义上具有相对独立性，短语的整体意义是组合成分意义的加合，具有分析性。","比如：指称一种蔬菜的“白菜”不等于“白色的菜”，指称一种教具的“黑板”不等于“黑色的板”；而“白布”就是“白色的布”，“门窗”就是指“门”和“窗”。"],"q":"词的意义比较凝固，往往不是语素意义的简单相加，具有综合性。","w":"high","e":["教材高频"]},{"t":"【原文】(2)体现语言中以词为单","y":"教材原文","p":["(2)体现语言中以词为单位的特点","它的词库里贮存大量现代汉语的词汇，词汇之间可以自动切换，这样就在很大程度上弥补了同音字多的不足"],"q":"(2)体现语言中以词为单位的特点。它的词库里贮存大量现代汉语的词汇，词汇之间可以自动切换，这样就在很大程度上弥补了同音字多的不足。","w":"normal","e":["原书正文"]},{"t":"【原文】(3)输入与思维同步进行","y":"教材原文","p":["(3)输入与思维同步进行","汉语拼音输入法要求人们向计算机输入规范的汉语拼音，实质上是要求人们在键盘上使用汉语拼音来书写普通话，把写作者的思想直接表达出来","这一点对使用电脑写作的人来说，具有特别意义"],"q":"(3)输入与思维同步进行。汉语拼音输入法要求人们向计算机输入规范的汉语拼音，实质上是要求人们在键盘上使用汉语拼音来书写普通话，把写作者的思想直接表达出来。这一点对使用电脑写作的人来说，具有特别意义。","w":"normal","e":["原书正文"]},{"t":"【原文】(4)有利于学习普通话和","y":"教材原文","p":["(4)有利于学习普通话和汉语拼音","应用汉语拼音输入法一般不需要经过特别培训，相反地还可以进一步帮助人们学好普通话和汉语拼音"],"q":"(4)有利于学习普通话和汉语拼音。应用汉语拼音输入法一般不需要经过特别培训，相反地还可以进一步帮助人们学好普通话和汉语拼音。","w":"normal","e":["原书正文"]},{"t":"【原文】(5)有利于国际的信息交","y":"教材原文","p":["(5)有利于国际的信息交流","汉语拼音已经成为国际标准，因此，外国人同样可以使用汉语拼音输入法来操作计算机，在信息网络上获取他们所需要的汉语汉字信息","任何汉字字形编码都无法取代汉语拼音这一重要作用"],"q":"(5)有利于国际的信息交流。汉语拼音已经成为国际标准，因此，外国人同样可以使用汉语拼音输入法来操作计算机，在信息网络上获取他们所需要的汉语汉字信息。任何汉字字形编码都无法取代汉语拼音这一重要作用。","w":"normal","e":["原书正文"]},{"t":"【原文】汉语拼音输入法符合我国国","y":"教材原文","p":["汉语拼音输入法符合我国国策，是发展方向，但在实际应用中还存在一些问题，需要逐步解决，使之日趋完善","其中减少同音选择是完善汉语拼音输入法的关键","实践经验告诉我们，“以词定字”“高频先见”和“用过提前”是根据汉语内在规律总结出来的减少同音选择的好方法"],"q":"汉语拼音输入法符合我国国策，是发展方向，但在实际应用中还存在一些问题，需要逐步解决，使之日趋完善。其中减少同音选择是完善汉语拼音输入法的关键。实践经验告诉我们，“以词定字”“高频先见”和“用过提前”是根据汉语内在规律总结出来的减少同音选择的好方法。","w":"normal","e":["原书正文"]},{"t":"【原文】(二)汉字的字形识别输入","y":"教材原文","p":["(二)汉字的字形识别输入采用键盘输入方式，要靠操作人员击键输入，速度较慢，工作量也大","如果能让计算机自动识别汉字，将会极大地提高整个计算机系统的效率"],"q":"(二)汉字的字形识别输入采用键盘输入方式，要靠操作人员击键输入，速度较慢，工作量也大。如果能让计算机自动识别汉字，将会极大地提高整个计算机系统的效率。","w":"normal","e":["原书正文"]},{"t":"【原文】82 第二章 汉 字汉字","y":"教材原文","p":["82 第二章 汉 字汉字的字形识别输入就是通过特定的文图扫描装置，对印刷在纸上或写在纸上(或其他材料上)的汉字字符进行分类判别","它用光学字符识别器“扫描仪”抽取汉字字形特征，将纸面上的汉字信息转换成离散的电信号，然后再送入计算机识别，形成汉字内部码","汉字识别在学科上属于模式识别和人工智能范畴，在应用上属于汉字信息处理系统的一种高速输入方式"],"q":"82 第二章 汉 字汉字的字形识别输入就是通过特定的文图扫描装置，对印刷在纸上或写在纸上(或其他材料上)的汉字字符进行分类判别。它用光学字符识别器“扫描仪”抽取汉字字形特征，将纸面上的汉字信息转换成离散的电信号，然后再送入计算机识别，形成汉字内部码。汉字识别在学科上属于模式识别和人工智能范畴，在应用上属于汉字信息处理系统的一种高速输入方式。","w":"normal","e":["原书正文"]},{"t":"【原文】目前比较成熟的识别方法有","y":"教材原文","p":["目前比较成熟的识别方法有图形匹配法和结构分析法两种","图形匹配法就是将输入的待识别的汉字图形跟存储在计算机内的标准汉字图形直接进行配比，求出它们的相似度","跟待识别字相似度最大的标准汉字就是机器寻求的答案","结构分析法首先要通过对汉字图形结构的分析提取汉字的特征量，然后根据待识别字的特征量跟存储在机器内的标准汉字的相应特征量之间的距离来判定汉字字种的归属"],"q":"目前比较成熟的识别方法有图形匹配法和结构分析法两种。图形匹配法就是将输入的待识别的汉字图形跟存储在计算机内的标准汉字图形直接进行配比，求出它们的相似度。跟待识别字相似度最大的标准汉字就是机器寻求的答案。结构分析法首先要通过对汉字图形结构的分析提取汉字的特征量，然后根据待识别字的特征量跟存储在机器内的标准汉字的相应特征量之间的距离来判定汉字字种的归属。","w":"normal","e":["原书正文"]}]},{"id":"xdhy_up-c03-s02","t":"第二节 构词法与造词法","w":"high","n":24,"k":[{"t":"词根","y":"名词解释","p":["词根是构成合成词的有实在意义的不定位语素。","合成词是由两个或两个以上语素构成的词。根据语素在合成词中的表义作用，把语素分为词根和词缀。","词缀是构成合成词的附着在词根前后或中间表示附加意义的定位语素。"],"q":"词根是构成合成词的有实在意义的不定位语素。","w":"high","e":["教材高频"]},{"t":"词缀","y":"名词解释","p":["词缀是构成合成词的附着在词根前后或中间表示附加意义的定位语素。","合成词根据词缀的位置，可以分成前缀、后缀、中缀三种类型。","汉语里典型词缀并不太丰富，但是存在比较多的“类词缀”，特点是类似于词缀，意义有不同程度的虚化，但还不彻底；构词功能很强，有组合泛化趋势；其中，后缀与类后缀型最为丰富，中缀和类中缀最少。"],"q":"词缀是构成合成词的附着在词根前后或中间表示附加意义的定位语素。","w":"high","e":["教材高频"]},{"t":"构词法","y":"名词解释","p":["构词法是指语素构成词的方式和方法，是对已有词的音节特征和结构关系进行静态的分析和分类。","“构词法”和“造词法”组成了词汇的两大构造系统。","构词法是研究语素如何构成词的方法。"],"q":"构词法是指语素构成词的方式和方法，是对已有词的音节特征和结构关系进行静态的分析和分类。","w":"high","e":["教材高频"]},{"t":"造词法","y":"名词解释","p":["造词法是指人们创造新词的方式和方法，是对新造词的形成方式进行动态的分析和分类。","造词法解决了一个词从无到有的问题，即为了命名新事物和新现象而创造新词的方法。","人们在命名事物和现象而创造新词时，可以根据本民族的语言习惯和对事物现象的认识，运用现有的语言材料创造并组合各种各样的新词。"],"q":"造词法是指人们创造新词的方式和方法，是对新造词的形成方式进行动态的分析和分类。","w":"high","e":["教材高频"]},{"t":"单纯词","y":"名词解释","p":["由一个语素构成的词是单纯词，不存在内部构造问题，但可以根据构词语素的音节特征来划分类型。","根据音节的数量，单纯词可以分为单音节、双音节和多音节三类。","双音节单纯词包括联绵词、叠音词、音译词和拟声词四类。"],"q":"由一个语素构成的词是单纯词，不存在内部构造问题，但可以根据构词语素的音节特征来划分类型。","w":"high","e":["教材高频"]},{"t":"联绵词","y":"名词解释","p":["联绵词是从古代汉语中流传下来的，由两个没有意义的音节连缀成义而形成的词。","根据联绵词两个音节的声母、韵母关系，联绵词可以分为三类：双声词、叠韵词、非双声叠韵词。","双声词指声母相同的联绵词；叠韵词指韵母相同的联绵词；非双声叠韵词指声母和韵母都不相同或不相近的联绵词。"],"q":"联绵词是从古代汉语中流传下来的，由两个没有意义的音节连缀成义而形成的词。","w":"high","e":["教材高频"]},{"t":"叠音词","y":"名词解释","p":["叠音词是同一个音节重叠而成的单纯词。","叠音词属于双音节单纯词，与重叠式合成词（如“爸爸、常常”）不同。"],"q":"叠音词是同一个音节重叠而成的单纯词。","w":"high","e":["教材高频"]},{"t":"复合词","y":"名词解释","p":["复合式合成词指由至少两个不同词根组合而成的合成词，这是现代汉语最重要的构词法。","根据词根与词根的意义与结构关系，复合词主要有五种类型：联合型、偏正型、述宾型、补充型、主谓型。","联合型由两个意义相同、相近、相关或相反的词根并列组合而成；偏正型前一个词根修饰限制后一个词根；述宾型前后词根构成支配与被支配的关系；补充型后一个词根补充说明前一个词根；主谓型前一个词根是被陈述对象，后一个表示陈述。"],"q":"复合式合成词指由至少两个不同词根组合而成的合成词，这是现代汉语最重要的构词法。","w":"high","e":["教材高频"]},{"t":"派生词","y":"名词解释","p":["派生式合成词是指由词根和词缀组合而成的词。","根据词缀的位置，可以分成前缀、后缀、中缀三种类型。","汉语里典型词缀并不太丰富，但是存在比较多的“类词缀”，特点是类似于词缀，意义有不同程度的虚化，但还不彻底。"],"q":"派生式合成词是指由词根和词缀组合而成的词。","w":"high","e":["教材高频"]},{"t":"重叠词","y":"名词解释","p":["重叠式合成词是通过同一词根的重叠而形成合成词的方式。","重叠词主要分两种：AA型（如爸爸、常常）和AABB型（如骂骂咧咧、花花绿绿）。","AABB型重叠式合成词既没有对应的AB型词，也没有因重叠而增加语法上的意义，属于词法学的构词重叠；而“漂漂亮亮、大大方方”都有对应词“漂亮、大方”，重叠形式具有“程度加强”的语法意义，属于语法学的构形重叠。"],"q":"重叠式合成词是通过同一词根的重叠而形成合成词的方式。","w":"high","e":["教材高频"]},{"t":"摹音式","y":"名词解释","p":["摹音式是用汉语的语音形式模拟事物发出的声音或外语词的发音来创造新词的方法。","摹音式是语音指称法的一种，分为指音型、指情型、指物型、译音型。","指音型通过模仿事物发出的声音来指称该声音；指情型通过模仿人发出的声音来指称人之情感；指物型通过模仿事物发出的声音来指称该事物；译音型通过汉字来记录外语词的发音。"],"q":"摹音式是用汉语的语音形式模拟事物发出的声音或外语词的发音来创造新词的方法。","w":"high","e":["教材高频"]},{"t":"类推型","y":"名词解释","p":["类推型是根据与已有概念的语义关系类推成词的方法。","类推型是直指式的一种，分类义类推和反义类推。","类义类推如：雨衣→风衣；文盲→科盲、法盲、音盲、色盲；反义类推如：空姐→空嫂、空哥；国手→国脚；冷门儿→热门儿。"],"q":"类推型是根据与已有概念的语义关系类推成词的方法。","w":"high","e":["教材高频"]},{"t":"语义关联法","y":"名词解释","p":["语义关联法主要是以概念与概念之间的语义关联为基础，通过组合或比拟等手段来直指或喻指事物现象的方法。","语义关联法分为直指式和喻指式两类。","直指式通过概念之间的关联直指事物现象；喻指式通过概念之间的关联喻指事物现象，包括比喻型、引申型、借代型。"],"q":"语义关联法主要是以概念与概念之间的语义关联为基础，通过组合或比拟等手段来直指或喻指事物现象的方法。","w":"high","e":["教材高频"]},{"t":"构词分析法","y":"名词解释","p":["构词分析法就是通过综合全面地分析一个词的构词情况来确定该词的词义内容。","这种析义方法最适用于单音多义词。","一个单音多义词往往不容易明确该词的各个义项及其关系，而通过综合分析该词所构成的合成词，比较容易确定该词的多种义项。"],"q":"构词分析法就是通过综合全面地分析一个词的构词情况来确定该词的词义内容。","w":"high","e":["教材高频"]},{"t":"辨析“构词法”和“造词法”。","y":"名词解释","p":["构词法：语素构成词的方式方法，静态分析","造词法：创造新词的方式方法，动态分析","构词法研究语素如何构成词，造词法解决词从无到有","二者一静一动，互为补充"],"q":"构词法与造词法是词汇的两大构造系统，区别在于：(1)构词法是指语素构成词的方式和方法，是对已有词的音节特征和结构关系进行静态的分析和分类，研究语素如何构成词；(2)造词法是指人们创造新词的方式和方法，是对新造词的形成方式进行动态的分析和分类，解决了一个词从无到有的问题。简言之，构词法是静态的分析，造","w":"high","e":["教材高频"]},{"t":"辨析“叠音词”和“重叠式合成词”。","y":"名词解释","p":["叠音词：同一个音节重叠而成的单纯词，由单一语素构成","重叠式合成词：同一词根重叠而成的合成词","关键区别：叠音词是一个语素的单纯词，重叠式合成词是两个语素的合成词"],"q":"叠音词和重叠式合成词都涉及音节的重复，但性质不同。(1)叠音词是同一个音节重叠而成的单纯词，由单一语素构成，如太太、奶奶、蝈蝈、猩猩，其中的单个音节没有独立意义。(2)重叠式合成词是通过同一词根的重叠而形成的，属于合成词，分AA型和AABB型，如爸爸、妈妈、仅仅、常常（AA型），骂骂咧咧、花花绿绿（","w":"high","e":["教材高频"]},{"t":"【原文】研究 沙龙 汪洋 仿佛 ","y":"教材原文","p":["研究 沙龙 汪洋 仿佛 荒唐 荒原 精密 玻璃二、区别下列语素属于哪一种：成词语素、不成词语素","定位语素、不定位语素"],"q":"研究 沙龙 汪洋 仿佛 荒唐 荒原 精密 玻璃二、区别下列语素属于哪一种：成词语素、不成词语素；定位语素、不定位语素。","w":"normal","e":["原书正文"]},{"t":"【原文】的士 琵琶 微 啊 过 ","y":"教材原文","p":["的士 琵琶 微 啊 过 走 阿 者 们 最 清 晰 言 从三、运用“扩展法”来检测哪些是词，哪些是短语"],"q":"的士 琵琶 微 啊 过 走 阿 者 们 最 清 晰 言 从三、运用“扩展法”来检测哪些是词，哪些是短语。","w":"normal","e":["原书正文"]},{"t":"【原文】铅笔/旧笔 好看/快看 ","y":"教材原文","p":["铅笔/旧笔 好看/快看 很好/相好 登山/登陆 热心/热水 骑士/骑马四、指出下面哪些是离合词，为什么?结束 结婚 洗澡 洗礼 游览 游泳 理发 理财 打工 打架"],"q":"铅笔/旧笔 好看/快看 很好/相好 登山/登陆 热心/热水 骑士/骑马四、指出下面哪些是离合词，为什么?结束 结婚 洗澡 洗礼 游览 游泳 理发 理财 打工 打架","w":"normal","e":["原书正文"]},{"t":"【原文】思考题一、词与短语的区别","y":"教材原文","p":["思考题一、词与短语的区别有没有两难的情况?请举例说明"],"q":"思考题一、词与短语的区别有没有两难的情况?请举例说明。","w":"normal","e":["原书正文"]},{"t":"【原文】二、现代汉语的词语除了双","y":"教材原文","p":["二、现代汉语的词语除了双音节化趋势之外，还有单音节化的新趋势，例如“的士”浓缩为“的”，因此，就有了“打的、面的、的哥、的姐”","你同意这一说法吗?请举例阐述"],"q":"二、现代汉语的词语除了双音节化趋势之外，还有单音节化的新趋势，例如“的士”浓缩为“的”，因此，就有了“打的、面的、的哥、的姐”。你同意这一说法吗?请举例阐述。","w":"normal","e":["原书正文"]},{"t":"【原文】90第三章 词汇第二节 ","y":"教材原文","p":["90第三章 词汇第二节 构词法与造词法学习要点：掌握汉语构词法与造词法的特点，重点是构词类型，区分出单纯词、合成词及其内部类型复合词、派生词、重叠词等，并能够准确地对词语进行结构层次分析"],"q":"90第三章 词汇第二节 构词法与造词法学习要点：掌握汉语构词法与造词法的特点，重点是构词类型，区分出单纯词、合成词及其内部类型复合词、派生词、重叠词等，并能够准确地对词语进行结构层次分析。","w":"normal","e":["原书正文"]},{"t":"【原文】“构词法”和“造词法”组","y":"教材原文","p":["“构词法”和“造词法”组成了词汇的两大构造系统","构词法是指语素构成词的方式和方法，是对已有词的音节特征和结构关系进行静态的分析和分类","造词法是指人们创造新词的方式和方法，是对新造词的形成方式进行动态的分析和分类"],"q":"“构词法”和“造词法”组成了词汇的两大构造系统。构词法是指语素构成词的方式和方法，是对已有词的音节特征和结构关系进行静态的分析和分类。造词法是指人们创造新词的方式和方法，是对新造词的形成方式进行动态的分析和分类。","w":"normal","e":["原书正文"]},{"t":"【原文】(一)单纯词由一个语素构","y":"教材原文","p":["(一)单纯词由一个语素构成的词是单纯词，不存在内部构造问题，但可以根据构词语素的音节特征来划分类型","根据音节的数量，单纯词可以分为单音节、双音节和多音节三类"],"q":"(一)单纯词由一个语素构成的词是单纯词，不存在内部构造问题，但可以根据构词语素的音节特征来划分类型。根据音节的数量，单纯词可以分为单音节、双音节和多音节三类。","w":"normal","e":["原书正文"]}]},{"id":"xdhy_up-c03-s03","t":"第三节 词义构成","w":"high","n":28,"k":[{"t":"词义关系","y":"名词解释","p":["词语在意义上有着极为错综复杂的关系","除同义、近义、反义、上下位义外，还有构成关系、同现关系、受动关系、结果关系等"],"q":"词语在意义上有着极为错综复杂的关系，除了平时常说的同义、近义、反义、上下位义等关系之外，常见的还有构成关系、同现关系、受动关系、结果关系等许许多多的语义关系。","w":"high","e":["2019 真题"]},{"t":"试论述词义演变的主要类型，请举例说明。","y":"名词解释","p":["词义认识的深化（如“人”的定义变化）","词义范围的变化：扩大（如“河”）和缩小（如“学者”）","词义功能的转移（如“布告”动词转名词）","词义色彩的变化（如“爪牙”变贬义）"],"q":"词义具有演变性。随着客观世界和主观世界的发展变化，人们对各类事物、现象及其关系的认识和使用方式也随之发生变化，从而影响到词义的变化发展。词义演变主要有以下几种类型：（一）词义认识的深化。随着社会的发展，一个词在古代和现代所指事物的范围没有变化，但是人们对词所指事物的性质特征的认知却在不断深化。如“人","w":"high","e":["2012 真题","2017 真题"]},{"t":"试论述现代汉语多义词的类型和义项性质。","y":"名词解释","p":["多义词：一个语音形式有两个或两个以上既有联系又不相同的意义的词","三个特点：固定性、关联性、区别性","三种类型：所有义项都是词义；词义与语素义兼有；都是语素义","义项性质：本义、基本义、引申义、比喻义"],"q":"多义词是指一个语音形式有两个或两个以上既有联系又不相同的意义的词。多义词的一个意义也被称为一个义项，多义词的各个义项具有固定性、关联性、区别性三个特点。根据多义词所包含的义位和语素义情况，可以分成三种类型：A.所有义项都是词义的多义词，属于合成词的双音节多义词和多音节多义词，其义项绝大多数都是词义；","w":"high","e":["2011 真题","2019 真题"]},{"t":"义素","y":"名词解释","p":["义素是词义系统中不能独立运用的最小的意义单位，是构成义位的区别性语义特征，是从词义分析中抽象出来的观念成分。","义位是可以独立使用的最小意义单位，是词义的最基本构成单位。而义素是不能独立使用的最小意义单位，是构成义位的区别性特征。","义位分解形成义素，不同的义素组合起来形成义位才能构成一个独立运用的意义，义位与义素的关系是整体与部分的关系。"],"q":"义素是词义系统中不能独立运用的最小的意义单位，是构成义位的区别性语义特征，是从词义分析中抽象出来的观念成分。","w":"high","e":["教材高频"]},{"t":"义位","y":"名词解释","p":["义位是词义系统中可以独立运用的最小的意义单位，是最基本的词义单位，是义素的集合体。","一个词有几个可独立运用的意义就有几个义位，有的词有一个独立运用的意义就只有一个义位，有的词有多个独立运用的意义就有多个义位。","义位是义素的集合，义位与义素的关系是整体与部分的关系。义位是作为单个词义的语义单位，凡是义位，在词典里必定列为一个义项，但是义项不一定就是义位。"],"q":"义位是词义系统中可以独立运用的最小的意义单位，是最基本的词义单位，是义素的集合体。","w":"high","e":["教材高频"]},{"t":"义项","y":"名词解释","p":["义项是字典、词典中按照一个词意义数量分列的项目。","义项有两类：一是可以独立运用的词义，也就是义位；一类是不能独立运用，只是作为构成词或固定短语的语素义。","义位在词典里必定表现为义项，但是义项并不完全等于义位，关键是有的义项只是语素义，不是词义。"],"q":"义项是字典、词典中按照一个词意义数量分列的项目。","w":"high","e":["教材高频"]},{"t":"客观概念义","y":"名词解释","p":["从反映对象上看，词义反映的是人们对客观存在的事物、现象及其关系的本质属性的理性认识，理性认识一旦获得语音形式及其书写形式的物质外壳，就成为词义的客观概念义。","概念义也称为客观义、理据义和指称义。客观概念义大致分为两类：指称事物、动作和性质的概念义，可称为实体概念义；指称事物与现象之间关系的概念义，可称为关系概念义。"],"q":"从反映对象上看，词义反映的是人们对客观存在的事物、现象及其关系的本质属性的理性认识，理性认识一旦获得语音形式及其书写形式的物质外壳，就成为词义的客观概念义。","w":"high","e":["教材高频"]},{"t":"情态色彩义","y":"名词解释","p":["情态色彩义是指附着在词义上与其概念义同时存在的主观情感和态度。","情态色彩义主要分成两类：情感色彩和态度色彩。","情感色彩主要分为褒义词和贬义词，大部分词义不带固定的情感色彩，属于中性词。态度色彩主要是指人的态度倾向，如表谦虚、客气、敬重、鄙薄、强硬等态度。"],"q":"情态色彩义是指附着在词义上与其概念义同时存在的主观情感和态度。","w":"high","e":["教材高频"]},{"t":"语体色彩义","y":"名词解释","p":["语体色彩义是指词义所反映的适用于不同交际场合和文体的语体特征。","词义的语体色彩可以分为两类：口语语体色彩和书面语体色彩，书面语体色彩还可以进一步分为文艺语体、科技语体、政论语体、公文语体四类。","大多数词语既可以用于口语语体，也可以用于书面语体，具有通用的中性语体色彩。"],"q":"语体色彩义是指词义所反映的适用于不同交际场合和文体的语体特征。","w":"high","e":["教材高频"]},{"t":"固定修辞义","y":"名词解释","p":["固定修辞义是指一个词频繁用作一定的修辞手段并凝固在词义系统中成为词典义项之一。","根据修辞手段的不同，主要分为三类：比喻义、借代义和委婉义。","具有比喻义的如：爪牙、桃李、龙头；具有借代义的如：红娘、纨绔、杜康；具有委婉义的如：有喜、绿帽子、驾崩。"],"q":"固定修辞义是指一个词频繁用作一定的修辞手段并凝固在词义系统中成为词典义项之一。","w":"high","e":["教材高频"]},{"t":"临时语境义","y":"名词解释","p":["临时语境义是指一个词在具体语言环境中所派生出的新的临时性词义。","它对语言环境依赖性很大，脱离了具体语境就不存在了。它的产生一般源于人们在特定语境下追求某种特殊的表达效果。"],"q":"临时语境义是指一个词在具体语言环境中所派生出的新的临时性词义。","w":"high","e":["教材高频"]},{"t":"社区色彩义","y":"名词解释","p":["时间空间义是指语言因在一定的时代、地域中使用而产生的意义，主要有古今色彩义和社区色彩义两种。","社区色彩义指只在某个社区流通并反映该社区政治、经济、文化特色的词义。","香港的社区词如：公屋、居屋、夹屋、丁屋、抽水、通水；台湾的社区词如：泛蓝、泛绿、飞弹、辅育院、劈腿。"],"q":"时间空间义是指语言因在一定的时代、地域中使用而产生的意义，主要有古今色彩义和社区色彩义两种。社区色彩义指只在某个社区流通并反映该社区政治、经济、文化特色的词义。","w":"high","e":["教材高频"]},{"t":"义素分析法","y":"名词解释","p":["义素分析法就是对同一语义场的一组义位进行对比分析，从中寻找义位之间共同义素和区别义素的方法，这是现代语义学的重要分析方法。","义位分为析形成义素，通过义素分析就可以揭示不同义位之间的异同。","义素分析法的步骤包括：掌握义素分析的元语言；确定语义场及其对比义位；提取共同义素和区别义素；列出义位结构式。"],"q":"义素分析法就是对同一语义场的一组义位进行对比分析，从中寻找义位之间共同义素和区别义素的方法，这是现代语义学的重要分析方法。","w":"high","e":["教材高频"]},{"t":"词义的客观性","y":"名词解释","p":["词义的特征主要有客观性、主观性、概括性和演变性。","词义的客观性主要表现在两个方面：一是反映对象的客观存在性；二是词义形成的约定俗成性。","从反映对象上看，无论是客观世界的山川草木，还是主观世界的爱恨情仇，都是客观存在的。","从词义形成来看，什么样的语音形式及其书写形式表示什么事物、现象及其关系的意义，是基于社会成员客观存在的共同认知而约定俗成的。","当然，词义的客观性并非客观存在或约定俗成本身，也不与客观存在的事物、现象及其关系完全符合或等同。"],"q":"词义的特征主要有客观性、主观性、概括性和演变性。词义的客观性主要表现在两个方面：一是反映对象的客观存在性；二是词义形成的约定俗成性。","w":"high","e":["教材高频"]},{"t":"词义的主观性","y":"名词解释","p":["词义的主观性主要表现为两个方面：一是使用主体的民族性；二是词义理解的个体性。","不同民族在用不同的词语记录客观世界和主观世界的事物现象时，由于民族思维、语言系统、生活习惯等方面的差异，决定了词义的民族差异。","即使同一个民族，在对事物认识基本一致的情况下，也会因年龄、生活环境、文化水平和认知能力等差异，造成词义理解的个体差异。"],"q":"词义的主观性主要表现为两个方面：一是使用主体的民族性；二是词义理解的个体性。","w":"high","e":["教材高频"]},{"t":"词义的概括性","y":"名词解释","p":["从指称方式上看，词义对所指事物、现象及其关系都具有概括能力。词义都是对一类对象的概括反映。","如“笔”的词义是写字画图的工具，是从铅笔、钢笔、圆珠笔、毛笔、蜡笔、水彩笔等不同类型和派克笔、英雄笔、金星笔等不同品牌的“笔”中概括出来的，舍弃了不同个体的差异特征，抽象出共同的功能特征。","不仅普通词的词义是概括的，专有词的词义也具有概括性。"],"q":"从指称方式上看，词义对所指事物、现象及其关系都具有概括能力。词义都是对一类对象的概括反映。","w":"high","e":["教材高频"]},{"t":"词义的演变性","y":"名词解释","p":["从发展趋势上看，词义并非一成不变，随着客观世界和主观世界的发展变化，人们对各类事物、现象及其关系的认识和使用方式也随之发生变化，因此，词义具有演变性。","词义演变主要有以下几种类型：(1)词义认识的深化；(2)词义范围的变化（扩大或缩小）；(3)词义功能的转移；(4)词义色彩的变化。","词义扩大如“河”从专指黄河扩大到泛指一切河流；词义缩小如“学者”从指“求学之人”缩小到指学术上有一定成就的人。"],"q":"从发展趋势上看，词义并非一成不变，随着客观世界和主观世界的发展变化，人们对各类事物、现象及其关系的认识和使用方式也随之发生变化，因此，词义具有演变性。","w":"high","e":["教材高频"]},{"t":"义素分析法的原则","y":"名词解释","p":["义素分析法必须遵循系统性原则、对等性原则、区别性原则和简明性原则。","系统性原则要求把义位放在属于同一语义场的语义系统中进行对比分析。","对等性原则要求义位的意义必须等于分解出来的各个义素的总和，所指范围不能过宽或过窄。","区别性原则要求找出具有区别作用的义素，这是义素分析的根本目的。","简明性原则要求用尽可能少的典型区别性义素来揭示义位的区别性特征。"],"q":"义素分析法必须遵循系统性原则、对等性原则、区别性原则和简明性原则。","w":"high","e":["教材高频"]},{"t":"辨析“义位”和“义项”。","y":"名词解释","p":["义位：词义系统中可以独立运用的最小的意义单位，是义素的集合体","义项：字典、词典中按照一个词意义数量分列的项目","义项包括义位和语素义两类","义位必定表现为义项，但义项不一定就是义位"],"q":"义位和义项都是词义单位，但不完全相同。(1)义位是词义系统中可以独立运用的最小的意义单位，是最基本的词义单位，是义素的集合体，是作为单个词义的语义单位。(2)义项是字典、词典中按照一个词意义数量分列的项目。义项有两类：一是可以独立运用的词义，也就是义位；一类是不能独立运用，只是作为构成词或固定短语的","w":"normal","e":["核心概念"]},{"t":"辨析“固定修辞义”和“临时语境义”。","y":"名词解释","p":["固定修辞义：频繁用作修辞手段并凝固为词典义项，具有稳定性","临时语境义：具体语言环境中派生的临时性词义，依附语境","关键区别：前者凝固稳定，后者临时依附语境"],"q":"二者都是词义的内容，但性质不同。(1)固定修辞义是指一个词频繁用作一定的修辞手段并凝固在词义系统中成为词典义项之一，根据修辞手段的不同分为比喻义、借代义和委婉义，如“爪牙”（比喻坏人的党羽）、“红娘”（指代媒人）。(2)临时语境义是指一个词在具体语言环境中所派生出的新的临时性词义，它对语言环境依赖性","w":"normal","e":["核心概念"]},{"t":"【原文】1.分段简缩式：把短语分","y":"教材原文","p":["1.分段简缩式：把短语分段，每段取一个成分","如：土地改革→土改、研究制造→研制、知识青年→知青、邮政编码→邮编、空中小姐→空姐、高等院校→高校、军人家属→军属、外交部长→外长"],"q":"1.分段简缩式：把短语分段，每段取一个成分。如：土地改革→土改、研究制造→研制、知识青年→知青、邮政编码→邮编、空中小姐→空姐、高等院校→高校、军人家属→军属、外交部长→外长。","w":"normal","e":["原书正文"]},{"t":"【原文】2.截段简缩式：把短语分","y":"教材原文","p":["2.截段简缩式：把短语分段，取其中具有区别性特征的一段","如：复旦大学→复旦、中国人民解放军→解放军、中国南极长城站→长城站"],"q":"2.截段简缩式：把短语分段，取其中具有区别性特征的一段。如：复旦大学→复旦、中国人民解放军→解放军、中国南极长城站→长城站。","w":"normal","e":["原书正文"]},{"t":"【原文】3.综合简缩式：把分段与","y":"教材原文","p":["3.综合简缩式：把分段与截段相结合","如：中国人民政治协商会议→政治协商会议→政协、联合国安全理事会→安全理事会→安理会"],"q":"3.综合简缩式：把分段与截段相结合。如：中国人民政治协商会议→政治协商会议→政协、联合国安全理事会→安全理事会→安理会。","w":"normal","e":["原书正文"]},{"t":"【原文】4.取异合同式：保留差异","y":"教材原文","p":["4.取异合同式：保留差异成分，把相同成分合一","如：工业农业→工农业、病害虫害→病虫害、中学小学→中小学"],"q":"4.取异合同式：保留差异成分，把相同成分合一。如：工业农业→工农业、病害虫害→病虫害、中学小学→中小学。","w":"normal","e":["原书正文"]},{"t":"【原文】5.数字概括式：用数字概","y":"教材原文","p":["5.数字概括式：用数字概括相同的成分，省略不同的成分","如：身体好、学习好、工作好→三好","农业现代化、工业现代化、国防现代化、科学技术现代化→四个现代化→四化","讲学习、讲政治、讲正气→三讲"],"q":"5.数字概括式：用数字概括相同的成分，省略不同的成分。如：身体好、学习好、工作好→三好；农业现代化、工业现代化、国防现代化、科学技术现代化→四个现代化→四化；讲学习、讲政治、讲正气→三讲；心灵美、语言美、行为美、环境美→四美。","w":"normal","e":["原书正文"]},{"t":"【原文】轻松 对虾 烂漫 波动 ","y":"教材原文","p":["轻松 对虾 烂漫 波动 改良 儒家 芙蓉 诗篇 政变 色拉 飞快 起草 文字 笔谈 烧饼刷新 花束 沙龙 钳子 旗手 火化 耐性 结晶 胆怯 学问"],"q":"轻松 对虾 烂漫 波动 改良 儒家 芙蓉 诗篇 政变 色拉 飞快 起草 文字 笔谈 烧饼刷新 花束 沙龙 钳子 旗手 火化 耐性 结晶 胆怯 学问","w":"normal","e":["原书正文"]},{"t":"【原文】二、指出下列每对词语中哪","y":"教材原文","p":["二、指出下列每对词语中哪个是单纯词，哪个是合成词"],"q":"二、指出下列每对词语中哪个是单纯词，哪个是合成词。","w":"normal","e":["原书正文"]},{"t":"【原文】扑克————攻克 加仑—","y":"教材原文","p":["扑克————攻克 加仑————加法 粗布————卢布 到达————哈达阿门————窍门 隔壁————戈壁 仓皇————仓库 马达————马匹"],"q":"扑克————攻克 加仑————加法 粗布————卢布 到达————哈达阿门————窍门 隔壁————戈壁 仓皇————仓库 马达————马匹","w":"normal","e":["原书正文"]}]},{"id":"xdhy_up-c03-s04","t":"第四节 词义分析与释义","w":"high","n":15,"k":[{"t":"语义场","y":"名词解释","p":["语义场就是在共时条件下，在同一个语义系统中具有意义联系的词的聚合体，语义场是义素分析的依据。","义位之间的意义关联性是义素对比分析的基本条件，义素对比分析的对象必须是具有意义关联性的同一语义场的义位。","根据语义场内义位之间的关系，可以把语义场分为分类语义场、顺序语义场、关系语义场、反义语义场、同义语义场。语义场具有联系性、民族性、层次性三个特征。"],"q":"语义场就是在共时条件下，在同一个语义系统中具有意义联系的词的聚合体，语义场是义素分析的依据。","w":"high","e":["教材高频"]},{"t":"语素分析法","y":"名词解释","p":["合成词是由语素作为构词成分构成的，语素义与词义之间有不同的关系类型，语素义从不同方面、以不同方式、不同程度地表示词义。","语素义与词义的关系类型主要有六种：词义由语素义构词直接来表示；词义由语素义同义互补来表示；词义由语素义和附加义来表示；词义由语素义修辞间接来表示；词义由部分语素义来表示；词义与语素义没有直接关系。"],"q":"合成词是由语素作为构词成分构成的，语素义与词义之间有不同的关系类型，语素义从不同方面、以不同方式、不同程度地表示词义。","w":"high","e":["教材高频"]},{"t":"逻辑定义释义法","y":"名词解释","p":["运用逻辑学中的定义法来进行释义，即通过邻近的属和种差揭示被定义概念的本质属性，该方法比较适用于解释某些学科术语和普通名词。","逻辑定义释义法要求用“属加种差”的方式揭示被定义概念的本质。","被定义概念分别以其邻近的属概念和以其余词语为“种差”来释义。"],"q":"运用逻辑学中的定义法来进行释义，即通过邻近的属和种差揭示被定义概念的本质属性，该方法比较适用于解释某些学科术语和普通名词。","w":"high","e":["教材高频"]},{"t":"互训反训释义法","y":"名词解释","p":["运用与被解释词具有同义、近义或反义关系的词或短语等来释义，包括互训和反训。","互训就是用同义近义词释义的方法，反训就是用反义词释义的方法。","互训包括：今语词解释古语词、普通话解释方言词、通用语解释书面语、通用词解释口语词、对语素次序进行对等的同义近义解释。"],"q":"运用与被解释词具有同义、近义或反义关系的词或短语等来释义，包括互训和反训。","w":"high","e":["教材高频"]},{"t":"描写比喻释义法","y":"名词解释","p":["通过描述或列举、形容、比喻的方式说明被解释词所指的事物、行为、性状及其关系。","描写比喻释义法包括描述事物、描述行为、描述性状、描述关系、列举说明、形容说明、比喻说明等。","如比喻说明：旗手：比喻领导人或先行者；敲门砖：比喻借以求得名利的初步手段。"],"q":"通过描述或列举、形容、比喻的方式说明被解释词所指的事物、行为、性状及其关系。","w":"high","e":["教材高频"]},{"t":"补充论元释义法","y":"名词解释","p":["通过补充与被解释词所指事物、行为和形状等有关的主体、对象、原因、目的、工具、方式、处所、领域等语义信息来释义的方法。","补充论元释义法可根据所补充的信息分为：补充主体信息、补充对象信息、补充原因信息、补充目的信息、补充工具信息、补充方式处所领域等信息。"],"q":"通过补充与被解释词所指事物、行为和形状等有关的主体、对象、原因、目的、工具、方式、处所、领域等语义信息来释义的方法。","w":"high","e":["教材高频"]},{"t":"附加信息释义法","y":"名词解释","p":["附加与被解释词有关的时空信息、主观色彩、语法属性等语用方面的信息，使词语的释义更加完善充分。","附加信息释义法包括：附加时空（时代、社区、语境等）信息、附加主观色彩（情态、语体）、附加语法属性（用法、词性）。"],"q":"附加与被解释词有关的时空信息、主观色彩、语法属性等语用方面的信息，使词语的释义更加完善充分。","w":"high","e":["教材高频"]},{"t":"【原文】b1b2b3alman ","y":"教材原文","p":["b1b2b3alman (男人)woman (女人)child (儿童)a2bull (公牛)ram (公羊)boar (公猪)"],"q":"b1b2b3alman (男人)woman (女人)child (儿童)a2bull (公牛)ram (公羊)boar (公猪)","w":"normal","e":["原书正文"]},{"t":"【原文】cow (母牛)ewe(","y":"教材原文","p":["cow (母牛)ewe(母羊)sow (母猪)calf (牛犊)lamb (羊羔)piglet (猪崽)表格的排列显示出义位的义素构成","al行是“人类”，a2行是“兽类”，b1 列是“男性/雄性”，b2列是“女性/雌性”，b3列是“未成年”","根据每个词所拥有义素的情况，可以分别归纳出不同的义素组合情况","如：“man”的义素就是“人、男性、成年”,而“bull”的义素就是“牛、雄性、成年”,“piglet”的义素就是“猪、不分雌雄、未成年”"],"q":"cow (母牛)ewe(母羊)sow (母猪)calf (牛犊)lamb (羊羔)piglet (猪崽)表格的排列显示出义位的义素构成。al行是“人类”，a2行是“兽类”，b1 列是“男性/雄性”，b2列是“女性/雌性”，b3列是“未成年”。根据每个词所拥有义素的情况，可以分别归纳出不同的义素组合情况。如：“man”的义素就是“人、男性、成年”,而“bull","w":"normal","e":["原书正文"]},{"t":"【原文】第二，提取最小的义位义素","y":"教材原文","p":["第二，提取最小的义位义素","如在区分“习惯、习气、陋习、积习”四个词时，要提取的义素通过义位结构的矩阵表表示如下："],"q":"第二，提取最小的义位义素。如在区分“习惯、习气、陋习、积习”四个词时，要提取的义素通过义位结构的矩阵表表示如下：","w":"normal","e":["原书正文"]},{"t":"【原文】如果把“不易改变”改为“","y":"教材原文","p":["如果把“不易改变”改为“稳定”就不恰当了，因为“不易改变”除了含有“稳定”义之外，还有“改变很困难”的意义，因此，最小义素是相对的，是建立在“有区别作用”的基础上的"],"q":"如果把“不易改变”改为“稳定”就不恰当了，因为“不易改变”除了含有“稳定”义之外，还有“改变很困难”的意义，因此，最小义素是相对的，是建立在“有区别作用”的基础上的。","w":"normal","e":["原书正文"]},{"t":"【原文】第三，找出对比义位的共同","y":"教材原文","p":["第三，找出对比义位的共同义素","找到了共同义素就使义位的义素分析建立在共同的意义基础上","比如对“蓄谋、合谋、密谋、阴谋”进行义素分析，是提取共同义素“计谋”“考虑”还是“策划”，就需要仔细斟酌","“蓄谋”等四个词都是动词，而“计谋”有名词义，因而不合适"],"q":"第三，找出对比义位的共同义素。找到了共同义素就使义位的义素分析建立在共同的意义基础上。比如对“蓄谋、合谋、密谋、阴谋”进行义素分析，是提取共同义素“计谋”“考虑”还是“策划”，就需要仔细斟酌。“蓄谋”等四个词都是动词，而“计谋”有名词义，因而不合适。如选择“考虑”作共同义素，“考虑”不但是一般的思考，范围过宽，而且还会导致“蓄谋”等四个词与“琢磨、掂量”等词","w":"normal","e":["原书正文"]},{"t":"【原文】做出决定、付诸行动的意义","y":"教材原文","p":["做出决定、付诸行动的意义","因此，选择“策划”，就能使“蓄谋”等四个词立足在更小的有区别价值的共同义素上，从而使义素分析更准确、更简洁"],"q":"做出决定、付诸行动的意义。因此，选择“策划”，就能使“蓄谋”等四个词立足在更小的有区别价值的共同义素上，从而使义素分析更准确、更简洁。","w":"normal","e":["原书正文"]},{"t":"【原文】第四，提取对比义位的区别","y":"教材原文","p":["第四，提取对比义位的区别义素","如“父亲”的有区别作用的本质性义素是[+男性+血亲+长一辈+父系]，只要其中一个区别义素不同，或再加上一两个别的义素，就可以与其他词语区分开来","列出义位结构的自然语言与符号结合的线性式子如下："],"q":"第四，提取对比义位的区别义素。如“父亲”的有区别作用的本质性义素是[+男性+血亲+长一辈+父系]，只要其中一个区别义素不同，或再加上一两个别的义素，就可以与其他词语区分开来。列出义位结构的自然语言与符号结合的线性式子如下：","w":"normal","e":["原书正文"]},{"t":"【原文】母亲：[-男性+血亲+长","y":"教材原文","p":["母亲：[-男性+血亲+长一辈+母系]舅舅：[+男性+血亲+长一辈+母系]姑姑：[-男性+血亲+长一辈+父系]姨妈：[-男性+血亲+长一辈+母系]"],"q":"母亲：[-男性+血亲+长一辈+母系]舅舅：[+男性+血亲+长一辈+母系]姑姑：[-男性+血亲+长一辈+父系]姨妈：[-男性+血亲+长一辈+母系]","w":"normal","e":["原书正文"]}]},{"id":"xdhy_up-c03-s05","t":"第五节 词汇的分类系统","w":"high","n":29,"k":[{"t":"辨析“同音词”和“多义词”。","y":"名词解释","p":["同音词：语音形式相同而意义完全不同的词，各意义无联系","多义词：一个语音形式有多个既有联系又不同的意义，各义项有固定性、关联性、区别性","关键区别：各意义之间有无联系"],"q":"同音词和多义词都是同一个语音形式对应多个意义，但区别在于各意义之间有无联系。(1)同音词是指语音形式相同而意义完全不同的词，各意义之间没有联系，如“米₁(大米)”“米₂(长度单位)”。(2)多义词是指一个语音形式有两个或两个以上既有联系又不相同的意义的词，各义项具有固定性、关联性和区别性，如“闹”的","w":"high","e":["2014 真题"]},{"t":"辨析兼类词与同音词，并说明区分的关键。","y":"名词解释","p":["兼类：具有两类词的语法功能，意义上又有密切联系","同音词：同音同形而语法功能不同，意义上没有什么联系","区分关键：看它们的词义是否有密切的联系"],"q":"兼类：一个词在不同语境中，具有A和B两类词的语法功能，意义上又有密切的联系，这是兼类词。主要有：兼属名词和动词：锁、锄、锯、病、伤、药、电、漆、锈、网、尿、教练、指导、指挥、代表、领导；兼属名词和形容词：圆、尖、红、美、平常、累赘、方便、困难；兼属动词和形容词：热、冷、饿、破、端正、巩固、集中；兼属","w":"high","e":["2019 真题"]},{"t":"本义","y":"名词解释","p":["本义是文献记载的词的最初意义。","有些多义词的本义已经消失，在一般词典中不再列为义项；有些多义词的本义作为语素义至今保留，但只出现在合成词或固定结构中；有些多义词的本义，至今仍然是最常用最主要的意义，这时多义词的本义与基本义就一致了。"],"q":"本义是文献记载的词的最初意义。","w":"high","e":["教材高频"]},{"t":"同音词","y":"名词解释","p":["同音词是指语音形式(声母、韵母和声调)相同而意义完全不同的词。","同音词包括两类：同音同形词，是指语音形式相同，书写形式也相同而意义不同的词；同音异形词，是指语音形式相同，书写形式和意义都不相同的词。","同音词就来源来说主要有两类：词源不同发音偶合的同音词；词源相同，词义分化而成的同音词。"],"q":"同音词是指语音形式(声母、韵母和声调)相同而意义完全不同的词。","w":"high","e":["教材高频"]},{"t":"同形词","y":"名词解释","p":["同形词是指书写形式相同，语音形式和意义不同的词。","根据语音形式的差异，同形词主要包括四类：声母、韵母相同而声调不同；声母相同而韵母不同或韵母、声调都不同；韵母相同而声母不同或声母、声调都不同；第一个音节相同，第二个音节有轻声与否的差别。"],"q":"同形词是指书写形式相同，语音形式和意义不同的词。","w":"high","e":["教材高频"]},{"t":"字母词","y":"名词解释","p":["字母词是指汉语中由拉丁字母、希腊字母等西文字母构成的或由它们与符号、数字或汉字混合构成的词。","字母词主要包括三类：英文字母词（包括英语词和英语首字母缩略语）、汉语拼音字母缩略形式、以字母表形的字母词。","字母词的大量出现主要有两个方面的原因：从社会生活考虑，一是国际交流的日趋频繁，二是社会文化水平的普遍提高，三是计算机及其网络的普遍运用；从语言文字本身着眼，一是某些外来词语难以翻译，二是字母词书写经济简便。"],"q":"字母词是指汉语中由拉丁字母、希腊字母等西文字母构成的或由它们与符号、数字或汉字混合构成的词。","w":"high","e":["教材高频"]},{"t":"单义词","y":"名词解释","p":["单义词是指一个语音形式只有一个意义的词。","单义词主要包括以下类型：事物名词、专有名词、科学术语、称谓名称。"],"q":"单义词是指一个语音形式只有一个意义的词。","w":"high","e":["教材高频"]},{"t":"多义词","y":"名词解释","p":["多义词是指一个语音形式有两个或两个以上既有联系又不相同的意义的词。","多义词的一个意义也被称为一个义项，多义词的各个义项具有以下特点：一是固定性，不是因语境而产生的临时意义；二是关联性，不同的义项之间存在着一定的联系；三是区别性，各个义项保持着自己的特点。","根据多义词所包含的义位和语素义情况，可以分成三种类型：所有义项都是词义的多义词；有些义项是词义而有些义项是语素义的多义词；所有义项都是语素义的多义不成词语素。"],"q":"多义词是指一个语音形式有两个或两个以上既有联系又不相同的意义的词。","w":"high","e":["教材高频"]},{"t":"基本义","y":"名词解释","p":["基本义就是词在现代最常用最主要的意义。","有些多义词的本义和基本义一致，有些多义词的本义和基本义并不一致。","词的基本义都是词义义项，不能是语素义义项。在《现代汉语词典》中，基本义一般列为第一义项。"],"q":"基本义就是词在现代最常用最主要的意义。","w":"high","e":["教材高频"]},{"t":"引申义","y":"名词解释","p":["引申义是引申发展出来的意义。","引申义可以分为三种情况：从本义(基本义)发展出来的引申义；从基本义发展出来的引申义；从引申义发展出来的引申义。"],"q":"引申义是引申发展出来的意义。","w":"high","e":["教材高频"]},{"t":"比喻义","y":"名词解释","p":["比喻义就是把词的比喻用法固定下来的意义。","本义、基本义、引申义都可以产生比喻义。","“口”的本义和基本义是“人和动物进食、发声的器官”，发展出比喻义义项“出入通过的部位”。"],"q":"比喻义就是把词的比喻用法固定下来的意义。","w":"high","e":["教材高频"]},{"t":"同义词","y":"名词解释","p":["同义词就是意义相同或相近的词。","根据意义相同的程度，同义词可以分成两类：等义词和近义词。","等义词是指意义完全相同的词；近义词是指意义基本相同，但在意义、功能或色彩上存在细微差别的词。"],"q":"同义词就是意义相同或相近的词。","w":"high","e":["教材高频"]},{"t":"等义词","y":"名词解释","p":["等义词是指意义完全相同的词。","等义词属于同义词，与近义词相对。"],"q":"等义词是指意义完全相同的词。","w":"high","e":["教材高频"]},{"t":"近义词","y":"名词解释","p":["近义词是指意义基本相同，但在意义、功能或色彩上存在细微差别的词。","近义词属于同义词，同义词辨析可运用色彩分析法、意义分析法、功能分析法。"],"q":"近义词是指意义基本相同，但在意义、功能或色彩上存在细微差别的词。","w":"high","e":["教材高频"]},{"t":"反义词","y":"名词解释","p":["反义词就是属于同一范畴的意义相反或相对的一组词。","根据反义词在意义上是相反的矛盾关系还是相对的反对关系，可以分成两类：绝对反义词和相对反义词。","绝对反义词：肯定一方必否定另一方，否定一方必肯定另一方，二者属于矛盾关系；相对反义词：肯定一方必否定另一方，否定一方不一定肯定另一方，二者属于反对关系。"],"q":"反义词就是属于同一范畴的意义相反或相对的一组词。","w":"high","e":["教材高频"]},{"t":"类义词","y":"名词解释","p":["类义词就是根据同一意义标准划分出来的属于同一上位词的一组下位词。","根据同位关系的严密程度，类义词主要包括两种类型：严格的基于科学分类的类义词；非严格的基于日常运用的类义词。","类义词划分必须同一标准，类义词之间必须互相排斥。"],"q":"类义词就是根据同一意义标准划分出来的属于同一上位词的一组下位词。","w":"high","e":["教材高频"]},{"t":"绝对反义词","y":"名词解释","p":["绝对反义词：肯定一方必否定另一方，否定一方必肯定另一方，二者属于矛盾关系。","绝对反义词属于反义词的一类，与相对反义词相对。"],"q":"绝对反义词：肯定一方必否定另一方，否定一方必肯定另一方，二者属于矛盾关系。","w":"high","e":["教材高频"]},{"t":"相对反义词","y":"名词解释","p":["相对反义词：肯定一方必否定另一方，否定一方不一定肯定另一方，二者属于反对关系。","相对反义词属于反义词的一类，与绝对反义词相对。"],"q":"相对反义词：肯定一方必否定另一方，否定一方不一定肯定另一方，二者属于反对关系。","w":"high","e":["教材高频"]},{"t":"上位词与下位词","y":"名词解释","p":["上位词和下位词是指在意义上具有属种关系的一组词。在属种关系中，指称属概念的词就是上位词，指称种概念的词就是下位词。","根据属种关系的严密程度，上下位词主要包括两种类型：严格的基于科学分类的上下位词；非严格的基于日常运用的上下位词。","上位词与下位词间的属种关系可以通过“属加种差鉴定法”“类与子类鉴定法”“整分关系排除法”鉴别。"],"q":"上位词和下位词是指在意义上具有属种关系的一组词。在属种关系中，指称属概念的词就是上位词，指称种概念的词就是下位词。","w":"high","e":["教材高频"]},{"t":"辨析“同音词”和“同形词”。","y":"名词解释","p":["同音词：语音形式相同而意义不同，着眼“音同”","同形词：书写形式相同而语音、意义不同，着眼“形同”","同音词侧重音同，同形词侧重形同，二者有交叉"],"q":"二者都是形式相同而意义不同的词，但着眼点不同：(1)同音词是指语音形式（声母、韵母和声调）相同而意义完全不同的词，着眼于“音同”，包括同音同形词和同音异形词；(2)同形词是指书写形式相同，语音形式和意义不同的词，着眼于“形同”，根据语音差异分为声调不同、韵母不同、声母不同、轻声与否等四类，如“凉(l","w":"normal","e":["核心概念"]},{"t":"辨析“绝对反义词”和“相对反义词”。","y":"名词解释","p":["绝对反义词：矛盾关系，否定一方必肯定另一方，如死—活","相对反义词：反对关系，否定一方不一定肯定另一方，如大—小","关键区别：绝对反义词无中间状态，相对反义词有中间状态"],"q":"二者都是反义词，区别在于意义关系不同。(1)绝对反义词：肯定一方必否定另一方，否定一方必肯定另一方，二者属于矛盾关系，如死—活、男—女、有—无、出席—缺席，其间不存在中间状态。(2)相对反义词：肯定一方必否定另一方，否定一方不一定肯定另一方，二者属于反对关系，如黑—白、大—小、高—低、冷—热，其间存","w":"normal","e":["核心概念"]},{"t":"【原文】1.梯：A.便利人上下的","y":"教材原文","p":["1.梯：A.便利人上下的用具或设备，常见的是梯子、楼梯"],"q":"1.梯：A.便利人上下的用具或设备，常见的是梯子、楼梯。","w":"normal","e":["原书正文"]},{"t":"【原文】3.猴：A.哺乳动物，种","y":"教材原文","p":["3.猴：A.哺乳动物，种类很多，形状略像人，身上有毛，灰色或褐色，有尾巴，行动灵活，好群居，口腔有储存食物的颊囊，以果实、野菜、鸟卵和昆虫为食物"],"q":"3.猴：A.哺乳动物，种类很多，形状略像人，身上有毛，灰色或褐色，有尾巴，行动灵活，好群居，口腔有储存食物的颊囊，以果实、野菜、鸟卵和昆虫为食物。通称猴子。","w":"normal","e":["原书正文"]},{"t":"【原文】B.哺乳动物，种类很多","y":"教材原文","p":["B.哺乳动物，种类很多","毛灰色或褐色，颜面和耳朵无毛，有尾巴，两颊有储存食物的颊囊"],"q":"B.哺乳动物，种类很多。毛灰色或褐色，颜面和耳朵无毛，有尾巴，两颊有储存食物的颊囊。","w":"normal","e":["原书正文"]},{"t":"【原文】4.肌肉：A.人和动物体","y":"教材原文","p":["4.肌肉：A.人和动物体的一种组织，由许多肌纤维集合组成，上面有神经纤维，在神经冲动的影响下收缩，引起器官的运动","可分为横纹肌、平滑肌和心肌三种"],"q":"4.肌肉：A.人和动物体的一种组织，由许多肌纤维集合组成，上面有神经纤维，在神经冲动的影响下收缩，引起器官的运动。可分为横纹肌、平滑肌和心肌三种。也叫筋肉。","w":"normal","e":["原书正文"]},{"t":"【原文】B.人或动物体的组织之一","y":"教材原文","p":["B.人或动物体的组织之一，由许多肌纤维组成，具有收缩特性"],"q":"B.人或动物体的组织之一，由许多肌纤维组成，具有收缩特性。","w":"normal","e":["原书正文"]},{"t":"【原文】5.礼教：A.旧传统中束","y":"教材原文","p":["5.礼教：A.旧传统中束缚人的思想行动、有利于反动统治阶级的礼节和道德"],"q":"5.礼教：A.旧传统中束缚人的思想行动、有利于反动统治阶级的礼节和道德。","w":"normal","e":["原书正文"]},{"t":"【原文】6.朝野：A.旧时指朝廷","y":"教材原文","p":["6.朝野：A.旧时指朝廷和民间","现在用来指资本主义国家政府方面和非政府方面"],"q":"6.朝野：A.旧时指朝廷和民间。现在用来指资本主义国家政府方面和非政府方面。","w":"normal","e":["原书正文"]},{"t":"【原文】B.旧时指朝廷和民间","y":"教材原文","p":["B.旧时指朝廷和民间","现在用来指政府方面和非政府方面"],"q":"B.旧时指朝廷和民间。现在用来指政府方面和非政府方面。","w":"normal","e":["原书正文"]}]},{"id":"xdhy_up-c03-s06","t":"第六节 词汇的构成系统","w":"high","n":17,"k":[{"t":"传承词","y":"名词解释","p":["传承词是指从古代、近代汉民族语言词汇中流传下来而为现代汉语词汇所承接的词。","传承词是现代汉语词汇的核心部分，属于基本词汇。传承词所指称的事物和现象从古代到现代都与人们的日常生活息息相关，因此具有较强的生命力。","传承词主要包括表示自然现象和事物、生产和生活资料、时量和空间概念、事物性质状态、人体部位和器官、动作行为和变化、亲属人称指代、事物或行为关系等八类。传承词具有共时的普遍性、历时的稳定性、构词的能产性三个特点。"],"q":"传承词是指从古代、近代汉民族语言词汇中流传下来而为现代汉语词汇所承接的词。","w":"high","e":["教材高频"]},{"t":"古语词","y":"名词解释","p":["古语词是指在古代、近代汉语中使用，而现代汉语出于特殊需要偶尔使用的词语。","根据指称事物的特点，主要包括两类：历史古语词和文言古语词。","历史古语词所指称的事物、现象和观念在历史上曾经存在过或流传过而现在已经不存在或不流传了；文言古语词所指称的事物、现象和观念在现实生活中依然存在，但古代和近代用文言词来表示，而现在用现代汉语词语来表示。"],"q":"古语词是指在古代、近代汉语中使用，而现代汉语出于特殊需要偶尔使用的词语。","w":"high","e":["教材高频"]},{"t":"新造词","y":"名词解释","p":["新造词是指为指称新事物、新概念或新现象而创造的词语。","新造词的产生与社会生活的变化有着密切的关系，社会变化越剧烈，新造词的产生就越频繁，有些新造词会随着使用频率的增加和范围的扩大而进入现代汉语词汇中，成为基本词汇成员，有些则随着使用频率的减少而逐渐消亡。","新词与旧词具有一定的相对性。以20世纪70年代末的改革开放为起点，在现代汉语中出现了大量新造词。"],"q":"新造词是指为指称新事物、新概念或新现象而创造的词语。","w":"high","e":["教材高频"]},{"t":"方言词","y":"名词解释","p":["方言词是指来源于某一方言且仅限于该方言地域内使用的词语。","根据交际的需要，方言词会不断地有选择地被吸收到现代汉语词汇中。当一个方言词可在全社会使用并稳定下来时，就成了现代汉语词汇的方言词。","方言词进入现代汉语词汇的速度和数量，与该方言地域的政治、经济、文化、人口等因素有密不可分的关系。"],"q":"方言词是指来源于某一方言且仅限于该方言地域内使用的词语。","w":"high","e":["教材高频"]},{"t":"社区词","y":"名词解释","p":["社区词是指反映某一社区政治、经济、文化特点并只在该社区流通的特有词语。","由于不同的政治制度、经济体制、文化教育和心理状态，中国大陆、香港特区、澳门特区、台湾地区以及不同的海外华人社区就会在政治、经济、文化、教育、生活等方面出现各不相同的事物、观念和现象，从而出现只在该社区使用的社区词。"],"q":"社区词是指反映某一社区政治、经济、文化特点并只在该社区流通的特有词语。","w":"high","e":["教材高频"]},{"t":"行业词","y":"名词解释","p":["行业词是指在不同学科专业和行业中使用的专门用语，是表达学科专业和行业概念的重要方式。","行业词包括专业术语和行业用语。","随着人们文化知识水平的普遍提高以及跨学科和跨行业交流的增加，许多行业词逐渐泛化而成为普通的现代汉语词汇。"],"q":"行业词是指在不同学科专业和行业中使用的专门用语，是表达学科专业和行业概念的重要方式。","w":"high","e":["教材高频"]},{"t":"外来词","y":"名词解释","p":["外来词是指从外国语或外族语中连音带义吸收来的词语。","在汉语发展史上，外来词的大规模借入主要有四个时期：一是借入西域诸国事物类词语的两汉时期；二是借入佛教词语的魏晋南北朝至唐宋时期；三是借入西方哲学、政治和科技词语的近代时期；四是全面借入外来词的改革开放时期。","现代汉语外来词主要来源于英语、日语、法语、俄语、德语以及境内少数民族语言。"],"q":"外来词是指从外国语或外族语中连音带义吸收来的词语。","w":"high","e":["教材高频"]},{"t":"外来词的译借方式","y":"名词解释","p":["现代汉语外来词的译借方式主要有：单纯音译式、音意混译式、音意兼译式、音加语素式、借音借形式。","单纯音译式即用汉字直接来译写外语词的读音；音意混译式即部分音译、部分意译；音意兼译式即整体音译，同时兼顾意译；音加语素式即外来词是由音译部分和表示类名的汉语语素组成；借音借形式包括借自西方字母的词和借自日文汉字字形而非读音的词。"],"q":"现代汉语外来词的译借方式主要有：单纯音译式、音意混译式、音意兼译式、音加语素式、借音借形式。","w":"high","e":["教材高频"]},{"t":"辨析“方言词”和“社区词”。","y":"名词解释","p":["方言词：来源于某一方言且仅限于该方言地域内使用，是地域方言的产物","社区词：反映某一社区政治经济文化特点并只在该社区流通，是社会社区的产物","关键区别：方言词着眼于地域方言，社区词着眼于社会社区"],"q":"方言词和社区词都是特定范围内使用的词语，但来源和反映的内容不同。(1)方言词是指来源于某一方言且仅限于该方言地域内使用的词语，是地域方言的产物，如北京方言词“憋糟”、粤方言词“老窦”。(2)社区词是指反映某一社区政治、经济、文化特点并只在该社区流通的特有词语，是社会社区的产物，反映了不同社区的政治制","w":"normal","e":["核心概念"]},{"t":"【原文】(1)反义词的类型反义词","y":"教材原文","p":["(1)反义词的类型反义词就是属于同一范畴的意义相反或相对的一组词","根据反义词在意义上是相反的矛盾关系还是相116第三章 词汇"],"q":"(1)反义词的类型反义词就是属于同一范畴的意义相反或相对的一组词。根据反义词在意义上是相反的矛盾关系还是相116第三章 词汇","w":"normal","e":["原书正文"]},{"t":"【原文】A.绝对反义词：肯定一方","y":"教材原文","p":["A.绝对反义词：肯定一方必否定另一方，否定一方必肯定另一方，二者属于矛盾关系的绝对反义词"],"q":"A.绝对反义词：肯定一方必否定另一方，否定一方必肯定另一方，二者属于矛盾关系的绝对反义词。如：","w":"normal","e":["原书正文"]},{"t":"【原文】死————活 男————","y":"教材原文","p":["死————活 男————女 有————无 现象————本质 正确————错误同————异 动————静 公————私 出席————缺席|白天————黑夜"],"q":"死————活 男————女 有————无 现象————本质 正确————错误同————异 动————静 公————私 出席————缺席|白天————黑夜","w":"normal","e":["原书正文"]},{"t":"【原文】B.相对反义词：肯定一方","y":"教材原文","p":["B.相对反义词：肯定一方必否定另一方，否定一方不一定肯定另一方，二者属于反对关系的相对反义词"],"q":"B.相对反义词：肯定一方必否定另一方，否定一方不一定肯定另一方，二者属于反对关系的相对反义词。如：","w":"normal","e":["原书正文"]},{"t":"【原文】黑————白大————小","y":"教材原文","p":["黑————白大————小高————低粗————细春————秋祸————福苦————甜冷————热软————硬东————西父————子善————恶"],"q":"黑————白大————小高————低粗————细春————秋祸————福苦————甜冷————热软————硬东————西父————子善————恶","w":"normal","e":["原书正文"]},{"t":"【原文】收入————支出 高尚—","y":"教材原文","p":["收入————支出 高尚————卑鄙 开端————末尾 朋友————敌人 快乐————忧愁"],"q":"收入————支出 高尚————卑鄙 开端————末尾 朋友————敌人 快乐————忧愁","w":"normal","e":["原书正文"]},{"t":"【原文】(2)反义词的鉴定标准A","y":"教材原文","p":["(2)反义词的鉴定标准A.必须属于同一范畴反义关系是词与词在语义上的一种横向联系，构成反义词的一对词或一组词必须属于同一个意义范畴","如长度、重量、时间、处所、速度、颜色、面积、体积等，否则无法形成一个类聚","如“男、女”都表性别，“古、今”都表时间，“头、尾”都表部位，“黑、白”都表颜色"],"q":"(2)反义词的鉴定标准A.必须属于同一范畴反义关系是词与词在语义上的一种横向联系，构成反义词的一对词或一组词必须属于同一个意义范畴。如长度、重量、时间、处所、速度、颜色、面积、体积等，否则无法形成一个类聚。如“男、女”都表性别，“古、今”都表时间，“头、尾”都表部位，“黑、白”都表颜色。","w":"normal","e":["原书正文"]},{"t":"【原文】B.必须属于同一词性“聪","y":"教材原文","p":["B.必须属于同一词性“聪明”和“傻子”、“愚蠢”和“智者”虽然具有反义性，但是并不能构成一组反义词，换言之，反义词在词性上必须一致"],"q":"B.必须属于同一词性“聪明”和“傻子”、“愚蠢”和“智者”虽然具有反义性，但是并不能构成一组反义词，换言之，反义词在词性上必须一致。如：","w":"normal","e":["原书正文"]}]},{"id":"xdhy_up-c03-s07","t":"第七节 词汇的熟语系统","w":"high","n":14,"k":[{"t":"熟语","y":"名词解释","p":["现代汉语的熟语系统包括五小类：成语、谚语、歇后语、惯用语和习用语。","熟语的特点：(1)结构的定型性；(2)语义的整合性；(3)功能的多样性；(4)语用的民族性。","结构的定型性指熟语的构成成分及其结构关系是固定的；语义的整合性指熟语的意义不是构成成分意义的简单相加；功能的多样性指熟语可以跟词一样按照一定的语法规则组织起来充当多种句子成分；语用的民族性指熟语的形成和使用受民族文化传统的影响。"],"q":"现代汉语的熟语系统包括五小类：成语、谚语、歇后语、惯用语和习用语。","w":"high","e":["教材高频"]},{"t":"成语","y":"名词解释","p":["成语是人们从历史上传承下来并长期使用的结构凝固、语义精辟且具有民族特点的熟语。","成语是熟语中最重要的一种，主要有四个特点：历史的传承性、结构的凝固性、意义的整体性、习用的民族性。","成语主要来源包括神话寓言、历史故事、诗文语句、口头俗语。"],"q":"成语是人们从历史上传承下来并长期使用的结构凝固、语义精辟且具有民族特点的熟语。","w":"high","e":["教材高频"]},{"t":"谚语","y":"名词解释","p":["谚语是民间基于深刻的社会生活经验而提炼出来的通俗、上口、精练、形象而有一定警示或教育意义的熟语。","谚语是人民智慧的结晶，能以浅显的语言表达深刻的道理。","根据谚语所反映的内容，谚语主要包括六种类型：农业谚语、气象谚语、规诫谚语、常识谚语、讽颂谚语、风土谚语。"],"q":"谚语是民间基于深刻的社会生活经验而提炼出来的通俗、上口、精练、形象而有一定警示或教育意义的熟语。","w":"high","e":["教材高频"]},{"t":"歇后语","y":"名词解释","p":["歇后语是指人们口头流传的由像谜面和谜底的前后两部分组成的通俗、风趣、形象而带有隐语性质的熟语。","前一部分是比喻或说出一个事物，类似于谜语的“谜面”，而后一部分则是解释说明，类似于“谜底”，前后两部分在话语中有停顿间歇，后一部分有时不说出来，让人去猜想其含义，所以称为歇后语。","根据歇后语前后两部分的关系以及后一部分与歇后语真实意义的关系，可以分成两类：喻意类和谐音类。"],"q":"歇后语是指人们口头流传的由像谜面和谜底的前后两部分组成的通俗、风趣、形象而带有隐语性质的熟语。","w":"high","e":["教材高频"]},{"t":"惯用语","y":"名词解释","p":["惯用语是群众口头创造并通过修辞手段准确、生动、形象、概括地揭示某些社会现象和某种行为的熟语。","从结构上看，典型的惯用语以三音节的动宾结构为主，也有部分偏正短语，少数主谓短语。","惯用语的整体意义不是其构成成分简单相加的意义，而是通过比喻、借代、夸张、比拟等手法所表达的修辞意义。"],"q":"惯用语是群众口头创造并通过修辞手段准确、生动、形象、概括地揭示某些社会现象和某种行为的熟语。","w":"high","e":["教材高频"]},{"t":"习用语","y":"名词解释","p":["习用语指口语中常用的一些习惯用语，形式不拘但基本固定，意义固化而有趣。","我们不能从字面意思去理解习用语，因为在长期口语使用中，它已经形成了某种特定的意义，但是跟成语、谚语、歇后语和惯用语还是有所不同。"],"q":"习用语指口语中常用的一些习惯用语，形式不拘但基本固定，意义固化而有趣。","w":"high","e":["教材高频"]},{"t":"【原文】巴士(bus) 的士(t","y":"教材原文","p":["巴士(bus) 的士(taxi) 克隆(clone) 派司(pass) 摩登(modern)沙龙(salon) 扑克(poker) 蒙太奇(montage) 拷贝(copy) 雷达(radar)"],"q":"巴士(bus) 的士(taxi) 克隆(clone) 派司(pass) 摩登(modern)沙龙(salon) 扑克(poker) 蒙太奇(montage) 拷贝(copy) 雷达(radar)","w":"normal","e":["原书正文"]},{"t":"【原文】新西兰(New Zeal","y":"教材原文","p":["新西兰(New Zealand) 冰激凌(ice-cream) 华尔街(Wall Street)道林纸(Dowling paper) 摩托车(motorcycle) 迷你裙(miniskirt)"],"q":"新西兰(New Zealand) 冰激凌(ice-cream) 华尔街(Wall Street)道林纸(Dowling paper) 摩托车(motorcycle) 迷你裙(miniskirt)","w":"normal","e":["原书正文"]},{"t":"【原文】浪漫主义(romanti","y":"教材原文","p":["浪漫主义(romanticism) 柠檬水(lemonade) 维特热(Werthersfieber)"],"q":"浪漫主义(romanticism) 柠檬水(lemonade) 维特热(Werthersfieber)","w":"normal","e":["原书正文"]},{"t":"【原文】基因(gene) 引得(","y":"教材原文","p":["基因(gene) 引得(index) 乌托邦(Utopia)俱乐部(club) 维他命(vitamin) 可口可乐(coca-cola)"],"q":"基因(gene) 引得(index) 乌托邦(Utopia)俱乐部(club) 维他命(vitamin) 可口可乐(coca-cola)","w":"normal","e":["原书正文"]},{"t":"【原文】佃农(tenant) 芒","y":"教材原文","p":["佃农(tenant) 芒果(mango) 绷带(bandage)"],"q":"佃农(tenant) 芒果(mango) 绷带(bandage)","w":"normal","e":["原书正文"]},{"t":"【原文】(4)音加语素式","y":"教材原文","p":["(4)音加语素式","即外来词是由音译部分和表示类名的汉语语素组成"],"q":"(4)音加语素式。即外来词是由音译部分和表示类名的汉语语素组成。如：","w":"normal","e":["原书正文"]},{"t":"【原文】啤酒(beer) 霓虹灯","y":"教材原文","p":["啤酒(beer) 霓虹灯(neon) 酒吧(bar) 艾滋病(AIDS)芭蕾舞(ballet) 沙丁鱼(sardine) 吉普车(jeep) 毛瑟枪(Mauser)"],"q":"啤酒(beer) 霓虹灯(neon) 酒吧(bar) 艾滋病(AIDS)芭蕾舞(ballet) 沙丁鱼(sardine) 吉普车(jeep) 毛瑟枪(Mauser)","w":"normal","e":["原书正文"]},{"t":"【原文】(5) 借音借形式","y":"教材原文","p":["(5) 借音借形式","一是借自西方字母的词","如: OK、UFO、MBA、SOS、BP机、X光、TDK包房、IP 卡、IC、CD、CT、FAX、VCD、DVD","二是借自日文汉字字形而非读音的词"],"q":"(5) 借音借形式。一是借自西方字母的词。如: OK、UFO、MBA、SOS、BP机、X光、TDK包房、IP 卡、IC、CD、CT、FAX、VCD、DVD。二是借自日文汉字字形而非读音的词。如：经济、革命、保险、分析、具体、学士、文明、交通、教授、直觉、演绎、否决、议会、干部、美术、引渡、组合、茶道、人选、手续、人气。","w":"normal","e":["原书正文"]}]},{"id":"xdhy_up-c03-s08","t":"第八节 词汇的发展与规范","w":"high","n":14,"k":[{"t":"异形词","y":"名词解释","p":["异形词是指语义相同或相近，而词的书写形式和语音形式不同的词。","书写形式不同的词主要分为三类：同素颠倒词、异形等义词、异形外来词。","同素颠倒词指语素相同而词序相反的异形词，可以分成取A弃B类、AB并存类、AB分工类；异形等义词指一个语素位置和字形相同，另一个语素位置相同而字形不同的异形词；异形外来词指因引进方法不同或引进地区不同而造成外来词在书写形式和发音形式上都不同。"],"q":"异形词是指语义相同或相近，而词的书写形式和语音形式不同的词。","w":"high","e":["教材高频"]},{"t":"异读词","y":"名词解释","p":["异读词是指意义和书写形式都相同而读音形式不同的词。","造成异读词的原因主要有以下几个方面：(1)读书音(文读)和口语音(白读)的分歧；(2)方言读音的影响；(3)古代汉语多音字沿用至今；(4)语音的自然发展；(5)讹读的影响。","规范异读词读音的三个原则是：合并原则、从俗原则、区别原则。"],"q":"异读词是指意义和书写形式都相同而读音形式不同的词。","w":"high","e":["教材高频"]},{"t":"生造词","y":"名词解释","p":["生造词是指为了标新立异，一些个人不遵循造词规律而任意拼凑语素造出来的词义含糊不清的词语。","生造词既没有指称新事物和新概念，也没有表达社会变革和社会心理的特殊效果。","生造词的形成方式主要包括：任意简缩、随意破词、随便拼凑。"],"q":"生造词是指为了标新立异，一些个人不遵循造词规律而任意拼凑语素造出来的词义含糊不清的词语。","w":"high","e":["教材高频"]},{"t":"误用词","y":"名词解释","p":["误用词是指词语本身没有问题，由于使用者对词义及其色彩义的理解有误或受词形、字音的影响而误用的词语。","误用词的词语本身没有问题，问题在于使用者的使用不当。","误用词的成因包括对词义及色彩义理解有误，或受词形、字音的影响。"],"q":"误用词是指词语本身没有问题，由于使用者对词义及其色彩义的理解有误或受词形、字音的影响而误用的词语。","w":"high","e":["教材高频"]},{"t":"规范意识与动态观念","y":"名词解释","p":["从总体上看，词汇的规范是相对的，而词汇的发展变化却是绝对的，因此，我们必须运用动态发展的眼光看待词汇的规范。","词汇规范的必要性体现在两个方面：一是词汇系统存在着不规范现象，比如异形词、异读词；二是词汇使用中存在着不规范现象，比如生造词、误用词。","词汇是在不断发展变化的，旧词的消亡、新词的产生，随时随地都在发生，因此，我们必须具有动态的发展观，处理好规范意识与动态观念的互动关系。"],"q":"从总体上看，词汇的规范是相对的，而词汇的发展变化却是绝对的，因此，我们必须运用动态发展的眼光看待词汇的规范。","w":"high","e":["教材高频"]},{"t":"辨析“生造词”和“误用词”。","y":"名词解释","p":["生造词：不遵循造词规律任意拼凑语素造出的词义含糊的词语，词语本身不规范","误用词：词语本身没问题，因理解有误或受词形字音影响而误用","关键区别：生造词是词语本身不规范，误用词是使用不当"],"q":"二者都是词汇使用中的不规范现象，但性质不同。(1)生造词是指为了标新立异，一些个人不遵循造词规律而任意拼凑语素造出来的词义含糊不清的词语，其词语本身就是新的、不规范的，形成方式包括任意简缩、随意破词、随便拼凑，如“教质”（教学质量）。(2)误用词是指词语本身没有问题，由于使用者对词义及其色彩义的理解","w":"normal","e":["核心概念"]},{"t":"【原文】4.日常现象带刺的鲜花—","y":"教材原文","p":["4.日常现象带刺的鲜花————好看不好摘 木耳炒豆腐————黑白分明小保姆带钥匙————当家不做主 老太太搬家————什么都拿"],"q":"4.日常现象带刺的鲜花————好看不好摘 木耳炒豆腐————黑白分明小保姆带钥匙————当家不做主 老太太搬家————什么都拿","w":"normal","e":["原书正文"]},{"t":"【原文】四、惯用语(一)惯用语的","y":"教材原文","p":["四、惯用语(一)惯用语的界定和结构类型惯用语是群众口头创造并通过修辞手段准确、生动、形象、概括地揭示某些社会现象和某种行为的熟语","从结构上看，典型的惯用语以三音节的动宾结构为主，也有部分偏正短语，少数主谓短语"],"q":"四、惯用语(一)惯用语的界定和结构类型惯用语是群众口头创造并通过修辞手段准确、生动、形象、概括地揭示某些社会现象和某种行为的熟语。从结构上看，典型的惯用语以三音节的动宾结构为主，也有部分偏正短语，少数主谓短语。如：","w":"normal","e":["原书正文"]},{"t":"【原文】1.动宾结构走后门、开绿","y":"教材原文","p":["1.动宾结构走后门、开绿灯、磨洋工、碰钉子、打游击、钻空子、踢皮球、吃老本、出难题、泼冷水、穿小鞋、倒胃口、吃鸭蛋、挖墙脚、走过场、交白卷、唱双簧、戴高帽、拍马屁、耍花招、敲边鼓、放空炮、吹牛皮、扣帽子、拉后腿、炒鱿鱼、挤牙膏、吃小灶、唱高调、唱白脸、唱主角、吃错药、打官腔、打水漂、打圆场、吊胃口、拍脑袋、侃大山、揭盖子、交学费、留尾巴、跑龙套、滚雪球、背黑锅、捞稻草、吃大锅饭、吃定心丸、吃闭门羹、捅马蜂窝、揭不开锅、打退堂鼓、打预防针、唱空城计、唱对台戏、摇鹅毛扇、念紧箍咒、灌迷魂汤、卖狗皮膏药、摸老虎屁股"],"q":"1.动宾结构走后门、开绿灯、磨洋工、碰钉子、打游击、钻空子、踢皮球、吃老本、出难题、泼冷水、穿小鞋、倒胃口、吃鸭蛋、挖墙脚、走过场、交白卷、唱双簧、戴高帽、拍马屁、耍花招、敲边鼓、放空炮、吹牛皮、扣帽子、拉后腿、炒鱿鱼、挤牙膏、吃小灶、唱高调、唱白脸、唱主角、吃错药、打官腔、打水漂、打圆场、吊胃口、拍脑袋、侃大山、揭盖子、交学费、留尾巴、跑龙套、滚雪球、背黑","w":"normal","e":["原书正文"]},{"t":"【原文】2.偏正结构铁将军、纸老","y":"教材原文","p":["2.偏正结构铁将军、纸老虎、空架子、护身符、马后炮、台柱子、香饽饽、烂摊子、定心丸、大气候、门外汉、领头羊、替罪羊、铁公鸡、变色龙、地头蛇、丧家犬、糊涂虫、老油条、老狐狸、白眼狼、阎王殿、鬼门关、老皇历、大红人、高姿态、墙头草、一亩三分地、一锤子买卖、豆腐渣工程"],"q":"2.偏正结构铁将军、纸老虎、空架子、护身符、马后炮、台柱子、香饽饽、烂摊子、定心丸、大气候、门外汉、领头羊、替罪羊、铁公鸡、变色龙、地头蛇、丧家犬、糊涂虫、老油条、老狐狸、白眼狼、阎王殿、鬼门关、老皇历、大红人、高姿态、墙头草、一亩三分地、一锤子买卖、豆腐渣工程","w":"normal","e":["原书正文"]},{"t":"【原文】3.主谓结构鬼画符、一刀","y":"教材原文","p":["3.主谓结构鬼画符、一刀切、满堂红、窝里斗(二)惯用语的意义惯用语的整体意义不是其构成成分简单相加的意义，而是通过比喻、借代、夸张、比拟等手法所表达的修辞意义"],"q":"3.主谓结构鬼画符、一刀切、满堂红、窝里斗(二)惯用语的意义惯用语的整体意义不是其构成成分简单相加的意义，而是通过比喻、借代、夸张、比拟等手法所表达的修辞意义。如：","w":"normal","e":["原书正文"]},{"t":"【原文】走过场：比喻敷衍了事","y":"教材原文","p":["走过场：比喻敷衍了事","揭不开锅：借指没有粮食或没有伙食钱"],"q":"走过场：比喻敷衍了事。 揭不开锅：借指没有粮食或没有伙食钱。","w":"normal","e":["原书正文"]},{"t":"【原文】泼脏水：比喻把坏名声强加","y":"教材原文","p":["泼脏水：比喻把坏名声强加给人","马后炮：比喻事后再出主意"],"q":"泼脏水：比喻把坏名声强加给人。马后炮：比喻事后再出主意。","w":"normal","e":["原书正文"]},{"t":"【原文】130第三章 词汇五、习","y":"教材原文","p":["130第三章 词汇五、习用语习用语指口语中常用的一些习惯用语，形式不拘但基本固定，意义固化而有趣","换言之，我们不能从字面意思去理解，因为在长期口语使用中，它已经形成了某种特定的意义，但是跟成语、谚语、歇后语和惯用语还是有所不同"],"q":"130第三章 词汇五、习用语习用语指口语中常用的一些习惯用语，形式不拘但基本固定，意义固化而有趣。换言之，我们不能从字面意思去理解，因为在长期口语使用中，它已经形成了某种特定的意义，但是跟成语、谚语、歇后语和惯用语还是有所不同。如：","w":"normal","e":["原书正文"]}]}]}]},{"d":"xdhy_down","t":"现代汉语通论（下册）","c":[{"id":"xdhy_down-c01","t":"第四章 语法","w":"high","s":[{"id":"xdhy_down-c01-s01","t":"第一节 现代汉语语法概述","w":"high","n":13,"k":[{"t":"语法","y":"名词解释","p":["制约着句子组合合法性的规则就是“语法”","语法是语言不可缺少的有机的组成部分","语音是语言的物质外壳，词汇是语言的建筑材料，语法是语言的构造规则","词语的组合绝不是任意的，符合规则句子就合法，否则就不合法"],"q":"语法是制约着句子组合合法性的规则。语音、词汇、语法三大部分构成语言的主体，语法是语言的构造规则。世界上任何语言都是有语法的，词语的组合不是任意的，符合规则句子就合法，否则就不合法。","w":"high","e":["2016 真题","2019 真题"]},{"t":"描写语法","y":"名词解释","p":["又叫“结构主义语法”","创始人为瑞士语言学家索绪尔","经典著作是《普通语言学教程》","提出“组合”和“聚合”两大结构关系","运用“直接成分分析法”对句法结构进行层次分析"],"q":"描写语法又叫“结构主义语法”，是在对传统语法批判的基础上形成的。创始人为索绪尔，经典著作是《普通语言学教程》。特点：区分语言和言语；提出组合和聚合两大结构关系；根据“分布”划分词类；强调层次，运用直接成分分析法。","w":"high","e":["2014 真题"]},{"t":"语法语序的变化","y":"名词解释","p":["语序变化引起语法关系的变化","目的一是话题化，为了强调","目的二是为了上下文的连贯衔接，满足已知信息到未知信息的传递规律"],"q":"语序变化同时引起了语法关系的变化，称为语法语序的变化。相对于常规语序来说，变化语序在表达上总是有一定目的：第一，最常见的就是话题化，这是为了强调；第二，是为了上下文的连贯衔接。","w":"high","e":["2020 真题","2023 真题"]},{"t":"传统语法","y":"名词解释","p":["又称“规范语法”或“学校语法”","分为词法和句法两大部分，以词法为主","划分词类主要依据形态变化","注重书面语分析","语法规则被看作一种规范和标准"],"q":"传统语法又称为“规范语法”或“学校语法”，从语法学产生就形成了，在教育界的影响是根深蒂固的。其特点主要分为词法和句法两大部分，并以词法为主；划分词类主要依据形态变化；注重书面语分析；语法规则被看作规范和标准。","w":"normal","e":["核心概念"]},{"t":"语法功能","y":"名词解释","p":["词的组合能力","能否与其他的词组合成短语","以什么顺序组合","组合以后表示什么关系","作句法成分的能力"],"q":"所谓语法功能是指词的组合能力，即能够跟哪些词组合，不能跟哪些词组合。组合能力有三重含义：能否与其他的词组合成短语；以什么顺序组合；组合以后表示什么关系。组合能力也包括作句法成分的能力。","w":"normal","e":["核心概念"]},{"t":"【原文】教育部“十二五”国家级规","y":"教材原文","p":["教育部“十二五”国家级规划教材教育部“十一五”国家级规划教材国家汉办教师资格证书考试推荐书目现代汉语通论(第三版)(下册)"],"q":"教育部“十二五”国家级规划教材教育部“十一五”国家级规划教材国家汉办教师资格证书考试推荐书目现代汉语通论(第三版)(下册)","w":"normal","e":["原书正文"]},{"t":"【原文】主编：邵敬敏(暨南大学)","y":"教材原文","p":["主编：邵敬敏(暨南大学)顾问：胡裕树(复旦大学)陆俭明(北京大学)第三版编者(2016):导论：邵敬敏(暨南大学) 语音：伍巍(暨南大学)"],"q":"主编：邵敬敏(暨南大学)顾问：胡裕树(复旦大学)陆俭明(北京大学)第三版编者(2016):导论：邵敬敏(暨南大学) 语音：伍巍(暨南大学)","w":"normal","e":["原书正文"]},{"t":"【原文】汉字：费锦昌(教育部语言","y":"教材原文","p":["汉字：费锦昌(教育部语言文字应用研究所)词汇：赵春利(暨南大学) 语法：邵敬敏(暨南大学)语用：方小燕(华南师范大学)第二版编者(2007):"],"q":"汉字：费锦昌(教育部语言文字应用研究所)词汇：赵春利(暨南大学) 语法：邵敬敏(暨南大学)语用：方小燕(华南师范大学)第二版编者(2007):","w":"normal","e":["原书正文"]},{"t":"【原文】导论：邵敬敏(暨南大学)","y":"教材原文","p":["导论：邵敬敏(暨南大学) 语音：伍巍(暨南大学)汉字：费锦昌(教育部语言文字应用研究所)词汇：郭熙(暨南大学) 语法：邵敬敏(暨南大学)"],"q":"导论：邵敬敏(暨南大学) 语音：伍巍(暨南大学)汉字：费锦昌(教育部语言文字应用研究所)词汇：郭熙(暨南大学) 语法：邵敬敏(暨南大学)","w":"normal","e":["原书正文"]},{"t":"【原文】语用：方小燕(华南师范大","y":"教材原文","p":["语用：方小燕(华南师范大学)第一版编者(2001):巢宗祺(华东师范大学) 池昌海(浙江大学)段业辉(南京师范大学) 范可育(华东师范大学)"],"q":"语用：方小燕(华南师范大学)第一版编者(2001):巢宗祺(华东师范大学) 池昌海(浙江大学)段业辉(南京师范大学) 范可育(华东师范大学)","w":"normal","e":["原书正文"]},{"t":"【原文】方小燕(华南师范大学) ","y":"教材原文","p":["方小燕(华南师范大学) 高家莺(华东师范大学)蒋同林(安徽师范大学) 孔令达(安徽师范大学)李宗江(解放军外语学院) 刘大为(复旦大学)"],"q":"方小燕(华南师范大学) 高家莺(华东师范大学)蒋同林(安徽师范大学) 孔令达(安徽师范大学)李宗江(解放军外语学院) 刘大为(复旦大学)","w":"normal","e":["原书正文"]},{"t":"【原文】刘永耕(福建师范大学) ","y":"教材原文","p":["刘永耕(福建师范大学) 邵敬敏(华东师范大学)苏新春(厦门大学) 唐健雄(河北师范大学)吴继光(徐州师范大学) 杨启光(暨南大学)"],"q":"刘永耕(福建师范大学) 邵敬敏(华东师范大学)苏新春(厦门大学) 唐健雄(河北师范大学)吴继光(徐州师范大学) 杨启光(暨南大学)","w":"normal","e":["原书正文"]},{"t":"【原文】杨锡彭(南京大学) 周 ","y":"教材原文","p":["杨锡彭(南京大学) 周 静(河南大学)上海教育出版社目 录第四章语法………………………………………………………………………………………………………………………………………………………………………………………"],"q":"杨锡彭(南京大学) 周 静(河南大学)上海教育出版社目 录第四章语法………………………………………………………………………………………………………………………………………………………………………………………","w":"normal","e":["原书正文"]}]},{"id":"xdhy_down-c01-s02","t":"第二节 词类和功能分析法","w":"high","n":18,"k":[{"t":"词类","y":"名词解释","p":["词类专指词的语法类别","不同的词类在形态、意义和功能等方面表现出区别性特点","划分词类的目的是为了说明语言的构造规则","词类是一个有层次的系统"],"q":"词类专指词的语法类别，不同的词类在形态、意义和功能等方面都表现出一些区别性的特点。划分词类的目的是为了说明语言的构造规则。现代汉语通常认为有十四个词类，词类是一个有层次的系统。","w":"high","e":["2013 真题","2018 真题"]},{"t":"区别词","y":"名词解释","p":["又叫“非谓形容词”","不能作谓语、主语、宾语，也不能受数量短语修饰","单独只能作定语","跟“的”构成“的”字结构"],"q":"区别词跟形容词有点儿像，但是不能作谓语，又叫“非谓形容词”。区别词跟名词也不同，不能作主语或宾语，也不能受数量短语修饰。区别词的语法特点有两条：①单独只能作定语；②跟“的”构成“的”字结构。","w":"high","e":["2018 真题"]},{"t":"辨析“忽然”与“突然”的词性。","y":"名词解释","p":["两者意义几乎一样","“忽然”只能够作状语，是副词","“突然”能作状语、补语、定语，还可受“很”修饰，是形容词","意义相同或类似而句法作用不同时，意义反而会产生误导"],"q":"“忽然”，表示“来得迅速而又出乎意料”；“突然”，表示“在短促时间里发生，出乎意外”。这两个词的意义几乎一样，似乎应该属于同一词类，其实不然。因为“忽然”只能够作状语，而“突然”除了作状语之外，还可以作补语(他来得突然)、定语(突然事件)，也可以受副词“很”的修饰(很突然)。因此，“忽然”是副词，“","w":"high","e":["2017 真题"]},{"t":"辨析副词“常常”与“往往”。","y":"名词解释","p":["都表示“经常性发生”","“往往”表示根据以往经验、在某种条件下发生带规律性的动作行为","无条件的或将来时的都不能用“往往”","“常常”没有这一限制"],"q":"“常常”和“往往”都表示“经常性发生”。但实际上两者意义还是有差别的：“往往”表示根据以往的经验，在某种条件下，发生带规律性的动作行为，因此，无条件的或将来时的都不能用“往往”；“常常”则没有这一限制。例如：“每逢假期，他常常去旅游。”/“每逢假期，他往往去旅游。（有规律）”；“他常常去图书馆看书。","w":"high","e":["教材高频"]},{"t":"代词","y":"名词解释","p":["具有替代和指示作用","包括人称代词、指示代词、疑问代词三类","不是按照语法功能划分出来的词类，只是在“指代”这一点上有共同点"],"q":"代词是具有替代和指示作用的词。代词包括三类：人称代词、指示代词、疑问代词。代词实际上并不是按照语法功能划分出来的词类，只是在“指代”这一点上有共同点。","w":"normal","e":["核心概念"]},{"t":"方位词","y":"名词解释","p":["一般附着在其他名词之后，表示处所","有的也可以独立使用","分为单纯方位词、合成方位词和特殊方位词三类"],"q":"方位词一般附着在其他名词之后，表示处所；有的也可以独立使用。方位词分为单纯方位词、合成方位词和特殊方位词三类。","w":"normal","e":["核心概念"]},{"t":"能愿动词","y":"名词解释","p":["也叫助动词","表示可能、必要或意愿","只能带动词性宾语","可以构成“不V不”格式"],"q":"能愿动词也叫助动词，表示可能、必要或意愿。语法特点是只能带动词性宾语，可以构成“不V不”格式。","w":"normal","e":["核心概念"]},{"t":"状态形容词","y":"名词解释","p":["也叫形容词的生动形式","表示程度比较高，前面不能再加“很”","使用时后面一般要带“的”","可比较自由地充当谓语、补语和状语"],"q":"状态形容词也叫形容词的生动形式，表示程度比较高，因而前面不能再加“很”，使用时后面一般要带“的”，可比较自由地充当谓语、补语和状语。","w":"normal","e":["核心概念"]},{"t":"辨析“咱们”与“我们”。","y":"名词解释","p":["“咱们”往往包括说话人和听话人双方，叫“包括式”","“我们”也可以兼指听说双方","“我们”与“咱们”同现时只指说话人一方，属于“排除式”"],"q":"“我、咱、我们”是第一人称代词，代表说话一方。“咱们”往往包括说话人和听话人双方，叫作“包括式”。“我们”也可以兼指听说双方，但与“咱们”同现时，就只指说话人一方，属于“排除式”。","w":"normal","e":["核心概念"]},{"t":"辨析及物动词与不及物动词。","y":"名词解释","p":["及物动词：只要能带宾语，不管带的是什么类型的宾语","不及物动词：不能带任何宾语","只能带施事宾语或处所宾语的也应归为及物动词","同一动词不同义项可归入不同小类"],"q":"(1)及物动词：只要能带宾语，不管带的是什么类型的宾语，都是及物动词。例如：吃、喝、拿、摸、打、来、去、走、坐、跑、取得、推广、发扬、选举、团结、修改、搜集、尊敬、服从、免得、惯于、进行、禁止、开展、受到、防止、觉得、感到、懒得、认为、以为、主张、打算、停止、继续、能够、可以、应该、愿意、敢于、值得","w":"normal","e":["核心概念"]},{"t":"【原文】国家独立/经济发展这两个","y":"教材原文","p":["国家独立/经济发展这两个语言单位分别由两个词构成，要是没有词类的知识，就难以说清它们的构造规则","如果知道“国家”和“经济”是名词，“独立”和“发展”是动词，这样我们就可以建立一个规则：“名词+动词”，可以构成主谓短语","如果把前后两个词的位置交换一下，变成“动词+名词”的构造，它们的结构就不完全一样了：“独立国家”是偏正短语，“发展经济”是述宾短语","要说明本来相同的结构中两个词交换了位置后，结构发生了不同的变化，也需要词类的知识"],"q":"国家独立/经济发展这两个语言单位分别由两个词构成，要是没有词类的知识，就难以说清它们的构造规则。如果知道“国家”和“经济”是名词，“独立”和“发展”是动词，这样我们就可以建立一个规则：“名词+动词”，可以构成主谓短语。如果把前后两个词的位置交换一下，变成“动词+名词”的构造，它们的结构就不完全一样了：“独立国家”是偏正短语，“发展经济”是述宾短语。要说明本来","w":"normal","e":["原书正文"]},{"t":"【原文】一、汉语的词类及其划分标","y":"教材原文","p":["一、汉语的词类及其划分标准(一)划类标准划分词类的标准主要有三个："],"q":"一、汉语的词类及其划分标准(一)划类标准划分词类的标准主要有三个：","w":"normal","e":["原书正文"]},{"t":"【原文】1.形态标准","y":"教材原文","p":["这应该是最简单、最明显，也最可靠的标准","在一些形态丰富的语言里，一个词属于什么词类，往往由词法上的形式标记或句法上的形式变化来表示，这就叫作形态，它包括："],"q":"1.形态标准。这应该是最简单、最明显，也最可靠的标准。在一些形态丰富的语言里，一个词属于什么词类，往往由词法上的形式标记或句法上的形式变化来表示，这就叫作形态，它包括：","w":"normal","e":["原书正文"]},{"t":"【原文】(1) 形态标志","y":"教材原文","p":["(1) 形态标志","比如俄语名词词尾有:-a、-я、-ие"],"q":"(1) 形态标志。比如俄语名词词尾有:-a、-я、-ие;","w":"normal","e":["原书正文"]},{"t":"【原文】(2)形态变化","y":"教材原文","p":["比如英语形容词的比较级和最高级是在原式后面加上 er或者 est"],"q":"(2)形态变化。比如英语形容词的比较级和最高级是在原式后面加上 er或者 est。","w":"normal","e":["原书正文"]},{"t":"【原文】汉语则无论是形态标志还是","y":"教材原文","p":["汉语则无论是形态标志还是形态变化都比较少，只有极少的一部分词有形态标志，如以后缀“-子、-儿、-头、-者、-家、-性”等结尾的词是名词","以后缀“化”结尾的词“绿化、腐化、美化、商业化、大众化、专业化”等是动词","以前缀“可”开头的词“可笑、可爱、可恨、可悲、可恶、可观”等多为形容词","但问题是绝大多数的词没有这类标志"],"q":"汉语则无论是形态标志还是形态变化都比较少，只有极少的一部分词有形态标志，如以后缀“-子、-儿、-头、-者、-家、-性”等结尾的词是名词；以后缀“化”结尾的词“绿化、腐化、美化、商业化、大众化、专业化”等是动词；以前缀“可”开头的词“可笑、可爱、可恨、可悲、可恶、可观”等多为形容词。但问题是绝大多数的词没有这类标志。","w":"normal","e":["原书正文"]},{"t":"【原文】汉语的形态变化也很少，比","y":"教材原文","p":["汉语的形态变化也很少，比如名词可以后加“们”表示不定量的复数，但不是所有名词都能加，只有指人的名词可以加，而且常常还可以不加仍然表示复数","动词加“了、着、过”等助词表示时态，也可以看作是一种广义的形态，但也不是所有的动词都可以带时态助词","双音节形容词可以按照AABB方式重叠，例如：漂漂亮亮、大大方方、干干净净、清清楚楚，但是还有许多形容词不能重叠，例如：美丽、庄严、精良、严肃","也有的形容词则按照 ABAB方式重叠，例如：雪白雪白、火红火红、笔直笔直、冰冷冰冷"],"q":"汉语的形态变化也很少，比如名词可以后加“们”表示不定量的复数，但不是所有名词都能加，只有指人的名词可以加，而且常常还可以不加仍然表示复数。动词加“了、着、过”等助词表示时态，也可以看作是一种广义的形态，但也不是所有的动词都可以带时态助词。双音节形容词可以按照AABB方式重叠，例如：漂漂亮亮、大大方方、干干净净、清清楚楚，但是还有许多形容词不能重叠，例如：美丽","w":"normal","e":["原书正文"]},{"t":"【原文】这些形态标志和形态变化，","y":"教材原文","p":["这些形态标志和形态变化，虽然对汉语词类的划分有一些帮助，但是由于缺乏普遍性，也没有强制性，所以只能够作为辅助标准"],"q":"这些形态标志和形态变化，虽然对汉语词类的划分有一些帮助，但是由于缺乏普遍性，也没有强制性，所以只能够作为辅助标准。","w":"normal","e":["原书正文"]}]},{"id":"xdhy_down-c01-s03","t":"第三节 虚词的作用及其辨析","w":"high","n":15,"k":[{"t":"助词","y":"名词解释","p":["黏着在词或短语上面，表示附加意义","附着在后面的一律读轻声","结构助词：的、地、得","时态助词：了、着、过","其他助词：似的、所、给、看、来、把、们、第、初、等"],"q":"助词共同的特点是：黏着在词或短语上面，表示附加意义，附着在后面的一律读轻声。助词主要有以下三类：结构助词、时态助词、其他助词。","w":"high","e":["2017 真题"]},{"t":"语气词","y":"名词解释","p":["一般用于句末","表示陈述、疑问、祈使、感叹等语气","永远黏着、后附、轻声"],"q":"语气词一般用于句末，表示陈述、疑问、祈使、感叹等语气，永远黏着、后附、轻声。","w":"high","e":["2016 真题","2020 真题"]},{"t":"虚词不妥","y":"名词解释","p":["虚词不妥指汉语虚词用法复杂、语义微妙，容易用错","属于语法病句类型之一"],"q":"虚词不妥，是指汉语的虚词极为丰富，不仅用法复杂，而且语义微妙，稍微不注意，就会用错。","w":"high","e":["2019 真题"]},{"t":"介词","y":"名词解释","p":["多是从动词虚化而来，又叫“副动词”","引进跟谓词有关的对象","跟名词组合成介词短语","主要作状语，也可以作补语"],"q":"介词多是从动词虚化而来，又叫“副动词”，部分现在还跟动词兼类。介词的语法作用是引进跟谓词有关的对象，跟名词组合成介词短语，主要作状语，也可以作补语。","w":"normal","e":["核心概念"]},{"t":"辨析语气词“吗”与“吧”。","y":"名词解释","p":["都用在是非疑问句末","“吗”疑大于信，怀疑程度大；“吧”信大于疑，怀疑程度小","“吧”句中可以出现“很可能”“八成”“大概”等词语","“吗”可加“难道”变成反问句，“吧”则不行"],"q":"“吗”和“吧”都用在是非疑问句末，只是“吗”表示怀疑的程度比较大，疑大于信；“吧”表示怀疑的程度比较小，信大于疑。例如，“今天八成是星期天吧?”可以用“吧”，而“*今天八成是星期天吗?”不行，因为“吧”表示基本上相信，但还有少许疑问，所以要对方给以确认，句中可以出现“很可能”“八成”“大概”等词语；","w":"normal","e":["核心概念"]},{"t":"辨析连词“或者”与“还是”。","y":"名词解释","p":["都是表示“选择”的连词","“或者”只能用于陈述句","“还是”主要用于疑问句，用于陈述句也含有疑惑的意思"],"q":"“或者”和“还是”，都是表示“选择”的连词，但“或者”只能用于陈述句，而“还是”主要用于疑问句，即使用于陈述句，也含有疑惑的意思。如：(1)暑假里，我们或者（*还是）去杭州，或者（*还是）去苏州。(2)你是去杭州，还是（*或者）去苏州?(3)我不清楚他是考文科还是（*或者）考理工科。","w":"normal","e":["核心概念"]},{"t":"辨析连词“只有”与“只要”。","y":"名词解释","p":["都是连词，表示条件","“只有”可以连接名词性短语和介词短语","“只要”只能接动词性词语和主谓短语"],"q":"“只有”和“只要”都是连词，表示条件，但“只有”可以连接名词性短语和介词短语，而“只要”只能接动词性词语和主谓短语。如：(1)只有付出真情的人才能赢得真情。（*“只要……就……”）(2)只有在特殊的情况下才能改变集体做出的决定。（*“只要……就……”）(3)只有努力学习，才能取得好成绩。（“只要……","w":"normal","e":["核心概念"]},{"t":"【原文】三、你怎么理解虚词的意义","y":"教材原文","p":["三、你怎么理解虚词的意义?虚词的意义与它们的语法功能是什么关系?四、有人把“副词”归入虚词，也有人归为“半实半虚词”，请你作一评论"],"q":"三、你怎么理解虚词的意义?虚词的意义与它们的语法功能是什么关系?四、有人把“副词”归入虚词，也有人归为“半实半虚词”，请你作一评论。","w":"normal","e":["原书正文"]},{"t":"【原文】五、传统上，总是把“拟声","y":"教材原文","p":["五、传统上，总是把“拟声词”和“叹词”归为虚词，本书则归为实词里的“功能词”，你认为哪种比较合理?六、有人觉得“起去”也可以说，你认为呢?"],"q":"五、传统上，总是把“拟声词”和“叹词”归为虚词，本书则归为实词里的“功能词”，你认为哪种比较合理?六、有人觉得“起去”也可以说，你认为呢?","w":"normal","e":["原书正文"]},{"t":"【原文】学习要点：掌握各类虚词的","y":"教材原文","p":["学习要点：掌握各类虚词的作用和使用特点","重点能够从各个角度对相近虚词进行辨析并准确使用"],"q":"学习要点：掌握各类虚词的作用和使用特点；重点能够从各个角度对相近虚词进行辨析并准确使用。","w":"normal","e":["原书正文"]},{"t":"【原文】一、汉语的虚词系统(十一","y":"教材原文","p":["一、汉语的虚词系统(十一)介词介词多是从动词虚化而来，又叫“副动词”，部分现在还跟动词兼类","介词的语法作用是引进跟谓词有关的对象，跟名词组合成介词短语，主要作状语，也可以作补语"],"q":"一、汉语的虚词系统(十一)介词介词多是从动词虚化而来，又叫“副动词”，部分现在还跟动词兼类。介词的语法作用是引进跟谓词有关的对象，跟名词组合成介词短语，主要作状语，也可以作补语。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】从：从北京(来) 用：用","y":"教材原文","p":["从：从北京(来) 用：用笔(写)对：对他(有利) 比：比他(聪明)在：(坐)在椅子上 向：(走)向世界常见的介词可以分为："],"q":"从：从北京(来) 用：用笔(写)对：对他(有利) 比：比他(聪明)在：(坐)在椅子上 向：(走)向世界常见的介词可以分为：","w":"normal","e":["原书正文"]},{"t":"【原文】1.所构成的介词短语表示","y":"教材原文","p":["1.所构成的介词短语表示跟动作有关的受事、施事、伴随、对象等，例如：拿、把、将、连、替、被、让、叫、给、比、跟、同、和、论、关于、对于、至于"],"q":"1.所构成的介词短语表示跟动作有关的受事、施事、伴随、对象等，例如：拿、把、将、连、替、被、让、叫、给、比、跟、同、和、论、关于、对于、至于。","w":"normal","e":["原书正文"]},{"t":"【原文】2.所构成的介词短语表示","y":"教材原文","p":["2.所构成的介词短语表示动作的方式、工具、材料、目的等，例如：照、依、据、凭、靠、用、以、根据、按照、遵照、通过、为了"],"q":"2.所构成的介词短语表示动作的方式、工具、材料、目的等，例如：照、依、据、凭、靠、用、以、根据、按照、遵照、通过、为了。","w":"normal","e":["原书正文"]},{"t":"【原文】3.所构成的介词短语表示","y":"教材原文","p":["3.所构成的介词短语表示动作的处所、时间等，例如：在、于、当、临、趁、到、自、从、由、打、向、朝、住、沿、顺"],"q":"3.所构成的介词短语表示动作的处所、时间等，例如：在、于、当、临、趁、到、自、从、由、打、向、朝、住、沿、顺。","w":"normal","e":["原书正文"]}]},{"id":"xdhy_down-c01-s04","t":"第四节 短语与层次分析法","w":"high","n":21,"k":[{"t":"短语","y":"名词解释","p":["由两个或两个以上单词构成的句法结构单位","在语义上能逐层贯通，在结构上能逐层搭配起来","没有句调的一组词","短语有两类：词组和结构"],"q":"由两个或两个以上单词构成的句法结构单位叫短语。它是在语义上能逐层贯通，在结构上能逐层搭配起来的没有句调的一组词。短语有两类：词组和结构。","w":"high","e":["2015 真题","2021 真题"]},{"t":"层次分析法","y":"名词解释","p":["分析句法结构层次的方法","是句法分析最基本、最有效的方法之一","正式学名叫“直接成分分析法”（IC）","由布龙菲尔德系统运用到句法结构分析上","分析时尽可能采取二分，俗称“二分法”"],"q":"两个单词构成的短语只可能是一个层次，所以不需要进行层次分析，但是如果有三个以上的单词在两个以上层次上进行组合，就需要进行层次分析，分析句法结构层次的方法就叫作“层次分析法”。这是句法分析最基本，也是最有效的方法之一。","w":"high","e":["2012 真题","2016 真题","2020 真题"]},{"t":"“的”字结构","y":"名词解释","p":["由结构助词“的”附加在其他词语之后构成","使谓词性成分转化为名词性成分","在语义上起转指作用"],"q":"“的”字结构由结构助词“的”附加在其他词语之后构成，主要作用是使谓词性成分转化为名词性成分，同时在语义上也起转指作用。","w":"high","e":["2020 真题"]},{"t":"固定短语","y":"名词解释","p":["固定短语是词与词的固定组合，在长期使用过程中形成了相对完整的意义，在实际使用时作用相当于一个词。","其特点是：(1)其中的词和词序一般不能自由变化；(2)整个短语的意义往往不能按字面意义去理解；(3)与词一样不能拆开，并且具有独立运用能力。","可见，固定短语具有结构的固定性、意义的整体性、功能的独立性。","固定短语主要有两类：一是专用短语，指特定的人物、地方、机构、活动以及会议等的名称；二是惯用熟语，指成语、谚语、歇后语与习用语。"],"q":"固定短语是词与词的固定组合，在长期使用过程中形成了相对完整的意义，在实际使用时作用相当于一个词。","w":"high","e":["教材高频"]},{"t":"兼语词组","y":"名词解释","p":["由一个述宾词组跟一个主谓词组套叠而成","述宾词组的宾语兼任主谓词组的主语","典型兼语词组的谓语动词往往带有使动性"],"q":"兼语词组是由一个述宾词组跟一个主谓词组套叠而成，述宾词组的宾语兼任主谓词组的主语。典型兼语词组的谓语动词往往带有使动性。","w":"high","e":["教材高频"]},{"t":"同形结构","y":"名词解释","p":["词形相同词序也相同","层次与意义都不同","也叫歧义结构"],"q":"同形结构是指一个词形相同词序也相同但层次与意义都不同的句法结构，也叫作“歧义结构”。","w":"high","e":["教材高频"]},{"t":"短语缩略法","y":"名词解释","p":["短语缩略法是指基于交际的经济性原则，通过简缩部分语素或词使短语缩略成词的造词方法。","短语缩略法包括五种方式：分段简缩式、截段简缩式、综合简缩式、取异合同式、数字概括式。","分段简缩式把短语分段，每段取一个成分；截段简缩式取其中具有区别性特征的一段；综合简缩式把分段与截段相结合；取异合同式保留差异成分，把相同成分合一；数字概括式用数字概括相同的成分，省略不同的成分。"],"q":"短语缩略法是指基于交际的经济性原则，通过简缩部分语素或词使短语缩略成词的造词方法。","w":"high","e":["教材高频"]},{"t":"比较中心词分析法与层次分析法的优缺点。","y":"名词解释","p":["中心词分析法优点：简便易操作、利于归纳句型、利于修改病句","中心词分析法缺点：缺乏层次观念、缺乏关系观念、词组身份不一致、语义理解偏误","层次分析法优点：既讲层次又讲关系，弥补中心词分析法不足","层次分析法缺点：手续烦琐、难以把握全局、难以处理歧义结构"],"q":"中心词分析法的优点是：（1）方法简便，易于操作。一个句子，特别是一些比较长、结构比较复杂的句子，可以很快分出句子的主干和枝叶，便于提纲挈领、主次分明。（2）有利于归纳句型，句子的格局比较清楚，对语文教学有一定帮助。（3）有利于修改病句。检查语法错误经常使用的“紧缩法”，就是从“中心词分析法”演变而来","w":"high","e":["教材高频"]},{"t":"语感","y":"名词解释","p":["对语言运用是否准确和得当的一种直接的本能的感觉","是长期积累起来的知识和能力的一种集中反映","需要有意识地去培养、积累和体验"],"q":"语感，就是对语言运用是否准确和得当的一种直接的本能的感觉。这种语感，是人们在使用语言的过程中，长期积累起来的知识和能力的一种集中反映。","w":"normal","e":["核心概念"]},{"t":"偏正词组","y":"名词解释","p":["前面的成分修饰、限定后面的成分","前面是修饰语，后面是中心语","分为定心词组和状心词组两类"],"q":"偏正词组前面的成分修饰、限定后面的成分，前面是修饰语，后面是中心语。偏正词组分为两类：定心词组和状心词组。","w":"normal","e":["核心概念"]},{"t":"述宾词组","y":"名词解释","p":["前后是支配与被支配、关涉与被关涉的关系","述语主要由及物动词充当","宾语一般是体词或体词性短语，也可以是谓词性短语或主谓词组","动词可分为体宾动词、谓宾动词、兼宾动词等"],"q":"述宾词组，前后是支配与被支配、关涉与被关涉的关系。述语主要由及物动词充当，宾语一般是体词或体词性短语，也可以是谓词、谓词性短语或主谓词组。根据这一特点，动词可以分为体宾动词、谓宾动词、兼宾动词三类，另有双宾动词和黏宾动词。","w":"normal","e":["核心概念"]},{"t":"同位词组","y":"名词解释","p":["前后成分所指内容相同","在句子中充当同一个句法成分","意义上构成复指关系"],"q":"同位词组前后成分所指内容相同，在句子中充当同一个句法成分，意义上构成复指关系。主要有通名与专名同位、别称与本称同位、数量短语构成的同位、人称代词构成的同位、指示代词构成的同位等类型。","w":"normal","e":["核心概念"]},{"t":"辨析“语素”“词”“短语”三个概念。","y":"名词解释","p":["语素：最小的音义结合的构词单位，不能独立运用","词：独立运用的音义结合的最小语言单位","短语：两个或两个以上词组合而成，可扩展","三者是不同层级的语言单位"],"q":"三者的区别主要在层级和功能上。(1)语素是语言中最小的音义结合的构词单位，是最基本的语言单位，一个语素必须是语音与语义结合而且不能再拆分；语素是构词成分，不能独立运用。(2)词是能够独立运用的音义结合的最小语言单位，具有独立运用能力，可以独立作语法结构成分或独立起语法作用；所有的词都是由语素组成的，","w":"normal","e":["核心概念"]},{"t":"【原文】3.数量短语构成的同位：","y":"教材原文","p":["3.数量短语构成的同位：夫妻二人/祖孙三代/语法修辞两门"],"q":"3.数量短语构成的同位：夫妻二人/祖孙三代/语法修辞两门","w":"normal","e":["原书正文"]},{"t":"【原文】4.人称代词构成的同位：","y":"教材原文","p":["4.人称代词构成的同位：我们自己/你们几位/他们夫妇/我张老三"],"q":"4.人称代词构成的同位：我们自己/你们几位/他们夫妇/我张老三","w":"normal","e":["原书正文"]},{"t":"【原文】5.指示代词构成的同位：","y":"教材原文","p":["5.指示代词构成的同位：星期一这天/他这个人/2000年那年/香港那个城市(七)连谓词组连谓词组表示连续的几个动作","所有的动作都是由同一个主体发出来的，而且动作往往具有前后的顺序"],"q":"5.指示代词构成的同位：星期一这天/他这个人/2000年那年/香港那个城市(七)连谓词组连谓词组表示连续的几个动作。所有的动作都是由同一个主体发出来的，而且动作往往具有前后的顺序。常见的类型有：","w":"normal","e":["原书正文"]},{"t":"【原文】倒杯茶喝/买本书看(八)","y":"教材原文","p":["倒杯茶喝/买本书看(八)兼语词组兼语词组是由一个述宾词组跟一个主谓词组套叠而成，述宾词组的宾语兼任主谓词组的主语","典型兼语词组的谓语动词往往带有使动性"],"q":"倒杯茶喝/买本书看(八)兼语词组兼语词组是由一个述宾词组跟一个主谓词组套叠而成，述宾词组的宾语兼任主谓词组的主语。典型兼语词组的谓语动词往往带有使动性。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】请他来/使祖国富强/派你","y":"教材原文","p":["请他来/使祖国富强/派你去西安/选班长做代表/有人敲门构成兼语词组的使令动词主要有：“使、请、派、选、催、逼、劝、让、叫、称、留、求、要、喊、命令、动员、发动、组织、号召、通知、鼓舞、鼓励、激励、领导、指导、阻止”等","此外，“有”“没有”以及某些动词性词语，在一定的语境里也能够构成兼语词组"],"q":"请他来/使祖国富强/派你去西安/选班长做代表/有人敲门构成兼语词组的使令动词主要有：“使、请、派、选、催、逼、劝、让、叫、称、留、求、要、喊、命令、动员、发动、组织、号召、通知、鼓舞、鼓励、激励、领导、指导、阻止”等；此外，“有”“没有”以及某些动词性词语，在一定的语境里也能够构成兼语词组。","w":"normal","e":["原书正文"]},{"t":"【原文】二、短语(结构)(一)量","y":"教材原文","p":["二、短语(结构)(一)量词结构量词结构是指量词在后跟其他词语组合而成的结构，它可分为数量结构、指量结构和疑量结构三小类："],"q":"二、短语(结构)(一)量词结构量词结构是指量词在后跟其他词语组合而成的结构，它可分为数量结构、指量结构和疑量结构三小类：","w":"normal","e":["原书正文"]},{"t":"【原文】3.疑量结构：哪条、几颗","y":"教材原文","p":["3.疑量结构：哪条、几颗、多少回量词结构的三个小类可以相互组合成比较复杂的结构","常见的有以下几种："],"q":"3.疑量结构：哪条、几颗、多少回量词结构的三个小类可以相互组合成比较复杂的结构。常见的有以下几种：","w":"normal","e":["原书正文"]},{"t":"【原文】这本+三本→这三本 每次","y":"教材原文","p":["这本+三本→这三本 每次+两次→每两次第二，数量结构和疑量结构组合"],"q":"这本+三本→这三本 每次+两次→每两次第二，数量结构和疑量结构组合。例如：","w":"normal","e":["原书正文"]}]},{"id":"xdhy_down-c01-s05","t":"第五节 句型系统","w":"high","n":15,"k":[{"t":"句子","y":"名词解释","p":["前后都有停顿","带有一定的语调","表示相对完整的意义","人们用来进行交际的基本语言单位"],"q":"句子是前后都有停顿，带有一定的语调，表示相对完整的意义，人们用来进行交际的基本语言单位。","w":"high","e":["教材高频"]},{"t":"句型","y":"名词解释","p":["按照句子的结构模式划分","类型系统"],"q":"句型是按照句子的结构模式划分出来的类型系统。建立在句子的结构模式基础上的句型，可以帮助我们分析成千上万个具体的句子，把它们纳入一定的系统框架，也可以解释无数个新的句子是如何产生的。","w":"high","e":["教材高频"]},{"t":"主谓句","y":"名词解释","p":["由主谓短语构成","能分析出主语和谓语两个直接成分"],"q":"主谓句是由主谓短语构成的句子，即能分析出主语和谓语两个直接成分的句子。","w":"high","e":["教材高频"]},{"t":"非主谓句","y":"名词解释","p":["单个词或非主谓短语构成","不能分析出主语和谓语","不宜叫无主句"],"q":"由单个词或者非主谓短语构成的单句是非主谓句。非主谓句不可能分析出主语和谓语来，所以不宜叫“无主句”。","w":"high","e":["教材高频"]},{"t":"中心词分析法","y":"名词解释","p":["传统语法分析句子的方法","又叫句子成分分析法","设立句子六大成分"],"q":"中心词分析法是传统语法分析句子时主要采用的方法，又叫句子成分分析法。它设立句子的六大成分，并认为句子总是由主谓词组组成的。由于这种句子分析法用六大成分来命名，所以又叫“句子成分分析法”。","w":"high","e":["教材高频"]},{"t":"提示成分","y":"名词解释","p":["称代式提示成分","总分式提示成分","不参加结构组合","出现在句首或句尾"],"q":"提示成分是句子的特殊成分之一，有两种：称代式提示成分和总分式提示成分。它不参加句子的结构组合，总是出现在句子的前面或后面。","w":"normal","e":["核心概念"]},{"t":"句子的特殊成分","y":"名词解释","p":["独立成分和提示成分","不参加句子的结构组合","不能独立成句","在语义表达上有特殊作用"],"q":"句子的特殊成分是指独立成分和提示成分。它们有三个特点：第一，不参加句子的结构组合，所以不是句型成分，也不是短语成分；第二，附属于句子，但是不能独立成句；第三，在语义表达上有特殊作用。","w":"normal","e":["核心概念"]},{"t":"【原文】(二)非主谓句由单个词或","y":"教材原文","p":["(二)非主谓句由单个词或者非主谓短语构成的单句是非主谓句","非主谓句不可能分析出主语和谓语来，所以不宜叫“无主句”","非主谓句可以分为四类："],"q":"(二)非主谓句由单个词或者非主谓短语构成的单句是非主谓句。非主谓句不可能分析出主语和谓语来，所以不宜叫“无主句”。非主谓句可以分为四类：","w":"normal","e":["原书正文"]},{"t":"【原文】(2) 啊? (叹词)根","y":"教材原文","p":["(2) 啊? (叹词)根据以上分析，我们可以构建一个现代汉语的单句句型系统："],"q":"(2) 啊? (叹词)根据以上分析，我
