. Bhd. ,2013.⑥ 沈文等，菲律宾华教中心2007年版"],"q":"⑤ 吴国强, (马来西亚) Mines Publishing Sdn. Bhd. ,2013.⑥ 沈文等，菲律宾华教中心2007年版。","w":"normal","e":["原书正文"]},{"t":"【原文】(二) 适用学校标注适用","y":"教材原文","p":["(二) 适用学校标注适用学校的教材共6486册，约占全部教材的64.17%","还有35.83%的教材标注不明确","标注明确的教材，具体情况如下：大学教材2565册，占39.55%","中学教材 (含初中、高中) 551册, 占8.49%"],"q":"(二) 适用学校标注适用学校的教材共6486册，约占全部教材的64.17%； 还有35.83%的教材标注不明确。标注明确的教材，具体情况如下：大学教材2565册，占39.55%；中学教材 (含初中、高中) 551册, 占8.49%; 小学教材1130册, 占17.42%; 学龄前教材139册, 占2.14%。跨类的情况为: 幼儿园至小学264册, 占4.07","w":"normal","e":["原书正文"]},{"t":"【原文】五、出版信息(一) 出版","y":"教材原文","p":["五、出版信息(一) 出版时间2000年以前出版的 1373 册, 占 13.58%","2001——2005 年出版的 2279 册, 占22.55%","2006年至今出版的6456册, 占63.87%"],"q":"五、出版信息(一) 出版时间2000年以前出版的 1373 册, 占 13.58%; 2001——2005 年出版的 2279 册, 占22.55%; 2006年至今出版的6456册, 占63.87%。","w":"normal","e":["原书正文"]},{"t":"【原文】2004年以来，我国在1","y":"教材原文","p":["2004年以来，我国在140个国家建立了511 所孔子学院和1073 所中小学课堂，学汉语的海外人士猛增","汉语教材出版数量、种类不断增加，是全球“汉语热”刚性需求的表现，也是2005年汉语作为第二语言教学事业进入跨越式发展阶段的证明"],"q":"2004年以来，我国在140个国家建立了511 所孔子学院和1073 所中小学课堂，学汉语的海外人士猛增。汉语教材出版数量、种类不断增加，是全球“汉语热”刚性需求的表现，也是2005年汉语作为第二语言教学事业进入跨越式发展阶段的证明。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c07-s02","t":"第二节 人才培养与技能训练","w":"normal","n":8,"k":[{"t":"【原文】最优秀的简历和证书公司要","y":"教材原文","p":["最优秀的简历和证书公司要招一名接待员，却来了四十多人","总经理让每一个人去他的办公室面试","这些人，不是拿着厚厚的简历，就是抱着各种各样的证书"],"q":"最优秀的简历和证书公司要招一名接待员，却来了四十多人。总经理让每一个人去他的办公室面试。这些人，不是拿着厚厚的简历，就是抱着各种各样的证书。","w":"normal","e":["原书正文"]},{"t":"【原文】面试了一个又一个，总经理","y":"教材原文","p":["面试了一个又一个，总经理都不满意","这时，有人轻轻地敲了三下门，进来一个青年，他没有拿证书，只拿了一份只有一页纸的简历","他在门口蹭掉鞋上的土，进门后随手关上了门，礼貌地递上简历","地上有本书，他很自然地捡起来放到办公桌上"],"q":"面试了一个又一个，总经理都不满意。这时，有人轻轻地敲了三下门，进来一个青年，他没有拿证书，只拿了一份只有一页纸的简历。他在门口蹭掉鞋上的土，进门后随手关上了门，礼貌地递上简历。地上有本书，他很自然地捡起来放到办公桌上。谈话的时候，一位腿有毛病的老人走进来，青年连忙起身扶他，给他让座。","w":"normal","e":["原书正文"]},{"t":"【原文】面试结束后，总经理说： ","y":"教材原文","p":["面试结束后，总经理说： “这个青年我用了","”其他人不理解： “他简历那么少，什么证书也没有，为什么是他?”"],"q":"面试结束后，总经理说： “这个青年我用了！”其他人不理解： “他简历那么少，什么证书也没有，为什么是他?”","w":"normal","e":["原书正文"]},{"t":"【原文】174 对外汉语教学入门","y":"教材原文","p":["174 对外汉语教学入门 (第三版)总经理说：“其实他带来了最优秀的简历和证书","他轻敲三下门，说明他有礼貌","他搀扶老人，并且给老人让座，说明他善良","进门时，蹭掉鞋上的土，捡起那本我故意放在地上的书，说明他细心，而别人都好像没看见一样"],"q":"174 对外汉语教学入门 (第三版)总经理说：“其实他带来了最优秀的简历和证书！ 他轻敲三下门，说明他有礼貌； 他搀扶老人，并且给老人让座，说明他善良； 进门时，蹭掉鞋上的土，捡起那本我故意放在地上的书，说明他细心，而别人都好像没看见一样。我们招的是接待员，还有比他更合适的吗?”","w":"normal","e":["原书正文"]},{"t":"【原文】通过测量，该文本的平均句","y":"教材原文","p":["通过测量，该文本的平均句长为20.81，文本长度为333，难度对应中级水平","这说明，教材中该段落适合中级学习者学习","经检验，该工具的定级准确率已超过90%(林星彤，2016)","由于定级准确、操作方便，“汉语文本指难针”已被许多二语研究所采用, 如许琪 (2016)"],"q":"通过测量，该文本的平均句长为20.81，文本长度为333，难度对应中级水平。这说明，教材中该段落适合中级学习者学习。经检验，该工具的定级准确率已超过90%(林星彤，2016)。由于定级准确、操作方便，“汉语文本指难针”已被许多二语研究所采用, 如许琪 (2016)。","w":"normal","e":["原书正文"]},{"t":"【原文】(2) 词汇反馈功能","y":"教材原文","p":["(2) 词汇反馈功能","在改编反馈时，该工具主要提供词汇等级和最长句的标注(图6.2)","词汇等级方面，该工具对初级词、中级词、高级词、更高级词和超纲词进行标注，分别对应通用大纲的一至四级词和超纲词，这里的超纲词指未出现在《等级划分》中的词汇","上述词汇分别用不同颜色(黑、绿、黄、紫、红) 标注"],"q":"(2) 词汇反馈功能。在改编反馈时，该工具主要提供词汇等级和最长句的标注(图6.2)。词汇等级方面，该工具对初级词、中级词、高级词、更高级词和超纲词进行标注，分别对应通用大纲的一至四级词和超纲词，这里的超纲词指未出现在《等级划分》中的词汇。上述词汇分别用不同颜色(黑、绿、黄、紫、红) 标注。","w":"normal","e":["原书正文"]},{"t":"【原文】我们仍以上述语篇为例，该","y":"教材原文","p":["我们仍以上述语篇为例，该文本中， “优秀” “证书” “却” “总经理” “面试”“礼貌”“让座”“着”“善良”等为中级词(标注绿色)","文本中还出现了一些超纲词(标注红色)，如“接待员”“起身”“办公桌”“轻敲”“搀扶”“捡”等","教材编写者可视情况替换或改编上述超纲词","另外，虽然最长句并不一定是文章中最难的句子，但对最长句进行下画线标注反馈，仍可视为文本改编的有效方法"],"q":"我们仍以上述语篇为例，该文本中， “优秀” “证书” “却” “总经理” “面试”“礼貌”“让座”“着”“善良”等为中级词(标注绿色)。文本中还出现了一些超纲词(标注红色)，如“接待员”“起身”“办公桌”“轻敲”“搀扶”“捡”等。教材编写者可视情况替换或改编上述超纲词。另外，虽然最长句并不一定是文章中最难的句子，但对最长句进行下画线标注反馈，仍可视为文本改编","w":"normal","e":["原书正文"]},{"t":"【原文】想进一步了解字词分布, ","y":"教材原文","p":["想进一步了解字词分布, 还可使用“汉语字词小档案”( http://www.languagedata.net/clpat)","该工具包括“汉字档案分析”和“词语档案分析”"],"q":"想进一步了解字词分布, 还可使用“汉语字词小档案”( http://www.languagedata.net/clpat)。该工具包括“汉字档案分析”和“词语档案分析”。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c07-s03","t":"第三节 汉语教师的发展","w":"normal","n":8,"k":[{"t":"【原文】(二) 语法研究利用汉语","y":"教材原文","p":["(二) 语法研究利用汉语语料库可以对汉语语法展开各种语言层面的研究","如对句子结构、句型以及语篇和文体进行分析，进而分析语言习得情况","肖奚强等的《汉语中介语语法问题研究》(2008) 利用外国学生汉语中介语偏误信息语料库，对比不同水平学生学习某些句式正误用例的数量和比例、中介语和汉语母语者的使用情况，得出其习得难度与顺序，并提出教学分级和排序建议"],"q":"(二) 语法研究利用汉语语料库可以对汉语语法展开各种语言层面的研究。如对句子结构、句型以及语篇和文体进行分析，进而分析语言习得情况。肖奚强等的《汉语中介语语法问题研究》(2008) 利用外国学生汉语中介语偏误信息语料库，对比不同水平学生学习某些句式正误用例的数量和比例、中介语和汉语母语者的使用情况，得出其习得难度与顺序，并提出教学分级和排序建议。","w":"normal","e":["原书正文"]},{"t":"【原文】赵金铭等的《基于中介语语","y":"教材原文","p":["赵金铭等的《基于中介语语料库的汉语句法研究》(2008) 以北京语言大学“汉语中介语语料库”中的材料为依托，采取定量研究与定性分析相结合的方法，对汉语中某些重要句式、句法成分和虚词的习得状况进行描写和分析","基于语料库的统计分析使研究结论更准确，体现了语言学发展的进一步科学化"],"q":"赵金铭等的《基于中介语语料库的汉语句法研究》(2008) 以北京语言大学“汉语中介语语料库”中的材料为依托，采取定量研究与定性分析相结合的方法，对汉语中某些重要句式、句法成分和虚词的习得状况进行描写和分析。基于语料库的统计分析使研究结论更准确，体现了语言学发展的进一步科学化。","w":"normal","e":["原书正文"]},{"t":"【原文】(三) 教材编写利用语料","y":"教材原文","p":["(三) 教材编写利用语料库编写教材逐渐成为学界热门","对此可以从两方面考察"],"q":"(三) 教材编写利用语料库编写教材逐渐成为学界热门。对此可以从两方面考察。","w":"normal","e":["原书正文"]},{"t":"【原文】1. 生词选取和处理可以","y":"教材原文","p":["1. 生词选取和处理可以在较大规模的语料库中统计高频词，人工干预选取真正的常用词作为教材生词","同时可以根据词频等信息对生词出现顺序进行排序","也可以统计对比各种相关教材已有生词，得出高频出现的生词，作为新教材的生词列表"],"q":"1. 生词选取和处理可以在较大规模的语料库中统计高频词，人工干预选取真正的常用词作为教材生词； 同时可以根据词频等信息对生词出现顺序进行排序。也可以统计对比各种相关教材已有生词，得出高频出现的生词，作为新教材的生词列表。","w":"normal","e":["原书正文"]},{"t":"【原文】在生词处理方面，语料库技","y":"教材原文","p":["在生词处理方面，语料库技术可以保证生词不会重复出现，还可以从技术层面减少超纲词","同时，有了语料库技术，给出的生词释义和例句会更真实，更丰富","生词释义中的例句来自语料库中的真实例句，释义也给出与课文句子及例句相关的意义，针对性更强"],"q":"在生词处理方面，语料库技术可以保证生词不会重复出现，还可以从技术层面减少超纲词。同时，有了语料库技术，给出的生词释义和例句会更真实，更丰富。生词释义中的例句来自语料库中的真实例句，释义也给出与课文句子及例句相关的意义，针对性更强。","w":"normal","e":["原书正文"]},{"t":"【原文】2. 课文素材难度控制可","y":"教材原文","p":["2. 课文素材难度控制可以统计候选文本的长度、用字量、用词量、超纲词数量及比率等数据，据此决定是否将该文本选用为课文","课文词汇等级也可以用语料库技术进行干预，严格控制词汇等级，合理安排各级词汇分布比例","可以根据课文长度、词汇等级、词汇难度等和课文"],"q":"2. 课文素材难度控制可以统计候选文本的长度、用字量、用词量、超纲词数量及比率等数据，据此决定是否将该文本选用为课文。课文词汇等级也可以用语料库技术进行干预，严格控制词汇等级，合理安排各级词汇分布比例。可以根据课文长度、词汇等级、词汇难度等和课文","w":"normal","e":["原书正文"]},{"t":"【原文】184 对外汉语教学入门","y":"教材原文","p":["184 对外汉语教学入门 (第三版)难度相关的数据统计来确定课文排序","此外，还可以考虑语法点出现的顺序以及语法点出现的多少，尽量选择共有字词比较多的素材来作为课文，以提高生字词的复现率，提高教学效果"],"q":"184 对外汉语教学入门 (第三版)难度相关的数据统计来确定课文排序。此外，还可以考虑语法点出现的顺序以及语法点出现的多少，尽量选择共有字词比较多的素材来作为课文，以提高生字词的复现率，提高教学效果。","w":"normal","e":["原书正文"]},{"t":"【原文】(四) 对于词典编纂的作","y":"教材原文","p":["(四) 对于词典编纂的作用大型语料库对于词典编纂极有用处","词典正文中的词义解释、例句和词语使用频率标记等都可以来源于实际语料库","词典编纂者可以从数百万字的语篇语料中查找出某个词或短语的用法实例","这样，词典的编纂和修订速度可以大大加快，可以及时提供新的语言信息，大量的自然语言实例可以使词的定义更加完整和确切"],"q":"(四) 对于词典编纂的作用大型语料库对于词典编纂极有用处。词典正文中的词义解释、例句和词语使用频率标记等都可以来源于实际语料库。词典编纂者可以从数百万字的语篇语料中查找出某个词或短语的用法实例。这样，词典的编纂和修订速度可以大大加快，可以及时提供新的语言信息，大量的自然语言实例可以使词的定义更加完整和确切。","w":"normal","e":["原书正文"]}]}]},{"id":"rumen-c08","t":"第八章 汉语传播与教学简史","w":"normal","s":[{"id":"rumen-c08-s01","t":"第一节 汉语在东亚、东南亚的传播","w":"normal","n":8,"k":[{"t":"【原文】2. 北京大学CCL语料","y":"教材原文","p":["2. 北京大学CCL语料库( http://ecl.pku.edu.cn:8080/ccl corpus/index.jsp?dir=xiandai )"],"q":"2. 北京大学CCL语料库( http://ecl.pku.edu.cn:8080/ccl corpus/index.jsp?dir=xiandai )","w":"normal","e":["原书正文"]},{"t":"【原文】总字数约3亿字，包括现代","y":"教材原文","p":["总字数约3亿字，包括现代汉语和古代汉语，另外还有汉英双语语料库"],"q":"总字数约3亿字，包括现代汉语和古代汉语，另外还有汉英双语语料库。","w":"normal","e":["原书正文"]},{"t":"【原文】3.国家语委现代汉语语料","y":"教材原文","p":["3.国家语委现代汉语语料库 http://www.encorpus.org)平衡语料库，总字数1945万，题材类别广泛，时间跨度大，包括人文社会科学类、自然科学类、综合类等领域的语料","语料经分词和词性标注，可进行按词检索和分词类的检索"],"q":"3.国家语委现代汉语语料库 http://www.encorpus.org)平衡语料库，总字数1945万，题材类别广泛，时间跨度大，包括人文社会科学类、自然科学类、综合类等领域的语料。语料经分词和词性标注，可进行按词检索和分词类的检索。","w":"normal","e":["原书正文"]},{"t":"【原文】4.厦门大学语料库 ht","y":"教材原文","p":["4.厦门大学语料库 http://www.luweixmu.com/ccorpus/index.htm)包括中文语料库和商务汉语语料库","中文语料库收集中文自然语料文本大约1061万字次、738万词次(含标点)，涉及的语体有书面语和口语，语域(学科) 包括文学、科技、新闻、广告等"],"q":"4.厦门大学语料库 http://www.luweixmu.com/ccorpus/index.htm)包括中文语料库和商务汉语语料库。中文语料库收集中文自然语料文本大约1061万字次、738万词次(含标点)，涉及的语体有书面语和口语，语域(学科) 包括文学、科技、新闻、广告等。标注","w":"normal","e":["原书正文"]},{"t":"【原文】188 对外汉语教学入门","y":"教材原文","p":["188 对外汉语教学入门(第三版)语料库用软件自动分词和词性附码，但未经人工干预","商务汉语语料库收集商务汉语自然语料文本大约120万字次、85万词次 (含标点)"],"q":"188 对外汉语教学入门(第三版)语料库用软件自动分词和词性附码，但未经人工干预。商务汉语语料库收集商务汉语自然语料文本大约120万字次、85万词次 (含标点)。","w":"normal","e":["原书正文"]},{"t":"【原文】5. 台湾“中央研究院”","y":"教材原文","p":["5. 台湾“中央研究院”现代汉语平衡语料库( http://app.sinica.edu.tw/cgi-bin/kiwi/mkiwi/kiwi.sh)"],"q":"5. 台湾“中央研究院”现代汉语平衡语料库( http://app.sinica.edu.tw/cgi-bin/kiwi/mkiwi/kiwi.sh)","w":"normal","e":["原书正文"]},{"t":"【原文】服务于语言分析，每个句子","y":"教材原文","p":["服务于语言分析，每个句子都依词断开，并标注词类","语料收集尽量做到不同主题和语式的均衡分布，包括文学、生活、社会、科学、哲学、艺术等领域，共约790万字"],"q":"服务于语言分析，每个句子都依词断开，并标注词类。语料收集尽量做到不同主题和语式的均衡分布，包括文学、生活、社会、科学、哲学、艺术等领域，共约790万字。","w":"normal","e":["原书正文"]},{"t":"【原文】6.兰卡斯特汉语语料库(","y":"教材原文","p":["6.兰卡斯特汉语语料库(LCMC) http://bowland-files.lancs.ac.uk/corplang/cgi-bin/conc.pl)"],"q":"6.兰卡斯特汉语语料库(LCMC) http://bowland-files.lancs.ac.uk/corplang/cgi-bin/conc.pl)","w":"normal","e":["原书正文"]}]},{"id":"rumen-c08-s02","t":"第二节 汉语在西方的传播","w":"normal","n":8,"k":[{"t":"【原文】步骤二，模拟教学","y":"教材原文","p":["步骤二，模拟教学","研究生选某一课型某一教学单元，在教师指导下撰写教案","模拟真实教学，根据教案进行说课和无学生的模拟教学","教师评点教案和模拟教学，提出改进方案"],"q":"步骤二，模拟教学。研究生选某一课型某一教学单元，在教师指导下撰写教案； 模拟真实教学，根据教案进行说课和无学生的模拟教学； 教师评点教案和模拟教学，提出改进方案。","w":"normal","e":["原书正文"]},{"t":"【原文】步骤三，试讲","y":"教材原文","p":["在模拟教学基础上，研究生在真实课堂试讲一两次课","指导教师在试讲前给予具体指导","试讲后及时评点，提出改进方案"],"q":"步骤三，试讲。在模拟教学基础上，研究生在真实课堂试讲一两次课。指导教师在试讲前给予具体指导； 试讲时随堂听课； 试讲后及时评点，提出改进方案。","w":"normal","e":["原书正文"]},{"t":"【原文】(二) 实习阶段研究生需","y":"教材原文","p":["(二) 实习阶段研究生需要独立或与其他教师合作完成一门课程的教学","在实习开始前，先集中培训，按课型特点分别给予有针对性的指导","为每位研究生安排熟手教师进行全程指导","指导方式有：互相听课，撰写听课报告，指导撰写教案，解决研究生教学中的实际问题"],"q":"(二) 实习阶段研究生需要独立或与其他教师合作完成一门课程的教学。在实习开始前，先集中培训，按课型特点分别给予有针对性的指导。为每位研究生安排熟手教师进行全程指导。指导方式有：互相听课，撰写听课报告，指导撰写教案，解决研究生教学中的实际问题。学期中安排专门的课型教研活动，为研究生提供更多答疑解惑的机会。","w":"normal","e":["原书正文"]},{"t":"【原文】通过全程见习实习，研究生","y":"教材原文","p":["通过全程见习实习，研究生能把所学知识跟具体的教学实践结合起来，有效积累教学经验，培养汉语教学能力","研究生入学第二年，就可以到海外任教，胜任多种教学任务"],"q":"通过全程见习实习，研究生能把所学知识跟具体的教学实践结合起来，有效积累教学经验，培养汉语教学能力。研究生入学第二年，就可以到海外任教，胜任多种教学任务。","w":"normal","e":["原书正文"]},{"t":"【原文】(一) 传统的授课或讲座","y":"教材原文","p":["(一) 传统的授课或讲座方式《培养方案》的课程设置部分中，中华文化与传播类的课程占有重要位置","各高校除了开设中华文化知识类课程，还会设置如书法、太极拳、古筝、剪纸等中华才艺类课程，为研究生掌握中华文化知识和技艺创造了有利条件"],"q":"(一) 传统的授课或讲座方式《培养方案》的课程设置部分中，中华文化与传播类的课程占有重要位置。各高校除了开设中华文化知识类课程，还会设置如书法、太极拳、古筝、剪纸等中华才艺类课程，为研究生掌握中华文化知识和技艺创造了有利条件。","w":"normal","e":["原书正文"]},{"t":"【原文】(二) 实践式培养让研究","y":"教材原文","p":["(二) 实践式培养让研究生参与各项文化传播活动，在实践中获取经验","可以在教师指导下，让研究生自主策划、组织文化传播项目，传播对象为在校的汉语进修生和留学生本科生，或国际学校的中小学生","在策划、组织工作中，要解决各种问题","在选择主题、设计活动方式时，需要考虑：举行电影节还是访问中小学? 介绍太极文化还是制作中国印章? 具体问题如资金利用、人员分工、租借布置场地、设计舞台效果等"],"q":"(二) 实践式培养让研究生参与各项文化传播活动，在实践中获取经验。可以在教师指导下，让研究生自主策划、组织文化传播项目，传播对象为在校的汉语进修生和留学生本科生，或国际学校的中小学生。在策划、组织工作中，要解决各种问题。在选择主题、设计活动方式时，需要考虑：举行电影节还是访问中小学? 介绍太极文化还是制作中国印章? 具体问题如资金利用、人员分工、租借布置场地","w":"normal","e":["原书正文"]},{"t":"【原文】类似实践，锻炼了研究生的","y":"教材原文","p":["类似实践，锻炼了研究生的文化传播能力，为其在海内外独立从事文化传播打下坚实的基础"],"q":"类似实践，锻炼了研究生的文化传播能力，为其在海内外独立从事文化传播打下坚实的基础。","w":"normal","e":["原书正文"]},{"t":"【原文】三、跨文化交际能力对国际","y":"教材原文","p":["三、跨文化交际能力对国际汉语教师来说，跨文化交际能力是核心能力","其地位比对一般人而言要重要得多"],"q":"三、跨文化交际能力对国际汉语教师来说，跨文化交际能力是核心能力。其地位比对一般人而言要重要得多。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c08-s03","t":"第三节 华人移民和华文教育","w":"normal","n":8,"k":[{"t":"【原文】3. 对比你自己的成长过","y":"教材原文","p":["3. 对比你自己的成长过程，或者你周围人的情况，你认为研究生教育应该包括哪些能力的培养，应该用什么方式培养? 现有研究生教育还有什么不足，应该如何改进?"],"q":"3. 对比你自己的成长过程，或者你周围人的情况，你认为研究生教育应该包括哪些能力的培养，应该用什么方式培养? 现有研究生教育还有什么不足，应该如何改进?","w":"normal","e":["原书正文"]},{"t":"【原文】4. 根据本章第三节的内","y":"教材原文","p":["4. 根据本章第三节的内容，尝试写一段时间 (一个星期、一个月或一个学期) 的教学日志，看看对自己的教学、研究有无促进作用"],"q":"4. 根据本章第三节的内容，尝试写一段时间 (一个星期、一个月或一个学期) 的教学日志，看看对自己的教学、研究有无促进作用。","w":"normal","e":["原书正文"]},{"t":"【原文】5. 记录一个跨文化交际","y":"教材原文","p":["5. 记录一个跨文化交际方面的案例，并进行具体分析"],"q":"5. 记录一个跨文化交际方面的案例，并进行具体分析。","w":"normal","e":["原书正文"]},{"t":"【原文】6. 作为一个研究生或在","y":"教材原文","p":["6. 作为一个研究生或在职教师，应该如何提高自己的研究能力? 请参考本章内容，寻找一个值得研究的问题，写出研究设计(选题内容与意义，如何收集、整理材料，如何研读前人成果，如何分析材料并得出有说服力、有创新性的结论)"],"q":"6. 作为一个研究生或在职教师，应该如何提高自己的研究能力? 请参考本章内容，寻找一个值得研究的问题，写出研究设计(选题内容与意义，如何收集、整理材料，如何研读前人成果，如何分析材料并得出有说服力、有创新性的结论)。","w":"normal","e":["原书正文"]},{"t":"【原文】7. 作为一个国际汉语教","y":"教材原文","p":["7. 作为一个国际汉语教师，应该如何做行为研究和叙事研究? 请参考相关文献(包括下边列出的文献)，尝试做相关研究，并写下研究过程和结果"],"q":"7. 作为一个国际汉语教师，应该如何做行为研究和叙事研究? 请参考相关文献(包括下边列出的文献)，尝试做相关研究，并写下研究过程和结果。","w":"normal","e":["原书正文"]},{"t":"【原文】8. 作为一位教师，如何","y":"教材原文","p":["8. 作为一位教师，如何培养学生提高研究能力?本章参考文献[1] 北京汉语国际推广中心，北京师范大学汉语文化中心","国际汉语教育人才培养论丛：第一辑[M]. 北京: 北京大学出版社, 2008."],"q":"8. 作为一位教师，如何培养学生提高研究能力?本章参考文献[1] 北京汉语国际推广中心，北京师范大学汉语文化中心。国际汉语教育人才培养论丛：第一辑[M]. 北京: 北京大学出版社, 2008.","w":"normal","e":["原书正文"]},{"t":"【原文】[2] 北京汉语国际推广","y":"教材原文","p":["[2] 北京汉语国际推广中心，北京师范大学汉语文化中心，国际汉语教育人才培养论丛：第二辑[M]. 北京: 北京大学出版社, 2011."],"q":"[2] 北京汉语国际推广中心，北京师范大学汉语文化中心，国际汉语教育人才培养论丛：第二辑[M]. 北京: 北京大学出版社, 2011.","w":"normal","e":["原书正文"]},{"t":"【原文】[3]北京汉语国际推广中","y":"教材原文","p":["[3]北京汉语国际推广中心，北京师范大学汉语文化中心.国际汉语教育人才培养论丛：第三辑[M]. 北京: 北京大学出版社, 2012."],"q":"[3]北京汉语国际推广中心，北京师范大学汉语文化中心.国际汉语教育人才培养论丛：第三辑[M]. 北京: 北京大学出版社, 2012.","w":"normal","e":["原书正文"]}]},{"id":"rumen-c08-s04","t":"第四节 中华人民共和国成立前国内的汉语教学","w":"normal","n":8,"k":[{"t":"【原文】周有光先生指出：谚文是通","y":"教材原文","p":["周有光先生指出：谚文是通俗文字的意思，它可以说是音素合成的音节文字","谚文字母在无意之中受了汉字笔画元素的影响","谚文叠成方块，跟汉字匹配，这是明显的汉字影响","①谚文的创制，在朝鲜文明发展史上具有划时代意义"],"q":"周有光先生指出：谚文是通俗文字的意思，它可以说是音素合成的音节文字。谚文字母在无意之中受了汉字笔画元素的影响。谚文叠成方块，跟汉字匹配，这是明显的汉字影响。①谚文的创制，在朝鲜文明发展史上具有划时代意义。它改变了昔日朝鲜语言与文字分离的现象，有利于民众学习文化知识，发展民族文化事业，自推广后一直沿用至今。","w":"normal","e":["原书正文"]},{"t":"【原文】但是跟日本假名一样，使用","y":"教材原文","p":["但是跟日本假名一样，使用朝鲜谚文同样会遇到同音、近音的字词太多，难于阅读的问题","2005年2月，韩国政府宣布：在所有公务文件和交通标识领域全面恢复使用汉字和汉字标记，目前全用韩文的公务文件将改为韩汉两种文字并用","但事实上，现在韩国只有交通标识系统有汉字","迄今为止，韩国仍有1800多个汉字在使用"],"q":"但是跟日本假名一样，使用朝鲜谚文同样会遇到同音、近音的字词太多，难于阅读的问题。2005年2月，韩国政府宣布：在所有公务文件和交通标识领域全面恢复使用汉字和汉字标记，目前全用韩文的公务文件将改为韩汉两种文字并用。但事实上，现在韩国只有交通标识系统有汉字。迄今为止，韩国仍有1800多个汉字在使用。","w":"normal","e":["原书正文"]},{"t":"【原文】二、汉语在日本的传播公元","y":"教材原文","p":["二、汉语在日本的传播公元前3至2世纪，中国水稻栽培、金属工具制造等技术经由朝鲜半岛传入日本九州等地，汉语、汉字也随之传入","日本原来有语言但没有文字","《隋书·倭国传》：“无文字，唯刻木结绳","敬佛法，于百济求得佛经，始有文字"],"q":"二、汉语在日本的传播公元前3至2世纪，中国水稻栽培、金属工具制造等技术经由朝鲜半岛传入日本九州等地，汉语、汉字也随之传入。日本原来有语言但没有文字。《隋书·倭国传》：“无文字，唯刻木结绳。敬佛法，于百济求得佛经，始有文字。”","w":"normal","e":["原书正文"]},{"t":"【原文】① 周有光著：《世界文字","y":"教材原文","p":["① 周有光著：《世界文字发展史》，上海教育出版杜1997年版，第130页"],"q":"① 周有光著：《世界文字发展史》，上海教育出版杜1997年版，第130页。","w":"normal","e":["原书正文"]},{"t":"【原文】285年，百济的王仁把《","y":"教材原文","p":["285年，百济的王仁把《论语》《千字文》带到日本，并为日本皇太子菟道雉郎子讲授，成为日本第一个汉语教师","隋唐以前，日本岛完全借用汉字记录本国口头语言，进行书面交际","现存最早的两部史书《古事记》(图8.5) 和《日本书纪》(图8.6)，全是用汉字写的"],"q":"285年，百济的王仁把《论语》《千字文》带到日本，并为日本皇太子菟道雉郎子讲授，成为日本第一个汉语教师。隋唐以前，日本岛完全借用汉字记录本国口头语言，进行书面交际。现存最早的两部史书《古事记》(图8.5) 和《日本书纪》(图8.6)，全是用汉字写的。","w":"normal","e":["原书正文"]},{"t":"【原文】隋唐时期中国的兴盛，也吸","y":"教材原文","p":["隋唐时期中国的兴盛，也吸引了大批日本留学生","据记载，仅从隋文帝开皇二十年(600) 到隋炀帝大业十年 (614) 之间，日本即派出遣隋使5次之多","在唐代，日本政府先后派出16批遣唐使，每次都有大批留学生和僧人随船前来，有力地促进了汉语在日本的传播","在这些留学生中，也出现了不少名人"],"q":"隋唐时期中国的兴盛，也吸引了大批日本留学生。据记载，仅从隋文帝开皇二十年(600) 到隋炀帝大业十年 (614) 之间，日本即派出遣隋使5次之多。在唐代，日本政府先后派出16批遣唐使，每次都有大批留学生和僧人随船前来，有力地促进了汉语在日本的传播。在这些留学生中，也出现了不少名人。","w":"normal","e":["原书正文"]},{"t":"【原文】著名的留学生吉备真备和阿","y":"教材原文","p":["著名的留学生吉备真备和阿倍仲麻吕即是唐玄宗开元五年 (717) 随第九次遣唐使来华的","吉备真备是奈良时代赴唐留学生，后来成为著名学者，并借用汉字的楷书偏旁创立了部分日本文字中的片假名","阿倍仲麻吕是与吉备真备同时来唐的日本留学生，性明敏，好读书，博闻强记，就学于唐太学，改名晁衡","卒业后，他参加科举考试中第，在唐就职"],"q":"著名的留学生吉备真备和阿倍仲麻吕即是唐玄宗开元五年 (717) 随第九次遣唐使来华的。吉备真备是奈良时代赴唐留学生，后来成为著名学者，并借用汉字的楷书偏旁创立了部分日本文字中的片假名。阿倍仲麻吕是与吉备真备同时来唐的日本留学生，性明敏，好读书，博闻强记，就学于唐太学，改名晁衡。卒业后，他参加科举考试中第，在唐就职。晁衡与唐朝著名诗人王维、李白、包佶等均有交谊","w":"normal","e":["原书正文"]},{"t":"【原文】此外，唐代日本来华的学问","y":"教材原文","p":["此外，唐代日本来华的学问僧数量大大超过了普通留学生","学问僧本质上也是留学生，是既学汉语又学佛法的留学生","这些学问僧大多来唐居留时间长，且与唐时文化名人交往频繁，回日后均带回大量汉文典籍，又著书立说，对汉语在日本的传播同样贡献巨大","空海是其中最为著名的一位"],"q":"此外，唐代日本来华的学问僧数量大大超过了普通留学生。学问僧本质上也是留学生，是既学汉语又学佛法的留学生。这些学问僧大多来唐居留时间长，且与唐时文化名人交往频繁，回日后均带回大量汉文典籍，又著书立说，对汉语在日本的传播同样贡献巨大。空海是其中最为著名的一位。他于贞元二十年 (804) 来唐，从真言密教第七代","w":"normal","e":["原书正文"]}]}]},{"id":"rumen-c09","t":"第九章 语音教学","w":"normal","s":[{"id":"rumen-c09-s01","t":"第一节 语音介绍","w":"normal","n":8,"k":[{"t":"【原文】罗伯特·马礼逊(Robe","y":"教材原文","p":["罗伯特·马礼逊(Robert Morrison) 是西方派到中国大陆的第一位基督新教传教士，他在华25年，在许多方面都有首创之功","马礼逊于清嘉庆十二年 (1807年) 奉伦敦传教会之命来华","他先后聘请数名中国人教他汉语，整日徜徉于四书五经之中，迅速提高其汉文水平","掌握了汉语的马礼逊汉译《圣经》，并陆续出版了英文版《汉语语法》、汉英对照本《华英字典》(A dictionary of the Chinese language, 该字典第二卷第一部分名为《五车韵府》) 以及英文版《广东省土话字汇》(图8.16) 等"],"q":"罗伯特·马礼逊(Robert Morrison) 是西方派到中国大陆的第一位基督新教传教士，他在华25年，在许多方面都有首创之功。马礼逊于清嘉庆十二年 (1807年) 奉伦敦传教会之命来华。他先后聘请数名中国人教他汉语，整日徜徉于四书五经之中，迅速提高其汉文水平。掌握了汉语的马礼逊汉译《圣经》，并陆续出版了英文版《汉语语法》、汉英对照本《华英字典》(A di","w":"normal","e":["原书正文"]},{"t":"【原文】① 李志刚：《基督教早期","y":"教材原文","p":["① 李志刚：《基督教早期在华传教史》，台湾商务印书馆1985年版，第203页"],"q":"① 李志刚：《基督教早期在华传教史》，台湾商务印书馆1985年版，第203页。","w":"normal","e":["原书正文"]},{"t":"【原文】222 对外汉语教学入门","y":"教材原文","p":["222 对外汉语教学入门 (第三版)汉语在西方的传播，境外汉语教师也做了不少工作","当时，耶稣会将一些中国信徒带往欧洲培养","这些信徒在西方主要学习神学和西方哲学、语文等，其中一些人同时进行中国文化传播和中文教学","沈福宗1680年到欧洲，在法国、英国等国居住过，并在当地教授汉语，传播中华文化"],"q":"222 对外汉语教学入门 (第三版)汉语在西方的传播，境外汉语教师也做了不少工作。当时，耶稣会将一些中国信徒带往欧洲培养。这些信徒在西方主要学习神学和西方哲学、语文等，其中一些人同时进行中国文化传播和中文教学。沈福宗1680年到欧洲，在法国、英国等国居住过，并在当地教授汉语，传播中华文化。黄嘉略1702年到欧洲，后来在法国编写了《汉语语法》和《汉语词典》(未","w":"normal","e":["原书正文"]},{"t":"【原文】此外，汉语教学在欧洲和美","y":"教材原文","p":["此外，汉语教学在欧洲和美国也开始进入正规学校体系","1742年，法国皇家学院开始正式教授汉语","1833年，德国洪堡大学开设汉语课","1871年，美国耶鲁大学开始教授汉语"],"q":"此外，汉语教学在欧洲和美国也开始进入正规学校体系。1742年，法国皇家学院开始正式教授汉语。1833年，德国洪堡大学开设汉语课。1871年，美国耶鲁大学开始教授汉语。","w":"normal","e":["原书正文"]},{"t":"【原文】三、汉语在西方的传播小结","y":"教材原文","p":["三、汉语在西方的传播小结综合可见，明清时期西方传教士为汉语在西方传播做出的贡献主要表现在五个方面："],"q":"三、汉语在西方的传播小结综合可见，明清时期西方传教士为汉语在西方传播做出的贡献主要表现在五个方面：","w":"normal","e":["原书正文"]},{"t":"【原文】第一，利玛窦等人在学习汉","y":"教材原文","p":["第一，利玛窦等人在学习汉语的过程中，创造了在汉字旁加注罗马字母拼音的方法，以便使自己看到拼音就能正确读出字音，从而为欧洲人正确认读汉字和学习汉语提供了便利","此外，随着罗马字母拼音方案的创制与不断完善，汉语开始了拉丁化进程","传教士的这些工作不但推动了中国音韵学的发展，也对现行的《汉语拼音方案》产生了巨大影响"],"q":"第一，利玛窦等人在学习汉语的过程中，创造了在汉字旁加注罗马字母拼音的方法，以便使自己看到拼音就能正确读出字音，从而为欧洲人正确认读汉字和学习汉语提供了便利。此外，随着罗马字母拼音方案的创制与不断完善，汉语开始了拉丁化进程。传教士的这些工作不但推动了中国音韵学的发展，也对现行的《汉语拼音方案》产生了巨大影响。","w":"normal","e":["原书正文"]},{"t":"【原文】第二，西方传教士编著中西","y":"教材原文","p":["第二，西方传教士编著中西字典等汉语学习材料，为欧洲人学习汉语提供了得力工具"],"q":"第二，西方传教士编著中西字典等汉语学习材料，为欧洲人学习汉语提供了得力工具。","w":"normal","e":["原书正文"]},{"t":"【原文】第三，在《马氏文通》诞生","y":"教材原文","p":["第三，在《马氏文通》诞生之前，西方汉语语法研究已经有了近200年的历史","西方传教士以拉丁语法体系为参照，对汉语语法进行系统描写","这些既有西方语言学理论支撑又重视汉语特性的语法研究成果为中国现代语法学奠定了基础"],"q":"第三，在《马氏文通》诞生之前，西方汉语语法研究已经有了近200年的历史。西方传教士以拉丁语法体系为参照，对汉语语法进行系统描写。这些既有西方语言学理论支撑又重视汉语特性的语法研究成果为中国现代语法学奠定了基础。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c09-s02","t":"第二节 语音教学的原则","w":"normal","n":8,"k":[{"t":"【原文】[5] 董明. 古代汉语","y":"教材原文","p":["[5] 董明. 古代汉语汉字对外传播史 [M].北京：中国大百科全书出版社，2002.[6] 郭熙. 华文教学概论 [M].北京: 商务印书馆, 2007."],"q":"[5] 董明. 古代汉语汉字对外传播史 [M].北京：中国大百科全书出版社，2002.[6] 郭熙. 华文教学概论 [M].北京: 商务印书馆, 2007.","w":"normal","e":["原书正文"]},{"t":"【原文】[7] 金基石，韩国李朝","y":"教材原文","p":["[7] 金基石，韩国李朝时期的汉语教育及其特点 [J].汉语学习，2005 (5).[8] 卡萨齐·莎丽达, 汉语流传欧洲史 [M].上海: 学林出版社, 2011."],"q":"[7] 金基石，韩国李朝时期的汉语教育及其特点 [J].汉语学习，2005 (5).[8] 卡萨齐·莎丽达, 汉语流传欧洲史 [M].上海: 学林出版社, 2011.","w":"normal","e":["原书正文"]},{"t":"【原文】[9] 李无未. 日本明","y":"教材原文","p":["[9] 李无未. 日本明治时期北京官话教科书研究的基本问题 [J].吉林师范大学学报：人文社会科学版, 2007 (1)."],"q":"[9] 李无未. 日本明治时期北京官话教科书研究的基本问题 [J].吉林师范大学学报：人文社会科学版, 2007 (1).","w":"normal","e":["原书正文"]},{"t":"【原文】[10] 李亚楠，周小兵","y":"教材原文","p":["[10] 李亚楠，周小兵. 汉语拼音方案的产生、发展与对外汉语教学 [J].云南师范大学学报：对外汉语教学与研究版, 2015 (6)."],"q":"[10] 李亚楠，周小兵. 汉语拼音方案的产生、发展与对外汉语教学 [J].云南师范大学学报：对外汉语教学与研究版, 2015 (6).","w":"normal","e":["原书正文"]},{"t":"【原文】[11] 李宇明. 重视","y":"教材原文","p":["[11] 李宇明. 重视汉语国际传播的历史研究 [J].云南师范大学学报：对外汉语教学与研究版，2007 (5).[12] 林明华. 汉语与越南语言文化(上) [J]. 现代外语, 1997 (1)."],"q":"[11] 李宇明. 重视汉语国际传播的历史研究 [J].云南师范大学学报：对外汉语教学与研究版，2007 (5).[12] 林明华. 汉语与越南语言文化(上) [J]. 现代外语, 1997 (1).","w":"normal","e":["原书正文"]},{"t":"【原文】[13] 鲁健骥, 谈对","y":"教材原文","p":["[13] 鲁健骥, 谈对外汉语教学历史的研究 [J],语言文字应用, 1998 (4).[14] 吕必松. 对外汉语教学发展概要 [M].北京：北京语言学院出版社，1990."],"q":"[13] 鲁健骥, 谈对外汉语教学历史的研究 [J],语言文字应用, 1998 (4).[14] 吕必松. 对外汉语教学发展概要 [M].北京：北京语言学院出版社，1990.","w":"normal","e":["原书正文"]},{"t":"【原文】[15] 朴京淑. 试论","y":"教材原文","p":["[15] 朴京淑. 试论韩国朝鲜时代的汉语教学 [D].北京：北京语言文化大学，2000.[16] 沈国威. 近代英华华英辞典解题 [M].大阪：关西大学出版社，2011."],"q":"[15] 朴京淑. 试论韩国朝鲜时代的汉语教学 [D].北京：北京语言文化大学，2000.[16] 沈国威. 近代英华华英辞典解题 [M].大阪：关西大学出版社，2011.","w":"normal","e":["原书正文"]},{"t":"【原文】[17] 史红宇. 从教","y":"教材原文","p":["[17] 史红宇. 从教材看历史上来华外国 (族) 人的汉语教学 [D].北京：北京语言文化大学, 2002.[18] 王顺洪，六角恒广的日本近代汉语教育史研究 [J].汉语学习，1999 (4)."],"q":"[17] 史红宇. 从教材看历史上来华外国 (族) 人的汉语教学 [D].北京：北京语言文化大学, 2002.[18] 王顺洪，六角恒广的日本近代汉语教育史研究 [J].汉语学习，1999 (4).","w":"normal","e":["原书正文"]}]},{"id":"rumen-c09-s03","t":"第三节 语音教学方法与技巧","w":"normal","n":8,"k":[{"t":"【原文】(一) 技能训练为此目标","y":"教材原文","p":["(一) 技能训练为此目标进行的教学，主要让学生模仿好发音","如果学生能将学到的音记住，在听到这些音时可以准确辨认，能按照要求准确发音，将实际发音跟汉语拼音准确对应，就基本达到要求了","尽管许多教材列出了39个韵母、21个辅音声母的发音部位和发音方法，但一般的教学无须讲解这些知识","这是因为：第一，这些知识对留学生掌握汉语语"],"q":"(一) 技能训练为此目标进行的教学，主要让学生模仿好发音。如果学生能将学到的音记住，在听到这些音时可以准确辨认，能按照要求准确发音，将实际发音跟汉语拼音准确对应，就基本达到要求了。尽管许多教材列出了39个韵母、21个辅音声母的发音部位和发音方法，但一般的教学无须讲解这些知识。这是因为：第一，这些知识对留学生掌握汉语语","w":"normal","e":["原书正文"]},{"t":"【原文】音一般没有多大帮助","y":"教材原文","p":["音一般没有多大帮助","第二，对绝大多数初学汉语的学生来说，讲解这些知识难度太大"],"q":"音一般没有多大帮助； 第二，对绝大多数初学汉语的学生来说，讲解这些知识难度太大。","w":"normal","e":["原书正文"]},{"t":"【原文】(二) 教授汉语这一目标","y":"教材原文","p":["(二) 教授汉语这一目标主要是培养汉语作为第二语言的教师","《国际汉语教师标准》(国家汉办，2007，以下简称《教师标准》)，对汉语教师教授语音所应具备的基本能力做了一系列明确规定，其中要求教师要“熟悉并掌握汉语语音的基本特点和知识，了解并准确运用描写汉语语音系统的概念、术语等”，同时要“熟悉主要语种和学习者学习汉语语音时的发音问题，并能提出有效的解决方案”","具体来说，教师需要掌握的语音知识，应包括第一节里讲的有关语音的物理、生理、社会属性，语音单位和相关因素 (音节、元音、辅音、声母、韵母、声调、音位)，每一个元音辅音、声母韵母的发音部位和发音方法，等等","同时，还要对学生母语的语音知识有所了解，尤其要掌握学生母语跟汉语的语音对比知识，了解学习汉语语音的难点，掌握作为第二语言的汉语语音教学方法和教学技巧"],"q":"(二) 教授汉语这一目标主要是培养汉语作为第二语言的教师。《国际汉语教师标准》(国家汉办，2007，以下简称《教师标准》)，对汉语教师教授语音所应具备的基本能力做了一系列明确规定，其中要求教师要“熟悉并掌握汉语语音的基本特点和知识，了解并准确运用描写汉语语音系统的概念、术语等”，同时要“熟悉主要语种和学习者学习汉语语音时的发音问题，并能提出有效的解决方案”。","w":"normal","e":["原书正文"]},{"t":"【原文】此目标的语音教学，适用于","y":"教材原文","p":["此目标的语音教学，适用于汉语言本科专业高年级学生，对外汉语专业的本科生，汉语国际教育专业硕士生，对外汉语教学方向的硕士生、博士生"],"q":"此目标的语音教学，适用于汉语言本科专业高年级学生，对外汉语专业的本科生，汉语国际教育专业硕士生，对外汉语教学方向的硕士生、博士生。","w":"normal","e":["原书正文"]},{"t":"【原文】(三) 研究汉语此目标是","y":"教材原文","p":["(三) 研究汉语此目标是让学习者能从事汉语语音研究","要求在前两点的基础上，进行更多的学习和训练，内容包括发现课题、搜集材料 (尤其是各种语料)、运用各种研究方法和研究手段分析解决问题等","对汉语言文字学专业以及语言学及应用语言学专业对外汉语教学方向的硕士生、博士生的教学，都是属于这一目标的"],"q":"(三) 研究汉语此目标是让学习者能从事汉语语音研究。要求在前两点的基础上，进行更多的学习和训练，内容包括发现课题、搜集材料 (尤其是各种语料)、运用各种研究方法和研究手段分析解决问题等。对汉语言文字学专业以及语言学及应用语言学专业对外汉语教学方向的硕士生、博士生的教学，都是属于这一目标的。","w":"normal","e":["原书正文"]},{"t":"【原文】二、汉外对比《教师标准》","y":"教材原文","p":["二、汉外对比《教师标准》指出，应“注重针对不同母语学习者的语音学习难点进行汉语语音教学”","要做到这一点，首先就必须对学生母语语音和汉语语音进行对比","通过对比，摸清学生母语跟目标语的异同，就能够预测不同母语学习者的学习难点，制定有效的解决方案，提高教学效率和质量"],"q":"二、汉外对比《教师标准》指出，应“注重针对不同母语学习者的语音学习难点进行汉语语音教学”。要做到这一点，首先就必须对学生母语语音和汉语语音进行对比。通过对比，摸清学生母语跟目标语的异同，就能够预测不同母语学习者的学习难点，制定有效的解决方案，提高教学效率和质量。","w":"normal","e":["原书正文"]},{"t":"【原文】母语跟目标语的语音对比，","y":"教材原文","p":["母语跟目标语的语音对比，可以从元音、辅音、音节、声调、重音、语调等多方面进行","对比往往需要分成不同的类别进行，即从两种语言中语音项目异同、相似度上分类，并跟学习难度挂钩","对比一般有四类情况"],"q":"母语跟目标语的语音对比，可以从元音、辅音、音节、声调、重音、语调等多方面进行。对比往往需要分成不同的类别进行，即从两种语言中语音项目异同、相似度上分类，并跟学习难度挂钩。对比一般有四类情况。","w":"normal","e":["原书正文"]},{"t":"【原文】(一) 母语有，目的语没","y":"教材原文","p":["(一) 母语有，目的语没有英语长短元音对立，起区别意义的作用","英语有28个辅音，其244 对外汉语教学入门 (第三版)"],"q":"(一) 母语有，目的语没有英语长短元音对立，起区别意义的作用； 汉语普通话没有。英语有28个辅音，其244 对外汉语教学入门 (第三版)","w":"normal","e":["原书正文"]}]}]},{"id":"rumen-c10","t":"第十章 词汇教学","w":"normal","s":[{"id":"rumen-c10-s01","t":"第一节 现代汉语词汇的特点","w":"normal","n":8,"k":[{"t":"【原文】2. 实物演示如用纸片表","y":"教材原文","p":["2. 实物演示如用纸片表现气流的强弱，条件允许的也可以用吹蜡烛或乒乓球的游戏，来让学生体会吐气音和不吐气音的差异"],"q":"2. 实物演示如用纸片表现气流的强弱，条件允许的也可以用吹蜡烛或乒乓球的游戏，来让学生体会吐气音和不吐气音的差异。","w":"normal","e":["原书正文"]},{"t":"【原文】教学中也可以借助牙签找准","y":"教材原文","p":["教学中也可以借助牙签找准发音成阻点","如泰国学生很难发准 sh和x声母，我们将牙签放于第四颗牙之后，舌尖从牙签上面向斜上方伸出，就能准确找到成阻点，发准 sh声母","将牙签放在第二颗牙后， 舌尖在牙签内侧， 舌面前部隆起， 就能较快掌握x 的发音方法, 区分 sh和x(图9.2)"],"q":"教学中也可以借助牙签找准发音成阻点。如泰国学生很难发准 sh和x声母，我们将牙签放于第四颗牙之后，舌尖从牙签上面向斜上方伸出，就能准确找到成阻点，发准 sh声母； 将牙签放在第二颗牙后， 舌尖在牙签内侧， 舌面前部隆起， 就能较快掌握x 的发音方法, 区分 sh和x(图9.2)。","w":"normal","e":["原书正文"]},{"t":"【原文】3. 图表演示如利用声母","y":"教材原文","p":["3. 图表演示如利用声母表讲解声母，利用韵母表讲解韵母，用四声升降图演示声调的升降曲折变化 (图9.3)，用拼音表解释拼音的系统和写法"],"q":"3. 图表演示如利用声母表讲解声母，利用韵母表讲解韵母，用四声升降图演示声调的升降曲折变化 (图9.3)，用拼音表解释拼音的系统和写法。","w":"normal","e":["原书正文"]},{"t":"【原文】4. 板书演示口腔和舌头","y":"教材原文","p":["4. 板书演示口腔和舌头、发音部位和发音方法、声调的升降等都可以用板书表示","板书的特点是机动，随时需要随时写，需要写在哪里就写在哪里，需要如何写就如何写，是一种动态的展示方法"],"q":"4. 板书演示口腔和舌头、发音部位和发音方法、声调的升降等都可以用板书表示。板书的特点是机动，随时需要随时写，需要写在哪里就写在哪里，需要如何写就如何写，是一种动态的展示方法。","w":"normal","e":["原书正文"]},{"t":"【原文】例如，可以将要讲解的声母","y":"教材原文","p":["例如，可以将要讲解的声母依次竖写在黑板上，将韵母依次横写在黑板上","先一个一个地教韵母","再一个一个地教声母","最后在横竖交接处写上相应的音节，进行声韵拼读教学(图9.4)"],"q":"例如，可以将要讲解的声母依次竖写在黑板上，将韵母依次横写在黑板上。先一个一个地教韵母； 再一个一个地教声母； 最后在横竖交接处写上相应的音节，进行声韵拼读教学(图9.4)。","w":"normal","e":["原书正文"]},{"t":"【原文】aoeiuübpmf图9","y":"教材原文","p":["aoeiuübpmf图9.4 声韵拼读教学再如，为了说明a、o、e、i开口度的不同，可以由大到小地依次板书，让学生从字母的大小感受口形的大小 (图9.5)"],"q":"aoeiuübpmf图9.4 声韵拼读教学再如，为了说明a、o、e、i开口度的不同，可以由大到小地依次板书，让学生从字母的大小感受口形的大小 (图9.5)。","w":"normal","e":["原书正文"]},{"t":"【原文】252 对外汉语教学入门","y":"教材原文","p":["252 对外汉语教学入门 (第三版)此外，连读变调，包括第三声的变调， “一”和“不”的变调，都可以用板书演示"],"q":"252 对外汉语教学入门 (第三版)此外，连读变调，包括第三声的变调， “一”和“不”的变调，都可以用板书演示。如：","w":"normal","e":["原书正文"]},{"t":"【原文】nǐhǎo → níhǎ","y":"教材原文","p":["nǐhǎo → níhǎo yīgè→ yígè bùqù→ búqù"],"q":"nǐhǎo → níhǎo yīgè→ yígè bùqù→ búqù","w":"normal","e":["原书正文"]}]},{"id":"rumen-c10-s02","t":"第二节 词汇教学的重要性和任务","w":"normal","n":8,"k":[{"t":"【原文】4. 舌面音(j、q、x","y":"教材原文","p":["4. 舌面音(j、q、x)以泰语学生学习这几个音为例，泰语中没有舌面前音j、q、x，但却有与j、q相似的舌面中音","教学中可以通过双手模拟发音器官，用形象的外在动作演示让学生明白：发普通话的j、q时是舌面前部与硬腭前部接触形成阻碍","泰语中相似的音是发音时舌面中部与硬腭后部接触形成阻碍，只要将舌面与硬腭的接触点往前移，同时不妨把舌尖抵住下齿背就可发出j、q了","当学生掌握了j、q，通过类推也就能够较好地掌握x的发音"],"q":"4. 舌面音(j、q、x)以泰语学生学习这几个音为例，泰语中没有舌面前音j、q、x，但却有与j、q相似的舌面中音。教学中可以通过双手模拟发音器官，用形象的外在动作演示让学生明白：发普通话的j、q时是舌面前部与硬腭前部接触形成阻碍； 泰语中相似的音是发音时舌面中部与硬腭后部接触形成阻碍，只要将舌面与硬腭的接触点往前移，同时不妨把舌尖抵住下齿背就可发出j、q了。","w":"normal","e":["原书正文"]},{"t":"【原文】1. i的教学拼音字母i","y":"教材原文","p":["1. i的教学拼音字母i在普通话中有三个读音","单独成音节时，在b、p、m、d、t、n、1、j、q、x后边是一个音，国际音标为 [i]","在z、c、s后边是另一个音，国际音标为 [1]","在 zh、ch、sh、r后边又是一个音, 国际音标为 [t]"],"q":"1. i的教学拼音字母i在普通话中有三个读音。单独成音节时，在b、p、m、d、t、n、1、j、q、x后边是一个音，国际音标为 [i]；在z、c、s后边是另一个音，国际音标为 [1]；在 zh、ch、sh、r后边又是一个音, 国际音标为 [t]。","w":"normal","e":["原书正文"]},{"t":"【原文】[i] 的发音很容易，几","y":"教材原文","p":["[i] 的发音很容易，几乎在每种语言中都有","[1] [1] 相对难一些","在发z、c、s时声带振动并延长语音，就是 [1] 了","在发 zh、ch、sh、r时声带振动并延长发音，就是 [1] 了"],"q":"[i] 的发音很容易，几乎在每种语言中都有。 [1] [1] 相对难一些。在发z、c、s时声带振动并延长语音，就是 [1] 了。在发 zh、ch、sh、r时声带振动并延长发音，就是 [1] 了。由于这两个音只是分别在z、c、s和 zh、ch、sh、r后边出现, 没有必要单独教。一般的教法都是跟z、c、s和 zh、ch、sh、r一起教，只要这几个声母发准了，声","w":"normal","e":["原书正文"]},{"t":"【原文】2. ü的教学很多语言没","y":"教材原文","p":["2. ü的教学很多语言没有ü，教起来比较困难","较好的办法是用带音法，先教i，然后嘴唇逐第九章 语音教学 259步变圆前突，就可以比较容易地发出ū了"],"q":"2. ü的教学很多语言没有ü，教起来比较困难。较好的办法是用带音法，先教i，然后嘴唇逐第九章 语音教学 259步变圆前突，就可以比较容易地发出ū了。","w":"normal","e":["原书正文"]},{"t":"【原文】(三) 声调汉语声调是多","y":"教材原文","p":["(三) 声调汉语声调是多数国家留学生的学习难点，教学中必须给以最大的重视，使用多种有效的办法","外国学生的主要困难：第二声上不去，第四声下不去，第三声不会拐弯"],"q":"(三) 声调汉语声调是多数国家留学生的学习难点，教学中必须给以最大的重视，使用多种有效的办法。外国学生的主要困难：第二声上不去，第四声下不去，第三声不会拐弯。","w":"normal","e":["原书正文"]},{"t":"【原文】1. 对比法一些学生发第","y":"教材原文","p":["1. 对比法一些学生发第四声时总下不去","吕必松 (1996) 提过一个方法","英语的 Let'sgo","中 go很像汉语第四声的发音"],"q":"1. 对比法一些学生发第四声时总下不去。吕必松 (1996) 提过一个方法。英语的 Let'sgo！中 go很像汉语第四声的发音。对英语国家或懂英语的学生，可以先让他们对比上句中的 go来发音。","w":"normal","e":["原书正文"]},{"t":"【原文】2. 第三声使用模仿法，","y":"教材原文","p":["2. 第三声使用模仿法，还可以用演示法等解释","对个别模仿不好的，可以解释声带由紧到松、再由松到紧的过程"],"q":"2. 第三声使用模仿法，还可以用演示法等解释。对个别模仿不好的，可以解释声带由紧到松、再由松到紧的过程。","w":"normal","e":["原书正文"]},{"t":"【原文】根据现在的研究成果，第三","y":"教材原文","p":["根据现在的研究成果，第三声并不是214，而是接近211或212","按214调值教学也会诱发偏误，就是后半部升得太高，跟第二声相似","从区别性特征来看，第三声也是212 比较合理","因此，教第三声最好按212的调值来教，并通过对比法凸显"],"q":"根据现在的研究成果，第三声并不是214，而是接近211或212。按214调值教学也会诱发偏误，就是后半部升得太高，跟第二声相似。从区别性特征来看，第三声也是212 比较合理。因此，教第三声最好按212的调值来教，并通过对比法凸显。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c10-s03","t":"第三节 教学词汇的选择和控制","w":"normal","n":8,"k":[{"t":"【原文】从“对词的识别和理解”到","y":"教材原文","p":["从“对词的识别和理解”到“对词的使用(说和写)”，就是一个词汇知识不断发展的过程","接受性知识一般在产出性知识之前获得","一个人能掌握的产出性词汇知识只是所学词汇中很少的一部分","即使母语者，对一些低频词也不一定会说会写，只是可以听懂、看懂而已"],"q":"从“对词的识别和理解”到“对词的使用(说和写)”，就是一个词汇知识不断发展的过程。接受性知识一般在产出性知识之前获得。一个人能掌握的产出性词汇知识只是所学词汇中很少的一部分。即使母语者，对一些低频词也不一定会说会写，只是可以听懂、看懂而已。","w":"normal","e":["原书正文"]},{"t":"【原文】词汇教学中，词语可以分为","y":"教材原文","p":["词汇教学中，词语可以分为复用式和领会式","复用式词语也称复用式掌握词语，要求听、说、读、写“四会”，即不仅要理解，还要能运用","领会式词语是指只要求达到领会式掌握的词语，即指听、说、读“三会”，听、读“二会”或听“一会”的词语","《新汉语水平考试大纲 HSK 六级》要求考生掌握的词汇量为5000个及以上"],"q":"词汇教学中，词语可以分为复用式和领会式。复用式词语也称复用式掌握词语，要求听、说、读、写“四会”，即不仅要理解，还要能运用； 领会式词语是指只要求达到领会式掌握的词语，即指听、说、读“三会”，听、读“二会”或听“一会”的词语。《新汉语水平考试大纲 HSK 六级》要求考生掌握的词汇量为5000个及以上。显然，这些词语对于不同语言水平或不同学习阶段的学习者来说，","w":"normal","e":["原书正文"]},{"t":"【原文】词汇教学的任务，就是帮助","y":"教材原文","p":["词汇教学的任务，就是帮助二语者掌握一定数量的复用式词语和一定数量的领会式词语，同时努力缩小这两类词汇量的差距，促使学生从理解词汇逐渐发展到能正确运用词汇","教学中应分轻重主次","对复用式词语应精讲多练，对领会式词语则可少花力气"],"q":"词汇教学的任务，就是帮助二语者掌握一定数量的复用式词语和一定数量的领会式词语，同时努力缩小这两类词汇量的差距，促使学生从理解词汇逐渐发展到能正确运用词汇。教学中应分轻重主次。对复用式词语应精讲多练，对领会式词语则可少花力气。","w":"normal","e":["原书正文"]},{"t":"【原文】由于课堂教学时间有限，学","y":"教材原文","p":["由于课堂教学时间有限，学生不能仅靠教师在课堂上的讲解和训练来学习词汇","教师要注意指导学生掌握多种词汇学习策略，培养其自学汉语词汇的能力"],"q":"由于课堂教学时间有限，学生不能仅靠教师在课堂上的讲解和训练来学习词汇。教师要注意指导学生掌握多种词汇学习策略，培养其自学汉语词汇的能力。","w":"normal","e":["原书正文"]},{"t":"【原文】一节课、一课书、一个星期","y":"教材原文","p":["一节课、一课书、一个星期或一个学期应该教多少词汇? 学生可以学到多少词汇?这就是词汇选择和控制要解决的问题","词汇选择需要考虑教学大纲、教材、学生水平和特点、二语学习规律等方面的因素","只有综合考察，词汇选取才可能科学，才能使词汇学习合理、科学、顺利地进行"],"q":"一节课、一课书、一个星期或一个学期应该教多少词汇? 学生可以学到多少词汇?这就是词汇选择和控制要解决的问题。词汇选择需要考虑教学大纲、教材、学生水平和特点、二语学习规律等方面的因素。只有综合考察，词汇选取才可能科学，才能使词汇学习合理、科学、顺利地进行。","w":"normal","e":["原书正文"]},{"t":"【原文】词汇选择与控制主要包括五","y":"教材原文","p":["词汇选择与控制主要包括五个方面：目标词的选取，词汇量的控制，词汇等级的控制，词汇重现率的控制，领会式词语和复用式词语的确定"],"q":"词汇选择与控制主要包括五个方面：目标词的选取，词汇量的控制，词汇等级的控制，词汇重现率的控制，领会式词语和复用式词语的确定。","w":"normal","e":["原书正文"]},{"t":"【原文】如何实现词汇的选择和控制","y":"教材原文","p":["如何实现词汇的选择和控制? 第一通过教材","教材是教学的主要依据","教材编写者要有词汇控制的意识，要参考教学大纲对语料进行认真处理，使词汇的数量、等级符合大纲要求","教师在实施教学时，首先要明确教哪些词，不教哪些词"],"q":"如何实现词汇的选择和控制? 第一通过教材。教材是教学的主要依据。教材编写者要有词汇控制的意识，要参考教学大纲对语料进行认真处理，使词汇的数量、等级符合大纲要求。第二通过教师。教师在实施教学时，首先要明确教哪些词，不教哪些词； 要注意区分复用式词语和领会式词语，可以体现在练习方式和具体要求上。其次要在生词解释、课文讲解、课堂提问、课堂用语等方面使用学生已学词语","w":"normal","e":["原书正文"]},{"t":"【原文】266|对外汉语教学入门","y":"教材原文","p":["266|对外汉语教学入门(第三版)一、目标词选取及依据一种语言的词汇数量相当大，二语学习者不可能也不必全部掌握","根据教学大纲和学生水平，选取合适的目标词，是词汇教学首先必须解决的问题"],"q":"266|对外汉语教学入门(第三版)一、目标词选取及依据一种语言的词汇数量相当大，二语学习者不可能也不必全部掌握。根据教学大纲和学生水平，选取合适的目标词，是词汇教学首先必须解决的问题。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c10-s04","t":"第四节 词汇教学的重点与难点","w":"normal","n":8,"k":[{"t":"【原文】(5) “不”还可以用在","y":"教材原文","p":["(5) “不”还可以用在“是、像、等于、属于、知道”等动词之前"],"q":"(5) “不”还可以用在“是、像、等于、属于、知道”等动词之前； “没”不能。如：","w":"normal","e":["原书正文"]},{"t":"【原文】不是 不像 不等于 不属","y":"教材原文","p":["不是 不像 不等于 不属于 不知道 (没×) /不能 不能够 不敢 (没✔)其中前三点是主要差异，要抓住这三点讲练","后两点可以先不讲练，出现偏误后再讲解"],"q":"不是 不像 不等于 不属于 不知道 (没×) /不能 不能够 不敢 (没✔)其中前三点是主要差异，要抓住这三点讲练； 后两点可以先不讲练，出现偏误后再讲解。","w":"normal","e":["原书正文"]},{"t":"【原文】二、多义词多义词是具有两","y":"教材原文","p":["二、多义词多义词是具有两个或两个以上不同义项、各个义项间存在一定联系的词","汉语中有不少基本的、常用的词，都是多义词，如“看、开、乱、要、做、想、吃、漂亮”等","不少多义词还兼属不同词类，表示不同的意义，如“遗憾”既是形容词 (非常遗憾)又是名词(终生的遗憾)，“难怪”既是动词 (这也难怪) 又是副词 (难怪他今天不高兴)"],"q":"二、多义词多义词是具有两个或两个以上不同义项、各个义项间存在一定联系的词。汉语中有不少基本的、常用的词，都是多义词，如“看、开、乱、要、做、想、吃、漂亮”等；不少多义词还兼属不同词类，表示不同的意义，如“遗憾”既是形容词 (非常遗憾)又是名词(终生的遗憾)，“难怪”既是动词 (这也难怪) 又是副词 (难怪他今天不高兴)。","w":"normal","e":["原书正文"]},{"t":"【原文】多义词也是教学的重点和难","y":"教材原文","p":["多义词也是教学的重点和难点，教学中应当用举例法和归纳法重点讲练","以“看”为例，当学习表示“观察并加以判断”的“看”( 你看今天会不会下雨?)时，教师可以引导学生说出带有“看”的短语或句子，教师再将包含有“看”的不同义项的短语或句子板书下来，组织学生分析归纳例子中“看”的意思"],"q":"多义词也是教学的重点和难点，教学中应当用举例法和归纳法重点讲练。以“看”为例，当学习表示“观察并加以判断”的“看”( 你看今天会不会下雨?)时，教师可以引导学生说出带有“看”的短语或句子，教师再将包含有“看”的不同义项的短语或句子板书下来，组织学生分析归纳例子中“看”的意思。如：","w":"normal","e":["原书正文"]},{"t":"【原文】看书 看电影 看我的眼睛","y":"教材原文","p":["看书 看电影 看我的眼睛 看清楚(使视线接触人或物)看病 看医生 看外科(诊治)看朋友 看病人 看了他三次 (看望)想想看 试试看 找找看 (用在重叠式动词后，表示试一试)"],"q":"看书 看电影 看我的眼睛 看清楚(使视线接触人或物)看病 看医生 看外科(诊治)看朋友 看病人 看了他三次 (看望)想想看 试试看 找找看 (用在重叠式动词后，表示试一试)","w":"normal","e":["原书正文"]},{"t":"【原文】在复习归纳已学过的“看”","y":"教材原文","p":["在复习归纳已学过的“看”的义项和用法之后，教师再结合课文中的例句讲练“看”的新义项","再如中级词汇“勉强”，其义项和用法有以下五种："],"q":"在复习归纳已学过的“看”的义项和用法之后，教师再结合课文中的例句讲练“看”的新义项。再如中级词汇“勉强”，其义项和用法有以下五种：","w":"normal","e":["原书正文"]},{"t":"【原文】(2) 形容词，不是心甘","y":"教材原文","p":["(2) 形容词，不是心甘情愿的，做补语、状语"],"q":"(2) 形容词，不是心甘情愿的，做补语、状语。如：","w":"normal","e":["原书正文"]},{"t":"【原文】他笑得很勉强，因为他心里","y":"教材原文","p":["他笑得很勉强，因为他心里并不高兴","/妈妈勉强同意了"],"q":"他笑得很勉强，因为他心里并不高兴。/妈妈勉强同意了。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c10-s05","t":"第五节 词汇教学的基本原则","w":"normal","n":8,"k":[{"t":"【原文】1. 按构字部件排列一般","y":"教材原文","p":["1. 按构字部件排列一般适用于初级阶段的生词教学","如某篇课文教授“你家有几口人”，生词表中出现了“爷爷、奶奶、爸爸、妈妈、哥哥、弟弟、姐姐、妹妹”等表示亲属称谓的词语，一般的教学可以根据辈分等进行义类方面的教学","也可以根据汉字的偏旁将它们归类展示，让学生注意性别差异在字形上的反映"],"q":"1. 按构字部件排列一般适用于初级阶段的生词教学。如某篇课文教授“你家有几口人”，生词表中出现了“爷爷、奶奶、爸爸、妈妈、哥哥、弟弟、姐姐、妹妹”等表示亲属称谓的词语，一般的教学可以根据辈分等进行义类方面的教学； 也可以根据汉字的偏旁将它们归类展示，让学生注意性别差异在字形上的反映。","w":"normal","e":["原书正文"]},{"t":"【原文】一课书中，有着相同部件的","y":"教材原文","p":["一课书中，有着相同部件的生词并不多，教师要有部件意识，善于抓住生词在部件上的相同点进行教学","例如，某课书的生词表中有“推、扔”两个动词，教师可以充分利用形旁表意的功能，将它们排列在一起进行展示，引导学生明白这类词语多用来表示跟手有关系的动作，并回忆之前学过的“搬、摆”，然后再扩展出“拉、扶”等有联系的新词"],"q":"一课书中，有着相同部件的生词并不多，教师要有部件意识，善于抓住生词在部件上的相同点进行教学。例如，某课书的生词表中有“推、扔”两个动词，教师可以充分利用形旁表意的功能，将它们排列在一起进行展示，引导学生明白这类词语多用来表示跟手有关系的动作，并回忆之前学过的“搬、摆”，然后再扩展出“拉、扶”等有联系的新词。","w":"normal","e":["原书正文"]},{"t":"【原文】2. 按词类排列这种排列","y":"教材原文","p":["2. 按词类排列这种排列是根据不同词性来将课文中的生词归类排列，便于根据不同的词性特点进行词语搭配和应用","例如，动词 (v.)后加宾语，如“打扫房间”","名词 (n.)前加修饰语、加数量词，如“好学生、一本书”","形容词 (a.)前可以加副词，如“非常漂亮、不好看”"],"q":"2. 按词类排列这种排列是根据不同词性来将课文中的生词归类排列，便于根据不同的词性特点进行词语搭配和应用。例如，动词 (v.)后加宾语，如“打扫房间”； 名词 (n.)前加修饰语、加数量词，如“好学生、一本书”； 形容词 (a.)前可以加副词，如“非常漂亮、不好看”； 副词(adv. )后加动词或形容词，如“马上走、多么愉快”； 等等。这","w":"normal","e":["原书正文"]},{"t":"【原文】样排列有利于学生建立和巩","y":"教材原文","p":["样排列有利于学生建立和巩固对汉语词类的观念，有利于从组合搭配的角度学习词语"],"q":"样排列有利于学生建立和巩固对汉语词类的观念，有利于从组合搭配的角度学习词语。","w":"normal","e":["原书正文"]},{"t":"【原文】如《初级汉语精读教程Ⅰ》","y":"教材原文","p":["如《初级汉语精读教程Ⅰ》第三十一课《苹果便宜了》有16个生词，其中名词5个，代词1个，形容词5个，动词2个，兼类词1个，量词1个，词组1个","逐个或分组板书如下 (以上各词左上角的数字为课本上生词的序号)："],"q":"如《初级汉语精读教程Ⅰ》第三十一课《苹果便宜了》有16个生词，其中名词5个，代词1个，形容词5个，动词2个，兼类词1个，量词1个，词组1个。逐个或分组板书如下 (以上各词左上角的数字为课本上生词的序号)：","w":"normal","e":["原书正文"]},{"t":"【原文】n. ³高中 ¹¹学院⁴","y":"教材原文","p":["n. ³高中 ¹¹学院⁴操场 ⁷市场 ¹⁰消息phrase ¹⁶笔记本电脑v. ²¹需要 ¹⁴通过n./v. ¹³面试pron. ①那么"],"q":"n. ³高中 ¹¹学院⁴操场 ⁷市场 ¹⁰消息phrase ¹⁶笔记本电脑v. ²¹需要 ¹⁴通过n./v. ¹³面试pron. ①那么","w":"normal","e":["原书正文"]},{"t":"【原文】mea. 15节按词类排","y":"教材原文","p":["mea. 15节按词类排列，整齐醒目，易于记忆，也利于讲解、复习各类词的有关特点"],"q":"mea. 15节按词类排列，整齐醒目，易于记忆，也利于讲解、复习各类词的有关特点。","w":"normal","e":["原书正文"]},{"t":"【原文】名词：第一行名词都可加量","y":"教材原文","p":["名词：第一行名词都可加量词“所”，如“一所高中、一所学院”，常跟别的词组成短语使用，如“高中生、外语学院、汉语学院”","第二行名词常加数量词或修饰词语，如“一个操场、大操场/那个市场、菜市场、水果市场/一条消息、好消息”"],"q":"名词：第一行名词都可加量词“所”，如“一所高中、一所学院”，常跟别的词组成短语使用，如“高中生、外语学院、汉语学院”； 第二行名词常加数量词或修饰词语，如“一个操场、大操场/那个市场、菜市场、水果市场/一条消息、好消息”。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c10-s06","t":"第六节 词汇教学的环节和技巧","w":"normal","n":8,"k":[{"t":"【原文】初级汉语用翻译法可以帮助","y":"教材原文","p":["初级汉语用翻译法可以帮助学习者很快理解词语意义","但是不同语言的词语之间很难简单地一一对应，它们在语义范围、搭配关系、感情色彩、文化含义等方面存在着许多差异，单纯用翻译法解释可能会引起误解，诱发偏误","例如“下雪”的英文翻译为"],"q":"初级汉语用翻译法可以帮助学习者很快理解词语意义。但是不同语言的词语之间很难简单地一一对应，它们在语义范围、搭配关系、感情色彩、文化含义等方面存在着许多差异，单纯用翻译法解释可能会引起误解，诱发偏误。例如“下雪”的英文翻译为","w":"normal","e":["原书正文"]},{"t":"【原文】284 对外汉语教学入门","y":"教材原文","p":["284 对外汉语教学入门(第三版)snow， 但 snow在英语中既是动词“下雪”， 也是名词“雪”， 学习者很可能会说出“*这里有下雪”","再如“开”在英语中的对应词是 open，学生就会将英语 open 的搭配关系用到汉语中来，说出“*请开你的书/*开你的嘴”等病句","因此，使用翻译法进行教学时，要提醒学生汉语词语与外语对应词语在多方面的不同，以防止负迁移发生"],"q":"284 对外汉语教学入门(第三版)snow， 但 snow在英语中既是动词“下雪”， 也是名词“雪”， 学习者很可能会说出“*这里有下雪”。再如“开”在英语中的对应词是 open，学生就会将英语 open 的搭配关系用到汉语中来，说出“*请开你的书/*开你的嘴”等病句。因此，使用翻译法进行教学时，要提醒学生汉语词语与外语对应词语在多方面的不同，以防止负迁移发","w":"normal","e":["原书正文"]},{"t":"【原文】翻译法使用要有度","y":"教材原文","p":["翻译法使用要有度","当学生母语不相同时，只用某一种外语解释，效果未必好"],"q":"翻译法使用要有度。当学生母语不相同时，只用某一种外语解释，效果未必好。","w":"normal","e":["原书正文"]},{"t":"【原文】11. 利用图形、符号如","y":"教材原文","p":["11. 利用图形、符号如解释“公里、平方、面积”等生词时，就可以先用翻译法对译，然后利用符号公式或图形、图画帮助学生理解词义："],"q":"11. 利用图形、符号如解释“公里、平方、面积”等生词时，就可以先用翻译法对译，然后利用符号公式或图形、图画帮助学生理解词义：","w":"normal","e":["原书正文"]},{"t":"【原文】(3) 面积：2公里×2","y":"教材原文","p":["(3) 面积：2公里×2公里=4平方公里 (在黑板上画出平面图)"],"q":"(3) 面积：2公里×2公里=4平方公里 (在黑板上画出平面图)。","w":"normal","e":["原书正文"]},{"t":"【原文】生成句子：这个教室的面积","y":"教材原文","p":["生成句子：这个教室的面积是25平方米","中国的国土面积是960万平方公里"],"q":"生成句子：这个教室的面积是25平方米。中国的国土面积是960万平方公里。","w":"normal","e":["原书正文"]},{"t":"【原文】难点：km²的读法，先读","y":"教材原文","p":["难点：km²的读法，先读平方，再读公里→类推教一些意义抽象的连词、介词时，适合用符号公式","例如，词典对连词“与其”的释义是“比较两件事而决定取舍的时候， ‘与其’用在放弃的一面”，如果这样教给学生，学生难以明白，不妨告诉学生“与其”常用于“与其A⋯⋯不如B”的句子中，并展示以下公式："],"q":"难点：km²的读法，先读平方，再读公里→类推教一些意义抽象的连词、介词时，适合用符号公式。例如，词典对连词“与其”的释义是“比较两件事而决定取舍的时候， ‘与其’用在放弃的一面”，如果这样教给学生，学生难以明白，不妨告诉学生“与其”常用于“与其A⋯⋯不如B”的句子中，并展示以下公式：","w":"normal","e":["原书正文"]},{"t":"【原文】与其A，不如B=B比A更","y":"教材原文","p":["与其A，不如B=B比A更合适，选择B (A、B=表示行为的句子或动词短语)(二) 讲解词语的用法二语学习，必须理解词义，掌握用法","词语的用法，指词语的语法特征与使用条件，如词性、句子成分、能否重叠以及词语的组合搭配、词在句中的位置、适用对象和适用句式等","这些内容，不像词义那样容易在词典上查到","有的词典没有解释，有的词典解释不清"],"q":"与其A，不如B=B比A更合适，选择B (A、B=表示行为的句子或动词短语)(二) 讲解词语的用法二语学习，必须理解词义，掌握用法。词语的用法，指词语的语法特征与使用条件，如词性、句子成分、能否重叠以及词语的组合搭配、词在句中的位置、适用对象和适用句式等。这些内容，不像词义那样容易在词典上查到。有的词典没有解释，有的词典解释不清。学生不明白用法，就不会使用； ","w":"normal","e":["原书正文"]}]}]},{"id":"rumen-c11","t":"第十一章 语法教学","w":"normal","s":[{"id":"rumen-c11-s01","t":"第一节 语法的含义和类别","w":"normal","n":8,"k":[{"t":"【原文】10. 在初级阶段的教学","y":"教材原文","p":["10. 在初级阶段的教学中，以下词语可以采用哪些方法来讲解词义?同屋 寒假 花园 歌星 微笑 睡觉 打开 出去 还是 忽然 精彩 勤快散步 洗澡 咖啡 危险"],"q":"10. 在初级阶段的教学中，以下词语可以采用哪些方法来讲解词义?同屋 寒假 花园 歌星 微笑 睡觉 打开 出去 还是 忽然 精彩 勤快散步 洗澡 咖啡 危险","w":"normal","e":["原书正文"]},{"t":"【原文】 "w":"normal","e":["原书正文"]},{"t":"【原文】个性是：修饰语汉语都在中","y":"教材原文","p":["个性是：修饰语汉语都在中心词前面，越南语都在中心词后边，英语则有前有后","共性是：表示性别的修饰语离中心词最近，表示年龄的离中心词稍远，表示小部门的更远，表示大部门的最远"],"q":"个性是：修饰语汉语都在中心词前面，越南语都在中心词后边，英语则有前有后。共性是：表示性别的修饰语离中心词最近，表示年龄的离中心词稍远，表示小部门的更远，表示大部门的最远。","w":"normal","e":["原书正文"]},{"t":"【原文】(7) 注重习得研究","y":"教材原文","p":["(7) 注重习得研究","孙德坤 (1993) 的个案调查发现，学习者先习得“了₂”，两周后习得“了,”, 此后出现混用","邓守信(Shou-hsin Teng, 1999) 的语料库研究显示,英语母语者先习得“了₂”，在习得相当数量的动作动词和过去时间词后才习得“了","他据此提出了教学建议"],"q":"(7) 注重习得研究。孙德坤 (1993) 的个案调查发现，学习者先习得“了₂”，两周后习得“了,”, 此后出现混用。邓守信(Shou-hsin Teng, 1999) 的语料库研究显示,英语母语者先习得“了₂”，在习得相当数量的动作动词和过去时间词后才习得“了；”；他据此提出了教学建议。","w":"normal","e":["原书正文"]},{"t":"【原文】(8) 使用统计方法和实","y":"教材原文","p":["(8) 使用统计方法和实验方法","一般语法书常说，双音节形容词可以AABB形式重叠，结果不少学生造出“*长得美美丽丽/*特特别别的衣服”这样的偏误","据初步统计，约60%的双音节形容词不能这样重叠"],"q":"(8) 使用统计方法和实验方法。一般语法书常说，双音节形容词可以AABB形式重叠，结果不少学生造出“*长得美美丽丽/*特特别别的衣服”这样的偏误。据初步统计，约60%的双音节形容词不能这样重叠。","w":"normal","e":["原书正文"]},{"t":"【原文】(三) 描写语法和解释语","y":"教材原文","p":["(三) 描写语法和解释语法描写语法，从特定角度用特定方法对语言结构进行描写","被描写的内容是说本族语者实际遵循的规则","描写的目的是建立某种理论","如结构语法，主要任务是细致描写某一种语言的结构规则"],"q":"(三) 描写语法和解释语法描写语法，从特定角度用特定方法对语言结构进行描写。被描写的内容是说本族语者实际遵循的规则。描写的目的是建立某种理论。如结构语法，主要任务是细致描写某一种语言的结构规则。至于这些结构为什么产生，并不是它研究的任务。描写语法是所有语法的基础。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c11-s03","t":"第三节 语法教学的原则","w":"normal","n":8,"k":[{"t":"【原文】a. 学生们坐了下来","y":"教材原文","p":["a. 学生们坐了下来","// The students sat down.b. *我在校园看见同学们","// We saw the students on the campus."],"q":"a. 学生们坐了下来。 // The students sat down.b. *我在校园看见同学们。// We saw the students on the campus.","w":"normal","e":["原书正文"]},{"t":"【原文】a句的“学生们”和 st","y":"教材原文","p":["a句的“学生们”和 students都是主语, 句子都可以成立","b句“同学们”和 students 都是宾语，英语可以说，汉语不能说","由此可见，汉语的“们”跟英语表复数的s不同，不是典型的复数形式"],"q":"a句的“学生们”和 students都是主语, 句子都可以成立。b句“同学们”和 students 都是宾语，英语可以说，汉语不能说。由此可见，汉语的“们”跟英语表复数的s不同，不是典型的复数形式。","w":"normal","e":["原书正文"]},{"t":"【原文】第二，汉语代词没有性和格","y":"教材原文","p":["第二，汉语代词没有性和格、人称代词与物主代词的区别"],"q":"第二，汉语代词没有性和格、人称代词与物主代词的区别。","w":"normal","e":["原书正文"]},{"t":"【原文】第三，汉语动词没有形态变","y":"教材原文","p":["第三，汉语动词没有形态变化","例如，动词虽然有“着”表示体态，但它与英语302|对外汉语教学入门(第三版)-ing有很大差异","以前的语法书常讲，汉语有两个“着”， “着，”表示行为动作进行，“着₂”表示状态持续","但在语言实际中，“着，”单独表示行为动作进行的情况比较少"],"q":"第三，汉语动词没有形态变化。例如，动词虽然有“着”表示体态，但它与英语302|对外汉语教学入门(第三版)-ing有很大差异。以前的语法书常讲，汉语有两个“着”， “着，”表示行为动作进行，“着₂”表示状态持续； 但在语言实际中，“着，”单独表示行为动作进行的情况比较少。请对比：","w":"normal","e":["原书正文"]},{"t":"【原文】相对来说，表行为动作进行","y":"教材原文","p":["相对来说，表行为动作进行的功能，大多由动词前的“在、正在”承担"],"q":"相对来说，表行为动作进行的功能，大多由动词前的“在、正在”承担。","w":"normal","e":["原书正文"]},{"t":"【原文】五、特殊的动词结构(一)","y":"教材原文","p":["五、特殊的动词结构(一) 动补结构汉语的“动词+补语”结构，对许多外国人来说，很像一个完整的词","而且，补语有多种类型","先看汉语的例子："],"q":"五、特殊的动词结构(一) 动补结构汉语的“动词+补语”结构，对许多外国人来说，很像一个完整的词。而且，补语有多种类型。先看汉语的例子：","w":"normal","e":["原书正文"]},{"t":"【原文】英语: broke, f","y":"教材原文","p":["英语: broke, forced the door open, got away with...印度尼西亚语: memecahkan"],"q":"英语: broke, forced the door open, got away with...印度尼西亚语: memecahkan","w":"normal","e":["原书正文"]},{"t":"【原文】打破 (me-表示动作结","y":"教材原文","p":["打破 (me-表示动作结果，相当于“破”)韩语: 창문을 깨고, ……"],"q":"打破 (me-表示动作结果，相当于“破”)韩语: 창문을 깨고, ……","w":"normal","e":["原书正文"]}]},{"id":"rumen-c11-s04","t":"第四节 语法教学的方法","w":"normal","n":8,"k":[{"t":"【原文】A. 把书打开 B. 把","y":"教材原文","p":["A. 把书打开 B. 把书放在桌子上从结构上看，A片段比较短，包含四个词，补语只由一个动词构成","B片段比较长，包含六个词，补语由三个词构成的介词结构充当","从语言结构上看，B显然比A难学","因此，有的等级大纲就将A列为甲级项目，认为应该先教"],"q":"A. 把书打开 B. 把书放在桌子上从结构上看，A片段比较短，包含四个词，补语只由一个动词构成； B片段比较长，包含六个词，补语由三个词构成的介词结构充当。从语言结构上看，B显然比A难学。因此，有的等级大纲就将A列为甲级项目，认为应该先教； 将B列为乙级项目，认为应该后教。","w":"normal","e":["原书正文"]},{"t":"【原文】施家炜 (1998) 根","y":"教材原文","p":["施家炜 (1998) 根据北京语言大学汉语中介语语料库的资料统计发现，即使先教A，后教B，学生也是先掌握B，后掌握 A","原因在于从学习和使用的角度看，B比 A 要容易学","这可以从几方面讨论","①B是强制性“把”字句，它的意思不用“把”字句很难用其他句式表达(“他放书在桌子上”不能成立)"],"q":"施家炜 (1998) 根据北京语言大学汉语中介语语料库的资料统计发现，即使先教A，后教B，学生也是先掌握B，后掌握 A。原因在于从学习和使用的角度看，B比 A 要容易学。这可以从几方面讨论。①B是强制性“把”字句，它的意思不用“把”字句很难用其他句式表达(“他放书在桌子上”不能成立)；A是非强制性“把”字句，意思很容易用以前学过的非“把”字句表达(“他打开书","w":"normal","e":["原书正文"]},{"t":"【原文】(二) 从交际出发从交际","y":"教材原文","p":["(二) 从交际出发从交际出发是功能教学法的原则","具体来说，就是跟最基本交际密切相关的语法点先教，关系不那么密切的后教"],"q":"(二) 从交际出发从交际出发是功能教学法的原则。具体来说，就是跟最基本交际密切相关的语法点先教，关系不那么密切的后教。","w":"normal","e":["原书正文"]},{"t":"【原文】例如，理论语法认为， “","y":"教材原文","p":["例如，理论语法认为， “了”可以分为“了₁”和“了₂”： “了₁”放在动词后边，表示动作行为的完成，如“他买了一本书”","“了₂”放在句子末尾，表示事件、情况的发生或将要发生，如“他去北京了/吃饭了”","以前的对外汉语教材通常按照理论语法的顺序，先教“了：”，再教“了₂”","但学生的习得顺序正好相反"],"q":"例如，理论语法认为， “了”可以分为“了₁”和“了₂”： “了₁”放在动词后边，表示动作行为的完成，如“他买了一本书”；“了₂”放在句子末尾，表示事件、情况的发生或将要发生，如“他去北京了/吃饭了”。以前的对外汉语教材通常按照理论语法的顺序，先教“了：”，再教“了₂”。但学生的习得顺序正好相反。","w":"normal","e":["原书正文"]},{"t":"【原文】邓守信 (1999) 根","y":"教材原文","p":["邓守信 (1999) 根据台湾师范大学第二语言中介语数据库进行的统计发现，母语为英语的汉语学习者往往较早习得“了₂”，经过几周后才习得“了，”","尽管教师是先教“了：”，后教“了，”","他认为，应尽可能早地教“了₂”， “了：”则要在学生掌握了相当数量的基本动词和类似“昨天、上个星期、今天早上”等时间词后才教"],"q":"邓守信 (1999) 根据台湾师范大学第二语言中介语数据库进行的统计发现，母语为英语的汉语学习者往往较早习得“了₂”，经过几周后才习得“了，”； 尽管教师是先教“了：”，后教“了，”。他认为，应尽可能早地教“了₂”， “了：”则要在学生掌握了相当数量的基本动词和类似“昨天、上个星期、今天早上”等时间词后才教。","w":"normal","e":["原书正文"]},{"t":"【原文】这里就涉及交际性问题","y":"教材原文","p":["这里就涉及交际性问题","留学生在学习了很简单的句子后，就可以在句末加308|对外汉语教学入门 (第三版)“了₂”，使句子表达更为丰富"],"q":"这里就涉及交际性问题。留学生在学习了很简单的句子后，就可以在句末加308|对外汉语教学入门 (第三版)“了₂”，使句子表达更为丰富。如：","w":"normal","e":["原书正文"]},{"t":"【原文】上述句子中，左边的都是留","y":"教材原文","p":["上述句子中，左边的都是留学生较早学习并掌握的句子，加上“了₂”就可以变成右边的句子，表示情况变化了","但右边的句子中，a句、b句的“是”后一般不能用“了₁”","c句、d句是体词谓语句，不能用“了₁”","e句、f句的动词后边可以用“了，”"],"q":"上述句子中，左边的都是留学生较早学习并掌握的句子，加上“了₂”就可以变成右边的句子，表示情况变化了。但右边的句子中，a句、b句的“是”后一般不能用“了₁”。c句、d句是体词谓语句，不能用“了₁”。e句、f句的动词后边可以用“了，”；但光加“了₁”句子的可接受性有问题 (*他说了汉语/*他用了词典)，必须加其他成分或另一个分句，如：","w":"normal","e":["原书正文"]},{"t":"【原文】e3. 他说了汉语，但我","y":"教材原文","p":["e3. 他说了汉语，但我听不清楚","f3. 他用了我的词典"],"q":"e3. 他说了汉语，但我听不清楚。 f3. 他用了我的词典。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c11-s05","t":"第五节 语法点的教学技巧","w":"normal","n":8,"k":[{"t":"【原文】d. ……, witho","y":"教材原文","p":["d. ……, without even giving opinion to the simplest question."],"q":"d. ……, without even giving opinion to the simplest question.","w":"normal","e":["原书正文"]},{"t":"【原文】e. ……, witho","y":"教材原文","p":["e. ……, without even taking a rest on Sunday.f. You can even boil water in a paper cup."],"q":"e. ……, without even taking a rest on Sunday.f. You can even boil water in a paper cup.","w":"normal","e":["原书正文"]},{"t":"【原文】从语言共性的角度看，上述","y":"教材原文","p":["从语言共性的角度看，上述汉语句子中的“连”不但跟英语中的 even对应，而且跟其他许多语言中表示递进 (或程度递进) 的连词和副词功能相似","如果讲清楚它跟学生母语中对应成分的共性，可以方便学生学习和掌握"],"q":"从语言共性的角度看，上述汉语句子中的“连”不但跟英语中的 even对应，而且跟其他许多语言中表示递进 (或程度递进) 的连词和副词功能相似。如果讲清楚它跟学生母语中对应成分的共性，可以方便学生学习和掌握。","w":"normal","e":["原书正文"]},{"t":"【原文】3. 表层结构不同、深层","y":"教材原文","p":["3. 表层结构不同、深层语义结构相同的对比汉语中一些语法项目，从表层看跟外语不同，但从深层语义结构上看却有相同之处","请对比下面的汉语、英语和越南语的表达："],"q":"3. 表层结构不同、深层语义结构相同的对比汉语中一些语法项目，从表层看跟外语不同，但从深层语义结构上看却有相同之处。请对比下面的汉语、英语和越南语的表达：","w":"normal","e":["原书正文"]},{"t":"【原文】汉语：我们学校数学系的年","y":"教材原文","p":["汉语：我们学校数学系的年轻女教师英语: the young woman teacher of the math department in our university"],"q":"汉语：我们学校数学系的年轻女教师英语: the young woman teacher of the math department in our university","w":"normal","e":["原书正文"]},{"t":"【原文】越南语: giáo vi","y":"教材原文","p":["越南语: giáo viên nữ trẻ của khoa toán trong chún g tôi老师 女 年轻 的 系 数学 学校 我 们"],"q":"越南语: giáo viên nữ trẻ của khoa toán trong chún g tôi老师 女 年轻 的 系 数学 学校 我 们","w":"normal","e":["原书正文"]},{"t":"【原文】这三种语言的表层结构有明","y":"教材原文","p":["这三种语言的表层结构有明显区别：汉语的修饰语都在中心词前面，越南语的修饰语都在中心词后边，英语则有前有后"],"q":"这三种语言的表层结构有明显区别：汉语的修饰语都在中心词前面，越南语的修饰语都在中心词后边，英语则有前有后。","w":"normal","e":["原书正文"]},{"t":"【原文】但这只是表面现象","y":"教材原文","p":["但这只是表面现象","如果从深层语义结构上看，三种语言有着极其相似的东西","我们把修饰语分成性别、年龄、小部门、大部门四类，前两类表示中心词所指的性质，后两类表示中心词所指的归属","再考察它们的位置及其跟中心词的距离"],"q":"但这只是表面现象。如果从深层语义结构上看，三种语言有着极其相似的东西。我们把修饰语分成性别、年龄、小部门、大部门四类，前两类表示中心词所指的性质，后两类表示中心词所指的归属。再考察它们的位置及其跟中心词的距离。不难看出，修饰语和中心词的位置，汉语和越南语形成一种镜像关系：","w":"normal","e":["原书正文"]}]}]},{"id":"rumen-c12","t":"第十二章 汉字教学","w":"normal","s":[{"id":"rumen-c12-s01","t":"第一节 汉字教学的地位和重要性","w":"normal","n":8,"k":[{"t":"【原文】总结：“除了A外，都B”","y":"教材原文","p":["总结：“除了A外，都B”的句式，可以表示排除A项的排除关系","“除了”的位置不同，同样可以改变排除项的内容","如c组句子是对谓语部分的排除，d组句子是对主语部分的排除"],"q":"总结：“除了A外，都B”的句式，可以表示排除A项的排除关系；“除了”的位置不同，同样可以改变排除项的内容。如c组句子是对谓语部分的排除，d组句子是对主语部分的排除。","w":"normal","e":["原书正文"]},{"t":"【原文】三、语法点的练习(一) ","y":"教材原文","p":["三、语法点的练习(一) 机械练习机械练习主要指不怎么需要理解的练习项目，如模仿、重复、替换、扩展等练习","目的是在简单情景中加深学生对语法点的理解，并通过反复的高频率练习达到流利说出包含所学语法点的句子","教师也可以利用这种练习纠正学生的语法、语音、词汇的偏误","机械练习大致的形式有："],"q":"三、语法点的练习(一) 机械练习机械练习主要指不怎么需要理解的练习项目，如模仿、重复、替换、扩展等练习。目的是在简单情景中加深学生对语法点的理解，并通过反复的高频率练习达到流利说出包含所学语法点的句子。教师也可以利用这种练习纠正学生的语法、语音、词汇的偏误。机械练习大致的形式有：","w":"normal","e":["原书正文"]},{"t":"【原文】(二) 有意义的练习比较","y":"教材原文","p":["(二) 有意义的练习比较明确理解语法点意义和练习内容之后进行的练习","目的是在有意义的情景中加深对所学语法点的理解，为交际练习打下基础 (娄开阳、吕妍醒，2011)","有意义的练习常见的形式有："],"q":"(二) 有意义的练习比较明确理解语法点意义和练习内容之后进行的练习。目的是在有意义的情景中加深对所学语法点的理解，为交际练习打下基础 (娄开阳、吕妍醒，2011)。有意义的练习常见的形式有：","w":"normal","e":["原书正文"]},{"t":"【原文】(2) 复述练习：完全复","y":"教材原文","p":["(2) 复述练习：完全复述，简缩复述，扩展复述，角色复述"],"q":"(2) 复述练习：完全复述，简缩复述，扩展复述，角色复述；","w":"normal","e":["原书正文"]},{"t":"【原文】(4) 补足练习：补足词","y":"教材原文","p":["(4) 补足练习：补足词语，补足关联词语，补足分句"],"q":"(4) 补足练习：补足词语，补足关联词语，补足分句；","w":"normal","e":["原书正文"]},{"t":"【原文】(5) 情景描述练习：根","y":"教材原文","p":["(5) 情景描述练习：根据老师提供的情景，用含有目标语言点的句子描述出来"],"q":"(5) 情景描述练习：根据老师提供的情景，用含有目标语言点的句子描述出来；","w":"normal","e":["原书正文"]},{"t":"【原文】(6) 修改病句练习：针","y":"教材原文","p":["(6) 修改病句练习：针对学生可能出现的偏误进行有目的的修改练习"],"q":"(6) 修改病句练习：针对学生可能出现的偏误进行有目的的修改练习。","w":"normal","e":["原书正文"]},{"t":"【原文】(三) 交际练习交际练习","y":"教材原文","p":["(三) 交际练习交际练习是教师在课堂上利用或创造交际环境，使学生把所学语法点用于实际(或准实际) 交际中，根据真实情况进行问答、谈话和讨论等练习活动","交际练习是语法练习最重要的部分","只有通过这个练习，才能使学生真正掌握该语法点的用法，学会在真实的交际环境中使用","要注意，听说双方要有信息差"],"q":"(三) 交际练习交际练习是教师在课堂上利用或创造交际环境，使学生把所学语法点用于实际(或准实际) 交际中，根据真实情况进行问答、谈话和讨论等练习活动。其特点是真实。交际练习是语法练习最重要的部分。只有通过这个练习，才能使学生真正掌握该语法点的用法，学会在真实的交际环境中使用。要注意，听说双方要有信息差。交际练习包括两大类：交际练习和交际活动。下面介绍几种形式","w":"normal","e":["原书正文"]}]},{"id":"rumen-c12-s02","t":"第二节 对外汉字教学的特点","w":"normal","n":8,"k":[{"t":"【原文】[33]孙德坤. 外国学","y":"教材原文","p":["[33]孙德坤. 外国学生现代汉语“了· le”的习得过程初步分析 [J]. 语言教学与研究，1993 (2)：65-75."],"q":"[33]孙德坤. 外国学生现代汉语“了· le”的习得过程初步分析 [J]. 语言教学与研究，1993 (2)：65-75.","w":"normal","e":["原书正文"]},{"t":"【原文】[34] 王还，对外汉语","y":"教材原文","p":["[34] 王还，对外汉语教学语法大纲[M].北京：北京语言学院出版社，1995.[35]许国璋, 论语法 [J]. 外语教学与研究, 1986 (1)."],"q":"[34] 王还，对外汉语教学语法大纲[M].北京：北京语言学院出版社，1995.[35]许国璋, 论语法 [J]. 外语教学与研究, 1986 (1).","w":"normal","e":["原书正文"]} 、休、位、住”等字，从而加深了对它的认识。这个时候，教师就可以告诉他们，这叫“单人旁”，就是“人”字的变形，常常用来表示和人相关的意义。到此，学习者就在学会了若干个汉字的同时，很自然地学习了“单人旁”这个常见部件，","w":"normal","e":["原书正文"]},{"t":"【原文】336|对外汉语教学入门","y":"教材原文","p":["336|对外汉语教学入门(第三版)跟这个部件相关的汉字打下了基础"],"q":"336|对外汉语教学入门(第三版)跟这个部件相关的汉字打下了基础。","w":"normal","e":["原书正文"]},{"t":"【原文】(二) 强化部件的位置汉","y":"教材原文","p":["(二) 强化部件的位置汉字的不少部件的位置是十分固定的，像“氵、扌、i”等几乎都是出现在汉字的左边","“火、衣、言”这样的形旁，其出现在不同位置时则表现为形体的不同 (灯、热","对于这些部件，在归纳学习时要特别强调它的位置","部件位置意识的形成对于汉字正字法意识的发展非常重要"],"q":"(二) 强化部件的位置汉字的不少部件的位置是十分固定的，像“氵、扌、i”等几乎都是出现在汉字的左边；“火、衣、言”这样的形旁，其出现在不同位置时则表现为形体的不同 (灯、热； 衬、袋； 话、誓)。对于这些部件，在归纳学习时要特别强调它的位置。部件位置意识的形成对于汉字正字法意识的发展非常重要。","w":"normal","e":["原书正文"]},{"t":"【原文】汉字偏误分析发现，在学习","y":"教材原文","p":["汉字偏误分析发现，在学习者输出的汉字偏误中，总有一部分是由于颠倒了位置而造成的","例如，有不少学习者把“想”字上面的“相”写成“目”在左、 “木”在右，也有学习者把“味”的两个部件写颠倒了","强化对一部分部件位置的认识，有助于学习者形成正字法意识，减少写错字","初级阶段的非汉字文化圈的学习者经过汉字学习后，也可以形成部件位置意识 (陈琳、叶仕骞、吴门吉，2015)"],"q":"汉字偏误分析发现，在学习者输出的汉字偏误中，总有一部分是由于颠倒了位置而造成的。例如，有不少学习者把“想”字上面的“相”写成“目”在左、 “木”在右，也有学习者把“味”的两个部件写颠倒了。强化对一部分部件位置的认识，有助于学习者形成正字法意识，减少写错字。初级阶段的非汉字文化圈的学习者经过汉字学习后，也可以形成部件位置意识 (陈琳、叶仕骞、吴门吉，2015)","w":"normal","e":["原书正文"]},{"t":"【原文】(三) 抓住声旁形旁，强","y":"教材原文","p":["(三) 抓住声旁形旁，强化形声字意识汉字中形声字是主体，也是最能体现汉字系统性和规律性的地方","声旁和形旁都可以作为学习汉字的线索"],"q":"(三) 抓住声旁形旁，强化形声字意识汉字中形声字是主体，也是最能体现汉字系统性和规律性的地方。声旁和形旁都可以作为学习汉字的线索。","w":"normal","e":["原书正文"]},{"t":"【原文】据统计，在《等级大纲》中","y":"教材原文","p":["据统计，在《等级大纲》中，甲级词中形声字的比例为49.3%，从乙级词到丙级词、丁级词，形声字的比例是不断增加的，在丁级词中达到79.6% (冯丽萍，1998)","这就是说，虽然在作为教学主体的甲级字中，形声字还没有占绝对优势，但是关于形声字的构字规律，以及表音 (义) 性的知识，对于促进学习者日后的自学是十分关键的"],"q":"据统计，在《等级大纲》中，甲级词中形声字的比例为49.3%，从乙级词到丙级词、丁级词，形声字的比例是不断增加的，在丁级词中达到79.6% (冯丽萍，1998)。这就是说，虽然在作为教学主体的甲级字中，形声字还没有占绝对优势，但是关于形声字的构字规律，以及表音 (义) 性的知识，对于促进学习者日后的自学是十分关键的。","w":"normal","e":["原书正文"]},{"t":"【原文】对作为声(形) 旁的部件","y":"教材原文","p":["对作为声(形) 旁的部件，首先要归纳其可以有效表音 (义) 的特点，然后再指出它的局限性","让学生在形成形声字意识的基础上，正确认识形声字与汉字的真实面貌，培养正确的汉字意识"],"q":"对作为声(形) 旁的部件，首先要归纳其可以有效表音 (义) 的特点，然后再指出它的局限性。让学生在形成形声字意识的基础上，正确认识形声字与汉字的真实面貌，培养正确的汉字意识。","w":"normal","e":["原书正文"]},{"t":"【原文】例如，作为声旁的部件——","y":"教材原文","p":["例如，作为声旁的部件————“青”","在学生接触到“请、情”之后，就可以归纳“青”大体可以表示汉字的发音 (qing)","之后顺势引出“清、晴、精”等汉字，引导学生发现在前两字中“青”的表音还比较精确，在“精”里则变换了声母，但两个声母发音部位相同，仍有一定的联系"],"q":"例如，作为声旁的部件————“青”。在学生接触到“请、情”之后，就可以归纳“青”大体可以表示汉字的发音 (qing)。之后顺势引出“清、晴、精”等汉字，引导学生发现在前两字中“青”的表音还比较精确，在“精”里则变换了声母，但两个声母发音部位相同，仍有一定的联系。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c12-s04","t":"第四节 汉字教学的技巧","w":"normal","n":8,"k":[{"t":"【原文】雨———想象这是一面窗户","y":"教材原文","p":["雨———想象这是一面窗户，窗外下雨，雨点打在窗玻璃上"],"q":"雨———想象这是一面窗户，窗外下雨，雨点打在窗玻璃上。","w":"normal","e":["原书正文"]},{"t":"【原文】但这种方法一定要注意把握","y":"教材原文","p":["但这种方法一定要注意把握适度的问题，千万不可滥用"],"q":"但这种方法一定要注意把握适度的问题，千万不可滥用。","w":"normal","e":["原书正文"]},{"t":"【原文】(三) 教字音的技巧教字","y":"教材原文","p":["(三) 教字音的技巧教字音的时候要格外注意同音字和近音字的辨析","由于初学者对汉字形、义之间的联系比较陌生，很容易混淆同音字和近音字","例如“在”“再”二字都是比较早接触且比较常用的，读音完全相同，这样的字在教的时候应该跟同音字进行对比辨析，并设计相关练习进行巩固"],"q":"(三) 教字音的技巧教字音的时候要格外注意同音字和近音字的辨析。由于初学者对汉字形、义之间的联系比较陌生，很容易混淆同音字和近音字。例如“在”“再”二字都是比较早接触且比较常用的，读音完全相同，这样的字在教的时候应该跟同音字进行对比辨析，并设计相关练习进行巩固。","w":"normal","e":["原书正文"]},{"t":"【原文】在进入合体字教学阶段后，","y":"教材原文","p":["在进入合体字教学阶段后，形声字的声旁应该受到充分的重视","可以引导学生利用声旁类推读音，然后再利用类推成功和不成功的方面说明声旁表音性及其局限","帮助学习者正确认识并合理利用形声字的声旁来学习汉字，也是建立形音联系的关键所在"],"q":"在进入合体字教学阶段后，形声字的声旁应该受到充分的重视。可以引导学生利用声旁类推读音，然后再利用类推成功和不成功的方面说明声旁表音性及其局限。帮助学习者正确认识并合理利用形声字的声旁来学习汉字，也是建立形音联系的关键所在。","w":"normal","e":["原书正文"]},{"t":"【原文】教师：猜一猜这个字念什么","y":"教材原文","p":["教师：猜一猜这个字念什么?学生: 京 (jīng)?教师: 对了一半, 声调应该是三声: jǐng, scenery, 风景的景"],"q":"教师：猜一猜这个字念什么?学生: 京 (jīng)?教师: 对了一半, 声调应该是三声: jǐng, scenery, 风景的景。","w":"normal","e":["原书正文"]},{"t":"【原文】这样，通过声旁猜字音，学","y":"教材原文","p":["这样，通过声旁猜字音，学习了生字，还强化了对声旁的认识"],"q":"这样，通过声旁猜字音，学习了生字，还强化了对声旁的认识。","w":"normal","e":["原书正文"]},{"t":"【原文】三、练习汉字的技巧(一)","y":"教材原文","p":["三、练习汉字的技巧(一) 认读练习这主要是通过强化刺激，使学生把汉字的形、音、义作为一个整体来掌握"],"q":"三、练习汉字的技巧(一) 认读练习这主要是通过强化刺激，使学生把汉字的形、音、义作为一个整体来掌握。","w":"normal","e":["原书正文"]},{"t":"【原文】对一般的汉字，可以采用以","y":"教材原文","p":["对一般的汉字，可以采用以下方式：出示字形念字音，说字义","出示音义，选择正确字形","认读词句、解释意思","在这里，卡片是一种很好用的工具"],"q":"对一般的汉字，可以采用以下方式：出示字形念字音，说字义； 出示音义，选择正确字形； 认读词句、解释意思。在这里，卡片是一种很好用的工具。","w":"normal","e":["原书正文"]}]}]},{"id":"rumen-c13","t":"第十三章 跨文化交际与文化教学","w":"normal","s":[{"id":"rumen-c13-s01","t":"第一节 跨文化交际","w":"normal","n":8,"k":[{"t":"【原文】[39] 张永亮. 汉字","y":"教材原文","p":["[39] 张永亮. 汉字联想网及对外汉字教学[C] //吕必松. 汉字与汉字教学研究论文选. 北京：北京大学出版社, 1999 ."],"q":"[39] 张永亮. 汉字联想网及对外汉字教学[C] //吕必松. 汉字与汉字教学研究论文选. 北京：北京大学出版社, 1999 .","w":"normal","e":["原书正文"]},{"t":"【原文】[40] 周小兵. 第二","y":"教材原文","p":["[40] 周小兵. 第二语言教学论 [M].石家庄: 河北教育出版社, 1996.[41] 周小兵. 对外汉字教学中多项分流、交际领先的原则 [C] //吕必松. 汉字与汉字教学研究论文选. 北京：北京大学出版社，1999."],"q":"[40] 周小兵. 第二语言教学论 [M].石家庄: 河北教育出版社, 1996.[41] 周小兵. 对外汉字教学中多项分流、交际领先的原则 [C] //吕必松. 汉字与汉字教学研究论文选. 北京：北京大学出版社，1999.","w":"normal","e":["原书正文"]},{"t":"【原文】[42] 朱治平，哈丽娜","y":"教材原文","p":["[42] 朱治平，哈丽娜. 波兰学生暨欧美学生汉字习得的考察、分析和思考 [J].北京师范大学学报：社会科学版, 1999 (6)."],"q":"[42] 朱治平，哈丽娜. 波兰学生暨欧美学生汉字习得的考察、分析和思考 [J].北京师范大学学报：社会科学版, 1999 (6).","w":"normal","e":["原书正文"]},{"t":"【原文】[43] Cao F, ","y":"教材原文","p":["[43] Cao F, Lee R, Shu H, et al. Cultural constraints on brain development: Evidence from a development- tal study of visual word processing in mandarin Chinese [J]. Cereb Cortex, 2010 (5)."],"q":"[43] Cao F, Lee R, Shu H, et al. Cultural constraints on brain development: Evidence from a development- tal study of visual word processing in mandarin Chinese [J]. Cereb Cortex, ","w":"normal","e":["原书正文"]},{"t":"【原文】[44] Cao F, ","y":"教材原文","p":["[44] Cao F, Peng D, Liu L, et al. Developmental differences of neurocognitive networks for phonological and semantic processing in Chinese word reading [J]. Human Brain Mapping, 2009 (3)."],"q":"[44] Cao F, Peng D, Liu L, et al. Developmental differences of neurocognitive networks for phonological and semantic processing in Chinese word reading [J]. Human Brain Mapping, 20","w":"normal","e":["原书正文"]},{"t":"【原文】[45] Perfett","y":"教材原文","p":["[45] Perfetti CA, Cao F, Booth J. Specialization and universals in the development of reading skill: How Chinese research informs a universal science of reading [J]. Scientific Studies of Reading, 2013 (1)."],"q":"[45] Perfetti CA, Cao F, Booth J. Specialization and universals in the development of reading skill: How Chinese research informs a universal science of reading [J]. Scientific Stu","w":"normal","e":["原书正文"]},{"t":"【原文】[46] Yu H, G","y":"教材原文","p":["[46] Yu H, Gong L, Qiu Y, et al. Seeing Chinese characters in action: An fMRI study of the perception of writing sequences [J]. Brain & Language, 2011 (2)."],"q":"[46] Yu H, Gong L, Qiu Y, et al. Seeing Chinese characters in action: An fMRI study of the perception of writing sequences [J]. Brain & Language, 2011 (2).","w":"normal","e":["原书正文"]},{"t":"【原文】348|对外汉语教学入门","y":"教材原文","p":["348|对外汉语教学入门(第三版)第十三章 跨文化交际与文化教学跨文化交际, 也叫跨文化交流 (inter-cultural communication 或 cross-cultural commu- nication)，就是跨越两种不同文化的交际， 发生在两种不同文化背景的人们之间的交流","不同文化背景既可以是本民族与非本民族，也可以是同一民族中文化背景有差异的人","不同民族、国家的人相互之间的交流是最常见的跨文化交流"],"q":"348|对外汉语教学入门(第三版)第十三章 跨文化交际与文化教学跨文化交际, 也叫跨文化交流 (inter-cultural communication 或 cross-cultural commu- nication)，就是跨越两种不同文化的交际， 发生在两种不同文化背景的人们之间的交流。不同文化背景既可以是本民族与非本民族，也可以是同一民族中文化背景有差","w":"normal","e":["原书正文"]}]},{"id":"rumen-c13-s02","t":"第二节 价值观和文化","w":"normal","n":8,"k":[{"t":"【原文】曾有一个留学生说，在中国","y":"教材原文","p":["曾有一个留学生说，在中国最可怕的不是厕所的肮脏，而是排队时大家紧密地挤在一起"],"q":"曾有一个留学生说，在中国最可怕的不是厕所的肮脏，而是排队时大家紧密地挤在一起。","w":"normal","e":["原书正文"]},{"t":"【原文】7. 触摸虽然中国人舒适","y":"教材原文","p":["7. 触摸虽然中国人舒适的身体距离和范围较西方人小，但是中国人的身体直接接触却没有西方人多","西方人拥抱、接吻是每日的例行公事，他们也更多地用触摸的方式表达自己的情感，如亲人、朋友间用拥抱表示关怀和爱护","中国人就很少拥抱","成年人的拥抱相当少见，父母与成年子女也很少拥抱"],"q":"7. 触摸虽然中国人舒适的身体距离和范围较西方人小，但是中国人的身体直接接触却没有西方人多。西方人拥抱、接吻是每日的例行公事，他们也更多地用触摸的方式表达自己的情感，如亲人、朋友间用拥抱表示关怀和爱护。中国人就很少拥抱。成年人的拥抱相当少见，父母与成年子女也很少拥抱。但是，中国人的另一些身体接触方式，如男性间的手拉手和身体接触，会让西方人感到尴尬。","w":"normal","e":["原书正文"]},{"t":"【原文】中国人也常常喜欢把触摸孩","y":"教材原文","p":["中国人也常常喜欢把触摸孩子的头当成一种喜爱，这在一些文化中很忌讳","泰国和印度尼西亚忌讳触碰任何人的头部，即使是对小孩子","因为头颅被视作人体的最高部分，随便触摸别人的头部就是对他的一种极大的侮辱","泰国人也讨厌西方人平时生活中的拍拍打打的举止习惯，认为这是有伤风化的"],"q":"中国人也常常喜欢把触摸孩子的头当成一种喜爱，这在一些文化中很忌讳。泰国和印度尼西亚忌讳触碰任何人的头部，即使是对小孩子。因为头颅被视作人体的最高部分，随便触摸别人的头部就是对他的一种极大的侮辱。泰国人也讨厌西方人平时生活中的拍拍打打的举止习惯，认为这是有伤风化的。","w":"normal","e":["原书正文"]},{"t":"【原文】8. 音量人在不同的交际","y":"教材原文","p":["8. 音量人在不同的交际场合，与不同的交际对象交谈时，音量是不一样的","而不同的音量在某种程度上表现出说话人的修养和态度","在跨文化交际中，对语音的控制要十分留心","西方在语音方面的基本礼仪规范是：与别人进行交谈时，尤其是在大庭广众之前与别人进行交谈时，必须有意识地压低自己说话时的音量"],"q":"8. 音量人在不同的交际场合，与不同的交际对象交谈时，音量是不一样的。而不同的音量在某种程度上表现出说话人的修养和态度。在跨文化交际中，对语音的控制要十分留心。西方在语音方面的基本礼仪规范是：与别人进行交谈时，尤其是在大庭广众之前与别人进行交谈时，必须有意识地压低自己说话时的音量； 说话的声音最好是低一些，轻柔一些，只要交谈对象可以听清楚即可。在交谈时，特别","w":"normal","e":["原书正文"]},{"t":"【原文】总之，每个文化都有自己的","y":"教材原文","p":["总之，每个文化都有自己的交际模式，有约定俗成的习惯，对此我们要有清楚的认识","我们不能以一个民族的文化生活习俗和道德标准去衡量另一个民族的同一行为现象","对于历史文化现象，只要是这个民族习惯的、接受了的东西，应该看作一种正常现象"],"q":"总之，每个文化都有自己的交际模式，有约定俗成的习惯，对此我们要有清楚的认识。我们不能以一个民族的文化生活习俗和道德标准去衡量另一个民族的同一行为现象。对于历史文化现象，只要是这个民族习惯的、接受了的东西，应该看作一种正常现象。","w":"normal","e":["原书正文"]},{"t":"【原文】(四) 文化休克“文化休","y":"教材原文","p":["(四) 文化休克“文化休克”, 又叫“文化震荡”“文化震惊” (cultural shock), 是1958年美国人类学家奥博格 (KalveroOberg)创造的一个概念","文化休克指一个人身处一个不熟悉的文化环境之中，由于失去了自己所熟悉的文化象征符号和社会交流手段，尤其是语言交际能力的丧失而产生的一种失落、紧张、迷失、沮丧、排斥、无助乃至恐惧的感觉","具体表现是他感觉在这个文化中失去了社会身份，自我认同和人格被降低，生存的能力大打折扣，无能为力","他感觉在这个文化里情感无所依托，于是厌恶周边环境，情绪焦虑低落"],"q":"(四) 文化休克“文化休克”, 又叫“文化震荡”“文化震惊” (cultural shock), 是1958年美国人类学家奥博格 (KalveroOberg)创造的一个概念。文化休克指一个人身处一个不熟悉的文化环境之中，由于失去了自己所熟悉的文化象征符号和社会交流手段，尤其是语言交际能力的丧失而产生的一种失落、紧张、迷失、沮丧、排斥、无助乃至恐惧的感觉。具体","w":"normal","e":["原书正文"]},{"t":"【原文】文化休克包括蜜月阶段、沮","y":"教材原文","p":["文化休克包括蜜月阶段、沮丧阶段、恢复调整阶段、适应阶段等阶段","文化休克不是一种病，而是一种复杂的个人文化体验，个体差异很大，造成的影响也很不相同","有些人沮丧阶段可以非常短暂，而有的人会持续较长时间","这就需要我们在面临进入一个新的文化时要有所准备，预防文化休克带来的消极影响"],"q":"文化休克包括蜜月阶段、沮丧阶段、恢复调整阶段、适应阶段等阶段。文化休克不是一种病，而是一种复杂的个人文化体验，个体差异很大，造成的影响也很不相同。有些人沮丧阶段可以非常短暂，而有的人会持续较长时间。这就需要我们在面临进入一个新的文化时要有所准备，预防文化休克带来的消极影响。有效的方法有很多，如：多了解新文化、新环境，提高自身的语言和文化应变能力，避免产生强烈","w":"normal","e":["原书正文"]},{"t":"【原文】(五) 文化适应模式Br","y":"教材原文","p":["(五) 文化适应模式Brown (1980) 从第二语言习得研究的角度对“文化适应”做出了定义， 指出“文化适应”是指学习者逐渐适应新文化的过程","“文化适应模式” (Acculturation Model)的基本假设是：第二语言习得只是文化适应的一个方面，一个学习者对目的语社会文化适应的程度将会决定他习得第二语言的程度(Schumann，1978)","该模式通过社会距离的八个因素和心理距离的四个因素来分析和阐述文化适应的程度"],"q":"(五) 文化适应模式Brown (1980) 从第二语言习得研究的角度对“文化适应”做出了定义， 指出“文化适应”是指学习者逐渐适应新文化的过程。 “文化适应模式” (Acculturation Model)的基本假设是：第二语言习得只是文化适应的一个方面，一个学习者对目的语社会文化适应的程度将会决定他习得第二语言的程度(Schumann，1978)。该模式","w":"normal","e":["原书正文"]}]},{"id":"rumen-c13-s03","t":"第三节 汉语教学中的文化教学","w":"normal","n":8,"k":[{"t":"【原文】有一天学习“男女平等”这","y":"教材原文","p":["有一天学习“男女平等”这一课","学完后我就挨个儿问他们，在家里是你做饭还是你女朋友做饭呀? 是你爸爸还是你妈妈做饭呀? 有的回答说我做，有的说我女朋友或者男朋友做，我就引导他们这就叫男女平等","当我问一个男生这个问题时，他说：“我爱人做饭","”我问：“你结婚了吗?”他说：“没有"],"q":"有一天学习“男女平等”这一课。学完后我就挨个儿问他们，在家里是你做饭还是你女朋友做饭呀? 是你爸爸还是你妈妈做饭呀? 有的回答说我做，有的说我女朋友或者男朋友做，我就引导他们这就叫男女平等。当我问一个男生这个问题时，他说：“我爱人做饭。”我问：“你结婚了吗?”他说：“没有。”我说：“没结婚不能叫爱人，那是你女朋友。”他突然说：“老师，是男朋友。”这时全班都安","w":"normal","e":["原书正文"]},{"t":"【原文】这个教师处理得非常得当，","y":"教材原文","p":["这个教师处理得非常得当，在遇到问题，尤其是遇到与我们的道德认知非常不同的问题时，没有大惊小怪，而是巧妙地化解"],"q":"这个教师处理得非常得当，在遇到问题，尤其是遇到与我们的道德认知非常不同的问题时，没有大惊小怪，而是巧妙地化解。","w":"normal","e":["原书正文"]},{"t":"【原文】(二) 应用现身说法和对","y":"教材原文","p":["(二) 应用现身说法和对比法启发学生思考教师应正视由于文化不同而产生的偏见乃至冲突，正确应对，而不是选择忽视或逃避","比较好的做法是，教师应先行预想到可能出现的问题，准备比较合适的回答，在回答中以个人作为例子现身说法，拉近与学生的距离","因为教师就是一个中国文化的代表，而且是一个正面的代表","对比的方法往往也能起到非常好的效果"],"q":"(二) 应用现身说法和对比法启发学生思考教师应正视由于文化不同而产生的偏见乃至冲突，正确应对，而不是选择忽视或逃避。比较好的做法是，教师应先行预想到可能出现的问题，准备比较合适的回答，在回答中以个人作为例子现身说法，拉近与学生的距离。因为教师就是一个中国文化的代表，而且是一个正面的代表。对比的方法往往也能起到非常好的效果。","w":"normal","e":["原书正文"]},{"t":"【原文】例如，教师可能常常会被问","y":"教材原文","p":["例如，教师可能常常会被问及“中国人吃猫吃狗吗”这样的问题","可以这样回答：世界上不同的国家、不同民族的饮食习惯不同，有的吃狗肉，有的不吃狗肉，吃狗肉的习惯不止中国有，越南、韩国和别的国家也有","就算在中国，也不是每个地方的人都吃狗肉，很多地方就没有这种习惯","像老师自己，从来不吃狗肉"],"q":"例如，教师可能常常会被问及“中国人吃猫吃狗吗”这样的问题。可以这样回答：世界上不同的国家、不同民族的饮食习惯不同，有的吃狗肉，有的不吃狗肉，吃狗肉的习惯不止中国有，越南、韩国和别的国家也有； 就算在中国，也不是每个地方的人都吃狗肉，很多地方就没有这种习惯。像老师自己，从来不吃狗肉； 家里也养了小狗，老师很喜欢它。这样的应对就很恰当。","w":"normal","e":["原书正文"]},{"t":"【原文】一些国家的美食，如蜗牛、","y":"教材原文","p":["一些国家的美食，如蜗牛、昆虫，在另一些国家人的眼里却很恶心、恐怖，其实都是文化差异造成的","要了解这些差异并将其适当地运用到教学中去，引导学生进行思考，了解到自己文化中的某些做法对其他文化来说也是很难理解的，这样就能建立起跨文化交际的意识","教师要“能自觉比较中外文化的主要异同，并应用于教学实践”(国家汉办, 2015)"],"q":"一些国家的美食，如蜗牛、昆虫，在另一些国家人的眼里却很恶心、恐怖，其实都是文化差异造成的。要了解这些差异并将其适当地运用到教学中去，引导学生进行思考，了解到自己文化中的某些做法对其他文化来说也是很难理解的，这样就能建立起跨文化交际的意识。教师要“能自觉比较中外文化的主要异同，并应用于教学实践”(国家汉办, 2015)。","w":"normal","e":["原书正文"]},{"t":"【原文】364 对外汉语教学入门","y":"教材原文","p":["364 对外汉语教学入门 (第三版)(三) 教材应多采用当代的内容目前的汉语教材中，有不少教材古代知识文化的比例太大，三皇五帝、三山五岳，厚古薄今，语言艰深，这是很不适合的","比较好的做法是做到“三个平衡”："],"q":"364 对外汉语教学入门 (第三版)(三) 教材应多采用当代的内容目前的汉语教材中，有不少教材古代知识文化的比例太大，三皇五帝、三山五岳，厚古薄今，语言艰深，这是很不适合的。比较好的做法是做到“三个平衡”：","w":"normal","e":["原书正文"]},{"t":"【原文】(1) 传统文化与现代文","y":"教材原文","p":["(1) 传统文化与现代文化的平衡","古代文化固然重要，但文化教学的内容应该和现实生活紧密结合，否则文化教学就失去了最重要的意义","文化教学要做到“学以致用”","如果教材中学生感兴趣的当代话题很多，题材实用性较强，学生会比较喜欢，因为学了能用"],"q":"(1) 传统文化与现代文化的平衡。古代文化固然重要，但文化教学的内容应该和现实生活紧密结合，否则文化教学就失去了最重要的意义。文化教学要做到“学以致用”。如果教材中学生感兴趣的当代话题很多，题材实用性较强，学生会比较喜欢，因为学了能用。","w":"normal","e":["原书正文"]},{"t":"【原文】(2) 知识文化与观念文","y":"教材原文","p":["(2) 知识文化与观念文化的平衡","这也可以说是知识和理解的平衡","记住大事年表、年节习俗由来、名人生辰功绩乃至城市的特产是需要的，但我们更希望学习者对中国文化的精神、中国人的价值观有所了解，了解中国人交际文化产生的根源，起到追本溯源的作用","教材中要注意引导学生思考和观察中国文化在日常生活的表现，而不是记住了某一个年代和人物"],"q":"(2) 知识文化与观念文化的平衡。这也可以说是知识和理解的平衡。记住大事年表、年节习俗由来、名人生辰功绩乃至城市的特产是需要的，但我们更希望学习者对中国文化的精神、中国人的价值观有所了解，了解中国人交际文化产生的根源，起到追本溯源的作用。教材中要注意引导学生思考和观察中国文化在日常生活的表现，而不是记住了某一个年代和人物。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c13-s04","t":"第四节 跨文化交际与文化教学的基本态度和方法","w":"normal","n":8,"k":[{"t":"【原文】教学内容主要包括语音、汉","y":"教材原文","p":["教学内容主要包括语音、汉字、词汇和语法知识","这些知识通常根据教学大纲，由374 对外汉语教学入门(第三版)易到难，有系统地分级安排在各教学阶段汉语综合课教材中","知识主要通过课文体现，通过语言知识点解释和例句加以说明，并通过听说读写练习使学生理解和掌握"],"q":"教学内容主要包括语音、汉字、词汇和语法知识。这些知识通常根据教学大纲，由374 对外汉语教学入门(第三版)易到难，有系统地分级安排在各教学阶段汉语综合课教材中。知识主要通过课文体现，通过语言知识点解释和例句加以说明，并通过听说读写练习使学生理解和掌握。","w":"normal","e":["原书正文"]},{"t":"【原文】语言的文化因素也是教学内","y":"教材原文","p":["语言的文化因素也是教学内容之一","它们通常出现在课文中，有些通过注释进行说明","这些文化因素跟汉语和汉语交际关系密切，直接影响着学生对汉语的理解和使用"],"q":"语言的文化因素也是教学内容之一。它们通常出现在课文中，有些通过注释进行说明。这些文化因素跟汉语和汉语交际关系密切，直接影响着学生对汉语的理解和使用。","w":"normal","e":["原书正文"]},{"t":"【原文】1. 语音教学的特点零起","y":"教材原文","p":["1. 语音教学的特点零起点的汉语教学就是语音教学","课文的汉字不多，教学重点就是让学生对汉语语音系统有初步认识，能比较准确地发音，能识认汉语拼音并用拼音进行拼写，为今后的学习打下牢固基础"],"q":"1. 语音教学的特点零起点的汉语教学就是语音教学。课文的汉字不多，教学重点就是让学生对汉语语音系统有初步认识，能比较准确地发音，能识认汉语拼音并用拼音进行拼写，为今后的学习打下牢固基础。","w":"normal","e":["原书正文"]},{"t":"【原文】此阶段语音教学的特点，就","y":"教材原文","p":["此阶段语音教学的特点，就是严格规范的语音训练","国内外语言教学专家都认为，语音教学在初级阶段必须严格认真，有错必纠","要教标准普通话，针对学生特点有的放矢地训练"],"q":"此阶段语音教学的特点，就是严格规范的语音训练。国内外语言教学专家都认为，语音教学在初级阶段必须严格认真，有错必纠。要教标准普通话，针对学生特点有的放矢地训练。","w":"normal","e":["原书正文"]},{"t":"【原文】必须杜绝“洋腔洋调”","y":"教材原文","p":["必须杜绝“洋腔洋调”","克服母语语音影响、掌握一种新语音系统有一定困难","尤其是掌握汉语声调，对母语没有声调的学习者来说更加困难","在语音、词汇、语法中，形成坏习惯后最难改正的就是语音"],"q":"必须杜绝“洋腔洋调”！ 克服母语语音影响、掌握一种新语音系统有一定困难。尤其是掌握汉语声调，对母语没有声调的学习者来说更加困难。在语音、词汇、语法中，形成坏习惯后最难改正的就是语音。教、学标准普通话是目标语语境教学的最大优势，必须充分利用。语音教学很难获得百分之百的效果，但教师必须尽百分之百的努力。","w":"normal","e":["原书正文"]},{"t":"【原文】2. 语音教学内容和教学","y":"教材原文","p":["2. 语音教学内容和教学方法语音教学内容包括声母、韵母、声调、音节和语调","其中声母、韵母、音节和声调的学习集中在开学的两三周内","此后，语音语调的训练贯穿整个初级阶段"],"q":"2. 语音教学内容和教学方法语音教学内容包括声母、韵母、声调、音节和语调。其中声母、韵母、音节和声调的学习集中在开学的两三周内； 此后，语音语调的训练贯穿整个初级阶段。","w":"normal","e":["原书正文"]},{"t":"【原文】集中学习语音阶段，教学包","y":"教材原文","p":["集中学习语音阶段，教学包括：展示语音，练习发音，指导发音，纠正发音","训练的具体方法就是教师展示语音，学生模仿","教师展示语音时可以适当夸张，以便学生模仿","开始学汉语的学生，有时仅靠模仿还不能较准确地捕捉发音部位和发音方法，需要通过直观方式，让他们看到不同语音的区别性特征"],"q":"集中学习语音阶段，教学包括：展示语音，练习发音，指导发音，纠正发音。训练的具体方法就是教师展示语音，学生模仿。教师展示语音时可以适当夸张，以便学生模仿。开始学汉语的学生，有时仅靠模仿还不能较准确地捕捉发音部位和发音方法，需要通过直观方式，让他们看到不同语音的区别性特征。如b和p的区别是否送气，z和j 的区别是发音部位。模仿加讲解区别，能帮助学生准确辨音发音。","w":"normal","e":["原书正文"]},{"t":"【原文】声调是汉语语音学习的难点","y":"教材原文","p":["声调是汉语语音学习的难点","第一节课就应该让学生树立汉语声调很重要的理念","教完了声母、韵母后，声调的练习、纠正成为重中之重，不能忽视","纠正语音是最重要的方法，尤其要纠正系统错误、典型错误"],"q":"声调是汉语语音学习的难点。第一节课就应该让学生树立汉语声调很重要的理念。教完了声母、韵母后，声调的练习、纠正成为重中之重，不能忽视。纠正语音是最重要的方法，尤其要纠正系统错误、典型错误。千万不要让学生的错误读音形成习惯。相应地，认辨、听辨训练就显得极为重要。认辨，写出拼音让学生读； 听辨，老师发音，让学生指出、写出、复述出这个音。","w":"normal","e":["原书正文"]}]}]},{"id":"rumen-c14","t":"第十四章 汉语综合课教学","w":"normal","s":[{"id":"rumen-c14-s01","t":"第一节 性质和特点","w":"normal","n":8,"k":[{"t":"【原文】卡丁车、集装箱车、救护车","y":"教材原文","p":["卡丁车、集装箱车、救护车、电瓶车、独轮车遇到这些词，即使不能知道其确切意思，也能知道这是一些各种各样的“车”"],"q":"卡丁车、集装箱车、救护车、电瓶车、独轮车遇到这些词，即使不能知道其确切意思，也能知道这是一些各种各样的“车”。又如：","w":"normal","e":["原书正文"]},{"t":"【原文】农村、农具、农田、农历、","y":"教材原文","p":["农村、农具、农田、农历、农谚学生遇到这些词时，可以猜到这是一些跟“农”有关系的词语"],"q":"农村、农具、农田、农历、农谚学生遇到这些词时，可以猜到这是一些跟“农”有关系的词语。","w":"normal","e":["原书正文"]},{"t":"【原文】讲练构词法，不但能提高理","y":"教材原文","p":["讲练构词法，不但能提高理解汉语词汇的能力，还可培养汉语语感，全面提高交际能力"],"q":"讲练构词法，不但能提高理解汉语词汇的能力，还可培养汉语语感，全面提高交际能力。","w":"normal","e":["原书正文"]},{"t":"【原文】3. 重视词语复现增加词","y":"教材原文","p":["3. 重视词语复现增加词语复现，让学生在不同语境中复习，可减少遗忘","一般说来，新词至少需要6~8次复现，才能初步掌握","《中级汉语精读教程》 (第二版) (赵新、李英，2010)把生词复现落实在整个教材中，包括主、副课文，词语释义、注释和练习例句"],"q":"3. 重视词语复现增加词语复现，让学生在不同语境中复习，可减少遗忘。一般说来，新词至少需要6~8次复现，才能初步掌握。《中级汉语精读教程》 (第二版) (赵新、李英，2010)把生词复现落实在整个教材中，包括主、副课文，词语释义、注释和练习例句。","w":"normal","e":["原书正文"]},{"t":"【原文】教师在教学中也应该用多种","y":"教材原文","p":["教师在教学中也应该用多种方法帮助学生复习学过的生词","例如：①讲解生词时，用已学(刚学) 词语来解释生词","利用汉语词汇的系统性，将生词跟旧词联系起来","②每一课学完后，用学过的生词给学生讲一个小故事、小笑话，或引导学生编故事"],"q":"教师在教学中也应该用多种方法帮助学生复习学过的生词。例如：①讲解生词时，用已学(刚学) 词语来解释生词； 利用汉语词汇的系统性，将生词跟旧词联系起来。②每一课学完后，用学过的生词给学生讲一个小故事、小笑话，或引导学生编故事。③根据教材内容，每上几课以后，设置一些练习，尽可能多地重现前几课学过的词语。","w":"normal","e":["原书正文"]},{"t":"【原文】4. 讲练词汇的使用条件","y":"教材原文","p":["4. 讲练词汇的使用条件学生如果只知词汇意义，不知其用法，就不会正确使用","因此，教师讲练时，必须说明词性、语法特点和句法功能，注意用多种方法介绍词语在使用中的位置、组合搭配、适用对象、句式及语用条件"],"q":"4. 讲练词汇的使用条件学生如果只知词汇意义，不知其用法，就不会正确使用。因此，教师讲练时，必须说明词性、语法特点和句法功能，注意用多种方法介绍词语在使用中的位置、组合搭配、适用对象、句式及语用条件。","w":"normal","e":["原书正文"]},{"t":"【原文】例如，“优良”只用来指事","y":"教材原文","p":["例如，“优良”只用来指事物，不用来指人","“期望”只能用于对别人，不能用来自己对自己","“增进”一般跟“了解、友谊、健康、团结”等词搭配","“从而”一般用于书面性较强的句子中，后面只能是动宾短语或兼语短语"],"q":"例如，“优良”只用来指事物，不用来指人；“期望”只能用于对别人，不能用来自己对自己；“增进”一般跟“了解、友谊、健康、团结”等词搭配； “从而”一般用于书面性较强的句子中，后面只能是动宾短语或兼语短语；“情愿”的事一般是不符合自己心愿的，表示完全符合心愿、没有勉强的时候不能用。","w":"normal","e":["原书正文"]},{"t":"【原文】5. 控制扩大词汇的度和","y":"教材原文","p":["5. 控制扩大词汇的度和量扩大词汇量，是词汇教学的需要，是学生学习、交际的需要","但是，扩大的度和量要有所考虑，不能超过学生的能力盲目扩大","词汇的扩大应注意："],"q":"5. 控制扩大词汇的度和量扩大词汇量，是词汇教学的需要，是学生学习、交际的需要。但是，扩大的度和量要有所考虑，不能超过学生的能力盲目扩大。词汇的扩大应注意：","w":"normal","e":["原书正文"]}]},{"id":"rumen-c14-s02","t":"第二节 教学内容和教学原则","w":"normal","n":8,"k":[{"t":"【原文】(1) 认读生词","y":"教材原文","p":["(1) 认读生词","教师先领读生词表中的生词，学生跟读","接着单个学生轮流认读PPT上展示的生词(不要按生词表中的顺序，按生词的词性归类展示)","教师再次领读生词，注意不能让学生机械跟读，而是尽量将学生比较熟悉或容易理解的生词串起来念，并引导学生组词成短语或组词成句，在短语或句子中理解和记忆生词的意义和用法"],"q":"(1) 认读生词。教师先领读生词表中的生词，学生跟读。接着单个学生轮流认读PPT上展示的生词(不要按生词表中的顺序，按生词的词性归类展示)。教师再次领读生词，注意不能让学生机械跟读，而是尽量将学生比较熟悉或容易理解的生词串起来念，并引导学生组词成短语或组词成句，在短语或句子中理解和记忆生词的意义和用法。如针对名词“语言 词典 围巾 钥匙”，带读时可这样进行：","w":"normal","e":["原书正文"]},{"t":"【原文】语言→一种语言、各种语言","y":"教材原文","p":["语言→一种语言、各种语言、学习语言→你会说什么语言? (让学生自由回答)词典→一本词典、汉语词典、买词典→你想买什么词典? (让学生自由回答)"],"q":"语言→一种语言、各种语言、学习语言→你会说什么语言? (让学生自由回答)词典→一本词典、汉语词典、买词典→你想买什么词典? (让学生自由回答)","w":"normal","e":["原书正文"]},{"t":"【原文】围巾→一条围巾、红围巾、","y":"教材原文","p":["围巾→一条围巾、红围巾、戴围巾→今天谁戴围巾了? (让学生回答)钥匙→一把钥匙、一串钥匙 (教师展示实物)、找钥匙、忘了带钥匙→教师演示“找钥匙”，并问学生“老师找什么”，引导学生说出“老师找钥匙”"],"q":"围巾→一条围巾、红围巾、戴围巾→今天谁戴围巾了? (让学生回答)钥匙→一把钥匙、一串钥匙 (教师展示实物)、找钥匙、忘了带钥匙→教师演示“找钥匙”，并问学生“老师找什么”，引导学生说出“老师找钥匙”。","w":"normal","e":["原书正文"]},{"t":"【原文】(2) 讲练部分重点生词","y":"教材原文","p":["(2) 讲练部分重点生词","如通过师生问答讲解形容词“用功、仔细”，通过例句讲解动词兼名词“经过、建议”，通过动作及图片讲解动词兼形容词“低”，通过情景讲解“顺”"],"q":"(2) 讲练部分重点生词。如通过师生问答讲解形容词“用功、仔细”，通过例句讲解动词兼名词“经过、建议”，通过动作及图片讲解动词兼形容词“低”，通过情景讲解“顺”。","w":"normal","e":["原书正文"]},{"t":"【原文】(3) 巩固生词","y":"教材原文","p":["(3) 巩固生词","全班同学再次朗读一遍生词，然后完成练习册中的“选词填空”练习"],"q":"(3) 巩固生词。全班同学再次朗读一遍生词，然后完成练习册中的“选词填空”练习。","w":"normal","e":["原书正文"]},{"t":"【原文】不过，仅依靠生词表的学习","y":"教材原文","p":["不过，仅依靠生词表的学习还不能全面掌握所学词语","教师要善于结合语言点和课文的学习，进一步帮助学生理解和记忆生词，并引导学生正确使用生词"],"q":"不过，仅依靠生词表的学习还不能全面掌握所学词语。教师要善于结合语言点和课文的学习，进一步帮助学生理解和记忆生词，并引导学生正确使用生词。","w":"normal","e":["原书正文"]},{"t":"【原文】(二) 中高级阶段的生词","y":"教材原文","p":["(二) 中高级阶段的生词讲练中高级阶段，课文长，生词多，学生难以在短时间内掌握所有生词的意思和用法"],"q":"(二) 中高级阶段的生词讲练中高级阶段，课文长，生词多，学生难以在短时间内掌握所有生词的意思和用法。","w":"normal","e":["原书正文"]},{"t":"【原文】教师可以将课文切分为意义","y":"教材原文","p":["教师可以将课文切分为意义相对完整的两三个部分进行教学","生词表的学习也可相应切分，安排在不同课时完成","生词表教学中，不一定逐个讲练生词，而是有选择、有针对性地教学","可以指导学生正确辨识生词的形和音，并通过多种方式引导学生了解生词的意义"],"q":"教师可以将课文切分为意义相对完整的两三个部分进行教学； 生词表的学习也可相应切分，安排在不同课时完成。生词表教学中，不一定逐个讲练生词，而是有选择、有针对性地教学。可以指导学生正确辨识生词的形和音，并通过多种方式引导学生了解生词的意义。简单的常用词语，可在这一环节进行讲解和扩展搭配； 某些难词，在生词环节讲基本意思，课文讲练时再结合语境进一步讲解、练习； 少","w":"normal","e":["原书正文"]}]},{"id":"rumen-c14-s03","t":"第三节 教学环节和教学方法","w":"normal","n":8,"k":[{"t":"【原文】10. 举例说明在综合课","y":"教材原文","p":["10. 举例说明在综合课的课堂上，如何通过练习帮助学生掌握并运用所学生词或语第十四章 汉语综合课教学 395言点"],"q":"10. 举例说明在综合课的课堂上，如何通过练习帮助学生掌握并运用所学生词或语第十四章 汉语综合课教学 395言点。","w":"normal","e":["原书正文"]},{"t":"【原文】12. 下面是《初级汉语"
