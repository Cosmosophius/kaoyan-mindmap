<!DOCTYPE html>
<html lang="zh-CN">
<head>

<script>(function(){try{var t=localStorage.getItem("theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(_){}})();</script>
<style>
/* ============================================================
   M3 配色：种子色 0xFF28C840（TreeChat ThemePalette.DEFAULT_GREEN）
   用 OKLCH 复现 HCT Tonal Spot 映射，深色主题下
   primary=tone80 / primaryContainer=tone30 / surface=tone6 这一套配对
   ============================================================ */
:root{
  /* ---------- 温暖手账质感配色 (Warm Journal Paper & Morandi Notes) ---------- */
  --h:85;

  /* 根卡：复古焦糖书皮手账 */
  --primary:            oklch(52% 0.11 55);
  --on-primary:         oklch(98% 0.01 55);
  --primary-container:  oklch(90.5% 0.042 60);
  --on-primary-cont:    oklch(26% 0.08 50);

  /* 章节卡：莫兰迪鼠尾草植物绿便签 */
  --secondary:          oklch(56% 0.08 140);
  --on-secondary:       oklch(98% 0.01 140);
  --secondary-container:oklch(91.8% 0.035 140);
  --on-secondary-cont:  oklch(25% 0.06 140);

  /* 小节卡：莫兰迪暖杏奶白便签 */
  --tertiary:           oklch(62% 0.07 75);
  --tertiary-container: oklch(93.8% 0.028 75);
  --on-tertiary-cont:   oklch(28% 0.06 65);

  /* 真题高频：复古麦穗金高亮便签 */
  --gold:               oklch(68% 0.16 85);
  --gold-container:     oklch(92.5% 0.08 88);

  /* 纸张底色：温暖象牙米白和纸（护眼哑光不刺眼） */
  --surface:            oklch(96.8% 0.016 88);
  --sc-lowest:          oklch(98.5% 0.008 88);
  --sc-low:             oklch(95.5% 0.018 88);
  --sc:                 oklch(94.2% 0.020 88);
  --sc-high:            oklch(92.0% 0.024 88);
  --sc-highest:         oklch(88.5% 0.028 88);

  /* 墨水文字色：浓郁复古钢笔墨水棕黑（极具手写温度） */
  --on-surface:         oklch(22% 0.025 55);
  --on-surface-var:     oklch(46% 0.035 55);
  --outline:            oklch(76% 0.030 80);
  --outline-var:        oklch(86% 0.020 85);

  /* Shape.kt：4/8/12/16/28 */
  --r-xs:4px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:28px;

  /* Compose MotionScheme 对应曲线 */
  --ease-standard: cubic-bezier(0.2,0,0,1);
  --ease-emphasized: cubic-bezier(0.05,0.7,0.1,1);
}

/* ---------- 暗色模式：复古深黛皮革手账 (Dark Leather Journal) ---------- */
[data-theme="dark"]{
  --primary:            oklch(76% 0.14 55);
  --on-primary:         oklch(20% 0.06 55);
  --primary-container:  oklch(30% 0.08 55);
  --on-primary-cont:    oklch(92% 0.05 55);

  --secondary:          oklch(78% 0.08 140);
  --on-secondary:       oklch(20% 0.04 140);
  --secondary-container:oklch(32% 0.05 140);
  --on-secondary-cont:  oklch(92% 0.03 140);

  --tertiary:           oklch(80% 0.09 75);
  --tertiary-container: oklch(32% 0.06 75);
  --on-tertiary-cont:   oklch(93% 0.04 75);

  --gold:               oklch(85% 0.15 85);
  --gold-container:     oklch(34% 0.08 85);

  --surface:            oklch(14% 0.015 60);
  --sc-lowest:          oklch(11% 0.012 60);
  --sc-low:             oklch(16% 0.016 60);
  --sc:                 oklch(19% 0.018 60);
  --sc-high:            oklch(23% 0.020 60);
  --sc-highest:         oklch(28% 0.024 60);

  --on-surface:         oklch(93% 0.012 85);
  --on-surface-var:     oklch(78% 0.022 85);
  --outline:            oklch(52% 0.025 75);
  --outline-var:        oklch(32% 0.018 70);
}
[data-theme="dark"] #grid{
  background-image:radial-gradient(circle, color-mix(in oklch, var(--outline) 30%, transparent) 1.2px, transparent 1.2px);
}
[data-theme="dark"] .card{
  box-shadow:0 1px 3px rgba(0,0,0,.35), 0 4px 12px rgba(0,0,0,.25);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--surface);}
body{
  font-family:-apple-system,"HarmonyOS Sans SC","Noto Sans CJK SC","Source Han Sans SC",
              "PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--on-surface);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}

/* ---------- 画布舞台 ---------- */
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:var(--surface);}
#stage.dragging{cursor:grabbing;}

/* 点阵背景：28px 手账点阵纸，跟随平移但不参与缩放重绘 */
#grid{
  position:absolute;inset:-72px;
  background-image:radial-gradient(circle, color-mix(in oklch, var(--outline) 40%, transparent) 1.2px, transparent 1.2px);
  background-size:28px 28px;
  will-change:transform;
  pointer-events:none;
}

/* 唯一合成层：所有平移缩放都只改这一层的 transform，不触发重排 */
#world{
  position:absolute;left:0;top:0;
  transform-origin:0 0;
  will-change:transform;
  backface-visibility:hidden;
}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;}
#edges path{
  fill:none;stroke-linecap:round;stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
}
#nodes{position:absolute;left:0;top:0;display:flex;align-items:flex-start;}
/* 嵌套 flex 树：对齐交给浏览器，JS 不再计算坐标 */
.tn{display:flex;align-items:center;}
.tc{flex:none;position:relative;}
.tk{display:flex;flex-direction:column;}

/* ---------- 卡片：实体手账便签质感 ---------- */
.card{
  position:relative;
  box-sizing:border-box;          /* 让 COL_W 是含 padding 的实际宽度 */
  border-radius:var(--r-md);
  background:var(--sc-high);
  border:1px solid color-mix(in oklch, var(--outline-var) 85%, transparent);
  padding:3px 7px;
  box-shadow:0 1px 2px rgba(90, 75, 60, 0.08), 0 3px 8px rgba(90, 75, 60, 0.05);
  will-change:transform,opacity;
  contain:layout style;
  transform-origin:0 50%;         /* 树向右生长：从左侧顶点长出 */
  transition:width .26s var(--ease-emphasized),
             background .18s var(--ease-standard),
             border-color .18s var(--ease-standard),
             box-shadow .22s var(--ease-standard),
             transform .14s var(--ease-standard);
}
.card:active{
  transform:scale(0.985);
}
/* 便签轻微抬升效果 */
@media (hover:hover) and (pointer:fine){
  .card:hover{
    box-shadow:0 3px 8px rgba(90, 75, 60, 0.12), 0 8px 18px rgba(90, 75, 60, 0.08);
    border-color:color-mix(in oklch,var(--outline) 65%, var(--outline-var));
  }
}
/* 键盘可达性：MD3 focus ring */
.card:focus-visible{
  outline:2px solid var(--primary);
  outline-offset:2px;
}
/* 分页哨兵：虚线胶囊 */
.card.more{
  background:transparent;
  border:1px dashed color-mix(in oklch,var(--primary) 42%, var(--outline-var));
  box-shadow:none;
  padding:6px 10px;
}
.card.more .label{
  color:var(--primary);font-size:12px;font-weight:600;
  -webkit-line-clamp:1;text-align:center;letter-spacing:.02em;
}
.card.more:hover{background:color-mix(in oklch,var(--primary) 9%, transparent);}
/* 量宽态：label 强制单行 nowrap，让 max-content 能得到真实文本宽度。
   量完立刻移除，用户看不到这一帧。 */
.card.measuring{width:max-content!important;max-width:none!important;}
.card.measuring .label{
  display:block!important;-webkit-line-clamp:unset!important;
  white-space:nowrap!important;overflow:visible!important;flex:none!important;
}
.card.root{
  border-radius:14px;
  background:var(--primary-container);
  border:1.5px solid var(--primary);
  box-shadow:0 4px 14px rgba(70, 45, 25, 0.16), inset 0 1px 0 rgba(255,255,255,0.45);
  padding:10px 13px;
}
.card.chapter{
  background:var(--secondary-container);
  border-color:var(--secondary);
  box-shadow:inset 3px 0 0 var(--secondary), 0 2px 8px rgba(80, 65, 50, 0.08);
}
.card.section{
  background:var(--tertiary-container);
  position:relative;
  border-color:color-mix(in oklch, var(--tertiary) 45%, var(--outline-var));
  box-shadow:inset 3px 0 0 var(--tertiary), 0 1px 4px rgba(80, 65, 50, 0.06);
}
/* section 的两个操作按钮改为「悬停浮现」：绝对定位到卡片右缘外侧，
   不占文档流宽度。实测它们常驻时占 36px，25 张 section 卡合计 900px，
   而 win/doc 属于低频操作，常驻显示纯属浪费面积。 */
.card.section .ibtn.act{
  position:absolute;top:50%;transform:translateY(-50%);
  opacity:0;pointer-events:none;
  background:var(--sc-highest);
  box-shadow:0 1px 3px rgba(0,0,0,.45);
  transition:opacity .16s var(--ease-standard),background .16s var(--ease-standard);
}
.card.section .ibtn.act[data-act="win"]{ right:-19px; }
.card.section .ibtn.act[data-act="para"]{ right:-37px; }
@media (hover:hover) and (pointer:fine){
  .card.section:hover .ibtn.act,
  .card.section:focus-within .ibtn.act{ opacity:1;pointer-events:auto; }
}
/* 触屏没有 hover，直接常驻显示（否则按钮永远点不到） */
@media (hover:none){
  .card.section .ibtn.act{ opacity:.85;pointer-events:auto;position:static;transform:none;right:auto;box-shadow:none;background:transparent; }
}
.card.kp{
  background:var(--sc);
  padding:2px 5px;
  border-color:color-mix(in oklch,var(--outline-var) 70%,transparent);
  box-shadow:none;
}
.card.kp.hot{
  background:var(--gold-container);
  border-color:var(--gold);
}
/* 真题高频：左侧 2px 金色竖条。
   原来用「真题」文字徽标，36px × 3,229 张 = 116,244px，
   占 kp 卡全部装饰宽度的 76.3%。竖条横向不占位，颜色同样能一眼分辨。 */
.card.kp.hot::before{
  content:"";position:absolute;left:0;top:3px;bottom:3px;width:2px;
  border-radius:2px;background:var(--gold);
}

.row{display:flex;align-items:center;gap:2px;}
.label{
  flex:1;min-width:0;
  overflow:hidden;
  /* 两行截断：中文标题不再被压成一行省略号 */
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  white-space:normal;
  word-break:break-word;
  line-height:1.18;
  font-weight:500;letter-spacing:0;
}
.card.root .label{font-size:15px;font-weight:700;color:var(--on-primary-cont);letter-spacing:.02em;}
.card.chapter .label{font-size:13px;font-weight:700;color:var(--on-secondary-cont);}
.card.section .label{font-size:12.5px;font-weight:600;}
.card.kp .label{font-size:13px;font-weight:500;}

.badge{
  flex:none;font-size:8.5px;line-height:1;padding:0 3px;border-radius:var(--r-xs);
  background:var(--tertiary-container);color:var(--on-tertiary-cont);
  letter-spacing:.02em;font-weight:600;
}
.badge.gold{background:var(--gold-container);color:var(--gold);}

/* 纯矢量图标按钮（无 emoji） */
.ibtn{
  flex:none;width:16px;height:16px;border:0;border-radius:50%;
  background:transparent;color:var(--on-surface-var);
  display:grid;place-items:center;cursor:pointer;
  transition:background .16s var(--ease-standard),color .16s var(--ease-standard);
}
.ibtn:hover{background:color-mix(in oklch,var(--on-surface) 10%,transparent);}
.ibtn:active{background:color-mix(in oklch,var(--on-surface) 16%,transparent);}
.ibtn svg{width:16px;height:16px;display:block;}
.ibtn.chev svg{transition:transform .22s var(--ease-standard);}
.card.open > .row > .ibtn.chev svg{transform:rotate(90deg);}

/* 详情行：随 LOD 淡出（源码 tween 180ms，阈值 scale 0.65） */
/* 详情行默认折叠：3,618 张知识点卡片若全部展开要点行，
   画布高度会被放大 3~4 倍，且低缩放下只是 opacity:0 —— 看不见却占着高度。
   现在默认只显示标题，点击才展开。 */
.detail{display:none;}
.card.open > .detail{
  display:block;
  margin-top:4px;font-size:11px;line-height:1.5;color:var(--on-surface-var);
  animation: detailDropIn .22s var(--ease-emphasized) forwards;
  transform-origin: top;
}
@keyframes detailDropIn{
  from{ opacity:0; transform:translateY(-4px); }
  to  { opacity:1; transform:translateY(0); }
}

/* 商业级题型微胶囊标签（Micro Capsule Tag） */
.tag-type{
  display:inline-flex; align-items:center;
  font-size:9.5px; font-weight:600; line-height:1;
  padding:2px 6px; border-radius:10px;
  background:color-mix(in oklch,var(--outline-var) 45%,transparent);
  color:var(--on-surface-var);
  margin-right:4px;
}
.tag-type.hot{
  background:var(--gold-container);
  color:oklch(38% 0.12 85);
  box-shadow:0 1px 2px rgba(180, 140, 40, 0.12);
}
[data-theme="dark"] .tag-type.hot{
  color:var(--gold);
}

.detail .pt{display:flex;gap:6px;margin-top:2px;}
.detail .pt::before{
  content:"";flex:none;width:3px;height:3px;border-radius:50%;
  background:var(--primary);margin-top:8px;
}
.card.kp.hot .detail .pt::before{background:var(--gold);}
.detail .quote{
  margin-top:6px;padding:6px 8px;border-radius:var(--r-sm);
  background:color-mix(in oklch,var(--on-surface) 5%,transparent);
  color:color-mix(in oklch,var(--on-surface) 72%,transparent);
  font-size:11px;line-height:1.6;
  border-left:2px solid var(--outline-var);
}
/* 正文：展开后直接在画布内变宽变高，弹性滑入展开 */
.para{
  margin-top:10px;padding-top:10px;
  border-top:1px dashed color-mix(in oklch,var(--outline-var) 85%,transparent);
  font-size:12.5px;line-height:1.9;
  color:color-mix(in oklch,var(--on-surface) 88%,transparent);
  max-height:min(520px, 62vh);
  overflow-y:auto;overscroll-behavior:contain;
  user-select:text;cursor:text;
  text-align:justify;text-justify:inter-ideograph;
  hanging-punctuation:allow-end;
  animation: paraSpringIn .28s var(--ease-emphasized) forwards;
  transform-origin: top;
}
@keyframes paraSpringIn{
  from{ opacity:0; transform:scaleY(0.9) translateY(-8px); }
  to  { opacity:1; transform:scaleY(1) translateY(0); }
}

/* 手账荧光笔高亮划线（Journal Highlighter Mark） */
.hl-quote{
  background:linear-gradient(180deg, transparent 40%, rgba(254, 230, 150, 0.55) 40%);
  border-radius:2px; padding:0 2px;
  font-weight:600;
  color:var(--on-surface);
}
[data-theme="dark"] .hl-quote{
  background:linear-gradient(180deg, transparent 40%, rgba(212, 160, 40, 0.35) 40%);
}
.para p{
  margin-bottom:10px;
  text-indent:2em;                /* 中文首行缩进 */
  padding-left:34px;              /* 给悬挂的段号留位 */
  text-indent:0;
}
.para p:first-child{margin-top:2px;}
.para .pid{
  display:inline-block;width:30px;margin-left:-34px;
  font-size:9.5px;color:var(--outline);
  font-variant-numeric:tabular-nums;
  vertical-align:baseline;
}
/* 继续加载按钮 */
.para-more{
  display:block;width:100%;margin:10px 0 2px;
  padding:9px 12px;border-radius:var(--r-sm);
  border:1px dashed color-mix(in oklch,var(--primary) 45%, var(--outline-var));
  background:transparent;color:var(--primary);
  font-size:12px;font-weight:600;cursor:pointer;
  font-family:inherit;
  transition:background .16s var(--ease-standard);
}
.para-more:hover{background:color-mix(in oklch,var(--primary) 10%, transparent);}
.para-more:active{background:color-mix(in oklch,var(--primary) 18%, transparent);}

/* ---- 紧凑模式（小屏）---- */
.compact .card{padding:9px 11px;border-radius:10px;}
.compact .card.root .label{font-size:15.5px;}
.compact .card.chapter .label{font-size:13.5px;}
.compact .card.section .label{font-size:13px;}
.compact .card.kp .label{font-size:12.5px;}
.compact .para{font-size:12px;line-height:1.82;max-height:min(440px,58vh);}
.compact .row{gap:6px;}
.compact .badge{font-size:9px;padding:2px 5px;}
.tiny .card{padding:8px 10px;}
.tiny .ibtn{width:22px;height:22px;}
.tiny .ibtn svg{width:14px;height:14px;}
.para::-webkit-scrollbar{width:4px;}
.para::-webkit-scrollbar-thumb{background:var(--outline-var);border-radius:2px;}

/* ---------- 侧边停靠坞（复刻 TreeChat WindowDockBar） ---------- */
#dock{position:fixed;inset:0;pointer-events:none;z-index:9000;}
.dockpin{
  position:absolute;pointer-events:auto;
  display:flex;align-items:center;gap:6px;
  padding:8px 9px;max-width:210px;
  background:var(--sc-high);
  border:1px solid var(--outline-var);
  box-shadow:0 3px 10px rgba(0,0,0,.45);
  cursor:grab;touch-action:none;user-select:none;
  transition:box-shadow .16s var(--ease-standard),transform .16s var(--ease-standard);
}
.dockpin:active{cursor:grabbing;}
.dockpin.dragging{box-shadow:0 9px 24px rgba(0,0,0,.62);transform:scale(.96);}
/* 贴边那侧方、靠内侧两角圆，视觉上"挂"在屏幕边缘 */
.dockpin.right{right:0;border-radius:16px 0 0 16px;border-right:0;}
.dockpin.left {left:0; border-radius:0 16px 16px 0;border-left:0;}
.dockpin svg{flex:none;width:12px;height:12px;display:block;}
.dockpin .dp-t{
  font-size:11.5px;font-weight:600;color:var(--on-surface);
  max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dockpin .dp-x{
  flex:none;width:18px;height:18px;padding:0;border:0;border-radius:50%;
  background:transparent;color:var(--on-surface-var);
  display:grid;place-items:center;cursor:pointer;
  transition:background .16s var(--ease-standard);
}
.dockpin .dp-x:hover{background:color-mix(in oklch,var(--on-surface) 14%,transparent);}
.dockpin .dp-x svg{width:10px;height:10px;}

/* ---------- 顶栏：手账封顶与书签标签 ---------- */
#topbar{
  position:fixed;left:0;right:0;top:0;z-index:20;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
  background:color-mix(in oklch,var(--surface) 90%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid color-mix(in oklch,var(--outline-var) 80%,transparent);
  box-shadow:0 1px 4px rgba(80, 65, 50, 0.05);
  display:flex;flex-direction:column;gap:9px;
  transition:transform .26s var(--ease-emphasized);
}
#topbar.hide{transform:translateY(-100%);}
.tb-row{display:flex;align-items:center;gap:10px;}
.tb-title{
  font-size:15px;font-weight:700;letter-spacing:.02em;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#books{
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  padding-bottom:2px;-webkit-overflow-scrolling:touch;
}
#books::-webkit-scrollbar{display:none;}
.chip{
  flex:none;border:1px solid color-mix(in oklch,var(--outline-var) 85%,transparent);border-radius:var(--r-sm);
  background:var(--sc-lowest);color:var(--on-surface-var);
  padding:6px 12px;font-size:12.5px;font-weight:500;white-space:nowrap;cursor:pointer;
  box-shadow:0 1px 2px rgba(80, 65, 50, 0.04);
  transition:background .2s var(--ease-standard),color .2s var(--ease-standard),border-color .2s var(--ease-standard),box-shadow .2s var(--ease-standard);
}
.chip.on{
  background:var(--secondary-container);color:var(--on-secondary-cont);
  border-color:var(--secondary);font-weight:700;
  box-shadow:0 2px 6px rgba(80, 65, 50, 0.08);
}

/* ---------- 右下工具列 ---------- */
#tools{
  position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:20;
  display:flex;flex-direction:column;gap:10px;
}
.fab{
  width:44px;height:44px;border:1px solid color-mix(in oklch,var(--outline-var) 80%,transparent);border-radius:var(--r-lg);
  background:var(--sc-lowest);color:var(--on-surface);
  display:grid;place-items:center;cursor:pointer;
  box-shadow:0 2px 6px rgba(80, 65, 50, 0.09), 0 6px 16px rgba(80, 65, 50, 0.05);
  transition:background .18s var(--ease-standard),transform .18s var(--ease-emphasized),box-shadow .18s var(--ease-standard);
}
.fab:active{transform:scale(.92);}
.fab svg{width:20px;height:20px;display:block;}
.fab.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary);}

/* ---------- 加载态 ---------- */
#hint{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);
  transform:translateX(-50%);z-index:15;
  padding:8px 16px;border-radius:var(--r-xl);
  background:var(--sc-highest);color:var(--on-surface-var);
  font-size:12px;white-space:nowrap;
  transition:opacity .4s var(--ease-standard);
  pointer-events:none;
}
#hint.gone{opacity:0;}

/* ============================================================
   悬浮小窗（FloatingWindowCard.kt / FloatingWindowManager.kt 复刻）
   小窗 16dp 圆角 + 阴影；真全屏 / 画布伪全屏一律 radius 0、elevation 0
   ============================================================ */
.win{
  position:fixed; left:0; top:0; z-index:40;
  display:flex; flex-direction:column;
  width:400px; height:520px;
  background:var(--sc-high);
  border:1px solid var(--outline-var);
  border-radius:16px;
  box-shadow:0 20px 44px rgba(0,0,0,.52), 0 4px 12px rgba(0,0,0,.34);
  overflow:hidden;
  will-change:transform,opacity;
  contain:layout style;
  transform-origin:50% 50%;
}
.win.full,.win.canvas-full{
  border-radius:0; border-width:0; box-shadow:none;
}

/* 真全屏：元素进入浏览器 top layer，直接铺满物理屏幕。
   这里用 !important 压过 applyWin() 每帧写的 inline transform / width / height，
   否则 JS 的弹簧会把全屏元素又缩回窗口尺寸。 */
.win:fullscreen,
.win:-webkit-full-screen{
  left:0!important; top:0!important;
  width:100%!important; height:100%!important;
  transform:none!important;
  border-radius:0!important; border-width:0!important;
  box-shadow:none!important;
  background:var(--sc-low);
}
.win:fullscreen .rz,
.win:-webkit-full-screen .rz{display:none;}
.win:fullscreen .win-title,
.win:-webkit-full-screen .win-title{cursor:default;}

/* 标题栏 46dp：拖动把手 + 双击进真全屏 */
.win-title{
  flex:none; height:46px;
  display:flex; align-items:center; gap:6px;
  padding:0 10px;
  background:var(--sc-highest);
  border-bottom:1px solid var(--outline-var);
  cursor:grab; touch-action:none; user-select:none;
}
.win-title:active{cursor:grabbing;}
.win.full .win-title,.win.canvas-full .win-title{cursor:default;}
.win-title .t{
  flex:1; min-width:0; font-size:13px; font-weight:600;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.win-title .ibtn{width:28px;height:28px;}
.win-title .ibtn svg{width:16px;height:16px;}
.win-title .ibtn.on{background:var(--primary-container);color:var(--on-primary-cont);}

/* 左上角四个 macOS 风格圆点（关闭 / 收起 / 画布全屏 / 真全屏） */
.win-dots{
  flex:none; display:flex; align-items:center; gap:7px;
  margin-right:6px; padding-left:2px;
}
.dot{
  width:11px; height:11px; padding:0; border:0; border-radius:50%;
  cursor:pointer; flex:none;
  transition:transform .16s var(--ease-standard),
             filter .16s var(--ease-standard),
             box-shadow .16s var(--ease-standard);
}
.dot:hover{transform:scale(1.2);filter:brightness(1.18);}
.dot:active{transform:scale(.9);}
.dot-close {background:oklch(68% 0.19 25);}
.dot-min   {background:oklch(82% 0.16 85);}
.dot-canvas{background:oklch(76% 0.15 150);}
.dot-full  {background:oklch(72% 0.14 235);}
.dot.on{box-shadow:0 0 0 2px color-mix(in oklch,var(--on-surface) 60%,transparent);}

/* 收起：只留标题栏 */
.win.collapsed .win-body{display:none;}
.win.collapsed .rz{display:none;}
.win.collapsed{box-shadow:0 8px 22px rgba(0,0,0,.5);}

/* 内容区 */
.win-body{
  flex:1; min-height:0;
  overflow-y:auto; overscroll-behavior:contain;
  padding:12px 14px 20px;
  user-select:text; cursor:text;
  -webkit-overflow-scrolling:touch;
}
.win-body::-webkit-scrollbar{width:5px;}
.win-body::-webkit-scrollbar-thumb{background:var(--outline-var);border-radius:3px;}
.win-body h4{
  font-size:11.5px; font-weight:700; color:var(--primary);
  margin:14px 0 8px; letter-spacing:.06em;
}
.win-body h4:first-child{margin-top:2px;}
.win-body .para p{
  margin-bottom:9px; font-size:13px; line-height:1.86;
  color:color-mix(in oklch,var(--on-surface) 88%,transparent);
}
.win-body .para .pid{
  font-size:10px; color:var(--outline); margin-right:6px;
  font-variant-numeric:tabular-nums;
}
.win-body .kpitem{
  border:1px solid var(--outline-var); border-radius:10px;
  padding:9px 11px; margin-bottom:9px; background:var(--sc);
}
.win-body .kpitem.hot{background:var(--gold-container);border-color:var(--gold);}
.win-body .kpitem .kt{
  font-size:13px; font-weight:700; margin-bottom:6px;
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
}
.win-body .kpitem .ky{
  font-size:10px; padding:2px 6px; border-radius:4px; font-weight:600;
  background:var(--tertiary-container); color:var(--on-tertiary-cont);
}
.win-body .kpitem.hot .ky{background:var(--gold-container);color:var(--gold);}
.win-body .kpitem .kp-pt{
  font-size:12px; line-height:1.72; color:var(--on-surface-var);
  display:flex; gap:6px; margin-top:3px;
}
.win-body .kpitem .kp-pt::before{
  content:""; flex:none; width:3px; height:3px; border-radius:50%;
  background:var(--primary); margin-top:7px;
}
.win-body .kpitem.hot .kp-pt::before{background:var(--gold);}
.win-body .loading{color:var(--outline);font-size:12.5px;}

/* 边缘缩放热区：右 8dp / 下 8dp / 右下角 16dp（源码热区收窄避免吃掉选词） */
.rz{position:absolute;z-index:3;touch-action:none;}
.rz-r{top:48px;bottom:32px;right:0;width:8px;cursor:ew-resize;}
.rz-b{left:32px;right:32px;bottom:0;height:8px;cursor:ns-resize;}
.rz-c{right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;}
.rz::after{
  content:"";position:absolute;background:var(--outline);
  opacity:0;transition:opacity .16s var(--ease-standard);
}
.rz-r::after{right:3px;top:50%;transform:translateY(-50%);width:3px;height:28px;border-radius:1.5px;}
.rz-b::after{bottom:3px;left:50%;transform:translateX(-50%);height:3px;width:28px;border-radius:1.5px;}
.rz-c::after{right:6px;bottom:6px;width:10px;height:10px;border-radius:2px;}
.win:hover .rz::after{opacity:.55;}
.win.full .rz,.win.canvas-full .rz{display:none;}

/* 吸附预览：Windows 同款影子，从窗口当前位置长出来 */
#snapGhost{
  position:fixed; z-index:38; pointer-events:none;
  border:1.5px solid var(--primary);
  background:color-mix(in oklch,var(--primary) 15%,transparent);
  border-radius:16px; opacity:0;
  transition:opacity .16s var(--ease-standard),
    left .22s var(--ease-emphasized), top .22s var(--ease-emphasized),
    width .22s var(--ease-emphasized), height .22s var(--ease-emphasized);
}
#snapGhost.on{opacity:1;}

/* ---------- 离线包状态胶囊 ---------- */
#pwaChip{
  position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);
  z-index:44; display:flex; align-items:center; gap:8px;
  padding:8px 16px 8px 12px;
  border-radius:var(--r-full);
  background:var(--sc-high); color:var(--on-surface-var);
  border:1px solid var(--outline-var);
  box-shadow:0 2px 6px rgba(0,0,0,.36), 0 8px 24px rgba(0,0,0,.30);
  font-size:12px; line-height:1;
  pointer-events:none;
  opacity:0; transition:opacity .28s var(--ease-standard),
                          transform .28s var(--ease-emphasized);
}
#pwaChip.on{opacity:1;}
#pwaChip[hidden]{display:none;}
#pwaChip .pwa-ico{display:flex;width:16px;height:16px;flex:none;}
#pwaChip .pwa-ico svg{width:16px;height:16px;display:block;}
#pwaChip.ready{color:var(--primary);border-color:color-mix(in oklch,var(--primary) 40%,transparent);}
#pwaChip.offline{color:var(--tertiary);border-color:color-mix(in oklch,var(--tertiary) 45%,transparent);}

/* ---------- 缩放指示 ---------- */
#zoomPct{
  position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom) + 118px);z-index:20;
  font-size:11px;font-variant-numeric:tabular-nums;color:var(--on-surface-var);
  background:var(--sc-lowest);border:1px solid color-mix(in oklch,var(--outline-var) 80%,transparent);border-radius:var(--r-sm);
  padding:2px 8px;pointer-events:none;
  box-shadow:0 1px 3px rgba(80,65,50,0.06);
}

/* ---------- 搜索面板：手账收纳抽屉 ---------- */
#searchPanel{
  position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);
  width:min(560px,calc(100vw - 32px));max-height:60vh;z-index:40;
  background:var(--sc-lowest);border:1px solid color-mix(in oklch,var(--outline-var) 80%,transparent);border-radius:var(--r-lg);
  box-shadow:0 12px 32px rgba(80,65,50,0.14), 0 2px 6px rgba(80,65,50,0.08);display:flex;flex-direction:column;overflow:hidden;
}
#searchPanel[hidden]{display:none;}
#searchInput{
  background:transparent;border:0;border-bottom:1px solid color-mix(in oklch,var(--outline-var) 80%,transparent);
  color:var(--on-surface);font-size:15px;padding:14px 16px;outline:none;
}
#searchList{overflow:auto;padding:6px;}
.sr{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;}
.sr:hover{background:var(--sc-high);}
.sr b{font-size:13px;font-weight:600;color:var(--on-surface);}
.sr span{font-size:11px;color:var(--on-surface-var);}

/* ---------- 面包屑：手账书签便签条 ---------- */
#crumbs{
  position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:15;
  display:flex;gap:6px;align-items:center;max-width:calc(100vw - 120px);
  font-size:12px;color:var(--on-surface-var);overflow:hidden;
  background:color-mix(in oklch,var(--surface) 92%,transparent);
  padding:4px 8px;border-radius:var(--r-sm);
  border:1px solid color-mix(in oklch,var(--outline-var) 80%,transparent);
  box-shadow:0 1px 3px rgba(80,65,50,0.05);
}
#crumbs button{
  background:transparent;border:0;color:inherit;font:inherit;cursor:pointer;
  padding:2px 4px;border-radius:4px;white-space:nowrap;
}
#crumbs button:hover{background:var(--sc-high);}
#crumbs .sep{opacity:.4;flex:none;}

/* ---------- 小屏适配 ---------- */
@media (max-width:600px){
  .tb-title{font-size:14px;}
  .chip{padding:5px 9px;font-size:12px;}
  .fab{width:40px;height:40px;border-radius:12px;}
  #tools{gap:8px;right:10px;}
  #crumbs{font-size:11px;max-width:calc(100vw - 96px);}
  #zoomPct{bottom:calc(env(safe-area-inset-bottom) + 106px);}
}
</style>

"w":"normal","e":[]}]}]},{"id":"culture-c05","t":"第五章 汉字","w":"high","s":[{"id":"culture-c05-s01","t":"第一节 汉字形体演变","w":"normal","n":4,"k":[{"t":"金文","y":"名词解释","p":["铸刻于青铜器、又称钟鼎文","盛行商周、西周为盛","笔画肥厚圆润、较甲骨文规范"],"q":"最早的汉字是甲骨文和金文。所谓“甲骨文”就是刻在龟甲和兽骨上的文字，据说是清光绪二十五年(1899年) 由清朝的金石学家王懿荣等首先发现的，出土地点在今河南省安阳市小屯村。在此以前，人们不认识这些甲骨上的","w":"normal","e":[]},{"t":"小篆","y":"名词解释","p":["秦统一后推行的标准字体","李斯整理、由大篆简化","笔画圆转匀称、结构整齐","第一次汉字规范化"],"q":"到三国魏正始二年(241年)又刻《尚书》《春秋》《左传》等约27块石碑，立于洛阳南郊太学前，因经文用古文、小篆和汉隶三种字体写成，又叫“正始石经”或“三体石经”。","w":"normal","e":[]},{"t":"甲骨文","y":"名词解释","p":["刻于龟甲兽骨的占卜文字","现存最早的成体系汉字","安阳殷墟、商代后期","1899年王懿荣发现"],"q":"商代甲骨文和周代钟鼎文,已见 “一” “二” “三” “四” “五” “六” “七” “八” “九”“十”“百”“千”“万”十三个数字记数，而《尚书》中也屡见“亿”“兆”等数，足见我们的祖先对十进制的运用已非常熟练。","w":"normal","e":[]},{"t":"石鼓文","y":"名词解释","p":["刻于十面鼓形石上","春秋战国秦国文字","现存最早石刻文字、石刻之祖"],"q":"(西周晚期)、《石鼓文》(春秋时期)、《泰山刻石》(秦代) 等，由于当时艺术创作的自觉性还没有形成，审美风尚还没有出现，书法理论还没有萌发，所以只能算是书法艺术产生阶段的作品。","w":"normal","e":[]}]},{"id":"culture-c05-s02","t":"第二节 六书与汉字结构","w":"high","n":1,"k":[{"t":"假借","y":"名词解释","p":["本无其字依声托事","借用同音字记录新词","如“其”借为代词","属用字法"],"q":"与此同时，汉字的字义经过假借(常用读音相同的字形记录跟这个字形毫无联系的字义)、引申(同一字形增加跟原始本义有联系的字义)等发展途径，有些初始义变为罕用义甚至消退了，字形跟常用字义的表达关系模糊了。","w":"high","e":["2011 真题"]}]},{"id":"culture-c05-s03","t":"第三节 字书与注音","w":"high","n":3,"k":[{"t":"说文解字","y":"名词解释","p":["东汉许慎所著","中国第一部系统分析字形的字典","收字9353，按540部首编排","首创部首检字法"],"q":"最早的辞书《尔雅》出现在秦汉之交(公元前2世纪)，西汉扬雄的《方言》(公元前后)是中国第一部在实地调查收集资料的基础上的比较方言词汇的重要著作，东汉时期(公元1世纪)许慎的《说文解字》是中国最早按形义关系编排的字书。","w":"high","e":["2018 真题"]},{"t":"四声","y":"名词解释","p":["平上去入四种声调","确立于南朝齐梁","沈约倡导，用于诗文","普通话四声由古四声演变"],"q":"至于“四库”“四部”“四美”“四难”“四声”“四德”等与方形有无关系，我们不敢主观定论，但成语“四分五裂”“四海为家”“四海升平”“四面楚歌”“四面八方”“四通八达”“四平八稳”等，确实体现了“方形”这一本义。","w":"normal","e":[]},{"t":"反切","y":"名词解释","p":["用两字拼注一字的注音法","上字取声母、下字取韵母声调","始于汉末，受梵文影响","古代韵书主要注音方式"],"q":"古人曾使用过“直音”“读若”或“反切”等注音法，但用来注读的仍然是汉字，倘若用来注音的汉字我们仍然不认识，这种方法就失效了。","w":"normal","e":[]}]}]},{"id":"culture-c06","t":"第六章 学术思想","w":"high","s":[{"id":"culture-c06-s01","t":"第一节 先秦诸子","w":"high","n":6,"k":[{"t":"兼爱非攻","y":"名词解释 id":"culture-c06-s03","t":"第三节 宋明理学","w":"high","n":5,"k":[{"t":"宋明理学","y":"名词解释","p":["以儒学为基础吸收佛道","程朱：理在事先、格物致知","陆王：心即是理、致良知、知行合一"],"q":"101000七、宋明理学七、宋明理学汉硕网免费题库“理学”实际是宋明时代的儒家学说，因其竭力宣扬儒家的“大道”而又称为“道学”。理学的形成应当说受到两方面的影响：一是儒学内在的变","w":"high","e":["2015 真题","2021 真题"]},{"t":"知行合一","y":"名词解释","p":["王阳明提出","反对知先行后","知是行之始，行是知之成","强调道德认识落实于实践"],"q":"王阳明的哲学，是“心外无物，心外无事，心外无理，心外无义，心外无善”，在此基础上他提出了“知行合一”的主张，认为万事万物之理都在我心中，这就是“知”，而内心代表真理的“知”就是“良知”。","w":"high","e":["2015 真题"]},{"t":"程朱理学","y":"名词解释","p":["二程与朱熹为代表","理为宇宙本原","理在事先","格物致知","存天理灭人欲","元明清官方哲学"],"q":"13.理学又称义理之学或道学，其创始人为北宋的周敦颈、邵雍及张战、继后有程顾和程颐等人继续发展，最终由南宋朱熹集其大成，因此这种理学常被称为“程朱理学”()","w":"high","e":["2024 真题","2015 真题"]},{"t":"陆王心学","y":"名词解释","p":["陆九渊与王阳明为代表","心即是理","发明本心致良知","知行合一","与程朱理学相对立"],"q":"程颐、朱熹的程朱理学借用了华严宗的某些命题，陆九渊和王守仁的陆王心学则吸收了禅宗的某些思想。","w":"high","e":["2024 真题"]},{"t":"天下郡国利病书","y":"简答题","p":["他最重要的两部著作《日知录》和《天下郡国利病书》是几十年读书治学的结晶，被认为“无一字无来历”。"],"q":"他最重要的两部著作《日知录》和《天下郡国利病书》是几十年读书治学的结晶，被认为“无一字无来历”。","w":"normal","e":[]}]},{"id":"culture-c06-s04","t":"第四节 清代朴学","w":"normal","n":0,"k":[]},{"id":"culture-c06-s05","t":"综合考点","w":"normal","n":1,"k":[{"t":"鹅湖之会","y":"名词解释","p":["南宋淳熙二年吕祖谦邀约","朱熹与陆九渊论学","朱主泛观博览，陆主发明本心","理学与心学分野的公开化"],"q":"辩论而闻名于世，历史上称这次辩论为“鹅湖之会”。","w":"normal","e":[]}]}]},{"id":"culture-c07","t":"第七章 宗教信仰","w":"high","s":[{"id":"culture-c07-s01","t":"第一节 三大崇拜与原始宗教","w":"high","n":1,"k":[{"t":"三大崇拜","y":"名词解释","p":["天地崇拜：自然崇拜的集中体现","祖先崇拜：宗法制度的信仰基础","君师崇拜：天地君亲师的伦理秩序"],"q":"一、多神信仰和三大崇拜中国文明是一种农业文明，传统农民以自给自足的小农经济为本，这种经济基础便造成了中国人讲究现实利益的文化心态，其宗教信仰也谋求对现实的生产和生存现状有直接的救助，因而中国人崇尚多神信仰，甚至对直接影响其现实生活的生存环境产生执著的崇拜。","w":"high","e":["2016 真题"]}]},{"id":"culture-c07-s02","t":"第二节 佛教","w":"high","n":8,"k":[{"t":"禅宗","y":"名词解释","p":["达摩传入、慧能大兴","不立文字直指人心见性成佛","主张顿悟、自性即佛","《坛经》为唯一中国僧人所撰之\"经\""],"q":"二是佛教思想的流行，特别是禅宗所宣扬的心性说，给儒学注入了一股新鲜血液，因而在北宋初年便有胡瑗(因字“安定”，世称“安定先生”) 讲“砥砺气节”，孙复(因居泰山，世称“泰山先生”) 讲“经世济人”，他们都强调儒家纲常与天道的一致性，所以胡、孙二人实开“理学”先河。","w":"high","e":["2019 真题"]},{"t":"玄奘","y":"名词解释","p":["唐代高僧、法相宗创始人","西行求法十七年","译经七十五部一千三百余卷" :"high","e":["2021 真题"]},{"t":"和而不同","y":"名词解释","p":["出自《论语·子路》","承认差异前提下的和谐","反对无原则苟同","多元共生包容精神"],"q":"中国传统哲学所讲的“和而不同”，就是讲各种不同质的事物和谐地融合在一起，才能产生新的事物。","w":"high","e":["2022 真题"]},{"t":"鼓浪屿","y":"简答题","p":["51.鼓浪屿：历史国际社区(文化遗产，2017年)"],"q":"51.鼓浪屿：历史国际社区(文化遗产，2017年)","w":"normal","e":[]},{"t":"天人合一","y":"名词解释","p":["中国传统哲学核心命题","源于《周易》老庄，张载正式提出","主张人与自然和谐统一","对生态文明建设有启示"],"q":"的那种实用理性思维和天人合一、物我一体的精神密切相关的。从汉字的构成来看，六书中的象形、指事、会意、形声属于造字法，而转注和假借只是用字法而已。在四种造字法中，象形字是最基本的。纵观象形字，均取象于物，取象于","w":"normal","e":[]}]},{"id":"culture-c18-s02","t":"第二节 传统文化的现代价值","w":"normal","n":1,"k":[{"t":"文化自信","y":"名词解释","p":["对自身文化价值的充分肯定","对文化生命力的坚定信念","源于优秀传统文化与先进文化"],"q":"(四)论述题(20分)在全球化背景下，应如何树立文化自信，应对中国文化面临的挑战与机遇?二、教育学、心理学及语言学基础知识(共30分)","w":"normal","e":[]}]}]}]},{"d":"yinlun","t":"对外汉语教育学引论","c":[{"id":"yinlun-c01","t":"第一章 对外汉语教育是一门专门的学科","w":"high","s":[{"id":"yinlun-c01-s01","t":"第一节 对外汉语教育的学科名称","w":"high","n":9,"k":[{"t":"母语","y":"名词解释","p":["母语是指本国、本民族的语言","这是按国家的界限来区分的。","外语是指外国的语言。一般情况下母语是人们的第一语言；但对一些移居国外的人来说，其子女出生后首先接触并获得的语言有可能是居住国的语言而不是母语。"],"q":"具体地说，第一语言习得和第二语言学习的比较，第二语言学习(有目的语的语言环境)和外语学习(没有目的语的语言环境)的比较，不同母语的学习者学习同一目的语的比较，同一语言学习者学习不同目的语的比较，不同学习策略或不同的教学方法流派的比较等等，都是很好的研究课题。","w":"high","e":["2019 真题"]},{"t":"本族语","y":"名词解释","p":["本族语就是本民族的语言，因此这一术语与“母语”可以通用","这是按言语社团、通常是民族的界限来区分的。非本族语是指本民族以外的语言，可能是外语，也可能是指本国其他民族的语言。"],"q":"从教育类型来看，有非学历教育的预备教育(解决入专业学习的汉语水平问题)、短期教育(半年以，下的汉语学习)、进修教育、速成教育(较短的时间内完成较重学习任务的密集式教学)、特殊目的教育(学习经贸汉语、中医汉语等)和特殊形式的教育(广播、电视教育)等专门进行的汉语作为第二语言的教学，也有学历教育的本科专业和研究生专业中以提高非本族语者的汉语水平为目的所进行的汉语作为第二语言的教学。","w":"high","e":["2019 真题"]},{"t":"第一语言","y":"名词解释","p":["人出生以后首先接触并获得的语言","第二语言指人们在获得第一语言以后再学习和使用的另一种语言。","这是按人们获得语言的先后顺序来区分的两个概念，也是语言教学理论中用得最多的术语。"],"q":"具体地说，第一语言习得和第二语言学习的比较，第二语言学习(有目的语的语言环境)和外语学习(没有目的语的语言环境)的比较，不同母语的学习者学习同一目的语的比较，同一语言学习者学习不同目的语的比较，不同学习策略或不同的教学方法流派的比较等等，都是很好的研究课题。","w":"high","e":["2013 真题","2019 真题"]},{"t":"第二语言","y":"名词解释","p":["指人们在获得第一语言以后再学习和使用的另一种语言","由于学习这些语言的规律与学习第二语言有很多共同之处，所以一般不再细分而统称第二语言。","广义的“第二语言”是指任何一种在第一语言获得以后学习和使用的语言，包括外语。"],"q":"在中介语理论影响下，突破了对比分析只强调第一语言干扰的局限，指出过度泛化等语内干扰以及学习策略、交际策略和学习环境所造成的偏误，弥补了对比分析的不足，全面分析学习者偏误及其来源并形成一套科学的偏误分析方法与程序，成为第二语言习得研究中的重要部分。","w":"high","e":["2019 真题"]},{"t":"应用语言学","y":"名词解释","p":["这是使用得最早、最为普遍的名称。早在19世纪末就由波兰语言学家博杜恩·德·库尔特内（Baudouin de Courtenay）提出。","广义的应用语言学是跟理论语言学相对的概念，指把理论语言学的理论、规律、原则和方法应用到其他学科领域，从而产生的新的边缘学科。","狭义的应用语言学则专指语言学理论在语言教学中的应用，特别是指第二语言教学。","把应用语言学用作本学科的名称并不恰当，因为本学科的性质绝不仅仅是“应用”，它所应用的更不仅仅是“语言学”。"],"q":"[30] 周小兵等. 突出特性，体现共性，强调应用——汉语二语学科人才培养模式的创新[C] //北京语言大学对外汉语研究中心. 汉语应用语言学研究：第2辑. 北京：商务印书馆，2013.","w":"high","e":["2017 真题"]},{"t":"对外汉语教学","y":"名词解释","p":["《中国大百科全书·语言文字》中写道：“对外汉语教学是指对外国人的汉语教学。”","实际上也包括对第一语言不是汉语的海外华人进行的汉语教学。","这一名称基本上体现了这个学科的特点和内涵，在国外也产生了广泛的影响，而且简洁上口、符合汉语习惯，因此从1982年提出一直使用至今。","但是十多年的使用也发现这一名称有一定的局限性：它只突出了主要教学对象，未能全面、准确地反映学科性质——第二语言教学。"],"q":"348|对外汉语教学入门(第三版)第十三章 跨文化交际与文化教学跨文化交际, 也叫跨文化交流 (inter-cultural communication 或 cross-cultural commu- nication)，就是跨越两种不同文化的交际， 发生在两种不同文化背景的人们之间的交流。","w":"high","e":["2015 真题","2021 真题"]},{"t":"对外汉语教育学","y":"名词解释","p":["从教育的高度研究对外汉语教学，反映到本学科的名称上，本书主张应与其他学科教育学的名称相一致，即用“对外汉语教育学”比较规范。","这一名称还能更清楚地体现出本学科的性质及其科学定位。","当然，提出“对外汉语教育”并不意味着、实际上也不可能用它来取代已使用近20年之久、早已深入人心的“对外汉语教学”这一名称。"],"q":"对外汉语教育学 (Chinese Education to Foreigners) 一些国家把本国语言的第二语言教学称为“教育”，如日本，“国语教育”是面向国内母语者的，“日本语教育”是面向国外非母语者的。","w":"high","e":["2016 真题"]},{"t":"汉语作为第二语言的教学","y":"名词解释","p":["从学术上较能精确地指称这一学科内涵和性质的，应当是“汉语作为第二语言教学”，即“Teaching of Chinese as a Second Language”（英文缩写为TCSL）。","这一名称既能指在中国进行的对外国人的汉语教学、即对外汉语教学，也能指世界各地的汉语教学，而且还能包括与之性质大体相同的对我国国内少数民族的汉语教学。","也就是说，它能涵盖第一语言以外的所有汉语教学，同时又能体现出它与其上位学科——整个第二语言教学学科的关系。"],"q":"从教育类型来看，有非学历教育的预备教育(解决入专业学习的汉语水平问题)、短期教育(半年以，下的汉语学习)、进修教育、速成教育(较短的时间内完成较重学习任务的密集式教学)、特殊目的教育(学习经贸汉语、中医汉语等)和特殊形式的教育(广播、电视教育)等专门进行的汉语作为第二语言的教学，也有学历教育的本科专业和研究生专业中以提高非本族语者的汉语水平为目的所进行的汉语作为第二语言的教学。","w":"high","e":["2020 真题"]},{"t":"教育语言学","y":"名词解释","p":["国外的语言教育专家对学科体系的研究非常重视。","美国学者斯波尔斯基（B. Spolsky）主张用“教育语言学”。","加拿大学者斯特恩（H. H. Stern）提出“第二语言教学理论的一般模式”；斯波尔斯基基于1980年提出“教育语言学理论模式”。","在斯波尔斯基的模式中，语言描写、语言学习理论和语言运用理论成为第二语言教学理论的主要来源。"],"q":"但是近年来出现了好几个其他应用领域，包括语言障碍的语言学分析 (临床语言学)、母语教育中的语言使用(教育语言学)、词典学的发展、翻译和风格学等”。","w":"normal","e":[]}]},{"id":"yinlun-c01-s02","t":"第二节 对外汉语教育的学科任务和学科体系","w":"high","n":8,"k":[{"t":"学科体系","y":"名词解释","p":["学科体系是一门学科的结构系统，它显示构成该学科的内部和外部因素以及这些因素之间的关系，其核心部分是学科的理论体系。","学科体系既体现了学科的内容及学科的性质特征，同时又能为学科的理论研究和整个学科建设指明方向。"],"q":"对外汉语教育作为-一门新兴的学科在迅速发展的同时，一方面由于学科体系和学科理论还需要进一步完善，另一方面由于学科性质和特点及学科任务和学科意义还不可能很快地为社会、为学术界所普遍认识和理解，因此无论在社会上还是在学术界，甚至本学科的研究者和教师中，仍有一些不同看法和争论。","w":"high","e":["2018 真题"]},{"t":"汉语习得理论","y":"名词解释","p":["汉语习得理论是对对外汉语教学的主体——学习者的研究，即侧重从心理学的角度研究教学对象的学习过程和学习规律。","随着认知心理学和教育心理学的发展和语言习得研究本身的进展，人们逐渐认识到“教”的成功与否决定性的因素还在“学”的方面，对“学”的研究是对“教”的研究的基础和前提。"],"q":"当然学科研究的重点还是该学科的基础理论和应用研究，就是汉语语言学、汉语习得理论、汉语教学理论和研究方法学等基础理论和总体设计、教材编写、课堂教学、测试评估、教学管理和教师培养等应用研究。","w":"high","e":["2019 真题"]},{"t":"对外汉语语言学","y":"名词解释","p":["对外汉语语言学是作为第二语言来教学和研究的汉语语言学，包括语音、词汇、语法、汉字、语义、语用、话语、功能和文化因素等方面。","对对外汉语语言学的研究是对对外汉语教学内容的研究；从教育学的角度来分析，也是对对外汉语教学的客体的研究。","语言学和汉语语言学（一般指作为母语研究的汉语语言学）是对外汉语教学的理论基础，对本学科研究汉语起指导的作用，但它不能代替本学科对汉语的研究。","本学科需要从第二语言学习和教学这一新的角度来描写汉语、研究汉语。"],"q":"不仅为我国对外汉语教学的进一步发展打下了基础，在汉语教材建设和教材编写理论的研究方面，在教学原则的研究方面、在汉语学习理论、汉语中介语的研究方面，在汉语教学总体设计与教学大纲的制订、汉语功能大纲的研制方面，在对外汉语语言学的研究方面，也为世界汉语教学及整个第二语言教学的发展做出了一定的贡献。","w":"high","e":["2020 真题"]},{"t":"对外汉语教学理论","y":"名词解释","p":["对外汉语教学理论是把上述两个方面——对教学内容和对教学对象的研究结合起来，即研究如何通过教学活动使教学内容为学习者迅速、有效掌握的规律和原理。","教学理论有时也称为教学论或教学原理（甚至称为教学法），这是本学科研究的传统领域。","我们亟须把教学论的教学目的、教学原则、教学过程、课程设置、教学方法、教学手段和教学评估等一般理论与对外汉语教学的规律紧密结合起来，形成有自己特色的对外汉语教学理论。"],"q":"第八章 对外汉语教学理论与应用(上)在介绍现代第二语言教学史上有较大影响的教学法流派并探讨教学法发展趋向的基础上，本章和下一章将从教的角度集中讨论对外汉语教学的一些理论问题和应用问题，这也就是对外汉语教学学科体系中对外汉语教学理论和应用研究部分。","w":"high","e":["2021 真题"]},{"t":"对外汉语教育学科的任务","y":"名词解释","p":["对外汉语教育学科的任务是研究汉语作为第二语言的教育原理、教育过程和教育方法，并用来指导教育实践，从而更好地实现学习者德智体美全面发展的教育目的。","对外汉语教育学科研究的核心内容是对外汉语教学。","对外汉语教育作为一门分支学科，它还有一项任务，即以自身的学科理论建设，为第二语言教育学科甚至整个语言教育学科的理论发展做出贡献。"],"q":"一、对外汉语教育的学科任务对外汉语教育学科的任务是研究汉语作为第二语言的教育原理、教育过程和教育方法，并用来指导教育实践，从而更好地实现学习者德智体美全面发展的教育目的。","w":"high","e":["2016 真题"]},{"t":"对外汉语教育学科研究的核心内容是____。","y":"填空题","p":["对外汉语教育学科研究的核心内容是对外汉语教学"],"q":"对外汉语教育学科研究的核心内容是对外汉语教学。","w":"high","e":["2016 真题"]},{"t":"应用研究","y":"名词解释","p":["应用研究指运用相关学科和本学科的基础理论，对总体设计、教材编写、课堂教学、测试评估、教学管理和师资培养等方面进行专门的研究。","用学科的基础理论来指导教学实践，需要经过学科应用研究这个中介环节。","应用研究与教学实践最为接近，可以直接用来指导相关的教学活动。","本学科的理论体系除基础理论外，还有应用研究。"],"q":"第八章 对外汉语教学理论与应用(上)在介绍现代第二语言教学史上有较大影响的教学法流派并探讨教学法发展趋向的基础上，本章和下一章将从教的角度集中讨论对外汉语教学的一些理论问题和应用问题，这也就是对外汉语教学学科体系中对外汉语教学理论和应用研究部分。","w":"normal","e":[]},{"t":"学科研究方法学","y":"名词解释","p":["本体系中所说的学科研究方法学，是指受哲学方法论普遍规律的指导，用来探讨对本学科最具针对性的方法论原则，并着重研究适用于本学科的一般方法，特别是本学科特有的方法。","学科研究方法学也是本学科理论体系的一个重要组成部分，研究方法在很大程度上决定研究的成果，甚至影响到研究的成功与失败。"],"q":"研究领域涉及汉语语言学、汉语教学理论、汉语习得理论和学科研究方法学等，既有基础理论研究，也有应用研究。","w":"normal","e":[]}]},{"id":"yinlun-c01-s03","t":"第三节 对外汉语教育的学科性质和学科特点","w":"high","n":5,"k":[{"t":"专门的学科","y":"名词解释","p":["所谓专门的学科，就是指它有专门的研究对象、研究任务和研究视角，是别的学科所无法替代的。","对外汉语教育是一门专门的学科。","对外汉语教育的研究对象，是汉语作为第二语言的教育现象、教育原理和教育方法，并以对外汉语教学为核心。","本学科的研究任务和教学任务，是其他任何学科，包括最相近的语言学学科、外语教育学科、甚至母语文教育学科所不承担的。"],"q":"四、在世界范围内确立学科地位正如英、法、德语等作为第二语言教学是一门专门的学科一样，世界范围的汉语作为第二语言的教学也是一门专门的学科。","w":"high","e":["2019 真题"]},{"t":"应用的学科","y":"名词解释","p":["我们把与实践紧密联系、直接解决实际问题的学科称为应用学科。","对外汉语教育是一门理论与实践紧密结合、具有极强实践性的应用学科。","应用学科也有其自身的基础理论研究领域和理论体系，它不仅需要进行具体的应用研究，不仅关注应用过程本身，而且要进行与之相关的基础理论研究。","它面对着对外汉语教育的实际和大量亟待解决的问题，理论研究的目的在于指导教育实践。"],"q":"二、对外汉语教育的学科特点对外汉语教育是一门专门的学科，是综合的学科，又是一门应用的学科。","w":"high","e":["2019 真题"]},{"t":"综合交叉学科","y":"名词解释","p":["对外汉语教育是一门综合交叉学科。","由两门学科相交而介于其间的，称为边缘交叉学科；由多门学科涉及到同一对象而形成的综合性学科，称为综合交叉学科。","它综合了多种学科的理论成果，研究本学科所面临的特殊课题，从而形成并逐步完善自身的学科理论。","作为本学科理论基础的七个主要学科：语言学、心理学、教育学、文化学、社会学、横断学科及哲学。"],"q":"基础篇第三章 对外汉语教学的语言学基础和教育学基础作为一门综合交叉学科，对外汉语教学受到多种学科的启示和影响。","w":"high","e":["2017 真题"]},{"t":"对外汉语教学的性质","y":"名词解释","p":["对外汉语教学是一种第二语言教学，也是一种外语教学。","从上述四个方面可以概括出对外汉语教学的性质是汉语作为第二语言的教学，它是第二语言教学的分支学科。","对外汉语教学首先是语言教学；对外汉语教学是第二语言教学；对外汉语教学是汉语作为第二语言的教学；对外汉语教学是对外国人进行的汉语作为第二语言的教学。"],"q":"上文已谈到，吕必松先生最早对学科理论进行宏观研究，阐明对外汉语教学的性质和特点，探索学科体系的模式，论述学科的基础理论和应用理论并提出学科建设的任务。","w":"high","e":["2016 真题","2022 真题"]},{"t":"对外汉语教学的特点","y":"名词解释","p":["（1）以培养汉语交际能力为目标——不是让已具备汉语运用能力的本族人掌握更多的语言和文化知识，而是让作为第二语言的学习者掌握用汉语进行听说读写交际活动的能力。","（2）以技能训练为中心，将语言知识转化为技能。","这些性质和特点也影响到对外汉语教学基本原则等一系列问题的确定。"],"q":"这些大纲中的词汇是在一定的范围、语体和情景中，以使用频率为标准筛选出来的，又经过专家从对外汉语教学的特点出发进行了必要的干与(取舍与增补)而最后确定的，体现了一定的科学性。","w":"high","e":["2018 真题"]}]},{"id":"yinlun-c01-s04","t":"第四节 对外汉语教育的学科定位与争论","w":"high","n":4,"k":[{"t":"学科定位","y":"名词解释","p":["学科定位，是指某一学科在众多学科中的位置，也就是科学地确定它的门类归属问题，通常是由该学科的研究内容、任务和性质所决定的。","学科定位问题之所以需要探讨，是因为它决定学科的发展方向。","对外汉语教育由于它研究内容的特殊性，也由于它是一门综合交叉学科，受到多种学科理论的影响，因而在学科定位的问题上，多少年来一直存在不同的看法和争论。"],"q":"上 编对外汉语教学通论漢第一章 总论 3第一章 总 论第一节 学科性质一、学科定位对外汉语教学，指教师将汉语交际技能及相关汉语知识传授给海外非母语者的过程。","w":"high","e":["2020 真题"]},{"t":"“应用语言学学科”论","y":"名词解释","p":["传统的看法是把第二语言教学归入语言学的范畴，其上位学科是应用语言学，甚至将狭义的应用语言学用来专指第二语言教学。","首先，第二语言教学所“应用”的理论不仅是语言学，还有心理学、教育学、文化学、社会学等，单单应用语言学理论解决不了语言教学的所有问题。","第二，语言学与语言教学之间的关系决不仅仅是“应用”。","第三，“应用语言学”这一名称非常笼统，不能明确地表示出本学科的内容。","第四，今天的语言教学已经进一步发现了自己的学科特征，明确了自己的发展方向，找到了自己的发展道路。"],"q":"三、“应用语言学学科”论这不仅是我们国内争论的问题，也是世界第二语言教学界长期探讨的问题。","w":"high","e":["2017 真题"]},{"t":"“对外汉语文化教学学科”论","y":"名词解释","p":["80年代后期至90年代初，对外汉语教学界就进行过一场语言与文化、语言教学与文化教学关系问题的热烈争论。","在讨论中也出现了一些比较偏颇的观点，如提出对外汉语教学要“突破汉语基础教育”……最后导致要把本学科的性质改为“对外汉语文化教学学科”。","1994年12月举行的“对外汉语教学的定性、定位、定量问题座谈会”，就学科的性质与内涵、对外汉语教学中语言教学与文化教学的关系等问题进行了深入的讨论，在一些原则问题上达成了共识。","会议重申了对外汉语教学作为第二语言教学的学科性质。"],"q":"二、“对外汉语文化教学学科”论在我们“圈子”内部也曾出现过有关学科性质和定位问题的不同意见。","w":"high","e":["2018 真题"]},{"t":"“小儿科”论","y":"名词解释","p":["60年代至70年代，对外汉语教学曾被看做是教外国人说中国话，教“人手足刀尺”的“小儿科”，认为“是个中国人就能教汉语”，不承认这是一门学科，需要什么学问。","这是早期的“学科否定论”。","持这种看法的，很多是对我们这一行实际上并不了解的“圈子外边”的人。","在国外，据统计，美国高等院校1986至1988年所开设的英语作为第二语言教学的硕士专业有120个，博士专业有18个，可见在美国也并非“是个美国人就能教英语”。"],"q":"一、“小儿科”论６０年代至７０年代，对外汉语教学曾被看做是教外国人说中国话，教“人手足刀尺”的“小儿科”，认为“是个中国人就能教汉语”，不","w":"normal","e":[]}]}]},{"id":"yinlun-c02","t":"第二章 汉语作为第二语言教学的发展与现状","w":"high","s":[{"id":"yinlun-c02-s01","t":"第一节 我国对外汉语教学的发展回顾","w":"high","n":10,"k":[{"t":"巩固阶段","y":"名词解释","p":["对外汉语教学进入巩固阶段的标志是，经国务院批准，1962年6月在北京外国语学院外国留学生办公室的基础上正式成立“外国留学生高等预备学校”。","从1962年到1965年，虽然只有短短的四年时间，我国对外汉语教学呈现了迅速发展的良好势头。首先表现在教学规模进一步扩大。","这四年间共接受外国留学生3944名，超过了前11年的总和。从事这项任务的学校也由一所发展到23所。"],"q":"一、开创对外汉语教学事业开创事业时期(５０年代初至７０年代末)又可分为三个阶段，即初创阶段、巩固阶段和恢复阶段。","w":"high","e":["2020 真题"]},{"t":"“精讲多练”","y":"名词解释","p":["钟梫《十五年汉语教学总结》一文中特别提到了“精讲多练”和“课内课外相结合”的实践性原则，用汉语进行课堂教学的直接性原则，教学内容与学生的专业相结合的学以致用原则，以及“语文并进”，听说读写全面要求、阶段侧重等主要的教学原则。","这些从长期教学实践中总结出来的宝贵经验，虽然还缺乏理论的指导和系统的阐述，但却是对对外汉语教学规律早期探索所得出的重要共识，对后来的教学得以坚持正确的方向起了保证作用，也为学科理论建设奠定了基础。"],"q":"钟梫《十五年汉语教学总结》① 一文中特别提到了“精讲多练”和“课内课外相结合”的实践性原则，用汉语进行课堂教学的直接性原则，教学内容与学生的专业相结合的学以致用原则，以及“语文并进”，听说读写全面要求、阶段侧重等主要的教学原则。","w":"high","e":["2018 真题","2019 真题"]},{"t":"北京语言学院","y":"名词解释","p":["经国务院批准，1962年6月在北京外国语学院外国留学生办公室的基础上正式成立“外国留学生高等预备学校”……是北京语言学院的前身。","1964年6月经国务院批准，外国留学生高等预备学校改名为北京语言学院，1996年又改名为北京语言文化大学。","这是我国第一所以对外汉语教学为主要任务的高等学校，它的成立结束了对外汉语教学依附于其他高等学校的情况，有了本学科自己的、独立的、稳定的基地。","北京语言文化大学至今仍是我国惟一的一所专门以对外国进修生、本科生、硕士研究生、博士研究生以及汉语进修教师进行汉语言、中国文化、中国文学、中国艺术和汉语教学理论教育为主要任务的大学。"],"q":"本章参考文献[1] 毕继万. 跨文化非语言交际 [M].北京：外语教学与出版社，2001.[2] 程棠. 关于中高级阶段对外汉语教学的几个问题 [C]//国家对外汉语教学领导小组办公室教学业务部. 中高级对外汉语教学论文选. 北京：北京语言学院出版社，1991.","w":"high","e":["2021 真题"]},{"t":"《汉语教科书》","y":"名词解释","p":["1958年出版的我国第一套对外汉语教材《汉语教科书》"],"q":"这一点也充分地反映在 １９５３年发表的本学科最早的一篇论文《教非汉族学生学习汉语的一些问题》(周祖谟)和１９５８年出版的我国第一套对外汉语教材《汉语教科书》中。","w":"high","e":["2025 真题","2019 真题","2025 445 二、教育学、心理"]},{"t":"国家对外汉语教学领导小组","y":"名词解释","p":["1987年7月国务院批准成立了由国家教委、国务院外事办公室、外交部、文化部、广播电影电视部、新闻出版署、国家语言文字工作委员会等政府部门及北京语言学院组成的“国家对外汉语教学领导小组”（1998年已扩展为由11个政府部门组成），由当时的国家教委负责人任组长。","日常工作由其常设机构“国家对外汉语教学领导小组办公室”（简称“汉办”）负责，第一任办公室主任为北京语言学院院长吕必松。","1993年国家教委发布的《中国教育改革和发展纲要》中更进一步提出要“大力加强对外汉语教学工作”。"],"q":"正是出于上述原因，我国政府高度重视对外汉语教学工作，为了协调各有关方面的力量以加强对这项工作的领导与管理，１９８７年７月国务院批准成立了由国家教委、国务院外事办公室、外交部、文化部、广播电影电视部、新闻出版署、国家语言文字工作委员会等政府部门及北京语言学院组成的“国家对外汉语教学领导小组”(１９９８年已扩展为由１１个政府部门组成)，由当时的国家教委负责人任组长。","w":"high","e":["2018 真题"]},{"t":"东欧交换生中国语文专修班","y":"名词解释","p":["1950年成立的清华大学“东欧交换生中国语文专修班”于1951年初正式开课，拉开了新中国外国留学生汉语预备教育的帷幕。","清华大学校务委员会主任周培元教授兼任专修班班主任，著名语言学家吕叔湘先生任清华大学外籍留学生管理委员会主席并兼管专修班的业务工作。","第一年共接受来自东欧国家的33名留学生，学制为两年。"],"q":"我国对外汉语教学，从１９５０年７月在清华大学成立第一个对外汉语教学机构“东欧交换生中国语文专修班”算起，至今已近５０年。","w":"high","e":["2016 真题"]},{"t":"开创对外汉语教学事业时期","y":"名词解释","p":["对外汉语教学五十年的发展史，以1978年为界分为两个时期。1978年以前的20多年为第一时期，即“开创对外汉语教学事业”的时期，是我们对这项新的事业进行摸索、试验并不断积累经验的经验型时期。","开创事业时期（50年代初至70年代末）又可分为三个阶段，即初创阶段、巩固阶段和恢复阶段。"],"q":"其间以１９７８年为界分为两个时期，即５０年代初至７０年代末的“开创对外汉语教学事业”时期和７０年代末至今的“确立对外汉语教育学科”时期。","w":"high","e":["2017 真题"]},{"t":"确立对外汉语教育学科时期","y":"名词解释","p":["1978年以后的20年为“确立对外汉语教育学科”的时期，是我们为使学科得到认定而自觉地进行学科建设，从理论和实践上探讨学科的规律并大力发展这一学科，由经验型向科学型转变的时期。","这20年又可分为80年代的“建构学科理论框架”阶段和90年代的“深化学科理论研究”阶段。","之所以提出以1978年为分界线……1978年是对外汉语教育学科发展的起点，这一年中国社会科学院召开的北京地区语言学科规划座谈会上，第一次提出把对外汉语教学“作为一个专门学科来研究”。"],"q":"其间以１９７８年为界分为两个时期，即５０年代初至７０年代末的“开创对外汉语教学事业”时期和７０年代末至今的“确立对外汉语教育学科”时期。","w":"high","e":["2017 真题"]},{"t":"“结构、功能、文化相结合”原则","y":"名词解释","p":["在深化理论研究的基础上，教学层面的应用研究也有了新的发展。与国外研究的趋势相一致，这一阶段对教学原则的研究和总结，成为教学法研究的重点。","特别是其中的“结构、功能、文化相结合”的原则，已成为带有中国特色的汉语作为第二语言教学的一项重要原则。","在教学法的研究方面，提出了“结构与功能相结合”的原则以及“交际性原则”，并紧密结合教学的需要对对外汉语预备教育、短期教育、进修教育及现代汉语专业的本科教育等门类的课程与教材进行了全面的改革试验。"],"q":"3. 结构、功能、文化相结合原则这是近年来我国学者根据从事对外汉语教学的经验，总结、研究得出的一条教学原则。","w":"high","e":["2019 真题","2020 真题","2021 真题"]},{"t":"恢复阶段","y":"名词解释","p":["恢复阶段(1972~1977年)……1972年6月北方交通大学首先接受了200名坦桑尼亚、赞比亚留学生。","1972年10月周恩来总理亲自批示恢复北京语言学院。经过不到一年的紧张筹备，北京语言学院于1973年秋季开始接受外国留学生。","由于“文化大革命”的破坏，教学工作多年中断，百废待兴，恢复阶段的对外汉语教学在校舍、设备、资料、教材、教师、管理等各方面都遇到了难以想像的困难。","1977年在校留学生总数为1217人，从1972年到1977年我国共接受留学生2266名。"],"q":"一、开创对外汉语教学事业开创事业时期(５０年代初至７０年代末)又可分为三个阶段，即初创阶段、巩固阶段和恢复阶段。","w":"normal","e":[]}]},{"id":"yinlun-c02-s02","t":"第二节 我国对外汉语教学的发展现状","w":"high","n":4,"k":[{"t":"世界汉语教学学会","y":"名词解释","p":["1987年在北京举行第二届国际汉语教学讨论会期间，各国代表协商成立了“世界汉语教学学会”。","该会的成立是为了促进世界汉语教学与研究的交流与合作，推动世界汉语教学与研究的发展。","秘书处也一直设在北京语言学院，首任会长为朱德熙，现有30多个国家和地区的800多名会员。","1999年8月将举行第六届国际汉语教学讨论会。"],"q":"正如已经召开过的五届“国际汉语教学讨论会”、国际学术组织“世界汉语教学学会”及其会刊《世界汉语教学》等名称所表示的那样，由于语境清楚，其义自明，一般不会产生误解，不会与汉语作为第一语言的我国母语文教学相混淆。","w":"high","e":["2019 真题"]},{"t":"中国对外汉语教学学会","y":"名词解释","p":["1983年6月成立的“中国教育学会对外汉语教学研究会”于1988年独立为“中国对外汉语教学学会”，秘书处设在北京语言学院，首任会长为吕必松。","该会现有会员700多人，至今已举行过六届学术讨论会，并组织过多次国内外学术交流活动。","由于教学事业和学科研究发展的需要，1996年又先后成立了北京、华东、华北、华南和东北等五个地区分会。"],"q":"1988年中国对外汉语教学学会组织研究、完成我国第一个《汉语水平等级标准和等级大纲》(试行)，后来又由国家对外汉语教学领导小组办公室继续组织修订，于 １９９２年出版了《汉语水平词汇与汉字等级大纲》，１９９５年出版了《对外汉语教学语法大纲》，１９９６年出版了《汉语水平等级标准与语法等级大纲》。","w":"high","e":["2021 真题"]},{"t":"中国汉语水平考试（HSK）","y":"名词解释","p":["中国汉语水平考试(HSK)研究（北京语言学院）——1985年夏第一套试卷测试成功，1990年初中等考试通过国家鉴定，获国家教委1991年科技进步奖，1993年正式成为国家标准化考试，也是目前世界上最具权威性、影响最大的汉语水平测试。","其理论成果《汉语水平考试研究》获1991年北京市第二届哲学社会科学优秀成果二等奖。"],"q":"中国汉语水平考试(HSK)研究(北京语言学院)———1985年夏第一套试卷测试成功，１９９０年初中等考试通过国家鉴定，获国家教委１９９１年科技进步奖，１９９３年正式成为国家标准化考试，也是目前世界上最具权威性、影响最大的汉语水平测试。","w":"high","e":["2020 真题"]},{"t":"汉语言专业","y":"名词解释","p":["1975年，原北京语言学院开始试办以外国留学生为对象、以汉语作为第二语言的教育为特征的四年制“汉语言”专业本科，当初提出的培养目标为汉语教师、翻译和汉语研究人才。","接着南开大学、南京大学、复旦大学等院校也相继设立该专业，现在全国已有20多所大学设立了汉语言本科专业。","1996年北京语言文化大学又开设了外国留学生四年制“中国语言文化”本科专业。"],"q":"具体说来，与对外汉语教学相关的文化教学应是三个层次，即对外汉语教学学科范围内语言的文化因素、基本国情和文化背景知识，和虽不属于本学科但为本学科所设专业(如汉语言专业、中国语言文化专业等)所需要的专门性文化知识。","w":"normal","e":[]}]},{"id":"yinlun-c02-s03","t":"第三节 世界汉语教学的发展特点","w":"normal","n":1,"k":[{"t":"非普遍教授语言","y":"名词解释","p":["（1）学习汉语的人数迅速增长，教学规模不断扩大，但在世界绝大多数地区汉语仍属“非普遍教授语言”。","当时美国学习外语的大、中学生中91%选择西、法、德三大“普遍教授语言”，其余的所有被称为“非普遍教授语言”的都包括在9%之中。","而汉语与日语、阿语、朝语、东南亚语、非洲语及葡语、北欧语等数十种语言一起，又只占其中的1%不到。"],"q":"语等作为第 二语言在世界上已经有了几十年、甚至几百年的教学基础，目前汉语教学在国外还不普及，属于“非普遍教授语言”(less commonly taught language),学习汉语的人一般起点都不高。","w":"normal","e":[]}]}]},{"id":"yinlun-c03","t":"第三章 对外汉语教学的语言学基础和教育学基础","w":"high","s":[{"id":"yinlun-c03-s01","t":"第一节 对外汉语教学的语言学基础(一)","w":"high","n":5,"k":[{"t":"语言能力","y":"名词解释","p":["乔姆斯基在60年代提出“语言能力”的概念，并将内在的“语言功能”与“语言表现”，即对语言的实际运用做了区分。","所谓“语言能力”是指人们所具有的语言知识，是一种内化了的包括语音、词汇、语法等的语言规则体系。","根据转换生成语言理论，一个人的语言能力主要表现在能正确组合声音和语素；能区分是否合乎语法的句子；能区分结构相同或相似但意义不同的句子等；而最根本之点则是能运用这一有限的规则体系创造出无限的句子。","可见“语言能力”主要是与语言形式结构有关，实际上是一种高度抽象的语法能力，是一种脱离外部语言环境的、人的内部心理机制。"],"q":"《高等学校外国留学生汉语专业教学大纲》和《高等学校外国留学生汉语教学大纲 (长期进修)》(以下简称《长期教学大纲》) (国家汉办，2002) 称之为“承担系统的语言能力教学任务的主要课型，是进行听说读写综合训练的课型”。","w":"high","e":["2018 真题"]},{"t":"语言和言语","y":"名词解释","p":["根据瑞士语言学家索绪尔对语言（langue）和言语（parole）的区分，语言是对言语的抽象和概括，常常指作为社会惯例的语音、词汇、语法的规则系统；言语是语言的表现形式，也可以说是个人对语言在特定环境中的运用。","语言存在于言语之中，通过言语来体现，平常我们接触到(听到、看到)都是具体的言语。","两者的关系好比“人”和张三、李四的关系：张三、李四是“人”的具体表现形式，而“人”是对张三、李四等很多人的特点的抽象。"],"q":"根据区分语言和言语这一语言学理论，我们认为在对外汉语教学中，应当注意言语和语言、言语层次的教学与语言层次的教学的统一。","w":"high","e":["2017 真题"]},{"t":"转换生成语法","y":"名词解释","p":["20世纪中期在美国出现了转换生成语法学派，其标志是1957年美国麻省理工学院乔姆斯基的《句法结构》一书的出版。","他提出区分“语言能力”——人们内化了的语言规则体系和“语言表现”——语言能力的实际运用。","为此，他提出“语言习得机制”和“普遍语法”的假说和“深层结构”、“表层结构”的理论。这样就把语言学的触角伸向人类认知领域，探讨语言的心理过程。","转换生成语法学派的出现，称为“乔姆斯基革命”，开拓了语言研究的新领域。"],"q":"转换生成语法理论结构主义语言学功能主义语言学心理学理论基础认知心理学联结-行为主义心理学人本主义心理学(图6)第二语言教学法主要流派分类表","w":"high","e":["2017 真题"]},{"t":"结构主义语言学","y":"名词解释","p":["20世纪初语言学进入新的发展时期。1906年到1911年瑞士语言学家索绪尔在日内瓦大学讲授普通语言学，1916年由他的学生整理出版了他的讲稿《普通语言学教程》。","索绪尔被公认为现代语言学的主要奠基人，其语言理论也成了现代语言学的指导思想。","索绪尔语言理论的核心是语言是符号系统，这一系统由很多小系统组成；符号由“能指”(形式)和“所指”(概念)两部分构成。","在30年代有三个学派：强调语言符号的功能的布拉格功能语言学派，强调语言符号间各种关系的哥本哈根语符学派，强调共时描写语言事实的美国描写语言学派。"],"q":"转换生成语法理论结构主义语言学功能主义语言学心理学理论基础认知心理学联结-行为主义心理学人本主义心理学(图6)第二语言教学法主要流派分类表","w":"high","e":["2018 真题"]},{"t":"功能主义语言学","y":"名词解释","p":["60年代末、70年代功能主义语言学兴起，标志着语言研究重点由语言形式转向语言功能，这是语言学研究领域又一次拓宽。","功能主义学派的代表人物有英国的韩礼德、法国的马丁内等著名语言学家，中心在欧洲。","以弗斯为奠基人的伦敦功能结构语言学派认为语言的本质是意义——语言环境中的意义，语义是语言研究的中心，主张从社会的角度去观察、研究语言，强调语言的社会性。","韩礼德继承和发展了弗斯的理论，建立了系统——功能语法理论，以“系统语法”为框架论述语言功能。"],"q":"近几十年来发展迅速的功能主义语言学，特别是有关语言能力和交际能力、语言形式和语言功能、话语分析和会话分析、言语行为理论和会话含义理论等对对外汉语教学的影响。","w":"high","e":["2020 真题"]}]},{"id":"yinlun-c03-s02","t":"第二节 对外汉语教学的语言学基础(二)","w":"high","n":7,"k":[{"t":"话语","y":"名词解释","p":["简单说来，话语是在交际过程中一定语境下表示完整语义的自然语言，是由结构衔接、语义连贯、排列符合逻辑来表达某个主题的连续的句子所构成的语言整体。","话语从形式上看通常是大于句子的语言单位，可能是句组、段落甚至篇章；也可能只是一个句子，一个短语甚至一个词。","话语既包括口语，也包括书面语。"],"q":"前一部分是比喻或说出一个事物，类似于谜语的“谜面”，而后一部分则是解释说明，类似于“谜底”，前后两部分在话语中有停顿间歇，后一部分有时不说出来，让人去猜想其含义，所以称为歇后语。","w":"high","e":["2018 真题"]},{"t":"交际能力","y":"名词解释","p":["社会语言学家海姆斯在60年代提出了不同的看法，他认为一个人的语言能力不仅指能否说出合乎语法的句子，还包括能否在一定的语言环境中恰当地使用语言的能力。","海姆斯首次提出了“交际能力”（communicative competence）的概念，即运用语言（或非语言手段)进行社会交往的能力，包括传递信息、交流思想和表达感情。","海姆斯还进一步提出了交际能力的四个特征：语法性——指语法上是否正确；可接受性——在交际中能否被接受；得体性——在一定的语境中是否恰当，是否合乎社会文化习惯；现实性——是否是现实中常用的。","交际能力既包括语言能力，也包括语言运用的能力。"],"q":"3.学习策略和交际策略学习策略(learning strategies)是语言学习者为有效地掌握语言规则系统，发展言语技能和语言交际能力，解决学习过程中所遇到的问题而采取的各种计划、途径、步骤、方法、技巧和调节措施。","w":"high","e":["2019 真题"]},{"t":"合作原则","y":"名词解释","p":["60年代中期美国语言哲学家格赖斯提出了会话含义理论，他认为会话能顺利进行需要双方互相配合，共同遵守一些基本原则。他提出“合作原则”，包括四项准则。","四项准则：(1)质的准则——所说的话要真实，不要说自知是虚假的话，或缺乏足够证据的话。(2)量的准则——所说的话应包含交谈目的所需要的信息，而不要包含超出需要的信息。(3)关系准则——所说的话必须是有关的，要切题。(4)方式准则——所说的话要清楚，有条理，简练，避免晦涩、歧义。"],"q":"其研究内容和成果，如“合作原则” “礼貌原则” “得体性原则”，格莱斯(H. P. Grice)的“会话准则”，也是语用学研究的内容和成果，跟国际汉语教学密切相关。","w":"high","e":["2018 真题"]},{"t":"会话分析","y":"名词解释","p":["由于会话是口头表达的一种常见形式，对日常会话的结构与规律进行分析的“会话分析”已成为话语分析的重要组成部分。","70年代美国社会学家萨克斯等分析自然话语，指出会话的特点是“话轮替换”（turn-taking），发话人从头至尾连续的一段话称为一个“话轮”(turn)，会话中每次须保持一人说话。","会话结构的基本单位是“毗邻应对”(adjacency pair)，即会话双方的发话与应对一前一后紧密相连；有时也会出现“插入序列”甚至出现打断发话者的“分岔序列”。"],"q":"社会语言学对言语交际中言语行为的研究和会话分析，特别是有关在一定的社会环境和言语交际情景中言语行为得体性所要求的社会规范、交际策略和语用规则的研究，对第二语言教学培养语言交际能力有直接的借鉴作用。","w":"high","e":["2016 真题"]},{"t":"会话含义","y":"名词解释","p":["对“会话含义”（conversational implicature）的研究实际上就是对会话中说话者的言外之意的研究。","所以会话含义是指会话中说话者因违反“合作原则”而产生的言外之意。","但在实际语言交际中，人们常常出于某种礼貌或其他目的，故意违反这些合作原则，从而产生言外之意让听话者去领会。","格赖斯会话含义理论后来不断得到补充和完善。"],"q":"近几十年来发展迅速的功能主义语言学，特别是有关语言能力和交际能力、语言形式和语言功能、话语分析和会话分析、言语行为理论和会话含义理论等对对外汉语教学的影响。","w":"high","e":["2018 真题","2023 354 一、名词解释（每"]},{"t":"言语行为理论","y":"名词解释","p":["50年代末英国哲学家奥斯汀提出“言语行为”理论（speech act theory）。","他指出语言不仅是描写、陈述和说明客观世界，提供信息，而且人们说出话语也是一种行为。人们在说话的时候，就是在做一件事，完成一种行为。","奥斯汀认为人们所说出的话语能同时进行三种行为，即言内行为、言外行为和言后行为。","仍以“屋里很热”这句话为例，言内行为是说话人通过发声把这句话说出来；言外行为则是通过这句话来表达隐含的真正意图，也就是言外之意；言后行为则是指这句话对听话人所产生的影响。"],"q":"5.语用，主要以言语行为理论作指导，吸收语用学的最新研究成果，在分析话语结构、语用意义的同时，也保留了我国传统的修辞研究中的精华，例如辞格分析和语体分析，并从语法、语义和语用三个平面讨论病","w":"high","e":["2019 真题"]},{"t":"语言形式与语言功能","y":"名词解释","p":["语言形式通常指语音、语法、词汇等语言的结构体系，也称语言结构。语言功能指语言所能发挥的作用。","随着社会语言学的兴起，强调语言作为交际工具的职能，人们更重视语言的交际功能。这里所说的语言功能，就是指用语言做事，或者说用语言完成交际任务。","韩礼德认为儿童在语言发展过程中就掌握了七种功能：工具功能、控制功能、交往功能、表达个体功能、启发功能、想像功能、信息功能。","他把成人的语言功能归纳为三种：观念功能、交际功能、话语功能。"],"q":"目前人们讨论的主要问题仍是语言交际能力作为教学目的的界定，如何处理语言形式与语言功能之间的关系和如何探索并完善交际性课堂教学的途径等。","w":"high","e":["2020 真题"]}]},{"id":"yinlun-c03-s03","t":"第三节 对外汉语教学的教育学基础","w":"high","n":5,"k":[{"t":"启发式","y":"名词解释","p":["教学方法的根本指导思想是“启发式”，即教师从学生的实际出发，采取各种有效的办法调动学生学习的积极性和主动性，引导他们自己去学习。","与之相反的指导思想是“注入式”，教师单方面地向学生灌输知识，学生被动地接受知识。","显然，启发式符合辩证唯物主义内因和外因互相作用的规律。学生自觉、主动的学习是内因，起着决定性的作用；教师的指引、帮助则是外因。","启发式教学不仅有利于具体教学任务的完成，更重要的是培养了学生的学习能力，养成学生的好的学习习惯。"],"q":"我国有数千年的语文教学传统，在春秋战国时期就已发现并贯彻如启发式、循序渐进、温故知新、学思结合、因材施教、教学相长等重要教学原则，并形成了像对文学名著的大量阅读和诵记、在熟练诵记的基础上活用等行之有效的教学方法。","w":"high","e":["2019 真题"]},{"t":"教学原则","y":"名词解释","p":["教学原则是从一定的教育和教学目的出发，在教学实践的基础上，根据对教学过程客观规律的认识而制订的指导教学工作的基本要求。","教学原则对一切教学活动，包括教学计划的制定、教学内容的选择、教学过程的组织、教学方法手段的运用都有指导作用。","教学原则有继承性，像早在17世纪由夸美纽斯第一次系统提出的直观性、自觉性、系统性、巩固性、量力性五大教学原则，在一定程度上反映了教学规律，至今仍有指导意义。","教学原则不能是一般哲学原则或社会政治原则的套用，必须结合教育实际、体现教育的特点。"],"q":"他把对外汉语教学看做是一项系统工程，认为总体设计是“根据语言规律、语言学习规律和语言教学规律，在全面分析第二语言教学的各种主客观条件、综合考虑各种可能的教学措施的基础上选择最佳方案，对教学对象、教学目标、教学内容、教学途径、教学原则以及教师的分工和对教师的要求等做出明确的规定，以便指导教材编写(或选择)、课堂教学和成绩测试使各个教学环节成为一个互相衔接的、统一的整体，使全体教学人员根据不同的分工在教学上进行协调行动。","w":"high","e":["2020 真题","2020 真题"]},{"t":"教学过程","y":"名词解释","p":["教师和学生共同参与的教学活动过程叫教学过程。对教学过程规律的研究也称为过程论，是广义的教学论中的一部分。","教学过程的性质，按照马克思主义的观点是学生的认识过程，而且是一种特殊的认识过程。","其特殊性表现为：(1)学生不是真刀真枪直接同客观事物打交道，而是通过书本和课堂接受前人总结的实践经验；(2)学生的认识活动是在教师的引导下进行的；(3)学生的认识过程不只是知识技能掌握的过程，而且是德智体美全面发展的过程；(4)作为教学过程中学生的认识活动，不是学生自发的、主动的要求，而是在教师和课本影响下进行的。"],"q":"教育学中所涉及到的教育的本质、教育方针、教育目的、教育制度、教育管理等和教学论中有关教学过程、教学原则、教学内容(课程)、教学方法、教学手段、教学组织形式和教学效果检查等方面所反映的各种教育和教学的客观规律，一般说来对第二语言教学和对外汉语教学都具有指导意义。","w":"high","e":["2018 真题"]},{"t":"学科课程论","y":"名词解释","p":["学科课程论在我国孔子时代和欧洲的希腊罗马学校中早已有之，17世纪的夸美纽斯和18世纪著名德国教育家赫尔巴特进一步奠定了理论基础，至今仍为我国和世界各国的大多数学校所采用。","这是一种以学科的知识体系为中心的课程理论，强调以各门学科知识固有的逻辑体系来组织课程。","对社会生活实际和学生的兴趣、需要及接受能力考虑不多。"],"q":"学科课程论在我国孔子时代和欧洲的希腊罗马学校中早已有之，１７世纪的夸美纽斯和１８世纪著名德国教育家赫尔巴特(J. F. Herbart)进一步奠定了理论基础，至今仍为我国和世界各国的大多数学校所采用。","w":"high","e":["2026 真题"]},{"t":"活动课程论","y":"名词解释","p":["活动课程论。代表人物是美国实用主义教育家杜威。这是以经验为中心的课程理论，强调学生的生活经验中包括了各方面的知识，课程的编排应与生活经验的发展顺序相一致。","这种课程论强调要让学生掌握解决实际问题的知识，提倡“教育即生活”，“在做中学”，适应以培养能力为主的教学。","活动课程论强调发挥学生学习的主动性，强调教学与社会生活的联系，但对科学知识本身的逻辑体系和逻辑顺序注意不够，不利于学生掌握系统的知识。"],"q":"教育史上有多种课程理论，影响最大的是学科课程理论和活动课程论。","w":"high","e":["2026 真题","2026 445 二、教育学、心理"]}]}]},{"id":"yinlun-c04","t":"第四章 对外汉语教学的心理学基础和文化学基础","w":"high","s":[{"id":"yinlun-c04-s01","t":"第一节 对外汉语教学的心理学基础","w":"high","n":10,"k":[{"t":"记忆","y":"名词解释","p":["记忆是过去的经验在人脑中的保存和提取，是人脑对过去经历过的事物的反映。","第二语言记忆则是指第二语言知识和能力的保持和再现，是第二语言学习者主动积极的活动过程。","记忆按其内容分为形象记忆、逻辑记忆、情绪记忆和运动记忆等，第二语言记忆涉及到所有这些方面。","记忆按保持的状态和时间分为感觉记忆、短时记忆和长时记忆。"],"q":"二、记忆与第二语言学习心理学不仅阐述了有关语言的生理一心理基础，而且在语言学习理论、第一语言和第二语言学习、第二语言从感知·理解到记忆·表达的过程、第二语言语音·词汇·语法·汉字的学习心理以及学习者的个体因素等方面，都为本学科提供了坚实的理论依据。","w":"high","e":["2019 真题"]},{"t":"关键期","y":"名词解释","p":["据此，伦尼伯格于60年代提出语言习得“关键期”（critical period)或称“临界期”假说。","所谓语言习得关键期，就是指在青春期(12岁左右)以前，由于大脑语言功能侧化尚未完成，左脑和右脑都能参与语言习得的这段时期。","此时大脑灵活，可塑性大，因而比较容易习得语言。这是习得母语的最佳时期。","对语言习得关键期的假说，也存在不同看法。有的研究显示，婴儿一出生，大脑左半球就有对语音敏感的倾向，到四五岁大脑功能侧化就已基本完成。"],"q":"3.大脑功能侧化与语言学习“关键期”假说上述大脑两半球的分工，或者说大脑功能侧化的过程，究竟是什么时候开始、什么时候完成的? 研究失语症的资料进一步表明，左脑的损伤如果发生在儿童时期，右脑可以取而代之，对语言功能不会产生太大的影响。","w":"high","e":["2018 真题"]},{"t":"短时记忆","y":"名词解释","p":["短时记忆又称操作记忆，典型的例子是人们在拨电话时记住刚查找的号码，打完电话马上就忘掉了。短时记忆是对信息进行操作的系统，是动态系统。","感觉信息在短时记忆中保存一分钟左右，通常是以听觉形式编码，且基本保持逐词逐句的内容。","短时记忆容量有限，信息一次呈现后能在短时记忆中正确回忆起7±2个信息单位，以数字计大约为5至7个数，不相连的字母为7个，无关联的汉字一次则能记住6个。","在第二语言学习中如能在短时记忆中组成有意义的信息单位，如词、句，则记忆容量可以大大增加。"],"q":"儿童和少年模仿能力强，短时记忆力强，学习更灵活，敢于表现自己，善于在 一定的语言环境中自然而有效地习得语言，因此在获得准确、地道的语音和流利的口语方面占有优势；","w":"high","e":["2017 真题"]},{"t":"行为主义","y":"名词解释","p":["20世纪的美国心理学界出现了反对构造主义和机能主义的另一种思潮——行为主义。这是强调学习过程和测量外显行为的心理学派，其创始人是美国心理学家华生，后期主要代表人物是斯金纳。","行为主义有两个主要特点：否认意识，主张心理学只研究人的行为；反对内省，主张采用客观的实验的方法。","华生受俄国巴甫洛夫经典性条件反射学说的影响，建立了刺激——反应模式，成为经典性行为主义理论。新行为主义代表人物之一的斯金纳，则受到操作主义哲学的影响，建立了操作行为主义，和“刺激——反应——强化”的模式。"],"q":"与第一语言习得理论一样，第二语言习得理论也有属于行为主义的(如对比分析假说)，也有属于认知理论的(如中介语假说、内在大纲和习得顺序假说、输入假说、普遍语法假说等)，以及属于社会文","w":"high","e":["2026 真题","2026 445 二、教育学、心理"]},{"t":"前摄抑制","y":"名词解释","p":["干扰信息保持的因素有两类：一类是前边的学习活动对现在的记忆的保持所产生的影响，称为前摄抑制，也就是旧的记忆干扰新的记忆；另一类是后边的学习活动对现在的记忆保持所产生的影响，称为倒摄抑制，也就是后边的新的记忆干扰旧的记忆。","实验证明：两种学习活动的内容或材料完全相同或完全不同时，不会引起抑制；只有当二者既有相同又有不同处时才产生因内容类似而引起的抑制，特别是相同与不同各占一半时，引起的抑制最大。","为防止这两类抑制的作用，第二语言教学中尽可能把近似的材料分隔开学习。"],"q":"干扰信息保持的因素有两类：一类是前边的学习活动对现在的记忆的保持所产生的影响，称为前摄抑制，也就是旧的记忆干扰新的记忆；","w":"high","e":["2018 真题"]},{"t":"遗忘曲线","y":"名词解释","p":["这就是德国著名心理学家、记忆与遗忘现象实验研究的创始人艾宾浩斯的遗忘曲线。","遗忘规律启示我们，在第二语言教学中对已识记的材料应赶在遗忘以前迅速地、及时地进行巩固、复习、重现和运用，并且要经常复习，复习的间距由短拉长。","从识记的时间来看，遗忘的进程并不是均衡的。在识记的最初时间遗忘很快，识记后的一小时遗忘率达56％，以后就逐渐放慢，31天后遗忘率达79%，到一定程度就不再遗忘。"],"q":"这就是德国著名心理学家、记忆与遗忘现象实验研究的创始人艾宾浩斯(H.Ebbinghaus)的遗忘曲线。","w":"high","e":["2020 真题"]},{"t":"认知心理学","y":"名词解释","p":["认知心理学出现在本世纪初，在60年代由于行为主义心理学弱点的暴露而迅速发展起来。1967年美国心理学家奈塞尔发表《认知心理学》一书，标志着现代认知心理学的正式诞生。","广义的认知就是指人的认识活动，认知心理学研究人的认知过程，并把认知作为人的全部心理活动的过程。","认知心理学不是把人看做是刺激的被动接受者，而是信息加工者，一种具有丰富的内在资源并能利用这些资源与周围环境发生相互作用的积极的有机体。"],"q":"二是教学理论的研究逐渐改变了纯语言学研究的路子，更自觉地汲取心理学、教育学、语言习得理论、社会学、文化学和跨文化交际学的理论成果，借鉴认知心理学、社会语言学、心理测量学、教育统计学等学科的研究方法，探讨体现学科特色的研究方向。","w":"high","e":["2019 真题"]},{"t":"格式塔心理学","y":"名词解释","p":["20世纪初德国出现了反对构造主义的学派，即格式塔心理学，其创始人为韦特海默、考夫卡和柯勒。","德文“格式塔”（Gestalt）的意思是“整体”，又称“完形学派”。","该派反对把意识化解成元素，主张把心理作为一个整体组织来研究。认为整体不能还原为各个部分、各种元素；整体先于部分而存在并制约着部分的性质和意义；部分相加不等于整体，整体大于部分之和。","格式塔学派强调采用综合方法研究心理现象，在研究方法上主要采用演示和主观报告的方法，并在知觉、学习和问题解决等方面展开大量的实验研究。"],"q":"3.格式塔心理学(Gestal t Psychology)２０世纪初德国出现了反对构造主义的学派，即格式塔心理学，其创始人为韦特海默(M. Wertheinmer)、考夫卡(K. Kolfka)和柯勒(W.Kohler）。","w":"high","e":["2025 真题","2025 445 二、教育学、心理"]},{"t":"人本主义心理学","y":"名词解释","p":["人本主义心理学是本世纪60年代才在美国兴起的一个心理学流派，创始人是马斯洛，影响最大的代表人物是罗杰斯。","人本主义心理学强调心理学的首要任务是了解人、揭示人性的本质，认为既不要把人神化，也不要把人兽化。","人本主义心理学强调人的价值和尊严，强调人有自由的意志，有发展自身潜能和自我实现的需要。","在人与人的关系中，情感因素起决定作用，反对强迫、压制的方法，而是要启示人的自我意识，促进人的自我实现。"],"q":"7.人本主义心理学(Humanistic Psychology)人本主义心理学是本世纪60年代才在美国兴起的一个心理学流派，创始人是马斯洛(A. Maslow)，影响最大的代表人物是罗杰斯(C. R. Rogers)。","w":"high","e":["2020 真题"]},{"t":"长时记忆","y":"名词解释","p":["长时记忆是在头脑中长期保持的记忆，从保持一分钟以上直至终生。","长时记忆的容量是没有限度的，它的信息主要来自短时记忆，也有特别强烈的感知记忆一下子直接进入长时记忆。","短时记忆的信息要进入长时记忆，需要该信息呈现一定的强度(如生动程度)和重复，有的研究认为一个单词要反复10次才能记住。","长时记忆中信息主要以意义的形式保持，而不是逐词逐句的内容，也缺少细节。"],"q":"(3) 解释完词义后学生离开课本，听教师读生词或串讲生词(有的单个词，有的可联成词组、句子)，让学生在短时或长时记忆中检索。","w":"normal","e":[]}]},{"id":"yinlun-c04-s02","t":"第二节 对外汉语教学的文化学基础(一)","w":"high","n":5,"k":[{"t":"文化休克","y":"名词解释","p":["这些表现叫“文化震荡症”，也叫“文化休克”（cultural shock）。","文化休克是指在非本民族文化环境中生活或学习的人，由于文化的冲突和不适应而产生的深度焦虑的精神症状。","在跨文化交际中，或是进入非本民族文化生活环境中，以及学习目的语文化的过程中，文化差异都会引起人们的心理反应，产生一定的文化冲突，经历从文化不适应到适应的过程。这一过程大体上分为四个阶段：蜜月阶段、挫折阶段、调整阶段、适应阶段。","处于异文化环境中的人一般都要经历这一挫折期和文化震荡症。只不过文化震荡症在不同人身上表现的形式和程度不完全相同。"],"q":"(四) 文化休克“文化休克”, 又叫“文化震荡”“文化震惊” (cultural shock), 是1958年美国人类学家奥博格 (KalveroOberg)创造的一个概念。","w":"high","e":["2025 真题"]},{"t":"交际文化","y":"名词解释","p":["80年代初，对外汉语教学界的学者张占一等人，从第二语言教学培养交际能力的实际出发，按文化在交际中的功能提出区分“知识文化”和“交际文化”的观点。","交际文化则是指跨文化交际中直接影响信息准确传递(即引起偏差或误解)的语言和非语言的文化因素。","所谓知识文化是指跨文化交际中不直接影响准确传递信息的语言和非语言的文化因素。","交际文化则是指两种语言间规约性的文化差异，是以制约信息模式的形式来参与交际的，可能在交际中引起误解或偏差。"],"q":"记住大事年表、年节习俗由来、名人生辰功绩乃至城市的特产是需要的，但我们更希望学习者对中国文化的精神、中国人的价值观有所了解，了解中国人交际文化产生的根源，起到追本溯源的作用。","w":"high","e":["2018 真题"]},{"t":"知识文化","y":"名词解释","p":["所谓知识文化是指跨文化交际中不直接影响准确传递信息的语言和非语言的文化因素；交际文化则是指跨文化交际中直接影响信息准确传递(即引起偏差或误解)的语言和非语言的文化因素。","知识文化常以“知识”或“内容”的形式参与交际。“知识”的多少也会影响到交际的进行。但懂就是懂，不懂就是不懂，一般不会产生误解。","交际文化与知识文化概念的提出，加深了人们对语言教学中的文化教学的认识。"],"q":"364 对外汉语教学入门 (第三版)(三) 教材应多采用当代的内容目前的汉语教材中，有不少教材古代知识文化的比例太大，三皇五帝、三山五岳，厚古薄今，语言艰深，这是很不适合的。","w":"high","e":["2018 真题"]},{"t":"文化依附","y":"名词解释","p":["所谓文化依附，是指人们言行所代表和体现的是哪一种文化。","第二语言学习者为了掌握目的语，需要了解和学习目的语文化知识；第二语言教师为了帮助学习者掌握目的语，也需要介绍目的语文化知识。因此在这一过程中，原则上师生都需要依附目的语文化。","以学习汉语的外国学习者为例，为了尽快地学会汉语并正确地、得体地运用汉语，在他们学习期间、特别是在中国生活期间需要依附汉语的文化。","一般说来应依附于所用语言的文化。比如用汉语交际，应依附于汉语文化；主动依附的一方，往往是对对方文化有较多了解的一方。"],"q":"(5) 从跨文化交际的需要出发，选择文化依附。","w":"high","e":["2017 真题"]},{"t":"跨文化交际","y":"名词解释","p":["跨文化交际是指不同文化背景的人们之间的交际行为。这种交际主要是通过语言来进行的，称为跨文化语言交际。","影响跨文化语言交际的是不同文化之间的相同之处和不同之处，特别是文化差异。因此跨文化交际中要特别重视并研究文化差异。","跨文化交际的特点：(1)文化的差异与交际障碍；(2)交际原则与价值观念；(3)母语文化的思维定势和对异文化的成见；(4)交际过程中的相互接近和求同趋向；(5)交际的结果：文化的相互影响。","从上述五个特点可以看出，跨文化交际的根本特征是如何发现、认识和对待不同文化之间的差异。"],"q":"文化学部分，考虑到文化是对外汉语教学内容的一部分，因此本章不仅要论述文化学在理论上对本学科的指导作用，如文化的种类与特征，语言与文化的关系，跨文化交际的特点与跨文化交际中的文化冲突与适应等，同时也要涉及到对外汉语教学中的文化教学的一些比较具体的问题，如与语言教学相关的文化教学内容，特别是语言文化因素，文化教学的原则和方法等。","w":"high","e":["2019 真题"]}]},{"id":"yinlun-c04-s03","t":"第三节 对外汉语教学的文化学基础(二)","w":"high","n":5,"k":[{"t":"语义文化","y":"名词解释","p":["语义文化指语言的语义系统、主要是词汇中所包含的社会文化涵义，它反映了民族的心理模式和思维方式。","这是语言中的文化因素最基本、最大量的表现形式，也是语言教学中文化因素教学的重点之一。","首先是一个民族文化中特有的事物和概念体现在词汇中，而在别的语言中没有对应词语，如不加解释，第二语言学习者就难以理解。","更多的则是某一事物或概念虽在不同的语言中有对应词语，但词义却存在很大差别，因而在语言交际中最容易造成误解和障碍。"],"q":"陈光磊把这种文化因素分为语构文化、语义文化和语用文化①(详细介绍见下一小节)。","w":"high","e":["2019 真题"]},{"t":"语构文化","y":"名词解释","p":["语构文化指词、词组、句子和话语篇章的构造所体现的文化特点，反映了民族的心理模式和思维方式。","汉语结构最大的特点是重意合而不重形式。","不是用严格的形态变化来体现语法关系和语义信息，而是除了遵照一定的结构规则外，只要在上下文中语义搭配合乎事理，就可以合在一起组成句子、语段。","汉语的意合性也必然带来语言结构的灵活性和简约性。"],"q":"陈光磊把这种文化因素分为语构文化、语义文化和语用文化①(详细介绍见下一小节)。","w":"high","e":["2019 真题"]},{"t":"语用文化","y":"名词解释","p":["语用文化指语言用于交际中的语用规则和文化规约，是由不同民族的文化、特别是习俗文化所决定的。","语用文化是培养语言交际能力的主要内容，是对外汉语教学中文化因素教学的重点之一。","可以和功能意念的教学和语用规则的教学结合在一起。对外汉语教学中常用的基本的语用文化包括：称呼；问候和道别；道谢和道歉；敬语与谦辞；褒奖与辞让；宴请与送礼；隐私与禁忌。","如中国人敬老在称呼中加上“老”字如“老大爷”、“老大娘”。"],"q":"陈光磊把这种文化因素分为语构文化、语义文化和语用文化①(详细介绍见下一小节)。","w":"high","e":["2020 真题"]},{"t":"语言文化因素","y":"名词解释","p":["语言的文化因素是语言教学中的文化教学首先接触的、也是最重要的部分，主要指语言系统各层次的文化内涵和语言使用的社会规约。","语言文化因素主要隐含在词汇系统、语法系统和语用系统之中，在跨文化交际中制约着语言的理解和使用，甚至可能造成一定的交际误解和障碍。","缺少语言文化因素的教学就不能达到语言教学的目的，因此就像语音、词汇、语法和汉字等因素一样，文化因素也是语言中不可或缺的组成部分。","陈光磊把这种文化因素分为语构文化、语义文化和语用文化。"],"q":"文化学部分，考虑到文化是对外汉语教学内容的一部分，因此本章不仅要论述文化学在理论上对本学科的指导作用，如文化的种类与特征，语言与文化的关系，跨文化交际的特点与跨文化交际中的文化冲突与适应等，同时也要涉及到对外汉语教学中的文化教学的一些比较具体的问题，如与语言教学相关的文化教学内容，特别是语言文化因素，文化教学的原则和方法等。","w":"high","e":["2026 真题"]},{"t":"文化教学原则","y":"名词解释","p":["将上述文化教学的内容组织到对外汉语教学中去，需要体现以下原则：(1)要为语言教学服务，与语言教学的阶段相适应；(2)要有针对性；(3)要有代表性；(4)要有发展变化的观点；(5)要把文化知识转化为交际能力。","文化教学必须为语言教学服务，为培养语言交际能力的教学目标服务，这是本学科、本专业的性质所决定的。","文化教学中所介绍的中国文化，应该是主流文化、国家文化或者说是中国人共通的文化，而不是地域文化或部分人群的亚文化。"],"q":"三、对外汉语教学中的文化教学原则将上述文化教学的内容组织到对外汉语教学中去，需要体现以下原则：","w":"high","e":["2021 真题"]}]}]},{"id":"yinlun-c05","t":"第五章 语言习得理论","w":"high","s":[{"id":"yinlun-c05-s01","t":"第一节 语言学习与习得","w":"high","n":6,"k":[{"t":"顿悟","y":"名词解释","p":["顿悟是指突然觉察到解决问题的办法，要做到这点就必须对整个问题的情境进行知觉，了解构成情境的各要素之间的各种关系。","柯勒认为这是通过顿悟实现了学习，格式塔心理学认为顿悟学习可以避免盲目的试误学习。","格式塔心理学认为，有机体获得的每种经验都是一个有组织的整体，也就是完形——不是孤立的组成部分，也不是各组成部分的简单相加。","由于新经验的发生，对问题的情境以及情境各部分的关系需要进行知觉的重组或认知的重组，即由一种完形改变成另一种完形，从而实现顿悟。"],"q":"就其理论依据来看，实则是因为南禅主张顿悟，追求淡远，适合士大夫们的心理需求；","w":"high","e":["2019 真题"]},{"t":"习得","y":"名词解释","p":["“习得”是在自然的语言环境中，通过旨在沟通意义的言语交际活动，不知不觉(潜意识)地获得一种语言，典型的例子是儿童习得第一语言(一般是母语)。","简言之，习得是潜意识的自然的获得。","习得，特别是儿童第一语言的习得，是从本能的要求(生存和交际的需要)开始、与其生理和心理的自然发育、成熟同步进行的过程，儿童是在不知不觉中习得第一语言的。","习得一般是在使用该目的语的社会环境中进行的；习得时注意力主要集中在语言的功能和意义方面。"],"q":"从80年代初开始，由于学科建设的开展，对外汉语教学界同仁的学科意识不断增强，激发了从事科研的极大积极性，对指导教学实践所急需的教学方法、教材和测试评估等方面的研究全面展开，还开始了后来一直延伸到９０年代的文化与语言教学关系的大讨论，并加强了对国外的教学理论、习得理论和教学法流派的介绍与研究。","w":"high","e":["2019 真题"]},{"t":"认知学习理论","y":"名词解释","p":["认知学习理论受哲学上的理性主义的影响，认为学习是学习者对环境和客观事物主动的认识和行为的主动的改变，是主体的认知过程，而不是在外界环境支配下被动地进行刺激—反应的联结和行为习惯的改变。","它强调学习中认知机制所起的作用，着重探讨学习者内部心理结构的形成和改变。","这里主要介绍格式塔心理学的完形说和布鲁纳的认知—发现说。","德国格式塔心理学家柯勒通过猩猩取香蕉实验认为这是通过顿悟实现了学习，顿悟是指突然觉察到解决问题的办法。"],"q":"西方学习理论主要有两大派：一是行为主义学习理论，一是认知学习理论。","w":"high","e":["2019 真题"]},{"t":"行为主义学习理论","y":"名词解释","p":["行为主义学习理论受经验主义哲学影响，认为学习是人和动物受环境支配、获得经验而被动形成的行为的改变。在这一过程中，完全排斥人的主观思想或思维活动。","行为主义学习理论是在经典条件作用与操作性条件作用的基础上建立起来的刺激—反应学习理论，历来是西方学习理论的主体部分。","这里需要特别提到桑代克的“尝试—错误学习理论”和斯金纳的“操作学习理论”。","桑代克通过饿猫的“迷箱实验”提出联结试误说；斯金纳提出操作性(也称工具性)条件作用理论。"],"q":"西方学习理论主要有两大派：一是行为主义学习理论，一是认知学习理论。","w":"high","e":["2026 真题"]},{"t":"直觉掌握","y":"名词解释","p":["苏俄学者用“直觉掌握”和“自觉掌握”两个概念来表述这两种类型的学习。","直觉掌握指在使用语言时，意识所控制的是话语所表达的内容而不是它的语言形式；而自觉掌握则是指在使用语言时，意识所控制的是话语的语言形式而不是它所表达的内容。","与之相关的“直觉学习”指的是单纯模仿，知其然而不知其所以然，“自觉学习”则是指在理解的基础上模仿，不但知其然还要知其所以然。"],"q":"① 苏俄学者用“直觉掌握”和“自觉掌握”两个概念来表述。","w":"normal","e":[]},{"t":"____是指突然觉察到解决问题的办法。","y":"填空题","p":["顿悟"],"q":"顿悟是指突然觉察到解决问题的办法，要做到这点就必须对整个问题的情境(笼子里的事物)进行知觉，了解构成情境的各要素(如香蕉、距离、小箱子)之间的各种关系。","w":"normal","e":[]}]},{"id":"yinlun-c05-s02","t":"第二节 第一语言习得及主要理论和假说","w":"high","n":7,"k":[{"t":"图式","y":"名词解释","p":["认知结构的组成部分又称为图式(schema)，人脑中储存着各种各样的图式，如开车的图式、做饭的图式等。","图式是心理活动的组织结构，也是人类认识事物的基础，是人类向环境学习的产物，同时对新事物的理解和吸收又取决于头脑中已有的图式。","图式随着儿童心理的发展而变化，体现了认知的发展；而认知的发展受同化、顺应、平衡三个基本过程的影响。","图式是通过同化和顺应不断发展的。"],"q":"五、图式与推论 ⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯ (454)","w":"high","e":["2020 真题"]},{"t":"先天论","y":"名词解释","p":["先天论又称“内在论”，代表人物是乔姆斯基，是在乔姆斯基语言学理论、特别是80年代初提出的“普遍语法”理论基础上的儿童第一语言习得理论。","乔氏认为语言不像行为主义者所说的是“习惯的总和”，而是由抽象规则构成的复杂的体系。","人们习得语言绝不是单纯的模仿记忆，而是要把这些复杂的规则“内化”(internalization)，达到自动运用的程度，成为理解和产生言语的基础。","乔氏认为人类先天具有一种习得语言的特殊能力，表现为儿童头脑中有一种受遗传因素决定的“语言习得机制”(language acquisition device，简称LAD)。"],"q":"中介语假说是以普遍语法理论和先天论的母语习得理论为基础，它不但把第二语言的获得看做是一个逐渐积累、逐步完善的连续的过程，而且看做是学习者不断通过假设—验证主动发现规律、调整修订所获得的规律，对原有的知识结构进行重组并逐渐创建目的语系统的过程。","w":"high","e":["2019 真题"]},{"t":"普遍语法","y":"名词解释","p":["语言习得机制包括两部分：一部分是以待定的参数形式出现的、人类语言所普遍具有的语言原则，又称为“普遍语法”(universal grammar)。","普遍语法反映了人类语言的共性，它不是指那些具体的语法规则或某种语言的语法，而是存在于人类所有语言的深层结构中的语言中最本质的东西。","任何语言都会有元音，都有影响意义的语序，都有主语、谓语、宾语等句子的组成部分，都有表示时间关系的手段。","这些有关语法成分、句法结构以及句法转换等适合所有语言的语言知识和原则，成为“核心”部分，而各种语言本身所具有的特殊结构称为“外围”部分。"],"q":"为此,他提出“语言习得机制”(language acguisition device）和“普遍语法”（universal grammar）的假说和“深层结构”、“表层结构”的理论。","w":"high","e":["2020 真题"]},{"t":"语言功能论","y":"名词解释","p":["语言功能论以韩礼德为代表，别开生面地从语言交际功能的角度研究儿童语言的发展，是第一语言习得的主要理论之一。","在成人的语言体系中，语言结构只是其中的一部分，只是表达意思的手段之一。","儿童习得语言是为了学会如何表达意思，如何用语言做事、进行交际，因此更为重要的是掌握语言的语义体系和语用体系。","儿童习得母语的过程，应看做是逐步探索并掌握用语言来表示功能的各种方式的过程。"],"q":"这里主要介绍四种理论或假说：刺激一反应论、先天论、认知论和语言功能论。","w":"high","e":["2019 真题"]},{"t":"刺激—反应论","y":"名词解释","p":["刺激—反应论是行为主义心理学的理论，盛行于40年代和50年代，代表人物是斯金纳，是关于第一语言习得的主要理论之一。","行为主义者认为语言不是先天所有而是后天习得的，强调外部条件在第一语言习得过程中的作用。","这种行为跟人类的其他行为一样，是通过刺激—反应—强化的模式养成习惯而学会的；婴儿来到世界时像一张白纸，对这个世界、对语言没有任何先天的知识，完全由环境来塑造其行为。","儿童学话就是对环境所给予的刺激做出相应的反应，开始是对成人语言的模仿，如果模仿得比较接近，就从成人那儿得到奖励或赞许，这样他的反应就得到了强化。"],"q":"2. 习得理论强化论(reinforcement theory) 理论依据是行为主义的刺激反应论, 代表人物是斯金纳 (B. F. Skinner)。","w":"high","e":["2018 真题"]},{"t":"语言习得机制","y":"名词解释","p":["乔氏认为人类先天具有一种习得语言的特殊能力，表现为儿童头脑中有一种受遗传因素决定的“语言习得机制”(language acquisition device，简称LAD)。","这一特殊机制脱离人类的其他功能而独立存在，甚至跟智力没有直接关系，在12岁以前发挥作用。","语言习得机制包括两部分：一部分是以待定的参数形式出现的、人类语言所普遍具有的语言原则，又称为“普遍语法”。","语言习得机制的第二部分是评价语言信息的能力，也就是对所接触到的实际语言的核心部分进行语言参数的定值。"],"q":"为此,他提出“语言习得机制”(language acguisition device）和“普遍语法”（universal grammar）的假说和“深层结构”、“表层结构”的理论。","w":"high","e":["2020 真题"]},{"t":"认知论的理论基础是（　　）。","y":"名词解释","p":["认知论的理论基础是瑞士著名儿童心理学家皮亚杰的发生认识论。"],"q":"3.认知论认知论的理论基础是瑞士著名儿童心理学家皮亚杰(J. Piaget)的发生认识论(genetic epistemology)。","w":"normal","e":[]}]},{"id":"yinlun-c05-s03","t":"第三节 第二语言习得理论和假说","w":"high","n":12,"k":[{"t":"中介语","y":"名词解释","p":["美国语言学家塞林克于1969年提出中介语(interlanguage)的概念，1972年在其著名论文《中介语》中提出的中介语假说。","中介语是指在第二语言习得过程中，学习者通过一定的学习策略，在目的语输入的基础上所形成的一种既不同于其第一语言也不同于目的语、随着学习的进展向目的语逐渐过渡的动态的语言系统。","中介语既指学习者语言发展的任何一个阶段的“静态”语言系统，可以把它看做是某一阶段的“切片”；也是指学习者从零起点到靠近目的语的语言发展轨迹，可以把它看做是各阶段相接而形成的一种连续体。","中介语在其发展过程中的任何一个阶段都是学习者创造的一种介于第一语言和目的语之间的独特的语言系统；中介语不是固定不变的，而是一个不断变化的动态语言系统。"],"q":"在中介语理论影响下，突破了对比分析只强调第一语言干扰的局限，指出过度泛化等语内干扰以及学习策略、交际策略和学习环境所造成的偏误，弥补了对比分析的不足，全面分析学习者偏误及其来源并形成一套科学的偏误分析方法与程序，成为第二语言习得研究中的重要部分。","w":"high","e":["2020 真题"]},{"t":"化石化","y":"名词解释","p":["中介语的偏误有顽固性，语言中的某一部分可能会停滞不前，产生“僵化”或“化石化”(fossilization)的现象，特别表现在语音方面。","僵化的原因是多方面的。","可能是第一语言的影响无法消除；也可能是学习者意识到该偏误并不妨碍交际、甚至还得到过积极的反馈，便满足于已取得的进步而停滞不前；还可能是对目的语的某些方面形成偏见无法接受等。","第二语言学习者完全达到目的语的彼岸、具有说母语者的水平的情况很少，大部分学习者可能一辈子使用的都是中介语。"],"q":"语言中的某一部分可能会停滞不前，产生“僵化”或“化石化”（fossilization）的现象，特别表现在语音方而。","w":"high","e":["2020 真题"]},{"t":"输入假说","y":"名词解释","p":["从70年代末开始，美国语言教育家克拉申对第二语言习得提出了一系列假说，1985年在其著作《输入假说：理论与启示》中正式归纳为习得与学习假说、自然顺序假说、监控假说、输入假说和情感过滤假说等五个系列假说，总称为输入假说理论。","这一理论被认为是第二语言习得研究中论述最全面、影响最大的理论，但同时也是引起很多争议的理论。","输入假说认为人类获得语言的惟一方式是对信息的理解，也就是通过吸收可理解的输入(comprehensible input)习得语言知识；输入的语言信息既不要过难也不要过易，克拉申用“i+1”来表示，i代表学习者目前的语言水平，i+1则是下一阶段应达到的语言结构的水平。","克拉申强调听力活动对语言习得最为重要，语言习得是通过听力理解来实现的，而不是通过“说”获得的。"],"q":"与第一语言习得理论一样，第二语言习得理论也有属于行为主义的(如对比分析假说)，也有属于认知理论的(如中介语假说、内在大纲和习得顺序假说、输入假说、普遍语法假说等)，以及属于社会文","w":"high","e":["2025 真题","2025 445 二、教育学、心理"]},{"t":"内在大纲","y":"名词解释","p":["科德于1967年在其《学习者言语错误的重要意义》一文中提出，第二语言学习者在语言习得的过程中有其自己的内在大纲(built-in syllabus)。","而学习者的种种偏误正是这种内在大纲的反映。","学习者不是被动地服从教师的教学安排、接受所教的语言知识，而是跟儿童习得母语一样，有其自身的规律和顺序。这一顺序并非完全按照语言形式的难易，有迹象显示它与课堂上所教的语法规则的顺序并不一样。","内在大纲实际上是人类掌握语言的客观的、普遍的规律，教师只能在有限的范围内控制教学过程，无法完全控制学习者对输入的语言的内化过程。"],"q":"与第一语言习得理论一样，第二语言习得理论也有属于行为主义的(如对比分析假说)，也有属于认知理论的(如中介语假说、内在大纲和习得顺序假说、输入假说、普遍语法假说等)，以及属于社会文","w":"high","e":["2019 真题"]},{"t":"监控假说","y":"名词解释","p":["监控假说认为，与习得和学习分别相联系，人的头脑中有两个独立的语言系统，一是潜意识的系统，一是有意识的系统，而且两个系统似乎存在于大脑的不同部位。","流利地运用第二语言靠习得，交际中使用的输出的话语是由潜意识的习得系统引起或“驱动”的。","通过学习所获得的有意识的系统语言知识和规则，并不能使学习者表达得更为流利；有意识的系统在言语行为中只有一项功能，即只能作为一个监督者、一个编辑，起监控(monitor)的作用，对输出的言语形式进行检查和控制。","这种监控可能在说话前，也可能在说话同时甚至是说话之后进行校正。"],"q":"1985年在其著作《输入假说：理论与启示》中正式归纳为习得与学习假说、自然顺序假说、监控假说、输入假说和情感过滤假说等五个系列假说，总称为输入假说理论。","w":"high","e":["2020 真题"]},{"t":"对比分析假说","y":"名词解释","p":["对比分析假说由拉多于50年代中期行为主义鼎盛时期提出，认为第二语言的获得也是通过刺激—反应—强化形成习惯的结果。","拉多认为第二语言与第一语言相似的语言成分容易学，不同的成分则难学；两种语言结构特征相同之处产生正迁移，两种语言的差异导致负迁移。","迁移(transfer)是心理学的概念，指在学习过程中已获得的知识、技能和方法、态度等对学习新知识、技能的影响。这种影响有的起积极、促进的作用，叫正迁移，有的起阻碍的作用，叫负迁移，也叫干扰。","负迁移造成第二语言习得的困难和学生的错误，这就是对比分析假说。"],"q":"与第一语言习得理论一样，第二语言习得理论也有属于行为主义的(如对比分析假说)，也有属于认知理论的(如中介语假说、内在大纲和习得顺序假说、输入假说、普遍语法假说等)，以及属于社会文","w":"high","e":["2018 真题","2022 445 二、教育学、心理"]},{"t":"第二语言习得","y":"名词解释","p":["正因为第二语言学习中也包含有习得的因素，越来越多的人把第二语言学习也称为第二语言习得。","在第二语言学习理论的研究中，特别是西方学者的研究文章中已出现用术语“习得”代替“学习”的趋向。","有关第二语言习得的理论和模式，西方学者已提出不下数十种，从各个不同的角度论述或解释第二语言是如何习得的。","其中有的理论虽然影响不小，但尚未得到足够的科学实验的证实，还只能称为假说。"],"q":"在中介语理论影响下，突破了对比分析只强调第一语言干扰的局限，指出过度泛化等语内干扰以及学习策略、交际策略和学习环境所造成的偏误，弥补了对比分析的不足，全面分析学习者偏误及其来源并形成一套科学的偏误分析方法与程序，成为第二语言习得研究中的重要部分。","w":"high","e":["2019 真题"]},{"t":"情感过滤假说","y":"名词解释","p":["情感过滤假说也称屏蔽效应假说，是克拉申输入假说理论的重要组成部分。","第二语言学习者在学习和生活中有各种各样接触目的语的机会，这都是输入，但输入的语言信息有时并没有被吸收。","人类头脑中这种对语言的堵塞现象，是由于情感对输入的信息起了过滤作用，称为“情感过滤”(the affective filter)，或者说成为把输入挡在外边的屏障。","而造成这种过滤或屏障的主要是一些心理因素，如学习的动力、对所学语言的态度、自信心、是否紧张焦虑、是否处于防卫状态、怕出丑，甚至精神和身体状况不佳都能产生屏蔽效应，挡住输入。"],"q":"1985年在其著作《输入假说：理论与启示》中正式归纳为习得与学习假说、自然顺序假说、监控假说、输入假说和情感过滤假说等五个系列假说，总称为输入假说理论。","w":"high","e":["2025 真题","2023 445 二、教育学心理学"]},{"t":"习得顺序假说","y":"名词解释","p":["70年代进行的较有影响的研究是杜雷(H. Dulay)和伯特(M. Burt)按照布朗(R. Brown)研究儿童习得母语英语语素顺序的实验方法，率先进行的儿童习得作为第二语言的英语的语素习得顺序(acquisition order)的实验。","这些实验的结果发现，不同母语背景、不同年龄的英语作为第二语言的学习者，有非常相似的英语语素习得顺序。","这一顺序反映在克拉申于1982年列出的九项英语语素习得“自然顺序”表中，他认为从第一组到第四组的习得顺序是固定不变的。","克拉申赞同科德的内在大纲假说，认为人们习得语言规则有一个可以预测的共同顺序：有的先习得，有的后习得。"],"q":"与第一语言习得理论一样，第二语言习得理论也有属于行为主义的(如对比分析假说)，也有属于认知理论的(如中介语假说、内在大纲和习得顺序假说、输入假说、普遍语法假说等)，以及属于社会文","w":"high","e":["2019 真题"]},{"t":"文化适应假说","y":"名词解释","p":["文化适应假说由舒曼(J. Schumann)提出，从文化与语言的关系出发，把第二语言习得的过程看做是逐步适应目的语文化的过程。","把整个第二语言习得看做是文化适应的一部分，认为第二语言学习者对目的语文化的适应程度决定该目的语掌握的程度。","所谓文化适应是指学习者与目的语社团的社会和心理的结合，因此，学习者与目的语文化的社会距离与心理距离，就成了影响第二语言习得的主要因素。","心理距离主要指学习者在情感方面影响到第二语言习得的因素，包括语言障碍带来的焦虑，文化震荡带来的恐惧紧张以及动机、自尊心等。"],"q":"”这个观点被称为 .A 第三空间 R 编码规则 C 语言决定论 D文化适应假说","w":"high","e":["2025 真题"]},{"t":"语言原则参数理论","y":"名词解释","p":["普遍语法理论不仅是语法理论，也是语言习得的理论，用来解释第一语言是如何习得的、语言习得机制是如何发挥作用的。","乔氏认为婴儿的“最初语言状态”包括人类语言共有的语言原则和尚未定值的语言参数。","婴儿接触到具体的语言(如母语)通过假设—验证给这些语言参数定值，逐渐形成他母语的规则系统，这就是“语言原则参数”理论。","有实验表明，在第二语言习得中普遍语法仍起作用，人们对所接触到的第二语言的语言参数值可以再定值。"],"q":"这就是上一节谈的“语言原则参数”理论。","w":"high","e":["2020 真题"]},{"t":"洋泾浜化假说","y":"名词解释","p":["在社会与心理距离太大的情况下，学习者的语言就会停留在初级阶段形成洋泾浜化，即使在自然的语言环境中也不一定能习得目的语，这就是舒曼提出的洋泾浜化假说(Pidginization Hypothesis)。","而社会距离和心理距离二者之间，社会距离又起着主导的作用。","文化适应假说从文化与语言的关系出发，把第二语言习得的过程看做是逐步适应目的语文化的过程。","由缩短的社会距离或由好的社会因素所形成的有利的语言环境，能促成第二语言的习得；否则则起相反的作用。"],"q":"在社会与心理距离太大的情况下，学习者的语言就会停留在初级阶段形成洋泾浜化，即使在自然的语言环境中也不一定能习得目的语，这就是舒曼提出的洋泾浜化假说（Pidginization Hypothe-sis)。","w":"normal","e":[]}]}]},{"id":"yinlun-c06","t":"第六章 第二语言习得研究","w":"high","s":[{"id":"yinlun-c06-s01","t":"第一节 第二语言习得过程研究","w":"high","n":5,"k":[{"t":"偏误分析","y":"名词解释","p":["偏误分析(Error Analysis)是对学习者在第二语言习得过程中所产生的偏误进行系统的分析，研究其来源，揭示学习者的中介语体系，从而了解第二语言习得的过程与规律。","科德是偏误分析最早的倡导者。","偏误分析的心理学基础是认知理论，语言学基础则是乔姆斯基的普遍语法理论。","第二语言习得过程被看成是规则形成的过程，即学习者不断从目的语的输入中尝试对目的语规则做出假设，并进行检验与修正，逐渐向目的语靠近并建构目的语的规则体系。"],"q":"4.听说法五、论述题 (10分)论述偏误分析的意义和局限六、案例分析(40分)张老师在一所孔子学院任教，孔子学院为喜爱汉语的人设立了晚间汉语课，学生大多是已经工作的成年人，他们白天上班，只能晚上来学习，教了一段时间后，张老师发现教学状况很不好。","w":"high","e":["2020 真题"]},{"t":"对比分析","y":"名词解释","p":["对比分析(Contrastive Analysis)是将两种语言的系统进行共时比较，以揭示其相同点和不同点的一种语言分析方法。","把对比分析运用到第二语言教学中来，始于40年代的美国；提出第二语言习得的对比分析假说并建立起对比分析的理论系统的，是拉多。","对比分析的语言学理论基础是结构主义语言学，其心理学的理论基础是行为主义心理学和迁移理论。","对比分析大体上按照描写、选择、对比、预测四个步骤进行。"],"q":"与第一语言习得理论一样，第二语言习得理论也有属于行为主义的(如对比分析假说)，也有属于认知理论的(如中介语假说、内在大纲和习得顺序假说、输入假说、普遍语法假说等)，以及属于社会文","w":"high","e":["2019 真题"]},{"t":"话语分析","y":"名词解释","p":["话语分析作为一种语言研究方法，在第三章第二节已经做了介绍；70年代末大力倡导把话语分析用于第二语言习得研究的是哈奇(E. Hatch)。","她认为语言习得最重要的途径是语言交际，即第二语言学习者与以该语言为母语者之间的交谈，因此特别强调研究话语分析中的会话分析。","也有的学者认为不仅要研究学习者如何掌握语言形式，还要研究如何恰当地运用这些形式，因而强调研究言语行为和功能(如抱歉、邀请、埋怨等)。","对语言形式和功能的重视，打开了话语分析研究的广阔领域。"],"q":"(二) 话语分析课堂话语分析常常会关注“三段话语” (Sinclair & Coulthard, 1975), 即教师引发(initiates)、学生反应 (responds)、教师反馈(feedback)。","w":"high","e":["2020 真题"]},{"t":"运用分析","y":"名词解释","p":["运用分析(Performance Analysis)和话语分析(Discourse Analysis)也始于70年代，到80年代人们才更为重视第二语言习得运用分析与话语分析的研究。","运用分析是对第二语言学习者运用目的语的全部表现(既包括偏误部分也包括正确部分)进行分析，从而揭示中介语的发展轨迹。","迄今为止，西方学者的运用分析研究主要集中于对英语语素习得顺序的研究和对英语某些句法结构发展进程的研究；70年代初开始的语素研究，可以看做是最早的运用分析研究。","对英语某些句法结构如否定句、疑问句、关系从句等发展过程的研究，主要采用对一个或数个被试的语言运用进行较长期的跟踪调查。"],"q":"偏误分析存在局限性并不意味着它的消亡，而是促使它融入到在更大范围内对中介语进行分析的“运用分析”之中。","w":"high","e":["2019 真题"]},{"t":"偏误分析是对比分析的继承和发展。","y":"判断题","p":["偏误分析是对比分析的继承和发展，在中介语理论影响下，突破了对比分析只强调第一语言干扰的局限，弥补了对比分析的不足。"],"q":"(1) 偏误分析是对比分析的继承和发展。","w":"high","e":["2020 真题"]}]},{"id":"yinlun-c06-s02","t":"第二节 学习者的个体因素","w":"high","n":13,"k":[{"t":"态度","y":"名词解释","p":["态度是构成动机的主要因素之一。它是个体对某种客观事物的评价性反应，是在对事物了解的基础上产生情感上的褒贬好恶，并反映出对之采取行动的倾向性。","西方学者的调查表明，学习第二语言的态度与所取得的学习成绩之间的关系高于学习其他科目的态度与成绩之间的关系。","影响学习态度的几个方面是：对目的语社团和文化的态度、对目的语的态度、对课程和教师、教材的态度。","对大多数学习者来说直接影响其目的语学习态度的还是他们在语言课堂上的感受。"],"q":"四、强化、突出语音输入形式前面谈到听力微技能的一些方面与阅读课重叠，听力理解的题型 (如判断正误、选择正确答案、完型填空、填表、连线、改错等) 和题类 (如对词义的认识，对细节的捕捉，对单句句义的理解，对简单对话的理解以及对整个语段、整篇文章的概括，对说话者或作者的态度、用意、语气的判断等) 也基本同阅读课。","w":"high","e":["2019 真题"]},{"t":"抑制","y":"名词解释","p":["与自尊心有着密切关系的是抑制。抑制是个体的一种防御外部伤害、保护自我的心理屏障。","婴儿一生下来没有自我意识，甚至不能区分自我和周围世界；随着年龄的增长，自我意识逐渐形成。","从青少年时期开始，自我意识进一步发展，害怕自我暴露太多而使自尊心受到伤害，于是采用抑制的方法保护自我。","到了青春期随着在生理、认知和情感上受到的挫折增多，个体意识到不仅要认识自己还要认识周围的环境与社会，因而用于自我保护的抑制心理更为增强，而且一直发展到成年期。"],"q":"A.交际 B.移情 C.认同 D.抑制七、案例分析与写作(共40分)请根据以下材料，按照“发现问题————分析问题————解决问题”的思路，写一篇1500字以上的案例分析，要求：结构完整，格式正确，条理清楚，语言规范，观点明确，材料充实，卷面整洁。","w":"high","e":["2020 真题"]},{"t":"移情","y":"名词解释","p":["移情(empathy)是指设身处地领会别人的思想和感情。这是人与人交往中相互沟通、消除隔阂、达到和谐相处的必要条件。","语言是达到移情的主要手段，在语言交际过程中双方都要不断做出假设，揣摸从对方输入的信息所表达的意思以及将要输入的是什么信息。","由于认知因素和情感因素的差异，在同一语言文化的成员之间也需要有一定的移情，理解对方的认知及情感特点和状态，才能使交际顺利进行。","运用第二语言进行交际，除了认知和情感方面的差异外，更存在双方在文化上的差异和语言方面的障碍，更需要双方跨出自我的疆界，运用更多的移情来理解对方的文化特点和语言结构特点。"],"q":"”(《札记·乐记》郑玄注) 由于汉代以来的封建统治者以儒学作为自己的统治思想，因此特别强调艺术“厚人伦，美教化，移风俗”的社会作用，要求乐要移情，诗要言志，戏曲表演要教人为善。","w":"high","e":["2020 真题"]},{"t":"动机","y":"名词解释","p":["动机(motivation)在情感因素中又占极其重要的地位。动机是激励个体从事某种行为的内在动力，常表现为为达到某种目的而付出努力的愿望。","调查结果发现，在影响第二语言学习的诸因素中，动机占33%，学能占33%，智力占20%，其他占14%。","第二语言习得的动机是推动学习者学习并达到掌握第二语言目的的一种强烈愿望，包括目的、要达到目的的愿望、对学习的态度和努力行动四个方面。","动机有内部动机和外部动机之分，内部动机是个体自身所产生的动力，外部动机是外部因素作用的结果；动机还有近景动机和远景动机之分。"],"q":"1. 作者背景信息作者背景信息包括：年龄、性别、性格、学习动机、文化程度，国别、民族、职业，母语或第一语言、外语及其熟练程度，是否华裔、是否有汉字背景，所学专业、学历教育或进修、年级，学习汉语的时间长短、学习地点，等等。","w":"high","e":["2021 真题"]},{"t":"交际策略","y":"名词解释","p":["交际策略是学习者为顺利进行语言交际活动(即理解对话者的意图和表达自己的意思)有意识采取的计划措施或方法技巧，是语言使用者交际能力的一部分。","西方学者认为一般是在交际中遇到困难，如语言知识不能应付交际需要或缺乏某一特定的语言表达手段，无法按原定计划实现交际目标时，才采用交际策略。","对第二语言学习者来说，其交际活动在一定意义上也是学习活动的一部分，可以获得把学到的语言知识付诸实践进行运用的机会，是实现培养语言交际能力这一目标所不可缺少的。","各种具体的交际策略，实际上也扩充了学习者的语言表现手段。"],"q":"在中介语理论影响下，突破了对比分析只强调第一语言干扰的局限，指出过度泛化等语内干扰以及学习策略、交际策略和学习环境所造成的偏误，弥补了对比分析的不足，全面分析学习者偏误及其来源并形成一套科学的偏误分析方法与程序，成为第二语言习得研究中的重要部分。","w":"high","e":["2019 真题","2022 445 二、教育学、心理"]},{"t":"学习策略","y":"名词解释","p":["学习策略(learning strategies)是语言学习者为有效地掌握语言规则系统，发展言语技能和语言交际能力，解决学习过程中所遇到的问题而采取的各种计划、途径、步骤、方法、技巧和调节措施。","研究发现，不同学习者所采用的学习策略有很大的一致性和规律性。","综合看来，学习策略大体上可分为认知学习策略和元认知策略(metacognitive strategies)两大类。","根据最早研究学习策略的茹宾(J. Rubin)所提出的六种认知学习策略，可以概括为求解、推理、实践、记忆、监控几个方面。"],"q":"在中介语理论影响下，突破了对比分析只强调第一语言干扰的局限，指出过度泛化等语内干扰以及学习策略、交际策略和学习环境所造成的偏误，弥补了对比分析的不足，全面分析学习者偏误及其来源并形成一套科学的偏误分析方法与程序，成为第二语言习得研究中的重要部分。","w":"high","e":["2020 真题"]},{"t":"认知方式","y":"名词解释","p":["认知方式(cognitive style)是人们感知和认识世界的方式，对学习者说来，也是其学习方式。","认知方式存在着个体差异，这里着重讨论场独立性和场依存性、审慎与冲动、歧义容忍度等。","场独立性是易于从整体中发现个别的认知方式，善于剖析事物和问题，把部分与整体区别开来，能集中于某一部分而不受其他部分的干扰；场依存性是易于感知事物整体的认知方式，倾向于从宏观上看事物并把事物作为一个整体来对待。","审慎型的人在学习中善于周密地思考，全面分析，反复权衡以后才做决定或反应；冲动型的人在学习中反应快捷，甚至不假思索。"],"q":"三、认知方式⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯ (97)","w":"high","e":["2020 真题"]},{"t":"语言学能","y":"名词解释","p":["这种学习第二语言所需要的特殊认知素质叫做第二语言学习的能力倾向，也称语言学能(language aptitude)。","一般的智商测验不能准确地预测语言学能，专门用来测量语言学能的是语言学能测验。","有影响的语言学能测验有三种，即由卡罗尔(J. Carroll)和萨彭(S. Sapon)于1959年编制的《现代语言学能考试》和1967年编制的《初级现代语言学能考试》以及由平斯勒(P. Pimsleur)于1966年编制的《语言学能考试》。","语言学能测验，根据卡罗尔的观点，主要考查四种能力：语音编码解码能力、语法敏感性、强记能力、归纳能力。"],"q":"这种研究方法广泛应用于语言测试、语言学能、语言习得策略、语言使用心理、语言变体等课题中，以研究诸如学习态度、情感变量、语言水平、文化背景以及教师行为等因素之间的关系。","w":"high","e":["2020 真题"]},{"t":"元认知策略","y":"名词解释","p":["元认知策略就是学习者通过计划、监控和评估等方式对自己的认知过程进行反思和研究。","元认知可以说是对认知的认知，是一种深层次的认知活动，是学习者对自己的能力特点、对认知任务和认知策略的认知。","并通过认知活动中的体验，对认知过程和认知策略进行自我监控和调节，以保证学习活动的成功。","如学习者通过学习成绩的反馈发现自己学习方法的问题，通过与其他人学习策略和学习结果的对比，发现相互之间的差异，从而取长补短提高自己的学习效率。"],"q":"(二) 元认知策略、认知策略和社交/情感策略O' Malley和 Chamot (1990) 从功能角度, 将策略分为元认知策略、认知策略和社交/情感策略三大类。","w":"high","e":["2022 真题","2026 445 二、教育学、心理"]},{"t":"学习者的个体因素","y":"名词解释","p":["所谓学习者的个体因素，指第二语言学习者个体在习得过程中表现出的、对第二语言习得产生一定影响的生理、认知、情感等方面的特点。","由于语言学习活动必须通过学习者来实现，从这个意义上来说个体因素在语言习得中起决定的作用。","第二语言习得有普遍规律，同时学习者又表现出很多个体因素的特点。","第二语言习得即使是相同年龄、在同一教室的学习者之间，也表现出明显的差异，这种差异直接影响到学习的成绩和最终是否能获得第二语言。"],"q":"二、记忆与第二语言学习心理学不仅阐述了有关语言的生理一心理基础，而且在语言学习理论、第一语言和第二语言学习、第二语言从感知·理解到记忆·表达的过程、第二语言语音·词汇·语法·汉字的学习心理以及学习者的个体因素等方面，都为本学科提供了坚实的理论依据。","w":"high","e":["2019 真题"]},{"t":"元认知可以说是对认知的认知，是一种深层次的认知活动。","y":"判断题","p":["元认知可以说是对认知的认知，是一种深层次的认知活动，是学习者对自己的能力特点、对认知任务和认知策略的认知。"],"q":"元认知可以说是对认知的认知，是一种深层次的认知活动，是学习者对自己的能力特点、对认知任务和认知策略的认知，并通过认知活动中的体验，对认知过程和认知策略进行自我监控和调节，以保证学习活动的成功。","w":"high","e":["2022 真题"]},{"t":"____(empathy)是指设身处地领会别人的思想和感情。","y":"填空题","p":["移情"],"q":"移情(empathy)是指设身处地领会别人的思想和感情。","w":"high","e":["2020 真题"]},{"t":"对模糊不清或有歧义的问题的接受与容忍的程度叫____。","y":"填空题","p":["歧义容忍度"],"q":"对模糊不清或有歧义的问题的接受与容忍的程度叫歧义容忍度（ambiguity tolerance）。","w":"normal","e":[]}]},{"id":"yinlun-c06-s03","t":"第三节 语言学习环境","w":"high","n":2,"k":[{"t":"语言学习环境","y":"名词解释","p":["语言学习环境，是一个内涵与外延较广的概念。可以说，学习者主体以外、与语言学习和运用有关的一切周围事物都是语言学习环境的一部分。","从国家的政治、经济、文化、语言政策、教育政策等所形成的宏观语言环境，到使用目的语的社会大环境和课堂学习小环境。","如果说生理、认知、情感等个体因素是第二语言习得的内部条件的话，环境则是客观存在、影响第二语言习得的外部条件。","不论是一语言或第二语言的获得，都与环境有密切的关系。"],"q":"近十年来，国外第二语言教学研究的热点是：语言学习环境，包括语言学习与社会、团体、家庭和学校等环境因素的关系；","w":"high","e":["2019 真题"]},{"t":"有无目的语社会环境是第二语言教学和外语教学的主要区别。","y":"判断题","p":["第二语言学习，分为在目的语社会环境中和在非目的语社会环境中两种不同的情况，有无目的语社会环境是第二语言教学和外语教学的主要区别。"],"q":"前面已经提到，有无目的语社会环境是第二语言教学和外语教学的主要区别。","w":"normal","e":[]}]}]},{"id":"yinlun-c07","t":"第七章 第二语言教学法主要流派与发展趋向","w":"high","s":[{"id":"yinlun-c07-s01","t":"第一节 认知派与经验派教学法","w":"high","n":9,"k":[{"t":"听说法","y":"名词解释","p":["听说法是本世纪40年代产生于美国的第二语言教学法，强调通过反复的句型结构操练培养口语听说能力，又称“句型法”或“结构法”。","二次大战后期，美国向海外派遣大批军队，为短期内培养受过基本外语口语训练的人员而制订了军队特别培训课程，所以也称为“军队法”。","听说法的语言学理论基础是主张对活的语言(口语)进行仔细的描写分析、不同语言间进行结构对比的美国结构主义语言学。","其心理学理论基础是把人和动物的行为都纳入到刺激—反应轨道之中的行为主义心理学，特别是斯金纳的操作行为主义。"],"q":"目前，二语教学法多种多样, 如语法翻译法 (Grammar Translation Method)、直接法 (Direct Method)、听说法(Audiolingual Method)、程序教学法 (Presentation Practice Production)、全身反应法(Total Physical Response)、交际教学法 (Communicative Language Teaching)、任务型教学法 (Task-based Learning)、语块教学法(The Lexical Approach) 等。","w":"high","e":["2018 真题","2019 真题","2021 真题"]},{"t":"直接法","y":"名词解释","p":["直接法又称“改革法”或“自然法”，是主张以口语教学为基础，按幼儿习得母语的自然过程，用目的语直接与客观事物相联系而不依赖母语、不用翻译的一种第二语言教学法。","19世纪末20世纪初产生于西欧，主要是法国和德国。","直接法的语言观认为语言是习惯，语言的运用是靠感觉和记忆而不是思维。","直接法的心理学基础是联想主义心理学，认为人的学习方式与动物一样，是刺激与反应直接联结，否认意识在其间的作用。","直接法早期的代表人物有德国语言教育家菲埃托(V. W. Vietor)、德国教育家贝力子(M. Berlitz)、法国语言教育家古安(F. Gouin)等。"],"q":"(1)直接法。表示具体意义的词语(指事物或动作)，常用直观法，便于声音与概念直接联系。无法直接用实物展示的，也应尽量用目的语直接进行描述或解释。 如用已学过的“互相”、“帮助”来解释“互助”。","w":"high","e":["2017 真题","2020 真题"]},{"t":"认知法","y":"名词解释","p":["认知法又称认知—符号法(Cognitive-Code Approach)，60年代产生于美国，代表人物是美国心理学家卡鲁尔(J. B. Carroll)。","认知法主张在第二语言教学中发挥学习者智力的作用，通过有意识地学习语音、词汇、语法知识，理解、发现、掌握语言规则，并能从听、说、读、写方面全面地、创造性地运用语言。","认知法的语言学理论基础是乔姆斯基的转换生成语法理论，认为语言是一种受规则支配的体系而不是习惯体系；其心理学基础是认知心理学。","认知法还受到皮亚杰的“发生认识论”以及布鲁纳“学科结构论”和“发现学习论”等心理教育学理论的影响。"],"q":"这期间各种教学法如雨后春笋不断涌现，从40~50年代的情景法、听说法、视听法
