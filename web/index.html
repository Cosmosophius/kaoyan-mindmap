<!DOCTYPE html>
<html lang="zh-CN">
<head>

<script>(function(){try{var t=localStorage.getItem("theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(_){}})();</script>
<style>
/* ============================================================
   M3 配色：种子色 0xFF28C840（TreeChat ThemePalette.DEFAULT_GREEN）
   用 OKLCH 复现 HCT Tonal Spot 映射，深色主题下
   primary=tone80 / primaryContainer=tone30 / surface=tone6 这一套配对
   ============================================================ */
:root{
  /* ---------- 温暖手账质感配色 (Warm Journal Paper & Morandi Notes) ---------- */
  --h:85;

  /* 根卡：复古焦糖书皮手账 */
  --primary:            oklch(52% 0.11 55);
  --on-primary:         oklch(98% 0.01 55);
  --primary-container:  oklch(90.5% 0.042 60);
  --on-primary-cont:    oklch(26% 0.08 50);

  /* 章节卡：莫兰迪鼠尾草植物绿便签 */
  --secondary:          oklch(56% 0.08 140);
  --on-secondary:       oklch(98% 0.01 140);
  --secondary-container:oklch(91.8% 0.035 140);
  --on-secondary-cont:  oklch(25% 0.06 140);

  /* 小节卡：莫兰迪暖杏奶白便签 */
  --tertiary:           oklch(62% 0.07 75);
  --tertiary-container: oklch(93.8% 0.028 75);
  --on-tertiary-cont:   oklch(28% 0.06 65);

  /* 真题高频：复古麦穗金高亮便签 */
  --gold:               oklch(68% 0.16 85);
  --gold-container:     oklch(92.5% 0.08 88);

  /* 纸张底色：温暖象牙米白和纸（护眼哑光不刺眼） */
  --surface:            oklch(96.8% 0.016 88);
  --sc-lowest:          oklch(98.5% 0.008 88);
  --sc-low:             oklch(95.5% 0.018 88);
  --sc:                 oklch(94.2% 0.020 88);
  --sc-high:            oklch(92.0% 0.024 88);
  --sc-highest:         oklch(88.5% 0.028 88);

  /* 墨水文字色：浓郁复古钢笔墨水棕黑（极具手写温度） */
  --on-surface:         oklch(22% 0.025 55);
  --on-surface-var:     oklch(46% 0.035 55);
  --outline:            oklch(76% 0.030 80);
  --outline-var:        oklch(86% 0.020 85);

  /* Shape.kt：4/8/12/16/28 */
  --r-xs:4px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:28px;

  /* Compose MotionScheme 对应曲线 */
  --ease-standard: cubic-bezier(0.2,0,0,1);
  --ease-emphasized: cubic-bezier(0.05,0.7,0.1,1);
}

/* ---------- 暗色模式：复古深黛皮革手账 (Dark Leather Journal) ---------- */
[data-theme="dark"]{
  --primary:            oklch(76% 0.14 55);
  --on-primary:         oklch(20% 0.06 55);
  --primary-container:  oklch(30% 0.08 55);
  --on-primary-cont:    oklch(92% 0.05 55);

  --secondary:          oklch(78% 0.08 140);
  --on-secondary:       oklch(20% 0.04 140);
  --secondary-container:oklch(32% 0.05 140);
  --on-secondary-cont:  oklch(92% 0.03 140);

  --tertiary:           oklch(80% 0.09 75);
  --tertiary-container: oklch(32% 0.06 75);
  --on-tertiary-cont:   oklch(93% 0.04 75);

  --gold:               oklch(85% 0.15 85);
  --gold-container:     oklch(34% 0.08 85);

  --surface:            oklch(14% 0.015 60);
  --sc-lowest:          oklch(11% 0.012 60);
  --sc-low:             oklch(16% 0.016 60);
  --sc:                 oklch(19% 0.018 60);
  --sc-high:            oklch(23% 0.020 60);
  --sc-highest:         oklch(28% 0.024 60);

  --on-surface:         oklch(93% 0.012 85);
  --on-surface-var:     oklch(78% 0.022 85);
  --outline:            oklch(52% 0.025 75);
  --outline-var:        oklch(32% 0.018 70);
}
[data-theme="dark"] #grid{
  background-image:radial-gradient(circle, color-mix(in oklch, var(--outline) 30%, transparent) 1.2px, transparent 1.2px);
}
[data-theme="dark"] .card{
  box-shadow:0 1px 3px rgba(0,0,0,.35), 0 4px 12px rgba(0,0,0,.25);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--surface);}
body{
  font-family:-apple-system,"HarmonyOS Sans SC","Noto Sans CJK SC","Source Han Sans SC",
              "PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--on-surface);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}

/* ---------- 画布舞台 ---------- */
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:var(--surface);}
#stage.dragging{cursor:grabbing;}

/* 点阵背景：28px 手账点阵纸，跟随平移但不参与缩放重绘 */
#grid{
  position:absolute;inset:-72px;
  background-image:radial-gradient(circle, color-mix(in oklch, var(--outline) 40%, transparent) 1.2px, transparent 1.2px);
  background-size:28px 28px;
  will-change:transform;
  pointer-events:none;
}

/* 唯一合成层：所有平移缩放都只改这一层的 transform，不触发重排 */
#world{
  position:absolute;left:0;top:0;
  transform-origin:0 0;
  will-change:transform;
  backface-visibility:hidden;
}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;}
#edges path{
  fill:none;stroke-linecap:round;stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
}
#nodes{position:absolute;left:0;top:0;display:flex;align-items:flex-start;}
/* 嵌套 flex 树：对齐交给浏览器，JS 不再计算坐标 */
.tn{display:flex;align-items:center;}
.tc{flex:none;position:relative;}
.tk{display:flex;flex-direction:column;}

/* ---------- 卡片：实体手账便签质感 ---------- */
.card{
  position:relative;
  box-sizing:border-box;          /* 让 COL_W 是含 padding 的实际宽度 */
  border-radius:var(--r-md);
  background:var(--sc-high);
  border:1px solid color-mix(in oklch, var(--outline-var) 85%, transparent);
  padding:3px 7px;
  box-shadow:0 1px 2px rgba(90, 75, 60, 0.08), 0 3px 8px rgba(90, 75, 60, 0.05);
  will-change:transform,opacity;
  contain:layout style;
  transform-origin:0 50%;         /* 树向右生长：从左侧顶点长出 */
  transition:width .26s var(--ease-emphasized),
             background .18s var(--ease-standard),
             border-color .18s var(--ease-standard),
             box-shadow .22s var(--ease-standard),
             transform .14s var(--ease-standard);
}
.card:active{
  transform:scale(0.985);
}
/* 便签轻微抬升效果 */
@media (hover:hover) and (pointer:fine){
  .card:hover{
    box-shadow:0 3px 8px rgba(90, 75, 60, 0.12), 0 8px 18px rgba(90, 75, 60, 0.08);
    border-color:color-mix(in oklch,var(--outline) 65%, var(--outline-var));
  }
}
/* 键盘可达性：MD3 focus ring */
.card:focus-visible{
  outline:2px solid var(--primary);
  outline-offset:2px;
}
/* 分页哨兵：虚线胶囊 */
.card.more{
  background:transparent;
  border:1px dashed color-mix(in oklch,var(--primary) 42%, var(--outline-var));
  box-shadow:none;
  padding:6px 10px;
}
.card.more .label{
  color:var(--primary);font-size:12px;font-weight:600;
  -webkit-line-clamp:1;text-align:center;letter-spacing:.02em;
}
.card.more:hover{background:color-mix(in oklch,var(--primary) 9%, transparent);}
/* 量宽态：label 强制单行 nowrap，让 max-content 能得到真实文本宽度。
   量完立刻移除，用户看不到这一帧。 */
.card.measuring{width:max-content!important;max-width:none!important;}
.card.measuring .label{
  display:block!important;-webkit-line-clamp:unset!important;
  white-space:nowrap!important;overflow:visible!important;flex:none!important;
}
.card.root{
  border-radius:14px;
  background:var(--primary-container);
  border:1.5px solid var(--primary);
  box-shadow:0 4px 14px rgba(70, 45, 25, 0.16), inset 0 1px 0 rgba(255,255,255,0.45);
  padding:10px 13px;
}
.card.chapter{
  background:var(--secondary-container);
  border-color:var(--secondary);
  box-shadow:inset 3px 0 0 var(--secondary), 0 2px 8px rgba(80, 65, 50, 0.08);
}
.card.section{
  background:var(--tertiary-container);
  position:relative;
  border-color:color-mix(in oklch, var(--tertiary) 45%, var(--outline-var));
  box-shadow:inset 3px 0 0 var(--tertiary), 0 1px 4px rgba(80, 65, 50, 0.06);
}
/* section 的两个操作按钮改为「悬停浮现」：绝对定位到卡片右缘外侧，
   不占文档流宽度。实测它们常驻时占 36px，25 张 section 卡合计 900px，
   而 win/doc 属于低频操作，常驻显示纯属浪费面积。 */
.card.section .ibtn.act{
  position:absolute;top:50%;transform:translateY(-50%);
  opacity:0;pointer-events:none;
  background:var(--sc-highest);
  box-shadow:0 1px 3px rgba(0,0,0,.45);
  transition:opacity .16s var(--ease-standard),background .16s var(--ease-standard);
}
.card.section .ibtn.act[data-act="win"]{ right:-19px; }
.card.section .ibtn.act[data-act="para"]{ right:-37px; }
@media (hover:hover) and (pointer:fine){
  .card.section:hover .ibtn.act,
  .card.section:focus-within .ibtn.act{ opacity:1;pointer-events:auto; }
}
/* 触屏没有 hover，直接常驻显示（否则按钮永远点不到） */
@media (hover:none){
  .card.section .ibtn.act{ opacity:.85;pointer-events:auto;position:static;transform:none;right:auto;box-shadow:none;background:transparent; }
}
.card.kp{
  background:var(--sc);
  padding:2px 5px;
  border-color:color-mix(in oklch,var(--outline-var) 70%,transparent);
  box-shadow:none;
}
.card.kp.hot{
  background:var(--gold-container);
  border-color:var(--gold);
}
/* 真题高频：左侧 2px 金色竖条。
   原来用「真题」文字徽标，36px × 3,229 张 = 116,244px，
   占 kp 卡全部装饰宽度的 76.3%。竖条横向不占位，颜色同样能一眼分辨。 */
.card.kp.hot::before{
  content:"";position:absolute;left:0;top:3px;bottom:3px;width:2px;
  border-radius:2px;background:var(--gold);
}

.row{display:flex;align-items:center;gap:2px;}
.label{
  flex:1;min-width:0;
  overflow:hidden;
  /* 两行截断：中文标题不再被压成一行省略号 */
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  white-space:normal;
  word-break:break-word;
  line-height:1.18;
  font-weight:500;letter-spacing:0;
}
.card.root .label{font-size:15px;font-weight:700;color:var(--on-primary-cont);letter-spacing:.02em;}
.card.chapter .label{font-size:13px;font-weight:700;color:var(--on-secondary-cont);}
.card.section .label{font-size:12.5px;font-weight:600;}
.card.kp .label{font-size:13px;font-weight:500;}

.badge{
  flex:none;font-size:8.5px;line-height:1;padding:0 3px;border-radius:var(--r-xs);
  background:var(--tertiary-container);color:var(--on-tertiary-cont);
  letter-spacing:.02em;font-weight:600;
}
.badge.gold{background:var(--gold-container);color:var(--gold);}

/* 纯矢量图标按钮（无 emoji） */
.ibtn{
  flex:none;width:16px;height:16px;border:0;border-radius:50%;
  background:transparent;color:var(--on-surface-var);
  display:grid;place-items:center;cursor:pointer;
  transition:background .16s var(--ease-standard),color .16s var(--ease-standard);
}
.ibtn:hover{background:color-mix(in oklch,var(--on-surface) 10%,transparent);}
.ibtn:active{background:color-mix(in oklch,var(--on-surface) 16%,transparent);}
.ibtn svg{width:16px;height:16px;display:block;}
.ibtn.chev svg{transition:transform .22s var(--ease-standard);}
.card.open > .row > .ibtn.chev svg{transform:rotate(90deg);}

/* 详情行：随 LOD 淡出（源码 tween 180ms，阈值 scale 0.65） */
/* 详情行默认折叠：3,618 张知识点卡片若全部展开要点行，
   画布高度会被放大 3~4 倍，且低缩放下只是 opacity:0 —— 看不见却占着高度。
   现在默认只显示标题，点击才展开。 */
.detail{display:none;}
.card.open > .detail{
  display:block;
  margin-top:4px;font-size:11px;line-height:1.5;color:var(--on-surface-var);
  animation: detailDropIn .22s var(--ease-emphasized) forwards;
  transform-origin: top;
}
@keyframes detailDropIn{
  from{ opacity:0; transform:translateY(-4px); }
  to  { opacity:1; transform:translateY(0); }
}

/* 商业级题型微胶囊标签（Micro Capsule Tag） */
.tag-type{
  display:inline-flex; align-items:center;
  font-size:9.5px; font-weight:600; line-height:1;
  padding:2px 6px; border-radius:10px;
  background:color-mix(in oklch,var(--outline-var) 45%,transparent);
  color:var(--on-surface-var);
  margin-right:4px;
}
.tag-type.hot{
  background:var(--gold-container);
  color:oklch(38% 0.12 85);
  box-shadow:0 1px 2px rgba(180, 140, 40, 0.12);
}
[data-theme="dark"] .tag-type.hot{
  color:var(--gold);
}

.detail .pt{display:flex;gap:6px;margin-top:2px;}
.detail .pt::before{
  content:"";flex:none;width:3px;height:3px;border-radius:50%;
  background:var(--primary);margin-top:8px;
}
.card.kp.hot .detail .pt::before{background:var(--gold);}
.detail .quote{
  margin-top:6px;padding:6px 8px;border-radius:var(--r-sm);
  background:color-mix(in oklch,var(--on-surface) 5%,transparent);
  color:color-mix(in oklch,var(--on-surface) 72%,transparent);
  font-size:11px;line-height:1.6;
  border-left:2px solid var(--outline-var);
}
/* 正文：展开后直接在画布内变宽变高，弹性滑入展开 */
.para{
  margin-top:10px;padding-top:10px;
  border-top:1px dashed color-mix(in oklch,var(--outline-var) 85%,transparent);
  font-size:12.5px;line-height:1.9;
  color:color-mix(in oklch,var(--on-surface) 88%,transparent);
  max-height:min(520px, 62vh);
  overflow-y:auto;overscroll-behavior:contain;
  user-select:text;cursor:text;
  text-align:justify;text-justify:inter-ideograph;
  hanging-punctuation:allow-end;
  animation: paraSpringIn .28s var(--ease-emphasized) forwards;
  transform-origin: top;
}
@keyframes paraSpringIn{
  from{ opacity:0; transform:scaleY(0.9) translateY(-8px); }
  to  { opacity:1; transform:scaleY(1) translateY(0); }
}

/* 手账荧光笔高亮划线（Journal Highlighter Mark） */
.hl-quote{
  background:linear-gradient(180deg, transparent 40%, rgba(254, 230, 150, 0.55) 40%);
  border-radius:2px; padding:0 2px;
  font-weight:600;
  color:var(--on-surface);
}
[data-theme="dark"] .hl-quote{
  background:linear-gradient(180deg, transparent 40%, rgba(212, 160, 40, 0.35) 40%);
}
.para p{
  margin-bottom:10px;
  text-indent:2em;                /* 中文首行缩进 */
  padding-left:34px;              /* 给悬挂的段号留位 */
  text-indent:0;
}
.para p:first-child{margin-top:2px;}
.para .pid{
  display:inline-block;width:30px;margin-left:-34px;
  font-size:9.5px;color:var(--outline);
  font-variant-numeric:tabular-nums;
  vertical-align:baseline;
}
/* 继续加载按钮 */
.para-more{
  display:block;width:100%;margin:10px 0 2px;
  padding:9px 12px;border-radius:var(--r-sm);
  border:1px dashed color-mix(in oklch,var(--primary) 45%, var(--outline-var));
  background:transparent;color:var(--primary);
  font-size:12px;font-weight:600;cursor:pointer;
  font-family:inherit;
  transition:background .16s var(--ease-standard);
}
.para-more:hover{background:color-mix(in oklch,var(--primary) 10%, transparent);}
.para-more:active{background:color-mix(in oklch,var(--primary) 18%, transparent);}

/* ---- 紧凑模式（小屏）---- */
.compact .card{padding:9px 11px;border-radius:10px;}
.compact .card.root .label{font-size:15.5px;}
.compact .card.chapter .label{font-size:13.5px;}
.compact .card.section .label{font-size:13px;}
.compact .card.kp .label{font-size:12.5px;}
.compact .para{font-size:12px;line-height:1.82;max-height:min(440px,58vh);}
.compact .row{gap:6px;}
.compact .badge{font-size:9px;padding:2px 5px;}
.tiny .card{padding:8px 10px;}
.tiny .ibtn{width:22px;height:22px;}
.tiny .ibtn svg{width:14px;height:14px;}
.para::-webkit-scrollbar{width:4px;}
.para::-webkit-scrollbar-thumb{background:var(--outline-var);border-radius:2px;}

/* ---------- 侧边停靠坞（复刻 TreeChat WindowDockBar） ---------- */
#dock{position:fixed;inset:0;pointer-events:none;z-index:9000;}
.dockpin{
  position:absolute;pointer-events:auto;
  display:flex;align-items:center;gap:6px;
  padding:8px 9px;max-width:210px;
  background:var(--sc-high);
  border:1px solid var(--outline-var);
  box-shadow:0 3px 10px rgba(0,0,0,.45);
  cursor:grab;touch-action:none;user-select:none;
  transition:box-shadow .16s var(--ease-standard),transform .16s var(--ease-standard);
}
.dockpin:active{cursor:grabbing;}
.dockpin.dragging{box-shadow:0 9px 24px rgba(0,0,0,.62);transform:scale(.96);}
/* 贴边那侧方、靠内侧两角圆，视觉上"挂"在屏幕边缘 */
.dockpin.right{right:0;border-radius:16px 0 0 16px;border-right:0;}
.dockpin.left {left:0; border-radius:0 16px 16px 0;border-left:0;}
.dockpin svg{flex:none;width:12px;height:12px;display:block;}
.dockpin .dp-t{
  font-size:11.5px;font-weight:600;color:var(--on-surface);
  max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dockpin .dp-x{
  flex:none;width:18px;height:18px;padding:0;border:0;border-radius:50%;
  background:transparent;color:var(--on-surface-var);
  display:grid;place-items:center;cursor:pointer;
  transition:background .16s var(--ease-standard);
}
.dockpin .dp-x:hover{background:color-mix(in oklch,var(--on-surface) 14%,transparent);}
.dockpin .dp-x svg{width:10px;height:10px;}

/* ---------- 顶栏：手账封顶与书签标签 ---------- */
#topbar{
  position:fixed;left:0;right:0;top:0;z-index:20;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
  background:color-mix(in oklch,var(--surface) 90%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid color-mix(in oklch,var(--outline-var) 80%,transparent);
  box-shadow:0 1px 4px rgba(80, 65, 50, 0.05);
  display:flex;flex-direction:column;gap:9px;
  transition:transform .26s var(--ease-emphasized);
}
#topbar.hide{transform:translateY(-100%);}
.tb-row{display:flex;align-items:center;gap:10px;}
.tb-title{
  font-size:15px;font-weight:700;letter-spacing:.02em;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#books{
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  padding-bottom:2px;-webkit-overflow-scrolling:touch;
}
#books::-webkit-scrollbar{display:none;}
.chip{
  flex:none;border:1px solid color-mix(in oklch,var(--outline-var) 85%,transparent);border-radius:var(--r-sm);
  background:var(--sc-lowest);color:var(--on-surface-var);
  padding:6px 12px;font-size:12.5px;font-weight:500;white-space:nowrap;cursor:pointer;
  box-shadow:0 1px 2px rgba(80, 65, 50, 0.04);
  transition:background .2s var(--ease-standard),color .2s var(--ease-standard),border-color .2s var(--ease-standard),box-shadow .2s var(--ease-standard);
}
.chip.on{
  background:var(--secondary-container);color:var(--on-secondary-cont);
  border-color:var(--secondary);font-weight:700;
  box-shadow:0 2px 6px rgba(80, 65, 50, 0.08);
}

/* ---------- 右下工具列 ---------- */
#tools{
  position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:20;
  display:flex;flex-direction:column;gap:10px;
}
.fab{
  width:44px;height:44px;border:1px solid color-mix(in oklch,var(--outline-var) 80%,transparent);border-radius:var(--r-lg);
  background:var(--sc-lowest);color:var(--on-surface);
  display:grid;place-items:center;cursor:pointer;
  box-shadow:0 2px 6px rgba(80, 65, 50, 0.09), 0 6px 16px rgba(80, 65, 50, 0.05);
  transition:background .18s var(--ease-standard),transform .18s var(--ease-emphasized),box-shadow .18s var(--ease-standard);
}
.fab:active{transform:scale(.92);}
.fab svg{width:20px;height:20px;display:block;}
.fab.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary);}

/* ---------- 加载态 ---------- */
#hint{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);
  transform:translateX(-50%);z-index:15;
  padding:8px 16px;border-radius:var(--r-xl);
  background:var(--sc-highest);color:var(--on-surface-var);
  font-size:12px;white-space:nowrap;
  transition:opacity .4s var(--ease-standard);
  pointer-events:none;
}
#hint.gone{opacity:0;}

/* ============================================================
   悬浮小窗（FloatingWindowCard.kt / FloatingWindowManager.kt 复刻）
   小窗 16dp 圆角 + 阴影；真全屏 / 画布伪全屏一律 radius 0、elevation 0
   ============================================================ */
.win{
  position:fixed; left:0; top:0; z-index:40;
  display:flex; flex-direction:column;
  width:400px; height:520px;
  background:var(--sc-high);
  border:1px solid var(--outline-var);
  border-radius:16px;
  box-shadow:0 20px 44px rgba(0,0,0,.52), 0 4px 12px rgba(0,0,0,.34);
  overflow:hidden;
  will-change:transform,opacity;
  contain:layout style;
  transform-origin:50% 50%;
}
.win.full,.win.canvas-full{
  border-radius:0; border-width:0; box-shadow:none;
}

/* 真全屏：元素进入浏览器 top layer，直接铺满物理屏幕。
   这里用 !important 压过 applyWin() 每帧写的 inline transform / width / height，
   否则 JS 的弹簧会把全屏元素又缩回窗口尺寸。 */
.win:fullscreen,
.win:-webkit-full-screen{
  left:0!important; top:0!important;
  width:100%!important; height:100%!important;
  transform:none!important;
  border-radius:0!important; border-width:0!important;
  box-shadow:none!important;
  background:var(--sc-low);
}
.win:fullscreen .rz,
.win:-webkit-full-screen .rz{display:none;}
.win:fullscreen .win-title,
.win:-webkit-full-screen .win-title{cursor:default;}

/* 标题栏 46dp：拖动把手 + 双击进真全屏 */
.win-title{
  flex:none; height:46px;
  display:flex; align-items:center; gap:6px;
  padding:0 10px;
  background:var(--sc-highest);
  border-bottom:1px solid var(--outline-var);
  cursor:grab; touch-action:none; user-select:none;
}
.win-title:active{cursor:grabbing;}
.win.full .win-title,.win.canvas-full .win-title{cursor:default;}
.win-title .t{
  flex:1; min-width:0; font-size:13px; font-weight:600;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.win-title .ibtn{width:28px;height:28px;}
.win-title .ibtn svg{width:16px;height:16px;}
.win-title .ibtn.on{background:var(--primary-container);color:var(--on-primary-cont);}

/* 左上角四个 macOS 风格圆点（关闭 / 收起 / 画布全屏 / 真全屏） */
.win-dots{
  flex:none; display:flex; align-items:center; gap:7px;
  margin-right:6px; padding-left:2px;
}
.dot{
  width:11px; height:11px; padding:0; border:0; border-radius:50%;
  cursor:pointer; flex:none;
  transition:transform .16s var(--ease-standard),
             filter .16s var(--ease-standard),
             box-shadow .16s var(--ease-standard);
}
.dot:hover{transform:scale(1.2);filter:brightness(1.18);}
.dot:active{transform:scale(.9);}
.dot-close {background:oklch(68% 0.19 25);}
.dot-min   {background:oklch(82% 0.16 85);}
.dot-canvas{background:oklch(76% 0.15 150);}
.dot-full  {background:oklch(72% 0.14 235);}
.dot.on{box-shadow:0 0 0 2px color-mix(in oklch,var(--on-surface) 60%,transparent);}

/* 收起：只留标题栏 */
.win.collapsed .win-body{display:none;}
.win.collapsed .rz{display:none;}
.win.collapsed{box-shadow:0 8px 22px rgba(0,0,0,.5);}

/* 内容区 */
.win-body{
  flex:1; min-height:0;
  overflow-y:auto; overscroll-behavior:contain;
  padding:12px 14px 20px;
  user-select:text; cursor:text;
  -webkit-overflow-scrolling:touch;
}
.win-body::-webkit-scrollbar{width:5px;}
.win-body::-webkit-scrollbar-thumb{background:var(--outline-var);border-radius:3px;}
.win-body h4{
  font-size:11.5px; font-weight:700; color:var(--primary);
  margin:14px 0 8px; letter-spacing:.06em;
}
.win-body h4:first-child{margin-top:2px;}
.win-body .para p{
  margin-bottom:9px; font-size:13px; line-height:1.86;
  color:color-mix(in oklch,var(--on-surface) 88%,transparent);
}
.win-body .para .pid{
  font-size:10px; color:var(--outline); margin-right:6px;
  font-variant-numeric:tabular-nums;
}
.win-body .kpitem{
  border:1px solid var(--outline-var); border-radius:10px;
  padding:9px 11px; margin-bottom:9px; background:var(--sc);
}
.win-body .kpitem.hot{background:var(--gold-container);border-color:var(--gold);}
.win-body .kpitem .kt{
  font-size:13px; font-weight:700; margin-bottom:6px;
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
}
.win-body .kpitem .ky{
  font-size:10px; padding:2px 6px; border-radius:4px; font-weight:600;
  background:var(--tertiary-container); color:var(--on-tertiary-cont);
}
.win-body .kpitem.hot .ky{background:var(--gold-container);color:var(--gold);}
.win-body .kpitem .kp-pt{
  font-size:12px; line-height:1.72; color:var(--on-surface-var);
  display:flex; gap:6px; margin-top:3px;
}
.win-body .kpitem .kp-pt::before{
  content:""; flex:none; width:3px; height:3px; border-radius:50%;
  background:var(--primary); margin-top:7px;
}
.win-body .kpitem.hot .kp-pt::before{background:var(--gold);}
.win-body .loading{color:var(--outline);font-size:12.5px;}

/* 边缘缩放热区：右 8dp / 下 8dp / 右下角 16dp（源码热区收窄避免吃掉选词） */
.rz{position:absolute;z-index:3;touch-action:none;}
.rz-r{top:48px;bottom:32px;right:0;width:8px;cursor:ew-resize;}
.rz-b{left:32px;right:32px;bottom:0;height:8px;cursor:ns-resize;}
.rz-c{right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;}
.rz::after{
  content:"";position:absolute;background:var(--outline);
  opacity:0;transition:opacity .16s var(--ease-standard);
}
.rz-r::after{right:3px;top:50%;transform:translateY(-50%);width:3px;height:28px;border-radius:1.5px;}
.rz-b::after{bottom:3px;left:50%;transform:translateX(-50%);height:3px;width:28px;border-radius:1.5px;}
.rz-c::after{right:6px;bottom:6px;width:10px;height:10px;border-radius:2px;}
.win:hover .rz::after{opacity:.55;}
.win.full .rz,.win.canvas-full .rz{display:none;}

/* 吸附预览：Windows 同款影子，从窗口当前位置长出来 */
#snapGhost{
  position:fixed; z-index:38; pointer-events:none;
  border:1.5px solid var(--primary);
  background:color-mix(in oklch,var(--primary) 15%,transparent);
  border-radius:16px; opacity:0;
  transition:opacity .16s var(--ease-standard),
    left .22s var(--ease-emphasized), top .22s var(--ease-emphasized),
    width .22s var(--ease-emphasized), height .22s var(--ease-emphasized);
}
#snapGhost.on{opacity:1;}

/* ---------- 离线包状态胶囊 ---------- */
#pwaChip{
  position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);
  z-index:44; display:flex; align-items:center; gap:8px;
  padding:8px 16px 8px 12px;
  border-radius:var(--r-full);
  background:var(--sc-high); color:var(--on-surface-var);
  border:1px solid var(--outline-var);
  box-shadow:0 2px 6px rgba(0,0,0,.36), 0 8px 24px rgba(0,0,0,.30);
  font-size:12px; line-height:1;
  pointer-events:none;
  opacity:0; transition:opacity .28s var(--ease-standard),
                          transform .28s var(--ease-emphasized);
}
#pwaChip.on{opacity:1;}
#pwaChip[hidden]{display:none;}
#pwaChip .pwa-ico{display:flex;width:16px;height:16px;flex:none;}
#pwaChip .pwa-ico svg{width:16px;height:16px;display:block;}
#pwaChip.ready{color:var(--primary);border-color:color-mix(in oklch,var(--primary) 40%,transparent);}
#pwaChip.offline{color:var(--tertiary);border-color:color-mix(in oklch,var(--tertiary) 45%,transparent);}

/* ---------- 缩放指示 ---------- */
#zoomPct{
  position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom) + 118px);z-index:20;
  font-size:11px;font-variant-numeric:tabular-nums;color:var(--on-surface-var);
  background:var(--sc-lowest);border:1px solid color-mix(in oklch,var(--outline-var) 80%,transparent);border-radius:var(--r-sm);
  padding:2px 8px;pointer-events:none;
  box-shadow:0 1px 3px rgba(80,65,50,0.06);
}

/* ---------- 搜索面板：手账收纳抽屉 ---------- */
#searchPanel{
  position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);
  width:min(560px,calc(100vw - 32px));max-height:60vh;z-index:40;
  background:var(--sc-lowest);border:1px solid color-mix(in oklch,var(--outline-var) 80%,transparent);border-radius:var(--r-lg);
  box-shadow:0 12px 32px rgba(80,65,50,0.14), 0 2px 6px rgba(80,65,50,0.08);display:flex;flex-direction:column;overflow:hidden;
}
#searchPanel[hidden]{display:none;}
#searchInput{
  background:transparent;border:0;border-bottom:1px solid color-mix(in oklch,var(--outline-var) 80%,transparent);
  color:var(--on-surface);font-size:15px;padding:14px 16px;outline:none;
}
#searchList{overflow:auto;padding:6px;}
.sr{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;}
.sr:hover{background:var(--sc-high);}
.sr b{font-size:13px;font-weight:600;color:var(--on-surface);}
.sr span{font-size:11px;color:var(--on-surface-var);}

/* ---------- 面包屑：手账书签便签条 ---------- */
#crumbs{
  position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:15;
  display:flex;gap:6px;align-items:center;max-width:calc(100vw - 120px);
  font-size:12px;color:var(--on-surface-var);overflow:hidden;
  background:color-mix(in oklch,var(--surface) 92%,transparent);
  padding:4px 8px;border-radius:var(--r-sm);
  border:1px solid color-mix(in oklch,var(--outline-var) 80%,transparent);
  box-shadow:0 1px 3px rgba(80,65,50,0.05);
}
#crumbs button{
  background:transparent;border:0;color:inherit;font:inherit;cursor:pointer;
  padding:2px 4px;border-radius:4px;white-space:nowrap;
}
#crumbs button:hover{background:var(--sc-high);}
#crumbs .sep{opacity:.4;flex:none;}

/* ---------- 小屏适配 ---------- */
@media (max-width:600px){
  .tb-title{font-size:14px;}
  .chip{padding:5px 9px;font-size:12px;}
  .fab{width:40px;height:40px;border-radius:12px;}
  #tools{gap:8px;right:10px;}
  #crumbs{font-size:11px;max-width:calc(100vw - 96px);}
  #zoomPct{bottom:calc(env(safe-area-inset-bottom) + 106px);}
}
</style>

p":["地域文化的多样性","民族文化的多元并存","中原汉文化为主体","融合少数民族文化精华形成一体"],"q":"①从地域看，中国文化包含中原农耕文化与北部边疆游牧文化，农耕文化又分江南文化与北方文化；地域类型有三秦、三晋、燕赵、齐鲁、吴越、中州、两淮、荆楚、巴蜀、岭南等文化；②从民族看，包括汉文化与藏、蒙、满、壮、纳西等少数民族文化；③从社会性看，有皇家与民间、精英与大众、宗教与世俗文化；④主体部分是产生于中原地区的汉文化，同时","w":"high","e":["2020 真题"]},{"t":"简述了解中国文化的三个现实需要","y":"简答题","p":["世界人民了解中国的需要","文化自身保持独特性的需要","增强文化自信与传播责任"],"q":"①世界人民的需要：全球化时代各国迫切希望了解中国，孔子学院全球落地，东方智慧成为国际热门课题；②文化自身发展的需要：在经济全球化与市场经济冲击下，必须保持民族文化的独特性，分清精华与糟粕；③提高民族素质与传播责任的需要：我们对自己的文化了解不足，应增强文化自觉与自信，担负向世界传播中国文化的重任。","w":"high","e":["2018 真题"]},{"t":"简述今天我们了解中国文化的现实需要","y":"简答题","p":["世界人民了解中国的需要","文化自身延续发展的需要","提高民族素质与传播中国文化的需要"],"q":"了解中国文化的现实需要主要有三方面：①世界人民的需要，全球化时代各国迫切希望了解中国；②文化自身发展的需要，在全球化与市场经济冲击下保持民族文化的独特性；③提高民族素质、增强文化自信与担负向世界传播中国文化重任的需要。","w":"normal","e":["核心考点"]},{"t":"为什么说文化的核心问题是人","y":"简答题","p":["文化由人创造","不同人群创造不同文化","人享受文化也受文化约束","人是文化发展的主动者","研究文化即研究人的创造"],"q":"①文化由人创造，有人才能创造文化、形成文化，文化是人类智慧和创造力的体现；②不同种族、不同民族的人创造不同的文化；③人创造了文化，也享受文化，同时受文化约束，最终又要不断改造文化；④人始终是文化发展中的主动者，没有人的主动创造，文化便失去光彩、活力乃至生命；⑤研究文化实质上就是研究人的创造思想、创造行为、创造心理、创造","w":"normal","e":["核心考点"]},{"t":"简述文化的四个层次及其相互关系","y":"简答题","p":["物态文化层：物质生产活动及其产品","制度文化层：社会规范与制度","行为文化层：民风民俗与习惯定势","心态文化层：价值观念、审美情趣、思维方式","由外而内、心态为文化核心"],"q":"文化结构一般分为四个层次：物态文化层、制度文化层、行为文化层、心态文化层。物态文化层是人的物质生产活动及其产品的总和，是可感知的、具有物质实体的文化事物；制度文化层由人类在社会实践中建立的各种社会规范构成，包括社会经济制度、婚姻制度、家族制度、政治法律制度等；行为文化层是人们在日常交往中约定俗成的习惯性定势，以民风民俗","w":"normal","e":["核心考点"]},{"t":"结合\"各美其美，美人之美，美美与共，天下大同\"，论述对待中外文化应持的态度","y":"论述题","p":["费孝通提出十六字箴言","各美其美：珍视本民族文化","美人之美：尊重文化差异","美美与共：平等交流互鉴","反对全盘西化与盲目排外"],"q":"该十六字箴言由费孝通提出。对待中外文化应：①各美其美，认同并珍视本民族文化的价值，树立文化自信；②美人之美，尊重其他民族文化的独特性，摒弃文化中心主义；③美美与共，在平等交流中相互借鉴、取长补短；④天下大同，追求多元文化和谐共生的理想境界。反对全盘西化与盲目排外两种错误倾向。","w":"high","e":["2024 真题"]},{"t":"试论中国文化的未来走向","y":"论述题","p":["继承与创新相统一","民族性与世界性相统一","与现代化相适应","坚持马克思主义指导","增强文化自信推动走出去"],"q":"①坚持继承与创新相统一，在批判继承优秀传统的基础上推动创造性转化与创新性发展；②坚持民族性与世界性相统一，既保持民族文化的独特性，又以开放胸怀吸收世界优秀文明成果；③坚持与现代化相适应，使传统文化与市场经济、民主法治、科学技术相协调；④坚持马克思主义指导与中华文化立场，反对全盘西化与复古守旧两种倾向；⑤在全球化语境中增","w":"high","e":["2023 真题"]},{"t":"\"文化\"一词最早出现在《周易·贲》中：\"观乎天文，以察时变；观乎人文，以（  ）天下。\"","y":"填空题","p":["\"观乎人文，以化成天下\"是中国人论述文化的开始","此时\"文化\"二字尚未连用"],"q":"化成","w":"high","e":["2020 真题"]},{"t":"西方\"文化\"一词来源于拉丁文（  ），原意为耕种、居住、练习、注意。","y":"填空题","p":["拉丁文Cultura原意为耕种与培养","后引申为对人的性情陶冶与品德培养"],"q":"Cultura","w":"normal","e":["核心考点"]},{"t":"英国文化学家（  ）出版《原始文化》一书，给文化下了经典定义。","y":"填空题","p":["泰勒为英国文化学家","《原始文化》在文化史研究上具有开先河作用"],"q":"泰勒","w":"normal","e":["核心考点"]},{"t":"文化的核心问题是（  ），文化是人类智慧和创造力的体现。","y":"填空题","p":["有人才能创造文化、形成文化","人既是文化的创造者又是享用者"],"q":"人","w":"normal","e":["核心考点"]},{"t":"文化结构一般分为物态文化层、制度文化层、行为文化层和（  ）文化层四个层次。","y":"填空题","p":["心态文化层是文化的核心与精华","包括价值观念、审美情趣与思维方式"],"q":"心态","w":"normal","e":["核心考点"]},{"t":"明确提出\"各美其美，美人之美，美美与共，天下大同\"十六字箴言的著名社会学家是（ ）。","y":"单项选择题","p":["费孝通提出十六字箴言","体现文化自觉与文化平等思想"],"q":"C. 费孝通","w":"high","e":["2019 真题"]},{"t":"英国文化学家泰勒的《原始文化》一书，把文化界定为（ ）。","y":"单项选择题","p":["泰勒的文化定义","强调文化是复杂整体"],"q":"D. 包括知识、信仰、艺术、道德、法律、习俗和能力的复杂整体","w":"normal","e":["核心考点"]},{"t":"下列不属于文化结构四个层次的是（ ）。","y":"单项选择题","p":["四层次为物态、制度、行为、心态","不存在\"科技文化层\"之说"],"q":"D. 科技文化层","w":"normal","e":["核心考点"]},{"t":"狭义的文化指社会的意识形态以及与之相适应的制度和组织机构。","y":"判断题","p":["狭义文化即精神文化","与广义文化相对"],"q":"正确。狭义文化即精神文化，指社会的意识形态及相应的制度与组织机构，与广义文化（物质财富与精神财富总和）相对。","w":"normal","e":["核心考点"]},{"t":"文化结构中的心态文化层是文化的核心部分，也是文化的精华部分。","y":"判断题","p":["心态文化层为文化核心","涵盖价值观念与思维方式"],"q":"正确。心态文化层包括社会心理与社会意识形态，涵盖价值观念、审美情趣与思维方式，是文化的核心与精华。","w":"normal","e":["核心考点"]}]},{"id":"culture-c01-s02","t":"第二节 中国文化的特点与价值","w":"high","n":7,"k":[{"t":"文化软实力","y":"名词解释","p":["文化的凝聚力吸引力影响力","通过价值观念与制度模式体现","国家综合国力的重要组成部分"],"q":"指一个国家或地区文化所具有的凝聚力、吸引力和影响力，主要通过价值观念、思想文化、制度模式、文化产品等无形要素体现出来，是国家综合国力的重要组成部分。提高国家文化软实力，关系我国在世界文化格局中的定位和国际影响力。","w":"normal","e":["核心考点"]},{"t":"文化自觉","y":"名词解释","p":["费孝通提出","对自身文化有自知之明","明白来历、特色与发展趋向","取得文化选择的自主地位"],"q":"文化自觉是费孝通提出的概念，指生活在一定文化中的人对其文化有\"自知之明\"，明白它的来历、形成过程、所具有的特色和发展趋向，不带任何\"文化回归\"的意思，也不主张\"全盘西化\"或\"坚守传统\"。其意义在于加强对文化转型的自主能力，取得决定适应新环境、新时代的文化选择的自主地位。","w":"normal","e":["核心考点"]},{"t":"文化变迁","y":"名词解释","p":["文化内容与结构的变化","内生发明与外来传播两途","积累、传播、融合、冲突、整合","中国文化连续性靠调适与吸纳"],"q":"文化变迁指文化内容与结构发生的整体性或局部性变化，通常由内部发现发明（内生）与外部传播借用（外生）两种途径引起。其形式包括文化积累、文化传播、文化融合、文化冲突与文化整合。文化变迁是社会发展的常态，中国文化的连续性正是通过不断的内部调适与对外吸纳实现的。","w":"normal","e":["核心考点"]},{"t":"简述中国文化的民族特点","y":"简答题","p":["统一性：大一统文化格局","连续性：文明未曾中断","包容性：融合外来与民族文化","多样性：地域与民族异彩纷呈"],"q":"中国文化的民族特点主要表现为：①统一性，在长期历史发展中形成大一统的文化格局；②连续性，是世界上唯一未曾中断的古老文明；③包容性，能吸纳融合外来文化与少数民族文化；④多样性，地域文化、民族文化异彩纷呈。其精神内核是儒家思想，辅以道家与佛家思想。","w":"high","e":["2018 真题"]},{"t":"简述中国传统文化的主要特征","y":"简答题","p":["统一性：多元一体、趋于统一","连续性：未曾中断、一脉相承","包容性：吸收改造外来文化","多样性：多元一体的地域民族格局"],"q":"中国传统文化的主要特征可概括为四点：一是统一性，中国文化在长期历史发展中形成了以华夏文化为核心、不断吸纳融合各民族文化而趋于统一的格局；二是连续性，中国文化是世界上唯一未曾中断的古老文化，文字、典籍、制度一脉相承；三是包容性，中国文化善于吸收外来文化并加以改造，如佛教传入后的中国化；四是多样性，中国地域辽阔、民族众多，","w":"normal","e":["核心考点"]},{"t":"试论中国传统文化的基本特征及其当代价值","y":"论述题","p":["以人为本的人文精神","大一统的凝聚力与整体辩证思维","崇尚伦理道德与礼治","兼容并包、和而不同","当代价值：文化自信、生态文明、人类命运共同体"],"q":"中国传统文化的基本特征：①以人为本的人文精神，重人伦道德而轻宗教神学；②强大的凝聚力与统一性，大一统观念深入人心；③注重整体思维与辩证方法，如\"天人合一\"\"中庸\"；④崇尚伦理道德，以德治国、以礼立身；⑤兼容并包，善于吸收外来文化。当代价值：为社会主义核心价值观提供文化滋养，为人类命运共同体提供\"和而不同\"的智慧，为生态","w":"high","e":["2018 真题"]},{"t":"试论中国传统文化在现代化进程中的价值与局限","y":"论述题","p":["价值：仁义礼智信的道德资源","价值：和而不同与天人合一","价值：自强不息与经世致用","局限：宗法等级与人治传统","局限：重义轻利与崇古守成","结论：创造性转化、创新性发展"],"q":"中国传统文化在现代化进程中的价值主要体现在：其一，儒家的仁义礼智信与修身齐家治国平天下的理念，为现代社会的道德建设与公民人格养成提供资源；其二，和而不同、天人合一的思想，为处理人际关系、民族关系及人与自然关系提供智慧；其三，经世致用、自强不息的刚健精神，是民族复兴的精神动力；其四，重视教育、尊师重道的传统，为科教兴国提","w":"normal","e":["核心考点"]}]},{"id":"culture-c01-s03","t":"综合考点","w":"high","n":6,"k":[{"t":"简述中国古代“文化”概念的演变","y":"简答题","p":["《周易·贲》以文教化","汉代与武功相对指文教治理","唐代指诗书礼乐","古代主要指狭义精神层面"],"q":"①最早见于《周易·贲》“观乎人文，以化成天下”，指以文教化；②汉代“文化”一词正式出现，刘向《说苑·指武》“文化不改，然后加诛”，与“武功”相对，指文教治理手段；③唐代孔颖达解释为“诗书礼乐之谓”，指文学艺术与礼仪风俗等上层建筑；④宋明至清，顾炎武《日知录》认为人自身行为表现与国家制度皆属文化。可见中国古代的“文化”概","w":"high","e":["2016 真题"]},{"t":"简述西方“文化”概念的内涵","y":"简答题","p":["拉丁文Cultura原意为耕作培养","涵盖物质与精神两个领域","泰勒《原始文化》的经典定义","定义众多侧重各异"],"q":"西方“文化”一词源于拉丁文 Cultura，原意为耕种、居住、练习、注意，法文 Culture 又引申为对人的性情的陶冶和品德的培养，涵盖物质生产与精神生产两个领域。19世纪英国文化学家泰勒在《原始文化》中提出，文化是“包括知识、信仰、艺术、道德、法律、习俗和任何人作为一名社会成员而获得的能力和习惯在内的复杂整体”。此","w":"high","e":["2017 真题"]},{"t":"下列典籍中最早出现\"文化\"一词的是（ ）。","y":"单项选择题","p":["《周易·贲》\"观乎人文，以化成天下\"","汉代才出现连用的\"文化\"一词"],"q":"B. 《周易·贲》","w":"high","e":["2020 真题"]},{"t":"中国文化的精神内核是（ ）。","y":"单项选择题","p":["精神内核为儒家思想","辅以道家思想与佛家思想"],"q":"A. 孔子所创立的儒家思想","w":"normal","e":["核心考点"]},{"t":"\"文化\"一词最早见于《诗经》，指礼乐制度。","y":"判断题","p":["最早见于《周易·贲》而非《诗经》","汉代才出现连用的\"文化\""],"q":"错误。\"文化\"最早见于《周易·贲》\"观乎人文，以化成天下\"，且当时二字尚未连用，汉代才出现\"文化\"一词。","w":"normal","e":["核心考点"]},{"t":"中国文化是世界上唯一未曾中断的古老文明，这体现了中国文化的包容性。","y":"判断题","p":["未曾中断体现连续性","包容性指吸收融合外来文化"],"q":"错误。文明未曾中断体现的是中国文化的\"连续性\"；包容性指善于吸收融合外来文化与少数民族文化。","w":"normal","e":["核心考点"]}]}]},{"id":"culture-c02","t":"第二章 地理概况","w":"high","s":[{"id":"culture-c02-s01","t":"第一节 地理环境与行政区划","w":"high","n":18,"k":[{"t":"行省制度","y":"名词解释","p":["元代创立","行中书省为中书省派出机构","中国省制之始"],"q":"元代创立的地方行政制度，中央设中书省，地方设行中书省（简称行省），作为中书省的派出机构管理地方，明清沿袭并发展为省级行政区，是中国省制的开端。","w":"high","e":["2017 真题"]},{"t":"九州","y":"名词解释","p":["出自《尚书·禹贡》","冀兖青徐扬荆豫梁雍","后世以九州代指中国"],"q":"《尚书·禹贡》将天下分为冀、兖、青、徐、扬、荆、豫、梁、雍九州，这是中国古代最早的行政区划设想，\"九州\"后来成为中国的代称。","w":"normal","e":["核心考点"]},{"t":"郡县制","y":"名词解释","p":["秦统一后全面推行","分天下为三十六郡","中央直接任免、加强中央集权"],"q":"秦始皇统一六国后，废除分封制，在全国推行郡县制，分天下为三十六郡，郡下设县，由中央直接任免官吏，奠定了中国两千多年地方行政制度的基础。","w":"normal","e":["核心考点"]},{"t":"简述中国古代行政区划的沿革","y":"简答题","p":["秦：郡县制","汉：州郡县三级","唐宋：道、路","元：行省制度","明清：省府县三级"],"q":"①先秦实行分封制；②秦统一后推行郡县制，分天下三十六郡；③汉代郡国并行，后设州牧，形成州郡县三级；④唐代改郡为州，设道；⑤宋代改道为路；⑥元代创立行省制度；⑦明清沿袭行省制，形成省府县三级，基本奠定现代行政区划格局。","w":"high","e":["2017 真题"]},{"t":"简述中国历代行政区划的沿革","y":"简答题","p":["秦郡县制","汉州郡县","唐宋道路制","元行省制度","明清省府县","现行省市县乡"],"q":"①先秦实行分封制；②秦统一推行郡县制，以郡统县；③汉代郡国并行，后设州为监察区，渐变为行政区，形成州郡县三级；④唐代设道，宋代改道为路，形成路州县三级；⑤元代创立行省制度，为省制开端；⑥明清设省、府、县，并设总督巡抚；⑦现行省（自治区、直辖市）、市（地区）、县、乡四级制。总体趋势是中央集权不断加强、层级逐渐规范。","w":"high","e":["2019 真题"]},{"t":"简述地理环境对中国文化的影响","y":"简答题","p":["农耕经济与重农传统","相对封闭形成连续性独立性","地域辽阔形成多元地域文化","治水需求强化中央集权","多民族形成多元一体"],"q":"①大陆性季风气候与广阔平原，造就了以农耕为主的经济形态和重农抑商传统；②相对封闭的地理环境（东临大海、西有高原沙漠），使中国文化具有连续性与独立性的特点；③地域辽阔、南北差异大，形成多元地域文化（齐鲁、荆楚、吴越、巴蜀等）；④黄河长江两大流域为文明发祥提供条件，也带来治水与水利建设的公共职能需求，强化了中央集权；⑤多民","w":"high","e":["2021 真题"]},{"t":"简述现行省、市、自治区名称的主要由来","y":"简答题","p":["以山川湖泽命名（湖南湖北）","以历史古国命名（齐鲁晋）","以方位命名（山东山西）","以民族名称命名（自治区）"],"q":"现行省级行政区名称来源主要有：①以山川湖泽命名，如湖南、湖北（洞庭湖）、河南、河北（黄河）；②以历史地名或古国命名，如山东（齐鲁）、山西（晋）、陕西（陕原）；③以方位命名，如广东、广西、山东、山西；④以民族名称命名，如西藏、新疆、内蒙古、宁夏、广西等自治区；⑤以城市或简称演化，如上海、天津。","w":"normal","e":["核心考点"]},{"t":"简述现行省、市、自治区名称的由来","y":"简答题","p":["以山川地理方位命名","沿用历史政区名称","自治区以主要民族命名","直辖市以城市命名"],"q":"①多数省名源于古代行政区划或地理方位，如山东、山西以太行山为界，河南、河北以黄河为界，湖南、湖北以洞庭湖为界；②部分源于历史政区名称，如陕西源于陕原以西，甘肃取甘州、肃州首字；③自治区以主要民族命名，如内蒙古、西藏、新疆、广西、宁夏；④直辖市以城市名命名，如北京、上海、天津、重庆。名称多体现山川地理与历史沿革。","w":"normal","e":["核心考点"]},{"t":"简述中国地理环境对中国传统文化的影响","y":"简答题","p":["农耕经济形态与重农观念","半封闭格局带来连续性与保守性","黄河长江双源与多元一体","南北差异形成地域文化"],"q":"中国地理环境对传统文化的影响表现在：其一，大陆性季风气候与广阔的平原、河流，孕育了以农耕为本的经济形态，形成重农抑商、安土重迁的观念；其二，东临大海、西阻高原、北接荒漠的半封闭地理格局，使中国文化在相对独立的环境中发展，形成自成一体的连续性与保守性；其三，黄河、长江两大流域成为文明发源地，形成中原核心、多元一体的文化格","w":"normal","e":["核心考点"]},{"t":"简述“九州”与“五岳”的文化内涵","y":"简答题","p":["九州：大禹划分、代指中国的区划概念","九州是华夏一统的地理象征","五岳：东西南北中五座名山","泰山为五岳之首与封禅之地","五岳承载天人感应与礼制观念"],"q":"九州是古代中国的地理区划概念，相传大禹治水后划分天下为冀、兖、青、徐、扬、荆、豫、梁、雍九州，后世以九州代指中国，成为华夏一统观念的地理象征。五岳是古代山川崇拜与国家祭祀体系的产物，指东岳泰山、西岳华山、南岳衡山、北岳恒山、中岳嵩山，其中泰山为五岳之首，历代帝王封禅于此。五岳既是自然山岳，又被赋予政治与宗教意义，体现天","w":"normal","e":["核心考点"]},{"t":"元代创立（  ）制度，中央设中书省，地方设行中书省，是中国省制的开端。","y":"填空题","p":["元代创立行省","明清沿袭发展为省级行政区"],"q":"行省","w":"high","e":["2017 真题"]},{"t":"《尚书·禹贡》将天下分为（  ）州，后世遂以\"九州\"代指中国。","y":"填空题","p":["《禹贡》划分九州","冀兖青徐扬荆豫梁雍"],"q":"九","w":"normal","e":["核心考点"]},{"t":"秦始皇统一六国后，废除分封制，在全国推行（  ）制，分天下为三十六郡。","y":"填空题","p":["秦推行郡县制","郡下设县、中央任免"],"q":"郡县","w":"normal","e":["核心考点"]},{"t":"元代创立的地方行政制度是（ ）。","y":"单项选择题","p":["元代行中书省","中国省制开端"],"q":"A. 行省制度","w":"high","e":["2017 真题"]},{"t":"中国历史上首次在全国范围内推行郡县制的皇帝是（ ）。","y":"单项选择题","p":["秦统一后废分封行郡县","分天下为三十六郡"],"q":"D. 秦始皇","w":"normal","e":["核心考点"]},{"t":"\"九州\"之说最早见于（ ）。","y":"单项选择题","p":["九州出自《禹贡》","冀兖青徐扬荆豫梁雍"],"q":"B. 《尚书·禹贡》","w":"normal","e":["核心考点"]},{"t":"行省制度由元代创立，是中国省制的开端。","y":"判断题","p":["元代创立行省","中国省制开端"],"q":"正确。元代设行中书省作为中书省派出机构管理地方，明清沿袭发展为省级行政区。","w":"high","e":["2017 真题"]},{"t":"秦统一后在全国推行分封制，分天下为三十六郡。","y":"判断题","p":["秦推行郡县制而非分封制","三十六郡"],"q":"错误。秦统一后废除分封制，推行郡县制，分天下为三十六郡。","w":"normal","e":["核心考点"]}]},{"id":"culture-c02-s02","t":"第二节 山川名胜与古都","w":"normal","n":9,"k":[{"t":"黄河文明","y":"名词解释","p":["以黄河流域为中心","土壤肥沃便于农耕","长期为政治经济文化中心","被称为母亲河"],"q":"指以黄河流域为中心形成的中华文明。黄河全长约5464公里，是中国第二长河，中下游黄土高原与冲积平原土壤肥沃、便于农耕，历史上长期是中国政治经济文化中心。仰韶文化、龙山文化、二里头文化等均分布于黄河流域，故黄河被称为中华民族的“母亲河”。","w":"normal","e":["核心考点"]},{"t":"六大古都","y":"名词解释","p":["西安洛阳南京北京开封杭州","长期作为王朝政治中心","都城文化遗产丰富"],"q":"指中国历史上建都时间较长、影响较大的六座城市：西安（长安）、洛阳、南京（建康/金陵）、北京（燕京/大都）、开封（汴梁）、杭州（临安）。它们长期作为王朝政治中心，留下了丰富的都城文化遗产。","w":"normal","e":["核心考点"]},{"t":"五岳","y":"名词解释","p":["东岳泰山、西岳华山、南岳衡山、北岳恒山、中岳嵩山","定型于汉代","帝王封禅祭祀之所","承载天人相通的政治礼制"],"q":"五岳是中国古代对五座名山的封禅祭祀体系的合称，指东岳泰山、西岳华山、南岳衡山、北岳恒山、中岳嵩山。五岳之说定型于汉代，历代帝王以五岳为巡狩封禅、祭祀山川神祇之所。五岳不仅是地理概念，更承载了\"天人相通\"的政治礼制与山岳崇拜的文化内涵。","w":"normal","e":["核心考点"]},{"t":"简述黄河、长江与中国文明的关系","y":"简答题","p":["黄河中下游为最早发祥地","黄土便于耕作孕育夏商周","长江流域河姆渡良渚为重要源头","多元一体共同构成文明摇篮"],"q":"黄河中下游的中原地区是中国文化最早的发祥地，黄土疏松、便于耕作，孕育了夏商周文明，被誉为\"母亲河\"；长江流域的河姆渡、良渚文化同样是中华文明的重要源头，稻作农业发达。两大流域共同构成中华文明多元一体的摇篮。","w":"normal","e":["核心考点"]},{"t":"试论黄河流域成为中华文明核心区的原因","y":"论述题","p":["黄土肥沃适宜农耕","水源充足便于灌溉","平原相连交通便利","文化序列完整最早进入文明","长期为政治中心"],"q":"①自然条件优越：黄土疏松肥沃、易于耕作，季风气候雨热同期，适宜粟作农业发展；②水源充足：黄河及其支流提供灌溉与生活用水，河谷阶地便于聚落形成；③交通便利：平原相连，便于文化交流与政治整合；④文化积淀深厚：仰韶、龙山、二里头等文化序列完整，最早进入文明门槛；⑤政治中心长期在此：夏商周至汉唐多建都于关中与中原，形成强大辐射","w":"normal","e":["核心考点"]},{"t":"中国现存最早、最系统的古代地理著作是《（  ）》，其中《禹贡》篇影响最大。","y":"填空题","p":["《尚书·禹贡》为最早地理区划文献","九州之说源于此"],"q":"尚书","w":"normal","e":["核心考点"]},{"t":"下列省级行政区名称中以山川湖泽命名的是（ ）。","y":"单项选择题","p":["湖南湖北以洞庭湖为界","河南河北以黄河为界"],"q":"B. 湖南、湖北","w":"normal","e":["核心考点"]},{"t":"长江流域的河姆渡文化与良渚文化是中华文明的重要源头之一。","y":"判断题","p":["河姆渡良渚为长江流域文化","中华文明多元一体"],"q":"正确。长江流域稻作农业发达，河姆渡、良渚文化均为中华文明重要源头，与黄河流域共同构成多元一体的文明格局。","w":"normal","e":["核心考点"]},{"t":"中国历代疆域自秦以后始终保持不变。","y":"判断题","p":["历代疆域不断变化","清代基本奠定现代疆域"],"q":"错误。中国历代疆域随王朝兴衰而不断变化，秦、汉、唐、元、清各代疆域范围差异很大，总体呈逐步奠定与巩固的趋势。","w":"normal","e":["核心考点"]}]},{"id":"culture-c02-s03","t":"综合考点","w":"normal","n":1,"k":[{"t":"三皇五帝","y":"名词解释","p":["三皇：伏羲、神农、黄帝","五帝：黄帝、颛顼、帝喾、尧、舜","中华民族的人文始祖"],"q":"中国古代传说中的远古帝王。三皇通常指伏羲、神农、黄帝（或燧人、伏羲、神农）；五帝通常指黄帝、颛顼、帝喾、尧、舜。他们被视为中华民族的人文始祖。","w":"normal","e":["核心考点"]}]}]},{"id":"culture-c03","t":"第三章 历史纵横","w":"high","s":[{"id":"culture-c03-s01","t":"第一节 上古与先秦制度","w":"high","n":11,"k":[{"t":"三皇五帝","y":"名词解释","p":["三皇多指伏羲女娲神农","五帝指黄帝颛顼帝喾尧舜","被视为人文始祖","反映原始社会历史进程"],"q":"中国古代传说中的远古帝王。三皇说法不一，通常指伏羲、女娲、神农（或燧人、伏羲、神农）；五帝通常指黄帝、颛顼、帝喾、尧、舜。三皇五帝被视为中华民族的人文始祖，其传说反映了原始社会由母系到父系、由采集渔猎到农耕的历史进程。","w":"high","e":["2017 真题"]},{"t":"百家争鸣","y":"名词解释","p":["春秋战国社会大变革背景","儒道墨法等学派林立","围绕治国伦理天人关系论辩","奠定传统思想文化格局"],"q":"春秋战国时期社会大变革背景下出现的学术思想繁荣局面。主要学派有儒家（孔孟荀）、道家（老庄）、墨家（墨子）、法家（商鞅韩非）、名家、阴阳家、纵横家、杂家、农家等。各家围绕治国理政、伦理道德、天人关系展开论辩，奠定了中国传统思想文化的基本格局。","w":"high","e":["2016 真题"]},{"t":"禅让制","y":"名词解释","p":["原始社会末期推举首领","选贤与能、天下为公","禹以后为世袭制取代"],"q":"原始社会末期部落联盟推举首领的制度，即\"天下为公，选贤与能\"，尧传舜、舜传禹即其典型。禹以后传位于子启，禅让制被世袭制取代。","w":"normal","e":["核心考点"]},{"t":"宗法制","y":"名词解释","p":["血缘关系为纽带","嫡长子继承制为核心","周代确立、大宗小宗"],"q":"以血缘关系为纽带、以嫡长子继承制为核心的家族与国家相统一的制度，由周代确立，分大宗小宗，强调尊尊亲亲，对中国传统社会结构影响深远。","w":"normal","e":["核心考点"]},{"t":"分封制","y":"名词解释","p":["周天子分封土地人民","对象为王族功臣先代贵族","诸侯承担纳贡朝觐义务"],"q":"周灭商后，周天子把土地和人民分封给王族、功臣和先代贵族，建立诸侯国，诸侯对天子承担纳贡、朝觐、出兵等义务，以拱卫王室。","w":"normal","e":["核心考点"]},{"t":"井田制","y":"名词解释","p":["商周时期的土地制度","九区如井字，中为公田","八家同耕公田","土地王有，春秋瓦解"],"q":"井田制是商周时期的土地制度，因土地划分为\"井\"字形的九区而得名。中间一区为公田，周围八区为私田，八家同耕公田、私田自收，即\"同养公田，公事毕然后敢治私事\"。井田制以土地王有为前提，与分封制和徭役剥削相结合，春秋时期随着铁器牛耕推广与土地私有化而瓦解。","w":"normal","e":["核心考点"]},{"t":"禹死后其子启继位，标志着（  ）制取代禅让制，\"家天下\"由此开始。","y":"填空题","p":["启继位、家天下开始","世袭制取代禅让制"],"q":"世袭","w":"normal","e":["核心考点"]},{"t":"战国时期，（  ）在秦孝公支持下变法，废井田、开阡陌、奖励耕战，使秦国富强。","y":"填空题","p":["秦孝公支持","废井田开阡陌奖励耕战"],"q":"商鞅","w":"normal","e":["核心考点"]},{"t":"周代确立的以嫡长子继承制为核心的制度是（ ）。","y":"单项选择题","p":["血缘关系为纽带","嫡长子继承制"],"q":"C. 宗法制","w":"normal","e":["核心考点"]},{"t":"启继位标志着世袭制取代禅让制，\"家天下\"由此开始。","y":"判断题","p":["启继位、世袭制确立","家天下开始"],"q":"正确。禹死后其子启继位，禅让制被世袭制取代，王位在一家一姓中传承，史称\"家天下\"。","w":"normal","e":["核心考点"]},{"t":"宗法制以血缘关系为纽带，以嫡长子继承制为核心。","y":"判断题","p":["血缘关系为纽带","嫡长子继承制"],"q":"正确。周代确立的宗法制以血缘为纽带、嫡长子继承制为核心，分大宗小宗，强调尊尊亲亲。","w":"normal","e":["核心考点"]}]},{"id":"culture-c03-s02","t":"第二节 王朝更替与变法","w":"high","n":12,"k":[{"t":"焚书坑儒","y":"名词解释","p":["秦始皇加强思想专制","焚《诗》《书》百家语","坑杀儒生四百六十余人"],"q":"秦始皇为加强思想统治，采纳李斯建议，焚烧《诗》《书》及诸子百家著作，坑杀方士儒生四百六十余人，钳制了思想，摧残了文化。","w":"normal","e":["核心考点"]},{"t":"商鞅变法","y":"名词解释","p":["秦孝公支持、商鞅主持","废井田开阡陌、奖励耕战","推行县制、统一度量衡","使秦富强为统一奠基"],"q":"战国时期商鞅在秦孝公支持下推行的改革，主要内容有废井田开阡陌、奖励耕战、推行县制、统一度量衡、编制户籍等，使秦国富强，为统一奠定基础。","w":"normal","e":["核心考点"]},{"t":"改土归流","y":"名词解释","p":["明清在西南少数民族地区推行","废世袭土司、设流官","雍正朝鄂尔泰主持","加强中央对边疆管辖"],"q":"改土归流是明清时期在西南少数民族地区废除世袭土司、改设流官的政策。土司制度下地方首领世袭割据，中央难以控制；明永乐年间开始局部推行，清雍正年间鄂尔泰大力主持，在云南、贵州、广西、四川等地大规模实施。这一政策加强了中央对边疆的直接管辖，促进了民族地区与内地的交流，但也伴随武力镇压。","w":"normal","e":["核心考点"]},{"t":"简述中国古代宰相制度的演变","y":"简答题","p":["秦汉丞相总揽政务","隋唐三省六部制分相权","宋代二府三司分割相权","明代废丞相设内阁","清代军机处皇权达顶峰"],"q":"①秦设丞相，汉承秦制，丞相总揽政务；②汉武帝设中朝削弱相权；③隋唐三省六部制，相权一分为三；④宋代设参知政事、枢密使、三司使分割相权；⑤明代朱元璋废丞相，权归六部，设内阁；⑥清代设军机处，君主专制达到顶峰。总体趋势是相权不断削弱、皇权不断加强。","w":"high","e":["2018 真题"]},{"t":"试论中国古代王朝更替的基本规律","y":"论述题","p":["土地兼并引发农民起义","政治腐败制度僵化","边疆压力与军事失控","新王朝重建合法性","治乱循环的王朝周期律"],"q":"①经济基础决定：土地兼并加剧、赋役繁重导致农民起义，是王朝崩溃的常见导火索；②政治腐败与制度僵化：皇权专制下官僚体系腐败、党争内耗、财政危机难以自我革新；③边疆压力与军事失控：外族入侵或藩镇割据加速衰亡；④合法性重建：新王朝多通过“承天受命”、恢复秩序与轻徭薄赋获得认同；⑤周期性循环：治乱兴衰与人口土地矛盾形成“王朝周","w":"normal","e":["核心考点"]},{"t":"公元前221年，（  ）统一六国，建立中国历史上第一个中央集权的封建王朝。","y":"填空题","p":["前221年统一六国","建立中央集权封建王朝"],"q":"秦始皇","w":"normal","e":["核心考点"]},{"t":"汉武帝采纳董仲舒建议，\"罢黜百家，独尊（  ）术\"，确立儒学的正统地位。","y":"填空题","p":["董仲舒建议","确立儒学正统地位"],"q":"儒","w":"normal","e":["核心考点"]},{"t":"中国历史上第一个统一的中央集权封建王朝是（ ）。","y":"单项选择题","p":["前221年秦统一六国","建立中央集权制度"],"q":"B. 秦朝","w":"normal","e":["核心考点"]},{"t":"提出\"罢黜百家，独尊儒术\"并建议汉武帝采纳的思想家是（ ）。","y":"单项选择题","p":["董仲舒提出","汉武帝采纳、儒学正统"],"q":"D. 董仲舒","w":"normal","e":["核心考点"]},{"t":"明代废除丞相制度、权归六部的皇帝是（ ）。","y":"单项选择题","p":["明太祖朱元璋废丞相","设内阁、君主专制加强"],"q":"D. 朱元璋","w":"normal","e":["核心考点"]},{"t":"秦始皇为加强思想统治，采纳李斯建议焚书坑儒。","y":"判断题","p":["焚书坑儒","李斯建议"],"q":"正确。秦始皇焚《诗》《书》及诸子著作、坑杀方士儒生四百六十余人，钳制思想、摧残文化。","w":"normal","e":["核心考点"]},{"t":"中国古代宰相制度的总趋势是相权不断加强、皇权不断削弱。","y":"判断题","p":["相权削弱、皇权加强","明代废丞相、清代军机处"],"q":"错误。总趋势恰恰相反：相权不断削弱、皇权不断加强，至明代废丞相、清代设军机处而君主专制达到顶峰。","w":"normal","e":["核心考点"]}]},{"id":"culture-c03-s03","t":"第三节 庙号谥号年号","w":"normal","n":4,"k":[{"t":"庙号、谥号与年号","y":"名词解释","p":["庙号为太庙奉祀名号","谥号依生平事迹褒贬","年号始于汉武帝建元","均为帝王称谓纪年制度"],"q":"庙号是皇帝死后在太庙奉祀时追尊的名号，如太祖、世宗；谥号是依据生前事迹给予的褒贬称号，如文帝、武帝、炀帝；年号是皇帝纪年的名号，始于汉武帝建元，如贞观、康熙。三者是中国古代帝王称谓与纪年的重要制度。","w":"normal","e":["核心考点"]},{"t":"谥号","y":"名词解释","p":["死后依生平事迹给予的称号","相传始于西周","有美谥、恶谥、平谥之别","帝王由礼官议定，臣下由朝廷赐予"],"q":"谥号是古代帝王、诸侯、卿大夫及有名望者死后，依其生平事迹与品德给予的带有褒贬色彩的称号。谥法相传始于西周，如文、武、明、成等为美谥，厉、幽、炀等为恶谥，哀、怀等为平谥。帝王的谥号由礼官议定，臣下的谥号由朝廷赐予，私人门生故吏所议者称私谥。","w":"normal","e":["核心考点"]},{"t":"庙号","y":"名词解释","p":["帝王死后太庙奉祀的名号","始于商代","开国称祖、继嗣称宗","唐以后多用以称帝王"],"q":"庙号是古代帝王死后在太庙立室奉祀时特起的名号，始于商代。一般开国之君称\"祖\"，如汉高祖、唐高祖、明太祖；继嗣之君称\"宗\"，如汉太宗、唐太宗、宋仁宗。唐代以后，因谥号越加冗长，人们多以庙号或年号称呼帝王。庙号的给予有严格礼制，非有大功大德者不得称\"祖\"。","w":"normal","e":["核心考点"]},{"t":"年号","y":"名词解释","p":["帝王纪年的名号","始于汉武帝建元","新君即位或遇祥瑞改元","明以后一帝一元，常代称帝王"],"q":"年号是古代帝王纪年的名号，始于汉武帝建元元年（前140年），此后成为定制。新君即位或遇祥瑞灾异往往改元，一个皇帝可有多至十余个年号，明太祖以后基本一帝一元。年号多取吉祥嘉美之义，如贞观、开元、康熙、乾隆等，后世常以年号代称帝王。","w":"normal","e":["核心考点"]}]},{"id":"culture-c03-s04","t":"第四节 外戚与宦官","w":"high","n":2,"k":[{"t":"外戚与宦官","y":"名词解释","p":["外戚为母族妻族姻亲","宦官为宫廷内侍","东汉唐明多次专权","根源是君主专制下的制衡需要"],"q":"外戚指皇帝的母族、妻族等姻亲势力，宦官指宫廷内侍。中国古代多次出现外戚与宦官交替专权的局面，如东汉中后期外戚与宦官轮流把持朝政，唐代宦官掌握禁军废立皇帝，明代宦官干政（王振、魏忠贤）。其根源在于君主专制下皇权对官僚体系的猜忌与制衡需要。","w":"high","e":["2020 真题"]},{"t":"简述外戚与宦官交替专权的原因","y":"简答题","p":["皇权高度集中、皇帝年幼","外戚凭借后妃关系掌权","宦官亲近皇帝窃取内廷权力","专制皇权恶性发展的产物"],"q":"①皇权高度集中，皇帝年幼或昏庸时无法亲政；②外戚凭借后妃关系掌握朝政；③宦官因亲近皇帝、掌握内廷而窃取权力；④二者都依附于皇权，是专制皇权恶性发展的产物，东汉、唐、明尤为严重。","w":"normal","e":["核心考点"]}]},{"id":"culture-c03-s05","t":"综合考点","w":"high","n":5,"k":[{"t":"避讳","y":"名词解释","p":["对君主尊长之名不得直书直呼","国讳、家讳、圣讳三类","改字、缺笔、空字、改读","造成古籍文字变异"],"q":"避讳是古代为维护等级尊严，对君主、尊长之名不得直书直呼的制度，始于周、成于秦、盛于唐宋。主要有国讳（避帝王名）、家讳（避祖父母、父母名）、圣讳（避孔子等圣贤名）三类。避讳方法有改字、缺笔、空字、改读等。这一制度造成古籍中大量文字变异，是阅读古书必须掌握的知识。","w":"normal","e":["核心考点"]},{"t":"简述中国文化的源头","y":"简答题","p":["古人类化石表明中国是人类起源地之一","新石器时代南北两大文化区","三皇五帝传说","夏商周确立礼制宗法文字"],"q":"①人类起源：元谋人、北京人、山顶洞人等古人类化石表明中国是人类起源地之一；②文化源头：新石器时代有黄河流域的仰韶文化、龙山文化，长江流域的河姆渡文化、良渚文化，形成南北两大文化区；③传说时代：三皇五帝的传说反映原始社会向文明过渡；④王朝开端：夏商周三代确立礼制、宗法与文字传统，是中华文明正式形成的时期。","w":"high","e":["2018 真题"]},{"t":"简述中国古代历史分期的基本脉络","y":"简答题","p":["原始社会：母系到父系氏族","奴隶社会：夏商西周、井田制宗法制","封建社会：战国秦汉确立","隋唐鼎盛、宋元交融、明清转型"],"q":"中国古代历史大致可分为：原始社会（原始群、母系与父系氏族社会）、奴隶社会（夏商西周，以井田制与宗法制为特征）、封建社会。封建社会内部又可分为：战国秦汉为确立与初步发展期，魏晋南北朝为分裂与民族融合期，隋唐为鼎盛期，宋辽金元为继续发展与民族交融期，明清为衰落与转型期。这一分期体现了中国历史由分裂走向统一、由封闭走向开放、","w":"normal","e":["核心考点"]},{"t":"试述中国历史上统一与分裂交替出现的原因及历史启示","y":"论述题","p":["小农经济要求统一与安定","中央集权与地方割据的矛盾","地理阻隔与民族融合","统一是历史主流、大一统文化认同"],"q":"原因：①经济上，小农经济要求统一市场与安定的社会环境，而自然经济的地方分散性又为割据提供条件；②政治上，中央集权制度与地方势力膨胀的矛盾；③地理上，疆域辽阔、山川阻隔，易形成地方割据；④民族关系上，民族融合过程中的冲突与整合。历史启示：统一始终是中国历史的主流，分裂时期往往孕育着新的统一因素；中华民族在长期融合中形成\"","w":"normal","e":["核心考点"]},{"t":"试述中国历史上几次民族大融合的过程及其文化意义","y":"论述题","p":["第一次：春秋战国华夏族形成","第二次：魏晋南北朝孝文帝汉化改革","第三次：辽宋夏金元与回族形成","意义：多元一体格局","意义：生产生活方式互补","意义：统一多民族国家巩固"],"q":"中国历史上的民族大融合主要有三次高潮：第一次是春秋战国时期，华夏族与戎狄蛮夷通过战争、迁徙、通婚与文化交流逐渐融合，形成以华夏为核心的民族共同体，为汉族的形成奠定基础；第二次是魏晋南北朝时期，北方少数民族内迁建立政权，北魏孝文帝改革推行汉化政策，改汉姓、穿汉服、说汉话、通婚姻，胡汉文化深度交融，佛教艺术、乐舞、服饰、饮","w":"normal","e":["核心考点"]}]}]},{"id":"culture-c04","t":"第四章 姓氏与名、字、号","w":"high","s":[{"id":"culture-c04-s01","t":"第一节 姓与氏的起源","w":"high","n":15,"k":[{"t":"姓与氏","y":"名词解释","p":["姓为母系氏族族号、别婚姻","氏为姓的分支、别贵贱","秦汉以后姓氏合流"],"q":"姓是母系氏族社会的族号，用以\"别婚姻\"；氏是姓的分支，用以\"别贵贱\"，为父系社会贵族所专有。秦汉以后姓氏合流，姓氏不再区分。","w":"normal","e":["核心考点"]},{"t":"郡望","y":"名词解释","p":["姓氏世居某郡的显贵家族","魏晋门阀制度的产物","成为门第标志"],"q":"指某一姓氏世居某郡、为当地所仰望的显贵家族，如\"陇西李氏\"\"清河崔氏\"。魏晋南北朝门阀制度下，郡望成为门第高低的标志。","w":"normal","e":["核心考点"]},{"t":"谱牒","y":"名词解释","p":["记录家族世系的文献","即家谱族谱","魏晋重门第而发达"],"q":"记录家族世系、人物事迹的文献，即家谱、族谱。魏晋南北朝时期因选官重门第而极为发达，是研究家族史与社会史的重要资料。","w":"normal","e":["核心考点"]},{"t":"简述姓氏的主要来源","y":"简答题","p":["以国名封邑为姓","以居住地为姓","以官职为姓","以职业技艺为姓","以祖先名字谥号为姓","少数民族改姓与赐姓"],"q":"①以国名、封邑为姓，如齐、鲁、晋、楚、宋；②以居住地为姓，如东郭、西门、南宫；③以官职为姓，如司马、司徒、司空、史；④以职业技艺为姓，如陶、屠、巫、卜；⑤以祖先的名、字、谥号为姓，如孔、孟、庄；⑥以排行、爵位为姓，如伯、仲、叔、季；⑦少数民族改姓与帝王赐姓，如北魏孝文帝改拓跋为元。","w":"high","e":["2017 真题"]},{"t":"简述姓与氏的区别及其合流","y":"简答题","p":["姓起源于母系、别婚姻","氏为分支、别贵贱","春秋战国宗法瓦解","秦汉姓氏合流"],"q":"区别：①姓起源于母系氏族社会，是族号，作用为\"别婚姻\"，同姓不婚；②氏是姓的分支，起源于父系社会，为贵族所专有，作用为\"别贵贱\"。合流：春秋战国礼崩乐坏，宗法制度瓦解，平民开始有姓；秦汉以后姓氏合一，不再区分，统称为姓。","w":"normal","e":["核心考点"]},{"t":"简述中国姓氏的主要来源","y":"简答题","p":["以国名为姓（齐鲁宋）","以封邑为姓（屈）","以官职为姓（司马司徒）","以职业、居住地为姓","少数民族改姓与赐姓"],"q":"①以国名为姓，如齐、鲁、宋；②以封邑、采邑为姓，如屈、知；③以官职为姓，如司马、司徒；④以职业为姓，如陶、巫；⑤以居住地为姓，如东郭、西门；⑥以祖先的字或谥号为姓，如孔、庄；⑦少数民族改姓与帝王赐姓。","w":"normal","e":["核心考点"]},{"t":"简述姓与氏的区别及其历史演变","y":"简答题","p":["姓别婚姻，源于母系血缘","氏明贵贱，源于封地官职","贵族有氏、平民无氏","战国后姓氏合一，汉代通称姓"],"q":"先秦时期姓与氏有严格区别：姓是母系氏族社会的产物，代表血缘出身，用以别婚姻，“姓所以别婚姻”；氏是父系社会后按封地、官职、爵位等分化出来的分支，用以明贵贱，“氏所以别贵贱”。贵族有姓有氏，平民无氏。战国以后宗法制度瓦解，姓氏逐渐合一，汉代以后通称姓，不再区分。姓氏合一后，姓成为家族血缘的标志，氏则演变为姓的一部分。","w":"normal","e":["核心考点"]},{"t":"试论姓氏文化的社会意义","y":"论述题","p":["血缘认同与宗族凝聚","保存历史信息","家训族谱的文化传承","反映民族融合","联结海内外华人的纽带"],"q":"①血缘认同：姓氏是家族血缘的符号，强化宗族凝聚力与慎终追远的伦理观念；②历史记录：姓氏来源保存了古代封国、官职、职业、民族融合等历史信息，是研究社会史的重要材料；③文化传承：郡望、堂号、家训、族谱承载着家风家教的传承；④民族融合：少数民族改姓与赐姓反映了各民族交往交流交融；⑤当代价值：寻根问祖、宗亲文化成为联结海内外华","w":"normal","e":["核心考点"]},{"t":"姓起源于母系氏族社会，其主要作用是\"别（  ）\"；氏是姓的分支，主要作用是\"别贵贱\"。","y":"填空题","p":["姓别婚姻、同姓不婚","氏别贵贱"],"q":"婚姻","w":"normal","e":["核心考点"]},{"t":"魏晋南北朝时期，因选官重门第，记录家族世系的（  ）之学极为发达。","y":"填空题","p":["谱牒即家谱族谱","门阀制度下极为发达"],"q":"谱牒","w":"normal","e":["核心考点"]},{"t":"中国古代\"姓\"的主要作用是（ ）。","y":"单项选择题","p":["姓起源于母系氏族","同姓不婚、故别婚姻"],"q":"C. 别婚姻","w":"normal","e":["核心考点"]},{"t":"下列姓氏中来源于官职的是（ ）。","y":"单项选择题","p":["司马为古代官职","以官职为姓还有司徒、司空"],"q":"D. 司马","w":"normal","e":["核心考点"]},{"t":"魏晋南北朝时期门阀制度下，标志家族门第高低的称谓是（ ）。","y":"单项选择题","p":["郡望指世居某郡的显贵家族","如陇西李氏、清河崔氏"],"q":"B. 郡望","w":"normal","e":["核心考点"]},{"t":"姓起源于父系氏族社会，作用是\"别贵贱\"。","y":"判断题","p":["姓起源于母系、别婚姻","氏别贵贱"],"q":"错误。姓起源于母系氏族社会，作用是\"别婚姻\"；氏才是姓的分支，起源于父系社会，作用是\"别贵贱\"。","w":"normal","e":["核心考点"]},{"t":"秦汉以后姓氏合流，姓氏不再区分。","y":"判断题","p":["秦汉姓氏合流","不再区分姓与氏"],"q":"正确。春秋战国宗法制度瓦解，平民开始有姓，秦汉以后姓氏合一、不再区分，统称为姓。","w":"normal","e":["核心考点"]}]},{"id":"culture-c04-s02","t":"第二节 名、字、号与避讳","w":"high","n":11,"k":[{"t":"避讳","y":"名词解释","p":["君主尊长之名不得直呼书写","方法有改字、缺笔、空字","宗法礼制的产物"],"q":"中国古代为维护等级尊卑，对君主和尊长之名不得直呼、不得书写，须用改字、缺笔、空字等方法回避，是宗法礼制的产物。","w":"normal","e":["核心考点"]},{"t":"名与字","y":"名词解释","p":["名由长辈所取，供自称","字为成年礼所取，供他人称","名与字意义多相关联","男子二十冠而字，女子十五笄而字"],"q":"名与字是古代个人称谓的两个系统。名是出生后由长辈所取，供长辈呼唤及自称；字是成年礼（男子二十冠而字，女子十五笄而字）时另取的别名，供同辈与晚辈称呼，以示敬重。名与字意义多相关联，或同义互训（如诸葛亮字孔明），或反义相对，或连义推想。","w":"normal","e":["核心考点"]},{"t":"别号","y":"名词解释","p":["文人自取或他人所赠","与名字无必然联系","寄托志趣、标明居处","如东坡居士、六一居士"],"q":"别号是古代文人自取或他人所赠的称谓，与名、字无必然联系，多用于自称或友人称谓，以寄托志趣、标明居处。如陶潜号五柳先生、李白号青莲居士、苏轼号东坡居士、欧阳修号六一居士。别号可有两个以上，字数不限，是文人文化中表达个性与情怀的重要方式。","w":"normal","e":["核心考点"]},{"t":"简述古人名、字、号的讲究","y":"简答题","p":["名由父命名供尊长称呼","字为冠礼笄礼时所取表敬","号寄寓志趣自取或赠","另有谥号斋号"],"q":"①名：出生三月由父亲命名，供尊长称呼，自称亦称名；②字：男子二十岁行冠礼时取字，女子十五岁行笄礼时取字，字是名的解释与补充，供平辈或晚辈称呼，称字表敬；③号：又称别号，文人自取或他人所赠，用以寄寓志趣，如东坡居士、六一居士；④此外还有谥号（死后追赠）、斋号、室名等。名、字、号共同构成古代称谓礼制。","w":"high","e":["2021 真题"]},{"t":"简述古代名、字、号的区别与联系","y":"简答题","p":["名为长辈所取、供长辈呼唤","字为成年后取、供同辈称呼","号是自取或赠予的别称","字与名意义相关"],"q":"①名是出生后由长辈所取，供长辈呼唤；②字是成年行冠礼（女子及笄）后所取，供同辈或晚辈称呼，字与名往往意义相关；③号是人自取或他人所赠的别称，多用于文人自况，如\"东坡居士\"。三者共同构成古代称谓体系，体现宗法与礼制。","w":"normal","e":["核心考点"]},{"t":"简述古人“名”与“字”的关系及称用规则","y":"简答题","p":["字为名的补充与解释","同义互训、反义相对、连义推想","名用于自称与尊长称卑幼","字用于平辈尊称与卑幼称尊长","号为自取以寄志趣"],"q":"古人有名有字，字是名的补充与解释，二者意义往往相关联：或同义互训，如屈原名平字原；或反义相对，如韩愈字退之；或连义推想，如关羽字云长。称用规则上，名用于自称、尊长对卑幼的称呼；字用于平辈之间的尊称，以及卑幼对尊长的称呼。此外还有号，多为文人自取，用以寄寓志趣，如苏轼号东坡居士、欧阳修号六一居士。","w":"normal","e":["核心考点"]},{"t":"古代男子成年时行（  ）礼，女子成年时行及笄礼，之后取\"字\"。","y":"填空题","p":["男子二十行冠礼","女子十五行及笄礼","成年后取字"],"q":"冠","w":"normal","e":["核心考点"]},{"t":"苏轼自号\"（  ）居士\"，是古代文人以号自况的典型例子。","y":"填空题","p":["苏轼号东坡居士","号多为自取或他人所赠"],"q":"东坡","w":"normal","e":["核心考点"]},{"t":"古代男子成年时举行的礼仪是（ ）。","y":"单项选择题","p":["男子二十行冠礼","女子十五行及笄礼"],"q":"A. 冠礼","w":"normal","e":["核心考点"]},{"t":"古代\"字\"是出生后由长辈所取，供长辈呼唤。","y":"判断题","p":["名为出生后长辈所取","字为成年后所取"],"q":"错误。出生后由长辈所取、供长辈呼唤的是\"名\"；\"字\"是成年行冠礼后所取，供同辈或晚辈称呼。","w":"normal","e":["核心考点"]},{"t":"避讳制度要求对君主和尊长之名不得直呼、不得书写。","y":"判断题","p":["避讳为宗法礼制产物","改字缺笔空字"],"q":"正确。避讳是宗法礼制产物，须用改字、缺笔、空字等方法回避君主与尊长之名。","w":"normal","e":["核心考点"]}]}]},{"id":"culture-c05","t":"第五章 汉字","w":"high","s":[{"id":"culture-c05-s01","t":"第一节 汉字形体演变","w":"high","n":19,"k":[{"t":"隶变","y":"名词解释","p":["篆书圆转笔画变为隶书方折平直","打破象形传统、汉字完全符号化","古今汉字的分水岭"],"q":"汉字由小篆的圆转弧形笔画演变为隶书方折平直笔画的过程。它打破了古文字象形的传统，使汉字完全符号化，是古今汉字的分水岭，在汉字发展史上具有划时代意义。","w":"high","e":["2015 真题","2024 真题"]},{"t":"甲骨文","y":"名词解释","p":["刻于龟甲兽骨的占卜文字","现存最早的成体系汉字","安阳殷墟、商代后期","1899年王懿荣发现"],"q":"刻写在龟甲和兽骨上的占卜文字，是现存最早的成体系的汉字，出土于河南安阳殷墟，盛行于商代后期，1899年为王懿荣所发现。","w":"normal","e":["核心考点"]},{"t":"金文","y":"名词解释","p":["铸刻于青铜器、又称钟鼎文","盛行商周、西周为盛","笔画肥厚圆润、较甲骨文规范"],"q":"铸刻在青铜器上的文字，又称钟鼎文，盛行于商周，以西周为盛。笔画肥厚圆润，较甲骨文更为规范，是研究上古历史的重要资料。","w":"normal","e":["核心考点"]},{"t":"小篆","y":"名词解释","p":["秦统一后推行的标准字体","李斯整理、由大篆简化","笔画圆转匀称、结构整齐","第一次汉字规范化"],"q":"秦始皇统一六国后推行的标准字体，由李斯等人整理，以大篆为基础简化而成，笔画圆转匀称、结构整齐，是中国历史上第一次汉字规范化。","w":"normal","e":["核心考点"]},{"t":"石鼓文","y":"名词解释","p":["刻于十面鼓形石上","春秋战国秦国文字","现存最早石刻文字、石刻之祖"],"q":"刻在十面鼓形石上的文字，为春秋战国时期秦国的文字，是现存最早的石刻文字，字体介于大篆与小篆之间，被誉为\"石刻之祖\"。","w":"normal","e":["核心考点"]},{"t":"简述隶变在汉字发展史上的意义","y":"简答题","p":["圆转变方折、形成基本笔画","打破象形传统、完全符号化","简化偏旁、便于书写","古今汉字分水岭、奠定现代汉字基础"],"q":"①隶变把篆书圆转弧形笔画变为方折平直笔画，形成汉字基本笔画；②打破了古汉字象形的传统，使汉字完全符号化；③改造、合并部分偏旁，减少笔画，便于书写；④奠定了现代方块汉字的基础，是古今汉字的分水岭，具有划时代意义。","w":"high","e":["2015 真题","2024 真题"]},{"t":"简述汉字的形体演变过程","y":"简答题","p":["甲骨文→金文→篆书","小篆为第一次汉字规范化","隶变是古今汉字分水岭","楷书通行至今、由繁到简"],"q":"汉字形体演变大致经历：①甲骨文（商代，刻于龟甲兽骨）；②金文（商周，铸于青铜器）；③篆书（大篆、小篆，秦统一后以小篆为标准）；④隶书（秦汉，隶变使汉字符号化）；⑤楷书（魏晋以后通行至今）；⑥辅助字体草书、行书。总趋势是由繁到简、由象形到符号化。","w":"high","e":["2024 真题"]},{"t":"简述汉字形体的演变过程","y":"简答题","p":["甲骨文象形性强","金文笔画圆浑","小篆规范定型书同文","隶书方折平直完成隶变","楷书成为通行字体","总趋势由繁到简符号化"],"q":"汉字形体演变大致经历：①甲骨文（商，刻于龟甲兽骨，象形性强）；②金文（商周，铸于青铜器，笔画圆浑）；③小篆（秦，圆转匀称，规范定型，书同文）；④隶书（秦汉，方折平直，隶变完成古今文字转变）；⑤楷书（魏晋以后，笔画平直方正，成为通行字体）；⑥辅助字体有草书、行书。总趋势是由繁到简、由象形到符号化。","w":"high","e":["2018 真题"]},{"t":"简述汉字形体演变的几个主要阶段","y":"简答题","p":["甲骨文：商代、笔画瘦硬","金文：青铜器、笔画圆润","小篆：秦代李斯整理、定型规范","隶书：隶变为古今文字分水岭","楷书：汉末兴起、方正通行","总趋势：由繁趋简、符号化"],"q":"汉字形体演变大致经历：甲骨文、金文、篆书（大篆、小篆）、隶书、楷书，以及辅助性的草书、行书。甲骨文是商代刻在龟甲兽骨上的文字，笔画瘦硬、形体不固定；金文是铸刻在青铜器上的文字，笔画肥厚圆润；小篆是秦统一后李斯整理的标准字体，线条圆转、结构匀称、定型规范；隶书产生于秦代、盛行于汉代，变圆转为方折、变线条为笔画，是古今文字","w":"normal","e":["核心考点"]},{"t":"试论汉字简化与汉字现代化的关系","y":"论述题","p":["汉字简化是历史趋势","简化方案提高识字效率","简化应遵循约定俗成","规范化标准化信息化","汉字适应信息化时代"],"q":"①汉字简化是汉字发展的历史趋势，从甲骨文到隶楷不断由繁趋简；②新中国成立后推行《汉字简化方案》，精简笔画、减少字数，极大提高了识字与书写效率，为普及教育作出重要贡献；③但简化应遵循约定俗成、稳步推进原则，避免破坏汉字理据与形声系统；④汉字现代化还包括规范化、标准化、信息化，如《通用规范汉字表》、汉语拼音方案、汉字编码与","w":"high","e":["2020 真题"]},{"t":"试论“隶变”在汉字发展史上的意义","y":"论述题","p":["隶变：小篆圆转线条到隶书方折笔画","完成古文字向今文字的过渡","摆脱象形束缚、确立表意符号","简化字形、提高书写效率","为楷草行书与书法艺术奠基"],"q":"隶变指汉字由小篆的圆转线条演变为隶书的方折笔画的过程，是汉字发展史上最重要的一次变革。其意义在于：其一，它完成了汉字由古文字向今文字的过渡，是古今文字的分水岭；其二，它使汉字彻底摆脱了象形的束缚，由描绘性符号转变为由笔画构成的表意符号，奠定了方块汉字的基本形态；其三，它简化了字形结构、提高了书写效率，适应了秦汉大一统后","w":"normal","e":["核心考点"]},{"t":"汉字形体演变中，（  ）变是古今汉字的分水岭，使汉字完全符号化。","y":"填空题","p":["隶变是古今汉字分水岭","打破象形传统、完全符号化"],"q":"隶","w":"high","e":["2024 真题"]},{"t":"甲骨文于1899年为（  ）所发现，主要出土于河南安阳殷墟。","y":"填空题","p":["1899年王懿荣发现","安阳殷墟、商代后期"],"q":"王懿荣","w":"normal","e":["核心考点"]},{"t":"秦始皇统一六国后，命（  ）等人整理文字，推行小篆，实现\"书同文\"。","y":"填空题","p":["李斯整理小篆","中国历史上第一次汉字规范化"],"q":"李斯","w":"normal","e":["核心考点"]},{"t":"汉字形体演变中，被称为\"古今汉字分水岭\"的是（ ）。","y":"单项选择题","p":["隶变使汉字完全符号化","打破象形传统"],"q":"D. 隶变","w":"high","e":["2024 真题"]},{"t":"现存最早的成体系的汉字是（ ）。","y":"单项选择题","p":["甲骨文为现存最早成体系汉字","商代后期、安阳殷墟"],"q":"C. 甲骨文","w":"normal","e":["核心考点"]},{"t":"隶变使汉字完全符号化，打破了古汉字象形的传统。","y":"判断题","p":["隶变使汉字符号化","打破象形传统"],"q":"正确。隶变将圆转笔画变为方折平直，打破象形传统，使汉字完全符号化，是古今汉字分水岭。","w":"high","e":["2024 真题"]},{"t":"小篆是秦始皇统一六国后推行的标准字体，是中国历史上第一次汉字规范化。","y":"判断题","p":["小篆为秦标准字体","第一次汉字规范化"],"q":"正确。秦统一后命李斯等人整理文字，推行小篆，实现\"书同文\"，为第一次汉字规范化。","w":"normal","e":["核心考点"]},{"t":"甲骨文主要出土于河南安阳殷墟，是商代后期的占卜文字。","y":"判断题","p":["安阳殷墟","商代后期占卜文字"],"q":"正确。甲骨文刻于龟甲兽骨用于占卜，主要出土于安阳殷墟，盛行于商代后期。","w":"normal","e":["核心考点"]}]},{"id":"culture-c05-s02","t":"第二节 六书与汉字结构","w":"high","n":8,"k":[{"t":"六书","y":"名词解释","p":["象形、指事、会意、形声、转注、假借","许慎《说文解字·叙》系统确立","前四为造字法、后二为用字法"],"q":"古人分析汉字结构归纳出的六种条例，首见于许慎《说文解字·叙》：象形、指事、会意、形声、转注、假借。其中象形、指事、会意、形声为造字法，转注、假借为用字法。","w":"high","e":["2017 真题","2023 真题"]},{"t":"形声","y":"名词解释","p":["意符与声符组合成字","如洋从水羊声","最能产的造字法","占汉字八成以上"],"q":"六书之一，由表意的意符（形旁）和表音的声符（声旁）组合成字的造字法。如“洋”，从水羊声，氵表意类，羊表读音。形声是最能产的造字法，占汉字的百分之八十以上，兼顾表意与表音，适应了汉语词汇发展的需要。","w":"high","e":["2016 真题"]},{"t":"假借","y":"名词解释","p":["本无其字依声托事","借用同音字记录新词","如“其”借为代词","属用字法"],"q":"六书之一，本无其字，依声托事，即借用已有的同音字来记录新词。如“其”本义为簸箕，借为代词；“来”本义为小麦，借为来往之来。假借不造新字而扩大了字的使用范围，是用字法而非造字法。","w":"normal","e":["核心考点"]},{"t":"简述\"六书\"的具体内容并各举一例","y":"简答题","p":["象形：日月","指事：上下本","会意：休、明","形声：江河","转注：考老","假借：令长"],"q":"①象形：描摹事物外形，如\"日\"\"月\"；②指事：用符号指示抽象概念，如\"上\"\"下\"\"本\"；③会意：组合两个以上字形表示新义，如\"休\"（人依木）、\"明\"（日月）；④形声：形旁表义、声旁表音，如\"江\"\"河\"；⑤转注：同义字互相解释，如\"考\"\"老\"；⑥假借：借用同音字表示新义，如\"令\"\"长\"。","w":"high","e":["2017 真题","2023 真题"]},{"t":"简述汉字结构的基本精神","y":"简答题","p":["以形表意","方块构型均衡对称","部件组合能产性强","形音义统一","形成书法艺术"],"q":"①以形表意：汉字以象形为基础，通过指事、会意、形声等方式表意，字形与意义紧密联系；②方块构型：汉字呈方块形，结构均衡对称，讲究重心平稳与疏密匀称；③部件组合：以偏旁部首为基本构件，可层层组合，具有高度的能产性与系统性；④形音义统一：形声字兼顾表意与表音，形成独特的形音义结合体系；⑤书法审美：笔画线条富有表现力，形成独特","w":"normal","e":["核心考点"]},{"t":"东汉许慎所著《（  ）》是中国第一部系统分析字形、考究字源的字典，也是\"六书\"理论的集大成之作。","y":"填空题","p":["许慎著《说文解字》","第一部系统分析字形的字典","六书理论集大成"],"q":"说文解字","w":"normal","e":["核心考点"]},{"t":"下列汉字中属于会意字的是（ ）。","y":"单项选择题","p":["\"休\"从人从木，表示人倚树休息","会意为组合字形表新义"],"q":"C. 休","w":"normal","e":["核心考点"]},{"t":"\"六书\"中的象形、指事、会意、形声属于用字法，转注、假借属于造字法。","y":"判断题","p":["前四为造字法","转注假借为用字法"],"q":"错误。象形、指事、会意、形声为造字法，转注、假借为用字法，二者恰好颠倒。","w":"normal","e":["核心考点"]}]},{"id":"culture-c05-s03","t":"第三节 字书与注音","w":"normal","n":4,"k":[{"t":"说文解字","y":"名词解释","p":["东汉许慎所著","中国第一部系统分析字形的字典","收字9353，按540部首编排","首创部首检字法"],"q":"《说文解字》是东汉许慎所著的中国第一部系统分析字形、解说字义、辨识声读的字典，成书于公元100年。全书收字9353个，重文1163个，按540个部首编排，以\"六书\"理论分析字形结构，首创部首检字法。它是研究古文字与汉语词源的经典，被誉为\"天下第一种书\"。","w":"normal","e":["核心考点"]},{"t":"反切","y":"名词解释","p":["用两字拼注一字的注音法","上字取声母、下字取韵母声调","始于汉末，受梵文影响","古代韵书主要注音方式"],"q":"反切是用两个字拼注一个汉字读音的传统注音方法，上字取声母，下字取韵母和声调，合而成音，如\"东，德红切\"。反切始于汉末，受梵文拼音原理影响而产生，盛行于魏晋至唐宋。它比直音法更为精确，是古代韵书、字书的主要注音方式，也是研究古音的重要材料。","w":"normal","e":["核心考点"]},{"t":"四声","y":"名词解释","p":["平上去入四种声调","确立于南朝齐梁","沈约倡导，用于诗文","普通话四声由古四声演变"],"q":"四声指汉语的平、上、去、入四种声调，是汉语作为声调语言的基本特征。四声之名确立于南朝齐梁时期，沈约《四声谱》、周颙《四声切韵》等加以倡导，并应用于诗文创作，形成永明体。现代普通话的阴平、阳平、上声、去声由古四声演变而来，入声在北方话中已消失，部分方言仍保留。","w":"normal","e":["核心考点"]},{"t":"中国第一部系统分析字形、考究字源的字典是（ ）。","y":"单项选择题","p":["许慎著","六书理论集大成"],"q":"B. 《说文解字》","w":"normal","e":["核心考点"]}]}]},{"id":"culture-c06","t":"第六章 学术思想","w":"high","s":[{"id":"culture-c06-s01","t":"第一节 先秦诸子","w":"high","n":19,"k":[{"t":"孔孟之道","y":"名词解释","p":["孔子核心为仁与礼","孟子主张仁政、民贵君轻、性善论","汉武帝后成为文化精神内核"],"q":"以孔子、孟子为代表的儒家思想体系。孔子核心是\"仁\"与\"礼\"，主张克己复礼、为政以德；孟子发展出\"仁政\"\"民贵君轻\"与性善论。自汉武帝\"独尊儒术\"后成为中国传统文化的精神内核。","w":"high","e":["2019 真题"]},{"t":"仁","y":"名词解释","p":["儒家核心范畴","基本含义是爱人","克己复礼为实现途径","包含忠恕之道"],"q":"儒家思想的核心范畴。孔子以“仁”为最高道德原则，基本含义是“爱人”，即对人的关爱与尊重；实现仁的方法是“克己复礼”，即约束自己使言行合乎礼的规范；仁还包含忠恕之道，“己所不欲，勿施于人”。仁贯穿于孔子整个思想体系，是儒家伦理的总纲。","w":"high","e":["2019 真题"]},{"t":"无为而治","y":"名词解释","p":["道家老子的政治主张","道常无为而无不为","顺应自然不妄加干预","无为非不为而是不妄为"],"q":"道家老子的政治主张。老子认为“道常无为而无不为”，统治者应顺应自然、不妄加干预，清静无为，使百姓自化、自正、自富、自朴，从而达到“无为而治”的理想状态。无为并非什么都不做，而是不违背事物本性地强行妄为。","w":"high","e":["2018 真题"]},{"t":"兼爱非攻","y":"名词解释","p":["墨家核心主张","兼爱为平等爱一切人","非攻为反对侵略战争","代表平民与小生产者利益"],"q":"墨家核心主张。兼爱指不分亲疏贵贱、平等地爱一切人，反对儒家“爱有差等”；非攻指反对侵略战争，主张以义服人。墨子认为天下大乱源于“不相爱”，故提倡兼相爱、交相利。兼爱非攻体现了墨家代表平民与小生产者利益的思想立场。","w":"high","e":["2017 真题"]},{"t":"法术势","y":"名词解释","p":["法为成文法与赏罚","术为君主驾驭臣下的权术","势为君主的权势地位","韩非综合商鞅申不害慎到"],"q":"法家韩非的思想体系。法指成文法与赏罚制度，主张“法不阿贵”；术指君主驾驭臣下的权术，包括循名责实、任人唯贤与阴谋权术；势指君主的权势与地位，主张君主独掌权势。韩非综合商鞅之“法”、申不害之“术”、慎到之“势”，构成完整的法家理论。","w":"high","e":["2020 真题"]},{"t":"罢黜百家，独尊儒术","y":"名词解释","p":["汉武帝采纳董仲舒建议","唯立五经博士","以儒术取士","儒学成为官方正统"],"q":"汉武帝采纳董仲舒建议推行的思想文化政策。废除诸子博士，唯立五经博士，以儒家经典为官学，以儒术取士。自此儒学成为官方正统思想，确立了此后两千年中国古代社会的意识形态基础，但也限制了思想的多元发展。","w":"high","e":["2019 真题"]},{"t":"老庄思想","y":"名词解释","p":["老子：道法自然、无为而治","庄子：齐物逍遥、精神自由","与儒家互补构成文化支柱"],"q":"以老子、庄子为代表的道家思想。老子主张\"道法自然\"\"无为而治\"，提出朴素辩证法；庄子主张齐物、逍遥，追求精神自由。道家与儒家互补，构成中国传统文化的重要支柱。","w":"normal","e":["核心考点"]},{"t":"四书五经","y":"名词解释","p":["四书：大学中庸论语孟子","五经：诗书礼易春秋","朱熹合编四书并作注","科举考试核心内容"],"q":"四书指《大学》《中庸》《论语》《孟子》，由南宋朱熹合编并作注；五经指《诗》《书》《礼》《易》《春秋》。二者是儒家经典的核心，也是科举考试的主要内容。","w":"normal","e":["核心考点"]},{"t":"礼","y":"名词解释","p":["维护等级秩序的制度仪节","孔子主张克己复礼","荀子隆礼重法","宗法社会的核心规范"],"q":"儒家重要范畴，指维护社会等级秩序与伦理规范的一整套制度、仪节与行为准则。孔子主张“克己复礼为仁”，强调礼对个人修养与社会秩序的规范作用；荀子进一步提出“隆礼重法”，把礼视为治国根本。礼是中国古代宗法社会的核心规范。","w":"normal","e":["核心考点"]},{"t":"十三经","y":"名词解释","p":["儒家十三部经典总称","由汉五经、唐九经逐步扩充","宋代加入论、孝、尔雅、孟子","明代合刻定型"],"q":"十三经是儒家十三部经典的总称，即《周易》《尚书》《诗经》《周礼》《仪礼》《礼记》《春秋左传》《春秋公羊传》《春秋穀梁传》《论语》《孝经》《尔雅》《孟子》。汉代以五经为尊，唐代扩充为九经，宋代加入《论语》《孝经》《尔雅》《孟子》，至明代正式合刻为\"十三经\"。","w":"normal","e":["核心考点"]},{"t":"简述儒家思想的主要内容及其历史影响","y":"简答题","p":["仁：仁者爱人、克己复礼","礼：等级秩序与行为规范","中庸：不偏不倚","德治民本：为政以德、民贵君轻","汉以后成为官方正统、文化精神内核"],"q":"主要内容：①仁，仁者爱人，克己复礼；②礼，维护等级秩序的典章制度与行为规范；③中庸，不偏不倚、过犹不及；④德治与民本，为政以德、民贵君轻；⑤修身齐家治国平天下的人生理想。历史影响：自汉以后成为官方正统思想，塑造了中华民族的价值观念与伦理秩序，是中国传统文化的精神内核。","w":"high","e":["2019 真题"]},{"t":"简述老庄思想的异同","y":"简答题","p":["同以道为本原主张顺应自然","老子侧重政治无为而治","庄子侧重人生逍遥自由","老子客观之道庄子齐物相对"],"q":"相同点：都以“道”为宇宙本原，主张顺应自然、清静无为，反对人为造作与名利争夺。不同点：①老子侧重政治哲学，讲“无为而治”“柔弱胜刚强”的治国之术；庄子侧重人生哲学，追求“逍遥游”的绝对精神自由；②老子讲“道”的客观规律性，庄子更强调“齐物”相对主义；③老子主张小国寡民，庄子主张超脱生死、物我两忘。二者共同构成道家思想体","w":"high","e":["2017 真题"]},{"t":"简述先秦诸子百家的主要流派及其主张","y":"简答题","p":["儒家：孔孟、仁礼德治民本","道家：老庄、道法自然无为","墨家：兼爱非攻尚贤节用","法家：商鞅韩非、以法治国集权","名家阴阳家等","儒墨并称战国显学"],"q":"先秦诸子百家主要流派有：儒家，以孔孟为代表，主张仁、礼、德治与民本，重伦理教化；道家，以老庄为代表，主张道法自然、无为而治、逍遥齐物；墨家，以墨翟为代表，主张兼爱、非攻、尚贤、节用；法家，以商鞅、韩非为代表，主张以法治国、严刑峻法、君主集权；名家，以惠施、公孙龙为代表，探讨名实关系与逻辑思辨；阴阳家，以邹衍为代表，倡五","w":"normal","e":["核心考点"]},{"t":"试论儒家思想对中国文化的深远影响","y":"论述题","p":["德治民本礼治的治国理念","仁义礼智信的伦理规范","有教无类推动教育","儒家经典成为文化核心","塑造民族性格","等级观念等消极影响"],"q":"①政治层面：儒家德治、民本、礼治思想成为历代治国理念，“为政以德”“民为邦本”影响深远；②伦理层面：仁义礼智信、三纲五常构成传统社会的道德规范，宗法家族伦理深入人心；③教育层面：有教无类、因材施教、学而优则仕推动了教育普及与科举制度；④文化层面：儒家经典成为传统文化核心，影响文学、史学、哲学与艺术；⑤社会层面：重视家庭","w":"high","e":["2023 真题","2016 真题"]},{"t":"试论儒家思想成为中国传统文化精神内核的原因","y":"论述题","p":["理论契合宗法农业社会","汉武帝独尊儒术、确立正统","科举以儒经取士制度化巩固","兼收并蓄、不断更新（宋明理学）","伦理纲常维系家国同构秩序"],"q":"①理论上，儒家以仁礼为核心，建构了完整的伦理政治学说，最契合宗法农业社会的需要；②政治上，汉武帝采纳董仲舒\"罢黜百家，独尊儒术\"，确立其官方正统地位，后世科举以儒经取士，制度化地巩固了儒学地位；③文化上，儒家重教育、重经典传承，通过私塾、书院、科举深入民间；④思想上，儒学具有包容性，能吸收道家、法家、佛学思想而不断更新","w":"normal","e":["核心考点"]},{"t":"孔子思想的核心是\"（  ）\"，主张\"克己复礼为仁\"。","y":"填空题","p":["孔子核心为仁","克己复礼为仁"],"q":"仁","w":"normal","e":["核心考点"]},{"t":"汉武帝采纳（  ）的建议，\"罢黜百家，独尊儒术\"，确立儒学的正统地位。","y":"填空题","p":["董仲舒提出","儒学成为官方正统"],"q":"董仲舒","w":"normal","e":["核心考点"]},{"t":"提出\"罢黜百家，独尊儒术\"并建议汉武帝采纳的是（ ）。","y":"单项选择题","p":["董仲舒提出","儒学确立正统地位"],"q":"A. 董仲舒","w":"normal","e":["核心考点"]},{"t":"战国时代并称为\"两大显学\"的是儒家和法家。","y":"判断题","p":["两大显学为儒墨","韩非子《显学》"],"q":"错误。战国时代并称\"两大显学\"的是儒家和墨家，韩非子在《显学》篇中明言\"世之显学，儒墨也\"。法家至战国中后期才由韩非集大成。","w":"high","e":["2024 真题"]}]},{"id":"culture-c06-s02","t":"第二节 两汉经学","w":"high","n":14,"k":[{"t":"今文经学与古文经学","y":"名词解释","p":["今文经以汉隶书写、重微言大义","古文经以先秦古文字书写、重训诂考据","两派争论延续千年"],"q":"汉代经学的两大派别。今文经指用当时通行的隶书写定的经书，重微言大义、通经致用；古文经指用秦以前古文字书写的经书，重文字训诂、名物考据。两派争论延续千年，影响深远。","w":"high","e":["2016 真题","2019 真题"]},{"t":"天人感应","y":"名词解释","p":["董仲舒提出","天为有意志的人格神","天以祥瑞灾异褒奖谴告","为君权神授提供依据"],"q":"西汉董仲舒提出的神学目的论思想。认为天是有意志的人格神，天与人相通，人的行为尤其是君主的政治得失会感应于天，天通过祥瑞或灾异予以褒奖或谴告。这一学说为“君权神授”提供理论依据，同时也以天变谴告约束君权。","w":"high","e":["2016 真题"]},{"t":"三玄","y":"名词解释","p":["《老子》《庄子》《周易》","玄学依据的经典","探讨本末有无体用","形成清谈风气"],"q":"魏晋玄学所依据的三部经典，即《老子》《庄子》《周易》。玄学家以老庄思想解释儒家经典，探讨本末、有无、体用等抽象哲学问题，形成清谈玄理的风气。三玄是魏晋玄学的核心文本。","w":"high","e":["2021 真题"]},{"t":"魏晋玄学","y":"名词解释","p":["以三玄为经典","探讨本末有无、名教与自然","代表人物何晏王弼嵇康阮籍","崇尚清谈、越名教而任自然"],"q":"魏晋时期以《老子》《庄子》《周易》\"三玄\"为经典，探讨本末、有无、名教与自然关系的哲学思潮。代表人物有何晏、王弼、嵇康、阮籍、郭象，崇尚清谈，主张\"越名教而任自然\"。","w":"normal","e":["核心考点"]},{"t":"竹林七贤","y":"名词解释","p":["嵇康阮籍山涛向秀刘伶王戎阮咸","聚于竹林饮酒清谈","以老庄对抗名教礼法","名士风度代表"],"q":"魏晋时期七位名士的合称：嵇康、阮籍、山涛、向秀、刘伶、王戎、阮咸。他们常聚于竹林之下，饮酒清谈、放诞不羁，以老庄思想对抗名教礼法，是魏晋玄学与名士风度的代表。其中嵇康、阮籍文学成就最高。","w":"normal","e":["核心考点"]},{"t":"天人三策","y":"名词解释","p":["董仲舒应汉武帝贤良对策","天人感应、君权神授","大一统与独尊儒术","确立儒学官方地位"],"q":"天人三策是汉武帝元光元年（前134年）董仲舒应贤良对策所作的三篇策文。他提出\"天人感应\"\"君权神授\"\"大一统\"与\"罢黜百家、独尊儒术\"的主张，主张以德治国、兴太学、重教化。汉武帝采纳其说，确立儒学为官方意识形态，儒学由此成为中国传统文化的主流。","w":"normal","e":["核心考点"]},{"t":"谶纬","y":"名词解释","p":["谶为预言吉凶的隐语","纬为附会经义的神学书","王莽光武借以证政权合法性","使儒学神学化，隋代禁毁"],"q":"谶纬是汉代盛行的神学化经学思潮。\"谶\"是预言吉凶的隐语符命，\"纬\"是相对于\"经\"而言、以神学迷信附会儒家经义的书。汉代谶纬以《河图》《洛书》及七经纬为主体，王莽、光武帝皆借谶纬论证政权合法性。谶纬之学使儒学神学化，东汉白虎观会议后更被官方认可，至隋炀帝始禁毁。","w":"normal","e":["核心考点"]},{"t":"白虎通义","y":"名词解释","p":["东汉建初四年白虎观会议","班固整理编撰","以谶纬解经，确立三纲六纪","汉代今文经学官方总结"],"q":"《白虎通义》又称《白虎通德论》，是东汉建初四年（79年）汉章帝在白虎观召集儒生讲论五经异同、由班固整理编撰的会议记录。全书以谶纬神学解释儒家经典，系统确立了\"三纲六纪\"的封建伦理纲常，是汉代今文经学的官方总结，对后世礼制与伦理影响深远。","w":"normal","e":["核心考点"]},{"t":"经世致用","y":"名词解释","p":["明清之际的实学学风","关注现实、解决实际问题","反对空谈心性","黄宗羲、顾炎武、王夫之"],"q":"经世致用是明清之际思想家倡导的学风，主张学术应当关注社会现实、解决国计民生实际问题，反对空谈心性、脱离实务。代表人物有黄宗羲、顾炎武、王夫之等，顾炎武提出\"君子之为学，以明道也，以救世也\"。这一思潮推动了清代朴学的兴起，也影响了近代的实学传统。","w":"normal","e":["核心考点"]},{"t":"简述今文经学与古文经学的分歧","y":"简答题","p":["文字：汉隶 vs 先秦古文字","篇章：古文经多出逸篇","方法：微言大义 vs 训诂考据","倾向：通经致用 vs 重师承"],"q":"①文字不同：今文经用汉隶书写，古文经用先秦古文字书写；②篇章不同：古文经较今文经多出《逸礼》《古文尚书》等；③治学方法不同：今文经重微言大义、通经致用，古文经重名物训诂、文字考据；④政治倾向不同：今文经多附会政治、倡改制，古文经较为保守、重师承。","w":"high","e":["2016 真题"]},{"t":"简述两汉经学中今文经学与古文经学的分歧","y":"简答题","p":["今文经：隶书抄本、口耳相传","古文经：先秦古文字、孔壁所出","今文重微言大义与阴阳灾异","古文重名物训诂与文字考据","今文尊孔子、古文尊周公"],"q":"今文经学与古文经学的分歧表现在：其一，文本来源不同，今文经指汉代通行隶书抄录的经书，多为口耳相传；古文经指用先秦古文字写成的经书，多出于孔壁等地；其二，治学方法不同，今文经学重微言大义、讲阴阳灾异、附会政治；古文经学重名物训诂、文字考据、实事求是；其三，经典次序与尊崇对象不同，今文经学以《春秋公羊传》为核心尊孔子为素王","w":"normal","e":["核心考点"]},{"t":"魏晋玄学所依据的\"三玄\"是（ ）。","y":"单项选择题","p":["三玄为老庄易","玄学清谈的经典依据"],"q":"D. 《老子》《庄子》《周易》","w":"normal","e":["核心考点"]},{"t":"乾嘉学派反对宋明理学空谈心性，主张回到汉代经学，注重考据。","y":"判断题","p":["反对空谈心性","重考据、宗汉学"],"q":"正确。乾嘉学派又称朴学、汉学，重名物训诂与文字音韵考据，学风朴实严谨。","w":"high","e":["2023 真题"]},{"t":"今文经学重名物训诂，古文经学重微言大义。","y":"判断题","p":["今文：微言大义","古文：训诂考据"],"q":"错误。今文经学重微言大义、通经致用；古文经学重名物训诂、文字考据，二者颠倒。","w":"normal","e":["核心考点"]}]},{"id":"culture-c06-s03","t":"第三节 宋明理学","w":"high","n":10,"k":[{"t":"宋明理学","y":"名词解释","p":["以儒学为基础吸收佛道","程朱：理在事先、格物致知","陆王：心即是理、致良知、知行合一"],"q":"宋明时期以儒家思想为基础、吸收佛道思想而形成的新儒学。分为程朱理学与陆王心学两大派：程朱主张\"理在事先\"\"格物致知\"\"存天理灭人欲\"；陆王主张\"心即是理\"\"致良知\"\"知行合一\"。","w":"high","e":["2015 真题","2021 真题"]},{"t":"程朱理学","y":"名词解释","p":["二程与朱熹为代表","理为宇宙本原","理在事先","格物致知","存天理灭人欲","元明清官方哲学"],"q":"以北宋程颢、程颐和南宋朱熹为代表的理学学派。认为“理”是宇宙的本原与最高范畴，理在气先、理在事先；主张“格物致知”以穷理，提出“存天理，灭人欲”的修养论。朱熹集大成，编《四书章句集注》，使理学成为元明清官方哲学。","w":"high","e":["2024 真题","2015 真题"]},{"t":"陆王心学","y":"名词解释","p":["陆九渊与王阳明为代表","心即是理","发明本心致良知","知行合一","与程朱理学相对立"],"q":"以南宋陆九渊和明代王阳明为代表的心学学派。主张“心即是理”“宇宙便是吾心”，认为天理内在于人心，不必外求；修养方法上主张“发明本心”“致良知”“知行合一”。心学与程朱理学相对立，在明代中后期盛行，对后世思想解放影响深远。","w":"high","e":["2024 真题"]},{"t":"格物致知","y":"名词解释","p":["出自《礼记·大学》","朱熹解为穷究事物之理","王阳明解为正心去欲","体现理学与心学分歧"],"q":"中国古代认识论命题，首见于《礼记·大学》“致知在格物”。朱熹解释为通过穷究事物之理以达到知识的扩充，即向外格求事物之理；王阳明则解释为“格者正也”，格物即正心去欲、致内心之良知。二者体现了理学与心学的根本分歧。","w":"normal","e":["核心考点"]},{"t":"致良知","y":"名词解释","p":["王阳明心学核心命题","良知为人心固有道德本体","致即推极扩充实行","天理内化为人心"],"q":"致良知是王阳明心学的核心命题。\"良知\"指人心固有的、不虑而知的道德本体，即天理；\"致\"即推极、扩充、实行。王阳明认为人人皆有良知，只要去除私欲遮蔽、将良知推致于事事物物，即可成圣。这一学说把天理内化为人心，强调知行合一与事上磨炼。","w":"normal","e":["核心考点"]},{"t":"知行合一","y":"名词解释","p":["王阳明提出","反对知先行后","知是行之始，行是知之成","强调道德认识落实于实践"],"q":"知行合一是王阳明提出的认识论与道德修养学说。他反对朱熹\"知先行后\"的观点，认为\"知是行之始，行是知之成\"，知而不行只是未知，二者本为一体、不可分离。这一命题强调道德认识必须落实为道德实践，是其心学体系的重要组成部分。","w":"normal","e":["核心考点"]},{"t":"简述宋明理学中程朱理学与陆王心学的异同","y":"简答题","p":["同：以儒家伦理为核心、吸收佛道","程朱：理在事先、格物致知","陆王：心即是理、致良知","程朱知先行后、陆王知行合一"],"q":"相同点：都以儒家纲常伦理为核心，吸收佛道思想，维护封建统治秩序。不同点：①本体论上，程朱主张\"理在事先\"，理是客观外在的；陆王主张\"心即是理\"，心是万物本源；②修养方法上，程朱主张\"格物致知\"，即物穷理；陆王主张\"致良知\"，向内体认；③知行观上，程朱主张知先行后，陆王主张\"知行合一\"。","w":"high","e":["2015 真题","2021 真题"]},{"t":"试述宋明理学的发展脉络及其主要派别","y":"论述题","p":["周敦颐张载二程奠基","朱熹集大成、程朱理学官学化","陆九渊心即理、鹅湖之会","王阳明致良知与知行合一","程朱重格物、陆王重本心","明清之际实学思潮纠弊"],"q":"宋明理学是宋明时期以儒家伦理为核心、吸收佛道思辨哲学而形成的新儒学体系。其发展脉络为：北宋周敦颐以《太极图说》开理学先河，张载倡气本论与民胞物与，二程（程颢、程颐）确立天理范畴，奠定理学基础；南宋朱熹集大成，构建理气二元、格物致知的理学体系，编定四书，成为官方正统，世称程朱理学；与此同时陆九渊倡心即理、发明本心，开陆王","w":"normal","e":["核心考点"]},{"t":"主张\"心即是理\"\"致良知\"\"知行合一\"的思想家是（ ）。","y":"单项选择题","p":["王阳明为陆王心学代表","主张心即是理、致良知"],"q":"B. 王阳明","w":"high","e":["2015 真题"]},{"t":"程朱理学主张\"心即是理\"，陆王心学主张\"理在事先\"。","y":"判断题","p":["程朱：理在事先","陆王：心即是理"],"q":"错误。恰好相反：程朱理学主张\"理在事先\"，陆王心学主张\"心即是理\"。","w":"normal","e":["核心考点"]}]},{"id":"culture-c06-s04","t":"第四节 清代朴学","w":"high","n":4,"k":[{"t":"乾嘉学派（朴学）","y":"名词解释","p":["乾嘉年间兴起的考据学派","重名物训诂、文字音韵考据","反对空谈心性、学风朴实","代表人物戴震段玉裁"],"q":"清代乾隆、嘉庆年间兴起的考据学派。反对宋明理学空谈心性，主张回到汉代经学，注重名物训诂、文字音韵与典章制度考证，学风朴实严谨，故称朴学或汉学。代表人物有戴震、钱大昕、段玉裁、王念孙。","w":"high","e":["2018 真题","2023 真题"]},{"t":"试述清代乾嘉学派（朴学）的兴起原因、治学特点与学术贡献","y":"论述题","p":["兴起：顾炎武开先河、文字狱避祸、四库全书推动","特点：重训诂考证校勘辨伪","方法：无征不信、实事求是","分吴派惠栋与皖派戴震","贡献：文字音韵训诂目录金石之学","流弊：繁琐考据脱离现实"],"q":"乾嘉学派是清代乾隆、嘉庆年间兴起的以考据为核心的学术流派，又称朴学、汉学。兴起原因：一是清初顾炎武等倡经世致用与实证考据，开其先河；二是清代文字狱严酷，学者为避祸转向远离政治的故纸考据；三是朝廷组织编修《四库全书》，客观上推动典籍整理与考据风气。治学特点：以汉儒注疏为宗，重文字训诂、名物考证、版本校勘、辑佚辨伪；方法上","w":"normal","e":["核心考点"]},{"t":"清代乾隆、嘉庆年间兴起的考据学派被称为乾嘉学派，因其学风朴实，又称（  ）。","y":"填空题","p":["乾嘉学派又称朴学、汉学","重名物训诂考据"],"q":"朴学","w":"high","e":["2023 真题"]},{"t":"清代乾嘉学派治学的核心方法是（ ）。","y":"单项选择题","p":["乾嘉学派又称考据学派","重名物训诂、文字音韵"],"q":"C. 考据","w":"high","e":["2023 真题"]}]},{"id":"culture-c06-s05","t":"综合考点","w":"high","n":6,"k":[{"t":"鹅湖之会","y":"名词解释","p":["南宋淳熙二年吕祖谦邀约","朱熹与陆九渊论学","朱主泛观博览，陆主发明本心","理学与心学分野的公开化"],"q":"鹅湖之会是南宋淳熙二年（1175年）由吕祖谦邀约、在江西铅山鹅湖寺举行的一次学术辩论，朱陆两派就为学方法展开论争。朱熹主张\"泛观博览而后归之约\"，陆九渊主张\"先发明本心\"、讥朱学为\"支离\"，朱熹则批评陆学\"太简\"。此次辩论是理学与心学分歧的公开化，在中国学术史上影响深远。","w":"normal","e":["核心考点"]},{"t":"浙东学派","y":"名词解释","p":["南宋至清初浙江东部学派","重史学与经世之学","陈亮永康、叶适永嘉主事功","清代黄宗羲、全祖望承其绪"],"q":"浙东学派是南宋至清初活跃于浙江东部的学术流派，以史学与经世之学见长。南宋时以吕祖谦的金华学派、陈亮的永康学派、叶适的永嘉学派为代表，主张事功之学，反对空谈心性；清代以黄宗羲、万斯大、全祖望等为代表，重史学与文献考订。该派强调学术的实用价值，是经世致用传统的重要源头。","w":"normal","e":["核心考点"]},{"t":"泰州学派","y":"名词解释","p":["明代王门后学，王艮创立","百姓日用即道","尊身立本，平民色彩","李贽等后学趋于激进"],"q":"泰州学派是明代王门后学中以王艮为代表的学派，因王艮为泰州人而得名。该派主张\"百姓日用即道\"，认为圣人之道就在日常洒扫应对之中，强调\"尊身立本\"，具有鲜明的平民色彩与思想解放倾向。其後学颜钧、何心隐、李贽更为激进，被正统理学家视为\"异端\"。","w":"normal","e":["核心考点"]},{"t":"简述孔子的思想核心","y":"简答题","p":["仁为核心","礼为规范","中庸为方法论","正名思想","有教无类与为政以德"],"q":"①仁：以“爱人”为核心的最高道德原则，主张克己复礼、忠恕之道；②礼：维护等级秩序与伦理规范，主张“克己复礼为仁”；③中庸：处理事物不偏不倚、无过无不及；④正名：主张“君君臣臣父父子子”，以正名分维护秩序；⑤教育思想：有教无类、因材施教、学思结合；⑥政治思想：为政以德、反对苛政。孔子是儒家学派的创始人。","w":"high","e":["2018 真题"]},{"t":"简述法家思想的主要内容","y":"简答题","p":["历史进化观反对复古","以法治国严刑峻法","术与势的统治权术","奖励耕战富国强兵","加强中央集权"],"q":"①历史进化观：主张“法后王”“世异则事异”，反对复古；②以法治国：公布成文法，严刑峻法，赏罚分明，“法不阿贵”；③术与势：君主须掌握驾驭臣下的权术与独尊的权势；④耕战政策：奖励农耕与军功，富国强兵；⑤中央集权：废除分封，推行郡县，加强君主专制。代表人物有商鞅、申不害、慎到、韩非，韩非为集大成者。","w":"high","e":["2019 真题"]},{"t":"南宋（  ）将《大学》《中庸》《论语》《孟子》合编并作注，始有\"四书\"之称。","y":"填空题","p":["朱熹合编四书并作注","四书成为科举核心内容"],"q":"朱熹","w":"normal","e":["核心考点"]}]}]},{"id":"culture-c07","t":"第七章 宗教信仰","w":"high","s":[{"id":"culture-c07-s01","t":"第一节 三大崇拜与原始宗教","w":"high","n":1,"k":[{"t":"三大崇拜","y":"名词解释","p":["天地崇拜：自然崇拜的集中体现","祖先崇拜：宗法制度的信仰基础","君师崇拜：天地君亲师的伦理秩序"],"q":"中国古代的三大崇拜指天地崇拜、祖先崇拜、君师崇拜。天地崇拜源于农业社会对自然力量的依赖；祖先崇拜以血缘为纽带，是宗法制度的信仰基础；君师崇拜则把君主与师圣并列，体现\"天地君亲师\"的伦理秩序。","w":"high","e":["2016 真题"]}]},{"id":"culture-c07-s02","t":"第二节 佛教","w":"high","n":20,"k":[{"t":"禅宗","y":"名词解释","p":["达摩传入、慧能大兴","不立文字直指人心见性成佛","主张顿悟、自性即佛","《坛经》为唯一中国僧人所撰之\"经\""],"q":"中国佛教影响最大的宗派之一，相传由菩提达摩于南朝梁时传入，至唐代慧能而大兴。禅宗主张\"不立文字，直指人心，见性成佛\"，提倡顿悟，强调佛性本具、自性是佛。慧能被尊为禅宗六祖，其《坛经》是唯一一部由中国僧人撰写而被称为\"经\"的佛典。","w":"high","e":["2019 真题"]},{"t":"净土宗","y":"名词解释","p":["东晋慧远为初祖","唐代善导实际创立","称名念佛往生净土","民间流传极广"],"q":"中国佛教宗派之一，以东晋慧远为初祖，实际创立者为唐代善导。主张称念“南无阿弥陀佛”名号，依靠阿弥陀佛的愿力往生西方极乐净土。因修行方法简单易行，在民间流传极广，有“家家阿弥陀，户户观世音”之说。","w":"normal","e":["核心考点"]},{"t":"天台宗","y":"名词解释","p":["隋代智顗创立于天台山","以《法华经》为经典","一念三千三谛圆融","止观双修","中国佛教最早宗派"],"q":"中国佛教最早创立的宗派，隋代智顗（智者大师）创立于浙江天台山。以《法华经》为主要经典，故又称法华宗。主张“一念三千”“三谛圆融”，止观双修。天台宗是中国佛教宗派化的开端。","w":"normal","e":["核心考点"]},{"t":"华严宗","y":"名词解释","p":["唐代法藏创立","以《华严经》为经典","法界缘起事事无碍","理论思辨性强"],"q":"中国佛教宗派之一，唐代法藏（贤首大师）创立，以《华严经》为主要经典。主张“法界缘起”“事事无碍”，认为一切事物相互圆融、重重无尽。华严宗理论思辨性极强，对宋明理学影响深远。","w":"normal","e":["核心考点"]},{"t":"法相宗","y":"名词解释","p":["玄奘与窥基创立","又称唯识宗慈恩宗","万法唯识三界唯心","理论繁琐流传不广"],"q":"中国佛教宗派之一，唐代玄奘及其弟子窥基创立，又称唯识宗、慈恩宗。以《成唯识论》为主要经典，主张“万法唯识”“三界唯心”，认为一切现象皆由阿赖耶识变现。因理论繁琐、修行阶次严密，仅在士大夫中流传，未久即衰。","w":"normal","e":["核心考点"]},{"t":"三武一宗","y":"名词解释","p":["北魏太武帝北周武帝唐武宗后周世宗","四次大规模灭佛","寺院经济膨胀影响赋役","促使佛教中国化世俗化"],"q":"指中国历史上四次大规模的灭佛事件：北魏太武帝、北周武帝、唐武宗、后周世宗四位帝王下令毁佛。因佛教寺院经济膨胀、僧尼众多影响国家赋役与财政，故遭打击。这四次法难使佛教遭受重创，也促使佛教加速中国化与世俗化。","w":"normal","e":["核心考点"]},{"t":"三武一宗灭佛","y":"名词解释","p":["北魏太武、北周武帝、唐武宗、后周世宗","寺院经济膨胀与财政冲突","使佛教遭受沉重打击","促使佛教本土化，禅净二宗大兴"],"q":"三武一宗灭佛指中国佛教史上四次由朝廷发动的毁佛事件，即北魏太武帝、北周武帝、唐武宗和后周世宗的灭佛。其原因是寺院经济膨胀、僧尼不事生产、与皇权财政及儒家伦理冲突。这四次法难使佛教遭受沉重打击，也促使佛教加速本土化，禅宗与净土宗因其不依赖寺院经济而得以大兴。","w":"normal","e":["核心考点"]},{"t":"玄奘","y":"名词解释","p":["唐代高僧、法相宗创始人","西行求法十七年","译经七十五部一千三百余卷","口述《大唐西域记》"],"q":"玄奘是唐代著名高僧、法相宗创始人、四大译经家之一。贞观三年（629年）西行求法，历十七年、游历百余国，于那烂陀寺从戒贤学瑜伽行派，贞观十九年携梵本六百五十七部归国。后在长安译经十九年，译出《大般若经》《瑜伽师地论》等七十五部、一千三百三十五卷，并口述《大唐西域记》，为中外文化交流作出卓越贡献。","w":"normal","e":["核心考点"]},{"t":"鉴真","y":"名词解释","p":["唐代高僧、律宗传人","六次东渡，双目失明","754年抵日，传戒授律","创建唐招提寺，日本律宗初祖"],"q":"鉴真是唐代高僧、律宗南山宗传人。应日本僧人荣叡、普照之请，自天宝元年（742年）起六次东渡，历经五次失败、双目失明，终于天宝十二载（753年）抵达日本。他在奈良东大寺设坛传戒，创建唐招提寺，被尊为\"日本律宗初祖\"，并将建筑、雕塑、医药、书法等中国文化传入日本。","w":"normal","e":["核心考点"]},{"t":"简述佛教在中国的传播与本土化","y":"简答题","p":["西汉末传入东汉明帝建白马寺","魏晋依附玄学南北朝兴盛","隋唐形成八大宗派","禅宗中国化最彻底","宋以后三教合一"],"q":"①传入：西汉末年经西域传入，东汉明帝时正式传入中原，建白马寺；②发展：魏晋时期依附玄学而流行，南北朝时寺院经济扩张、石窟造像兴盛；③鼎盛：隋唐时期形成天台、华严、法相、禅、净土、律、密等八大宗派，佛教彻底中国化；④禅宗是中国化最彻底的宗派，主张顿悟成佛；⑤宋以后佛教与儒道融合，形成三教合一的格局。","w":"high","e":["2024 真题","2018 真题"]},{"t":"简述佛教在魏晋南北朝时期空前兴盛的原因","y":"简答题","p":["社会动荡、民众寻求精神解脱","统治阶级大力提倡（梁武帝等）","与魏晋玄学结合、格义解经","寺院经济发展与免役特权"],"q":"①社会动荡、战乱频仍，民众在现实苦难中寄托来世解脱的精神需求空前迫切；②统治阶级大力提倡，如后赵石勒、南朝梁武帝萧衍舍身同泰寺，广建寺院、开凿石窟；③佛教与魏晋玄学相互附会（格义），僧人结交名士，义理易于为士大夫接受；④寺院经济雄厚，享有免役免税特权，吸引大量人口出家。","w":"high","e":["2024 真题"]},{"t":"简述佛教中国化的主要表现","y":"简答题","p":["以玄学儒学解释佛理（格义）","创立天台华严禅净等中国化宗派","丛林清规、农禅并作","吸收儒家孝道伦理"],"q":"①教义上以玄学、儒学解释佛理，形成格义之学；②宗派上创立天台宗、华严宗、禅宗、净土宗等中国化宗派，尤以禅宗最具本土特色；③制度上形成丛林清规与农禅并作，脱离印度乞食传统；④伦理上吸收儒家孝道，编撰《父母恩重经》等；⑤艺术上形成中国化的石窟造像、寺院建筑与佛教音乐。","w":"high","e":["2020 真题"]},{"t":"简述佛教传入中国的过程及其中国化的表现","y":"简答题","p":["两汉之际传入、白马寺为标志","思想中国化：格义之学与天台华严禅宗","禅宗最具中国特色、顿悟成佛","制度中国化：丛林清规与农禅并作","伦理中国化：与孝道结合","艺术中国化：石窟造像壁画"],"q":"佛教约在两汉之际传入中国，西汉哀帝时博士弟子景卢受大月氏王使伊存口授浮屠经，东汉明帝时遣使西域求法，建白马寺，为佛教正式传入的标志。中国化表现：其一，思想上与玄学、儒学融合，形成格义之学，并产生天台宗、华严宗、禅宗等中国化宗派，尤以禅宗最具中国特色，主张明心见性、不立文字、顿悟成佛；其二，制度上形成丛林清规与农禅并作的","w":"normal","e":["核心考点"]},{"t":"试论佛教对中国文化的影响","y":"论述题","p":["影响宋明理学的思辨哲学","佛经翻译与石窟艺术","大量佛教词语进入汉语","腊八盂兰盆等民俗","慈悲报应的伦理观念","促进中外文化交流"],"q":"①哲学思想：佛教的缘起性空、心性论深刻影响宋明理学，程朱理学与陆王心学均吸收佛学思辨；②文学艺术：佛经翻译推动汉语词汇与音韵学发展，变文、俗讲促进通俗文学，石窟造像（敦煌、云冈、龙门）与佛塔建筑成为艺术瑰宝；③语言词汇：世界、刹那、因果、觉悟等大量佛教词语进入汉语；④社会风俗：腊八节、盂兰盆节、放生、素食等习俗源于佛教","w":"high","e":["2023 真题"]},{"t":"试述藏传佛教的主要派别及活佛转世制度","y":"论述题","p":["宁玛派红教：最早、莲花生","萨迦派花教：八思巴与元代政教","噶举派白教：口传密法","格鲁派黄教：宗喀巴创立、达赖班禅系统","活佛转世始于噶玛拔希","金瓶掣签与中央认定权"],"q":"藏传佛教是佛教传入西藏后与当地苯教融合形成的佛教支派，俗称喇嘛教。主要派别：宁玛派（红教），为最早形成的派别，重密宗旧译，尊莲花生为祖师；萨迦派（花教），因寺院墙上涂红白灰三色得名，元代八思巴受忽必烈尊为国师，一度掌西藏政教大权；噶举派（白教），重口传密法，支系众多；格鲁派（黄教），明初宗喀巴创立，主张严守戒律、先显后","w":"normal","e":["核心考点"]},{"t":"佛教于（  ）时期传入中国，一般以汉明帝夜梦金人、遣使求法为标志。","y":"填空题","p":["汉明帝夜梦金人遣使西域求法","白马寺为内地第一座佛寺"],"q":"东汉","w":"high","e":["2021 真题"]},{"t":"藏传佛教格鲁派的两大活佛转世系统分别是（  ）和（  ）。","y":"填空题","p":["格鲁派黄教两大转世系统","清代确立金瓶掣签制度"],"q":"达赖、班禅","w":"high","e":["2024 真题"]},{"t":"中国佛教宗派中，唯一由中国人撰写且被称为\"经\"的典籍是（ ）。","y":"单项选择题","p":["《坛经》记慧能言行","唯一中国僧人所撰之\"经\""],"q":"B. 《坛经》","w":"high","e":["2019 真题"]},{"t":"佛教\"四大名山\"中，观音菩萨的道场是（ ）。","y":"单项选择题","p":["观音—普陀山","文殊—五台山、普贤—峨眉山、地藏—九华山"],"q":"C. 普陀山","w":"high","e":["2015 真题"]},{"t":"佛教传入中国后，禅宗主张\"不立文字，直指人心，见性成佛\"，提倡渐悟。","y":"判断题","p":["慧能南宗主张顿悟","神秀北宗主张渐悟"],"q":"错误。禅宗（尤其慧能南宗）主张顿悟，而非渐悟。神秀北宗主张渐悟，慧能南宗主张顿悟，后南宗成为禅宗主流。","w":"high","e":["2018 真题"]}]},{"id":"culture-c07-s03","t":"第三节 道教","w":"high","n":10,"k":[{"t":"道教","y":"名词解释","p":["中国本土宗教、尊老子为教主","东汉张陵创五斗米道（天师道）","追求长生久视、得道成仙","金元后分全真道与正一道"],"q":"中国本土宗教，以\"道\"为最高信仰，尊老子为教主。东汉顺帝时张陵创立五斗米道（天师道），为道教定型之始。道教以《道德经》《南华经》为主要经典，追求长生久视、得道成仙。金元以后分为全真道与正一道两大派系。","w":"high","e":["2017 真题"]},{"t":"五斗米道","y":"名词解释","p":["东汉张陵创立","入道交五斗米得名","又称天师道","尊老子为教主","道教正式形成的标志"],"q":"东汉顺帝时张陵（张道陵）在四川鹤鸣山创立的早期道教派别，因入道者须交五斗米而得名，又称天师道。尊老子为教主，以《道德经》为经典，张陵被尊为天师。五斗米道是道教正式形成的重要标志，其子孙世袭天师之位。","w":"high","e":["2017 真题"]},{"t":"全真道","y":"名词解释","p":["金代王重阳创立","主张三教合一","重清修内丹出家住观","丘处机弘扬","与正一道并列两大派"],"q":"金代王重阳创立的道教派别，主张儒释道三教合一，重清修内丹，要求道士出家住观、禁欲苦修，不尚符箓。全真七子（丘处机等）弘扬其教，丘处机曾西行见成吉思汗，使全真道在元代极盛。全真道与正一道并列为道教两大派。","w":"high","e":["2019 真题"]},{"t":"正一道","y":"名词解释","p":["符箓派融合而成","龙虎山天师为首领","画符念咒祈福禳灾","可居家娶妻","与全真道并列"],"q":"元代以后由天师道、上清派、灵宝派等符箓派融合而成的道教派别，以龙虎山天师为正一道首领。主张画符念咒、驱鬼降妖、祈福禳灾，道士可以居家娶妻、不忌荤腥。正一道与全真道构成道教两大派系。","w":"normal","e":["核心考点"]},{"t":"简述道教的主要派别及其特点","y":"简答题","p":["正一道重符箓斋醮、可居家","全真道主张三教合一、出家清修","王重阳创全真、丘处机弘法"],"q":"①正一道（天师道）：由张陵所创五斗米道发展而来，以符箓斋醮为主，可娶妻生子，流行于民间；②全真道：金代王重阳创立，主张三教合一、性命双修、出家住观、清修苦行，全真七子中最著名者为丘处机；③此外还有上清派、灵宝派等。","w":"high","e":["2018 真题"]},{"t":"简述道教的发展与主要派别","y":"简答题","p":["东汉五斗米道太平道形成","魏晋南北朝走向成熟","唐代尊老子地位尊崇","金元形成全真与正一两派","明清世俗化"],"q":"①形成：东汉张陵创五斗米道、张角创太平道，道教正式形成；②发展：魏晋南北朝时葛洪、寇谦之、陶弘景整理教义与仪轨，道教走向成熟；③鼎盛：唐代尊老子为祖先，道教地位尊崇；④分化：金元时期形成全真道（王重阳，重清修内丹）与正一道（符箓派，可居家）两大派；⑤明清以后道教逐渐世俗化，融入民间信仰。","w":"high","e":["2017 真题"]},{"t":"简述道教的主要派别及其思想渊源","y":"简答题","p":["渊源：鬼神崇拜、神仙方术、黄老、阴阳五行","东汉五斗米道与太平道","南北朝寇谦之陆修静陶弘景","金代王重阳创全真道、三教合一","元代正一道、符箓斋醮","全真与正一两派并立"],"q":"道教的思想渊源包括：古代鬼神崇拜与巫术、神仙方术、黄老道家思想、阴阳五行学说。主要派别：东汉张道陵创五斗米道（天师道），奉《老子》为经典，为早期道教；张角创太平道，以《太平经》为经典；魏晋南北朝时寇谦之改革天师道、陆修静整理道教经典、陶弘景发展上清派；金代王重阳创全真道，主张三教合一、性命双修、出家住观，其弟子丘处机使","w":"normal","e":["核心考点"]},{"t":"道教以（  ）为教主，奉《道德经》为主要经典。","y":"填空题","p":["尊老子为教主","《道德经》五千言"],"q":"老子","w":"normal","e":["核心考点"]},{"t":"道教全真道的创立者是（ ）。","y":"单项选择题","p":["金代王重阳创全真道","主张三教合一、性命双修"],"q":"C. 王重阳","w":"normal","e":["核心考点"]},{"t":"道教是中国本土宗教，尊老子为教主，东汉张陵创立五斗米道。","y":"判断题","p":["本土宗教、尊老子","张陵创五斗米道"],"q":"正确。道教以\"道\"为最高信仰，尊老子为教主，东汉顺帝时张陵创五斗米道，标志道教定型。","w":"normal","e":["核心考点"]}]},{"id":"culture-c07-s04","t":"第四节 藏传佛教","w":"high","n":3,"k":[{"t":"格鲁派（黄教）","y":"名词解释","p":["宗喀巴15世纪初创立","戴黄帽故称黄教","达赖与班禅两大转世系统","清乾隆确立金瓶掣签"],"q":"藏传佛教的主要派别之一，由宗喀巴于15世纪初创立。因该派僧人戴黄色僧帽，故称黄教。格鲁派主张严守戒律、先显后密，实行活佛转世制度，形成达赖与班禅两大活佛转世系统，清代确立金瓶掣签制度加以确认。","w":"high","e":["2024 真题"]},{"t":"金瓶掣签","y":"名词解释","p":["清乾隆五十七年确立","活佛转世须金瓶掣签","驻藏大臣会同掣签","报中央政府批准","加强中央对西藏管辖"],"q":"清代确立的藏传佛教活佛转世认定制度。乾隆五十七年（1792年）规定，达赖、班禅等大活佛转世须经金瓶掣签确定，即将候选灵童的名字写在签上放入金瓶，由驻藏大臣会同僧众在佛前掣签认定，并报中央政府批准。这一制度加强了中央对西藏的管辖，避免了活佛转世被少数贵族操控。","w":"high","e":["2023 真题"]},{"t":"\"达赖\"和\"班禅\"是红教两大活佛转世系统的称号。","y":"判断题","p":["格鲁派（黄教）两大系统","红教为宁玛派"],"q":"错误。\"达赖\"和\"班禅\"是藏传佛教格鲁派（黄教）两大活佛转世系统的称号，而非红教（宁玛派）。","w":"high","e":["2024 真题"]}]},{"id":"culture-c07-s05","t":"第五节 其他宗教","w":"normal","n":2,"k":[{"t":"景教","y":"名词解释","p":["唐代传入的基督教聂斯脱利派","635年阿罗本入长安","《大秦景教流行中国碑》","会昌灭佛后禁绝，元代称也里可温"],"q":"景教是唐代传入中国的基督教聂斯脱利派，贞观九年（635年）由叙利亚人阿罗本携经入长安，太宗准其传教，建大秦寺。德宗建中二年（781年）立《大秦景教流行中国碑》，记述其在中国一百五十年的传播情况。会昌五年（845年）武宗灭佛时景教亦遭禁绝，元代再度传入称\"也里可温\"。","w":"normal","e":["核心考点"]},{"t":"伊斯兰教于唐代传入中国，元代形成\"回回\"聚居，明清出现门窗制度。","y":"判断题","p":["唐永徽二年传入","元代回回聚居","明清门宦制度"],"q":"错误。伊斯兰教唐高宗永徽二年传入中国，元代大量穆斯林东来形成\"回回\"，明清形成的是\"门宦\"制度，而非\"门窗\"。","w":"normal","e":["核心考点"]}]}]},{"id":"culture-c08","t":"第八章 古代教育","w":"high","s":[{"id":"culture-c08-s01","t":"第一节 官学制度","w":"high","n":11,"k":[{"t":"国子监","y":"名词解释","p":["隋炀帝始设","兼具最高教育行政机关与最高学府","明代监生制度"],"q":"中国古代最高学府与教育管理机关。隋炀帝时始设国子监，唐宋时期主要作为主管全国教育的行政机关；明代国子监规模空前，兼具最高教育行政机关与最高学府双重性质，入监学习者称监生（国子生）。","w":"high","e":["2024 真题"]},{"t":"太学","y":"名词解释","p":["汉武帝设、董仲舒建议","以五经为教学内容","标志封建官学制度确立"],"q":"中国古代中央官学，汉武帝时采纳董仲舒建议设立，以五经为教学内容，是国家最高学府。太学的设立标志着中国封建官学制度的确立，东汉太学生多达三万余人。","w":"high","e":["2017 真题"]},{"t":"庠序","y":"名词解释","p":["尧舜时期出现的早期学校","庠：养老与教育之所","序：习射之所","后世泛指学校"],"q":"庠、序是尧舜时代已出现的早期学校名称。据《孟子·滕文公上》记载\"设为庠序学校以教之\"，庠为养老与教育之所，序为习射之所。后世以\"庠序\"泛指学校，是中国古代教育制度最早的形态之一。","w":"high","e":["2016 真题"]},{"t":"稷下学宫","y":"名词解释","p":["战国齐国设立于临淄","百家争鸣的重要场所","各派学者数千人","孟子荀子邹衍曾讲学","最早的高等学府"],"q":"战国时期齐国在都城临淄稷门附近设立的官办高等学府，是百家争鸣的重要场所。齐宣王时最为兴盛，容纳儒、道、法、名、阴阳等各派学者数千人，淳于髡、孟子、荀子、邹衍等曾在此讲学论辩。稷下学宫是中国古代最早的高等学府与学术研究机构。","w":"normal","e":["核心考点"]},{"t":"辟雍","y":"名词解释","p":["西周天子所设大学","四面环水形如璧环","学在官府的典型体现"],"q":"辟雍是西周天子所设的大学，位于王城西郊，四面环水，形如璧环，故名辟雍。它是西周最高学府，也是天子行礼、讲学、养老的场所，体现了\"学在官府\"的教育体制。","w":"normal","e":["核心考点"]},{"t":"鸿都门学","y":"名词解释","p":["东汉灵帝光和元年设立","专授辞赋、尺牍、字画","中国第一所文艺专科学校","反映文艺独立发展"],"q":"鸿都门学是东汉灵帝光和元年（178年）在洛阳鸿都门设立的专门学校，以教授辞赋、小说、尺牍、字画为主，与专授儒经的太学相对。它是中国历史上第一所文艺专科学校，反映了东汉后期文学艺术的独立发展，但因内容被视为\"雕虫小技\"，遭到正统儒士的非议。","w":"normal","e":["核心考点"]},{"t":"简述中国古代官学制度的发展","y":"简答题","p":["夏商周学在官府","汉武帝设太学","隋唐国子监统管六学","宋代州县学","明清国子监兼行政与教学"],"q":"①夏商周有庠、序、学、校等，学在官府；②汉武帝设太学，为中央官学开端；③魏晋南北朝设国子学，与太学并列；④隋唐设国子监统管六学（国子学、太学、四门学、律学、书学、算学），形成完备的官学体系；⑤宋代设太学、国子监，并兴州县学；⑥明清国子监兼具最高学府与教育行政职能，地方设府州县学。官学始终以儒家经典为教学内容，与选官制度","w":"high","e":["2019 真题
