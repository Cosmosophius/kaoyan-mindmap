"名词解释","p":["血缘认同与宗族凝聚","保存历史信息","家训族谱的文化传承","反映民族融合","联结海内外华人的纽带"],"q":"①血缘认同：姓氏是家族血缘的符号，强化宗族凝聚力与慎终追远的伦理观念；②历史记录：姓氏来源保存了古代封国、官职、职业、民族融合等历史信息，是研究社会史的重要材料；③文化传承：郡望、堂号、家训、族谱承载着家风家教的传承；④民族融合：少数民族改姓与赐姓反映了各民族交往交流交融；⑤当代价值：寻根问祖、宗亲","w":"normal","e":["核心概念"]},{"t":"秦汉以后姓氏合流，姓氏不再区分。","y":"名词解释","p":["秦汉姓氏合流","不再区分姓与氏"],"q":"正确。春秋战国宗法制度瓦解，平民开始有姓，秦汉以后姓氏合一、不再区分，统称为姓。","w":"normal","e":["核心概念"]},{"t":"姓起源于父系氏族社会，作用是\"别贵贱\"。","y":"名词解释","p":["姓起源于母系、别婚姻","氏别贵贱"],"q":"错误。姓起源于母系氏族社会，作用是\"别婚姻\"；氏才是姓的分支，起源于父系社会，作用是\"别贵贱\"。","w":"normal","e":["核心概念"]},{"t":"【原文】汉汉字字8181甲骨文之","y":"教材原文","p":["汉汉字字8181甲骨文之后便是金文，又叫“钟鼎文”，是商周时代刻在青铜器上的文字，其中以周代金文为多","商代金文和殷墟甲骨文在形体上非常接近，而周代金文却要简化得多，字体也整齐得多，这说明汉字到周代已有了长足的进步","到了战国末年，字体就逐渐接近小篆了"],"q":"汉汉字字8181甲骨文之后便是金文，又叫“钟鼎文”，是商周时代刻在青铜器上的文字，其中以周代金文为多。商代金文和殷墟甲骨文在形体上非常接近，而周代金文却要简化得多，字体也整齐得多，这说明汉字到周代已有了长足的进步。到了战国末年，字体就逐渐接近小篆了。","w":"normal","e":["原书正文"]},{"t":"【原文】什么是石鼓文呢? 就是刻","y":"教材原文","p":["什么是石鼓文呢? 就是刻在十块鼓形石上的文字，也是我国现存最早的石刻文字","作为国宝，现存北京故宫博物院","北京孔庙大成殿门两侧，有清代乾隆年间的复制品","石鼓上刻的都是四言诗，每面鼓上一首，共十首，内容为歌颂国君田猎事迹"],"q":"什么是石鼓文呢? 就是刻在十块鼓形石上的文字，也是我国现存最早的石刻文字。作为国宝，现存北京故宫博物院。北京孔庙大成殿门两侧，有清代乾隆年间的复制品。石鼓上刻的都是四言诗，每面鼓上一首，共十首，内容为歌颂国君田猎事迹。其字体既不同于金文，又不同于小篆；其字形比金文更整齐，结构又近于小篆，显然是由金文向小篆过渡的一种字体；其书法字体多取长方形，体势整肃，端庄凝","w":"normal","e":["原书正文"]},{"t":"【原文】年) 运至燕京 (今北京","y":"教材原文","p":["年) 运至燕京 (今北京市)","元代又散失草野之中，后被国子助教成钧发现，报告宰相，由兵部派车运回国子监，这以后就一直保存在北京","到1933 年，国民党政府运往南京，埋于地下，新中国成立后访得，再运回北京","以上史略，足见历代对石鼓文的重视程度"],"q":"年) 运至燕京 (今北京市)。元代又散失草野之中，后被国子助教成钧发现，报告宰相，由兵部派车运回国子监，这以后就一直保存在北京。到1933 年，国民党政府运往南京，埋于地下，新中国成立后访得，再运回北京。以上史略，足见历代对石鼓文的重视程度。","w":"normal","e":["原书正文"]},{"t":"【原文】关于石鼓文的时代，唐代张","y":"教材原文","p":["关于石鼓文的时代，唐代张怀瓘、窦皋、韩愈等以为周文王时物","韦应物等以为周宣王时物","至南宋史学家郑樵第一次提出石鼓文为秦刻石，方才引起一些学者的注意","今人马衡以为秦穆公时物，郭沫若以为秦襄公时物，唐兰则考为秦献公十一年(公元前374年) 刻，详见《石鼓年代考》"],"q":"关于石鼓文的时代，唐代张怀瓘、窦皋、韩愈等以为周文王时物； 韦应物等以为周宣王时物；至南宋史学家郑樵第一次提出石鼓文为秦刻石，方才引起一些学者的注意。今人马衡以为秦穆公时物，郭沫若以为秦襄公时物，唐兰则考为秦献公十一年(公元前374年) 刻，详见《石鼓年代考》。可以认为，石鼓文是春秋时期秦国的石刻文字，时间大约在公元前 770年至前325年之间，是研究汉字发","w":"normal","e":["原书正文"]},{"t":"【原文】月是也。”意思是依照物体","y":"教材原文","p":["”意思是依照物体的轮廓，用弯曲的线条，画出那个物体的形状来，这就是象形字，如“日”“月”等字","可见象形字是从图画文字转化而来的","这类字在汉字中为数不少","可以说，许多描述具体事物的单音字都属于这类字"],"q":"月是也。”意思是依照物体的轮廓，用弯曲的线条，画出那个物体的形状来，这就是象形字，如“日”“月”等字。可见象形字是从图画文字转化而来的。这类字在汉字中为数不少。可以说，许多描述具体事物的单音字都属于这类字。如“日”，甲骨文为，金文为日，小篆为日； 如“月”，甲骨文为)，金文为D，小篆为9；如“龙”，甲骨文为，金文为，小篆为求；如“门”，甲骨文为四，金文为网，","w":"normal","e":["原书正文"]},{"t":"【原文】(二) 指事","y":"教材原文","p":["《说文解字·叙》说：“指事者，视而可识，察而见意，上、下是也","”意思是看一下就可以知道它代表什么，但要仔细观察以后才能明白它的意义，比如“上”“下”等字","这类字一般都有指示符号，表明字义所在","如“上”，甲骨文为二，金文为二，小篆为上"],"q":"(二) 指事。《说文解字·叙》说：“指事者，视而可识，察而见意，上、下是也。”意思是看一下就可以知道它代表什么，但要仔细观察以后才能明白它的意义，比如“上”“下”等字。这类字一般都有指示符号，表明字义所在。如“上”，甲骨文为二，金文为二，小篆为上；如“下”，甲骨文为一，金文为一，小篆为下； 上下一小横为指示符号。又如“本”，木中的一小横为指示符号；如“甘”，","w":"normal","e":["原书正文"]}]},{"id":"culture-c04-s02","t":"第二节 名、字、号与避讳","w":"normal","n":10,"k":[{"t":"避讳","y":"名词解释","p":["君主尊长之名不得直呼书写","方法有改字、缺笔、空字","宗法礼制的产物"],"q":"中国古代为维护等级尊卑，对君主和尊长之名不得直呼、不得书写，须用改字、缺笔、空字等方法回避，是宗法礼制的产物。","w":"normal","e":["核心概念"]},{"t":"别号","y":"名词解释","p":["文人自取或他人所赠","与名字无必然联系","寄托志趣、标明居处","如东坡居士、六一居士"],"q":"别号是古代文人自取或他人所赠的称谓，与名、字无必然联系，多用于自称或友人称谓，以寄托志趣、标明居处。如陶潜号五柳先生、李白号青莲居士、苏轼号东坡居士、欧阳修号六一居士。别号可有两个以上，字数不限，是文人文化中表达个性与情怀的重要方式。","w":"normal","e":["核心概念"]},{"t":"名与字","y":"名词解释","p":["名由长辈所取，供自称","字为成年礼所取，供他人称","名与字意义多相关联","男子二十冠而字，女子十五笄而字"],"q":"名与字是古代个人称谓的两个系统。名是出生后由长辈所取，供长辈呼唤及自称；字是成年礼（男子二十冠而字，女子十五笄而字）时另取的别名，供同辈与晚辈称呼，以示敬重。名与字意义多相关联，或同义互训（如诸葛亮字孔明），或反义相对，或连义推想。","w":"normal","e":["核心概念"]},{"t":"【原文】概括起来说，孔子的中心思","y":"教材原文","p":["概括起来说，孔子的中心思想实际上就是一个“仁”字，“仁”的意义几乎包括了一切美德","什么是“仁”? 孔子说：“仁者爱人","”即人与人之间要彼此相爱","用什么方法去“爱人”? 就是“推己及人”，一方面是“己欲立而立人，已欲达而达人”，把自己想要得到的好处也给予别人"],"q":"概括起来说，孔子的中心思想实际上就是一个“仁”字，“仁”的意义几乎包括了一切美德。什么是“仁”? 孔子说：“仁者爱人。”即人与人之间要彼此相爱。用什么方法去“爱人”? 就是“推己及人”，一方面是“己欲立而立人，已欲达而达人”，把自己想要得到的好处也给予别人；另一方面是“己所不欲，勿施于人”，自己不想要的东西、不想做的事情，绝不要强加于人。一个具备了“仁”的人","w":"normal","e":["原书正文"]},{"t":"【原文】学术思想学术思想9911","y":"教材原文","p":["学术思想学术思想9911孔子由“仁”的思想出发，提出了一套修身达仁的伦理观念和道德教化的政治观念","孔子说，爱人要推己及人，就是从爱自己，到爱父母兄弟、爱妻子朋友，再由家庭而社会，由社会而国家，即由小到大，由内及外，即《大学》中所提出的“修身、齐家、治国、平天下”的道理","如果连“修身”都谈不上，那“齐家、治国、平天下”又怎么可能呢? 所以孔子说：“孝悌也者，其为仁之本欤","”孔子的政治思想，首先是主张“正名”，即按照一定的是非标准恢复纲纪，否则“名不正则言不顺，言不顺则事不成，事不成则礼"],"q":"学术思想学术思想9911孔子由“仁”的思想出发，提出了一套修身达仁的伦理观念和道德教化的政治观念。孔子说，爱人要推己及人，就是从爱自己，到爱父母兄弟、爱妻子朋友，再由家庭而社会，由社会而国家，即由小到大，由内及外，即《大学》中所提出的“修身、齐家、治国、平天下”的道理。如果连“修身”都谈不上，那“齐家、治国、平天下”又怎么可能呢? 所以孔子说：“孝悌也者，其","w":"normal","e":["原书正文"]},{"t":"【原文】乐不兴，礼乐不兴则刑罚不","y":"教材原文","p":["乐不兴，礼乐不兴则刑罚不中，刑罚不中则民无所措手足”","其次是主张统治者“立信”，即政府要获得人民的信任","孔子说：“政者，正也","子率以正，孰敢不正"],"q":"乐不兴，礼乐不兴则刑罚不中，刑罚不中则民无所措手足”。其次是主张统治者“立信”，即政府要获得人民的信任。孔子说：“政者，正也。子率以正，孰敢不正！”又说：“其身正，不令而行；其身不正，虽令不从。”由此出发，孔子主张用道德教化的办法来治理国家，而不主张使用强权暴力。他说：“道之以政，齐之以刑，民免而无耻；道之以德，齐之以礼，有耻且格。”这些思想，对当今的国家治","w":"normal","e":["原书正文"]},{"t":"【原文】中国文七要客一有4反乙中","y":"教材原文","p":["中国文七要客一有4反乙中国文七要客一有4反乙22最大程度继承和发扬孔子思想的儒学大师是孟子","孟子(约公元前385年——约前304年)，名轲，字子舆，邹国(今山东省邹城市) 人","据说他是孔子孙子子思的门人，一生不曾做官，专以讲述为业","其思想集中反映在他与弟子共同编写的《孟子》一书中"],"q":"中国文七要客一有4反乙中国文七要客一有4反乙22最大程度继承和发扬孔子思想的儒学大师是孟子。孟子(约公元前385年——约前304年)，名轲，字子舆，邹国(今山东省邹城市) 人。据说他是孔子孙子子思的门人，一生不曾做官，专以讲述为业。其思想集中反映在他与弟子共同编写的《孟子》一书中。由于他对儒学的巨大贡献，后世常把儒家学说称为“孔孟之学”或“孔孟之道”。","w":"normal","e":["原书正文"]},{"t":"【原文】最大程度继承和发扬孔子思","y":"教材原文","p":["最大程度继承和发扬孔子思想的儒学大师是孟子","孟子(约公元前385年——约前304年)，名轲，字子舆，邹国(今山东省邹城市) 人","据说他是孔子孙子子思的门人，一生不曾做官，专以讲述为业","其思想集中反映在他与弟子共同编写的《孟子》一书中"],"q":"最大程度继承和发扬孔子思想的儒学大师是孟子。孟子(约公元前385年——约前304年)，名轲，字子舆，邹国(今山东省邹城市) 人。据说他是孔子孙子子思的门人，一生不曾做官，专以讲述为业。其思想集中反映在他与弟子共同编写的《孟子》一书中。由于他对儒学的巨大贡献，后世常把儒家学说称为“孔孟之学”或“孔孟之道”。","w":"normal","e":["原书正文"]},{"t":"【原文】孟子思想的核心是主张“性","y":"教材原文","p":["孟子思想的核心是主张“性善”和“良知”","因为性善，所以人有“恻隐之心”“羞恶之心”“辞让之心”“是非之心”，这些是人与生俱来的良知良能","他认为，一个人之所以不能成为善人，是因为他不去培养和扩充自己的善端","为此，孟子重视主观精神的修养，提出要“养浩然之气”，以达到“富贵不能淫，贫贱不能移，威武不能屈”的境界"],"q":"孟子思想的核心是主张“性善”和“良知”。因为性善，所以人有“恻隐之心”“羞恶之心”“辞让之心”“是非之心”，这些是人与生俱来的良知良能。他认为，一个人之所以不能成为善人，是因为他不去培养和扩充自己的善端。为此，孟子重视主观精神的修养，提出要“养浩然之气”，以达到“富贵不能淫，贫贱不能移，威武不能屈”的境界。在“仁学”理论方面，孟子补充提出了“义”，仁是发自内","w":"normal","e":["原书正文"]},{"t":"【原文】先秦儒家的另一位大师是荀","y":"教材原文","p":["先秦儒家的另一位大师是荀子","荀子(约公元前313——前238年)，名况，字卿，赵国人，曾任齐“稷下学宫”(齐国学府) 的祭酒，后到楚国任兰陵令，据说也曾回过赵国，去过秦国","他的门人弟子不少，其中就有秦国政治家李斯","其思想集中反映于《荀子》一书"],"q":"先秦儒家的另一位大师是荀子。荀子(约公元前313——前238年)，名况，字卿，赵国人，曾任齐“稷下学宫”(齐国学府) 的祭酒，后到楚国任兰陵令，据说也曾回过赵国，去过秦国。他的门人弟子不少，其中就有秦国政治家李斯。其思想集中反映于《荀子》一书。","w":"normal","e":["原书正文"]}]}]},{"id":"culture-c05","t":"第五章 汉字","w":"high","s":[{"id":"culture-c05-s01","t":"第一节 汉字形体演变","w":"high","n":13,"k":[{"t":"隶变","y":"名词解释","p":["篆书圆转笔画变为隶书方折平直","打破象形传统、汉字完全符号化","古今汉字的分水岭"],"q":"汉字由小篆的圆转弧形笔画演变为隶书方折平直笔画的过程。它打破了古文字象形的传统，使汉字完全符号化，是古今汉字的分水岭，在汉字发展史上具有划时代意义。","w":"high","e":["2015 真题","2024 真题"]},{"t":"试论汉字简化与汉字现代化的关系","y":"名词解释","p":["汉字简化是历史趋势","简化方案提高识字效率","简化应遵循约定俗成","规范化标准化信息化","汉字适应信息化时代"],"q":"①汉字简化是汉字发展的历史趋势，从甲骨文到隶楷不断由繁趋简；②新中国成立后推行《汉字简化方案》，精简笔画、减少字数，极大提高了识字与书写效率，为普及教育作出重要贡献；③但简化应遵循约定俗成、稳步推进原则，避免破坏汉字理据与形声系统；④汉字现代化还包括规范化、标准化、信息化，如《通用规范汉字表》、汉语","w":"high","e":["2020 真题"]},{"t":"金文","y":"名词解释","p":["铸刻于青铜器、又称钟鼎文","盛行商周、西周为盛","笔画肥厚圆润、较甲骨文规范"],"q":"铸刻在青铜器上的文字，又称钟鼎文，盛行于商周，以西周为盛。笔画肥厚圆润，较甲骨文更为规范，是研究上古历史的重要资料。","w":"normal","e":["核心概念"]},{"t":"小篆","y":"名词解释","p":["秦统一后推行的标准字体","李斯整理、由大篆简化","笔画圆转匀称、结构整齐","第一次汉字规范化"],"q":"秦始皇统一六国后推行的标准字体，由李斯等人整理，以大篆为基础简化而成，笔画圆转匀称、结构整齐，是中国历史上第一次汉字规范化。","w":"normal","e":["核心概念"]},{"t":"甲骨文","y":"名词解释","p":["刻于龟甲兽骨的占卜文字","现存最早的成体系汉字","安阳殷墟、商代后期","1899年王懿荣发现"],"q":"刻写在龟甲和兽骨上的占卜文字，是现存最早的成体系的汉字，出土于河南安阳殷墟，盛行于商代后期，1899年为王懿荣所发现。","w":"normal","e":["核心概念"]},{"t":"石鼓文","y":"名词解释","p":["刻于十面鼓形石上","春秋战国秦国文字","现存最早石刻文字、石刻之祖"],"q":"刻在十面鼓形石上的文字，为春秋战国时期秦国的文字，是现存最早的石刻文字，字体介于大篆与小篆之间，被誉为\"石刻之祖\"。","w":"normal","e":["核心概念"]},{"t":"试论“隶变”在汉字发展史上的意义","y":"名词解释","p":["隶变：小篆圆转线条到隶书方折笔画","完成古文字向今文字的过渡","摆脱象形束缚、确立表意符号","简化字形、提高书写效率","为楷草行书与书法艺术奠基"],"q":"隶变指汉字由小篆的圆转线条演变为隶书的方折笔画的过程，是汉字发展史上最重要的一次变革。其意义在于：其一，它完成了汉字由古文字向今文字的过渡，是古今文字的分水岭；其二，它使汉字彻底摆脱了象形的束缚，由描绘性符号转变为由笔画构成的表意符号，奠定了方块汉字的基本形态；其三，它简化了字形结构、提高了书写效率","w":"normal","e":["核心概念"]},{"t":"【原文】据知，“玄学”之风，早在","y":"教材原文","p":["据知，“玄学”之风，早在三国魏时已经出现","那时有何晏(? ——249年) 和王弼(226——249 年) 二人喜好老庄，何著《道德论》和《论语集解》，王则有《周易注》和《老子注》等，二人都主张“贵无”，认为“天地万物以无为本”，强调“返本归真，一任自然”","到魏晋之际，便有嵇康、阮籍、郭象等人，大力宣扬何、王二人的观点，遂使玄学大盛","嵇康、阮籍都是“竹林七贤”中的人物，他们的根本点是张扬道家的自然主义思想，抨击虚伪的儒家名教"],"q":"据知，“玄学”之风，早在三国魏时已经出现。那时有何晏(? ——249年) 和王弼(226——249 年) 二人喜好老庄，何著《道德论》和《论语集解》，王则有《周易注》和《老子注》等，二人都主张“贵无”，认为“天地万物以无为本”，强调“返本归真，一任自然”。到魏晋之际，便有嵇康、阮籍、郭象等人，大力宣扬何、王二人的观点，遂使玄学大盛。嵇康、阮籍都是“竹林七贤”","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)玄学的实际内涵，犹如近人所论，它实际是以“本末有无”为核心所展开的本体和本性之学，它所探求的是宇宙存在的根据，是企图透过宇宙万有的现象，直接探求其本体和本性","宇宙本体是“无”，形形色色的存在是“有”， “无”是“有”的根据， “本”是“末”的根据， “一”是“多”的根据，“静”是“动”的根据，等等","若就人的本性而言，玄学认为人性自然，人性的表现应当顺其自然，不能有任何模仿或造作","虽然在自然与名教的关系上，玄学家们的看法并不相同，但在人性自然这一点上观点还是一致的"],"q":"中国文化要略(第4版)中国文化要略(第4版)玄学的实际内涵，犹如近人所论，它实际是以“本末有无”为核心所展开的本体和本性之学，它所探求的是宇宙存在的根据，是企图透过宇宙万有的现象，直接探求其本体和本性。宇宙本体是“无”，形形色色的存在是“有”， “无”是“有”的根据， “本”是“末”的根据， “一”是“多”的根据，“静”是“动”的根据，等等。若就人的本性而言","w":"normal","e":["原书正文"]},{"t":"【原文】玄学的实际内涵，犹如近人","y":"教材原文","p":["玄学的实际内涵，犹如近人所论，它实际是以“本末有无”为核心所展开的本体和本性之学，它所探求的是宇宙存在的根据，是企图透过宇宙万有的现象，直接探求其本体和本性","宇宙本体是“无”，形形色色的存在是“有”， “无”是“有”的根据， “本”是“末”的根据， “一”是“多”的根据，“静”是“动”的根据，等等","若就人的本性而言，玄学认为人性自然，人性的表现应当顺其自然，不能有任何模仿或造作","虽然在自然与名教的关系上，玄学家们的看法并不相同，但在人性自然这一点上观点还是一致的"],"q":"玄学的实际内涵，犹如近人所论，它实际是以“本末有无”为核心所展开的本体和本性之学，它所探求的是宇宙存在的根据，是企图透过宇宙万有的现象，直接探求其本体和本性。宇宙本体是“无”，形形色色的存在是“有”， “无”是“有”的根据， “本”是“末”的根据， “一”是“多”的根据，“静”是“动”的根据，等等。若就人的本性而言，玄学认为人性自然，人性的表现应当顺其自然，","w":"normal","e":["原书正文"]},{"t":"【原文】化，即经魏晋隋唐儒家学者","y":"教材原文","p":["化，即经魏晋隋唐儒家学者已摒弃了汉儒琐碎章句之学，转向探求儒学的“原道”和“原性”，如唐代韩愈、李翱所主张的那样","二是佛教思想的流行，特别是禅宗所宣扬的心性说，给儒学注入了一股新鲜血液，因而在北宋初年便有胡瑗(因字“安定”，世称“安定先生”) 讲“砥砺气节”，孙复(因居泰山，世称“泰山先生”) 讲“经世济人”，他们都强调儒家纲常与天道的一致性，所以胡、孙二人实开“理学”先河","孙复之学，传于张载(1020——1077年，因侨居今陕西省眉县横渠镇，世称“横渠先生”)，张载以“气”来解释各种事物的生灭变化，主张人应通过努力获得完美的“天地之性”，称他治学的目的是“为天地立心，为生民立命，为往圣继绝学，为万世开太平”，具有强烈的经世致用精神","因他居于关中，他的学说被称为“关学”"],"q":"化，即经魏晋隋唐儒家学者已摒弃了汉儒琐碎章句之学，转向探求儒学的“原道”和“原性”，如唐代韩愈、李翱所主张的那样；二是佛教思想的流行，特别是禅宗所宣扬的心性说，给儒学注入了一股新鲜血液，因而在北宋初年便有胡瑗(因字“安定”，世称“安定先生”) 讲“砥砺气节”，孙复(因居泰山，世称“泰山先生”) 讲“经世济人”，他们都强调儒家纲常与天道的一致性，所以胡、孙二人","w":"normal","e":["原书正文"]},{"t":"【原文】学术思想学术思想1011","y":"教材原文","p":["学术思想学术思想101101“二程”之学，传至南宋，由朱熹 (1130——1200年，因筑室讲学于武夷山紫阳书院，世称“紫阳先生”) 集其大成","朱熹继承北宋诸儒，糅合佛、老，建立了一个完整的理学体系，以“理”和“气”解释宇宙、人生，认为“理”是形而上的绝对真理，“气”则是形而下的由“理”派生出的具体物质","阴阳二气交合变化，才生成金、木、水、火、土五行","朱熹认为，理气相合而成人，气中之理，即是人性"],"q":"学术思想学术思想101101“二程”之学，传至南宋，由朱熹 (1130——1200年，因筑室讲学于武夷山紫阳书院，世称“紫阳先生”) 集其大成。朱熹继承北宋诸儒，糅合佛、老，建立了一个完整的理学体系，以“理”和“气”解释宇宙、人生，认为“理”是形而上的绝对真理，“气”则是形而下的由“理”派生出的具体物质。阴阳二气交合变化，才生成金、木、水、火、土五行。朱熹认","w":"normal","e":["原书正文"]},{"t":"【原文】元代的理学只是“朱学”流","y":"教材原文","p":["元代的理学只是“朱学”流行的一个阶段","到明代经陈献章(1428——1500年，因居广东新会白沙里，世称“白沙先生”) 而至王守仁(1472——1529年，因在故乡阳明洞读书，后创阳明书院，世称“阳明先生”)，又成为理学发展的一个高潮","陈献章上继陆九渊，下启王守仁，他原本习朱学，但后来的思想境界却转入陆学","他的学说是“以虚无为基本，以寂静为门户，以宇宙万象为轮廓，以日常生活为功用”，主张“天地因我而立，万化因我而出，而宇宙自在我心之中”，这其实就是陆九渊所说的“吾心即宇宙”，“万物皆备于我”的道理"],"q":"元代的理学只是“朱学”流行的一个阶段。到明代经陈献章(1428——1500年，因居广东新会白沙里，世称“白沙先生”) 而至王守仁(1472——1529年，因在故乡阳明洞读书，后创阳明书院，世称“阳明先生”)，又成为理学发展的一个高潮。陈献章上继陆九渊，下启王守仁，他原本习朱学，但后来的思想境界却转入陆学。他的学说是“以虚无为基本，以寂静为门户，以宇宙万象为轮","w":"normal","e":["原书正文"]}]},{"id":"culture-c05-s02","t":"第二节 六书与汉字结构","w":"high","n":11,"k":[{"t":"六书","y":"名词解释","p":["象形、指事、会意、形声、转注、假借","许慎《说文解字·叙》系统确立","前四为造字法、后二为用字法"],"q":"古人分析汉字结构归纳出的六种条例，首见于许慎《说文解字·叙》：象形、指事、会意、形声、转注、假借。其中象形、指事、会意、形声为造字法，转注、假借为用字法。","w":"high","e":["2017 真题","2023 真题"]},{"t":"形声","y":"名词解释","p":["意符与声符组合成字","如洋从水羊声","最能产的造字法","占汉字八成以上"],"q":"六书之一，由表意的意符（形旁）和表音的声符（声旁）组合成字的造字法。如“洋”，从水羊声，氵表意类，羊表读音。形声是最能产的造字法，占汉字的百分之八十以上，兼顾表意与表音，适应了汉语词汇发展的需要。","w":"high","e":["2016 真题"]},{"t":"假借","y":"名词解释","p":["本无其字依声托事","借用同音字记录新词","如“其”借为代词","属用字法"],"q":"六书之一，本无其字，依声托事，即借用已有的同音字来记录新词。如“其”本义为簸箕，借为代词；“来”本义为小麦，借为来往之来。假借不造新字而扩大了字的使用范围，是用字法而非造字法。","w":"normal","e":["核心概念"]},{"t":"【原文】这三大崇拜实是出于古人对","y":"教材原文","p":["这三大崇拜实是出于古人对这三者的认识，或者说这三者决定了人们的生存","荀子在自己的著作里说：“天地者，生之本也","先祖者，类之本也","君师者，治之本也"],"q":"这三大崇拜实是出于古人对这三者的认识，或者说这三者决定了人们的生存。荀子在自己的著作里说：“天地者，生之本也；先祖者，类之本也；君师者，治之本也。无天地恶生? 无先祖恶出? 无君师恶治? 三者偏亡，则无安人。故礼，上事天，下事地，尊先祖而隆君师，是礼之三本也。”于此可知，天地是人的生存环境，先祖是人的生理纽带，而君师则是引导社会前进的人物。这三者失去一者，人","w":"normal","e":["原书正文"]},{"t":"【原文】宗教信仰宗教信仰1091","y":"教材原文","p":["宗教信仰宗教信仰109109(一) 天地山川崇拜及祭祀在中国古代的所有信仰中，可以认为天地是最神圣的","天神称为“皇天上帝”，地神称为“后土”，合称“皇天后土”","若从词义来解释，“皇”是“大”的意思，“后”是“厚”的意思，皇天覆盖万物，降干旱雨露于人间"],"q":"宗教信仰宗教信仰109109(一) 天地山川崇拜及祭祀在中国古代的所有信仰中，可以认为天地是最神圣的。天神称为“皇天上帝”，地神称为“后土”，合称“皇天后土”。若从词义来解释，“皇”是“大”的意思，“后”是“厚”的意思，皇天覆盖万物，降干旱雨露于人间；厚土","w":"normal","e":["原书正文"]},{"t":"【原文】这种顶礼膜拜表现在封建国","y":"教材原文","p":["这种顶礼膜拜表现在封建国家的祭祀仪式上","中国古代祭祀天地的仪式很多，但以“封禅”(禅，读shàn) 最为隆重，是封建社会首屈一指的大礼","《管子》和《史记》都记载了“封禅”"],"q":"这种顶礼膜拜表现在封建国家的祭祀仪式上。中国古代祭祀天地的仪式很多，但以“封禅”(禅，读shàn) 最为隆重，是封建社会首屈一指的大礼。《管子》和《史记》都记载了“封禅”。","w":"normal","e":["原书正文"]},{"t":"【原文】所谓“封禅”，就是由帝王","y":"教材原文","p":["所谓“封禅”，就是由帝王来祭祀天地的大型典礼","“封”，是在泰山顶上设坛祭天","“禅”，是在泰山附近的小山上祭地，较为著名的是在梁父(又"],"q":"所谓“封禅”，就是由帝王来祭祀天地的大型典礼。“封”，是在泰山顶上设坛祭天；“禅”，是在泰山附近的小山上祭地，较为著名的是在梁父(又","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)称“梁甫”) 山上，故史书上多说“封泰山而禅梁父”","封禅的根本目的是帝称“梁甫”) 山上，故史书上多说“封泰山而禅梁父”","封禅的根本目的是帝"],"q":"中国文化要略(第4版)中国文化要略(第4版)称“梁甫”) 山上，故史书上多说“封泰山而禅梁父”。封禅的根本目的是帝称“梁甫”) 山上，故史书上多说“封泰山而禅梁父”。封禅的根本目的是帝","w":"normal","e":["原书正文"]},{"t":"【原文】王取得天下以后，以天子身","y":"教材原文","p":["王取得天下以后，以天子身份祭告天地，以表示自己的统治为“君权神授”，王取得天下以后，以天子身份祭告天地，以表示自己的统治为“君权神授”，"],"q":"王取得天下以后，以天子身份祭告天地，以表示自己的统治为“君权神授”，王取得天下以后，以天子身份祭告天地，以表示自己的统治为“君权神授”，","w":"normal","e":["原书正文"]},{"t":"【原文】符合天意，合乎正统","y":"教材原文","p":["符合天意，合乎正统","这种崇拜仪式起源于何时呢? 司马迁在《史记》里援符合天意，合乎正统","这种崇拜仪式起源于何时呢? 司马迁在《史记》里援"],"q":"符合天意，合乎正统。这种崇拜仪式起源于何时呢? 司马迁在《史记》里援符合天意，合乎正统。这种崇拜仪式起源于何时呢? 司马迁在《史记》里援","w":"normal","e":["原书正文"]},{"t":"【原文】引春秋时期齐国名相管仲的","y":"教材原文","p":["引春秋时期齐国名相管仲的话认为，远在伏羲氏以前的无怀氏时代就开始了，引春秋时期齐国名相管仲的话认为，远在伏羲氏以前的无怀氏时代就开始了，"],"q":"引春秋时期齐国名相管仲的话认为，远在伏羲氏以前的无怀氏时代就开始了，引春秋时期齐国名相管仲的话认为，远在伏羲氏以前的无怀氏时代就开始了，","w":"normal","e":["原书正文"]}]},{"id":"culture-c05-s03","t":"第三节 字书与注音","w":"normal","n":10,"k":[{"t":"反切","y":"名词解释","p":["用两字拼注一字的注音法","上字取声母、下字取韵母声调","始于汉末，受梵文影响","古代韵书主要注音方式"],"q":"反切是用两个字拼注一个汉字读音的传统注音方法，上字取声母，下字取韵母和声调，合而成音，如\"东，德红切\"。反切始于汉末，受梵文拼音原理影响而产生，盛行于魏晋至唐宋。它比直音法更为精确，是古代韵书、字书的主要注音方式，也是研究古音的重要材料。","w":"normal","e":["核心概念"]},{"t":"四声","y":"名词解释","p":["平上去入四种声调","确立于南朝齐梁","沈约倡导，用于诗文","普通话四声由古四声演变"],"q":"四声指汉语的平、上、去、入四种声调，是汉语作为声调语言的基本特征。四声之名确立于南朝齐梁时期，沈约《四声谱》、周颙《四声切韵》等加以倡导，并应用于诗文创作，形成永明体。现代普通话的阴平、阳平、上声、去声由古四声演变而来，入声在北方话中已消失，部分方言仍保留。","w":"normal","e":["核心概念"]},{"t":"说文解字","y":"名词解释","p":["东汉许慎所著","中国第一部系统分析字形的字典","收字9353，按540部首编排","首创部首检字法"],"q":"《说文解字》是东汉许慎所著的中国第一部系统分析字形、解说字义、辨识声读的字典，成书于公元100年。全书收字9353个，重文1163个，按540个部首编排，以\"六书\"理论分析字形结构，首创部首检字法。它是研究古文字与汉语词源的经典，被誉为\"天下第一种书\"。","w":"normal","e":["核心概念"]},{"t":"【原文】祭祀后土是封建国家专门祭","y":"教材原文","p":["祭祀后土是封建国家专门祭祀地神的仪式","关于后土神的来历，古籍记载不一","《山海经》《礼记》说它是共工的儿子，名叫“句龙”，因它善于平整九州土地，受封为“土正”(古代管理土地的官员)，祀为大地之神","但以原始信仰来看，古人祭祀地神，是为了酬谢大地负载万物、养育万民的功劳，是农业文明的心理体现"],"q":"祭祀后土是封建国家专门祭祀地神的仪式。关于后土神的来历，古籍记载不一。《山海经》《礼记》说它是共工的儿子，名叫“句龙”，因它善于平整九州土地，受封为“土正”(古代管理土地的官员)，祀为大地之神。但以原始信仰来看，古人祭祀地神，是为了酬谢大地负载万物、养育万民的功劳，是农业文明的心理体现。由于天阳地阴的缘故，后土神被塑造为女性。史料记载，黄帝时代已有祭祀活动，","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)111122古代帝王除了往泰山封禅、往汾阴祭后土之外，祭祀天地的仪式还有庙祭和郊祭两种","这两种仪式都始于周代","西周时已建有天帝庙，由天子亲祭","春秋战国以后，天帝庙都建于雍州(今陕西省凤翔县一带)"],"q":"中国文化要略(第4版)中国文化要略(第4版)111122古代帝王除了往泰山封禅、往汾阴祭后土之外，祭祀天地的仪式还有庙祭和郊祭两种。这两种仪式都始于周代。西周时已建有天帝庙，由天子亲祭。春秋战国以后，天帝庙都建于雍州(今陕西省凤翔县一带)。据说是关中以雍州的地势最高，离天最近。在这个阶段，由于五行学说渗入宗教信仰，天帝的数目增多了，名称也混乱了，认为天神中最","w":"normal","e":["原书正文"]},{"t":"【原文】白帝(金)，南方赤帝(火","y":"教材原文","p":["白帝(金)，南方赤帝(火)，北方黑帝(水)，中央黄帝(土)","汉代以前，雍州已有白、青、黄、赤四帝之庙，汉高祖刘邦增建黑帝庙","史书上多次提到汉文帝、汉武帝“幸雍，祠太一”，都是在雍州举行庙祭的意思","至于郊祭，则是在京城的郊外举行祭祀天地的仪式，史书上称为“郊”"],"q":"白帝(金)，南方赤帝(火)，北方黑帝(水)，中央黄帝(土)。汉代以前，雍州已有白、青、黄、赤四帝之庙，汉高祖刘邦增建黑帝庙。史书上多次提到汉文帝、汉武帝“幸雍，祠太一”，都是在雍州举行庙祭的意思。至于郊祭，则是在京城的郊外举行祭祀天地的仪式，史书上称为“郊”。据《礼记》载，周代已规定在冬至到南郊祭天，夏至到北郊祭地。这是因为冬至则由阴转阳，天属阳；夏至则由阳","w":"normal","e":["原书正文"]},{"t":"【原文】宗教信仰宗教信仰山川是大","y":"教材原文","p":["宗教信仰宗教信仰山川是大地的组成部分，也是大地的象征","古人崇拜山岳，大约是因其高大，云遮雾绕，能兴风雨，似有神灵居住","崇拜大河，则因它终年流动，或利或害，神力无边","封建帝王祭祀山川则有事天地而礼山川，保天下而护江河的用意在内"],"q":"宗教信仰宗教信仰山川是大地的组成部分，也是大地的象征。古人崇拜山岳，大约是因其高大，云遮雾绕，能兴风雨，似有神灵居住；崇拜大河，则因它终年流动，或利或害，神力无边。封建帝王祭祀山川则有事天地而礼山川，保天下而护江河的用意在内。古时祭祀以“五岳”“五镇”“四渎”“四海”最为重要，因为它们代表了帝王统治的江山社稷。五岳为东岳泰山、西岳华山、南岳衡山、北岳恒山、中","w":"normal","e":["原书正文"]},{"t":"【原文】山川是大地的组成部分，也","y":"教材原文","p":["山川是大地的组成部分，也是大地的象征","古人崇拜山岳，大约是因其高大，云遮雾绕，能兴风雨，似有神灵居住","崇拜大河，则因它终年流动，或利或害，神力无边","封建帝王祭祀山川则有事天地而礼山川，保天下而护江河的用意在内"],"q":"山川是大地的组成部分，也是大地的象征。古人崇拜山岳，大约是因其高大，云遮雾绕，能兴风雨，似有神灵居住；崇拜大河，则因它终年流动，或利或害，神力无边。封建帝王祭祀山川则有事天地而礼山川，保天下而护江河的用意在内。古时祭祀以“五岳”“五镇”“四渎”“四海”最为重要，因为它们代表了帝王统治的江山社稷。五岳为东岳泰山、西岳华山、南岳衡山、北岳恒山、中岳嵩山，它们代表","w":"normal","e":["原书正文"]},{"t":"【原文】相传黄帝时已有山川之祭，","y":"教材原文","p":["相传黄帝时已有山川之祭，又说舜帝“望于山川，遍于群神”，或说“禹主山川，定其秩祀”","但是比较可信的山川之祀，恐怕到了周代才有所规定","《礼记·王制》云：“天子五年一巡狩……柴而望祀山川”，二月(春) 于岱宗(泰山)，五月(夏) 于南岳，八月(秋) 于西岳，十一月(冬) 于北岳","这表明周朝的疆域已很广阔，所以才能形成这一制度"],"q":"相传黄帝时已有山川之祭，又说舜帝“望于山川，遍于群神”，或说“禹主山川，定其秩祀”。但是比较可信的山川之祀，恐怕到了周代才有所规定。《礼记·王制》云：“天子五年一巡狩……柴而望祀山川”，二月(春) 于岱宗(泰山)，五月(夏) 于南岳，八月(秋) 于西岳，十一月(冬) 于北岳。这表明周朝的疆域已很广阔，所以才能形成这一制度。秦始皇统一中国以后，以其天下广大，所","w":"normal","e":["原书正文"]},{"t":"【原文】帝王祭祀自己的祖先用太庙","y":"教材原文","p":["帝王祭祀自己的祖先用太庙，官员百姓祭祀祖先用宗祠","一姓一族聚于一地，为敬奉祖先或本族杰出人物立祠以祭","由于几千年来的宗法传统，这类宗祠在过去多如牛毛，但现在已很寥寥","较为著名的如江苏省常州市的“瞿氏宗祠”，是当地瞿姓家族的祭祖之地"],"q":"帝王祭祀自己的祖先用太庙，官员百姓祭祀祖先用宗祠。一姓一族聚于一地，为敬奉祖先或本族杰出人物立祠以祭。由于几千年来的宗法传统，这类宗祠在过去多如牛毛，但现在已很寥寥。较为著名的如江苏省常州市的“瞿氏宗祠”，是当地瞿姓家族的祭祖之地。瞿秋白因幼时家贫，付不起房租，只好寄居祠内，现已建为“瞿秋白纪念馆”。安徽省绩溪县龙川“胡氏宗祠”，建筑精美，文化内涵丰富，为绩","w":"normal","e":["原书正文"]}]}]},{"id":"culture-c06","t":"第六章 学术思想","w":"high","s":[{"id":"culture-c06-s01","t":"第一节 先秦诸子","w":"high","n":21,"k":[{"t":"仁","y":"名词解释","p":["儒家核心范畴","基本含义是爱人","克己复礼为实现途径","包含忠恕之道"],"q":"儒家思想的核心范畴。孔子以“仁”为最高道德原则，基本含义是“爱人”，即对人的关爱与尊重；实现仁的方法是“克己复礼”，即约束自己使言行合乎礼的规范；仁还包含忠恕之道，“己所不欲，勿施于人”。仁贯穿于孔子整个思想体系，是儒家伦理的总纲。","w":"high","e":["2019 真题"]},{"t":"法术势","y":"名词解释","p":["法为成文法与赏罚","术为君主驾驭臣下的权术","势为君主的权势地位","韩非综合商鞅申不害慎到"],"q":"法家韩非的思想体系。法指成文法与赏罚制度，主张“法不阿贵”；术指君主驾驭臣下的权术，包括循名责实、任人唯贤与阴谋权术；势指君主的权势与地位，主张君主独掌权势。韩非综合商鞅之“法”、申不害之“术”、慎到之“势”，构成完整的法家理论。","w":"high","e":["2020 真题"]},{"t":"宋明理学","y":"名词解释","p":["以儒学为基础吸收佛道","程朱：理在事先、格物致知","陆王：心即是理、致良知、知行合一"],"q":"宋明时期以儒家思想为基础、吸收佛道思想而形成的新儒学。分为程朱理学与陆王心学两大派：程朱主张\"理在事先\"\"格物致知\"\"存天理灭人欲\"；陆王主张\"心即是理\"\"致良知\"\"知行合一\"。","w":"high","e":["2015 真题","2021 真题"]},{"t":"程朱理学","y":"名词解释","p":["二程与朱熹为代表","理为宇宙本原","理在事先","格物致知","存天理灭人欲","元明清官方哲学"],"q":"以北宋程颢、程颐和南宋朱熹为代表的理学学派。认为“理”是宇宙的本原与最高范畴，理在气先、理在事先；主张“格物致知”以穷理，提出“存天理，灭人欲”的修养论。朱熹集大成，编《四书章句集注》，使理学成为元明清官方哲学。","w":"high","e":["2024 真题","2015 真题"]},{"t":"孔孟之道","y":"名词解释","p":["孔子核心为仁与礼","孟子主张仁政、民贵君轻、性善论","汉武帝后成为文化精神内核"],"q":"以孔子、孟子为代表的儒家思想体系。孔子核心是\"仁\"与\"礼\"，主张克己复礼、为政以德；孟子发展出\"仁政\"\"民贵君轻\"与性善论。自汉武帝\"独尊儒术\"后成为中国传统文化的精神内核。","w":"high","e":["2019 真题"]},{"t":"无为而治","y":"名词解释","p":["道家老子的政治主张","道常无为而无不为","顺应自然不妄加干预","无为非不为而是不妄为"],"q":"道家老子的政治主张。老子认为“道常无为而无不为”，统治者应顺应自然、不妄加干预，清静无为，使百姓自化、自正、自富、自朴，从而达到“无为而治”的理想状态。无为并非什么都不做，而是不违背事物本性地强行妄为。","w":"high","e":["2018 真题"]},{"t":"兼爱非攻","y":"名词解释","p":["墨家核心主张","兼爱为平等爱一切人","非攻为反对侵略战争","代表平民与小生产者利益"],"q":"墨家核心主张。兼爱指不分亲疏贵贱、平等地爱一切人，反对儒家“爱有差等”；非攻指反对侵略战争，主张以义服人。墨子认为天下大乱源于“不相爱”，故提倡兼相爱、交相利。兼爱非攻体现了墨家代表平民与小生产者利益的思想立场。","w":"high","e":["2017 真题"]},{"t":"罢黜百家，独尊儒术","y":"名词解释","p":["汉武帝采纳董仲舒建议","唯立五经博士","以儒术取士","儒学成为官方正统"],"q":"汉武帝采纳董仲舒建议推行的思想文化政策。废除诸子博士，唯立五经博士，以儒家经典为官学，以儒术取士。自此儒学成为官方正统思想，确立了此后两千年中国古代社会的意识形态基础，但也限制了思想的多元发展。","w":"high","e":["2019 真题"]},{"t":"试论儒家思想对中国文化的深远影响","y":"名词解释","p":["德治民本礼治的治国理念","仁义礼智信的伦理规范","有教无类推动教育","儒家经典成为文化核心","塑造民族性格","等级观念等消极影响"],"q":"①政治层面：儒家德治、民本、礼治思想成为历代治国理念，“为政以德”“民为邦本”影响深远；②伦理层面：仁义礼智信、三纲五常构成传统社会的道德规范，宗法家族伦理深入人心；③教育层面：有教无类、因材施教、学而优则仕推动了教育普及与科举制度；④文化层面：儒家经典成为传统文化核心，影响文学、史学、哲学与艺术；","w":"high","e":["2023 真题","2016 真题"]},{"t":"试论中国古代教育思想对现代的启示","y":"名词解释","p":["有教无类的教育公平","因材施教的个性化教学","学思结合独立思考","教学相长师生共进","德育为先立德树人","书院精神的借鉴","剔除等级性糟粕"],"q":"①有教无类：孔子主张教育不分贵贱贫富，体现了教育公平理念，对当代教育公平有启示；②因材施教：根据学生个性差异施教，启示当代个性化教学；③学思结合：“学而不思则罔，思而不学则殆”，强调独立思考；④教学相长：《学记》提出“教学相长”，启示师生共同成长；⑤德育为先：重视人格养成与伦理教育，启示当代立德树人","w":"high","e":["2021 真题"]},{"t":"礼","y":"名词解释","p":["维护等级秩序的制度仪节","孔子主张克己复礼","荀子隆礼重法","宗法社会的核心规范"],"q":"儒家重要范畴，指维护社会等级秩序与伦理规范的一整套制度、仪节与行为准则。孔子主张“克己复礼为仁”，强调礼对个人修养与社会秩序的规范作用；荀子进一步提出“隆礼重法”，把礼视为治国根本。礼是中国古代宗法社会的核心规范。","w":"normal","e":["核心概念"]},{"t":"十三经","y":"名词解释","p":["儒家十三部经典总称","由汉五经、唐九经逐步扩充","宋代加入论、孝、尔雅、孟子","明代合刻定型"],"q":"十三经是儒家十三部经典的总称，即《周易》《尚书》《诗经》《周礼》《仪礼》《礼记》《春秋左传》《春秋公羊传》《春秋穀梁传》《论语》《孝经》《尔雅》《孟子》。汉代以五经为尊，唐代扩充为九经，宋代加入《论语》《孝经》《尔雅》《孟子》，至明代正式合刻为\"十三经\"。","w":"normal","e":["核心概念"]},{"t":"老庄思想","y":"名词解释","p":["老子：道法自然、无为而治","庄子：齐物逍遥、精神自由","与儒家互补构成文化支柱"],"q":"以老子、庄子为代表的道家思想。老子主张\"道法自然\"\"无为而治\"，提出朴素辩证法；庄子主张齐物、逍遥，追求精神自由。道家与儒家互补，构成中国传统文化的重要支柱。","w":"normal","e":["核心概念"]},{"t":"四书五经","y":"名词解释","p":["四书：大学中庸论语孟子","五经：诗书礼易春秋","朱熹合编四书并作注","科举考试核心内容"],"q":"四书指《大学》《中庸》《论语》《孟子》，由南宋朱熹合编并作注；五经指《诗》《书》《礼》《易》《春秋》。二者是儒家经典的核心，也是科举考试的主要内容。","w":"normal","e":["核心概念"]},{"t":"试述宋明理学的发展脉络及其主要派别","y":"名词解释","p":["周敦颐张载二程奠基","朱熹集大成、程朱理学官学化","陆九渊心即理、鹅湖之会","王阳明致良知与知行合一","程朱重格物、陆王重本心","明清之际实学思潮纠弊"],"q":"宋明理学是宋明时期以儒家伦理为核心、吸收佛道思辨哲学而形成的新儒学体系。其发展脉络为：北宋周敦颐以《太极图说》开理学先河，张载倡气本论与民胞物与，二程（程颢、程颐）确立天理范畴，奠定理学基础；南宋朱熹集大成，构建理气二元、格物致知的理学体系，编定四书，成为官方正统，世称程朱理学；与此同时陆九渊倡心即","w":"normal","e":["核心概念"]},{"t":"【原文】一般认为，佛教是由释迦牟","y":"教材原文","p":["一般认为，佛教是由释迦牟尼于公元前6世纪到前5世纪在古印度境内创立的，因此在我国又叫“释教”，管和尚又称“释子”","它在什么时候传入中国，历来的佛教学者说法不一，文字记载也混乱矛盾","大致说来有以下几种说法：战国燕昭王时传入说、秦始皇时传入说、汉武帝时传入说、西汉末年传入说和东汉明帝时传入说等","过去比较通行的说法是汉明帝永平十年间传入"],"q":"一般认为，佛教是由释迦牟尼于公元前6世纪到前5世纪在古印度境内创立的，因此在我国又叫“释教”，管和尚又称“释子”。它在什么时候传入中国，历来的佛教学者说法不一，文字记载也混乱矛盾。大致说来有以下几种说法：战国燕昭王时传入说、秦始皇时传入说、汉武帝时传入说、西汉末年传入说和东汉明帝时传入说等。过去比较通行的说法是汉明帝永平十年间传入。这一说法最早见于东汉末年的","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)120120但近代以来的中外学者对这一说法大表怀疑，理由是：汉明帝感梦求法这件事非常奇怪","《后汉书》就载有明帝的异母兄弟楚王刘英在家中设祠拜浮屠(即佛)，兄弟二人关系密切，明帝应当知道佛的存在，何必感梦求法?其次是派遣的使臣，有的说是张骞(汉武帝时人)，有的说是蔡愔","第三是替汉明帝释梦的傅毅，《后汉书》说他在明帝时还是个读书的小孩儿","因此，学者们认为明帝求法不是事实，所谓白马驮经，迦叶摩腾、竺法兰译经等，都是后来的佛家有意编造出来以证明自己来历不凡的"],"q":"中国文化要略(第4版)中国文化要略(第4版)120120但近代以来的中外学者对这一说法大表怀疑，理由是：汉明帝感梦求法这件事非常奇怪。《后汉书》就载有明帝的异母兄弟楚王刘英在家中设祠拜浮屠(即佛)，兄弟二人关系密切，明帝应当知道佛的存在，何必感梦求法?其次是派遣的使臣，有的说是张骞(汉武帝时人)，有的说是蔡愔； 第三是替汉明帝释梦的傅毅，《后汉书》说他在明帝","w":"normal","e":["原书正文"]},{"t":"【原文】西汉末年或两汉之间传入是","y":"教材原文","p":["西汉末年或两汉之间传入是比较可信的","如任继愈先生在他主编的《中国佛教史》和日本学者镰田茂雄在他所著的《简明中国佛教史》里都持这一看法","其主要根据是裴松之在《三国志注》中引用了三国时鱼豢所著《魏略·西戎传》的一段记载，说西汉哀帝元寿元年(公元前2年)，大月氏国使臣曾向博士弟子景卢口授浮屠经","《后汉书》也载明帝的异母兄弟楚王刘英在家拜黄帝、老子和浮屠，还出钱供养沙门(即和尚)，这说明东汉初年佛教已在上层统治集团中间流传"],"q":"西汉末年或两汉之间传入是比较可信的。如任继愈先生在他主编的《中国佛教史》和日本学者镰田茂雄在他所著的《简明中国佛教史》里都持这一看法。其主要根据是裴松之在《三国志注》中引用了三国时鱼豢所著《魏略·西戎传》的一段记载，说西汉哀帝元寿元年(公元前2年)，大月氏国使臣曾向博士弟子景卢口授浮屠经。《后汉书》也载明帝的异母兄弟楚王刘英在家拜黄帝、老子和浮屠，还出钱供养","w":"normal","e":["原书正文"]},{"t":"【原文】佛教初入中国，人们还只是","y":"教材原文","p":["佛教初入中国，人们还只是把它当作一种神灵来崇拜，跟神化了的黄帝、老子一样，在朝廷和一些王公贵族的家里供奉，民间还没有什么大信仰","从文献记载看，汉桓帝可能是第一个信奉佛教的皇帝，他曾在宫中建立黄老、浮屠之祠","最早出家信佛而又见于记载的汉人是汉灵帝时的严佛调，这已经到了东汉晚期","至于第一个登坛受戒、正式成为和尚的汉人朱士行，已经是三国时代的人了"],"q":"佛教初入中国，人们还只是把它当作一种神灵来崇拜，跟神化了的黄帝、老子一样，在朝廷和一些王公贵族的家里供奉，民间还没有什么大信仰。从文献记载看，汉桓帝可能是第一个信奉佛教的皇帝，他曾在宫中建立黄老、浮屠之祠。最早出家信佛而又见于记载的汉人是汉灵帝时的严佛调，这已经到了东汉晚期。至于第一个登坛受戒、正式成为和尚的汉人朱士行，已经是三国时代的人了。足见佛教初来时的","w":"normal","e":["原书正文"]},{"t":"【原文】魏晋南北朝时期佛教有了突","y":"教材原文","p":["魏晋南北朝时期佛教有了突出的发展，表现在：第一，佛经翻译的规模明显扩大","虽然译经的主力还是西域来的僧人，但跟随他们研习的汉土弟子甚多，如西晋时的西域僧竺法护，所译经典据说有150余部，对佛教在中国的传播起了重要作用","又如后秦时的龟兹(今新疆维吾尔自治区库车县)僧人鸠摩罗什，被迎入长安逍遥园(今陕西省户县草堂寺)，大量翻译佛经，从习弟子3，000余人","他所译的《中论》《百论》《十二门论》《金刚经》及《妙法莲花经》等，对中国的佛教理论有划时代的贡献"],"q":"魏晋南北朝时期佛教有了突出的发展，表现在：第一，佛经翻译的规模明显扩大。虽然译经的主力还是西域来的僧人，但跟随他们研习的汉土弟子甚多，如西晋时的西域僧竺法护，所译经典据说有150余部，对佛教在中国的传播起了重要作用。又如后秦时的龟兹(今新疆维吾尔自治区库车县)僧人鸠摩罗什，被迎入长安逍遥园(今陕西省户县草堂寺)，大量翻译佛经，从习弟子3，000余人。他所译的","w":"normal","e":["原书正文"]},{"t":"【原文】窟。据杨街之的《洛阳伽蓝","y":"教材原文","p":["据杨街之的《洛阳伽蓝记》所载，仅北魏在洛阳的寺庙已达1，376所","北齐在邺都 (今河北省临漳县) 的寺庙达4，000所","南朝的寺庙也不少，梁时已有2，846所","唐代诗人杜牧所写的“南朝四百八十寺，多少楼台烟雨中”，只是一个很小的数目"],"q":"窟。据杨街之的《洛阳伽蓝记》所载，仅北魏在洛阳的寺庙已达1，376所。北齐在邺都 (今河北省临漳县) 的寺庙达4，000所。南朝的寺庙也不少，梁时已有2，846所。唐代诗人杜牧所写的“南朝四百八十寺，多少楼台烟雨中”，只是一个很小的数目。第四，西行求法活动成风。中国最早到西域去求法取经的僧人是三国时的朱士行，他也是中国第一个西行求法的人。到两晋南北朝时，便有","w":"normal","e":["原书正文"]}]},{"id":"culture-c06-s02","t":"第二节 两汉经学","w":"high","n":17,"k":[{"t":"三玄","y":"名词解释","p":["《老子》《庄子》《周易》","玄学依据的经典","探讨本末有无体用","形成清谈风气"],"q":"魏晋玄学所依据的三部经典，即《老子》《庄子》《周易》。玄学家以老庄思想解释儒家经典，探讨本末、有无、体用等抽象哲学问题，形成清谈玄理的风气。三玄是魏晋玄学的核心文本。","w":"high","e":["2021 真题"]},{"t":"天人感应","y":"名词解释","p":["董仲舒提出","天为有意志的人格神","天以祥瑞灾异褒奖谴告","为君权神授提供依据"],"q":"西汉董仲舒提出的神学目的论思想。认为天是有意志的人格神，天与人相通，人的行为尤其是君主的政治得失会感应于天，天通过祥瑞或灾异予以褒奖或谴告。这一学说为“君权神授”提供理论依据，同时也以天变谴告约束君权。","w":"high","e":["2016 真题"]},{"t":"今文经学与古文经学","y":"名词解释","p":["今文经以汉隶书写、重微言大义","古文经以先秦古文字书写、重训诂考据","两派争论延续千年"],"q":"汉代经学的两大派别。今文经指用当时通行的隶书写定的经书，重微言大义、通经致用；古文经指用秦以前古文字书写的经书，重文字训诂、名物考据。两派争论延续千年，影响深远。","w":"high","e":["2016 真题","2019 真题"]},{"t":"谶纬","y":"名词解释","p":["谶为预言吉凶的隐语","纬为附会经义的神学书","王莽光武借以证政权合法性","使儒学神学化，隋代禁毁"],"q":"谶纬是汉代盛行的神学化经学思潮。\"谶\"是预言吉凶的隐语符命，\"纬\"是相对于\"经\"而言、以神学迷信附会儒家经义的书。汉代谶纬以《河图》《洛书》及七经纬为主体，王莽、光武帝皆借谶纬论证政权合法性。谶纬之学使儒学神学化，东汉白虎观会议后更被官方认可，至隋炀帝始禁毁。","w":"normal","e":["核心概念"]},{"t":"魏晋玄学","y":"名词解释","p":["以三玄为经典","探讨本末有无、名教与自然","代表人物何晏王弼嵇康阮籍","崇尚清谈、越名教而任自然"],"q":"魏晋时期以《老子》《庄子》《周易》\"三玄\"为经典，探讨本末、有无、名教与自然关系的哲学思潮。代表人物有何晏、王弼、嵇康、阮籍、郭象，崇尚清谈，主张\"越名教而任自然\"。","w":"normal","e":["核心概念"]},{"t":"竹林七贤","y":"名词解释","p":["嵇康阮籍山涛向秀刘伶王戎阮咸","聚于竹林饮酒清谈","以老庄对抗名教礼法","名士风度代表"],"q":"魏晋时期七位名士的合称：嵇康、阮籍、山涛、向秀、刘伶、王戎、阮咸。他们常聚于竹林之下，饮酒清谈、放诞不羁，以老庄思想对抗名教礼法，是魏晋玄学与名士风度的代表。其中嵇康、阮籍文学成就最高。","w":"normal","e":["核心概念"]},{"t":"天人三策","y":"名词解释","p":["董仲舒应汉武帝贤良对策","天人感应、君权神授","大一统与独尊儒术","确立儒学官方地位"],"q":"天人三策是汉武帝元光元年（前134年）董仲舒应贤良对策所作的三篇策文。他提出\"天人感应\"\"君权神授\"\"大一统\"与\"罢黜百家、独尊儒术\"的主张，主张以德治国、兴太学、重教化。汉武帝采纳其说，确立儒学为官方意识形态，儒学由此成为中国传统文化的主流。","w":"normal","e":["核心概念"]},{"t":"白虎通义","y":"名词解释","p":["东汉建初四年白虎观会议","班固整理编撰","以谶纬解经，确立三纲六纪","汉代今文经学官方总结"],"q":"《白虎通义》又称《白虎通德论》，是东汉建初四年（79年）汉章帝在白虎观召集儒生讲论五经异同、由班固整理编撰的会议记录。全书以谶纬神学解释儒家经典，系统确立了\"三纲六纪\"的封建伦理纲常，是汉代今文经学的官方总结，对后世礼制与伦理影响深远。","w":"normal","e":["核心概念"]},{"t":"经世致用","y":"名词解释","p":["明清之际的实学学风","关注现实、解决实际问题","反对空谈心性","黄宗羲、顾炎武、王夫之"],"q":"经世致用是明清之际思想家倡导的学风，主张学术应当关注社会现实、解决国计民生实际问题，反对空谈心性、脱离实务。代表人物有黄宗羲、顾炎武、王夫之等，顾炎武提出\"君子之为学，以明道也，以救世也\"。这一思潮推动了清代朴学的兴起，也影响了近代的实学传统。","w":"normal","e":["核心概念"]},{"t":"今文经学重名物训诂，古文经学重微言大义。","y":"名词解释","p":["今文：微言大义","古文：训诂考据"],"q":"错误。今文经学重微言大义、通经致用；古文经学重名物训诂、文字考据，二者颠倒。","w":"normal","e":["核心概念"]},{"t":"【原文】“喇嘛教”就是西藏地区流","y":"教材原文","p":["“喇嘛教”就是西藏地区流传的佛教，因此称为“藏传佛教”","“喇嘛”是藏语译音，意思是“上师”，是藏族人民对有地位、有学问的和尚的尊称","印度佛教很早就传入西藏，但因那时的西藏还没有文字，所以传播很慢，势力很小，当地所流行的宗教是带有原始性质的“苯教”","到7世纪，吐蕃赞普松赞干布由于受尼泊尔赤尊公主和唐朝文成公主的双重影响，开始信仰佛教，并创立文字，译经建寺，佛教逐渐发展起来，最终取得了统治地位，这前后大约经历了200余年"],"q":"“喇嘛教”就是西藏地区流传的佛教，因此称为“藏传佛教”。“喇嘛”是藏语译音，意思是“上师”，是藏族人民对有地位、有学问的和尚的尊称。印度佛教很早就传入西藏，但因那时的西藏还没有文字，所以传播很慢，势力很小，当地所流行的宗教是带有原始性质的“苯教”。到7世纪，吐蕃赞普松赞干布由于受尼泊尔赤尊公主和唐朝文成公主的双重影响，开始信仰佛教，并创立文字，译经建寺，佛教","w":"normal","e":["原书正文"]},{"t":"【原文】121277到 970年","y":"教材原文","p":["121277到 970年左右，佛教又在统治阶级上层人物的活动和努力下再度复兴起来","为了争取更多的信徒，这时的佛教较为注意吸收西藏地区的民族特点，特别在宗教仪式和神祇方面吸收了苯教的不少东西","由于修行方式、传承体系各不相同，到11 世纪中叶已形成四大宗派：宁玛派、噶当派、"],"q":"121277到 970年左右，佛教又在统治阶级上层人物的活动和努力下再度复兴起来。为了争取更多的信徒，这时的佛教较为注意吸收西藏地区的民族特点，特别在宗教仪式和神祇方面吸收了苯教的不少东西。由于修行方式、传承体系各不相同，到11 世纪中叶已形成四大宗派：宁玛派、噶当派、","w":"normal","e":["原书正文"]},{"t":"【原文】藏传佛教主要以印度传入的","y":"教材原文","p":["藏传佛教主要以印度传入的密教经典为主，吸收了苯教的某些仪式和神，形成了具有西藏特色的所谓“藏密”","各派都有严密的寺院组织和学经制度","后流传于青海、内蒙古地区以及蒙藏附近的国家"],"q":"藏传佛教主要以印度传入的密教经典为主，吸收了苯教的某些仪式和神，形成了具有西藏特色的所谓“藏密”。各派都有严密的寺院组织和学经制度。后流传于青海、内蒙古地区以及蒙藏附近的国家。","w":"normal","e":["原书正文"]},{"t":"【原文】宁玛派：在西藏地区出现较","y":"教材原文","p":["宁玛派：在西藏地区出现较早，初时并无名称","因为该派的教法是前弘期传下来的，经典也以前弘期所译的密教经典为主，到后弘期其他教派产生以后，因其古旧而称其为“宁玛派”","“宁玛”即藏语“古旧”之意","因该派僧人戴红帽子，又称“红教”"],"q":"宁玛派：在西藏地区出现较早，初时并无名称。因为该派的教法是前弘期传下来的，经典也以前弘期所译的密教经典为主，到后弘期其他教派产生以后，因其古旧而称其为“宁玛派”。“宁玛”即藏语“古旧”之意。因该派僧人戴红帽子，又称“红教”。经典传承分为三系，方式各不相同，其中有的以父子承袭或转世形式相传。","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)噶当派：“噶当”意为“佛语都是训诫”，该派主张用佛的教诲来指导凡人接受佛理","1056年逐渐形成一派","该派重视戒律，强调实修，注重宣扬因果报应、流转轮回和超脱生死","15 世纪格鲁派形成后并入格鲁派"],"q":"中国文化要略(第4版)中国文化要略(第4版)噶当派：“噶当”意为“佛语都是训诫”，该派主张用佛的教诲来指导凡人接受佛理。1056年逐渐形成一派。该派重视戒律，强调实修，注重宣扬因果报应、流转轮回和超脱生死。15 世纪格鲁派形成后并入格鲁派。","w":"normal","e":["原书正文"]},{"t":"【原文】噶当派：“噶当”意为“佛","y":"教材原文","p":["噶当派：“噶当”意为“佛语都是训诫”，该派主张用佛的教诲来指导凡人接受佛理","1056年逐渐形成一派","该派重视戒律，强调实修，注重宣扬因果报应、流转轮回和超脱生死","15 世纪格鲁派形成后并入格鲁派"],"q":"噶当派：“噶当”意为“佛语都是训诫”，该派主张用佛的教诲来指导凡人接受佛理。1056年逐渐形成一派。该派重视戒律，强调实修，注重宣扬因果报应、流转轮回和超脱生死。15 世纪格鲁派形成后并入格鲁派。","w":"normal","e":["原书正文"]},{"t":"【原文】121288噶举派：“噶","y":"教材原文","p":["121288噶举派：“噶举”意为“口授传承”，即金刚持佛亲口传授密咒教义","因该派僧人穿白色僧衣，又称“白教”","该派以苦行为特色，支派甚多","其中的噶玛噶举派在藏传佛教中最早采用“活佛转世”制度"],"q":"121288噶举派：“噶举”意为“口授传承”，即金刚持佛亲口传授密咒教义。因该派僧人穿白色僧衣，又称“白教”。该派以苦行为特色，支派甚多。其中的噶玛噶举派在藏传佛教中最早采用“活佛转世”制度。","w":"normal","e":["原书正文"]}]},{"id":"culture-c06-s03","t":"第三节 宋明理学","w":"high","n":10,"k":[{"t":"陆王心学","y":"名词解释","p":["陆九渊与王阳明为代表","心即是理","发明本心致良知","知行合一","与程朱理学相对立"],"q":"以南宋陆九渊和明代王阳明为代表的心学学派。主张“心即是理”“宇宙便是吾心”，认为天理内在于人心，不必外求；修养方法上主张“发明本心”“致良知”“知行合一”。心学与程朱理学相对立，在明代中后期盛行，对后世思想解放影响深远。","w":"high","e":["2024 真题"]},{"t":"致良知","y":"名词解释","p":["王阳明心学核心命题","良知为人心固有道德本体","致即推极扩充实行","天理内化为人心"],"q":"致良知是王阳明心学的核心命题。\"良知\"指人心固有的、不虑而知的道德本体，即天理；\"致\"即推极、扩充、实行。王阳明认为人人皆有良知，只要去除私欲遮蔽、将良知推致于事事物物，即可成圣。这一学说把天理内化为人心，强调知行合一与事上磨炼。","w":"normal","e":["核心概念"]},{"t":"格物致知","y":"名词解释","p":["出自《礼记·大学》","朱熹解为穷究事物之理","王阳明解为正心去欲","体现理学与心学分歧"],"q":"中国古代认识论命题，首见于《礼记·大学》“致知在格物”。朱熹解释为通过穷究事物之理以达到知识的扩充，即向外格求事物之理；王阳明则解释为“格者正也”，格物即正心去欲、致内心之良知。二者体现了理学与心学的根本分歧。","w":"normal","e":["核心概念"]},{"t":"知行合一","y":"名词解释","p":["王阳明提出","反对知先行后","知是行之始，行是知之成","强调道德认识落实于实践"],"q":"知行合一是王阳明提出的认识论与道德修养学说。他反对朱熹\"知先行后\"的观点，认为\"知是行之始，行是知之成\"，知而不行只是未知，二者本为一体、不可分离。这一命题强调道德认识必须落实为道德实践，是其心学体系的重要组成部分。","w":"normal","e":["核心概念"]},{"t":"【原文】历史上的灭佛事件主要有四","y":"教材原文","p":["历史上的灭佛事件主要有四次，叫“三武一宗之厄”，即北魏太武帝拓跋焘、北周武帝宇文邕、唐武宗李炎、周世宗柴荣四次灭佛","这四次灭佛的直接原因并不相同，但却是中外文化冲突的一种反映，也是三教对立、斗争的一种表现","魏太武帝灭佛的主要原因，是想表明自己“亲汉不亲胡”，表明北魏政权是继承了伏羲、神农和黄帝的正统，认为佛教是“历代之伪物”，“为世费害”，在司徒崔浩(代表儒家)、道士寇谦之(代表道教) 等人的鼓动下，于太平真君七年(446年)下诏灭佛，声称要“除伪定真，获羲农之治”，诏令各地将佛像经卷击坏焚毁，把所有和尚统统活埋","可是，他的太子是一个虔诚的佛教徒，在他下诏以前已暗通消息，让僧尼逃匿，佛像经卷也都密藏"],"q":"历史上的灭佛事件主要有四次，叫“三武一宗之厄”，即北魏太武帝拓跋焘、北周武帝宇文邕、唐武宗李炎、周世宗柴荣四次灭佛。这四次灭佛的直接原因并不相同，但却是中外文化冲突的一种反映，也是三教对立、斗争的一种表现。魏太武帝灭佛的主要原因，是想表明自己“亲汉不亲胡”，表明北魏政权是继承了伏羲、神农和黄帝的正统，认为佛教是“历代之伪物”，“为世费害”，在司徒崔浩(代表儒","w":"normal","e":["原书正文"]},{"t":"【原文】国家政权与佛教间的矛盾进","y":"教材原文","p":["国家政权与佛教间的矛盾进一步尖锐化","唐武宗和周世宗灭佛主要出于这个原因","唐会昌五年(845年)，武宗在废佛敕书里说：“洎于九州山原，两京城阙，僧徒日广，佛寺日崇","劳人力于土木之功，夺人利于金宝之饰，……且一夫不田，有受其饥者"],"q":"国家政权与佛教间的矛盾进一步尖锐化。唐武宗和周世宗灭佛主要出于这个原因。唐会昌五年(845年)，武宗在废佛敕书里说：“洎于九州山原，两京城阙，僧徒日广，佛寺日崇。劳人力于土木之功，夺人利于金宝之饰，……且一夫不田，有受其饥者；一妇不蚕，有受其寒者。今天下僧尼不可胜数，皆待农而食，待蚕而衣。”(《旧唐书卷一八·武宗本纪》) 只此一次，毁坏寺院4，600余所，还","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)134134(五) 佛教与中国文化佛教在中国的流传，影响了人们的思想，消耗了社会的财富，起了消极的作用，这是为历史所证明了的事实","但是也必须看到，佛教也有它相对积极的一面，它的流传深刻影响了中国文化","它的哲学思想和艺术形式与中国的传统文化相结合，形成了有别于印度佛教文化的中国佛教文化，进一步丰富了中国文化的内容和形式，这也是人所共知的历史事实","我们今天的任务，就是研究、总结和保护已有的佛教文化，尽力抑制它的消极作用，使它的存在能最大限度地跟社会主义物质文明和精神文明的建设相协调"],"q":"中国文化要略(第4版)中国文化要略(第4版)134134(五) 佛教与中国文化佛教在中国的流传，影响了人们的思想，消耗了社会的财富，起了消极的作用，这是为历史所证明了的事实。但是也必须看到，佛教也有它相对积极的一面，它的流传深刻影响了中国文化。它的哲学思想和艺术形式与中国的传统文化相结合，形成了有别于印度佛教文化的中国佛教文化，进一步丰富了中国文化的内容和形","w":"normal","e":["原书正文"]},{"t":"【原文】1.佛教与中国哲学史","y":"教材原文","p":["1.佛教与中国哲学史","中国哲学史从它产生以后就是唯物主义和唯心主义、无神论和有神论相互斗争的历史","但从佛教传入中国之后，这两种认识"],"q":"1.佛教与中国哲学史。中国哲学史从它产生以后就是唯物主义和唯心主义、无神论和有神论相互斗争的历史。但从佛教传入中国之后，这两种认识","w":"normal","e":["原书正文"]},{"t":"【原文】论和思想体系的斗争就形成","y":"教材原文","p":["论和思想体系的斗争就形成了错综复杂的局面","佛教哲学的基本点是否认客观现实世界的存在而设想出一个与现实世界相对立的“西方极乐世界”","佛教各派都从不同角度、用不同证据来论证客观世界的虚幻性，同时又千方百计地论证主观精神世界的绝对性，因此佛教哲学属于唯心主义的思想体系","只不过禅宗所主张的“佛向性中作，莫向身外求”，是进一步否定了佛教所设想的“西方极乐世界”，只承认主观精神世界的绝对存在罢了"],"q":"论和思想体系的斗争就形成了错综复杂的局面。佛教哲学的基本点是否认客观现实世界的存在而设想出一个与现实世界相对立的“西方极乐世界”。佛教各派都从不同角度、用不同证据来论证客观世界的虚幻性，同时又千方百计地论证主观精神世界的绝对性，因此佛教哲学属于唯心主义的思想体系。只不过禅宗所主张的“佛向性中作，莫向身外求”，是进一步否定了佛教所设想的“西方极乐世界”，只承认","w":"normal","e":["原书正文"]},{"t":"【原文】2.佛教与中国文学","y":"教材原文","p":["2.佛教与中国文学","佛教对中国文学的影响是显而易见的","以题材而论，历代描写佛教的诗文不计其数","从全唐诗来看，共收唐诗约五万首，其中与佛教有关的诗占了近十分之一"],"q":"2.佛教与中国文学。佛教对中国文学的影响是显而易见的。以题材而论，历代描写佛教的诗文不计其数。从全唐诗来看，共收唐诗约五万首，其中与佛教有关的诗占了近十分之一。首先，这些诗赞美佛寺风光，歌颂僧俗友谊，有不少写得相当精彩和生动。唐宋以来，名僧的社会地位很高，文人纷纷为他们树碑立传，留下许多渗透佛理的散文。其次，以艺术风格而论，由于佛教追求自我解脱，主张离尘出世","w":"normal","e":["原书正文"]}]},{"id":"culture-c06-s04","t":"第四节 清代朴学","w":"normal","n":6,"k":[{"t":"【原文】6.两大木佛，一般取站立","y":"教材原文","p":["6.两大木佛，一般取站立姿势","一是河北省承德市普宁寺大佛，高22.23米，是一尊千眼千手观音像，用松、柏、榆、杉、椴五种木材雕成，是我国最大的一尊木雕佛像","二是北京市雍和宫大佛，高 18米 (地下还有8米)，为弥勒佛站像，用整块白檀香木雕成","该佛由七世达赖从尼泊尔购来木料，经三年时间运到北京，乾隆皇帝花八万两白银雕成"],"q":"6.两大木佛，一般取站立姿势。一是河北省承德市普宁寺大佛，高22.23米，是一尊千眼千手观音像，用松、柏、榆、杉、椴五种木材雕成，是我国最大的一尊木雕佛像。二是北京市雍和宫大佛，高 18米 (地下还有8米)，为弥勒佛站像，用整块白檀香木雕成。该佛由七世达赖从尼泊尔购来木料，经三年时间运到北京，乾隆皇帝花八万两白银雕成。","w":"normal","e":["原书正文"]},{"t":"【原文】7.两大铜佛，一是西藏日","y":"教材原文","p":["7.两大铜佛，一是西藏日喀则市扎什伦布寺未来佛，全高26.2米，座高3.8米, 净高22.4米, 肩头宽阔, 可放一辆解放牌汽车, 1914年到 1916年铸造，耗铜23万斤，是我国最大的一尊铜佛","二是河北正定县隆兴寺铜菩萨像，为千眼千手观音菩萨，全高22米，底座为石造，高2米，宋开宝四年 (971年) 铸造，是现存最大的铜铸大佛之一","“沧州狮子景州塔，正定城里的铜菩萨”，该佛像为河北三大古迹之一，可见其珍贵"],"q":"7.两大铜佛，一是西藏日喀则市扎什伦布寺未来佛，全高26.2米，座高3.8米, 净高22.4米, 肩头宽阔, 可放一辆解放牌汽车, 1914年到 1916年铸造，耗铜23万斤，是我国最大的一尊铜佛。二是河北正定县隆兴寺铜菩萨像，为千眼千手观音菩萨，全高22米，底座为石造，高2米，宋开宝四年 (971年) 铸造，是现存最大的铜铸大佛之一。“沧州狮子景州塔，正定","w":"normal","e":["原书正文"]},{"t":"【原文】8.一部金版《大藏经》","y":"教材原文","p":["8.一部金版《大藏经》","所谓《大藏经》，是以佛教经典为主，也包括了印度、中国等佛教著述在内的大型丛书","它是佛教发展的成果，也是佛教思想和佛教史的集中体现，因而是佛教文化的代表之一","我国从宋开宝四年开始刻印《大藏经》，因最早在四川成都刻成，因此又叫蜀版《大藏经》，后来传入日本和朝鲜，以后陆续翻刻，出现了藏文、蒙文、日文、西夏文《大藏经》"],"q":"8.一部金版《大藏经》。所谓《大藏经》，是以佛教经典为主，也包括了印度、中国等佛教著述在内的大型丛书。它是佛教发展的成果，也是佛教思想和佛教史的集中体现，因而是佛教文化的代表之一。我国从宋开宝四年开始刻印《大藏经》，因最早在四川成都刻成，因此又叫蜀版《大藏经》，后来传入日本和朝鲜，以后陆续翻刻，出现了藏文、蒙文、日文、西夏文《大藏经》。但现存最早、最完整的版","w":"normal","e":["原书正文"]},{"t":"【原文】9.一处石经山","y":"教材原文","p":["这又是一处国宝，在北京市房山区云居寺，以石刻佛经闻名于世，故名“石经山”","据史书记载，石刻佛经始于隋代静琬和尚"],"q":"9.一处石经山。这又是一处国宝，在北京市房山区云居寺，以石刻佛经闻名于世，故名“石经山”。据史书记载，石刻佛经始于隋代静琬和尚。静","w":"normal","e":["原书正文"]},{"t":"【原文】10.一枚佛指灵骨","y":"教材原文","p":["10.一枚佛指灵骨","1987年5月发现于陕西省扶风县法门寺塔基地宫内，这是迄今世界佛教史上最重要的发现之一","所谓佛指灵骨，是指释迦牟尼的真身遗骨","据佛教传说，释迦牟尼死后，笃信佛教的阿育王把佛的遗骨分为84,000块, 葬于世界各地84,000 处, 因而建佛塔84,000座"],"q":"10.一枚佛指灵骨。1987年5月发现于陕西省扶风县法门寺塔基地宫内，这是迄今世界佛教史上最重要的发现之一。所谓佛指灵骨，是指释迦牟尼的真身遗骨。据佛教传说，释迦牟尼死后，笃信佛教的阿育王把佛的遗骨分为84,000块, 葬于世界各地84,000 处, 因而建佛塔84,000座。据说法门寺塔内即葬佛指一节。唐代帝王曾多次从寺内迎佛骨进宫内供奉，韩愈为此向唐宪宗","w":"normal","e":["原书正文"]},{"t":"【原文】道教是在中国本土上产生的","y":"教材原文","p":["道教是在中国本土上产生的宗教","它正式形成的时间晚于佛教，但它的渊源却很早","大体说来，有以下几个方面：一是原始宗教和巫术","在远古社会，人们对自然万物的变化和人的生老病死等现象不能理解，认为有一"],"q":"道教是在中国本土上产生的宗教。它正式形成的时间晚于佛教，但它的渊源却很早。大体说来，有以下几个方面：一是原始宗教和巫术。在远古社会，人们对自然万物的变化和人的生老病死等现象不能理解，认为有一","w":"normal","e":["原书正文"]}]},{"id":"culture-c06-s05","t":"综合考点","w":"normal","n":10,"k":[{"t":"鹅湖之会","y":"名词解释","p":["南宋淳熙二年吕祖谦邀约","朱熹与陆九渊论学","朱主泛观博览，陆主发明本心","理学与心学分野的公开化"],"q":"鹅湖之会是南宋淳熙二年（1175年）由吕祖谦邀约、在江西铅山鹅湖寺举行的一次学术辩论，朱陆两派就为学方法展开论争。朱熹主张\"泛观博览而后归之约\"，陆九渊主张\"先发明本心\"、讥朱学为\"支离\"，朱熹则批评陆学\"太简\"。此次辩论是理学与心学分歧的公开化，在中国学术史上影响深远。","w":"normal","e":["核心概念"]},{"t":"浙东学派","y":"名词解释","p":["南宋至清初浙江东部学派","重史学与经世之学","陈亮永康、叶适永嘉主事功","清代黄宗羲、全祖望承其绪"],"q":"浙东学派是南宋至清初活跃于浙江东部的学术流派，以史学与经世之学见长。南宋时以吕祖谦的金华学派、陈亮的永康学派、叶适的永嘉学派为代表，主张事功之学，反对空谈心性；清代以黄宗羲、万斯大、全祖望等为代表，重史学与文献考订。该派强调学术的实用价值，是经世致用传统的重要源头。","w":"normal","e":["核心概念"]},{"t":"泰州学派","y":"名词解释","p":["明代王门后学，王艮创立","百姓日用即道","尊身立本，平民色彩","李贽等后学趋于激进"],"q":"泰州学派是明代王门后学中以王艮为代表的学派，因王艮为泰州人而得名。该派主张\"百姓日用即道\"，认为圣人之道就在日常洒扫应对之中，强调\"尊身立本\"，具有鲜明的平民色彩与思想解放倾向。其後学颜钧、何心隐、李贽更为激进，被正统理学家视为\"异端\"。","w":"normal","e":["核心概念"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)唐宋时期是道教进一步兴盛和发展的阶段，道教理论不断深化，道教制度不断完善","封建统治者大都采取崇教政策，利用道教来巩固他们的统治","唐高宗封老子为李姓祖先，追封老子为“太上玄元皇帝”，令各州建观一所供奉","唐玄宗时又命令各家藏《老子》一本，规定《老子》为真经，其他道家著作如《庄子》等也被列为道教经典"],"q":"中国文化要略(第4版)中国文化要略(第4版)唐宋时期是道教进一步兴盛和发展的阶段，道教理论不断深化，道教制度不断完善。封建统治者大都采取崇教政策，利用道教来巩固他们的统治。唐高宗封老子为李姓祖先，追封老子为“太上玄元皇帝”，令各州建观一所供奉。唐玄宗时又命令各家藏《老子》一本，规定《老子》为真经，其他道家著作如《庄子》等也被列为道教经典。道书的研究和写作日益","w":"normal","e":["原书正文"]},{"t":"【原文】唐宋时期是道教进一步兴盛","y":"教材原文","p":["唐宋时期是道教进一步兴盛和发展的阶段，道教理论不断深化，道教制度不断完善","封建统治者大都采取崇教政策，利用道教来巩固他们的统治","唐高宗封老子为李姓祖先，追封老子为“太上玄元皇帝”，令各州建观一所供奉","唐玄宗时又命令各家藏《老子》一本，规定《老子》为真经，其他道家著作如《庄子》等也被列为道教经典"],"q":"唐宋时期是道教进一步兴盛和发展的阶段，道教理论不断深化，道教制度不断完善。封建统治者大都采取崇教政策，利用道教来巩固他们的统治。唐高宗封老子为李姓祖先，追封老子为“太上玄元皇帝”，令各州建观一所供奉。唐玄宗时又命令各家藏《老子》一本，规定《老子》为真经，其他道家著作如《庄子》等也被列为道教经典。道书的研究和写作日益成风，就刺激了道教理论的发展。到了宋代，由国","w":"normal","e":["原书正文"]},{"t":"【原文】146146大凡一种宗教","y":"教材原文","p":["146146大凡一种宗教，都要分成许多宗派","因其产生的渊源不同，道教内部早分为两大派：丹鼎派和符箓派","“丹鼎派”由方术发展而来，以炼丹取药、祈求长生成仙为其特点","“符箓派”由巫术发展而来，以鬼神崇拜、画符念咒、驱鬼降妖、祈福禳灾为其特点"],"q":"146146大凡一种宗教，都要分成许多宗派。道教也不例外。因其产生的渊源不同，道教内部早分为两大派：丹鼎派和符箓派。“丹鼎派”由方术发展而来，以炼丹取药、祈求长生成仙为其特点。“符箓派”由巫术发展而来，以鬼神崇拜、画符念咒、驱鬼降妖、祈福禳灾为其特点。但这两派不过是就其宗教活动形式不同而做的一种区分，各自并无严密的组织系统。粗略讲来，远在南北朝时，道教已形成","w":"normal","e":["原书正文"]},{"t":"【原文】一并流行。“楼观派”以起","y":"教材原文","p":["“楼观派”以起于楼观台(在今陕西省周至县) 而得名，相传创于三国，盛于北魏，经历代流传，到元代并入全真道","这一派内外丹兼修，又以符召神驱鬼，为人治病","为了与佛教对抗，该派极力主张“老子化胡”说，认为老子出关教化胡人才形成佛教","“茅山派”因以茅山(在今江苏省句容市) 为其修炼地而得名，主要以符咒降神驱鬼，也兼修炼丹术和导引术，到元代归入正一道"],"q":"一并流行。“楼观派”以起于楼观台(在今陕西省周至县) 而得名，相传创于三国，盛于北魏，经历代流传，到元代并入全真道。这一派内外丹兼修，又以符召神驱鬼，为人治病。为了与佛教对抗，该派极力主张“老子化胡”说，认为老子出关教化胡人才形成佛教。“茅山派”因以茅山(在今江苏省句容市) 为其修炼地而得名，主要以符咒降神驱鬼，也兼修炼丹术和导引术，到元代归入正一道。“上清","w":"normal","e":["原书正文"]},{"t":"【原文】正一道，是以天师道为主，","y":"教材原文","p":["正一道，是以天师道为主，融合上清、灵宝、茅山等派形成的一大教派，保留了符箓派的许多特点","该派以江西的龙虎山为传道基地，历代天师均为张陵后裔，唐宋以来，受到皇室尊崇","元大德八年(1304年) 第三十八代天师张与材受封为“正一教主”，主领“三山(龙虎山、阁皂山、茅山) 符”","这一派道士可以结婚，天师世袭，明代很盛"],"q":"正一道，是以天师道为主，融合上清、灵宝、茅山等派形成的一大教派，保留了符箓派的许多特点。该派以江西的龙虎山为传道基地，历代天师均为张陵后裔，唐宋以来，受到皇室尊崇。元大德八年(1304年) 第三十八代天师张与材受封为“正一教主”，主领“三山(龙虎山、阁皂山、茅山) 符”。这一派道士可以结婚，天师世袭，明代很盛。","w":"normal","e":["原书正文"]},{"t":"【原文】宗教信仰宗教信仰1471","y":"教材原文","p":["宗教信仰宗教信仰147147全真道创于金代，其创始人为王重阳，号“重阳子”，本为金熙宗时的武举，因郁郁不得志，遁入空门，弃家修道，在终南山自筑坟墓居住，称“活死人墓”","他自称遇神人教授修炼秘诀和仙术，往山东地区传道，收马钰和孙不二夫妇以及谭处端、刘处玄、王处一、丘处机、郝大通等七人为徒，世称“七真”","这一派主张儒、道、佛三教合一，不重符，也不烧炼，专重养生修性，但道士必须出家","至元代丘处机掌管全国道教，全真道获得巨大发展"],"q":"宗教信仰宗教信仰147147全真道创于金代，其创始人为王重阳，号“重阳子”，本为金熙宗时的武举，因郁郁不得志，遁入空门，弃家修道，在终南山自筑坟墓居住，称“活死人墓”。他自称遇神人教授修炼秘诀和仙术，往山东地区传道，收马钰和孙不二夫妇以及谭处端、刘处玄、王处一、丘处机、郝大通等七人为徒，世称“七真”。这一派主张儒、道、佛三教合一，不重符，也不烧炼，专重养生修","w":"normal","e":["原书正文"]},{"t":"【原文】(三) 道教文化和道教胜","y":"教材原文","p":["(三) 道教文化和道教胜迹道教信仰主要来源于道家思想和古代神话，在发展过程中又吸收了儒家思想和佛教精神，构成独具特色的道教文化，对中国古代文化的发展产生了巨大影响","第一是道教的某些活动包含了一定的科学精神，因而对某些科学技术的发展做出了某种贡献","如炼丹，实开中国冶炼工业和化学工业的先河，火药的发明与利用即与此有关","采药治病，促进了中国医药的发展"],"q":"(三) 道教文化和道教胜迹道教信仰主要来源于道家思想和古代神话，在发展过程中又吸收了儒家思想和佛教精神，构成独具特色的道教文化，对中国古代文化的发展产生了巨大影响。第一是道教的某些活动包含了一定的科学精神，因而对某些科学技术的发展做出了某种贡献。如炼丹，实开中国冶炼工业和化学工业的先河，火药的发明与利用即与此有关；采药治病，促进了中国医药的发展。第二是道教的","w":"normal","e":["原书正文"]}]}]},{"id":"culture-c07","t":"第七章 宗教信仰","w":"high","s":[{"id":"culture-c07-s01","t":"第一节 三大崇拜与原始宗教","w":"high","n":9,"k":[{"t":"三大崇拜","y":"名词解释","p":["天地崇拜：自然崇拜的集中体现","祖先崇拜：宗法制度的信仰基础","君师崇拜：天地君亲师的伦理秩序"],"q":"中国古代的三大崇拜指天地崇拜、祖先崇拜、君师崇拜。天地崇拜源于农业社会对自然力量的依赖；祖先崇拜以血缘为纽带，是宗法制度的信仰基础；君师崇拜则把君主与师圣并列，体现\"天地君亲师\"的伦理秩序。","w":"high","e":["2016 真题"]},{"t":"【原文】伊斯兰教的基本信仰是“六","y":"教材原文","p":["伊斯兰教的基本信仰是“六大信仰”，也简称“六信”：(1) 信仰安拉是唯一的神，“除安拉外，再无神灵”","伊斯兰教认为，安拉是创造宇宙万物、主宰万物、无所不在、唯一永恒的神","波斯语称其为“胡达”，中国穆斯林称“真主”","(2) 信仰穆罕默德是安拉的使者"],"q":"伊斯兰教的基本信仰是“六大信仰”，也简称“六信”：(1) 信仰安拉是唯一的神，“除安拉外，再无神灵”。伊斯兰教认为，安拉是创造宇宙万物、主宰万物、无所不在、唯一永恒的神。波斯语称其为“胡达”，中国穆斯林称“真主”。(2) 信仰穆罕默德是安拉的使者。伊斯兰教宣称，安拉曾在不同时期向不同地区派遣过许多使者，他们都是安拉选来治世安民、拯救世人的“先知”，穆罕默德则","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略中国文化要略","y":"教材原文","p":["中国文化要略中国文化要略(第4版(第4版151522为了坚定教徒的基本信仰，伊斯兰教规定教徒必须做“五功”：(1) 念功","教徒必须经常念经祈祷，公开朗读《古兰经》中关于安拉是唯一的神、穆罕默德是安拉的使者等条文","(2)拜(礼)功","每天礼拜五次，分别叫作“晨礼”(日出以前)、“晌礼”(午后)、“晡礼”(午后四时)、“昏礼”(日落以前)、“宵礼”(晚上)"],"q":"中国文化要略中国文化要略(第4版(第4版151522为了坚定教徒的基本信仰，伊斯兰教规定教徒必须做“五功”：(1) 念功。教徒必须经常念经祈祷，公开朗读《古兰经》中关于安拉是唯一的神、穆罕默德是安拉的使者等条文。(2)拜(礼)功。每天礼拜五次，分别叫作“晨礼”(日出以前)、“晌礼”(午后)、“晡礼”(午后四时)、“昏礼”(日落以前)、“宵礼”(晚上)。每星期","w":"normal","e":["原书正文"]},{"t":"【原文】(二) 伊斯兰教的宗派斗","y":"教材原文","p":["(二) 伊斯兰教的宗派斗争(二) 伊斯兰教的宗派斗争第七章第七章穆罕默德死后，伊斯兰教的统治集团不断运用军事和商业手段向外传播伊斯兰教","在不到三十年的时间里，伊斯兰教的势力已到达亚非两洲和西南欧地区","后来又随着倭马亚王朝、阿巴斯王朝和奥斯曼帝国的对外扩张，传播到更为广大的地区","在它的传播和发展过程中，围绕最高权力的继承问题，统治集团内部展开了不断的争权夺利的斗争，形成了不同的政治派别进而发展为宗教派别"],"q":"(二) 伊斯兰教的宗派斗争(二) 伊斯兰教的宗派斗争第七章第七章穆罕默德死后，伊斯兰教的统治集团不断运用军事和商业手段向外传播伊斯兰教。在不到三十年的时间里，伊斯兰教的势力已到达亚非两洲和西南欧地区。后来又随着倭马亚王朝、阿巴斯王朝和奥斯曼帝国的对外扩张，传播到更为广大的地区。在它的传播和发展过程中，围绕最高权力的继承问题，统治集团内部展开了不断的争权夺利的","w":"normal","e":["原书正文"]},{"t":"【原文】穆罕默德死后，伊斯兰教的","y":"教材原文","p":["穆罕默德死后，伊斯兰教的统治集团不断运用军事和商业手段向外传播伊斯兰教","在不到三十年的时间里，伊斯兰教的势力已到达亚非两洲和西南欧地区","后来又随着倭马亚王朝、阿巴斯王朝和奥斯曼帝国的对外扩张，传播到更为广大的地区","在它的传播和发展过程中，围绕最高权力的继承问题，统治集团内部展开了不断的争权夺利的斗争，形成了不同的政治派别进而发展为宗教派别"],"q":"穆罕默德死后，伊斯兰教的统治集团不断运用军事和商业手段向外传播伊斯兰教。在不到三十年的时间里，伊斯兰教的势力已到达亚非两洲和西南欧地区。后来又随着倭马亚王朝、阿巴斯王朝和奥斯曼帝国的对外扩张，传播到更为广大的地区。在它的传播和发展过程中，围绕最高权力的继承问题，统治集团内部展开了不断的争权夺利的斗争，形成了不同的政治派别进而发展为宗教派别。由于伊斯兰教实行政","w":"normal","e":["原书正文"]},{"t":"【原文】推崇阿里为永不犯错的“超","y":"教材原文","p":["推崇阿里为永不犯错的“超人”，这就是什叶派","在伊斯兰教的历史上，逊尼派和什叶派一直对立和斗争，但什叶派的势力一直没有逊尼派的势力大，而且被当作伊斯兰教的“异端”教派，受到逊尼派的镇压和打击，其内部也因主张各异而形成不同的派系","它主要在也门、伊朗、伊拉克、叙利亚、阿富汗和巴基斯坦等国流传","在中国，伊斯兰教有新老两派之分，两派并无多大差别，都遵循伊斯兰教教规，重视伊斯兰教的习俗，只是新派强调革新，主张“中阿并重”的经堂教育"],"q":"推崇阿里为永不犯错的“超人”，这就是什叶派。在伊斯兰教的历史上，逊尼派和什叶派一直对立和斗争，但什叶派的势力一直没有逊尼派的势力大，而且被当作伊斯兰教的“异端”教派，受到逊尼派的镇压和打击，其内部也因主张各异而形成不同的派系。它主要在也门、伊朗、伊拉克、叙利亚、阿富汗和巴基斯坦等国流传。在中国，伊斯兰教有新老两派之分，两派并无多大差别，都遵循伊斯兰教教规，重","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)(三) 伊斯兰教在中国的传播(三) 伊斯兰教在中国的传播伊斯兰教传入中国，大约是在唐代，但年代说法不一","有说在唐高宗永徽二年(651年)，穆罕默德的第三任哈里发奥斯曼派遣使者到长安来觐见中国皇帝，介绍了阿拉伯帝国的情况和伊斯兰教的教义","一般学者把这一事件作为伊斯兰教传入中国的时间","有说早在唐太宗时，即有穆罕默德的门徒四人来华传教，一个在广州，一个在扬州，两个在泉州"],"q":"中国文化要略(第4版)中国文化要略(第4版)(三) 伊斯兰教在中国的传播(三) 伊斯兰教在中国的传播伊斯兰教传入中国，大约是在唐代，但年代说法不一。有说在唐高宗永徽二年(651年)，穆罕默德的第三任哈里发奥斯曼派遣使者到长安来觐见中国皇帝，介绍了阿拉伯帝国的情况和伊斯兰教的教义。一般学者把这一事件作为伊斯兰教传入中国的时间；有说早在唐太宗时，即有穆罕默德的门","w":"normal","e":["原书正文"]},{"t":"【原文】伊斯兰教传入中国，大约是","y":"教材原文","p":["伊斯兰教传入中国，大约是在唐代，但年代说法不一","有说在唐高宗永徽二年(651年)，穆罕默德的第三任哈里发奥斯曼派遣使者到长安来觐见中国皇帝，介绍了阿拉伯帝国的情况和伊斯兰教的教义","一般学者把这一事件作为伊斯兰教传入中国的时间","有说早在唐太宗时，即有穆罕默德的门徒四人来华传教，一个在广州，一个在扬州，两个在泉州"],"q":"伊斯兰教传入中国，大约是在唐代，但年代说法不一。有说在唐高宗永徽二年(651年)，穆罕默德的第三任哈里发奥斯曼派遣使者到长安来觐见中国皇帝，介绍了阿拉伯帝国的情况和伊斯兰教的教义。一般学者把这一事件作为伊斯兰教传入中国的时间；有说早在唐太宗时，即有穆罕默德的门徒四人来华传教，一个在广州，一个在扬州，两个在泉州； 有说在唐肃宗至德二年(757年)，在平定“安史","w":"normal","e":["原书正文"]},{"t":"【原文】154154唐宋时期，来","y":"教材原文","p":["154154唐宋时期，来华的阿拉伯商人逐渐增多，他们在东西方贸易和文化交流中起了重要的桥梁作用","其中不少人就侨居在中国的京城和沿海城市","由于信仰伊斯兰教，需要经常做礼拜，就比较集中地住在一处，形成所谓的“番坊”，并于坊中建清真寺，于附近建公共墓地","这些人在华久居，其后裔就成了中国的穆斯林"],"q":"154154唐宋时期，来华的阿拉伯商人逐渐增多，他们在东西方贸易和文化交流中起了重要的桥梁作用。其中不少人就侨居在中国的京城和沿海城市。由于信仰伊斯兰教，需要经常做礼拜，就比较集中地住在一处，形成所谓的“番坊”，并于坊中建清真寺，于附近建公共墓地。这些人在华久居，其后裔就成了中国的穆斯林。到 13 世纪，成吉思汗领兵西征，西域地区信仰伊斯兰教的群众和一部分伊","w":"normal","e":["原书正文"]}]},{"id":"culture-c07-s02","t":"第二节 佛教","w":"high","n":16,"k":[{"t":"禅宗","y":"名词解释","p":["达摩传入、慧能大兴","不立文字直指人心见性成佛","主张顿悟、自性即佛","《坛经》为唯一中国僧人所撰之\"经\""],"q":"中国佛教影响最大的宗派之一，相传由菩提达摩于南朝梁时传入，至唐代慧能而大兴。禅宗主张\"不立文字，直指人心，见性成佛\"，提倡顿悟，强调佛性本具、自性是佛。慧能被尊为禅宗六祖，其《坛经》是唯一一部由中国僧人撰写而被称为\"经\"的佛典。","w":"high","e":["2019 真题"]},{"t":"试论佛教对中国文化的影响","y":"名词解释","p":["影响宋明理学的思辨哲学","佛经翻译与石窟艺术","大量佛教词语进入汉语","腊八盂兰盆等民俗","慈悲报应的伦理观念","促进中外文化交流"],"q":"①哲学思想：佛教的缘起性空、心性论深刻影响宋明理学，程朱理学与陆王心学均吸收佛学思辨；②文学艺术：佛经翻译推动汉语词汇与音韵学发展，变文、俗讲促进通俗文学，石窟造像（敦煌、云冈、龙门）与佛塔建筑成为艺术瑰宝；③语言词汇：世界、刹那、因果、觉悟等大量佛教词语进入汉语；④社会风俗：腊八节、盂兰盆节、放生","w":"high","e":["2023 真题"]},{"t":"玄奘","y":"名词解释","p":["唐代高僧、法相宗创始人","西行求法十七年","译经七十五部一千三百余卷","口述《大唐西域记》"],"q":"玄奘是唐代著名高僧、法相宗创始人、四大译经家之一。贞观三年（629年）西行求法，历十七年、游历百余国，于那烂陀寺从戒贤学瑜伽行派，贞观十九年携梵本六百五十七部归国。后在长安译经十九年，译出《大般若经》《瑜伽师地论》等七十五部、一千三百三十五卷，并口述《大唐西域记》，为中外文化交流作出卓越贡献。","w":"normal","e":["核心概念"]},{"t":"鉴真","y":"名词解释","p":["唐代高僧、律宗传人","六次东渡，双目失明","754年抵日，传戒授律","创建唐招提寺，日本律宗初祖"],"q":"鉴真是唐代高僧、律宗南山宗传人。应日本僧人荣叡、普照之请，自天宝元年（742年）起六次东渡，历经五次失败、双目失明，终于天宝十二载（753年）抵达日本。他在奈良东大寺设坛传戒，创建唐招提寺，被尊为\"日本律宗初祖\"，并将建筑、雕塑、医药、书法等中国文化传入日本。","w":"normal","e":["核心概念"]},{"t":"净土宗","y":"名词解释","p":["东晋慧远为初祖","唐代善导实际创立","称名念佛往生净土","民间流传极广"],"q":"中国佛教宗派之一，以东晋慧远为初祖，实际创立者为唐代善导。主张称念“南无阿弥陀佛”名号，依靠阿弥陀佛的愿力往生西方极乐净土。因修行方法简单易行，在民间流传极广，有“家家阿弥陀，户户观世音”之说。","w":"normal","e":["核心概念"]},{"t":"天台宗","y":"名词解释","p":["隋代智顗创立于天台山","以《法华经》为经典","一念三千三谛圆融","止观双修","中国佛教最早宗派"],"q":"中国佛教最早创立的宗派，隋代智顗（智者大师）创立于浙江天台山。以《法华经》为主要经典，故又称法华宗。主张“一念三千”“三谛圆融”，止观双修。天台宗是中国佛教宗派化的开端。","w":"normal","e":["核心概念"]},{"t":"华严宗","y":"名词解释","p":["唐代法藏创立","以《华严经》为经典","法界缘起事事无碍","理论思辨性强"],"q":"中国佛教宗派之一，唐代法藏（贤首大师）创立，以《华严经》为主要经典。主张“法界缘起”“事事无碍”，认为一切事物相互圆融、重重无尽。华严宗理论思辨性极强，对宋明理学影响深远。","w":"normal","e":["核心概念"]},{"t":"法相宗","y":"名词解释","p":["玄奘与窥基创立","又称唯识宗慈恩宗","万法唯识三界唯心","理论繁琐流传不广"],"q":"中国佛教宗派之一，唐代玄奘及其弟子窥基创立，又称唯识宗、慈恩宗。以《成唯识论》为主要经典，主张“万法唯识”“三界唯心”，认为一切现象皆由阿赖耶识变现。因理论繁琐、修行阶次严密，仅在士大夫中流传，未久即衰。","w":"normal","e":["核心概念"]},{"t":"三武一宗","y":"名词解释","p":["北魏太武帝北周武帝唐武宗后周世宗","四次大规模灭佛","寺院经济膨胀影响赋役","促使佛教中国化世俗化"],"q":"指中国历史上四次大规模的灭佛事件：北魏太武帝、北周武帝、唐武宗、后周世宗四位帝王下令毁佛。因佛教寺院经济膨胀、僧尼众多影响国家赋役与财政，故遭打击。这四次法难使佛教遭受重创，也促使佛教加速中国化与世俗化。","w":"normal","e":["核心概念"]},{"t":"三武一宗灭佛","y":"名词解释","p":["北魏太武、北周武帝、唐武宗、后周世宗","寺院经济膨胀与财政冲突","使佛教遭受沉重打击","促使佛教本土化，禅净二宗大兴"],"q":"三武一宗灭佛指中国佛教史上四次由朝廷发动的毁佛事件，即北魏太武帝、北周武帝、唐武宗和后周世宗的灭佛。其原因是寺院经济膨胀、僧尼不事生产、与皇权财政及儒家伦理冲突。这四次法难使佛教遭受沉重打击，也促使佛教加速本土化，禅宗与净土宗因其不依赖寺院经济而得以大兴。","w":"normal","e":["核心概念"]},{"t":"试述藏传佛教的主要派别及活佛转世制度","y":"名词解释","p":["宁玛派红教：最早、莲花生","萨迦派花教：八思巴与元代政教","噶举派白教：口传密法","格鲁派黄教：宗喀巴创立、达赖班禅系统","活佛转世始于噶玛拔希","金瓶掣签与中央认定权"],"q":"藏传佛教是佛教传入西藏后与当地苯教融合形成的佛教支派，俗称喇嘛教。主要派别：宁玛派（红教），为最早形成的派别，重密宗旧译，尊莲花生为祖师；萨迦派（花教），因寺院墙上涂红白灰三色得名，元代八思巴受忽必烈尊为国师，一度掌西藏政教大权；噶举派（白教），重口传密法，支系众多；格鲁派（黄教），明初宗喀巴创立，","w":"normal","e":["核心概念"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)161600(三) 基督教在中国的传播(三) 基督教在中国的传播基督教传入我国是很早的，时间在唐贞观九年(635年)","据保存在西安碑林的《大秦景教流行中国碑颂》记载，基督教的一支———景教，经由陆路从波斯传入我国，而后在唐政府的允许下开始传教，并且曾经“法流十道，寺满百城”，一度很兴盛","但在会昌五年 (845年)唐武宗灭佛时，一道被禁绝","此后，一直到13 世纪，成吉思汗及其继承者们连续西征，沟通了东西交通，使景教在中国复活，也引进了罗马天主教，通称为“也里可温教”，朝廷设崇福司掌管，教徒主要是蒙古人和色目人"],"q":"中国文化要略(第4版)中国文化要略(第4版)161600(三) 基督教在中国的传播(三) 基督教在中国的传播基督教传入我国是很早的，时间在唐贞观九年(635年)。据保存在西安碑林的《大秦景教流行中国碑颂》记载，基督教的一支———景教，经由陆路从波斯传入我国，而后在唐政府的允许下开始传教，并且曾经“法流十道，寺满百城”，一度很兴盛。但在会昌五年 (845年)唐","w":"normal","e":["原书正文"]},{"t":"【原文】新教传入我国是在鸦片战争","y":"教材原文","p":["新教传入我国是在鸦片战争时期，始于英国东印度公司秘书马礼逊来中国","1823年，马礼逊出版了汉文的《神天圣书》(即《新旧约全书》)","而后，随着西方侵略势力在中国的扩大，新教也获得迅速传播，其影响较大的宗派有路德宗、长老会、圣公会、公理会等"],"q":"新教传入我国是在鸦片战争时期，始于英国东印度公司秘书马礼逊来中国。1823年，马礼逊出版了汉文的《神天圣书》(即《新旧约全书》)。而后，随着西方侵略势力在中国的扩大，新教也获得迅速传播，其影响较大的宗派有路德宗、长老会、圣公会、公理会等。","w":"normal","e":["原书正文"]},{"t":"【原文】2.印度佛教如何演变为中","y":"教材原文","p":["2.印度佛教如何演变为中国佛教? 标志性的现象是什么?"],"q":"2.印度佛教如何演变为中国佛教? 标志性的现象是什么?","w":"normal","e":["原书正文"]},{"t":"【原文】4.藏传佛教有哪些派系?","y":"教材原文","p":["4.藏传佛教有哪些派系? 达赖与班禅两大宗教领袖是如何确立的?"],"q":"4.藏传佛教有哪些派系? 达赖与班禅两大宗教领袖是如何确立的?","w":"normal","e":["原书正文"]},{"t":"【原文】6.基督教是什么时候传入","y":"教材原文","p":["6.基督教是什么时候传入中国的? 为什么在明末能获得较快发展?"],"q":"6.基督教是什么时候传入中国的? 为什么在明末能获得较快发展?","w":"normal","e":["原书正文"]}]},{"id":"culture-c07-s03","t":"第三节 道教","w":"high","n":12,"k":[{"t":"道教","y":"名词解释","p":["中国本土宗教、尊老子为教主","东汉张陵创五斗米道（天师道）","追求长生久视、得道成仙","金元后分全真道与正一道"],"q":"中国本土宗教，以\"道\"为最高信仰，尊老子为教主。东汉顺帝时张陵创立五斗米道（天师道），为道教定型之始。道教以《道德经》《南华经》为主要经典，追求长生久视、得道成仙。金元以后分为全真道与正一道两大派系。","w":"high","e":["2017 真题"]},{"t":"全真道","y":"名词解释","p":["金代王重阳创立","主张三教合一","重清修内丹出家住观","丘处机弘扬","与正一道并列两大派"],"q":"金代王重阳创立的道教派别，主张儒释道三教合一，重清修内丹，要求道士出家住观、禁欲苦修，不尚符箓。全真七子（丘处机等）弘扬其教，丘处机曾西行见成吉思汗，使全真道在元代极盛。全真道与正一道并列为道教两大派。","w":"high","e":["2019 真题"]},{"t":"五斗米道","y":"名词解释","p":["东汉张陵创立","入道交五斗米得名","又称天师道","尊老子为教主","道教正式形成的标志"],"q":"东汉顺帝时张陵（张道陵）在四川鹤鸣山创立的早期道教派别，因入道者须交五斗米而得名，又称天师道。尊老子为教主，以《道德经》为经典，张陵被尊为天师。五斗米道是道教正式形成的重要标志，其子孙世袭天师之位。","w":"high","e":["2017 真题"]},{"t":"正一道","y":"名词解释","p":["符箓派融合而成","龙虎山天师为首领","画符念咒祈福禳灾","可居家娶妻","与全真道并列"],"q":"元代以后由天师道、上清派、灵宝派等符箓派融合而成的道教派别，以龙虎山天师为正一道首领。主张画符念咒、驱鬼降妖、祈福禳灾，道士可以居家娶妻、不忌荤腥。正一道与全真道构成道教两大派系。","w":"normal","e":["核心概念"]},{"t":"【原文】家供给；已婚者还可家供给","y":"教材原文","p":["已 n":8,"k":[{"t":"金瓶掣签","y":"名词解释","p":["清乾隆五十七年确立","活佛转世须金瓶掣签","驻藏大臣会同掣签","报中央政府批准","加强中央对西藏管辖"],"q":"清代确立的藏传佛教活佛转世认定制度。乾隆五十七年（1792年）规定，达赖、班禅等大活佛转世须经金瓶掣签确定，即将候选灵童的名字写在签上放入金瓶，由驻藏大臣会同僧众在佛前掣签认定，并报中央政府批准。这一制度加强了中央对西藏的管辖，避免了活佛转世被少数贵族操控。","w":"high","e":["2023 真题"]},{"t":"【原文】从文献记载来看，我国的家","y":"教材原文","p":["从文献记载来看，我国的家庭教育应当说最早始于西周","周公本受封于鲁，但因周成王年幼，便留在京师辅助成王，让他儿子伯禽往鲁","儿子临行，周公教育儿子说：“我是文王的儿子，武王的弟弟，成王的叔父，地位可说也不贱了","但我洗脸的时候常常还要拿着头发，吃饭的时候常常还要三次吐出食物，急急忙忙地去接待来人，生怕失掉一个贤才"],"q":"从文献记载来看，我国的家庭教育应当说最早始于西周。周公本受封于鲁，但因周成王年幼，便留在京师辅助成王，让他儿子伯禽往鲁。儿子临行，周公教育儿子说：“我是文王的儿子，武王的弟弟，成王的叔父，地位可说也不贱了。但我洗脸的时候常常还要拿着头发，吃饭的时候常常还要三次吐出食物，急急忙忙地去接待来人，生怕失掉一个贤才。你到了鲁国，千万不要骄横待人。”这可能就是文献记载","w":"normal","e":["原书正文"]},{"t":"【原文】古代教育古代教育汉代以后","y":"教材原文","p":["古代教育古代教育汉代以后，由于儒学的特殊地位和影响，封建士大夫家庭以及一般家庭，都以如今的诗礼之教作为家庭教育的基本内容","把忠、孝、节、义作为家庭教育的基本要求，封建的家庭教育由此而逐步规范化","到南北朝末年和隋代初年，出了一位教育家叫颜之推，据说是孔子弟子颜渊的后代","他博览群书，学问渊博，很重视家庭教育"],"q":"古代教育古代教育汉代以后，由于儒学的特殊地位和影响，封建士大夫家庭以及一般家庭，都以如今的诗礼之教作为家庭教育的基本内容；把忠、孝、节、义作为家庭教育的基本要求，封建的家庭教育由此而逐步规范化。到南北朝末年和隋代初年，出了一位教育家叫颜之推，据说是孔子弟子颜渊的后代。他博览群书，学问渊博，很重视家庭教育。他搜集历代家教典故，结合自己的家教实践，写成《颜氏家训","w":"normal","e":["原书正文"]},{"t":"【原文】汉代以后，由于儒学的特殊","y":"教材原文","p":["汉代以后，由于儒学的特殊地位和影响，封建士大夫家庭以及一般家庭，都以如今的诗礼之教作为家庭教育的基本内容","把忠、孝、节、义作为家庭教育的基本要求，封建的家庭教育由此而逐步规范化","到南北朝末年和隋代初年，出了一位教育家叫颜之推，据说是孔子弟子颜渊的后代","他博览群书，学问渊博，很重视家庭教育"],"q":"汉代以后，由于儒学的特殊地位和影响，封建士大夫家庭以及一般家庭，都以如今的诗礼之教作为家庭教育的基本内容；把忠、孝、节、义作为家庭教育的基本要求，封建的家庭教育由此而逐步规范化。到南北朝末年和隋代初年，出了一位教育家叫颜之推，据说是孔子弟子颜渊的后代。他博览群书，学问渊博，很重视家庭教育。他搜集历代家教典故，结合自己的家教实践，写成《颜氏家训》二十篇，其中有","w":"normal","e":["原书正文"]},{"t":"【原文】在清代的教育系统中，学塾","y":"教材原文","p":["在清代的教育系统中，学塾教育比较发达","它不完全属于学校教育，又不完全属于家庭教育","但就其教育阶段而论，属于民间的小学教育，有蒙馆、家塾、族学等多种不同的名称","在办学形式上，可分成三种情况：(一) 有钱人聘请教师在家教读子弟，称为“教馆”或“坐馆”"],"q":"在清代的教育系统中，学塾教育比较发达。它不完全属于学校教育，又不完全属于家庭教育。但就其教育阶段而论，属于民间的小学教育，有蒙馆、家塾、族学等多种不同的名称。在办学形式上，可分成三种情况：(一) 有钱人聘请教师在家教读子弟，称为“教馆”或“坐馆”；(二) 教师在家设馆教授生徒，称为“家塾”或“私塾”；(三) 地方出钱聘请老师在公用场所设馆教授贫寒子弟，称为“","w":"normal","e":["原书正文"]},{"t":"【原文】171788入学塾就读的","y":"教材原文","p":["171788入学塾就读的学生叫作“学童”，年龄多在5岁至 13岁之间","学馆的人数多寡不定，一般在4人至 20人之间","教学方法主要采取 },{"id":"culture-c09","t":"第九章 科举制度","w":"high","s":[{"id":"culture-c09-s01","t":"第一节 选官制度的演变","w":"high","n":10,"k":[{"t":"察举制","y":"名词解释","p":["汉代地方长官考察推举","科目以孝廉最为重要","以德行才能为标准"],"q":"汉代选拔官吏的制度，由地方长官在辖区内考察、推举人才，经朝廷考核后授予官职。汉武帝时确立，科目有孝廉、茂才、贤良方正等，以孝廉最为重要。察举制以德行才能为标准，是科举制之前最重要的选官制度。","w":"high","e":["2022 真题"]},{"t":"九品中正制","y":"名词解释","p":["曹丕时陈群建议确立","中正官评定九品","后期唯重门第、\"上品无寒门\""],"q":"魏晋南北朝时期的选官制度，曹丕称帝后采纳陈群建议确立。由中正官按家世、德行、才能评定士人为九品，供朝廷选用。初期尚兼顾才德，后逐渐以门第为唯一标准，形成\"上品无寒门，下品无势族\"的局面，至隋被科举制取代。","w":"high","e":["2022 真题","2017 真题"]},{"t":"【原文】常熟市的绛云楼是另一个著","y":"教材原文","p":["常熟市的绛云楼是另一个著常熟市的绛云楼是另一个著名藏书楼，主人钱谦益也是名藏书楼，主人钱谦益也是明末清初人，其所藏图书可"],"q":"常熟市的绛云楼是另一个著常熟市的绛云楼是另一个著名藏书楼，主人钱谦益也是名藏书楼，主人钱谦益也是明末清初人，其所藏图书可","w":"normal","e":["原书正文"]},{"t":"【原文】明末清初人，其所藏图书可","y":"教材原文","p":["明末清初人，其所藏图书可与内府相比，可惜后来毁于与内府相比，可惜后来毁于大火","山东省聊城市的海源阁也相当有名，主人杨以增为清代道光、咸丰"],"q":"明末清初人，其所藏图书可与内府相比，可惜后来毁于与内府相比，可惜后来毁于大火。山东省聊城市的海源阁也相当有名，主人杨以增为清代道光、咸丰","w":"normal","e":["原书正文"]},{"t":"【原文】大火。山东省聊城市的海源","y":"教材原文","p":["山东省聊城市的海源阁也相当有名，主人杨以增为清代道光、咸丰第十章第十章年间人，任漕运方面的官职，一生收藏丰富，祖孙三代做过很多目录编订工"],"q":"大火。山东省聊城市的海源阁也相当有名，主人杨以增为清代道光、咸丰第十章第十章年间人，任漕运方面的官职，一生收藏丰富，祖孙三代做过很多目录编订工","w":"normal","e":["原书正文"]},{"t":"【原文】年间人，任漕运方面的官职","y":"教材原文","p":["年间人，任漕运方面的官职，一生收藏丰富，祖孙三代做过很多目录编订工作，其孙杨保彝所编《海源阁宋元秘本书目》，收书460余种，对古籍考订极"],"q":"年间人，任漕运方面的官职，一生收藏丰富，祖孙三代做过很多目录编订工作，其孙杨保彝所编《海源阁宋元秘本书目》，收书460余种，对古籍考订极","w":"normal","e":["原书正文"]},{"t":"【原文】作，其孙杨保彝所编《海源","y":"教材原文","p":["作，其孙杨保彝所编《海源阁宋元秘本书目》，收书460余种，对古籍考订极典籍藏书典籍藏书有价值","浙江省湖州市的百宋楼，是清末陆心源的藏书楼，所藏图书比天一"],"q":"作，其孙杨保彝所编《海源阁宋元秘本书目》，收书460余种，对古籍考订极典籍藏书典籍藏书有价值。浙江省湖州市的百宋楼，是清末陆心源的藏书楼，所藏图书比天一","w":"normal","e":["原书正文"]},{"t":"【原文】阁还多，并且像现代图书馆","y":"教材原文","p":["阁还多，并且像现代图书馆一样向公众开放","可惜全部藏书于1907年被日本阁还多，并且像现代图书馆一样向公众开放","可惜全部藏书于1907年被日本"],"q":"阁还多，并且像现代图书馆一样向公众开放。可惜全部藏书于1907年被日本阁还多，并且像现代图书馆一样向公众开放。可惜全部藏书于1907年被日本","w":"normal","e":["原书正文"]},{"t":"【原文】人买去，至今藏于东京静嘉","y":"教材原文","p":["人买去，至今藏于东京静嘉堂文库","此外，还有常熟市的铁琴铜剑楼，主人人买去，至今藏于东京静嘉堂文库","此外，还有常熟市的铁琴铜剑楼，主人"],"q":"人买去，至今藏于东京静嘉堂文库。此外，还有常熟市的铁琴铜剑楼，主人人买去，至今藏于东京静嘉堂文库。此外，还有常熟市的铁琴铜剑楼，主人","w":"normal","e":["原书正文"]},{"t":"【原文】215215为清代的瞿镛","y":"教材原文","p":["215215为清代的瞿镛，与海源阁的主人杨以增为同时代的大藏书家，故有“南瞿北杨”"],"q":"215215为清代的瞿镛，与海源阁的主人杨以增为同时代的大藏书家，故有“南瞿北杨”","w":"normal","e":["原书正文"]}]},{"id":"culture-c09-s02","t":"第二节 明清科举程序","w":"high","n":17,"k":[{"t":"殿试","y":"名词解释","p":["皇帝亲自主持的最高一级","始于武则天宋代定制","一甲三名状元榜眼探花","录取者统称进士"],"q":"科举考试的最高一级，由皇帝在殿廷亲自主持。始于唐代武则天，宋代成为定制。明清殿试分三甲：一甲三名赐进士及第（状元、榜眼、探花），二甲若干赐进士出身，三甲若干赐同进士出身。殿试录取者统称进士。","w":"high","e":["2019 真题"]},{"t":"乡试","y":"名词解释","p":["省级考试三年一次","秋八月举行称秋闱","考中者称举人","第一名称解元"],"q":"乡试是明清科举制度中的省级考试，每三年一次在省城举行，因在秋八月举行故称\"秋闱\"。由皇帝钦派主考官主持，应试者为秀才及监生，考中者称举人，第一名称解元。举人即取得参加会试的资格，并具备做官资格。","w":"high","e":["2024 真题"]},{"t":"会试","y":"名词解释","p":["乡试次年春三月京城举行","称春闱或礼闱","考中者称贡士","第一名称会元"],"q":"会试是明清科举制度中的中央考试，于乡试次年春三月在京城礼部举行，故称\"春闱\"或\"礼闱\"。由皇帝钦派大臣主持，应试者为举人，考中者称贡士，第一名称会元。会试合格者方可参加殿试。","w":"high","e":["2024 真题"]},{"t":"科举制","y":"名词解释","p":["隋大业元年设进士科始","1905年废止历时1300年","以考试成绩为录取标准","打破门第限制"],"q":"科举制是中国古代通过考试选拔官吏的制度，始于隋大业元年（605年）设进士科，终于清光绪三十一年（1905年）废止，历时1300年。它以考试成绩为录取标准，打破了门第限制，使庶族地主得以参政，是中国古代选官制度的重大变革，对后世及东亚、西方文官制度均有深远影响。","w":"high","e":["2015 真题","2019 真题","2024 真题"]},{"t":"进士科","y":"名词解释","p":["隋炀帝大业年间始设","以试策取士","唐代重诗赋最为贵重","明清考八股文","标志科举制度形成"],"q":"科举考试的重要科目，隋炀帝大业年间始设，以试策取士。唐代进士科重诗赋，最为士人所重，有“三十老明经，五十少进士”之说。宋以后进士科成为科举的主要科目，明清进士科考八股文。进士科的确立标志着科举制度的正式形成。","w":"high","e":["2020 真题"]},{"t":"连中三元","y":"名词解释","p":["乡试解元、会试会元、殿试状元","三级皆第一为连中三元","历史上极为罕见"],"q":"科举考试中，乡试、会试、殿试三级考试均获第一名者称\"连中三元\"。乡试第一名称解元，会试第一名称会元，殿试第一名称状元，合称\"三元\"。历史上连中三元者极少，被视为科举最高荣誉。","w":"high","e":["2020 真题"]},{"t":"试论科举制度的历史作用与影响","y":"名词解释","p":["打破门阀促进阶层流动","公平取士提高官员素质","推动教育普及儒学传播","加强中央集权","影响西方文官制度","八股束缚思想重文轻技"],"q":"积极方面：①打破门阀世族对政治的垄断，扩大统治基础，促进社会阶层流动，“朝为田舍郎，暮登天子堂”；②以考试取士，相对公平公正，提高了官员的文化素质；③推动教育普及与儒学传播，形成重学重教的社会风气；④加强了中央集权，把选官权收归中央；⑤对东亚及西方文官制度产生重要影响。消极方面：①考试内容局限于儒家","w":"high","e":["2023 真题","2018 真题"]},{"t":"试论科举制度对中国社会结构的影响","y":"名词解释","p":["打破门阀垄断形成士大夫阶层","促进阶层流动与耕读传家","推动儒学教育普及","形成士绅阶层主导地方","官本位与轻视科技的弊端"],"q":"科举制度对中国社会结构的影响深远：①政治上，打破了魏晋以来门阀士族垄断政权的格局，形成\"士大夫\"这一新的社会阶层，官僚队伍向庶族开放，皇权得以借助寒门士子制衡世家；②社会结构上，促进了阶层流动，形成\"耕读传家\"的社会理想与\"万般皆下品，惟有读书高\"的价值取向；③文化上，推动了儒学经典教育的普及与地方","w":"high","e":["2023 真题"]},{"t":"童试","y":"名词解释","p":["明清科举初级考试","县试府试院试三阶段","录取后为生员秀才","科举功名的起点"],"q":"明清科举的初级考试，包括县试、府试、院试三个阶段。应试者称童生，院试录取后取得生员（秀才）资格，进入府州县学。童试是科举功名的起点，考中秀才方可参加乡试。","w":"normal","e":["核心概念"]},{"t":"试述科举制度对中国社会的深远影响","y":"名词解释","p":["积极：打破门阀、促进阶层流动","积极：收选官权于中央、加强集权","积极：推动重学与教育发展","积极：影响东亚与西方文官制度","消极：八股束缚思想抑制创新","消极：官本位与脱离实际"],"q":"科举制度的影响可从正反两面论述。积极影响：其一，打破了门阀世族对仕途的垄断，使庶族寒门得以通过读书入仕，扩大了统治基础，促进了社会阶层流动；其二，把选官权收归中央，加强了中央集权，削弱了地方势力；其三，以考试取士确立了知识本位与能力标准，推动了重学风气的形成与儒家文化的普及；其四，促进了教育发展，官","w":"normal","e":["核心概念"]},{"t":"【原文】著《灵宪》，提出了“宇之","y":"教材原文","p":["著《灵宪》，提出了“宇之表无极，宙之端无穷”的科学见解，并创制了“浑223223天仪”和“候风地动仪”","今河南省南阳市有张衡墓","位于登封市告成镇的"],"q":"著《灵宪》，提出了“宇之表无极，宙之端无穷”的科学见解，并创制了“浑223223天仪”和“候风地动仪”。今河南省南阳市有张衡墓。位于登封市告成镇的","w":"normal","e":["原书正文"]},{"t":"【原文】观景台，则是元代天文学家","y":"教材原文","p":["观景台，则是元代天文学家郭守敬 (1231——1316年) 创建的, 至敬 (1231——1316年) 创建的, 至今仍保留着观测日影的“圭表”"],"q":"观景台，则是元代天文学家郭守敬 (1231——1316年) 创建的, 至敬 (1231——1316年) 创建的, 至今仍保留着观测日影的“圭表”。","w":"normal","e":["原书正文"]},{"t":"【原文】由于我国人民的天文观测开","y":"教材原文","p":["由于我国人民的天文观测开始很早，所以早就发现了太阳黑子","甲骨文的“日”字写作 “⊙”，其圆圈内的一点，即代表太阳的黑子","目前世界公认的关于太阳黑子的最早记录是在汉成帝河平元年(公元前28年)：“三月己未，日出黄，有黑气大如钱，居日中央","”(《汉书·五行志》) 这一记载，"],"q":"由于我国人民的天文观测开始很早，所以早就发现了太阳黑子。 甲骨文的“日”字写作 “⊙”，其圆圈内的一点，即代表太阳的黑子。目前世界公认的关于太阳黑子的最早记录是在汉成帝河平元年(公元前28年)：“三月己未，日出黄，有黑气大如钱，居日中央。”(《汉书·五行志》) 这一记载，","w":"normal","e":["原书正文"]},{"t":"【原文】把太阳黑子活动的时间和位","y":"教材原文","p":["把太阳黑子活动的时间和位置叙述得很详尽","而同一史书里还有关于太阳黑子活动的更早记录：汉元帝永光元年(公元前43年)，“日黑居仄，大如弹丸”","而欧洲这方面最早的记录是在 807年，比中国晚了8个世纪","据统计，从公元前43年到1638年，中国共有关于太阳黑子的文字记录106 条"],"q":"把太阳黑子活动的时间和位置叙述得很详尽。而同一史书里还有关于太阳黑子活动的更早记录：汉元帝永光元年(公元前43年)，“日黑居仄，大如弹丸”。而欧洲这方面最早的记录是在 807年，比中国晚了8个世纪。据统计，从公元前43年到1638年，中国共有关于太阳黑子的文字记录106 条。又如对彗星，从殷商到清末，也有500余次的记录，最早的记录见于周昭王十九年 (约公元","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)!24!24在中国古代天文学知识中比较重要的是人们常说的“七曜”和“二十八宿”，因为它们与我们的关系比较密切","所谓“七曜”，指日、月和金、木、水、火、土五大行星","日、月周而复始为一年","至于金、木、水、火、土，则是人们实际观测到的五颗行星"],"q":"中国文化要略(第4版)中国文化要略(第4版)!24!24在中国古代天文学知识中比较重要的是人们常说的“七曜”和“二十八宿”，因为它们与我们的关系比较密切。所谓“七曜”，指日、月和金、木、水、火、土五大行星。日起日落为一天；月缺月圆为一月；日、月周而复始为一年；至于金、木、水、火、土，则是人们实际观测到的五颗行星。金星古称“明星”，又称“太白”，黎明见于东方，","w":"normal","e":["原书正文"]},{"t":"【原文】西方白虎七宿：奎、娄、 ","y":"教材原文","p":["西方白虎七宿：奎、娄、 胃、 昴、 毕、 ， 参"],"q":"西方白虎七宿：奎、娄、 胃、 昴、 毕、 ， 参；","w":"normal","e":["原书正文"]},{"t":"【原文】这二十八宿的形成经历了一","y":"教材原文","p":["这二十八宿的形成经历了一个很长的过程，《诗经》中已见多处记载，到《吕氏春秋》中已有完整的名称，而在 1978年湖北省随州市曾侯乙墓出土文物的盖箱上，已有二十八宿的完整图画和名称，可见它在战国时代已经形成","二十八宿之所以重要，首先是古人认为它们属于恒星，它们的方位永恒不变，因此被用来作为其他行星的坐标，以便观测日月及五星所处的位置","其次是古人将天文与地域相联系，使之互相对应，并将与星宿对应的地域称为“分野”，这在《淮南子·天文训》《史记·天官书》等书中都有记载","综合各家所记，中国古代的分野为："],"q":"这二十八宿的形成经历了一个很长的过程，《诗经》中已见多处记载，到《吕氏春秋》中已有完整的名称，而在 1978年湖北省随州市曾侯乙墓出土文物的盖箱上，已有二十八宿的完整图画和名称，可见它在战国时代已经形成。二十八宿之所以重要，首先是古人认为它们属于恒星，它们的方位永恒不变，因此被用来作为其他行星的坐标，以便观测日月及五星所处的位置。其次是古人将天文与地域相联系","w":"normal","e":["原书正文"]}]},{"id":"culture-c09-s03","t":"第三节 防弊制度与八股文","w":"high","n":9,"k":[{"t":"八股文","y":"名词解释","p":["明清科举规定文体","破题承题起讲入手起股中股后股束股","依朱熹四书章句集注","格式僵化束缚思想"],"q":"明清科举考试规定的文体，又称制义、时文。文章须由破题、承题、起讲、入手、起股、中股、后股、束股八部分组成，后四股各有两股对偶文字，共八股。内容须依朱熹《四书章句集注》发挥，不得自由立论。八股文格式僵化，严重束缚思想，是明清科举的一大弊端。","w":"high","e":["2023 真题"]},{"t":"糊名誊录","y":"名词解释","p":["宋代防止考官徇私","糊名即密封姓名籍贯","誊录即重新抄录试卷","保证考试公平"],"q":"宋代科举为防止考官徇私而实行的制度。糊名又称弥封，即将试卷上考生的姓名、籍贯等密封；誊录即由专人将试卷重新抄录，使考官无法辨认笔迹。二者有效防止了舞弊，保证了考试的公平性，是科举制度走向严密的重要标志。","w":"high","e":["2018 真题"]},{"t":"糊名与誊录","y":"名词解释","p":["宋代防舞弊的试卷制度","糊名封糊姓名籍贯","誊录重抄以防认笔迹","使考试趋于客观公正"],"q":"糊名与誊录是宋代为防科场舞弊而创立的试卷管理制度。糊名（弥封）即将试卷卷首考生姓名、籍贯等封糊，使考官不知考生身份，始于唐武则天时，宋代普遍推行；誊录即由书吏将试卷重新抄录一遍，使考官不能辨认笔迹，始于宋真宗时。二者使考试趋于客观公正，是科举制度成熟的重要标志。","w":"normal","e":["核心概念"]},{"t":"【原文】中国算学的一大特色计算法","y":"教材原文","p":["中国算学的一大特色计算法是“珠算”，它由以竹签作筹码进行运算的“筹算”发展而来，至元末明初已得到普遍应用","珠算的工具就是算盘，采用上下分框，上框两珠，一珠当五","下框五珠，一珠当一","其计算方式形成口诀，至今仍十分流行"],"q":"中国算学的一大特色计算法是“珠算”，它由以竹签作筹码进行运算的“筹算”发展而来，至元末明初已得到普遍应用。珠算的工具就是算盘，采用上下分框，上框两珠，一珠当五；下框五珠，一珠当一。其计算方式形成口诀，至今仍十分流行。详细说明珠算算法的著作很多，影响巨大且流行最广的是明代程大位所著的《直指算法统宗》。珠算东传还流行于日本和朝鲜半岛。","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略中国文化要略","y":"教材原文","p":["中国文化要略中国文化要略汉代名医首推张仲景与华佗","二人都对中国医学发展做出了巨大贡献","张仲景(约150—219年)，名机，南阳(今河南省南阳市) 人，据说曾任长沙太守","因当时伤寒流行，死亡人数很多，他“勤求古训，博采众方”，写成医学巨著《伤寒杂病论》(即今《伤寒论》和《金匮要略》两部分)"],"q":"中国文化要略中国文化要略汉代名医首推张仲景与华佗。二人都对中国医学发展做出了巨大贡献。张仲景(约150—219年)，名机，南阳(今河南省南阳市) 人，据说曾任长沙太守。因当时伤寒流行，死亡人数很多，他“勤求古训，博采众方”，写成医学巨著《伤寒杂病论》(即今《伤寒论》和《金匮要略》两部分)。他总结和创制的200余种处方，贯彻了“理”(医学理论)、“法”(治疗原","w":"normal","e":["原书正文"]},{"t":"【原文】汉代名医首推张仲景与华佗","y":"教材原文","p":["汉代名医首推张仲景与华佗","二人都对中国医学发展做出了巨大贡献","张仲景(约150—219年)，名机，南阳(今河南省南阳市) 人，据说曾任长沙太守","因当时伤寒流行，死亡人数很多，他“勤求古训，博采众方”，写成医学巨著《伤寒杂病论》(即今《伤寒论》和《金匮要略》两部分)"],"q":"汉代名医首推张仲景与华佗。二人都对中国医学发展做出了巨大贡献。张仲景(约150—219年)，名机，南阳(今河南省南阳市) 人，据说曾任长沙太守。因当时伤寒流行，死亡人数很多，他“勤求古训，博采众方”，写成医学巨著《伤寒杂病论》(即今《伤寒论》和《金匮要略》两部分)。他总结和创制的200余种处方，贯彻了“理”(医学理论)、“法”(治疗原则)、“方”(处方)、“","w":"normal","e":["原书正文"]},{"t":"【原文】(第4版(第4版2323","y":"教材原文","p":["(第4版(第4版232322魏晋隋唐，中医中药在理论和实践上都有新的总结和提高","首先是晋代王叔和在总结前代经验的基础上，编写了《脉经》一书，详细描述了脉象所反映的各种病症","由晋代葛洪编撰的《肘后备急方》，搜集了大量治疗有效的处方","隋代巢元方等人编写的《诸病源候论》，专门描述病情，分析病理，确定了诸多病症的病名"],"q":"(第4版(第4版232322魏晋隋唐，中医中药在理论和实践上都有新的总结和提高。首先是晋代王叔和在总结前代经验的基础上，编写了《脉经》一书，详细描述了脉象所反映的各种病症；由晋代葛洪编撰的《肘后备急方》，搜集了大量治疗有效的处方； 隋代巢元方等人编写的《诸病源候论》，专门描述病情，分析病理，确定了诸多病症的病名；唐代名医孙思邈(581——682年) 则耗毕生","w":"normal","e":["原书正文"]},{"t":"【原文】宋元以后，对中医理论的探","y":"教材原文","p":["宋元以后，对中医理论的探讨日趋活跃，在学术上形成了许多流派，主要有“金元四大家”：主张用药首应泻火清热的刘河间，被称为“泻火派”","主张脾胃为本，治法采用补气升阳的李东垣，被称为“补土派”","主张攻邪去病，反对滥用补药的张子和，被称为“攻邪派”","取三家之长，主张泻火养阴的朱丹溪，被称为“养阴派”"],"q":"宋元以后，对中医理论的探讨日趋活跃，在学术上形成了许多流派，主要有“金元四大家”：主张用药首应泻火清热的刘河间，被称为“泻火派”；主张脾胃为本，治法采用补气升阳的李东垣，被称为“补土派”；主张攻邪去病，反对滥用补药的张子和，被称为“攻邪派”； 取三家之长，主张泻火养阴的朱丹溪，被称为“养阴派”。明清以后，又有许多名医各有所长，都对中国医学做出了应有的贡献。明","w":"normal","e":["原书正文"]},{"t":"【原文】中国医学的又一突出成就是","y":"教材原文","p":["中国医学的又一突出成就是针灸，它在世界上是独一无二的疗法","所谓“针灸”，就是用针和灸两种方法刺激特定的穴位，以达到温通经脉、调和气血、消除病症的目的","针灸依据的理论是历史悠久的“经络学说”","这种学说认为，人体的腧穴(即穴位) 是人体腑脏和经络之气输注并散发于体表的部位"],"q":"中国医学的又一突出成就是针灸，它在世界上是独一无二的疗法。所谓“针灸”，就是用针和灸两种方法刺激特定的穴位，以达到温通经脉、调和气血、消除病症的目的。针灸依据的理论是历史悠久的“经络学说”。这种学说认为，人体的腧穴(即穴位) 是人体腑脏和经络之气输注并散发于体表的部位；联系腧穴和腑脏的道路，就是经络。因此，针灸就是将外界的刺激，通过腧穴注入，经由经络而达于相","w":"normal","e":["原书正文"]}]}]},{"id":"culture-c10","t":"第十章 典籍藏书","w":"high","s":[{"id":"culture-c10-s01","t":"第一节 典籍分类与载体","w":"high","n":10,"k":[{"t":"七略","y":"名词解释","p":["刘歆在刘向《别录》基础上编成","分辑略等七部分","我国第一部综合性图书分类目录"],"q":"我国第一部综合性的图书分类目录，西汉刘歆在其父刘向《别录》的基础上编成。全书分辑略、六艺略、诸子略、诗赋略、兵书略、术数略、方技略七部分，故称《七略》。它确立了我国古代图书六分法的体系，对后世目录学影响深远。","w":"high","e":["2024 真题"]},{"t":"经史子集","y":"名词解释","p":["经部：儒家经典与小学","史部：各类史书","子部：诸子与科技艺术","集部：文学总集别集"],"q":"中国古代图书的四部分类法。经部收儒家经典及小学之书；史部收各类史书；子部收诸子百家及科技、艺术、宗教之书；集部收文学作品的总集与别集。四部分类法由西晋荀勖《中经新簿》初创，至《隋书·经籍志》正式定名，成为《四库全书》的分类依据。","w":"high","e":["2023 真题","2019 真题"]},{"t":"四部分类法","y":"名词解释","p":["经史子集四部","经部儒家经典史部历史","子部诸子科技集部诗文","《隋书·经籍志》定型","《四库全书总目》集大成"],"q":"四部分类法是中国古代图书分类的主要方法，即经、史、子、集四部。经部收儒家经典及注疏，史部收历史著作，子部收诸子百家及科技类书，集部收诗文集与文学评论。此法始于魏晋，定型于《隋书·经籍志》，至《四库全书总目》而集大成，是中国目录学的核心体系。","w":"high","e":["2017 真题","2022 真题"]},{"t":"类书","y":"名词解释","p":["采摭群书按类编排的工具书","述而不作，辑录原文","《艺文类聚》《太平御览》《永乐大典》","具有文献辑佚价值"],"q":"类书是采摭群书、按类目或韵目编排、便于寻检的资料性工具书，其特点是\"述而不作\"，辑录原文而不加己意。著名类书有唐代《艺文类聚》《初学记》、宋代《太平御览》《册府元龟》、明代《永乐大典》、清代《古今图书集成》。类书保存了大量佚书遗文，具有极高的文献辑佚价值。","w":"normal","e":["核心概念"]},{"t":"【原文】232388但雕版的使用","y":"教材原文","p":["232388但雕版的使用并不方便，不但刻版费时，而且保存不易，常因气候、虫蛀等腐蚀变形，并且即使有错字也不能改正","这时出现了活字印刷的平民发明家毕昇","他以丰富的实践经验，经过不断的摸索，终于在宋庆历年间(1041——1048年) 制成了胶泥活字，实行排版印刷，完成了印刷史上的一次伟大革命","在后来的发展中，元代曾改用锡活字"],"q":"232388但雕版的使用并不方便，不但刻版费时，而且保存不易，常因气候、虫蛀等腐蚀变形，并且即使有错字也不能改正。这时出现了活字印刷的平民发明家毕昇。他以丰富的实践经验，经过不断的摸索，终于在宋庆历年间(1041——1048年) 制成了胶泥活字，实行排版印刷，完成了印刷史上的一次伟大革命。在后来的发展中，元代曾改用锡活字。过去认为，元代农学家王祯发明了木活字","w":"normal","e":["原书正文"]},{"t":"【原文】中国的印刷术大约在8世纪","y":"教材原文","p":["中国的印刷术大约在8世纪传到日本，在12世纪前后传入波斯和埃及","中国的印刷术连同其他发明沿着“丝绸之路”传向西方","约在13世纪，欧"],"q":"中国的印刷术大约在8世纪传到日本，在12世纪前后传入波斯和埃及。中国的印刷术连同其他发明沿着“丝绸之路”传向西方。约在13世纪，欧","w":"normal","e":["原书正文"]},{"t":"【原文】洲才用雕版印刷印制了第一","y":"教材原文","p":["洲才用雕版印刷印制了第一张画像","随后，14世纪到15 世纪，雕版印刷与活字印刷在欧洲同时流行","人类文明因纸与印刷术的发明而大大加快了传播、交流和发展的速度","英国哲学家弗兰西斯·培根曾经这样评价中国的这几项发明，他说印刷术、火药和指南针“这三种东西已经改变了世界的面貌"],"q":"洲才用雕版印刷印制了第一张画像。随后，14世纪到15 世纪，雕版印刷与活字印刷在欧洲同时流行。人类文明因纸与印刷术的发明而大大加快了传播、交流和发展的速度。英国哲学家弗兰西斯·培根曾经这样评价中国的这几项发明，他说印刷术、火药和指南针“这三种东西已经改变了世界的面貌。第一种在文学上，第二种在战争上，第三种在航海上。由此又引起了无数的变化。这种变化如此之大，以","w":"normal","e":["原书正文"]},{"t":"【原文】1.中国古代科学研究的特","y":"教材原文","p":["1.中国古代科学研究的特点是什么? 它对后来的科学事业产生了什么影响?"],"q":"1.中国古代科学研究的特点是什么? 它对后来的科学事业产生了什么影响?","w":"normal","e":["原书正文"]},{"t":"【原文】1.陈美东.简明中国科学","y":"教材原文","p":["1.陈美东.简明中国科学技术史话.北京：中国青年出版社，2009."],"q":"1.陈美东.简明中国科学技术史话.北京：中国青年出版社，2009.","w":"normal","e":["原书正文"]},{"t":"【原文】人们知道，远在原始社会的","y":"教材原文","p":["人们知道，远在原始社会的旧石器时代，并没有什么人工的建筑，原始人群都是利用天然的岩洞作为居住的处所，如同我们已知的北京猿人和山顶洞人在北京周口店所住的洞穴那样","这种情况在我国的古籍中都有记载，如《周易·系辞下》云：“上古穴居而野处","”《礼记·礼运》亦云：“昔者先王未有宫室，冬则居营窟，夏则居橹巢","”《墨子·节用上》亦云：“古者人之始生，未有宫室之时，因陵丘堀穴而处焉"],"q":"人们知道，远在原始社会的旧石器时代，并没有什么人工的建筑，原始人群都是利用天然的岩洞作为居住的处所，如同我们已知的北京猿人和山顶洞人在北京周口店所住的洞穴那样。这种情况在我国的古籍中都有记载，如《周易·系辞下》云：“上古穴居而野处。”《礼记·礼运》亦云：“昔者先王未有宫室，冬则居营窟，夏则居橹巢。”《墨子·节用上》亦云：“古者人之始生，未有宫室之时，因陵丘堀","w":"normal","e":["原书正文"]}]},{"id":"culture-c10-s02","t":"第二节 著名典籍","w":"high","n":11,"k":[{"t":"四库全书","y":"名词解释","p":["乾隆年间编纂、纪昀总纂","收书三千四百余种","按经史子集四部分类","古代规模最大的丛书"],"q":"清代乾隆年间编纂的大型丛书，由纪昀（纪晓岚）任总纂官，历时十余年编成。全书收书三千四百余种、七万九千余卷，按经史子集四部分类，是我国古代规模最大的丛书。编纂同时查禁销毁了大量不利于清廷的书籍，并形成《四库全书总目提要》这一目录学巨著。","w":"high","e":["2017 真题"]},{"t":"永乐大典","y":"名词解释","p":["明成祖永乐年间编纂","解缙姚广孝主持","22877卷约3.7亿字","我国古代规模最大的类书"],"q":"《永乐大典》是明成祖永乐年间编纂的大型类书，由解缙、姚广孝主持，历时五年编成。全书22877卷，约3.7亿字，收录先秦至明初典籍七八千种，按韵目编排，是我国古代规模最大的类书。今仅存残卷数百册，散藏于世界各地。","w":"high","e":["2016 真题"]},{"t":"说文解字","y":"名词解释","p":["东汉许慎著","中国第一部系统字书","收字9353个","首创540部首检字法","以六书分析字形"],"q":"《说文解字》是东汉许慎所著的中国第一部系统分析字形、解释字义的字书。全书收字9353个，重文1163个，按540个部首编排，首创部首检字法，以\"六书\"理论分析字形结构，是研究古文字与汉字本义的最重要典籍。","w":"high","e":["2018 真题"]},{"t":"资治通鉴","y":"名词解释","p":["北宋司马光主持编纂","编年体通史294卷","记1362年历史","鉴于往事有资于治道"],"q":"《资治通鉴》是北宋司马光主持编纂的编年体通史，历时十九年完成。全书294卷，记载上起战国周威烈王二十三年（前403年）、下迄五代后周世宗显德六年（959年）共1362年的历史，以\"鉴于往事，有资于治道\"为宗旨，为帝王提供治国借鉴，与《史记》并称\"史学双璧\"。","w":"high","e":["2021 真题"]},{"t":"试论《四库全书》编纂的文化意义与历史局限","y":"名词解释","p":["保存典籍精华收书3461种","总目提要辨章学术考镜源流","推动乾嘉朴学与校勘学","寓禁于征禁毁三千余种","官方意志取舍排斥异端","文化专制的产物"],"q":"《四库全书》的文化意义：①是中国古代规模最大的丛书，系统保存了先秦至清初的典籍精华，收书3461种、79309卷；②《四库全书总目提要》对万余种书籍撰写提要，辨章学术、考镜源流，是古代目录学的集大成之作；③推动了乾嘉朴学与版本校勘学的发展；④确立了经史子集的完整分类体系。其历史局限：①\"寓禁于征\"，","w":"high","e":["2023 真题"]},{"t":"【原文】兴庆宫原为唐玄宗即兴庆宫","y":"教材原文","p":["兴庆宫原为唐玄宗即兴庆宫原为唐玄宗即位前的住宅，后改建位前的住宅，后改建中国文化要略(第4版)中国文化要略(第4版)为皇宫，因而规模比"],"q":"兴庆宫原为唐玄宗即兴庆宫原为唐玄宗即位前的住宅，后改建位前的住宅，后改建中国文化要略(第4版)中国文化要略(第4版)为皇宫，因而规模比","w":"normal","e":["原书正文"]},{"t":"【原文】为皇宫，因而规模比较小，","y":"教材原文","p":["为皇宫，因而规模比较小，但豪华程度并较小，但豪华程度并不亚于前二宫","南部园苑以“龙池”为中心，北部宫殿以“兴庆殿”为主体"],"q":"为皇宫，因而规模比较小，但豪华程度并较小，但豪华程度并不亚于前二宫。南部园苑以“龙池”为中心，北部宫殿以“兴庆殿”为主体。","w":"normal","e":["原书正文"]},{"t":"【原文】不亚于前二宫","y":"教材原文","p":["南部园苑以“龙池”为中心，北部宫殿以“兴庆殿”为主体"],"q":"不亚于前二宫。南部园苑以“龙池”为中心，北部宫殿以“兴庆殿”为主体。","w":"normal","e":["原书正文"]},{"t":"【原文】唐玄宗与杨贵妃的故事大都","y":"教材原文","p":["唐玄宗与杨贵妃的故事大都发生在这里","现为西安市兴庆公园"],"q":"唐玄宗与杨贵妃的故事大都发生在这里。现为西安市兴庆公园。","w":"normal","e":["原书正文"]},{"t":"【原文】北宋的宫殿在汴梁(今开封","y":"教材原文","p":["北宋的宫殿在汴梁(今开封市)，南宋的宫殿在临安(今杭州市)，金、元宫殿主要在幽州(今北京市)，我们都不去细说","单说明代建造的宫殿","明太祖朱元璋即位后，建都南京，首先在钟山之下建了一座宫城，即南京皇宫，而后，又以其故乡临濠(今安徽省凤阳县) 为陪都，于洪武五年(1372年) 用14万军士、民工营建“中都城”","其雄伟壮丽，远胜于南京皇宫和今天的北京故宫，但六年以后又宣布罢建"],"q":"北宋的宫殿在汴梁(今开封市)，南宋的宫殿在临安(今杭州市)，金、元宫殿主要在幽州(今北京市)，我们都不去细说。单说明代建造的宫殿。明太祖朱元璋即位后，建都南京，首先在钟山之下建了一座宫城，即南京皇宫，而后，又以其故乡临濠(今安徽省凤阳县) 为陪都，于洪武五年(1372年) 用14万军士、民工营建“中都城”。其雄伟壮丽，远胜于南京皇宫和今天的北京故宫，但六年以","w":"normal","e":["原书正文"]},{"t":"【原文】及其装饰表现得最为突出","y":"教材原文","p":["及其装饰表现得最为突出","中国的殿堂(包括宗教殿堂) 都采用大屋顶，主要形式有悬山、硬山、庑殿、歇山、卷棚、攒尖六种","“悬山顶”为双坡屋面，构成一条正脊(平脊) 和四条垂脊，屋面两侧伸出山墙之外","“硬山顶”也是双坡屋面，但两侧山墙与屋面齐平"],"q":"及其装饰表现得最为突出。中国的殿堂(包括宗教殿堂) 都采用大屋顶，主要形式有悬山、硬山、庑殿、歇山、卷棚、攒尖六种。“悬山顶”为双坡屋面，构成一条正脊(平脊) 和四条垂脊，屋面两侧伸出山墙之外；“硬山顶”也是双坡屋面，但两侧山墙与屋面齐平；“庑殿顶”是四坡屋面，相交处构成一条正脊和四条斜脊，屋檐屋角向上翘起，屋面略略弯曲；“歇山顶”是两坡和四坡相结合的形式，","w":"normal","e":["原书正文"]}]},{"id":"culture-c10-s03","t":"第三节 藏书楼","w":"normal","n":8,"k":[{"t":"天一阁","y":"名词解释","p":["明嘉靖范钦建于宁波","现存最古老的私家藏书楼","取天一生水之义","曾进呈《四库全书》六百余种"],"q":"天一阁是明代嘉靖年间兵部右侍郎范钦在浙江宁波所建的私人藏书楼，建于嘉靖四十年（1561年），取《周易》\"天一生水\"之义以水克火，故名。原有藏书七万余卷，多为宋元明刻本与抄本，是我国现存最古老的私家藏书楼。清代修《四库全书》时曾进呈珍贵典籍六百余种。","w":"normal","e":["核心概念"]},{"t":"【原文】首先说长城的基本情况","y":"教材原文","p":["首先说长城的基本情况","很多人有一种误解，以为长城是秦始皇开始修建的","其实，长城的修建早在公元前7世纪的春秋战国时期就已经开始了","据文献记载，最早修建长城的是南方的楚国"],"q":"首先说长城的基本情况。很多人有一种误解，以为长城是秦始皇开始修建的。其实，长城的修建早在公元前7世纪的春秋战国时期就已经开始了。据文献记载，最早修建长城的是南方的楚国。公元前656年之前，楚国为了防御齐国的进攻，已在齐楚边界(约今河南、山东一带) 修建了一道城墙，那时不叫长城，而叫“方城”。此后的四百余年间，各个诸侯国为了保护自己的安全，防御他人的侵扰，陆续","w":"normal","e":["原书正文"]},{"t":"【原文】传统建筑传统建筑2572","y":"教材原文","p":["传统建筑传统建筑257257公元前221年，秦始皇消灭了六国，统一了天下，为了防御匈奴贵族的进攻，巩固新建立的中央集权制度，立即派大将蒙恬和长子扶苏，“将三十万众，北逐戎狄，收河南，筑长城，因地形，用险制塞，起临洮，至辽东，延袤万余里”","这项工程耗时十年，把秦、燕、赵三国的长城连在一起，形成了一个强大的军事防御体系","从此，“万里长城”就在我国的北方出现了","因此，正确的说法应该是，秦始皇修筑了万里长城"],"q":"传统建筑传统建筑257257公元前221年，秦始皇消灭了六国，统一了天下，为了防御匈奴贵族的进攻，巩固新建立的中央集权制度，立即派大将蒙恬和长子扶苏，“将三十万众，北逐戎狄，收河南，筑长城，因地形，用险制塞，起临洮，至辽东，延袤万余里”。这项工程耗时十年，把秦、燕、赵三国的长城连在一起，形成了一个强大的军事防御体系。从此，“万里长城”就在我国的北方出现了。因","w":"normal","e":["原书正文"]},{"t":"【原文】秦始皇以后，仍有十个王朝","y":"教材原文","p":["秦始皇以后，仍有十个王朝陆续修建长城，如汉、北魏、东魏、北齐、北周、隋、辽、金、宋、明","其中以汉、明两代修筑的规模最大","西汉长城一般分为内外两重，并沿城墙建立了许多亭、障、烽、燧等军事建筑物，形成"],"q":"秦始皇以后，仍有十个王朝陆续修建长城，如汉、北魏、东魏、北齐、北周、隋、辽、金、宋、明。其中以汉、明两代修筑的规模最大。西汉长城一般分为内外两重，并沿城墙建立了许多亭、障、烽、燧等军事建筑物，形成","w":"normal","e":["原书正文"]},{"t":"【原文】“五里一燧，十里一墩，卅","y":"教材原文","p":["“五里一燧，十里一墩，卅里一堡，百里一城”的整体防御体系","今天在甘肃境内还可以看到汉长城的遗址，尤以敦煌市玉门关附近的保存较好","汉长城的功用，除抵御匈奴之外，还保护了“丝绸之路”的畅通以及西域和长城沿线的屯田","明代修长城从明太祖朱元璋开始，延续了270多年"],"q":"“五里一燧，十里一墩，卅里一堡，百里一城”的整体防御体系。今天在甘肃境内还可以看到汉长城的遗址，尤以敦煌市玉门关附近的保存较好。汉长城的功用，除抵御匈奴之外，还保护了“丝绸之路”的畅通以及西域和长城沿线的屯田。明代修长城从明太祖朱元璋开始，延续了270多年。明朝刚刚建立，朱元璋就派大将军徐达修筑居庸关等处长城。明成祖朱棣迁都北京以后，因靠近北部边界，更重视长","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)建筑长城的目的全在于军事防卫","但是，历史证明，御敌的力量并不在一座长城，而在于国策和民众","所以，一旦政治腐败，人心溃散，长城还是不能挽救一个王朝的命运","唐代汪遵写的一首诗讲的就是这个道理，诗曰：“秦筑长城比铁牢，蕃戎不敢过临洮"],"q":"中国文化要略(第4版)中国文化要略(第4版)建筑长城的目的全在于军事防卫。但是，历史证明，御敌的力量并不在一座长城，而在于国策和民众。所以，一旦政治腐败，人心溃散，长城还是不能挽救一个王朝的命运。唐代汪遵写的一首诗讲的就是这个道理，诗曰：“秦筑长城比铁牢，蕃戎不敢过临洮。虽然万里连云际，争及尧阶三尺高。”(《长城》)李自成起义和清兵入关也都证明了坚城铁甲不如","w":"normal","e":["原书正文"]},{"t":"【原文】建筑长城的目的全在于军事","y":"教材原文","p":["建筑长城的目的全在于军事防卫","但是，历史证明，御敌的力量并不在一座长城，而在于国策和民众","所以，一旦政治腐败，人心溃散，长城还是不能挽救一个王朝的命运","唐代汪遵写的一首诗讲的就是这个道理，诗曰：“秦筑长城比铁牢，蕃戎不敢过临洮"],"q":"建筑长城的目的全在于军事防卫。但是，历史证明，御敌的力量并不在一座长城，而在于国策和民众。所以，一旦政治腐败，人心溃散，长城还是不能挽救一个王朝的命运。唐代汪遵写的一首诗讲的就是这个道理，诗曰：“秦筑长城比铁牢，蕃戎不敢过临洮。虽然万里连云际，争及尧阶三尺高。”(《长城》)李自成起义和清兵入关也都证明了坚城铁甲不如政治清明。清朝建立以后，虽然在修不修长城的问","w":"normal","e":["原书正文"]},{"t":"【原文】258258其次，谈几点","y":"教材原文","p":["258258其次，谈几点由长城得出的认识：第一，长城是一个防御性的军事系统工程，它所反映的战略是防御性的，而不是进攻性的","这是由中国封建社会封闭型的社会形态决定的","建立在小农经济基础上的封建社会，只祈求封建统治不断延续(即国祚久长、长治久安)，满足于社会生产的自给自足，"],"q":"258258其次，谈几点由长城得出的认识：第一，长城是一个防御性的军事系统工程，它所反映的战略是防御性的，而不是进攻性的。这是由中国封建社会封闭型的社会形态决定的。建立在小农经济基础上的封建社会，只祈求封建统治不断延续(即国祚久长、长治久安)，满足于社会生产的自给自足，","w":"normal","e":["原书正文"]}]}]},{"id":"culture-c11","t":"第十一章 科技成就","w":"high","s":[{"id":"culture-c11-s01","t":"第一节 四大发明","w":"high","n":8,"k":[{"t":"四大发明","y":"名词解释","p":["造纸术—东汉蔡伦改进","印刷术—唐雕版、宋活字","火药—唐炼丹、宋军用","指南针—战国司南、宋航海"],"q":"造纸术、印刷术、火药、指南针的合称，是中国古代对世界文明最具影响力的科技成就。造纸术由东汉蔡伦改进；印刷术历经唐代雕版、宋代毕昇活字；火药始于唐代炼丹，宋代用于军事；指南针源于战国司南，宋代用于航海。四大发明经阿拉伯传入欧洲，对世界历史进程产生深远影响。","w":"high","e":["2016 真题"]},{"t":"【原文】专家们认为，我国的桥梁应","y":"教材原文","p":["专家们认为，我国的桥梁应当出现于原始社会","大约古人受到横木跨水的启发，置条木于河上成为一种独木桥，即最初的“梁桥”，所以“桥梁”二字都带“木”字旁","最早见于文献记载的桥是用舟船临时组成的“浮桥”","《诗经·大雅·大明》云：“文定厥祥，亲迎于渭"],"q":"专家们认为，我国的桥梁应当出现于原始社会。大约古人受到横木跨水的启发，置条木于河上成为一种独木桥，即最初的“梁桥”，所以“桥梁”二字都带“木”字旁。最早见于文献记载的桥是用舟船临时组成的“浮桥”。《诗经·大雅·大明》云：“文定厥祥，亲迎于渭。造舟为梁，不显其光。”是说周文王为了娶亲，在渭水上用船搭了一座浮桥。后来，这种浮桥用于战争，到战国时已普遍采用。一些外","w":"normal","e":["原书正文"]},{"t":"【原文】我国的古代桥梁，特点主要","y":"教材原文","p":["我国的古代桥梁，特点主要有三个：一是它的地区性，即各种不同的桥形、构造及其用料，都因地区不同而不同","如黄河两岸，自古多都城首府，物"],"q":"我国的古代桥梁，特点主要有三个：一是它的地区性，即各种不同的桥形、构造及其用料，都因地区不同而不同。如黄河两岸，自古多都城首府，物","w":"normal","e":["原书正文"]},{"t":"【原文】资运输多依赖骡马大车、手","y":"教材原文","p":["资运输多依赖骡马大车、手推板车，故平坦宽阔的石拱桥和石梁桥最为适宜","江南水乡，运输以舟船为主，所以遍布凸起的石拱桥","而西南地区，多峡谷急流，难筑桥墩，故多用吊桥","同时，北方和南方的山区，桥墩厚实稳重，称为“厚墩”，以防山洪暴发，冲毁桥梁"],"q":"资运输多依赖骡马大车、手推板车，故平坦宽阔的石拱桥和石梁桥最为适宜；江南水乡，运输以舟船为主，所以遍布凸起的石拱桥；而西南地区，多峡谷急流，难筑桥墩，故多用吊桥。同时，北方和南方的山区，桥墩厚实稳重，称为“厚墩”，以防山洪暴发，冲毁桥梁； 而江南水乡，桥墩纤细轻盈，称为“薄墩”，以利桥下通航。二是它的实用性，即古人造桥，讲究实用，注意发挥桥梁的最大效益。比如","w":"normal","e":["原书正文"]},{"t":"【原文】从美学欣赏的角度去看，我","y":"教材原文","p":["从美学欣赏的角度去看，我国桥梁的艺术风格表现于三个方面：一是造型优美多姿，有的形如长虹，有的状如弯月，有的轻巧欲飞，有的雄壮厚实，各种造型都体现出不同的审美趣味","古典诗词赞美古桥，都首先是从桥的优美的造型开始的","如关于河北省“赵州桥”有一副对联云“水从碧玉环中过，人在苍龙背上行”，把赵州桥的造型和桥下之水比喻为苍龙和碧玉，极富美感","二是桥梁建筑与周围环境的协调，使人工建筑与自然风光融合，这正是中国艺术的特点所在"],"q":"从美学欣赏的角度去看，我国桥梁的艺术风格表现于三个方面：一是造型优美多姿，有的形如长虹，有的状如弯月，有的轻巧欲飞，有的雄壮厚实，各种造型都体现出不同的审美趣味。古典诗词赞美古桥，都首先是从桥的优美的造型开始的。如关于河北省“赵州桥”有一副对联云“水从碧玉环中过，人在苍龙背上行”，把赵州桥的造型和桥下之水比喻为苍龙和碧玉，极富美感。二是桥梁建筑与周围环境的协","w":"normal","e":["原书正文"]},{"t":"【原文】史书上记载较早的历史名桥","y":"教材原文","p":["史书上记载较早的历史名桥，首先是西安市东郊的“灞桥”，它横跨灞水之上，建于春秋时代的秦穆公时期","现存的桥是隋代改建并经历代重修的","灞桥的闻名与我国的历史和文学有关","古长安历代为都城，灞桥是出入长安的必经之地"],"q":"史书上记载较早的历史名桥，首先是西安市东郊的“灞桥”，它横跨灞水之上，建于春秋时代的秦穆公时期。现存的桥是隋代改建并经历代重修的。灞桥的闻名与我国的历史和文学有关。古长安历代为都城，灞桥是出入长安的必经之地。因此，像秦始皇送王翦伐楚、汉高祖刘邦入咸阳、安禄山夺取长安、李自成攻占西安以及因八国联军入京而逃往西安的慈禧太后，都经过了灞桥。古代有折柳送别的风俗，灞","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)第二座历史名桥就是河北省赵县的赵州桥，本名“安济桥”，由隋代石匠李春建造，是全世界最早的敞肩拱桥","赵州桥的建筑巧夺天工，体现了高度科学性和艺术性的结合，因此历代文人学者对它赞不绝口，认为“奇巧固护，甲于天下”，以至产生了神奇的传说，说赵州桥是鲁班所造"],"q":"中国文化要略(第4版)中国文化要略(第4版)第二座历史名桥就是河北省赵县的赵州桥，本名“安济桥”，由隋代石匠李春建造，是全世界最早的敞肩拱桥。赵州桥的建筑巧夺天工，体现了高度科学性和艺术性的结合，因此历代文人学者对它赞不绝口，认为“奇巧固护，甲于天下”，以至产生了神奇的传说，说赵州桥是鲁班所造。","w":"normal","e":["原书正文"]},{"t":"【原文】第二座历史名桥就是河北省","y":"教材原文","p":["第二座历史名桥就是河北省赵县的赵州桥，本名“安济桥”，由隋代石匠李春建造，是全世界最早的敞肩拱桥","赵州桥的建筑巧夺天工，体现了高度科学性和艺术性的结合，因此历代文人学者对它赞不绝口，认为“奇巧固护，甲于天下”，以至产生了神奇的传说，说赵州桥是鲁班所造"],"q":"第二座历史名桥就是河北省赵县的赵州桥，本名“安济桥”，由隋代石匠李春建造，是全世界最早的敞肩拱桥。赵州桥的建筑巧夺天工，体现了高度科学性和艺术性的结合，因此历代文人学者对它赞不绝口，认为“奇巧固护，甲于天下”，以至产生了神奇的传说，说赵州桥是鲁班所造。","w":"normal","e":["原书正文"]}]},{"id":"culture-c11-s02","t":"第二节 农学与医药","w":"high","n":9,"k":[{"t":"齐民要术","y":"名词解释","p":["北魏贾思勰著","现存最早最完整的农学名著","总结黄河流域农业生产经验"],"q":"北魏贾思勰所著，是我国现存最早、最完整的古代农学名著。全书系统总结了黄河中下游地区的农业生产经验，包括耕作、育种、栽培、饲养、加工等技术，被誉为\"中国古代农业百科全书\"。","w":"high","e":["2024 真题"]},{"t":"本草纲目","y":"名词解释","p":["明代李时珍著","收药一千八百余种","总结16世纪前药物学成就"],"q":"明代李时珍所著的中医药学巨著，全书五十二卷，收载药物一千八百余种，附方一万一千余首。该书按纲目体例分类，系统总结了16世纪以前中国的药物学成就，被达尔文誉为\"中国古代的百科全书\"。","w":"high","e":["2018 真题"]},{"t":"天工开物","y":"名词解释","p":["明代宋应星著","1637年刊行","18卷记农业与手工业技术","中国17世纪的工艺百科全书"],"q":"《天工开物》是明代宋应星所著的中国古代综合性科学技术著作，刊于崇祯十年（1637年）。全书18卷，分三编，系统记载了农业和手工业的生产技术，包括谷物加工、纺织、染色、制盐、造纸、冶铸、锤锻、陶瓷、榨油、酿酒、珠玉等，被誉为\"中国17世纪的工艺百科全书\"。","w":"high","e":["2020 真题"]},{"t":"【原文】发展天地； 老百姓的“俗","y":"教材原文","p":["老百姓的“俗文化”扩大发展天地","老百姓的“俗文化”扩大了地盘，使富有民族根基的民间文化了地盘，使富有民族根基的民间文化"],"q":"发展天地； 老百姓的“俗文化”扩大发展天地； 老百姓的“俗文化”扩大了地盘，使富有民族根基的民间文化了地盘，使富有民族根基的民间文化","w":"normal","e":["原书正文"]},{"t":"【原文】262688获得更大的传","y":"教材原文","p":["262688获得更大的传播空间","雅俗文化在公获得更大的传播空间","雅俗文化在公共园林里的交汇，使中国的园林文化共园林里的交汇，使中国的园林文化"],"q":"262688获得更大的传播空间。雅俗文化在公获得更大的传播空间。雅俗文化在公共园林里的交汇，使中国的园林文化共园林里的交汇，使中国的园林文化","w":"normal","e":["原书正文"]},{"t":"【原文】(二) 中国园林艺术的特","y":"教材原文","p":["(二) 中国园林艺术的特点(二) 中国园林艺术的特点概括来说，中国园林艺术的特点主要有三："],"q":"(二) 中国园林艺术的特点(二) 中国园林艺术的特点概括来说，中国园林艺术的特点主要有三：","w":"normal","e":["原书正文"]},{"t":"【原文】第一，追求人与自然的统一","y":"教材原文","p":["第一，追求人与自然的统一和融合","中国园林无一例外的都是艺术地再现自然，都是范山模水，取法天然，为作为生存主体的人创造一个和谐统一的客体环境","它造园的根本思想可以概括为八个字————“虽由人作，宛自天开”，"],"q":"第一，追求人与自然的统一和融合。中国园林无一例外的都是艺术地再现自然，都是范山模水，取法天然，为作为生存主体的人创造一个和谐统一的客体环境。它造园的根本思想可以概括为八个字————“虽由人作，宛自天开”，","w":"normal","e":["原书正文"]},{"t":"【原文】第二，注重体现人的意趣和","y":"教材原文","p":["第二，注重体现人的意趣和精神追求","中国园林虽然是艺术地再现自然，却不是无目的地再现自然，而是在自然景物中寄托一定的理想和信念，借助自然景物来表达园林主人的志向和趣味，以满足人的某种精神追求","因而中国园林大多借景寓情，以景明志，赋予外在的景物以丰富的文化内涵","因自古受神仙思想的影响，皇家园林中多见海上仙山，以体现封建帝王祈求成仙和长享富贵的愿望"],"q":"第二，注重体现人的意趣和精神追求。中国园林虽然是艺术地再现自然，却不是无目的地再现自然，而是在自然景物中寄托一定的理想和信念，借助自然景物来表达园林主人的志向和趣味，以满足人的某种精神追求。因而中国园林大多借景寓情，以景明志，赋予外在的景物以丰富的文化内涵。因自古受神仙思想的影响，皇家园林中多见海上仙山，以体现封建帝王祈求成仙和长享富贵的愿望。北京的中南海、","w":"normal","e":["原书正文"]},{"t":"【原文】传统建筑传统建筑2692","y":"教材原文","p":["传统建筑传统建筑269269第三，在造园手法上讲究含蓄、曲折、变化，反对僵直、单调、一览无余","因此，园林中的景物大多藏而不露，隐而不现","“大观园”的无穷景致，都隐于一进园门的假山之后","绘画讲究“远山无脚，远树无根，远舟无身(只见帆)”，造园也同此理，就是含蓄而有层次"],"q":"传统建筑传统建筑269269第三，在造园手法上讲究含蓄、曲折、变化，反对僵直、单调、一览无余。因此，园林中的景物大多藏而不露，隐而不现。“大观园”的无穷景致，都隐于一进园门的假山之后。绘画讲究“远山无脚，远树无根，远舟无身(只见帆)”，造园也同此理，就是含蓄而有层次。具体来说，造园要充分表现自然的活力，要在有限的空间里显示出自然景物的无限层次； 要在造园时","w":"normal","e":["原书正文"]}]},{"id":"culture-c11-s03","t":"第三节 数学、天文与历法","w":"high","n":10,"k":[{"t":"九章算术","y":"名词解释","p":["东汉成书分九章246题","方田粟米至勾股九类","确立算法为中心的数学体系","负数与方程解法世界领先"],"q":"《九章算术》是中国古代数学的代表作，成书于东汉，全书分九章共246个数学问题，内容包括方田、粟米、衰分、少广、商功、均输、盈不足、方程、勾股。它系统总结了中国先秦至汉代的数学成就，确立了以算法为中心的中国古代数学体系，其中负数概念与联立一次方程组解法居世界领先地位。","w":"high","e":["2017 真题"]},{"t":"授时历","y":"名词解释","p":["元代郭守敬等编制，1281年颁行","回归年365.2425日","与公历相同但早三百年","创制简仪、高表等仪器"],"q":"《授时历》是元代郭守敬、王恂等编制的历法，至元十八年（1281年）颁行。它确定回归年长度为365.2425日，与现行公历（格里高利历）完全相同，但比后者早了三百年。该历废除上元积年，采用实测数据，并创制简仪、高表等天文仪器，是中国古代最精密的历法之一。","w":"normal","e":["核心概念"]},{"t":"梦溪笔谈","y":"名词解释","p":["北宋沈括著","笔记体，二十六卷","记载活字印刷、指南针、石油","中国科学史上的坐标"],"q":"《梦溪笔谈》是北宋沈括所著的笔记体科学著作，成书于元祐年间，因写于润州梦溪园而得名。全书二十六卷（另有补笔谈、续笔谈），内容涉及天文、数学、物理、化学、地理、地质、气象、生物、医药、工程技术、文学、史学、音乐等，其中关于活字印刷、指南针、石油的记载尤为珍贵，被誉为\"中国科学史上的坐标\"。","w":"normal","e":["核心概念"]},{"t":"【原文】安市的岱庙，陕西省华阴市","y":"教材原文","p":["安市的岱庙，陕西省华阴市的西岳庙，山东省邹城市的孟庙，四川省成都市的武侯祠，等等"],"q":"安市的岱庙，陕西省华阴市的西岳庙，山东省邹城市的孟庙，四川省成都市的武侯祠，等等。","w":"normal","e":["原书正文"]},{"t":"【原文】现存的塔有很多，据统计全","y":"教材原文","p":["现存的塔有很多，据统计全国有三千多座，历史达七八百年的少说也有百余座","它基本上属于宗教建筑，而且主要是一种佛教建筑","但在后来的发展中，道教和儒家文士也建塔，有一些塔又建在山水胜地，其性质就接近风景建筑了","佛寺大多建在山清水秀之处，后来往往寺毁塔存，而原来的佛塔也变成了风景点缀之物"],"q":"现存的塔有很多，据统计全国有三千多座，历史达七八百年的少说也有百余座。它基本上属于宗教建筑，而且主要是一种佛教建筑。但在后来的发展中，道教和儒家文士也建塔，有一些塔又建在山水胜地，其性质就接近风景建筑了。佛寺大多建在山清水秀之处，后来往往寺毁塔存，而原来的佛塔也变成了风景点缀之物。它们或挺拔秀丽，或雄峻高耸；或立于山顶，或立于水际；或孤塔雄姿，或双塔对影，有","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)塔起源于印度的“牢堵婆”，汉文译作“浮图”或“浮屠”","它的用途是收藏释迦牟尼的“舍利”(佛骨、佛牙、佛发等)，因此又叫“舍利塔”","后来又用于收藏佛经和埋葬长老，出现了“经塔”“墓塔”，再后来逐渐成为一种纪念性建筑","汉末，它随佛教传入中国"],"q":"中国文化要略(第4版)中国文化要略(第4版)塔起源于印度的“牢堵婆”，汉文译作“浮图”或“浮屠”。它的用途是收藏释迦牟尼的“舍利”(佛骨、佛牙、佛发等)，因此又叫“舍利塔”。后来又用于收藏佛经和埋葬长老，出现了“经塔”“墓塔”，再后来逐渐成为一种纪念性建筑。汉末，它随佛教传入中国。史载洛阳白马寺首先建塔，其塔为木制方形，位于寺院中心，其形制和寺塔布局都不脱印","w":"normal","e":["原书正文"]},{"t":"【原文】塔起源于印度的“牢堵婆”","y":"教材原文","p":["塔起源于印度的“牢堵婆”，汉文译作“浮图”或“浮屠”","它的用途是收藏释迦牟尼的“舍利”(佛骨、佛牙、佛发等)，因此又叫“舍利塔”","后来又用于收藏佛经和埋葬长老，出现了“经塔”“墓塔”，再后来逐渐成为一种纪念性建筑","汉末，它随佛教传入中国"],"q":"塔起源于印度的“牢堵婆”，汉文译作“浮图”或“浮屠”。它的用途是收藏释迦牟尼的“舍利”(佛骨、佛牙、佛发等)，因此又叫“舍利塔”。后来又用于收藏佛经和埋葬长老，出现了“经塔”“墓塔”，再后来逐渐成为一种纪念性建筑。汉末，它随佛教传入中国。史载洛阳白马寺首先建塔，其塔为木制方形，位于寺院中心，其形制和寺塔布局都不脱印度影响。到了唐代，逐渐吸收中国建筑的风格，并","w":"normal","e":["原书正文"]},{"t":"【原文】278278根据塔的造型","y":"教材原文","p":["278278根据塔的造型，一般可以把塔分为五种：“楼阁式”“密檐式”“喇嘛式”“花塔”和“金刚宝座塔”","楼阁式塔仿照我国传统的多层木构架建筑，数量"],"q":"278278根据塔的造型，一般可以把塔分为五种：“楼阁式”“密檐式”“喇嘛式”“花塔”和“金刚宝座塔”。楼阁式塔仿照我国传统的多层木构架建筑，数量","w":"normal","e":["原书正文"]},{"t":"【原文】很多，是我国古塔建筑中的","y":"教材原文","p":["很多，是我国古塔建筑中的主要形式","它采用大型砖石仿木结构，代表如西安大雁塔","这种塔的特点是层与层之间距离大，每层设门窗、斗拱，塔外有飞檐，塔内有楼梯，可以登高远眺","苏州虎丘塔、应县木塔、杭州六和塔、开封铁塔、银川海宝塔都属这一种"],"q":"很多，是我国古塔建筑中的主要形式。它采用大型砖石仿木结构，代表如西安大雁塔。这种塔的特点是层与层之间距离大，每层设门窗、斗拱，塔外有飞檐，塔内有楼梯，可以登高远眺。苏州虎丘塔、应县木塔、杭州六和塔、开封铁塔、银川海宝塔都属这一种。密檐式塔出现于北魏，盛行于辽、金，多用砖石构造。其特点是塔身下部第一层特别高大，辽金时的密檐塔第一层都雕有佛龛、佛像、门窗等。从第","w":"normal","e":["原书正文"]},{"t":"【原文】铁塔，全名为“祐国寺塔”","y":"教材原文","p":["铁塔，全名为“祐国寺塔”，琉璃呈铁色，仿木结构，楼阁式，八角十三层，高57米，宋皇祐元年(1049年) 建","现存最高的铁塔是山东省济宁市铁塔，八角形，宋代建为七级，明代增为九级，高23.8米，铁壳砖心，仿木结构","除这些单塔以外，还有太原双塔、宁夏拜寺口双塔、云南大理三塔、青海塔尔寺如来八塔、宁夏青铜峡一百零八塔，都是塔建筑的奇观"],"q":"铁塔，全名为“祐国寺塔”，琉璃呈铁色，仿木结构，楼阁式，八角十三层，高57米，宋皇祐元年(1049年) 建；现存最高的铁塔是山东省济宁市铁塔，八角形，宋代建为七级，明代增为九级，高23.8米，铁壳砖心，仿木结构。除这些单塔以外，还有太原双塔、宁夏拜寺口双塔、云南大理三塔、青海塔尔寺如来八塔、宁夏青铜峡一百零八塔，都是塔建筑的奇观。","w":"normal","e":["原书正文"]}]},{"id":"culture-c11-s04","t":"第四节 水利工程","w":"normal","n":8,"k":[{"t":"都江堰","y":"名词解释","p":["战国李冰父子主持修建","鱼嘴、飞沙堰、宝瓶口三大主体","无坝引水，自动分水排沙","使成都平原成为天府之国"],"q":"都江堰是战国时期秦国蜀郡守李冰父子主持修建的大型无坝引水灌溉工程，约建于公元前256年至前251年，位于四川灌县岷江之上。工程由鱼嘴分水堤、飞沙堰溢洪道、宝瓶口引水口三大主体构成，实现了自动分水、排沙、控流。两千多年来一直发挥效益，使成都平原成为\"天府之国\"，是世界水利史上的杰作。","w":"normal","e":["核心概念"]},{"t":"【原文】厚1.2米，庙毁后夹于居","y":"教材原文","p":["厚1.2米，庙毁后夹于居民住宅的隔墙之内，近年才被发现","湖北省襄阳市“绿影壁”，原为明代襄王府前的照壁，以石料刻砌而成，壁面为二龙戏珠"],"q":"厚1.2米，庙毁后夹于居民住宅的隔墙之内，近年才被发现。湖北省襄阳市“绿影壁”，原为明代襄王府前的照壁，以石料刻砌而成，壁面为二龙戏珠。","w":"normal","e":["原书正文"]},{"t":"【原文】上海市松江区城隍庙前的照","y":"教材原文","p":["上海市松江区城隍庙前的照壁也是明代建造的，壁面以一头怪兽为主，此兽名“猗”，鹿角、狮尾、牛蹄、龙鳞，传说此兽贪婪无比，妄图吞日，掉"],"q":"上海市松江区城隍庙前的照壁也是明代建造的，壁面以一头怪兽为主，此兽名“猗”，鹿角、狮尾、牛蹄、龙鳞，传说此兽贪婪无比，妄图吞日，掉","w":"normal","e":["原书正文"]},{"t":"【原文】壁都是清代建造的，规模也","y":"教材原文","p":["壁都是清代建造的，规模也不小，但其精美程度与大同九龙壁不可同日而语"],"q":"壁都是清代建造的，规模也不小，但其精美程度与大同九龙壁不可同日而语。","w":"normal","e":["原书正文"]},{"t":"【原文】在我国现存的古建筑中，还","y":"教材原文","p":["在我国现存的古建筑中，还有两种值得一提，即衙署与会馆","“衙署”也称“衙门”，是封建官吏施政的场所，它的功能是政治性的","“会馆”是文人和商人活动的场所，它的功能是经济和文化性的","两种建筑的性能并无共同之处，但它们的存在却给我们提供了一个子解旧有社会结构的机会"],"q":"在我国现存的古建筑中，还有两种值得一提，即衙署与会馆。“衙署”也称“衙门”，是封建官吏施政的场所，它的功能是政治性的；“会馆”是文人和商人活动的场所，它的功能是经济和文化性的。两种建筑的性能并无共同之处，但它们的存在却给我们提供了一个子解旧有社会结构的机会。","w":"normal","e":["原书正文"]},{"t":"【原文】衙署古已有之，是从古代“","y":"教材原文","p":["衙署古已有之，是从古代“牙门”演变来的一个名称","古代将军领兵在外，树大旗以表示营门","由于旗上装饰象牙，这种军旗便称为“牙旗”，因而营门被称为“牙门”","后来文官的办公处也习称“牙门”"],"q":"衙署古已有之，是从古代“牙门”演变来的一个名称。古代将军领兵在外，树大旗以表示营门。由于旗上装饰象牙，这种军旗便称为“牙旗”，因而营门被称为“牙门”。后来文官的办公处也习称“牙门”。因“牙”“衙”二字同音，后世通称“衙门”。从有关文献记载看，至少在宋代已经把官署称作衙门了。","w":"normal","e":["原书正文"]},{"t":"【原文】传统建筑传统建筑2852","y":"教材原文","p":["传统建筑传统建筑285285较早的衙署建筑因为没有可供参考的资料，我们无法想象它的基本面貌","从地方志所载的衙署平面图来看，明清时代的衙署大都是三进院落的建筑群，布局类似缩小了的皇宫","当然，各项建筑要低得多，规模也小得多","各地衙署在清朝灭亡以后都陆续改为他用，因而原貌不存了"],"q":"传统建筑传统建筑285285较早的衙署建筑因为没有可供参考的资料，我们无法想象它的基本面貌。从地方志所载的衙署平面图来看，明清时代的衙署大都是三进院落的建筑群，布局类似缩小了的皇宫。当然，各项建筑要低得多，规模也小得多。各地衙署在清朝灭亡以后都陆续改为他用，因而原貌不存了。所幸河南省内乡县县衙、叶县县衙，山西省平遥县县衙、霍州署衙，河北省保定市直隶总督署还保","w":"normal","e":["原书正文"]},{"t":"【原文】内乡县衙始建于元大德八年","y":"教材原文","p":["内乡县衙始建于元大德八年(1304年)，现存是清光绪二十二年(1896年) 扩建维修的","它的基本格局是三进院落，前衙后宅","进入县衙大门，经百米青石甬道，即为大堂，是知县审理大案、要案，迎接圣旨、钦差及上级官员的地方","堂内正中为暖阁，为知县升堂之处，两侧置刑具、兵器，堂下两块跪石，左为原告，右为被告"],"q":"内乡县衙始建于元大德八年(1304年)，现存是清光绪二十二年(1896年) 扩建维修的。它的基本格局是三进院落，前衙后宅。进入县衙大门，经百米青石甬道，即为大堂，是知县审理大案、要案，迎接圣旨、钦差及上级官员的地方。堂内正中为暖阁，为知县升堂之处，两侧置刑具、兵器，堂下两块跪石，左为原告，右为被告。大堂后东西为皂房，是三班衙役值班的地方。中有重光门，门内为琴","w":"normal","e":["原书正文"]}]},{"id":"culture-c11-s05","t":"第五节 科技发展滞缓原因","w":"normal","n":7,"k":[{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)290290目前，在全国引人注目的民居是山西晋商的一些院落住宅，集中于晋中一带，是由许多大小四合院组成的大型院落","这些院落以其规模宏大、建筑精美、风格独特，蕴含着深厚的文化意蕴，在中国传统建筑中显示出夺目的光彩，近年来日益引起中外人士的浓厚兴趣，前往参观者络绎不绝","其中如祁县的“乔家大院”(又名“在中堂”) 和“渠家大院”、太谷县的“曹家大院”(又名“三多堂”)、平遥的“日升昌”大院、灵石的“王家大院”、榆次的“常家大院”等均可称“北方民居建筑中的明珠”"],"q":"中国文化要略(第4版)中国文化要略(第4版)290290目前，在全国引人注目的民居是山西晋商的一些院落住宅，集中于晋中一带，是由许多大小四合院组成的大型院落。这些院落以其规模宏大、建筑精美、风格独特，蕴含着深厚的文化意蕴，在中国传统建筑中显示出夺目的光彩，近年来日益引起中外人士的浓厚兴趣，前往参观者络绎不绝。其中如祁县的“乔家大院”(又名“在中堂”) 和“渠","w":"normal","e":["原书正文"]},{"t":"【原文】目前，在全国引人注目的民","y":"教材原文","p":["目前，在全国引人注目的民居是山西晋商的一些院落住宅，集中于晋中一带，是由许多大小四合院组成的大型院落","这些院落以其规模宏大、建筑精美、风格独特，蕴含着深厚的文化意蕴，在中国传统建筑中显示出夺目的光彩，近年来日益引起中外人士的浓厚兴趣，前往参观者络绎不绝","其中如祁县的“乔家大院”(又名“在中堂”) 和“渠家大院”、太谷县的“曹家大院”(又名“三多堂”)、平遥的“日升昌”大院、灵石的“王家大院”、榆次的“常家大院”等均可称“北方民居建筑中的明珠”"],"q":"目前，在全国引人注目的民居是山西晋商的一些院落住宅，集中于晋中一带，是由许多大小四合院组成的大型院落。这些院落以其规模宏大、建筑精美、风格独特，蕴含着深厚的文化意蕴，在中国传统建筑中显示出夺目的光彩，近年来日益引起中外人士的浓厚兴趣，前往参观者络绎不绝。其中如祁县的“乔家大院”(又名“在中堂”) 和“渠家大院”、太谷县的“曹家大院”(又名“三多堂”)、平遥的","w":"normal","e":["原书正文"]},{"t":"【原文】一是由蜀郡太守李冰主持兴","y":"教材原文","p":["一是由蜀郡太守李冰主持兴建的“都江堰”，在现在四川省成都平原的都江堰市","李冰和民工经过测量，首先凿通了挡住岷江水路的玉垒山，称为“宝瓶口”，然后在宝瓶口上流筑堤，修建成“分水鱼嘴”和“飞沙堰”","前者将江水分为内、外二江，外江为岷江正流，内江则从宝瓶口进入灌溉渠","后者用来调节水量大小"],"q":"一是由蜀郡太守李冰主持兴建的“都江堰”，在现在四川省成都平原的都江堰市。李冰和民工经过测量，首先凿通了挡住岷江水路的玉垒山，称为“宝瓶口”，然后在宝瓶口上流筑堤，修建成“分水鱼嘴”和“飞沙堰”。前者将江水分为内、外二江，外江为岷江正流，内江则从宝瓶口进入灌溉渠；后者用来调节水量大小。这一工程，使岷江水流化险为夷，变害为利，川西平原的万亩农田千年受益。直到现在","w":"normal","e":["原书正文"]},{"t":"【原文】传统建筑传统建筑二是由战","y":"教材原文","p":["传统建筑传统建筑二是由战国时期韩国水工郑国修建的“郑国渠”，在现在陕西省泾阳县境内，全长300余里","相传郑国本为韩国间谍，开凿此渠的目的，是为了消耗秦国的人力、物力和财力，后被识破","秦国要杀死他，他对秦始皇说：“始臣为间，然渠成亦秦之利也","臣为韩延数岁之命，而为秦建万世之功"],"q":"传统建筑传统建筑二是由战国时期韩国水工郑国修建的“郑国渠”，在现在陕西省泾阳县境内，全长300余里。相传郑国本为韩国间谍，开凿此渠的目的，是为了消耗秦国的人力、物力和财力，后被识破。秦国要杀死他，他对秦始皇说：“始臣为间，然渠成亦秦之利也。臣为韩延数岁之命，而为秦建万世之功。”始皇见他说得有理，命他继续施工。果然渠成之后，“关中成沃野，无凶年，秦以富强，卒并","w":"normal","e":["原书正文"]},{"t":"【原文】二是由战国时期韩国水工郑","y":"教材原文","p":["二是由战国时期韩国水工郑国修建的“郑国渠”，在现在陕西省泾阳县境内，全长300余里","相传郑国本为韩国间谍，开凿此渠的目的，是为了消耗秦国的人力、物力和财力，后被识破","秦国要杀死他，他对秦始皇说：“始臣为间，然渠成亦秦之利也","臣为韩延数岁之命，而为秦建万世之功"],"q":"二是由战国时期韩国水工郑国修建的“郑国渠”，在现在陕西省泾阳县境内，全长300余里。相传郑国本为韩国间谍，开凿此渠的目的，是为了消耗秦国的人力、物力和财力，后被识破。秦国要杀死他，他对秦始皇说：“始臣为间，然渠成亦秦之利也。臣为韩延数岁之命，而为秦建万世之功。”始皇见他说得有理，命他继续施工。果然渠成之后，“关中成沃野，无凶年，秦以富强，卒并诸侯”。以后历代","w":"normal","e":["原书正文"]},{"t":"【原文】919122三是由秦将史","y":"教材原文","p":["919122三是由秦将史禄开凿的“灵渠”，在现在广西壮族自治区兴安县，凿于公元前223 年至前214年","当时因两广交通不便，秦始皇为统一岭南，调动军队和军需，命史禄将湘、漓二水沟通，纳入长江和珠江两大水系","灵渠全长34公里，使当时的水路可以直达今天的广州","灵渠工程由大小天平、铧嘴、南北渠、秦堤、泄水天平及陡门等30多处工程组成完整的防洪、泄洪、航运、灌溉体系，附近的许多祠墓古迹更增加了它的历史风采"],"q":"919122三是由秦将史禄开凿的“灵渠”，在现在广西壮族自
