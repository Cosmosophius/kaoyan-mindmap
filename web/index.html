合……③任务层层递进……④以做促学……任务设计时要考虑三个具体程序：①任务前活动……②完成任务的活动……③任务后活动。","w":"high","e":["教材高频"]},{"t":"下列教学法中，属于交际型教学法的是（　）。","y":"单项选择题","p":["交际型教学法产生于20世纪60年代，包括功能法、任务式教学法、内容教学法、3P教学法等。","传统教学法包括语法——翻译法、阅读法、直接法、听说法、认知法、全身反应法。","人本主义教学法包括静默法、启示法、咨询法。","创新型教学法包括全语言教学法、体裁教学法、“四位一体”教学法。"],"q":"第四节 交际型教学法 交际型教学法产生于20世纪60年代。当时传统教学法受到冷遇，以交际为导向的教学法应运而生。交际型教学法有几类, 英文可以统称为 Communicative Teaching Ap- proach。","w":"normal","e":["核心考点"]},{"t":"信息差","y":"名词解释","p":["要合理制造信息差，使交际双方占有信息不一样。","如在听说练习时，一组学生出去，另一组学生在教室听录音，然后让出去的学生进来，分别询问录音内容。","卡片法：给交际双方不同的卡片，上面写着不同的内容，让学生根据不同的指引进行交际。"],"q":"要合理制造信息差(information gap)，使交际双方占有信息不一样。如在听说练习时，一组学生出去，另一组学生在教室听录音。然后让出去的学生进来，分别询问录音内容。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c02-s05","t":"第五节 创新型教学法","w":"normal","n":3,"k":[{"t":"全语言教学法","y":"名词解释","p":["全语言教学法认为，语言教学面对的是全学习者，包括需要、兴趣、特长及弱点。","全语言教学需要全教师，全教师在学生眼中不是权威，而是朋友。","全语言是指语言的各个方面，包括全文及全语言技能；全语言教学需要全方法，还包括全语言环境。"],"q":"全语言教学法认为，语言教学面对的是全学习者 (whole learner)，包括需要、兴趣、特长及弱点。……全语言教学需要的是全教师 (whole teacher)。……全语言教学需要全方法(whole methods)。","w":"normal","e":["核心考点"]},{"t":"体裁教学法","y":"名词解释","p":["体裁教学法产生于20世纪80年代中期，指在课堂教学中自觉运用体裁分析理论而产生的一种教学方法。","主要包括六个步骤：体裁分析，模仿分析，小组讨论，独立分析，深入分析，模仿写作。","主要用于写作教学。"],"q":"体裁教学法 (Genre-based Teaching Approach) 产生于20 世纪80年代中期, 指在课堂教学中自觉运用体裁分析理论而产生的一种教学方法。体裁教学法主要包括六个步骤：体裁分析，模仿分析，小组讨论，独立分析，深入分析，模仿写作。","w":"normal","e":["核心考点"]},{"t":"“四位一体”教学法","y":"名词解释","p":["“四位一体”教学法也叫4P教学法。","其基本特点是：以知识为基础，以学习为中心，以质量为导向，以素养为目的。","教学原则：“循序渐进、阶段侧重、精讲精炼、五技并举”。"],"q":"“四位一体”教学法也叫4P教学法，其基本特点是：以知识为基础，以学习为中心，以质量为导向，以素养为目的。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c02-s06","t":"第六节 教学法的发展趋势","w":"normal","n":3,"k":[{"t":"折衷主义","y":"名词解释","p":["折衷主义指在行为主义教学法和心灵主义教学法之间的调和。","自20世纪20年代以来，折衷主义的教学法有混合法、综合法、折衷法等。","其教学原则基本上都存在于其他教学法中，折衷法不过是东拿一点，西拉一点，把它们凑在一起。","折衷法认为应当博采各家之长，根据不同的教学实际使用不同的教学法。"],"q":"折衷主义指在行为主义教学法和心灵主义教学法之间的调和。自20世纪20年代以来，折衷主义的教学法有混合法、综合法、折衷法等。……折衷法认为应当博采各家之长，根据不同的教学实际使用不同的教学法。","w":"normal","e":["核心考点"]},{"t":"简述语言教学法跟心理学、语言学、教育学等学科发展的互动关系。","y":"简答题","p":["跟心理学：教学法的产生往往有其心理学基础，如语法——翻译法的心理学基础是官能心理学，直接法的心理学依据是联结主义心理学和幼儿语言习得论，听说法的理论基础是行为主义心理学，认知法的依据是认知心理学。","跟语言学：许多教学法都有其语言学基础，如语法——翻译法的基础是传统语法，听说法的基础是描写语言学，认知法的依据是转换生成语法。","跟教育学：静默法、咨询法的产生，跟以学生为中心的教育理论的出现和成熟有不可分割的关联。"],"q":"语言教学法跟心理学的发展关系最密切。首先，教学法的产生往往有其心理学基础。如语法一翻译法的心理学基础是官能心理学，直接法的心理学依据是联结主义心理学和幼儿语言习得论，听说法的理论基础是行为主义心理学，认知法的依据是认知心理学。","w":"normal","e":["核心考点"]},{"t":"综合化倾向","y":"名词解释","p":["所谓“综合”，指在全面认识二语教学的基础上，把某些教学法中某些理论、原则抽出来，按一定的优化组合规则搭配起来，注入新鲜成分，生成一种带新质的方法和体系。","20世纪60年代产生的自觉实践法，70年代产生的功能法，都可以说是综合的典型。","自觉实践法由苏联心理学家别良耶夫创立，教学原则是自觉性原则、综合性原则。"],"q":"所谓“综合”，指在全面认识二语教学的基础上，把某些教学法中某些理论、原则抽出来，按一定的优化组合规则搭配起来，注入新鲜成分，生成一种带新质的方法和体系。20世纪60年代产生的自觉实践法，70年代产生的功能法，都可以说是综合的典型。","w":"normal","e":["核心考点"]}]}]},{"id":"rumen-c03","t":"第三章 课堂教学","w":"high","s":[{"id":"rumen-c03-s01","t":"第一节 备课","w":"high","n":10,"k":[{"t":"备课","y":"名词解释","p":["备课是保证教学质量的关键。","主要包括两个工作：了解与上课相关的信息，编写教案。","上课前教师应调查学生的基本情况，如母语、目标语水平、学习经历、学能、兴趣等。"],"q":"备课是保证教学质量的关键。主要包括两个工作：了解与上课相关的信息，编写教案。","w":"high","e":["教材高频"]},{"t":"教案","y":"名词解释","p":["教案是体现教学设计理念的“导演脚本”，是课堂教学的蓝本。","写教案，是明确教学目标、优化教学法、设计教学活动的过程，是上课前的预演。","编写教案的核心，是考虑如何在有限时间内科学安排教学内容，合理使用教学技能，以达到教学效果的最大化。"],"q":"教案是体现教学设计理念的“导演脚本”，是课堂教学的蓝本。写教案，是明确教学目标、优化教学法、设计教学活动的过程，是上课前的预演，是教师研究、改进教学法的主要活动。","w":"high","e":["教材高频"]},{"t":"简述教案编写的步骤。","y":"简答题","p":["(1)明确教学目标：明确每节课结束时，学生应掌握什么语言点，会用哪些词语和句式，能运用哪些交际功能。","(2)确定教学内容：做到主次分明、重点突出。①列出学生必须知道的内容；②找出核心内容和学生必须掌握的知识、技能；③确定讲什么、讲多少。","(3)设计内容结构：最重要的内容，应安排在学生注意力最集中的时间。","(4)合理安排各部分内容的教学时间，考虑时间不够或有余时的取舍。","(5)根据教学内容设计课堂活动，重视根据教学内容设计形式丰富的课堂活动。","(6)教学内容要让学生能够听懂，而不是看懂。","(7)注意做标记，对重点、难点(如新语言点规则、公式)、过渡部分指令性语句等做醒目标记。"],"q":"(1) 明确教学目标……(2) 确定教学内容……(3) 设计内容结构……(4) 合理安排各部分内容的教学时间……(5) 根据教学内容设计课堂活动……(6) 教学内容要让学生能够听懂，而不是看懂……(7) 注意做标记。","w":"high","e":["教材高频"]},{"t":"教案的核心是设计____。","y":"填空题","p":["教案的核心是设计教学环节。","教学环节通常由教师发出一系列指令性语句连贯而成。","如汉语综合课教学环节，通常由“复习旧课”“学习新课”和“布置作业”组成。"],"q":"教案的核心是设计教学环节。教学环节通常由教师发出一系列指令性语句连贯而成。如汉语综合课教学环节，通常由“复习旧课”“学习新课”和“布置作业”组成。","w":"normal","e":["核心考点"]},{"t":"备课主要包括两个工作：了解与上课相关的信息和____。","y":"填空题","p":["备课是保证教学质量的关键。主要包括两个工作：了解与上课相关的信息，编写教案。","上课前教师应调查学生的基本情况，如母语、目标语水平、学习经历、学能、兴趣等。"],"q":"备课是保证教学质量的关键。主要包括两个工作：了解与上课相关的信息，编写教案。","w":"normal","e":["核心考点"]},{"t":"下列不属于教案一般包含的内容是（　）。","y":"单项选择题","p":["教案一般包含以下内容：教学单元(注明使用的教材)、教学对象(班级、人数、汉语水平)、教学目的、教学重点和难点、教学时数、教学环节或教学过程(包括内容、步骤方法、时间分配等)。","还包括补充练习及课堂活动、板书设计(包括多媒体课件)、作业及课外活动安排、经验和问题(课后填写)。"],"q":"教案一般包含以下内容：教学单元 (注明使用的教材)、教学对象(班级、人数、汉语水平)、教学目的、教学重点和难点、教学时数、教学环节或教学过程(包括内容、步骤方法、时间分配等)、补充练习及课堂活动、板书设计 (包括多媒体课件)、作业及课外活动安排、经验和问题 (课后填写)。","w":"normal","e":["核心考点"]},{"t":"联系实际，谈谈备课前要了解哪些信息，以及如何根据这些信息编写教案。","y":"论述题","p":["了解学生信息：上课前教师应调查学生的基本情况，如母语、目标语水平、学习经历、学能、兴趣等，可以查看成绩单，向前任教师了解等，使教学设计具有针对性。","了解课程信息：课程的基本信息(课程在课程体系中的地位、对学生语言能力的要求、跟其他课程和后续课程的关系)和课程的相关信息，最重要的是明确教学目标。","了解课程教材：备课前先要通读教材，了解教学法基础、体例和结构，领会编写者意图；了解语言点的编排、生词的顺序和解释，熟悉练习形式。","编写教案：教案是体现教学设计理念的“导演脚本”，是课堂教学的蓝本。要按照明确教学目标、确定教学内容、设计内容结构、合理安排教学时间、设计课堂活动、让学生听懂、注意做标记七个步骤编写。","教案形式可灵活多样，对新手教师，教案应尽可能详细；对熟手教师和专家教师，教案可以简略一些。"],"q":"备课是保证教学质量的关键。主要包括两个工作：了解与上课相关的信息，编写教案。……(一) 了解学生信息……(二) 了解课程信息……(三) 了解课程教材……二、编写教案……编写教案的核心，是考虑如何在有限时间内科学安排教学内容。","w":"high","e":["教材高频"]},{"t":"教案","y":"名词解释","p":["教案是体现教学设计理念的“导演脚本”，是课堂教学的蓝本","写教案，是明确教学目标、优化教学法、设计教学活动的过程，是上课前的预演，是教师研究、改进教学法的主要活动","编写教案的核心，是考虑如何在有限时间内科学安排教学内容，合理使用教学技能，以达到教学效果的最大化","教案一般包含教学单元、教学对象、教学目的、教学重点和难点、教学时数、教学环节或教学过程、补充练习及课堂活动、板书设计、作业及课外活动安排、经验和问题等内容"],"q":"教案是体现教学设计理念的“导演脚本”①，是课堂教学的蓝本。写教案，是明确教学目标、优化教学法、设计教学活动的过程，是上课前的预演。","w":"normal","e":["核心考点"]},{"t":"简述备课的主要工作内容。","y":"简答题","p":["备课包括两个工作：了解与上课相关的信息、编写教案","了解学生信息（母语、目标语水平、学习经历、学能、兴趣等）","了解课程信息（课程基本信息与相关信息，最重要的是明确教学目标）","了解课程教材（通读教材，参考其他教材）","编写教案"],"q":"备课是保证教学质量的关键。主要包括两个工作：了解与上课相关的信息，编写教案。","w":"normal","e":["核心考点"]},{"t":"简述教案编写的基本步骤。","y":"简答题","p":["明确教学目标","确定教学内容","设计内容结构","合理安排各部分内容的教学时间","根据教学内容设计课堂活动","教学内容要让学生能够听懂而不是看懂","注意做标记并做好课后备注"],"q":"(1) 明确教学目标……(2) 确定教学内容……(3) 设计内容结构……(4) 合理安排各部分内容的教学时间……(5) 根据教学内容设计课堂活动……(6) 教学内容要让学生能够听懂，而不是看懂……(7) 注意做标记。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c03-s02","t":"第二节 讲述与倾听技能","w":"normal","n":4,"k":[{"t":"讲述技能","y":"名词解释","p":["讲述，是用口语向学生讲授知识，使学生理解的最常用的教学行为。","讲标准普通话是有效讲述的基本要求，汉语教师要注意纠正、减少方音和外语口音。","语速要根据教学对象和内容运用合适的语速，零起点、初级班，语速要慢一些。","表述要浅显易懂，尽量用学生学过的词汇、句式讲解。"],"q":"讲述，是用口语向学生讲授知识，使学生理解的最常用的教学行为。对教师来说，掌握讲述技能至关重要。……教学应该“以学生为中心，精讲巧练”……浅显易懂的讲解非常重要。","w":"normal","e":["核心考点"]},{"t":"倾听意味着积极的赏识，倾听就是把学习的主动权交还给学生，让学生多操练、多讨论。","y":"判断题","p":["倾听意味着积极的赏识。倾听就是把学习的主动权交还给学生，让学生多操练、多讨论。","在学生回答问题时，教师要用期待的眼神注视他，用心听，不要听错学生的答案。","倾听过程中一般不要随意打断，尤其不要草率评价。"],"q":"倾听意味着积极的赏识。倾听就是把学习的主动权交还给学生，让学生多操练、多讨论。……倾听过程中一般不要随意打断，尤其不要草率评价。","w":"normal","e":["核心考点"]},{"t":"倾听与反馈技能包括哪些方面?","y":"简答题","p":["(1)平等与尊重：课堂教学中的师生对话，应体现师生平等的原则，细心聆听学生的发言，让学生感觉到自己是受尊重的。","(2)赏识与期待：倾听意味着积极的赏识，把学习的主动权交还给学生，让学生多操练、多讨论。","(3)参与和反馈：倾听过程中，要敏锐判断学生是否已掌握所学内容，要根据学生的语言水平、学习能力、特点采取不同的策略；对学习能力弱的学生，要适当提示，合理引导；对学习能力强的学生，也要指出其不足，提出更高的要求。"],"q":"善于倾听，科学地倾听，是汉语教师需要掌握的基本功之一。(一) 平等与尊重……(二) 赏识与期待……(三) 参与和反馈。","w":"normal","e":["核心考点"]},{"t":"讲述技能","y":"名词解释","p":["讲述是用口语向学生讲授知识，使学生理解的最常用的教学行为","对教师来说，掌握讲述技能至关重要，主要包括语音、语速和语调，以及表述要浅显易懂两个方面","讲标准普通话是有效讲述的基本要求","语速要根据教学对象和内容运用合适的语速","语调要带给学生亲切感、确信感，根据教学内容运用不同语调、抑扬顿挫"],"q":"讲述，是用口语向学生讲授知识，使学生理解的最常用的教学行为。对教师来说，掌握讲述技能至关重要。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c03-s03","t":"第三节 提问与组织讨论技能","w":"high","n":10,"k":[{"t":"垂直结构","y":"名词解释","p":["在互动过程中，教师应有意识地提供垂直结构，让学生通过借用前面话语中的成分、句型来组句回答。","如果发现问题太难，应立即调整，化难为易，分解难点，促进互动。","学生可以充分利用垂直结构，从前边话语中借用一些词语进行思考和会话。"],"q":"在互动过程中，教师应有意识地提供垂直结构，让学生通过借用前面话语中的成分、句型来组句回答。如果发现问题太难，应立即调整，化难为易，分解难点，促进互动。","w":"high","e":["教材高频"]},{"t":"课堂提问过程中要注意哪些问题?","y":"简答题","p":["(1)提问要有针对性和区分度：针对教学目的和学生整体水平，针对学生的个体差异设计难易度不同的问题。","(2)多角度、多方式地提问：从多个角度提出不同的问题，促使学生通过垂直结构建立表义完整的水平结构句式。","(3)变换提问方式，引出不同句式。","(4)提问要能激发学生的兴趣：问题最好贴近学生生活，能满足现实的交际需要。","(5)叫答方式灵活多样：指定叫答和自由叫答两种，指定叫答又分规则叫答、随机叫答。","(6)叫答要面向全部学生：尤其不要忽略那些性格内向、基础不好的学生。"],"q":"提问过程包括：教师发问，等待，叫答，学生回答，教师反馈。……(一) 提问要有针对性和区分度……(二) 多角度、多方式地提问……(三) 变换提问方式，引出不同句式……(四) 提问要能激发学生的兴趣……(五) 叫答方式灵活多样……(六) 叫答要面向全部学生。","w":"high","e":["教材高频"]},{"t":"组织讨论技能","y":"名词解释","p":["课堂讨论是生生互动的主要形式，讨论主题应周全考虑，精心准备，符合学生的语言水平。","一般分为小组(两人)、中组(三四人)、大组(五六人)，最好是不同国籍的学生组合在一起。","学生是讨论的主角，教师仅仅是个导演。讨论时教师要倾听，做必要的记录，并根据情况适时适量介入讨论。"],"q":"课堂讨论是生生互动的主要形式。讨论主题应周全考虑，精心准备，符合学生的语言水平，能激发学生的表达欲望。一般分为小组 (两人)、中组(三四人)、大组 (五六人)。","w":"normal","e":["核心考点"]},{"t":"在讲解、分析语段、语篇时，比较适合的叫答方式是（　）。","y":"单项选择题","p":["指定叫答，又分规则叫答、随机叫答两种。规则叫答可减轻学生的焦虑感，但有的学生只想着自己要回答的问题，不听别人的发言。","随机叫答可以使所有学生一直集中注意力，学习效率高；但可能会让学生过于紧张。","两种方法可交替进行：读生词、课文和替换练习时，可规则叫答；讲解、分析语段、语篇时，可随机叫答。"],"q":"两种方法可交替进行：读生词、课文和替换练习时，可规则叫答； 讲解、分析语段、语篇时，可随机叫答。","w":"normal","e":["核心考点"]},{"t":"教师介入、干预课堂讨论有哪几种情况?","y":"简答题","p":["(1)发言冷场时，教师弄清原因，提一些有趣又容易回答的问题使讨论升温。","(2)学生在枝节问题上花太多时间，教师提醒学生回到讨论主题。","(3)个别学生发言长而且表意不清楚时，教师应请他概括要点后转问其他人的意见。","(4)个别同学不参与讨论时，教师可提出跟他密切相关的问题，引导其发表看法。","(5)出现争执时，教师要调和矛盾，不偏不倚，引导学生认识共同之处，化解冲突。"],"q":"介入、干预讨论有几种情况：(1) 发言冷场时……(2) 学生在枝节问题上花太多时间，教师提醒学生回到讨论主题。(3) 个别学生发言长而且表意不清楚时……(4) 个别同学不参与讨论时……(5) 出现争执时……","w":"normal","e":["核心考点"]},{"t":"如果一节课教师只是和少数学生互动，教学就是失败的。","y":"判断题","p":["课堂教学由师生共同完成。教学能否成功，跟以下因素有关：学生是否参与?多少学生参与?以何种方式参与?","如果一节课教师只是和少数学生互动，教学就是失败的。","要求教师准备难度不同的问题提问不同的学生，引导全体学生参与教学互动。"],"q":"课堂教学由师生共同完成。教学能否成功，跟以下因素有关：学生是否参与? 多少学生参与? 以何种方式参与? 如果一节课教师只是和少数学生互动，教学就是失败的。","w":"normal","e":["核心考点"]},{"t":"课堂提问应注意哪些问题？","y":"简答题","p":["提问要有针对性和区分度","多角度、多方式地提问","变换提问方式，引出不同句式","提问要能激发学生的兴趣","叫答方式灵活多样（指定叫答与自由叫答）","叫答要面向全部学生"],"q":"提问是一种重要的教学技能。好的提问能加强交流，激发学习兴趣，活跃课堂气氛，调控教学进程。……提问过程包括：教师发问，等待，叫答，学生回答，教师反馈。","w":"normal","e":["核心考点"]},{"t":"垂直结构","y":"名词解释","p":["垂直结构是与水平结构相对的概念，指在课堂互动中，教师有意识地提供话语支持，让学生通过借用前面话语中的成分、句型来组句回答的结构方式","如果问题太难，教师应立即调整，化难为易、分解难点，促进互动，把回答难题时的思维过程一步一步展示出来，学生可以充分利用垂直结构，从前边话语中借用一些词语进行思考和会话，从而说出表义完整的水平结构句式"],"q":"在互动过程中，教师应有意识地提供垂直结构，让学生通过借用前面话语中的成分、句型来组句回答。如果发现问题太难，应立即调整，化难为易，分解难点，促进互动。","w":"normal","e":["核心考点"]},{"t":"简述组织课堂讨论的技能。","y":"简答题","p":["课堂讨论是生生互动的主要形式，主题要符合学生水平","分组：小组（两人）、中组（三四人）、大组（五六人），最好不同国籍组合","教师要先让学生明白自己的角色，倾听并做记录，适时介入","介入情形：冷场、枝节问题、发言冗长不清、有人不参与、出现争执","介入原则：调和矛盾、不偏不倚、引导共同点、化解冲突"],"q":"课堂讨论是生生互动的主要形式。……介入、干预讨论有几种情况：(1) 发言冷场时……(5) 出现争执时，教师要调和矛盾，不偏不倚，引导学生认识共同之处，化解冲突。","w":"normal","e":["核心考点"]},{"t":"叫答方式有______和______两种，前者又分规则叫答和随机叫答。","y":"填空题","p":["指定叫答","自由叫答"],"q":"叫答方式有指定叫答和自由叫答两种。指定叫答，又分规则叫答、随机叫答两种。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c03-s04","t":"第四节 非语言表达技能","w":"normal","n":5,"k":[{"t":"非语言表达技能","y":"名词解释","p":["非语言表达自成系统，如手势表达系统、面部表达系统、眼神表达系统、体态表达系统等。","合理运用非语言表达技能，可达到意想不到的教学效果。","包括手势表达、面部表达、眼神表达、教态等方面。"],"q":"非语言表达自成系统，如手势表达系统、面部表达系统、眼神表达系统、体态表达系统等。合理运用非语言表达技能，可达到意想不到的教学效果。","w":"normal","e":["核心考点"]},{"t":"教态","y":"名词解释","p":["教态指教师在教学中表现出的仪表、举止、风度等。","教态好的教师，能赢得学生的尊敬和喜爱，激发学生的学习积极性。","教师在课堂上的举止要自然、亲切，可调整姿态，跟学生处于同一高度。"],"q":"教态指教师在教学中表现出的仪表、举止、风度等。教态好的教师，能赢得学生的尊敬和喜爱，激发学生的学习积极性。","w":"normal","e":["核心考点"]},{"t":"教师注视的次数增加，学生的注意力就会增强。","y":"判断题","p":["眼神表达的丰富内涵有时比语言更微妙，更有效。","当某学生注意力分散、不遵守课堂纪律时，教师可与他目光对视，达到“此时无声胜有声”的效果。","教师注视的次数增加，学生的注意力就会增强。"],"q":"当某学生注意力分散、不遵守课堂纪律时，教师可与他目光对视，达到“此时无声胜有声”的效果。教师注视的次数增加，学生的注意力就会增强。","w":"normal","e":["核心考点"]},{"t":"教态","y":"名词解释","p":["教态指教师在教学中表现出的仪表、举止、风度等","教态好的教师，能赢得学生的尊敬和喜爱，激发学生的学习积极性","仪表是教态的外在因素，教师应穿着整洁，大方得体，不要奇装异服，不要穿走路很响的鞋","教师在课堂上的举止要自然、亲切","为了拉近师生距离，增强互动，教师可调整姿态，跟学生处于同一高度，不要总是站在讲台上，应根据教学内容和情景，在教室里适当走动"],"q":"教态指教师在教学中表现出的仪表、举止、风度等。教态好的教师，能赢得学生的尊敬和喜爱，激发学生的学习积极性。","w":"normal","e":["核心考点"]},{"t":"非语言表达自成系统，如______系统、______系统、眼神表达系统、体态表达系统等。","y":"填空题","p":["手势表达","面部表达"],"q":"非语言表达自成系统，如手势表达系统、面部表达系统、眼神表达系统、体态表达系统等。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c03-s05","t":"第五节 表扬与批评技能","w":"high","n":3,"k":[{"t":"简述批评技能的主要方式。","y":"简答题","p":["(1)微笑批评：微笑能使学生体会到教师的善意与宽容，适用于轻微违纪或偶尔过错。","(2)建议式批评：批评带有商量、讨论的口气，与学生平心静气地交换意见，能创造一种宽松、愉快的气氛。","(3)暗示式批评：以语言、神态等为暗示手段进行批评，主要适用于心细、敏感、自尊心强、能知错就改的学生。","(4)先表扬，后批评：用表扬代替批评是一种良策，但要经过细致调查，找到学生的某一“闪光点”。","(5)严厉批评：当学生严重违纪，造成不良后果时，就要严厉批评，但可对事不对人。"],"q":"批评也是课堂教学的重要手段。批评既要客观公正，又要考虑学生的情绪和心理特点，注意场合，注重情感交流，保护学生的自尊心。……(一) 微笑批评……(二) 建议式批评……(三) 暗示式批评……(四) 先表扬，后批评……(五) 严厉批评。","w":"high","e":["教材高频"]},{"t":"表扬技能有哪些要求?","y":"简答题","p":["表扬要真诚具体：学生顺利完成学习任务，教师要及时给予鼓励。表扬要针对具体行为，让学生感觉到自己的努力和表现得到了教师的赏识。表扬用语要具体、多样。","表扬要公正：公正是表扬基本的要求。不偏爱某些学生，不忽视、歧视每一位学生。","对语言能力较弱的学生，要善于发现其每一个小进步，及时给予肯定，使表扬起到鼓励先进带动后进的作用。","轻率表扬，或表扬失实、失准、失度，可能促发骄傲或者消极情绪。"],"q":"适当表扬学生，可激发学习积极性。表扬要掌握火候和分寸。轻率表扬，或表扬失实、失准、失度，可能促发骄傲或者消极情绪。(一) 表扬要真诚具体……(二) 表扬要公正。","w":"normal","e":["核心考点"]},{"t":"简述批评技能的主要方式。","y":"简答题","p":["微笑批评（轻微违纪或偶尔过错）","建议式批评（商量、讨论的口气）","暗示式批评（语言、神态暗示）","先表扬后批评（找闪光点，恰如其分）","严厉批评（严重违纪时，对事不对人）"],"q":"批评也是课堂教学的重要手段。批评既要客观公正，又要考虑学生的情绪和心理特点……批评要注意方式，还要重视批评后的安抚技巧。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c03-s06","t":"第六节 课堂组织与管理","w":"high","n":6,"k":[{"t":"简述课堂组织的主要方面。","y":"简答题","p":["(1)制定明确、具体的课堂规则：规则要简单明确，前两周教师应重复提醒，如果让学生参与制定，效果就更好了，这就是所谓的“契约式”管理。","(2)掌握学生信息，记住学生姓名：尤其小班教学时应在短时间内记住学生姓名，以建立和谐的师生关系。","(3)激发学习积极性：善于设计引人入胜的开场白，教学方法灵活多变。","(4)集中学生注意力：有学生注意力涣散，要及时找原因，调整教法。","(5)座位安排科学合理：教师可根据教学内容的需要，为学生安排座位，方便师生、生生交流互动。"],"q":"课堂组织与管理是教学顺利进行的保证。……一、课堂组织 (一) 制定明确、具体的课堂规则……(二) 掌握学生信息，记住学生姓名……(三) 激发学习积极性……(四) 集中学生注意力……(五) 座位安排科学合理。","w":"high","e":["教材高频"]},{"t":"对“明知故犯”的课堂问题有哪些处理办法?","y":"简答题","p":["(1)冷处理：教师可以不予理睬，课后了解情况后做心理辅导。如果真是心理有严重问题，要及时报告学校和联系家长。","(2)行为替换：如有学生说话影响了他人，教师可点名叫该生回答一个他能够回答的具体问题，或者朗读课文，或者与其他学生进行角色表演，完成后对好的地方给予表扬和鼓励。","(3)适当惩罚：对中小学生，可以参照其本国情况惩罚，如罚站；惩罚可以跟学习有关。惩罚之前，教师要讲清道理，让学生心甘情愿接受惩罚。"],"q":"对“明知故犯”问题有以下处理办法：(1) 冷处理……(2) 行为替换……(3) 适当惩罚。","w":"normal","e":["核心考点"]},{"t":"契约式管理","y":"名词解释","p":["除学校、学院的规章制度外，教师在开始给新班级上课时，应该向学生提出、解释自己的要求。","规则要简单明确，前两周教师应重复提醒。","课堂规则如果让学生参与制定，效果就更好了。这就是所谓的“契约式”管理。"],"q":"除学校、学院的规章制度外，教师在开始给新班级上课时，应该向学生提出、解释自己的要求。规则要简单明确。前两周教师应重复提醒，使每个学生都能牢记于心。课堂规则如果让学生参与制定，效果就更好了。这就是所谓的“契约式”管理。","w":"normal","e":["核心考点"]},{"t":"某初级汉语班上，一位学生上课时经常打瞌睡、玩手机，还有学生交头接耳，影响了课堂教学。请结合课堂管理与提问技能的相关知识，设计一套处理方案并说明理由。","y":"案例分析题","p":["小问题的应对：小的问题，不太影响他人学习的，可用暗示法。学生打瞌睡、开小差，教师可用提问的方式，也可与他对视几秒，或不经意地走到他旁边站立一会儿。","对“明知故犯”问题的处理：①冷处理：教师可以不予理睬，课后了解情况后做心理辅导；②行为替换：可点名叫该生回答一个他能够回答的具体问题，或者朗读课文，完成后对好的地方给予表扬和鼓励；③适当惩罚：惩罚可以跟学习有关，惩罚之前要讲清道理。","运用提问技能：提问要有针对性和区分度，针对学生个体差异设计难易度不同的问题；多角度、多方式地提问，激发学生兴趣；叫答要面向全部学生，尤其不要忽略性格内向、基础不好的学生。","课堂组织的保障：制定明确、具体的课堂规则，可采用“契约式”管理；掌握学生信息，记住学生姓名；激发学习积极性，设计引人入胜的开场白；座位安排科学合理。"],"q":"课堂上难免出现纪律问题：迟到，接/打电话，看/发微信，吃零食，打瞌睡，看课外书，做其他功课，交头接耳，等等。……(一) 小问题的应对……(二) “明知故犯”问题的处理……(1) 冷处理……(2) 行为替换……(3) 适当惩罚。","w":"high","e":["教材高频"]},{"t":"课堂规则如果让学生参与制定，效果会更好，这就是所谓的“契约式”管理。","y":"判断题","p":["正确","让学生参与制定课堂规则即“契约式”管理"],"q":"课堂规则如果让学生参与制定，效果就更好了。这就是所谓的“契约式”管理。","w":"normal","e":["核心考点"]},{"t":"对“明知故犯”问题，教师可以不予理睬、课后了解情况做心理辅导，这种处理办法是（　　）。","y":"单项选择题","p":["A"],"q":"(1) 冷处理。个别“问题学生”喜欢自言自语，还会高声说话，引发师生注意。教师可以不予理睬，课后了解情况后做心理辅导。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c03-s07","t":"第七节 板书和多媒体","w":"high","n":4,"k":[{"t":"板书","y":"名词解释","p":["板书是课堂教学普遍使用的教学手段，可以帮助学生理解、记录教学内容。","它还可以把听说技能与读写技能联系起来，给非汉字圈学生提供认读汉字的机会。","板书的总原则是简单扼要，眉目清楚，重点突出。","板书要准确、规范、工整、清楚、布局合理，并精心设计。"],"q":"板书是课堂教学普遍使用的教学手段。它可以帮助学生理解、记录教学内容； 还可以把听说技能与读写技能联系起来，给非汉字圈学生提供认读汉字的机会。板书的总原则是简单扼要，眉目清楚，重点突出。","w":"high","e":["教材高频"]},{"t":"运用多媒体教学时需要考虑哪些原则?","y":"简答题","p":["(1)辅助性：在课堂的语言技能教学中，多媒体是辅助性的。教师应该设计好每节课的教学内容和教学环节，明确哪些内容可以用PPT辅助教学，哪些内容要通过传统方式教学。","(2)针对性：教学对象不同，社会生活和语言环境也在不断变化。教师应该根据实际情况，不断更新、完善课件。","(3)交互性：多媒体课件有一个弱点：即时交互性弱。教师应发挥粉笔、黑/白板、普通教具等传统教学手段的优势，结合实际，及时板书，给学生解惑释疑。"],"q":"利用多媒体课件上课，信息量大，可视性、可感性强。使用时需要考虑以下原则：(1) 辅助性……(2) 针对性……(3) 交互性。","w":"normal","e":["核心考点"]},{"t":"在课堂的语言技能教学中，多媒体是____的。","y":"填空题","p":["在课堂的语言技能教学中，多媒体是辅助性的。","教师应该设计好每节课的教学内容和教学环节，明确哪些内容可以用PPT辅助教学，哪些内容要通过传统方式教学。"],"q":"(1) 辅助性。在课堂的语言技能教学中，多媒体是辅助性的。教师应该设计好每节课的教学内容和教学环节，明确哪些内容可以用PPT 辅助教学，哪些内容要通过传统方式教学。","w":"normal","e":["核心考点"]},{"t":"简述板书的总原则及多媒体教学的原则。","y":"简答题","p":["板书总原则：简单扼要，眉目清楚，重点突出","板书要准确、规范、工整、清楚、布局合理；精心设计；灵活进行；保留一定时间","多媒体原则：辅助性","多媒体原则：针对性（不断更新完善课件）","多媒体原则：交互性（发挥传统教学手段优势，及时板书）"],"q":"板书的总原则是简单扼要，眉目清楚，重点突出。……利用多媒体课件上课，信息量大，可视性、可感性强。使用时需要考虑以下原则：(1) 辅助性。(2) 针对性。(3) 交互性。","w":"normal","e":["核心考点"]}]}]},{"id":"rumen-c04","t":"第四章 第二语言习得","w":"high","s":[{"id":"rumen-c04-s01","t":"第一节 第一语言的作用与对比分析","w":"high","n":11,"k":[{"t":"对比分析","y":"名词解释","p":["对比分析法（Contrastive Analysis）由拉多（R. Lado）1957年提出，其心理学基础是行为主义心理学，语言学基础是结构主义","它重视语言形式的差异，通过对比第一语言和第二语言，预测学习难点和偏误"],"q":"对比分析法 (Contrastive Analysis) 由拉多 (R. Lado) 1957年提出, 其心理学基础是行为主义心理学。","w":"high","e":["教材高频"]},{"t":"迁移","y":"名词解释","p":["学习者已掌握的语言会对他们学习新语言产生影响，这种影响就叫迁移（transfer）","语言迁移有两类：正迁移和负迁移"],"q":"学习者已掌握的语言会对他们学习新语言产生影响，这种影响就叫迁移 (trans- fer)。语言迁移有两类： 正迁移和负迁移。","w":"high","e":["教材高频"]},{"t":"对比等级","y":"名词解释","p":["对比等级是Ellis(1985)提出的、用于描述第一语言和第二语言语言点差异程度的等级，共分1~6级，从无差异到第一语言一个语言项对应第二语言多个语言项依次递增"],"q":"对比分析的语言学基础是结构主义。对比分析重视语言形式的差异。下面是 Ellis (1985) 提出的对比'等级'(degrees):","w":"high","e":["教材高频"]},{"t":"回避","y":"名词解释","p":["回避（avoidance）指学习者故意不使用某个语言形式"],"q":"回避(avoidance) 指学习者故意不使用某个语言形式。","w":"normal","e":["核心考点"]},{"t":"相似度","y":"名词解释","p":["相似度（degree of similarity）指两种语言中对应的语言点表面相似，实际上有一些区别","当存在这种'关键相似度'时，干扰更可能引发偏误"],"q":"相似度 (degree of similarity) 指两种语言中对应的语言点表面相似, 实际上有一些区别。当存在这种'关键相似度'(a crucial similarity measure) 时, 干扰更可能引发偏误。","w":"normal","e":["核心考点"]},{"t":"蝙蝠词","y":"名词解释","p":["蝙蝠词是孟柱亿（2007）对韩语中形式跟汉语词相同或相似，但经中韩不同地域多年发展演变，在词义、感情色彩、词性等方面有了明显差异的一类词的称呼"],"q":"孟柱亿(2007) 称韩语此类词为'蝙蝠词'。其形式跟汉语词相同或相似，但经中韩不同地域多年的发展演变， 在词义、感情色彩、词性等方面有了明显差异。","w":"normal","e":["核心考点"]},{"t":"对比分析六步程序","y":"名词解释","p":["周小兵（2004，2014）提出适合第二语言研究的对比分析六步程序：发现、选择、收集语料、逐项比对、多层解释、教学建议"],"q":"经多年研究，周小兵(2004，2014) 提出适合第二语言研究的对比分析六步程序，简述如下:","w":"normal","e":["核心考点"]},{"t":"简述对比分析的传统程序（四个步骤）及其不足。","y":"简答题","p":["①描写：对母语和目的语准确清晰描写","②选择：选择语言项目、规则或结构进行对比","③对比：找出两种语言的特殊点","④预测：预测可能出现的错误和难点","不足：从一般到个别，未充分考虑二语教学需求，工程大、难操作、不清楚如何选择"],"q":"传统的对比分析有四个步骤：①描写 (description)。对学生的母语和目的语进行准确、清晰的描写。②选择 (selection)。选择一定的语言项目、规则或结构进行对比。③对比(comparision)。找出两种语言的特殊点。④预测 (prediction)。预测学习中可能出现的错误和难点。这个程序从一般到个别，没有充分考虑二语教学的需求，工程大，难操作，研究者往往不清楚该如何选择。","w":"high","e":["教材高频"]},{"t":"简述弗里斯关于对比分析作用的主要观点。","y":"简答题","p":["①第一语言学习与二语学习是截然不同的过程","②二语学习的根本困难是母语系统习惯特征的干扰","③有效的教材、教学基于第一、第二语言的科学平行描写","④对比分析可避免教学和测试中没有价值的语言项目","弗里斯在系统对比英语和其他语言的基础上，编写了面向不同母语者的英语教材"],"q":"弗里斯研究指出，对比分析的意义可以从几方面理解：①第一语言学习、二语学习是截然不同的过程； ②二语学习的根本困难，是母语系统习惯特征的干扰； ③有效的教材、教学基于第一语言、第二语言的科学平行描写； ④对比分析可避免教学和测试中没有价值的语言项目 (周维江，2010)。","w":"normal","e":["核心考点"]},{"t":"试以'一点'和'有点'的误代偏误为例，说明如何运用对比分析的六步程序进行教学。","y":"论述题","p":["①发现：'一点、有点'误代是初级阶段最常见偏误","②选择：该偏误跟多数学生母语相关，值得对比","③收集语料：中介语语料和语言对比语料","④逐项比对：韩语조금对应汉语'一点''有点'","⑤多层解释：对比等级6级，难度等级5级，'一点'无标记、先习得","⑥教学建议：先'一点+名词'，再'有点+形容词/心理动词'，后'形容词+一点'；结合语境大量练习，适当进行外汉对比"],"q":"(1) 发现。在教学、研究实践中发现值得对比的语言点，学习者输入、输出问题最多的语言点，如用'一点'误代'有点'(*我今天一点累)，是初级阶段最常见的偏误之一。……(6) 教学建议。找出有效方法进行教学，使学习者更好地掌握学习项目。如'一点、有点'。首先是顺序和编排。应先教'一点+名词'……","w":"high","e":["教材高频"]},{"t":"对比分析（Contrastive Analysis）由拉多（R. Lado）于1957年提出，其心理学基础是（　　）。","y":"单项选择题","p":["对比分析法由拉多（R. Lado）1957年提出，其心理学基础是行为主义心理学，语言学基础是结构主义。"],"q":"对比分析法 (Contrastive Analysis) 由拉多 (R. Lado) 1957年提出, 其心理学基础是行为主义心理学。","w":"high","e":["教材高频"]}]},{"id":"rumen-c04-s02","t":"第二节 偏误分析","w":"high","n":18,"k":[{"t":"偏误分析","y":"名词解释","p":["偏误分析（error analysis）跟对比分析结合，服务于教学","偏误不仅跟母语干扰有关，还跟目标语规则泛化相连","偏误分析是中介语研究、习得顺序研究的重要组成部分"],"q":"偏误分析 (error analysis) 跟对比分析结合，服务于教学。偏误不仅跟母语干扰有关，还跟目标语规则泛化相连。偏误分析是中介语研究、习得顺序研究的重要组成部分。","w":"high","e":["教材高频"]},{"t":"语际偏误","y":"名词解释","p":["语际偏误（interlingual error）是由母语负迁移引起的偏误，又称'干扰性偏误''对比性偏误'"],"q":"语际偏误(interlingual error) 是由母语负迁移引起的偏误, 又称'干扰性偏误''对比性偏误'(参见本章第一节)。","w":"high","e":["教材高频"]},{"t":"语内偏误","y":"名词解释","p":["语内偏误（intralingual error）指第一语言内部的发展偏误，又称'目标语规则泛化偏误''发展性偏误'"],"q":"语内偏误 (intralingual error) 指第一语言内部的发展偏误，又称'目标语规则泛化偏误''发展性偏误'。","w":"high","e":["教材高频"]},{"t":"训练偏误","y":"名词解释","p":["训练偏误（training error）指因为教科书、词典编写不恰当或教师讲解不好而引发的偏误"],"q":"训练偏误(training error) 指因为教科书、词典编写不恰当或教师讲解不好而引发的偏误。","w":"normal","e":["核心考点"]},{"t":"认知偏误","y":"名词解释","p":["认知偏误（cognitive error）指因人的认知能力跟某种语言规则产生矛盾而出现的偏误，又称'普遍偏误'"],"q":"认知偏误(cognitive error) 指因人的认知能力跟某种语言规则产生矛盾而出现的偏误, 又称'普遍偏误'。Hatch (1983) 曾提出'自然度' (naturalness) 的概念","w":"normal","e":["核心考点"]},{"t":"简述偏误分析的六个步骤。","y":"简答题","p":["①语料收集（自然语料/非自然语料）","②偏误识辨（区分失误与偏误、显性偏误与隐性偏误）","③偏误纠正（不违背原意、符合语感语法、最简化、接近学生水平）","④偏误点选择","⑤偏误描述（语法范畴/数学范畴：误加、遗漏、错位、误代、杂糅）","⑥偏误探源（语际、语内、训练、认知偏误）","此外还包括规则解释和教学建议"],"q":"以下以语法偏误为例解释偏误分析的步骤。(一) 语料收集……(二) 偏误识辨……(三) 偏误纠正……(四) 偏误点选择……(五) 偏误描述……(六) 偏误探源","w":"high","e":["教材高频"]},{"t":"简述偏误描述中从标准数学范畴分类的五种偏误类型，并各举一例。","y":"简答题","p":["①误加：*我和他在一起去看奥运比赛","②遗漏：*他在广州住了六[]月","③错位：*小王比较跑得快","④误代：*小李通常迟到","⑤杂糅：*日子过得更加幸福多了"],"q":"(1) 误加： *我和他在一起去看奥运比赛。(2) 遗漏: *他在广州住了六 []月。(3) 错位： *小王比较跑得快。(4) 误代：*小李通常迟到。(5) 杂糅：*日子过得更加幸福多了。两个句子 (⋯⋯更加幸福了； ⋯⋯幸福多了) 结构混搭在一起。","w":"high","e":["教材高频"]},{"t":"偏误纠正应注意哪些原则?","y":"简答题","p":["第一，不违背作者原意","第二，符合语感和语法规则（避免纠正一个偏误点而遗漏另一个）","第三，最简化","第四，接近学生水平"],"q":"进行偏误纠正时要注意以下几个原则：第一，不违背作者原意。……第二，符合语感和语法规则。……第三，最简化。……第四，接近学生水平。","w":"normal","e":["核心考点"]},{"t":"偏误分析只考察偏误，不能看出学习者整个习得过程，这是偏误分析的不足之一。","y":"判断题","p":["偏误分析只考察偏误，而二语习得要全面考察学习者的中介语及其发展（连续体），包括跟目标语一致的地方，这样才能看出习得轨迹。"],"q":"偏误分析只考察偏误。而二语习得要全面考察学习者的中介语及其发展 (连续体)，包括跟目标语一致的地方。这样才能看出习得轨迹。","w":"normal","e":["核心考点"]},{"t":"区分'失误'和'偏误'的标准有两条：一是频率，二是生成者能否自纠。可以自纠的是失误，不能自纠的是偏误。","y":"判断题","p":["第一，要区分'失误'（lapse）和'偏误'（error）。前者源于一时疏忽，后者因为缺乏语言能力。区分标准有两条：一是频率；二是生成者能否自纠。可以自纠是失误，不能自纠是偏误。偏误分析的对象主要是后者。"],"q":"第一, 要区分'失误' (lapse) 和'偏误' (error)。前者源于一时疏忽, 后者因为缺乏语言能力。区分标准有两条：一是频率。偶尔出现可能是失误，出现较多则可能是偏误。二是生成者能否自纠。可以自纠是失误，不能自纠是偏误。","w":"high","e":["教材高频"]},{"t":"显性偏误在形式上违反句法规则，如'*他破了杯子'；隐性偏误看单句可能没有问题，放在______就有问题了。","y":"填空题","p":["显性偏误在形式上违反句法规则；隐性偏误看单句可能没有问题，放在上下文就有问题了。"],"q":"第二，要区分'显性偏误'和'隐性偏误'。显性偏误在形式上违反句法规则，如' *他破了杯子'。隐性偏误看单句可能没有问题，放在上下文就有问题了。","w":"normal","e":["核心考点"]},{"t":"'*我比他很高'这类偏误，从偏误探源角度看属于（　　）。","y":"单项选择题","p":["该句不能说是由于母语负迁移引起，而涉及汉语规则本身和学习者对规则的认识和使用，属于语内偏误（目标语规则泛化偏误）。"],"q":"周小兵、刘瑜 (2010) 的研究显示，语内偏误的原因可从两方面考察：第一，语言规则本身。如'*我比他很高'这句话不能说所涉及的汉语规则和汉外语言的异同。第二，学习者对规则的认识和使用。","w":"normal","e":["核心考点"]},{"t":"'*但是她的家生活真的很幸福。'这类偏误，其产生的原因是（　　）。","y":"单项选择题","p":["教材常用英文注释，如'家'注释为family，可能诱发偏误。教材未解释词语的具体用法，容易诱发偏误，属于训练偏误。"],"q":"教材常用英文注释, 如'家''热爱'分别注释为 family、to love, 可能诱发偏误:*但是她的家生活真的很幸福。[但是她的家庭生活真的很幸福。]","w":"normal","e":["核心考点"]},{"t":"简述偏误分析在汉语教学中的具体应用（从语音、词汇、语法、汉字四方面举例说明）。","y":"简答题","p":["①语音偏误：韩国学生把f读成b或p，因韩语无[f]音","②词汇偏误：词语误代，如'脸色很严格'应为'严肃'","③语法偏误：多语种偏误系统分析，如'我去学校骑自行车'为母语负迁移","④汉字偏误：误同形（提供→提拱）、误异形（他们→他门）"],"q":"(一) 语音偏误……(二) 词汇偏误……(三) 语法偏误……(四) 汉字偏误分析","w":"normal","e":["核心考点"]},{"t":"在二语习得过程中，我们应如何从输入与互动的方面来促进二语习得?请结合教材理论加以论述。","y":"论述题","p":["①可理解输入与'i+1'原则（Krashen,1982）","②输入转为摄入（intake）才发生习得","③可理解性输出（Swain,1985），促使语义加工转向句法加工","④互动假说（Long,1983）：意义协商中实现可理解性","⑤协同理论：输出向输入看齐，缩小差距","⑥纠正性反馈：修正输出融入中介语系统","⑦建立垂直结构、输入强化与高频输入"],"q":"克拉申 (Krashen, 1982) 强调, 二语习得依赖于学习者得到的可理解输入 (com- prehensible input)。输入是'i+1'。……Swain(1985) 认为， 二语学习不仅需要大量的可理解性输入， 还需要大量的可理解性输出 (comprehensible output)。……互动假说 (Interaction Hypothesis) 由 Long(1983) 提出","w":"high","e":["教材高频"]},{"t":"显性偏误和隐性偏误","y":"名词解释","p":["显性偏误在形式上违反句法规则，如'*他破了杯子'","隐性偏误看单句可能没有问题，放在上下文就有问题了"],"q":"第二，要区分'显性偏误'和'隐性偏误'。显性偏误在形式上违反句法规则，如' *他破了杯子'。隐性偏误看单句可能没有问题，放在上下文就有问题了。","w":"normal","e":["核心考点"]},{"t":"请系统分析偏误句'*我把这本书没看完'，内容包括：指出偏误点，改正句子，说明相关语法规则，形式分类，尝试解释偏误生成的原因。","y":"论述题","p":["偏误点：'把'字句中否定词'没'位置错误","改正：我没把这本书看完","语法规则：'把'字句否定词应放在'把'字之前","形式分类：错位","原因分析：语内偏误（目的语规则泛化），否定词一般置动词前的规则被过度推广","需结合学习者母语背景和语料具体分析"],"q":"如'*我旅行中国'是不及物动词带宾语导致的偏误，'*我一年学了汉语'是把补语'一年'用作状语，'*我把这本书没看完'是'把'字句否定词错位。","w":"high","e":["教材高频"]},{"t":"以下是一位母语为英语的汉语学习者的一组偏误句，请完成：（1）指出每句的偏误点并改正；（2）说明涉及的相关语法规则；（3）从形式角度对偏误进行分类；（4）解释偏误生成的原因。（1）*他感兴趣对汉语学习。（2）*我去了学校昨天。（3）*昨天我见面他了。（4）*我比他很高。（5）*他跑步得很快。","y":"案例分析题","p":["（1）感兴趣：*他感兴趣对汉语学习→他对汉语学习感兴趣；'对+对象'作状语前置；错位；母语迁移","（2）*我去了学校昨天→我昨天去了学校；时间状语不能置句末；错位；母语负迁移","（3）*昨天我见面他了→昨天我跟他见面了；离合词不能直接带宾语；误加；教材注释meet误导","（4）*我比他很高→我比他高；'比'字句不能用'很'；误加；目的语规则泛化","（5）*他跑步得很快→他跑步跑得很快；离合词接'得'补语需重复动词语素；遗漏；目的语规则泛化"],"q":"周小兵等 (2007)《外国人学汉语语法偏误研究》使用多种理论方法，对多个语种的汉语学习者偏误进行多个角度系统分析。……a. (老师：你怎么去学校?)学生： *我去学校骑自行车。b. *他跑步得很快。c. *宿舍是教学楼的前边。d. *我问她，'你是不是灵魂还是人?'","w":"high","e":["教材高频"]}]},{"id":"rumen-c04-s03","t":"第三节 中介语及其发展过程","w":"high","n":13,"k":[{"t":"中介语","y":"名词解释","p":["中介语（interlanguage）是学习者在二语习得过程中建构的、既不同于母语又不同于目标语的一种语言知识系统","它是逐步接近目标语的一种发展阶段，有可塑性、动态性和系统性三个特征"],"q":"中介语(interlanguage) 是学习者在二语习得过程中建构的、既不同于母语又不同于目标语的一种语言知识系统。它是逐步接近目标语的一种发展阶段。Selinker(1972)认为它是学习者在某个发展阶段建构的语言系统； 是一系列连锁的语言系统，形成学习者的内置大纲 (built-in syllabus), 即构成中介语连续体(interlanguage continuum)。","w":"high","e":["教材高频"]},{"t":"中介语的可塑性","y":"名词解释","p":["可塑性指中介语的语言规则不断修正"],"q":"可塑性指中介语的语言规则不断修正。如在英语二语学习者的中介语里，否定词加主要动词的形式往往先出现； 一段时间后，否定词才开始出现于助动词和主要动词之间。","w":"normal","e":["核心考点"]},{"t":"中介语的动态性","y":"名词解释","p":["动态性指中介语的规则是以渐进方式逐步扩展的"],"q":"动态性指中介语的规则是以渐进方式逐步扩展的。汉语特指问句的习得有一个较长的过程，疑问代词是逐步扩散的； 第一阶段是'怎么样、什么'……","w":"normal","e":["核心考点"]},{"t":"中介语的系统性","y":"名词解释","p":["系统性指中介语的语音、词汇、语法都有一套规则"],"q":"系统性指中介语的语音、词汇、语法都有一套规则。学习者出现的中介语现象并不是偶然的，也不是随心所欲的。","w":"normal","e":["核心考点"]},{"t":"中介语变异","y":"名词解释","p":["变异在自然语言中存在，在中介语中同样存在，只是在程度上、范围上有所不同","中介语变异常用变异规则来描述，主要分为社交情景变异和语境变异"],"q":"变异在自然语言中存在，在中介语中同样存在，只是在程度上、范围上有所不同。","w":"normal","e":["核心考点"]},{"t":"横向研究","y":"名词解释","p":["横向（cross-sectional）研究常常调查语法点的习得顺序","其步骤为：①用双语句法测量手段诱发学习者生成口头语或书面语","②识别分析其中的语法点","③根据语法点使用准确度排列习得顺序"],"q":"横向 (cross-sectional) 研究常常调查语法点的习得顺序。其步骤为：①用双语句法测量手段诱发学习者生成口头语或书面语； ②识别分析其中的语法点； ③根据语法点使用准确度排列习得顺序。","w":"normal","e":["核心考点"]},{"t":"纵向研究","y":"名词解释","p":["纵向（longitudinal）研究能提供不同发展期的语言素材，描述整个习得过程"],"q":"纵向 (longitudinal) 研究能提供不同发展期的语言素材，描述整个习得过程。","w":"normal","e":["核心考点"]},{"t":"简述交际中修正策略的主要类型。","y":"简答题","p":["①简化词汇（我看杂志→我看书）","②协助对方表达（天上的云，很好看）","③转换句子结构和问话点（你来中国多长时间?→你什么时候来中国?）"],"q":"常见的修正策略有：①简化词汇：我看杂志→我看书。没有人民币→没有中国钱。喜欢中餐→喜欢中国饭。②协助对方表达……③转换句子结构和问话点：你来中国多长时间? →你什么时候来中国?","w":"normal","e":["核心考点"]},{"t":"什么是中介语?中介语变异主要体现在哪些方面?","y":"简答题","p":["中介语定义：既不同于母语又不同于目标语的语言知识系统","三个特征：可塑性、动态性、系统性","①社交情景变异：口语偏误多、书面语偏误少","②语境变异：内部语境变化导致多种语言形式（如'也'错位）","两种情境中语境更重要"],"q":"变异在自然语言中存在，在中介语中同样存在，只是在程度上、范围上有所不同。……(一) 社交情景变异……(二) 语境变异","w":"high","e":["教材高频"]},{"t":"在二语习得中，'大致发展阶段'（sequence of development）指学习具体语言项目的先后，不同学习者有不同的表现。","y":"判断题","p":["'大致发展阶段'（sequence of development）指学习阶段的先后，有普遍性，适用于所有学习者；'具体发展顺序'（order of development）指学习具体语言项目的先后，不同学习者有不同的表现。"],"q":"首先要区分两个概念: 大致发展阶段 (sequence of development), 指学习阶段的先后, 有普遍性, 适用于所有学习者; 具体发展顺序 (order of development), 指学习具体语言项目的先后，不同学习者有不同的表现。","w":"normal","e":["核心考点"]},{"t":"'大致发展阶段'（sequence of development）有普遍性，适用于所有学习者；而'具体发展顺序'（order of development）不同学习者有不同的表现。","y":"判断题","p":["大致发展阶段指学习阶段的先后，有普遍性，适用于所有学习者；具体发展顺序指学习具体语言项目的先后，不同学习者有不同的表现。"],"q":"大致发展阶段 (sequence of development), 指学习阶段的先后, 有普遍性, 适用于所有学习者; 具体发展顺序 (order of development), 指学习具体语言项目的先后，不同学习者有不同的表现。","w":"normal","e":["核心考点"]},{"t":"乔姆斯基认为，儿童的母语知识来源于______，它是一套天生的内在的语言规则，支配着任何语言可能的句法形式。","y":"填空题","p":["乔姆斯基认为，儿童的母语知识来源于普遍语法（Universal Grammar）。它是一套天生的内在的语言规则，支配着任何语言可能的句法形式。"],"q":"乔姆斯基认为：儿童的母语知识来源于普遍语法 (Universal Grammar)。它是一套天生的内在的语言规则，支配着任何语言可能的句法形式。","w":"normal","e":["核心考点"]},{"t":"提出中介语（interlanguage）这一概念的是（　　）。","y":"单项选择题","p":["Selinker(1972)认为中介语是学习者在某个发展阶段建构的语言系统，是一系列连锁的语言系统，形成学习者的内置大纲。"],"q":"Selinker(1972)认为它是学习者在某个发展阶段建构的语言系统； 是一系列连锁的语言系统，形成学习者的内置大纲 (built-in syllabus), 即构成中介语连续体(interlanguage continuum)。","w":"high","e":["教材高频"]}]},{"id":"rumen-c04-s04","t":"第四节 输入、输出与互动","w":"high","n":15,"k":[{"t":"外国式语言","y":"名词解释","p":["外国式语言（foreigner talk）是本族人对外族人说的话语","其特点是：①合乎语法的简化","②不合语法的简化"],"q":"外国式语言 (foreigner talk) 是本族人对外族人说的话语。其特点是：①合乎语法的简化。如减慢语速，小心清楚地发音，使用简单词汇，多用是非问句。②不合语法的简化。如对初学者说：'这是昨天买 [ ]。'","w":"high","e":["教材高频"]},{"t":"互动","y":"名词解释","p":["互动（interaction）指沟通、理解发生困难时，交际双方依据对方理解与否的反馈，调整语言，如重复、解释、核实等，使语言输入容易理解，促进习得"],"q":"互动 (interaction)，指沟通、理解发生困难时，交际双方依据对方理解与否的反馈，调整语言，如重复、解释、核实等，使语言输入容易理解，促进习得。","w":"high","e":["教材高频"]},{"t":"教师语言","y":"名词解释","p":["对二语学习者的教师语言（teacher talk）是一种语体，有形式特征和互动特征","它既是教学媒介语，又是学习者的目标语"],"q":"对二语学习者的教师语言 (teacher talk) 是一种语体，有形式特征和互动特征。它既是教学媒介语，又是学习者的目标语。","w":"normal","e":["核心考点"]},{"t":"三段话语（IRF）","y":"名词解释","p":["课堂话语分析常常关注'三段话语'（Sinclair & Coulthard, 1975），即教师引发（initiates）、学生反应（responds）、教师反馈（feedback），可缩写为IRF"],"q":"课堂话语分析常常会关注'三段话语' (Sinclair & Coulthard, 1975), 即教师引发(initiates)、学生反应 (responds)、教师反馈(feedback)。","w":"normal","e":["核心考点"]},{"t":"可理解输入","y":"名词解释","p":["克拉申（Krashen, 1982）强调，二语习得依赖于学习者得到的可理解输入（comprehensible input）","输入是'i+1'，'i'是学习者已掌握并完全理解的内容，占大部分","'1'是新语言形式，占小部分"],"q":"克拉申 (Krashen, 1982) 强调, 二语习得依赖于学习者得到的可理解输入 (com- prehensible input)。输入是'i+1'。'i'是学习者已掌握并完全理解的内容, 占大部分； '1'是新语言形式，占小部分。","w":"high","e":["教材高频"]},{"t":"摄入","y":"名词解释","p":["输入被学习者理解了，不等于习得完成","只有当输入（input）转为摄入（intake），即被吸收时，习得才发生"],"q":"输入被学习者理解了，不等于习得完成。只有当输入 (input) 转为摄入(intake)，即被吸收时，习得才发生。输入是学习者听到、看到的材料，摄入是被吸收并融入中介语体系中的那部分第二语言。","w":"high","e":["教材高频"]},{"t":"垂直结构","y":"名词解释","p":["垂直结构（vertical structures）指在语流中，学习者从前面话语中借用一些语块构成的话语"],"q":"垂直结构 (vertical structures) 指在语流中，学习者从前面话语中借用一些语块构成的话语。","w":"normal","e":["核心考点"]},{"t":"纠正性反馈","y":"名词解释","p":["纠正性反馈（corrective feedback），指二语者出现输出错误时他人提示错误的反馈信息（Sheen & Ellis, 2011）","可分为书面纠正性反馈和口语纠正性反馈"],"q":"纠正性反馈，指二语者出现输出错误时他人提示错误的反馈信息(Sheen&Ellis，2011)。","w":"high","e":["教材高频"]},{"t":"互动假说","y":"名词解释","p":["互动假说（Interaction Hypothesis）由Long(1983)提出，是对克拉申的语言输入假说的拓展","互动假说认为，输入的可理解性是在意义协商过程中通过交际实现的，而且也可以实现学习者的可理解输出"],"q":"互动假说 (Interaction Hypothesis) 由 Long(1983) 提出, 是对克拉申的语言输入假说的拓展(图4.4)。互动假说认为，输入的可理解性是在意义协商过程中通过交际实现的，而且也可以实现学习者的可理解输出。","w":"high","e":["教材高频"]},{"t":"协同理论","y":"名词解释","p":["Long(1983)指出，学习者与高于自己水平的人（尤其是本族语者）互动，外语水平提高快","互动促学的机理，是协同效应，协同即学习"],"q":"Long (1983)指出， 学习者与高于自己水平的人 (尤其是本族语者) 互动， 外语水平提高快。互动促学的机理，是协同效应，协同即学习。","w":"normal","e":["核心考点"]},{"t":"什么是话语分析中的IRF结构?请举例说明其可能的变化与扩展。","y":"简答题","p":["IRF即教师引发（initiates）、学生反应（responds）、教师反馈（feedback）","Sinclair & Coulthard, 1975","可能变化扩展为IRF+R（补充、确认、重述）","教师反馈包括确认、补充、纠错等，帮助学习者验证目的语规则","可采用非语言形式，适合初学者和少年儿童"],"q":"课堂话语分析常常会关注'三段话语' (Sinclair & Coulthard, 1975), 即教师引发(initiates)、学生反应 (responds)、教师反馈(feedback)。……此结构在外语教学课堂上可能会有变化、扩展，如以下两个不同的IRF +R:","w":"normal","e":["核心考点"]},{"t":"简述外国式语言的功能及本族语者调整话语的三种方式。","y":"简答题","p":["功能：促进交流、建立情感纽带、作为隐性教学方式","①回退（regression）：无意识退回到儿童期语言","②相配（matching）：评估并模仿学习者语言形式","③协商（negotiation）：根据反馈简化、解释话语，避免交际失败"],"q":"外国式语言跟保姆式语言(motherese) 相似，具有以下功能：①促进交流； ②使本族语者和非本族语者建立情感纽带； ③作为隐性的教学方式。……(1) 回退 (regression)……(2) 相配 (matching)……(3) 协商(negotiation)……","w":"normal","e":["核心考点"]},{"t":"试述输入、输出、互动在二语习得中的作用，并结合教学说明如何运用。","y":"论述题","p":["①输入强化和高频输入：强化特定成分帮助注意和记忆","②可理解输入与'i+1'原则（Krashen）","③摄入（intake）才发生习得；可理解性输出（Swain）","④建立垂直结构，利用语块促进习得","⑤纠正性反馈：引起注意差距，修正输出","⑥互动假说（Long）与协同理论：意义协商、协同即学习"],"q":"三、输入、输出、互动在二语习得中的作用……(一) 输入强化和高频输入……(二) 可理解输入和'i+1'原则……(三) 摄入与输出……(四) 建立垂直结构……(五) 纠正性反馈的应用……(六) 互动假说与协同理论","w":"high","e":["教材高频"]},{"t":"课堂话语分析常常关注'三段话语'，即教师引发、学生反应、______，可缩写为IRF。","y":"填空题","p":["课堂话语分析常常关注'三段话语'（Sinclair & Coulthard, 1975），即教师引发（initiates）、学生反应（responds）、教师反馈（feedback），可缩写为IRF。"],"q":"课堂话语分析常常会关注'三段话语' (Sinclair & Coulthard, 1975), 即教师引发(initiates)、学生反应 (responds)、教师反馈(feedback)。","w":"normal","e":["核心考点"]},{"t":"提出可理解性输出（comprehensible output）假说的是（　　）。","y":"单项选择题","p":["Swain(1985)认为，二语学习不仅需要大量的可理解性输入，还需要大量的可理解性输出。学习者必须用学到的二语知识进行输出并让母语者理解，才能真正习得。"],"q":"Swain(1985) 认为， 二语学习不仅需要大量的可理解性输入， 还需要大量的可理解性输出(comprehensible output)。","w":"high","e":["教材高频"]}]},{"id":"rumen-c04-s05","t":"第五节 学习者个体差异","w":"high","n":10,"k":[{"t":"语言学能","y":"名词解释","p":["Carroll(1965)认为语言学能（aptitude）主要包括四种不同能力：语音编码能力、语法敏感性、归纳能力、机械记忆能力"],"q":"Carroll (1965) 认为语言学能 (aptitude) 主要包括四种不同能力:(1) 语音编码能力……(2) 语法敏感性……(3) 归纳能力……(4) 机械记忆能力……","w":"high","e":["教材高频"]},{"t":"认知方式","y":"名词解释","p":["认知方式（cognitive style）指对信息的感知、概念化、组织和记忆的方式","最常见的是将认知方式分为场依附（field dependence）和场独立（field independence）两类"],"q":"认知方式 (cognitive style) 指对信息的感知、概念化、组织和记忆的方式。……其中最常见的是将认知方式分为场依附 (field dependence) 和场独立 (field independence) 两类","w":"normal","e":["核心考点"]},{"t":"态度","y":"名词解释","p":["态度（attitude）指为目标努力时表现出来的持久性","态度可以分为三类：对操二语的社区和人的态度，对正在进行的语言学习的态度，对一般语言和语言学习的态度"],"q":"态度 (attitude)指为目标努力时表现出来的持久性。态度还有其他一些的定义，如对目标语成员的看法 (有趣与否、诚实与否)、对本族文化的信念。态度可以分为三类：对操二语的社区和人的态度，对正在进行的语言学习的态度，对一般语言和语言学习的态度。","w":"normal","e":["核心考点"]},{"t":"动机","y":"名词解释","p":["动机（motivation）指行为的整体目标和方向","一种分类是将动机划分为三小类：整体动机、情景动机、任务动机"],"q":"动机 (motivation)指行为的整体目标和方向。……一种是将动机划分为三小类：整体动机 (二语学习的整体目标方向)，情景动机 (课堂学习/自然学习)，任务动机 (完成某个具体学习任务)。","w":"normal","e":["核心考点"]},{"t":"情感过滤假说","y":"名词解释","p":["情感过滤假说（the Affective Filter Hypothesis）认为，语言习得主要依靠可理解的输入","但是，它也受到情感因素的影响，出现情感过滤","情感过滤越强，输入能进入主管语言机制的大脑部分变成语言能力的比例就越低"],"q":"情感过滤假说 (the Affective Filter Hypothesis) 认为, 语言习得主要依靠可理解的输入； 但是，它也受到情感因素的影响，出现情感过滤。情感过滤越强，输入能进入主管语言机制的大脑部分变成语言能力的比例就越低","w":"high","e":["教材高频"]},{"t":"影响二语习得的个人因素和一般因素分别有哪些?","y":"简答题","p":["个人因素：①年龄与性别；②智力与语言学能；③认知方式（场独立/场依附）；④态度与动机；⑤个性与情感过滤","年龄不改变习得顺序但影响学习速度，13~19岁青少年进步最快","语言学能四能力：语音编码、语法敏感性、归纳、机械记忆","一般因素：语言普遍性（普遍语法、语言类型普遍性）、认知偏误等"],"q":"二语学习者在个性、动机、学习方式、能力倾向和年龄等方面存在不同，这种不同对二语习得会产生影响。……一、年龄与性别……二、智力与语言学能……三、认知方式……四、态度与动机……五、个性与情感过滤","w":"high","e":["教材高频"]},{"t":"研究表明，年龄会改变二语习得顺序。","y":"判断题","p":["大多研究结果表明，年龄不会改变习得顺序。有学者考察了6~15岁的孩子和成人学习者，发现他们对20个语言点的习得顺序一样。但年龄对学习速度有明显影响。"],"q":"大多研究结果表明，年龄不会改变习得顺序。有学者考察了6~15岁的孩子和成人学习者，发现他们对20个语言点的习得顺序一样。但年龄对学习速度有明显影响。","w":"normal","e":["核心考点"]},{"t":"在二语习得中，智力因素能够较好地预测在正式环境（如语言课堂）中学习的语言成绩，与在自然环境中习得二语的情况则没有必然关系。","y":"判断题","p":["智力因素与第一类语言能力（认知/学术语言能力）有较大相关性，而与第二类语言能力（基本的人际交际技能）关系不大。智力因素能够较好地预测在正式环境中学习的语言成绩，与在自然环境中习得二语的情况则没有必然关系。"],"q":"智力因素与第一类语言能力有较大相关性，而与第二类语言能力关系不大。换言之，智力因素能够较好预测在正式环境(如语言课堂) 中学习的语言成绩，与在自然环境中习得二语的情况则没有必然关系。","w":"normal","e":["核心考点"]},{"t":"关于年龄对二语习得的影响，下列说法正确的是（　　）。","y":"单项选择题","p":["年龄不会改变习得顺序，但对学习速度有明显影响；年龄只影响词法和句法的学习速度，对语音方面的习得似乎没有影响。"],"q":"大多研究结果表明，年龄不会改变习得顺序。……但年龄对学习速度有明显影响。……并且，年龄只影响词法和句法的学习速度，对语音方面的习得似乎没有影响。","w":"normal","e":["核心考点"]},{"t":"关于场独立和场依存认知方式，下列说法正确的是（　　）。","y":"单项选择题","p":["王添淼(2007)研究发现，场独立认知风格在语法结构和综合填空测试中表现出更强的优势；在听力理解、阅读理解和口语测试中，场依存型则较有优势。"],"q":"①综合填空和语法结构受认知方式的影响较大。②场独立认知风格在语法结构和综合填空测试中表现出更强的优势； 在听力理解、阅读理解和口语测试中，场依存型则较有优势。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c04-s06","t":"第六节 学习和学习者的策略","w":"high","n":13,"k":[{"t":"显性知识","y":"名词解释","p":["显性知识（explicit knowledge）是指学习者能够有意识地表达出来的知识，即学习者不但知其然，而且知其所以然"],"q":"显性知识 (explicit knowledge) 是指学习者能够有意识地表达出来的知识，即学习者不但知其然，而且知其所以然 (Ellis，2004)。","w":"high","e":["教材高频"]},{"t":"显性学习","y":"名词解释","p":["显性学习（explicit learning）是指通过显性手段（如记忆法、语法分析）学习语言内容（如词汇、语法），是通过有意识的方式进行的，学会的知识以显性方式储存，使用起来用意识进行控制"],"q":"显性学习 (explicit learning) 是指通过显性手段 (如记忆法、语法分析) 学习语言内容 (如词汇、语法)，是通过有意识的方式进行的，学会的知识以显性方式储存，使用起来用意识进行控制(戴曼纯，2005)。","w":"normal","e":["核心考点"]},{"t":"隐性知识","y":"名词解释","p":["隐性知识（implicit knowledge）指在二语习得中，学习者在交际中通过可理解输入无意识发展起来的二语知识"],"q":"隐性知识(implicit knowledge) 指在二语习得中，学习者在交际中通过可理解输入无意识发展起来的二语知识(Ellis，1999)。","w":"normal","e":["核心考点"]},{"t":"陈述性知识和程序性知识","y":"名词解释","p":["陈述性知识（declarative knowledge）是指由能够作为命题储存起来的有意识掌握的事实、概念、观点等构成的知识","程序性知识（procedural knowledge）是关于一些我们知道如何做却并非有意识掌握的知识"],"q":"陈述性知识 (declarative knowledge) 是指由能够作为命题 (proposition) 储存起来的有意识掌握的事实、概念、观点等构成的知识，程序性 (操作性、过程性) 知识(procedural knowledge) 是关于一些我们知道如何做却并非有意识掌握的知识 (Richards & Platt, 2000)。","w":"high","e":["教材高频"]},{"t":"套语","y":"名词解释","p":["套语（formulaic speech）是指那些不能分析而作为整体学习的语言单位，常运用于特定的场景，如打招呼、请求等"],"q":"套语 (formulaic speech) 是指那些不能分析而作为整体学习的语言单位，常运用于特定的场景，如打招呼、请求等。它在二语习得中很常见，尤其是开始阶段。","w":"normal","e":["核心考点"]},{"t":"语言学习策略","y":"名词解释","p":["语言学习策略指为了发展目的语的语言、社会语言能力而采取的策略","根据策略运用的目的，学习策略可分为语言学习策略和语言运用策略"],"q":"根据策略运用的目的, 学习策略可分为语言学习策略 (language learning strategies)和语言运用策略 (language use strategies) (Tarone, 1980)。语言学习策略指为了发展目的语的语言、社会语言能力而采取的策略。","w":"normal","e":["核心考点"]},{"t":"交际策略","y":"名词解释","p":["交际策略是交际能力的一部分，是学习者因二语知识有限，在表达遇到困难时采取的一种弥补手段"],"q":"交际策略是交际能力的一部分，是学习者因二语知识有限，在表达遇到困难时采取的一种弥补手段。学习者缺乏合适的语言资源来表达自己的意图，只得用这种方法补偿他们在语法知识或词汇上的欠缺，以达到交际任务。","w":"normal","e":["核心考点"]},{"t":"元认知策略","y":"名词解释","p":["元认知策略指学习者试图通过学习前计划、学习中监控和学习后评估来规范语言学习的活动，具有执行和控制的功能，如引导注意、自我管理等","它是用来协调学习活动和认知加工过程的"],"q":"元认知策略指学习者试图通过学习前计划、学习中监控和学习后评估来规范语言学习的活动，具有执行和控制的功能，如引导注意、自我管理等。它是用来协调学习活动和认知加工过程的。","w":"normal","e":["核心考点"]},{"t":"认知策略","y":"名词解释","p":["认知策略指学习者用以提高学习及记忆能力，特别是完成具体的课堂任务时的行为，是在对学习材料进行直接分析、综合和转换等过程中采取的步骤或操作，具有操作加工或认知加工的功能"],"q":"认知策略指学习者用以提高学习及记忆能力，特别是完成具体的课堂任务时的行为，是在对学习材料进行直接分析、综合和转换等过程中采取的步骤或操作，具有操作加工或认知加工的功能。","w":"normal","e":["核心考点"]},{"t":"显性学习和隐性学习分别指什么?请举例说明。","y":"简答题","p":["显性学习：通过显性手段（记忆法、语法分析）有意识学习，知识以显性方式储存","显性知识举例：学习'读者'时意识到'者'是表人词缀","隐性学习：学习者未意识到正在学什么的学习","隐性学习举例：接触大量'上上相连'音节后自然习得连读变调规则"],"q":"隐性学习 (implicit learning) 指学习者未意识到正在学什么的学习 (DeKeyser,2003)。例如学习者在接触了大量'上上相连'的音节如'nǐhǎo, měihǎo, wǔbǎi,běihǎi, gěinǐ, yǔfǎ, kěyǐ, fǔdǎo'后, 可能在无意识状态下自然习得了连读变调的规则。","w":"high","e":["教材高频"]},{"t":"O'Malley和Chamot(1990)从功能角度，将策略分为元认知策略、______策略和社交/情感策略三大类。","y":"填空题","p":["O'Malley和Chamot(1990)从功能角度，将策略分为元认知策略、认知策略和社交/情感策略三大类。"],"q":"O' Malley和 Chamot (1990) 从功能角度, 将策略分为元认知策略、认知策略和社交/情感策略三大类。","w":"normal","e":["核心考点"]},{"t":"Oxford(1990)根据策略与语言心理加工的关系，将策略分为直接策略和间接策略，下列属于直接策略的是（　　）。","y":"单项选择题","p":["Oxford(1990)将策略分为直接策略和间接策略。直接策略与目的语学习加工直接相关，包括记忆策略、认知策略和补偿策略；间接策略包括元认知策略、情感策略和社交策略。"],"q":"直接策略与目的语学习加工直接相关，包括记忆策略、认知策略和补偿策略。……间接策略指通过聚焦、计划、评估、寻求机会、控制焦虑、增加合作等各种方式间接支持语言学习的各种策略，包括元认知策略、情感策略和社交策略。","w":"normal","e":["核心考点"]},{"t":"语言运用策略","y":"名词解释","p":["语言运用策略是根据策略运用的目的，与语言学习策略相对的一类策略","产出策略指尝试用最小努力达到有效、清楚使用目的语的目的","交际策略是学习者因二语知识有限，在表达遇到困难时采取的一种弥补手段"],"q":"2. 语言运用策略……(1) 产出策略。产出策略指尝试用最小努力达到有效、清楚使用目的语的目的。……(2) 交际策略。交际策略是交际能力的一部分","w":"normal","e":["核心考点"]}]},{"id":"rumen-c04-s07","t":"第七节 语言普遍性假说","w":"high","n":4,"k":[{"t":"普遍语法","y":"名词解释","p":["乔姆斯基认为，儿童的母语知识来源于普遍语法（Universal Grammar）","它是一套天生的内在的语言规则，支配着任何语言可能的句法形式","普遍语法由原则和参数构成"],"q":"乔姆斯基认为：儿童的母语知识来源于普遍语法 (Universal Grammar)。它是一套天生的内在的语言规则，支配着任何语言可能的句法形式。","w":"high","e":["教材高频"]},{"t":"蕴含普遍性","y":"名词解释","p":["蕴含普遍性将一种语言特征的存在与另外一种或一些语言特征的存在联系起来","如果特征X存在于某种语言之中，那么我们就可以推论特征Y，Z，……，N也存在"],"q":"语言类型普遍性中有一个很重要的概念是蕴含普遍性。蕴含普遍性将一种语言特征的存在与另外一种或一些语言特征的存在联系起来。如果特征X存在于某种语言之中，那么我们就可以推论特征Y，Z，……，N也存在。","w":"normal","e":["核心考点"]},{"t":"标记","y":"名词解释","p":["相关问题是标记（markedness）理论","无标记语言点是最常见、最普遍、最自然的，属于核心规则","有标记语言点是不那么常见、不那么普遍、不那么自然的，属于外围规则"],"q":"相关问题是标记(markedness) 理论。无标记语言点是最常见、最普遍、最自然的，属于核心规则； 有标记语言点是不那么常见、不那么普遍、不那么自然的，属于外围规则。有标记规则和无标记规则是一个连续体中的两端。","w":"high","e":["教材高频"]},{"t":"什么是蕴含普遍性?请举例说明。","y":"简答题","p":["蕴含普遍性：一种语言特征的存在与另一种或一些语言特征的存在相联系","如果特征X存在，则可推论特征Y、Z…N也存在","格林伯格提出层级概念，清辅音层级比浊辅音高","颜色词系列：白、黑>红>绿、黄>蓝>褐>紫、粉红、橙、灰","关系从句可及性层级：主语>直宾>间宾>介宾>属格>比宾"],"q":"蕴含普遍性将一种语言特征的存在与另外一种或一些语言特征的存在联系起来。如果特征X存在于某种语言之中，那么我们就可以推论特征Y，Z，……，N也存在。……如颜色词在不同语言中存在的情况不同","w":"normal","e":["核心考点"]}]},{"id":"rumen-c04-s08","t":"第八节 其他语言习得假说","w":"high","n":6,"k":[{"t":"文化适应模式","y":"名词解释","p":["文化适应模式（Acculturation Model）的基本假设是：二语习得只是文化适应的一个方面，学习者对目的语社会文化适应的程度决定他习得二语的程度","该模式通过社会距离的八个因素和心理距离的四个因素来分析和阐述文化适应的程度"],"q":"文化适应模式(Acculturation Model) 的基本假设是：二语习得只是文化适应的一个方面，学习者对目的语社会文化适应的程度决定他习得二语的程度 (Schumann，1978)。该模式通过社会距离的八个因素和心理距离的四个因素来分析和阐述文化适应的程度。","w":"high","e":["教材高频"]},{"t":"竞争模式","y":"名词解释","p":["竞争模式（Competition Model）由MacWhinney和Bates（1984）等人提出","该模式认为，语言交流是语言的两个层面——形式层与功能层相互投射（mapping）的结果","语言产出是说话人把功能层的功能映射到形式层，语言理解则是听话人把形式层的词语投射到功能层","两层面间的投射通过线索（cues）来实现"],"q":"竞争模式(Competition Model) 由 MacWhinney和 Bates (1984) 等人提出。该模式认为，语言交流是语言的两个层面———形式层与功能层相互投射 (mapping) 的结果。","w":"normal","e":["核心考点"]},{"t":"界面假说","y":"名词解释","p":["界面假说（Interface Hypothesis）由Sorace和Filiace（2006）提出","它认为人脑存在的语言系统，包括语音、形态、句法、语义等模块，都有自己的组织结构、层级和运作机制","同时还有联系不同模块的运作机制，即句法和语义界面、形态与语音界面等","界面是语言模块间的相互映射","成人二语者的学习困难，是涉及不同界面语言现象的整合出现了问题"],"q":"界面假说 (Interface Hypothesis) 由 Sorace 和 Filiace (2006) 提出。它认为人脑存在的语言系统，包括语音、形态、句法、语义等模块，都有自己的组织结构、层级和运作机制","w":"normal","e":["核心考点"]},{"t":"动态系统理论","y":"名词解释","p":["Larsen-Freeman（1997）将动态系统理论（Dynamic Systems Theory）引入语言学，认为语言学习并不是单纯的线性发展过程，而是充满停滞、倒退或者跳跃前进的动态系统行为","其特点包括全面联结性、开放性、非线性发展、不可预测性、自组织过程"],"q":"Larsen-Freeman(1997) 将动态系统理论 (Dynamic Systems Theory) 引入语言学,认为语言学习并不是单纯的线性发展过程，而是充满停滞、倒退或者跳跃前进的动态系统行为。","w":"normal","e":["核心考点"]},{"t":"中介语石化","y":"名词解释","p":["中介语石化现象就是中介语处在某个吸引状态（attractor state）","在自组织过程中，系统被某个因素吸引，导致发展停滞"],"q":"中介语石化现象就是中介语处在某个吸态。","w":"normal","e":["核心考点"]},{"t":"简述文化适应模式中社会距离的八个因素和心理距离的四个因素。","y":"简答题","p":["社会距离八因素：①社会主导模式；②融合策略；③封闭性；④凝聚性；⑤学习者群体规模；⑥文化一致性；⑦群体态度；⑧打算居留时限","心理距离四因素：①语言休克；②文化休克；③学习动机；④自我渗透性","社会距离关注群体间社会关系，心理距离关注个体情感因素","距离过大导致习得停滞、语言形式'皮钦化'"],"q":"该模式通过社会距离的八个因素和心理距离的四个因素来分析和阐述文化适应的程度。……(一) 社会距离因素……(二) 心理距离因素","w":"normal","e":["核心考点"]}]}]},{"id":"rumen-c05","t":"第五章 语言测试与成绩分析","w":"high","s":[{"id":"rumen-c05-s01","t":"第一节 语言测试的性质与目的","w":"high","n":3,"k":[{"t":"语言测试","y":"名词解释","p":["语言测试是对受试者的语言能力所进行的定量与定性评估","一般认为，语言测试应具有代表性、客观性、科学性、社会性四个基本要素"],"q":"语言测试是对受试者的语言能力所进行的定量与定性评估。一般认为，语言测试应具有以下基本要素：","w":"high","e":["教材高频"]},{"t":"形成性评价和总结性评价","y":"名词解释","p":["评价包括总结性评价和形成性评价","总结性评价注重回溯和总结已学的内容，形成性评价能给教学和学习提供反馈和指导","前者判定学习成果，后者则告知未来学习的努力方向"],"q":"语言测试是一种特殊的评价。评价包括总结性评价和形成性评价。总结性评价注重回溯 (retrospective) 和总结已学的内容，形成性评价能给教学和学习提供反馈和指导。","w":"normal","e":["核心考点"]},{"t":"为什么要进行语言测试?简述语言测试的目的。","y":"简答题","p":["测试是教学活动四大环节之一（总体设计、教材编写、课堂教学、测试）","检验学生学习情况和教师教学效果","从教的角度：反映教学质量效益、发现问题、促进教学","从学的角度：检查学习进程、鉴定学习成绩","测试是选拔和科研的重要方法","主要目的：反馈、选择、研究"],"q":"测试是语言教学的重要组成部分，是一般教学活动四大环节 (总体设计、教材编写、课堂教学、测试) 之一。它的主要目的是检验学生语言的学习情况和教师的教学效果。……因此语言测试在语言教学中有着举足轻重的作用，其主要目的在于反馈、选择、研究。","w":"high","e":["教材高频"]}]},{"id":"rumen-c05-s02","t":"第二节 语言测试的类别","w":"high","n":17,"k":[{"t":"分散测试","y":"名词解释","p":["分散测试（discrete point test）指用不同的语言项目分别检测学生不同的知识和技能"],"q":"分散测试 (discrete point test) 指用不同的语言项目分别检测学生不同的知识和技能。","w":"high","e":["教材高频"]},{"t":"综合性测试","y":"名词解释","p":["综合性测试（integrative test）指全面检测学生综合运用语言的能力","由于人们在交际中往往同时使用几种不同的语言技能，因此测试应该是综合性的，同时检测考生的多种技能"],"q":"综合性测试 (integrative test) 指全面检测学生综合运用语言的能力。由于人们在交际中往往同时使用几种不同的语言技能，如在会话中要运用听说两种技能，因此测试应该是综合性的，同时检测考生的多种技能","w":"high","e":["教材高频"]},{"t":"主观测试","y":"名词解释","p":["主观测试是指测试题为主观题","在主观测试中，评分员对考生回答的反应相当重要"],"q":"主观测试是指测试题为主观题。在主观测试中，评分员对考生回答的反应相当重要。","w":"high","e":["教材高频"]},{"t":"客观测试","y":"名词解释","p":["客观测试中，所有考生成绩的评判都依据一个客观标准","如多项选择题，要求在四五个答案中选一个正确的，选对了得分，选错了没分"],"q":"客观测试就不会出现上述问题。在客观测试中，所有考生成绩的评判都依据一个客观标准。如多项选择题，要求在四五个答案中选一个正确的，选对了得分，选错了没分。","w":"normal","e":["核心考点"]},{"t":"分班测试和学能测试","y":"名词解释","p":["这两种测试都是为了将来的学习，其区别在于：分班测试着重测量学生现实的实际水平，学能测试（aptitude test）着重测量学生将来的潜在能力"],"q":"这两种测试都是为了将来的学习，其区别在于：分班测试着重测量学生现实的实际水平, 学能测试 (aptitude test) 着重测量学生将来的潜在能力。","w":"normal","e":["核心考点"]},{"t":"成绩测试","y":"名词解释","p":["成绩测试的目的在于检查学生对所学课程的掌握程度","其特点是学了什么考什么"],"q":"成绩测试的目的在于检查学生对所学课程的掌握程度。其特点是学了什么考什么。某一课程，如口语的期中期末考试，就是成绩测试。","w":"high","e":["教材高频"]},{"t":"水平测试","y":"名词解释","p":["水平测试的目的是检测学生运用二语的能力","其特点是通过特定的语言项目来考核学生运用二语进行交际的能力，不以某一套检测、某一个课程为依据"],"q":"水平测试的目的是检测学生运用二语的能力。其特点是通过特定的语言项目来考核学生运用二语进行交际的能力，不以某一套检测、某一个课程为依据。","w":"high","e":["教材高频"]},{"t":"常模参照测试和标准参照测试","y":"名词解释","p":["常模参照测试是为了显示考生语言能力的差异，每个考生的成绩只需要跟其他考生比较","标准参照测试是为了显示考生水平跟某种标准的距离，每个考生的分数主要跟规定的标准比较"],"q":"常模参照测试是为了显示考生语言能力的差异，每个考生的成绩只需要跟其他考生比较。……标准参照测试是为了显示考生水平跟某种标准的距离，每个考生的分数主要跟规定的标准比较。","w":"normal","e":["核心考点"]},{"t":"动态性测试","y":"名词解释","p":["动态性测试（dynamic assessment）是以社会文化理论，尤其是以最近发展区（zone of proximal development）为核心的维果斯基认知发展理论为基础的一种测试理论和类型","动态性测试强调与教学紧密结合，主要目标在于评判考生的发展潜力，即未来的语言发展可能性"],"q":"动态性测试 (dynamic assessment) 是以社会文化理论, 尤其是以最近发展区 (zone of proximal development) 为核心的维果斯基认知发展理论为基础的一种测试理论和类型。","w":"normal","e":["核心考点"]},{"t":"诊断测试","y":"名词解释","p":["诊断测试与成绩测试相反","成绩测试关注的是学习成功的程度，诊断测试关注的则是失败的程度","诊断测试常常用来发现教、学方面存在的问题","其目的是改进教学，调整教学计划，进行个别指导"],"q":"诊断测试与成绩测试相反。成绩测试关注的是学习成功的程度，诊断测试关注的则是失败的程度。诊断测试常常用来发现教、学方面存在的问题。其目的是改进教学，调整教学计划, 进行个别指导。","w":"normal","e":["核心考点"]},{"t":"举例说明成绩测试与水平测试的异同。","y":"简答题","p":["区别主要在于测试的内容和目的","成绩测试：检查学生对所学课程掌握程度，学了什么考什么，如口语期中期末考试","成绩测试内容与教学进度、练习形式一致","水平测试：检测学生运用二语进行交际的能力，不以某一课程为依据","水平测试内容超出正规课堂教学范围（如HSK、托福）","相同点：都是语言测试的重要类别，都用于评估学习者语言状况"],"q":"二者的区别主要在于测试的内容和目的。成绩测试的目的在于检查学生对所学课程的掌握程度。其特点是学了什么考什么。……水平测试的目的是检测学生运用二语的能力。……美国的托福考试、我国的汉语水平考试、英国的剑桥英语考试等，都是水平测试。","w":"high","e":["教材高频"]},{"t":"什么是主观测试?如何控制主观题评分的主观性?","y":"简答题","p":["主观测试：测试题为主观题，评分员对考生回答的反应很重要","如写作、口语考试，不同评分员可能给不同分数","控制方法：确定具体统一的评分标准","评分员经过专门的选拔与培训","OPI测试员需经专门选拔与培训后才上岗","主观测试有利于检测学生实际交际的技能"],"q":"主观测试是指测试题为主观题。在主观测试中，评分员对考生回答的反应相当重要。……因此，确定具体统一的评分标准，评分员经过培训，是保证主观测试信度的重要条件。","w":"normal","e":["核心考点"]},{"t":"主观测试和客观测试的区别主要在于命题的客观或主观，与评判成绩的方式没有关系。","y":"判断题","p":["主观测试和客观测试的区别主要在于评判成绩的方式不同，与命题的客观或主观、答题的客观或主观没有关系（李筱菊，1997）。"],"q":"这两种测试的区别主要在于评判成绩的方式不同，与命题的客观或主观、答题的客观或主观没有关系 (李筱菊，1997)。","w":"normal","e":["核心考点"]},{"t":"在各项语言测试项目中，写作的评分标准最容易把握，可靠性系数最高。","y":"判断题","p":["一般说来，在各项语言测试项目中，语法、词汇、阅读的可靠性系数比较高，通常达0.85~0.98；听力次之；口语又次之；写作的评分标准最难把握，可靠性系数最低。"],"q":"一般说来，在各项语言测试项目中，语法、词汇、阅读的可靠性系数比较高，通常达0.85~0.98; 听力次之, 通常达0.8~0.89; 口语又次之, 通常是0.7~0.79;写作的评分标准最难把握，可靠性系数最低。","w":"normal","e":["核心考点"]},{"t":"普通话水平测试属于标准参照测试。","y":"判断题","p":["标准参照测试是为了显示考生水平跟某种标准的距离，每个考生的分数主要跟规定的标准比较。普通话水平测试属于标准参照测试。"],"q":"标准参照测试是为了显示考生水平跟某种标准的距离，每个考生的分数主要跟规定的标准比较。……普通话水平测试属于标准参照测试。","w":"normal","e":["核心考点"]},{"t":"HSK、托福、剑桥英语考试等属于（　　）。","y":"单项选择题","p":["水平测试的目的是检测学生运用二语的能力，其特点是通过特定的语言项目来考核学生运用二语进行交际的能力，不以某一套检测、某一个课程为依据。美国的托福考试、我国的汉语水平考试、英国的剑桥英语考试等，都是水平测试。"],"q":"美国的托福考试、我国的汉语水平考试、英国的剑桥英语考试等，都是水平测试。","w":"high","e":["教材高频"]},{"t":"成绩测试关注的是学习成功的程度，而（　　）关注的则是失败的程度，常用来发现教、学方面存在的问题。","y":"单项选择题","p":["诊断测试与成绩测试相反。成绩测试关注的是学习成功的程度，诊断测试关注的则是失败的程度。诊断测试常常用来发现教、学方面存在的问题。"],"q":"诊断测试与成绩测试相反。成绩测试关注的是学习成功的程度，诊断测试关注的则是失败的程度。诊断测试常常用来发现教、学方面存在的问题。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c05-s03","t":"第三节 语言测试的原则和特点","w":"high","n":6,"k":[{"t":"信度","y":"名词解释","p":["信度又叫'可靠性'（reliability）","所谓可靠性的测量，指用同一标准在同样方式下测量同一个人或物体时，每一次应该产生相同的值，即结果一样","在测试方面，可靠性则指测试结果的稳定性"],"q":"可靠性又叫'信度' (reliability)。所谓可靠性的测量，指用同一标准在同样方式下测量同一个人或物体时，每一次应该产生相同的值，即结果一样。在测试方面，可靠性则指测试结果的稳定性。","w":"high","e":["教材高频"]},{"t":"效度","y":"名词解释","p":["效度又叫'有效性'（validity），指测试是否能达到测试的目的","例如，试题要考什么，有没有考出要考的东西"],"q":"有效性又叫'效度' (validity)，指测试是否能达到测试的目的。例如，试题要考什么，有没有考出要考的东西。","w":"high","e":["教材高频"]},{"t":"简述语言测试的四项原则（针对性、可靠性、有效性、实用性）。","y":"简答题","p":["①针对性：为达到特定目的而测试，内容与课程进度、练习形式相配合","②可靠性（信度）：测试结果的稳定性，用重测法、对等法检验","③有效性（效度）：测试是否达到目的，从内容、标准、共时、预测检测","④实用性：可操作性，包括考试进行、判卷评分、管理方便俭省"],"q":"有关语言测试的基本原则，说法很多……具体来说，语言测试应该注意以下几个方面。一、针对性……二、可靠性……三、有效性……四、实用性","w":"high","e":["教材高频"]},{"t":"简述影响测试信度的主要因素。","y":"简答题","p":["①测试长度：题目多一些，可靠性高一些","②测试的同质性：各项试题相似或一致程度，同质性高则信度高","③试题区分度：区分度高则信度高","④评分准确性：客观测试评分准确性高，主观测试较低","此外，测试的场所、环境、设备等也有影响"],"q":"对测试信度产生影响的可能因素很多，但主要的可以概括如下：①测试长度。……②测试的同质性。……③试题区分度……④评分准确性。……此外，测试的场所、环境、设备等也会对可靠性产生一些影响。","w":"normal","e":["核心考点"]},{"t":"什么是标准差?在数据统计中标准差的意义是什么?","y":"简答题","p":["标准差是方差的平方根","方差：每个数据与平均数之差的平方和除以数据个数","标准差以原始单位表示，便于解释","标准差表示数据的离散程度：越大越分散，越小越集中","标准差是标准分（Z分数）计算的基础"],"q":"方差的不便之处是它的度量单位，因为它是一个平方数。为了方便，又引入了标准差这个统计指标。标准差的计算方法是求方差的平方根，用s 表示。标准差是最重要的统计度量之一，它是用来表示一组数据中每个值跟均值的差的典型量。","w":"normal","e":["核心考点"]},{"t":"测试的可靠性一般用0.0~1.0之间的数字表达，叫______系数。越接近1，可靠性就越高。","y":"填空题","p":["测试的可靠性一般用0.0~1.0之间的数字表达，叫可靠性系数。越接近1，可靠性就越高；越接近0，可靠性就越低。"],"q":"测试的可靠性一般用0.0~1.0之间的数字表达，叫可靠性系数。越接近1，可靠性就越高； 越接近0，可靠性就越低。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c05-s04","t":"第四节 测试成绩分析","w":"high","n":9,"k":[{"t":"平均数、中位数和众数","y":"名词解释","p":["平均数（mean）又叫算术平均数、均值，其计算方法是用数字个数去除数字总和","中位数（median）就是在一组数据中居于中间位置的数值","众数（mode）是指在一组数据中出现次数最多的那个数值"],"q":"平均数(mean) 又叫算术平均数、均值。其计算方法是用数字个数去除数字总和即可得出。……中位数(median) 就是在一组数据中居于中间位置的数值。……众数 (mode) 是指在一组数据中出现次数最多的那个数值。","w":"high","e":["教材高频"]},{"t":"方差和标准差","y":"名词解释","p":["方差和标准差是描写数据的离散性特征最常用的统计指标","方差的计算方法是：先把一组数据中每个数据与该组数据的平均数之差进行平方，再求其和，然后再除以数据的个数","标准差的计算方法是求方差的平方根"],"q":"方差和标准差是描写数据的离散性特征最常用的统计指标。方差的计算方法是：先把一组数据中每个数据与该组数据的平均数之差进行平方，再求其和，然后再除以数据的个数。","w":"high","e":["教材高频"]},{"t":"全距和四分位间距","y":"名词解释","p":["把一组数据按从小到大的顺序排列，用最大值减去最小值，所得的值就是全距","四分位间距的计算方法是：把数据从小到大排列，然后把它分为四个相等的分位，把第三个四分位的值减去第一个四分位的值，所得到的值叫作四分位间距"],"q":"把一组数据按从小到大的顺序排列，用最大值减去最小值，所得的值就是全距。……把第三个四分位的值减去第一个四分位的值，所得到的值叫作四分位间距。","w":"normal","e":["核心考点"]},{"t":"标准分","y":"名词解释","p":["测试成绩的标准化是为了得出一个标准分，标准分的作用是便于比较不同测试形式与内容的测试成绩","标准分（又称Z分数）是以标准差为单位，表示某一分数与平均数的差"],"q":"测试成绩的标准化是为了得出一个标准分，标准分的作用是便于比较不同测试形式与内容的测试成绩。直接从试卷中得出的分数是原始分，原始分只能比较同一次的测试，而不能对不同时候的测试进行比较。为了比较，常常需要把原始分化成标准分(又称为Z分数)。","w":"normal","e":["核心考点"]},{"t":"百分位","y":"名词解释","p":["百分位（percentile rank）是指某一成绩在全部考生成绩中百分比的位置"],"q":"百分位 (percentile rank) 是指某一成绩在全部考生成绩中百分比的位置。……百分位的统计是为了对考生进行筛选。","w":"normal","e":["核心考点"]},{"t":"什么是标准分?如何计算?计算标准分有什么意义?","y":"简答题","p":["标准分便于比较不同测试形式与内容的测试成绩","原始分只能比较同一次测试，标准分（Z分数）可跨测试比较","标准分以标准差为单位，表示某一分数与平均数的差","公式：Z=(原始分-平均分)/标准差","正分高于平均分，负分低于平均分，等于平均分时为0","意义：便于比较不同测试的成绩"],"q":"标准分是以标准差为单位，表示某一分数与平均数的差。……从上面的计算可以看出，标准分实际上就是原始分与平均分的距离，即某一原始分高于或低于平均分几个标准差。","w":"normal","e":["核心考点"]},{"t":"简述试题分析的两种方法（总分对比法、内外比较法）。","y":"简答题","p":["试题分析目的：使试卷具有针对性、可靠性、有效性和实用性","①总分对比法：把考生总分从高到低排列，分析每题作答情况","总分对比法：高分者做错而低分者做对的题值得怀疑（区分度差）","②内外比较法：成绩测试将考试成绩与平时成绩比较","内外比较法：能力测试将考试成绩与试后交际实际情况比较，检验效度"],"q":"试题分析主要是为了使试卷具有针对性、可靠性、有效性和实用性。……(一) 总分对比法……(二) 内外比较法","w":"normal","e":["核心考点"]},{"t":"当一组数据出现不同质的数据时，或数据分布中出现极端数据时，可以用______对该组数据的集中趋势做粗略估计。","y":"填空题","p":["众数是指在一组数据中出现次数最多的那个数值，可以不止一个。当一组数据出现不同质的数据时，或数据分布中出现极端数据时，可以用众数对集中趋势做粗略估计。"],"q":"当一组数据出现不同质的数据时，或数据分布中出现极端数据时，可以用众数对该组数据的集中趋势做粗略估计。","w":"normal","e":["核心考点"]},{"t":"在一次考试中，某考生分数正好等于平均分，则其标准分是（　　）。","y":"单项选择题","p":["标准分实际上就是原始分与平均分的距离。如果某考生的分数正好是某次考试的平均分，那么他的标准分就是0。"],"q":"如果某考生的分数正好是某次考试的平均分，那么他的标准分就是0。从上面的公式还可以看出，标准分可以是正的，也可以是负的。","w":"normal","e":["核心考点"]}]}]},{"id":"rumen-c06","t":"第六章 教材的评估、使用与开发","w":"high","s":[{"id":"rumen-c06-s01","t":"第一节 教材分类","w":"high","n":8,"k":[{"t":"教材","y":"名词解释","p":["教材是教师组织教学、学生进行学习的依据","它不仅规定教学内容，还体现教学方法和原则，保证教学大纲实施"],"q":"教材是教师组织教学、学生进行学习的依据。它不仅规定教学内容，还体现教学方法和原则，保证教学大纲实施。科学研发、合理使用教材，可提高教和学的质量，促进课程建设。","w":"high","e":["教材高频"]},{"t":"专用汉语","y":"名词解释","p":["专用汉语又叫'特殊用途汉语'（Chinese for specific purposes），满足某种专门需求，其目标明确，针对性强，跟实际应用结合，使用价值高","专用汉语教材收录大量跟专门用途密切相关的词汇和某些句式，并有相关的交际场景"],"q":"专用汉语又叫'特殊用途汉语'  (Chinese for specific purposes), 满足某种专门需求，其目标明确，针对性强，跟实际应用结合，使用价值高。","w":"normal","e":["核心考点"]},{"t":"教材纲目","y":"名词解释","p":["编写教材时精心考虑、贯穿整个教材的主要内容或主要线索，就是教材纲目","常见的有语言为纲、话题为纲、交际为纲、课文为纲、文化为纲等"],"q":"编写教材时精心考虑、贯穿整个教材的主要内容或主要线索，就是教材纲目。","w":"normal","e":["核心考点"]},{"t":"教材的推进模式（直线式与螺旋式）","y":"名词解释","p":["教材的推进模式有直线式和螺旋式两种","直线式是将某项内容分为若干部分，一课教一部分，由易到难地直线排列","螺旋式根据交际需要，把话题由易到难分成几个圈，每个圈都将主要话题出现一遍，呈螺旋状上升"],"q":"教材的推进模式有直线式和螺旋式两种。直线式是将某项内容分为若干部分，一课教一部分，由易到难地直线排列。……螺旋式根据交际需要，把话题由易到难分成几个圈，每个圈都将主要话题出现一遍，呈螺旋状上升。","w":"normal","e":["核心考点"]},{"t":"教材分类可以从哪四个角度考虑?请简要说明。","y":"简答题","p":["①媒介性质：纸质教材、多媒体教材、网络教材","②课程内容：技能类课程教材（通用汉语、专用汉语）、知识类课程教材","③标准参照：教学环境、教学类别、教学对象、教学期限、教学形式","④组织结构：编写纲目、单元划分、每课构成、推进模式","科学分类有助于认识教材性质特点、合理选用教材、建立教材体系"],"q":"对教材进行科学分类，有助于认识教材的性质特点，合理选择、使用教材； 有助于建立教材体系，完善资源建设。教材分类的角度很多，以下从四个角度探讨教材分类：教材媒介，课程，标准参照，教材结构。","w":"normal","e":["核心考点"]},{"t":"职业性专用汉语是为了让学习者用汉语学习某个专业，如科技汉语、医科汉语、经贸汉语等。","y":"判断题","p":["职业性专用汉语是为了让学习者用汉语从事特定职业，课程如商务汉语、旅游汉语、酒店汉语、法律汉语、空乘服务汉语等。教育性专用汉语是为了让学习者用汉语学习某个专业，课程如科技汉语、医科汉语、经贸汉语、人文汉语、社科汉语等。"],"q":"(1) 职业性专用汉语。职业性专用汉语是为了让学习者用汉语从事特定职业，课程如商务汉语、旅游汉语、酒店汉语、法律汉语、空乘服务汉语等。……(2) 教育性专用汉语。教育性专用汉语是为了让学习者用汉语学习某个专业，课程如科技汉语、医科汉语、经贸汉语、人文汉语、社科汉语等。","w":"normal","e":["核心考点"]},{"t":"教材的推进模式有______和螺旋式两种。","y":"填空题","p":["教材的推进模式有直线式和螺旋式两种。直线式是将某项内容分为若干部分，一课教一部分，由易到难地直线排列。"],"q":"教材的推进模式有直线式和螺旋式两种。直线式是将某项内容分为若干部分，一课教一部分，由易到难地直线排列。","w":"normal","e":["核心考点"]},{"t":"下列教材中，属于专用汉语教材的是（　　）。","y":"单项选择题","p":["专用汉语教材指可以满足某种专门需求（从事某一职业，或学习某类专业）的教材，如《新世纪商用汉语》《医学汉语·实习篇》《中国法律专业汉语教程》等。"],"q":"专用汉语教材指可以满足某种专门需求 (从事某一职业，或学习某类专业) 的教材，占课堂教材的5.2%。如《新世纪商用汉语》⑩《医学汉语·实习篇》⑪《中国法律专业汉语教程》⑫……","w":"normal","e":["核心考点"]}]},{"id":"rumen-c06-s02","t":"第二节 教材评估的基本内容与方法","w":"high","n":18,"k":[{"t":"教材评估","y":"名词解释","p":["教材评估，就是对教材的使用效果进行评判，对学习型教材的价值进行测量（Tomlison & Masuhara, 2007）"],"q":"教材评估，就是对教材的使用效果进行评判，对学习型教材的价值进行测量(Tomlison & Masuhara, 2007)。","w":"high","e":["教材高频"]},{"t":"使用前评估","y":"名词解释","p":["使用前评估指决定使用什么教材时进行的评估","评估的考量点通常有：课程需要，学生对知识技能的需求，学生实际水平，评价者对教材的初步认识"],"q":"使用前评估指决定使用什么教材时进行的评估 (周小兵，2009)。评估的考量点通常有：课程需要，学生对知识技能的需求，学生实际水平，评价者对教材的初步认识。","w":"normal","e":["核心考点"]},{"t":"使用中评估和使用后评估","y":"名词解释","p":["使用中评估指根据教材使用过程中的实际效果，对教材价值进行测量","使用后评估指教材完整使用之后，教师、学生或者研究人员对它的系统评价"],"q":"使用中评估指根据教材使用过程中的实际效果，对教材价值进行测量。……使用后评估指教材完整使用之后，教师、学生或者研究人员对它的系统评价。","w":"normal","e":["核心考点"]},{"t":"通用教材","y":"名词解释","p":["通用教材指为某一类教学对象及特定教学目标编写的教材","'某一类教学对象'指成人/非成人、学历生/非学历生等，或初中高不同阶段的学习者，但不限于特定国家和母语背景，具有普适性"],"q":"通用教材指为某一类教学对象及特定教学目标编写的教材。'某一类教学对象'指成人/非成人、学历生/非学历生等，或初中高不同阶段的学习者，但不限于特定国家和母语背景，具有普适性。","w":"normal","e":["核心考点"]},{"t":"区域教材","y":"名词解释","p":["区域教材，指根据学习者所在国家、地区教育体制、社会文化、学习者母语特点等因素开发的适合当地人学习的教材","区域教材能满足特定区域使用者的需要，具有本土性"],"q":"区域教材，指根据学习者所在国家、地区教育体制、社会文化、学习者母语特点等因素开发的适合当地人学习的教材(周小兵、陈楠，2013)。区域教材能满足特定区域使用者的需要，具有本土性。","w":"high","e":["教材高频"]},{"t":"机械性练习、理解性练习、应用性练习","y":"名词解释","p":["机械性练习不需要经过太多思考，如模仿、替换、扩展、认读等","理解性练习需要进行思考和选择，如回答问题、复述课文、完成句子、翻译等","应用性练习主要为交际性练习，如情景对话、辩论、角色扮演、听故事表演等"],"q":"机械性练习不需要经过太多思考，如模仿、替换、扩展、认读等。……理解性练习需要进行思考和选择，如回答问题、复述课文、完成句子、翻译等。……应用性练习主要为交际性练习，如情景对话、辩论、角色扮演、听故事表演等。","w":"high","e":["教材高频"]},{"t":"理解性练习与产出性练习","y":"名词解释","p":["理解性练习，指不需要学习者输出语言形式，题型一般有选择、判断、匹配等","产出性练习，一般需要学习者输出句法结构，题型一般包括改写、描述图片、翻译句子、成段表述等"],"q":"理解性练习，指不需要学习者输出语言形式，题型一般有选择、判断、匹配等。……产出性练习，一般需要学习者输出句法结构，题型一般包括改写、描述图片、翻译句子、成段表述等。","w":"normal","e":["核心考点"]},{"t":"教材评估可以分为哪几种类型?每种类型的功能、特点是什么?","y":"简答题","p":["①使用前评估：决定使用什么教材时进行，考量课程需要、学生需求与水平、评价者初步认识","使用前评估特点：缺少实践检验，易受直觉经验影响，避免'印象性评价'","②使用中评估：根据使用过程的实际效果测量教材价值，有教学实践观察和总结，较客观","③使用后评估：教材完整使用后教师、学生或研究人员的系统评价","使用后评估方式：考试、访谈、问卷调查、教学笔记等；作用是决定继续使用或修订"],"q":"二、评估类型 (一) 使用前评估……(二) 使用中评估……(三) 使用后评估","w":"high","e":["教材高频"]},{"t":"教材评估应遵循哪些基本原则?制定评估原则需考虑哪两点?","y":"简答题","p":["①教学理念：教材以哪种语言理论为基础、侧重哪种教学法、知识传授与技能培养关系、技能训练比重、语言表达地道性与得体性","②学习理念：以哪种二语学习理论为基础、内容与需求是否一致、编排是否符合学习心理、语言水平是否相符、与以前所学是否衔接、是否顾及情感因素","评估应有基本指标和具体指标","赵金铭'对外汉语教材评估一览表'将九个方面细化为55个指标"],"q":"教材评估应该根据一套表述清楚的原则来实施。制定评估原则需要考虑以下两点：(一) 教学理念……(二) 学习理念","w":"normal","e":["核心考点"]},{"t":"教材评估的具体标准有哪些?请从指标分类导向的角度说明。","y":"简答题","p":["评估标准包括通用准则和具体指标（后者细化原则）","通用准则：赵金铭认为应遵循'教材编写理论'和'教材编写基本原则'","①媒介导向：与纸质、音像光盘等媒介性质相关","②内容导向：涉及话题和教学点","③年龄导向：学习者年龄影响兴趣、认知、情感、学习风格","④区域导向：涉及真实潜在使用环境，通用教材与区域教材"],"q":"评估应有基本指标和具体指标。后者能细化相关原则，让评估系统、准确、有理有据。……(三) 指标的分类导向 1. 媒介导向……2. 内容导向……3. 年龄导向……4. 区域导向","w":"normal","e":["核心考点"]},{"t":"教材文本内容的评估包括哪些方面?请简述对课文、语言要素、交际技能、练习活动的评估要点。","y":"简答题","p":["课文：是否有趣丰富、是否有用、是否多样化、是否规范、观点是否可接受、是否与文化和冲突、长度难度是否合适","语言要素：语音（准确性、科学性、本土性）、词汇（难度、数量、实用性、释义语境）、语法（选择、解释、语境）","交际技能：听说（纲目、输入方式、层级递进）、写作、打字与书写","练习活动：练习位置（集中/分散）、练习类型（机械性/理解性/应用性）、练习有效性"],"q":"六、教材评估的文本内容 (一) 课文……(二) 语言要素……(三) 交际技能……(四) 练习活动","w":"normal","e":["核心考点"]},{"t":"简述口语教材评估中关于'输入方式'的要点。","y":"简答题","p":["周小兵(1989)：跟说话直接联系的是听话而非阅读","实验发现'听力输入—口语输出'组在准确度、流利度、遗忘率上均优于'阅读输入—口语输出'组","好口语教材应先进行听力输入，形成'听感'再进行口语输出","《汉语听说教程》'表达练习'前有足量'听力练习'，符合语言技能习得规律","有的口语教材阅读量大，很难有效培养口头能力"],"q":"周小兵 (1989) 的研究显示，从生理、心理机制看，跟说话直接联系的不是阅读而是听话； 口语课效果不好，跟大量阅读输入有关。实验研究发现：'听力输入一口语输出'组在准确度、流利度、遗忘率等方面，均优于'阅读输入一口语输出'组。","w":"normal","e":["核心考点"]},{"t":"什么是练习的'集中练习'与'分散练习'?各有什么利弊?","y":"简答题","p":["集中练习：整体输入（讲解知识、技能），整体输出（练习）","分散练习：部分输入，部分输出","集中练习的弊端：与主体部分距离较大，不利于新知识吸收，不符合记忆规律","分散练习的优点：输入输出间距小，有利于短时间内消化吸收所学知识技能"],"q":"对比可知：A教材是'集中练习'，即整体输入(讲解知识、技能)，整体输出 (练习)；B教材是'分散练习'，即部分输入，部分输出。有学者认为，前者练习与课文等主体部分距离较大，不利于对新知识的吸收，不符合记忆规律； 后者输入、输出间距较小，有利于学习者在短时间内消化吸收所学知识技能。","w":"normal","e":["核心考点"]},{"t":"试述区域教材的作用及其发展前景，并结合教材评估的区域导向分析区域教材对汉语国际教育的意义。","y":"论述题","p":["区域教材定义：根据学习者所在国教育体制、社会文化、母语特点等开发的适合当地人学习的教材","作用①：提高教学效益，减少目标语文化与学习者母语文化的冲突矛盾","作用②：适应、反映学习者所在国情况，使二语教学融入当地教育体制，提高学习兴趣","作用③：依据学习特点难点设计教学点与顺序、教学方式、练习活动，降低学习难度","对西方学习者多用社交策略，对日本学习者减少社交策略、多用'替换''改句子'","发展：与通用教材同步发展，通用教材可搭配区域性教师手册/语料/练习","意义：99%以上学习者在本国学汉语，限制发展的瓶颈是适用的区域教材不足"],"q":"(2) 区域教材的作用。1) 提高教学效益，减少目标语文化与学习者母语文化的冲突矛盾……2) 适应、反映学习者所在国情况……3) 依据学习特点难点设计教学点与顺序、教学方式、练习活动等，以降低学习难度，提高教学效率。……(3) 区域教材的发展。区域教材将和通用教材同步发展。","w":"high","e":["教材高频"]},{"t":"产出性练习的学习效率比理解性练习要低一些。","y":"判断题","p":["根据以往研究成果，产出性练习的学习效率比理解性练习要高一些。理解性练习操练简单省时，产出性练习难度大、费时，但学习效率更高。"],"q":"产出性练习能够促使学习者熟练生成目标语言项目，但难度大、费时。根据以往研究成果，产出性练习的学习效率比理解性练习要高一些。","w":"normal","e":["核心考点"]},{"t":"以交际为纲的教材比较适合口语教材，也适合综合技能教材或读写、精读教材。","y":"判断题","p":["以交际为纲，比较适合口语教材，不太适合综合技能教材或读写、精读教材。"],"q":"这类教材根据交际功能项目、任务、场景的常用度或顺序来安排教学内容，较少考虑语言结构； 以交际为纲，比较适合口语教材，不太适合综合技能教材或读写、精读教材。","w":"normal","e":["核心考点"]},{"t":"赵金铭(1998)提出的'对外汉语教材评估一览表'，把前期准备、教学理论、学习理论、语言、材料、练习编排、注释解说、教材配套和其他等九个方面细化成具体的______个评估指标。","y":"填空题","p":["赵金铭(1998)提出的'对外汉语教材评估一览表'，把九个方面细化成具体的55个评估指标。"],"q":"如赵金铭(1998) 提出的'对外汉语教材评估一览表'，把'前期准备' '教学理论' '学习理论''语言''材料' '练习编排' '注释解说' '教材配套'和'其他'等九个方面，细化成具体的55个评估指标。","w":"normal","e":["核心考点"]},{"t":"根据教材评估的类型，'决定使用什么教材时进行的评估'属于（　　）。","y":"单项选择题","p":["使用前评估指决定使用什么教材时进行的评估。评估的考量点通常有：课程需要，学生对知识技能的需求，学生实际水平，评价者对教材的初步认识。"],"q":"使用前评估指决定使用什么教材时进行的评估 (周小兵，2009)。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c06-s03","t":"第五节 汉语语料库的建设与应用","w":"high","n":4,"k":[{"t":"中介语语料库","y":"名词解释","p":["汉语中介语语料库（国内外语学界称为'学习者语料库'）属于专用型语料库，服务于汉语二语教学"],"q":"北京语言大学BCC语料库、北京大学CCL语料库、国家语委现代汉语语料库等属于通用型语料库，服务于汉语二语教学的汉语中介语语料库(国内外语学界称为'学习者语料库') 属于专用型语料库。","w":"high","e":["教材高频"]},{"t":"汉语中介语语料库在建设时，收集和录入语料要注意哪些因素?","y":"简答题","p":["①真实可靠性：试卷作文数据'自然性'较弱，自由作文更自然但可能有抄袭","收集前教师先检查作文，避免录入教师修改过的二手语料，确保写作原貌","②代表性：语料要能真实反映学习者整体或大多数学习者的汉语面貌与水平","③平衡性：国别平衡性（建设实践中、研究视野中）、层级平衡性（初中高各层级）"],"q":"汉语中介语语料库的主要目的是对汉语学习者的汉语进行全面、系统、真实的调查和描述，通过与学习者第一语言语料对比，确认学习者的主要困难。因此，在收集录入语料时要注意以下因素。1. 真实可靠性……2. 代表性……3. 平衡性","w":"normal","e":["核心考点"]},{"t":"简述语料库在教材编写中的应用。","y":"简答题","p":["①生词选取和处理：统计高频词选取常用词为生词，按词频排序生词出现顺序","语料库技术保证生词不重复、减少超纲词、释义和例句更真实丰富","②课文素材难度控制：统计候选文本长度、用字量、用词量、超纲词数量及比率","用语料库技术控制词汇等级、安排各级词汇分布、确定课文排序","考虑语法点顺序，选择共有字词多的素材提高生字词复现率"],"q":"利用语料库编写教材逐渐成为学界热门。对此可以从两方面考察。1. 生词选取和处理……2. 课文素材难度控制","w":"normal","e":["核心考点"]},{"t":"下列属于通用型语料库的是（　　）。","y":"单项选择题","p":["北京语言大学BCC语料库、北京大学CCL语料库、国家语委现代汉语语料库等属于通用型语料库；服务于汉语二语教学的汉语中介语语料库属于专用型语料库。"],"q":"北京语言大学BCC语料库、北京大学CCL语料库、国家语委现代汉语语料库等属于通用型语料库，服务于汉语二语教学的汉语中介语语料库……属于专用型语料库。","w":"normal","e":["核心考点"]}]}]},{"id":"rumen-c07","t":"第七章 人才培养与教师发展","w":"high","s":[{"id":"rumen-c07-s01","t":"第一节 国际汉语教师的基本素质","w":"high","n":14,"k":[{"t":"《国际汉语教师标准》","y":"名词解释","p":["国家汉办2007年出台《国际汉语教师标准》（以下简称《教师标准》），对国际汉语教师所应具备的知识、能力和素质进行了全面描述","2012年，国家汉办对该标准进行了完善和修订，推出新版《教师标准》，为国际汉语教师的能力评价和资格认证提供了依据"],"q":"国家汉办2007年出台《国际汉语教师标准》(以下简称《教师标准》)，对国际汉语教师所应具备的知识、能力和素质进行了全面描述。2012 年，国家汉办对该标准进行了完善和修订，推出新版《教师标准》","w":"high","e":["教材高频"]},{"t":"亲和力","y":"名词解释","p":["亲和力是国际汉语教师的基本素质","有亲和力的汉语教师，容易获得学生和同行的认可，容易在事业上取得成就"],"q":"亲和力是国际汉语教师的基本素质。有亲和力的汉语教师，容易获得学生和同行的认可，容易在事业上取得成就。亲和力主要表现在两方面。","w":"normal","e":["核心考点"]},{"t":"国际汉语教师的基本素质有哪些?请从个人素质、知识储备、能力结构三方面说明。","y":"简答题","p":["①个人素质：责任心和事业心、亲和力、良好的心理素质","②知识储备：汉语知识、外语知识、跨学科知识、中华文化知识及才艺、世界文化知识和跨文化交际知识","③能力结构：教学能力（备课、教学实施、测试）、跨文化交际能力、文化传播能力、教学研究及创新能力","优秀教师应做到'以此为业、以此为乐、以此为荣、以此为善'"],"q":"以下从个人素质、知识储备和能力结构三方面，对国际汉语教师的基本素质进行讨论。一、个人素质……二、知识储备……三、能力结构","w":"high","e":["教材高频"]},{"t":"简述国际汉语教师的教学能力包括哪些方面。","y":"简答题","p":["教学能力是汉语教师能力结构的核心","①备课：教学设计能力、教学资源综合利用能力、编写教案、选用处理教材","②教学实施：课堂管理能力、口头表达能力、现代教育技术能力、处理意外情况","③测试：掌握测试评估知识与方法、选择设计测试、分析测试结果、调整改进教学"],"q":"(一) 教学能力。这是汉语教师能力结构的核心，包括海内、海外汉语教学能力，教学组织和课堂管理能力。以下从备课、教学实施与测试三方面讨论。","w":"normal","e":["核心考点"]},{"t":"简述中华文化传播能力的'内功'与'外功'，以及有效传播能力培养的内容与方式。","y":"简答题","p":["'内功'：对中华文化有广泛、正确的了解，掌握足够知识","'外功'：恰当、有效地进行文化传播，而非简单文化灌输","内容：选择合适受众的传播内容，有效传播是需求导向的过程","张治(2008)：美国学习者更需要现代活的文化知识（打招呼、招待客人等）","方式：使用适合受众的方式和手段，结合当地文化进行对比体验"],"q":"中华文化传播能力可分为'内功'  '外功'。 '内功'，要求教师对中华文化有广泛、正确的了解……有效传播能力的培养，可以从内容、方式两方面考虑。","w":"normal","e":["核心考点"]},{"t":"善待学生就是取悦学生，尽量满足学生的一切要求。","y":"判断题","p":["善待学生不等于取悦学生。有一位老师课后常请学生吃东西，帮学生去办各种私事，但因教学效果不好，教学评估得分却最低。"],"q":"善待学生不等于取悦学生。有一位老师课后常请学生吃东西，帮学生去办各种私事； 但因教学效果不好，教学评估得分却最低。","w":"normal","e":["核心考点"]},{"t":"国际汉语教师的'内功'指恰当、有效地进行文化传播，而不是简单地进行文化灌输。","y":"判断题","p":["中华文化传播能力可分为'内功''外功'。'内功'，要求教师对中华文化有广泛、正确的了解，通过有意识的学习和积累，掌握足够的知识；'外功'，指恰当、有效地进行文化传播，而不是简单地进行文化灌输。"],"q":"中华文化传播能力可分为'内功'  '外功'。 '内功'，要求教师对中华文化有广泛、正确的了解，通过有意识的学习和积累，掌握足够的知识； '外功'，指恰当、有效地进行文化传播，而不是简单地进行文化灌输。","w":"normal","e":["核心考点"]},{"t":"国际汉语教师能力，以往认为包括三种：教学能力、跨文化交际能力和______。","y":"填空题","p":["国际汉语教师能力，以往认为包括三种：教学能力，跨文化交际能力，研究能力。"],"q":"国际汉语教师能力，以往认为包括三种：教学能力，跨文化交际能力，研究能力。","w":"normal","e":["核心考点"]},{"t":"国际汉语教师能力结构的核心是（　　）。","y":"单项选择题","p":["教学能力是汉语教师能力结构的核心，包括海内、海外汉语教学能力，教学组织和课堂管理能力。"],"q":"(一) 教学能力。这是汉语教师能力结构的核心，包括海内、海外汉语教学能力，教学组织和课堂管理能力。","w":"normal","e":["核心考点"]},{"t":"亲和力","y":"名词解释","p":["亲和力是国际汉语教师的基本素质","有亲和力的汉语教师，容易获得学生和同行的认可，容易在事业上取得成就","亲和力主要表现在两方面：（1）善待学生","要时刻了解学生需求，关注学生反应，并根据学生的实际情况及时调整教学内容和方式","师生关系决定学生的兴趣，善待学生不等于取悦学生"],"q":"亲和力是国际汉语教师的基本素质。有亲和力的汉语教师，容易获得学生和同行的认可，容易在事业上取得成就。亲和力主要表现在两方面。","w":"normal","e":["核心考点"]},{"t":"简述国际汉语教师应具备的知识储备。","y":"简答题","p":["汉语知识","外语知识","跨学科知识（语言学、教育学、心理学、跨文化交际学等）","中华文化知识及才艺","世界文化知识和跨文化交际知识"],"q":"以下从个人素质、知识储备和能力结构三方面，对国际汉语教师的基本素质进行讨论。……二、知识储备 (一) 汉语知识 (二) 外语知识 (三) 跨学科知识 (四) 中华文化知识及才艺 (五) 世界文化知识和跨文化交际知识","w":"normal","e":["核心考点"]},{"t":"简述国际汉语教师的能力结构。","y":"简答题","p":["教学能力（核心）——备课、教学实施与测试","跨文化交际能力","文化传播能力（内功、外功）","教学研究及创新能力","以往认为包括教学能力、跨文化交际能力、研究能力三种"],"q":"国际汉语教师能力，以往认为包括三种：教学能力，跨文化交际能力，研究能力。……(一) 教学能力……(二) 跨文化交际能力……(三) 文化传播能力……(四) 教学研究及创新能力","w":"normal","e":["核心考点"]},{"t":"善待学生就是取悦学生，为了获得好评，教师可以课后常请学生吃东西、帮学生办私事。","y":"判断题","p":["错误","善待学生不等于取悦学生","教学效果是评价教师的关键"],"q":"善待学生不等于取悦学生。有一位老师课后常请学生吃东西，帮学生去办各种私事；但因教学效果不好，教学评估得分却最低。","w":"normal","e":["核心考点"]},{"t":"优秀的教师应该做到“以此为业、以此为乐、以此为荣、______”（崔希亮，2012）。","y":"填空题","p":["以此为善"],"q":"优秀的教师应该做到“以此为业、以此为乐、以此为荣、以此为善”(崔希亮，2012)。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c07-s02","t":"第二节 人才培养与技能训练","w":"high","n":8,"k":[{"t":"反思教学","y":"名词解释","p":["反思教学，是指教师以旁观者身份，从教和学的角度考察本人的教学是否有效、如何改善","它是一个'将学会教学与学会学习结合起来，努力提升教学实践的合理性，使自己成为学者型教师的过程'","反思教学，是教师专业发展的基本过程"],"q":"反思教学，是指教师以旁观者身份，从教和学的角度考察本人的教学是否有效、如何改善。它是一个'将“学会教学(learning how to teach)”与“学会学习(learning how to learn)”结合起来，努力提升教学实践的合理性，使自己成为学者型教师的过程'(熊川武，1999)。","w":"high","e":["教材高频"]},{"t":"以中山大学汉语国际教育硕士专业学位生的'全程见习实习'培养模式为例，说明语言教学技能的培养方式。","y":"简答题","p":["语言教学技能是核心能力，需要知识基础但更需教学实习和实践（做中学、做中教）","①见习阶段三步骤：课堂观摩、模拟教学、试讲","见习可在一学期完成，有固定指导教师","②实习阶段：独立或合作完成一门课程教学，集中培训，熟手教师全程指导","指导方式：互相听课、撰写听课报告、指导撰写教案、课型教研活动"],"q":"语言教学技能是汉语教师必备的核心能力。……实践应该循序渐进，可分为'见习''实习'两大阶段进行。……通过全程见习实习，研究生能把所学知识跟具体的教学实践结合起来，有效积累教学经验，培养汉语教学能力。","w":"high","e":["教材高频"]},{"t":"简述跨文化交际能力发展的四个阶段。","y":"简答题","p":["第一阶段：跨文化意识的形成（意识到文化差异）","第二阶段：多元文化意识的建立（理解尊重不同文化，去掉刻板印象）","第三阶段：增强自我调节能力，主动适应文化差异","第四阶段：自觉运用跨文化交际技能（帮助学习者建立跨文化意识）"],"q":"跨文化交际能力的发展可分四阶段。第一阶段，跨文化意识的形成。……第二阶段，多元文化意识的建立。……第三阶段，增强自我调节能力，主动适应文化差异。……第四阶段，自觉运用跨文化交际技能。","w":"normal","e":["核心考点"]},{"t":"简述论文写作能力培养中'问题导向'的四个方面。","y":"简答题","p":["①选题：在汉语国际教育实践中发现真实、具体的问题","②材料：使用真实有用的材料（学习者语料、录音录像、教学资料、教材数据等）","③方法：科学运用适合论文题目的理论、模式、方法、手段，不空谈","④结论：给出具体的解决方案，不能空泛","贯穿四点的是创新思维（与前人有何不同、创新点、如何促进行业发展）"],"q":"问题导向，可以从四个方面讨论。(一) 选题……(二) 材料……(三) 方法……(四) 结论……贯穿于上述四点的，是创新思维。","w":"normal","e":["核心考点"]},{"t":"试述国际汉语教师应具备的基本素质，并结合实际谈谈如何培养这些素质。","y":"论述题","p":["①个人素质：责任心和事业心（以此为业、以此为乐、以此为荣、以此为善）、亲和力、良好的心理素质","②知识储备：汉语知识、外语知识、跨学科知识、中华文化知识及才艺、世界文化知识和跨文化交际知识","③能力结构：教学能力、跨文化交际能力、文化传播能力、教学研究及创新能力","培养途径：'全程见习实习'培养语言教学技能（做中学、做中教）","文化传播能力通过授课讲座与实践式培养；跨文化交际能力经四阶段并在实践中培养","通过反思教学（反思日志、微格教学、行动研究、叙事研究、专业共同体）促进专业发展"],"q":"以下从个人素质、知识储备和能力结构三方面，对国际汉语教师的基本素质进行讨论。","w":"high","e":["教材高频"]},{"t":"全程见习实习","y":"名词解释","p":["“全程见习实习”是中山大学汉语国际教育硕士专业学位生的一种人才培养模式","实践应该循序渐进，可分为“见习”“实习”两大阶段进行","见习包括课堂观摩、模拟教学、试讲三个步骤，可在一学期完成","实习阶段研究生需要独立或与其他教师合作完成一门课程的教学","通过全程见习实习，研究生能把所学知识跟具体的教学实践结合起来，有效积累教学经验，培养汉语教学能力，研究生入学第二年就可以到海外任教，胜任多种教学任务"],"q":"下面主要以中山大学汉语国际教育硕士专业学位生的“全程见习实习”培养模式为例，论述汉语国际教育人才的培养方式。……实践应该循序渐进，可分为“见习”“实习”两大阶段进行。","w":"normal","e":["核心考点"]},{"t":"简述跨文化交际能力发展的四个阶段。","y":"简答题","p":["第一阶段：跨文化意识的形成","第二阶段：多元文化意识的建立（去掉刻板印象）","第三阶段：增强自我调节能力，主动适应文化差异","第四阶段：自觉运用跨文化交际技能"],"q":"跨文化交际能力的发展可分四阶段。第一阶段，跨文化意识的形成。……第二阶段，多元文化意识的建立。……第三阶段，增强自我调节能力，主动适应文化差异。……第四阶段，自觉运用跨文化交际技能。","w":"normal","e":["核心考点"]},{"t":"见习阶段一般不包括下列哪个步骤？（　　）","y":"单项选择题","p":["D"],"q":"见习包括三个步骤：课堂观摩，模拟教学，试讲。可在一学期完成。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c07-s03","t":"第三节 汉语教师的发展","w":"high","n":16,"k":[{"t":"微格教学","y":"名词解释","p":["微格教学是反思教学的一种方式","教师将一个简短的教案实践环节，或者一个真实的教学视频片断向同事或一个较小班级的学生呈现"],"q":"微格教学是反思教学的一种方式。教师将一个简短的教案实践环节，或者一个真实的教学视频片断向同事或一个较小班级的学生呈现。","w":"normal","e":["核心考点"]},{"t":"行动研究","y":"名词解释","p":["行动研究是一种关注实践改进的研究模式，具体指教师对自身的教学行为进行即时监控与调节，对出现的问题进行即时研究和解决"],"q":"行动研究是一种关注实践改进的研究模式，具体指教师对自身的教学行为进行即时监控与调节，对出现的问题进行即时研究和解决。","w":"normal","e":["核心考点"]},{"t":"叙事研究","y":"名词解释","p":["叙事研究是教师讲自己或他人有关教育的故事，并进行相应研究","叙事包括想象叙事、口头叙事和书面叙事"],"q":"叙事研究是教师讲自己或他人有关教育的故事，并进行相应研究。叙事包括想象叙事、口头叙事和书面叙事。","w":"normal","e":["核心考点"]},{"t":"教师专业共同体","y":"名词解释","p":["教师专业共同体以教育实践为内容，以共同学习、研讨为形式，通过团体成员的沟通与交流，最终实现整体成长","教师专业共同体可以以学校为单位，也可以是校际或区域间的职业联合体"],"q":"教师专业共同体以教育实践为内容，以共同学习、研讨为形式，通过团体成员的沟通与交流，最终实现整体成长。教师专业共同体可以以学校为单位，也可以是校际或区域间的职业联合体。","w":"normal","e":["核心考点"]},{"t":"后方法理论","y":"名词解释","p":["进入21世纪，西方一批著名外语教育专家声称，第二语言教学处于'后方法时代'","后方法理论否定在第二语言教学中，教学和教师必须'自上而下'地接受和遵循某种特定语言教学理论和操作方法的做法"],"q":"进入21世纪，西方一批著名外语教育专家声称，第二语言教学处于'后方法时代'。崔永华 (2016) 认为，他们的基本共识是，否定在第二语言教学中，教学和教师必须'自上而下'地接受和遵循某种特定语言教学理论和操作方法的做法。","w":"normal","e":["核心考点"]},{"t":"什么是反思教学?王添淼归纳的反思型教师成长路径有哪几种方式?","y":"简答题","p":["反思教学定义：教师以旁观者身份从教和学角度考察本人教学是否有效、如何改善","①撰写反思日志、建立成长档案（反思教学的基础）","②微格教学（向同事或小班呈现教学片断，审视反思）","③行动研究（即时监控、调节、研究、解决）","④叙事研究（讲教育故事并研究）","⑤建立教师专业共同体（共同学习研讨，整体成长）"],"q":"王添淼(2010) 归纳国内外有关反思型教师成长路径的几种方式，可以作为参考：(1) 撰写反思日志，建立成长档案。……(2) 微格教学。……(3) 行动研究。……(4) 叙事研究。……(5) 建立教师专业共同体。","w":"high","e":["教材高频"]},{"t":"汉语教师应如何提高解释难点的能力?请举例说明。","y":"简答题","p":["保持冷静，迅速用词语造句，检验能否互换及意义区别","举例：'你不应该闯红灯'与'你不一定闯红灯'；'周末应该休息'与'周末一定休息'","概括其在意义、句法形式（句型句式、位置、词语搭配）上的不同","回答不上来要承认，并承诺以后告知答案","下课后查阅资料、询问专家或进行研究，兑现承诺"],"q":"汉语教师上课时常会遭遇类似情况：学生突然问你'一定' '应该'有什么区别。……当学生问到区别时，就需要保持冷静，迅速用这两个词造句，看句中的'一定''应该'能否互换，互换后意思有何区别。……如果确实回答不上来，就要承认自己也不清楚，并承诺以后把答案告诉学生。","w":"normal","e":["核心考点"]},{"t":"科研素养和能力至少包括哪几点?请简述。","y":"简答题","p":["科研素养和能力包括：文献查找和研读能力、资料收集整理能力、分析解决问题能力、技术应用能力","①知道如何查找研读文献，从前人研究中找到解决方案","②学会收集整理各类资料（母语语料、双语语料、中介语语料、教材语料等）","③学会用理论方法分析材料，得出令人信服的结论","④学会使用现代教育技术，建设小型语料库、资源库"],"q":"科研素养和能力至少包括以下几点：文献查找和研读能力，资料收集整理能力，分析解决问题的能力，技术应用能力。","w":"normal","e":["核心考点"]},{"t":"库玛提出的教师教育的五个模块是知、析、识、行、察，由此构成的模型称为______模型。","y":"填空题","p":["这五点也是库玛提出的教师教育的五个模块，即知(knowing)、析(analyzing)、识(recognizing)、行(doing)、察(seeing)，由此构成教师教育的KARDS模型。"],"q":"这五点也是库玛提出的教师教育的五个模块，即知(knowing)、析 (analyzing)、识 (recognizing)、行(doing)、察 (seeing), 由此构成教师教育的KARDS模型。","w":"normal","e":["核心考点"]},{"t":"后方法理论的代表人物是（　　），他提出教师是'以教师为中心'的教学主体。","y":"单项选择题","p":["后方法理论的代表人物库玛(2014)指出，后方法理论是'以教师为中心'，承认教师有能力在机构、课程和教材等制约下自主行动。"],"q":"后方法理论的代表人物库玛 (2014) 指出，后方法理论是'以教师为中心'，'承认教师有能力，不仅知道当前状况，而且知道在机构、课程和教材等学术和行政条件制约下，如何自主行动'。","w":"normal","e":["核心考点"]},{"t":"'教师讲自己或他人有关教育的故事，并进行相应研究'，这种方式属于（　　）。","y":"单项选择题","p":["叙事研究是教师讲自己或他人有关教育的故事，并进行相应研究。叙事包括想象叙事、口头叙事和书面叙事。"],"q":"叙事研究是教师讲自己或他人有关教育的故事，并进行相应研究。叙事包括想象叙事、口头叙事和书面叙事。","w":"normal","e":["核心考点"]},{"t":"反思教学","y":"名词解释","p":["反思教学是指教师以旁观者身份，从教和学的角度考察本人的教学是否有效、如何改善","它是一个“将‘学会教学（learning how to teach）’与‘学会学习（learning how to learn）’结合起来，努力提升教学实践的合理性，使自己成为学者型教师的过程”","反思教学是教师专业发展的基本过程","《教师标准》中“教师综合素质”第一条标准要求教师应具备对自己教学进行反思的意识，具备基本的课堂研究能力"],"q":"反思教学，是指教师以旁观者身份，从教和学的角度考察本人的教学是否有效、如何改善。它是一个“将‘学会教学(learning how to teach)’与‘学会学习(learning how to learn)’结合起来，努力提升教学实践的合理性，使自己成为学者型教师的过程”。","w":"normal","e":["核心考点"]},{"t":"简述反思型教师成长的主要路径。","y":"简答题","p":["撰写反思日志，建立成长档案","微格教学","行动研究","叙事研究","建立教师专业共同体"],"q":"(1) 撰写反思日志，建立成长档案。……(2) 微格教学。……(3) 行动研究。……(4) 叙事研究。……(5) 建立教师专业共同体。","w":"normal","e":["核心考点"]},{"t":"后方法理论","y":"名词解释","p":["进入21世纪，西方一批著名外语教育专家声称第二语言教学处于“后方法时代”","其基本共识是，否定在第二语言教学中，教学和教师必须“自上而下”地接受和遵循某种特定语言教学理论和操作方法的做法","后方法理论的代表人物库玛指出，后方法理论是“以教师为中心”，“承认教师有能力，不仅知道当前状况，而且知道在机构、课程和教材等学术和行政条件制约下，如何自主行动”，并提出了教师教育的KARDS模型（知knowing、析analyzing、识recognizing、行doing、察seeing）"],"q":"进入21世纪，西方一批著名外语教育专家声称，第二语言教学处于“后方法时代”。……后方法理论的代表人物库玛 (2014) 指出，后方法理论是“以教师为中心”。","w":"normal","e":["核心考点"]},{"t":"简述国际汉语教师提高教学和管理艺术的主要方面。","y":"简答题","p":["因材施教","提高对学生的观察力","提高教学管理能力（引进契约制）","提高解释难点的能力（造句辨析、诚实应答）"],"q":"三、提高教学和管理艺术 (一) 因材施教 …… (二) 提高对学生的观察力 …… (三) 提高教学管理能力 …… (四) 提高解释难点的能力","w":"normal","e":["核心考点"]},{"t":"库玛提出的教师教育五个模块是知（knowing）、______、识（recognizing）、______、察（seeing），由此构成教师教育的KARDS模型。","y":"填空题","p":["析（analyzing）","行（doing）"],"q":"这五点也是库玛提出的教师教育的五个模块，即知(knowing)、析 (analyzing)、识 (recognizing)、行(doing)、察 (seeing),由此构成教师教育的KARDS模型。","w":"normal","e":["核心考点"]}]}]},{"id":"rumen-c08","t":"第八章 汉语传播与教学简史","w":"high","s":[{"id":"rumen-c08-s01","t":"第一节 汉语在东亚、东南亚的传播","w":"high","n":17,"k":[{"t":"汉字文化圈","y":"名词解释","p":["从秦汉时期，汉语汉字开始向外传播，并逐步形成一个“汉字文化圈”，主要包括现在东亚的朝鲜半岛、日本和东南亚的越南"],"q":"从秦汉时期，汉语汉字开始向外传播，并逐步形成一个“汉字文化圈”，主要包括现在东亚的朝鲜半岛、日本和东南亚的越南。","w":"high","e":["教材高频"]},{"t":"宾贡科","y":"名词解释","p":["所谓宾贡科，指唐政府对来华留学生实行的一种制度，即对外国贡士(含留学生)宾礼相待，允许他们跟中国读书人一样参加科举考试，及第者同样可以授予官职"],"q":"所谓宾贡科，指对外国贡士(含留学生)宾礼相待，允许他们跟中国读书人一样参加科举考试，及第者同样可以授予官职。","w":"normal","e":["核心考点"]},{"t":"简述朝鲜高丽时期设立的司译院及其在汉语学习史上的意义。","y":"简答题","p":["元明清时期汉语教学成为朝鲜国家教育重要部分，汉语是科举考试的重要内容","高丽设立司译院，负责翻译事务、外交事务并培养汉语人才","意义：标志高丽人对汉语学习规律有了进一步认识，跳出了只重读写的藩篱","是总结长期汉语学习经验的结果和同中国长期交往的必然产物","对提高教学效果、培养高素质汉语人才发挥了积极作用"],"q":"这一时期，高丽设立了专门负责翻译事务的司译院，既负责外交事务，又培养汉语人才。司译院的建立，在高丽的汉语学习史上具有极为重要的意义。它标志着高丽人对汉语学习规律有了进一步认识，表明高丽的汉语教学在一定程度上跳出了只重读写的藩篱。","w":"high","e":["教材高频"]},{"t":"简述司译院汉语教材使用的三个发展阶段。","y":"简答题","p":["初期：主要引进中国的启蒙教科书","中期：自己编写实用的翻译书和口语教材，开始注重口语教学","教材编写逐步走向自主、成熟"],"q":"值得注意的是，司译院的汉语教材使用有三个阶段。初期，主要引进中国的启蒙教科书。中期，自己编写实用的翻译书和口语教材，开始注重口语教学。","w":"normal","e":["核心考点"]},{"t":"谚文","y":"名词解释","p":["谚文是1443年朝鲜世宗大王仿照汉字结构设计出的朝鲜文字，周有光先生指出：谚文是通俗文字的意思，它可以说是音素合成的音节文字"],"q":"周有光先生指出：谚文是通俗文字的意思，它可以说是音素合成的音节文字。谚文字母在无意之中受了汉字笔画元素的影响。谚文叠成方块，跟汉字匹配，这是明显的汉字影响。","w":"high","e":["教材高频"]},{"t":"285年，百济的王仁把《论语》《千字文》带到日本，并为日本皇太子菟道雉郎子讲授，成为日本第一个____。","y":"填空题","p":["汉语教师"],"q":"285年，百济的王仁把《论语》《千字文》带到日本，并为日本皇太子菟道雉郎子讲授，成为日本第一个汉语教师。","w":"normal","e":["核心考点"]},{"t":"遣唐使","y":"名词解释","p":["遣唐使是唐代日本政府先后派出的使团，每次都有大批留学生和僧人随船前来，有力地促进了汉语在日本的传播"],"q":"在唐代，日本政府先后派出16批遣唐使，每次都有大批留学生和僧人随船前来，有力地促进了汉语在日本的传播。","w":"high","e":["教材高频"]},{"t":"吉备真备","y":"名词解释","p":["吉备真备是奈良时代赴唐留学生，后来成为著名学者，并借用汉字的楷书偏旁创立了部分日本文字中的片假名"],"q":"吉备真备是奈良时代赴唐留学生，后来成为著名学者，并借用汉字的楷书偏旁创立了部分日本文字中的片假名。","w":"normal","e":["核心考点"]},{"t":"阿倍仲麻吕","y":"名词解释","p":["阿倍仲麻吕是与吉备真备同时来唐的日本留学生，性明敏，好读书，博闻强记，就学于唐太学，改名晁衡","卒业后参加科举考试中第，在唐就职","晁衡在唐留居52年，完全汉化，堪称汉语对外传播史及中日友好交流史的美谈"],"q":"阿倍仲麻吕是与吉备真备同时来唐的日本留学生，性明敏，好读书，博闻强记，就学于唐太学，改名晁衡。卒业后，他参加科举考试中第，在唐就职。","w":"normal","e":["核心考点"]},{"t":"空海","y":"名词解释","p":["空海是唐代日本来华学问僧中最为著名的一位","他于贞元二十年(804)来唐，从真言密教第七代祖师长安青龙寺惠果法师习密教，诗文书道皆精，尤善草书，曾与草圣张芝齐名"],"q":"空海是其中最为著名的一位。他于贞元二十年(804)来唐，从真言密教第七代祖师长安青龙寺惠果法师习密教，诗文书道皆精，尤善草书，曾与草圣张芝齐名。","w":"normal","e":["核心考点"]},{"t":"唐通事","y":"名词解释","p":["唐通事是清代日本长崎设立的汉语翻译","自1639年日本江户幕府实行锁国政策之后，长崎是日本唯一对外开放的港口，为此在长崎设立了兰通词(荷兰语翻译)与唐通事(汉语翻译)，隶属于长崎奉行管理"],"q":"为此在长崎设立了兰通词(荷兰语翻译)与唐通事(汉语翻译)，隶属于长崎奉行(长崎的长官)管理。唐通事的工作是在唐船进入长崎港进行货物交易时作翻译、阅译交易文书、制作相关文书和协助管理唐馆的唐人等。","w":"normal","e":["核心考点"]},{"t":"冈岛冠山","y":"名词解释","p":["冈岛冠山是日本著名汉语教育家，作为译社的讲师，在1711年前后编写、出版了五种唐话课本：《唐话纂要》《唐译便览》《唐话便用》《唐音雅俗语类》《经学字海便览》，以口语为主，具有实用性、科学性、系统性和趣味性等特点"],"q":"作为译社的讲师，著名汉语教育家冈岛冠山在此期间编写、出版了五种唐话课本：《唐话纂要》《唐译便览》《唐话便用》《唐音雅俗语类》《经学字海便览》。它们以口语为主，具有实用性、科学性、系统性和趣味性等特点。","w":"normal","e":["核心考点"]},{"t":"喃字","y":"名词解释","p":["到了13世纪，越南人借用汉字和汉字部件创制了“喃字”","“喃字是从汉字孳乳出来的非汉语的汉语式词符文字","”在喃字的体系中，借用的汉字占大多数，“实际是汉字中间夹用自造新字”","现在人们收集到的喃字有2800多个"],"q":"到了13世纪，越南人借用汉字和汉字部件创制了“喃字”。“喃字是从汉字孳乳出来的非汉语的汉语式词符文字。”在喃字的体系中，借用的汉字占大多数，“实际是汉字中间夹用自造新字”。","w":"normal","e":["核心考点"]},{"t":"简述汉字在朝鲜半岛、日本、越南传播的三个阶段。","y":"简答题","p":["第一阶段：用汉字记录本民族语言","第二阶段：改变一些汉字的作用，创造特殊汉字，如越南的喃字、日本的国字","第三阶段：依照汉语特点创造本民族文字，如日本片假名、平假名，朝鲜谚文，越南拼音文字","体现汉字文化圈文字本土化的普遍规律"],"q":"总体来说，汉字在朝鲜半岛、日本、越南的传播大致有三个阶段：第一阶段，用汉字记录本民族语言。第二阶段，为满足记录本民族语言的需要，改变一些汉字的作用，创造出特殊的汉字，如越南的喃字、日本的国字。第三阶段，依照汉语特点创造本民族文字。","w":"high","e":["教材高频"]},{"t":"简述汉语在朝鲜半岛、日本、越南传播的三个阶段。","y":"简答题","p":["第一阶段：引进汉文经典，社会上层和知识界逐渐用汉语写作、转写政府公文等","第二阶段：汉语作为外语教学活动扩展到教育、考试、民间交往，大量汉语词汇进入其词汇系统","第三阶段：近现代对汉语有不同程度的排斥","目前日语、韩语、越南语中存在大量汉语借词"],"q":"汉语传播大致也有三个阶段：第一阶段，引进汉文经典，社会上层和知识界在学习汉文经典时，逐渐用汉语写作，转写政府公文等；第二阶段，汉语作为外语教学活动进一步扩展到教育、考试、民间交往，大量汉语词汇进入其词汇系统；第三阶段，到了近现代，对汉语有不同程度的排斥。","w":"high","e":["教材高频"]},{"t":"现在越南已经完全不用汉字，但仍存在大量的汉语借词。","y":"判断题","p":["日语、韩语、越南语中存在大量的汉语借词，虽然现在越南已经不用汉字","越南语词汇系统大约有70%的汉越词"],"q":"目前的情况是，日语、韩语、越南语中存在大量的汉语借词 (虽然现在越南已经不用汉字)。","w":"normal","e":["核心考点"]},{"t":"下列汉字传播的第二阶段中，属于“改变一些汉字的作用，创造出特殊的汉字”的是（  ）。A.朝鲜谚文 B.日本片假名 C.越南喃字 D.越南拼音文字","y":"单项选择题","p":["第二阶段为满足记录本民族语言的需要，改变一些汉字的作用，创造出特殊的汉字，如越南的喃字、日本的国字","朝鲜谚文、日本片假名、越南拼音文字均属第三阶段依照汉语特点创造本民族文字"],"q":"第二阶段，为满足记录本民族语言的需要，改变一些汉字的作用，创造出特殊的汉字，如越南的喃字、日本的国字。第三阶段，依照汉语特点创造本民族文字。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c08-s02","t":"第二节 汉语在西方的传播","w":"high","n":9,"k":[{"t":"马可·波罗","y":"名词解释","p":["马可·波罗是意大利旅行家，1275年来到中国，得到元世祖忽必烈的信任","此后他几乎游遍了中国","后来他写成《马可·波罗行纪》，描述了东方之富庶、文物之昌明，使西方人第一次比较全面地了解了中国"],"q":"马可·波罗是意大利旅行家，1275年来到中国，得到元世祖忽必烈的信任。此后他几乎游遍了中国。后来他写成《马可·波罗行纪》，描述了东方之富庶、文物之昌明，使西方人第一次比较全面地了解了中国。","w":"normal","e":["核心考点"]},{"t":"罗明坚","y":"名词解释","p":["罗明坚是明代耶稣会士，1579年7月被从印度调到澳门学习汉语","他文质彬彬，会说汉语，注意遵从中国人的风俗习惯，终于获准在广东肇庆城外建立教堂和传教","罗明坚的汉语很好，是明代第一个用中文作诗的传教士"],"q":"罗明坚的汉语很好，是明代第一个用中文作诗的传教士。他在肇庆时，跟利玛窦合编了第一部汉外辞典—————《葡汉辞典》，以帮助入华传教士学习汉语。","w":"normal","e":["核心考点"]},{"t":"《西字奇迹》","y":"名词解释","p":["《西字奇迹》是利玛窦1606年完成的著作，是第一份用拉丁字母拼写汉字的读物，也是目前发现的第一份用符号来标注声调的字母拼写读物"],"q":"利玛窦1606年完成的《西字奇迹》 (图8.13) 是第一份用拉丁字母拼写汉字的读物，也是目前发现的第一份用符号来标注声调的字母拼写读物。","w":"high","e":["教材高频"]},{"t":"《西儒耳目资》","y":"名词解释","p":["《西儒耳目资》是法国传教士金尼阁在中国学者王征等人协助下，用西方语音学探讨整理汉语音韵规律而成的著作，是一部帮助西洋人学习汉语、汉字的罗马字注音字汇，在我国音韵学史上具有开拓新领域的作用，事实上也成为我国最早的汉语拼音方案"],"q":"他在中国学者王征等人协助下，用西方语音学探讨整理汉语音韵规律而成的《西儒耳目资》(图8.14)，是一部帮助西洋人学习汉语、汉字的罗马字注音字汇，在我国音韵学史上具有开拓新领域的作用，事实上也成为我国最早的汉语拼音方案。","w":"high","e":["教材高频"]},{"t":"《语言自迩集》","y":"名词解释","p":["《语言自迩集》是曾做过英国驻华大使的威妥玛编写的汉语教材，是汉语教学史上第一部教学北京话口语的汉语课本","其编写体例、注音方式，对北京口语语音语法系统的描写，对词汇的选择和释义，很适合西方人学习汉语，对后来的汉语教材编写产生了深远影响"],"q":"这些教材中, 最著名的是当时曾做过英国驻华大使的威妥玛 (Sir Thomas Francis Wade) 编写的《语言自迩集》，这是汉语教学史上第一部教学北京话口语的汉语课本，其编写体例、注音方式，对北京口语语音语法系统的描写，对词汇的选择和释义，很适合西方人学习汉语，对后来的汉语教材编写产生了深远影响。","w":"high","e":["教材高频"]},{"t":"马礼逊","y":"名词解释","p":["罗伯特·马礼逊是西方派到中国大陆的第一位基督新教传教士，他在华25年，在许多方面都有首创之功","他于清嘉庆十二年(1807年)奉伦敦传教会之命来华，掌握了汉语后汉译《圣经》，并陆续出版了英文版《汉语语法》、汉英对照本《华英字典》以及英文版《广东省土话字汇》等，成为当时欧洲最有影响的汉学家"],"q":"罗伯特·马礼逊(Robert Morrison) 是西方派到中国大陆的第一位基督新教传教士，他在华25年，在许多方面都有首创之功。马礼逊于清嘉庆十二年 (1807年) 奉伦敦传教会之命来华。","w":"high","e":["教材高频"]},{"t":"简述明清时期西方传教士为汉语在西方传播做出的贡献。","y":"简答题","p":["创造汉字旁加注罗马字母拼音的方法，推动汉语拉丁化进程，影响现行《汉语拼音方案》","编著中西字典等汉语学习材料","以拉丁语法体系为参照系统描写汉语语法，为中国现代语法学奠定基础","学习并译介儒家经典使之流传于欧洲","将中国人带往欧洲，促进汉语汉字在欧洲传播"],"q":"综合可见，明清时期西方传教士为汉语在西方传播做出的贡献主要表现在五个方面：第一，利玛窦等人在学习汉语的过程中，创造了在汉字旁加注罗马字母拼音的方法……第五，西方来华传教士将一些中国人士带往欧洲，进一步促进了汉语汉字在欧洲的传播。","w":"high","e":["教材高频"]},{"t":"在《马氏文通》诞生之前，西方汉语语法研究已经有了近____年的历史。","y":"填空题","p":[],"q":"第三，在《马氏文通》诞生之前，西方汉语语法研究已经有了近200年的历史。","w":"normal","e":["核心考点"]},{"t":"下列哪部著作是我国最早采用罗马字注音、事实上成为我国最早的汉语拼音方案的著作？（  ）A.《西字奇迹》 B.《西儒耳目资》 C.《语言自迩集》 D.《葡汉辞典》","y":"单项选择题","p":["《西儒耳目资》是我国音韵学史上开拓新领域的罗马字注音字汇，事实上成为我国最早的汉语拼音方案","《西字奇迹》是第一份用拉丁字母拼写汉字的读物；《语言自迩集》是第一部教学北京话口语的汉语课本；《葡汉辞典》是第一部汉外辞典"],"q":"《西儒耳目资》(图8.14)，是一部帮助西洋人学习汉语、汉字的罗马字注音字汇，在我国音韵学史上具有开拓新领域的作用，事实上也成为我国最早的汉语拼音方案。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c08-s03","t":"第三节 华人移民和华文教育","w":"high","n":6,"k":[{"t":"华文教育","y":"名词解释","p":["华文教育是海外华人社会中的汉语教育","华文教育与华侨教育的不同有如下几点：①华文教育被纳入当地教育事业的轨道","②华文教育成为当地民族文化教育，无论是官方还是华人自身，都已将华文教育视作从属于居住国教育事业的民族文化教育","③不具备完备的、全面系统的教育内容和形式，而仅着重于华语的学习和中华文化的传播"],"q":"华文教育与华侨教育的不同有如下几点：①华文教育被纳入当地教育事业的轨道；②华文教育成为当地民族文化教育……③不具备完备的、全面系统的教育内容和形式，而仅着重于华语的学习和中华文化的传播。","w":"high","e":["教材高频"]},{"t":"简述海外华文教育发展的三个阶段及其特点。","y":"简答题","p":["旧式华文教育阶段：私塾、义学、书院，教学内容为《四书》《五经》等传统教材","华侨教育阶段：华侨自办自管、认同中国、中国政府参与、与民族民主运动密切相关","华文教育阶段：纳入当地教育事业，成为当地民族文化教育，侧重华语学习与中华文化传播"],"q":"海外华文教育的发展大体上可以划分为三个阶段：旧式华文教育阶段，华侨教育阶段，华文教育阶段。各国华侨教育转入华文教育的时间先后不同。","w":"high","e":["教材高频"]},{"t":"简述20世纪70年代末80年代初海外华文教育复苏的主要原因。","y":"简答题","p":["中外关系的发展使新移民大大增加，导致华文学习人群增加","中国实行改革开放政策，经济发展迅猛，华文人才的需求增加","90年代起多国政府开始采取措施鼓励发展华文教育","形成持续的中文热"],"q":"但是到了70年代末80年代初，海外华文教育 (不限于东南亚) 开始复苏……这主要有以下几个原因：一是由于中外关系的发展，新移民大大增加……二是中国实行改革开放政策，经济发展迅猛，华文人才的需求增加。","w":"normal","e":["核心考点"]},{"t":"华侨教育","y":"名词解释","p":["华侨教育是海外华侨创办并使用的、认同于中国的教育形态","其特点是：①华侨自己创办，自己管理","②认同于中国","其教学宗旨是保存中华民族文化，发扬爱国精神","其学制取自中国，老师来自中国，课本、图书、仪器也购自中国，完全照搬中国的一套"],"q":"华侨教育的特点是：①华侨自己创办，自己管理。②认同于中国。其教学宗旨是保存中华民族文化，发扬爱国精神；其学制取自中国，老师来自中国，课本、图书、仪器也购自中国，完全照搬中国的一套。③中国政府参与。④与中国的民族、民主运动密切相关。","w":"normal","e":["核心考点"]},{"t":"从历史上来看，对外汉语教学和海外华文教育有哪些异同？","y":"简答题","p":["相同点：都面向非第一语言者，传播汉语与中华文化，受中国国情影响","不同点：教学对象不同（华裔 vs 外国人）","不同点：性质不同（近似母语教学 vs 汉语作为第二语言教学）","不同点：办学管理主体不同","不同点：发展轨迹不同，华文教育与移民史密切相关"],"q":"海外华文教育是随着华人移民人数增加、移民后代人数增加而兴起和发展的……海外华文教育的发展大体上可以划分为三个阶段：旧式华文教育阶段，华侨教育阶段，华文教育阶段。","w":"normal","e":["核心考点"]},{"t":"旧式华文教育","y":"名词解释","p":["旧式华文教育是海外华文教育发展的第一阶段","早期华文教育的形式主要是私塾、义学和书院，其中私塾是个人所办，招徒授业","义学为华社团体所办，是旧式华文教育的主要形式","书院层次更高一些，但离现代新式学校仍有很大距离"],"q":"早期华文教育的形式主要是私塾、义学和书院，其中私塾是个人所办，招徒授业；义学为华社团体所办，是旧式华文教育的主要形式；书院层次更高一些，但离现代新式学校仍有很大距离。","w":"normal","e":["核心考点"]}]},{"id":"rumen-c08-s04","t":"第四节 中华人民共和国成立前国内的汉语教学","w":"high","n":10,"k":[{"t":"《番汉合时掌中珠》","y":"名词解释","p":["《番汉合时掌中珠》是我国现存最早的汉语教材，本书由西夏党项人古勒茂才于乾祐二十一年(1190)编写，是一部西夏文和汉文双解的通俗语汇手册"],"q":"就现有史料来看，我国现存最早的汉语教材可能是《番汉合时掌中珠》(图8.17)，此书由西夏党项人古勒茂才于乾祐二十一年 (1190) 编写，是一部西夏文和汉文双解的通俗语汇手册。","w":"high","e":["教材高频"]},{"t":"华北协和语言学校","y":"名词解释","p":["华北协和语言学校是一所由外国人建立、具有教会性质的汉语学校，是哈佛燕京学社的源头，于1913年正式成立于北京，校长由基督教北京青年会的外籍人士担任","汉语课是该校的主要课程，同时也开设中国风俗、中国哲学、中国神话、现代中国外交关系、中国经济学等课程"],"q":"这一时期值得一提的是华北协和语言学校。该校是一所由外国人建立，具有教会性质的汉语学校，是哈佛燕京学社的源头。华北协和语言学校于1913 年正式成立于北京，校长由基督教北京青年会的外籍人士担任。","w":"high","e":["教材高频"]},{"t":"中华人民共和国成立以前西方在华设立了哪些汉语学习机构？其特点是什么？","y":"简答题","p":["机构举例：南京华言学堂、华北协和语言学校、金陵大学传教士训练部等","学习内容：汉语、中国文化、历史等课程","学习时间长短不一，以官话为主，兼及方言","注重口语表达，同时学习书面语","教学方式有面授也有函授，中外教师共同担任","教材分四类：口语教材、书面语教材、语法教材、汉字教材"],"q":"这些学习汉语的语言机构有以下特点：主要学习汉语、中国文化、历史等课程；学习时间长短不一，短的只有几个月，长的要几年；学习的语言以官话为主，还有方言，如四川话、河间府方言、福州话、吴方言等；学习注重口语表达，同时也学习书面语；教学方式有面授也有函授；教学工作由中外教师共同担任。","w":"high","e":["教材高频"]},{"t":"结合汉语在东亚、东南亚传播以及在西方传播的历史，论述汉语对外传播的规律及其对当代汉语国际教育的启示。","y":"论述题","p":["汉语汉字传播形成“汉字文化圈”，并沿丝绸之路西传","文字本土化三阶段规律：借用—改造—创新","汉语传播三阶段：引进经典、作为外语教学、近现代排斥","传播动因：政治、经济、文教制度、宗教、移民","西方传教士在注音、字典、语法、译介方面的贡献及其对汉语拼音的影响","启示：政治经济基础、教材建设、本土化与师资、移民与身份认同"],"q":"总体来说，汉字在朝鲜半岛、日本、越南的传播大致有三个阶段……汉语传播大致也有三个阶段……明清时期西方传教士为汉语在西方传播做出的贡献主要表现在五个方面。","w":"high","e":["教材高频"]},{"t":"阅读下面材料，回答问题。\n材料：在原本《老乞大》中有这样的一段对话：\n你谁根底学文书来？\n我在汉儿学堂里学文书来。\n你学甚么文书来？\n读《论语》《孟子》《小学》。\n恁每日做甚么工课？\n每日清早晨起来，到学里，师傅行受了生文书。下学到家，吃饭罢，却到学里写仿书。写仿书罢对句，对句罢吟诗。吟诗罢，师傅行讲书。\n问题：(1)根据这段对话，请描述和评价当时的汉语教学方式。(2)结合本章所学，谈谈历史上汉语教学的经验对当代对外汉语教学有何借鉴意义。","y":"案例分析题","p":["描述：汉儿学堂、师傅授课、儒家经典教材、重书面语文言文","描述教学环节：受生文书—写仿书—对句—吟诗—讲书","评价：以读写背诵为核心、重模仿积累与文化浸润，轻口语交际，方法较机械","借鉴一：汉语传播需要稳定政治经济与制度支撑","借鉴二：教材本土化、重口语与实用性（司译院、冈岛冠山唐话课本）","借鉴三：重视语音语法研究与规范化（《语言自迩集》、威妥玛式）","借鉴四：课程体系化与师资建设（华北协和语言学校）","借鉴五：反思重读写轻口语，当代应听说读写并重、突出交际"],"q":"你谁根底学文书来? 我在汉儿学堂里学文书来。你学甚么文书来? 读《论语》《孟子》《小学》。恁每日做甚么工课? 每日清早晨起来，到学里，师傅行受了生文书。下学到家，吃饭罢，却到学里写仿书。写仿书罢对句，对句罢吟诗。吟诗罢，师傅行讲书。","w":"normal","e":["核心考点"]},{"t":"日本人在华设立学校时设立的“中国语检定试验”制度，是世界上最早的外语能力测试之一。","y":"判断题","p":["1920年代，关东厅和“满铁”机构针对机构内下级职员及警察设立了“中国语检定试验”制度，考试成绩分级，合格者按所获等级发放津贴","这是日本，也可能是世界上最早的外语能力测试"],"q":"1920年代，关东厅和“满铁”机构针对机构内下级职员及警察设立了“中国语检定试验”制度，考试成绩分级，合格者按所获等级发放津贴。这是日本，也可能是世界上最早的外语能力测试。","w":"normal","e":["核心考点"]},{"t":"19世纪欧洲出现了许多汉语教材和语法书，其中《汉文启蒙》的作者是（  ）。A.法国汉学教授雷慕沙 B.英国驻华大使威妥玛 C.美国传教士卫三畏 D.德国汉学教授克拉勃罗德","y":"单项选择题","p":["法国汉学教授雷慕沙的《汉文启蒙》是第一部由非宗教人士所写的汉语语法书","威妥玛编《语言自迩集》，卫三畏编《拾级大成》《汉英韵府》，克拉勃罗德编《满洲文选》"],"q":"法国汉学教授雷慕沙 (Abel-Remusat) 的《汉文启蒙》是第一部由非宗教人士所写的汉语语法书。","w":"normal","e":["核心考点"]},{"t":"阅读下面材料，回答问题。\n材料：初学四声之法，最难解说。今举梗概：如上平，其发声时，系自上落下而止，声音较短；如下平，其发声时，系向右傍一掷而止，声音较短；如上声，其发声时，系半含其音，渐渐而上，声音较长。(摘自《官话指南》凡例1882年)\n问题：(1)请问这一段解说的主要内容是什么？(2)结合你阅读过的当代对外汉语教材和你的对外汉语教学经历，评价一下这段解说。","y":"案例分析题","p":["材料是关于汉语四声发音方法的解说（调型、声音运动方向与长短）","价值：重视声调教学，认识到声调是难点，用形象语言帮助模仿，体现实用性","不足：缺乏现代语音学手段，没有调值标记法和发音部位描写，描述模糊","没有拼音、调号等辅助工具，难以精确传递","当代启示：声调教学科学化、直观化，采用五度标记法、拼音、声调图、手势、录音对比等"],"q":"初学四声之法，最难解说。今举梗概：如上平，其发声时，系自上落下而止，声音较短； 如下平，其发声时，系向右傍一掷而止，声音较短； 如上声，其发声时，系半含其音，渐渐而上，声音较长。(摘自《官话指南》凡例1882年)","w":"normal","e":["核心考点"]},{"t":"1742年法国皇家学院开始正式教授汉语，1833年德国洪堡大学开设汉语课，1871年美国耶鲁大学开始教授汉语。","y":"判断题","p":["1742年，法国皇家学院开始正式教授汉语","1833年，德国洪堡大学开设汉语课","1871年，美国耶鲁大学开始教授汉语","汉语教学在欧洲和美国也开始进入正规学校体系"],"q":"此外，汉语教学在欧洲和美国也开始进入正规学校体系。1742年，法国皇家学院开始正式教授汉语。1833年，德国洪堡大学开设汉语课。1871年，美国耶鲁大学开始教授汉语。","w":"normal","e":["核心考点"]},{"t":"清代中期，日本人主要学习汉字、文言文，多数学习者听说能力极差，只能用“____”和“____”阅读汉籍。","y":"填空题","p":[],"q":"多数学习者听说能力极差，只能用“训读法”和“目读法”阅读汉籍。","w":"normal","e":["核心考点"]}]}]},{"id":"rumen-c09","t":"第九章 语音教学","w":"high","s":[{"id":"rumen-c09-s01","t":"第一节 语音介绍","w":"high","n":10,"k":[{"t":"语音","y":"名词解释","p":["语音是指人类通过发音器官发出来的、具有一定意义的、目的是用来进行社会交际的声音","语音具有三大属性：发音的生理属性、物理属性（音高、音强、音长、音色）和社会属性","其中社会属性是语音最重要的特点，是世界上其他任何声音所不具备的属性","社会属性主要表现为三点：①约定俗成","②系统性"],"q":"语音是人类发音器官发出来的含有一定意义的声音。打喷嚏、咳嗽、打哈欠、打呼噜等声音，没有包含意义，不算语音。","w":"high","e":["教材高频"]},{"t":"音高","y":"名词解释","p":["音高就是声音的高低，音高决定于发音体振动的频率，即取决于声带紧张的程度","作为语音物理属性四要素（音高、音强、音长、音色）之一，音高在汉语中具有区别意义的作用，是构成声调的基础","声带越紧，振动频率越高，声音就越高","声带越松，声音越低"],"q":"音高指声音的高低。它是由发音体在一定时间内振动次数的多少决定的，振动频率高，声音就高。语音的高低与声带的长短、厚薄、松紧有关。","w":"normal","e":["核心考点"]},{"t":"音位","y":"名词解释","p":["音位是一种语言中能区别意义的最小语音单位","如“拔bá”和“爬pá”，韵母都是a，声调都是阳平，其不同的意思只是通过辅音声母b[p]和p[p']的不同来体现的","因此，b和p在汉语普通话中是两个不同的音位"],"q":"音位是一种语言中能区别意义的最小语音单位。如前边举过的“拔bá”和“爬pá”，韵母都是a，声调都是阳平，其不同的意思只是通过辅音声母b[p] 和p [p']的不同来体现的。因此，b和p在汉语普通话中是两个不同的音位。","w":"high","e":["教材高频"]},{"t":"音节","y":"名词解释","p":["音节是人们听感容易分辨出来的最小语音片断","从发音角度来说，每个音节的发音肌肉均经历了一次从紧张到松弛的过程","从听感角度来说，每一个音节都有一个明显的响度中心","普通话除儿化音音节外，一个汉字的读音就是一个音节","“现代汉语”四个汉字读出来就是[sian⁵¹ tai⁵¹ xan⁵¹ y³⁵]四个音节"],"q":"音节是语言里最自然的语音单位，在听觉上最容易分辨出来。如：“xuéxí(学习)”是两个音节。一般说来，一个汉字就是一个音节。但普通话的儿化韵有一点不同。如“头儿”是两个汉字，但读音只有一个音节：tóur。","w":"normal","e":["核心考点"]},{"t":"声调","y":"名词解释","p":["声调是指音节读音的高低升降","汉语是有声调的语言，声调是区别意义的重要手段，这是汉语区别于其他语言的重要特征之一","事(shì)——实(shí)、买(mǎi)——卖(mài)、收(shōu)——受(shòu)，均靠声调区别意义"],"q":"声调是音节读音的高低升降。它并不负载于某一个音素身上，而是负载于整个音节上。但是调号只标在音节的韵腹 (韵母中开口度大、发音响亮的元音) 上。汉语共有四个声调。有些音节在一定条件下读轻声。","w":"high","e":["教材高频"]},{"t":"五度标调法","y":"名词解释","p":["对具体
