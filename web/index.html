"w":"normal","e":[]},{"t":"都江堰","y":"名词解释","p":["战国李冰父子主持修建","鱼嘴、飞沙堰、宝瓶口三大主体","无坝引水，自动分水排沙","使成都平原成为天府之国"],"q":"36.都江堰由蜀郡太守 主持兴建，直到现在，都江堰主体工程依然屹立在岷江中流。","w":"normal","e":[]},{"t":"金文","y":"名词解释","p":["铸刻于青铜器、又称钟鼎文","盛行商周、西周为盛","笔画肥厚圆润、较甲骨文规范"],"q":"3.答案：金文【解析】金文是指铸刻在商周青铜器上的铭文，也叫钟鼎文。","w":"normal","e":[]},{"t":"长时记忆","y":"名词解释","p":["长时记忆是在头脑中长期保持的记忆，从保持一分钟以上直至终生。","长时记忆的容量是没有限度的，它的信息主要来自短时记忆，也有特别强烈的感知记忆一下子直接进入长时记忆。","短时记忆的信息要进入长时记忆，需要该信息呈现一定的强度(如生动程度)和重复，有的研究认为一个单词要反复10次才能记住。","长时记忆中信息主要以意义的形式保持，而不是逐词逐句的内容，也缺少细节。"],"q":"1.长时记忆典型的例子是人们在拨电话时记住刚查找的号码，打完电话马上就忘掉了。","w":"normal","e":[]},{"t":"阅读法","y":"名词解释","p":["阅读法产生于20世纪初，为英国著名语言教育家韦斯特(M. West)在印度从事英语教学工作时所创立，又称韦斯特“新法”，是一种强调通过直接阅读来培养阅读能力的教学法。","与帕默强调“口语是基础”不同，韦斯特强调“阅读是基础”。","韦斯特认为应当通过阅读学会阅读，阅读既是目的也是手段。","阅读法要求学生接触大量的语言材料，在上下文或插图的帮助下直接理解阅读材料的内容；不主张阅读之前先教语法规则，而是阅读后把学习者在阅读中已熟悉的语法项目进行归纳。"],"q":"12.答案: ✔【解析】语法翻译法是“用母语翻译教授外语书面语的一种传统外语教学法，即用语法讲解加翻译练习的方式来教学外语的方法”语法翻译法又称传统法，古典法，旧式法、阅读法、普鲁士法等。","w":"normal","e":[]},{"t":"音长","y":"名词解释","p":["就是声音的长短","决定于发音体振动持续时间的长短"],"q":"A.音高 B.音长 C.音强 D.音色","w":"normal","e":[]},{"t":"风水","y":"名词解释","p":["又称堪舆","阴阳五行、八卦方位的环境选择","藏风聚气、负阴抱阳","含实践经验亦杂糅迷信"],"q":"从殷墟出土的甲骨文来看，天干地支在汉族民间主要用于纪日、卜卦和配合记事，后来更用于风水、术数等领域，而干支用来纪年月日时的历法叫做干支历。","w":"normal","e":[]},{"t":"魏晋玄学","y":"名词解释","p":["以三玄为经典","探讨本末有无、名教与自然","代表人物何晏王弼嵇康阮籍","崇尚清谈、越名教而任自然"],"q":"理学直接承继孔子到孟子的先秦儒家，同时理学思想体系也有选择性的吸收扬弃了魏晋玄学、道教以及一些佛教的思想。","w":"normal","e":[]},{"t":"鸿都门学","y":"名词解释","p":["东汉灵帝光和元年设立","专授辞赋、尺牍、字画","中国第一所文艺专科学校","反映文艺独立发展"],"q":"18.汉代官学有中央办的“太学”和“鸿都门学”，地方政府办的“郡国学”和校、庠、( )等。","w":"normal","e":[]},{"t":"默教法","y":"名词解释","p":["默教法是美国教育家加特诺(C. Gattegno)于60年代初首创的一种第二语言教学法，它要求教师在课堂上尽量少说话，尽量鼓励学生多参与言语活动，从而使学生更有效地掌握运用第二语言的能力。","教师的沉默是默教法的最大特点。","默教法的主要理论基础是布鲁纳“发现学习”的教育思想，认为学习应是解决问题式的、创造和发现式的活动。","默教法还从儿童第一语言习得中吸取了不少有益的东西，但同时又认为成人第二语言学习完全不同于儿童母语习得，成功的第二语言学习是受到严格控制的“人为”的方法。"],"q":"5.人本主义心理学是咨询法、默教法等教学法流派的理论基础。","w":"normal","e":[]}]}]}]},{"d":"zhenti_2026","t":"2026南师大334+445真题","c":[{"id":"zhenti_2026-c01","t":"全文","w":"high","s":[{"id":"zhenti_2026-c01-s01","t":"全文","w":"high","n":16,"k":[{"t":"《九章算术》","y":"名词解释","p":["东汉成书分九章246题","方田粟米至勾股九类","确立算法为中心的数学体系","负数与方程解法世界领先"],"q":"2.刘徽在《九章算术》注中提出了独创的“割圆术”极限思想，第一次将圆周率具体到3.1416。","w":"high","e":["2017 真题"]},{"t":"《齐民要术》","y":"名词解释","p":["北魏贾思勰著","现存最早最完整的农学名著","总结黄河流域农业生产经验"],"q":"4.北魏贾思勰所著《齐民要术》，记载了黄河流域的农业生产相关内容，是经典农学著作。","w":"high","e":["2024 真题"]},{"t":"双音节化","y":"名词解释","p":["汉语词汇发展的一个明显的趋势就是“双音节化”。","现代汉语的语素以单音节为主，词则以多音节为主。古代汉语中，以单音节词为主，而现代汉语则以多音节词为主，特别是双音节词占绝大多数。","其原因主要有以下三个：一是有助于避免大量同音词的出现；二是双音节词使词义的表达更为细腻、精确；三是双音节读起来往往带有一种乐感，轻重之间形成一种节奏，悦耳动听。"],"q":"2.简述现代汉语词汇双音节化的主要途径。","w":"high","e":["教材高频"]},{"t":"对外汉语教学","y":"名词解释","p":["《中国大百科全书·语言文字》中写道：“对外汉语教学是指对外国人的汉语教学。”","实际上也包括对第一语言不是汉语的海外华人进行的汉语教学。","这一名称基本上体现了这个学科的特点和内涵，在国外也产生了广泛的影响，而且简洁上口、符合汉语习惯，因此从1982年提出一直使用至今。","但是十多年的使用也发现这一名称有一定的局限性：它只突出了主要教学对象，未能全面、准确地反映学科性质——第二语言教学。"],"q":"(三)论述题(每题20分，共20分)请结合具体例子谈一谈对外汉语教学中的语言文化因素。","w":"high","e":["2015 真题","2021 真题"]},{"t":"扩展法","y":"名词解释","p":["扩展法就是在一个语言单位内部插入其他成分，来观察语言单位的意义是否发生了改变。","如果语言单位的意义改变了或者不合法，则说明该语言单位在意义上是最小的，是词，否则就是短语。","词的意义具有凝固性和专指性，不可以扩展，而短语的意义具有分析性，可以扩展。因此，“扩展法”是区别词和短语的基本方法。"],"q":"1.有人认为“同形替代法”和“扩展法”都是鉴定词的方法，也有人认为“同形替代法”实质上是另一种形式的“扩展法”，请结合语言事实谈谈你的看法。","w":"high","e":["教材高频"]},{"t":"汉字","y":"名词解释","p":["汉字是汉民族在长期的劳动生产和社会实践中为适应交际需要而独立创造出来的书面交际工具。","汉字是一种重要而独特的文字系统，在记录语言的方法、造字的方式、字形的结构、字体的呈现等诸方面都有鲜明的特点。","汉字是世界上历史最悠久的一种独立发展的文字，曾形成“汉字文化圈”。"],"q":"5.为什么说现代汉字是语素文字?三、汉语应用与分析(共30分)","w":"high","e":["2016 真题"]},{"t":"现代汉字","y":"名词解释","p":["现代汉字指现阶段正在使用的汉字，它记录的主要对象是现代汉语，与传统汉字相对应。","判断一种文字符号体系的性质，首要的是研究这种文字与它所记录的语言之间的关系。","考察现代汉字的特点，还必须跟拼音文字符号体系进行比较。"],"q":"5.为什么说现代汉字是语素文字?三、汉语应用与分析(共30分)","w":"high","e":["2013 真题","2019 真题"]},{"t":"科举制","y":"名词解释","p":["隋大业元年设进士科始","1905年废止历时1300年","以考试成绩为录取标准","打破门第限制"],"q":"2.简述古代科举制度的功与过。","w":"high","e":["2015 真题","2019 真题","2024 真题"]},{"t":"诊断测试","y":"名词解释","p":["诊断测试是为了了解受试者在学习某一具体内容或在较短的一段学习时间里所存在的问题而进行的测试。","目的是迅速直接地获得反馈信息，及时改进教学。这也是一种回顾兼预示性的测试，常常是与一具体的短期目标相联系。","学校中的小考、小测验都属于这一类。诊断测试是非正式的测试，命题、评分都比较灵活，一般也不用作衡量学生水平的主要依据。"],"q":"4.诊断测试(二)简答题 (每题10分,共10分)简述对外汉语教学的原则。","w":"high","e":["2026 445 二、教育学、心理"]},{"t":"词汇","y":"名词解释","p":["词汇也称语汇，是语言中能独立运用的最小的音义结合单位的集合，有时也可以指特定领域中词语的集合。","词语是能够独立运用的音义结合的最小语言单位。词语包括词和固定短语，词是词汇的主体部分，而固定短语是词汇的重要组成部分。","词语的总和形成词汇，词汇与词语的关系是集合与个体的关系。","根据语言差异，词汇可分为汉语词汇、英语词汇、德语词汇等；根据领域不同，词汇可分为政治词汇、经济词汇、法律词汇等。"],"q":"2.简述现代汉语词汇双音节化的主要途径。","w":"high","e":["教材高频"]},{"t":"语法","y":"名词解释","p":["制约着句子组合合法性的规则就是“语法”","语法是语言不可缺少的有机的组成部分","语音是语言的物质外壳，词汇是语言的建筑材料，语法是语言的构造规则","词语的组合绝不是任意的，符合规则句子就合法，否则就不合法"],"q":"有英国本土大学生汉语语法基础扎实，听说能力却相对薄弱；","w":"high","e":["2016 真题","2019 真题"]},{"t":"语素","y":"名词解释","p":["语素是语言中最小的音义结合的构词单位，是最基本的语言单位。","一个语素必须是语音与语义结合，而且不能再拆分。其中，具有一定的语义是判断语素的最基本条件。","汉语绝大多数语素是一个有意义的音节。如“床”的语音形式是chuáng，它的语义内容是“供人躺在上面睡觉的家具”，那么，“床”就是一个语素。","有少数语素是由两个无意义的音节合成的。如“玻璃”，它的语音形式是bōli，语义是“一种质地硬而脆的透明物体”。“玻”和“璃”虽然都有语音形式，但都没有单独的语义，因此都不是语素；只有“玻璃”才是一个语素。"],"q":"5.为什么说现代汉字是语素文字?三、汉语应用与分析(共30分)","w":"high","e":["教材高频"]},{"t":"语素文字","y":"名词解释","p":["从汉字符号记录语言的单位来看，现代汉字是一种语素文字。","表音文字根据文字所记录的语言单位的不同，可以分为音素文字和音节文字两种类型。","汉字在记录语言时，利用了语素音义兼顾的特点，用能产性极强的形声字分别记录语素意义所属的类别和语素的音节。"],"q":"5.为什么说现代汉字是语素文字?三、汉语应用与分析(共30分)","w":"high","e":["2018 真题"]},{"t":"语言文化因素","y":"名词解释","p":["语言的文化因素是语言教学中的文化教学首先接触的、也是最重要的部分，主要指语言系统各层次的文化内涵和语言使用的社会规约。","语言文化因素主要隐含在词汇系统、语法系统和语用系统之中，在跨文化交际中制约着语言的理解和使用，甚至可能造成一定的交际误解和障碍。","缺少语言文化因素的教学就不能达到语言教学的目的，因此就像语音、词汇、语法和汉字等因素一样，文化因素也是语言中不可或缺的组成部分。","陈光磊把这种文化因素分为语构文化、语义文化和语用文化。"],"q":"(三)论述题(每题20分，共20分)请结合具体例子谈一谈对外汉语教学中的语言文化因素。","w":"high","e":["2026 真题"]},{"t":"跨文化交际","y":"名词解释","p":["跨文化交际是指不同文化背景的人们之间的交际行为。这种交际主要是通过语言来进行的，称为跨文化语言交际。","影响跨文化语言交际的是不同文化之间的相同之处和不同之处，特别是文化差异。因此跨文化交际中要特别重视并研究文化差异。","跨文化交际的特点：(1)文化的差异与交际障碍；(2)交际原则与价值观念；(3)母语文化的思维定势和对异文化的成见；(4)交际过程中的相互接近和求同趋向；(5)交际的结果：文化的相互影响。","从上述五个特点可以看出，跨文化交际的根本特征是如何发现、认识和对待不同文化之间的差异。"],"q":"南京师范大学2026年全国硕士研究生统一招生考试招生专业：国际中文教育考试科目：汉语国际教育基础试题编号：445一、中外文化及跨文化交际基础知识(共80分)","w":"high","e":["2019 真题"]},{"t":"音节","y":"名词解释","p":["人们听感容易分辨出来的最小语音片断","发音肌肉经历一次从紧张到松弛的过程","听感上有一个明显的响度中心","普通话除儿化音外一个汉字读音就是一个音节"],"q":"2.简述现代汉语词汇双音节化的主要途径。","w":"high","e":["2013 真题","2019 真题"]}]}]}]},{"d":"zhenti_24","t":"24南师大354+445真题和答案","c":[{"id":"zhenti_24-c01","t":"全文","w":"high","s":[{"id":"zhenti_24-c01-s01","t":"全文","w":"high","n":82,"k":[{"t":"\"达赖\"和\"班禅\"是红教两大活佛转世系统的称号。","y":"判断题","p":["格鲁派（黄教）两大系统","红教为宁玛派"],"q":"1.“达赖”和“班禅”是红教两大活佛转世系统的称号。","w":"high","e":["2024 真题"]},{"t":"“的”字结构","y":"名词解释","p":["由结构助词“的”附加在其他词语之后构成","使谓词性成分转化为名词性成分","在语义上起转指作用"],"q":"5.“的”字结构是助词短语的一种，属于短语的结构类。","w":"high","e":["2020 真题","2024 354 一、名词解释（每"]},{"t":"《七略》","y":"名词解释","p":["刘歆在刘向《别录》基础上编成","分辑略等七部分","我国第一部综合性图书分类目录"],"q":"8.西汉刘向汇集各种书录编辑成《七略》，这是我国最早的目录学专著。","w":"high","e":["2024 真题"]},{"t":"《汉语拼音方案》","y":"名词解释","p":["用拉丁字母拼写现代汉语普通话语音的方案","基本功能是解决汉字、词语等语言单位的规范读音与拼写","专门为普通话读音设计，只适用于普通话"],"q":"记录汉语语音现在主要使用《汉语拼音方案》。","w":"high","e":["2011 真题","2017 真题"]},{"t":"《齐民要术》","y":"名词解释","p":["北魏贾思勰著","现存最早最完整的农学名著","总结黄河流域农业生产经验"],"q":"贾思勰是北魏时期的大农学家，他的代表作是《齐民要术》。","w":"high","e":["2024 真题"]},{"t":"丝绸之路","y":"名词解释","p":["张骞出使西域后开辟","东起长安，西至地中海东岸","输出丝绸瓷器造纸术","输入葡萄苜蓿与佛教艺术"],"q":"7.丝绸之路东起汉唐首都长安，向西经河西走廊，经过里海南沿、巴格达，抵达波罗的海东岸，转至罗马各地。","w":"high","e":["2024 真题","2018 真题"]},{"t":"中介语","y":"名词解释","p":["美国语言学家塞林克于1969年提出中介语(interlanguage)的概念，1972年在其著名论文《中介语》中提出的中介语假说。","中介语是指在第二语言习得过程中，学习者通过一定的学习策略，在目的语输入的基础上所形成的一种既不同于其第一语言也不同于目的语、随着学习的进展向目的语逐渐过渡的动态的语言系统。","中介语既指学习者语言发展的任何一个阶段的“静态”语言系统，可以把它看做是某一阶段的“切片”；也是指学习者从零起点到靠近目的语的语言发展轨迹，可以把它看做是各阶段相接而形成的一种连续体。","中介语在其发展过程中的任何一个阶段都是学习者创造的一种介于第一语言和目的语之间的独特的语言系统；中介语不是固定不变的，而是一个不断变化的动态语言系统。"],"q":"科德根据中介语的发展过程，把偏误分为三类：前系统偏误、系统偏误和后系统偏误。","w":"high","e":["2020 真题"]},{"t":"习得","y":"名词解释","p":["“习得”是在自然的语言环境中，通过旨在沟通意义的言语交际活动，不知不觉(潜意识)地获得一种语言，典型的例子是儿童习得第一语言(一般是母语)。","简言之，习得是潜意识的自然的获得。","习得，特别是儿童第一语言的习得，是从本能的要求(生存和交际的需要)开始、与其生理和心理的自然发育、成熟同步进行的过程，儿童是在不知不觉中习得第一语言的。","习得一般是在使用该目的语的社会环境中进行的；习得时注意力主要集中在语言的功能和意义方面。"],"q":"1.系统偏误 2.水平测试 3.带音法 4.强化论五、简答题 (10分)请简要对比第一语言习得与第二语言习得的不同。","w":"high","e":["2019 真题"]},{"t":"乡试","y":"名词解释","p":["省级考试三年一次","秋八月举行称秋闱","考中者称举人","第一名称解元"],"q":"明清会试是全国范围内的考试，也是每三年举行一次，即于乡试的第二年举行，也就是在丑、辰、未、戌年举行，时间是春三月，因由礼部主持，所以又叫“礼闱”或“春闱”。","w":"high","e":["2024 真题"]},{"t":"交际文化","y":"名词解释","p":["80年代初，对外汉语教学界的学者张占一等人，从第二语言教学培养交际能力的实际出发，按文化在交际中的功能提出区分“知识文化”和“交际文化”的观点。","交际文化则是指跨文化交际中直接影响信息准确传递(即引起偏差或误解)的语言和非语言的文化因素。","所谓知识文化是指跨文化交际中不直接影响准确传递信息的语言和非语言的文化因素。","交际文化则是指两种语言间规约性的文化差异，是以制约信息模式的形式来参与交际的，可能在交际中引起误解或偏差。"],"q":"3.请简要举例对比“知识文化”和“交际文化丸子汉硕考研4.请简述对外汉语教学中文化教学的方法。","w":"high","e":["2018 真题"]},{"t":"交际能力","y":"名词解释","p":["社会语言学家海姆斯在60年代提出了不同的看法，他认为一个人的语言能力不仅指能否说出合乎语法的句子，还包括能否在一定的语言环境中恰当地使用语言的能力。","海姆斯首次提出了“交际能力”（communicative competence）的概念，即运用语言（或非语言手段)进行社会交往的能力，包括传递信息、交流思想和表达感情。","海姆斯还进一步提出了交际能力的四个特征：语法性——指语法上是否正确；可接受性——在交际中能否被接受；得体性——在一定的语境中是否恰当，是否合乎社会文化习惯；现实性——是否是现实中常用的。","交际能力既包括语言能力，也包括语言运用的能力。"],"q":"3.80年代初，对外汉语教学界的学者张占一等人，从第二语言教学培养交际能力的实际出发，按文化在交际中的功能提出区分“知识文化”和“交际文化”的观点。","w":"high","e":["2019 真题"]},{"t":"介词","y":"名词解释","p":["多是从动词虚化而来，又叫“副动词”","引进跟谓词有关的对象","跟名词组合成介词短语","主要作状语，也可以作补语"],"q":"虚词按照语法意义的不同可以细分为介词、连词、助词、语气词。","w":"high","e":["教材高频"]},{"t":"会试","y":"名词解释","p":["乡试次年春三月京城举行","称春闱或礼闱","考中者称贡士","第一名称会元"],"q":"4.明清会试因为举办时间为每年的春三月，由礼部主持，因此又叫“礼闱”或“春闱”。","w":"high","e":["2024 真题"]},{"t":"会话含义","y":"名词解释","p":["对“会话含义”（conversational implicature）的研究实际上就是对会话中说话者的言外之意的研究。","所以会话含义是指会话中说话者因违反“合作原则”而产生的言外之意。","但在实际语言交际中，人们常常出于某种礼貌或其他目的，故意违反这些合作原则，从而产生言外之意让听话者去领会。","格赖斯会话含义理论后来不断得到补充和完善。"],"q":"利奇的礼貌原则进一步丰富和发展了会话含义理论，使格赖斯会话含义理论不断得到补充和完善。","w":"high","e":["2018 真题","2023 354 一、名词解释（每"]},{"t":"假借","y":"名词解释","p":["本无其字依声托事","借用同音字记录新词","如“其”借为代词","属用字法"],"q":"声旁本身来自义符，假借义符表音类，又不是专门表某音，有的声旁还可兼做形旁，所以汉字的形声字的音符不同于表音文字的字母，汉字不是意音文字，是属于表意体系的文字。","w":"high","e":["2011 真题"]},{"t":"偏旁","y":"名词解释","p":["偏旁就是用二分法对合体字进行一次性切分而获得的结构单位，可分为“形旁”和“声旁”两类。","形旁通常表示该字的意义类别，声旁通常表示该字的大致读音。","多数形声字由一个形旁和一个声旁组成；会意字的两个偏旁都属于形旁。","通用汉字的偏旁约有1500个。"],"q":"2.由表示字义类属的偏旁即意符，和表示字音的偏旁即音符，组成新字的造字法叫形声。","w":"high","e":["2012 真题","2018 真题"]},{"t":"偏误分析","y":"名词解释","p":["偏误分析(Error Analysis)是对学习者在第二语言习得过程中所产生的偏误进行系统的分析，研究其来源，揭示学习者的中介语体系，从而了解第二语言习得的过程与规律。","科德是偏误分析最早的倡导者。","偏误分析的心理学基础是认知理论，语言学基础则是乔姆斯基的普遍语法理论。","第二语言习得过程被看成是规则形成的过程，即学习者不断从目的语的输入中尝试对目的语规则做出假设，并进行检验与修正，逐渐向目的语靠近并建构目的语的规则体系。"],"q":"【丸子汉硕解析】本题主要考查偏误分析的知识点，见刘珣《对外汉语教育学引论》第六章P194。","w":"high","e":["2020 真题"]},{"t":"元音","y":"名词解释","p":["气流振动声带","发音部位不受阻碍","又叫母音","主要功能是构成音节的韵母"],"q":"1.普通话的ü是舌面、前、高、圆唇元音。","w":"high","e":["2012 真题","2018 真题"]},{"t":"刺激—反应论","y":"名词解释","p":["刺激—反应论是行为主义心理学的理论，盛行于40年代和50年代，代表人物是斯金纳，是关于第一语言习得的主要理论之一。","行为主义者认为语言不是先天所有而是后天习得的，强调外部条件在第一语言习得过程中的作用。","这种行为跟人类的其他行为一样，是通过刺激—反应—强化的模式养成习惯而学会的；婴儿来到世界时像一张白纸，对这个世界、对语言没有任何先天的知识，完全由环境来塑造其行为。","儿童学话就是对环境所给予的刺激做出相应的反应，开始是对成人语言的模仿，如果模仿得比较接近，就从成人那儿得到奖励或赞许，这样他的反应就得到了强化。"],"q":"4.强化论是习得理论之一，理论依据是行为主义的刺激反应论，代表人物是塞林克。","w":"high","e":["2018 真题"]},{"t":"功能","y":"名词解释","p":["交际法一反其他教学法以语法或句型结构为纲的传统做法，明确提出以功能意念为纲。","功能是用语言做事，完成一定的交际行为。","交际大纲把语言功能分为六类：传达与了解实际情况；表达或了解理智性的态度；表达或了解道义上的态度；表达或了解情感性的态度；请人做事；社交。","以“邮局在哪儿?”这个句子为例，其功能是询问。"],"q":"分类的依据是词的语法功能、形态和意义三方面，就汉语来说语法功能是主要依据，形态和意义是参考依据，三者合称为词性。","w":"high","e":["2019 真题","2020 真题","2021 真题"]},{"t":"助词","y":"名词解释","p":["黏着在词或短语上面，表示附加意义","附着在后面的一律读轻声","结构助词：的、地、得","时态助词：了、着、过","其他助词：似的、所、给、看、来、把、们、第、初、等"],"q":"4.什么是助词，助词有哪些小类，请举例说明。","w":"high","e":["2017 真题"]},{"t":"反义词","y":"名词解释","p":["反义词就是属于同一范畴的意义相反或相对的一组词。","根据反义词在意义上是相反的矛盾关系还是相对的反对关系，可以分成两类：绝对反义词和相对反义词。","绝对反义词：肯定一方必否定另一方，否定一方必肯定另一方，二者属于矛盾关系；相对反义词：肯定一方必否定另一方，否定一方不一定肯定另一方，二者属于反对关系。"],"q":"反义词是“普通、一般”。","w":"high","e":["教材高频"]},{"t":"合体字","y":"名词解释","p":["合体字是由两个或两个以上部件组合而成的汉字。","象形字、指事字一般属于独体字，会意字、形声字通常属于合体字。","独体和合体在汉字形体演变过程中会互变。"],"q":"叫形声字。形声字都是合体字。形声字总是分成两部分，一部分表意，一部分表音。表意部分称为意符，也叫形旁、形符、义符。意符表示形声字的意义范畴。意符的作用一是提示该字所记录的语素的一类，二是区别同音字。意符在表","w":"high","e":["2015 真题"]},{"t":"同音字","y":"名词解释","p":["同音字是指两个或两个以上的汉字，读音相同、意义不同而且意义没有联系。","同音字按字形是否相同可以分为同形同音异义字和异形同音异义字两类。","狭义的同音字只指同形同音异义字；广义的同音字，除了同形同音字之外，还包括了异形同音字。"],"q":"意符的作用一是提示该字所记录的语素的一类，二是区别同音字。","w":"high","e":["2014 真题","2021 真题"]},{"t":"同音词","y":"名词解释","p":["同音词是指语音形式(声母、韵母和声调)相同而意义完全不同的词。","同音词包括两类：同音同形词，是指语音形式相同，书写形式也相同而意义不同的词；同音异形词，是指语音形式相同，书写形式和意义都不相同的词。","同音词就来源来说主要有两类：词源不同发音偶合的同音词；词源相同，词义分化而成的同音词。"],"q":"(3)汉字分化同音词能力强。","w":"high","e":["教材高频"]},{"t":"四大发明","y":"名词解释","p":["造纸术—东汉蔡伦改进","印刷术—唐雕版、宋活字","火药—唐炼丹、宋军用","指南针—战国司南、宋航海"],"q":"即使是著名的“四大发明”，也与国家的实用目的有关。","w":"high","e":["2016 真题"]},{"t":"国子监","y":"名词解释","p":["隋炀帝始设","兼具最高教育行政机关与最高学府","明代监生制度"],"q":"3.国子监最初只是管理教育的行政机关，到了明代就发展成为兼有行政机关和最高学府两种性质的机构。","w":"high","e":["2024 真题"]},{"t":"声母","y":"名词解释","p":["音节开头的辅音","普通话22个辅音有21个可作声母"],"q":"(1)ü跟 n、1以外的声母相拼时都省写两点。","w":"high","e":["2014 真题","2020 真题"]},{"t":"字义","y":"名词解释","p":["汉字字形跟字义的关系大致有三类：1.字形记录的是词义；2.字形记录的是语素义；3.字形记录的仅仅是一个音节，它没有字义。","一个汉字在多数情况下，记录的是现代汉语的一个语素。字义也就是语素义。","现代汉字中也有少数用会意法造出来的字还是可以直接从字形推知字义的。"],"q":"2.由表示字义类属的偏旁即意符，和表示字音的偏旁即音符，组成新字的造字法叫形声。","w":"high","e":["2015 真题"]},{"t":"字体","y":"名词解释","p":["字体指的是同一种文字的各种不同体式。","例如汉字的楷书、行书、草书，印刷的宋体、仿宋体、楷体、黑体等。","至于书法艺术上的种种字体，例如欧体、颜体、柳体，指的是书法的派别，又称“书体”，不属于严格文字学的范围。"],"q":"5.唐朝欧阳询的书法以楷书为最好，字体劲险刻厉，于平正中见险绝，其代表作为《九成宫醴泉铭》。","w":"high","e":["2013 真题","2019 真题"]},{"t":"定位语素","y":"名词解释","p":["一个语素同别的语素组合成词时，位置固定的语素叫定位语素。","根据位置的前后，又分为前置定位语素和后置定位语素。","前缀如：非(非常、非凡、非法、非分等)；后缀如：者(读者、记者、作者、学者等)、化(绿化、美化、净化、激化等)。","一个语素同别的语素组合成词时，位置不固定的语素叫不定位语素，如“电”可以前置（电器、电子、电影），也可以后置（闪电、雷电、水电）。"],"q":"语素可以按照不同的标准进行分类，按语素的位置，可以分为定位语素和不定位语素。","w":"high","e":["教材高频","2024 354 一、名词解释（每"]},{"t":"实用性","y":"名词解释","p":["实用性是教材编写和选用的原则之一。","第二语言教材不同于语言学教材，主要用于培养语言技能和能力；语言知识要通过教学转化为技能，是为培养能力服务的。","实用性主要体现在：(1)教材内容要从学习者的需要出发，是学习者进行交际活动所必需的，是在生活中能马上应用的，要避免“教科书语言”和“教室语言”；(2)语言材料必须来源于生活、来源于现实，要有真实性；(3)要有利于贯彻精讲多练的原则；(4)要有利于开展交际活动，使教学过程交际化。"],"q":"1.在13世纪以后，中国的科学技术就停留在经验阶段，创新意识没有进一步提升，科学技术理论没有进一步发展，其根本原因是与中国社会的伦理型结构、中国科技的实用性特点和科学研究的整体性观念密切相关的。","w":"high","e":["2020 真题"]},{"t":"对外汉语教学","y":"名词解释","p":["《中国大百科全书·语言文字》中写道：“对外汉语教学是指对外国人的汉语教学。”","实际上也包括对第一语言不是汉语的海外华人进行的汉语教学。","这一名称基本上体现了这个学科的特点和内涵，在国外也产生了广泛的影响，而且简洁上口、符合汉语习惯，因此从1982年提出一直使用至今。","但是十多年的使用也发现这一名称有一定的局限性：它只突出了主要教学对象，未能全面、准确地反映学科性质——第二语言教学。"],"q":"3.请简要举例对比“知识文化”和“交际文化丸子汉硕考研4.请简述对外汉语教学中文化教学的方法。","w":"high","e":["2015 真题","2021 真题"]},{"t":"对外汉语教育学","y":"名词解释","p":["从教育的高度研究对外汉语教学，反映到本学科的名称上，本书主张应与其他学科教育学的名称相一致，即用“对外汉语教育学”比较规范。","这一名称还能更清楚地体现出本学科的性质及其科学定位。","当然，提出“对外汉语教育”并不意味着、实际上也不可能用它来取代已使用近20年之久、早已深入人心的“对外汉语教学”这一名称。"],"q":"【丸子汉硕解析】本题考查言语行为的概念，可参考刘珣《对外汉语教育学引论》P81。","w":"high","e":["2016 真题"]},{"t":"对比分析","y":"名词解释","p":["对比分析(Contrastive Analysis)是将两种语言的系统进行共时比较，以揭示其相同点和不同点的一种语言分析方法。","把对比分析运用到第二语言教学中来，始于40年代的美国；提出第二语言习得的对比分析假说并建立起对比分析的理论系统的，是拉多。","对比分析的语言学理论基础是结构主义语言学，其心理学的理论基础是行为主义心理学和迁移理论。","对比分析大体上按照描写、选择、对比、预测四个步骤进行。"],"q":"此外不能使用对比分析法，鼓励学生之间进行讨论和互动，分享他们对目的语国家文化的理解和体验。","w":"high","e":["2019 真题"]},{"t":"对比分析法","y":"名词解释","p":["对比分析法是语言研究和语言教学研究最常用的方法，用来对两种或多种语言的相同和相异之点、两种或多种语言的习得或教学规律的相同和相异之点进行对比研究，以加深对所比较的事物的认识，从而发现新的特征和新的规律。","对比分析法有着广阔的天地，可以进行不同事物之间的共时横向比较，也可以进行同一事物的历时纵向比较；可以进行定量比较，也可以进行定性比较；可以进行专项比较，也可以进行综合比较。","具体地说，第一语言习得和第二语言学习的比较，第二语言学习和外语学习的比较，不同母语的学习者学习同一目的语的比较，同一语言学习者学习不同目的语的比较，不同学习策略或不同的教学方法流派的比较等等，都是很好的研究课题。"],"q":"此外不能使用对比分析法，鼓励学生之间进行讨论和互动，分享他们对目的语国家文化的理解和体验。","w":"high","e":["2019 真题"]},{"t":"形声","y":"名词解释","p":["由形旁与声旁组成，形旁表示大致的字义或字义的类属，声旁提示字的读音或近似的读音。","形声法是汉字最主要的造字方法。","形声法综合利用字形表义和字形表音这两种手段。"],"q":"2.由表示字义类属的偏旁即意符，和表示字音的偏旁即音符，组成新字的造字法叫形声。","w":"high","e":["2011 真题","2016 真题","2020 真题","2016 真题"]},{"t":"态度","y":"名词解释","p":["态度是构成动机的主要因素之一。它是个体对某种客观事物的评价性反应，是在对事物了解的基础上产生情感上的褒贬好恶，并反映出对之采取行动的倾向性。","西方学者的调查表明，学习第二语言的态度与所取得的学习成绩之间的关系高于学习其他科目的态度与成绩之间的关系。","影响学习态度的几个方面是：对目的语社团和文化的态度、对目的语的态度、对课程和教师、教材的态度。","对大多数学习者来说直接影响其目的语学习态度的还是他们在语言课堂上的感受。"],"q":"三、论述题 (20分)请简要论述跨文化交际中对待不同文化应秉持的态度。","w":"high","e":["2019 真题"]},{"t":"意符","y":"名词解释","p":["凡是跟整字在意义上有联系的部件，称为“意符”。","对现代汉字构形成分进行分析，得到的是构字部件；构字部件的属性，指的是部件跟整字在音义上的关系，这可以分为三类：意符、音符和记号。","汉字的意符，也叫形旁，在传递语义信息上的功能，是单纯的表音文字所不具备的。"],"q":"2.由表示字义类属的偏旁即意符，和表示字音的偏旁即音符，组成新字的造字法叫形声。","w":"high","e":["教材高频"]},{"t":"意音文字","y":"名词解释","p":["汉字记录汉语则兼用三种方法，即从义入手、从音入手或同时从音义入手。","汉字是一种兼顾意音的文字，可以简称为“意音文字”。","汉字绝大多数都是兼用表音和表义的方法，所以形声字约占全部汉字的90%左右。","现代汉字的意符和音符所起的表义标音作用已经有限。"],"q":"声旁本身来自义符，假借义符表音类，又不是专门表某音，有的声旁还可兼做形旁，所以汉字的形声字的音符不同于表音文字的字母，汉字不是意音文字，是属于表意体系的文字。","w":"high","e":["2015 真题"]},{"t":"成语","y":"名词解释","p":["成语是人们从历史上传承下来并长期使用的结构凝固、语义精辟且具有民族特点的熟语。","成语是熟语中最重要的一种，主要有四个特点：历史的传承性、结构的凝固性、意义的整体性、习用的民族性。","成语主要来源包括神话寓言、历史故事、诗文语句、口头俗语。"],"q":"他认为儿童学习说话就是对环境或成人话语作出合适的反应，反应正确就会得到奖励，使之受到强化并形成语言习惯。","w":"high","e":["教材高频"]},{"t":"教学内容","y":"名词解释","p":["第二语言教学是为了培养语言交际能力，这一教学目的决定了教学内容。","从语言能力和语言交际能力的构成因素出发，吕必松曾提出语言教学的教学内容应包括“语言要素、语用规则、言语技能、言语交际技能和相关文化知识”。","这样，对外汉语教学内容可以概括为四个方面：(1)语言要素(汉语语音、词汇、语法、汉字)；(2)言语技能(汉语听、说、读、写)；(3)言语交际技能(汉语语用规则、话语规则、交际策略)；(4)相关文化知识(汉语的文化因素、中国基本国情和文化背景知识)。","语言要素、言语技能、言语交际技能和相关文化知识就构成了语言交际能力的基础。"],"q":"这种测试不与特定的课程或教学内容直接关联，而是侧重于评估考生的整体语言水平。","w":"high","e":["2020 真题"]},{"t":"标准化测试","y":"名词解释","p":["标准化测试是以现代教育测量学的理论为依据，按照系统的科学程序对考试的全过程(设计、命题、施测、评分、分析等)实行标准化处理，对误差进行严格控制，有较高效度、信度，能测出受试者真实水平的测试。","这种测试由权威机构和专业队伍研制。","为了保证严密的科学性，标准化测试通常是以客观性试题为主的常模参照测试。","标准化语言测试的过程大体上有四个步骤，即设计命题、考试实施、阅卷评分和统计分析。"],"q":"2.水平测试又称能力测试，是一种用于测量考生语言能力的标准化测试。","w":"high","e":["2020 真题"]},{"t":"格鲁派（黄教）","y":"名词解释","p":["宗喀巴15世纪初创立","戴黄帽故称黄教","达赖与班禅两大转世系统","清乾隆确立金瓶掣签"],"q":"达赖和班禅是格鲁派(黄教)两大活佛转世系统的称号，而不是红教(宁玛派)的。","w":"high","e":["2024 真题"]},{"t":"楷书","y":"名词解释","p":["楷书是现代通行的汉字手写正体字，也叫正楷。“楷”是楷模、法式的意思。","楷书笔画分明，笔形规整，结构端庄，字形方正，是汉字的标准字体。","现代汉字手写体主要有楷书、草书、行书等三种。"],"q":"5.唐朝欧阳询的书法以楷书为最好，字体劲险刻厉，于平正中见险绝，其代表作为《九成宫醴泉铭》。","w":"high","e":["教材高频"]},{"t":"母语","y":"名词解释","p":["母语是指本国、本民族的语言","这是按国家的界限来区分的。","外语是指外国的语言。一般情况下母语是人们的第一语言；但对一些移居国外的人来说，其子女出生后首先接触并获得的语言有可能是居住国的语言而不是母语。"],"q":"(1)通过注释直接阐述文化知识：开始可以用学习者的母语注释，随着学习者汉语水平的提高，可逐渐用目的语注释，让学生自己阅读，可以省去课堂上讲解的时间。","w":"high","e":["2019 真题"]},{"t":"水平测试","y":"名词解释","p":["水平测试又称能力测试，目的在于测量受试者现有的整体的语言实际运用能力，以评定是否达到胜任某项任务的要求。","水平测试不考虑受试者的学历，也不以任何大纲、课程或教材为依据，而是根据语言交际能力的标准，或是某一特定任务的要求来命题。这是一种回顾兼预示的测试。","水平测试具有较高的区分性，受试者的分数反映了他在全体受试者中的位置。水平测试常常是大规模标准化测试，如我国的汉语水平考试(HSK)、英语水平考试(EPT)，美国的托福考试，英国的剑桥英语水平考试等。"],"q":"1.系统偏误 2.水平测试 3.带音法 4.强化论五、简答题 (10分)请简要对比第一语言习得与第二语言习得的不同。","w":"high","e":["2019 真题","2021 真题","2024 445 二、教育学心理学"]},{"t":"汉字","y":"名词解释","p":["汉字是汉民族在长期的劳动生产和社会实践中为适应交际需要而独立创造出来的书面交际工具。","汉字是一种重要而独特的文字系统，在记录语言的方法、造字的方式、字形的结构、字体的呈现等诸方面都有鲜明的特点。","汉字是世界上历史最悠久的一种独立发展的文字，曾形成“汉字文化圈”。"],"q":"2.说明“隶变”在汉字发展史上的价值。","w":"high","e":["2016 真题"]},{"t":"现代汉字","y":"名词解释","p":["现代汉字指现阶段正在使用的汉字，它记录的主要对象是现代汉语，与传统汉字相对应。","判断一种文字符号体系的性质，首要的是研究这种文字与它所记录的语言之间的关系。","考察现代汉字的特点，还必须跟拼音文字符号体系进行比较。"],"q":"九中)隶书的出现，打破了古汉字象形的传统，奠定了现代汉字的基础，是文字史上的分水岭，在汉字发展史上具有划时代的意义。","w":"high","e":["2013 真题","2019 真题"]},{"t":"知识文化","y":"名词解释","p":["所谓知识文化是指跨文化交际中不直接影响准确传递信息的语言和非语言的文化因素；交际文化则是指跨文化交际中直接影响信息准确传递(即引起偏差或误解)的语言和非语言的文化因素。","知识文化常以“知识”或“内容”的形式参与交际。“知识”的多少也会影响到交际的进行。但懂就是懂，不懂就是不懂，一般不会产生误解。","交际文化与知识文化概念的提出，加深了人们对语言教学中的文化教学的认识。"],"q":"3.请简要举例对比“知识文化”和“交际文化丸子汉硕考研4.请简述对外汉语教学中文化教学的方法。","w":"high","e":["2018 真题"]},{"t":"短语","y":"名词解释","p":["由两个或两个以上单词构成的句法结构单位","在语义上能逐层贯通，在结构上能逐层搭配起来","没有句调的一组词","短语有两类：词组和结构"],"q":"同一类的虚词有共性，又有个性，很多虚词还往往不止有一种语法意义，如结构助词“的”用在偏正短语里表示修饰和被修饰的关系，用在“的”字短语中让整个短语获得指称性。","w":"high","e":["2015 真题","2021 真题"]},{"t":"社会属性","y":"名词解释","p":["语音最重要的特点","世界上其他任何声音所不具备","约定俗成","系统性","民族特征和地域特征"],"q":"语音要表达一定的意义，什么样的意义用什么样的语音形式表达，必须是由使用该语言的全体社会成员约定俗成并共同遵守的，所以语音又具有社会属性。","w":"high","e":["2014 真题","2018 真题","2022 真题"]},{"t":"笔形","y":"名词解释","p":["依据笔势和走向，现代汉字的笔画可以有31种不同的形式，笔画的形式简称为笔形。","现代汉字的笔形可以有概括的和细致的两种分类法：概括的分类法把笔形分为八类或五类；细致的分类法先把笔形分为基本笔形和派生笔形（也称复合笔形）两个大类。","书写时，笔画的方向自始至终没有变化的笔形是基本笔形，笔画的方向有所变化的是派生笔形。"],"q":"(1)隶书打破了小篆的结构，改变了小篆原有的笔势，使圆体变方体，曲笔变直笔，形成了汉字基本笔画，使汉字完全符号化；","w":"high","e":["教材高频"]},{"t":"笔画","y":"名词解释","p":["笔画是构成楷书字形的最小单位。","就书写过程而言，笔画是有起止的线条，从落笔到下一次提笔的过程中写出的点和线就叫一笔或一画。","在不同的字体中，笔画的表现形式可能不完全相同。","这里所说的笔画是以印刷体的主流字体宋体、楷体作为分析对象的。"],"q":"隶书把小篆圆转弧形的笔画变成方折平直笔画的过程被称作隶变，它在字体演变史上的地位最为重要，它是古今汉字的分水岭。","w":"high","e":["2012 真题","2018 真题"]},{"t":"第一语言","y":"名词解释","p":["人出生以后首先接触并获得的语言","第二语言指人们在获得第一语言以后再学习和使用的另一种语言。","这是按人们获得语言的先后顺序来区分的两个概念，也是语言教学理论中用得最多的术语。"],"q":"1.系统偏误 2.水平测试 3.带音法 4.强化论五、简答题 (10分)请简要对比第一语言习得与第二语言习得的不同。","w":"high","e":["2013 真题","2019 真题"]},{"t":"第二语言","y":"名词解释","p":["指人们在获得第一语言以后再学习和使用的另一种语言","由于学习这些语言的规律与学习第二语言有很多共同之处，所以一般不再细分而统称第二语言。","广义的“第二语言”是指任何一种在第一语言获得以后学习和使用的语言，包括外语。"],"q":"1.系统偏误 2.水平测试 3.带音法 4.强化论五、简答题 (10分)请简要对比第一语言习得与第二语言习得的不同。","w":"high","e":["2019 真题"]},{"t":"第二语言习得","y":"名词解释","p":["正因为第二语言学习中也包含有习得的因素，越来越多的人把第二语言学习也称为第二语言习得。","在第二语言学习理论的研究中，特别是西方学者的研究文章中已出现用术语“习得”代替“学习”的趋向。","有关第二语言习得的理论和模式，西方学者已提出不下数十种，从各个不同的角度论述或解释第二语言是如何习得的。","其中有的理论虽然影响不小，但尚未得到足够的科学实验的证实，还只能称为假说。"],"q":"1.系统偏误 2.水平测试 3.带音法 4.强化论五、简答题 (10分)请简要对比第一语言习得与第二语言习得的不同。","w":"high","e":["2019 真题"]},{"t":"老庄思想","y":"名词解释","p":["老子：道法自然、无为而治","庄子：齐物逍遥、精神自由","与儒家互补构成文化支柱"],"q":"玄学崇尚老庄思想，主张“以无为本，以有为末”，否认外界事物的存在，很容易与佛教宣扬的出世思想合流，因此主张“一切法皆空”的佛教《般若经》很快流行起来。","w":"high","e":["2017 真题"]},{"t":"行为主义","y":"名词解释","p":["20世纪的美国心理学界出现了反对构造主义和机能主义的另一种思潮——行为主义。这是强调学习过程和测量外显行为的心理学派，其创始人是美国心理学家华生，后期主要代表人物是斯金纳。","行为主义有两个主要特点：否认意识，主张心理学只研究人的行为；反对内省，主张采用客观的实验的方法。","华生受俄国巴甫洛夫经典性条件反射学说的影响，建立了刺激——反应模式，成为经典性行为主义理论。新行为主义代表人物之一的斯金纳，则受到操作主义哲学的影响，建立了操作行为主义，和“刺激——反应——强化”的模式。"],"q":"4.强化论是习得理论之一，理论依据是行为主义的刺激反应论，代表人物是塞林克。","w":"high","e":["2026 真题","2026 445 二、教育学、心理"]},{"t":"言语行为理论","y":"名词解释","p":["50年代末英国哲学家奥斯汀提出“言语行为”理论（speech act theory）。","他指出语言不仅是描写、陈述和说明客观世界，提供信息，而且人们说出话语也是一种行为。人们在说话的时候，就是在做一件事，完成一种行为。","奥斯汀认为人们所说出的话语能同时进行三种行为，即言内行为、言外行为和言后行为。","仍以“屋里很热”这句话为例，言内行为是说话人通过发声把这句话说出来；言外行为则是通过这句话来表达隐含的真正意图，也就是言外之意；言后行为则是指这句话对听话人所产生的影响。"],"q":"6.50年代末英国哲学家奥斯汀提出“言语行为”理论。","w":"high","e":["2019 真题"]},{"t":"词汇","y":"名词解释","p":["词汇也称语汇，是语言中能独立运用的最小的音义结合单位的集合，有时也可以指特定领域中词语的集合。","词语是能够独立运用的音义结合的最小语言单位。词语包括词和固定短语，词是词汇的主体部分，而固定短语是词汇的重要组成部分。","词语的总和形成词汇，词汇与词语的关系是集合与个体的关系。","根据语言差异，词汇可分为汉语词汇、英语词汇、德语词汇等；根据领域不同，词汇可分为政治词汇、经济词汇、法律词汇等。"],"q":"这些特点都与磋词无词汇意义有关。","w":"high","e":["教材高频"]},{"t":"词类","y":"名词解释","p":["词类专指词的语法类别","不同的词类在形态、意义和功能等方面表现出区别性特点","划分词类的目的是为了说明语言的构造规则","词类是一个有层次的系统"],"q":"2.汉语词类划分应该依据什么标准?试对此加以论述。","w":"high","e":["2013 真题","2018 真题"]},{"t":"词缀","y":"名词解释","p":["词缀是构成合成词的附着在词根前后或中间表示附加意义的定位语素。","合成词根据词缀的位置，可以分成前缀、后缀、中缀三种类型。","汉语里典型词缀并不太丰富，但是存在比较多的“类词缀”，特点是类似于词缀，意义有不同程度的虚化，但还不彻底；构词功能很强，有组合泛化趋势；其中，后缀与类后缀型最为丰富，中缀和类中缀最少。"],"q":"词缀都是定位语素，居前部的是前缀，如“老、阿”；","w":"high","e":["教材高频"]},{"t":"话语","y":"名词解释","p":["简单说来，话语是在交际过程中一定语境下表示完整语义的自然语言，是由结构衔接、语义连贯、排列符合逻辑来表达某个主题的连续的句子所构成的语言整体。","话语从形式上看通常是大于句子的语言单位，可能是句组、段落甚至篇章；也可能只是一个句子，一个短语甚至一个词。","话语既包括口语，也包括书面语。"],"q":"指出语言不仅是描写、陈述和说明客观世界，提供信息，而且人们说出的话语也是一种行为。","w":"high","e":["2018 真题"]},{"t":"语气词","y":"名词解释","p":["一般用于句末","表示陈述、疑问、祈使、感叹等语气","永远黏着、后附、轻声"],"q":"虚词按照语法意义的不同可以细分为介词、连词、助词、语气词。","w":"high","e":["2016 真题","2020 真题"]},{"t":"语法","y":"名词解释","p":["制约着句子组合合法性的规则就是“语法”","语法是语言不可缺少的有机的组成部分","语音是语言的物质外壳，词汇是语言的建筑材料，语法是语言的构造规则","词语的组合绝不是任意的，符合规则句子就合法，否则就不合法"],"q":"4.词类是词的语法性质的分类。","w":"high","e":["2016 真题","2019 真题"]},{"t":"语法功能","y":"名词解释","p":["词的组合能力","能否与其他的词组合成短语","以什么顺序组合","组合以后表示什么关系","作句法成分的能力"],"q":"分类的依据是词的语法功能、形态和意义三方面，就汉语来说语法功能是主要依据，形态和意义是参考依据，三者合称为词性。","w":"high","e":["教材高频"]},{"t":"语法教学","y":"名词解释","p":["语法教学是对目的语的词组、句子以及话语的组织规律的教学，用以指导言语技能训练并培养正确运用目的语进行交际的能力。","不掌握目的语遣词造句的规则，就难以正确理解和表达。语法教学一直处于第二语言教学的中心地位。","语法教学原则主要有：(1)通过语言对比突出语法的重点和难点；(2)从句型入手，句型操练与语法知识的归纳相结合；(3)由句子扩大到话语；(4)语法结构的教学与语义、语用和功能的教学相结合；(5)精讲多练，以练习为主；(6)先易后难、循序渐进地安排语法项目；(7)重视纠正学习者的语法错误，并把病错句的分析作为课堂教学内容的一个部分。"],"q":"【丸子汉硕解析】本题考查第二语言教学语法教学和偏误分析的知识点。","w":"high","e":["2020 真题","2021 真题"]},{"t":"语素","y":"名词解释","p":["语素是语言中最小的音义结合的构词单位，是最基本的语言单位。","一个语素必须是语音与语义结合，而且不能再拆分。其中，具有一定的语义是判断语素的最基本条件。","汉语绝大多数语素是一个有意义的音节。如“床”的语音形式是chuáng，它的语义内容是“供人躺在上面睡觉的家具”，那么，“床”就是一个语素。","有少数语素是由两个无意义的音节合成的。如“玻璃”，它的语音形式是bōli，语义是“一种质地硬而脆的透明物体”。“玻”和“璃”虽然都有语音形式，但都没有单独的语义，因此都不是语素；只有“玻璃”才是一个语素。"],"q":"3.确定汉语语素的基本方法是什么，请举例说明。","w":"high","e":["教材高频"]},{"t":"语言测试","y":"名词解释","p":["语言测试是根据一定的评估目的，以抽样方式通过有限试题来诱导出受试者的言语行为，然后借助于定量描述来推断受试者掌握的该语言的知识和能力。","从心理学的角度来看，上述定义表明，测试的任务在于如何诱导出体现受试者语言知识和能力的言语行为，并对这种行为进行量化和说明解释。","语言测试具有间接性、片面性、主观性和偶然性四个特点。","测试是教育评估的主要手段，也是教学活动的主要环节之一。测试是第二语言教学四大环节的重要组成部分。"],"q":"【丸子汉硕解析】本题考查语言测试中的水平测试，见刘珣《对外汉语教育学引论》第九章P380。","w":"high","e":["2020 真题","2021 真题"]},{"t":"语言能力","y":"名词解释","p":["乔姆斯基在60年代提出“语言能力”的概念，并将内在的“语言功能”与“语言表现”，即对语言的实际运用做了区分。","所谓“语言能力”是指人们所具有的语言知识，是一种内化了的包括语音、词汇、语法等的语言规则体系。","根据转换生成语言理论，一个人的语言能力主要表现在能正确组合声音和语素；能区分是否合乎语法的句子；能区分结构相同或相似但意义不同的句子等；而最根本之点则是能运用这一有限的规则体系创造出无限的句子。","可见“语言能力”主要是与语言形式结构有关，实际上是一种高度抽象的语法能力，是一种脱离外部语言环境的、人的内部心理机制。"],"q":"偏误是由于目的语掌握不好而产生的一种规律性错误，它偏离了目的语的轨道，反映了说话者的语言能力和水准。","w":"high","e":["2018 真题"]},{"t":"语音","y":"名词解释","p":["由人的发音器官发出","不同的语音代表不同的意义","作用是进行社会交际，具有“社会”的属性"],"q":"一、名词解释(每题5分，共30分)语音是人类说话的声音，是语义的表达形式，是语言的物质外壳，是人类通过发音器官来传递信息的声音，只有具有词句意义的声音才是语音。","w":"high","e":["2016 真题","2020 真题"]},{"t":"语音教学","y":"名词解释","p":["对外汉语语音教学的任务是让学习者掌握汉语语音的基本知识和汉语普通话正确、流利的发音，为用口语进行交际打下基础。","语音是语言的物质外壳。语音的重要性决定了语音教学是第二语言教学的基础，是掌握听说读写技能和交际能力的前提。","语音教学原则主要有：(1)短期集中教学与长期严格要求相结合；(2)音素教学与语流教学相结合；(3)通过语音对比突出重点和难点；(4)声韵调结合教学，循序渐进；(5)听说结合，先听后说；(6)以模仿和练习为主、语音知识讲解为辅；(7)机械性练习与有意义练习相结合。"],"q":"【丸子汉硕解析】本题考查语音教学方法，见周小兵《对外汉语教学入门》第四章P152。","w":"high","e":["2020 真题"]},{"t":"象形","y":"名词解释","p":["用线条描画出事物的形象，其字形与字义的联系比较具体、紧密。","这类字大多表示自然界和日常生活中的实物。","许多事物用几根线条很难画出，所以用这种方法造出来的字并不多。","由于字形历史演变等原因，这类字的形体象形意味现在大为减弱，不少已经失去了跟字义的直接联系，有些还变成了记号。"],"q":"九中)隶书的出现，打破了古汉字象形的传统，奠定了现代汉字的基础，是文字史上的分水岭，在汉字发展史上具有划时代的意义。","w":"high","e":["2012 真题"]},{"t":"跨文化交际","y":"名词解释","p":["跨文化交际是指不同文化背景的人们之间的交际行为。这种交际主要是通过语言来进行的，称为跨文化语言交际。","影响跨文化语言交际的是不同文化之间的相同之处和不同之处，特别是文化差异。因此跨文化交际中要特别重视并研究文化差异。","跨文化交际的特点：(1)文化的差异与交际障碍；(2)交际原则与价值观念；(3)母语文化的思维定势和对异文化的成见；(4)交际过程中的相互接近和求同趋向；(5)交际的结果：文化的相互影响。","从上述五个特点可以看出，跨文化交际的根本特征是如何发现、认识和对待不同文化之间的差异。"],"q":"三、论述题 (20分)请简要论述跨文化交际中对待不同文化应秉持的态度。","w":"high","e":["2019 真题"]},{"t":"部位","y":"名词解释","p":["要确定部件的名称，还要给汉字字形结构的各个位置定名，这就叫部位。可以分为八类。","八类部位可以编成16字口诀：上“头”下“底”，左“旁”右“边”，内“心”外“框”，中“腰”四“角”。","使用统一规范的部件和部位名称，可以把一个结构复杂的汉字称说得既准确又清楚，这就叫“部件识字法”。"],"q":"具体来说，带音法包括以下几种操作方式：(1)以旧带新：利用学习者已经掌握的音素，通过微调发音部位和方法，引出新的音素；","w":"high","e":["教材高频"]},{"t":"隶变","y":"名词解释","p":["由甲骨文、金文发展到小篆，是一个简化的过程。小篆又简化为隶书，隶书又简化为草书和楷书，楷书又跟草书结合为行书。","隶变在字体演变史上的地位最为重要，它是古今汉字的分水岭。","汉字字体演变的总趋势是由繁难变为简易。"],"q":"2.说明“隶变”在汉字发展史上的价值。","w":"high","e":["2015 真题","2021 真题","2015 真题","2024 真题"]},{"t":"音符","y":"名词解释","p":["凡是跟整字在读音上有联系的部件，称为“音符”。","汉字的音符，也叫声旁，同表音文字的音符有很大的区别。","前者是非专职的，是借用本来既有音又有义的现成字符充当的，而后者则是专职的。","现代汉字中音符的数量很多，超过一千个。"],"q":"2.由表示字义类属的偏旁即意符，和表示字音的偏旁即音符，组成新字的造字法叫形声。","w":"high","e":["教材高频"]},{"t":"音素","y":"名词解释","p":["从音色（音值）角度划分","最小语音单位"],"q":"语音有大大小小不同的单位，音素是最小的语音单位，音节是听话时自然感到的最小的语音单位，音位是一个语音系统中能够区别意义的最小的语音单位。","w":"high","e":["2015 真题","2021 真题"]},{"t":"音节","y":"名词解释","p":["人们听感容易分辨出来的最小语音片断","发音肌肉经历一次从紧张到松弛的过程","听感上有一个明显的响度中心","普通话除儿化音外一个汉字读音就是一个音节"],"q":"语音有大大小小不同的单位，音素是最小的语音单位，音节是听话时自然感到的最小的语音单位，音位是一个语音系统中能够区别意义的最小的语音单位。","w":"high","e":["2013 真题","2019 真题"]},{"t":"韵母","y":"名词解释","p":["一个音节声母后面的部分","由元音或元音加鼻辅音构成","普通话共有39个韵母"],"q":"(2)韵母ü单独出现在声母n、1后面时不能省写是因为如果省了，这些音节就会发生混淆。","w":"high","e":["2011 真题","2017 真题"]},{"t":"小篆","y":"名词解释","p":["秦统一后推行的标准字体","李斯整理、由大篆简化","笔画圆转匀称、结构整齐","第一次汉字规范化"],"q":"隶书把小篆圆转弧形的笔画变成方折平直笔画的过程被称作隶变，它在字体演变史上的地位最为重要，它是古今汉字的分水岭。","w":"normal","e":[]}]}]}]},{"d":"zhenti_25","t":"25南师大354+445真题","c":[{"id":"zhenti_25-c01","t":"全文","w":"high","s":[{"id":"zhenti_25-c01-s01","t":"全文","w":"high","n":7,"k":[{"t":"《汉语教科书》","y":"名词解释","p":["1958年出版的我国第一套对外汉语教材《汉语教科书》"],"q":"4.《汉语教科书》五、简答题(每题 10分，共1题，共10分)任务式教学法的特点。","w":"high","e":["2025 真题","2019 真题","2025 445 二、教育学、心理"]},{"t":"反义词","y":"名词解释","p":["反义词就是属于同一范畴的意义相反或相对的一组词。","根据反义词在意义上是相反的矛盾关系还是相对的反对关系，可以分成两类：绝对反义词和相对反义词。","绝对反义词：肯定一方必否定另一方，否定一方必肯定另一方，二者属于矛盾关系；相对反义词：肯定一方必否定另一方，否定一方不一定肯定另一方，二者属于反对关系。"],"q":"5.反义词的鉴定标准三、基础能力题(30分)","w":"high","e":["教材高频"]},{"t":"形声","y":"名词解释","p":["由形旁与声旁组成，形旁表示大致的字义或字义的类属，声旁提示字的读音或近似的读音。","形声法是汉字最主要的造字方法。","形声法综合利用字形表义和字形表音这两种手段。"],"q":"4.形声字声旁表音的局限性","w":"high","e":["2011 真题","2016 真题","2020 真题","2016 真题"]},{"t":"教材","y":"名词解释","p":["教材是教师教学和学生学习所依据的材料，与教学计划和教学大纲构成学校教学内容的有机组成部分。","在教学活动的四大环节中，教材占有很重要的地位。它是总体设计的具体体现，反映了培养目标、教学要求、教学内容、教学原则；同时教材又是课堂教学和测试的依据。","狭义的教材指教科书，广义的教材除了教科书外还包括教学参考书、讲义、讲授提纲、图表、各种教学音像资料等。","教材体现了语言教学最根本的两个方面：教什么和如何教。教材水平的高低不仅能反映教学理论和教学法研究的深度，而且在很大程度上决定教与学的效果。"],"q":"六、案例分析(每题40分，共1题，共40分)亚琴是一名国际中文教师，去年通过了语合中心的考试，去到了一所海外的孔子学院教学，他发现当地配套的教材与学生不符合，于是他自己编教材，但是他发现自己编教材花费了很多时间，占用了他很多的工作时间致使他每天都加班，无法很好地融入当地的文化交流，无法交新朋友。","w":"high","e":["2021 真题"]},{"t":"文化休克","y":"名词解释","p":["这些表现叫“文化震荡症”，也叫“文化休克”（cultural shock）。","文化休克是指在非本民族文化环境中生活或学习的人，由于文化的冲突和不适应而产生的深度焦虑的精神症状。","在跨文化交际中，或是进入非本民族文化生活环境中，以及学习目的语文化的过程中，文化差异都会引起人们的心理反应，产生一定的文化冲突，经历从文化不适应到适应的过程。这一过程大体上分为四个阶段：蜜月阶段、挫折阶段、调整阶段、适应阶段。","处于异文化环境中的人一般都要经历这一挫折期和文化震荡症。只不过文化震荡症在不同人身上表现的形式和程度不完全相同。"],"q":"10.文化休克四个阶段是挫折、调整、适应、蜜月阶段。","w":"high","e":["2025 真题"]},{"t":"郡县制","y":"名词解释","p":["秦统一后全面推行","分天下为三十六郡","中央直接任免、加强中央集权"],"q":"1.唐宋至隋朝实行郡县制，元明清实行道路制。","w":"high","e":["2025 445 一、中外文化及跨"]},{"t":"部位","y":"名词解释","p":["要确定部件的名称，还要给汉字字形结构的各个位置定名，这就叫部位。可以分为八类。","八类部位可以编成16字口诀：上“头”下“底”，左“旁”右“边”，内“心”外“框”，中“腰”四“角”。","使用统一规范的部件和部位名称，可以把一个结构复杂的汉字称说得既准确又清楚，这就叫“部件识字法”。"],"q":"1.请写出以下国际音标、发音部位和发音方法(每题2分，共5题，共10分)","w":"high","e":["教材高频"]}]}]}]},{"d":"ziliao","t":"汉硕考研资料汇总","c":[{"id":"ziliao-c01","t":"全文","w":"high","s":[{"id":"ziliao-c01-s01","t":"全文","w":"high","n":183,"k":[{"t":"《七略》","y":"名词解释","p":["刘歆在刘向《别录》基础上编成","分辑略等七部分","我国第一部综合性图书分类目录"],"q":"8.西汉刘向 《七略》，是目录学的开始","w":"high","e":["2024 真题"]},{"t":"《九章算术》","y":"名词解释","p":["东汉成书分九章246题","方田粟米至勾股九类","确立算法为中心的数学体系","负数与方程解法世界领先"],"q":"8.刘徽提出的“极限思想”最早出现在《九章算术》中)(","w":"high","e":["2017 真题"]},{"t":"《永乐大典》","y":"名词解释","p":["明成祖永乐年间编纂","解缙姚广孝主持","22877卷约3.7亿字","我国古代规模最大的类书"],"q":"A.《北堂书钞》 B.《艺文类聚》C.《永乐大典》 D.《太平御览》","w":"high","e":["2016 真题"]},{"t":"《汉语拼音方案》","y":"名词解释","p":["用拉丁字母拼写现代汉语普通话语音的方案","基本功能是解决汉字、词语等语言单位的规范读音与拼写","专门为普通话读音设计，只适用于普通话"],"q":"2.隔音符号是《汉语拼音方案》的一个组成部分。","w":"high","e":["2011 真题","2017 真题"]},{"t":"《汉语教科书》","y":"名词解释","p":["1958年出版的我国第一套对外汉语教材《汉语教科书》"],"q":"4.《汉语教科书》(五) 简答题(10分)简述第二语言教学中，“任务教学法”的特点。","w":"high","e":["2025 真题","2019 真题","2025 445 二、教育学、心理"]},{"t":"《诗经》","y":"名词解释","p":["我国第一部诗歌总集，共305篇","内容分风、雅、颂三部分","手法为赋、比、兴","奠定现实主义诗歌传统"],"q":"12.《诗经》按照乐调分赋、比、兴玉部分。","w":"high","e":["2019 真题","2015 真题"]},{"t":"三大崇拜","y":"名词解释","p":["天地崇拜：自然崇拜的集中体现","祖先崇拜：宗法制度的信仰基础","君师崇拜：天地君亲师的伦理秩序"],"q":"7.从总体上看，中国人的三大崇拜指的是 (7) 崇拜、祖先崇拜和君师崇拜。","w":"high","e":["2016 真题"]},{"t":"丝绸之路","y":"名词解释","p":["张骞出使西域后开辟","东起长安，西至地中海东岸","输出丝绸瓷器造纸术","输入葡萄苜蓿与佛教艺术"],"q":"37.丝绸之路向西经河西走廊至数“公公分为南北两线。","w":"high","e":["2024 真题","2018 真题"]},{"t":"中介语","y":"名词解释","p":["美国语言学家塞林克于1969年提出中介语(interlanguage)的概念，1972年在其著名论文《中介语》中提出的中介语假说。","中介语是指在第二语言习得过程中，学习者通过一定的学习策略，在目的语输入的基础上所形成的一种既不同于其第一语言也不同于目的语、随着学习的进展向目的语逐渐过渡的动态的语言系统。","中介语既指学习者语言发展的任何一个阶段的“静态”语言系统，可以把它看做是某一阶段的“切片”；也是指学习者从零起点到靠近目的语的语言发展轨迹，可以把它看做是各阶段相接而形成的一种连续体。","中介语在其发展过程中的任何一个阶段都是学习者创造的一种介于第一语言和目的语之间的独特的语言系统；中介语不是固定不变的，而是一个不断变化的动态语言系统。"],"q":"15.中介语并非都是错误的，其正确的部分会随着学习的进展不断扩大。","w":"high","e":["2020 真题"]},{"t":"中轴线","y":"名词解释","p":["都城规划核心原则","南北纵贯对称布局","南起永定门北至钟鼓楼","体现皇权至上居中为尊"],"q":"10.宗教祭祀建筑，其中除清真寺仍保留较多外来影响外，其他多仿照中国宫殿和居住建筑风格，如中轴线突出，左右整齐对称。","w":"high","e":["2024 真题"]},{"t":"义素","y":"名词解释","p":["义素是词义系统中不能独立运用的最小的意义单位，是构成义位的区别性语义特征，是从词义分析中抽象出来的观念成分。","义位是可以独立使用的最小意义单位，是词义的最基本构成单位。而义素是不能独立使用的最小意义单位，是构成义位的区别性特征。","义位分解形成义素，不同的义素组合起来形成义位才能构成一个独立运用的意义，义位与义素的关系是整体与部分的关系。"],"q":"15.属于同一语义场的词，既具有相同的义素，又具有不同的义微。","w":"high","e":["教材高频"]},{"t":"义项","y":"名词解释","p":["义项是字典、词典中按照一个词意义数量分列的项目。","义项有两类：一是可以独立运用的词义，也就是义位；一类是不能独立运用，只是作为构成词或固定短语的语素义。","义位在词典里必定表现为义项，但是义项并不完全等于义位，关键是有的义项只是语素义，不是词义。"],"q":"17.在多义词的几个义项之间，往往存在着引申关系。","w":"high","e":["教材高频"]},{"t":"习得","y":"名词解释","p":["“习得”是在自然的语言环境中，通过旨在沟通意义的言语交际活动，不知不觉(潜意识)地获得一种语言，典型的例子是儿童习得第一语言(一般是母语)。","简言之，习得是潜意识的自然的获得。","习得，特别是儿童第一语言的习得，是从本能的要求(生存和交际的需要)开始、与其生理和心理的自然发育、成熟同步进行的过程，儿童是在不知不觉中习得第一语言的。","习得一般是在使用该目的语的社会环境中进行的；习得时注意力主要集中在语言的功能和意义方面。"],"q":"1.第一语言和第二语言是按照人们习得语言的人 来区分的概念。","w":"high","e":["2019 真题"]},{"t":"习得顺序假说","y":"名词解释","p":["70年代进行的较有影响的研究是杜雷(H. Dulay)和伯特(M. Burt)按照布朗(R. Brown)研究儿童习得母语英语语素顺序的实验方法，率先进行的儿童习得作为第二语言的英语的语素习得顺序(acquisition order)的实验。","这些实验的结果发现，不同母语背景、不同年龄的英语作为第二语言的学习者，有非常相似的英语语素习得顺序。","这一顺序反映在克拉申于1982年列出的九项英语语素习得“自然顺序”表中，他认为从第一组到第四组的习得顺序是固定不变的。","克拉申赞同科德的内在大纲假说，认为人们习得语言规则有一个可以预测的共同顺序：有的先习得，有的后习得。"],"q":"5.内在大纲和习得顺序假说是塞林格提出的。","w":"high","e":["2019 真题"]},{"t":"乡试","y":"名词解释","p":["省级考试三年一次","秋八月举行称秋闱","考中者称举人","第一名称解元"],"q":"3.科举考试中，“连中三元”指的是一个人在乡试、 和股试中都考取第一名。","w":"high","e":["2024 真题"]},{"t":"书院","y":"名词解释","p":["始于唐、盛于宋","名师主持、学术自由、教研结合","四大书院与朱熹学规"],"q":"19.教育书院的出现和兴起是在( )代初年。","w":"high","e":["2022 真题"]},{"t":"二十四节气","y":"名词解释","p":["按太阳黄道位置划分","完整见于《淮南子·天文训》","反映季节气候物候变化","2016年列入人类非遗"],"q":"8.古人创制的二十四节气反映了气温、物候、雨量的变化，十分有利于安排 (8) .","w":"high","e":["2020 真题"]},{"t":"五大名窑","y":"名词解释","p":["汝、官、哥、钧、定","汝窑天青釉为诸窑之冠","钧窑窑变万彩","定窑白瓷印花刻花"],"q":"23.宋代“定、汝、官、哥、钧”五大名窑都是依据窑址而命名的。","w":"high","e":["2023 真题","2018 真题"]},{"t":"交际文化","y":"名词解释","p":["80年代初，对外汉语教学界的学者张占一等人，从第二语言教学培养交际能力的实际出发，按文化在交际中的功能提出区分“知识文化”和“交际文化”的观点。","交际文化则是指跨文化交际中直接影响信息准确传递(即引起偏差或误解)的语言和非语言的文化因素。","所谓知识文化是指跨文化交际中不直接影响准确传递信息的语言和非语言的文化因素。","交际文化则是指两种语言间规约性的文化差异，是以制约信息模式的形式来参与交际的，可能在交际中引起误解或偏差。"],"q":"9.张占一等人提出了知识文化和交际文化。","w":"high","e":["2018 真题"]},{"t":"交际法","y":"名词解释","p":["交际法又称“交际语言教学”(Communicative Language Teaching)，较早称为“功能法”(Functional Approach)、“意念—功能法”(Notional-Functional Approach)，是以语言功能和意念项目为纲、培养在特定的社会语境中运用语言进行交际能力的一种教学法。","交际法产生于70年代初期西欧共同体国家，中心在英国，创始人为英国语言学家威尔金斯(D. A. Wilkins)。","交际法的语言学理论基础正是60年代兴起、70年代形成高潮的社会语言学，尤其是社会语言学家海姆斯的交际能力理论和功能主义语言学家韩礼德的功能语言理论和话语分析理论，以及威多森的语言交际观。","在心理学方面，交际法受到人本主义心理学和60年代后期兴起的心理语言学的影响，强调以学生为中心。"],"q":"4.什么是交际法的“合作原则”?二、教育学、心理学及语言学基础知识(共30分)(五)名词解释(每小题5分，共15分)","w":"high","e":["2020 真题"]},{"t":"交际策略","y":"名词解释","p":["交际策略是学习者为顺利进行语言交际活动(即理解对话者的意图和表达自己的意思)有意识采取的计划措施或方法技巧，是语言使用者交际能力的一部分。","西方学者认为一般是在交际中遇到困难，如语言知识不能应付交际需要或缺乏某一特定的语言表达手段，无法按原定计划实现交际目标时，才采用交际策略。","对第二语言学习者来说，其交际活动在一定意义上也是学习活动的一部分，可以获得把学到的语言知识付诸实践进行运用的机会，是实现培养语言交际能力这一目标所不可缺少的。","各种具体的交际策略，实际上也扩充了学习者的语言表现手段。"],"q":"7.对目的语的形式或功能加以减缩的交际策略称为回避。","w":"high","e":["2019 真题","2022 445 二、教育学、心理"]},{"t":"交际能力","y":"名词解释","p":["社会语言学家海姆斯在60年代提出了不同的看法，他认为一个人的语言能力不仅指能否说出合乎语法的句子，还包括能否在一定的语言环境中恰当地使用语言的能力。","海姆斯首次提出了“交际能力”（communicative competence）的概念，即运用语言（或非语言手段)进行社会交往的能力，包括传递信息、交流思想和表达感情。","海姆斯还进一步提出了交际能力的四个特征：语法性——指语法上是否正确；可接受性——在交际中能否被接受；得体性——在一定的语境中是否恰当，是否合乎社会文化习惯；现实性——是否是现实中常用的。","交际能力既包括语言能力，也包括语言运用的能力。"],"q":"10.交际能力是20世纪 70年代由卡西尔提出的( ).二、简答题(每题10分，共40分)","w":"high","e":["2019 真题"]},{"t":"介词","y":"名词解释","p":["多是从动词虚化而来，又叫“副动词”","引进跟谓词有关的对象","跟名词组合成介词短语","主要作状语，也可以作补语"],"q":"A.介词 介词 动词 以介词 副词 动词G.动词 副词 动词 Q.副词 介词 介词","w":"high","e":["教材高频"]},{"t":"代词","y":"名词解释","p":["具有替代和指示作用","包括人称代词、指示代词、疑问代词三类","不是按照语法功能划分出来的词类，只是在“指代”这一点上有共同点"],"q":"23.代词指代的对象都是名词性成分。","w":"high","e":["2020 真题"]},{"t":"会意","y":"名词解释","p":["用两个或几个物体的图形的组合产生字义。","会意字是在象形字基础上创造的，所表示的字义可从几个象形字组合的关系上显示出来，所以能把没法直接描画的一些动作、状态表示出来。","这种造字方法，现在仍在少量地应用。"],"q":"7.下列( )组没字都属于会意字。","w":"high","e":["2014 真题"]},{"t":"会试","y":"名词解释","p":["乡试次年春三月京城举行","称春闱或礼闱","考中者称贡士","第一名称会元"],"q":"10.明清会试是全国范围的考试，参加考试的人员必须是举人。","w":"high","e":["2024 真题"]},{"t":"会话分析","y":"名词解释","p":["由于会话是口头表达的一种常见形式，对日常会话的结构与规律进行分析的“会话分析”已成为话语分析的重要组成部分。","70年代美国社会学家萨克斯等分析自然话语，指出会话的特点是“话轮替换”（turn-taking），发话人从头至尾连续的一段话称为一个“话轮”(turn)，会话中每次须保持一人说话。","会话结构的基本单位是“毗邻应对”(adjacency pair)，即会话双方的发话与应对一前一后紧密相连；有时也会出现“插入序列”甚至出现打断发话者的“分岔序列”。"],"q":"3.会话分析(六)简答题(每小题5分，共15分)","w":"high","e":["2016 真题"]},{"t":"会话含义","y":"名词解释","p":["对“会话含义”（conversational implicature）的研究实际上就是对会话中说话者的言外之意的研究。","所以会话含义是指会话中说话者因违反“合作原则”而产生的言外之意。","但在实际语言交际中，人们常常出于某种礼貌或其他目的，故意违反这些合作原则，从而产生言外之意让听话者去领会。","格赖斯会话含义理论后来不断得到补充和完善。"],"q":"3.会话含义理论61一家专注汉硕考研的店铺————汉硕考研网","w":"high","e":["2018 真题","2023 354 一、名词解释（每"]},{"t":"传承词","y":"名词解释","p":["传承词是指从古代、近代汉民族语言词汇中流传下来而为现代汉语词汇所承接的词。","传承词是现代汉语词汇的核心部分，属于基本词汇。传承词所指称的事物和现象从古代到现代都与人们的日常生活息息相关，因此具有较强的生命力。","传承词主要包括表示自然现象和事物、生产和生活资料、时量和空间概念、事物性质状态、人体部位和器官、动作行为和变化、亲属人称指代、事物或行为关系等八类。传承词具有共时的普遍性、历时的稳定性、构词的能产性三个特点。"],"q":"2.传承词公众号：汉颂考研网 27一家专注汉硕考研的店绍————汉硕考研网","w":"high","e":["教材高频"]},{"t":"偏旁","y":"名词解释","p":["偏旁就是用二分法对合体字进行一次性切分而获得的结构单位，可分为“形旁”和“声旁”两类。","形旁通常表示该字的意义类别，声旁通常表示该字的大致读音。","多数形声字由一个形旁和一个声旁组成；会意字的两个偏旁都属于形旁。","通用汉字的偏旁约有1500个。"],"q":"7.“盆”是合体字，包含两个偏旁，三个部件。","w":"high","e":["2012 真题","2018 真题"]},{"t":"偏误分析","y":"名词解释","p":["偏误分析(Error Analysis)是对学习者在第二语言习得过程中所产生的偏误进行系统的分析，研究其来源，揭示学习者的中介语体系，从而了解第二语言习得的过程与规律。","科德是偏误分析最早的倡导者。","偏误分析的心理学基础是认知理论，语言学基础则是乔姆斯基的普遍语法理论。","第二语言习得过程被看成是规则形成的过程，即学习者不断从目的语的输入中尝试对目的语规则做出假设，并进行检验与修正，逐渐向目的语靠近并建构目的语的规则体系。"],"q":"4.听说法五、论述题 (10分)论述偏误分析的意义和局限六、案例分析(40分)张老师在一所孔子学院任教，孔子学院为喜爱汉语的人设立了晚间汉语课，学生大多是已经工作的成年人，他们白天上班，只能晚上来学习，教了一段时间后，张老师发现教学状况很不好。","w":"high","e":["2020 真题"]},{"t":"元音","y":"名词解释","p":["气流振动声带","发音部位不受阻碍","又叫母音","主要功能是构成音节的韵母"],"q":"3.根据舌位的前后不同，舌面元音可以分为前元音、后元音和( )","w":"high","e":["2012 真题","2018 真题"]},{"t":"先天论","y":"名词解释","p":["先天论又称“内在论”，代表人物是乔姆斯基，是在乔姆斯基语言学理论、特别是80年代初提出的“普遍语法”理论基础上的儿童第一语言习得理论。","乔氏认为语言不像行为主义者所说的是“习惯的总和”，而是由抽象规则构成的复杂的体系。","人们习得语言绝不是单纯的模仿记忆，而是要把这些复杂的规则“内化”(internalization)，达到自动运用的程度，成为理解和产生言语的基础。","乔氏认为人类先天具有一种习得语言的特殊能力，表现为儿童头脑中有一种受遗传因素决定的“语言习得机制”(language acquisition device，简称LAD)。"],"q":"9.第一语言习得的“先天论”又称“内在论”，代表人物是奥古斯都。","w":"high","e":["2019 真题"]},{"t":"六书","y":"名词解释","p":["“六书”是指象形、指事、会意、形声、假借、转注。","目前主流看法认为假借、转注是用字手段，象形、指事、会意、形声才是造字方法。","造字法，通常采用传统的“六书”来分析。"],"q":"1. “六书”是指《诗经》、《尚书》、《礼记》、《周易》。","w":"high","e":["2011 真题","2017 真题","2017 真题","2023 真题"]},{"t":"六礼","y":"名词解释","p":["《仪礼·士昏礼》所载六道程序","纳采、问名、纳吉、纳征、请期、亲迎","纳征送聘礼，亲迎为最后环节","确立传统婚姻礼仪规范"],"q":"1.从周代起，嫁娶时需行“六礼”：采纳、问名、 、纳征、请期、亲迎。","w":"high","e":["2017 真题"]},{"t":"关键期","y":"名词解释","p":["据此，伦尼伯格于60年代提出语言习得“关键期”（critical period)或称“临界期”假说。","所谓语言习得关键期，就是指在青春期(12岁左右)以前，由于大脑语言功能侧化尚未完成，左脑和右脑都能参与语言习得的这段时期。","此时大脑灵活，可塑性大，因而比较容易习得语言。这是习得母语的最佳时期。","对语言习得关键期的假说，也存在不同看法。有的研究显示，婴儿一出生，大脑左半球就有对语音敏感的倾向，到四五岁大脑功能侧化就已基本完成。"],"q":"3.语言习得关键期假说(六)简答题(每题5分，共15分)","w":"high","e":["2018 真题"]},{"t":"内在大纲","y":"名词解释","p":["科德于1967年在其《学习者言语错误的重要意义》一文中提出，第二语言学习者在语言习得的过程中有其自己的内在大纲(built-in syllabus)。","而学习者的种种偏误正是这种内在大纲的反映。","学习者不是被动地服从教师的教学安排、接受所教的语言知识，而是跟儿童习得母语一样，有其自身的规律和顺序。这一顺序并非完全按照语言形式的难易，有迹象显示它与课堂上所教的语法规则的顺序并不一样。","内在大纲实际上是人类掌握语言的客观的、普遍的规律，教师只能在有限的范围内控制教学过程，无法完全控制学习者对输入的语言的内化过程。"],"q":"5.内在大纲和习得顺序假说是塞林格提出的。","w":"high","e":["2019 真题"]},{"t":"分封制","y":"名词解释","p":["周天子分封土地人民","对象为王族功臣先代贵族","诸侯承担纳贡朝觐义务"],"q":"3.分封制和宗法制是商末周初形成的。","w":"high","e":["2022 445 一、中外文化及跨"]},{"t":"制度文化层","y":"名词解释","p":["规范自身行为的准则","调节相互关系的制度规范","介于物态与心态之间"],"q":"4.一般把文化分为物质文化层、制度文化层、行为文化层和精神文化层四个层次。","w":"high","e":["2025 445 一、中外文化及跨"]},{"t":"功能","y":"名词解释","p":["交际法一反其他教学法以语法或句型结构为纲的传统做法，明确提出以功能意念为纲。","功能是用语言做事，完成一定的交际行为。","交际大纲把语言功能分为六类：传达与了解实际情况；表达或了解理智性的态度；表达或了解道义上的态度；表达或了解情感性的态度；请人做事；社交。","以“邮局在哪儿?”这个句子为例，其功能是询问。"],"q":"7.对目的语的形式或功能加以减缩的交际策略称为回避。","w":"high","e":["2019 真题","2020 真题","2021 真题"]},{"t":"动机","y":"名词解释","p":["动机(motivation)在情感因素中又占极其重要的地位。动机是激励个体从事某种行为的内在动力，常表现为为达到某种目的而付出努力的愿望。","调查结果发现，在影响第二语言学习的诸因素中，动机占33%，学能占33%，智力占20%，其他占14%。","第二语言习得的动机是推动学习者学习并达到掌握第二语言目的的一种强烈愿望，包括目的、要达到目的的愿望、对学习的态度和努力行动四个方面。","动机有内部动机和外部动机之分，内部动机是个体自身所产生的动力，外部动机是外部因素作用的结果；动机还有近景动机和远景动机之分。"],"q":"1.与学习活动直接联系、具体、局部的动机是( )。","w":"high","e":["2021 真题"]},{"t":"助词","y":"名词解释","p":["黏着在词或短语上面，表示附加意义","附着在后面的一律读轻声","结构助词：的、地、得","时态助词：了、着、过","其他助词：似的、所、给、看、来、把、们、第、初、等"],"q":"15.就词性来看，“的、地、得”是助词中的 ( )助词。","w":"high","e":["2017 真题"]},{"t":"区别词","y":"名词解释","p":["又叫“非谓形容词”","不能作谓语、主语、宾语，也不能受数量短语修饰","单独只能作定语","跟“的”构成“的”字结构"],"q":"A.形容词 B.副词 C.区别词 D.名词","w":"high","e":["2018 真题"]},{"t":"单纯词","y":"名词解释","p":["由一个语素构成的词是单纯词，不存在内部构造问题，但可以根据构词语素的音节特征来划分类型。","根据音节的数量，单纯词可以分为单音节、双音节和多音节三类。","双音节单纯词包括联绵词、叠音词、音译词和拟声词四类。"],"q":"A 离合词 B 单纯词C 缩略词 D 外来词","w":"high","e":["教材高频"]},{"t":"反义词","y":"名词解释","p":["反义词就是属于同一范畴的意义相反或相对的一组词。","根据反义词在意义上是相反的矛盾关系还是相对的反对关系，可以分成两类：绝对反义词和相对反义词。","绝对反义词：肯定一方必否定另一方，否定一方必肯定另一方，二者属于矛盾关系；相对反义词：肯定一方必否定另一方，否定一方不一定肯定另一方，二者属于反对关系。"],"q":"15.“黑”和“白”是一对绝对反义词。","w":"high","e":["教材高频"]},{"t":"合体字","y":"名词解释","p":["合体字是由两个或两个以上部件组合而成的汉字。","象形字、指事字一般属于独体字，会意字、形声字通常属于合体字。","独体和合体在汉字形体演变过程中会互变。"],"q":"7.“盆”是合体字，包含两个偏旁，三个部件。","w":"high","e":["2015 真题"]},{"t":"合作原则","y":"名词解释","p":["60年代中期美国语言哲学家格赖斯提出了会话含义理论，他认为会话能顺利进行需要双方互相配合，共同遵守一些基本原则。他提出“合作原则”，包括四项准则。","四项准则：(1)质的准则——所说的话要真实，不要说自知是虚假的话，或缺乏足够证据的话。(2)量的准则——所说的话应包含交谈目的所需要的信息，而不要包含超出需要的信息。(3)关系准则——所说的话必须是有关的，要切题。(4)方式准则——所说的话要清楚，有条理，简练，避免晦涩、歧义。"],"q":"24.会话合作原则包括数量准则、质量准则、( )及方式准则等四条准则。","w":"high","e":["2018 真题"]},{"t":"同义词","y":"名词解释","p":["同义词就是意义相同或相近的词。","根据意义相同的程度，同义词可以分成两类：等义词和近义词。","等义词是指意义完全相同的词；近义词是指意义基本相同，但在意义、功能或色彩上存在细微差别的词。"],"q":"6.“努力”和“竭力”这一组同义词的主要区别是()。","w":"high","e":["教材高频"]},{"t":"听说法","y":"名词解释","p":["听说法是本世纪40年代产生于美国的第二语言教学法，强调通过反复的句型结构操练培养口语听说能力，又称“句型法”或“结构法”。","二次大战后期，美国向海外派遣大批军队，为短期内培养受过基本外语口语训练的人员而制订了军队特别培训课程，所以也称为“军队法”。","听说法的语言学理论基础是主张对活的语言(口语)进行仔细的描写分析、不同语言间进行结构对比的美国结构主义语言学。","其心理学理论基础是把人和动物的行为都纳入到刺激—反应轨道之中的行为主义心理学，特别是斯金纳的操作行为主义。"],"q":"10.听说法的结构和形式的重视超过意义，功能法则是意义和功能压倒一切。","w":"high","e":["2018 真题","2019 真题","2021 真题"]},{"t":"四呼","y":"名词解释","p":["开口呼、齐齿呼、合口呼、撮口呼","韵母的分类","有利于揭示声韵配合规律"],"q":"声母韵母四呼类别声调韵头韵腹韵尾装鱼5秀柗昆二、辨析下列词语(每题5分，共10分)","w":"high","e":["2012 真题","2016 真题","2022 真题"]},{"t":"四大名著","y":"名词解释","p":["《三国演义》《水浒传》《西游记》《红楼梦》","《三国演义》为第一部长篇章回体小说","《红楼梦》前八十回曹雪芹，后四十回高鹗续"],"q":"6.请列举中国四大名著，作者及朝代。","w":"high","e":["2022 真题","2016 真题"]},{"t":"国子监","y":"名词解释","p":["隋炀帝始设","兼具最高教育行政机关与最高学府","明代监生制度"],"q":"3.国子监在明清时期既是国家最高学府、-义是教育行政管理机构。","w":"high","e":["2024 真题"]},{"t":"声母","y":"名词解释","p":["音节开头的辅音","普通话22个辅音有21个可作声母"],"q":"2.韵母表中1行零声母音节，如果1是韵头，要把i改写成(1.","w":"high","e":["2014 真题","2020 真题"]},{"t":"声调","y":"名词解释","p":["音节读音的高低升降","区别意义的重要手段","汉语区别于其他语言的重要特征之一"],"q":"声母韵母四呼类别声调韵头韵腹韵尾装鱼5秀柗昆二、辨析下列词语(每题5分，共10分)","w":"high","e":["2013 真题","2019 真题"]},{"t":"复合词","y":"名词解释","p":["复合式合成词指由至少两个不同词根组合而成的合成词，这是现代汉语最重要的构词法。","根据词根与词根的意义与结构关系，复合词主要有五种类型：联合型、偏正型、述宾型、补充型、主谓型。","联合型由两个意义相同、相近、相关或相反的词根并列组合而成；偏正型前一个词根修饰限制后一个词根；述宾型前后词根构成支配与被支配的关系；补充型后一个词根补充说明前一个词根；主谓型前一个词根是被陈述对象，后一个表示陈述。"],"q":"13.下列复合词中结构方式相同的是 ( )。","w":"high","e":["教材高频"]},{"t":"外来词","y":"名词解释","p":["外来词是指从外国语或外族语中连音带义吸收来的词语。","在汉语发展史上，外来词的大规模借入主要有四个时期：一是借入西域诸国事物类词语的两汉时期；二是借入佛教词语的魏晋南北朝至唐宋时期；三是借入西方哲学、政治和科技词语的近代时期；四是全面借入外来词的改革开放时期。","现代汉语外来词主要来源于英语、日语、法语、俄语、德语以及境内少数民族语言。"],"q":"A.行业词 B.外来词 C.新造词 Q.社区词","w":"high","e":["教材高频"]},{"t":"多义词","y":"名词解释","p":["多义词是指一个语音形式有两个或两个以上既有联系又不相同的意义的词。","多义词的一个意义也被称为一个义项，多义词的各个义项具有以下特点：一是固定性，不是因语境而产生的临时意义；二是关联性，不同的义项之间存在着一定的联系；三是区别性，各个义项保持着自己的特点。","根据多义词所包含的义位和语素义情况，可以分成三种类型：所有义项都是词义的多义词；有些义项是词义而有些义项是语素义的多义词；所有义项都是语素义的多义不成词语素。"],"q":"17.在多义词的几个义项之间，往往存在着引申关系。","w":"high","e":["教材高频"]},{"t":"太学","y":"名词解释","p":["汉武帝设、董仲舒建议","以五经为教学内容","标志封建官学制度确立"],"q":"18.汉代官学有中央办的“太学”和“鸿部门学”，地方政府办的“郡国学”和校、摩、( )等。","w":"high","e":["2017 真题"]},{"t":"字体","y":"名词解释","p":["字体指的是同一种文字的各种不同体式。","例如汉字的楷书、行书、草书，印刷的宋体、仿宋体、楷体、黑体等。","至于书法艺术上的种种字体，例如欧体、颜体、柳体，指的是书法的派别，又称“书体”，不属于严格文字学的范围。"],"q":"刚开始教汉语的时候，我也曾设计过一些写汉字的课堂活动，可是资深教师却一再跟我强调，书写课上必须确保学生“身坐直，脚放平”，不但写字时的姿势要正确，字体也必须工整、规范、他们管这一套叫做“写字基本功”。","w":"high","e":["2013 真题","2019 真题"]},{"t":"字序","y":"名词解释","p":["字序就是汉字排列的先后顺序。","汉字字序的复杂性表现为汉字的排序具有多样性和互补性的特点。","汉字序列法主要有两种：音序法、形序法，形序法又分部首法、笔画法和笔形法。"],"q":"11.目前通行的现代汉字序列法主要是音序法和形摩法。","w":"high","e":["2012 真题","2019 真题"]},{"t":"学习策略","y":"名词解释","p":["学习策略(learning strategies)是语言学习者为有效地掌握语言规则系统，发展言语技能和语言交际能力，解决学习过程中所遇到的问题而采取的各种计划、途径、步骤、方法、技巧和调节措施。","研究发现，不同学习者所采用的学习策略有很大的一致性和规律性。","综合看来，学习策略大体上可分为认知学习策略和元认知策略(metacognitive strategies)两大类。","根据最早研究学习策略的茹宾(J. Rubin)所提出的六种认知学习策略，可以概括为求解、推理、实践、记忆、监控几个方面。"],"q":"11、监控作为学习策略是指学习者发现自己的语言方面或交际方面的错误并加以纠正。","w":"high","e":["2020 真题"]},{"t":"宗法制","y":"名词解释","p":["血缘关系为纽带","嫡长子继承制为核心","周代确立、大宗小宗"],"q":"3.分封制和宗法制是商末周初形成的。","w":"high","e":["2022 445 一、中外文化及跨"]},{"t":"定位语素","y":"名词解释","p":["一个语素同别的语素组合成词时，位置固定的语素叫定位语素。","根据位置的前后，又分为前置定位语素和后置定位语素。","前缀如：非(非常、非凡、非法、非分等)；后缀如：者(读者、记者、作者、学者等)、化(绿化、美化、净化、激化等)。","一个语素同别的语素组合成词时，位置不固定的语素叫不定位语素，如“电”可以前置（电器、电子、电影），也可以后置（闪电、雷电、水电）。"],"q":"13.语素“电”构词时位置不固定，所以它是一个不定位语素。","w":"high","e":["教材高频","2024 354 一、名词解释（每"]},{"t":"对外汉语教学","y":"名词解释","p":["《中国大百科全书·语言文字》中写道：“对外汉语教学是指对外国人的汉语教学。”","实际上也包括对第一语言不是汉语的海外华人进行的汉语教学。","这一名称基本上体现了这个学科的特点和内涵，在国外也产生了广泛的影响，而且简洁上口、符合汉语习惯，因此从1982年提出一直使用至今。","但是十多年的使用也发现这一名称有一定的局限性：它只突出了主要教学对象，未能全面、准确地反映学科性质——第二语言教学。"],"q":"4.语言是民族文化的载体，对外汉语教学不能脱离汉语所体现的中国( )。","w":"high","e":["2015 真题","2021 真题"]},{"t":"层次分析法","y":"名词解释","p":["分析句法结构层次的方法","是句法分析最基本、最有效的方法之一","正式学名叫“直接成分分析法”（IC）","由布龙菲尔德系统运用到句法结构分析上","分析时尽可能采取二分，俗称“二分法”"],"q":"5.慢慢-渐渐四、层次分析法(每小题3分，共15分)","w":"high","e":["2012 真题","2016 真题","2020 真题"]},{"t":"常用字","y":"名词解释","p":["常用字就是书写现代汉语时经常要用到的字。","汉字总字数很多，通用字的数量也不少，可是人们经常使用的字量并不多，往往只集中在有限的两三千个字种上。","现代汉语常用字的特点：常用性、能产性、稳定性、简易性。"],"q":"6.常用字最根本的特点是 ()。","w":"high","e":["2015 真题","2022 真题"]},{"t":"异形词","y":"名词解释","p":["异形词是指语义相同或相近，而词的书写形式和语音形式不同的词。","书写形式不同的词主要分为三类：同素颠倒词、异形等义词、异形外来词。","同素颠倒词指语素相同而词序相反的异形词，可以分成取A弃B类、AB并存类、AB分工类；异形等义词指一个语素位置和字形相同，另一个语素位置相同而字形不同的异形词；异形外来词指因引进方法不同或引进地区不同而造成外来词在书写形式和发音形式上都不同。"],"q":"12.“百叶窗”和“百页窗”，是异形词，应当规范。","w":"high","e":["教材高频"]},{"t":"异读字","y":"名词解释","p":["异读字：即一形对数音一义。不同读音之间一般没有语义差别，仅仅是不同的人、不同的习惯读法。","异读字原则上应该统读。少数文白异读，目前还保留着。","异读字即多音同形同义字。"],"q":"8.同一个字形记录数音一义，这样的字叫异读字、异读字原则上应该统读。","w":"high","e":["教材高频"]},{"t":"形声","y":"名词解释","p":["由形旁与声旁组成，形旁表示大致的字义或字义的类属，声旁提示字的读音或近似的读音。","形声法是汉字最主要的造字方法。","形声法综合利用字形表义和字形表音这两种手段。"],"q":"8.下列( )组汉字都属于形声字A.取然 吞 兽 问从攻末人C.精 功 案 10 n.苍沐火火火","w":"high","e":["2011 真题","2016 真题","2020 真题","2016 真题"]},{"t":"形序法","y":"名词解释","p":["形序法是按照字形的各个方面特点来排列字序的方法。","形序法包括部首法、笔画法、四角号码法等，其中部首法历史最悠久，使用也最普遍。","目前大都采用混合法：A.“笔画——笔形法”，B.“笔形——笔画法”。"],"q":"7.汉字序列法中的 ()又分部首法、笔画法和笔形法、A 音序法 D 形序法C 义序法 D 音义法","w":"high","e":["教材高频"]},{"t":"态度","y":"名词解释","p":["态度是构成动机的主要因素之一。它是个体对某种客观事物的评价性反应，是在对事物了解的基础上产生情感上的褒贬好恶，并反映出对之采取行动的倾向性。","西方学者的调查表明，学习第二语言的态度与所取得的学习成绩之间的关系高于学习其他科目的态度与成绩之间的关系。","影响学习态度的几个方面是：对目的语社团和文化的态度、对目的语的态度、对课程和教师、教材的态度。","对大多数学习者来说直接影响其目的语学习态度的还是他们在语言课堂上的感受。"],"q":"( )12 学习态度一般分为积极态度和消极态度两种。","w":"high","e":["2019 真题"]},{"t":"情景法","y":"名词解释","p":["情景法是本世纪二三十年代产生于英国的一种以口语能力的培养为基础、强调通过有意义的情景进行目的语基本结构操练的教学法。","情景法早期称为口语法(Oral Approach)，代表人物为英国著名语言教育家帕默(H. E. Palmer)和霍恩比(A. S. Hornby)。","情景法的语言学理论基础是英国的结构主义，口语被认为是语言的基础，准确的结构是说话能力的核心。","情景法的心理学基础是行为主义的习惯形成理论，强调学生通过模仿形成正确的语言习惯。","帕默认为学习语言有两种能力：一种是有意识的学习能力，另一种则是天赋的自然学习能力，这应看做是最早提出的区分语言学习与习得的理论。"],"q":"1.情景法的心理学基础是行为主义的A、联想主义理论 B：结构主义理论C.习惯形成理论 D.历史比较理论","w":"high","e":["2019 真题"]},{"t":"惯用语","y":"名词解释","p":["惯用语是群众口头创造并通过修辞手段准确、生动、形象、概括地揭示某些社会现象和某种行为的熟语。","从结构上看，典型的惯用语以三音节的动宾结构为主，也有部分偏正短语，少数主谓短语。","惯用语的整体意义不是其构成成分简单相加的意义，而是通过比喻、借代、夸张、比拟等手法所表达的修辞意义。"],"q":"16.和成语相比，惯用语口语色彩浓厚，形式上较为灵活，结构上不太定型。","w":"high","e":["教材高频"]},{"t":"意符","y":"名词解释","p":["凡是跟整字在意义上有联系的部件，称为“意符”。","对现代汉字构形成分进行分析，得到的是构字部件；构字部件的属性，指的是部件跟整字在音义上的关系，这可以分为三类：意符、音符和记号。","汉字的意符，也叫形旁，在传递语义信息上的功能，是单纯的表音文字所不具备的。"],"q":"8.根据现代汉字核字部件与整字的音义关系，可以把现代汉字的部件分为意符、音符和( )三类。","w":"high","e":["教材高频"]},{"t":"成词语素","y":"名词解释","p":["能够独立成词的语素是成词语素。","不能独立成词的语素是不成词语素，它只是词语的构成单位。","成词语素如：他、书、看、来、好、就、很、也、了、被、呢、吗、葡萄、牡丹、啰唆、朦胧等；不成词语素如：童(心)、日(子)、衣(服)、朗(读)、历(史)、肃(清)、(人)民、(丢)失等。"],"q":"13.成词语素和不成词语素最根本的区别在于能否独立成词。","w":"high","e":["教材高频"]},{"t":"成语","y":"名词解释","p":["成语是人们从历史上传承下来并长期使用的结构凝固、语义精辟且具有民族特点的熟语。","成语是熟语中最重要的一种，主要有四个特点：历史的传承性、结构的凝固性、意义的整体性、习用的民族性。","成语主要来源包括神话寓言、历史故事、诗文语句、口头俗语。"],"q":"12.“难兄难弟”中的“难”有ifán和 nàn两种读音，形成了两条不同的成语。","w":"high","e":["教材高频"]},{"t":"抑制","y":"名词解释","p":["与自尊心有着密切关系的是抑制。抑制是个体的一种防御外部伤害、保护自我的心理屏障。","婴儿一生下来没有自我意识，甚至不能区分自我和周围世界；随着年龄的增长，自我意识逐渐形成。","从青少年时期开始，自我意识进一步发展，害怕自我暴露太多而使自尊心受到伤害，于是采用抑制的方法保护自我。","到了青春期随着在生理、认知和情感上受到的挫折增多，个体意识到不仅要认识自己还要认识周围的环境与社会，因而用于自我保护的抑制心理更为增强，而且一直发展到成年期。"],"q":"A.交际 B.移情 C.认同 D.抑制七、案例分析与写作(共40分)请根据以下材料，按照“发现问题————分析问题————解决问题”的思路，写一篇1500字以上的案例分析，要求：结构完整，格式正确，条理清楚，语言规范，观点明确，材料充实，卷面整洁。","w":"high","e":["2020 真题"]},{"t":"描写语法","y":"名词解释","p":["又叫“结构主义语法”","创始人为瑞士语言学家索绪尔","经典著作是《普通语言学教程》","提出“组合”和“聚合”两大结构关系","运用“直接成分分析法”对句法结构进行层次分析"],"q":"A 描写语法 B 功能语法 C 生成语法 D 传统语法","w":"high","e":["2014 真题"]},{"t":"教学内容","y":"名词解释","p":["第二语言教学是为了培养语言交际能力，这一教学目的决定了教学内容。","从语言能力和语言交际能力的构成因素出发，吕必松曾提出语言教学的教学内容应包括“语言要素、语用规则、言语技能、言语交际技能和相关文化知识”。","这样，对外汉语教学内容可以概括为四个方面：(1)语言要素(汉语语音、词汇、语法、汉字)；(2)言语技能(汉语听、说、读、写)；(3)言语交际技能(汉语语用规则、话语规则、交际策略)；(4)相关文化知识(汉语的文化因素、中国基本国情和文化背景知识)。","语言要素、言语技能、言语交际技能和相关文化知识就构成了语言交际能力的基础。"],"q":"3.教学内容的核心问题是","w":"high","e":["2020 真题"]},{"t":"教学原则","y":"名词解释","p":["教学原则是从一定的教育和教学目的出发，在教学实践的基础上，根据对教学过程客观规律的认识而制订的指导教学工作的基本要求。","教学原则对一切教学活动，包括教学计划的制定、教学内容的选择、教学过程的组织、教学方法手段的运用都有指导作用。","教学原则有继承性，像早在17世纪由夸美纽斯第一次系统提出的直观性、自觉性、系统性、巩固性、量力性五大教学原则，在一定程度上反映了教学规律，至今仍有指导意义。","教学原则不能是一般哲学原则或社会政治原则的套用，必须结合教育实际、体现教育的特点。"],"q":"2.在教学原则中的 原则反映了教学中获取新知识与保持旧知识之间的关系。","w":"high","e":["2020 真题","2020 真题"]},{"t":"教学过程","y":"名词解释","p":["教师和学生共同参与的教学活动过程叫教学过程。对教学过程规律的研究也称为过程论，是广义的教学论中的一部分。","教学过程的性质，按照马克思主义的观点是学生的认识过程，而且是一种特殊的认识过程。","其特殊性表现为：(1)学生不是真刀真枪直接同客观事物打交道，而是通过书本和课堂接受前人总结的实践经验；(2)学生的认识活动是在教师的引导下进行的；(3)学生的认识过程不只是知识技能掌握的过程，而且是德智体美全面发展的过程；(4)作为教学过程中学生的认识活动，不是学生自发的、主动的要求，而是在教师和课本影响下进行的。"],"q":"2.简要说明布鲁纳(J. S. Bruner)发现式教学过程的主要观点。","w":"high","e":["2018 真题"]},{"t":"教材","y":"名词解释","p":["教材是教师教学和学生学习所依据的材料，与教学计划和教学大纲构成学校教学内容的有机组成部分。","在教学活动的四大环节中，教材占有很重要的地位。它是总体设计的具体体现，反映了培养目标、教学要求、教学内容、教学原则；同时教材又是课堂教学和测试的依据。","狭义的教材指教科书，广义的教材除了教科书外还包括教学参考书、讲义、讲授提纲、图表、各种教学音像资料等。","教材体现了语言教学最根本的两个方面：教什么和如何教。教材水平的高低不仅能反映教学理论和教学法研究的深度，而且在很大程度上决定教与学的效果。"],"q":"8.视听法也叫“圣克卢法”，典型教材如《新概念英语》。","w":"high","e":["2021 真题"]},{"t":"文化休克","y":"名词解释","p":["这些表现叫“文化震荡症”，也叫“文化休克”（cultural shock）。","文化休克是指在非本民族文化环境中生活或学习的人，由于文化的冲突和不适应而产生的深度焦虑的精神症状。","在跨文化交际中，或是进入非本民族文化生活环境中，以及学习目的语文化的过程中，文化差异都会引起人们的心理反应，产生一定的文化冲突，经历从文化不适应到适应的过程。这一过程大体上分为四个阶段：蜜月阶段、挫折阶段、调整阶段、适应阶段。","处于异文化环境中的人一般都要经历这一挫折期和文化震荡症。只不过文化震荡症在不同人身上表现的形式和程度不完全相同。"],"q":"5.“文化休克”的定义是由文化人类学家 提出的。","w":"high","e":["2025 真题"]},{"t":"文化适应假说","y":"名词解释","p":["文化适应假说由舒曼(J. Schumann)提出，从文化与语言的关系出发，把第二语言习得的过程看做是逐步适应目的语文化的过程。","把整个第二语言习得看做是文化适应的一部分，认为第二语言学习者对目的语文化的适应程度决定该目的语掌握的程度。","所谓文化适应是指学习者与目的语社团的社会和心理的结合，因此，学习者与目的语文化的社会距离与心理距离，就成了影响第二语言习得的主要因素。","心理距离主要指学习者在情感方面影响到第二语言习得的因素，包括语言障碍带来的焦虑，文化震荡带来的恐惧紧张以及动机、自尊心等。"],"q":"”这个观点被称为 .A 第三空间 R 编码规则 C 语言决定论 D文化适应假说","w":"high","e":["2025 真题"]},{"t":"新造词","y":"名词解释","p":["新造词是指为指称新事物、新概念或新现象而创造的词语。","新造词的产生与社会生活的变化有着密切的关系，社会变化越剧烈，新造词的产生就越频繁，有些新造词会随着使用频率的增加和范围的扩大而进入现代汉语词汇中，成为基本词汇成员，有些则随着使用频率的减少而逐渐消亡。","新词与旧词具有一定的相对性。以20世纪70年代末的改革开放为起点，在现代汉语中出现了大量新造词。"],"q":"A.行业词 B.外来词 C.新造词 Q.社区词","w":"high","e":["教材高频"]},{"t":"春节","y":"名词解释","p":["农历正月初一，又称过年","源于上古岁首祭祀","贴春联、守岁、拜年、压岁钱","象征辞旧迎新、阖家团圆"],"q":"12.春节又称“年节”，古称“元日”“元旦”“三元”等，是我国最大，最隆重的传统节日，所有的民族都过这个节日。","w":"high","e":["2016 真题"]},{"t":"母语","y":"名词解释","p":["母语是指本国、本民族的语言","这是按国家的界限来区分的。","外语是指外国的语言。一般情况下母语是人们的第一语言；但对一些移居国外的人来说，其子女出生后首先接触并获得的语言有可能是居住国的语言而不是母语。"],"q":"2.母语、(和第一语言通常是立个人的“主要语言”。","w":"high","e":["2019 真题"]},{"t":"汉字","y":"名词解释","p":["汉字是汉民族在长期的劳动生产和社会实践中为适应交际需要而独立创造出来的书面交际工具。","汉字是一种重要而独特的文字系统，在记录语言的方法、造字的方式、字形的结构、字体的呈现等诸方面都有鲜明的特点。","汉字是世界上历史最悠久的一种独立发展的文字，曾形成“汉字文化圈”。"],"q":"7.汉字记录的悟之单位基本上是 ( )","w":"high","e":["2016 真题"]},{"t":"汉字信息处理","y":"名词解释","p":["汉字信息处理就是利用计算机对汉字符号系统进行处理的一项科学技术。","所谓语言信息处理就是指用计算机对自然语言的形、音、义等信息进行处理。","汉字信息处理不等同于中文信息处理。汉字信息处理系统则是中文信息处理系统中一个关键和基础的部分。","汉字信息处理，对使用者来说，最主要的是汉字信息的输入与输出。"],"q":"10.解决汉字信息输入计算机的问题，是进行汉字信息处理的基础。","w":"high","e":["2014 真题","2019 真题"]},{"t":"汉语习得理论","y":"名词解释","p":["汉语习得理论是对对外汉语教学的主体——学习者的研究，即侧重从心理学的角度研究教学对象的学习过程和学习规律。","随着认知心理学和教育心理学的发展和语言习得研究本身的进展，人们逐渐认识到“教”的成功与否决定性的因素还在“学”的方面，对“学”的研究是对“教”的研究的基础和前提。"],"q":"3.汉语习得理论侧重于从(的角度研究教学对象的学习过程和学习规律。","w":"high","e":["2019 真题"]},{"t":"派生词","y":"名词解释","p":["派生式合成词是指由词根和词缀组合而成的词。","根据词缀的位置，可以分成前缀、后缀、中缀三种类型。","汉语里典型词缀并不太丰富，但是存在比较多的“类词缀”，特点是类似于词缀，意义有不同程度的虚化，但还不彻底。"],"q":"8.“土里土气”、“昌不渝秋”、“花里胡哨”都是派生词、()","w":"high","e":["教材高频"]},{"t":"海上丝绸之路","y":"名词解释","p":["古代海上贸易与文化通道","形成秦汉，繁荣宋元","泉州、广州、宁波为始发港","输出丝绸瓷器，输入香料珠宝"],"q":"6.习近平于2013年9月7日，在哈萨克斯组访问时提出建设“新丝绸之路经济带”构想，又在2013年10月3日，出访印度尼西亚时提出建设“21世纪海上丝绸之路”的构想，并得到了沿线26个国家的积极响应。","w":"high","e":["2024 445 一、中外文化及跨"]},{"t":"独体字","y":"名词解释","p":["独体字是指无法分离出两个或两个以上部件的汉字。","有些字笔画相交，结构呈镶嵌式，即使笔画很多，由于从字形上不能分解出相离的部件，因而也是独体字；有些字分解后就是相离而又对称或平行的笔画，这类字也宜看作独体字。","独体字在现代汉字中约占3%——5%，绝对数量为三百上下，它们是构成现代汉字字形的基础。"],"q":"6.下列 ()组汉字部是独体字。","w":"high","e":["2013 真题","2019 真题"]},{"t":"玄奘","y":"名词解释","p":["唐代高僧、法相宗创始人","西行求法十七年","译经七十五部一千三百余卷","口述《大唐西域记》"],"q":"A 郑和 B.玄奘 C.法海 0.义静一家专注汉颈考研的店铺————汉顾考研网","w":"high","e":["2020 真题"]},{"t":"现代汉字","y":"名词解释","p":["现代汉字指现阶段正在使用的汉字，它记录的主要对象是现代汉语，与传统汉字相对应。","判断一种文字符号体系的性质，首要的是研究这种文字与它所记录的语言之间的关系。","考察现代汉字的特点，还必须跟拼音文字符号体系进行比较。"],"q":"8.根据现代汉字核字部件与整字的音义关系，可以把现代汉字的部件分为意符、音符和( )三类。","w":"high","e":["2013 真题","2019 真题"]},{"t":"现代汉字形音义的关系","y":"名词解释","p":["字形是文字的物质外壳，是文字层面上的要素；字音和字义是文字所记录语言的音和义，是语言层面上的要素。","字形与字音以及字义这三者之间形成了错综复杂的关系。","现代汉字学的术语中，例如“多音多义字、同音字、异读字、异体字、繁简字、同形字”等，它们的内涵有一些交叉或重叠，这是因为给这些名称命名时的出发点不同。"],"q":"3.举例说明现代汉字形音义的关系。","w":"high","e":["2014 真题"]},{"t":"知识文化","y":"名词解释","p":["所谓知识文化是指跨文化交际中不直接影响准确传递信息的语言和非语言的文化因素；交际文化则是指跨文化交际中直接影响信息准确传递(即引起偏差或误解)的语言和非语言的文化因素。","知识文化常以“知识”或“内容”的形式参与交际。“知识”的多少也会影响到交际的进行。但懂就是懂，不懂就是不懂，一般不会产生误解。","交际文化与知识文化概念的提出，加深了人们对语言教学中的文化教学的认识。"],"q":"9.张占一等人提出了知识文化和交际文化。","w":"high","e":["2018 真题"]},{"t":"短时记忆","y":"名词解释","p":["短时记忆又称操作记忆，典型的例子是人们在拨电话时记住刚查找的号码，打完电话马上就忘掉了。短时记忆是对信息进行操作的系统，是动态系统。","感觉信息在短时记忆中保存一分钟左右，通常是以听觉形式编码，且基本保持逐词逐句的内容。","短时记忆容量有限，信息一次呈现后能在短时记忆中正确回忆起7±2个信息单位，以数字计大约为5至7个数，不相连的字母为7个，无关联的汉字一次则能记住6个。","在第二语言学习中如能在短时记忆中组成有意义的信息单位，如词、句，则记忆容量可以大大增加。"],"q":"5.短时记忆容量有限，信息一次呈现后能在短时记忆中正确回忆起 个信息单位。","w":"high","e":["2017 真题"]},{"t":"短语","y":"名词解释","p":["由两个或两个以上单词构成的句法结构单位","在语义上能逐层贯通，在结构上能逐层搭配起来","没有句调的一组词","短语有两类：词组和结构"],"q":"( )26 ·这么做很好”是主谓短语，“这么做”是主语，“很好”是谓语。","w":"high","e":["2015 真题","2021 真题"]},{"t":"社区词","y":"名词解释","p":["社区词是指反映某一社区政治、经济、文化特点并只在该社区流通的特有词语。","由于不同的政治制度、经济体制、文化教育和心理状态，中国大陆、香港特区、澳门特区、台湾地区以及不同的海外华人社区就会在政治、经济、文化、教育、生活等方面出现各不相同的事物、观念和现象，从而出现只在该社区使用的社区词。"],"q":"A.行业词 B.外来词 C.新造词 Q.社区词","w":"high","e":["教材高频"]},{"t":"离合词","y":"名词解释","p":["有些双音节词在中间可以插入别的成分而变成短语，这类可以插入别的成分变成短语的词叫“离合词”。","常见的离合词有“洗澡、站岗、生气、结亲、伤心、帮忙、随便、游泳、推翻、说服、打倒、看见”等。"],"q":"A 离合词 B 单纯词C 缩略词 D 外来词","w":"high","e":["教材高频"]},{"t":"科举制","y":"名词解释","p":["隋大业元年设进士科始","1905年废止历时1300年","以考试成绩为录取标准","打破门第限制"],"q":"1.中国古代科举制度的特点、","w":"high","e":["2015 真题","2019 真题","2024 真题"]},{"t":"移情","y":"名词解释","p":["移情(empathy)是指设身处地领会别人的思想和感情。这是人与人交往中相互沟通、消除隔阂、达到和谐相处的必要条件。","语言是达到移情的主要手段，在语言交际过程中双方都要不断做出假设，揣摸从对方输入的信息所表达的意思以及将要输入的是什么信息。","由于认知因素和情感因素的差异，在同一语言文化的成员之间也需要有一定的移情，理解对方的认知及情感特点和状态，才能使交际顺利进行。","运用第二语言进行交际，除了认知和情感方面的差异外，更存在双方在文化上的差异和语言方面的障碍，更需要双方跨出自我的疆界，运用更多的移情来理解对方的文化特点和语言结构特点。"],"q":"A.交际 B.移情 C.认同 D.抑制七、案例分析与写作(共40分)请根据以下材料，按照“发现问题————分析问题————解决问题”的思路，写一篇1500字以上的案例分析，要求：结构完整，格式正确，条理清楚，语言规范，观点明确，材料充实，卷面整洁。","w":"high","e":["2020 真题"]},{"t":"程朱理学","y":"名词解释","p":["二程与朱熹为代表","理为宇宙本原","理在事先","格物致知","存天理灭人欲","元明清官方哲学"],"q":"13.理学又称义理之学或道学，其创始人为北宋的周敦颈、邵雍及张战、继后有程顾和程颐等人继续发展，最终由南宋朱熹集其大成，因此这种理学常被称为“程朱理学”()","w":"high","e":["2024 真题","2015 真题"]},{"t":"笔形","y":"名词解释","p":["依据笔势和走向，现代汉字的笔画可以有31种不同的形式，笔画的形式简称为笔形。","现代汉字的笔形可以有概括的和细致的两种分类法：概括的分类法把笔形分为八类或五类；细致的分类法先把笔形分为基本笔形和派生笔形（也称复合笔形）两个大类。","书写时，笔画的方向自始至终没有变化的笔形是基本笔形，笔画的方向有所变化的是派生笔形。"],"q":"7.汉字序列法中的 ()又分部首法、笔画法和笔形法、A 音序法 D 形序法C 义序法 D 音义法","w":"high","e":["教材高频"]},{"t":"笔画","y":"名词解释","p":["笔画是构成楷书字形的最小单位。","就书写过程而言，笔画是有起止的线条，从落笔到下一次提笔的过程中写出的点和线就叫一笔或一画。","在不同的字体中，笔画的表现形式可能不完全相同。","这里所说的笔画是以印刷体的主流字体宋体、楷体作为分析对象的。"],"q":"8.“肺”字的笔画数是().A.6 B.7 C.8: D.9","w":"high","e":["2012 真题","2018 真题"]},{"t":"笔顺","y":"名词解释","p":["书写汉字时笔画的走向和次序叫作笔顺。","笔顺包括两方面内容：一是笔画的走向，也有人称“笔势”，例如横（一）是从左到右，竖（丨）是从上到下；二是笔画出现的先后次序，也有人称“笔序”。","笔势和笔序合起来称为笔顺。"],"q":"(10)“历”的笔顺是(","w":"high","e":["2014 真题","2020 真题"]},{"t":"第一语言","y":"名词解释","p":["人出生以后首先接触并获得的语言","第二语言指人们在获得第一语言以后再学习和使用的另一种语言。","这是按人们获得语言的先后顺序来区分的两个概念，也是语言教学理论中用得最多的术语。"],"q":"1.第一语言和第二语言是按照人们习得语言的人 来区分的概念。","w":"high","e":["2013 真题","2019 真题"]},{"t":"第二语言","y":"名词解释","p":["指人们在获得第一语言以后再学习和使用的另一种语言","由于学习这些语言的规律与学习第二语言有很多共同之处，所以一般不再细分而统称第二语言。","广义的“第二语言”是指任何一种在第一语言获得以后学习和使用的语言，包括外语。"],"q":"1.第一语言和第二语言是按照人们习得语言的人 来区分的概念。","w":"high","e":["2019 真题"]},{"t":"第二语言习得","y":"名词解释","p":["正因为第二语言学习中也包含有习得的因素，越来越多的人把第二语言学习也称为第二语言习得。","在第二语言学习理论的研究中，特别是西方学者的研究文章中已出现用术语“习得”代替“学习”的趋向。","有关第二语言习得的理论和模式，西方学者已提出不下数十种，从各个不同的角度论述或解释第二语言是如何习得的。","其中有的理论虽然影响不小，但尚未得到足够的科学实验的证实，还只能称为假说。"],"q":"3.第二语言教学法中的自然法以语言交际理论和( )的有关第二语言习得的理论为理论基础。","w":"high","e":["2019 真题"]},{"t":"类义词","y":"名词解释","p":["类义词就是根据同一意义标准划分出来的属于同一上位词的一组下位词。","根据同位关系的严密程度，类义词主要包括两种类型：严格的基于科学分类的类义词；非严格的基于日常运用的类义词。","类义词划分必须同一标准，类义词之间必须互相排斥。"],"q":"1.类义词公众号：汉硕考研网 34 15221735332一家专注汉硕考研的店铺————汉硕考研网","w":"high","e":["教材高频"]},{"t":"类书","y":"名词解释","p":["采摭群书按类编排的工具书","述而不作，辑录原文","《艺文类聚》《太平御览》《永乐大典》","具有文献辑佚价值"],"q":"27.在出现㒿版印刷以前，书本都靠手抄、这类书就叫“抄本”或“写本”。","w":"high","e":["2019 真题"]},{"t":"经史子集","y":"名词解释","p":["经部：儒家经典与小学","史部：各类史书","子部：诸子与科技艺术","集部：文学总集别集"],"q":"5.古代图书“经、史、子、集”四分法始理唐朝、( )","w":"high","e":["2023 真题","2019 真题"]},{"t":"结构主义语言学","y":"名词解释","p":["20世纪初语言学进入新的发展时期。1906年到1911年瑞士语言学家索绪尔在日内瓦大学讲授普通语言学，1916年由他的学生整理出版了他的讲稿《普通语言学教程》。","索绪尔被公认为现代语言学的主要奠基人，其语言理论也成了现代语言学的指导思想。","索绪尔语言理论的核心是语言是符号系统，这一系统由很多小系统组成；符号由“能指”(形式)和“所指”(概念)两部分构成。","在30年代有三个学派：强调语言符号的功能的布拉格功能语言学派，强调语言符号间各种关系的哥本哈根语符学派，强调共时描写语言事实的美国描写语言学派。"],"q":"1.简要说明索绪尔(F. de Saussure)结构主义语言学的主要贡献。","w":"high","e":["2018 真题"]},{"t":"绝对反义词","y":"名词解释","p":["绝对反义词：肯定一方必否定另一方，否定一方必肯定另一方，二者属于矛盾关系。","绝对反义词属于反义词的一类，与相对反义词相对。"],"q":"15.“黑”和“白”是一对绝对反义词。","w":"high","e":["教材高频"]},{"t":"联绵词","y":"名词解释","p":["联绵词是从古代汉语中流传下来的，由两个没有意义的音节连缀成义而形成的词。","根据联绵词两个音节的声母、韵母关系，联绵词可以分为三类：双声词、叠韵词、非双声叠韵词。","双声词指声母相同的联绵词；叠韵词指韵母相同的联绵词；非双声叠韵词指声母和韵母都不相同或不相近的联绵词。"],"q":"8、“克隆、咖啡、基因、布丁”都是 ()、A 联绵词 B 口语词C 音译词 D 社区词","w":"high","e":["教材高频"]},{"t":"自然法","y":"名词解释","p":["自然法是70年代后期产生于美国的新教学法，其倡导者是美国加州大学西班牙语副教授特雷尔(Tracy Terrell)和美国语言教育家克拉申。","自然法是根据对自然环境中的母语习得和第二语言习得的观察与研究，提出在非自然条件(即课堂教学)中最大限度地扩大对学习者的语言输入、首先集中培养理解能力并强调通过习得掌握第二语言的教学方法。","自然法以语言交际理论和克拉申的有关第二语言习得理论，即“输入”的五个假说为理论基础。","1983年克拉申与特雷尔合作出版了《自然法：课堂中的语言习得》一书，全面阐述了自然法的理论基础和具体实践。"],"q":"3.第二语言教学法中的自然法以语言交际理论和( )的有关第二语言习得的理论为理论基础。","w":"high","e":["2018 真题"]},{"t":"自觉对比法","y":"名词解释","p":["自觉对比法是主张通过母语与目的语的翻译和结构对比，自觉掌握目的语的一种教学方法。","在本世纪30年代至50年代成为前苏联正统的外语教学法，对东欧和蒙古的外语教学也有较大影响，50年代我国外语教学基本上是以自觉对比法为依据。","自觉对比法是以直接法为对立面，客观上成了语法翻译法的继承和发展。","自觉对比法的理论基础首先是重视德育、把教育教养任务放在首位的苏联教育学思想，还以当时苏联的语言学和心理学理论为基础。"],"q":"4.第二语言教学法中的自觉对比法以当时( )的语言学和心理学理论为基11一家专注汉硕考研的店铺————汉硕考研网础。","w":"high","e":["2020 真题"]},{"t":"舌位","y":"名词解释","p":["舌头收紧隆起的发音部位"],"q":"3.根据舌位的前后不同，舌面元音可以分为前元音、后元音和( )","w":"high","e":["2018 真题"]},{"t":"行业词","y":"名词解释","p":["行业词是指在不同学科专业和行业中使用的专门用语，是表达学科专业和行业概念的重要方式。","行业词包括专业术语和行业用语。","随着人们文化知识水平的普遍提高以及跨学科和跨行业交流的增加，许多行业词逐渐泛化而成为普通的现代汉语词汇。"],"q":"A.行业词 B.外来词 C.新造词 Q.社区词","w":"high","e":["教材高频"]},{"t":"行为主义","y":"名词解释","p":["20世纪的美国心理学界出现了反对构造主义和机能主义的另一种思潮——行为主义。这是强调学习过程和测量外显行为的心理学派，其创始人是美国心理学家华生，后期主要代表人物是斯金纳。","行为主义有两个主要特点：否认意识，主张心理学只研究人的行为；反对内省，主张采用客观的实验的方法。","华生受俄国巴甫洛夫经典性条件反射学说的影响，建立了刺激——反应模式，成为经典性行为主义理论。新行为主义代表人物之一的斯金纳，则受到操作主义哲学的影响，建立了操作行为主义，和“刺激——反应——强化”的模式。"],"q":"1.情景法的心理学基础是行为主义的A、联想主义理论 B：结构主义理论C.习惯形成理论 D.历史比较理论","w":"high","e":["2026 真题","2026 445 二、教育学、心理"]},{"t":"行为文化层","y":"名词解释","p":["长期社会交往中约定俗成","社会的、集体的行为","表现为礼俗民俗风俗"],"q":"4.一般把文化分为物质文化层、制度文化层、行为文化层和精神文化层四个层次。","w":"high","e":["2025 445 一、中外文化及跨"]},{"t":"视听法","y":"名词解释","p":["视听法是50年代产生于法国的一种第二语言教学法，它强调在一定的情景中听觉(录音)感知与视觉(图片影视)感知相结合的教学方法。","因它首创于法国圣克卢高等师范学院，所以也叫“圣克卢法”，代表人物是古布里纳(P. Guberina)和古根汉(G. Gougenhein)。","视听法来源于直接法和听说法，它继承和发扬了二者的长处。","视听法的理论基础也是结构主义语言学和行为主义心理学，认为掌握了一种语言的结构就是掌握了该语言。","视听法又受到完形心理学的影响，强调完整地感知事物，所以视听法也叫“整体结构法”。"],"q":"8.视听法也叫“圣克卢法”，典型教材如《新概念英语》。","w":"high","e":["2019 真题"]},{"t":"记忆","y":"名词解释","p":["记忆是过去的经验在人脑中的保存和提取，是人脑对过去经历过的事物的反映。","第二语言记忆则是指第二语言知识和能力的保持和再现，是第二语言学习者主动积极的活动过程。","记忆按其内容分为形象记忆、逻辑记忆、情绪记忆和运动记忆等，第二语言记忆涉及到所有这些方面。","记忆按保持的状态和时间分为感觉记忆、短时记忆和长时记忆。"],"q":"9.记忆的第三个阶段是再认和( )。","w":"high","e":["2019 真题"]},{"t":"词根","y":"名词解释","p":["词根是构成合成词的有实在意义的不定位语素。","合成词是由两个或两个以上语素构成的词。根据语素在合成词中的表义作用，把语素分为词根和词缀。","词缀是构成合成词的附着在词根前后或中间表示附加意义的定位语素。"],"q":"11. “苦头、插头”中的“头”分别是( ).6 词根词根 B.词根 词缀C.词缀 词根 D.词缀 词缀","w":"high","e":["教材高频"]},{"t":"词汇","y":"名词解释","p":["词汇也称语汇，是语言中能独立运用的最小的音义结合单位的集合，有时也可以指特定领域中词语的集合。","词语是能够独立运用的音义结合的最小语言单位。词语包括词和固定短语，词是词汇的主体部分，而固定短语是词汇的重要组成部分。","词语的总和形成词汇，词汇与词语的关系是集合与个体的关系。","根据语言差异，词汇可分为汉语词汇、英语词汇、德语词汇等；根据领域不同，词汇可分为政治词汇、经济词汇、法律词汇等。"],"q":"( )是何的词汇意义的主要承担者。","w":"high","e":["教材高频"]},{"t":"词类","y":"名词解释","p":["词类专指词的语法类别","不同的词类在形态、意义和功能等方面表现出区别性特点","划分词类的目的是为了说明语言的构造规则","词类是一个有层次的系统"],"q":"12.现代汉语词类划分必须以词的为依据。","w":"high","e":["2013 真题","2018 真题"]},{"t":"词缀","y":"名词解释","p":["词缀是构成合成词的附着在词根前后或中间表示附加意义的定位语素。","合成词根据词缀的位置，可以分成前缀、后缀、中缀三种类型。","汉语里典型词缀并不太丰富，但是存在比较多的“类词缀”，特点是类似于词缀，意义有不同程度的虚化，但还不彻底；构词功能很强，有组合泛化趋势；其中，后缀与类后缀型最为丰富，中缀和类中缀最少。"],"q":"11. “苦头、插头”中的“头”分别是( ).6 词根词根 B.词根 词缀C.词缀 词根 D.词缀 词缀","w":"high","e":["教材高频"]},{"t":"语义场","y":"名词解释","p":["语义场就是在共时条件下，在同一个语义系统中具有意义联系的词的聚合体，语义场是义素分析的依据。","义位之间的意义关联性是义素对比分析的基本条件，义素对比分析的对象必须是具有意义关联性的同一语义场的义位。","根据语义场内义位之间的关系，可以把语义场分为分类语义场、顺序语义场、关系语义场、反义语义场、同义语义场。语义场具有联系性、民族性、层次性三个特征。"],"q":"15.属于同一语义场的词，既具有相同的义素，又具有不同的义微。","w":"high","e":["教材高频"]},{"t":"语义文化","y":"名词解释","p":["语义文化指语言的语义系统、主要是词汇中所包含的社会文化涵义，它反映了民族的心理模式和思维方式。","这是语言中的文化因素最基本、最大量的表现形式，也是语言教学中文化因素教学的重点之一。","首先是一个民族文化中特有的事物和概念体现在词汇中，而在别的语言中没有对应词语，如不加解释，第二语言学习者就难以理解。","更多的则是某一事物或概念虽在不同的语言中有对应词语，但词义却存在很大差别，因而在语言交际中最容易造成误解和障碍。"],"q":"2.语义文化对词语教学有何影响?","w":"high","e":["2019 真题"]},{"t":"语气词","y":"名词解释","p":["一般用于句末","表示陈述、疑问、祈使、感叹等语气","永远黏着、后附、轻声"],"q":"A.结构助词 结构助词 B 语气词 语气词C：语气词 结构助词 结构助词 语气词","w":"high","e":["2016 真题","2020 真题"]},{"t":"语法","y":"名词解释","p":["制约着句子组合合法性的规则就是“语法”","语法是语言不可缺少的有机的组成部分","语音是语言的物质外壳，词汇是语言的建筑材料，语法是语言的构造规则","词语的组合绝不是任意的，符合规则句子就合法，否则就不合法"],"q":"(5)情不自尽 (10)英维倍出三、语法词汇规范(每题1分，共10分)","w":"high","e":["2016 真题","2019 真题"]},{"t":"语法功能","y":"名词解释","p":["词的组合能力","能否与其他的词组合成短语","以什么顺序组合","组合以后表示什么关系","作句法成分的能力"],"q":"13 词的语法功能是指词的(","w":"high","e":["教材高频"]},{"t":"语法翻译法","y":"名词解释","p":["语法翻译法又称“传统法”或“古典法”，是以系统的语法知识教学为纲，依靠母语，通过翻译手段，主要培养第二语言读写能力的教学法。","这是第二语言教学史上最古老的教学法，在欧洲用于教授古希腊语、拉丁语已有千百年的历史。","语法翻译法的语言学基础是历史比较语言学，认为一切语言都起源于一种共同的原始语言，语言规律是共同的，词汇所代表的概念也是相同的，所不同的只是词汇的语音和书写形式。","语法翻译法的心理学基础是18世纪德国的官能心理学，其创始人是德国哲学家沃尔夫(C. Wolff)。","18世纪末、19世纪初，德国语言学家奥伦多夫(H. Ollendorff)等对语法翻译法进行了理论上的总结与阐述，使之成为一种科学的第二语言教学法体系。"],"q":"2.语法翻译法的语言学基础是历史比较语言学。","w":"high","e":["2018 真题","2021 真题"]},{"t":"语素","y":"名词解释","p":["语素是语言中最小的音义结合的构词单位，是最基本的语言单位。","一个语素必须是语音与语义结合，而且不能再拆分。其中，具有一定的语义是判断语素的最基本条件。","汉语绝大多数语素是一个有意义的音节。如“床”的语音形式是chuáng，它的语义内容是“供人躺在上面睡觉的家具”，那么，“床”就是一个语素。","有少数语素是由两个无意义的音节合成的。如“玻璃”，它的语音形式是bōli，语义是“一种质地硬而脆的透明物体”。“玻”和“璃”虽然都有语音形式，但都没有单独的语义，因此都不是语素；只有“玻璃”才是一个语素。"],"q":"10.语素是( )结合的最小的语言单位，确定语素通常采用 云。","w":"high","e":["教材高频"]},{"t":"语言学能","y":"名词解释","p":["这种学习第二语言所需要的特殊认知素质叫做第二语言学习的能力倾向，也称语言学能(language aptitude)。","一般的智商测验不能准确地预测语言学能，专门用来测量语言学能的是语言学能测验。","有影响的语言学能测验有三种，即由卡罗尔(J. Carroll)和萨彭(S. Sapon)于1959年编制的《现代语言学能考试》和1967年编制的《初级现代语言学能考试》以及由平斯勒(P. Pimsleur)于1966年编制的《语言学能考试》。","语言学能测验，根据卡罗尔的观点，主要考查四种能力：语音编码解码能力、语法敏感性、强记能力、归纳能力。"],"q":"2.语言学能测验主要考查什么能力?","w":"high","e":["2020 真题"]},{"t":"语音","y":"名词解释","p":["由人的发音器官发出","不同的语音代表不同的意义","作用是进行社会交际，具有“社会”的属性"],"q":"6.音位是某一特定语音系统中能够 的最小语音单位","w":"high","e":["2016 真题","2020 真题"]},{"t":"语音教学","y":"名词解释","p":["对外汉语语音教学的任务是让学习者掌握汉语语音的基本知识和汉语普通话正确、流利的发音，为用口语进行交际打下基础。","语音是语言的物质外壳。语音的重要性决定了语音教学是第二语言教学的基础，是掌握听说读写技能和交际能力的前提。","语音教学原则主要有：(1)短期集中教学与长期严格要求相结合；(2)音素教学与语流教学相结合；(3)通过语音对比突出重点和难点；(4)声韵调结合教学，循序渐进；(5)听说结合，先听后说；(6)以模仿和练习为主、语音知识讲解为辅；(7)机械性练习与有意义练习相结合。"],"q":"4.常模参照模式五、简答题(10分)请说明语音教学中语流教学的重要性。","w":"high","e":["2020 真题"]},{"t":"说文解字","y":"名词解释","p":["东汉许慎所著","中国第一部系统分析字形的字典","收字9353，按540部首编排","首创部首检字法"],"q":"3.中国最早的字典是东汉 编纂的《说文解字》。","w":"high","e":["2018 真题"]},{"t":"课堂教学","y":"名词解释","p":["课堂教学是指教师根据教学大纲规定的目的、任务和教材，运用恰当的教学方法，在规定的时间内对固定班级的学生进行某门课程教学的形式。","在学校教育中，课堂是实施教学的主要场所。对外汉语课堂教学是对外汉语教学的基本组织形式，集中地体现了对外汉语教学过程。","教学过程的感知、理解、巩固、运用阶段主要在课堂教学中完成。实施教学计划，贯彻教学原则，运用教学方法，完成课程教学并实现教学目标，主要都是靠课堂教学。","在教学活动的四大环节中，课堂教学是中心环节。要提高教学效果，就要提高课堂教学质量。"],"q":"2.通过课堂教学接触目的语的(是极有限的，目的语的输入量也无法与自然习得相比。","w":"high","e":["2019 真题"]},{"t":"调值","y":"名词解释","p":["音节读音高低、升降、曲折、长短的具体变化值"],"q":"1.现代汉语 2.谱系分类法 3.歌后语 4.调值 5.语用策略(四)简答题(每题8分，共40分)","w":"high","e":["2014 真题","2020 真题"]},{"t":"调号","y":"名词解释","p":["声调的标志符号","把五度标调法图形简化","“-、ˊ、ˇ、`”分别表示阴平、阳平、上声、去声"],"q":"7.拼音中，凡标有调号的元音一定是韵履。","w":"high","e":["2013 真题","2017 真题","2023 真题"]},{"t":"谚语","y":"名词解释","p":["谚语是民间基于深刻的社会生活经验而提炼出来的通俗、上口、精练、形象而有一定警示或教育意义的熟语。","谚语是人民智慧的结晶，能以浅显的语言表达深刻的道理。","根据谚语所反映的内容，谚语主要包括六种类型：农业谚语、气象谚语、规诫谚语、常识谚语、讽颂谚语、风土谚语。"],"q":"9.谚语一般按内容可分为农谚、气象谚、讽领诊、规议诊、()、生活常识诊等类型。","w":"high","e":["教材高频"]},{"t":"象形","y":"名词解释","p":["用线条描画出事物的形象，其字形与字义的联系比较具体、紧密。","这类字大多表示自然界和日常生活中的实物。","许多事物用几根线条很难画出，所以用这种方法造出来的字并不多。","由于字形历史演变等原因，这类字的形体象形意味现在大为减弱，不少已经失去了跟字义的直接联系，有些还变成了记号。"],"q":"13.甲骨文的形结构基本上部是象形文字。","w":"high","e":["2012 真题"]},{"t":"跨文化交际","y":"名词解释","p":["跨文化交际是指不同文化背景的人们之间的交际行为。这种交际主要是通过语言来进行的，称为跨文化语言交际。","影响跨文化语言交际的是不同文化之间的相同之处和不同之处，特别是文化差异。因此跨文化交际中要特别重视并研究文化差异。","跨文化交际的特点：(1)文化的差异与交际障碍；(2)交际原则与价值观念；(3)母语文化的思维定势和对异文化的成见；(4)交际过程中的相互接近和求同趋向；(5)交际的结果：文化的相互影响。","从上述五个特点可以看出，跨文化交际的根本特征是如何发现、认识和对待不同文化之间的差异。"],"q":"壹中外文化及跨文化交际基础知识一、填空题(每小题1分，共30分)","w":"high","e":["2019 真题"]},{"t":"辅音","y":"名词解释","p":["气流在发音部位受到明显的阻碍","又叫子音","主要功能是担当声母或韵尾"],"q":"4.按照声带振动与否、普通话的辅音可以分为. 和 两类。","w":"high","e":["2012 真题","2018 真题"]},{"t":"输入假说","y":"名词解释","p":["从70年代末开始，美国语言教育家克拉申对第二语言习得提出了一系列假说，1985年在其著作《输入假说：理论与启示》中正式归纳为习得与学习假说、自然顺序假说、监控假说、输入假说和情感过滤假说等五个系列假说，总称为输入假说理论。","这一理论被认为是第二语言习得研究中论述最全面、影响最大的理论，但同时也是引起很多争议的理论。","输入假说认为人类获得语言的惟一方式是对信息的理解，也就是通过吸收可理解的输入(comprehensible input)习得语言知识；输入的语言信息既不要过难也不要过易，克拉申用“i+1”来表示，i代表学习者目前的语言水平，i+1则是下一阶段应达到的语言结构的水平。","克拉申强调听力活动对语言习得最为重要，语言习得是通过听力理解来实现的，而不是通过“说”获得的。"],"q":"3.⁻自然顺序假说是克拉申输入假说理论基础..( )","w":"high","e":["2025 真题","2025 445 二、教育学、心理"]},{"t":"近义词","y":"名词解释","p":["近义词是指意义基本相同，但在意义、功能或色彩上存在细微差别的词。","近义词属于同义词，同义词辨析可运用色彩分析法、意义分析法、功能分析法。"],"q":"五、近义词辨析(每题5分，共20分)","w":"high","e":["教材高频"]},{"t":"连中三元","y":"名词解释","p":["乡试解元、会试会元、殿试状元","三级皆第一为连中三元","历史上极为罕见"],"q":"3.科举考试中，“连中三元”指的是一个人在乡试、 和股试中都考取第一名。","w":"high","e":["2020 真题"]},{"t":"道教","y":"名词解释","p":["中国本土宗教、尊老子为教主","东汉张陵创五斗米道（天师道）","追求长生久视、得道成仙","金元后分全真道与正一道"],"q":"9.变文是一种说唱艺术，起源于道教的讲经宣传。","w":"high","e":["2017 真题"]},{"t":"遗忘曲线","y":"名词解释","p":["这就是德国著名心理学家、记忆与遗忘现象实验研究的创始人艾宾浩斯的遗忘曲线。","遗忘规律启示我们，在第二语言教学中对已识记的材料应赶在遗忘以前迅速地、及时地进行巩固、复习、重现和运用，并且要经常复习，复习的间距由短拉长。","从识记的时间来看，遗忘的进程并不是均衡的。在识记的最初时间遗忘很快，识记后的一小时遗忘率达56％，以后就逐渐放慢，31天后遗忘率达79%，到一定程度就不再遗忘。"],"q":"3.简要说明遗忘曲线表示的遗忘规律及其对第二语言教学的启示。","w":"high","e":["2020 真题"]},{"t":"部件","y":"名词解释","p":["部件是由笔画组成的、能独立运用的、具有组配汉字功能的构字单位。","部件也可以看作是对整字进行一次或几次切分后得出来的构字单位。","大多数部件是由一些笔画组合成的“构件”，它们可以独立运用；有少数部件本身就是一个字；也有少数部件本身就是一个笔画。"],"q":"8.根据现代汉字核字部件与整字的音义关系，可以把现代汉字的部件分为意符、音符和( )三类。","w":"high","e":["2013 真题","2019 真题"]},{"t":"部位","y":"名词解释","p":["要确定部件的名称，还要给汉字字形结构的各个位置定名，这就叫部位。可以分为八类。","八类部位可以编成16字口诀：上“头”下“底”，左“旁”右“边”，内“心”外“框”，中“腰”四“角”。","使用统一规范的部件和部位名称，可以把一个结构复杂的汉字称说得既准确又清楚，这就叫“部件识字法”。"],"q":"1.写出下列声母的国际音标，并说明发音部位和发音方法.(每题2分，共10分)","w":"high","e":["教材高频"]},{"t":"部首","y":"名词解释","p":["“部首”是指可以成批构字的一部分部件。含有同一部件的字，在“字集”中均排列在一起，该部件作为领头单位排在开头，成为查字的依据。","部首一般包括两类：一是形旁，例如“栋”“梁”的部首都是“木”；二是某些笔画，例如“头”的第一笔“、”就是部首。","《说文解字》的部首是540个，《现代汉语词典》（第6版）的部首是201个。"],"q":"9.一个字的“部件”同时也是这个字的“部首”。","w":"high","e":["2014 真题","2021 真题"]},{"t":"部首法","y":"名词解释","p":["部首法是东汉许慎在《说文解字》中首创的。","《说文解字》把汉字按其来源分为540部，每部把共同傍从的形旁字列在开头，称为部首。","部首法自创立以后千百年来一直为编纂字书的人所采用，只是分部的多少和字的归部原则有所不同。","语文学界把214部的部首系统称为“传统部首”，而把改变214部的现代各种部首系统称为“改良部首”。"],"q":"7.汉字序列法中的 ()又分部首法、笔画法和笔形法、A 音序法 D 形序法C 义序法 D 音义法","w":"high","e":["2013 真题","2020 真题"]},{"t":"隶变","y":"名词解释","p":["由甲骨文、金文发展到小篆，是一个简化的过程。小篆又简化为隶书，隶书又简化为草书和楷书，楷书又跟草书结合为行书。","隶变在字体演变史上的地位最为重要，它是古今汉字的分水岭。","汉字字体演变的总趋势是由繁难变为简易。"],"q":"2.简要回答隶变在汉语发展史上的价值。","w":"high","e":["2015 真题","2021 真题","2015 真题","2024 真题"]},{"t":"难度等级模式","y":"名词解释","p":["难度等级模式由普拉克特(C. Practor)提出，是一种分类比较简明的语言难度等级模式。","该模式将难度分为六级，从零级到五级，级数愈高难度也愈大。","零级：指两种语言中相同的成分，在学习中产生正迁移，而不会发生困难。如英语和汉语都是“动词＋宾语”的语序。","一级：在第一语言中分开的两个语言项目，在目的语中合成一项。二级：第一语言中有而目的语中没有的语言项目，学生必须避免使用。三级：第一语言中的某个语言项目在目的语中虽有相应的项目，但在项目的形式、分布和使用方面又有着差异。四级：目的语中的某个语言项目，在其第一语言中没有相应的项目，学习者在习得这些全新的项目时会产生阻碍性干扰。五级：第一语言中的一个语言项目到了目"],"q":"13.普拉克特的难度等级模式分为一级到六级。","w":"high","e":["2020 真题"]},{"t":"零声母","y":"名词解释","p":["没有辅音开头的音节","韵母独自形成音节","y、w不是真正的声母，而是隔音字母"],"q":"2.韵母表中1行零声母音节，如果1是韵头，要把i改写成(1.","w":"high","e":["2016 真题","2022 真题"]},{"t":"青铜器","y":"名词解释","p":["铜锡铅合金","夏代始，商周鼎盛","礼器乐器兵器生活用器","饕餮纹、司母戊鼎、四羊方尊"],"q":"37.秦汉时期是我国青铜器极度兴盛的时代，也是中国青铜文化最辉煌的时期。","w":"high","e":["2019 真题","2015 真题"]},{"t":"青铜礼器","y":"名词解释","p":["商周祭祀宴飨礼仪用器","藏礼于器的宗法等级体现","鼎簋尊卣爵觚等","列鼎制度天子九鼎"],"q":"5.商周青铜礼器分为食器、酒器和水器，如鼎、舀、盘等 ( )","w":"high","e":["2017 真题"]},{"t":"音序法","y":"名词解释","p":["音序法是按照字音来排列字序的方法。","汉字的音序法经历了声韵序列法、注音字母序列法和汉语拼音字母序列法三个阶段。","汉语拼音序列法内部还有两种：单纯的字母序列法与“音节·汉字·字母分层序列法”。","用音序法排检汉字简单、迅速，一查即得。"],"q":"11.目前通行的现代汉字序列法主要是音序法和形摩法。","w":"high","e":["教材高频"]},{"t":"音强","y":"名词解释","p":["就是声音的强弱","主要取决于发音体的振幅"],"q":"1.音高、音强、音长属于语音的(特征，可以合称为音律，与音色相对。","w":"high","e":["2013 真题"]},{"t":"音符","y":"名词解释","p":["凡是跟整字在读音上有联系的部件，称为“音符”。","汉字的音符，也叫声旁，同表音文字的音符有很大的区别。","前者是非专职的，是借用本来既有音又有义的现成字符充当的，而后者则是专职的。","现代汉字中音符的数量很多，超过一千个。"],"q":"8.根据现代汉字核字部件与整字的音义关系，可以把现代汉字的部件分为意符、音符和( )三类。","w":"high","e":["教材高频"]
