【原文】例10 铁路部的统计资料","y":"教材原文","p":["例10 铁路部的统计资料表明，我国铁路每年光是因为水灾造成的中断事故就有大约120次，累计中断时间大约1850个小时，造成的直接经济损失达到3.5亿元","(《铁路运输与自然灾害》，潘兆明，1994)"],"q":"例10 铁路部的统计资料表明，我国铁路每年光是因为水灾造成的中断事故就有大约120次，累计中断时间大约1850个小时，造成的直接经济损失达到3.5亿元。(《铁路运输与自然灾害》，潘兆明，1994)","w":"normal","e":["原书正文"]}]},{"id":"rumen-c16-s02","t":"第二节 口语教学环节","w":"normal","n":8,"k":[{"t":"【原文】“流动性”的概念还可以解","y":"教材原文","p":["“流动性”的概念还可以解释一些其他现象","例如：农村人为什么比城市人更喜欢生小孩? 为什么大多数人更喜欢生儿子而不是女儿? 跟城市相比，农村的流动性差，儿女们不太可能远走高飞，因此，生孩子能让父母们得到更稳定的预期收益，这就相当于父母先请孩子的客，把孩子抚养大","父母老了以后，再由孩子请父母的客，照顾他们，让他们有一个美好的晚年","至于城市，小孩的流动性大，长大以后说不定会到哪里去，父母想要依靠他们可不容易，预期收益就降低了"],"q":"“流动性”的概念还可以解释一些其他现象。例如：农村人为什么比城市人更喜欢生小孩? 为什么大多数人更喜欢生儿子而不是女儿? 跟城市相比，农村的流动性差，儿女们不太可能远走高飞，因此，生孩子能让父母们得到更稳定的预期收益，这就相当于父母先请孩子的客，把孩子抚养大。父母老了以后，再由孩子请父母的客，照顾他们，让他们有一个美好的晚年。至于城市，小孩的流动性大，长大以","w":"normal","e":["原书正文"]},{"t":"【原文】420 对外汉语教学入门","y":"教材原文","p":["420 对外汉语教学入门 (第三版)点儿独立就成为家长最合适的选择","至于“重男轻女”，道理就更简单：女儿长大以后要嫁出去，“流动性” 比男孩高"],"q":"420 对外汉语教学入门 (第三版)点儿独立就成为家长最合适的选择。至于“重男轻女”，道理就更简单：女儿长大以后要嫁出去，“流动性” 比男孩高。","w":"normal","e":["原书正文"]},{"t":"【原文】从上面的分析可以看出，如","y":"教材原文","p":["从上面的分析可以看出，如果有一天中国人也开始流行AA制，那很可能因为中国人的“流动性”增强了"],"q":"从上面的分析可以看出，如果有一天中国人也开始流行AA制，那很可能因为中国人的“流动性”增强了。","w":"normal","e":["原书正文"]},{"t":"【原文】10. 请根据初级程度的","y":"教材原文","p":["10. 请根据初级程度的水平编写一段语料，设计三种练习题，并写出完整的教案"],"q":"10. 请根据初级程度的水平编写一段语料，设计三种练习题，并写出完整的教案。","w":"normal","e":["原书正文"]},{"t":"【原文】本章参考文献[1] 傅由","y":"教材原文","p":["本章参考文献[1] 傅由，等. 发展汉语·中级汉语听力 [M].北京：北京语言文化大学出版社，2005.[2]傅由. 发展汉语·中级听力 [M].2版. 北京：北京语言文化大学出版社，2011."],"q":"本章参考文献[1] 傅由，等. 发展汉语·中级汉语听力 [M].北京：北京语言文化大学出版社，2005.[2]傅由. 发展汉语·中级听力 [M].2版. 北京：北京语言文化大学出版社，2011.","w":"normal","e":["原书正文"]},{"t":"【原文】[3] 国家汉语国际推广","y":"教材原文","p":["[3] 国家汉语国际推广领导小组办公室. 国际汉语教师标准 [M].北京：外语教学与研究出版社, 2007.[4] 李德津，李更新. 现代汉语教程·听力课本 [M].北京：北京语言学院出版社，1988."],"q":"[3] 国家汉语国际推广领导小组办公室. 国际汉语教师标准 [M].北京：外语教学与研究出版社, 2007.[4] 李德津，李更新. 现代汉语教程·听力课本 [M].北京：北京语言学院出版社，1988.","w":"normal","e":["原书正文"]},{"t":"【原文】[5] 李晓琪. 博雅汉","y":"教材原文","p":["[5] 李晓琪. 博雅汉语·初级起步篇Ⅱ [M].北京：北京大学出版社，2005.[6] 李杨. 对外汉语教学课程研究 [M].北京：北京语言文化大学出版社，1997."],"q":"[5] 李晓琪. 博雅汉语·初级起步篇Ⅱ [M].北京：北京大学出版社，2005.[6] 李杨. 对外汉语教学课程研究 [M].北京：北京语言文化大学出版社，1997.","w":"normal","e":["原书正文"]},{"t":"【原文】[7] 刘颂浩. 对外汉","y":"教材原文","p":["[7] 刘颂浩. 对外汉语听力教学研究述评 [J].世界汉语教学, 2001 (1).[8] 吕必松. 对外汉语教学概论(讲义) [M].北京：国家教委对外汉语教师资格审查委员会办公室, 1996."],"q":"[7] 刘颂浩. 对外汉语听力教学研究述评 [J].世界汉语教学, 2001 (1).[8] 吕必松. 对外汉语教学概论(讲义) [M].北京：国家教委对外汉语教师资格审查委员会办公室, 1996.","w":"normal","e":["原书正文"]}]}]},{"id":"rumen-c17","t":"第十七章 阅读课教学","w":"normal","s":[{"id":"rumen-c17-s01","t":"第一节 读者是如何阅读的？","w":"normal","n":8,"k":[{"t":"【原文】(4) 通过对话和短文部","y":"教材原文","p":["(4) 通过对话和短文部分的练习，训练学生听音、记音、辨音能力，对语篇的整体及细节的把握能力，猜测词义及检索监听能力"],"q":"(4) 通过对话和短文部分的练习，训练学生听音、记音、辨音能力，对语篇的整体及细节的把握能力，猜测词义及检索监听能力。","w":"normal","e":["原书正文"]},{"t":"【原文】教学方法和思路：依据教材","y":"教材原文","p":["教学方法和思路：依据教材编撰指导思想，以词汇一短语一对话一短文的模式进行听力训练，由易到难，循序渐进"],"q":"教学方法和思路：依据教材编撰指导思想，以词汇一短语一对话一短文的模式进行听力训练，由易到难，循序渐进。","w":"normal","e":["原书正文"]},{"t":"【原文】第1课时，完成第一部分词","y":"教材原文","p":["第1课时，完成第一部分词语、第二部分的“一、听后判断”及“二、对话一”"],"q":"第1课时，完成第一部分词语、第二部分的“一、听后判断”及“二、对话一”；","w":"normal","e":["原书正文"]},{"t":"【原文】第2课时，完成第二部分“","y":"教材原文","p":["第2课时，完成第二部分“二、对话二”和“三、听短文，听后做练习”"],"q":"第2课时，完成第二部分“二、对话二”和“三、听短文，听后做练习”。","w":"normal","e":["原书正文"]},{"t":"【原文】第1课时教学环节一：组织","y":"教材原文","p":["第1课时教学环节一：组织教学、复习第七课 (5~8分钟)"],"q":"第1课时教学环节一：组织教学、复习第七课 (5~8分钟)。","w":"normal","e":["原书正文"]},{"t":"【原文】教学环节二：跟读生词、专","y":"教材原文","p":["教学环节二：跟读生词、专名和短语 (10~15 分钟)"],"q":"教学环节二：跟读生词、专名和短语 (10~15 分钟)。","w":"normal","e":["原书正文"]},{"t":"【原文】跟读生词和专名：第一遍跟","y":"教材原文","p":["跟读生词和专名：第一遍跟老师或录音读","第二遍学生自己读，之后教师纠正发音、讲解重点词语","第三遍不看书跟读 (个别跟读或整体跟读)，巩固理解本课生词"],"q":"跟读生词和专名：第一遍跟老师或录音读。第二遍学生自己读，之后教师纠正发音、讲解重点词语。第三遍不看书跟读 (个别跟读或整体跟读)，巩固理解本课生词。","w":"normal","e":["原书正文"]},{"t":"【原文】跟读短语：跟读两遍后学生","y":"教材原文","p":["跟读短语：跟读两遍后学生提问听不懂的短语，教师解答","也可以逐个听，听后教师提问、学生回答，检查学生对短语的理解情况","最后不看书跟读一遍(个别跟读或整体跟读)，巩固理解这些"],"q":"跟读短语：跟读两遍后学生提问听不懂的短语，教师解答。也可以逐个听，听后教师提问、学生回答，检查学生对短语的理解情况。最后不看书跟读一遍(个别跟读或整体跟读)，巩固理解这些","w":"normal","e":["原书正文"]}]},{"id":"rumen-c17-s02","t":"第二节 怎么上阅读课？","w":"normal","n":8,"k":[{"t":"【原文】刘京：这儿天气，你习惯了","y":"教材原文","p":["刘京：这儿天气，你习惯了吗?和子：还不太习惯呢","这儿比东京冷多了"],"q":"刘京：这儿天气，你习惯了吗?和子：还不太习惯呢。这儿比东京冷多了。","w":"normal","e":["原书正文"]},{"t":"【原文】教师可以指出“这儿”指北","y":"教材原文","p":["教师可以指出“这儿”指北京，而学生所在的城市，天气可能完全不同","下面以广州为例讲一下地方化的实例及其运用"],"q":"教师可以指出“这儿”指北京，而学生所在的城市，天气可能完全不同。下面以广州为例讲一下地方化的实例及其运用。","w":"normal","e":["原书正文"]},{"t":"【原文】北京的名菜是烤鸭，广州的","y":"教材原文","p":["北京的名菜是烤鸭，广州的名菜是烧鹅、海鲜","北京的商业街是王府井，广州是北京路、上下九路","广州人有喝茶 (饮茶) 的习惯","广州“酒店” (hotel) 与“酒楼”(restaurant) 的不同，正如北方“饭店”与“饭馆”的不同"],"q":"北京的名菜是烤鸭，广州的名菜是烧鹅、海鲜。北京的商业街是王府井，广州是北京路、上下九路。广州人有喝茶 (饮茶) 的习惯。广州“酒店” (hotel) 与“酒楼”(restaurant) 的不同，正如北方“饭店”与“饭馆”的不同。广东话很难懂，不过，有一些广东话词语已经进入普通话，如“打的、买单、搞定”等。","w":"normal","e":["原书正文"]},{"t":"【原文】在上第十七课《去动物园》","y":"教材原文","p":["在上第十七课《去动物园》时，教师可以介绍本地动物园","如广州，有两个动物园，一个是广州动物园，一个是长隆野生动物园","并展示广州地图，告诉学生怎么去","通过PPT展示图片，教学生动物的名称"],"q":"在上第十七课《去动物园》时，教师可以介绍本地动物园。如广州，有两个动物园，一个是广州动物园，一个是长隆野生动物园。并展示广州地图，告诉学生怎么去；通过PPT展示图片，教学生动物的名称。等学生参观完动物园，让学生介绍情况。又如《阶梯汉语·中级口语1》第五课《打听：我想问你一件事》，课文中学生打听的就是重阳节，我们可以介绍广州重阳节登白云山的盛况。这样结合本地情","w":"normal","e":["原书正文"]},{"t":"【原文】四、精讲多练原则《教师标","y":"教材原文","p":["四、精讲多练原则《教师标准》规定的口语教学第二条基本原则就是“注重精讲多练，提高学生开口率”","《对外汉语教学初级阶段课程规范》(王钟华，1999：37) 则将精讲多练量化，精讲多练的比例应为3：7，这样自然就提高了学生的开口率"],"q":"四、精讲多练原则《教师标准》规定的口语教学第二条基本原则就是“注重精讲多练，提高学生开口率”。《对外汉语教学初级阶段课程规范》(王钟华，1999：37) 则将精讲多练量化，精讲多练的比例应为3：7，这样自然就提高了学生的开口率。","w":"normal","e":["原书正文"]},{"t":"【原文】口语课的精讲应当立足于功","y":"教材原文","p":["口语课的精讲应当立足于功能，即讲清特定情景下的特定交际功能，以及完成特定功能的语言项目，以功能统语法","多练即以任务为纲来组织课堂活动","可以将课堂的学生活动切分为各自准备 (individual work)、双人练习 (pair work)、小组讨论 (group work)、班级活动 (class work) 等"],"q":"口语课的精讲应当立足于功能，即讲清特定情景下的特定交际功能，以及完成特定功能的语言项目，以功能统语法。多练即以任务为纲来组织课堂活动。可以将课堂的学生活动切分为各自准备 (individual work)、双人练习 (pair work)、小组讨论 (group work)、班级活动 (class work) 等。","w":"normal","e":["原书正文"]},{"t":"【原文】教学过程中要注意师生互动","y":"教材原文","p":["教学过程中要注意师生互动 (interaction)","教学过程就是师生交际的过程","这一过程的话语基本结构为: 引发——反应——反馈(IRF: initiation-response-feedback)","这一结构在具体运用时可以进一步扩展 (李悦娥、范宏雅，2002：16)：教师向学生发问，学生应答时有偏误，教师做出哪怕最简单的反馈： “嗯?”学生改正过来，教师给予积极的反馈:“很好!”这样就扩展为“引发——反应:——反馈:——反应₂——反馈₂” (IR₁F₁R₂F₂)结构"],"q":"教学过程中要注意师生互动 (interaction)。教学过程就是师生交际的过程。这一过程的话语基本结构为: 引发——反应——反馈(IRF: initiation-response-feedback)。这一结构在具体运用时可以进一步扩展 (李悦娥、范宏雅，2002：16)：教师向学生发问，学生应答时有偏误，教师做出哪怕最简单的反馈： “嗯?”学生改正过来，教","w":"normal","e":["原书正文"]},{"t":"【原文】IRF 是教师提问模式，","y":"教材原文","p":["IRF 是教师提问模式，还有教师指令模式I-RS-F、多向互动模式 转述模式 传递模式 学生引发模式 (F)、学生协助引发模式 等 (陶思佳，2011)","多种互动模式为口语课的精讲巧练提供了操作性很强的手段"],"q":"IRF 是教师提问模式，还有教师指令模式I-RS-F、多向互动模式 转述模式 传递模式 学生引发模式 (F)、学生协助引发模式 等 (陶思佳，2011)。多种互动模式为口语课的精讲巧练提供了操作性很强的手段。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c17-s03","t":"第三节 阅读课怎么教词汇？","w":"normal","n":8,"k":[{"t":"【原文】三、语言点练习环节语言点","y":"教材原文","p":["三、语言点练习环节语言点的练习一般包括替换练习、变换练习、完成句子、完成会话等类型"],"q":"三、语言点练习环节语言点的练习一般包括替换练习、变换练习、完成句子、完成会话等类型。","w":"normal","e":["原书正文"]},{"t":"【原文】替换练习是一种机械操练，","y":"教材原文","p":["替换练习是一种机械操练，持续时间不宜太长","替换训练可以是各自活动，默念或小声念，或全班齐诵","如果是对话形式，也可以连环操作：A问B，B回答","B问C，C 回答"],"q":"替换练习是一种机械操练，持续时间不宜太长。替换训练可以是各自活动，默念或小声念，或全班齐诵。如果是对话形式，也可以连环操作：A问B，B回答； B问C，C 回答; C问D, D回答; D问E……","w":"normal","e":["原书正文"]},{"t":"【原文】变换练习可以有多种形式，","y":"教材原文","p":["变换练习可以有多种形式，如：肯定句和否定句之间的变换，陈述句和疑问句之间的变换，“把”字句、“被”字句和一般句式之间的变换，还可以进行单句和复句之间的变换"],"q":"变换练习可以有多种形式，如：肯定句和否定句之间的变换，陈述句和疑问句之间的变换，“把”字句、“被”字句和一般句式之间的变换，还可以进行单句和复句之间的变换。","w":"normal","e":["原书正文"]},{"t":"【原文】完成句子是根据给出的词语","y":"教材原文","p":["完成句子是根据给出的词语和表达式来做的，它是一种半机械半自由的练习","如《301》第二十五课的“用所给的词语完成句子”："],"q":"完成句子是根据给出的词语和表达式来做的，它是一种半机械半自由的练习。如《301》第二十五课的“用所给的词语完成句子”：","w":"normal","e":["原书正文"]},{"t":"【原文】那个商店的东西","y":"教材原文","p":["(又……又……)要是我有钱，","(就)很多口语课本都有完成会话的练习","在做练习时，强调根据上下文来补足缺失的部分，采用先个人活动、后两人对话的方式","在开始阶段，并不要求都能用汉字写下来，可以用拼音，做其他练习也是这样"],"q":"那个商店的东西 。(又……又……)要是我有钱， 。(就)很多口语课本都有完成会话的练习。在做练习时，强调根据上下文来补足缺失的部分，采用先个人活动、后两人对话的方式。在开始阶段，并不要求都能用汉字写下来，可以用拼音，做其他练习也是这样。如《301》第三十三课的“完成会话”：","w":"normal","e":["原书正文"]},{"t":"【原文】A: 请问, 一个房间 ","y":"教材原文","p":["A: 请问, 一个房间 (1) ?B： 一天八十块"],"q":"A: 请问, 一个房间 (1) ?B： 一天八十块。","w":"normal","e":["原书正文"]},{"t":"【原文】A: (3) ?B：很方","y":"教材原文","p":["A: (3) ?B：很方便，一天二十四小时有热水"],"q":"A: (3) ?B：很方便，一天二十四小时有热水。","w":"normal","e":["原书正文"]},{"t":"【原文】学生已经学过用“吗”的问","y":"教材原文","p":["学生已经学过用“吗”的问句和用疑问代词的问句，根据上下文不难完成","空格(1) 和(2) 要用针对数词的疑问代词，要学生注意“多少”和“几”的区别","根据住旅馆的情景和下文“一天二十四小时有热水”，知道空格 (3) 问的是： “洗澡方便吗?”空格 (3) 和(4) 都是用“吗”的一般疑问句，汉语这样的问句采取简略形式作肯定或否定回答，通常只要用到问句中的谓词","(4) 处只要填“能打”或者“能”就可以了，并不要求完整的句子，这里也可以否定形式作答"],"q":"学生已经学过用“吗”的问句和用疑问代词的问句，根据上下文不难完成。空格(1) 和(2) 要用针对数词的疑问代词，要学生注意“多少”和“几”的区别。根据住旅馆的情景和下文“一天二十四小时有热水”，知道空格 (3) 问的是： “洗澡方便吗?”空格 (3) 和(4) 都是用“吗”的一般疑问句，汉语这样的问句采取简略形式作肯定或否定回答，通常只要用到问句中的谓词。 ","w":"normal","e":["原书正文"]}]},{"id":"rumen-c17-s04","t":"第四节 如何把阅读课上得生动有趣？","w":"normal","n":8,"k":[{"t":"【原文】提问这个步骤也可以有两种","y":"教材原文","p":["提问这个步骤也可以有两种选择：如果全班大部分同学接受能力较好，老师可以提高难度，让学生合上课本回答问题","对于水平较低的同学，在一个问题没有回答出来之后可以允许其翻开课本，补答问题"],"q":"提问这个步骤也可以有两种选择：如果全班大部分同学接受能力较好，老师可以提高难度，让学生合上课本回答问题； 对于水平较低的同学，在一个问题没有回答出来之后可以允许其翻开课本，补答问题。","w":"normal","e":["原书正文"]},{"t":"【原文】3. 进行复述练习首先可","y":"教材原文","p":["3. 进行复述练习首先可以做简单的对话大意复述，如："],"q":"3. 进行复述练习首先可以做简单的对话大意复述，如：","w":"normal","e":["原书正文"]},{"t":"【原文】教师问：玛丽约大卫干什么","y":"教材原文","p":["教师问：玛丽约大卫干什么?学生答：看京剧","板书：玛丽约大卫一起去看京剧老师问：什么时候?学生答：星期六","板书：(原句上加入) 星期六"],"q":"教师问：玛丽约大卫干什么?学生答：看京剧。 板书：玛丽约大卫一起去看京剧老师问：什么时候?学生答：星期六。 板书：(原句上加入) 星期六","w":"normal","e":["原书正文"]},{"t":"【原文】老师问：去哪儿看??学生","y":"教材原文","p":["老师问：去哪儿看??学生答：人民剧院","板书：(原句上加入) 人民剧场老师问：听说京剧怎么样?学生答：听说很有意思","板书：(原句上加入) 一个很有意思的"],"q":"老师问：去哪儿看??学生答：人民剧院。 板书：(原句上加入) 人民剧场老师问：听说京剧怎么样?学生答：听说很有意思。 板书：(原句上加入) 一个很有意思的","w":"normal","e":["原书正文"]},{"t":"【原文】最后就组成一个长句子：“","y":"教材原文","p":["最后就组成一个长句子：“玛丽约大卫星期六一起去人民剧院看一个很有意思的京剧"],"q":"最后就组成一个长句子：“玛丽约大卫星期六一起去人民剧院看一个很有意思的京剧。”","w":"normal","e":["原书正文"]},{"t":"【原文】另外，也可以利用关键字词","y":"教材原文","p":["另外，也可以利用关键字词或符号，提示学生复述出整篇对话，如："],"q":"另外，也可以利用关键字词或符号，提示学生复述出整篇对话，如：","w":"normal","e":["原书正文"]},{"t":"【原文】教师问：大卫看过京剧吗?","y":"教材原文","p":["教师问：大卫看过京剧吗?学生答：没看过","板书：没老师问：他想看吗?学生答：他很想看","板书：想看老师问：他知道哪儿演吗?"],"q":"教师问：大卫看过京剧吗?学生答：没看过。 板书：没老师问：他想看吗?学生答：他很想看。 板书：想看老师问：他知道哪儿演吗?","w":"normal","e":["原书正文"]},{"t":"【原文】学生答：人民剧院常演","y":"教材原文","p":["学生答：人民剧院常演","板书：人民444 对外汉语教学入门 (第三版)老师问：大卫去看吗?学生答：当然"],"q":"学生答：人民剧院常演。 板书：人民444 对外汉语教学入门 (第三版)老师问：大卫去看吗?学生答：当然。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c17-s05","t":"第五节 报刊阅读课","w":"normal","n":8,"k":[{"t":"【原文】3) 如果花了本来不应该","y":"教材原文","p":["3) 如果花了本来不应该花的钱，可以叫花什么钱? (花冤枉钱)"],"q":"3) 如果花了本来不应该花的钱，可以叫花什么钱? (花冤枉钱)","w":"normal","e":["原书正文"]},{"t":"【原文】4) 如果你和别人发生了","y":"教材原文","p":["4) 如果你和别人发生了一些问题，特别是受到了让你不满意的服务时，你可以怎么做? (交涉)"],"q":"4) 如果你和别人发生了一些问题，特别是受到了让你不满意的服务时，你可以怎么做? (交涉)","w":"normal","e":["原书正文"]},{"t":"【原文】5) 交涉的时候，可以说","y":"教材原文","p":["5) 交涉的时候，可以说些什么? 对方可能怎么回答? (总结交涉用句型)450 对外汉语教学入门 (第三版)二、课文的朗读与教学 (15分钟)"],"q":"5) 交涉的时候，可以说些什么? 对方可能怎么回答? (总结交涉用句型)450 对外汉语教学入门 (第三版)二、课文的朗读与教学 (15分钟)","w":"normal","e":["原书正文"]},{"t":"【原文】课文二相对比较简单，需要","y":"教材原文","p":["课文二相对比较简单，需要让学生理解的词语是“高峰”“显示”“蒙”“绕道”，希望学生掌握的短语是“为⋯⋯着想”“够可以的”“好心当成驴肝肺”"],"q":"课文二相对比较简单，需要让学生理解的词语是“高峰”“显示”“蒙”“绕道”，希望学生掌握的短语是“为⋯⋯着想”“够可以的”“好心当成驴肝肺”。","w":"normal","e":["原书正文"]},{"t":"【原文】1. 话题导入 (2分钟","y":"教材原文","p":["1. 话题导入 (2分钟)教师提问：在生活中，如果你坐出租车，你最容易遇到什么麻烦? 学生可能回答：“司机听不懂我的话","”⋯⋯教师根据回答继续提问：“什么时间最容易堵车?”(引入生词“上下班高峰”，配合板书)“如果你不会说汉语，你怎么知道应该付给司机多少钱?”(引入生词“表上显示⋯⋯钱”“电脑上显示⋯⋯”，配合板书) “如果司机骗你，你还可以说‘他蒙我’ (但是一般北方用得比较多)","”“如果司机知道你不认识路，所以故意走一条比较远的路，你可以说他怎么样?”(引入生词“绕道”)"],"q":"1. 话题导入 (2分钟)教师提问：在生活中，如果你坐出租车，你最容易遇到什么麻烦? 学生可能回答：“司机听不懂我的话。”“堵车。”“司机他骗我。”⋯⋯教师根据回答继续提问：“什么时间最容易堵车?”(引入生词“上下班高峰”，配合板书)“如果你不会说汉语，你怎么知道应该付给司机多少钱?”(引入生词“表上显示⋯⋯钱”“电脑上显示⋯⋯”，配合板书) “如果司机骗你","w":"normal","e":["原书正文"]},{"t":"【原文】2. 带读生词及注释 (","y":"教材原文","p":["2. 带读生词及注释 (3分钟)教师带读生词及注释部分，有助于学生复习上面引入的几个生词","注释部分停顿并反复，留给学生标注拼音的时间"],"q":"2. 带读生词及注释 (3分钟)教师带读生词及注释部分，有助于学生复习上面引入的几个生词。注释部分停顿并反复，留给学生标注拼音的时间。","w":"normal","e":["原书正文"]},{"t":"【原文】3. 朗读课文 (5分钟","y":"教材原文","p":["3. 朗读课文 (5分钟)将班上的学生分为两部分，分别朗读司机和乘客的对话，教师将朗读过程中出现的错误或不准确的词语标注在黑板上，学生读完后，教师再进行纠正"],"q":"3. 朗读课文 (5分钟)将班上的学生分为两部分，分别朗读司机和乘客的对话，教师将朗读过程中出现的错误或不准确的词语标注在黑板上，学生读完后，教师再进行纠正。","w":"normal","e":["原书正文"]},{"t":"【原文】4. 听课文，并根据课文","y":"教材原文","p":["4. 听课文，并根据课文内容提问 (5分钟)先放课文录音，接着老师读课文+注释部分 (停顿并反复)，最后提问"],"q":"4. 听课文，并根据课文内容提问 (5分钟)先放课文录音，接着老师读课文+注释部分 (停顿并反复)，最后提问。","w":"normal","e":["原书正文"]}]}]},{"id":"rumen-c18","t":"第十八章 写作课教学","w":"normal","s":[{"id":"rumen-c18-s01","t":"第一节 汉语写作教学的特点","w":"normal","n":8,"k":[{"t":"【原文】有些学生认为很难的阅读理","y":"教材原文","p":["有些学生认为很难的阅读理解题目，实际上并不是由于原文难度高，而是由于提问的角度很刁钻 (如“文章没有说，但是我们可以看出⋯⋯”这样的题目)，或者选项有干扰性大或超出原文的地方","例如《教程》中的课文《旗袍》中有一个选择题："],"q":"有些学生认为很难的阅读理解题目，实际上并不是由于原文难度高，而是由于提问的角度很刁钻 (如“文章没有说，但是我们可以看出⋯⋯”这样的题目)，或者选项有干扰性大或超出原文的地方。例如《教程》中的课文《旗袍》中有一个选择题：","w":"normal","e":["原书正文"]},{"t":"【原文】旗袍的“黄金时代”是什么","y":"教材原文","p":["旗袍的“黄金时代”是什么意思?A. 那时的旗袍喜欢用金色 B. 那时旗袍文化成熟而又代表性C. 那时的旗袍最贵 D. 那时的旗袍一直流行到现在"],"q":"旗袍的“黄金时代”是什么意思?A. 那时的旗袍喜欢用金色 B. 那时旗袍文化成熟而又代表性C. 那时的旗袍最贵 D. 那时的旗袍一直流行到现在","w":"normal","e":["原书正文"]},{"t":"【原文】原文是这样的：“全世界家","y":"教材原文","p":["原文是这样的：“全世界家喻户晓的旗袍，被称作‘Chinese dress’ 的旗袍，实际上是指30年代的旗袍","旗袍文化完成于30年代，那是旗袍的黄金时代","”教师应当引导学生通过排除法排除其他选项，获得正确答案，并学习“黄金时代”一词"],"q":"原文是这样的：“全世界家喻户晓的旗袍，被称作‘Chinese dress’ 的旗袍，实际上是指30年代的旗袍。旗袍文化完成于30年代，那是旗袍的黄金时代。”教师应当引导学生通过排除法排除其他选项，获得正确答案，并学习“黄金时代”一词。","w":"normal","e":["原书正文"]},{"t":"【原文】(三) 理解问题设计不足","y":"教材原文","p":["(三) 理解问题设计不足如果教师认为课后练习不足以判定学生是否能基本理解课文意义时，应针对练习没有覆盖的课文部分，另外提出理解问题，要求学生回答"],"q":"(三) 理解问题设计不足如果教师认为课后练习不足以判定学生是否能基本理解课文意义时，应针对练习没有覆盖的课文部分，另外提出理解问题，要求学生回答。","w":"normal","e":["原书正文"]},{"t":"【原文】即使早期人类的一夫一妻关","y":"教材原文","p":["即使早期人类的一夫一妻关系造成了现代男人和女人的体形差距微小，但是差距仍然存在，这又该如何解释? 对此科学家提出了许多理论","其中之一认为，虽然女人并不喜欢那些整天与其他男人打架的男性，但体形比较大的男人却能保证家里食物更充分","与此同时，男性也许喜欢选择体形较小的女人，因为她们消费的食物相对较小"],"q":"即使早期人类的一夫一妻关系造成了现代男人和女人的体形差距微小，但是差距仍然存在，这又该如何解释? 对此科学家提出了许多理论。其中之一认为，虽然女人并不喜欢那些整天与其他男人打架的男性，但体形比较大的男人却能保证家里食物更充分。与此同时，男性也许喜欢选择体形较小的女人，因为她们消费的食物相对较小。","w":"normal","e":["原书正文"]},{"t":"【原文】而这一段实际上两个方面都","y":"教材原文","p":["而这一段实际上两个方面都讲到了，因此，教师可以增加“男性为什么喜欢体形较小的女性?”这样的问题"],"q":"而这一段实际上两个方面都讲到了，因此，教师可以增加“男性为什么喜欢体形较小的女性?”这样的问题。","w":"normal","e":["原书正文"]},{"t":"【原文】(四) 检查理解率的方法","y":"教材原文","p":["(四) 检查理解率的方法阅读开始前和练习完成后，要引导学生正确评价阅读材料和评估自己的理解水平","也就是元认知策略中的读前策略和读后策略","这一点对于那些刚开始上阅读课的学生尤其重要，因为他们特别没有自信","当大约四分之三的学生完成了阅读理解题目时，教师应当开始提问，以检查学生的阅读理解情况"],"q":"(四) 检查理解率的方法阅读开始前和练习完成后，要引导学生正确评价阅读材料和评估自己的理解水平。也就是元认知策略中的读前策略和读后策略。这一点对于那些刚开始上阅读课的学生尤其重要，因为他们特别没有自信。当大约四分之三的学生完成了阅读理解题目时，教师应当开始提问，以检查学生的阅读理解情况。","w":"normal","e":["原书正文"]},{"t":"【原文】常规的做法是教师点某个学","y":"教材原文","p":["常规的做法是教师点某个学生说出答案，并回答为什么选择该答案","教师可以根据问题的难度来选择水平不同的回答者","在巡视时，应当关注那些选择了错误答案的学生，提问时可有针对性地提问他们，找出错误的症结所在"],"q":"常规的做法是教师点某个学生说出答案，并回答为什么选择该答案。教师可以根据问题的难度来选择水平不同的回答者。在巡视时，应当关注那些选择了错误答案的学生，提问时可有针对性地提问他们，找出错误的症结所在。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c18-s02","t":"第二节 写作教学原则","w":"normal","n":8,"k":[{"t":"【原文】(一) 猜词练习《教程》","y":"教材原文","p":["(一) 猜词练习《教程》《阶梯》的阅读技能训练部分有大量的猜词练习，有通过字形猜词、语素猜词、句内词语互释、上下文猜词等"],"q":"(一) 猜词练习《教程》《阶梯》的阅读技能训练部分有大量的猜词练习，有通过字形猜词、语素猜词、句内词语互释、上下文猜词等。","w":"normal","e":["原书正文"]},{"t":"【原文】除了特别容易的练习，一般","y":"教材原文","p":["除了特别容易的练习，一般可要求学生以两人或小组为单位做这些练习","这样做有三个好处：第一，学生一个人做练习，特别容易放弃，然后求助于字典","有同伴时，他们则倾向于先讨论","而我们知道，人的思维在讨论时特别活跃"],"q":"除了特别容易的练习，一般可要求学生以两人或小组为单位做这些练习。这样做有三个好处：第一，学生一个人做练习，特别容易放弃，然后求助于字典； 有同伴时，他们则倾向于先讨论。而我们知道，人的思维在讨论时特别活跃。第二，一般情况是有一个学生已经知道或者更快理解了目标词的意义，他就会向同伴解释词义。在解释的过程中，他不但要利用课本上给出的线索，而且也要动用自己以往的知","w":"normal","e":["原书正文"]},{"t":"【原文】在阅读训练中，如前所述，","y":"教材原文","p":["在阅读训练中，如前所述，应先把需要学生猜测的词语写在黑板上，这就是一种辨认练习","在许多篇章的阅读理解题中，也有不少关于词汇的题目，需要学生在课文中辨认出目标词"],"q":"在阅读训练中，如前所述，应先把需要学生猜测的词语写在黑板上，这就是一种辨认练习。在许多篇章的阅读理解题中，也有不少关于词汇的题目，需要学生在课文中辨认出目标词。","w":"normal","e":["原书正文"]},{"t":"【原文】(二) 词汇联想阅读理解","y":"教材原文","p":["(二) 词汇联想阅读理解篇章中常常有一些有意思的词汇，可加以利用，促使学生进行词汇联想，扩大他们的词汇量","例如《赤道雪峰————乞力马扎罗山》，可以利用赤道引出“南极”“北极” “南回归线” “北回归线”，利用“山顶”引出“山脚” “山腰”，等等","同样，要注意联想适度"],"q":"(二) 词汇联想阅读理解篇章中常常有一些有意思的词汇，可加以利用，促使学生进行词汇联想，扩大他们的词汇量。例如《赤道雪峰————乞力马扎罗山》，可以利用赤道引出“南极”“北极” “南回归线” “北回归线”，利用“山顶”引出“山脚” “山腰”，等等。 同样，要注意联想适度。","w":"normal","e":["原书正文"]},{"t":"【原文】(三) 评价练习评价练习","y":"教材原文","p":["(三) 评价练习评价练习也是一种讨论","如阅读了《悠闲就是快乐》，可以请学生评价一下“悠闲”和“忙碌” 的生活"],"q":"(三) 评价练习评价练习也是一种讨论。如阅读了《悠闲就是快乐》，可以请学生评价一下“悠闲”和“忙碌” 的生活。","w":"normal","e":["原书正文"]},{"t":"【原文】很多年轻教师反映，上阅读","y":"教材原文","p":["很多年轻教师反映，上阅读课最大的困难是单调，学生读，老师讲解","然后，学生又读，老师再讲解⋯⋯周而复始，了无新意，缺乏高潮，教学双方都觉得很沉闷"],"q":"很多年轻教师反映，上阅读课最大的困难是单调，学生读，老师讲解； 然后，学生又读，老师再讲解⋯⋯周而复始，了无新意，缺乏高潮，教学双方都觉得很沉闷。","w":"normal","e":["原书正文"]},{"t":"【原文】这个问题的起因主要有两个","y":"教材原文","p":["这个问题的起因主要有两个：一是跟精读、口语等课程不同，阅读在很大程度上是由单个学生独立完成的，学生与教师的互动很少，与同学的互动则为零","二是阅读基本上是一个输入的训练","根据《国际汉语教师标准》，教师的基本能力包括“了解阅读教学的不同环节，为阅读前、阅读中、阅读后设计相应的任务和活动”，因此，把阅读课上得生动有趣的关键就是能够根据课程内容设置形式多样的阅读任务和课堂活动"],"q":"这个问题的起因主要有两个：一是跟精读、口语等课程不同，阅读在很大程度上是由单个学生独立完成的，学生与教师的互动很少，与同学的互动则为零； 二是阅读基本上是一个输入的训练。根据《国际汉语教师标准》，教师的基本能力包括“了解阅读教学的不同环节，为阅读前、阅读中、阅读后设计相应的任务和活动”，因此，把阅读课上得生动有趣的关键就是能够根据课程内容设置形式多样的阅读任","w":"normal","e":["原书正文"]},{"t":"【原文】一、增加参与感，加强师一","y":"教材原文","p":["一、增加参与感，加强师一生、生一生互动尽量增加一些成对或小组练习的机会，具体做法如前所述","另外，还可以布置学生完成课后作业","要求他们选择自己喜欢的，难度、长短合适的文章，仿照课本处理生词，出阅读理解题，交给教师修改后复印","上课时，教师拿出10~15 分钟作为“××同学时间”，把复印好的某同学选的文章发给大家，由那位同学当老师，主持这篇文章的阅读讲解"],"q":"一、增加参与感，加强师一生、生一生互动尽量增加一些成对或小组练习的机会，具体做法如前所述。另外，还可以布置学生完成课后作业。要求他们选择自己喜欢的，难度、长短合适的文章，仿照课本处理生词，出阅读理解题，交给教师修改后复印。上课时，教师拿出10~15 分钟作为“××同学时间”，把复印好的某同学选的文章发给大家，由那位同学当老师，主持这篇文章的阅读讲解。这个做法","w":"normal","e":["原书正文"]}]},{"id":"rumen-c18-s03","t":"第三节 课堂教学方法","w":"normal","n":8,"k":[{"t":"【原文】3. 假设有一篇关于乐高","y":"教材原文","p":["3. 假设有一篇关于乐高的文章，词汇难度很大","但是一个阅读水平一般的学生却轻松地完成了阅读理解习题，原因可能是什么? 请用本章第一节的概念来解释"],"q":"3. 假设有一篇关于乐高的文章，词汇难度很大。但是一个阅读水平一般的学生却轻松地完成了阅读理解习题，原因可能是什么? 请用本章第一节的概念来解释。","w":"normal","e":["原书正文"]},{"t":"【原文】4. A、B、C三个学生","y":"教材原文","p":["4. A、B、C三个学生，汉语水平由高到低和阅读速度由快到慢排列为A>B>C","他们同时阅读一篇文章，你会在何时开始检查他们的阅读理解情况?"],"q":"4. A、B、C三个学生，汉语水平由高到低和阅读速度由快到慢排列为A>B>C。他们同时阅读一篇文章，你会在何时开始检查他们的阅读理解情况?","w":"normal","e":["原书正文"]},{"t":"【原文】5. 检测学生是否理解“","y":"教材原文","p":["5. 检测学生是否理解“黑板”的构词方式，以下哪题更好?"],"q":"5. 检测学生是否理解“黑板”的构词方式，以下哪题更好?","w":"normal","e":["原书正文"]},{"t":"【原文】A. 偏正式 B. 述补","y":"教材原文","p":["A. 偏正式 B. 述补式 C. 动宾式 D. 联合式"],"q":"A. 偏正式 B. 述补式 C. 动宾式 D. 联合式","w":"normal","e":["原书正文"]},{"t":"【原文】(2) 将“粉丝”“阶层","y":"教材原文","p":["(2) 将“粉丝”“阶层”“出色”作为可猜测词，如何利用语境引导学生猜词?"],"q":"(2) 将“粉丝”“阶层”“出色”作为可猜测词，如何利用语境引导学生猜词?","w":"normal","e":["原书正文"]},{"t":"【原文】英国伯明翰大学文化研究博","y":"教材原文","p":["英国伯明翰大学文化研究博士刘娜曾把不同美剧的粉丝做了阶层上的区分","美剧迷472 对外汉语教学入门 (第三版)大体可分为三类：第一类是以喜看《老友记》等经典美剧为代表，这类美剧迷的数量众多，基本涵盖了整个都市白领阶层","第二类是以喜看《越狱》、 《24》等剧为代表，他们当中男性明显多于女性，职业上大都集中于大学生和公司职员","第三类是以喜爱《人人都爱雷蒙德》等剧为代表的粉丝，这类粉丝一般具有更出色的英文能力和更高的教育背景，因此更能欣赏这类剧中的文化意味和幽默卖点"],"q":"英国伯明翰大学文化研究博士刘娜曾把不同美剧的粉丝做了阶层上的区分。美剧迷472 对外汉语教学入门 (第三版)大体可分为三类：第一类是以喜看《老友记》等经典美剧为代表，这类美剧迷的数量众多，基本涵盖了整个都市白领阶层； 第二类是以喜看《越狱》、 《24》等剧为代表，他们当中男性明显多于女性，职业上大都集中于大学生和公司职员； 第三类是以喜爱《人人都爱雷蒙德》等","w":"normal","e":["原书正文"]},{"t":"【原文】美剧作为一种时尚潮流，一","y":"教材原文","p":["美剧作为一种时尚潮流，一种美国文化代表，它捕获的粉丝群，可以说是中国的精英阶层，这些人的思考方式、文化品位无疑会对中国的未来产生巨大影响","于是近来有中国学者发出感叹：看美剧不止是一种娱乐方式"],"q":"美剧作为一种时尚潮流，一种美国文化代表，它捕获的粉丝群，可以说是中国的精英阶层，这些人的思考方式、文化品位无疑会对中国的未来产生巨大影响。于是近来有中国学者发出感叹：看美剧不止是一种娱乐方式。","w":"normal","e":["原书正文"]},{"t":"【原文】8. 下面是一篇报刊新闻","y":"教材原文","p":["8. 下面是一篇报刊新闻","如果你是报刊阅读课的教师，在学生开始阅读前，你将会提醒学生关注哪些新闻语体中常见的词语或表达法? 还有哪些对理解句子的意义起关键作用的词语?"],"q":"8. 下面是一篇报刊新闻。如果你是报刊阅读课的教师，在学生开始阅读前，你将会提醒学生关注哪些新闻语体中常见的词语或表达法? 还有哪些对理解句子的意义起关键作用的词语?","w":"normal","e":["原书正文"]}]}]},{"id":"rumen-c19","t":"第十九章 专用汉语","w":"normal","s":[{"id":"rumen-c19-s01","t":"第一节 专用汉语的定义与分类","w":"normal","n":8,"k":[{"t":"【原文】写作往往要解决“为何写、","y":"教材原文","p":["写作往往要解决“为何写、写什么、怎么写”等问题，写作的交际作用不如其他技能直接、应用频率高，因此更应该在教学中让学生体会写作的实用性和交际价值"],"q":"写作往往要解决“为何写、写什么、怎么写”等问题，写作的交际作用不如其他技能直接、应用频率高，因此更应该在教学中让学生体会写作的实用性和交际价值。应","w":"normal","e":["原书正文"]},{"t":"【原文】478| 对外汉语教学入","y":"教材原文","p":["478| 对外汉语教学入门 (第三版)用文体的写作训练能较好、较直接地体现写作的交际使用价值，因此要加强应用文体的写作训练"],"q":"478| 对外汉语教学入门 (第三版)用文体的写作训练能较好、较直接地体现写作的交际使用价值，因此要加强应用文体的写作训练。","w":"normal","e":["原书正文"]},{"t":"【原文】有交际价值的写作容易使学","y":"教材原文","p":["有交际价值的写作容易使学生产生兴趣，而且应用文的写作相比于其他文体的写作，非语言技能因素的影响小一些，比较适合中级汉语水平的学生练习"],"q":"有交际价值的写作容易使学生产生兴趣，而且应用文的写作相比于其他文体的写作，非语言技能因素的影响小一些，比较适合中级汉语水平的学生练习。","w":"normal","e":["原书正文"]},{"t":"【原文】应用文的种类可以根据学生","y":"教材原文","p":["应用文的种类可以根据学生的实际需要教授，不仅是当前的需要，如请假条、留言条、家信等，而且要顾及留学生未来的可能需要，如投诉信、求职信、实验报告、新闻消息等"],"q":"应用文的种类可以根据学生的实际需要教授，不仅是当前的需要，如请假条、留言条、家信等，而且要顾及留学生未来的可能需要，如投诉信、求职信、实验报告、新闻消息等。","w":"normal","e":["原书正文"]},{"t":"【原文】二、联系性原则写作教学要","y":"教材原文","p":["二、联系性原则写作教学要注重与其他语言技能的联系，尤其是口语和阅读的关系"],"q":"二、联系性原则写作教学要注重与其他语言技能的联系，尤其是口语和阅读的关系。","w":"normal","e":["原书正文"]},{"t":"【原文】从语言的技能来说，口语和","y":"教材原文","p":["从语言的技能来说，口语和写作都属于输出技能","但就难度而言，写作比口语难，习得的顺序一般是先口语，后写作","为了减少写作的难度，我们通常在课堂上通过口语的练习，形成写作的雏形","俗话说：熟读唐诗三百首，不会作诗也会吟"],"q":"从语言的技能来说，口语和写作都属于输出技能； 但就难度而言，写作比口语难，习得的顺序一般是先口语，后写作。为了减少写作的难度，我们通常在课堂上通过口语的练习，形成写作的雏形。俗话说：熟读唐诗三百首，不会作诗也会吟。说得多，说得好，写自然不会差。可见，先口头表达，再笔头表达，是输出训练的两个相连的部分。从前者过渡到后者，是写作教学的一个途径。","w":"normal","e":["原书正文"]},{"t":"【原文】写作和听、阅读的关系也很","y":"教材原文","p":["写作和听、阅读的关系也很密切","从写的需求来说，有时获取了具体信息，写的交际活动才可以继续下去","例如，接一个电话，只有听清楚来电的信息，记录清楚信息后，才能写留言条","要填写表格，只有明确填表的要求，才能填写相关的信息"],"q":"写作和听、阅读的关系也很密切。从写的需求来说，有时获取了具体信息，写的交际活动才可以继续下去。例如，接一个电话，只有听清楚来电的信息，记录清楚信息后，才能写留言条； 要填写表格，只有明确填表的要求，才能填写相关的信息。否则，写的交际活动会中断或无效。","w":"normal","e":["原书正文"]},{"t":"【原文】从写的能力的培养来说，只","y":"教材原文","p":["从写的能力的培养来说，只有在阅读范文之后，才能模仿写作","因此，对范文的理解和掌握是之后模仿写作的前提","只有看得多了，才可以上升到写","看是输入，写是输出，先输入后输出"],"q":"从写的能力的培养来说，只有在阅读范文之后，才能模仿写作。因此，对范文的理解和掌握是之后模仿写作的前提。只有看得多了，才可以上升到写。看是输入，写是输出，先输入后输出。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c19-s02","t":"第二节 专用汉语教学大纲与课程设置","w":"normal","n":8,"k":[{"t":"【原文】3. 说后写先练习说，说","y":"教材原文","p":["3. 说后写先练习说，说完以后，把说过的话写下来","刚开始练习说后写，可以说得比较简单","接着提出更高的标准，要求说相对完整的语段，或者表达一个观点","像议论文的写作，论点一开始可能不是特别明确，论据可能不是特别充分，思路可能不是特别清晰，这都没有关系"],"q":"3. 说后写先练习说，说完以后，把说过的话写下来。刚开始练习说后写，可以说得比较简单。接着提出更高的标准，要求说相对完整的语段，或者表达一个观点。像议论文的写作，论点一开始可能不是特别明确，论据可能不是特别充分，思路可能不是特别清晰，这都没有关系。通过自己说、同学的提问、相互的讨论，会使论点变得明确，论据充分，思路清楚。说清楚了，再写下来。","w":"normal","e":["原书正文"]},{"t":"【原文】这种先说后写的方式能有效","y":"教材原文","p":["这种先说后写的方式能有效地缓解学生害怕写作的紧张情绪，说得越多，讨论得越486 对外汉语教学入门(第三版)充分，最后写就越容易","学生在说的过程中有语病的，可以先纠正","在初步写的过程中有错漏的，可以及时补正"],"q":"这种先说后写的方式能有效地缓解学生害怕写作的紧张情绪，说得越多，讨论得越486 对外汉语教学入门(第三版)充分，最后写就越容易。学生在说的过程中有语病的，可以先纠正； 在初步写的过程中有错漏的，可以及时补正。","w":"normal","e":["原书正文"]},{"t":"【原文】4. 看后写借助于一些形","y":"教材原文","p":["4. 看后写借助于一些形象化的材料进行写作练习","这些材料可以是照片、广告、地图、数据表、漫画、画报等，也可以是电视小品、电影、各种表演等","如在学习写作比较类文章时，可以让学生看下边的两个广告 (图18.4)，找一找这两套房子之间的异同，运用学过的表达方法写几个表示比较的句子"],"q":"4. 看后写借助于一些形象化的材料进行写作练习。这些材料可以是照片、广告、地图、数据表、漫画、画报等，也可以是电视小品、电影、各种表演等。如在学习写作比较类文章时，可以让学生看下边的两个广告 (图18.4)，找一找这两套房子之间的异同，运用学过的表达方法写几个表示比较的句子。","w":"normal","e":["原书正文"]},{"t":"【原文】5. 读后写通过阅读，参","y":"教材原文","p":["5. 读后写通过阅读，参照范文的格式和结构进行模仿写作，如应用文以及各种文体的写作","还可以看一些比较长的记叙文、小说等，然后写读后感等","看一些论说性文体，做笔记、摘记等"],"q":"5. 读后写通过阅读，参照范文的格式和结构进行模仿写作，如应用文以及各种文体的写作。还可以看一些比较长的记叙文、小说等，然后写读后感等； 看一些论说性文体，做笔记、摘记等。","w":"normal","e":["原书正文"]},{"t":"【原文】6. 读后续写给学生文章","y":"教材原文","p":["6. 读后续写给学生文章的开头，让学生接着写","续写可以以全体学生参与的方式进行，即一个人写一句地续写","也可以分组进行续写","还可以以个体的方式进行，即各人写各人的"],"q":"6. 读后续写给学生文章的开头，让学生接着写。续写可以以全体学生参与的方式进行，即一个人写一句地续写； 也可以分组进行续写； 还可以以个体的方式进行，即各人写各人的。","w":"normal","e":["原书正文"]},{"t":"【原文】三、作文讲评作文讲评就是","y":"教材原文","p":["三、作文讲评作文讲评就是对学生作文中出现的各种问题进行分析、讲解或讨论","主要目的是通过信息的反馈，使学生书面语的表达更加规范","作文讲评可以分为教师讲评、分组讨论、学生自改和学生互评几种方式"],"q":"三、作文讲评作文讲评就是对学生作文中出现的各种问题进行分析、讲解或讨论。主要目的是通过信息的反馈，使学生书面语的表达更加规范。作文讲评可以分为教师讲评、分组讨论、学生自改和学生互评几种方式。","w":"normal","e":["原书正文"]},{"t":"【原文】(一) 教师讲评教师主导","y":"教材原文","p":["(一) 教师讲评教师主导的讲评比较常见，通常采用以下几种形式"],"q":"(一) 教师讲评教师主导的讲评比较常见，通常采用以下几种形式。","w":"normal","e":["原书正文"]},{"t":"【原文】1. 肯定式在作文讲评中","y":"教材原文","p":["1. 肯定式在作文讲评中肯定、表扬学生作文中用得好的词语、表达得体的句子，或通篇语句通顺的作文、立意新颖的作文","教学实践证明，肯定和表扬可以激发学生写作的热情，提高学生写作的兴趣，因此，这是每一次作文讲评不可缺少的讲评方式","可以采取教师在黑板上板书作文中用得好的词语、句子，或请学生朗读写得好的语段或全文，或将写得好的句子、语段、作文印发给学生等方法表示鼓励"],"q":"1. 肯定式在作文讲评中肯定、表扬学生作文中用得好的词语、表达得体的句子，或通篇语句通顺的作文、立意新颖的作文。教学实践证明，肯定和表扬可以激发学生写作的热情，提高学生写作的兴趣，因此，这是每一次作文讲评不可缺少的讲评方式。可以采取教师在黑板上板书作文中用得好的词语、句子，或请学生朗读写得好的语段或全文，或将写得好的句子、语段、作文印发给学生等方法表示鼓励。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c19-s03","t":"第三节 专用汉语教学方法","w":"normal","n":8,"k":[{"t":"【原文】1. 生词 (请学生指出","y":"教材原文","p":["1. 生词 (请学生指出不明白的生词，然后通过语境讲解)"],"q":"1. 生词 (请学生指出不明白的生词，然后通过语境讲解)","w":"normal","e":["原书正文"]},{"t":"【原文】3. 找出范文中具体的时","y":"教材原文","p":["3. 找出范文中具体的时间、不确定的时间、时间的推移的表达"],"q":"3. 找出范文中具体的时间、不确定的时间、时间的推移的表达。","w":"normal","e":["原书正文"]},{"t":"【原文】总结：在文章中恰当地运用","y":"教材原文","p":["总结：在文章中恰当地运用时间词，可以起连接的作用"],"q":"总结：在文章中恰当地运用时间词，可以起连接的作用。","w":"normal","e":["原书正文"]},{"t":"【原文】1) 教师将表示“时间推","y":"教材原文","p":["1) 教师将表示“时间推移”的常用表达写在黑板上："],"q":"1) 教师将表示“时间推移”的常用表达写在黑板上：","w":"normal","e":["原书正文"]},{"t":"【原文】第二天、一个星期以后、过","y":"教材原文","p":["第二天、一个星期以后、过了一些日子、后来、从那以后、时间一天天地过去了、三年后"],"q":"第二天、一个星期以后、过了一些日子、后来、从那以后、时间一天天地过去了、三年后","w":"normal","e":["原书正文"]},{"t":"【原文】2) 教师问学生：你们都","y":"教材原文","p":["2) 教师问学生：你们都知道有哪些运动项目? 学生回答：跑步，打排球，打蓝球，游泳，打网球，打高尔夫球，滑冰……"],"q":"2) 教师问学生：你们都知道有哪些运动项目? 学生回答：跑步，打排球，打蓝球，游泳，打网球，打高尔夫球，滑冰……","w":"normal","e":["原书正文"]},{"t":"【原文】3) 教师：我们现在一起","y":"教材原文","p":["3) 教师：我们现在一起用“时间推移”和运动项目的词语编一个关于麦克的故事","有一天麦克忽然觉得锻炼身体很重要，所以，第二天起床以后，他就开始跑步","你觉得麦克跑步跑得怎么样?"],"q":"3) 教师：我们现在一起用“时间推移”和运动项目的词语编一个关于麦克的故事。有一天麦克忽然觉得锻炼身体很重要，所以，第二天起床以后，他就开始跑步。你觉得麦克跑步跑得怎么样?","w":"normal","e":["原书正文"]},{"t":"【原文】教师：一个星期以后，麦克","y":"教材原文","p":["教师：一个星期以后，麦克不跑步了","他怎么样?学生2：他打排球"],"q":"教师：一个星期以后，麦克不跑步了。他怎么样?学生2：他打排球。","w":"normal","e":["原书正文"]}]},{"id":"rumen-c19-s04","t":"第四节 专用汉语的测试和评估","w":"normal","n":8,"k":[{"t":"【原文】目前，大部分高校开设的商","y":"教材原文","p":["目前，大部分高校开设的商务汉语技能课程主要有商务汉语综合课、商务口语交际、商务写作、商务阅读、经贸洽谈、经济导读、商务文书概论等，商务知识类课程主要有世界经济概论、经济学原理、国际贸易实务、市场营销学、涉外经济法规、当代中国经济与社会等"],"q":"目前，大部分高校开设的商务汉语技能课程主要有商务汉语综合课、商务口语交际、商务写作、商务阅读、经贸洽谈、经济导读、商务文书概论等，商务知识类课程主要有世界经济概论、经济学原理、国际贸易实务、市场营销学、涉外经济法规、当代中国经济与社会等。","w":"normal","e":["原书正文"]},{"t":"【原文】(二) 医学汉语学习职业","y":"教材原文","p":["(二) 医学汉语学习职业类医学汉语的留学生，一般已学过通用汉语，汉语水平达到 HSK 四级或以上，而且已用英语学习了与职业相关的医学知识","医学汉语课程一般在三、四年级和去医院见习前开设，其目的是帮助留学生适应实习工作，能用汉语跟病患及家属、医护人员交流沟通"],"q":"(二) 医学汉语学习职业类医学汉语的留学生，一般已学过通用汉语，汉语水平达到 HSK 四级或以上，而且已用英语学习了与职业相关的医学知识。医学汉语课程一般在三、四年级和去医院见习前开设，其目的是帮助留学生适应实习工作，能用汉语跟病患及家属、医护人员交流沟通。","w":"normal","e":["原书正文"]},{"t":"【原文】职业类医学汉语课程侧重于","y":"教材原文","p":["职业类医学汉语课程侧重于对学生听说能力和交际能力的训练","教学内容要求与临床实习需要的汉语表达尤其是口语表达密切相关，主要包括常用人体各种结构、常用药物、病人的体征、主要症状和诊断等方面的词汇，用于询问病人病情、讨论病例和治疗方案、回答病人疑问、向病人做各种解释等的常用句式以及常见实验报告内容的表述、病历的书写，等等"],"q":"职业类医学汉语课程侧重于对学生听说能力和交际能力的训练。教学内容要求与临床实习需要的汉语表达尤其是口语表达密切相关，主要包括常用人体各种结构、常用药物、病人的体征、主要症状和诊断等方面的词汇，用于询问病人病情、讨论病例和治疗方案、回答病人疑问、向病人做各种解释等的常用句式以及常见实验报告内容的表述、病历的书写，等等。","w":"normal","e":["原书正文"]},{"t":"【原文】作为专业汉语课程之一的医","y":"教材原文","p":["作为专业汉语课程之一的医学汉语课程，是为用汉语学习临床医学专业的留学生开设的","课程开设时间在本科一年级","虽然我国要求进入理工农医专业的中文授课留学生"],"q":"作为专业汉语课程之一的医学汉语课程，是为用汉语学习临床医学专业的留学生开设的。课程开设时间在本科一年级。虽然我国要求进入理工农医专业的中文授课留学生","w":"normal","e":["原书正文"]},{"t":"【原文】500 对外汉语教学入门","y":"教材原文","p":["500 对外汉语教学入门(第三版)入系前的HSK水平需达到4级或以上，但留学生没有学习过医学专业课程","进入专业学习后，专业理论课程方面，他们是与中国学生一起大班上课，使用汉语编写的教材，授课语言为汉语，专业课的作业、测验、考试也要求用汉语完成","对于该类留学生来说，用汉语学习医学专业的语言障碍非常大","因此，医学汉语课程的开设目的是要帮助他们扫除语言障碍、看懂专业教科书、听懂专业课，最终顺利完成专业课的学习"],"q":"500 对外汉语教学入门(第三版)入系前的HSK水平需达到4级或以上，但留学生没有学习过医学专业课程。进入专业学习后，专业理论课程方面，他们是与中国学生一起大班上课，使用汉语编写的教材，授课语言为汉语，专业课的作业、测验、考试也要求用汉语完成。对于该类留学生来说，用汉语学习医学专业的语言障碍非常大。因此，医学汉语课程的开设目的是要帮助他们扫除语言障碍、看懂专","w":"normal","e":["原书正文"]},{"t":"【原文】(三) 旅游汉语随着中国","y":"教材原文","p":["(三) 旅游汉语随着中国经济的发展和人民消费水平的提高，出国旅游的中国人越来越多，国外越来越需要懂汉语的导游","同时，旅游也是一种学习语言的好方法","外国留学生来自世界各国，他们来到中国，也常常通过旅游来了解中国","旅游汉语作为一门职业汉语也就应运而生了"],"q":"(三) 旅游汉语随着中国经济的发展和人民消费水平的提高，出国旅游的中国人越来越多，国外越来越需要懂汉语的导游。同时，旅游也是一种学习语言的好方法。外国留学生来自世界各国，他们来到中国，也常常通过旅游来了解中国。旅游汉语作为一门职业汉语也就应运而生了。系列旅游汉语教材也不断面世，如《旅游汉语系列教材：游学中国》《体验汉语旅游篇》等。","w":"normal","e":["原书正文"]},{"t":"【原文】基于职业汉语的特殊需要，","y":"教材原文","p":["基于职业汉语的特殊需要，目前国内的旅游汉语教学以口语交际为主，教学内容主要是与旅游整个行程相关的各项工作，包括组织旅游、景区游览、饭店实务、旅行社实务、旅游发展和相关管理等"],"q":"基于职业汉语的特殊需要，目前国内的旅游汉语教学以口语交际为主，教学内容主要是与旅游整个行程相关的各项工作，包括组织旅游、景区游览、饭店实务、旅行社实务、旅游发展和相关管理等。","w":"normal","e":["原书正文"]},{"t":"【原文】(四) 警务汉语目前，越","y":"教材原文","p":["(四) 警务汉语目前，越来越多的外国警界认识到了警务汉语在本国执法以及跨国合作领域的重要性，自发开始了速成警务汉语培训","为满足中外警界的迫切需求，科学拓宽职业汉语的教学领域，2014年由北京外国语大学张京京等编著并出版了面向执法联络员汉语培训项目的专用系列教材","该套教材包括： 《警务汉语 (生活篇)》，适合零起点学习者","《警务汉语(专业篇· 初级)》，适合具有HSK 2 级至3 级水平的学习者，也可作为HSK4级以上学习者的辅助教材或速成教材"],"q":"(四) 警务汉语目前，越来越多的外国警界认识到了警务汉语在本国执法以及跨国合作领域的重要性，自发开始了速成警务汉语培训。为满足中外警界的迫切需求，科学拓宽职业汉语的教学领域，2014年由北京外国语大学张京京等编著并出版了面向执法联络员汉语培训项目的专用系列教材。该套教材包括： 《警务汉语 (生活篇)》，适合零起点学习者；《警务汉语(专业篇· 初级)》，适合具","w":"normal","e":["原书正文"]}]}]}]},{"d":"zhenti_10_23","t":"南师大汉硕10-23真题带答案","c":[{"id":"zhenti_10_23-c01","t":"全文","w":"normal","s":[{"id":"zhenti_10_23-c01-s01","t":"全文","w":"normal","n":0,"k":[]}]}]},{"d":"zhenti_2026","t":"2026南师大334+445真题","c":[{"id":"zhenti_2026-c01","t":"全文","w":"normal","s":[{"id":"zhenti_2026-c01-s01","t":"全文","w" /* =====================================================================
   1. 物理参数（逐条对应 Compose 源码）
   ===================================================================== */
const SPRING_K   = 400;   // Spring.StiffnessMediumLow
const SPRING_C   = 24;    // DampingRatioLowBouncy 0.6 → c = 2*0.6*sqrt(400)
const TWEEN_FAST = 180;   // LOD tween
const TWEEN_BASE = 220;   // 入场 tween
const LOD_SCALE  = 0.65;  // 语义缩放阈值
const SCALE_MIN  = 0.35;
const SCALE_MAX  = 2.6;
const FIT_MIN    = 0.35;
const FIT_MAX    = 1.3;
/* 横向填满宽度时的缩放上限。
   光栅实测（1440×900，按真实像素统计卡片覆盖，2px 网格）：
     FILL_MAX=1.6 → 视口占用 31.7%，s=1.578，字 20.5px
     FILL_MAX=2.0 → 视口占用 39.6%，s=2.000，字 26.0px
     FILL_MAX=2.4 → 视口占用 40.0%，s=2.047，字 26.6px  ← 最优
     FILL_MAX=2.8 → 与 2.4 完全相同（已被 byW 自然限住）
   1.6 让内容只占屏幕三成，四周大片留白；放到 2.4 后屏幕被用到四成，
   且重叠恒为 0%。再往上没有收益，因为宽度已拟合满。 */
const FILL_MAX   = 2.4;
/* 字号可读下限：取景缩放跌破它就宁可少展，不可看不清。
   autoFill 与 fitView 共用，因此必须是模块级，不能留在函数内。 */
const READABLE_MIN = 0.72;
/* autoFill 的字号地板：低于 0.85（≈11px 字）就不再展开。
   注意不能用绝对缩放阈值判断"该不该展"——
   实测 768 屏首屏缩放本来只有 1.3、1024 屏 1.425，
   若要求 >= 1.45 则一章都展不开（19 张卡、屏幕占用仅 27%）。
   真正的判据是"展开后屏幕占用是否上升"，见 autoFill 内部。 */
const FONT_FLOOR = 0.85;
let   FIT_PAD    = 16;

/* 布局常量（DictMindMap.computeMindMapLayout） */
/* ---- 响应式度量：按视口实时计算，小屏不再溢出 ---- */
const COL_W_BASE = [212, 230, 246, 264];  // 桌面基准列宽（收紧后 1024 屏可横排）
const W_PARA_BASE = 520;

/* 小屏纵向缩进布局（TreeChat 窄屏模式）：横排四列在 360px 上必然缩到 0.4 倍，
   文字不可读，因此窄屏改为自上而下缩进，只沿纵向滚动 */
let VERTICAL   = false;   // 是否纵向布局
let INDENT_V   = 22;      // 每层缩进
let PAD_V      = 12;      // 左右安全边距
let GAP_Y_V    = 3;       // 纵向卡片间距
let COL_W_V    = [];      // 纵向各层卡片宽度
/* 卡片最小宽度（自适应下限）。
   实测 3,618 条知识点标题：中位仅 3 个汉字（≈39px 文字），
   P90 也只有 6 个字。原下限 96px 会把 82.8% 的卡强行撑宽，
   总共浪费 82,031px 宽度（平均每张 22.7px，单卡 60% 是空背景）。
   降到 56px 后浪费归零，同时仍能容纳最短 2 字标题 + 箭头按钮。 */
const MIN_CARD_W = 56;
const KP_CHUNK   = 20;                 // 每节首屏挂载的知识点数
const PARA_CHUNK = 80;                 // 正文首屏渲染的段落数

let TARGET_ASPECT = 1.6;   // 视口宽高比：布局据此决定每层拆几列
let COL_W  = COL_W_BASE.slice();
let GAP_X  = 12;
let GAP_Y  = 3;
/* 对齐方式：top = 父卡与首个子卡顶端对齐；center = 父卡居中于子块。
   两种都在 place() 的同一次调用内用子块高度算出，不依赖任何回读值。 */
let ALIGN_MODE = "center";
try{ ALIGN_MODE = localStorage.getItem("alignMode") || "center"; }catch(_){}
let W_PARA = W_PARA_BASE;
let IS_COMPACT = false;

function computeMetrics(){
  const W = innerWidth, H = innerHeight;
  const tiny    = W < 420;
  const compact = W < 720 || H < 620;
  IS_COMPACT = compact;
  /* 布局用：让包围盒形状贴近视口，才能把屏幕用满 */
  TARGET_ASPECT = (stage.clientWidth || W) / Math.max(1, (stage.clientHeight || H));

  /* 列宽按屏宽收缩，但守住可读下限（再窄中文标题就没法两行了） */
  const k = tiny ? 0.60 : compact ? 0.76 : 1;
  const floor = tiny ? 188 : compact ? 210 : 0;
  /* 先算出"横向布局"的列宽，作为方向判据的唯一依据。
     注意不能直接读 COL_W —— 纵向模式下 COL_W 已被改写，
     重复调用会自我污染，得出"越来越窄"的错误结论。 */
  const COL_W_H = COL_W_BASE.map(w => Math.max(floor, Math.round(w * k)));

  GAP_X = tiny ? 6 : compact ? 7 : 8;
  GAP_Y = compact ? 2 : 2;
  W_PARA = Math.min(W_PARA_BASE, Math.max(280, W - 48));
  FIT_PAD = compact ? 8 : 16;

  /* 方向判据：横排放进屏宽后，缩放比还够不够读？
     只看"放不放得下"会把 1440 桌面也判成纵向（四列共 1512px）。
     真正该问的是 fitView 缩放后字号是否还可读，阈值 0.72。 */
  const hNeed   = COL_W_H.reduce((a, b) => a + b, 0) + GAP_X * 3;
  const fitNeed = (W * 0.92) / hNeed;
  VERTICAL = fitNeed < 0.72;

  if(VERTICAL){
    INDENT_V = tiny ? 14 : 18;
    PAD_V    = tiny ? 8 : 12;
    GAP_Y_V  = tiny ? 2 : 3;
    /* 每层可用宽度 = 屏宽 - 两侧边距 - 该层缩进；守住可读下限 200 */
    COL_W_V = COL_W_BASE.map((_, d) =>
      Math.max(180, Math.min(340, W - PAD_V * 2 - d * INDENT_V)));
    /* 纵向模式下卡片按自身层宽渲染 */
    COL_W = COL_W_V.slice();
    W_PARA = Math.min(W - PAD_V * 2, 440);
  }else{
    COL_W_V = [];
    /* 必须显式还原横向列宽：否则从纵向切回横向时会沿用上次的
       COL_W_V（[440,440,440,440]），四列总宽膨胀到 2096px 直接溢出 */
    COL_W = COL_W_H.slice();
    W_PARA = Math.min(W_PARA_BASE, Math.max(280, W - 48));
  }

  document.documentElement.classList.toggle("compact", compact);
  document.documentElement.classList.toggle("tiny", tiny);
}

/* =====================================================================
   2. 树构建
   ===================================================================== */
let NODES = [];          // 扁平节点表
let ROOT  = null;
let bookIdx = 0;

function makeNode(o){
  const n = Object.assign({
    id:"", kind:"kp", label:"", depth:0, parent:null, children:[],
    open:false, visible:false, hasPara:false, paraOpen:false, paraLoaded:false,
    w:COL_W[0], h:34,
    x:0, y:0, vx:0, vy:0, tx:0, ty:0,
    fx:0, fy:0, fvx:0, fvy:0, _anim:false,   /* FLIP：相对布局位置的瞬时偏移 */
    el:null, alpha:0, scaleIn:1,
    shown:null,        /* 已挂载的子节点数（null = 未截断） */
    moreNode:null,     /* "再显示 N 条"哨兵节点 */
    paraAll:null,      /* 全量正文段落 */
    paraShown:0        /* 已渲染的段落数 */
  }, o);
  return n;
}

/* ---- 子节点的唯一出口：分页截断都在这里，布局/连线/可见性统一走它 ---- */
const NO_KIDS = [];
function kidsOf(n){
  if(!n.open) return NO_KIDS;
  const c = n.children;
  if(!c.length) return c;

  /* 只有"节"节点的子节点（知识点）才可能海量 */
  const lim = (n.shown == null) ? (n.kind === "section" ? KP_CHUNK : c.length) : n.shown;
  if(lim >= c.length) return c;

  if(!n.moreNode){
    n.moreNode = makeNode({
      id: n.id + "@more", kind:"more", depth: n.depth + 1,
      parent: n, w: COL_W[Math.min(n.depth + 1, COL_W.length - 1)]
    });
    NODES.push(n.moreNode);
  }
  const remain = c.length - lim;
  n.moreNode.remain = remain;
  n.moreNode.label = "再显示 " + Math.min(KP_CHUNK, remain) + " 条 · 余 " + remain;
  return c.slice(0, lim).concat([n.moreNode]);
}

function buildTree(book){
  NODES = [];
  const root = makeNode({
    id:"root", kind:"root", label:book.t, depth:0, w:COL_W[0], open:true
  });
  NODES.push(root);

  book.c.forEach((ch, ci) => {
    const cn = makeNode({
      id:ch.id, kind:"chapter", label:ch.t, depth:1, parent:root,
      w:COL_W[1], weight:ch.w
    });
    root.children.push(cn); NODES.push(cn);

    ch.s.forEach(se => {
      const sn = makeNode({
        id:se.id, kind:"section", label:se.t, depth:2, parent:cn,
        w:COL_W[2], weight:se.w, hasPara:true, kpCount:se.n
      });
      cn.children.push(sn); NODES.push(sn);

      se.k.forEach((kp, ki) => {
        const kn = makeNode({
          id:se.id + "#" + ki, kind:"kp", label:kp.t, depth:3, parent:sn,
          w:COL_W[3], weight:kp.w, kp:kp
        });
        sn.children.push(kn); NODES.push(kn);
      });
    });
  });

  ROOT = root;
  return root;
}

/* =====================================================================
   3. 布局：tidy tree —— 叶子按累计高度排布，父节点取子节点中位
   ===================================================================== */
function ensureDom(n){
  if(n.tn) return;
  const tn = document.createElement("div"); tn.className = "tn";
  const tc = document.createElement("div"); tc.className = "tc";
  const tk = document.createElement("div"); tk.className = "tk";
  tn.appendChild(tc); tn.appendChild(tk);
  n.tn = tn; n.tc = tc; n.tk = tk;
}

/* 把节点的 DOM 挂到父节点的子列里，顺序即兄弟顺序。
   已经挂好的元素再次 appendChild 会移动到末尾 —— 正好用来排序。 */
function syncTree(){
  refreshVisible();
  ensureDom(ROOT);
  if(!ROOT.el) createCard(ROOT);
  if(ROOT.tn.parentNode !== nodesLayer) nodesLayer.appendChild(ROOT.tn);
  ROOT.tn.style.display = "";
  (function walk(n){
    const kids = n.open ? kidsOf(n) : [];
    const vis = [];
    for(const c of kids){
      if(!c.visible){
        if(c.tn && c.tn.parentNode) c.tn.parentNode.removeChild(c.tn);
        continue;
      }
      ensureDom(c);
      if(!c.el) createCard(c);
      c.tn.style.display = "";
      vis.push(c);
    }
    n.tk.style.display       = vis.length ? "flex" : "none";
    n.tk.style.flexDirection = "column";
    n.tk.style.gap           = GAP_Y + "px";
    /* 主干分支舒展间隙：根到章节 36px，章节到小节 26px，其余 20px，避免挤在 8px 窄缝内折叠 */
    const branchGap = (n.kind === "root") ? 36 : (n.kind === "chapter") ? 26 : 20;
    n.tk.style.marginLeft    = Math.max(GAP_X, branchGap) + "px";
    n.tn.style.alignItems    = (ALIGN_MODE === "center") ? "center" : "flex-start";
    for(const c of vis) n.tk.appendChild(c.tn);
    for(const c of vis) walk(c);
  })(ROOT);
  for(const n of NODES){
    if(n.tn && !n.visible && n.tn !== ROOT.tn && n.tn.parentNode){
      n.tn.parentNode.removeChild(n.tn);
    }
  }
}

/* =====================================================================
   布局：交给浏览器
   ---------------------------------------------------------------------
   旧实现用 JS 算 ty/tx，再靠弹簧把卡片挪过去。真实浏览器里卡片高度
   与 JS 预估不一致（实测章节卡 204×40、小节卡 296×57），于是父子
   越排越偏 —— 这就是反复出现的"对不齐"。
   现在卡片是嵌套 flex：
     .tn{display:flex;align-items:center}    卡片垂直居中于子节点列
     .tk{display:flex;flex-direction:column} 子节点自上而下排列
   对齐由浏览器保证，然后把结果读回 tx/ty 供连线与取景使用。
   ALIGN_MODE="top" 时 .tn 改为 align-items:flex-start。
   ===================================================================== */
function computeLayout(){
  syncTree();
  const wr = world.getBoundingClientRect();
  const s  = view.s || 1;
  for(const n of NODES){
    if(!n.visible || !n.el || !n.el.isConnected) continue;
    const r = n.el.getBoundingClientRect();
    /* 宽高用 offsetWidth/Height：不受卡片自身 scale 动画影响 */
    n.w = n.el.offsetWidth  || n.w;
    n.h = n.el.offsetHeight || n.h;
    /* rect 里含 FLIP 的瞬时位移 fx/fy，扣掉才是真正的布局位置 */
    n.tx = (r.left - wr.left) / s - (n.fx || 0);
    n.ty = (r.top  - wr.top ) / s - (n.fy || 0);
    n.x  = n.tx; n.y = n.ty;
  }
}

/* 可见集合：自身可见 = 所有祖先都 open
   [重要] 必须遍历完整 children，不能用 kidsOf：
     kidsOf 在 !open 时直接返回 NO_KIDS，递归到已收起的节点就断了，
     它的子孙永远得不到 visible=false。后果有两个：
       ① 收起父节点后子卡片仍是 visible=true，relayout 里 display 保持 ""，
          于是"留在原处"收不掉；
       ② computeLayout 的 walkY 同样走 kidsOf，这些卡片不参与重排，
          保留上一轮的 tx/ty，展开别的节点时就压在同一位置重叠。 */
function refreshVisible(){
  const vis = [];
  (function walk(n, parentOpen){
    n.visible = parentOpen;
    if(n.visible) vis.push(n);
    const childOpen = parentOpen && n.open;
    /* 展开时走 kidsOf（含分页哨兵）；收起时走完整 children，
       并且要把 moreNode 一起带进去，否则分页哨兵同样收不掉 */
    const kids = n.open
      ? kidsOf(n)
      : (n.moreNode ? n.children.concat([n.moreNode]) : n.children);
    kids.forEach(c => walk(c, childOpen));
  })(ROOT, true);
  return vis;
}

/* =====================================================================
   4. DOM 构建
   ===================================================================== */
const nodesLayer = document.getElementById("nodes");
const edgeLayer  = document.getElementById("edges");
const stage      = document.getElementById("stage");
const world      = document.getElementById("world");
const grid       = document.getElementById("grid");

const SVG = {
  chev:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.3 6.7L14.6 12l-5.3 5.3 1.4 1.4L17.4 12 10.7 5.3z"/></svg>',
  doc :'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8zm-1 7V3.5L18.5 9zM8 13h8v2H8zm0 4h8v2H8z"/></svg>',
  fire:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1.5 4 5 5.5 5 9.5A5 5 0 017 11.5C7 8 10 6.5 12 2zm0 18a4 4 0 004-4c0-1.6-.9-2.7-2-3.6.2 1.4-.4 2.4-1.3 2.8.3-2.2-1-3.6-2.2-4.6C9 12 8 13.3 8 15a4 4 0 004 5z"/></svg>',
  win :'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 19H5V5h7V3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7h-2zM14 3v2h3.6l-9.8 9.8 1.4 1.4L19 6.4V10h2V3z"/></svg>'
};

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function createCard(n){
  const el = document.createElement("div");
  el.className = "card " + n.kind + (n.weight === "high" ? " hot" : "");
  el.dataset.id = n.id;
  /* 关键：绝对定位元素的可用宽度是 0，必须显式给宽，
     否则 shrink-to-fit 会把中文压成一字一行（即"长条"） */
  const capW = n.paraOpen ? W_PARA : n.w;
  el.style.width = capW + "px";

  const hasKids = n.children.length > 0;
  /* 知识点详情行默认折叠，因此需要自己的展开箭头 */
  const hasDetail = !!(n.kind === "kp" && n.kp &&
                       ((n.kp.p && n.kp.p.length) || n.kp.y));
  const chev = (hasKids || n.hasPara || hasDetail)
    ? '<button class="ibtn chev" data-act="toggle">' + SVG.chev + '</button>' : '';

  /* 不再生成「N节 / N点」徽标。
     实测 1440 屏：chapter 卡装饰宽 60px、section 卡 100px，
     其中徽标固定占 32px（30 + gap），43 张卡合计 1,376px 宽度。
     而这些数字展开后就能看到，属于纯冗余；移出后卡宽直接收窄 32px。 */
  let badge = "";
  /* 真题标记不再用「真题」徽标。
     实测：3,618 张 kp 卡里有 3,229 张是高频，徽标各占 36px，
     合计 116,244px，占全部装饰宽度的 76.3%，去掉后整卡宽度减少 37.1%。
     而且人人都有标 = 没有区分度。改为左侧 2px 金色竖条（CSS），
     横向零占用，靠颜色一眼分辨。 */

  let detail = "";
  if(n.kind === "kp" && n.kp){
    const kp = n.kp;
    let inner = "";
    if(kp.p && kp.p.length){
      inner += kp.p.map(p => '<div class="pt"><span>' + esc(p) + '</span></div>').join("");
    }
    if(kp.y) inner += '<div style="margin-top:4px"><span class="tag-type' + (n.weight === "high" ? " hot" : "") + '">' + esc(kp.y) + '</span></div>';
    if(inner) detail = '<div class="detail">' + inner + '</div>';
  }

  el.innerHTML =
    '<div class="row">' +
      '<span class="label">' + esc(n.label) + '</span>' +
      badge +
      (n.kind === "section"
        ? '<button class="ibtn act" data-act="win" title="在窗口中打开">' + SVG.win + '</button>' +
          '<button class="ibtn act" data-act="para" title="画布内展开正文">' + SVG.doc + '</button>'
        : '') +
      chev +
    '</div>' + detail;

  ensureDom(n);
  n.tc.appendChild(el);
  n.el = el;

  /* ---- 自适应卡宽：先量自然宽，再收敛 ----
     固定列宽会让"10 个字 + 268px 卡"留下 60% 空背景，
     这是截图里最刺眼的面积浪费。改为让卡片刚好包住内容。 */
  measureCardW(n);

  /* 一次性量高，之后布局不再触发重排 */
  n.h = Math.max(22, el.offsetHeight);
  return el;
}

/* =====================================================================
   5. 视图变换（唯一合成层，只改 transform）
   ===================================================================== */
const view = { px:0, py:0, s:1, tpx:0, tpy:0, ts:1, springing:false };

function applyView(){
  const _zp = document.getElementById("zoomPct");
  if(_zp) _zp.textContent = Math.round(view.s * 100) + "%";
  world.style.transform =
    "translate3d(" + view.px.toFixed(2) + "px," + view.py.toFixed(2) + "px,0) scale(" + view.s.toFixed(4) + ")";
  /* 点阵跟随平移，取模避免数值无限增长 */
  const gx = ((view.px % 36) + 36) % 36;
  const gy = ((view.py % 36) + 36) % 36;
  grid.style.transform = "translate3d(" + gx.toFixed(1) + "px," + gy.toFixed(1) + "px,0)";
  const lod = view.s >= LOD_SCALE ? 1 : 0;
  if(lod !== applyView._lod){
    applyView._lod = lod;
    nodesLayer.style.setProperty("--lod", lod);
  }
  if(typeof updateCrumbsThrottled === "function") updateCrumbsThrottled();
}

/* =====================================================================
   6. 帧循环：弹簧 + 惯性 + 连线重绘
   ===================================================================== */
let rafId = 0, lastT = 0, vel = { x:0, y:0 }, inertiaOn = false;

function needsFrame(){
  if(inertiaOn) return true;
  if(view.springing) return true;
  for(const n of NODES){
    if(!n.visible || !n.el) continue;
    if(n.alpha < 0.999 || n.scaleIn < 0.999) return true;
    if(n.fx || n.fy || n.fvx || n.fvy) return true;
  }
  return false;
}

function frame(t){
  rafId = 0;
  if(!lastT) lastT = t;
  let dt = (t - lastT) / 1000;
  lastT = t;
  dt = Math.min(dt, 1/30);           // 掉帧时不让弹簧积分爆炸

  /* --- 节点动效：FLIP 弹簧归零 + 入场淡入/缩放 --- */
  let moving = false;
  for(const n of NODES){
    if(!n.visible || !n.el) continue;
    let anim = false;
    if(n.fx || n.fy || n.fvx || n.fvy){
      const ax = -SPRING_K * n.fx - SPRING_C * n.fvx;
      const ay = -SPRING_K * n.fy - SPRING_C * n.fvy;
      n.fvx += ax * dt; n.fvy += ay * dt;
      n.fx  += n.fvx * dt; n.fy  += n.fvy * dt;
      if(Math.abs(n.fx) < 0.3 && Math.abs(n.fy) < 0.3 &&
         Math.abs(n.fvx) < 2 && Math.abs(n.fvy) < 2){
        n.fx = n.fy = n.fvx = n.fvy = 0;
      }else{
        anim = true;
      }
    }
    const fadeIn = n.alpha < 1, growIn = n.scaleIn < 1;
    if(fadeIn) n.alpha = Math.min(1, n.alpha + dt * (1000 / TWEEN_BASE));
    if(growIn) n.scaleIn = Math.min(1, n.scaleIn + dt * (1000 / 220));
    if(anim || fadeIn || growIn){
      const sc = 0.92 + 0.08 * n.scaleIn;
      n.el.style.transform =
        "translate3d(" + n.fx.toFixed(2) + "px," + n.fy.toFixed(2) + "px,0) scale(" + sc.toFixed(3) + ")";
      n.el.style.opacity = n.alpha.toFixed(3);
      n.x = n.tx + n.fx; n.y = n.ty + n.fy;
      n._anim = true;
      moving = true;
    }else if(n._anim){
      n.el.style.transform = "";
      n.el.style.opacity = "";
      n.x = n.tx; n.y = n.ty;
      n._anim = false;
    }
  }

  /* --- 视图弹簧（滚轮/按钮缩放） --- */
  if(view.springing){
    const k = 300, c = 26;
    view._vx = (view._vx || 0) + (-k * (view.s - view.ts) - c * view._vx) * dt;
    view.s += view._vx * dt;
    if(Math.abs(view.s - view.ts) < 0.0008 && Math.abs(view._vx) < 0.004){
      view.s = view.ts; view._vx = 0; view.springing = false;
    }
    applyView();
    moving = true;
  }

  /* --- 惯性衰减（0.92/帧，对齐 Compose Decay） --- */
  if(inertiaOn){
    view.px += vel.x * dt; view.py += vel.y * dt;
    const decay = Math.pow(0.92, dt * 60);
    vel.x *= decay; vel.y *= decay;
    applyView();
    if(Math.hypot(vel.x, vel.y) < 18) inertiaOn = false;
    moving = true;
  }

  if(moving) drawEdges();

  if(needsFrame()) rafId = requestAnimationFrame(frame);
  else { lastT = 0; if(moving) drawEdges(); }
}

function kick(){
  if(!rafId){ lastT = 0; rafId = requestAnimationFrame(frame); }
}

/* =====================================================================
   7. 连线：bezierPath 复刻
      dx = max(|ex-sx|, 60) * 0.5 ; cubicTo(sx+dx, sy, ex-dx, ey)
   ===================================================================== */
function anchorOut(n){
  if(n.el && n.el.isConnected){
    const wr = world.getBoundingClientRect();
    const s  = view.s || 1;
    const r  = n.el.getBoundingClientRect();
    return VERTICAL
      ? { x: (r.left + r.width / 2 - wr.left) / s, y: (r.bottom - wr.top) / s }
      : { x: (r.right - wr.left) / s,              y: (r.top + r.height / 2 - wr.top) / s };
  }
  return VERTICAL
    ? { x:n.x + cardW(n)/2, y:n.y + n.h }        /* 纵向：父出点在下边中点 */
    : { x:n.x + cardW(n),   y:n.y + n.h/2 };     /* 横向：父出点在右边中点 */
}
function anchorIn(n){
  if(n.el && n.el.isConnected){
    const wr = world.getBoundingClientRect();
    const s  = view.s || 1;
    const r  = n.el.getBoundingClientRect();
    return VERTICAL
      ? { x: (r.left + r.width / 2 - wr.left) / s, y: (r.top - wr.top) / s }
      : { x: (r.left - wr.left) / s,               y: (r.top + r.height / 2 - wr.top) / s };
  }
  return VERTICAL
    ? { x:n.x + cardW(n)/2, y:n.y }              /* 纵向：子入点在上边中点 */
    : { x:n.x,              y:n.y + n.h/2 };
}
function cardW(n){ return n.paraOpen ? W_PARA : n.w; }

/* 自适应卡宽的唯一实现：先量 max-content 自然宽，再收敛到 [MIN_CARD_W, 列上限]。
   createCard 与 resize 共用，避免两处逻辑分叉。 */
/* 文本像素宽度估算：CJK 按 1em，拉丁/数字按 0.55em。
   为什么不用 offsetWidth：那需要「加 measuring 类 → 强制同步重排 → 读回 → 去类」，
   3,618 张卡逐个同步重排会让首屏明显卡顿；而且量宽时机稍有不慎
   （元素未挂载 / display:none）就恒得 0，代码只能回落列宽上限，
   于是所有卡又变回满列宽 —— 这正是"卡片浪费面积"反复出现的根因。
   纯文本度量无重排、无时序依赖，结果确定。 */
function textPx(str, fs){
  let w = 0;
  for(let i = 0; i < str.length; i++){
    const c = str.charCodeAt(i);
    /* CJK 统一表意文字 / 全角标点 / 假名 / 谚文：1em */
    if((c >= 0x2E80 && c <= 0x9FFF) || (c >= 0xAC00 && c <= 0xD7AF) ||
       (c >= 0xF900 && c <= 0xFAFF) || (c >= 0xFF00 && c <= 0xFF60) ||
       (c >= 0x3000 && c <= 0x303F)) w += fs;
    else if(c === 32) w += fs * 0.28;
    else w += fs * 0.55;
  }
  return w;
}

function measureCardW(n){
  const el = n.el;
  if(!el || n.paraOpen) return n.w;
  const capW = COL_W[Math.min(n.depth, COL_W.length - 1)];

  /* 展开态：只有知识点卡有详情行，需要横向空间，才用列宽上限。
     章节/小节卡展开只是露出子节点，自身内容不变宽 ——
     对它们强制列宽会白扔 80~105px（实测第一章空 105px、第二章空 79px）。 */
  if(n.open && n.kind === "kp"){
    n.w = capW;
    el.style.width = capW + "px";
    return capW;
  }

  const fs = n.kind === "root" ? 15 : n.kind === "chapter" ? 13
           : n.kind === "section" ? 12.5 : 13;
  let w = textPx(n.label || "", fs);

  /* 装饰宽度：padding 左右 + gap + 按钮 + 徽标 */
  /* 装饰宽度只算「常驻占位」的元素。
     win/doc 两个按钮已改为 hover 时绝对定位浮现，不占流内宽度，
     因此这里不再计入 —— 与 CSS 保持同一口径，否则又会白留 36px。 */
  /* 必须把 border 算进去：.card 是 box-sizing:border-box 且有 1px 边框，
     内容可用宽 = 宽 - 2*padding - 2*border。
     .card      padding:3px 7px  → 7*2 + 1*2 = 16
     .card.kp   padding:2px 5px  → 5*2 + 1*2 = 12（边框透明但仍然占宽）
     旧值 14 / 10 漏掉了这 2px，导致卡片内容宽比文字窄 1~2px，
     几乎每张单行卡都被迫折成两行：实测卡高 24px → 39px，
     整棵树被凭空拉高一倍，再被 fitView 压缩，字就更小。
     这是"卡片浪费面积 + 树过高对不齐"的隐藏放大项。 */
  const pad = n.kind === "kp" ? 12 : 16;
  let chrome = pad;
  if(n.children.length || n.hasPara || (n.kind === "kp" && n.kp &&
     ((n.kp.p && n.kp.p.length) || n.kp.y)))   chrome += 2 + 16;   /* 展开箭头 */

  const natural = Math.ceil(w + chrome) + 1;
  /* 上限仍是列宽：标题过长时按两行折行，不无限拉宽 */
  const out = Math.max(MIN_CARD_W, Math.min(capW, natural));
  n.w = out;
  n.measured = true;
  el.style.width = out + "px";
  return out;
}

let edgePool = [];
/* 连线按父节点层级分色：根→章 用次级色，章→节 用三级色，其余用描边色 */
function edgeStyle(parent){
  if(parent.kind === "root")    return { c:"var(--secondary)", w:1.6,  o:0.72 };
  if(parent.kind === "chapter") return { c:"var(--tertiary)",  w:1.25, o:0.55 };
  return { c:"var(--outline)", w:0.9, o:0.34 };
}
function drawEdges(){
  let i = 0;
  for(const n of NODES){
    if(!n.visible || !n.open) continue;
    const p = anchorOut(n);
    for(const c of kidsOf(n)){
      if(!c.visible) continue;
      const e = anchorIn(c);
      let d;
      if(VERTICAL){
        /* 纵向：控制点沿 y 轴拉伸，形成 TreeChat 式圆润竖向下垂 */
        const dy = Math.max(Math.abs(e.y - p.y), 40) * 0.5;
        d = "M" + p.x.toFixed(1) + " " + p.y.toFixed(1) +
            "C" + p.x.toFixed(1) + " " + (p.y + dy).toFixed(1) + "," +
                  e.x.toFixed(1) + " " + (e.y - dy).toFixed(1) + "," +
                  e.x.toFixed(1) + " " + e.y.toFixed(1);
      }else{
        /* 标准思维导图分支曲线（经典三次贝塞尔脑图曲线）：
           中轴控制点 midX = (p.x + e.x) / 2。
           从父卡右边缘 (p.x, p.y) 出发水平向右平滑延展，在中轴柔和转向，
           并以 0 倾角水平平滑插入子卡左侧 (e.x, e.y)。
           数学上 x(t) 严格单调递增，彻底杜绝任何两端死褶与反向回折！ */
        const midX = (e.x > p.x) ? (p.x + e.x) / 2 : p.x + 12;
        d = "M" + p.x.toFixed(1) + " " + p.y.toFixed(1) +
            "C" + midX.toFixed(1) + " " + p.y.toFixed(1) + "," +
                  midX.toFixed(1) + " " + e.y.toFixed(1) + "," +
                  e.x.toFixed(1) + " " + e.y.toFixed(1);
      }
      let path = edgePool[i];
      if(!path){
        path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        edgeLayer.appendChild(path);
        edgePool.push(path);
      }
      path.setAttribute("d", d);
      const st = edgeStyle(n);
      const hot = (c.weight === "high");
      path.setAttribute("stroke", hot ? "var(--gold)" : st.c);
      path.setAttribute("stroke-width", String(hot ? st.w + 0.35 : st.w));
      path.setAttribute("opacity", String(hot ? Math.min(0.9, st.o + 0.25) : st.o));
      path.style.display = "";
      i++;
    }
  }
  for(let k = i; k < edgePool.length; k++) edgePool[k].style.display = "none";
}

/* =====================================================================
   8. 展开 / 收起
   ===================================================================== */
function setOpen(n, open){
  n.open = open;
  if(n.el) n.el.classList.toggle("open", open);
  /* 展开/收起改变内容宽度，重新量一次（仅状态变化时，非每帧） */
  if(n.el && n.kind === "kp") measureCardW(n);
  /* 新出现的子节点从父节点位置弹出去（Compose 入场感） */
  if(open){
    kidsOf(n).forEach(c => {
      if(!c.el) createCard(c);
      c.alpha = 0; c.scaleIn = 0;      /* 入场：淡入 + 从 0.92 生长 */
      c.visible = true;
    });
  }
}

/* FLIP：布局由浏览器算，动效靠"反向位移 + 弹簧归零"实现。
   relayout 前记录每张卡的世界坐标，重排后算出位移差，交给 frame() 弹回 0。
   这样既有原来的弹簧手感，又不会和 flex 布局打架。 */
function captureRects(){
  const wr = world.getBoundingClientRect();
  const s  = view.s || 1;
  const m = new Map();
  for(const n of NODES){
    if(n.visible && n.el && n.el.isConnected){
      const r = n.el.getBoundingClientRect();
      m.set(n, { x:(r.left - wr.left) / s, y:(r.top - wr.top) / s });
    }
  }
  return m;
}

function relayout(animate){
  const before = (animate === false) ? null : captureRects();
  computeLayout();
  if(before){
    for(const n of NODES){
      if(!n.visible || !n.el) continue;
      const old = before.get(n);
      if(old){
        n.fx = old.x - n.tx;
        n.fy = old.y - n.ty;
      }else{
        /* 新出现的卡片：从父卡当前位置弹出来（Compose 入场感） */
        const p = n.parent;
        if(p && p.visible){
          n.fx = (p.tx + p.fx) - n.tx;
          n.fy = (p.ty + p.fy) - n.ty;
        }else{ n.fx = 0; n.fy = 0; }
        n.fvx = 0; n.fvy = 0;
        n.alpha = 0; n.scaleIn = 0;
      }
    }
  }
  for(const n of NODES){
    if(!n.visible || !n.el) continue;
    n.x = n.tx + (n.fx || 0);
    n.y = n.ty + (n.fy || 0);
  }
  drawEdges();
  updateBadge();
  kick();
}

function updateBadge(){
  const bt = document.getElementById("buildTag");
  if(!bt) return;
  let mx = 0, pairs = 0;
  for(const n of NODES){
    if(!n.visible || !n.open) continue;
    const kids = kidsOf(n).filter(c => c.visible);
    if(!kids.length) continue;
    const last = kids[kids.length - 1];
    const d = (ALIGN_MODE === "center")
      ? Math.abs((n.ty + n.h / 2) - (kids[0].ty + (last.ty + last.h)) / 2)
      : Math.abs(kids[0].ty - n.ty);
    pairs++;
    if(d > mx) mx = d;
  }
  bt.textContent = BUILD_ID + " · " + (ALIGN_MODE === "center" ? "居中" : "顶部")
                 + " · Δ" + (Math.round(mx * 10) / 10) + " (" + pairs + ")";
}

function toggleNode(n){
  /* 分页哨兵：再放一页知识点出来 */
  if(n.kind === "more"){
    const p = n.parent;
    if(!p) return;
    p.shown = (p.shown == null ? KP_CHUNK : p.shown) + KP_CHUNK;
    relayout();
    return;
  }
  /* 知识点：展开/收起详情行。默认收起，避免要点铺满画布 */
  if(n.kind === "kp"){
    setOpen(n, !n.open);
    relayout();
    return;
  }
  if(n.kind === "section" && n.hasPara){
    /* 有正文的节：先展开子节点，再允许正文 */
    if(n.children.length){ setOpen(n, !n.open); relayout(); return; }
  }
  if(n.children.length){
    setOpen(n, !n.open);
    relayout();
  }
}

/* 正文分页渲染：先 80 段，底部按钮按需追加，避免 6390 段一次性进 DOM */
function paraHtml(list, from, to){
  let html = "";
  for(let i = from; i < to; i++){
    const p = list[i];
    html += '<p><span class="pid">p' + p.i + '</span>' + esc(p.t) + '</p>';
  }
  return html;
}

function renderParaPage(n){
  if(!n.paraEl || !n.paraAll) return;
  const total = n.paraAll.length;
  const to = Math.min(total, n.paraShown);
  n.paraBody.innerHTML = paraHtml(n.paraAll, 0, to);
  if(to < total){
    const left = total - to;
    n.paraBody.insertAdjacentHTML("beforeend",
      '<button class="para-more" type="button">继续加载 ' +
      Math.min(PARA_CHUNK, left) + ' 段 · 余 ' + left + '</button>');
    n.paraBody.querySelector(".para-more").addEventListener("click", ev => {
      ev.stopPropagation();
      n.paraShown = Math.min(total, n.paraShown + PARA_CHUNK);
      renderParaPage(n);
      n.h = Math.max(22, n.el.offsetHeight);
      relayout();
    });
  }
}

async function togglePara(n){
  if(!n.paraLoaded){
    n.paraLoaded = true;
    n.el.classList.add("loading");
    try{
      const r = await fetch("data/para/" + n.id + ".json");
      n.paraAll = await r.json();
      n.el.insertAdjacentHTML("beforeend", '<div class="para"><div class="para-body"></div></div>');
      n.paraEl   = n.el.querySelector(".para");
      n.paraBody = n.paraEl.querySelector(".para-body");
      n.paraShown = Math.min(PARA_CHUNK, n.paraAll.length);
      renderParaPage(n);
    }catch(e){
      n.el.insertAdjacentHTML("beforeend",
        '<div class="para" style="color:var(--outline)">正文分片加载失败（需通过 http 打开）</div>');
      n.paraEl = n.el.querySelector(".para");
    }
    n.el.classList.remove("loading");
  }
  n.paraOpen = !n.paraOpen;
  n.el.classList.toggle("para-open", n.paraOpen);
  if(n.paraEl) n.paraEl.style.display = n.paraOpen ? "" : "none";
  n.el.style.width = (n.paraOpen ? W_PARA : n.w) + "px";
  /* 挂载下一帧平滑更新高度，触发 FLIP 弹簧弹性展开/收起过渡 */
  requestAnimationFrame(() => {
    n.h = Math.max(22, n.el.offsetHeight);
    relayout();
  });
}

/* =====================================================================
   9. 手势：拖拽 / 惯性 / 双指缩放 / 滚轮缩放
   ===================================================================== */
let ptrs = new Map();
let dragging = false, lastPt = null, downPt = null, moved = false;
let pinchStart = 0, pinchScale = 1;

stage.addEventListener("pointerdown", e => {
  /* 卡片上同样要能拖动画布、双指缩放。
     只排除正文阅读区（那里要能选中文字），其余一律放行；
     点击与拖拽靠下面 moved>4px 阈值区分，所以不会误伤卡片点击。 */
  if(e.target.closest(".para")) return;
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
  /* 不做 setPointerCapture：它会把 pointerup 重定向到 stage，
     导致卡片及其按钮拿不到原生 click（展开/收起/正文按钮全失效）。
     改为把 move/up 挂到 window 上，指针移出卡片也不断流。 */
  if(ptrs.size === 1){
    dragging = true; moved = false;
    stage.classList.add("dragging");
    inertiaOn = false;
    lastPt = { x:e.clientX, y:e.clientY };
    downPt = { x:e.clientX, y:e.clientY };
    vel.x = vel.y = 0;
  }else if(ptrs.size === 2){
    const a = [...ptrs.values()];
    pinchStart = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
    pinchScale = view.s;
  }
});

window.addEventListener("pointermove", e => {
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });

  if(ptrs.size === 1 && dragging){
    const dx = e.clientX - lastPt.x;
    const dy = e.clientY - lastPt.y;
    if(Math.abs(e.clientX - downPt.x) + Math.abs(e.clientY - downPt.y) > 4) moved = true;
    view.px += dx; view.py += dy;
    /* 速度采样，松手后接惯性 */
    vel.x = vel.x * 0.65 + (dx / 0.016) * 0.35;
    vel.y = vel.y * 0.65 + (dy / 0.016) * 0.35;
    lastPt = { x:e.clientX, y:e.clientY };
    applyView();
  }else if(ptrs.size === 2){
    const a = [...ptrs.values()];
    const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
    if(pinchStart > 0){
      const ns = Math.max(SCALE_MIN, Math.min(SCALE_MAX, pinchScale * (d / pinchStart)));
      const cx = (a[0].x + a[1].x) / 2, cy = (a[0].y + a[1].y) / 2;
      zoomAt(ns, cx, cy);
    }
  }
});

function endPtr(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size === 0){
    if(dragging){
      dragging = false;
      stage.classList.remove("dragging");
      if(moved && Math.hypot(vel.x, vel.y) > 120){
        inertiaOn = true; kick();
      }else{
        vel.x = vel.y = 0;
      }
    }
    pinchStart = 0;
  }else if(ptrs.size === 1){
    const a = [...ptrs.values()];
    lastPt = { x:a[0].x, y:a[0].y };
  }
}
window.addEventListener("pointerup", endPtr);
window.addEventListener("pointercancel", endPtr);

/* 以某点为锚缩放 */
function zoomAt(ns, cx, cy){
  const k = ns / view.s;
  view.px = cx - (cx - view.px) * k;
  view.py = cy - (cy - view.py) * k;
  view.s  = ns;
  applyView();
}

/* 滚轮 / 触控板 */
stage.addEventListener("wheel", e => {
  /* 正文阅读区内的滚轮要留给文字自己滚动，
     否则一滚就缩放，长段落永远读不到下半部分。 */
  if(e.target.closest(".para")) return;
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * 0.0016);
  const ns = Math.max(SCALE_MIN, Math.min(SCALE_MAX, view.s * factor));
  zoomAt(ns, e.clientX, e.clientY);
}, { passive:false });

/* 点击卡片 */
nodesLayer.addEventListener("click", e => {
  /* 拖拽/缩放结束后浏览器仍会补发一次 click。
     不拦截的话，拖完画布松手就会误触展开/收起。 */
  if(moved){ moved = false; return; }
  const card = e.target.closest(".card");
  if(!card) return;
  const n = NODES.find(x => x.id === card.dataset.id);
  if(!n) return;
  const act = e.target.closest("[data-act]");
  if(act && act.dataset.act === "win"){ openSectionWindow(n); return; }
  if(act && act.dataset.act === "para"){ togglePara(n); return; }
  toggleNode(n);
});

/* =====================================================================
   10. 自适应视图（computeFitScale 复刻：padding 90 / clamp 0.35~1.3）
   ===================================================================== */
function fitView(animate){
  const vis = NODES.filter(n => n.visible);
  if(!vis.length) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for(const n of vis){
    minX = Math.min(minX, n.tx);
    minY = Math.min(minY, n.ty);
    maxX = Math.max(maxX, n.tx + cardW(n));
    maxY = Math.max(maxY, n.ty + n.h);
  }
  const cw = Math.max(1, maxX - minX);
  const chh = Math.max(1, maxY - minY);
  const vw = stage.clientWidth, vh = stage.clientHeight;
  const topSafe = document.getElementById("topbar").offsetHeight + 24;
  const availW = vw - FIT_PAD * 2;
  const availH = vh - FIT_PAD - topSafe;

  /* 纵向布局只按宽度取景。
     纵向内容动辄 2000px 高，若同时按高度拟合会算出 0.245，
     被 FIT_MIN=0.35 截断后既没真正放下、字又变小 —— 两头不讨好。
     纵向本来就是靠纵向滚动阅读的，所以顶部对齐、保持可读字号。 */
  if(VERTICAL){
    const nsv = Math.max(FIT_MIN, Math.min(FIT_MAX, availW / cw));
    const npxv = Math.min((vw - cw * nsv) / 2, FIT_PAD) - minX * nsv;
    const npyv = topSafe - minY * nsv;
    if(animate){
      animateViewTo(npxv, npyv, nsv);
    }else{
      view.px = view.tpx = npxv; view.py = view.tpy = npyv;
      view.s = view.ts = nsv;
      applyView();
    }
    return;
  }

  /* 横向：宽度必须拟合，高度只在"字号仍可读"时才拟合。
     24 个并列小节纵向堆叠可达 1800px，若强行按高度塞进 900px 视口，
     缩放会掉到 0.456（13px 字变 5.9px）—— 图是"看全"了，但根本读不了。
     所以设一个可读下限 READABLE_MIN：高度拟合跌破它时放弃高度拟合，
     顶部对齐，纵向靠拖拽平移查看。 */
  /* 取景策略：可读优先，其次控制纵向溢出。
     旧策略在"填满宽度"(FILL_MAX=2.4) 与"塞进高度"之间二选一，两头都不可用：
       1548×1032 实测填满宽度 → scale 2.4，根卡字 36px，
         一屏只剩 3 章，其余全在屏幕外 —— 用户说的"完全用不了"；
       纯按高度拟合 → scale 0.72（约 9px 字）—— 用户说的"有的字看不清楚"。
     改为三步：
       1) 先按宽度拟合，上限 FIT_MAX（1.3，约 17px 字）；
       2) 若纵向溢出超过 MAX_VSCREENS 屏，压到刚好那么多屏；
       3) 压缩后不低于 READABLE_SCALE（1.0，约 13px 字）。
     纵向溢出交给拖拽平移 —— 这是可平移画布，本来就不需要一屏看全。 */
  const byW = availW / cw;
  const MAX_VSCREENS = 1.6;
  const READABLE_SCALE = 1.0;
  let ns = Math.min(byW, FIT_MAX);
  const capH = (availH * MAX_VSCREENS) / chh;
  if(ns > capH) ns = Math.max(capH, Math.min(byW, READABLE_SCALE));
  ns = Math.max(FIT_MIN, ns);
  const overflows = chh * ns > availH;

  const npx = (vw - cw * ns) / 2 - minX * ns;
  /* 高度没拟合时不能对齐"包围盒顶边"。
     横向布局里整棵树是围绕根节点垂直居中的，根节点位于树的中段；
     若把包围盒顶边贴到顶栏下沿，根节点会被推到视口下方（实测 y=1036 > 900）。
     正确做法是把根节点本身对齐到视口中上部，其余部分上下拖拽查看。 */
  /* 高度没拟合 / 放大后溢出：都不能对齐包围盒顶边。
     横向布局整棵树围绕根节点垂直居中，根节点位于树中段，
     对齐顶边会把根节点推到视口下方（实测 y=1036 > 900）。
     改为把根节点本身锚定到顶栏下沿。 */
  /* 溢出时的纵向锚点：
     居中对齐下内容会延伸到根卡【上方】，若把根卡贴到顶栏，上半截会被裁掉。
     改为取两者较高者（npy 越小内容越靠上）：
       A) 包围盒顶端对齐 → 内容从头可见；
       B) 根卡落在视口上 1/3 → 保证根卡一定出现在屏幕里（全展开时内容极高，
          只对齐顶端会把根卡推到屏幕下方）。 */
  const npyA = topSafe - minY * ns;
  const npyRoot = topSafe + availH * 0.33 - (ROOT.ty + ROOT.h / 2) * ns;
  const npy = overflows
    ? Math.min(npyA, npyRoot)
    : (topSafe + (availH - chh * ns) / 2 - minY * ns);

  if(animate){
    animateViewTo(npx, npy, ns);
  }else{
    view.px = view.tpx = npx; view.py = view.tpy = npy;
    view.s = view.ts = ns;
    applyView();
  }
}

function animateViewTo(px, py, s){
  const sx = view.px, sy = view.py, ss = view.s;
  const t0 = performance.now(), dur = 460;
  function step(t){
    let k = Math.min(1, (t - t0) / dur);
    /* M3 emphasized decelerate */
    k = 1 - Math.pow(1 - k, 3);
    view.px = sx + (px - sx) * k;
    view.py = sy + (py - sy) * k;
    view.s  = ss + (s  - ss) * k;
    applyView();
    if(k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* 首屏自动填充：按屏幕大小决定展开多少章节。
   固定"展开前 2 章"会让 1440 屏上只有 26 张卡片，
   画布大片空白 —— 这才是"浪费可显示面积"的主因，
   而不是卡片内部太胖（实测内部空白仅 0.2%~0.6%）。

   策略：BFS 逐层展开章节；每展开一个就重排并试算取景缩放，
   一旦缩放跌破 READABLE_MIN 就回退并停止。小屏少展、大屏多展。 */
/* 屏幕被卡片覆盖的比例：Σ卡片面积 × 缩放² / 视口面积。
   这是"有没有浪费显示面积"最直接的度量 —— 展开子节点会增加卡片面积，
   但同时可能撑大包围盒、压低缩放，两者相抵未必更满，必须实测比较。 */
/* 屏幕真实覆盖率：只统计「当前真正落在视口内」的卡片面积。
   旧实现是「全部可见卡面积 × s² / 视口面积」，把已经放大到屏幕外、
   用户根本看不到的卡片也算了进去。实测 1440 屏包围盒 795×856，
   按 1.6 倍填满宽度后高 1370px，而视口只有 812px ——
   近 40% 卡片落在折叠线以下，旧公式却报 39.4% 的占用率，
   指标虚高，autoFill 一直在优化一个用户看不见的数字。
   新实现按矩形求交，只算屏幕上真的被卡片占住的地方。 */
function usageScore(){
  const vw = stage.clientWidth || W, vh = stage.clientHeight || H;
  if(vw <= 0 || vh <= 0) return 0;
  const s = view.s, px = view.px, py = view.py;
  if(!(s > 0)) return 0;
  let hit = 0;
  for(const n of NODES){
    if(!n.visible) continue;
    const x0 = n.tx * s + px, y0 = n.ty * s + py;
    const x1 = Math.min(x0 + cardW(n) * s, vw), y1 = Math.min(y0 + n.h * s, vh);
    const ax = Math.max(x0, 0), ay = Math.max(y0, 0);
    if(x1 > ax && y1 > ay) hit += (x1 - ax) * (y1 - ay);
  }
  return hit / (vw * vh);
}

function autoFill(targetCards){
  /* 目标卡片数必须跟着视口面积走。
     实测固定 64 张时：1440 屏占用 39.4%，1920 屏只有 25.4% ——
     同样 64 张卡摊在 1.6 倍面积上，自然显得空。
     以 1440×900（1.296M px²）= 64 张为基准等比放大。 */
  const vw = stage.clientWidth  || 1440;
  const vh = stage.clientHeight || 900;
  const TARGET = targetCards ||
    Math.max(48, Math.min(220, Math.round(64 * (vw * vh) / 1296000)));
  const queue = [ROOT];
  let guard = 0;
  while(queue.length && guard++ < 400){
    if(NODES.filter(n => n.visible).length >= TARGET) break;
    const n = queue.shift();
    if(!n.children.length || n.depth >= 3) continue;
    if(n.open) { n.children.forEach(c => { if(c.children.length) queue.push(c); }); continue; }

    const before = usageScore();
    setOpen(n, true);
    refreshVisible();
    computeLayout();
    fitView(false);
    /* 判据：展开后"屏幕被卡片覆盖的比例"是否真的上升。
       试过改成「只看字号是否可读」，实测是负优化：
       1440 屏从 64 张卡 / 占用 39.4% 变成 65 张卡 / 占用 29.9% ——
       多展的那一层把包围盒撑高，fitView 缩放从 1.577 掉到 1.363，
       缩放是平方项，掉一点就吃掉全部收益。所以仍用占用率判据。 */
    const after = usageScore();
    if(view.s < FONT_FLOOR || after <= before * 1.02){
      setOpen(n, false);
      refreshVisible();
      computeLayout();
      fitView(false);
      continue;
    }
    n.children.forEach(c => { if(c.children.length) queue.push(c); });
  }
  refreshVisible();
  computeLayout();
}

const WIN_K = 1500, WIN_C = 2 * Math.sqrt(1500);

function bringToFront(w){
