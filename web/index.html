义。"],"q":"(一)独立成分独立成分指在句子中临时插进一些习惯用语，目的是增强语言的表达色彩，这些习惯用语跟别的成分不发生结构上的联系，但是在语义的表达上还是很重要的。","w":"high","e":["教材高频"]},{"t":"歇后语","y":"名词解释","p":["歇后语是指人们口头流传的由像谜面和谜底的前后两部分组成的通俗、风趣、形象而带有隐语性质的熟语。","前一部分是比喻或说出一个事物，类似于谜语的“谜面”，而后一部分则是解释说明，类似于“谜底”，前后两部分在话语中有停顿间歇，后一部分有时不说出来，让人去猜想其含义，所以称为歇后语。","根据歇后语前后两部分的关系以及后一部分与歇后语真实意义的关系，可以分成两类：喻意类和谐音类。"],"q":"五、熟 语熟语主要包括成语、惯用语和歇后语，它们是汉语词汇中的特殊成分，往往包含着特定含义，反映着民族文化和社会背景，不弄清楚就无法理解和运用。","w":"high","e":["教材高频"]},{"t":"习用语","y":"名词解释","p":["习用语指口语中常用的一些习惯用语，形式不拘但基本固定，意义固化而有趣。","我们不能从字面意思去理解习用语，因为在长期口语使用中，它已经形成了某种特定的意义，但是跟成语、谚语、歇后语和惯用语还是有所不同。"],"q":"五、惯用语之外还设立一个习用语，你认为有无必要?第八节 词汇的发展与规范学习要点：了解现代汉语词汇规范的必要性，重点掌握判断异形词、异读词、生造词、误用词的标准，以及词汇规范意识与动态观念的互动关系。","w":"high","e":["教材高频"]}]},{"id":"xdhy_up-c03-s08","t":"第八节 词汇的发展与规范","w":"high","n":6,"k":[{"t":"生造词","y":"名词解释","p":["生造词是指为了标新立异，一些个人不遵循造词规律而任意拼凑语素造出来的词义含糊不清的词语。","生造词既没有指称新事物和新概念，也没有表达社会变革和社会心理的特殊效果。","生造词的形成方式主要包括：任意简缩、随意破词、随便拼凑。"],"q":"例如20世纪50年代初《语法修辞讲话》曾经批评过“我军为寻找有利战机……”“释放的释放，劳改的劳改⋯⋯”，认为其中“战机”“劳改”是“生造词语”，还批评“转变了过去站在生产之外，空喊保证生产的作风”中的“转变”是不及物动词，所以不能带宾语，而现在我们再也不认为“战机”“劳改”是生造词语，“转变”不能带宾语了。","w":"high","e":["教材高频"]},{"t":"异读词","y":"名词解释","p":["异读词是指意义和书写形式都相同而读音形式不同的词。","造成异读词的原因主要有以下几个方面：(1)读书音(文读)和口语音(白读)的分歧；(2)方言读音的影响；(3)古代汉语多音字沿用至今；(4)语音的自然发展；(5)讹读的影响。","规范异读词读音的三个原则是：合并原则、从俗原则、区别原则。"],"q":"五、惯用语之外还设立一个习用语，你认为有无必要?第八节 词汇的发展与规范学习要点：了解现代汉语词汇规范的必要性，重点掌握判断异形词、异读词、生造词、误用词的标准，以及词汇规范意识与动态观念的互动关系。","w":"high","e":["教材高频"]},{"t":"异形词","y":"名词解释","p":["异形词是指语义相同或相近，而词的书写形式和语音形式不同的词。","书写形式不同的词主要分为三类：同素颠倒词、异形等义词、异形外来词。","同素颠倒词指语素相同而词序相反的异形词，可以分成取A弃B类、AB并存类、AB分工类；异形等义词指一个语素位置和字形相同，另一个语素位置相同而字形不同的异形词；异形外来词指因引进方法不同或引进地区不同而造成外来词在书写形式和发音形式上都不同。"],"q":"五、惯用语之外还设立一个习用语，你认为有无必要?第八节 词汇的发展与规范学习要点：了解现代汉语词汇规范的必要性，重点掌握判断异形词、异读词、生造词、误用词的标准，以及词汇规范意识与动态观念的互动关系。","w":"high","e":["教材高频"]},{"t":"误用词","y":"名词解释","p":["误用词是指词语本身没有问题，由于使用者对词义及其色彩义的理解有误或受词形、字音的影响而误用的词语。","误用词的词语本身没有问题，问题在于使用者的使用不当。","误用词的成因包括对词义及色彩义理解有误，或受词形、字音的影响。"],"q":"五、惯用语之外还设立一个习用语，你认为有无必要?第八节 词汇的发展与规范学习要点：了解现代汉语词汇规范的必要性，重点掌握判断异形词、异读词、生造词、误用词的标准，以及词汇规范意识与动态观念的互动关系。","w":"high","e":["教材高频"]},{"t":"规范意识与动态观念","y":"名词解释","p":["从总体上看，词汇的规范是相对的，而词汇的发展变化却是绝对的，因此，我们必须运用动态发展的眼光看待词汇的规范。","词汇规范的必要性体现在两个方面：一是词汇系统存在着不规范现象，比如异形词、异读词；二是词汇使用中存在着不规范现象，比如生造词、误用词。","词汇是在不断发展变化的，旧词的消亡、新词的产生，随时随地都在发生，因此，我们必须具有动态的发展观，处理好规范意识与动态观念的互动关系。"],"q":"五、惯用语之外还设立一个习用语，你认为有无必要?第八节 词汇的发展与规范学习要点：了解现代汉语词汇规范的必要性，重点掌握判断异形词、异读词、生造词、误用词的标准，以及词汇规范意识与动态观念的互动关系。","w":"high","e":["教材高频"]},{"t":"异读词是指意义和书写形式都相同而读音形式不同的词。（  ）","y":"判断题","p":["判断：正确","异读词：意义和书写形式相同而读音不同","举例：汲(jí)(jī)、谁(shuí)(shéi)"],"q":"(二)异读词异读词是指意义和书写形式都相同而读音形式不同的词。","w":"normal","e":[]}]}]}]},{"d":"xdhy_down","t":"现代汉语通论（下册）","c":[{"id":"xdhy_down-c01","t":"第四章 语法","w":"high","s":[{"id":"xdhy_down-c01-s01","t":"第一节 现代汉语语法概述","w":"high","n":15,"k":[{"t":"语法","y":"名词解释","p":["制约着句子组合合法性的规则就是“语法”","语法是语言不可缺少的有机的组成部分","语音是语言的物质外壳，词汇是语言的建筑材料，语法是语言的构造规则","词语的组合绝不是任意的，符合规则句子就合法，否则就不合法"],"q":"世界上任何语言都是有语法的，没有语法的语言是不存在的。例如有“弟弟”“很”“聪明”这么三个单词，从理论上讲可以有六种组合，但是只有“弟弟很聪明”这一种排列组合才是合法的，其余各句都不合法。这说明词语的组合绝不是任意的，实际上有某种规则在起作用：如果符合这个规则，句子就合法，否则就不合法。制约着句子组合合法性的规则就是“语法”。","w":"high","e":["2016 真题","2019 真题"]},{"t":"描写语法","y":"名词解释","p":["又叫“结构主义语法”","创始人为瑞士语言学家索绪尔","经典著作是《普通语言学教程》","提出“组合”和“聚合”两大结构关系","运用“直接成分分析法”对句法结构进行层次分析"],"q":"它又叫“结构主义语法”，是在对传统语法批判的基础上形成的。其理论的创始人为瑞士语言学家索绪尔(Saussure)，经典著作是《普通语言学教程》(1916)。","w":"high","e":["2014 真题"]},{"t":"现代汉语最根本的总特点是什么？它具体表现为哪四个方面？","y":"简答题","p":["不依赖严格意义的形态变化，而借助于语序、虚词等其他语法手段来表示语法关系和语法意义","（一）语序的变化对语法结构和语法意义起重大影响","（二）虚词的运用对语法结构和语法意义有重要作用","（三）汉语的词类和句子成分不存在简单的一一对应的关系","（四）短语结构跟句子结构以及词的结构基本一致"],"q":"现代汉语最根本的总特点是：不依赖严格意义的形态变化，而借助于语序、虚词等其他语法手段来表示语法关系和语法意义。这一总特点具体表现为以下四个方面。","w":"high","e":["2015 真题","2018 真题","2021 真题"]},{"t":"试论述汉语句法与西方印欧语在“短语结构跟句子结构以及词的结构基本一致”这一特点上的差异。","y":"论述题","p":["英语句子的谓语部分都必须有一个限定动词，短语里不允许有限定动词","汉语的动词在任何场合形式都不变","汉语的一个自由短语给予语调在特定语境里出现就可成为一个句子","汉语的多音节词主要是从短语的临时性组合发展而来，词的结构跟短语结构大体一致","短语跟句子是不同层次的语言单位，黏着短语即使给语调也不能独立成句"],"q":"1.跟英语比较。英语的句子结构跟短语的结构有明显区别，英语句子的谓语部分都必须有一个限定动词，而短语里是不允许有限定动词的，如果要出现动词，就必须采用动词不定式或动名词的形式。例如：","w":"high","e":["2017 真题"]},{"t":"人们越来越认识到：语法研究和学习的最终目标应该是揭示语义的______、句法的______、语用的______以及认知的______。","y":"填空题","p":["决定性","强制性","选择性","解释性"],"q":"语法研究和学习的最终目标应该是揭示语义的决定性、句法的强制性、语用的选择性以及认知的解释性。","w":"high","e":["2019 真题"]},{"t":"传统语法","y":"名词解释","p":["又称“规范语法”或“学校语法”","分为词法和句法两大部分，以词法为主","划分词类主要依据形态变化","注重书面语分析","语法规则被看作一种规范和标准"],"q":"它又称为“规范语法”或“学校语法”，从语法学产生就形成了，在教育界的影响是根深蒂固的。","w":"normal","e":["核心考点"]},{"t":"判断：语法具有抽象性、稳固性和民族性。（　）","y":"判断题","p":["现代汉语总特点：不依赖形态变化，借助语序、虚词","语法具有抽象性、稳固性、民族性"],"q":"现代汉语最根本的总特点是：不依赖严格意义的形态变化，而借助于语序、虚词等其他语法手段来表示语法关系和语法意义。","w":"normal","e":["核心考点"]},{"t":"下列说法符合汉语词类与句法成分关系特点的是（　　）。","y":"单项选择题","p":["B","汉语副词基本上只能作状语","其余词类都是一对多","印欧语词类属于“性格演员”，汉语属于“多功能演员”"],"q":"在汉语里，词类跟句法成分之间的关系就比较复杂，除了副词基本上只能作状语，属于一对一之外，其余的都是一对多，即一种词类可以作多种句法成分。","w":"normal","e":["核心考点"]},{"t":"汉语语法学的建立，通常认为应该以（　　）的出版为标志。","y":"单项选择题","p":["A","1898年《马氏文通》","马建忠","第一个以字为本位的语法体系"],"q":"汉语语法学的建立，通常认为应该以1898年《马氏文通》的出版为标志。","w":"normal","e":["核心考点"]},{"t":"黎锦熙《新著国语文法》与马建忠《马氏文通》相比有什么特点？","y":"简答题","p":["《马氏文通》以古代汉语为研究对象，建立了第一个以字为本位的语法体系","黎锦熙《新著国语文法》(1924)以现代汉语为研究对象","仿照纳氏文法建立了一个句本位的语法新体系","在中学语文学界产生过深远影响"],"q":"黎锦熙的《新著国语文法》(商务印书馆，1924)则以现代汉语为研究对象，仿照纳氏文法建立了一个句本位的语法新体系。","w":"normal","e":["核心考点"]},{"t":"汉语语序变化这一语法手段可分哪三个不同层面的情况？请分别举例说明。","y":"简答题","p":["语用的语序变化：临时性移位，基本语义和语法结构关系都没有变化，只增加语用意义","语义的语序变化：语义角色关系发生变化，语义明显不同","语法的语序变化：语法结构关系随之改变，语义也改变"],"q":"关于语序变化这一语法手段，实际上有三类不同层面的情况：","w":"normal","e":["核心考点"]},{"t":"20世纪80年代以朱德熙为代表的语法思想占据主导地位，其特色是什么？","y":"简答题","p":["提出“短语本位”，提高了短语结构的地位","宣称“语法研究的最终目的是弄清楚语法形式和语法意义之间的关系”","加强横向的方言语法研究和纵向的历史语法研究","胡裕树和张斌提出“句法、语义、语用”三个平面的思想"],"q":"第一，提出“短语本位”，强化了短语研究，大大提高了短语结构在汉语语法中的地位。","w":"normal","e":["核心考点"]},{"t":"在印欧语里，词类和句法成分之间往往存在着一种简单的对应关系，大多是一对一，少数是一对二。（　）","y":"判断题","p":["印欧语中词类与句法成分多为一对一，少数一对二"],"q":"在印欧语里，词类和句法成分之间往往存在着一种简单的对应关系，大多是一对一，少数是一对二。","w":"normal","e":["核心考点"]},{"t":"形式语法又叫“转换语法”或“生成语法”，创始人是美国的______，这一理论的提出被称为“语言学史上的一场革命”。","y":"填空题","p":["乔姆斯基","Chomsky"],"q":"它又叫“转换语法”或“生成语法”(GB)。它是在对描写语法理论批判的基础上形成的，创始人是美国的乔姆斯基(Chomsky)，这一理论的提出被称为“语言学史上的一场革命”。","w":"normal","e":["核心考点"]},{"t":"有的语言偏重于形态变化，例如法语、俄语，称为“______语言”；有的语言偏重于词序变化和虚词运用，例如汉语，称为“______语言”。","y":"填空题","p":["综合性语言","分析性语言"],"q":"前者称为“综合性语言”，后者称为“分析性语言”。","w":"normal","e":["核心考点"]}]},{"id":"xdhy_down-c01-s02","t":"第二节 词类和功能分析法","w":"high","n":35,"k":[{"t":"词类","y":"名词解释","p":["词类专指词的语法类别","不同的词类在形态、意义和功能等方面表现出区别性特点","划分词类的目的是为了说明语言的构造规则","词类是一个有层次的系统"],"q":"词类专指词的语法类别，不同的词类在形态、意义和功能等方面都表现出一些区别性的特点。划分词类的目的是为了说明语言的构造规则。","w":"high","e":["2013 真题","2018 真题"]},{"t":"区别词","y":"名词解释","p":["又叫“非谓形容词”","不能作谓语、主语、宾语，也不能受数量短语修饰","单独只能作定语","跟“的”构成“的”字结构"],"q":"区别词跟形容词有点儿像，但是不能作谓语，又叫“非谓形容词”。区别词跟名词也不同，不能作主语或宾语，也不能受数量短语修饰。区别词有三类：","w":"high","e":["2018 真题"]},{"t":"词的跨类现象包括哪四种情况？","y":"简答题","p":["兼类：具有两类词的语法功能，意义上又有密切联系","同音：同音同形而语法功能不同，意义上没有什么联系","活用：临时性地被用作另一类词","借用：临时“借用”为另一类，且全社会公认"],"q":"一个语音和文字形式相同的词可能表现出两类词的语法功能，这包括以下四种情况：","w":"high","e":["2016 真题"]},{"t":"辨析“忽然”与“突然”的词性。","y":"辨析题","p":["两者意义几乎一样","“忽然”只能够作状语，是副词","“突然”能作状语、补语、定语，还可受“很”修饰，是形容词","意义相同或类似而句法作用不同时，意义反而会产生误导"],"q":"“忽然”只能够作状语，而“突然”除了作状语之外，还可以作补语(他来得突然)、定语(突然事件)，也可以受副词“很”的修饰(很突然)。因此，“忽然”是副词，“突然”则为形容词。","w":"high","e":["2017 真题"]},{"t":"辨析兼类词与同音词，并说明区分的关键。","y":"辨析题","p":["兼类：具有两类词的语法功能，意义上又有密切联系","同音词：同音同形而语法功能不同，意义上没有什么联系","区分关键：看它们的词义是否有密切的联系"],"q":"区别同音词和兼类词的关键在于看它们的词义是否有密切的联系：如果有密切联系的是兼类词，如果没有什么联系的是同音词。","w":"high","e":["2019 真题"]},{"t":"划分词类的标准主要有哪三个？它们在汉语词类划分中的地位如何？","y":"简答题","p":["形态标准：最简单最明显最可靠，但在汉语中只能作为辅助标准","意义标准：可以帮助快捷确定词性，但意义模糊，只能作为参考标准","功能标准：主要指词的组合能力，是主要标准，比较可靠有效","汉语的词类划分主要依靠功能标准，形态为辅助标准，意义为参考标准"],"q":"总而言之，汉语的词类划分，主要依靠功能标准，这是比较可靠、比较有效的标准。形态标准只能作为辅助标准，而且形态也只是语法功能的一种标志，说到底，还是功能在起决定性作用。意义可以作为参考标准，在一般情况下优先帮助判断。","w":"high","e":["2015 真题","2020 真题"]},{"t":"名词的语法特点是什么？","y":"简答题","p":["大多可以受数量短语的修饰","主要充当主语、宾语和定语，决不能作补语，一般不能作状语","不能受否定副词“不”的修饰","通常不能重叠"],"q":"名词的语法特点是：① 大多可以受数量短语的修饰。②主要充当主语、宾语和定语，决不能作补语，一般不能作状语。③不能受否定副词“不”的修饰。④通常不能重叠。","w":"high","e":["教材高频"]},{"t":"动词的语法特点是什么？","y":"简答题","p":["主要作谓语","及物动词能带宾语","能受否定副词“不”修饰；除心理动词、能愿动词外不能受“很”修饰","动作动词多数能够重叠","大多数动词可以带时态助词“了”“着”或“过”"],"q":"动词的语法特点是：","w":"high","e":["教材高频"]},{"t":"形容词的语法特点是什么？形容词包括哪两类？","y":"简答题","p":["多数能够受否定副词“不”和程度副词“很”的修饰","常作谓语、定语和补语","不能带宾语","部分形容词能够重叠","包括性质形容词和状态形容词两类"],"q":"形容词的语法特点是：","w":"high","e":["教材高频"]},{"t":"下列各组虚词中，都属于介词的一组是（　　）。","y":"单项选择题","p":["介词：把、从、关于","连词：和、或、但是","助词：的、了、着","语气词：啊、吧、呢"],"q":"汉语词类的第一层次是分为“实词”和“虚词”两大类：能充当句法成分的词是实词，不能充当句法成分的词是虚词。","w":"high","e":["教材高频"]},{"t":"判断：划分词类的主要依据是词的语法功能。（　）","y":"判断题","p":["划分词类标准：形态、意义、功能","功能标准最重要"],"q":"3.功能标准。所谓语法功能是指词的组合能力，即能够跟哪些词组合，不能跟哪些词组合。","w":"high","e":["教材高频"]},{"t":"判断：虚词不能充当句法成分，实词能充当句法成分。（　）","y":"判断题","p":["实词能充当句法成分","虚词不能充当句法成分"],"q":"汉语词类的第一层次是分为“实词”和“虚词”两大类：能充当句法成分的词是实词，不能充当句法成分的词是虚词。","w":"high","e":["教材高频"]},{"t":"代词","y":"名词解释","p":["具有替代和指示作用","包括人称代词、指示代词、疑问代词三类","不是按照语法功能划分出来的词类，只是在“指代”这一点上有共同点"],"q":"代词是具有替代和指示作用的词。代词包括以下三类：1.人称代词。替代人或事物名称的词。","w":"normal","e":["核心考点"]},{"t":"方位词","y":"名词解释","p":["一般附着在其他名词之后，表示处所","有的也可以独立使用","分为单纯方位词、合成方位词和特殊方位词三类"],"q":"方位词一般附着在其他名词之后，表示处所；有的也可以独立使用。方位词分为单纯方位词、合成方位词和特殊方位词三类。","w":"normal","e":["核心考点"]},{"t":"语法功能","y":"名词解释","p":["词的组合能力","能否与其他的词组合成短语","以什么顺序组合","组合以后表示什么关系","作句法成分的能力"],"q":"所谓语法功能是指词的组合能力，即能够跟哪些词组合，不能跟哪些词组合。","w":"normal","e":["核心考点"]},{"t":"能愿动词","y":"名词解释","p":["也叫助动词","表示可能、必要或意愿","只能带动词性宾语","可以构成“不V不”格式"],"q":"能愿动词也叫助动词，表示可能、必要或意愿。语法特点是只能带动词性宾语，可以构成“不V不”格式。","w":"normal","e":["核心考点"]},{"t":"状态形容词","y":"名词解释","p":["也叫形容词的生动形式","表示程度比较高，前面不能再加“很”","使用时后面一般要带“的”","可比较自由地充当谓语、补语和状语"],"q":"状态形容词也叫形容词的生动形式，表示程度比较高，因而前面不能再加“很”，使用时后面一般要带“的”，可比较自由地充当谓语、补语和状语。","w":"normal","e":["核心考点"]},{"t":"辨析“咱们”与“我们”。","y":"辨析题","p":["“咱们”往往包括说话人和听话人双方，叫“包括式”","“我们”也可以兼指听说双方","“我们”与“咱们”同现时只指说话人一方，属于“排除式”"],"q":"“咱们”往往包括说话人和听话人双方，叫作“包括式”。“我们”也可以兼指听说双方，但与“咱们”同现时，就只指说话人一方，属于“排除式”。","w":"normal","e":["核心考点"]},{"t":"辨析及物动词与不及物动词。","y":"辨析题","p":["及物动词：只要能带宾语，不管带的是什么类型的宾语","不及物动词：不能带任何宾语","只能带施事宾语或处所宾语的也应归为及物动词","同一动词不同义项可归入不同小类"],"q":"(1)及物动词：只要能带宾语，不管带的是什么类型的宾语，都是及物动词。例如：","w":"normal","e":["核心考点"]},{"t":"实词与虚词有哪几个重要的区别性特征？","y":"简答题","p":["开放/封闭：实词数量开放，虚词可数有限，属封闭类","自由/黏着：实词可自由运用，虚词必须黏附在实词前后","不定位/定位：实词位置不固定，虚词位置相对固定"],"q":"1.开放/封闭。实词的数量基本上是开放的，虚词则是可数的，有限的，不会轻易增加或减少，所以又叫“封闭”类。","w":"normal","e":["核心考点"]},{"t":"处所词的三个小类及其语法特点是什么？","y":"简答题","p":["能够独立使用的方位词","表示处所的名词","表示地名、机构的名词","能用在动词“在”“到”“往”后作宾语","能用“哪儿”提问","能用“这儿”“那儿”指代"],"q":"2.处所词。处所词有三小类：(1)能够独立使用的方位词。(2)表示处所的名词，例如：附近、近处、远处、高处、低处、明处、暗处、周围等。(3)表示地名、机构的名词，例如：亚洲、中国、北京、北京大学、商店、邮局等。处所词的语法特点是：","w":"normal","e":["核心考点"]},{"t":"量词的语法特点是什么？量词可分为哪两类？","y":"简答题","p":["不单独使用","先跟数词组合成数量短语，或跟指示代词组成指量短语","名量词表示人或事物的单位（个体量词、度量词、借用名量词）","动量词表示动作的次数（时间、器官、工具、伴随、同形量词）"],"q":"量词的语法特点是不单独使用，而是先跟数词组合成为数量短语，或者跟指示代词组成指量短语。量词包括名量词和动量词两类。","w":"normal","e":["核心考点"]},{"t":"下列量词中，属于借用的动量词的是（　　）。","y":"单项选择题","p":["C","“看一眼”属于借用的动量词中的器官量词","“个”是个体量词，“斤”是度量词"],"q":"借用的动量词包括五类：(1)时间量词，例如：年、月、日、小时、钟点、分钟、秒钟；(2)器官量词，例如：看一眼、踢一脚、打两拳。","w":"normal","e":["核心考点"]},{"t":"副词的语法特点是什么？按语义与功能可分为哪八类？","y":"简答题","p":["只能作状语，极少数还可以作补语","描摹副词、评注副词、否定副词、时间副词、频率副词、程度副词、范围副词等","内部虚化程度不等","兼具实词和虚词的某些特点"],"q":"副词的语法特点是只能作状语，极少数还可以作补语。副词按照语义与功能大体上可分成以下八类：","w":"normal","e":["核心考点"]},{"t":"“金、银”和“铜、铁、锡”都表示金属，因此它们属于同一个词类。（　）","y":"判断题","p":["错误","“金、银”是区别词，“铜、铁、锡”是名词","判断依据是组合能力而非意义"],"q":"这说明“金、银”是区别词，“铜、铁、锡”是名词。可见，意义只能是划分词类的参考标准。","w":"normal","e":["核心考点"]},{"t":"请指出下列词语各属于哪类形容词，并说明理由：雪白、血红、通红、鲜红。","y":"分析题","p":["都属于状态形容词","由单音节性质形容词前加一个表比喻显示高程度的语素构成","表示程度比较高，前面不能再加“很”"],"q":"(2)单音节性质形容词前面加一个表比喻显示高程度的语素。例如：雪白、血红、金黄、冰冷、冰凉、蜡黄、碧绿、漆黑、笔直、飞快、火热、通红、鲜红、煞白、死沉、稀烂、稀软、铁青、滚烫、崭新、溜圆、喷香。","w":"normal","e":["核心考点"]},{"t":"能充当句法成分的词是______，不能充当句法成分的词是______。","y":"填空题","p":["实词","虚词"],"q":"汉语词类的第一层次是分为“实词”和“虚词”两大类：能充当句法成分的词是实词，不能充当句法成分的词是虚词。","w":"normal","e":["核心考点"]},{"t":"数词表示数目和次序。表示数目的是______词，表示次序的是______词。","y":"填空题","p":["基数词","序数词"],"q":"数词表示数目和次序。表示数目的是基数词，表示次序的是序数词。","w":"normal","e":["核心考点"]},{"t":"叹词用来表示强烈感情和招呼应答，其语法特点是：一般不进入句子结构，______成句。","y":"填空题","p":["独立"],"q":"叹词的语法特点是：一般不进入句子结构，独立成句。","w":"normal","e":["核心考点"]},{"t":"拟声词用来模拟自然界的声音，它可以单独成句，在句中主要作______，重叠式加“的”，还可作谓语、补语和定语。","y":"填空题","p":["状语"],"q":"拟声词可以单独成句，在句中主要作状语，重叠式加“的”，还可作谓语、补语和定语。","w":"normal","e":["核心考点"]},{"t":"单纯方位词有14个：上、下、前、后、左、右、里、外、______、______、______、______、内、中。","y":"填空题","p":["东","西","南","北"],"q":"单纯方位词有14 个：上、下、前、后、左、右、里、外、东、西、南、北、内、中。","w":"normal","e":["核心考点"]},{"t":"指出下列各句中加点词属于兼类、同音、活用还是借用：（1）别太近视眼了。（2）他比女人还女人。（3）一桶油。（4）一张纸。","y":"分析题","p":["“别太近视眼了”——活用为形容词","“他比女人还女人”——活用为形容词","“一桶油”——借用为量词","“一张纸”——同音词"],"q":"4.借用：某个词通常被看作A类，但在词汇意义基本不变的情况下可以临时“借用”为B类，而且这种用法是全社会公认的。如一些表示容器、肢体以及工具的名词直接出现在数词后面时，是“借用”为量词，例如：一桶油、三车煤、画一笔、咬一口、打两巴掌。","w":"normal","e":["核心考点"]},{"t":"代词可以活用。请指出下列各句中代词活用的类型：“谁有事都找他帮忙”“怎么方便怎么做”“不知道他去了哪儿”“什么张三李四，我都不认识”。","y":"分析题","p":["谁有事都找他帮忙——任指","怎么方便怎么做——承指","不知道他去了哪儿——虚指","什么张三李四，我都不认识——例指","代词可以活用，疑问代词不表示疑问"],"q":"代词可以活用。比如疑问代词不表示疑问。人称代词和指示代词也可以活用。例如：(1)谁有事都找他帮忙。(任指)　(2)怎么方便怎么做。(承指)(3)不知道他去了哪儿。(虚指)　(4)什么张三李四，我都不认识。(例指)","w":"normal","e":["核心考点"]},{"t":"实词内部可再分为“______”与“______”。前者包括名词、动词、形容词三类；后者包括数词、量词、代词、区别词、副词、叹词、拟声词七类。","y":"填空题","p":["主体词","功能词"],"q":"实词内部可再分为“主体词”与“功能词”。前者包括名词、动词、形容词三类，特点是开放、数量众多。","w":"normal","e":["核心考点"]},{"t":"传统上，动词按照意义并且参考功能可以分为八类，包括动作动词、______、心理动词、存现动词、______、______、判断动词、形式动词。","y":"填空题","p":["使令动词","趋向动词","能愿动词"],"q":"动词按照意义并且参考功能可以分为八类","w":"normal","e":["核心考点"]}]},{"id":"xdhy_down-c01-s03","t":"第三节 虚词的作用及其辨析","w":"high","n":10,"k":[{"t":"助词","y":"名词解释","p":["黏着在词或短语上面，表示附加意义","附着在后面的一律读轻声","结构助词：的、地、得","时态助词：了、着、过","其他助词：似的、所、给、看、来、把、们、第、初、等"],"q":"助词共同的特点是：黏着在词或短语上面，表示附加意义，附着在后面的一律读轻声。助词主要有以下三类：1.结构助词：的、地、得……","w":"high","e":["2017 真题"]},{"t":"语气词","y":"名词解释","p":["一般用于句末","表示陈述、疑问、祈使、感叹等语气","永远黏着、后附、轻声"],"q":"一般用于句末，表示陈述、疑问、祈使、感叹等语气，永远黏着、后附、轻声。","w":"high","e":["2016 真题","2020 真题"]},{"t":"辨析副词“常常”与“往往”。","y":"辨析题","p":["都表示“经常性发生”","“往往”表示根据以往经验、在某种条件下发生带规律性的动作行为","无条件的或将来时的都不能用“往往”","“常常”没有这一限制"],"q":"“往往”表示根据以往的经验，在某种条件下，发生带规律性的动作行为，因此，无条件的或将来时的都不能用“往往”；“常常”则没有这一限制。","w":"high","e":["教材高频"]},{"t":"介词","y":"名词解释","p":["多是从动词虚化而来，又叫“副动词”","引进跟谓词有关的对象","跟名词组合成介词短语","主要作状语，也可以作补语"],"q":"介词多是从动词虚化而来，又叫“副动词”，部分现在还跟动词兼类。介词的语法作用是引进跟谓词有关的对象，跟名词组合成介词短语，主要作状语，也可以作补语。","w":"normal","e":["核心考点"]},{"t":"辨析语气词“吗”与“吧”。","y":"辨析题","p":["都用在是非疑问句末","“吗”疑大于信，怀疑程度大；“吧”信大于疑，怀疑程度小","“吧”句中可以出现“很可能”“八成”“大概”等词语","“吗”可加“难道”变成反问句，“吧”则不行"],"q":"“吧”表示基本上相信，但还有少许疑问，所以要对方给以确认，句中可以出现“很可能”“八成”“大概”等词语；而“吗”可加“难道”变成反问句，“吧”则不行。","w":"normal","e":["核心考点"]},{"t":"辨析连词“或者”与“还是”。","y":"辨析题","p":["都是表示“选择”的连词","“或者”只能用于陈述句","“还是”主要用于疑问句，用于陈述句也含有疑惑的意思"],"q":"“或者”只能用于陈述句，而“还是”主要用于疑问句，即使用于陈述句，也含有疑惑的意思。","w":"normal","e":["核心考点"]},{"t":"辨析连词“只有”与“只要”。","y":"辨析题","p":["都是连词，表示条件","“只有”可以连接名词性短语和介词短语","“只要”只能接动词性词语和主谓短语"],"q":"“只有”可以连接名词性短语和介词短语，而“只要”只能接动词性词语和主谓短语。","w":"normal","e":["核心考点"]},{"t":"连词可根据其所连接的对象分为哪三类？","y":"简答题","p":["只连接词和短语的：和、跟、同、与、及、或","只连接分句和句子的：即使、既然、如果、虽然、但是、所以等","既能连接词或短语，又能连接分句或句子的：并、并且、而、或者、因为、无论等"],"q":"连词可根据其所连接的对象分为以下三类：1.只连接词和短语的有：和、跟、同、与、及、或。","w":"normal","e":["核心考点"]},{"t":"考察虚词的用法，大致可以从哪八个方面入手？","y":"简答题","p":["适应不同的句类","适应于功能不同的词和短语","与之组合的成分音节多少不同","与之组合的成分肯定与否定不同","与之组合的成分简单与复杂不同","与相关成分的位置不同","与之相配合的词语不同","与之发生关系的成分是否可缺省"],"q":"对于虚词的用法，大致可以从以下八个方面去考察，即同类或同义的虚词可能在以下八个方面存在差别。","w":"normal","e":["核心考点"]},{"t":"辨析“非常”与“极其”“极为”在用法上的区别。","y":"分析题","p":["后两个词只用于书面","“非常”修饰的成分单音节、多音节都可以","“极其、极为”修饰的成分必须是多音节，多为双音节"],"q":"“非常”修饰的成分单音节、多音节都可以，而“极其、极为”修饰的成分必须是多单节，多为双音节。","w":"normal","e":["核心考点"]}]},{"id":"xdhy_down-c01-s04","t":"第四节 短语与层次分析法","w":"high","n":23,"k":[{"t":"短语","y":"名词解释","p":["由两个或两个以上单词构成的句法结构单位","在语义上能逐层贯通，在结构上能逐层搭配起来","没有句调的一组词","短语有两类：词组和结构"],"q":"由两个或两个以上单词构成的句法结构单位叫短语。它是在语义上能逐层贯通，在结构上能逐层搭配起来的没有句调的一组词。","w":"high","e":["2015 真题","2021 真题"]},{"t":"层次分析法","y":"名词解释","p":["分析句法结构层次的方法","是句法分析最基本、最有效的方法之一","正式学名叫“直接成分分析法”（IC）","由布龙菲尔德系统运用到句法结构分析上","分析时尽可能采取二分，俗称“二分法”"],"q":"简称IC)，这是由美国描写语言学家布龙菲尔德(L. Bloomfield)系统地运用到句法结构分析上来的","w":"high","e":["2012 真题","2016 真题","2020 真题"]},{"t":"“的”字结构","y":"名词解释","p":["由结构助词“的”附加在其他词语之后构成","使谓词性成分转化为名词性成分","在语义上起转指作用"],"q":"“的”字结构由结构助词“的”附加在其他词语之后构成，主要作用是使谓词性成分转化为名词性成分，同时在语义上也起转指作用。","w":"high","e":["2020 真题"]},{"t":"层次分析必须注意的三大基本原则是什么？","y":"简答题","p":["结构原则：切分出来的两个部分都必须是合法的句法结构体","功能原则：切分出来的两部分可以根据汉语句法的组合规律再重新组合起来","意义原则：语义上要符合逻辑常理","三个原则都需要遵守，往往某一原则起主导作用"],"q":"层次分析时必须注意三大基本原则：","w":"high","e":["2014 真题","2019 真题"]},{"t":"根据带不带标志“得”的情况，补语可以分为哪几类？","y":"简答题","p":["数量补语：不能带“得”，说明动作的次数或延续的时间","情态补语：必须带“得”，说明动作或有关事物的状态","结果补语：不带“得”，表示动作的结果","趋向补语：不带“得”，表示动作的趋向","可能补语：结果补语和趋向补语中间插入“得/不”，表示可能性","程度补语：补语是副词构成，表示程度"],"q":"1.数量补语：不能带“得”，由量词结构说明动作的次数或动作延续的时间。","w":"high","e":["2013 真题","2019 真题"]},{"t":"什么是“层次”？什么是“同形结构”或“歧义结构”？请举例说明。","y":"简答题","p":["“层次”指一些句法单位在组合时所反映出来的不同的先后顺序和语义关系","词形相同词序也相同但层次与意义都不同的句法结构叫“同形结构”或“歧义结构”","“咬死了猎人的狗”有两种切分：(咬死了)(猎人的狗)和[(咬死了)猎人的]狗"],"q":"“咬死了猎人的狗”是一个词形相同词序也相同但层次与意义都不同的句法结构，这叫作“同形结构”或“歧义结构”。所谓“层次”是个非常重要的概念，就是指一些句法单位在组合时所反映出来的不同的先后顺序和语义关系。","w":"high","e":["2018 真题"]},{"t":"请指出下列短语的类型：木头房子、我们大家、请他来、跳上、吃的、从北京、山坡前。","y":"分析题","p":["木头房子——偏正词组","我们大家——同位词组","请他来——兼语词组","跳上——述补词组","吃的——“的”字结构","从北京——介词结构","山坡前——方位结构"],"q":"实词与实词的非句法关系组合以及实词与虚词的组合叫“结构”。短语(结构)类型，主要用实词或虚词的名称来命名，实词与实词的组合包括：量词结构、方位结构；实词与虚词的组合包括：介词结构、“的”字结构。","w":"high","e":["2015 真题"]},{"t":"兼语词组","y":"名词解释","p":["由一个述宾词组跟一个主谓词组套叠而成","述宾词组的宾语兼任主谓词组的主语","典型兼语词组的谓语动词往往带有使动性"],"q":"兼语词组是由一个述宾词组跟一个主谓词组套叠而成，述宾词组的宾语兼任主谓词组的主语。典型兼语词组的谓语动词往往带有使动性。","w":"high","e":["教材高频"]},{"t":"同形结构","y":"名词解释","p":["词形相同词序也相同","层次与意义都不同","也叫歧义结构"],"q":"“咬死了猎人的狗”是一个词形相同词序也相同但层次与意义都不同的句法结构，这叫作“同形结构”或“歧义结构”。","w":"high","e":["教材高频"]},{"t":"简述层次分析法的三个基本原则。","y":"简答题","p":["结构原则：两部分都必须是合法的句法结构体","功能原则：两部分能根据汉语句法组合规律重新组合","意义原则：语义上符合逻辑常理"],"q":"层次分析时必须注意三大基本原则：","w":"high","e":["教材高频"]},{"t":"区别定心词组和状心词组的方法是什么？请举例说明。","y":"分析题","p":["主要依据中心语来判断：名词性词语前的修饰语一般是定语","谓词性词语前的修饰语一般是状语","还要看修饰语的性质及整个偏正词组所处的语法位置","名词或人称代词作修饰语一般应是定语；副词作修饰语一般应是状语"],"q":"区别定心词组和状心词组的方法主要依据中心语来判断：名词或名词性词语前面的修饰语一般应该是定语；谓词(动词或形容词)或谓词性词语前面的修饰语一般应该是状语。","w":"high","e":["教材高频"]},{"t":"请用层次分析的功能原则说明“刚买的书包”的切分。","y":"分析题","p":["a切分“刚”与“买的书包”无法重新组合，副词不能修饰名词","b切分“的书包”不是合法的短语","只有c切分“刚买的”和“书包”既符合结构原则也符合功能原则","“的”为定语标志，切分时可不予考虑"],"q":"即切分出来的这两个部分，可以根据汉语句法的组合规律，再重新组合起来。换言之，如果句法结构A切分为A1和A2，而且A1 和A2，都分别是一个合法的词语或短语，但是，我们还需要考察A1和A2能不能根据汉语句法的组合规律重新组合起来。例如：","w":"high","e":["教材高频"]},{"t":"短语（词组）可分为哪八类？短语（结构）又可分为哪四类？","y":"简答题","p":["词组八类：偏正词组、述宾词组、述补词组、联合词组、主谓词组、同位词组、连谓词组、兼语词组","结构四类：量词结构、方位结构、介词结构、“的”字结构"],"q":"实词与实词按照一定的句法关系组合起来的短语叫“词组”。短语(词组)类型，主要根据词组各组成成分的词性、组合方式及其所形成的语法关系形式来分类，包括：偏正词组、述宾词组、述补词组、联合词组、主谓词组、同位词组、连谓词组和兼语词组等八类。","w":"high","e":["教材高频"]},{"t":"请用层次分析的意义原则说明“一位小偷的辩护律师”的切分。","y":"分析题","p":["“一位小偷的辩护律师”a、b切分表面都可行","量词“位”用于尊称，用来修饰“小偷”不适合","“位”可以用来修饰“辩护律师”","所以a切分错误，b切分准确（意义原则）"],"q":"汉语的量词“位”是用于尊称的，用来修饰“小偷”显然是不适合的，不过可以用来修饰“辩护律师”，因此，a切分是错误的，b切分则是准确的。","w":"high","e":["教材高频"]},{"t":"按照层次分析的原则，对“一辆新车”的正确切分是（　　）。","y":"单项选择题","p":["只有b切分合理","两部分都是合法的短语","符合结构原则"],"q":"如果按照b切分，分出的“一辆”和“新车”都是合法的短语，所以只有b切分才是合理的。","w":"high","e":["教材高频"]},{"t":"请用层次分析的三原则说明“一辆新车”为什么只有一种切分是正确的。","y":"分析题","p":["“一辆新车”理论上可有三种切分","a切分分出“一辆”与“新”，但“辆新车”不是合法的短语","c切分出“一辆新”不合法","只有b切分，分出“一辆”和“新车”都是合法的短语"],"q":"即切分得出来的两个部分都必须是合法的句法结构体。比如句法结构A，切分为 A1和A2，那么，A1和A2，都应该是一个合法的词语或短语。例如：","w":"high","e":["教材高频"]},{"t":"分析“台上坐着主席团”与“台上唱着戏”两组句子在补语/变换上的差异，并说明其语义特征根据。","y":"分析题","p":["两组句子结构层次、结构关系相同","A组变换式为“主席团坐在台上”，B组为“台上正在唱着戏”","A组表示“存在”，着眼点是空间；B组表示“进行”，着眼点是时间","A组动词具有[+附着]特征，B组动词具有[+持续]特征"],"q":"A组句子的动词“坐、盖”等，虽然具体意义各不相同，但都具有[+附着]这一语义特征，就是说，都含有“附着于某物”的意思；使得A组句子表示“存在”的意义。","w":"high","e":["教材高频"]},{"t":"层次分析法的正式学名叫作＿＿＿＿分析法，这是由美国描写语言学家＿＿＿＿系统地运用到句法结构分析上来的。由于这种方法在分析时尽可能地采取二分，所以俗称＿＿＿＿。","y":"填空题","p":["直接成分分析(IC)","布龙菲尔德","二分法"],"q":"分析复杂短语结构层次关系的方法叫作“层次分析法”。它的正式学名叫作“直接成分分析法”(Immediate Constituent Analysis,简称IC),这是由美国描写语言学家布龙菲尔德(L. Bloomfield)系统地运用到句法结构分析上来的，后来又由哈里斯(N. Haris)和威尔斯(S.Wells)加以理论化和系统化，使这一方法日趋成熟。由于这种方法在分析时尽可能地采取二分(只有少数联合短语或连谓短语需要多分)，所以，俗称“二分法”。","w":"high","e":["教材高频"]},{"t":"语感","y":"名词解释","p":["对语言运用是否准确和得当的一种直接的本能的感觉","是长期积累起来的知识和能力的一种集中反映","需要有意识地去培养、积累和体验"],"q":"语感，就是对语言运用是否准确和得当的一种直接的本能的感觉。这种语感，是人们在使用语言的过程中，长期积累起来的知识和能力的一种集中反映。","w":"normal","e":["核心考点"]},{"t":"偏正词组","y":"名词解释","p":["前面的成分修饰、限定后面的成分","前面是修饰语，后面是中心语","分为定心词组和状心词组两类"],"q":"偏正词组前面的成分修饰、限定后面的成分，前面是修饰语，后面是中心语。偏正词组分为两类。","w":"normal","e":["核心考点"]},{"t":"述宾词组","y":"名词解释","p":["前后是支配与被支配、关涉与被关涉的关系","述语主要由及物动词充当","宾语一般是体词或体词性短语，也可以是谓词性短语或主谓词组","动词可分为体宾动词、谓宾动词、兼宾动词等"],"q":"述宾词组，前后是支配与被支配、关涉与被关涉的关系。述语主要由及物动词充当，宾语一般是体词或体词性短语，也可以是谓词、谓词性短语或主谓词组。","w":"normal","e":["核心考点"]},{"t":"同位词组","y":"名词解释","p":["前后成分所指内容相同","在句子中充当同一个句法成分","意义上构成复指关系"],"q":"同位词组前后成分所指内容相同，在句子中充当同一个句法成分，意义上构成复指关系。","w":"normal","e":["核心考点"]},{"t":"联合词组的构成有什么要求？","y":"简答题","p":["由两个或两个以上成分组成，构成并列、承接、选择或递进等关系","构成单位必须是语法性质相同或相近的","只有表示并列关系的，才可不用连词连接","为显示层次、分清主次，也经常使用连词"],"q":"不论是何种语法单位的联合，都必须是语法性质相同或相近的。其次，只有表示并列关系的，其构成成分才可以不用连词来连接。","w":"normal","e":["核心考点"]}]},{"id":"xdhy_down-c01-s05","t":"第五节 句型系统","w":"normal","n":18,"k":[{"t":"句子","y":"名词解释","p":["前后都有停顿","带有一定的语调","表示相对完整的意义","人们用来进行交际的基本语言单位"],"q":"什么是句子?前后都有停顿，带有一定的语调，表示相对完整的意义，人们用来进行交际的基本语言单位就叫句子。","w":"high","e":["教材高频"]},{"t":"句型","y":"名词解释","p":["按照句子的结构模式划分","类型系统"],"q":"第一，句型系统，即按照句子的结构模式划分出来的类型系统。","w":"high","e":["教材高频"]},{"t":"主谓句","y":"名词解释","p":["由主谓短语构成","能分析出主语和谓语两个直接成分"],"q":"主谓句是由主谓短语构成的句子，即能分析出主语和谓语两个直接成分的句子。","w":"high","e":["教材高频"]},{"t":"非主谓句","y":"名词解释","p":["单个词或非主谓短语构成","不能分析出主语和谓语","不宜叫无主句"],"q":"由单个词或者非主谓短语构成的单句是非主谓句。非主谓句不可能分析出主语和谓语来，所以不宜叫“无主句”。","w":"high","e":["教材高频"]},{"t":"中心词分析法","y":"名词解释","p":["传统语法分析句子的方法","又叫句子成分分析法","设立句子六大成分"],"q":"传统语法在进行句子分析时，主要采用“中心词分析法”。","w":"high","e":["教材高频"]},{"t":"简述句子与短语的区别。","y":"简答题","p":["备用单位vs使用单位","组合关系与实现关系","区别在于质的飞跃而非量的多少","句子≠主谓形式，主谓形式≠句子"],"q":"词与短语都是语言的备用单位，句子则是语言的使用单位。","w":"high","e":["教材高频"]},{"t":"“学校派老张值班。”属于（　　）。","y":"单项选择题","p":["兼语谓语句","老张既是派的宾语又是值班的主语"],"q":"(5)兼语谓语句：学校派老张值班。","w":"high","e":["教材高频"]},{"t":"比较中心词分析法与层次分析法的优缺点。","y":"论述题","p":["中心词分析法优点：简便易操作、利于归纳句型、利于修改病句","中心词分析法缺点：缺乏层次观念、缺乏关系观念、词组身份不一致、语义理解偏误","层次分析法优点：既讲层次又讲关系，弥补中心词分析法不足","层次分析法缺点：手续烦琐、难以把握全局、难以处理歧义结构"],"q":"中心词分析法的优点是：","w":"high","e":["教材高频"]},{"t":"简述动词性谓语句的六种基本句型，并各举一例。","y":"简答题","p":["动词谓语句","述宾谓语句","述补谓语句","连谓谓语句","兼语谓语句","主谓谓语句"],"q":"(1)动词谓语句：花开了。(2)述宾谓语句：我们吃苹果。(3)述补谓语句：汽车开走了。(4)连谓谓语句：小王去上海买器材。(5)兼语谓语句：学校派老张值班。(6)主谓谓语句：面包我吃光了。","w":"high","e":["教材高频"]},{"t":"进行句型分析时必须排除哪些不影响句型的因素?请分别举例说明。","y":"论述题","p":["表示语气的因素(语气词和语调)不影响句型","功能相同词义不同的词语替换不影响句型","扩展一般不影响句型","句子的特殊成分(独立成分、提示成分)不影响句型","语用移位不影响句型"],"q":"进行句型分析时，我们只考虑句型成分以及句子的结构模式，所以必须首先排除一些不影响句型的因素。","w":"high","e":["教材高频"]},{"t":"现代汉语句型首先分为＿＿＿与＿＿＿两大类型。主谓句是由＿＿＿＿构成的句子。","y":"填空题","p":["单句","复句","主谓短语"],"q":"现代汉语句型首先分为单句与复句两大类型。单句句型系统可以分为三个层次：","w":"high","e":["教材高频"]},{"t":"指出下列句子的句型：(1)今天星期三。(2)新来的厂长四十来岁。(3)天气晴朗。(4)我们吃苹果。(5)下雨了。","y":"分析题","p":["(1)名词谓语句","(2)数量谓语句","(3)形容词谓语句","(4)述宾谓语句","(5)动词性非主谓句"],"q":"3.名词性谓语句","w":"high","e":["教材高频"]},{"t":"提示成分","y":"名词解释","p":["称代式提示成分","总分式提示成分","不参加结构组合","出现在句首或句尾"],"q":"提示成分有两种：称代式提示成分和总分式提示成分，它们各有各的特点和作用。","w":"normal","e":["核心考点"]},{"t":"句子的特殊成分","y":"名词解释","p":["独立成分和提示成分","不参加句子的结构组合","不能独立成句","在语义表达上有特殊作用"],"q":"句子的特殊成分是指独立成分和提示成分。","w":"normal","e":["核心考点"]},{"t":"简述句型的三个特点。","y":"简答题","p":["抽象的、有生成性的","成系统的、有层次的","句型成分的结合有序列、有层次"],"q":"1.句型是抽象的、有生成性的","w":"normal","e":["核心考点"]},{"t":"简述非主谓句的四类，并各举一例。","y":"简答题","p":["名词性非主谓句","动词性非主谓句","形容词性非主谓句","特殊非主谓句"],"q":"由单个词或者非主谓短语构成的单句是非主谓句。非主谓句不可能分析出主语和谓语来，所以不宜叫“无主句”。非主谓句可以分为四类：","w":"normal","e":["核心考点"]},{"t":"简述独立成分的常见类型，并各举一例。","y":"简答题","p":["引起对方注意：你看/你想/你听","推测估计：看来/算起来/说不定/少说","表明意见态度：依我看/我看/我想","表示消息来源：据说/听说/据……说","总结举例补充注释：总之/正如/此外/即"],"q":"独立成分有很多种类型，最常见的有以下一些：1.为了引起对方的注意，常用“你看”“你想”“你听”“你说”等。","w":"normal","e":["核心考点"]},{"t":"试比较说明句子跟主谓短语的关系，并举例分析。","y":"论述题","p":["句子是使用单位，主谓短语是备用单位","口语中句子常是非主谓形式","主谓短语可成句也可作句子成分","句子≠主谓形式，主谓形式≠句子"],"q":"句子跟主谓短语是两个完全不同的概念。书面上的句子往往是主谓形式的，但口语中的句子却常常是非主谓形式的。","w":"normal","e":["核心考点"]}]},{"id":"xdhy_down-c01-s06","t":"第六节 句式系统","w":"normal","n":21,"k":[{"t":"句式","y":"名词解释","p":["根据句子的显著特点划分","句子类型","体现结构特点和语义特色"],"q":"句式是根据句子的显著特点划分出来的句子类型。","w":"high","e":["教材高频"]},{"t":"把字句","y":"名词解释","p":["介词“把”和它的宾语充当状语","选择并凸显特别关注的某个对象","表示动作或原因的影响产生某种结果或状态"],"q":"由介词“把”和它的宾语充当状语的句子叫作把字句。某个动作往往涉及许多对象(论元)，“把”的作用是选择并凸显说话者特别关注的某个对象。","w":"high","e":["教材高频"]},{"t":"被字句","y":"名词解释","p":["介词“被”和它的宾语充当状语","表示被动意义","宾语是施事或原因，主语是受事"],"q":"由介词“被”和它的宾语充当状语的句子叫作被字句。“被”的作用是表示被动意义，并且引进的宾语往往是动作的施事或原因，而主语则是动作的受事。","w":"high","e":["教材高频"]},{"t":"存现句","y":"名词解释","p":["表示存在、出现或消失","基本格式：处所词+存现动词+事物"],"q":"存现句是表示人或事物存在、出现或消失的句子。它的基本格式是“处所词+存现动词+事物”。","w":"high","e":["教材高频"]},{"t":"双宾语句","y":"名词解释","p":["述宾短语再带一个宾语","近宾语(间接宾语)","远宾语(直接宾语)"],"q":"双宾语句是一个述宾短语再带一个宾语的句子。紧靠动词的宾语叫作近宾语(又称间接宾语)，不紧靠动词的宾语叫作远宾语(又称直接宾语)。","w":"high","e":["教材高频"]},{"t":"主谓谓语句","y":"名词解释","p":["由主谓短语充当谓语","全句主语相当于话题，谓语相当于述题","大主语/大谓语、小主语/小谓语"],"q":"主谓谓语句是由主谓短语充当谓语的句子。全句的主语相当于“话题”，谓语相当于“述题”。","w":"high","e":["教材高频"]},{"t":"简述主谓谓语句的四类，并各举一例。","y":"简答题","p":["受事性主谓谓语句","领属性主谓谓语句","关涉性主谓谓语句","周遍性主谓谓语句"],"q":"(一)受事性主谓谓语句","w":"high","e":["教材高频"]},{"t":"简述静态存在句和动态存在句的区别。","y":"简答题","p":["动词本身有无动作性","动词是否可以从动作转化为状态","静态存在句的“着”可被“了”替换","动态存在句的“着”不能换成“了”，可转成陈述句"],"q":"静态存在句和动态存在句的区别在于两点：第一，动词本身有无动作性，比如“是”“有”只能构成静态存现句；第二，动词是否可以从动作转化为状态，所以静态存在句里的“着”能够被“了”替换。","w":"high","e":["教材高频"]},{"t":"简述把字句的结构类型和“把”字宾语的特点。","y":"简答题","p":["谓语必须复杂，不能是单个动词","结构类型：带补语/带宾语/带状语/带了着","宾语主要是受事，也可为工具、处所、与事、使事、施事","宾语一般是定指的、已知的"],"q":"把字句的谓语必须是复杂的，不能只是单个动词，特别是单音节动词。把字句的结构类型主要有四种：","w":"high","e":["教材高频"]},{"t":"简述构成双宾语句的动词的三种类型，并各举一例。","y":"简答题","p":["给予义动词，多数可加“给”","取得义动词，一般不能加“给”","言说义动词，表示言语传递或称呼认定"],"q":"1.具有“给予”义的动作动词，表示事物由甲传递给乙。比如：给、卖、送、赠、奖、发、递、输、交、还、赔、付、喂。这些动词的后面大多可以添加“给”字。例如：","w":"high","e":["教材高频"]},{"t":"判断：把字句中“把”的宾语都可以还原到动词之后。（　）","y":"判断题","p":["并非所有“把”的宾语都能还原到动词后","“把”的宾语不是由动词宾语提前得来"],"q":"但是，我们不能认为“把”的宾语就是从原来的动词宾语用“把”提前得来的，因为还有大量的把字句，“把”的宾语无法还原到动词后面。","w":"high","e":["教材高频"]},{"t":"分析说明被字句和把字句的变换关系，并举例说明变式的条件制约。","y":"分析题","p":["把字句与被字句可互相变换","被字句是把字句的对应格式","被字句主语是受事、被的宾语是施事，强调被动","把字句主语是施事、把的宾语是受事，强调结果","变换有条件制约：祈使句不可变换，光杆/感知动词构成的被字句不可变换","被把可融合，主语和把的宾语都是受事"],"q":"把字句和被字句有许多特点是相似的，而且由于语义上的对应关系，句式之间经常可以互相变换。例如：","w":"high","e":["教材高频"]},{"t":"下列句子能否成立?请说明原因。(1)你把雨伞别拿进来。(2)我把事情想弄清楚。","y":"分析题","p":["否定词/助动词只能出现在把字结构之前","“别”应在把字结构之前","助动词“想”应在把字结构之前","习惯用法中“不”可后置"],"q":"(1)你别把雨伞拿进来。————*你把雨伞别拿进来。(2)我想把事情弄清楚。————*我把事情想弄清楚。","w":"high","e":["教材高频"]},{"t":"判断：被字句的谓语动词必须是动作性较强的及物动词，非动作动词不能构成被字句。（　）","y":"判断题","p":["被字句谓语须是动作性较强的及物动词","非动作动词不能构成被字句"],"q":"被字句的谓语动词有一定限制：1.必须是动作性较强的及物动词。非动作动词，比如“有、是、成为”等是不能构成被字句的。","w":"high","e":["教材高频"]},{"t":"下列各项中，属于口语中替代“被”字表示被动的是（　　）。A.被……所 B.为……所 C.叫 D.所","y":"单项选择题","p":["书面语变体：被……所、为……所","口语变体：叫、让、给","固定格式：被……给、叫……给、让……给"],"q":"1. 在书面语中,保留着“被······所”“为······所”的文言格式。例如:","w":"high","e":["教材高频"]},{"t":"下列句子属于关涉性主谓谓语句的是（　　）。A.老张身体非常棒 B.这孩子我真没办法 C.今天天气很好 D.他性情温和","y":"单项选择题","p":["关涉性：大主语是大谓语关涉的对象","可加对/对于/关于","A为受事性，D为领属性"],"q":"(三)关涉性主谓谓语句。大主语是大谓语关涉的某一方面的对象。这类句子，可以在大主语前面加上介词“对、对于、关于”，形成句首状语，整个句子变成一般的主谓句。","w":"high","e":["教材高频"]},{"t":"请判断下列存现句是存在句还是隐现句，并进一步分类：(1)桌上放着一个花瓶。(2)天空中盘旋着一架直升机。(3)外面走进来一个女人。(4)书架上少了一本书。","y":"分析题","p":["(1)静态存在句","(2)动态存在句","(3)位移性隐现句","(4)非位移性隐现句"],"q":"关键是句中的动词不表示实在的动作，或者不表示动作进行，只表示存在的方式，后面所跟的“着”表示状态的持续。例如：","w":"high","e":["教材高频"]},{"t":"分析“孩子老吃糖，把糖全吃完了”“孩子老吃糖，把牙也吃坏了”“孩子老吃糖，把压岁钱也吃光了”“孩子老吃糖，把奶奶吃火了”四句中“把”的宾语分别担任什么语义角色。","y":"分析题","p":["把糖：受事","把牙：工具","把压岁钱：直接影响对象","把奶奶：间接影响对象"],"q":"(1)孩子老吃糖，把糖全吃完了。=孩子老吃糖+糖(因而)完了。(受事)(2)孩子老吃糖，把牙也吃坏了。=孩子老吃糖+牙(因而)坏了。(工具)","w":"high","e":["教材高频"]},{"t":"判断：被字句的主语表示的事物必须是定指的。（　）","y":"判断题","p":["被字句主语必须是定指的","形式上不定指但语境中可判定为定指"],"q":"被字句的主语表示的事物必须是定指的。","w":"normal","e":["核心考点"]},{"t":"分析说明位移性隐现句与非位移性隐现句在形式上的区别，并各举两例。","y":"分析题","p":["位移性隐现句带空间位置变化，句首可加“从”","非位移性隐现句不涉及空间位置变化，句首可加“在”","举例"],"q":"隐现句表示某个地方出现或消失了什么人或事物。","w":"normal","e":["核心考点"]},{"t":"判断：把字句中的否定词以及助动词只能出现在把字结构之前，而不能在它之后。（　）","y":"判断题","p":["否定词以及助动词只能出现在把字结构之前"],"q":"否定词以及助动词只能出现在把字结构之前，而不能在它之后。","w":"normal","e":["核心考点"]}]},{"id":"xdhy_down-c01-s07","t":"第七节 句类系统","w":"normal","n":15,"k":[{"t":"句类","y":"名词解释","p":["按照不同语气功能划分","陈述句、疑问句、祈使句、感叹句"],"q":"句类是句子按照不同语气功能划分出来的类型。一般分为陈述句、疑问句、祈使句和感叹句四类。","w":"high","e":["教材高频"]},{"t":"疑问句","y":"名词解释","p":["包括疑惑和询问双重意义","两大类型：结构类型、功能类型"],"q":"疑问句包括疑惑和询问双重意义。一个疑问句，通常是既疑且问，但可以疑而不问，也可以问而不疑。疑问句有两大类型：结构类型、功能类型。内部小类在结构上各具特色，在疑问信息、疑问焦点、疑问语气以及疑问代词的使用上都很有特点。","w":"high","e":["教材高频"]},{"t":"反问句","y":"名词解释","p":["又叫反诘问","无疑而问","用肯定表否定、用否定表肯定"],"q":"反问句又叫反诘问，它是“无疑而问”，即发问人心目中并没有真正的疑惑，只是在用疑问句的形式曲折地表达自己对某个事情的看法，语气上有不满、反驳的意味。","w":"high","e":["教材高频"]},{"t":"祈使句","y":"名词解释","p":["向听话人提出要求","主语限于第二人称代词、包括式第一人称复数、称谓词","经常省略"],"q":"向听话人提出要求，希望他做什么或别做什么的句子叫祈使句。祈使句的主语限于三类词语：第二人称代词、包括式的第一人称复数、称谓词，但是经常省略。","w":"high","e":["教材高频"]},{"t":"简述疑问句的四种结构类型，并各举一例。","y":"简答题","p":["是非问(语调升调或加语气词)","特指问(用疑问代词)","选择问(是……还是)","正反问(正反并列结构)"],"q":"按照结构特点，疑问句可以分为是非问、特指问、选择问、正反问四类。","w":"high","e":["教材高频"]},{"t":"“今天星期天吧?”属于疑问句中的（　　）。","y":"单项选择题","p":["是非问","结构同陈述句，带疑问语气词“吧”"],"q":"(4)今天星期天吧?(今天大概星期天吧?可能。)","w":"high","e":["教材高频"]},{"t":"简述“不”和“没有(没)”在语义和用法上的区别。","y":"简答题","p":["不表主观意愿，没有表客观情状","不无时间限制，没有不能用于将来时","不修饰动形，没有原则上只修饰动词","不可跟几乎所有助动词，没有只跟部分助动词"],"q":"“不”和“没有”(没)都表示否定，但语义和用法有明显的区别。这主要有以下几点：1.“不”往往表示主观意愿，“没有(没)”则表示客观情状。","w":"high","e":["教材高频"]},{"t":"按照结构特点，疑问句可以分为＿＿＿、＿＿＿、＿＿＿、＿＿＿四类。","y":"填空题","p":["是非问","特指问","选择问","正反问"],"q":"按照结构特点，疑问句可以分为是非问、特指问、选择问、正反问四类。","w":"high","e":["教材高频"]},{"t":"分析特指问的两种特殊简略格式“NP+呢?”和“VP+呢?”的疑问功能。","y":"分析题","p":["NP+呢：首发句询问处所，后续句可询问其他情况","VP+呢：通常询问假设性结果，可含假设连词","一定条件下不含假设义，理解为语用省略"],"q":"特指问有两种特殊的简略格式，即在形式上没有疑问代词出现，但是句末用了疑问语气词“呢”，而且要求有针对性的回答。","w":"high","e":["教材高频"]},{"t":"简述正反问句的多种省略变化形式，并说明用“没有”否定动词时的规范用法。","y":"简答题","p":["正反问是特殊的选择问","省略变化形式多样","用“没有”否定动词时肯定形式不能用“有”，只能零形式"],"q":"4.正反问","w":"high","e":["教材高频"]},{"t":"举例论述祈使句肯定形式和否定形式的不对称现象，并说明造成这种不对称的原因。","y":"论述题","p":["不对称现象的表现","褒贬色彩的影响","[+自主]与[-自主]语义特征的影响","带数量结构的祈使句只有肯定形式"],"q":"(三)肯定形式和否定形式的不对称现象","w":"high","e":["教材高频"]},{"t":"分析说明是非问句中语气词“吗”“吧”“啊”的疑问程度差异，并说明是非问为何不能用“呢”。","y":"分析题","p":["“吗”疑问程度强，基本不知","“吧”疑问程度弱，表示估测，求确认","“啊”惊疑兼有","是非问不能用“呢”，用“呢”变特指问简略格式"],"q":"语气词是非问则各有特点：用“吗”疑问程度比较强，基本不知，所以询问；用“吧”的疑问程度比较弱，表示一种估测，大体知道，但不敢确认，所以希望对方确认；“啊”则惊疑兼有。但是非问句决不能用语气词“呢”。","w":"high","e":["教材高频"]},{"t":"陈述句","y":"名词解释","p":["向听话人述说一件事情","语调平直，句尾略降","书面上用句号"],"q":"陈述句用来向听话人述说一件事情。例如：","w":"normal","e":["核心考点"]},{"t":"感叹句","y":"名词解释","p":["抒发强烈感情","三类：叹词构成/带明显标志/句尾用感叹号"],"q":"感叹句是抒发强烈感情的句子，它大体上可以分为三类：","w":"normal","e":["核心考点"]},{"t":"双重否定格式","y":"名词解释","p":["表示特殊肯定的意思","语气比单纯肯定或委婉或强烈"],"q":"双重否定格式用来表示特殊肯定的意思。例如：","w":"normal","e":["核心考点"]}]},{"id":"xdhy_down-c01-s08","t":"第八节 句法结构中的语义分析","w":"normal","n":15,"k":[{"t":"语义角色","y":"名词解释","p":["名词性成分担任的语义角色(论元)","揭示名词性成分跟动词之间的语义关系"],"q":"汉语句法结构中的语义关系是多种多样的，句法分析的重点是动词跟名词性词语之间的语义关系，这也叫配价关系，或者格关系。在各种语义关系中，名词性成分担任了一定的语义角色(论元)，如“施事”“受事”“工具”“方式”等，这实际上也就是揭示了名词性成分跟动词之间的语义关系。名词性词语经常担任的语义角色主要是：","w":"high","e":["教材高频"]},{"t":"语义指向","y":"名词解释","p":["某一成分跟其他成分之间在语义上的联系","同句法关系有时一致有时不一致","重点是非直接成分之间的语义联系"],"q":"语义指向是指句法结构中的某一成分跟其他成分之间在语义上的联系。这种语义联系同句法关系有时一致，有时不一致。","w":"high","e":["教材高频"]},{"t":"语义特征","y":"名词解释","p":["符合某种组合选择","有区别性特征","最小语义成分"],"q":"词语中符合某种组合选择的有区别性特征的最小语义成分就是语义特征。","w":"high","e":["教材高频"]},{"t":"简述句法结构中的语义分析主要包括哪三种。","y":"简答题","p":["语义角色","语义指向","语义特征"],"q":"句法结构中的语义分析，主要是指语义角色、语义指向和语义特征三种分析。","w":"high","e":["教材高频"]},{"t":"“他把书拿走了”中“书”担任的语义角色是（　　）。","y":"单项选择题","p":["受事","动作行为的承受者","由介词“把”引进"],"q":"2.受事：指动作行为的承受者，也可用介词“把”(将)引进。例如：小花猫逮住了一只大老鼠/他把书拿走了","w":"high","e":["教材高频"]},{"t":"句法结构中的语义分析，主要是指＿＿＿、＿＿＿和＿＿＿三种分析。","y":"填空题","p":["语义角色","语义指向","语义特征"],"q":"句法结构中的语义分析，主要是指语义角色、语义指向和语义特征三种分析。","w":"high","e":["教材高频"]},{"t":"简述动词跟名词性词语之间常见的语义角色，至少列举10种并各举一例。","y":"简答题","p":["施事","受事","系事/等事","与事","结果","工具","方式","处所","时间","目的/原因/材料/致使/对象"],"q":"名词性词语经常担任的语义角色主要是：","w":"high","e":["教材高频"]},{"t":"请运用语义特征分析说明“倒了一杯水”与“烧了一车炭”产生歧义的原因。","y":"分析题","p":["“倒1/烧1”具有[+去掉]","“倒2/烧2”具有[+获得]","名词语义特征也制约句义，“纸”[+可燃性]、“水”[-可燃性]"],"q":"例(1)可以理解为“倒掉”或“倒上”，例(2)可以理解为“烧掉”或“烧得”，关键就在于动词的语义特征的不同：“倒1”和“烧1”具有[+去掉]语义特征，“倒2”和“烧2”具有[+获得]的语义特征。","w":"high","e":["教材高频"]},{"t":"请运用语义特征分析“台上坐着主席团”与“台上唱着戏”两组句子的变换差异，并作解释。","y":"分析题","p":["A组“坐/盖”具有[+附着]，表示存在，着眼空间","B组“唱/下”具有[+持续]，表示进行，着眼时间","变换式相反证明语义特征差异"],"q":"有些结构形式完全相同的句子却有不同的变换式，对这种现象可以从语义特征上加以解释。例如：","w":"high","e":["教材高频"]},{"t":"请分析说明“她又买了一件毛衣”中“又”的语义指向，并指出如何用设置语境的方法加以分析。","y":"分析题","p":["a指向“她”","b指向“买”","c指向“一件”","d指向“毛衣”"],"q":"(6)她又买了一件毛衣。","w":"high","e":["教材高频"]},{"t":"下列句子中补语语义指向主语的是（　　）。A.你砍快了 B.我们砍光了树 C.我砍累了 D.把刀都砍钝了","y":"单项选择题","p":["前指主语：我砍累了、我学会了滑雪","B前指动词、D后指宾语、E前指把的宾语"],"q":"第二，前指主语。例如：(3)我砍累了。(=我砍+我累了)(4)我学会了滑雪。(=我学滑雪+我会了)","w":"high","e":["教材高频"]},{"t":"请分析下列“吃”字结构中名词性成分所担任的语义角色：(1)吃面条(2)吃大碗(3)吃食堂(4)吃大户(5)吃包月","y":"分析题","p":["吃面条：受事","吃大碗：工具","吃食堂：处所","吃大户：依据","吃包月：方式"],"q":"(1)吃面条(动作————受事)吃大碗(动作————工具)吃食堂(动作————处所)吃大户(动作————依据)吃包月(动作————方式)","w":"high","e":["教材高频"]},{"t":"请分析下列句中补语的语义指向：(1)你砍快了，慢一点!(2)我砍累了。(3)我们砍光了树再休息。(4)把刀都砍钝了。","y":"分析题","p":["前指动词","前指主语","后指宾语","前指“把”的宾语"],"q":"1.补语的语义指向","w":"high","e":["教材高频"]},{"t":"请分析下列句中状语的语义指向：(1)血压急剧下降。(2)祥子青筋蹦跳地坐下。(3)花也很多，圆圆的排成一个圈。(4)我把王群满意地打发走了。","y":"分析题","p":["后指中心语","前指主语","后指宾语","前指介词“把”的宾语"],"q":"第一，后指中心语。例如：","w":"high","e":["教材高频"]},{"t":"请运用语义特征分析说明为什么能说“谦虚点儿”“老实点儿”“灵活点儿”，但不能说“健康点儿”“伟大点儿”“高尚点儿”。","y":"分析题","p":["“谦虚/老实/灵活”具有[+可控]/[+自主]特征，可入祈使式","“健康/伟大/高尚”不具有[+可控]特征，不可入祈使式","祈使句对形容词有语义特征选择限制"],"q":"五、我们可以说：“谦虚点儿”“老实点儿”“灵活点儿”，但是，不能说：“健康点儿”“伟大点儿”“高尚点儿”。为什么?试运用语义特征分析法作出解释。","w":"normal","e":["核心考点"]}]},{"id":"xdhy_down-c01-s09","t":"第九节 歧义结构与框式结构","w":"normal","n":12,"k":[{"t":"歧义现象","y":"名词解释","p":["一个语言片断可作两种或两种以上的语义理解","又叫做同形","以同形为前提"],"q":"歧义现象是指一个语言片断可以作两种或两种以上的语义理解。歧义又叫做“同形”。","w":"high","e":["教材高频"]},{"t":"框式结构","y":"名词解释","p":["前后有两个不连贯的词语相互照应、相互依存","形成框架式结构","具有特殊的语法意义和特定的语用功能"],"q":"典型的框式结构，指前后有两个不连贯的词语相互照应，相互依存，形成一个框架式结构，具有特殊的语法意义和特定的语用功能。","w":"high","e":["教材高频"]},{"t":"简述消除歧义的手段。","y":"简答题","p":["借助语音差异(轻声、重音、停顿)","改换词语或改变句式","借助语境"],"q":"消除歧义的手段大致有以下几种。","w":"high","e":["教材高频"]},{"t":"简述汉语框式结构的三个主要特点。","y":"简答题","p":["由不变成分和可变成分组成","具有整体性的特殊语法意义(语义增值)","跟语境结合紧密，表示特定语用功能"],"q":"汉语框式结构的特点主要有三点：","w":"high","e":["教材高频"]},{"t":"“他在车厢上贴标语”产生歧义的原因是（　　）。","y":"单项选择题","p":["语义指向不同","状语“在车厢上”指向“他”或“贴标语”"],"q":"(5)他在车厢上贴标语。","w":"high","e":["教材高频"]},{"t":"“鸡不吃了”有歧义，请说明如何借助语境消除其歧义。","y":"分析题","p":["“鸡不吃了”有歧义","b借助下文“钻到鸡窝里”消除，指鸡不吃食","c借助下文“我吃饱了”消除，指人不吃鸡","利用上下文语义制约消除歧义"],"q":"(2)a.鸡不吃了。(有歧义)b.鸡不吃了，钻到鸡窝里去了。(无歧义)c.鸡不吃了，我已经吃饱了。(无歧义)","w":"high","e":["教材高频"]},{"t":"简述歧义的分类系统(从存在方式和产生根源两个角度)。","y":"简答题","p":["存在方式：口头歧义、书面歧义","产生根源：词汇歧义、组合歧义","组合歧义分为语法组合歧义和语义组合歧义"],"q":"汉语里的歧义现象种类繁多，可以从不同的角度进行分析。按照歧义现象存在的方式，可以先把它分为口头歧义和书面歧义。口头歧义主要是由同音词造成的。例如：","w":"high","e":["教材高频"]},{"t":"判断：框式结构的结构义等于各个部分成分语义之和。（　）","y":"判断题","p":["框式结构结构义是语义增值","不等于成分语义之和"],"q":"框式结构的结构义，不等于各个部分成分语义之和。换言之，框式结构的结构义是结构整体拥有的，是语义增值的结果。","w":"high","e":["教材高频"]},{"t":"请指出下列短语产生歧义的原因(歧义类型)：(1)进口彩电(2)饭不热了(3)自行车没有锁","y":"分析题","p":["进口彩电：结构关系不同(述宾/偏正)","饭不热了：词类不同(形容词/动词)","自行车没有锁：词类不同(副词/动词、名词/动词)"],"q":"1.词类不同。例如：","w":"high","e":["教材高频"]},{"t":"请指出下列歧义句的歧义类型，并加以分化：(1)这个人谁都不认识。(2)开刀的是他的父亲。(3)汽车运走了。(4)提拔团长。","y":"分析题","p":["语义角色不同","这个人：施事/受事","他的父亲：施事/受事","汽车：受事/工具","团长：受事/结果"],"q":"1.语义角色不同。例如：(1)这个人谁都不认识。(“这个人”既可能是施事，也可能是受事)(2)开刀的是他的父亲。(“他的父亲”既可能是施事，也可能是受事)(3)汽车运走了。","w":"high","e":["教材高频"]},{"t":"简述框式结构按照结构形式特点划分的四个类型。","y":"简答题","p":["双项双框式(单体封闭式/前后照应式)","单项双框式(插入式)","双项单框式","单项单框式"],"q":"框式结构按照它们的结构形式特点可以分为以下四个类型：","w":"normal","e":["核心考点"]},{"t":"试论述框式结构的语法意义(结构义不是成分义简单相加)，并结合“没A没B”加以分析。","y":"论述题","p":["结构义不等于成分义之和，是语义增值","同义/近义AB：加合否定，凸显程度高","反义名词AB：派生否定，表示不分AB","反义形容词AB：深层否定，暗含责怪义"],"q":"框式结构往往言简意赅，形式相对简略，语义比较特殊。框式结构的结构义，不等于各个部分成分语义之和。换言之，框式结构的结构义是结构整体拥有的，是语义增值的结果。比如“没A没B”的语义不等于“没A”加上“没B”。换言之，不是简单的并列关系，不是一般的双重否定，而是格式赋予它新的含义，起到强调凸显的作用，显示了说话人的主观意图，语义发生了增值。","w":"normal","e":["核心考点"]}]},{"id":"xdhy_down-c01-s10","t":"第十节 认知解释与动态变化","w":"normal","n":16,"k":[{"t":"移位","y":"名词解释","p":["改变句子常规语序","句法结构不变","语义关系基本不变"],"q":"这种改变句子常规语序，但句法结构不变，语义关系也基本不变的现象称为移位。","w":"high","e":["教材高频"]},{"t":"省略","y":"名词解释","p":["一定语境中省去一些成分","由上下文或语境制约造成","所省略成分确定无疑、可补回","补出后语义基本不变"],"q":"人们在运用语言时为了达到简洁的目的，在一定语境中常常省去一些成分，这就叫省略。省略必须符合三个条件……","w":"high","e":["教材高频"]},{"t":"原型范畴","y":"名词解释","p":["具有该类范畴典型属性和特点的成员的集合","原型与非原型之间逐步过渡","形成一个连续统"],"q":"所谓原型范畴是指具有该类范畴典型属性和特点的成员的集合。在原型和非原型之间没有不可逾越的鸿沟，从最典型成员到最不典型成员，按照典型程度的高低逐步过渡，从而形成一个连续统。","w":"high","e":["教材高频"]},{"t":"简述口语里移位句的特点。","y":"简答题","p":["被移位的两部分可以还原，还原后意思不变","语义重心在前置部分，后置部分轻读、带注释补充性","句末语气词附加在前置部分之后"],"q":"移位现象在口语里很普遍。口语里的移位句具有下列特点：","w":"high","e":["教材高频"]},{"t":"简述转喻和隐喻的认知机制，并各举两例。","y":"简答题","p":["转喻：依赖临近性与关联性，同一认知域转指","隐喻：用具体熟悉概念隐喻抽象陌生概念","空间隐喻时间"],"q":"世界上事物与事物之间往往存在某种联系，其中很重要的一个联系就是象似性，即两个事物之间，或者某部分外形，或者某种属性，或者某种特点比较相似，我们就把这种联系称之为象似性关系。我们在认识某个事物时，往往利用凸显的事物去认识比较隐蔽的事物，利用已知的事物去认识未知的事物。借助于象似性原则，我们主要采用了转喻和隐喻的方法。","w":"high","e":["教材高频"]},{"t":"试运用原型范畴理论分析汉语中名词和动词的划分问题。","y":"论述题","p":["名词、动词存在难以归类的中间成员","树立原型范畴，建立核心成员集合","名词动态性程度的连续统：静态名词到动词","采取柔性处理而非刚性处理"],"q":"因此，我们在给语言成分或现象分类时，首先需要树立起“原型范畴”，建立起核心的成员集合。所谓原型范畴是指具有该类范畴典型属性和特点的成员的集合。","w":"high","e":["教材高频"]},{"t":"认知的三个原则与方法是＿＿＿＿、＿＿＿＿、＿＿＿＿。","y":"填空题","p":["原型范畴","象似性原则","图形与背景"],"q":"认知的三个原则与方法","w":"high","e":["教材高频"]},{"t":"简述省略与隐含、重合的区别，并说明省略句与非主谓句的关系。","y":"简答题","p":["省略可确定补出且只有一种方式","隐含、重合无法或不必补出","省略是动态现象，非主谓句是静态结构类型","二者关系交叉","判断省略需结合语境"],"q":"省略的成分是可以肯定地补出来，并且只能有一种补出方式。例如：","w":"high","e":["教材高频"]},{"t":"运用图形与背景的认知理论解释汉语偏正短语中定语、状语总在前、中心语总在后的道理。","y":"分析题","p":["图形凸显、可移动、易辨认；背景不凸显、较大、静态","汉语存在背景先于图形的趋势","偏正短语排列是“背景——图形”，故定语状语在前、中心语在后"],"q":"汉语的结构组合实际上存在着背景往往先于图形出现的趋势。这也就是为什么偏正短语中，定语、状语总是在前，中心语总是在后的道理。偏正短语的排列往往是“背景————图形”。","w":"high","e":["教材高频"]},{"t":"插说","y":"名词解释","p":["临时打断原来句子结构","插入内容对前文说明、补充或改正"],"q":"在说话过程中，临时想起了什么，而有意打断原来句子的结构，插入某些内容，对前文予以说明、补充或改正，这就是插说。","w":"normal","e":["核心考点"]},{"t":"追补","y":"名词解释","p":["话说出来后追加补充","因为不够完整、准确或有错误","三种类型：补充型、注释型、修正型"],"q":"即当话说出来以后，才发现不够完整、不够准确，甚至有错误，说话人马上在话语之后追加补充，这就叫追补。","w":"normal","e":["核心考点"]},{"t":"象似性原则","y":"名词解释","p":["两个事物之间外形、属性、特点相似","借以认识隐蔽、未知事物","转喻和隐喻两种方法"],"q":"两个事物之间，或者某部分外形，或者某种属性，或者某种特点比较相似，我们就把这种联系称之为象似性关系。","w":"normal","e":["核心考点"]},{"t":"图形与背景","y":"名词解释","p":["把直接对象作为图形","把另一事物作为背景","图形又叫目的物，背景又叫参照物"],"q":"我们感知两个事物之间的空间关系时，往往把一个事物A作为直接对象“图形”，而把另外一个事物B当作“背景”。图形又叫“目的物”，背景又叫“参照物”。","w":"normal","e":["核心考点"]},{"t":"简述省略的类型(按语言环境)和省略的成分。","y":"简答题","p":["承前省","蒙后省","对话省","自述省","省略的成分：主语/谓语/宾语/修饰语"],"q":"根据省略的语言环境，可以把省略分为承前省、蒙后省、对话省和自述省四类。","w":"normal","e":["核心考点"]},{"t":"简述插说的五种类型，并说明插说与插入语的区别。","y":"简答题","p":["说明型","补充型","逻辑型","评述型","修正型","插入语是固定特殊成分，插说是动态变化现象"],"q":"插说大体上有五种类型：","w":"normal","e":["核心考点"]},{"t":"“把利好的股市叫作‘牛市’”运用的认知方式是（　　）。","y":"单项选择题","p":["隐喻","用具体概念隐喻抽象概念"],"q":"隐喻：利用具体、生动、常用、熟悉的概念来隐喻比较抽象、陌生、难以理解的概念。比如把利好的股市叫作“牛市”，把不景气的股市叫作“熊市”。","w":"normal","e":["核心考点"]}]},{"id":"xdhy_down-c01-s11","t":"第十一节 复句类型","w":"normal","n":22,"k":[{"t":"复句","y":"名词解释","p":["两个或两个以上分句构成","意义上密切相关","结构上互不包含","表示一定的逻辑语义关系"],"q":"因此，由两个或两个以上在意义上密切相关，结构上互不包含的分句所构成的语言单位，就叫复句。","w":"high","e":["教材高频"]},{"t":"并列复句","y":"名词解释","p":["先提出参照物","后续分句提出并存、平行或对立的事情","分句之间是“参事——并事”关系"],"q":"前行分句先提出一件事情作为“参照物”，后续分句则相应提出在意义上并存、平行或对立的事情，全句同时说明或描写几件事情或同一事情的几个方面。分句之间是“参事————并事”关系。","w":"high","e":["教材高频"]},{"t":"递进复句","y":"名词解释","p":["前行分句提出情况","后续分句更推进一层","分句之间是“基事——递事”关系"],"q":"前行分句提出一个情况，后续分句以此为基准，在数量、程度、范围、时间、功能或者其他方面更推进一层。分句之间是“基事————递事”关系。递进复句的典型格式是“不但⋯⋯，而且⋯⋯”。","w":"high","e":["教材高频"]},{"t":"连贯复句","y":"名词解释","p":["前行分句先陈述一种情况","后续分句陈述接着发生的另一种情况","分句之间是“先事——后事”关系"],"q":"前行分句首先陈述一种情况，后续分句随后陈述接着发生的另一种情况。分句之间是“先事————后事”关系。","w":"high","e":["教材高频"]},{"t":"因果复句","y":"名词解释","p":["前行分句说出原因","后续分句说出结果","分句之间是“原因——结果”关系"],"q":"前行分句说出原因，后续分句说出由此而产生的结果。分句之间是“原因————结果”关系。","w":"high","e":["教材高频"]},{"t":"条件复句","y":"名词解释","p":["前行分句显示某种条件","后续分句推导出可能的结果","分句之间是“条件——结果”关系"],"q":"前行分句显示某种条件，后续分句从该条件推导出可能的结果。分句之间是“条件————结果”关系。条件复句有三种类型：","w":"high","e":["教材高频"]},{"t":"转折复句","y":"名词解释","p":["前行分句承认某种客观事实作为让步","后续分句的结果违背常理","分句之间是“事实——转折”关系"],"q":"前行分句先姑且承认某种客观事实作为让步，后续分句提出的结果却是违背常理的，与前一分句形成转折语义。两个分句之间是“事实————转折”关系。","w":"high","e":["教材高频"]},{"t":"让步复句","y":"名词解释","p":["前行分句提出假设的事实并姑且承认","后续分句结果违背常理","分句之间是“假设——转折”关系"],"q":"(十)让步复句","w":"high","e":["教材高频"]},{"t":"简述复句和单句的区别。","y":"简答题","p":["句法结构上互不包含","关联词语是重要的语法标志","停顿是分句与分句之间的重要形式标志"],"q":"分句是一种单句形式，分句的构造与一般单句的构造基本上是一致的，只是分句没有完全独立的语调，不能表达一个完整的意思。区别单句和复句可以从三个方面进行：","w":"high","e":["教材高频"]},{"t":"试比较并列复句和连贯复句的异同。","y":"简答题","p":["并列是齐头并进、雁行式，次序可互换","连贯是相继进行、鱼贯式，一般不能换位","并列着眼于空间，连贯着眼于时间"],"q":"并列复句是齐头并进，雁行式，有时候次序可以互换而意义不变；连贯复句是相继进行，鱼贯式，由于时间上前后分明，一般不能换位。一个是横的并列，一个是纵的发展；一个着眼于空间，一个着眼于时间。","w":"high","e":["教材高频"]},{"t":"试比较让步复句和转折复句的异同。","y":"简答题","p":["相同点：语义都转到相反相对方面，是反预期、有转折意","不同点：让步复句前句是假设的，转折复句前句是真实的","让步复句“假设——转折”，转折复句“事实——转折”"],"q":"让步复句和转折复句相同点在于：后句跟前句相比，语义上都转到它的相反相对方面去了，是反预期的，都有转折的意思；两者不同点在于：让步复句的前句是假设的，转折复句的前句是真实的。","w":"high","e":["教材高频"]},{"t":"简述选择复句的两大类型及各自的小类。","y":"简答题","p":["取舍未定：取舍任选式(或者/要么)、取舍必选式(不是……就是)","取舍已定：先取后舍式(宁可……也不)、先舍后取式(与其……不如)"],"q":"几个分句分别说出几个待选项，并表示可以从中进行选择。分句与分句之间是“选事1————选事2”的关系。选择复句实际上可以分为“取舍未定”和“取舍已定”两大类型：","w":"high","e":["教材高频"]},{"t":"简述递进复句的四个特殊类型，并各举一例。","y":"简答题","p":["多重递进：不但……而且……甚至","逆向递进：不但不……而且不(没)","反向递进：不但不……反而","让步递进：尚且……何况"],"q":"递进复句有几个特殊类型：","w":"high","e":["教材高频"]},{"t":"简述特定条件句的三种类型及各自的关联框架。","y":"简答题","p":["充足条件句：只要……就","必要条件句：只有……才、除非……否则……不","周遍条件句：无论/不管……也/都"],"q":"2.特定条件句，这有三类：","w":"high","e":["教材高频"]},{"t":"简述复句分为四个大类、十个小类的依据和具体类型。","y":"简答题","p":["客观世界：时间(顺承)、空间(并列)","主观世界比较关系：平等、轻重","主观世界事理关系：顺理、违理","四大类十小类：平等、轻重、顺理、违理"],"q":"根据上述基本原则，我们把复句分为四个大类，十个小类：A.平等(Al 并列复句、A2选择复句);B.轻重(B1 递进复句、B2 补充复句);C.顺理(Cl连贯复句、C2因果复句、C3条件复句、C4目的复句)；D.违理(D1 转折复句、D2让步复句)。","w":"high","e":["教材高频"]},{"t":"“无论/不管……，也/都……”是（　　）的代表性框架。","y":"单项选择题","p":["周遍条件句","无论/不管……也/都……"],"q":"C.周遍条件句，代表性框架是“无论/不管⋯⋯，也/都⋯⋯”。","w":"high","e":["教材高频"]},{"t":"下列属于“违理”大类复句的是（　　）。A.因果复句 B.转折复句 C.条件复句 D.递进复句","y":"单项选择题","p":["违理大类含转折复句和让步复句","因果、条件属顺理","递进属轻重"],"q":"D.违理(D1 转折复句、D2让步复句)。","w":"high","e":["教材高频"]},{"t":"请区分下列复句是说明性因果还是推论性因果：(1)这一阵子因为老是停电，所以蜡烛、煤油灯竟然畅销起来。(2)既然主场客场都输了，就得承认我们确实技不如人。","y":"分析题","p":["(1)说明性因果，“因为……所以”，引出必然结果","(2)推论性因果，“既然……就”，推断应该发生的结果"],"q":"1.说明性因果。前句用已知的事实指出这是产生后句事实的原因，后句则引出某种必然的结果。常用关联词语是“因为⋯⋯，所以⋯⋯”。例如：","w":"high","e":["教材高频"]},{"t":"指出下列复句的类型：(1)这些手编工艺品一些用来做礼品送人，一些拿到宫外的市场上换取日用品。(2)大别山区不但矿产很丰富，而且自然景色很美。(3)既然主场客场都输了，就得承认我们确实技不如人。(4)尚春兰先生虽然不再登台演出了，但是早起练功吊嗓子的习惯没有改。","y":"分析题","p":["(1)并列复句","(2)递进复句","(3)推论性因果复句","(4)转折复句"],"q":"(1)这些手编工艺品一些用来做礼品送人，一些拿到宫外的市场上换取日用品。","w":"high","e":["教材高频"]},{"t":"意合法","y":"名词解释","p":["不用任何关联词语","依靠语序","依靠前后分句的语义制约"],"q":"有一些复句不用任何关联词语，完全依靠语序以及前后分句的语义制约构成，这就叫“意合法”。","w":"normal","e":["核心考点"]},{"t":"补充复句","y":"名词解释","p":["前行分句表示主要意思","后续分句对前者追补或解说","分句之间是“主事——补事”关系"],"q":"前行分句表示一个主要意思，后续分句对前者进行追补或解说。分句之间是“主事————补事”关系。","w":"normal","e":["核心考点"]},{"t":"目的复句","y":"名词解释","p":["一个分句表示目的","另一个分句表示达到目的的行为事件","分句之间是“目的——行为”关系"],"q":"一个分句表示目的，另一个分句表示为达到这一目的而发生的行为事件。分句之间是“目的————行为”关系。","w":"normal","e":["核心考点"]}]},{"id":"xdhy_down-c01-s12","t":"第十二节 多重复句与紧缩复句","w":"normal","n":12,"k":[{"t":"多重复句","y":"名词解释","p":["三个或三个以上分句","两个以上层次上组合","有几个层次就叫几重复句"],"q":"三个或三个以上的分句在两个以上的层次上组合起来的复句叫做多重复句。复句有几个层次，就叫几重复句，比如二重复句、三重复句、四重复句等。","w":"high","e":["教材高频"]},{"t":"紧缩复句","y":"名词解释","p":["分句间语音停顿取消","省略了一些关联词语","简称紧缩句"],"q":"一般的复句在分句与分句之间的语音停顿取消了，并且省略了一些关联词语，那就变成了紧缩复句，简称“紧缩句”。","w":"high","e":["教材高频"]},{"t":"划线分析法","y":"名词解释","p":["把层次分析法运用到多重复句分析","标出层次并标明关系"],"q":"分句与分句的组合是有层次的，因此，把层次分析法的原则和方法运用到多重复句的分析上，标出层次并标明关系，这就是“划线分析法”。","w":"high","e":["教材高频"]},{"t":"简述多重复句分析的操作程序(四个步骤)。","y":"简答题","p":["确定是单句还是复句、简单复句还是多重复句","确定分句数量，用竖线划开","确定分句两两之间的关系，标出基本复句类型","确定复句内部层次，竖线数表示层次"],"q":"具体操作的程序，可以分为四步：","w":"high","e":["教材高频"]},{"t":"简述紧缩复句的常见固定格式及其所表示的关系。","y":"简答题","p":["不……不……：假设","不……就……：假设","不……也……：让步","再……也……：让步","一……就……：承接/条件","非……不/才……：条件","越……越……：条件(倚变)"],"q":"(二)紧缩复句的固定格式","w":"high","e":["教材高频"]},{"t":"简述多重复句分析的基本原则和划线分析法与层次分析法的关系。","y":"简答题","p":["基本原则：形式和意义相结合","意义包括内容、关系意义、主观意义、语境意义","形式包括关联词语、句序","原理与层次分析法一致"],"q":"多重复句分析的基本原则是形式和意义相结合。意义包括复句表述的内容、分句之间的关系意义、说话人的主观意义、语境意义等，形式包括关联词语、句序等。","w":"high","e":["教材高频"]},{"t":"判断：在并列、连贯、选择等复句中，分句数量的增加只会延伸复句的长度，不会增加复句的层次。（　）","y":"判断题","p":["并列/连贯/选择复句增加分句不增层次","因果/转折/让步/条件复句增加分句也增层次"],"q":"第一，没有必然的联系，在并列、连贯、选择等复句中，分句数量的增加只会延伸复句的长度，不会增加复句的层次。","w":"high","e":["教材高频"]},{"t":"用划线分析法分析下列多重复句：(1)因为李洼乡资源贫乏(A)，交通也很闭塞(B)，所以这么多年总是摘不掉贫困乡镇的帽子(C)。(2)高尔基在自学的过程中，既没有名师指点(A)，更没有资料可供查阅(B)，碰到的困难当然就比寻常人更多(C)，但是疑难总是吓不倒他的(D)。","y":"分析题","p":["(1)A∥B(并列)|C(因果)","(2)A ⅢB(递进)∥C(因果)|D(转折)","注意单句内部停顿不要误判为分句停顿"],"q":"(1)因为李洼乡资源贫乏(A)，交通也很闭塞(B)，所以这么多年总是摘不掉贫困乡镇的帽子(C)。","w":"high","e":["教材高频"]},{"t":"“一……就……”格式","y":"名词解释","p":["紧缩复句常见固定格式","表示承接关系","表示条件关系"],"q":"5.“一⋯⋯就⋯⋯”。有两种作用。一是表示承接关系。例如：","w":"normal","e":["核心考点"]},{"t":"简述分析多重复句的辅助方法。","y":"简答题","p":["看切分后两部分语义是否相对完整","用换位法看分句关系是否合理","借助句中标点符号(分号是最大层次分界处)","多重复句也有多切分结构"],"q":"1.看切分以后的两部分的语义是否相对完整。例如：","w":"normal","e":["核心考点"]},{"t":"“钟不敲不响。”属于紧缩复句的固定格式（　　）。","y":"单项选择题","p":["“不……不……”格式","表示假设关系"],"q":"1.“不……不……”。表示假设关系，相当于“如果不……就不……”。例如：(1)钟不敲不响。","w":"normal","e":["核心考点"]},{"t":"分析下列紧缩句中前后主语的出现情况：(1)你走你就走。(2)他一不高兴就发脾气。(3)越干他越来劲。(4)多做练习才能提高成绩。(5)你去我也不去。(6)一响我吓一跳。","y":"分析题","p":["(1)(5)前后主语都出现","(2)主语相同只出现前主语","(3)(6)只出现后主语","(4)主语相同都未出现"],"q":"2.紧缩句的主语可以相同，也可以不同；可以全部出现，可以部分出现，也可以全不出现。例如：(5)你走你就走。(前后主语相同，都出现)(6)他一不高兴就发脾气。(前后主语相同，只出现前一主语)","w":"normal","e":["核心考点"]}]}]},{"id":"xdhy_down-c02","t":"第五章 语用","w":"high","s":[{"id":"xdhy_down-c02-s01","t":"第一节 现代汉语语用概述","w":"normal","n":17,"k":[{"t":"语境","y":"名词解释","p":["语境是人们运用语言进行言语交际的具体环境","语境是语用分析中极为重要的因素","语境分为语内环境和语外环境"],"q":"语境是人们运用语言进行言语交际的具体环境。语境是语用分析中极为重要的因素，任何一个言语行为，总是伴随着环境因素。“语境”的内涵很宽，首先可以分为“语内环境”和“语外环境”：","w":"high","e":["2018 真题","2020 真题","2023 真题"]},{"t":"语用学","y":"名词解释","p":["语用学探讨语言符号及其使用者与语境三者之间的关系","研究不同语境中话语交际时表达和理解语言的基本规律","语用即语言使用者在不同语境中话语交际的实际运用，包括表达和理解"],"q":"通常认为，词汇学探讨的是语言符号与符号所指对象之间的关系，语法学探讨的是语言符号与语言符号之间的关系，而语用学探讨的则是语言符号及其使用者与语境三者之间的关系。可见，与其他语言学分支学科分析最大的不同之处在于语用是语言使用者在不同语境中话语交际的实际运用，包括表达和理解。一旦从这样的角度来观察语言，语言就不再是一个个孤立的词、词组、句子，而是生活中的请求、叙述、讲解、提问、命令、威胁等各种复杂的言语行为。研究人们在不同语境中话语交际时表达和理解语言的基本规律，就是语用学。","w":"high","e":["2019 真题","2022 真题"]},{"t":"语用分析","y":"名词解释","p":["对语言使用者在不同语境中话语意义准确地表达和理解的基本规律进行分析","旨在揭示各种语言符号和非语言因素如何被调动以达到交际目的"],"q":"对语言使用者在不同语境中话语意义准确地表达和理解的基本规律进行分析，就是语用分析。语用分析能使我们深刻了解在特定情景下，各种语言符号和非语言因素如何被调动起来，说话者如何能准确地传情达意，受话者如何准确地获取话语原意，以达到交际的目的。","w":"high","e":["2021 真题"]},{"t":"语内环境","y":"名词解释","p":["语内环境是语言符号所构成的环境","即前言后语(口语)或上下文(书面语)","包括词语语境、句子语境、语篇语境"],"q":"A.语内环境。指的是语言符号所构成的环境，即通常说的前言后语(口语)或上下文(书面语)，包括词语语境、句子语境、语篇语境。","w":"high","e":["2019 真题"]},{"t":"语外环境","y":"名词解释","p":["语外环境是语言交际中的非语言因素","包括现场、情境、背景知识三个方面"],"q":"B.语外环境。指的是语言交际中的非语言因素，主要有以下三个方面的内容：","w":"high","e":["2020 真题","2022 真题"]},{"t":"字面意义","y":"名词解释","p":["离开语境时词或词组表示的意义称为字面意义","话语的字面意义通常跟真实意思不一样","发话者通常利用字面意义传达话语意义"],"q":"在离开语境的情况下，语言意义(词或词组表示的意义)称为字面意义；在特定语境下话语所传递的真实意思，称为话语意义。","w":"high","e":["2018 真题","2021 真题"]},{"t":"话语意义","y":"名词解释","p":["特定语境下话语所传递的真实意思称为话语意义","话语意义是语用分析的主要目的","表达能力是发话者利用语境表达话语意义的能力，理解能力是受话者利用语境获取话语意义的能力"],"q":"在离开语境的情况下，语言意义(词或词组表示的意义)称为字面意义；在特定语境下话语所传递的真实意思，称为话语意义。话语意义是语用分析的主要目的。","w":"high","e":["2019 真题","2023 真题"]},{"t":"简述语境对话语交际的作用。","y":"简答题","p":["从已知信息到未知信息：发话者以受话者已有信息为出发点，再传达未知信息","语境优先：语境能提供的信息优先于话语本身的信息，可从语境获得的信息原则上可不表现为语言形式"],"q":"[2666]语境对话语交际的作用主要有几个方面：\n[2667]第一，从已知信息到未知信息。“温故知新”，这句话清楚地反映了人类话语交际的认知过程。人们在遇到未接触过的新情况时，总是先调动大脑中贮存着的已有知识，对新情况进行理解，从而成为新知识；新知识又逐渐转化为旧知识，成为碰到新情况或者获取新经验时的起点或基础。","w":"high","e":["2019 真题","2022 真题"]},{"t":"简述发话者话语意义的表达策略。","y":"简答题","p":["预先策略：交际之前把表达内容和表达方式准备好","临时策略：交际时瞬间来不及周密思考作出的决策","模糊策略：不想表示、难于表示或摸不清对方意图时在瞬间采取的策略"],"q":"发话者的真实意图是“为什么说”，在特定语境中选择某种方式恰当地表达是“怎么说”，可以有不同的策略。","w":"high","e":["2021 真题"]},{"t":"语用分析的主要内容包括哪三个方面？","y":"简答题","p":["语境对话语交际起重要作用","字面意义和话语意义","话语结构及连贯规律"],"q":"我们进行语用分析，一定要结合现代汉语的特点，认识话语意义在具体语境当中如何恰当表达和理解，主要内容有以下三个方面：","w":"high","e":["2022 真题"]},{"t":"语用的四个基本要素是：发话者、受话者、______和______。","y":"填空题","p":["语用由发话者、受话者、话语内容、语境四个基本要素构成"],"q":"语用是一种人类的言语交际行为，通常由以下四个基本要素构成：","w":"high","e":["2018 真题","2021 真题"]},{"t":"什么是语内的语境知识？为什么说共同的语境知识是表达和理解的重要基础？请举例论述。","y":"论述题","p":["语言交际要达到最佳效果，最关键的条件是发话方和受话方必须拥有相同的语境知识","共同的语境知识有的已贮存在记忆中，有的可以临时获得","交际各方必须要有共同语境知识作为谈话的出发点或基础","举例：缺少共同球赛语境信息则交际无法进行；熟悉身份话题才能理解“你呢?”"],"q":"语言交际要达到最佳效果，最关键的条件是发话方和受话方必须拥有相同的语境知识，这是表达和理解的重要基础。这些共同的语境知识，有的已经贮存在记忆中，有的可以临时获得，不管如何，交际各方必须要有共同语境知识作为谈话的出发点或基础。","w":"high","e":["2020 真题"]},{"t":"话语","y":"名词解释","p":["发话者用语音表达的口语或文字表达的书面语的具体内容叫作话语","话语也叫超句体","话语以传递信息为主要目的，有激发型、传授型、宣泄型等类型"],"q":"发话者用语音表达的口语或文字表达的书面语的具体内容叫作“话语”。话语内容，少则一句话，多则一个演讲、一次讨论、一首诗歌、一本小说，所以也叫“超句体”。话语以传递信息为主要目的，所以其内容有多种类型，如激发型、传授型、宣泄型等，比较特殊的是诸如见面打招呼的“你好！”“吃了吗?”之类，属于慰藉型的交际。","w":"normal","e":["核心考点"]},{"t":"受话者对话语的理解是一个被动过程。","y":"判断题","p":["受话者对话语的理解不是被动过程","受话者在整个交际过程中处于主动探索、积极捕捉的心态"],"q":"这时候，受话者对话语的理解并不是一个被动过程，恰恰相反，在整个交际过程中，会一直处于主动探索、积极捕捉的心态中。","w":"normal","e":["核心考点"]},{"t":"下列不属于语用的基本要素的是（　　）","y":"单项选择题","p":["语用的四个基本要素是发话者、受话者、话语内容、语境"],"q":"语用是一种人类的言语交际行为，通常由以下四个基本要素构成：","w":"normal","e":["核心考点"]},{"t":"发话者只包括口语说话者，不包括书面语作者。","y":"判断题","p":["发话者指语言信息的发出者","包括口语说话者和书面语作者"],"q":"发话者指语言信息的发出者，包括口语说话者和书面语作者。","w":"normal","e":["核心考点"]},{"t":"请分析下面话语中受话者如何理解发话者的话语意义：甲：面条里要放辣油吗？乙：我是地道的四川人。","y":"分析题","p":["受话者通过相关语境知识来理解、推求话语意义","“我是地道的四川人”暗示的语境信息中只有“四川人爱吃辣”与问话相关","推断出“辣油不但要放而且要多放”的话语意义"],"q":"[2695](5)甲：面条里要放辣油吗?\n[2696]乙：我是地道的四川人。\n[2697]“我是地道的四川人”所能暗示的语境信息有许多，但其中只有“四川人爱吃辣”与问话要求相关，从而促使对方推断出“辣油不但要放而且要多放”的话语意义来。","w":"normal","e":["核心考点"]}]},{"id":"xdhy_down-c02-s02","t":"第二节 话语意义","w":"normal","n":23,"k":[{"t":"指称","y":"名词解释","p":["指称主要是名词的功能","用名词的概括性词义去确定特定语境中的所指对象","指称表现在有指无指、实指泛指、全指别指、定指不定指等情形"],"q":"指称主要是名词的功能，用名词的概括性词义去确定特定语境中的所指对象，同时用相应的语音去称呼它。语言系统中任何词语的意义借助于指称，就能产生话语意义。","w":"high","e":["2020 真题","2022 真题"]},{"t":"前提","y":"名词解释","p":["前提也称为预设，指交际各方共有的语境知识","是受话者正确理解、推导会话含意必须具备的先决条件和根据","前提处于具体话语产生之前，蕴藏在字面意义里"],"q":"前提，也称为预设，指交际各方共有的语境知识。这是受话者正确理解、推导会话含意必须具备的先决条件和根据。在时间上，前提的存在处于具体话语产生之前，由发话者预先设定交际各方共有的特定语境制约下，蕴藏在字面意义里。","w":"high","e":["2019 真题","2021 真题"]},{"t":"指示语","y":"名词解释","p":["指示语以具体交际情景要素作为参照点获得词义的所指对象","指示语以发话者为基准，在语境中有明确的指示对象和具体的意义","指示主要有四类：人称指示、时间指示、空间指示、话语指示"],"q":"某些词语以具体交际情景要素(说话者、说话时间、说话地点等)作为参照点，获得词义的所指对象，这些词语称为“指示语”。指示语以发话者为基准，在语境中有明确的指示对象，和具体的意义，这叫做“指示”。","w":"high","e":["2020 真题","2022 真题"]},{"t":"人称指示","y":"名词解释","p":["用人称指示语表示言语行为参与者所承担的角色","分第一人称、第二人称、第三人称三类"],"q":"用指示语表示言语行为参与者(交际各方)所承担的角色，就是人称指示。通常分为三类：第一人称、第二人称及第三人称。","w":"high","e":["2021 真题"]},{"t":"时间指示","y":"名词解释","p":["用指示语表示发话者说话时的各种时间","分三类：指示说话的时间、指示说话时间之前的时间、指示说话时间之后的时间"],"q":"用指示语表示发话者说话时的各种时间，就是时间指示。时间指示有三大类：","w":"high","e":["2020 真题"]},{"t":"空间指示","y":"名词解释","p":["用指示语表示发话者说话时所在地点的各种空间位置","现代汉语只用近指、远指两种指示方式","动态形式用动词“来”“去”表示"],"q":"用指示语表示发话者说话时所在地点的各种空间位置，就是空间指示。有的语言或方言有近指、中指、远指三种空间指示，如维吾尔语、苏州方言等。现代汉语只用近指、远指两种指示方式，将整个空间分为两部分：","w":"high","e":["2021 真题"]},{"t":"会话含意","y":"名词解释","p":["发话者在特定语境中没有用字面意义表达出来的意义","要靠受话者推求出来","也就是一般人所说的“言外之意”"],"q":"[2836]指称和指示通过字面意义联系语境，从而确定具体对象和内容。在日常话语交际中，不少时候发话者的真实意思并不是直接表现为字面意义，因此，借助于语境，隐藏在字面意义背后间接表述出来的话语意义称\n[2838]为“会话含意”。会话含意的理解与推导，要依靠交际各方必须具有共同的语境知识，这就是“前提”。","w":"high","e":["2018 真题","2020 真题","2022 真题"]},{"t":"辨析“有指”与“无指”。","y":"辨析题","p":["有指：名词跟语境中特定对象联系起来","无指：名词仅用来表示一种性质，语义作用表示属性","例：“打碎了一块玻璃”的“玻璃”是有指；“玻璃窗子”的“玻璃”是无指"],"q":"例(1)中的名词“玻璃”是有指称的，要理解例(1)的话语意义就要把“玻璃”这个词跟语境中特定的一块玻璃联系起来，这是“有指”。例(2)中有指称的是“窗子”，“玻璃”却仅用来表示一种性质，其语义作用表示属性，这是“无指”。","w":"high","e":["2021 真题"]},{"t":"辨析“实指”与“泛指”。","y":"辨析题","p":["实指和泛指是有指的两种情况","实指：与发话者心目中已有确定目标的对象联系","泛指：与语境中任意的对象联系","例：“我的笔”是实指，“借支笔”的“笔”是泛指"],"q":"一是可以通过“实指”用法与语境中一些确切的对象，也就是发话者心目中已有确定目标的对象联系起来；二是通过“泛指”用法与语境中任意的对象联系起来。","w":"high","e":["2019 真题","2022 真题"]},{"t":"辨析“全指”与“别指”。","y":"辨析题","p":["全指和别指都属于实指","全指：把词语与所指对象的整个集合联系起来，确定目标是集合中的所有成员","别指：指称集合中某些确切的对象，与别的对象有所区别"],"q":"它们的共同点在于所指的都是有确定目标的对象，但“全指”的用法把词语与所指对象的整个集合联系起来————确定目标是集合中的所有成员；“别指”指称集合中某些确切的对象，与别的对象有所区别。","w":"high","e":["2020 真题"]},{"t":"辨析“定指”与“不定指”。","y":"辨析题","p":["定指：发话者认为受话者已经了解，把对象作为已知事物陈述","不定指：发话者认为受话者并不了解，把对象作为陌生事物陈述","不定指一般通过数词“一”与量词组成数量短语再修饰名词来实现"],"q":"一是发话者可能认为受话者已经了解，于是就把对象作为已知事物向受话者陈述，这就是“定指”的用法；二是发话者也可能认为受话者并不了解，于是就把对象作为陌生事物向受话者陈述，这就是“不定指”的用法，暗示受话者准备接纳一个新的对象。","w":"high","e":["2018 真题","2021 真题"]},{"t":"辨析“前提”与“会话含意”。","y":"辨析题","p":["前提是交际各方共有的语境知识，是推导会话含意的先决条件","前提处于具体话语产生之前，蕴藏在字面意义里","会话含意是要靠受话者推求出来的话语意义","前提是基础，会话含意是推导结果"],"q":"前提，也称为预设，指交际各方共有的语境知识。这是受话者正确理解、推导会话含意必须具备的先决条件和根据。","w":"high","e":["2020 真题","2022 真题"]},{"t":"指称在表达中有哪些不同的情形？","y":"简答题","p":["有指和无指","实指和泛指","全指和别指","定指和不定指"],"q":"[2755]指称在表达中有以下不同的情形：\n[2756]1.有指和无指\n[2757]指称主要是名词的功能，但名词的使用未必一定是指称。例如：","w":"high","e":["2019 真题","2023 真题"]},{"t":"话语意义的基本表现形式有哪三类？","y":"简答题","p":["指称和指示","会话含意","前提","指称指示涉及字面意义，会话含意和前提隐含在字面意义背后需借助语境推导"],"q":"话语意义基本表现形式有三类：“指称”和“指示”“会话含意”“前提”。","w":"high","e":["2019 真题","2021 真题"]},{"t":"简述前提在日常话语交际中的作用。","y":"简答题","p":["提高话语交际的效果，避免令人烦闷的语句，便于推求言外之意","对话语语义的连贯性具有积极作用，使话语语义得以接续、生长"],"q":"通过前提，我们可以提高话语交际的效果。发话者可以把与受话者共同熟悉的语境信息作为前提，不直接表达出来，不仅可以避免令人烦闷的语句，受话者又可以根据共有的已知语境知识推求出发话者的“言外之意”。","w":"high","e":["2021 真题"]},{"t":"试述“指称”与“指示”的联系与区别。","y":"论述题","p":["指示词语的话语意义分为指称和指示两种，必定与具体语境中的特指对象相联系","指称主要是名词的功能，被指称对象必须具备指称词词义所概括的本质特征","指示以交际情景要素为参照点，以发话者为基准","指示比指称更能体现话语与语境的紧密联系","前后互指关系不是指示"],"q":"从上例我们看到，指示词的意义必然联系语境才能确定。一段话语中如果出现了指示词，受话者就会努力地从语境中寻找具体意义，按照发话者指示的中心线索，把话语的语义组织连贯起来。由此可见，指示要比指称更能体现话语与语境的紧密联系。","w":"high","e":["2020 真题","2023 真题"]},{"t":"请分析“小张的妹妹考取了清华大学”这句话所包含的前提。","y":"分析题","p":["有一个叫小张的人","小张有个妹妹","有一所叫清华大学的学校","小张的妹妹有能力去考大学"],"q":"[2851]这句话除了它本身意义之外，还包含了：\n[2852]a.有一个叫小张的人\n[2853]b.小张有个妹妹\n[2854]c.有一所叫清华大学的学校\n[2855]d.小张的妹妹有能力去考大学","w":"high","e":["2019 真题","2023 真题"]},{"t":"指示主要有四类：人称指示、时间指示、______和______。","y":"填空题","p":["指示分四类：人称指示、时间指示、空间指示、话语指示"],"q":"[2792]指示主要有以下四类：\n[2793]1.人称指示\n[2794]用指示语表示言语行为参与者(交际各方)所承担的角色，就是人称指示。通常分为三类：第一人称、第二人称及第三人称。","w":"high","e":["2019 真题","2022 真题"]},{"t":"请分析下列话语中指示语的参照点：“现在解散，十分钟后，我们在这里集合！”","y":"分析题","p":["指示语以发话者此时的言语行为作为参照点","“现在”是说出该词的时刻，“十分钟后”据此确定","“我们”是发话者加上受话者","“这里”是发话者正在说话的地方"],"q":"学生们要理解老师的这句话，就要先确定“现在”“我们”“这里”要以老师此时的言语行为作为参照点：“现在”就是老师说出“现在”这个词的时刻，有了它，“十分钟后”是什么时间也就得到了确定，而“我们”就是说出“我们”这个词的老师加上上体育课的学生，“这里”就是老师正在说话的地方。","w":"high","e":["2019 真题","2022 真题"]},{"t":"分析下列两句中“小偷”的指称类型：（10）小偷从后门进来了。（11）后门来了个小偷。","y":"分析题","p":["主语位置上的名词倾向于定指","宾语位置上的名词倾向于不定指","例(10)“小偷”是定指，例(11)“(一)个小偷”是不定指"],"q":"[2780]在现代汉语中“不定指”一般通过数词“一”与量词组成数量短语，再修饰名词来实现，如例(9)“一伙窃贼”等。在没有数量短语的情况下，出现在主语位置上的名词倾向于“定指”，而出现在宾语位置上倾向于“不定指”。例如：\n[2781](10)小偷从后门进来了。\n[2782](11)后门来了个小偷。\n[2783]例(10)“小偷”是定指,例(11)“(一)个小偷”是不定指。","w":"high","e":["2019 真题"]},{"t":"会话含意是隐含在字面意义背后、需要借助于语境推导的话语意义，而指称和指示是涉及字面意义的话语意义。","y":"判断题","p":["指称和指示涉及字面意义","会话含意和前提隐含在字面意义背后，需要借助语境推导"],"q":"虽然都要依靠语境，不过，“指称”和“指示”是涉及字面意义的话语意义，而“会话含意”“前提”则不同，是隐含在字面意义背后、需要借助于语境推导的话语意义。","w":"high","e":["2020 真题"]},{"t":"话语指示","y":"名词解释","p":["用指示语表示发话者表达过程中指语言符号链条中某一部分","话语指示分三类：正说写的话语、之前的话语、之后的话语"],"q":"用指示语表示发话者表达过程中指语言符号链条中某一部分称为话语指示。由于话语都是按时间顺序展开的，所以话语指示与时间指示一样分三类：","w":"normal","e":["核心考点"]},{"t":"“指示语使用有两个阶段”，其第一阶段是（　　）","y":"单项选择题","p":["第一阶段：确定以言语行为中的哪一要素为参照点","第二阶段：确定某一指示语所指什么"],"q":"[2787]某些词语以具体交际情景要素(说话者、说话时间、说话地点等)作为参照点，获得词义的所指对象，这些词语称为“指示语”。指示语以发话者为基准，在语境中有明确的指示对象，和具体的意义，这叫做“指示”。例如：我、他、这里、今天、此刻、上文、本世纪、下星期、本法官等，这些词语可作为指示语。\n[2788]指示语使用有两个阶段：首先，确定以言语行为中的哪一要素为参照点，例如“我”“你”“他”须以发话者是谁为参照点，“今天”“下星期”须以说话的时间为参照点……在此基础之上，再去确定某一指示语所指什么。例如，只有在确定了说话地点以后，才能确定“这里”是哪里，“那里”又是哪里。假设有一位体育老师对他的学生宣布：","w":"normal","e":["核心考点"]}]},{"id":"xdhy_down-c02-s03","t":"第三节 言语行为与会话原则","w":"high","n":32,"k":[{"t":"言语行为","y":"名词解释","p":["言语行为指用言语来施行、达到交际意图的行为","整个过程由言内行为、言外行为、言后行为构成","过程可描述为言之发、示言之力、收言后之果"],"q":"话语交际可以看成人类的一种“言语行为”，指的是用言语来施行、达到交际意图的行为。人们运用语言进行交际的整个过程，实际上是由一个接一个的言语行为构成的，即：言内行为————言外行为————言后行为，最后达到发话者的交际意图。","w":"high","e":["2018 真题","2020 真题","2022 真题"]},{"t":"言内行为","y":"名词解释","p":["言内行为指言语表达(说、写)这一行为本身","即“以言指事”，又称为“以言表意”"],"q":"言内行为指言语表达(说、写)这一行为本身，“以言指事”。人们在运用语言进行交际时，首先需要按照说话意图选择一定的词语按照句法规则加以组合，赋予这句话一连串语音形式，或者写成一系列文字；从而以语言意义为基础，形成话语；这话语还必须与当时的语境发生联系。这样的一连串交际活动，就是言内行为，又称为“以言表意”。","w":"high","e":["2019 真题","2021 真题"]},{"t":"言外行为","y":"名词解释","p":["言外行为指用言语表达来体现发话者意图的一种行为","即“以言行事”"],"q":"言外行为指用言语表达(说、写)来体现发话者意图的一种行为，即“以言行事”。","w":"high","e":["2018 真题","2021 真题"]},{"t":"言后行为","y":"名词解释","p":["言后行为指受话者接收话语之后所受到的影响","即话语所带来的实际结果","也就是“以言取效”"],"q":"言后行为指受话者接收发话者话语之后所受到的影响，也就是话语所带来的实际结果，即“以言取效”。","w":"high","e":["2019 真题","2022 真题"]},{"t":"数量准则","y":"名词解释","p":["话语所含信息量与本次交谈所需信息量应该一致","发话者应提供适量信息，既不能太少也不能太多","受话者相信发话者正是这样做的"],"q":"话语所含信息量与本次交谈所需信息量应该一致。即在进行一次言语行为时，发话者应根据语境要求向受话者提供适量信息，既不能太少，也不能太多；同时受话者也相信发话者正是这样做的。","w":"high","e":["2019 真题"]},{"t":"质量准则","y":"名词解释","p":["话语提供的信息内容必须跟语境中的实际情况相一致","发话者所提供的信息真实可靠，不说假话","受话者的合作表现在他相信发话者说的是真话"],"q":"话语提供的信息内容必须跟语境中的实际情况相一致。也就是说，发话者所提供的信息真实可靠，不说假话。","w":"high","e":["2020 真题"]},{"t":"关联准则","y":"名词解释","p":["话语之间以及话语与话题之间应该相互关联","发话者按“已知→未知”认知顺序组织、展开话语","受话者相信发话者有诚意，努力搜寻可能存在的联系"],"q":"话语之间以及话语与话题之间应该相互关联。对发话者来说，有交际的诚意，说话就会认真按照所说事物之间的逻辑联系，遵守关联准则，按照受话者接受新经验时“已知→未知”认知顺序来组织、展开话语。","w":"high","e":["2018 真题","2022 真题"]},{"t":"方式准则","y":"名词解释","p":["话语的表达方式让受话者易于理解","尽量避免歧义、晦涩、啰唆、含混等现象","追求通晓流畅、条理分明、易于理解的表达方式"],"q":"话语的表达方式让受话者易于理解。发话者既然诚心诚意告诉受话者一些事情，就应该让话语的表达方式清楚明白，简明易懂，使受话者能在花费最少量的精力和时间的情况下获取最多量的信息。所以发话者在说话时应尽量避免歧义、晦涩、啰唆、含混等现象，而追求通晓流畅、条理分明、易于理解的表达方式。","w":"high","e":["2021 真题"]},{"t":"礼貌原则","y":"名词解释","p":["礼貌原则指尽量把不礼貌的表达方式减低到最低限度","礼貌原则也称为得体原则","礼貌原则处在比合作原则更高的层次上","礼貌原则比合作原则具有更大的灵活性"],"q":"礼貌原则指在其他条件相同的情况下，尽量把不礼貌的表达方式减低到最低限度。礼貌原则也称为得体原则。礼貌原则是语用另一个核心内容，它是在合作原则基础之上提出的，为了给合作原则“保驾护航”，使其交际效率最高，效果最好，也为了更合理解释话语交际上的复杂现象。","w":"high","e":["2018 真题","2020 真题","2022 真题"]},{"t":"慷慨准则","y":"名词解释","p":["慷慨准则即尽量少表达利己的和有损于对方的看法","使他人受惠最大而受损最小，使自己受惠最小而受损最大","用疑问句表示祈使是一种委婉的表达方式"],"q":"[2941]1.慷慨准则：尽量少表达利己的和有损于对方的看法\n[2942]话语交际内容尽量使他人受惠最大而受损最小，尽量使自己受惠最小而受损最大。这是一种处理人际关系的道德观念。这里的“惠”和“损”可以是实际利益上的，也可能是感情上观念上的。","w":"high","e":["2020 真题"]},{"t":"一致准则","y":"名词解释","p":["一致准则即尽量缩小与对方的分歧，尽量夸大与对方的一致","分歧和一致可以是观点上的，也可以是情感上的"],"q":"[2948]3.一致准则：在话语中尽量缩小与对方的分歧，尽量夸大与对方的一致\n[2949]这里的分歧和一致可以是观点上的，也可以是情感上的。就观点而言，受话者与自己有相同的认知，就能够使他进一步接受自己看法；越是夸大与对方的一致之处，就越能在主要观点上让对方认同；就情感而言，夸大一致即尽量显示对对方的同情或关心，缩小分歧即尽量淡化削弱对对方的厌恶，使各方消除情感距离，更易于在一种融洽的氛围中实现交际意图。","w":"high","e":["2021 真题"]},{"t":"会话合作原则","y":"名词解释","p":["会话合作原则是反映普遍规律的基本原则，由四条准则组成","包括数量准则、质量准则、关联准则、方式准则"],"q":"成功的话语交际都有赖于交际各方的密切合作，会话合作原则就是这样一个反映了普遍规律的基本原则，它由四条准则组成。按这四条准则进行的言语行为在信息传递上应该是效率最高且最为合理的。","w":"high","e":["2018 真题","2020 真题","2022 真题"]},{"t":"竞争类言语行为","y":"名词解释","p":["竞争类言语行为有病“命令”“要求”“批评”“禁止”等","行为形式本身是失礼的","对语言方式并没有严格要求，发话者可以选择"],"q":"1.竞争类言语行为。这类行为有“命令”“要求”“批评”“禁止”等。这些行为形式本身之所以是失礼的，是因为与发话者想达到的目的和礼貌要求之间的关系不太协调。","w":"high","e":["2020 真题"]},{"t":"会话含意的推理","y":"名词解释","p":["会话含意的推理是语用分析主要的任务和目的","故意违反合作原则就是言外之意的推理信号","受话者从字面意义出发，根据语境去努力推导出真正意图"],"q":"会话含意在交际中有重要价值，是语用的核心内容。所以，会话含意的推理是语用分析主要的任务和目的。","w":"high","e":["2019 真题","2022 真题"]},{"t":"会话含意推理的过程","y":"名词解释","p":["会话含意的推理是一种演绎式的推理","需要有大前提(一般性的知识)和小前提(针对特定对象的具体知识)","被选定的相关语境知识是大前提，字面意义是小前提","推理就是从大前提推导出针对特定对象的新结论"],"q":"会话含意的推理是一种演绎式的推理，它的进行需要有大前提(一般性的知识)；还需要有小前提(针对特定对象的具体知识)。经过了字面意义和相关前提两个环节的处理，会话含意的推理就具备了大、小前提：被选定的相关语境知识是大前提，字面意义是小前提，推理就是从大前提推导出针对特定对象的新结论：","w":"high","e":["2020 真题","2022 真题"]},{"t":"简述礼貌原则的三条准则。","y":"简答题","p":["慷慨准则：尽量少表达利己的和有损于对方的看法","谦虚准则：在话语中尽量少赞誉自己并少贬低对方","一致准则：尽力缩小与对方的分歧，尽量夸大与对方的一致"],"q":"[2940]跟合作原则一样，礼貌原则也体现为一些具体准则：\n[2941]1.慷慨准则：尽量少表达利己的和有损于对方的看法\n[2942]话语交际内容尽量使他人受惠最大而受损最小，尽量使自己受惠最小而受损最大。这是一种处理人际关系的道德观念。这里的“惠”和“损”可以是实际利益上的，也可能是感情上观念上的。","w":"high","e":["2019 真题","2022 真题"]},{"t":"简述会话合作原则的四条准则。","y":"简答题","p":["数量准则：信息量与交谈所需信息量一致","质量准则：信息内容与语境中的实际情况一致","关联准则：话语之间及话语与话题之间相互关联","方式准则：表达方式让受话者易于理解"],"q":"[2904]成功的话语交际都有赖于交际各方的密切合作，会话合作原则就是这样一个反映了普遍规律的基本原则，它由四条准则组成。按这四条准则进行的言语行为在信息传递上应该是效率最高且最为合理的。\n[2905](一)数量准则\n[2906]话语所含信息量与本次交谈所需信息量应该一致。即在进行一次言语行为时，发话者应根据语境要求向受话者提供适量信息，既不能太少，也不能太多；同时受话者也相信发话者正是这样做的。","w":"high","e":["2019 真题","2021 真题","2023 真题"]},{"t":"请说明会话含意推理的四个环节。","y":"简答题","p":["推理的起点：字面意义","推理的依据：相关的前提","推理的过程：字面意义与语境信息相互作用","推理的结果：会话含意"],"q":"[2995]1.推理的起点：字面意义\n[2996]字面意义的功能是双重的，一方面它以自身的缺乏关联性成了暗示受话者进行推理的信号，另一方面它又是推理的根据和起点，虽然它缺乏关联性，但只要受话者坚信发话者是有说话诚意的，他就会进一步因字面意义激活其语境知识储存，用语境因素填补，把话语语义连贯起来，使这句话最终具有关联性，达到理解。例如：","w":"high","e":["2019 真题","2021 真题"]},{"t":"试述合作原则与礼貌原则的关系。","y":"论述题","p":["礼貌原则是在合作原则基础之上提出的，为合作原则保驾护航","礼貌原则处在比合作原则更高的层次上","只有遵循了礼貌原则，才谈得上真正遵循合作原则","有时为了维护礼貌原则，人们甚至不惜牺牲合作原则的某一准则","礼貌原则比合作原则具有更大的灵活性"],"q":"礼貌原则处在比合作原则更高的层次上。只有遵循了礼貌原则，才谈得上真正遵循合作原则。因为礼貌原则维护了交际各方的均等地位和友好关系，受话者更愿意去配合发话者，发话者的交际意图才能得到实现。所以有时为了维护礼貌原则，人们甚至不惜牺牲合作原则的某一准则。","w":"high","e":["2018 真题","2021 真题","2023 真题"]},{"t":"辨析“言外行为”与“言后行为”。","y":"辨析题","p":["言外行为是以言行事，以语言意义的力量就能完成","言后行为是以言取效，其效果不仅仅是语言的范围","例：“承诺”是言外行为，“放心”是言后行为"],"q":"当然，“言外行为”跟“言后行为”是有区别的，前者以语言意义的力量就能完成，如例(5)的“承诺”；而后者所产生的效果，不仅仅是语言的范围了。例如(5)的“放心”。","w":"high","e":["2020 真题","2023 真题"]},{"t":"下列属于冲突类言语行为的是（　　）","y":"单项选择题","p":["冲突类言语行为有“训斥”“咒骂”“威胁”等"],"q":"2.冲突类言语行为。这类行为有“训斥”“咒骂”“威胁”等，它们不仅在语用意图上是失礼的，而且语言方式也只能是不礼貌的，因为我们不可能礼貌地训斥，更不可能礼貌地咒骂。","w":"high","e":["2020 真题"]},{"t":"语言表达方式越间接，话语就越显得礼貌。","y":"判断题","p":["语言表达方式越间接，话语就越显得礼貌"],"q":"不过，礼貌有一个普遍适用的原则：语言表达方式越间接，话语就越显得礼貌。","w":"high","e":["2019 真题"]},{"t":"从礼貌角度给言语行为分类，可以分为哪几类？","y":"简答题","p":["竞争类：命令、要求、批评、禁止等","冲突类：训斥、咒骂、威胁等","和谐类：邀请、祝贺、感谢、道歉等","合作类：报告、讲述、宣布、介绍等"],"q":"[2933]根据对礼貌的不同要求，言语行为可分类如下：\n[2934]1.竞争类言语行为。这类行为有“命令”“要求”“批评”“禁止”等。这些行为形式本身之所以是失礼的，是因为与发话者想达到的目的和礼貌要求之间的关系不太协调。\n[2935]当然，竞争类言语行为对语言方式并没有严格要求，发话者可以用较为礼貌的语言方式，也可以用不礼貌的方式，发话者完全可以选择。\n[2936]2.冲突类言语行为。这类行为有“训斥”“咒骂”“威胁”等，它们不仅在语用意图上是失礼的，而且语言方式也只能是不礼貌的，因为我们不可能礼貌地训斥，更不可能礼貌地咒骂。","w":"high","e":["2019 真题","2021 真题"]},{"t":"故意违反合作原则可以引发哪些会话含意？请分别说明。","y":"简答题","p":["违反数量准则引发会话含意","违反质量准则引发会话含意","违反关联准则引发会话含意","违反方式准则引发会话含意"],"q":"会话含意的推求与合作原则密切相关。如果一个受话者发现对方所说的话语违反了合作原则中的某一准则，但觉得发话者确有诚意有信息要传递给受话者，在这种情况下，就是一个信号。","w":"high","e":["2018 真题","2021 真题"]},{"t":"“关联性准则”的重要作用就在于能解释会话含意的推理信号问题。","y":"判断题","p":["关联性准则的重要作用在于能解释会话含意的推理信号问题","话语关联程度降低就是促使受话者进行言外之意推理的信号"],"q":"可见，“关联性准则”的重要作用就在于能解释会话含意的推理信号问题。","w":"high","e":["2019 真题"]},{"t":"请用言语行为理论分析下面话语：“哥哥，你不要这样。人家是好心好意来安慰我们。”","y":"分析题","p":["“说出这句话”是言内行为","“劝告”是言外行为","“不要对周冲勃然大怒”是言后行为","以言表意、以言行事完成，但以言取效失败"],"q":"这是曹禺《雷雨》第三幕的一个场景：当周冲到四凤家探视，而四凤的哥哥鲁大海对他很不客气，四凤对哥哥说出这句话(言内行为)，真正目的是“劝告”(言外行为)她哥哥不要对周冲勃然大怒(言后行为)，鲁大海听明白了四凤的意思，但最后却没有按四凤的劝告去做，仍然对着周冲发火。所以，四凤的“以言表意”“以言行事”虽然完成了，可是“以言取效”却失败了。","w":"high","e":["2021 真题"]},{"t":"请分析下面会话含意的推理过程：甲：小王的文字功夫怎么样?乙：她当过办公室秘书。","y":"分析题","p":["大前提：秘书经常要起草很多文件","小前提：小王当过办公室秘书","结论：小王写作能力应该不错"],"q":"[3010]大前提(相关的语境知识)：秘书经常要起草很多文件\n[3011]小前提(字面意义)：\t小王当过办公室秘书\n[3012]结   论(会话含意)：\t小王写作能力应该不错","w":"high","e":["2020 真题","2023 真题"]},{"t":"人们运用语言进行交际的整个过程，实际上是由一个接一个的言语行为构成的，即：言内行为————______————______，最后达到发话者的交际意图。","y":"填空题","p":["言语行为过程：言内行为—言外行为—言后行为"],"q":"人们运用语言进行交际的整个过程，实际上是由一个接一个的言语行为构成的，即：言内行为————言外行为————言后行为，最后达到发话者的交际意图。","w":"high","e":["2019 真题"]},{"t":"请从礼貌原则的角度分析下面五个句子的礼貌程度差异：（1）把自行车钥匙拿来！（2）把自行车借给我。（3）请把自行车借给我。（4）能把自行车借给我吗？（5）您下午用自行车吗？我下午想到亲戚家去，可是那里没通公交车。","y":"分析题","p":["礼貌的普遍原则：语言表达方式越间接，话语就越显得礼貌","从例(1)到例(5)礼貌程度依次增加","例(1)最直接、最没礼貌；例(5)最间接、最有礼貌","例(3)加“请”后礼貌程度增加"],"q":"以上所说三个准则，在不同的语境中也会有程度上的不同要求。不过，礼貌有一个普遍适用的原则：语言表达方式越间接，话语就越显得礼貌。","w":"high","e":["2020 真题","2023 真题"]},{"t":"谦虚准则","y":"名词解释","p":["谦虚准则即在话语中尽量少赞誉自己并少贬低对方","对受话一方多赞扬，少指责；对自己避免炫耀，甚至适当贬低自己","不同民族对谦虚准则有不同的理解"],"q":"[2945]2.谦虚准则：在话语中尽量少赞誉自己并少贬低对方\n[2946]谦虚也是一种人际关系中的道德观念。每一个人都有自尊心，它是一个人正常生活信心和勇气的来源。为此，交际时谦虚就是在维护对方的自尊，而不谦虚通常会招致反感。","w":"normal","e":["核心考点"]},{"t":"和谐类言语行为从语用意图到语言方式都必须是礼貌的。","y":"判断题","p":["和谐类言语行为从语用意图到语言方式都必须是礼貌的","如“邀请”“祝贺”“感谢”“道歉”等"],"q":"3.和谐类言语行为。这类行为有“邀请”“祝贺”“感谢”“道歉”等，它们从语用意图到语言方式都必须是礼貌的，不可能不礼貌地感谢，更不可能不礼貌地祝贺。","w":"normal","e":["核心考点"]},{"t":"请分析下面答话如何违反数量准则并推导会话含意：甲：听说你隔壁来了位新同学?乙：他姓陈，是哲学系的，我已经带他看过校园了，还领他办理入学手续，昨天跟他一起去看电影呢！","y":"分析题","p":["乙提供了过多的信息，违反数量准则","甲认为乙确有说话诚意，提供过多信息一定有原因","推导出言外之意：乙不仅知道来了新同学，而且跟他关系比较熟悉"],"q":"按常理，乙回答是否来了新同学就可以了，可是乙却向甲说了他自己跟这位新同学做了什么事情，这显然是违反数量准则，提供了过多的信息。但甲如果认为乙确有说话诚意，那么，他提供过多信息一定是有原因的，甲就通过乙的字面意义进行推理发现他的言外之意，得出结论：乙不仅知道来了一位新同学，而且跟他的关系还比较熟悉。","w":"normal","e":["核心考点"]}]},{"id":"xdhy_down-c02-s04","t":"第四节 话语结构","w":"normal","n":32,"k":[{"t":"话题","y":"名词解释","p":["话题指的是发话者表述的出发点或对象","述题指的是对话题出发点或对象进行的说明","汉语是一种话题凸显的语言","话题具有交际定向作用，承载已知信息"],"q":"在具体语境中，我们可以对句子进行一种语用切分，分成“话题————述题”两个结构成分，以探求发话者的语义安排意图。“话题”指的是发话者表述的出发点或对象，“述题”指的是对话题出发点或对象进行的说明。汉语是一种话题凸显的语言，因此话题对于话语表达的连贯性有重要作用。","w":"high","e":["2018 真题","2021 真题"]},{"t":"话轮","y":"名词解释","p":["会话参与者各方不断互换角色轮番说话","每一个参与者一次连续说的话就是一个话轮","话轮至少是一个句子"],"q":"A.话轮。会话的参与者各方不断互换角色轮番说话，每一个参与者一次连续说的话，就是一个话轮。话轮至少是一个句子，只要对方没有插进话语，无论有多少个句子都属于一个话轮。","w":"high","e":["2019 真题","2022 真题"]},{"t":"话对","y":"名词解释","p":["话对是前后相邻、内容相关的两个话轮构成的会话单位","内容相关指两个话轮在功能上对应","如提问与回答、提议与认可或谢绝等"],"q":"B.话对。前后相邻、内容相关的两个话轮构成的会话单位称为话对。所谓内容相关指的是两个话轮在功能上对应，如提问与回答、提议与认可或谢绝、批评与接受或解释或反驳等。","w":"high","e":["2020 真题"]},{"t":"话段","y":"名词解释","p":["话段是围绕着同一个主题展开的一组话对","一个话段具有多少个话对没有上限","只要发生会话主题的转换，话段也随之转到下一个话段"],"q":"C.话段。围绕着同一个主题展开的一组话对构成一个话段。一个话段具有多少个话对也是没有上限的。当然，只要发生了会话主题的转换，这一话段也随之而转到了下一个话段。","w":"high","e":["2021 真题"]},{"t":"话题链","y":"名词解释","p":["话题跟话题的联系及其方式构为话题链","作用是显示出话语语义推进的线索和话语中心的整合","话题链分三类：同题链、异题链、包题链"],"q":"[3090]“话题————述题”是话语信息传递规律的表现，对于交际来说，话题有规定的作用，话语所说内容一定是跟话题有关。话题跟话题的联系及其方式，构为“话题链”，其作用是显示出话语语义推进的线索和话语中心\n[3092]的整合。“话题链”一般分有三类：","w":"high","e":["2019 真题","2022 真题"]},{"t":"同题链","y":"名词解释","p":["同题链是上文的话题延伸到下文来","后一句的话题就是前一句话题的延伸","语言形式可以完整转移，也可以有一定改变"],"q":"A.同题链。上文的话题延伸到下文来，这时，后一句的话题就是前一句话题的延伸，不过，语言形式可以完整转移，也可以有一定改变。同题链常常用来表述同一事物的不同方面或者连续的动作等。","w":"high","e":["2021 真题"]},{"t":"异题链","y":"名词解释","p":["异题链是上文的话题跟下文的话题不相同","作用较广泛，可表示不同事物的不同方面或情况，也可表示同一事物的不同方面或情况"],"q":"B.异题链。上文的话题跟下文的话题不相同。异题链作用较广泛，可以表示不同事物的不同方面或者情况，同一事物的不同方面或情况。","w":"high","e":["2020 真题"]},{"t":"包题链","y":"名词解释","p":["包题链由有包容关系的话题形成","作用在于在一定范围内揭示或者概括一个事物的不同部分"],"q":"C.包题链。由有包容关系的话题形成。“包题链”的作用在于在一定范围内揭示或者概括一个事物的不同部分。","w":"high","e":["2019 真题"]},{"t":"话语衔接","y":"名词解释","p":["话语衔接是通过种种语言手段把句子衔接成一个结构整体","特点是衔接、衔接手段和连贯性","衔接其实是一种语义联系"],"q":"话语衔接就是通过种种语言手段，把句子衔接成一个结构整体。在受话者理解话语时的心理感受中，就出现了一种连贯性。因此，话语衔接的特点体现为三个方面：衔接、衔接手段和连贯性。","w":"high","e":["2019 真题","2022 真题"]},{"t":"指代关系","y":"名词解释","p":["指代关系依靠代词与先行词之间的联系把话语的两部分衔接起来","特殊情形下也可以是后行词","代词衔接作用最强，是最常用的衔接手段"],"q":"指代关系依靠代词与先行词之间的联系把话语的两部分衔接起来，在一些特殊的情形下也可以是后行词。","w":"high","e":["2020 真题"]},{"t":"省略关系","y":"名词解释","p":["省略也是衔接，句子结构成分如主语、宾语的省略可衔接话语","受话者到前文中寻找相关信息，一旦找到话语就被衔接起来","零形态代词的衔接方式称为零形指代"],"q":"省略也是衔接。有的句子结构成分会省略，例如主语、宾语。这时受话者就会努力地到前文中去寻找与之相关的信息，一旦找到，话语也就被衔接了起来。","w":"high","e":["2019 真题","2022 真题"]},{"t":"逻辑关系","y":"名词解释","p":["逻辑关系由各种各样的关联词语来体现","话语中某一部分有关联词语出现，就必须到与之关联的另一部分去寻找相关信息","关联词语包括表时间、空间关系及其他关系的词语"],"q":"逻辑关系可以由各种各样的关联词语来体现，凡是话语中某一部分有关联词语出现，就必须到与之关联的另一部分去寻找相关信息，在这样的过程中话语就被衔接起来了。","w":"high","e":["2020 真题"]},{"t":"替代关系","y":"名词解释","p":["同一个指称对象在前后句子里用不同的词语来指称形成替代关系","后出现的必须跟先出现的联系起来才能确认同指关系","有同指关系的两个词语可以在语言形式上完全不同"],"q":"同一个指称对象，在前后句子里用不同的词语来指称，这两个或几个不同的词语就形成了替代关系。后出现的必须把它跟先出现的一个联系起来，才能确认它们之间的同指关系，这样的确认过程也就成了话语衔接的过程。","w":"high","e":["2021 真题"]},{"t":"词义关系","y":"名词解释","p":["词语在意义上有着极为错综复杂的关系","除同义、近义、反义、上下位义外，还有构成关系、同现关系、受动关系、结果关系等"],"q":"词语在意义上有着极为错综复杂的关系，除了平时常说的同义、近义、反义、上下位义等关系之外，常见的还有构成关系(如电脑与显示器、主机、鼠标器的关系)、同现关系(如邮局与汇款、平信、包裹的关系)、受动关系(如吃与面包、面条、蔬菜的关系)、结果关系(如写与文章的关系)等许许多多的语义关系。","w":"high","e":["2019 真题"]},{"t":"平行式推进","y":"名词解释","p":["平行式是各后继句都直接以首句的话题为话题","分别引出不同的述题，各话题之间是平行关系","语言形式上允许改变，可用代词、零形指代、同指词语替代"],"q":"[3114]各后继句都直接以首句的话题为话题，分别引出不同的述题，各话题之间是平行关系。不过，语言形式上允许改变，例如下句话题用代词、零形指代、有同指关系的词语替代等指代上句的话题：","w":"high","e":["2021 真题"]},{"t":"派生式推进","y":"名词解释","p":["派生式是从上文语句话题中派生出后继语句各个话题","分属不同层次：原话题属上位，后续句话题属下位","它们之间并不能构成平行关系"],"q":"[3120]从上文语句话题中派生出后继语句各个话题，不过分属不同层次：原话题属上位，后续句话题属下位，它们之间并不能构成平行关系。例如：","w":"high","e":["2019 真题"]},{"t":"线性式推进","y":"名词解释","p":["线性式依靠前一句的述题或述题的一部分延伸为后一句的话题","前句与后句形成一环扣一环的线性推进关系","修辞格的顶针就是这样形成的"],"q":"A.线性式。依靠前一句的述题或述题的一部分延伸为后一句的话题，前句与后句就形成了一环扣一环的线性推进关系。","w":"high","e":["2020 真题"]},{"t":"分叉式推进","y":"名词解释","p":["分叉式是前一语句的述题中延伸出来的话题不止一个","这些话题之间有着并列关系，形成分叉推进","分叉推进就是下位层次的平行推进或派生推进"],"q":"B.分叉式。从前一语句的述题中延伸出来的话题如果不止一个，而这些话题之间又有着并列关系，形成分叉推进。分叉推进其实就是下位层次的平行推进或派生推进。","w":"high","e":["2021 真题"]},{"t":"会话的开端","y":"名词解释","p":["会话开端的功能是发话者引起对方注意并邀请参与，受话者表示愿意参与","一般采用“召唤————回应”的结构方式"],"q":"会话的开端具有两方面的功能：发话者用一定的手段引起对方的注意，并表示邀请参与这次言语活动的意向；受话者则表示已经把注意力转移过来，并愿意参与这次言语活动，因此一般采用“召唤————回应”的结构方式。","w":"high","e":["2021 真题"]},{"t":"会话的结尾","y":"名词解释","p":["会话结尾由结束信号语、前置收尾语和收尾语三部分组成","结束信号语率先发出结束信号，另一方回应","前置收尾语从礼貌上提供缓冲时间","收尾语是会话正式结束的标志"],"q":"结尾一般由三个部分组成：结束信号语、前置收尾语和收尾语。","w":"high","e":["2019 真题","2022 真题"]},{"t":"话轮延伸标记","y":"名词解释","p":["话轮延伸标记有两种：延续性词语和显示话语整体结构的词语","延续性词语如“嗯……”“这个，这个……”","显示话语整体结构的词语如“第一……，第二……，第三……”"],"q":"[3215]所谓的话轮延伸标记，主要有两种：\n[3216]第一，延续性词语。发话者说了一个或几个句子后，容易给受话人此次发话即将结束的感觉，发话者也会意识到这一点。但当发话者不想结束，他还有别的话要说时，为了避免被打断，常常使用一些具有延续功能的词语来提醒受话人不要接。具有这类功能的词语有“嗯……”“这个，这个……”等。\n[3217]第二，显示话语整体结构的词语。当发话者要讲大段的话语时，为了避免被打断，他往往把多个语句组成较大的话语结构。这种话语结构经常用能够表示逻辑顺序的词语连接起来，如“第一⋯⋯，第二⋯⋯，第三⋯⋯”等。准备发话的人不可在听了“首先⋯⋯”后就来接话，因为在“首先⋯⋯”这个话语结构中，大都会有“其次⋯⋯最后⋯⋯”等。","w":"high","e":["2021 真题"]},{"t":"话轮结束标记","y":"名词解释","p":["话轮结束标记有话轮结束停顿和体态语两种","话轮结束时的停顿较长，语速放慢，语气加强","通过目光和手势等体态语判断话语是否结束"],"q":"[3218]所谓的话轮结束标记主要有：\n[3219]第一，话轮结束停顿。一个话轮可以包括一个或更多个句子，句子与句子之间一定有停顿，但比较短；而作为一个话轮结束时的停顿就会比较长，而且在话轮结束时，语速会明显放慢，语气会加强，似乎在提醒听话者：我的话语就快结束了。\n[3220]第二，体态语。除了上述几种句法、语义的判断方法外，还可以通过观察发话者的目光和手势等体态语来判断发话者的话语是否结束。一般说来，会话时受话者的目光总是注视着发话者，而发话者的目光并不总是停留在受话者的脸上，但在他的话语行将结束时，他的目光大都会停留在受话者的身上。另外，发话者处于说话状态时，他的手一般都会有些手势动作。当他的手从紧张的状态放松下来，并停止了一切动作时，这就意味着他准备结束他的话语了。","w":"high","e":["2020 真题"]},{"t":"综合延伸式推进","y":"名词解释","p":["综合延伸式推进由前句的话题和述题结合作为后句新话题而延伸推进","总要借助一个总括性词语来接纳前句"],"q":"[3132]3.综合延伸式推进\n[3133]由前句的话题和述题结合作为后句新话题而延伸推进。","w":"high","e":["2020 真题"]},{"t":"话题推进有哪几种方式？","y":"简答题","p":["话题延伸式推进（平行式、派生式）","述题延伸式推进（线性式、分叉式）","综合延伸式推进"],"q":"[3111]1.话题延伸式推进\n[3112]话语中各后继语句的话题都是来源于首句话题的延伸，按照方式分出两类：","w":"high","e":["2020 真题","2022 真题"]},{"t":"话语衔接主要有哪五种类型？","y":"简答题","p":["指代关系","省略关系","逻辑关系","替代关系","词义关系"],"q":"[3056]话语衔接主要有以下五种：\n[3057]1.指代关系\n[3058]指代关系依靠代词与先行词之间的联系把话语的两部分衔接起来，在一些特殊的情形下也可以是后行词。例如：","w":"high","e":["2018 真题","2020 真题","2023 真题"]},{"t":"会话有哪些典型的轮换方式？","y":"简答题","p":["发话者点明下一个发话者","发话者点明接下来的主题","自由抉择"],"q":"在一次成功的会话当中，会话各方必须共同遵守许多会话规则，最重要的当然是合作原则、礼貌原则，此外，会话还有它自身需要遵守的轮换原则，一个说完了另一个接着说。考察整个会话过程，可以发现，会话之所以能够顺利进行，就是因为会话各方或多方都在遵守轮换原则。典型的轮换方式有：","w":"high","e":["2020 真题"]},{"t":"试述话语衔接与话题推进的关系。","y":"论述题","p":["“已知信息——未知信息”的心理顺序在语句中对应为“话题——述题”","话语衔接中的衔接部分负载未知信息，被衔接部分成理解的关键","衔接手段是帮助受话者找回已知信息的语言机制","话题————述题形成话语的结构框架，显示话语线索"],"q":"这种“已知信息————未知信息”的心理顺序，在语句中对应为“话题————述题”，就形成了话语衔接和话题推进的连贯。话语衔接中的衔接部分，一般都负载了我们必须处理的未知信息，如例(2)中的“这个满面春风的生意人”，跟上文的已知信息“杨先生”衔接起来，被衔接部分成了理解衔接部分的关键，衔接手段正是帮助受话者找回已知信息的语言机制。","w":"high","e":["2019 真题","2022 真题"]},{"t":"“话题链”分为哪三类？各有什么作用？","y":"简答题","p":["同题链：后一句的话题是前一句话题的延伸","异题链：上文的话题跟下文的话题不相同","包题链：由有包容关系的话题形成","三类可以相套，形成更复杂的类型"],"q":"[3092]的整合。“话题链”一般分有三类：\n[3093]A.同题链。上文的话题延伸到下文来，这时，后一句的话题就是前一句话题的延伸，不过，语言形式可以完整转移，也可以有一定改变。同题链常常用来表述同一事物的不同方面或者连续的动作等。(“0”表示话题省略。)例如：","w":"high","e":["2020 真题","2023 真题"]},{"t":"会话的整体结构由哪几部分组成？会话的结尾一般由哪几部分组成？","y":"简答题","p":["会话由开端、主体、结尾三个部分组成","开端采用“召唤——回应”的结构方式","主体形式有话轮、话对、话段","结尾由结束信号语、前置收尾语和收尾语组成"],"q":"在口头话语中，独白和会话的结构有很大差别。通常一次会话由开端、主体、结尾三个部分组成。","w":"high","e":["2020 真题","2023 真题"]},{"t":"会话的主体围绕主题而展开，它的形式主要有话轮、话对、话段三种。","y":"判断题","p":["会话主体的形式主要有话轮、话对、话段三种"],"q":"会话的主体围绕主题而展开，它的形式主要有话轮、话对、话段三种。","w":"high","e":["2018 真题"]},{"t":"请分析下面话语使用了哪一种衔接手段：“著名表演艺术家赵丽蓉昨天早晨7时30分在北京家中溘然辞世，享年73岁。老人临终时，三个儿子及两个孙子都在身边。”","y":"分析题","p":["使用了替代关系","“老人”与“著名表演艺术家赵丽蓉”有同指关系","有同指关系的两个词语可以在语言形式上完全不同"],"q":"[3075](4)著名表演艺术家赵丽蓉昨天早晨7时30分在北京家中溘然辞世，享年73岁。老人临终时，三个儿子及两个孙子都在身边。\n[3076]“老人”与“著名表演艺术家赵丽蓉”有同指关系，所以在下文要提及赵丽蓉时可用“老人”来替代。有同指关系的两个词语，可以在语言形式上完全不同，如例(4)中的“著名表演艺术家赵丽蓉”与“老人”。","w":"high","e":["2021 真题"]},{"t":"请分析下面话语属于何种话题链推进方式，并说明结构：“大屋就在苏忆视线所及的地方，它默默地伫立在灰尘蔽天的路旁，昔日的雕梁画栋不仅脱尽了当初华丽的色彩，且给人一种苍老莫名暗自忧伤的感觉。”","y":"分析题","p":["“大屋”与“它”是话题平行推进","“昔日的雕梁画栋”是对“大屋”的话题派生推进","末句零形指代与“雕梁画栋”形成话题平行推进","两种平行推进不在一个层次上"],"q":"“大屋”与“它”是话题平行推进的关系，而“昔日的雕梁画栋”的出现又是对“大屋”的一个话题派生推进，而末句有一个对“雕梁画栋”的零形指代“0”，它与语言形态的“雕梁画栋”又形成了一对话题平行推进，而话语中的两个话题平行推进又不在一个层次上。","w":"normal","e":["核心考点"]}]},{"id":"xdhy_down-c02-s05","t":"第五节 语言要素的修辞","w":"normal","n":19,"k":[{"t":"修辞","y":"名词解释","p":["修辞是为增强语用表达效果对语言要素进行的选择、加工和调整","修辞是交际过程中有效运用语言要素的一种语用策略","注重语音、词语、语法三要素的巧妙配合"],"q":"修辞，是指为了增强语用表达效果，对语言要素进行的选择、加工和调整。修辞是交际过程中有效地运用语言要素的一种语用策略，特别注重研究如何通过语言的三要素————语音、词语和语法这三者巧妙的配合，而达到最佳的交际效果。","w":"high","e":["2018 真题","2020 真题","2022 真题"]},{"t":"押韵","y":"名词解释","p":["押韵以句子为节奏单位","押韵不要求韵母完全相同，通常只是韵腹或韵腹韵尾相同","押韵方式有偶韵、奇韵、排韵、随韵、交韵等"],"q":"第三，押韵现象，更是句子之间节奏感的充分表现。押韵并不一定要求韵母完全相同，通常只是韵腹或韵腹韵尾相同，如“霞”与“花”是韵腹相同而韵头不同，“狂”与“香”是韵腹韵尾相同但韵头不同。押韵以句子为节奏单位，这就大大扩展了节奏感在营造语言音乐美的过程中的作用。","w":"high","e":["2019 真题"]},{"t":"紧凑句","y":"名词解释","p":["一群句子受到某种结构关系的严密控制，或彼此结构方式相同或相近，关系紧密","这样的一群句子就是紧凑句","所有的紧缩复句其实是一种关系更为密切的紧凑句"],"q":"一群句子，如果受到了某种结构关系的严密控制，或者彼此之间的结构方式相同或相近，从而给人一种关系紧密的感觉，这样的一群句子就是紧凑句；相反则是松缓句。","w":"high","e":["2021 真题"]},{"t":"文化含义","y":"名词解释","p":["词在反映所指对象时还会蕴含相应的传统观念、文化心态甚至于社会偏见","形成了这个词的文化含义","了解词的文化含义必须把词语意义放在整个社会的文化大背景中去考察"],"q":"词义并不仅仅是所指对象的本质属性的反映，事实上词在反映所指对象时还会蕴含相应的传统观念、文化心态甚至于社会偏见，形成了这个词的文化含义。","w":"high","e":["2021 真题"]},{"t":"联想意义","y":"名词解释","p":["词语以语言意义为基础，在具体语境中表现出相关的语义内容产生联想意义","分为时代的联想意义、地域的联想意义、社群的联想意义、语体的联想意义"],"q":"话语交际中的词语以语言意义为基础，在具体语境中表现出相关的语义内容，于是产生了联想意义。","w":"high","e":["2019 真题"]},{"t":"形象意义","y":"名词解释","p":["词与词在形象的表现功能上是有极大差异的","表象功能是通过词义与所指对象之间的联系而实现的","构词语素的不同会造成形象意义的强弱和性质差异"],"q":"词与词在形象的表现功能上是有极大差异的，它们的表象功能是通过词义与所指对象之间的联系而实现的。","w":"high","e":["2020 真题"]},{"t":"语音的表象功能","y":"名词解释","p":["表象是感知觉形象的表现","语音的表象功能能向我们提供一定的感知觉形象","汉语中的拟声词是语音实现表象功能的主要手段"],"q":"表象指的是感知觉形象的表现，包括听觉形象、视觉形象、味觉形象、嗅觉形象、触觉形象等。语音的表象功能能够跟绘画、雕塑、音乐一样，向我们提供一定的感知觉形象。","w":"high","e":["2021 真题"]},{"t":"语法语序的变化","y":"名词解释","p":["语序变化引起语法关系的变化","目的一是话题化，为了强调","目的二是为了上下文的连贯衔接，满足已知信息到未知信息的传递规律"],"q":"[3362]相对于常规语序来说，我们要变化语序在表达上总是有一定目的：\n[3363]第一，最常见的就是话题化，这是为了强调，因为话题具有吸引受话者注意力的作用。句中任何一个名词性成分都可以提到句首成为话题，所以，一种方法是名词性成分直接位移到句首，另一种方法则是移位后在原位置上安置一个代词与话题保持语义上的联系。例如：","w":"high","e":["2020 真题","2023 真题"]},{"t":"语用语序的变化","y":"名词解释","p":["语用语序变化后词语所处的位置不是正常的，能产生特殊的修辞效果","一是强调后移成分，多见于书面语","二是强调前移成分，多见于口语","语法关系没有变化，主语还是主语，宾语还是宾语"],"q":"[3373]语用语序的变化，最大的特点就在于变化后词语所处的位置不是正常的，正因为它不正常，就能产生特殊的修辞效果。这有两种情况：\n[3374]第一，强调后移成分，多见于书面语。例如无论哪一种主语，既为主语就必须处在句首，起码也要在动词之前。可是在语用变化中，主语却可以跑到谓语之后的句尾。例如：","w":"high","e":["2021 真题"]},{"t":"简述节奏的匀称感的基本表现。","y":"简答题","p":["语音节奏的语言学基础：语音是声音流的时间切分","双声叠韵现象","押韵现象","音节组合及呼应造成节奏感（双音节化、四字格趋势）"],"q":"[3247]第一，语音节奏的语言学基础。语音是声音流的时间切分，当我们在接受一段语音话语时，会清楚地感受到音节单位在有规律地流动。语音音节的节奏首先是这一种语法结构和语义规律的体现，语言基本单位都有韵律感。这就是“语感”的重要特征之一。例如：","w":"high","e":["2020 真题"]},{"t":"简述词语与修辞中词语的选择问题。","y":"简答题","p":["古人特别讲究“炼字”，重视词语的选择","语用策略关键在于掌握词的意义和在语境中的用法","汉语不少词语本身就有感情色彩","词语修辞最容易碰到的表达问题就是近义词选择"],"q":"古人特别讲究“炼字”，也就是重视词语的选择，据说“推敲”这个词就是从一句诗里主要动词到底是用“推”好还是用“敲”好发展而来的。汉语词语有丰富的表现力，语用策略关键在于善于掌握词的意义和在语境中的用法两个方面。","w":"high","e":["2020 真题"]},{"t":"试述简单句与复杂句的修辞效果差异。","y":"论述题","p":["句子从简单变复杂有三个途径：添枝加叶、局部发达、前后衔接","复杂句的修辞效果是严谨缜密，一气呵成","论证辩驳中气势逼人，叙述描写中细致绵密","简单句的效果是轻松随意，活泼自如","复杂句多见于书面语，简单句多见于口语"],"q":"复杂句的修辞效果是严谨缜密，一气呵成，用在论证辩驳中则气势逼人，不容置疑；用在叙述描写中则细致绵密，引人入胜；而简单句的效果却是轻松随意，活泼自如。前者多见于书面语，后者多见于口语。","w":"high","e":["2019 真题","2022 真题"]},{"t":"汉语语序的变化一般可分为哪三种类型？","y":"简答题","p":["语义变化而语法结构关系不变","语序变化同时引起语法关系的变化，称为语法语序的变化","没有引起语法关系的变化，称为语用语序的变化"],"q":"汉语语序的变化一般可分为三种类型：一种是词语语序变化后，语法结构关系不变，但是语义却变化了；一种是语序变化同时引起了语法关系的变化，称为语法语序的变化；一种是没有引起语法关系的变化，称为语用语序的变化。","w":"high","e":["2019 真题","2022 真题"]},{"t":"汉语语音的音乐美主要体现在哪两个方面？","y":"简答题","p":["节奏的匀称感：要求重复，由相同的语音成分重复出现彼此呼应而造成","音韵的和谐感：要求变化，由不同的语音成分相互对比映衬而造成"],"q":"[3242]汉语语音的音乐美主要体现在两个方面：\n[3243]第一，节奏的匀称感，它要求重复，由于相同的语音成分重复出现彼此呼应而造成。","w":"high","e":["2019 真题","2021 真题"]},{"t":"一个句子从简单变得复杂，主要有哪三个途径？","y":"简答题","p":["添枝加叶","局部发达","前后衔接"],"q":"一个句子从简单变得复杂，主要有三个途径：添枝加叶，局部发达，前后衔接。","w":"high","e":["2019 真题"]},{"t":"“2+2的四音节”是现代汉语的一种重要节奏倾向，而不是唯一的节奏形式。","y":"判断题","p":["“2+2的四音节”是重要的节奏倾向，不是唯一的节奏形式","什么样的音节组合能成为节奏单位取决于音节组合的相互关系"],"q":"“2+2的四音节”是现代汉语的一种重要节奏倾向，而不是唯一的节奏形式。事实上什么样的音节组合能成为节奏单位，并不取决于音节本身，而是决定于音节组合的相互关系。","w":"high","e":["2020 真题"]},{"t":"请分析下面句子中语用语序变化的修辞效果：“终于过去了，中国人民哭泣的日子，中国人民低垂着头的日子。”","y":"分析题","p":["主语跑到谓语之后的句尾，属于语用语序变化","句尾是信息焦点所在的位置，把主语放在句尾，信息被置于最突出的位置","打破人们熟悉的语序，带来较强烈的冲击力和语义吸引力"],"q":"[3375](10)终于过去了，中国人民哭泣的日子，中国人民低垂着头的日子。\n[3376]例(10)“……日子”很长，移到句子后部，突出了句义的重点。句尾的位置是信息焦点所在的位置，把主语放在句尾，它所承载的信息就被放在了最突出的位置上，从而促使人们去感受它、体验它。而且人们熟悉的语序一旦打破，带来的就是一种较强烈的冲击力和语义吸引力。","w":"high","e":["2020 真题"]},{"t":"现代汉语中有两个比较明显的节奏倾向：一是构词上的“______”，二是语言使用上的“______”。","y":"填空题","p":["两个节奏倾向：构词上的双音节化、语言使用上的四字格趋势"],"q":"现代汉语中有两个比较明显的节奏倾向：一是构词上的“双音节化”，二是语言使用上的“四字格趋势”。","w":"high","e":["2019 真题"]},{"t":"下列不属于汉语语序变化三种类型的是（　　）","y":"单项选择题","p":["语序变化三类型：语义变化、语法语序变化、语用语序变化"],"q":"汉语语序的变化一般可分为三种类型：一种是词语语序变化后，语法结构关系不变，但是语义却变化了；一种是语序变化同时引起了语法关系的变化，称为语法语序的变化；一种是没有引起语法关系的变化，称为语用语序的变化。","w":"normal","e":["核心考点"]}]},{"id":"xdhy_down-c02-s06","t":"第六节 语用效果与辞格","w":"normal","n":27,"k":[{"t":"辞格","y":"名词解释","p":["辞格是为了达到某种语用效果而有意识地突破语言组合常规、进行超常搭配的特定格式","是言语行为中对语言规则或语用规则进行有效偏离的特定格式","分两大类：语义内容的超常表达、结构形式的偏离表达"],"q":"为了达到某种语用效果，人们通常在语言交际中有意识地突破语言组合的常规，进行超常的搭配，以达到特定的修辞效果。这种在言语行为中对语言规则或语用规则进行有效偏离的特定格式，就是辞格。","w":"high","e":["2018 真题","2020 真题","2022 真题"]},{"t":"比喻","y":"名词解释","p":["用与本体本质不同但有相似性的喻体来描写或说明本体","比喻由四个要素构成：本体、喻体、喻词、相似点","分为明喻、暗喻和借喻三种类型"],"q":"用与本体(甲)本质不同但有相似性的喻体(乙)来描写或说明本体，这种辞格叫比喻。","w":"high","e":["2018 真题","2020 真题","2023 真题"]},{"t":"比拟","y":"名词解释","p":["运用联想，直接将本体当作拟体进行描写或说明","比拟包含三个要素：本体、拟体、拟词","比拟只出现本体和拟词，拟体并不出现","分为拟人和拟物两类"],"q":"[3478]运用联想，直接将本体当作拟体进行描写或说明，这种辞格叫比拟。\n[3479]从语义上说，比拟包含三个要素：本体，拟体，拟词。本体指被陈述或描写者；拟体是被模拟的对象，拟词就是拟体的行为、属性。从形式上说，比拟只出现本体和拟词，拟体并不出现。从句法关系看，本体与拟词构成了超常的主谓关系。例如：\n[3480](1)春天来了，百花快乐地唱起了歌、跳起了舞。","w":"high","e":["2018 真题","2021 真题"]},{"t":"移就","y":"名词解释","p":["将本不能描写甲事物的词语描写甲，构成修饰语与中心语的偏正关系","语义上却是描写与甲相关的人或事","分为移情式和移觉式两类"],"q":"将本不能描写甲事物的词语描写甲，构成修饰语与中心语的偏正关系，但在语义上却是描写与甲相关的人或事，这种辞格叫移就。移就可以分为两类：","w":"high","e":["2019 真题"]},{"t":"拈连","y":"名词解释","p":["将用于甲事物的词语顺势搭配到乙事物上","产生两个相关联的陈述或描写结构","分为完整式和缺省式两类"],"q":"将用于甲事物的词语顺势搭配到乙事物上，产生两个相关联的陈述或描写结构，这样的辞格叫拈连。从形式上看，前一个句子搭配符合语法习惯，而后一个句子则明显是超常搭配，并与前一个句子构成某种因果关系。拈连可以分为两类：","w":"high","e":["2020 真题"]},{"t":"夸张","y":"名词解释","p":["故意对事物或属性的范围、数量、程度等方面进行超出或缩小等的描述","分为扩大夸张和缩小夸张两类"],"q":"故意对事物或属性的范围、数量、程度等方面进行超出或者缩小等的描述，这种辞格叫夸张。夸张可以分为两类：","w":"high","e":["2019 真题"]},{"t":"双关","y":"名词解释","p":["在特定语境中利用语言要素使同一语句具有“语内”和“语外”两层意义","分为谐音式、语义式、对象式三类"],"q":"在特定的语境中，利用语言要素，使同一语句具有“语内”和“语外”两层意义，这种辞格叫双关。双关可以分为三类：","w":"high","e":["2018 真题","2021 真题"]},{"t":"反语","y":"名词解释","p":["故意使用相反的词句来表达真正意思","也叫反话","分为讽刺反语和风趣反语两类"],"q":"故意使用相反的词句来表达真正意思，这样的辞格叫反语，也叫反话。在书面上，有时使用某种标记的形式，比如引号或着重号来显示。反语可以分为两类：","w":"high","e":["2020 真题"]},{"t":"借代","y":"名词解释","p":["用与本体相关的事物(代体)来指称本体","有六种常见类型：特征借代、成分借代、地名借代、作者借代、品牌借代、材料借代"],"q":"用与本体相关的事物(代体)来指称本体，这种辞格叫借代。借代有以下六种常见类型：","w":"high","e":["2019 真题","2022 真题"]},{"t":"对偶","y":"名词解释","p":["将字数相等、结构相同或相似、意义相关的两个句子或短语并举","有严式与宽式的区别","从内容上分为正对、反对、串对三类"],"q":"[3580]将字数相等、结构相同或相似、意义相关的两个句子(或短语)并举，这种辞格叫对偶。\n[3581]对偶有严式与宽式的区别。严式对偶在语音、词汇和语法等方面都有严格的规定；宽式对偶较为自由。从内容上看，对偶可分为三类：","w":"high","e":["2018 真题","2021 真题"]},{"t":"排比","y":"名词解释","p":["用三个以上字数大体相等、结构相似、语气一致的短语或句子排列起来","分为平排和递排两类"],"q":"用三个以上字数大体相等、结构相似、语气一致的短语或句子排列起来，这种辞格叫排比。排比可以分为两类：","w":"high","e":["2019 真题","2022 真题"]},{"t":"顶真","y":"名词解释","p":["前一个句子的结尾部分作后一个句子的开头","使相邻的两个句子头尾蝉联，前后串联","也称顶针、联珠","分为词和短语顶真、句子顶真两类"],"q":"前一个句子的结尾部分作后一个句子的开头，使相邻的两个句子头尾蝉联，前后串联，这种辞格叫顶真，也称顶针、联珠。顶真可以分为两类：","w":"high","e":["2020 真题"]},{"t":"回环","y":"名词解释","p":["前一个句子或句子的一部分次序颠倒，形成第二个句子","使前后两个句子内容循环往复，紧密相关","结构式是：甲+乙→乙+甲","分为严式回环和宽式回环"],"q":"前一个句子或句子的一部分次序颠倒，形成第二个句子，使前后两个句子内容循环往复，紧密相关。这种辞格叫回环。回环的结构式是：甲+乙→乙+甲。回环可以分为两类：","w":"high","e":["2019 真题"]},{"t":"反复","y":"名词解释","p":["同一个词语或句子使用两次以上","对同一语义的强化表达，以宣泄特定的感情、思想","分为连续反复和间隔反复两类"],"q":"同一个词语或句子使用两次以上，这种辞格叫反复。对同一语义的强化表达，以宣泄特定的感情、思想。反复可以分为两类：","w":"high","e":["2021 真题"]},{"t":"辞格连用","y":"名词解释","p":["在一句话内，一个或几个辞格前后连续性地出现","分为同格连用和异格连用两类"],"q":"[3640]在一句话内，一个或几个辞格前后连续性地出现，叫辞格的连用。它可以分为两类：","w":"high","e":["2019 真题"]},{"t":"辞格兼用","y":"名词解释","p":["两种或者两种以上的辞格融合到一起","如比拟和比喻融合、夸张和比喻融合"],"q":"两种或者两种以上的辞格融合到一起，这种现象叫辞格的兼用。","w":"high","e":["2020 真题"]},{"t":"辞格套用","y":"名词解释","p":["一个辞格中包含着另一个或多个其他的辞格","如对偶包含比喻、排比包含比喻"],"q":"一个辞格中包含着另一个或多个其他的辞格，这种现象叫辞格的套用。","w":"high","e":["2021 真题"]},{"t":"借代有哪六种常见类型？","y":"简答题","p":["特征借代","成分借代","地名借代","作者借代","品牌借代","材料借代"],"q":"[3558]用与本体相关的事物(代体)来指称本体，这种辞格叫借代。借代有以下六种常见类型：","w":"high","e":["2020 真题"]},{"t":"辞格大致可以分为哪两大类？","y":"简答题","p":["语义内容的超常表达（超常搭配：比喻、比拟、移就、拈连；超常理解：夸张、双关、反语、借代）","结构形式的偏离表达（对偶、排比、顶真、回环、反复）"],"q":"[3447]一是语义内容的超常表达。分为两种：第一是超常搭配，例如比喻、比拟、移就、拈连等；第二是超常理解，例如夸张、双关、反语、借代等。这类辞格在结构上形式标志不特别明显。\n[3448]二是结构形式的偏离表达，从而激发受话人的认知心理，以达到特定的语用效果，例如对偶、排比、顶真、回环、反复等。这类辞格在结构上往往有形式标志。","w":"high","e":["2019 真题","2021 真题"]},{"t":"辞格的综合运用有哪三种情形？","y":"简答题","p":["辞格连用：一个或几个辞格前后连续性地出现（同格连用、异格连用）","辞格兼用：两种或两种以上的辞格融合到一起","辞格套用：一个辞格中包含另一个或多个其他辞格"],"q":"在实际语言表达中，更为常见的是辞格综合使用。一般说来，可以有连用、兼用和套用三种情形。","w":"high","e":["2020 真题","2023 真题"]},{"t":"辨析比喻中的“明喻”“暗喻”和“借喻”。","y":"辨析题","p":["明喻：甲像乙，有比喻词联结","暗喻：甲是乙，用“是”“成为”等动词联结","借喻：不出现本体和喻词，直接用喻体替代本体"],"q":"[3457]1.明喻。直接明白地用喻体来描写或说明本体，有“像”“似”“如”“宛如”“宛然”“仿佛”“一般”等比喻词来联结本体和喻体。典型结构式是：甲像乙。例如：","w":"high","e":["2020 真题","2023 真题"]},{"t":"辨析“辞格连用”“辞格兼用”和“辞格套用”。","y":"辨析题","p":["连用：一个或几个辞格前后连续性地出现（同格连用、异格连用）","兼用：两种或两种以上的辞格融合到一起","套用：一个辞格中包含着另一个或多个其他的辞格","例：“史学家是凸面镜……史剧家是凹面镜”用对偶包含比喻"],"q":"[3638]在实际语言表达中，更为常见的是辞格综合使用。一般说来，可以有连用、兼用和套用三种情形。\n[3639](一)辞格连用","w":"high","e":["2019 真题","2022 真题"]},{"t":"“孔夫子搬家————尽是书”运用的辞格是（　　）","y":"单项选择题","p":["借助同音词“书”与“输”形成谐音式双关"],"q":"例(1)借助孔夫子搬家特点“书”多，引出同音词“输”，表达出真正的意思。","w":"high"
