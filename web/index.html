们可以构建一个现代汉语的单句句型系统：","w":"normal","e":["原书正文"]},{"t":"【原文】现代汉语单句句型系统第三","y":"教材原文","p":["现代汉语单句句型系统第三层次(11)第一层次(2)第一层次(2)第二层次(7)第二层次(7)三、句型分析的原则和方法进行句型分析时，我们只考虑句型成分以及句子的结构模式，所以必须首先排除一些不影响句型的因素","这些因素主要有以下几种："],"q":"现代汉语单句句型系统第三层次(11)第一层次(2)第一层次(2)第二层次(7)第二层次(7)三、句型分析的原则和方法进行句型分析时，我们只考虑句型成分以及句子的结构模式，所以必须首先排除一些不影响句型的因素。这些因素主要有以下几种：","w":"normal","e":["原书正文"]},{"t":"【原文】1.表示语气的因素不影响","y":"教材原文","p":["1.表示语气的因素不影响句型，包括语气词和语调","换言之，不同的句类可能是同一个句型，而相同的句类可能是不同的句型","句型跟句类采取的是两个不同的标准，他们不对立，而是交叉的"],"q":"1.表示语气的因素不影响句型，包括语气词和语调。换言之，不同的句类可能是同一个句型，而相同的句类可能是不同的句型。句型跟句类采取的是两个不同的标准，他们不对立，而是交叉的。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】(1) 你来了","y":"教材原文","p":["(陈述) (2) 你来吧! (祈使)"],"q":"(1) 你来了。(陈述) (2) 你来吧! (祈使)","w":"normal","e":["原书正文"]},{"t":"【原文】(3) 你来吗? (疑问","y":"教材原文","p":["(3) 你来吗? (疑问) (4) 你来啦! (感叹)这四句话语气不同，分别属于不同句类，句型却是相同的，都属于主谓句中的动词谓语句"],"q":"(3) 你来吗? (疑问) (4) 你来啦! (感叹)这四句话语气不同，分别属于不同句类，句型却是相同的，都属于主谓句中的动词谓语句。","w":"normal","e":["原书正文"]},{"t":"【原文】2.功能相同词义不同的词","y":"教材原文","p":["2.功能相同词义不同的词语互相替换不影响句型"],"q":"2.功能相同词义不同的词语互相替换不影响句型。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】例(1)前后两句的句型都","y":"教材原文","p":["例(1)前后两句的句型都是述宾谓语句，例(2)前后句子的句型都是动词谓语句"],"q":"例(1)前后两句的句型都是述宾谓语句，例(2)前后句子的句型都是动词谓语句。","w":"normal","e":["原书正文"]}]},{"id":"xdhy_down-c01-s06","t":"第六节 句式系统","w":"high","n":14,"k":[{"t":"句式","y":"名词解释","p":["根据句子的显著特点划分","句子类型","体现结构特点和语义特色"],"q":"句式是根据句子的显著特点划分出来的句子类型。它比较集中地体现了现代汉语句子的结构特点以及语义表达上的特色。","w":"high","e":["教材高频"]},{"t":"把字句","y":"名词解释","p":["介词“把”和它的宾语充当状语","选择并凸显特别关注的某个对象","表示动作或原因的影响产生某种结果或状态"],"q":"由介词“把”和它的宾语充当状语的句子叫作把字句。“把”的作用是选择并凸显说话者特别关注的某个对象。整句语法意义表示某种动作或原因的影响而产生某种结果或状态。","w":"high","e":["教材高频"]},{"t":"被字句","y":"名词解释","p":["介词“被”和它的宾语充当状语","表示被动意义","宾语是施事或原因，主语是受事"],"q":"由介词“被”和它的宾语充当状语的句子叫作被字句。“被”的作用是表示被动意义，并且引进的宾语往往是动作的施事或原因，而主语则是动作的受事。","w":"high","e":["教材高频"]},{"t":"存现句","y":"名词解释","p":["表示存在、出现或消失","基本格式：处所词+存现动词+事物"],"q":"存现句是表示人或事物存在、出现或消失的句子。它的基本格式是“处所词+存现动词+事物”。","w":"high","e":["教材高频"]},{"t":"双宾语句","y":"名词解释","p":["述宾短语再带一个宾语","近宾语(间接宾语)","远宾语(直接宾语)"],"q":"双宾语句是一个述宾短语再带一个宾语的句子。紧靠动词的宾语叫作近宾语(又称间接宾语)，不紧靠动词的宾语叫作远宾语(又称直接宾语)。","w":"high","e":["教材高频"]},{"t":"主谓谓语句","y":"名词解释","p":["由主谓短语充当谓语","全句主语相当于话题，谓语相当于述题","大主语/大谓语、小主语/小谓语"],"q":"主谓谓语句是由主谓短语充当谓语的句子。全句的主语相当于“话题”，谓语相当于“述题”。全句的主语叫大主语，全句的谓语叫大谓语；充当谓语的主谓短语的主语叫小主语，主谓短语的谓语叫小谓语。","w":"high","e":["教材高频"]},{"t":"【原文】(一)受事性主谓谓语句大","y":"教材原文","p":["(一)受事性主谓谓语句大主语是小谓语中某个动词的受事，有时也可以是与事或工具等"],"q":"(一)受事性主谓谓语句大主语是小谓语中某个动词的受事，有时也可以是与事或工具等。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】(1)这件事我没有听说过","y":"教材原文","p":["(1)这件事我没有听说过","(受事)→我没有听到过这件事"],"q":"(1)这件事我没有听说过。(受事)→我没有听到过这件事。","w":"normal","e":["原书正文"]},{"t":"【原文】(2)那些水果我们已经吃","y":"教材原文","p":["(2)那些水果我们已经吃完了","(受事)→我们已经吃完那些水果了"],"q":"(2)那些水果我们已经吃完了。(受事)→我们已经吃完那些水果了。","w":"normal","e":["原书正文"]},{"t":"【原文】(4)这把刀我切肉","y":"教材原文","p":["(4)这把刀我切肉","(工具)这类主谓谓语句中，以大主语是受事的最为常见，其他的可看作广义受事，并且大多可以通过大主语移位变换成一般的主谓句"],"q":"(4)这把刀我切肉。(工具)这类主谓谓语句中，以大主语是受事的最为常见，其他的可看作广义受事，并且大多可以通过大主语移位变换成一般的主谓句。","w":"normal","e":["原书正文"]},{"t":"【原文】(二)领属性主谓谓语句大","y":"教材原文","p":["(二)领属性主谓谓语句大主语和小主语之间有领属关系，或者是整体与部分的关系","这类句子往往可以在大、小主语之间插入“的”字，变成一般主谓句"],"q":"(二)领属性主谓谓语句大主语和小主语之间有领属关系，或者是整体与部分的关系。这类句子往往可以在大、小主语之间插入“的”字，变成一般主谓句。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】(1)老张身体非常棒","y":"教材原文","p":["(1)老张身体非常棒","(领属关系)→老张的身体非常棒"],"q":"(1)老张身体非常棒。(领属关系)→老张的身体非常棒。","w":"normal","e":["原书正文"]},{"t":"【原文】(2)她普通话说得很不错","y":"教材原文","p":["(2)她普通话说得很不错","(领属关系)→她的普通话说得很不错"],"q":"(2)她普通话说得很不错。(领属关系)→她的普通话说得很不错。","w":"normal","e":["原书正文"]},{"t":"【原文】(3)我们班一半是南方人","y":"教材原文","p":["(3)我们班一半是南方人","(整体与部分关系)→我们班的一半是南方人"],"q":"(3)我们班一半是南方人。(整体与部分关系)→我们班的一半是南方人。","w":"normal","e":["原书正文"]}]},{"id":"xdhy_down-c01-s07","t":"第七节 句类系统","w":"high","n":15,"k":[{"t":"句类","y":"名词解释","p":["按照不同语气功能划分","陈述句、疑问句、祈使句、感叹句"],"q":"句类是句子按照不同语气功能划分出来的类型。一般分为陈述句、疑问句、祈使句和感叹句四类。","w":"high","e":["教材高频"]},{"t":"疑问句","y":"名词解释","p":["包括疑惑和询问双重意义","两大类型：结构类型、功能类型"],"q":"疑问句包括疑惑和询问双重意义。一个疑问句，通常是既疑且问，但可以疑而不问，也可以问而不疑。疑问句有两大类型：结构类型、功能类型。","w":"high","e":["教材高频"]},{"t":"反问句","y":"名词解释","p":["又叫反诘问","无疑而问","用肯定表否定、用否定表肯定"],"q":"反问句又叫反诘问，它是“无疑而问”，即发问人心目中并没有真正的疑惑，只是在用疑问句的形式曲折地表达自己对某个事情的看法，语气上有不满、反驳的意味。通常用肯定形式表示否定意思，用否定形式表示肯定意思。","w":"high","e":["教材高频"]},{"t":"祈使句","y":"名词解释","p":["向听话人提出要求","主语限于第二人称代词、包括式第一人称复数、称谓词","经常省略"],"q":"向听话人提出要求，希望他做什么或别做什么的句子叫祈使句。祈使句的主语限于三类词语：第二人称代词、包括式的第一人称复数、称谓词，但是经常省略。","w":"high","e":["教材高频"]},{"t":"陈述句","y":"名词解释","p":["向听话人述说一件事情","语调平直，句尾略降","书面上用句号"],"q":"陈述句是用来向听话人述说一件事情的句子。陈述句的语调平直，句尾略降，在书面上用句号表示停顿。","w":"normal","e":["核心概念"]},{"t":"感叹句","y":"名词解释","p":["抒发强烈感情","三类：叹词构成/带明显标志/句尾用感叹号"],"q":"感叹句是抒发强烈感情的句子。它大体上可以分为三类：直接用叹词构成的感叹句；带有明显标志的感叹句；句子形式在书面上跟一般的陈述句一样但句尾用感叹号的感叹句。","w":"normal","e":["核心概念"]},{"t":"双重否定格式","y":"名词解释","p":["表示特殊肯定的意思","语气比单纯肯定或委婉或强烈"],"q":"双重否定格式用来表示特殊肯定的意思。双重否定表面上意义等于肯定，但实际上不然：有的语气比单纯肯定委婉，有的语气比单纯肯定强烈。","w":"normal","e":["核心概念"]},{"t":"【原文】他在教育孩子/对同学们表","y":"教材原文","p":["他在教育孩子/对同学们表示感谢(三)语义角色的解释力名词语义角色实际上还有好多种，比如：领事、属事、自事、同源、范围，等等","它可以跟动作直接组合，"],"q":"他在教育孩子/对同学们表示感谢(三)语义角色的解释力名词语义角色实际上还有好多种，比如：领事、属事、自事、同源、范围，等等。它可以跟动作直接组合，","w":"normal","e":["原书正文"]},{"t":"【原文】也可以靠介词引入，因此介","y":"教材原文","p":["也可以靠介词引入，因此介词也叫作“格标记”","建立起语义关系的类型，就可以合理解释句法结构内部的复杂情况","动词同名词性词语之间的语义关系是由它们双方共同决定的，同一个动词，与不同的名词性词语搭配就可能产生不同的语义关系"],"q":"也可以靠介词引入，因此介词也叫作“格标记”。建立起语义关系的类型，就可以合理解释句法结构内部的复杂情况。动词同名词性词语之间的语义关系是由它们双方共同决定的，同一个动词，与不同的名词性词语搭配就可能产生不同的语义关系。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】(1)吃面条(动作———","y":"教材原文","p":["(1)吃面条(动作————受事)吃大碗(动作————工具)吃食堂(动作————处所)吃大户(动作————依据)吃包月(动作————方式)"],"q":"(1)吃面条(动作————受事)吃大碗(动作————工具)吃食堂(动作————处所)吃大户(动作————依据)吃包月(动作————方式)","w":"normal","e":["原书正文"]},{"t":"【原文】(2)妈妈在包衣服(施事","y":"教材原文","p":["(2)妈妈在包衣服(施事————动作————受事)他们在包饺子(施事————动作————结果)外头包牛皮纸(处所————动作————材料)礼品包小包(受事————动作————方式)"],"q":"(2)妈妈在包衣服(施事————动作————受事)他们在包饺子(施事————动作————结果)外头包牛皮纸(处所————动作————材料)礼品包小包(受事————动作————方式)","w":"normal","e":["原书正文"]},{"t":"【原文】同一个名词性词语，与不同","y":"教材原文","p":["同一个名词性词语，与不同的谓词搭配也可能产生不同的语义关系"],"q":"同一个名词性词语，与不同的谓词搭配也可能产生不同的语义关系。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】(3)买毛衣(动作———","y":"教材原文","p":["(3)买毛衣(动作————受事) 织毛衣(动作————结果)"],"q":"(3)买毛衣(动作————受事) 织毛衣(动作————结果)","w":"normal","e":["原书正文"]},{"t":"【原文】(4) 打人(动作———","y":"教材原文","p":["(4) 打人(动作————受事) 来人(动作————施事)(四)名词和名词的语义关系语义关系还包括名词跟名词的关系"],"q":"(4) 打人(动作————受事) 来人(动作————施事)(四)名词和名词的语义关系语义关系还包括名词跟名词的关系。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】12.比喻关系：钻石的性","y":"教材原文","p":["12.比喻关系：钻石的性格/历史的车轮二、语义指向(一)句法结构和语义指向语义指向是指句法结构中的某一成分跟其他成分之间在语义上的联系","这种语义联系同句法关系有时一致，有时不一致"],"q":"12.比喻关系：钻石的性格/历史的车轮二、语义指向(一)句法结构和语义指向语义指向是指句法结构中的某一成分跟其他成分之间在语义上的联系。这种语义联系同句法关系有时一致，有时不一致。例如：","w":"normal","e":["原书正文"]}]},{"id":"xdhy_down-c01-s08","t":"第八节 句法结构中的语义分析","w":"high","n":11,"k":[{"t":"语义角色","y":"名词解释","p":["名词性成分担任的语义角色(论元)","揭示名词性成分跟动词之间的语义关系"],"q":"语义角色是指在各种语义关系中，名词性成分担任的一定的语义角色(论元)，如“施事”“受事”“工具”“方式”等，这实际上也就是揭示了名词性成分跟动词之间的语义关系。","w":"high","e":["教材高频"]},{"t":"语义指向","y":"名词解释","p":["某一成分跟其他成分之间在语义上的联系","同句法关系有时一致有时不一致","重点是非直接成分之间的语义联系"],"q":"语义指向是指句法结构中的某一成分跟其他成分之间在语义上的联系。这种语义联系同句法关系有时一致，有时不一致。语义指向分析的重点是分析在结构上没有直接组合关系的语法成分之间的语义联系，即非直接成分之间的语义联系。","w":"high","e":["教材高频"]},{"t":"语义特征","y":"名词解释","p":["符合某种组合选择","有区别性特征","最小语义成分"],"q":"词语中符合某种组合选择的有区别性特征的最小语义成分就是语义特征。词与词在选择搭配时既有一定的语法限制，也有一定的语义限制，这种语义限制实际上就是词与词在语义成分上的适应性。","w":"high","e":["教材高频"]},{"t":"【原文】五、“他连100分也考到","y":"教材原文","p":["五、“他连100分也考到了”以及“他连一条鲸鱼都钓到了”都是可以接受的","但是“他连1分也考到了”以及“他连一只小虾都钓到了”则不大能够接受","反之，“他连1分也没有考到”以及“他连一只小虾都没有钓到”都可以接受，但是“他连100分也没有考到”以及“他连一条鲸鱼都没有钓到”则是不大能接受的"],"q":"五、“他连100分也考到了”以及“他连一条鲸鱼都钓到了”都是可以接受的。但是“他连1分也考到了”以及“他连一只小虾都钓到了”则不大能够接受。反之，“他连1分也没有考到”以及“他连一只小虾都没有钓到”都可以接受，但是“他连100分也没有考到”以及“他连一条鲸鱼都没有钓到”则是不大能接受的。说说为什么?","w":"normal","e":["原书正文"]},{"t":"【原文】六、请分析“非A不B”框","y":"教材原文","p":["六、请分析“非A不B”框式结构的语法意义：A.非打官司不可","C.这样做非乱不可"],"q":"六、请分析“非A不B”框式结构的语法意义：A.非打官司不可。B.钱非还不可。C.这样做非乱不可。","w":"normal","e":["原书正文"]},{"t":"【原文】七、杭州有家著名的饭店“","y":"教材原文","p":["七、杭州有家著名的饭店“楼外楼”，其结构式是“A外A”，你能再举几例类似的名称吗?思考题一、分析、研究歧义现象对学习现代汉语语法有什么作用?举例说明"],"q":"七、杭州有家著名的饭店“楼外楼”，其结构式是“A外A”，你能再举几例类似的名称吗?思考题一、分析、研究歧义现象对学习现代汉语语法有什么作用?举例说明。","w":"normal","e":["原书正文"]},{"t":"【原文】二、巧妙地运用歧义，可以","y":"教材原文","p":["二、巧妙地运用歧义，可以产生特殊的艺术效果，你能够举一些例子吗?三、请自己动手搜集一些例子再归纳出一两种新的歧义格式，并略加分析"],"q":"二、巧妙地运用歧义，可以产生特殊的艺术效果，你能够举一些例子吗?三、请自己动手搜集一些例子再归纳出一两种新的歧义格式，并略加分析。","w":"normal","e":["原书正文"]},{"t":"【原文】四、歧义还有一种类型，即","y":"教材原文","p":["四、歧义还有一种类型，即由于语境而引起的歧义，比如“这个苹果是进口的","”你能够举出一些例句来吗?五、“玩你个头","”这种框式结构，你能够接受吗?你的方言里有这类说法吗?在口语交际里还有什么变化?"],"q":"四、歧义还有一种类型，即由于语境而引起的歧义，比如“这个苹果是进口的！”你能够举出一些例句来吗?五、“玩你个头！”这种框式结构，你能够接受吗?你的方言里有这类说法吗?在口语交际里还有什么变化?","w":"normal","e":["原书正文"]},{"t":"【原文】六、框式结构与新的构式理","y":"教材原文","p":["六、框式结构与新的构式理论有相通之处吗?说说你的看法"],"q":"六、框式结构与新的构式理论有相通之处吗?说说你的看法。","w":"normal","e":["原书正文"]},{"t":"【原文】学习要点：掌握句法语义的","y":"教材原文","p":["学习要点：掌握句法语义的认知解释最主要的三个原则与方法：1.原型范畴","树立语言动态发展的基本观念，包括历史动态、接触动态以及交际动态","重点了解句子在语言交际中的动态变化，包括移位、省略、插入和追补等"],"q":"学习要点：掌握句法语义的认知解释最主要的三个原则与方法：1.原型范畴；2.象似性原则；3.图形与背景。树立语言动态发展的基本观念，包括历史动态、接触动态以及交际动态。重点了解句子在语言交际中的动态变化，包括移位、省略、插入和追补等。","w":"normal","e":["原书正文"]},{"t":"【原文】一、认知的三个原则与方法","y":"教材原文","p":["一、认知的三个原则与方法语言活动受人类心理机制的制约，因此有许多普遍的规律，但由于语言类型上的差异，不同的语言也会表现出不同的特点","所以认知规律既有普遍性，也有特殊性","比如，欧美人在写信封时，总是遵循从小到大的顺序","而中国人则反其道而行之，从大到小排列"],"q":"一、认知的三个原则与方法语言活动受人类心理机制的制约，因此有许多普遍的规律，但由于语言类型上的差异，不同的语言也会表现出不同的特点。所以认知规律既有普遍性，也有特殊性。比如，欧美人在写信封时，总是遵循从小到大的顺序；而中国人则反其道而行之，从大到小排列。这就显示了欧美人跟中国人在认知上的差异。试比较：","w":"normal","e":["原书正文"]}]},{"id":"xdhy_down-c01-s09","t":"第九节 歧义结构与框式结构","w":"high","n":11,"k":[{"t":"表述歧义","y":"名词解释","p":["语义的表达要明确，不能有歧义","产生歧义的原因很复杂","不管哪种歧义在表达上都要力求避免"],"q":"语义的表达要明确，不能有歧义。产生歧义的原因是很复杂的，但是不管哪种歧义，在表达上都是要力求避免的。","w":"high","e":["2021 真题"]},{"t":"歧义现象","y":"名词解释","p":["一个语言片断可作两种或两种以上的语义理解","又叫做同形","以同形为前提"],"q":"歧义现象是指一个语言片断可以作两种或两种以上的语义理解。歧义又叫做“同形”，一个着眼于内容，一个着眼于形式。歧义必须以同形作为前提，不同形就无所谓歧义。","w":"high","e":["教材高频"]},{"t":"框式结构","y":"名词解释","p":["前后有两个不连贯的词语相互照应、相互依存","形成框架式结构","具有特殊的语法意义和特定的语用功能"],"q":"典型的框式结构，指前后有两个不连贯的词语相互照应，相互依存，形成一个框架式结构，具有特殊的语法意义和特定的语用功能。如果去除其中一个(主要是后面一个)，该结构便会散架。","w":"high","e":["教材高频"]},{"t":"【原文】一、复句和单句的区别分句","y":"教材原文","p":["一、复句和单句的区别分句是一种单句形式，分句的构造与一般单句的构造基本上是一致的，只是分句没有完全独立的语调，不能表达一个完整的意思","区别单句和复句可以从三个方面进行："],"q":"一、复句和单句的区别分句是一种单句形式，分句的构造与一般单句的构造基本上是一致的，只是分句没有完全独立的语调，不能表达一个完整的意思。区别单句和复句可以从三个方面进行：","w":"normal","e":["原书正文"]},{"t":"【原文】1.句法结构上互不包含主","y":"教材原文","p":["1.句法结构上互不包含主谓短语是最适合充当分句的，但是，要特别注意并不是所有的主谓短语都是句子，它如果处于被别的句法结构包含的地位，就不是句子了"],"q":"1.句法结构上互不包含主谓短语是最适合充当分句的，但是，要特别注意并不是所有的主谓短语都是句子，它如果处于被别的句法结构包含的地位，就不是句子了。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】这些句子表面上似乎都拥有","y":"教材原文","p":["这些句子表面上似乎都拥有两个以上的主谓结构，但是其中一个主谓结构只是句子中的某个成分，并不独立成句，是被包含在另一个更大的句法结构里边，所以全句只是单句，而不是复句"],"q":"这些句子表面上似乎都拥有两个以上的主谓结构，但是其中一个主谓结构只是句子中的某个成分，并不独立成句，是被包含在另一个更大的句法结构里边，所以全句只是单句，而不是复句。","w":"normal","e":["原书正文"]},{"t":"【原文】要注意“复句形式”，即形","y":"教材原文","p":["要注意“复句形式”，即形式上好像是复句，但实际上也只是单句中的一个成分"],"q":"要注意“复句形式”，即形式上好像是复句，但实际上也只是单句中的一个成分。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】例(5)“即使我不去他们","y":"教材原文","p":["例(5)“即使我不去他们也是会去的”，例(6)“内容好而且旋律美”就是所谓的“复句形式”，并非复句，因为它们不具备完整的语调，而且意义也不完整，在句中分别作宾语和定语"],"q":"例(5)“即使我不去他们也是会去的”，例(6)“内容好而且旋律美”就是所谓的“复句形式”，并非复句，因为它们不具备完整的语调，而且意义也不完整，在句中分别作宾语和定语。","w":"normal","e":["原书正文"]},{"t":"【原文】2.关联词语是重要的语法","y":"教材原文","p":["2.关联词语是重要的语法标志所谓“关联词语”，是指起关联作用的词和短语，它是识别复句类型的重要标志","它主要有三类：第一，连词，它属于一种语法手段，而不是句法成分","第二，副词，它身兼两职，既作句法成分，又起关联作用，比如“只有⋯⋯才⋯⋯”“只要⋯⋯就⋯⋯”中的“才”和“就”","第三，某些独立成分，往往由固定短语充当，比如“反之”“总而言之”“一方面⋯⋯另一方面⋯⋯”"],"q":"2.关联词语是重要的语法标志所谓“关联词语”，是指起关联作用的词和短语，它是识别复句类型的重要标志。它主要有三类：第一，连词，它属于一种语法手段，而不是句法成分。第二，副词，它身兼两职，既作句法成分，又起关联作用，比如“只有⋯⋯才⋯⋯”“只要⋯⋯就⋯⋯”中的“才”和“就”。第三，某些独立成分，往往由固定短语充当，比如“反之”“总而言之”“一方面⋯⋯另一方面⋯","w":"normal","e":["原书正文"]},{"t":"【原文】第一，有些分句与分句如果","y":"教材原文","p":["第一，有些分句与分句如果不用关联词语，就无法联系起来，或者语义关系不明确"],"q":"第一，有些分句与分句如果不用关联词语，就无法联系起来，或者语义关系不明确。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】第二，可以把分句之间复杂","y":"教材原文","p":["第二，可以把分句之间复杂的逻辑语义关系，表达得一清二楚","如下例，如果把括号里的关联词语全部70第四章 语法去掉，这段话语就几乎无法理解了"],"q":"第二，可以把分句之间复杂的逻辑语义关系，表达得一清二楚。如下例，如果把括号里的关联词语全部70第四章 语法去掉，这段话语就几乎无法理解了。","w":"normal","e":["原书正文"]}]},{"id":"xdhy_down-c01-s10","t":"第十节 认知解释与动态变化","w":"high","n":15,"k":[{"t":"移位","y":"名词解释","p":["改变句子常规语序","句法结构不变","语义关系基本不变"],"q":"移位是指改变句子常规语序，但句法结构不变，语义关系也基本不变的现象。口语交际时为了表情达意的需要，或由于其他原因，常常改变常规语序。","w":"high","e":["教材高频"]},{"t":"省略","y":"名词解释","p":["一定语境中省去一些成分","由上下文或语境制约造成","所省略成分确定无疑、可补回","补出后语义基本不变"],"q":"人们在运用语言时为了达到简洁的目的，在一定语境中常常省去一些成分，这就叫省略。省略必须符合三个条件：第一，是言语交际中由上下文或语境条件制约而造成的；第二，所省略的成分是确定无疑的，可以补回来的；第三，补出省略成分以后，句子的语义基本不变。","w":"high","e":["教材高频"]},{"t":"原型范畴","y":"名词解释","p":["具有该类范畴典型属性和特点的成员的集合","原型与非原型之间逐步过渡","形成一个连续统"],"q":"所谓原型范畴是指具有该类范畴典型属性和特点的成员的集合。在原型和非原型之间没有不可逾越的鸿沟，从最典型成员到最不典型成员，按照典型程度的高低逐步过渡，从而形成一个连续统。","w":"high","e":["教材高频"]},{"t":"插说","y":"名词解释","p":["临时打断原来句子结构","插入内容对前文说明、补充或改正"],"q":"在说话过程中，临时想起了什么，而有意打断原来句子的结构，插入某些内容，对前文予以说明、补充或改正，这就是插说。","w":"normal","e":["核心概念"]},{"t":"追补","y":"名词解释","p":["话说出来后追加补充","因为不够完整、准确或有错误","三种类型：补充型、注释型、修正型"],"q":"当话说出来以后，才发现不够完整、不够准确，甚至有错误，说话人马上在话语之后追加补充，这就叫追补。追补主要有三种类型：补充型、注释型、修正型。","w":"normal","e":["核心概念"]},{"t":"象似性原则","y":"名词解释","p":["两个事物之间外形、属性、特点相似","借以认识隐蔽、未知事物","转喻和隐喻两种方法"],"q":"象似性是指两个事物之间，或者某部分外形，或者某种属性，或者某种特点比较相似，我们就把这种联系称之为象似性关系。借助象似性原则，我们主要采用了转喻和隐喻的方法。","w":"normal","e":["核心概念"]},{"t":"图形与背景","y":"名词解释","p":["把直接对象作为图形","把另一事物作为背景","图形又叫目的物，背景又叫参照物"],"q":"我们感知两个事物之间的空间关系时，往往把一个事物A作为直接对象“图形”，而把另外一个事物B当作“背景”。图形又叫“目的物”，背景又叫“参照物”。","w":"normal","e":["核心概念"]},{"t":"【原文】(5)这只半大斑羚和这只","y":"教材原文","p":["(5)这只半大斑羚和这只老斑羚除非插上翅膀，否则绝对不可能跳到对面那座山崖上去"],"q":"(5)这只半大斑羚和这只老斑羚除非插上翅膀，否则绝对不可能跳到对面那座山崖上去。","w":"normal","e":["原书正文"]},{"t":"【原文】(6)除非你亲临现场，否","y":"教材原文","p":["(6)除非你亲临现场，否则，根本无法想象三峡工地那种宏伟的气势"],"q":"(6)除非你亲临现场，否则，根本无法想象三峡工地那种宏伟的气势。","w":"normal","e":["原书正文"]},{"t":"【原文】“只有”分句和“除非”分","y":"教材原文","p":["“只有”分句和“除非”分句提出的都是唯一条件，具有排他性，不同的是“只有”句从正面指定条件，“除非”句从反面推断条件"],"q":"“只有”分句和“除非”分句提出的都是唯一条件，具有排他性，不同的是“只有”句从正面指定条件，“除非”句从反面推断条件。","w":"normal","e":["原书正文"]},{"t":"【原文】C.周遍条件句，代表性框","y":"教材原文","p":["C.周遍条件句，代表性框架是“无论/不管⋯⋯，也/都⋯⋯”","前行分句中使用具有周遍意义的形式提出某个范围内的所有条件，后续分句表示所有条件都只有一个相同的结果，分句之间是“所有条件————唯一结果”关系"],"q":"C.周遍条件句，代表性框架是“无论/不管⋯⋯，也/都⋯⋯”。前行分句中使用具有周遍意义的形式提出某个范围内的所有条件，后续分句表示所有条件都只有一个相同的结果，分句之间是“所有条件————唯一结果”关系。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】(7)无论是与基辛格对话","y":"教材原文","p":["(7)无论是与基辛格对话，还是接受阿拉法特的反采访，她从来都没有怯场"],"q":"(7)无论是与基辛格对话，还是接受阿拉法特的反采访，她从来都没有怯场。","w":"normal","e":["原书正文"]},{"t":"【原文】(8)不管你居住在美国、","y":"教材原文","p":["(8)不管你居住在美国、日本还是非洲、北极，收发电子邮件都只是几秒钟的事情"],"q":"(8)不管你居住在美国、日本还是非洲、北极，收发电子邮件都只是几秒钟的事情。","w":"normal","e":["原书正文"]},{"t":"【原文】(八)目的复句一个分句表","y":"教材原文","p":["(八)目的复句一个分句表示目的，另一个分句表示为达到这一目的而发生的行为事件","分句之间是“目的————行为”关系"],"q":"(八)目的复句一个分句表示目的，另一个分句表示为达到这一目的而发生的行为事件。分句之间是“目的————行为”关系。","w":"normal","e":["原书正文"]},{"t":"【原文】1.前行分句表示目的，常","y":"教材原文","p":["1.前行分句表示目的，常用关联词语是“为了”"],"q":"1.前行分句表示目的，常用关联词语是“为了”。例如：","w":"normal","e":["原书正文"]}]},{"id":"xdhy_down-c01-s11","t":"第十一节 复句类型","w":"high","n":23,"k":[{"t":"复句","y":"名词解释","p":["两个或两个以上分句构成","意义上密切相关","结构上互不包含","表示一定的逻辑语义关系"],"q":"由两个或两个以上在意义上密切相关，结构上互不包含的分句所构成的语言单位，就叫复句。复句内部由两个或两个以上的分句构成，并且表示一定的逻辑语义关系。","w":"high","e":["教材高频"]},{"t":"并列复句","y":"名词解释","p":["先提出参照物","后续分句提出并存、平行或对立的事情","分句之间是“参事——并事”关系"],"q":"并列复句的前行分句先提出一件事情作为“参照物”，后续分句则相应提出在意义上并存、平行或对立的事情，全句同时说明或描写几件事情或同一事情的几个方面。分句之间是“参事——并事”关系。","w":"high","e":["教材高频"]},{"t":"递进复句","y":"名词解释","p":["前行分句提出情况","后续分句更推进一层","分句之间是“基事——递事”关系"],"q":"递进复句的前行分句提出一个情况，后续分句以此为基准，在数量、程度、范围、时间、功能或者其他方面更推进一层。分句之间是“基事——递事”关系。","w":"high","e":["教材高频"]},{"t":"连贯复句","y":"名词解释","p":["前行分句先陈述一种情况","后续分句陈述接着发生的另一种情况","分句之间是“先事——后事”关系"],"q":"连贯复句的前行分句首先陈述一种情况，后续分句随后陈述接着发生的另一种情况。分句之间是“先事——后事”关系。","w":"high","e":["教材高频"]},{"t":"因果复句","y":"名词解释","p":["前行分句说出原因","后续分句说出结果","分句之间是“原因——结果”关系"],"q":"因果复句的前行分句说出原因，后续分句说出由此而产生的结果。分句之间是“原因——结果”关系。因果复句分为说明性因果和推论性因果两类。","w":"high","e":["教材高频"]},{"t":"条件复句","y":"名词解释","p":["前行分句显示某种条件","后续分句推导出可能的结果","分句之间是“条件——结果”关系"],"q":"条件复句的前行分句显示某种条件，后续分句从该条件推导出可能的结果。分句之间是“条件——结果”关系。条件复句有假设条件句、特定条件句、周遍条件句三种类型。","w":"high","e":["教材高频"]},{"t":"转折复句","y":"名词解释","p":["前行分句承认某种客观事实作为让步","后续分句的结果违背常理","分句之间是“事实——转折”关系"],"q":"转折复句的前行分句先姑且承认某种客观事实作为让步，后续分句提出的结果却是违背常理的，与前一分句形成转折语义。两个分句之间是“事实——转折”关系。","w":"high","e":["教材高频"]},{"t":"让步复句","y":"名词解释","p":["前行分句提出假设的事实并姑且承认","后续分句结果违背常理","分句之间是“假设——转折”关系"],"q":"让步复句的前行分句先提出一种假设的事实，并姑且退让一步姑且承认这个假设的真实性，后续分句提出的结果却是违背常理的，与前一分句形成转折语义。分句之间是“假设——转折”关系。常用的关联词语是“即使……，也……”。","w":"high","e":["教材高频"]},{"t":"多重复句","y":"名词解释","p":["三个或三个以上分句","两个以上层次上组合","有几个层次就叫几重复句"],"q":"三个或三个以上的分句在两个以上的层次上组合起来的复句叫做多重复句。复句有几个层次，就叫几重复句，比如二重复句、三重复句、四重复句等。","w":"high","e":["教材高频"]},{"t":"紧缩复句","y":"名词解释","p":["分句间语音停顿取消","省略了一些关联词语","简称紧缩句"],"q":"一般的复句在分句与分句之间的语音停顿取消了，并且省略了一些关联词语，那就变成了紧缩复句，简称“紧缩句”。“紧缩”有两层意思：“紧”是紧凑，取消了语音停顿；“缩”是简缩，去掉了一些关联词语。","w":"high","e":["教材高频"]},{"t":"试比较并列复句和连贯复句的异同。","y":"名词解释","p":["并列是齐头并进、雁行式，次序可互换","连贯是相继进行、鱼贯式，一般不能换位","并列着眼于空间，连贯着眼于时间"],"q":"并列复句是齐头并进，雁行式，有时候次序可以互换而意义不变；连贯复句是相继进行，鱼贯式，由于时间上前后分明，一般不能换位。一个是横的并列，一个是纵的发展；一个着眼于空间，一个着眼于时间。从语义关系上说，并列复句分句之间是“参事——并事”关系，连贯复句分句之间是“先事——后事”关系。","w":"high","e":["教材高频"]},{"t":"试比较让步复句和转折复句的异同。","y":"名词解释","p":["相同点：语义都转到相反相对方面，是反预期、有转折意","不同点：让步复句前句是假设的，转折复句前句是真实的","让步复句“假设——转折”，转折复句“事实——转折”"],"q":"让步复句和转折复句的相同点在于：后句跟前句相比，语义上都转到它的相反相对方面去了，是反预期的，都有转折的意思。两者不同点在于：让步复句的前句是假设的，转折复句的前句是真实的。让步复句分句之间是“假设——转折”关系，常用关联词语是“即使……，也……”；转折复句分句之间是“事实——转折”关系，常用关联词","w":"high","e":["教材高频"]},{"t":"意合法","y":"名词解释","p":["不用任何关联词语","依靠语序","依靠前后分句的语义制约"],"q":"有一些复句不用任何关联词语，完全依靠语序以及前后分句的语义制约构成，这就叫“意合法”。","w":"normal","e":["核心概念"]},{"t":"补充复句","y":"名词解释","p":["前行分句表示主要意思","后续分句对前者追补或解说","分句之间是“主事——补事”关系"],"q":"补充复句的前行分句表示一个主要意思，后续分句对前者进行追补或解说。分句之间是“主事——补事”关系。","w":"normal","e":["核心概念"]},{"t":"目的复句","y":"名词解释","p":["一个分句表示目的","另一个分句表示达到目的的行为事件","分句之间是“目的——行为”关系"],"q":"目的复句中一个分句表示目的，另一个分句表示为达到这一目的而发生的行为事件。分句之间是“目的——行为”关系。","w":"normal","e":["核心概念"]},{"t":"【原文】5.“一⋯⋯就⋯⋯”","y":"教材原文","p":["5.“一⋯⋯就⋯⋯”","一是表示承接关系"],"q":"5.“一⋯⋯就⋯⋯”。有两种作用。一是表示承接关系。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】“一”是表示条件关系，相","y":"教材原文","p":["“一”是表示条件关系，相当于“只要⋯⋯就⋯⋯”"],"q":"“一”是表示条件关系，相当于“只要⋯⋯就⋯⋯”。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】7.“越⋯⋯越⋯⋯”","y":"教材原文","p":["7.“越⋯⋯越⋯⋯”","表示条件关系(倚变关系)，后者随着前者的变化而变化"],"q":"7.“越⋯⋯越⋯⋯”。表示条件关系(倚变关系)，后者随着前者的变化而变化。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】2.紧缩句的主语可以相同","y":"教材原文","p":["2.紧缩句的主语可以相同，也可以不同","可以全部出现，可以部分出现，也可以全不出现"],"q":"2.紧缩句的主语可以相同，也可以不同；可以全部出现，可以部分出现，也可以全不出现。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】(6)他一不高兴就发脾气","y":"教材原文","p":["(6)他一不高兴就发脾气","(前后主语相同，只出现前一主语)"],"q":"(6)他一不高兴就发脾气。(前后主语相同，只出现前一主语)","w":"normal","e":["原书正文"]},{"t":"【原文】(7)越干他越来劲","y":"教材原文","p":["(7)越干他越来劲","(前后主语相同，只出现后一主语)"],"q":"(7)越干他越来劲。(前后主语相同，只出现后一主语)","w":"normal","e":["原书正文"]},{"t":"【原文】(8)多做练习才能提高成","y":"教材原文","p":["(8)多做练习才能提高成绩","(前后主语相同，都未出现)"],"q":"(8)多做练习才能提高成绩。(前后主语相同，都未出现)","w":"normal","e":["原书正文"]},{"t":"【原文】(9)你去我也不去","y":"教材原文","p":["(9)你去我也不去","(前后主语不同，都出现)82第四章 语法"],"q":"(9)你去我也不去。(前后主语不同，都出现)82第四章 语法","w":"normal","e":["原书正文"]}]},{"id":"xdhy_down-c01-s12","t":"第十二节 多重复句与紧缩复句","w":"high","n":10,"k":[{"t":"划线分析法","y":"名词解释","p":["把层次分析法运用到多重复句分析","标出层次并标明关系"],"q":"划线分析法是把层次分析法的原则和方法运用到多重复句的分析上，标出层次并标明关系的分析方法。复句分析的目标有两个：一是确定分句之间的关系，二是划分复句内部的层次。","w":"high","e":["教材高频"]},{"t":"“一……就……”格式","y":"名词解释","p":["紧缩复句常见固定格式","表示承接关系","表示条件关系"],"q":"“一……就……”是紧缩复句的常见固定格式，有两种作用：一是表示承接关系，例如“老王一吃过晚饭就散步去了”；二是表示条件关系，相当于“只要……就……”，例如“他一来就没好事”。","w":"normal","e":["核心概念"]},{"t":"【原文】例(1)中的名词“玻璃”","y":"教材原文","p":["例(1)中的名词“玻璃”是有指称的，要理解例(1)的话语意义就要把“玻璃”这个词跟语境中特定的一块玻璃联系起来，这是“有指”","例(2)中有指称的是“窗子”，“玻璃”却仅用来表示一种性质，其语义作用表示属性，这是“无指”","例(3)的“李子”是“有指”，“拳头”是“无指”"],"q":"例(1)中的名词“玻璃”是有指称的，要理解例(1)的话语意义就要把“玻璃”这个词跟语境中特定的一块玻璃联系起来，这是“有指”。例(2)中有指称的是“窗子”，“玻璃”却仅用来表示一种性质，其语义作用表示属性，这是“无指”。例(3)的“李子”是“有指”，“拳头”是“无指”。","w":"normal","e":["原书正文"]},{"t":"【原文】专有名词的所指对象是独一","y":"教材原文","p":["专有名词的所指对象是独一无二的，通常“有指”，例如“雷锋”“王海”，指的是特定的人物个体，但有时也可用于“无指”，例如“雷锋精神”“王海现象”中的“雷锋”“王海”，是指以这些个体作为某些精神品质、思想观念的代表"],"q":"专有名词的所指对象是独一无二的，通常“有指”，例如“雷锋”“王海”，指的是特定的人物个体，但有时也可用于“无指”，例如“雷锋精神”“王海现象”中的“雷锋”“王海”，是指以这些个体作为某些精神品质、思想观念的代表。","w":"normal","e":["原书正文"]},{"t":"【原文】2.实指和泛指“实指”和","y":"教材原文","p":["2.实指和泛指“实指”和“泛指”是“有指”的两种情况"],"q":"2.实指和泛指“实指”和“泛指”是“有指”的两种情况。","w":"normal","e":["原书正文"]},{"t":"【原文】普通名词的所指对象都是一","y":"教材原文","p":["普通名词的所指对象都是一个庞大的集合，其中的每一个成员都具有该名词的词义所规定的那些本质特征，因此，普通名词的“有指”用法比较复杂，一是可以通过“实指”用法与语境中一些确切的对象，也就是发话者心目中已有确定目标的对象联系起来","二是通过“泛指”用法与语境中任意的对象联系起来"],"q":"普通名词的所指对象都是一个庞大的集合，其中的每一个成员都具有该名词的词义所规定的那些本质特征，因此，普通名词的“有指”用法比较复杂，一是可以通过“实指”用法与语境中一些确切的对象，也就是发话者心目中已有确定目标的对象联系起来；二是通过“泛指”用法与语境中任意的对象联系起来。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】(5)营业员小姐，借支笔","y":"教材原文","p":["(5)营业员小姐，借支笔给我行吗?显然，例(4)中的“笔”是发话者心目中确有所指的一支笔，这属于“实指”","例(5)中的“笔”并不确指哪一支特定的笔，只要是笔就行，属于“泛指”"],"q":"(5)营业员小姐，借支笔给我行吗?显然，例(4)中的“笔”是发话者心目中确有所指的一支笔，这属于“实指”。例(5)中的“笔”并不确指哪一支特定的笔，只要是笔就行，属于“泛指”。","w":"normal","e":["原书正文"]},{"t":"【原文】3.全指和别指在“实指”","y":"教材原文","p":["3.全指和别指在“实指”用法中，有“全指”与“别指”的区别","它们的共同点在于所指的都是有确定目标的对象，但“全指”的用法把词语与所指对象的整个集合联系起来————确定目标是集合中的所有成员","“别指”指称集合中某些确切的对象，与别的对象有所区别"],"q":"3.全指和别指在“实指”用法中，有“全指”与“别指”的区别。它们的共同点在于所指的都是有确定目标的对象，但“全指”的用法把词语与所指对象的整个集合联系起来————确定目标是集合中的所有成员；“别指”指称集合中某些确切的对象，与别的对象有所区别。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】例(6)的“腊梅”是指所","y":"教材原文","p":["例(6)的“腊梅”是指所有的腊梅，这种用法是“全指”","例(7)的“书”是指称某些确切的对象，与别的对象有所区别，这就属于“别指”的用法"],"q":"例(6)的“腊梅”是指所有的腊梅，这种用法是“全指”。例(7)的“书”是指称某些确切的对象，与别的对象有所区别，这就属于“别指”的用法。","w":"normal","e":["原书正文"]},{"t":"【原文】4.定指和不定指“别指”","y":"教材原文","p":["4.定指和不定指“别指”可以区分为“定指”和“不定指”","对发话者而言，某一或某些对象对发话者来说，当然都是已知的，可是对受话者而言，有两种可能：一是发话者可能认为受话者已经了解，于是就把对象作为已知事物向受话者陈述，这就是“定指”的用法","二是发话者也可能认为受话者并不了解，于是就把对象作为陌生事物向受话者陈述，这就是“不定指”的用法，暗示受话者准备接纳一个新的对象"],"q":"4.定指和不定指“别指”可以区分为“定指”和“不定指”。对发话者而言，某一或某些对象对发话者来说，当然都是已知的，可是对受话者而言，有两种可能：一是发话者可能认为受话者已经了解，于是就把对象作为已知事物向受话者陈述，这就是“定指”的用法；二是发话者也可能认为受话者并不了解，于是就把对象作为陌生事物向受话者陈述，这就是“不定指”的用法，暗示受话者准备接纳一个新","w":"normal","e":["原书正文"]}]}]},{"id":"xdhy_down-c02","t":"第五章 语用","w":"high","s":[{"id":"xdhy_down-c02-s01","t":"第一节 现代汉语语用概述","w":"high","n":17,"k":[{"t":"语境","y":"名词解释","p":["语境是人们运用语言进行言语交际的具体环境","语境是语用分析中极为重要的因素","语境分为语内环境和语外环境"],"q":"语境是人们运用语言进行言语交际的具体环境。语境是语用分析中极为重要的因素。","w":"high","e":["2018 真题","2020 真题","2023 真题"]},{"t":"语用学","y":"名词解释","p":["语用学探讨语言符号及其使用者与语境三者之间的关系","研究不同语境中话语交际时表达和理解语言的基本规律","语用即语言使用者在不同语境中话语交际的实际运用，包括表达和理解"],"q":"语用学探讨的是语言符号及其使用者与语境三者之间的关系；研究人们在不同语境中话语交际时表达和理解语言的基本规律，就是语用学。","w":"high","e":["2019 真题","2022 真题"]},{"t":"语用分析","y":"名词解释","p":["对语言使用者在不同语境中话语意义准确地表达和理解的基本规律进行分析","旨在揭示各种语言符号和非语言因素如何被调动以达到交际目的"],"q":"对语言使用者在不同语境中话语意义准确地表达和理解的基本规律进行分析，就是语用分析。","w":"high","e":["2021 真题"]},{"t":"语内环境","y":"名词解释","p":["语内环境是语言符号所构成的环境","即前言后语(口语)或上下文(书面语)","包括词语语境、句子语境、语篇语境"],"q":"语内环境指的是语言符号所构成的环境，即通常说的前言后语(口语)或上下文(书面语)，包括词语语境、句子语境、语篇语境。","w":"high","e":["2019 真题"]},{"t":"语外环境","y":"名词解释","p":["语外环境是语言交际中的非语言因素","包括现场、情境、背景知识三个方面"],"q":"语外环境指的是语言交际中的非语言因素，主要有三个方面：现场、情境、背景知识。","w":"high","e":["2020 真题","2022 真题"]},{"t":"字面意义","y":"名词解释","p":["离开语境时词或词组表示的意义称为字面意义","话语的字面意义通常跟真实意思不一样","发话者通常利用字面意义传达话语意义"],"q":"在离开语境的情况下，语言意义(词或词组表示的意义)称为字面意义。","w":"high","e":["2018 真题","2021 真题"]},{"t":"话语意义","y":"名词解释","p":["特定语境下话语所传递的真实意思称为话语意义","话语意义是语用分析的主要目的","表达能力是发话者利用语境表达话语意义的能力，理解能力是受话者利用语境获取话语意义的能力"],"q":"在特定语境下话语所传递的真实意思，称为话语意义。话语意义是语用分析的主要目的。","w":"high","e":["2019 真题","2023 真题"]},{"t":"话语","y":"名词解释","p":["发话者用语音表达的口语或文字表达的书面语的具体内容叫作话语","话语也叫超句体","话语以传递信息为主要目的，有激发型、传授型、宣泄型等类型"],"q":"发话者用语音表达的口语或文字表达的书面语的具体内容叫作“话语”，也叫“超句体”。","w":"normal","e":["核心概念"]},{"t":"受话者对话语的理解是一个被动过程。","y":"名词解释","p":["受话者对话语的理解不是被动过程","受话者在整个交际过程中处于主动探索、积极捕捉的心态"],"q":"错误。受话者对话语的理解并不是一个被动过程，恰恰相反，在整个交际过程中，会一直处于主动探索、积极捕捉的心态中。","w":"normal","e":["核心概念"]},{"t":"【原文】(2)李寻欢沉默了很久，","y":"教材原文","p":["(2)李寻欢沉默了很久，缓缓道：“今天……我不能和你交手","”郭嵩阳霍然转过身，目光刀一般瞪着李寻欢，厉声道：“你说什么?”李寻欢垂下了头，心在刺痛着","他知道到了这时再说“不能交手”，实无异临阵脱逃，这种事他本来宁死也不肯做的","但现在却非做不可"],"q":"(2)李寻欢沉默了很久，缓缓道：“今天……我不能和你交手！”郭嵩阳霍然转过身，目光刀一般瞪着李寻欢，厉声道：“你说什么?”李寻欢垂下了头，心在刺痛着。他知道到了这时再说“不能交手”，实无异临阵脱逃，这种事他本来宁死也不肯做的。但现在却非做不可。","w":"normal","e":["原书正文"]},{"t":"【原文】在现场，郭嵩阳本来对李寻","y":"教材原文","p":["在现场，郭嵩阳本来对李寻欢“我今天不能和你交手”这句话应该听得非常真切，但他却明知故问：“你说什么?”这明显是在说假话，但是李寻欢从郭嵩阳厉声反问的语气立刻就明白了他的真实意思：“你今天必须和我交手","”所以内心很痛苦"],"q":"在现场，郭嵩阳本来对李寻欢“我今天不能和你交手”这句话应该听得非常真切，但他却明知故问：“你说什么?”这明显是在说假话，但是李寻欢从郭嵩阳厉声反问的语气立刻就明白了他的真实意思：“你今天必须和我交手！”所以内心很痛苦。","w":"normal","e":["原书正文"]},{"t":"【原文】3.违反关联准则引发会话","y":"教材原文","p":["3.违反关联准则引发会话含意在话剧《北京人》中，曾思懿与她的儿子曾霆有这样一段问答："],"q":"3.违反关联准则引发会话含意在话剧《北京人》中，曾思懿与她的儿子曾霆有这样一段问答：","w":"normal","e":["原书正文"]},{"t":"【原文】(3)曾思懿 ⋯⋯你当你","y":"教材原文","p":["(3)曾思懿 ⋯⋯你当你还小么?十七岁，成了家的人了","你爷爷在你那么大，都养了家了","(突兀地)你的媳妇回来了没有?曾 霆 (一直很痛苦地听着他的话，微声)打了电话了"],"q":"(3)曾思懿 ⋯⋯你当你还小么?十七岁，成了家的人了。你爷爷在你那么大，都养了家了！(突兀地)你的媳妇回来了没有?曾 霆 (一直很痛苦地听着他的话，微声)打了电话了。","w":"normal","e":["原书正文"]},{"t":"【原文】从字面意义上看，曾霆的回","y":"教材原文","p":["从字面意义上看，曾霆的回答明显地违反了关联准则，因为“打了电话”并没有针对“媳妇回来了没有”直接回答","但是只要确认二者之间一定是有关联的就可以去努力推理，就会得出这句话的言外之意：如果回来了就没必要再打电话去催，所以，还需要打电话的话，正说明他的媳妇还没回来"],"q":"从字面意义上看，曾霆的回答明显地违反了关联准则，因为“打了电话”并没有针对“媳妇回来了没有”直接回答。但是只要确认二者之间一定是有关联的就可以去努力推理，就会得出这句话的言外之意：如果回来了就没必要再打电话去催，所以，还需要打电话的话，正说明他的媳妇还没回来。","w":"normal","e":["原书正文"]},{"t":"【原文】4.违反方式准则引发会话","y":"教材原文","p":["4.违反方式准则引发会话含意在曹禺的名剧《雷雨》中，周朴园的大儿子周萍跟继母周繁漪之间有过一段隐情，可是等到出现了纯朴的鲁四凤之后就想摆脱繁漪，但繁漪却不想失去她唯一的精神依托，于是两人激烈地争吵起来","争吵中周萍这样对繁漪说："],"q":"4.违反方式准则引发会话含意在曹禺的名剧《雷雨》中，周朴园的大儿子周萍跟继母周繁漪之间有过一段隐情，可是等到出现了纯朴的鲁四凤之后就想摆脱繁漪，但繁漪却不想失去她唯一的精神依托，于是两人激烈地争吵起来。争吵中周萍这样对繁漪说：","w":"normal","e":["原书正文"]},{"t":"【原文】(4)周萍 (冷冷地)如","y":"教材原文","p":["(4)周萍 (冷冷地)如果你以为你不是父亲的妻子，我自己还承认我是我父亲的儿子"],"q":"(4)周萍 (冷冷地)如果你以为你不是父亲的妻子，我自己还承认我是我父亲的儿子。","w":"normal","e":["原书正文"]},{"t":"【原文】方式准则要求话语的表达方","y":"教材原文","p":["方式准则要求话语的表达方式清楚明白、简明易懂，尤其在争吵的时候，一般更不能晦涩啰唆","周萍之所以使用这样晦涩甚至近乎废话的表达方式，正是要让对方意识到他们之间的那种乱伦关系是多么地令人羞耻和厌恶"],"q":"方式准则要求话语的表达方式清楚明白、简明易懂，尤其在争吵的时候，一般更不能晦涩啰唆。周萍之所以使用这样晦涩甚至近乎废话的表达方式，正是要让对方意识到他们之间的那种乱伦关系是多么地令人羞耻和厌恶。","w":"normal","e":["原书正文"]}]},{"id":"xdhy_down-c02-s02","t":"第二节 话语意义","w":"high","n":22,"k":[{"t":"指称","y":"名词解释","p":["指称主要是名词的功能","用名词的概括性词义去确定特定语境中的所指对象","指称表现在有指无指、实指泛指、全指别指、定指不定指等情形"],"q":"指称主要是名词的功能，用名词的概括性词义去确定特定语境中的所指对象，同时用相应的语音去称呼它。","w":"high","e":["2020 真题","2022 真题"]},{"t":"前提","y":"名词解释","p":["前提也称为预设，指交际各方共有的语境知识","是受话者正确理解、推导会话含意必须具备的先决条件和根据","前提处于具体话语产生之前，蕴藏在字面意义里"],"q":"前提，也称为预设，指交际各方共有的语境知识。这是受话者正确理解、推导会话含意必须具备的先决条件和根据。","w":"high","e":["2019 真题","2021 真题"]},{"t":"指示语","y":"名词解释","p":["指示语以具体交际情景要素作为参照点获得词义的所指对象","指示语以发话者为基准，在语境中有明确的指示对象和具体的意义","指示主要有四类：人称指示、时间指示、空间指示、话语指示"],"q":"某些词语以具体交际情景要素(说话者、说话时间、说话地点等)作为参照点，获得词义的所指对象，这些词语称为“指示语”。","w":"high","e":["2020 真题","2022 真题"]},{"t":"人称指示","y":"名词解释","p":["用人称指示语表示言语行为参与者所承担的角色","分第一人称、第二人称、第三人称三类"],"q":"用指示语表示言语行为参与者(交际各方)所承担的角色，就是人称指示。通常分为三类：第一人称、第二人称及第三人称。","w":"high","e":["2021 真题"]},{"t":"时间指示","y":"名词解释","p":["用指示语表示发话者说话时的各种时间","分三类：指示说话的时间、指示说话时间之前的时间、指示说话时间之后的时间"],"q":"用指示语表示发话者说话时的各种时间，就是时间指示。时间指示有三大类：第一，指示说话的时间；第二，指示说话时间之前的时间；第三，指示说话时间之后的时间。","w":"high","e":["2020 真题"]},{"t":"空间指示","y":"名词解释","p":["用指示语表示发话者说话时所在地点的各种空间位置","现代汉语只用近指、远指两种指示方式","动态形式用动词“来”“去”表示"],"q":"用指示语表示发话者说话时所在地点的各种空间位置，就是空间指示。现代汉语只用近指、远指两种指示方式。","w":"high","e":["2021 真题"]},{"t":"会话含意","y":"名词解释","p":["发话者在特定语境中没有用字面意义表达出来的意义","要靠受话者推求出来","也就是一般人所说的“言外之意”"],"q":"发话者在特定语境中没有用字面意义表达出来，而要靠受话者推求出来的话语意义，称为会话含意，也就是一般人所说的“言外之意”。","w":"high","e":["2018 真题","2020 真题","2022 真题"]},{"t":"辨析“有指”与“无指”。","y":"名词解释","p":["有指：名词跟语境中特定对象联系起来","无指：名词仅用来表示一种性质，语义作用表示属性","例：“打碎了一块玻璃”的“玻璃”是有指；“玻璃窗子”的“玻璃”是无指"],"q":"指称主要是名词的功能，但名词的使用未必一定是指称。有指指名词跟语境中特定对象联系起来的指称用法，无指指名词仅用来表示一种性质、其语义作用表示属性的用法。例(1)“他打碎了一块玻璃”中的“玻璃”是有指称的；例(2)“他卸下了一扇玻璃窗子”中有指称的是“窗子”，“玻璃”却是无指。专有名词的所指对象是独一","w":"high","e":["2021 真题"]},{"t":"辨析“实指”与“泛指”。","y":"名词解释","p":["实指和泛指是有指的两种情况","实指：与发话者心目中已有确定目标的对象联系","泛指：与语境中任意的对象联系","例：“我的笔”是实指，“借支笔”的“笔”是泛指"],"q":"“实指”和“泛指”是“有指”的两种情况。普通名词的所指对象都是一个庞大的集合，其“有指”用法一是通过“实指”用法与语境中一些确切的对象、也就是发话者心目中已有确定目标的对象联系起来；二是通过“泛指”用法与语境中任意的对象联系起来。例(4)“请把我的笔递给我”中的“笔”是发话者心目中确有所指的一支笔，","w":"high","e":["2019 真题","2022 真题"]},{"t":"辨析“全指”与“别指”。","y":"名词解释","p":["全指和别指都属于实指","全指：把词语与所指对象的整个集合联系起来，确定目标是集合中的所有成员","别指：指称集合中某些确切的对象，与别的对象有所区别"],"q":"在“实指”用法中，有“全指”与“别指”的区别。它们的共同点在于所指的都是有确定目标的对象，但“全指”的用法把词语与所指对象的整个集合联系起来，确定目标是集合中的所有成员；“别指”指称集合中某些确切的对象，与别的对象有所区别。例(6)“腊梅冬天开花”的“腊梅”是指所有的腊梅，用法是“全指”；例(7)“","w":"high","e":["2020 真题"]},{"t":"辨析“定指”与“不定指”。","y":"名词解释","p":["定指：发话者认为受话者已经了解，把对象作为已知事物陈述","不定指：发话者认为受话者并不了解，把对象作为陌生事物陈述","不定指一般通过数词“一”与量词组成数量短语再修饰名词来实现"],"q":"“别指”可以区分为“定指”和“不定指”。对发话者而言，某一或某些对象对发话者来说都是已知的，可是对受话者而言有两种可能：一是发话者可能认为受话者已经了解，于是就把对象作为已知事物向受话者陈述，这就是“定指”的用法；二是发话者也可能认为受话者并不了解，于是就把对象作为陌生事物向受话者陈述，这就是“不定","w":"high","e":["2018 真题","2021 真题"]},{"t":"辨析“前提”与“会话含意”。","y":"名词解释","p":["前提是交际各方共有的语境知识，是推导会话含意的先决条件","前提处于具体话语产生之前，蕴藏在字面意义里","会话含意是要靠受话者推求出来的话语意义","前提是基础，会话含意是推导结果"],"q":"前提，也称为预设，指交际各方共有的语境知识，是受话者正确理解、推导会话含意必须具备的先决条件和根据，在时间上前提的存在处于具体话语产生之前，由发话者预先设定，蕴藏在字面意义里。会话含意是发话者在特定语境中没有用字面意义表达出来、而要靠受话者推求出来的话语意义，即“言外之意”。二者都要依靠语境，但前提","w":"high","e":["2020 真题","2022 真题"]},{"t":"试述“指称”与“指示”的联系与区别。","y":"名词解释","p":["指示词语的话语意义分为指称和指示两种，必定与具体语境中的特指对象相联系","指称主要是名词的功能，被指称对象必须具备指称词词义所概括的本质特征","指示以交际情景要素为参照点，以发话者为基准","指示比指称更能体现话语与语境的紧密联系","前后互指关系不是指示"],"q":"指示词语的话语意义可以分为两种：第一是“指称”，第二是“指示”，它们必定与具体语境中的特指对象相联系。指称主要是名词的功能，用名词的概括性词义去确定特定语境中的所指对象，同时用相应的语音去称呼它；指称的最大特点在于，被指称对象必须具备指称词的词义所概括的本质特征。指示是某些词语以具体交际情景要素(说","w":"high","e":["2020 真题","2023 真题"]},{"t":"话语指示","y":"名词解释","p":["用指示语表示发话者表达过程中指语言符号链条中某一部分","话语指示分三类：正说写的话语、之前的话语、之后的话语"],"q":"用指示语表示发话者表达过程中指语言符号链条中某一部分称为话语指示。由于话语都是按时间顺序展开的，所以话语指示与时间指示一样分三类。","w":"normal","e":["核心概念"]},{"t":"【原文】C.话段。围绕着同一个主","y":"教材原文","p":["围绕着同一个主题展开的一组话对构成一个话段","一个话段具有多少个话对也是没有上限的","当然，只要发生了会话主题的转换，这一话段也随之而转到了下一个话段"],"q":"C.话段。围绕着同一个主题展开的一组话对构成一个话段。一个话段具有多少个话对也是没有上限的。当然，只要发生了会话主题的转换，这一话段也随之而转到了下一个话段。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】(4)周繁漪 怎么这两天","y":"教材原文","p":["(4)周繁漪 怎么这两天没见着大少爷?鲁四凤 大概是很忙"],"q":"(4)周繁漪 怎么这两天没见着大少爷?鲁四凤 大概是很忙。","w":"normal","e":["原书正文"]},{"t":"【原文】周繁漪 听说他也要到矿上","y":"教材原文","p":["周繁漪 听说他也要到矿上去，是么?鲁四凤 我不知道"],"q":"周繁漪 听说他也要到矿上去，是么?鲁四凤 我不知道。","w":"normal","e":["原书正文"]},{"t":"【原文】周繁漪 你没有听见说么?","y":"教材原文","p":["周繁漪 你没有听见说么?第四节 话 语 结 构107鲁四凤 没有，倒是侍候大少爷的张奶奶这两天尽忙着给他捡衣裳"],"q":"周繁漪 你没有听见说么?第四节 话 语 结 构107鲁四凤 没有，倒是侍候大少爷的张奶奶这两天尽忙着给他捡衣裳。","w":"normal","e":["原书正文"]},{"t":"【原文】周繁漪 你父亲干什么呢?","y":"教材原文","p":["周繁漪 你父亲干什么呢?鲁四凤 不知道","————他说，他问太太的病"],"q":"周繁漪 你父亲干什么呢?鲁四凤 不知道。————他说，他问太太的病。","w":"normal","e":["原书正文"]},{"t":"【原文】周繁漪 他倒惦记着我，(","y":"教材原文","p":["周繁漪 他倒惦记着我，(停一下，忽然)他现在还没起来么?鲁四凤 谁?周繁漪 (没有想到四凤这样问，忙收敛一下)嗯————大少爷"],"q":"周繁漪 他倒惦记着我，(停一下，忽然)他现在还没起来么?鲁四凤 谁?周繁漪 (没有想到四凤这样问，忙收敛一下)嗯————大少爷。","w":"normal","e":["原书正文"]},{"t":"【原文】例(4)由六个话对或十二","y":"教材原文","p":["例(4)由六个话对或十二个话轮组成，它们可以分为三个话段","从第一到第六个话轮属第一话段","第七、第八两个话轮组成第二话段","第九个话轮的前半部分还属于第二话段"],"q":"例(4)由六个话对或十二个话轮组成，它们可以分为三个话段。从第一到第六个话轮属第一话段；第七、第八两个话轮组成第二话段；第九个话轮的前半部分还属于第二话段。后半部以“停一下”为标记，主题发生了转换，进入了第三语段。","w":"normal","e":["原书正文"]},{"t":"【原文】一次完整的会话由连续发生","y":"教材原文","p":["一次完整的会话由连续发生的若干个话段组成，但也可以只有一个话段","而话段又可以只由一个话对组成，所以一次最简单的会话只包括一个话对","这是会话的最低要求，否则就是独白而不是会话了"],"q":"一次完整的会话由连续发生的若干个话段组成，但也可以只有一个话段。而话段又可以只由一个话对组成，所以一次最简单的会话只包括一个话对。这是会话的最低要求，否则就是独白而不是会话了。","w":"normal","e":["原书正文"]}]},{"id":"xdhy_down-c02-s03","t":"第三节 言语行为与会话原则","w":"high","n":28,"k":[{"t":"言语行为","y":"名词解释","p":["言语行为指用言语来施行、达到交际意图的行为","整个过程由言内行为、言外行为、言后行为构成","过程可描述为言之发、示言之力、收言后之果"],"q":"话语交际可以看成人类的一种“言语行为”，指的是用言语来施行、达到交际意图的行为。","w":"high","e":["2018 真题","2020 真题","2022 真题"]},{"t":"言内行为","y":"名词解释","p":["言内行为指言语表达(说、写)这一行为本身","即“以言指事”，又称为“以言表意”"],"q":"言内行为指言语表达(说、写)这一行为本身，“以言指事”。","w":"high","e":["2019 真题","2021 真题"]},{"t":"言外行为","y":"名词解释","p":["言外行为指用言语表达来体现发话者意图的一种行为","即“以言行事”"],"q":"言外行为指用言语表达(说、写)来体现发话者意图的一种行为，即“以言行事”。","w":"high","e":["2018 真题","2021 真题"]},{"t":"言后行为","y":"名词解释","p":["言后行为指受话者接收话语之后所受到的影响","即话语所带来的实际结果","也就是“以言取效”"],"q":"言后行为指受话者接收发话者话语之后所受到的影响，也就是话语所带来的实际结果，即“以言取效”。","w":"high","e":["2019 真题","2022 真题"]},{"t":"数量准则","y":"名词解释","p":["话语所含信息量与本次交谈所需信息量应该一致","发话者应提供适量信息，既不能太少也不能太多","受话者相信发话者正是这样做的"],"q":"话语所含信息量与本次交谈所需信息量应该一致。发话者应根据语境要求向受话者提供适量信息，既不能太少，也不能太多；同时受话者也相信发话者正是这样做的。","w":"high","e":["2019 真题"]},{"t":"质量准则","y":"名词解释","p":["话语提供的信息内容必须跟语境中的实际情况相一致","发话者所提供的信息真实可靠，不说假话","受话者的合作表现在他相信发话者说的是真话"],"q":"话语提供的信息内容必须跟语境中的实际情况相一致。也就是说，发话者所提供的信息真实可靠，不说假话。","w":"high","e":["2020 真题"]},{"t":"关联准则","y":"名词解释","p":["话语之间以及话语与话题之间应该相互关联","发话者按“已知→未知”认知顺序组织、展开话语","受话者相信发话者有诚意，努力搜寻可能存在的联系"],"q":"话语之间以及话语与话题之间应该相互关联。","w":"high","e":["2018 真题","2022 真题"]},{"t":"方式准则","y":"名词解释","p":["话语的表达方式让受话者易于理解","尽量避免歧义、晦涩、啰唆、含混等现象","追求通晓流畅、条理分明、易于理解的表达方式"],"q":"话语的表达方式让受话者易于理解。发话者在说话时应尽量避免歧义、晦涩、啰唆、含混等现象，而追求通晓流畅、条理分明、易于理解的表达方式。","w":"high","e":["2021 真题"]},{"t":"礼貌原则","y":"名词解释","p":["礼貌原则指尽量把不礼貌的表达方式减低到最低限度","礼貌原则也称为得体原则","礼貌原则处在比合作原则更高的层次上","礼貌原则比合作原则具有更大的灵活性"],"q":"礼貌原则指在其他条件相同的情况下，尽量把不礼貌的表达方式减低到最低限度。礼貌原则也称为得体原则。","w":"high","e":["2018 真题","2020 真题","2022 真题"]},{"t":"慷慨准则","y":"名词解释","p":["慷慨准则即尽量少表达利己的和有损于对方的看法","使他人受惠最大而受损最小，使自己受惠最小而受损最大","用疑问句表示祈使是一种委婉的表达方式"],"q":"慷慨准则，指尽量少表达利己的和有损于对方的看法。话语交际内容尽量使他人受惠最大而受损最小，尽量使自己受惠最小而受损最大。","w":"high","e":["2020 真题"]},{"t":"一致准则","y":"名词解释","p":["一致准则即尽量缩小与对方的分歧，尽量夸大与对方的一致","分歧和一致可以是观点上的，也可以是情感上的"],"q":"一致准则，指在话语中尽量缩小与对方的分歧，尽量夸大与对方的一致。","w":"high","e":["2021 真题"]},{"t":"会话合作原则","y":"名词解释","p":["会话合作原则是反映普遍规律的基本原则，由四条准则组成","包括数量准则、质量准则、关联准则、方式准则"],"q":"成功的话语交际都有赖于交际各方的密切合作，会话合作原则就是这样一个反映了普遍规律的基本原则，它由四条准则组成。","w":"high","e":["2018 真题","2020 真题","2022 真题"]},{"t":"竞争类言语行为","y":"名词解释","p":["竞争类言语行为有病“命令”“要求”“批评”“禁止”等","行为形式本身是失礼的","对语言方式并没有严格要求，发话者可以选择"],"q":"竞争类言语行为，这类行为有“命令”“要求”“批评”“禁止”等。这些行为形式本身之所以是失礼的，是因为与发话者想达到的目的和礼貌要求之间的关系不太协调。","w":"high","e":["2020 真题"]},{"t":"会话含意的推理","y":"名词解释","p":["会话含意的推理是语用分析主要的任务和目的","故意违反合作原则就是言外之意的推理信号","受话者从字面意义出发，根据语境去努力推导出真正意图"],"q":"会话含意在交际中有重要价值，是语用的核心内容，所以，会话含意的推理是语用分析主要的任务和目的。故意违反合作原则就是言外之意的推理信号。","w":"high","e":["2019 真题","2022 真题"]},{"t":"会话含意推理的过程","y":"名词解释","p":["会话含意的推理是一种演绎式的推理","需要有大前提(一般性的知识)和小前提(针对特定对象的具体知识)","被选定的相关语境知识是大前提，字面意义是小前提","推理就是从大前提推导出针对特定对象的新结论"],"q":"会话含意的推理是一种演绎式的推理，它的进行需要有大前提(一般性的知识)，还需要有小前提(针对特定对象的具体知识)。被选定的相关语境知识是大前提，字面意义是小前提，推理就是从大前提推导出针对特定对象的新结论。","w":"high","e":["2020 真题","2022 真题"]},{"t":"请说明会话含意推理的四个环节。","y":"名词解释","p":["推理的起点：字面意义","推理的依据：相关的前提","推理的过程：字面意义与语境信息相互作用","推理的结果：会话含意"],"q":"会话含意的推理可以分为四个环节：1.推理的起点：字面意义；2.推理的依据：相关的前提；3.推理的过程：字面意义与语境信息相互作用；4.推理的结果：会话含意。","w":"high","e":["2019 真题","2021 真题"]},{"t":"试述合作原则与礼貌原则的关系。","y":"名词解释","p":["礼貌原则是在合作原则基础之上提出的，为合作原则保驾护航","礼貌原则处在比合作原则更高的层次上","只有遵循了礼貌原则，才谈得上真正遵循合作原则","有时为了维护礼貌原则，人们甚至不惜牺牲合作原则的某一准则","礼貌原则比合作原则具有更大的灵活性"],"q":"礼貌原则是语用另一个核心内容，它是在合作原则基础之上提出的，为了给合作原则“保驾护航”，使其交际效率最高，效果最好，也为了更合理解释话语交际上的复杂现象。礼貌原则处在比合作原则更高的层次上。只有遵循了礼貌原则，才谈得上真正遵循合作原则，因为礼貌原则维护了交际各方的均等地位和友好关系，受话者更愿意去配","w":"high","e":["2018 真题","2021 真题","2023 真题"]},{"t":"辨析“言外行为”与“言后行为”。","y":"名词解释","p":["言外行为是以言行事，以语言意义的力量就能完成","言后行为是以言取效，其效果不仅仅是语言的范围","例：“承诺”是言外行为，“放心”是言后行为"],"q":"言外行为指用言语表达来体现发话者意图的一种行为，即“以言行事”；言后行为指受话者接收发话者话语之后所受到的影响，也就是话语所带来的实际结果，即“以言取效”。二者的区别在于：言外行为以语言意义的力量就能完成，而言后行为所产生的效果，不仅仅是语言的范围了。例如“你放心，我明天会来的”，其“承诺”是言外行","w":"high","e":["2020 真题","2023 真题"]},{"t":"语言表达方式越间接，话语就越显得礼貌。","y":"名词解释","p":["语言表达方式越间接，话语就越显得礼貌"],"q":"正确。礼貌有一个普遍适用的原则：语言表达方式越间接，话语就越显得礼貌。","w":"high","e":["2019 真题"]},{"t":"谦虚准则","y":"名词解释","p":["谦虚准则即在话语中尽量少赞誉自己并少贬低对方","对受话一方多赞扬，少指责；对自己避免炫耀，甚至适当贬低自己","不同民族对谦虚准则有不同的理解"],"q":"谦虚准则，指在话语中尽量少赞誉自己并少贬低对方。","w":"normal","e":["核心概念"]},{"t":"【原文】又如定语、状语总是位于中","y":"教材原文","p":["又如定语、状语总是位于中心语之前，我们也可以打破这种人们司空见惯的语序："],"q":"又如定语、状语总是位于中心语之前，我们也可以打破这种人们司空见惯的语序：","w":"normal","e":["原书正文"]},{"t":"【原文】(11)我们看见了一轮西","y":"教材原文","p":["(11)我们看见了一轮西部的太阳，用黄土捏就的，用血汗揉就的，用黄河水塑就的……"],"q":"(11)我们看见了一轮西部的太阳，用黄土捏就的，用血汗揉就的，用黄河水塑就的……","w":"normal","e":["原书正文"]},{"t":"【原文】这样的语序变化把定语从依","y":"教材原文","p":["这样的语序变化把定语从依附性的语法位置提升到了具有一定独立性的语法位置，它所传递的信息也就更容易凸现而得到特殊的关注"],"q":"这样的语序变化把定语从依附性的语法位置提升到了具有一定独立性的语法位置，它所传递的信息也就更容易凸现而得到特殊的关注。","w":"normal","e":["原书正文"]},{"t":"【原文】例(12)是急于把最重要","y":"教材原文","p":["例(12)是急于把最重要的信息尽早说出来，例(13)是想追加某种重要的信息"],"q":"例(12)是急于把最重要的信息尽早说出来，例(13)是想追加某种重要的信息。","w":"normal","e":["原书正文"]},{"t":"【原文】正因为语用语序的变化所造","y":"教材原文","p":["正因为语用语序的变化所造成的位置相对来说都是不正常的，但它们的语法关系却没有变化，主语还是主语，宾语还是宾语，所以它们与句子的主要部分之间一般都用逗号隔开，这是一种标记，实际上在暗示受话者","这种强调方式，既要从变化后的位置把握它们带来的修辞效果，又要回到原先的位置上去掌握它们的语法意义"],"q":"正因为语用语序的变化所造成的位置相对来说都是不正常的，但它们的语法关系却没有变化，主语还是主语，宾语还是宾语，所以它们与句子的主要部分之间一般都用逗号隔开，这是一种标记，实际上在暗示受话者。这种强调方式，既要从变化后的位置把握它们带来的修辞效果，又要回到原先的位置上去掌握它们的语法意义。","w":"normal","e":["原书正文"]},{"t":"【原文】(二)句子格式的变化现代","y":"教材原文","p":["(二)句子格式的变化现代汉语的句子格式是极为丰富多彩的，不同的句式有着不同的表达作用，句式的多样化为句式的选择提供了一种可能性"],"q":"(二)句子格式的变化现代汉语的句子格式是极为丰富多彩的，不同的句式有着不同的表达作用，句式的多样化为句式的选择提供了一种可能性。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】以上三句话虽然说同一个意","y":"教材原文","p":["以上三句话虽然说同一个意思，但是肯定句、否定句及双重否定句却有不同表达效果"],"q":"以上三句话虽然说同一个意思，但是肯定句、否定句及双重否定句却有不同表达效果。","w":"normal","e":["原书正文"]},{"t":"【原文】1.简单句与复杂句一个句","y":"教材原文","p":["1.简单句与复杂句一个句子从简单变得复杂，主要有三个途径：添枝加叶，局部发达，前后衔接"],"q":"1.简单句与复杂句一个句子从简单变得复杂，主要有三个途径：添枝加叶，局部发达，前后衔接。例如：","w":"normal","e":["原书正文"]}]},{"id":"xdhy_down-c02-s04","t":"第四节 话语结构","w":"high","n":31,"k":[{"t":"话题","y":"名词解释","p":["话题指的是发话者表述的出发点或对象","述题指的是对话题出发点或对象进行的说明","汉语是一种话题凸显的语言","话题具有交际定向作用，承载已知信息"],"q":"“话题”指的是发话者表述的出发点或对象，“述题”指的是对话题出发点或对象进行的说明。","w":"high","e":["2018 真题","2021 真题"]},{"t":"话轮","y":"名词解释","p":["会话参与者各方不断互换角色轮番说话","每一个参与者一次连续说的话就是一个话轮","话轮至少是一个句子"],"q":"会话的参与者各方不断互换角色轮番说话，每一个参与者一次连续说的话，就是一个话轮。","w":"high","e":["2019 真题","2022 真题"]},{"t":"话对","y":"名词解释","p":["话对是前后相邻、内容相关的两个话轮构成的会话单位","内容相关指两个话轮在功能上对应","如提问与回答、提议与认可或谢绝等"],"q":"话对，前后相邻、内容相关的两个话轮构成的会话单位称为话对。","w":"high","e":["2020 真题"]},{"t":"话段","y":"名词解释","p":["话段是围绕着同一个主题展开的一组话对","一个话段具有多少个话对没有上限","只要发生会话主题的转换，话段也随之转到下一个话段"],"q":"话段，围绕着同一个主题展开的一组话对构成一个话段。","w":"high","e":["2021 真题"]},{"t":"话题链","y":"名词解释","p":["话题跟话题的联系及其方式构为话题链","作用是显示出话语语义推进的线索和话语中心的整合","话题链分三类：同题链、异题链、包题链"],"q":"话题跟话题的联系及其方式，构为“话题链”，其作用是显示出话语语义推进的线索和话语中心的整合。","w":"high","e":["2019 真题","2022 真题"]},{"t":"同题链","y":"名词解释","p":["同题链是上文的话题延伸到下文来","后一句的话题就是前一句话题的延伸","语言形式可以完整转移，也可以有一定改变"],"q":"同题链，上文的话题延伸到下文来，这时，后一句的话题就是前一句话题的延伸，不过，语言形式可以完整转移，也可以有一定改变。同题链常常用来表述同一事物的不同方面或者连续的动作等。","w":"high","e":["2021 真题"]},{"t":"异题链","y":"名词解释","p":["异题链是上文的话题跟下文的话题不相同","作用较广泛，可表示不同事物的不同方面或情况，也可表示同一事物的不同方面或情况"],"q":"异题链，上文的话题跟下文的话题不相同。异题链作用较广泛，可以表示不同事物的不同方面或者情况，同一事物的不同方面或情况。","w":"high","e":["2020 真题"]},{"t":"包题链","y":"名词解释","p":["包题链由有包容关系的话题形成","作用在于在一定范围内揭示或者概括一个事物的不同部分"],"q":"包题链，由有包容关系的话题形成。“包题链”的作用在于在一定范围内揭示或者概括一个事物的不同部分。","w":"high","e":["2019 真题"]},{"t":"话语衔接","y":"名词解释","p":["话语衔接是通过种种语言手段把句子衔接成一个结构整体","特点是衔接、衔接手段和连贯性","衔接其实是一种语义联系"],"q":"话语衔接就是通过种种语言手段，把句子衔接成一个结构整体。在受话者理解话语时的心理感受中，就出现了一种连贯性。","w":"high","e":["2019 真题","2022 真题"]},{"t":"指代关系","y":"名词解释","p":["指代关系依靠代词与先行词之间的联系把话语的两部分衔接起来","特殊情形下也可以是后行词","代词衔接作用最强，是最常用的衔接手段"],"q":"指代关系依靠代词与先行词之间的联系把话语的两部分衔接起来，在一些特殊的情形下也可以是后行词。","w":"high","e":["2020 真题"]},{"t":"省略关系","y":"名词解释","p":["省略也是衔接，句子结构成分如主语、宾语的省略可衔接话语","受话者到前文中寻找相关信息，一旦找到话语就被衔接起来","零形态代词的衔接方式称为零形指代"],"q":"省略也是衔接。有的句子结构成分会省略，例如主语、宾语。这时受话者就会努力地到前文中去寻找与之相关的信息，一旦找到，话语也就被衔接了起来。","w":"high","e":["2019 真题","2022 真题"]},{"t":"逻辑关系","y":"名词解释","p":["逻辑关系由各种各样的关联词语来体现","话语中某一部分有关联词语出现，就必须到与之关联的另一部分去寻找相关信息","关联词语包括表时间、空间关系及其他关系的词语"],"q":"逻辑关系可以由各种各样的关联词语来体现，凡是话语中某一部分有关联词语出现，就必须到与之关联的另一部分去寻找相关信息，在这样的过程中话语就被衔接起来了。","w":"high","e":["2020 真题"]},{"t":"替代关系","y":"名词解释","p":["同一个指称对象在前后句子里用不同的词语来指称形成替代关系","后出现的必须跟先出现的联系起来才能确认同指关系","有同指关系的两个词语可以在语言形式上完全不同"],"q":"同一个指称对象，在前后句子里用不同的词语来指称，这两个或几个不同的词语就形成了替代关系。","w":"high","e":["2021 真题"]},{"t":"平行式推进","y":"名词解释","p":["平行式是各后继句都直接以首句的话题为话题","分别引出不同的述题，各话题之间是平行关系","语言形式上允许改变，可用代词、零形指代、同指词语替代"],"q":"平行式，各后继句都直接以首句的话题为话题，分别引出不同的述题，各话题之间是平行关系。不过，语言形式上允许改变，例如下句话题用代词、零形指代、有同指关系的词语替代等指代上句的话题。","w":"high","e":["2021 真题"]},{"t":"派生式推进","y":"名词解释","p":["派生式是从上文语句话题中派生出后继语句各个话题","分属不同层次：原话题属上位，后续句话题属下位","它们之间并不能构成平行关系"],"q":"派生式，从上文语句话题中派生出后继语句各个话题，不过分属不同层次：原话题属上位，后续句话题属下位，它们之间并不能构成平行关系。","w":"high","e":["2019 真题"]},{"t":"线性式推进","y":"名词解释","p":["线性式依靠前一句的述题或述题的一部分延伸为后一句的话题","前句与后句形成一环扣一环的线性推进关系","修辞格的顶针就是这样形成的"],"q":"线性式，依靠前一句的述题或述题的一部分延伸为后一句的话题，前句与后句就形成了一环扣一环的线性推进关系。","w":"high","e":["2020 真题"]},{"t":"分叉式推进","y":"名词解释","p":["分叉式是前一语句的述题中延伸出来的话题不止一个","这些话题之间有着并列关系，形成分叉推进","分叉推进就是下位层次的平行推进或派生推进"],"q":"分叉式，从前一语句的述题中延伸出来的话题如果不止一个，而这些话题之间又有着并列关系，形成分叉推进。分叉推进其实就是下位层次的平行推进或派生推进。","w":"high","e":["2021 真题"]},{"t":"会话的开端","y":"名词解释","p":["会话开端的功能是发话者引起对方注意并邀请参与，受话者表示愿意参与","一般采用“召唤————回应”的结构方式"],"q":"会话的开端具有两方面的功能：发话者用一定的手段引起对方的注意，并表示邀请参与这次言语活动的意向；受话者则表示已经把注意力转移过来，并愿意参与这次言语活动，因此一般采用“召唤————回应”的结构方式。","w":"high","e":["2021 真题"]},{"t":"会话的结尾","y":"名词解释","p":["会话结尾由结束信号语、前置收尾语和收尾语三部分组成","结束信号语率先发出结束信号，另一方回应","前置收尾语从礼貌上提供缓冲时间","收尾语是会话正式结束的标志"],"q":"结尾一般由三个部分组成：结束信号语、前置收尾语和收尾语。","w":"high","e":["2019 真题","2022 真题"]},{"t":"话轮延伸标记","y":"名词解释","p":["话轮延伸标记有两种：延续性词语和显示话语整体结构的词语","延续性词语如“嗯……”“这个，这个……”","显示话语整体结构的词语如“第一……，第二……，第三……”"],"q":"所谓的话轮延伸标记，主要有两种：第一，延续性词语，如“嗯……”“这个，这个……”等；第二，显示话语整体结构的词语，如“第一……，第二……，第三……”等。","w":"high","e":["2021 真题"]},{"t":"话轮结束标记","y":"名词解释","p":["话轮结束标记有话轮结束停顿和体态语两种","话轮结束时的停顿较长，语速放慢，语气加强","通过目光和手势等体态语判断话语是否结束"],"q":"所谓的话轮结束标记主要有：第一，话轮结束停顿。第二，体态语。","w":"high","e":["2020 真题"]},{"t":"综合延伸式推进","y":"名词解释","p":["综合延伸式推进由前句的话题和述题结合作为后句新话题而延伸推进","总要借助一个总括性词语来接纳前句"],"q":"综合延伸式推进，由前句的话题和述题结合作为后句新话题而延伸推进。","w":"high","e":["2020 真题"]},{"t":"试述话语衔接与话题推进的关系。","y":"名词解释","p":["“已知信息——未知信息”的心理顺序在语句中对应为“话题——述题”","话语衔接中的衔接部分负载未知信息，被衔接部分成理解的关键","衔接手段是帮助受话者找回已知信息的语言机制","话题————述题形成话语的结构框架，显示话语线索"],"q":"话语一经衔接，语义理解就变得通达顺畅，这就是连贯性。人在接受信息、获取经验时具有从已知信息出发接受未知信息的特点，这使我们一旦面对新信息时，就会不由自主地去语境中回溯寻觅相关的已知信息，然后再从已知信息出发去接受理解新信息。这种“已知信息————未知信息”的心理顺序，在语句中对应为“话题————述题","w":"high","e":["2019 真题","2022 真题"]},{"t":"【原文】例(1)中的“伟大”“伟","y":"教材原文","p":["例(1)中的“伟大”“伟绩”“武功”真正想表达的是“卑鄙”“无耻”等意义，表达出鲁迅对统治者的强烈愤怒和谴责","例(2)中的“‘廉洁’的表率”其实是揭露批判贪污的罪恶"],"q":"例(1)中的“伟大”“伟绩”“武功”真正想表达的是“卑鄙”“无耻”等意义，表达出鲁迅对统治者的强烈愤怒和谴责。例(2)中的“‘廉洁’的表率”其实是揭露批判贪污的罪恶。","w":"normal","e":["原书正文"]},{"t":"【原文】2.风趣反语","y":"教材原文","p":["为表达风趣、幽默等轻松愉快的效果"],"q":"2.风趣反语。为表达风趣、幽默等轻松愉快的效果。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】(3)你这个死丫头，工资","y":"教材原文","p":["(3)你这个死丫头，工资有多少呀?一下子给妈妈买这么多东西"],"q":"(3)你这个死丫头，工资有多少呀?一下子给妈妈买这么多东西！","w":"normal","e":["原书正文"]},{"t":"【原文】(4)你呀，可会挑好日子","y":"教材原文","p":["(4)你呀，可会挑好日子了，这么大的风雨还赶过来，船万一出了事怎么办?例(3)用“死丫头”这个贬义词语表达由衷的夸赞，例(4)用“可会挑好日子”的幽默表达出对在“坏天气”行动容易出事的担忧"],"q":"(4)你呀，可会挑好日子了，这么大的风雨还赶过来，船万一出了事怎么办?例(3)用“死丫头”这个贬义词语表达由衷的夸赞，例(4)用“可会挑好日子”的幽默表达出对在“坏天气”行动容易出事的担忧。","w":"normal","e":["原书正文"]},{"t":"【原文】(八)借代用与本体相关的","y":"教材原文","p":["(八)借代用与本体相关的事物(代体)来指称本体，这种辞格叫借代","借代有以下六种常见类型："],"q":"(八)借代用与本体相关的事物(代体)来指称本体，这种辞格叫借代。借代有以下六种常见类型：","w":"normal","e":["原书正文"]},{"t":"【原文】(1)门卫说：“两天前，","y":"教材原文","p":["(1)门卫说：“两天前，老王家来了一个光头青年，昨天傍晚，我看见光头急匆匆地背包走了"],"q":"(1)门卫说：“两天前，老王家来了一个光头青年，昨天傍晚，我看见光头急匆匆地背包走了。”","w":"normal","e":["原书正文"]},{"t":"【原文】(2)为了两国尽早恢复外","y":"教材原文","p":["(2)为了两国尽早恢复外交关系，北京和华盛顿都秘密地有了惊人的举动"],"q":"(2)为了两国尽早恢复外交关系，北京和华盛顿都秘密地有了惊人的举动。","w":"normal","e":["原书正文"]},{"t":"【原文】“北京”与“华盛顿”分别","y":"教材原文","p":["“北京”与“华盛顿”分别是中国和美国的首都，这里用来指称两个国家"],"q":"“北京”与“华盛顿”分别是中国和美国的首都，这里用来指称两个国家。","w":"normal","e":["原书正文"]}]},{"id":"xdhy_down-c02-s05","t":"第五节 语言要素的修辞","w":"high","n":16,"k":[{"t":"修辞","y":"名词解释","p":["修辞是为增强语用表达效果对语言要素进行的选择、加工和调整","修辞是交际过程中有效运用语言要素的一种语用策略","注重语音、词语、语法三要素的巧妙配合"],"q":"修辞，是指为了增强语用表达效果，对语言要素进行的选择、加工和调整。修辞是交际过程中有效地运用语言要素的一种语用策略。","w":"high","e":["2018 真题","2020 真题","2022 真题"]},{"t":"押韵","y":"名词解释","p":["押韵以句子为节奏单位","押韵不要求韵母完全相同，通常只是韵腹或韵腹韵尾相同","押韵方式有偶韵、奇韵、排韵、随韵、交韵等"],"q":"押韵以句子为节奏单位，这就大大扩展了节奏感在营造语言音乐美的过程中的作用。押韵并不一定要求韵母完全相同，通常只是韵腹或韵腹韵尾相同。","w":"high","e":["2019 真题"]},{"t":"紧凑句","y":"名词解释","p":["一群句子受到某种结构关系的严密控制，或彼此结构方式相同或相近，关系紧密","这样的一群句子就是紧凑句","所有的紧缩复句其实是一种关系更为密切的紧凑句"],"q":"一群句子，如果受到了某种结构关系的严密控制，或者彼此之间的结构方式相同或相近，从而给人一种关系紧密的感觉，这样的一群句子就是紧凑句；相反则是松缓句。","w":"high","e":["2021 真题"]},{"t":"文化含义","y":"名词解释","p":["词在反映所指对象时还会蕴含相应的传统观念、文化心态甚至于社会偏见","形成了这个词的文化含义","了解词的文化含义必须把词语意义放在整个社会的文化大背景中去考察"],"q":"词在反映所指对象时还会蕴含相应的传统观念、文化心态甚至于社会偏见，形成了这个词的文化含义。","w":"high","e":["2021 真题"]},{"t":"联想意义","y":"名词解释","p":["词语以语言意义为基础，在具体语境中表现出相关的语义内容产生联想意义","分为时代的联想意义、地域的联想意义、社群的联想意义、语体的联想意义"],"q":"话语交际中的词语以语言意义为基础，在具体语境中表现出相关的语义内容，于是产生了联想意义。","w":"high","e":["2019 真题"]},{"t":"形象意义","y":"名词解释","p":["词与词在形象的表现功能上是有极大差异的","表象功能是通过词义与所指对象之间的联系而实现的","构词语素的不同会造成形象意义的强弱和性质差异"],"q":"词与词在形象的表现功能上是有极大差异的，它们的表象功能是通过词义与所指对象之间的联系而实现的。","w":"high","e":["2020 真题"]},{"t":"语用语序的变化","y":"名词解释","p":["语用语序变化后词语所处的位置不是正常的，能产生特殊的修辞效果","一是强调后移成分，多见于书面语","二是强调前移成分，多见于口语","语法关系没有变化，主语还是主语，宾语还是宾语"],"q":"语用语序的变化，最大的特点就在于变化后词语所处的位置不是正常的，正因为它不正常，就能产生特殊的修辞效果。","w":"high","e":["2021 真题"]},{"t":"试述简单句与复杂句的修辞效果差异。","y":"名词解释","p":["句子从简单变复杂有三个途径：添枝加叶、局部发达、前后衔接","复杂句的修辞效果是严谨缜密，一气呵成","论证辩驳中气势逼人，叙述描写中细致绵密","简单句的效果是轻松随意，活泼自如","复杂句多见于书面语，简单句多见于口语"],"q":"如果一个句子从简单变得复杂，主要有三个途径：添枝加叶，局部发达，前后衔接。如果有某种比较复杂的内容要表达，可以尽量把它压缩在一个句子中，这时不仅需要利用每一种句子成分，而且每一个句子成分都必须承载相当多的语义分量，这时句子的结构就可能会很复杂。复杂句的修辞效果是严谨缜密，一气呵成，用在论证辩驳中则气","w":"high","e":["2019 真题","2022 真题"]},{"t":"【原文】“我是想带你去玩","y":"教材原文","p":["“我是想带你去玩","我答应过带你玩一次，我说到得做到"],"q":"“我是想带你去玩。我答应过带你玩一次，我说到得做到。”","w":"normal","e":["原书正文"]},{"t":"【原文】128第五章 语用“我无","y":"教材原文","p":["128第五章 语用“我无所谓，星期天待家里也可以，不一定非去，真的"],"q":"128第五章 语用“我无所谓，星期天待家里也可以，不一定非去，真的。”","w":"normal","e":["原书正文"]},{"t":"【原文】现从文字看来，似乎凌乱无","y":"教材原文","p":["现从文字看来，似乎凌乱无序，但在现场，因为是家庭成员之间面对面的谈话，有语境知识、具体的眼神、手势等辅助，双方理解上没有问题，因此，句法成分的完备、结构的完整、正常的语序等就不再成为最重要的条件"],"q":"现从文字看来，似乎凌乱无序，但在现场，因为是家庭成员之间面对面的谈话，有语境知识、具体的眼神、手势等辅助，双方理解上没有问题，因此，句法成分的完备、结构的完整、正常的语序等就不再成为最重要的条件。","w":"normal","e":["原书正文"]},{"t":"【原文】5.极富生活化的修辞格式","y":"教材原文","p":["5.极富生活化的修辞格式口语语体中，运用得较多的辞格是：比喻、比拟、借代、双关、反语、夸张、排比、反复等","所运用的材料也具有鲜明的生活气息，表现出人们日常交际的鲜活、灵动"],"q":"5.极富生活化的修辞格式口语语体中，运用得较多的辞格是：比喻、比拟、借代、双关、反语、夸张、排比、反复等；所运用的材料也具有鲜明的生活气息，表现出人们日常交际的鲜活、灵动。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】(5)儿子：妈，您往后别","y":"教材原文","p":["(5)儿子：妈，您往后别再烦我这事儿了，瞧您上次给我找的媳妇，整个一个冬瓜"],"q":"(5)儿子：妈，您往后别再烦我这事儿了，瞧您上次给我找的媳妇，整个一个冬瓜！","w":"normal","e":["原书正文"]},{"t":"【原文】妈妈：别瞎编排小胡姑娘，","y":"教材原文","p":["妈妈：别瞎编排小胡姑娘，看看你自己，三十好几的人了，像个抽飞了的陀螺，整天乱转"],"q":"妈妈：别瞎编排小胡姑娘，看看你自己，三十好几的人了，像个抽飞了的陀螺，整天乱转！","w":"normal","e":["原书正文"]},{"t":"【原文】6.游离的话题中心、随机","y":"教材原文","p":["6.游离的话题中心、随机不定的话轮转换跟书面语体相比，口语语体话题中心和主题转换也常常出现较大的随机性和不可预测性，即使是事前有准备的交际，例如较为正式的谈判、交流，都难以确保在交际现场彼此按照同一个话题展开","这一特点在没有经过预先设计的日常谈话中表现得最为突出，因此，口语语体的话语结构在话题中心上游离涣散，在话题转化形式上随机不定"],"q":"6.游离的话题中心、随机不定的话轮转换跟书面语体相比，口语语体话题中心和主题转换也常常出现较大的随机性和不可预测性，即使是事前有准备的交际，例如较为正式的谈判、交流，都难以确保在交际现场彼此按照同一个话题展开。这一特点在没有经过预先设计的日常谈话中表现得最为突出，因此，口语语体的话语结构在话题中心上游离涣散，在话题转化形式上随机不定。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】(6)李：老张，这两天怎","y":"教材原文","p":["(6)李：老张，这两天怎么没来听戏呀?张：别提了，来不了哇"],"q":"(6)李：老张，这两天怎么没来听戏呀?张：别提了，来不了哇。","w":"normal","e":["原书正文"]}]},{"id":"xdhy_down-c02-s06","t":"第六节 语用效果与辞格","w":"high","n":26,"k":[{"t":"辞格","y":"名词解释","p":["辞格是为了达到某种语用效果而有意识地突破语言组合常规、进行超常搭配的特定格式","是言语行为中对语言规则或语用规则进行有效偏离的特定格式","分两大类：语义内容的超常表达、结构形式的偏离表达"],"q":"为了达到某种语用效果，人们通常在语言交际中有意识地突破语言组合的常规，进行超常的搭配，以达到特定的修辞效果。这种在言语行为中对语言规则或语用规则进行有效偏离的特定格式，就是辞格。","w":"high","e":["2018 真题","2020 真题","2022 真题"]},{"t":"比喻","y":"名词解释","p":["用与本体本质不同但有相似性的喻体来描写或说明本体","比喻由四个要素构成：本体、喻体、喻词、相似点","分为明喻、暗喻和借喻三种类型"],"q":"用与本体(甲)本质不同但有相似性的喻体(乙)来描写或说明本体，这种辞格叫比喻。","w":"high","e":["2018 真题","2020 真题","2023 真题"]},{"t":"比拟","y":"名词解释","p":["运用联想，直接将本体当作拟体进行描写或说明","比拟包含三个要素：本体、拟体、拟词","比拟只出现本体和拟词，拟体并不出现","分为拟人和拟物两类"],"q":"运用联想，直接将本体当作拟体进行描写或说明，这种辞格叫比拟。","w":"high","e":["2018 真题","2021 真题"]},{"t":"移就","y":"名词解释","p":["将本不能描写甲事物的词语描写甲，构成修饰语与中心语的偏正关系","语义上却是描写与甲相关的人或事","分为移情式和移觉式两类"],"q":"将本不能描写甲事物的词语描写甲，构成修饰语与中心语的偏正关系，但在语义上却是描写与甲相关的人或事，这种辞格叫移就。","w":"high","e":["2019 真题"]},{"t":"拈连","y":"名词解释","p":["将用于甲事物的词语顺势搭配到乙事物上","产生两个相关联的陈述或描写结构","分为完整式和缺省式两类"],"q":"将用于甲事物的词语顺势搭配到乙事物上，产生两个相关联的陈述或描写结构，这样的辞格叫拈连。","w":"high","e":["2020 真题"]},{"t":"夸张","y":"名词解释","p":["故意对事物或属性的范围、数量、程度等方面进行超出或缩小等的描述","分为扩大夸张和缩小夸张两类"],"q":"故意对事物或属性的范围、数量、程度等方面进行超出或者缩小等的描述，这种辞格叫夸张。","w":"high","e":["2019 真题"]},{"t":"双关","y":"名词解释","p":["在特定语境中利用语言要素使同一语句具有“语内”和“语外”两层意义","分为谐音式、语义式、对象式三类"],"q":"在特定的语境中，利用语言要素，使同一语句具有“语内”和“语外”两层意义，这种辞格叫双关。","w":"high","e":["2018 真题","2021 真题"]},{"t":"反语","y":"名词解释","p":["故意使用相反的词句来表达真正意思","也叫反话","分为讽刺反语和风趣反语两类"],"q":"故意使用相反的词句来表达真正意思，这样的辞格叫反语，也叫反话。","w":"high","e":["2020 真题"]},{"t":"借代","y":"名词解释","p":["用与本体相关的事物(代体)来指称本体","有六种常见类型：特征借代、成分借代、地名借代、作者借代、品牌借代、材料借代"],"q":"用与本体相关的事物(代体)来指称本体，这种辞格叫借代。","w":"high","e":["2019 真题","2022 真题"]},{"t":"对偶","y":"名词解释","p":["将字数相等、结构相同或相似、意义相关的两个句子或短语并举","有严式与宽式的区别","从内容上分为正对、反对、串对三类"],"q":"将字数相等、结构相同或相似、意义相关的两个句子(或短语)并举，这种辞格叫对偶。","w":"high","e":["2018 真题","2021 真题"]},{"t":"排比","y":"名词解释","p":["用三个以上字数大体相等、结构相似、语气一致的短语或句子排列起来","分为平排和递排两类"],"q":"用三个以上字数大体相等、结构相似、语气一致的短语或句子排列起来，这种辞格叫排比。","w":"high","e":["2019 真题","2022 真题"]},{"t":"顶真","y":"名词解释","p":["前一个句子的结尾部分作后一个句子的开头","使相邻的两个句子头尾蝉联，前后串联","也称顶针、联珠","分为词和短语顶真、句子顶真两类"],"q":"前一个句子的结尾部分作后一个句子的开头，使相邻的两个句子头尾蝉联，前后串联，这种辞格叫顶真，也称顶针、联珠。","w":"high","e":["2020 真题"]},{"t":"回环","y":"名词解释","p":["前一个句子或句子的一部分次序颠倒，形成第二个句子","使前后两个句子内容循环往复，紧密相关","结构式是：甲+乙→乙+甲","分为严式回环和宽式回环"],"q":"前一个句子或句子的一部分次序颠倒，形成第二个句子，使前后两个句子内容循环往复，紧密相关。这种辞格叫回环。回环的结构式是：甲+乙→乙+甲。","w":"high","e":["2019 真题"]},{"t":"反复","y":"名词解释","p":["同一个词语或句子使用两次以上","对同一语义的强化表达，以宣泄特定的感情、思想","分为连续反复和间隔反复两类"],"q":"同一个词语或句子使用两次以上，这种辞格叫反复。对同一语义的强化表达，以宣泄特定的感情、思想。","w":"high","e":["2021 真题"]},{"t":"辞格连用","y":"名词解释","p":["在一句话内，一个或几个辞格前后连续性地出现","分为同格连用和异格连用两类"],"q":"在一句话内，一个或几个辞格前后连续性地出现，叫辞格的连用。它可以分为两类：同格连用和异格连用。","w":"high","e":["2019 真题"]},{"t":"辞格兼用","y":"名词解释","p":["两种或者两种以上的辞格融合到一起","如比拟和比喻融合、夸张和比喻融合"],"q":"两种或者两种以上的辞格融合到一起，这种现象叫辞格的兼用。","w":"high","e":["2020 真题"]},{"t":"辞格套用","y":"名词解释","p":["一个辞格中包含着另一个或多个其他的辞格","如对偶包含比喻、排比包含比喻"],"q":"一个辞格中包含着另一个或多个其他的辞格，这种现象叫辞格的套用。","w":"high","e":["2021 真题"]},{"t":"辨析比喻中的“明喻”“暗喻”和“借喻”。","y":"名词解释","p":["明喻：甲像乙，有比喻词联结","暗喻：甲是乙，用“是”“成为”等动词联结","借喻：不出现本体和喻词，直接用喻体替代本体"],"q":"明喻是直接明白地用喻体来描写或说明本体，有“像”“似”“如”“宛如”“宛然”“仿佛”“一般”等比喻词来联结本体和喻体，典型结构式是：甲像乙。暗喻是直接将本体等同于喻体，常用“是”“成为”“成了”“等于”等动词联结本体和喻体，典型结构式是：甲是乙。借喻是不出现本体和喻词，直接用喻体替代本体来描写或说明","w":"high","e":["2020 真题","2023 真题"]},{"t":"【原文】A句不符合把字句对谓语部","y":"教材原文","p":["A句不符合把字句对谓语部分必须是复杂的基本要求","如果改成B句，虽然通顺了，但由于改成了主动句，结构发生了变化，处置义也没有了，正确的改法应该是C句"],"q":"A句不符合把字句对谓语部分必须是复杂的基本要求；如果改成B句，虽然通顺了，但由于改成了主动句，结构发生了变化，处置义也没有了，正确的改法应该是C句。","w":"normal","e":["原书正文"]},{"t":"【原文】(6)﹡A在改善学生生活","y":"教材原文","p":["(6)﹡A在改善学生生活上，我们学校采取了一些措施"],"q":"(6)﹡A在改善学生生活上，我们学校采取了一些措施。","w":"normal","e":["原书正文"]},{"t":"【原文】?B关于/对于改善学生的","y":"教材原文","p":["?B关于/对于改善学生的生活，我们学校采取了一些措施"],"q":"?B关于/对于改善学生的生活，我们学校采取了一些措施。","w":"normal","e":["原书正文"]},{"t":"【原文】C在改善学生生活的问题上","y":"教材原文","p":["C在改善学生生活的问题上/方面，我们学校采取了一些措施"],"q":"C在改善学生生活的问题上/方面，我们学校采取了一些措施。","w":"normal","e":["原书正文"]},{"t":"【原文】A句的毛病是介词结构中不","y":"教材原文","p":["A句的毛病是介词结构中不能出现动词性短语，如果改成B句，由于以“关于/对于⋯⋯”取代“在⋯⋯上”的结构，就意味着以“关涉义”或“对象义”取代了“方面义”，即不忠于原意","正确的改法应该是C句"],"q":"A句的毛病是介词结构中不能出现动词性短语，如果改成B句，由于以“关于/对于⋯⋯”取代“在⋯⋯上”的结构，就意味着以“关涉义”或“对象义”取代了“方面义”，即不忠于原意。正确的改法应该是C句。","w":"normal","e":["原书正文"]},{"t":"【原文】4.修改跟造成病句的原因","y":"教材原文","p":["4.修改跟造成病句的原因保持一致的原则病句错误的原因，有时候可以有几种不同的角度来分析"],"q":"4.修改跟造成病句的原因保持一致的原则病句错误的原因，有时候可以有几种不同的角度来分析。例如：","w":"normal","e":["原书正文"]},{"t":"【原文】*(7)在改革开放的形势","y":"教材原文","p":["*(7)在改革开放的形势下，对我们的教育质量提出了更高的要求"],"q":"*(7)在改革开放的形势下，对我们的教育质量提出了更高的要求。","w":"normal","e":["原书正文"]},{"t":"【原文】*(8)这些角色不同类型","y":"教材原文","p":["*(8)这些角色不同类型，如果没有善于塑造人物性格的技巧是演不好的"],"q":"*(8)这些角色不同类型，如果没有善于塑造人物性格的技巧是演不好的。","w":"normal","e":["原书正文"]}]},{"id":"xdhy_down-c02-s07","t":"第七节 语体的分类与功能","w":"high","n":19,"k":[{"t":"语体","y":"名词解释","p":["语体是语言在长期使用过程中形成的语言表达体系","为适应不同的交际语境的需要（内容、目的、对象、场合、方式等）","具有不同风格特点","通常分为口语语体和书面语体"],"q":"语体是语言在长期的使用过程中，为适应不同的交际语境的需要(内容、目的、对象、场合、方式等)而形成的具有不同风格特点的语言表达体系。","w":"high","e":["2018 真题","2020 真题","2022 真题"]},{"t":"文艺语体","y":"名词解释","p":["文艺语体是以语言文字为工具、形象化地反映客观现实的话语表达体系","也称文学语体、艺术语体","通过作者情感直接或间接的表达，感染受话者引起共鸣","有六个主要特征：韵律美、强调色彩形象、句式活泼、语言规则变异、大量使用辞格、话题中心含蓄"],"q":"文艺语体是以语言文字为工具，形象化地反映客观现实的话语表达体系，也称为“文学语体”“艺术语体”。","w":"high","e":["2019 真题","2022 真题"]},{"t":"网络语体","y":"名词解释","p":["网络语体是利用互联网即时通讯工具和社交平台进行交际而形成的话语表达体系","兼有口语语体和书面语体的特点","具有视觉性、即时性和非当面性等特征","体现网络用户崇尚个性、追求新奇、戏谑娱乐、热衷模仿等社交心态"],"q":"网络语体，指的是利用互联网即时通讯工具和社交平台进行交际而形成的话语表达体系。","w":"high","e":["2020 真题","2023 真题"]},{"t":"网络流行体","y":"名词解释","p":["网络流行体是在网络交际中快速传播、具有一定时效性的文本模块","通常根据其特征被称为“体”","起源于文学作品、影视节目、社会事件、网民原创等","篇幅短小，格式固定，内容新颖，易于复制"],"q":"网络流行体指的是在网络交际中快速传播，具有一定时效性的文本模块，通常根据其特征被称为“体”。","w":"high","e":["2020 真题"]},{"t":"公文事务语体","y":"名词解释","p":["公文事务语体是在社会公众语境中关涉公务或行政管理主题的话语表达体系","又称公文体","只能是书面语体","有四个特点：书面语色彩浓厚、用词客观准确、以陈述句和祈使句为主、固定的行文格式"],"q":"公文事务语体，是指在社会公众语境中关涉公务或行政管理主题的话语表达体系，又称公文体。","w":"high","e":["2020 真题"]},{"t":"科学技术语体","y":"名词解释","p":["科学技术语体是关涉科学研究、教育等主题进行交际所形成的话语表达体系","又称科技体、智慧体或知识体","特点包括特殊符号、专业术语外来语、结构紧凑多用复句、风格平实朴素"],"q":"科学技术语体，指关涉科学研究、教育等主题进行交际所形成的话语表达体系。科学技术语体又称科技体、智慧体或知识体。","w":"high","e":["2019 真题"]},{"t":"正式演说语体","y":"名词解释","p":["演说语体是说明事理、表明自己观点的话语表达体系","有鲜明的话题中心","句式简短，表情色彩强烈"],"q":"演说语体指的是说明事理，表明自己观点的话语表达体系。它句式简短，表情色彩强烈，普遍使用具有表情色彩和描绘色彩的词句。","w":"high","e":["2019 真题"]},{"t":"大众传播语体","y":"名词解释","p":["大众传播语体是在公众生活语境中关涉大众和社会生活主题的话语表达体系","带有明显的公众性和有备性","语言表达上有倾向性和感染力"],"q":"大众传播语体，是指在公众生活语境中关涉大众和社会生活主题的话语表达体系。","w":"high","e":["2020 真题"]},{"t":"日常谈话语体","y":"名词解释","p":["谈话语体是人们日常交谈活动的话语表达体系","对语言环境的依赖性强","经常使用省略形式，句子比较简短","语音上常夹杂超语言的剩余部分，允许音变"],"q":"谈话语体指的是人们日常交谈活动的话语表达体系，所用词语极为丰富。","w":"high","e":["2019 真题"]},{"t":"口语语体等于口语，书面语体等于书面语。","y":"名词解释","p":["口语语体不等于口语，书面语体不等于书面语","划分主要根据是语言符号组织构成的系统特征","而不是根据语音/文字的传递方式"],"q":"错误。口语语体不等于口语(口头表达)，书面语体也不等于书面语(文字表达)。口语语体和书面语体划分主要根据，是语言符号组织构成的系统特征，而不是根据语音/文字的传递方式。书面语体可用口头语音表达，口语语体也可以用文字写出。","w":"high","e":["2019 真题","2022 真题"]},{"t":"网络语体兼有口语语体和书面语体的特点。","y":"名词解释","p":["网络语体兼有口语语体和书面语体的特点","具有视觉性、即时性和非当面性等特征"],"q":"正确。网络语体兼有口语语体和书面语体的特点，具有视觉性、即时性和非当面性等特征。","w":"high","e":["2021 真题"]},{"t":"【原文】例(11)定语“三岁”是","y":"教材原文","p":["例(11)定语“三岁”是限定“长子小李”的，全句应改为“黑李三岁的长子小李已经病了三天了”","例(12)定语“有效”是修饰“方法”的，全句应改为“批评和自我批评是改正错误提高思想水平的有效方法”"],"q":"例(11)定语“三岁”是限定“长子小李”的，全句应改为“黑李三岁的长子小李已经病了三天了”。例(12)定语“有效”是修饰“方法”的，全句应改为“批评和自我批评是改正错误提高思想水平的有效方法”。","w":"normal","e":["原书正文"]},{"t":"【原文】7.多层状语语序混乱*(","y":"教材原文","p":["7.多层状语语序混乱*(13)我把张老先生家里珍藏的古书几次借来看"],"q":"7.多层状语语序混乱*(13)我把张老先生家里珍藏的古书几次借来看。","w":"normal","e":["原书正文"]},{"t":"【原文】*(14)妈妈亲切地走到","y":"教材原文","p":["*(14)妈妈亲切地走到我跟前，对我说：“学习是长期的，不能搞突击，要妥善安排好时间"],"q":"*(14)妈妈亲切地走到我跟前，对我说：“学习是长期的，不能搞突击，要妥善安排好时间。”","w":"normal","e":["原书正文"]},{"t":"【原文】例(13)对象状语要求紧","y":"教材原文","p":["例(13)对象状语要求紧挨着谓语中心语，应改为“我几次把张老先生家里珍藏的古书借来看”","例(14)“亲切”是修饰“说”的，应改为“妈妈走到我跟前，亲切地对我说……”"],"q":"例(13)对象状语要求紧挨着谓语中心语，应改为“我几次把张老先生家里珍藏的古书借来看”。例(14)“亲切”是修饰“说”的，应改为“妈妈走到我跟前，亲切地对我说……”。","w":"normal","e":["原书正文"]},{"t":"【原文】五、复句常见病句及其修改","y":"教材原文","p":["五、复句常见病句及其修改复句常见的病句类型，跟单句有所不同","主要发生在分句间意义上缺乏联系，分句间次序层次混乱以及关联词语使用不当这三个方面"],"q":"五、复句常见病句及其修改复句常见的病句类型，跟单句有所不同。主要发生在分句间意义上缺乏联系，分句间次序层次混乱以及关联词语使用不当这三个方面。","w":"normal","e":["原书正文"]},{"t":"【原文】1.分句间意义缺乏照应*","y":"教材原文","p":["1.分句间意义缺乏照应*(1)我沿着小路走着，两旁是一片绿油油的麦田，春风吹来，是一丛丛五颜六色的野花"],"q":"1.分句间意义缺乏照应*(1)我沿着小路走着，两旁是一片绿油油的麦田，春风吹来，是一丛丛五颜六色的野花。","w":"normal","e":["原书正文"]},{"t":"【原文】*(2)中国人民是勤劳勇","y":"教材原文","p":["*(2)中国人民是勤劳勇敢的，中国人民决心发展同世界各国人民之间的友谊"],"q":"*(2)中国人民是勤劳勇敢的，中国人民决心发展同世界各国人民之间的友谊。","w":"normal","e":["原书正文"]},{"t":"【原文】例(1)第三分句“春风吹","y":"教材原文","p":["例(1)第三分句“春风吹来”与第四分句“是一丛丛五颜六色的野花”，缺乏意义联系","可调整为“我迎着春风，沿着小路走着，路的两旁是一丛丛五颜六色的野花和一片绿油油的麦田”","例(2)第一和第二分句意义上互不相关，应改为“中国人民是勤劳勇敢的，中国人民是热爱和平，中国人民决心发展同世界各国人民之间的友谊”"],"q":"例(1)第三分句“春风吹来”与第四分句“是一丛丛五颜六色的野花”，缺乏意义联系。可调整为“我迎着春风，沿着小路走着，路的两旁是一丛丛五颜六色的野花和一片绿油油的麦田”。例(2)第一和第二分句意义上互不相关，应改为“中国人民是勤劳勇敢的，中国人民是热爱和平，中国人民决心发展同世界各国人民之间的友谊”。","w":"normal","e":["原书正文"]}]},{"id":"xdhy_down-c02-s08","t":"第八节 病句的类型与修改","w":"high","n":19,"k":[{"t":"病句","y":"名词解释","p":["病句指不合规范的句子","规范包括三个方面：符合语法组合规则、符合语义搭配要求、符合语用表达习惯","产生病句的原因可能涉及语法、语义和语用多个层面"],"q":"所谓病句，就是指不合规范的句子；所谓规范，一是要符合语法组合规则，二是要符合语义的搭配要求，三是要符合语用的表达习惯。","w":"high","e":["2019 真题","2022 真题"]},{"t":"紧缩法","y":"名词解释","p":["紧缩法是先检查句子的“主干”再检查句子“枝叶”的一种方法","首先检查主语中心、谓语中心、宾语中心之间能否搭配、有无残缺或多余","再检查定语、状语或补语与其中心语等能否搭配"],"q":"紧缩法是先检查句子的“主干”再检查句子“枝叶”的一种方法。其步骤是首先检查主语(中心)、谓语(中心)、宾语(中心)之间能否搭配、有无残缺或多余等。","w":"high","e":["2020 真题","2022 真题"]},{"t":"类比法","y":"名词解释","p":["类比法是造出一些相类似的格式来同原句比较、以判断原句正误的方法"],"q":"类比法是造出一些相类似的格式来同原句比较，以判断原句正误的一种方法。","w":"high","e":["2019 真题","2021 真题"]},{"t":"成分残缺","y":"名词解释","p":["成分残缺指不符合隐含、省略的条件而缺少应有的句法成分","出现一个成分，与之匹配的另一个成分就必须出现","包括主语残缺、谓语残缺、宾语残缺、修饰语残缺、补语残缺"],"q":"句法成分残缺，是指不符合隐含、省略的条件而缺少应有的句法成分。","w":"high","e":["2020 真题"]},{"t":"结构杂糅","y":"名词解释","p":["结构杂糅指把两种不同的说法硬凑在一起，把两种不同的结构套叠在一起","造成结构不合法则，语义混乱费解","包括格式套叠和句式杂糅两类"],"q":"所谓的句法结构杂糅，是指把两种不同的说法硬凑在一起，把两种不同的结构套叠在一起，以致造成结构不合法则，语义混乱费解。","w":"high","e":["2019 真题"]},{"t":"搭配不当","y":"名词解释","p":["搭配不当指相互搭配的成分在语义上不能贯通","涉及主语与谓语、述语与宾语、述语和补语、修饰语与中心语","语法上合法并不一定语义上能搭配"],"q":"所谓的搭配不当，通常情况下，是指这些相互搭配的成分在语义上不能贯通。","w":"high","e":["2019 真题","2021 真题"]},{"t":"成分多余","y":"名词解释","p":["成分多余指句子中语义相同的成分重复出现或出现了不应该出现的成分","造成语义啰唆甚至不合逻辑","包括主语多余、谓语多余、宾语多余、修饰语多余、补语多余"],"q":"所谓的成分多余，是指句子中的语义相同的成分重复出现，或者出现了不应该出现的成分，以致造成语义啰唆甚至不合逻辑。","w":"high","e":["2019 真题"]},{"t":"语序有误","y":"名词解释","p":["语序有误指一些句子成分倒置了应有的语序","造成语义模糊或不合逻辑","包括定心错位、定状错置、状补错置、状语错位、误补为定、多层定语/状语语序混乱"],"q":"所谓的语序有误，是指一些句子成分倒置了应有的语序，以致造成语义模糊或不合逻辑。","w":"high","e":["2020 真题"]},{"t":"词性不对","y":"名词解释","p":["词性不对指在某个句法位置上应该出现这类词却用了另外一类词","属于语法病句类型之一"],"q":"词性不对是指在某个句法位置上应该出现这类词，却用了另外一类词。","w":"high","e":["2020 真题"]},{"t":"从简不从繁的原则","y":"名词解释","p":["从简不从繁指在修改病句时以改动最少为准则","只需调动语序的就不随意加减词语","只需加减一个词语的就不加减两个词语"],"q":"所谓从简不从繁，就是指在修改病句时，以改动最少为准则。凡是只需要调动语序的就不随意加减词语，凡是只需要加减一个词语的，就不加减两个词语。","w":"high","e":["2019 真题"]},{"t":"试述修改病句的四条原则及其相互关系。","y":"名词解释","p":["忠于原意的原则","从简不从繁的原则","尽量维持原句结构的原则","修改跟造成病句的原因保持一致的原则","四原则是以“忠于原意”为根本的有机整体，违背一个往往也违背其他三个"],"q":"修改病句有四原则：1.忠于原意的原则，就是修改后的病句，应该尽量保持句子原来的意义。2.从简不从繁的原则，指在修改病句时以改动最少为准则，凡是只需要调动语序的就不随意加减词语，凡是只需要加减一个词语的，就不加减两个词语。3.尽量维持原句结构的原则，指在修改病句中，不调整原句语法结构就足以把句子改通顺","w":"high","e":["2018 真题","2020 真题","2022 真题"]},{"t":"【原文】1.以学生的需要为第一宗","y":"教材原文","p":["1.以学生的需要为第一宗旨","学生们不只是需要熟悉有关现代汉语的基本概念、基本知识、基本理论，关键是能够掌握分析乃至研究的方法，对现代汉语种种语言现象能够熟练地加以观察、分析与运用，这将有"],"q":"1.以学生的需要为第一宗旨。学生们不只是需要熟悉有关现代汉语的基本概念、基本知识、基本理论，关键是能够掌握分析乃至研究的方法，对现代汉语种种语言现象能够熟练地加以观察、分析与运用，这将有","w":"normal","e":["原书正文"]},{"t":"【原文】第三版 后记147助于学","y":"教材原文","p":["第三版 后记147助于学生们加强语言的理解能力与表达能力，表现为语言能力综合素质的提高"],"q":"第三版 后记147助于学生们加强语言的理解能力与表达能力，表现为语言能力综合素质的提高。","w":"normal","e":["原书正文"]},{"t":"【原文】2.与时俱进，继续吸收最","y":"教材原文","p":["2.与时俱进，继续吸收最新的比较成熟的研究成果","比如跟构式理论有关的框式结构分析、认知解释与动态变化","比如语音的节律变化、汉字规范的最新标准、繁简字的比较","比如港澳台社区词的对比、口语习用语"],"q":"2.与时俱进，继续吸收最新的比较成熟的研究成果。比如跟构式理论有关的框式结构分析、认知解释与动态变化。比如语音的节律变化、汉字规范的最新标准、繁简字的比较。比如港澳台社区词的对比、口语习用语。尤其是词汇、语用部分进行了全面改写，面貌为之一新，更适应教学的需要。","w":"normal","e":["原书正文"]},{"t":"【原文】3.加强练习题与思考题的","y":"教材原文","p":["3.加强练习题与思考题的现实性、趣味性与启发性","增添、删节、替换了部分习题"],"q":"3.加强练习题与思考题的现实性、趣味性与启发性。增添、删节、替换了部分习题。","w":"normal","e":["原书正文"]},{"t":"【原文】4.文字力求准确、简洁、","y":"教材原文","p":["4.文字力求准确、简洁、明快、生动、有趣","消除硬伤，包括错字、别字、漏字以及含糊不清模棱两可的词句","压缩章节，比如语法原来14节，现改为12节","总字数适当削减，删除部分比较繁杂的讲解文字，部分比较重要但是难度较大的内容将移到《现代汉语通论教学参考》里"],"q":"4.文字力求准确、简洁、明快、生动、有趣。消除硬伤，包括错字、别字、漏字以及含糊不清模棱两可的词句。压缩章节，比如语法原来14节，现改为12节。总字数适当削减，删除部分比较繁杂的讲解文字，部分比较重要但是难度较大的内容将移到《现代汉语通论教学参考》里。","w":"normal","e":["原书正文"]},{"t":"【原文】5.全面增订《现代汉语通","y":"教材原文","p":["5.全面增订《现代汉语通论教学参考》(预计2017年出第三版)，包括练习题参考答案等资料"],"q":"5.全面增订《现代汉语通论教学参考》(预计2017年出第三版)，包括练习题参考答案等资料。","w":"normal","e":["原书正文"]},{"t":"【原文】6.为了确保我们的教材继","y":"教材原文","p":["6.为了确保我们的教材继承性，第二版的编者原则上全部保留，只是郭熙教授由于担任更为重要的领导职务，主动辞去第三版的修订工作，改为由在教学第一线的赵春利教授负责词汇的修订","对两位教授的合作我们表示诚挚的感谢"],"q":"6.为了确保我们的教材继承性，第二版的编者原则上全部保留，只是郭熙教授由于担任更为重要的领导职务，主动辞去第三版的修订工作，改为由在教学第一线的赵春利教授负责词汇的修订
