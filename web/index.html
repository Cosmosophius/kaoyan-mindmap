,"e":["2020 真题"]},{"t":"比喻由哪四个要素构成？根据表达形式特征可以分为哪几种类型？","y":"简答题","p":["四个要素：本体、喻体、喻词、相似点","相似点是比喻形成的关键要素","根据表达形式特征分为明喻、暗喻、借喻三种"],"q":"从结构上说，比喻应由四个要素构成：本体、喻体、喻词、相似点。本体是被描写或说明的对象，喻体是用来作比的对象，喻词是用来联结本体和喻体的词语，本体与喻体应有相似点————相似点是比喻形成的关键要素。","w":"high","e":["2019 真题","2022 真题"]},{"t":"“史学家是凸面镜……史剧家是凹面镜……”用对偶包含了比喻，属于辞格的套用。","y":"判断题","p":["对偶包含比喻属于辞格的套用","清晰形象地描画出史学家与史剧家的不同特征"],"q":"例(1)用对偶包含比喻，清晰而又形象地描画出史学家与史剧家的不同特征。","w":"high","e":["2019 真题"]},{"t":"请指出下面句子所用的辞格并说明其修辞作用：“夕阳映照下的西湖湖面上洒满了碎银，波光粼粼，熠熠生辉。”","y":"分析题","p":["使用了借喻","“碎银”是喻体，直接替代了没有出现的本体","借喻不出现本体和喻词","典型结构式为乙代替甲"],"q":"例(9)“碎银”和例(10)的“大疙瘩”都是喻体，直接替代了没有出现的本体。","w":"high","e":["2020 真题"]},{"t":"请分析下面话语综合使用了什么辞格及其特点：“人生有限，知识无穷。当你用汗水敬献她的时候，她和你携手前进；当你用懒惰讨好她的时候，她和你分道扬镳。”","y":"分析题","p":["综合使用了对偶、比拟和借代","前后两个对偶连用","后一个对偶套用，包含着比拟兼借代","比拟和借代是兼用"],"q":"例(3)综合使用了对偶、比拟和借代。前后两个对偶连用；后一个对偶套用————包含着比拟兼借代，而比拟和借代是兼用。","w":"high","e":["2021 真题"]}]},{"id":"xdhy_down-c02-s07","t":"第七节 语体的分类与功能","w":"high","n":18,"k":[{"t":"语体","y":"名词解释","p":["语体是语言在长期使用过程中形成的语言表达体系","为适应不同的交际语境的需要（内容、目的、对象、场合、方式等）","具有不同风格特点","通常分为口语语体和书面语体"],"q":"语体是语言在长期的使用过程中，为适应不同的交际语境的需要(内容、目的、对象、场合、方式等)而形成的具有不同风格特点的语言表达体系。通常分为口语语体和书面语体。","w":"high","e":["2018 真题","2020 真题","2022 真题"]},{"t":"文艺语体","y":"名词解释","p":["文艺语体是以语言文字为工具、形象化地反映客观现实的话语表达体系","也称文学语体、艺术语体","通过作者情感直接或间接的表达，感染受话者引起共鸣","有六个主要特征：韵律美、强调色彩形象、句式活泼、语言规则变异、大量使用辞格、话题中心含蓄"],"q":"[3811]文艺语体是以语言文字为工具，形象化地反映客观现实的话语表达体系，也称为“文学语体”“艺术语","w":"high","e":["2019 真题","2022 真题"]},{"t":"网络语体","y":"名词解释","p":["网络语体是利用互联网即时通讯工具和社交平台进行交际而形成的话语表达体系","兼有口语语体和书面语体的特点","具有视觉性、即时性和非当面性等特征","体现网络用户崇尚个性、追求新奇、戏谑娱乐、热衷模仿等社交心态"],"q":"网络语体，指的是利用互联网即时通讯工具和社交平台进行交际而形成的话语表达体系。网络语体表现了社会发展和语言发展的密切关系，体现了语体渗透交融的关系，“自媒体”的传播方式对汉语交际形式及表达工具的发展产生了深远的影响。","w":"high","e":["2020 真题","2023 真题"]},{"t":"网络流行体","y":"名词解释","p":["网络流行体是在网络交际中快速传播、具有一定时效性的文本模块","通常根据其特征被称为“体”","起源于文学作品、影视节目、社会事件、网民原创等","篇幅短小，格式固定，内容新颖，易于复制"],"q":"网络流行体指的是在网络交际中快速传播，具有一定时效性的文本模块，通常根据其特征被称为“体”。它起源于文学作品、影视节目、社会事件、网民原创等。篇幅短小，格式固定，内容新颖，易于复制，颇具娱乐效果，深受年轻人的欢迎。","w":"high","e":["2020 真题"]},{"t":"公文事务语体","y":"名词解释","p":["公文事务语体是在社会公众语境中关涉公务或行政管理主题的话语表达体系","又称公文体","只能是书面语体","有四个特点：书面语色彩浓厚、用词客观准确、以陈述句和祈使句为主、固定的行文格式"],"q":"公文事务语体，是指在社会公众语境中关涉公务或行政管理主题的话语表达体系，又称公文体，如政府的各类法规、通告，社会管理部门之间的来往信函、文件，企业部门间的合同、协议等。这类语体只能是书面语体。","w":"high","e":["2020 真题"]},{"t":"科学技术语体","y":"名词解释","p":["科学技术语体是关涉科学研究、教育等主题进行交际所形成的话语表达体系","又称科技体、智慧体或知识体","特点包括特殊符号、专业术语外来语、结构紧凑多用复句、风格平实朴素"],"q":"科学技术语体，指关涉科学研究、教育等主题进行交际所形成的话语表达体系。其功能在于准确地记录自然、社会及人类自身的各种现象，用一定的语言符号将其过程和结果表述出来进行交流，这些作品包括科技专著、学术论文、考察、实验报告、技术标准、教材等，科技通俗读物也应属于这一语体。科学技术语体又称科技体、智慧体或知识体。","w":"high","e":["2019 真题"]},{"t":"正式演说语体","y":"名词解释","p":["演说语体是说明事理、表明自己观点的话语表达体系","有鲜明的话题中心","句式简短，表情色彩强烈"],"q":"演说语体指的是说明事理，表明自己观点的话语表达体系。它有鲜明的话题中心，对语言环境的依赖性不像谈话语体那么强。它句式简短，表情色彩强烈，与之配合有手势动作、情感语调来补充，并且普遍使用具有表情色彩和描绘色彩的词句，充分利用词汇和语法体系中的种种表情成分。","w":"high","e":["2019 真题"]},{"t":"大众传播语体","y":"名词解释","p":["大众传播语体是在公众生活语境中关涉大众和社会生活主题的话语表达体系","带有明显的公众性和有备性","语言表达上有倾向性和感染力"],"q":"大众传播语体，是指在公众生活语境中关涉大众和社会生活主题的话语表达体系，从其外部条件来看，带有明显的公众性和有备性，因此它在语体特征上跟书面语体大体一致，如电视、广播、报刊的新闻通讯和社论、时评，以及公众性演讲等。","w":"high","e":["2020 真题"]},{"t":"日常谈话语体","y":"名词解释","p":["谈话语体是人们日常交谈活动的话语表达体系","对语言环境的依赖性强","经常使用省略形式，句子比较简短","语音上常夹杂超语言的剩余部分，允许音变"],"q":"谈话语体指的是人们日常交谈活动的话语表达体系，所用词语极为丰富。它对语言环境的依赖性强，经常使用省略形式，句子一般都比较简短。在语音上，常常会夹杂一些超语言的剩余部分，有时还允许个别音素的脱落，产生同化或异化等音变现象。","w":"high","e":["2019 真题"]},{"t":"语体有哪些基本属性？","y":"简答题","p":["系统性：由各种语言材料和手段构成的特征体系","稳定性：一旦形成便对该语体的表达形式具有约束效应","开放性：随着社会生活的变化、分工的细密而进一步分化"],"q":"[3708]1.系统性。从形式上看，语体是由言语行为所运用的各种语言材料和手段，如词语、句子以及修辞手段等构成的特征体系。\n[3709]2.稳定性。语体是语言符号在长期的使用过程中形成的，一旦形成，便在一个相当长的时期对该语体的表达形式具有约束效应，充分体现和发挥语体的社会交际功能，完成交际任务。\n[3710]3.开放性。作为语言符号的交际功能变体，语体是在运用中形成的，同时，它也将随着社会生活的变化、分工的细密而进一步分化。因此，语体系统在保持自身相对稳定的同时，又必然处于不断发展、更新的开放状态中。","w":"high","e":["2019 真题","2021 真题"]},{"t":"简述口头语体的主要特点。","y":"简答题","p":["辅助言语手段的参与","语音手段的充分运用","通俗易懂的生活化用词","灵活多变、简短轻便的句子形式","极富生活化的修辞格式","游离的话题中心、随机不定的话轮转换"],"q":"[3716]口头语体指为适应现场交际语境的需要而形成的口头话语表达体系。其主要特点是：\n[3717]1.辅助言语手段的参与","w":"high","e":["2020 真题","2023 真题"]},{"t":"简述书面语体的主要特点。","y":"简答题","p":["常用词语、术语及文言词的选用","句子结构成分完备，较少省略、跳脱，限制语及修饰语复杂","语序结构总体上相对固定，合乎常规","强调形式上的均衡、对称效果","话题中心突出，分话题围绕总话题展开","丰富多彩、形式齐备的辞格表达"],"q":"书面语体是指为适应不同交际语境的需要而形成的书面话语表达体系。与口语语体主要使用语音不同，书面语体主要媒介是文字，在词语的选择、句子结构的安排、话语篇章的衔接上都有自身的特征。","w":"high","e":["2019 真题","2022 真题"]},{"t":"网络语体有哪些语言特征？","y":"简答题","p":["词语创新立异","句式混用","辞格兼用"],"q":"[3842](一)网络语体的语言特征\n[3843]1.词语创新立异","w":"high","e":["2021 真题"]},{"t":"六种主要语体分别是哪六种？","y":"简答题","p":["日常谈话语体","正式演说语体","大众传播语体","公文事务语体","科学技术语体","文艺语体"],"q":"[3788]二、六种主要语体","w":"high","e":["2018 真题","2021 真题"]},{"t":"下列不属于书面语体分类的是（　　）","y":"单项选择题","p":["日常谈话语体属于口头语体，不属于书面语体"],"q":"口头语体又可分为日常谈话语体、正式演说语体；书面语体又可分为大众传播语体、公文事务语体、科学技术语体。","w":"high","e":["2020 真题"]},{"t":"口语语体等于口语，书面语体等于书面语。","y":"判断题","p":["口语语体不等于口语，书面语体不等于书面语","划分主要根据是语言符号组织构成的系统特征","而不是根据语音/文字的传递方式"],"q":"[3712]需要明确的是：口语语体不等于口语(口头表达)，书面语体也不等于书面语(文字表达)。口语语体和","w":"high","e":["2019 真题","2022 真题"]},{"t":"网络语体兼有口语语体和书面语体的特点。","y":"判断题","p":["网络语体兼有口语语体和书面语体的特点","具有视觉性、即时性和非当面性等特征"],"q":"网络语体兼有口语语体和书面语体的特点，具有视觉性、即时性和非当面性等特征，要求话语符号充分显示变异表达的语用功能，同时体现使用主体————网络用户们崇尚个性、追求新奇、戏谑娱乐、热衷模仿等社交心态。","w":"high","e":["2021 真题"]},{"t":"从语言系统性特征给语体分类，语体可以分为口头语体和书面语体。口头语体又可分为______和______。","y":"填空题","p":["口头语体分日常谈话语体、正式演说语体"],"q":"口头语体又可分为日常谈话语体、正式演说语体；书面语体又可分为大众传播语体、公文事务语体、科学技术语体。","w":"high","e":["2020 真题"]}]},{"id":"xdhy_down-c02-s08","t":"第八节 病句的类型与修改","w":"normal","n":33,"k":[{"t":"病句","y":"名词解释","p":["病句指不合规范的句子","规范包括三个方面：符合语法组合规则、符合语义搭配要求、符合语用表达习惯","产生病句的原因可能涉及语法、语义和语用多个层面"],"q":"所谓病句，就是指不合规范的句子；所谓规范，一是要符合语法组合规则，二是要符合语义的搭配要求，三是要符合语用的表达习惯。寻找产生病句的原因，可能涉及语法、语义和语用多个层面。","w":"high","e":["2019 真题","2022 真题"]},{"t":"紧缩法","y":"名词解释","p":["紧缩法是先检查句子的“主干”再检查句子“枝叶”的一种方法","首先检查主语中心、谓语中心、宾语中心之间能否搭配、有无残缺或多余","再检查定语、状语或补语与其中心语等能否搭配"],"q":"紧缩法是先检查句子的“主干”再检查句子“枝叶”的一种方法。其步骤是首先检查主语(中心)、谓语(中心)、宾语(中心)之间能否搭配、有无残缺或多余等。","w":"high","e":["2020 真题","2022 真题"]},{"t":"类比法","y":"名词解释","p":["类比法是造出一些相类似的格式来同原句比较、以判断原句正误的方法"],"q":"类比法是造出一些相类似的格式来同原句比较，以判断原句正误的一种方法。","w":"high","e":["2019 真题","2021 真题"]},{"t":"成分残缺","y":"名词解释","p":["成分残缺指不符合隐含、省略的条件而缺少应有的句法成分","出现一个成分，与之匹配的另一个成分就必须出现","包括主语残缺、谓语残缺、宾语残缺、修饰语残缺、补语残缺"],"q":"句法成分残缺，是指不符合隐含、省略的条件而缺少应有的句法成分。一般情况下，出现一个成分，与它匹配的另一个成分就必须出现；否则，就会造成句法结构的不完整，表达的句义不准确。","w":"high","e":["2020 真题"]},{"t":"结构杂糅","y":"名词解释","p":["结构杂糅指把两种不同的说法硬凑在一起，把两种不同的结构套叠在一起","造成结构不合法则，语义混乱费解","包括格式套叠和句式杂糅两类"],"q":"所谓的句法结构杂糅，是指把两种不同的说法硬凑在一起，把两种不同的结构套叠在一起，以致造成结构不合法则，语义混乱费解。","w":"high","e":["2019 真题"]},{"t":"搭配不当","y":"名词解释","p":["搭配不当指相互搭配的成分在语义上不能贯通","涉及主语与谓语、述语与宾语、述语和补语、修饰语与中心语","语法上合法并不一定语义上能搭配"],"q":"所谓的搭配不当，通常情况下，是指这些相互搭配的成分在语义上不能贯通。","w":"high","e":["2019 真题","2021 真题"]},{"t":"成分多余","y":"名词解释","p":["成分多余指句子中语义相同的成分重复出现或出现了不应该出现的成分","造成语义啰唆甚至不合逻辑","包括主语多余、谓语多余、宾语多余、修饰语多余、补语多余"],"q":"所谓的成分多余，是指句子中的语义相同的成分重复出现，或者出现了不应该出现的成分，以致造成语义啰唆甚至不合逻辑。","w":"high","e":["2019 真题"]},{"t":"语序有误","y":"名词解释","p":["语序有误指一些句子成分倒置了应有的语序","造成语义模糊或不合逻辑","包括定心错位、定状错置、状补错置、状语错位、误补为定、多层定语/状语语序混乱"],"q":"所谓的语序有误，是指一些句子成分倒置了应有的语序，以致造成语义模糊或不合逻辑。","w":"high","e":["2020 真题"]},{"t":"表述歧义","y":"名词解释","p":["语义的表达要明确，不能有歧义","产生歧义的原因很复杂","不管哪种歧义在表达上都要力求避免"],"q":"语义的表达要明确，不能有歧义。产生歧义的原因是很复杂的，但是不管哪种歧义，在表达上都是要力求避免的。","w":"high","e":["2021 真题"]},{"t":"虚词不妥","y":"名词解释","p":["虚词不妥指汉语虚词用法复杂、语义微妙，容易用错","属于语法病句类型之一"],"q":"汉语的虚词极为丰富，不仅用法复杂，而且语义微妙，稍微不注意，就会用错。","w":"high","e":["2019 真题"]},{"t":"词性不对","y":"名词解释","p":["词性不对指在某个句法位置上应该出现这类词却用了另外一类词","属于语法病句类型之一"],"q":"词性不对是指在某个句法位置上应该出现这类词，却用了另外一类词。","w":"high","e":["2020 真题"]},{"t":"从简不从繁的原则","y":"名词解释","p":["从简不从繁指在修改病句时以改动最少为准则","只需调动语序的就不随意加减词语","只需加减一个词语的就不加减两个词语"],"q":"所谓从简不从繁，就是指在修改病句时，以改动最少为准则。凡是只需要调动语序的就不随意加减词语，凡是只需要加减一个词语的，就不加减两个词语。","w":"high","e":["2019 真题"]},{"t":"修改病句有哪几条原则？","y":"简答题","p":["忠于原意的原则","从简不从繁的原则","尽量维持原句结构的原则","修改跟造成病句的原因保持一致的原则","以“忠于原意”的原则为根本"],"q":"修改病句的四原则，是以“忠于原意”的原则为根本的一个有机整体。在修改病句中，只要违背其中一个原则，往往也就违背了其他三个原则。","w":"high","e":["2018 真题","2021 真题","2023 真题"]},{"t":"语法病句可以分为哪几种类型？","y":"简答题","p":["词性不对","虚词不妥","成分残缺","结构杂糅"],"q":"[3975](一)词性不对\n[3976]词性不对是指在某个句法位置上应该出现这类词，却用了另外一类词。例如：","w":"high","e":["2019 真题","2022 真题"]},{"t":"语义病句可以分为哪几种类型？","y":"简答题","p":["搭配不当：主谓搭配不当、述宾搭配不当、主宾搭配不当、偏正搭配不当、述补搭配不当","表述歧义"],"q":"[4025](一)搭配不当","w":"high","e":["2020 真题","2022 真题"]},{"t":"语用病句可以分为哪几种类型？","y":"简答题","p":["成分多余：主语多余、谓语多余、宾语多余、修饰语多余、补语多余","语序有误：定心错位、定状错置、状补错置、状语错位、误补为定、多层定语语序混乱、多层状语语序混乱"],"q":"[4057](一)成分多余\n[4058]所谓的成分多余，是指句子中的语义相同的成分重复出现，或者出现了不应该出现的成分，以致造成语义啰唆甚至不合逻辑。","w":"high","e":["2020 真题","2023 真题"]},{"t":"关联词语使用不当包括哪几种情况？","y":"简答题","p":["关联词语与分句间的逻辑意义相悖","关联词语滥用","关联词语欠用","关联词语搭配不当","关联词语位置有误"],"q":"[4137](三)关联词语使用不当\n[4138]1.关联词语与分句间的逻辑意义相悖","w":"high","e":["2020 真题"]},{"t":"确定一个句子是否病句，要注意哪几点？","y":"简答题","p":["语言是复杂的，不要用片面教条衡量","语言是发展的，要具有历史的发展的眼光","语言常常是超越逻辑的"],"q":"[3898]确定一个句子是否病句，要注意几点：\n[3899]第一，语言是复杂的。语言规则是多方面的，千万不要用某种现成的但却是片面的教条来作为衡量句子是不是合乎规范的标准。例如当年曾经有人认为“恢复疲劳”“打扫卫生”“救火”“养病”等说法是病句，这就是因为他们认定动词与宾语关系只能是动作和受事的关系，而忽视了实际上还存在着许多其他的语义关系，例如动作与结果、目的、原因等关系。","w":"high","e":["2020 真题"]},{"t":"试述修改病句的四条原则及其相互关系。","y":"论述题","p":["忠于原意的原则","从简不从繁的原则","尽量维持原句结构的原则","修改跟造成病句的原因保持一致的原则","四原则是以“忠于原意”为根本的有机整体，违背一个往往也违背其他三个"],"q":"修改病句的四原则，是以“忠于原意”的原则为根本的一个有机整体。在修改病句中，只要违背其中一个原则，往往也就违背了其他三个原则。在修改病句中，应该努力贯彻这四原则，才能把学到的语言知识运用到具体的语言实践中去。","w":"high","e":["2018 真题","2020 真题","2022 真题"]},{"t":"复句常见的病句类型主要发生在哪三个方面？","y":"简答题","p":["分句间意义上缺乏联系","分句间次序层次混乱","关联词语使用不当"],"q":"复句常见的病句类型，跟单句有所不同。主要发生在分句间意义上缺乏联系，分句间次序层次混乱以及关联词语使用不当这三个方面。","w":"high","e":["2019 真题","2022 真题"]},{"t":"请指出下面病句的类型并修改：“湖面上倒影着点点白帆。”","y":"分析题","p":["属于词性不对","“倒影”是名词，不能带宾语","应改为“倒映”"],"q":"例(1)“倒影”是名词，不能带宾语，应该改为“倒映”。","w":"high","e":["2019 真题"]},{"t":"修改病句常用的两种辅助方法是______和______。","y":"填空题","p":["修改病句有两种常用的辅助方法：紧缩法、类比法"],"q":"[3953]1.紧缩法\n[3954]紧缩法是先检查句子的“主干”再检查句子“枝叶”的一种方法。其步骤是首先检查主语(中心)、谓语(中心)、宾语(中心)之间能否搭配、有无残缺或多余等。例如：","w":"high","e":["2019 真题"]},{"t":"“大家先把这个问题考虑，以后再抽时间研究。”可以改为（　　）","y":"单项选择题","p":["把字句对谓语部分必须是复杂的","改为主动句则结构变化、处置义消失","正确改法为“大家先把这个问题考虑一下”"],"q":"A句不符合把字句对谓语部分必须是复杂的基本要求；如果改成B句，虽然通顺了，但由于改成了主动句，结构发生了变化，处置义也没有了，正确的改法应该是C句。","w":"high","e":["2021 真题"]},{"t":"请指出下面病句的类型并修改：“他丰富的发言，吸引着所有的听众。”","y":"分析题","p":["属于偏正搭配不当","定语“丰富”与中心语“发言”语义上不照应","应改为“精彩的发言”"],"q":"例(7)定语“丰富”与中心语“发言”，语义上不照应，应改为“精彩的发言”。","w":"high","e":["2020 真题"]},{"t":"请指出下面病句的类型并修改：“秋天的北京是一年中最长最美的季节。”","y":"分析题","p":["属于主宾搭配不当","主语中心语是“北京”，不可能是“季节”","改为“北京的秋天是……季节”"],"q":"例(5)主语中心语是“北京”，所以不可能是“季节”，可能是受到“秋天”的误导，应改为“北京的秋天是……季节”。","w":"high","e":["2021 真题"]},{"t":"请指出下面病句的类型并修改：“一阵急促的敲门声打破了宁静的夜晚。”","y":"分析题","p":["属于定心错位","定心错位指定语与中心语的语序错误地颠倒","宾语“宁静的夜晚”应改为“夜晚的宁静”"],"q":"所谓定心错位，是指定语与中心语的语序错误地颠倒了。例(1)宾语“宁静的夜晚”应改为“夜晚的宁静”。","w":"high","e":["2020 真题"]},{"t":"语言是发展的，请举例说明有些当年被认为是病句的说法现在已经被接受。","y":"分析题","p":["语言是发展的，要具有历史的发展的眼光","《语法修辞讲话》曾批评“战机”“劳改”是“生造词语”","曾批评“转变”是不及物动词不能带宾语","现在这些用法已被接受"],"q":"第二，语言是发展的。当年认为是不规范的句子，由于群众的广泛使用，这种句子的用法逐渐已经被接受，因此我们必须具有历史的发展的眼光。例如20世纪50年代初《语法修辞讲话》曾经批评过“我军为寻找有利战机……”“释放的释放，劳改的劳改⋯⋯”，认为其中“战机”“劳改”是“生造词语”。","w":"high","e":["2021 真题"]},{"t":"请用类比法分析下面的句子是否有毛病：“歌声突然变得格外亲切而且动人多了。”","y":"分析题","p":["类比原句格式仿造若干句子进行判断","A、B、C三式都有毛病，“十分”“特别”“格外”与“多”语义重复","B式和C式还犯了结构杂糅的毛病","D句正确，据此修改为“歌声突然变得格外亲切，而且动人多了”"],"q":"[3965]该例似是而非，一时难于判定其正误。那么，就可以类比原句格式“格外亲切而且动人多了”来仿造若干个句子：","w":"high","e":["2020 真题"]},{"t":"请指出下面病句的类型并修改：“只有从思想上解决为什么人的问题，就能更好地为人民服务。”","y":"分析题","p":["属于关联词语搭配不当","“只有”不能跟“就”配搭","可改为“只有……才”或“只要……就”"],"q":"例(8)的关联词语“只有”不能跟“就”配搭，可改为“只有……才”，或改为“只要……就”。","w":"high","e":["2019 真题"]},{"t":"请指出下面句子的歧义并修改：“国庆晚会上，十几个少数民族的同学跳起了欢快的民族舞蹈。”","y":"分析题","p":["“十几个少数民族的同学”可以有两种切分","“十几个少数民族的/同学”或“十几个/少数民族的同学”","改为“少数民族的十几个同学”或“分属十几个少数民族的同学”"],"q":"例(3)关键是“十几个少数民族的同学”可以有两种切分，“十几个少数民族的/同学”或“十几个/少数民族的同学”，所以要改为“少数民族的十几个同学”或“分属十几个少数民族的同学”。","w":"high","e":["2020 真题"]},{"t":"“由于计算机应用技术的提高，为高校文科开展多媒体教学研究打下良好的技术基础。”属于（　　）","y":"单项选择题","p":["因滥用介词而造成主语残缺","去掉介词“由于”就可以了"],"q":"例(1)因滥用介词而造成主语残缺，只要去掉介词“由于”就可以了。","w":"high","e":["2020 真题"]},{"t":"请用紧缩法分析并修改下面的病句：“建桥工人充分发扬了不怕苦、不怕累的精神和团结互助的友情。”","y":"分析题","p":["紧缩为“工人发扬……精神和……友情”","“发扬”与“精神”能搭配，但与“友情”不能搭配","属于动宾搭配中顾此失彼的毛病","改为“发扬了不怕苦、不怕累的精神和团结互助的风格”"],"q":"A句紧缩为“工人发扬⋯⋯精神和⋯⋯友情”后，即可发现，“发扬”与“精神”能够搭配，但与“友情”不能搭配，属于动宾搭配中顾此失彼的毛病，可改为B句。","w":"high","e":["2019 真题","2021 真题"]},{"t":"确定一个句子是否病句时，可以用某种现成的但却是片面的教条来作为衡量句子是不是合乎规范的标准。","y":"判断题","p":["语言规则是多方面的","不能用现成而片面的教条作为衡量句子是否合乎规范的标准"],"q":"第一，语言是复杂的。语言规则是多方面的，千万不要用某种现成的但却是片面的教条来作为衡量句子是不是合乎规范的标准。","w":"high","e":["2019 真题"]}]}]}]},{"d":"rumen","t":"对外汉语教学入门（第3版）","c":[{"id":"rumen-c01","t":"第一章 总论","w":"normal","s":[{"id":"rumen-c01-s01","t":"第一节 学科性质","w":"normal","n":0,"k":[]},{"id":"rumen-c01-s02","t":"第二节 语言学习的基本概念","w":"normal","n":0,"k":[]},{"id":"rumen-c01-s03","t":"第三节 第二语言教学的性质、任务和类别","w":"normal","n":0,"k":[]},{"id":"rumen-c01-s04","t":"第四节 基础学科和相关学科","w":"normal","n":0,"k":[]}]},{"id":"rumen-c02","t":"第二章 外语教学法","w":"normal","s":[{"id":"rumen-c02-s01","t":"第一节 教学法概述","w":"normal","n":0,"k":[]},{"id":"rumen-c02-s02","t":"第二节 传统教学法","w":"normal","n":0,"k":[]},{"id":"rumen-c02-s03","t":"第三节 人本主义教学法","w":"normal","n":0,"k":[]},{"id":"rumen-c02-s04","t":"第四节 交际型教学法","w":"normal","n":0,"k":[]},{"id":"rumen-c02-s05","t":"第五节 创新型教学法","w":"normal","n":0,"k":[]},{"id":"rumen-c02-s06","t":"第六节 教学法的发展趋势","w":"normal","n":0,"k":[]}]},{"id":"rumen-c03","t":"第三章 课堂教学","w":"normal","s":[{"id":"rumen-c03-s01","t":"第一节 备课","w":"normal","n":0,"k":[]},{"id":"rumen-c03-s02","t":"第二节 讲述与倾听技能","w":"normal","n":0,"k":[]},{"id":"rumen-c03-s03","t":"第三节 提问与组织讨论技能","w":"normal","n":0,"k":[]},{"id":"rumen-c03-s04","t":"第四节 非语言表达技能","w":"normal","n":0,"k":[]},{"id":"rumen-c03-s05","t":"第五节 表扬与批评技能","w":"normal","n":0,"k":[]},{"id":"rumen-c03-s06","t":"第六节 课堂组织与管理","w":"normal","n":0,"k":[]},{"id":"rumen-c03-s07","t":"第七节 板书和多媒体","w":"normal","n":0,"k":[]}]},{"id":"rumen-c04","t":"第四章 第二语言习得","w":"normal","s":[{"id":"rumen-c04-s01","t":"第一节 第一语言的作用与对比分析","w":"normal","n":0,"k":[]},{"id":"rumen-c04-s02","t":"第二节 偏误分析","w":"normal","n":0,"k":[]},{"id":"rumen-c04-s03","t":"第三节 中介语及其发展过程","w":"normal","n":0,"k":[]},{"id":"rumen-c04-s04","t":"第四节 输入、输出与互动","w":"normal","n":0,"k":[]},{"id":"rumen-c04-s05","t":"第五节 学习者个体差异","w":"normal","n":0,"k":[]},{"id":"rumen-c04-s06","t":"第六节 学习和学习者的策略","w":"normal","n":0,"k":[]},{"id":"rumen-c04-s07","t":"第七节 语言普遍性假
