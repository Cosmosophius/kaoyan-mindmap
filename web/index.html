为直指式和喻指式","直指式包括组合型和类推型","喻指式包括比喻型、引申型、借代型"],"q":"造词法解决了一个词从无到有的问题，主要包括语音指称法、音义结合法、语义关联法、短语缩略法。语义关联法主要是以概念与概念之间的语义关联为基础，通过组合或比拟等手段来直指或喻指事物现象的方法，分为直指式和喻指式两类：直指式通过概念之间的关联直指事物现象，包括组合型和类推型；喻指式通过概念之间的关联喻指事物现象，包括比喻型、","w":"normal","e":["核心考点"]},{"t":"短语缩略法有哪些具体方式？请各举一例。","y":"简答题","p":["分段简缩式：土地改革→土改","截段简缩式：复旦大学→复旦","综合简缩式：联合国安全理事会→安理会","取异合同式：工业农业→工农业","数字概括式：讲学习、讲政治、讲正气→三讲"],"q":"短语缩略法是指基于交际的经济性原则，通过简缩部分语素或词使短语缩略成词的造词方法。具体方式有五种：1.分段简缩式，把短语分段，每段取一个成分，如土地改革→土改；2.截段简缩式，取其中具有区别性特征的一段，如复旦大学→复旦；3.综合简缩式，把分段与截段相结合，如联合国安全理事会→安理会；4.取异合同式，保留差异成分，把相","w":"normal","e":["核心考点"]},{"t":"试论述现代汉语复合式合成词的五种结构类型，并各举例说明。","y":"论述题","p":["联合型（相近、相关、相反、偏义关系）","偏正型（定中、状中关系）","述宾型（支配与被支配关系）","补充型（动作结果、动作趋向、事物计量）","主谓型（话题与说明关系）"],"q":"复合式合成词指由至少两个不同词根组合而成的合成词，这是现代汉语最重要的构词法。根据词根与词根的意义与结构关系，复合词主要有五种类型：（一）联合型，由两个意义相同、相近、相关或相反的词根并列组合而成，又可分为相近关系（如思想、道路、教授）、相关关系（如眉目、矛盾、领袖）、相反关系（如东西、始终、开关）、偏义关系（如国家、","w":"high","e":["2013 真题","2018 真题"]},{"t":"辨析“叠音词”和“重叠式合成词”。","y":"辨析题","p":["叠音词：同一个音节重叠而成的单纯词，由单一语素构成","重叠式合成词：同一词根重叠而成的合成词","关键区别：叠音词是一个语素的单纯词，重叠式合成词是两个语素的合成词"],"q":"叠音词和重叠式合成词都涉及音节的重复，但性质不同。(1)叠音词是同一个音节重叠而成的单纯词，由单一语素构成，如太太、奶奶、蝈蝈、猩猩，其中的单个音节没有独立意义。(2)重叠式合成词是通过同一词根的重叠而形成的，属于合成词，分AA型和AABB型，如爸爸、妈妈、仅仅、常常（AA型），骂骂咧咧、花花绿绿（AABB型），重叠的","w":"high","e":["教材高频"]},{"t":"辨析“构词法”和“造词法”。","y":"辨析题","p":["构词法：语素构成词的方式方法，静态分析","造词法：创造新词的方式方法，动态分析","构词法研究语素如何构成词，造词法解决词从无到有","二者一静一动，互为补充"],"q":"构词法与造词法是词汇的两大构造系统，区别在于：(1)构词法是指语素构成词的方式和方法，是对已有词的音节特征和结构关系进行静态的分析和分类，研究语素如何构成词；(2)造词法是指人们创造新词的方式和方法，是对新造词的形成方式进行动态的分析和分类，解决了一个词从无到有的问题。简言之，构词法是静态的分析，造词法是动态的分析；前","w":"high","e":["教材高频"]},{"t":"“骆驼”是双声词，“伶俐”是叠韵词。（  ）","y":"判断题","p":["判断：错误","“伶俐”是双声词","“骆驼”是叠韵词","题目颠倒"],"q":"错误。“伶俐”两个音节声母相同（l），是双声词；“骆驼”两个音节韵母相同（uo），是叠韵词。题目把二者颠倒了。联绵词根据声母、韵母关系分为双声词、叠韵词、非双声叠韵词三类。","w":"normal","e":["核心考点"]},{"t":"“月亮、地震、海啸、日食”都是主谓型复合词。（  ）","y":"判断题","p":["判断：正确","主谓型：前一个词根是被陈述对象，后一个表示陈述","月亮、地震、海啸、日食均为主谓型"],"q":"正确。主谓型复合词前一个词根是被陈述对象，后一个词根表示陈述，前后词根构成类似于话题与说明的关系。“月亮、日食、地震、海啸、雪崩、霜降、年轻”等都是主谓型复合词。","w":"normal","e":["核心考点"]},{"t":"“扩大、降低、说服、推翻”都是补充型复合词。（  ）","y":"判断题","p":["判断：正确","补充型：后一个词根补充说明前一个词根","扩大、降低、说服、推翻属于动作与结果关系"],"q":"正确。补充型复合词后一个词根补充说明前一个词根，其中动作与结果关系如“扩大、降低、削弱、推动、揭露、说服、推翻”等；此外还有动作与趋向关系（如纳入、进入）、事物与计量关系（如书本、人口）。","w":"normal","e":["核心考点"]},{"t":"构词法是对已有词的音节特征和结构关系进行______的分析和分类。","y":"填空题","p":["静态"],"q":"静态。构词法是指语素构成词的方式和方法，是对已有词的音节特征和结构关系进行静态的分析和分类；而造词法是对新造词的形成方式进行动态的分析和分类。","w":"normal","e":["核心考点"]},{"t":"由一个语素构成的词是______词，由两个或两个以上语素构成的词是合成词。","y":"填空题","p":["单纯"],"q":"单纯。由一个语素构成的词是单纯词，不存在内部构造问题；合成词是由两个或两个以上语素构成的词。","w":"normal","e":["核心考点"]},{"t":"由两个没有意义的音节连缀成义而形成的词叫______词。","y":"填空题","p":["联绵"],"q":"联绵。联绵词是从古代汉语中流传下来的，由两个没有意义的音节连缀成义而形成的词。根据两个音节的声母、韵母关系，可分为双声词、叠韵词、非双声叠韵词三类。","w":"normal","e":["核心考点"]},{"t":"复合词主要有联合型、______、述宾型、补充型、主谓型五种类型。","y":"填空题","p":["偏正型"],"q":"偏正型。根据词根与词根的意义与结构关系，复合词主要有五种类型：联合型、偏正型、述宾型、补充型、主谓型。偏正型前一个词根修饰限制后一个词根。","w":"normal","e":["核心考点"]},{"t":"“骆驼、汹涌、窈窕、霹雳”属于联绵词中的（  ）。","y":"单项选择题","p":["B","联绵词分双声、叠韵、非双声叠韵三类","“骆驼、汹涌、窈窕、霹雳”韵母相同，是叠韵词"],"q":"B。联绵词分为双声词（声母相同）、叠韵词（韵母相同）、非双声叠韵词。“骆驼、汹涌、窈窕、霹雳”两个音节的韵母相同，属于叠韵词。","w":"normal","e":["核心考点"]},{"t":"“冰凉、笔直、雪白、鲜红”的构词方式是（  ）。","y":"单项选择题","p":["B","偏正型：前一个词根修饰限制后一个词根","“冰凉、笔直、雪白、鲜红”是状中关系的偏正型"],"q":"B。偏正型复合词前一个词根修饰限制后一个词根，包括定中关系和状中关系。“冰凉、笔直、雪白、鲜红”属于状中关系，前一个词根从性状上修饰后一个词根，整体是偏正型。","w":"normal","e":["核心考点"]},{"t":"分析下列各词的构词方式及具体类型：轻松、对虾、改良、芙蓉、笔谈、胆怯。","y":"分析题","p":["轻松：联合型（相近关系）","对虾：偏正型（定中关系）","改良：补充型（动作与结果关系）","芙蓉：单纯词（联绵词，非双声叠韵词）","笔谈：偏正型（状中关系）","胆怯：主谓型"],"q":"用构词法分析：(1)“轻松”由意义相近的两个词根并列组成，属于联合型（相近关系）。(2)“对虾”前一个词根修饰限制后一个词根，属于偏正型（定中关系）。(3)“改良”后一个词根补充说明前一个词根，属于补充型（动作与结果关系）。(4)“芙蓉”由两个没有意义的音节连缀成义构成，属于单纯词中的联绵词（非双声叠韵词）。(5)“笔","w":"normal","e":["核心考点"]},{"t":"指出下列各短语简缩成词的方法：土地改革→土改、复旦大学→复旦、联合国安全理事会→安理会、工业农业→工农业、讲学习、讲政治、讲正气→三讲。","y":"分析题","p":["土地改革→土改：分段简缩式","复旦大学→复旦：截段简缩式","联合国安全理事会→安理会：综合简缩式","工业农业→工农业：取异合同式","讲学习、讲政治、讲正气→三讲：数字概括式"],"q":"(1)“土地改革→土改”属于分段简缩式，把短语分段，每段取一个成分。(2)“复旦大学→复旦”属于截段简缩式，取其中具有区别性特征的一段。(3)“联合国安全理事会→安理会”属于综合简缩式，把分段与截段相结合。(4)“工业农业→工农业”属于取异合同式，保留差异成分，把相同成分合一。(5)“讲学习、讲政治、讲正气→三讲”属于","w":"normal","e":["核心考点"]}]},{"id":"xdhy_up-c03-s03","t":"第三节 词义构成","w":"high","n":27,"k":[{"t":"义素","y":"名词解释","p":["义素是词义系统中不能独立运用的最小的意义单位，是构成义位的区别性语义特征，是从词义分析中抽象出来的观念成分。","义位是可以独立使用的最小意义单位，是词义的最基本构成单位。而义素是不能独立使用的最小意义单位，是构成义位的区别性特征。","义位分解形成义素，不同的义素组合起来形成义位才能构成一个独立运用的意义，义位与义素的关系是整体与部分的关系。"],"q":"义素是词义系统中不能独立运用的最小的意义单位，是构成义位的区别性语义特征，是从词义分析中抽象出来的观念成分。","w":"high","e":["教材高频"]},{"t":"义位","y":"名词解释","p":["义位是词义系统中可以独立运用的最小的意义单位，是最基本的词义单位，是义素的集合体。","一个词有几个可独立运用的意义就有几个义位，有的词有一个独立运用的意义就只有一个义位，有的词有多个独立运用的意义就有多个义位。","义位是义素的集合，义位与义素的关系是整体与部分的关系。义位是作为单个词义的语义单位，凡是义位，在词典里必定列为一个义项，但是义项不一定就是义位。"],"q":"义位是词义系统中可以独立运用的最小的意义单位，是最基本的词义单位，是义素的集合体。","w":"high","e":["教材高频"]},{"t":"义项","y":"名词解释","p":["义项是字典、词典中按照一个词意义数量分列的项目。","义项有两类：一是可以独立运用的词义，也就是义位；一类是不能独立运用，只是作为构成词或固定短语的语素义。","义位在词典里必定表现为义项，但是义项并不完全等于义位，关键是有的义项只是语素义，不是词义。"],"q":"义项是字典、词典中按照一个词意义数量分列的项目。","w":"high","e":["教材高频"]},{"t":"词义的客观性","y":"名词解释","p":["词义的特征主要有客观性、主观性、概括性和演变性。","词义的客观性主要表现在两个方面：一是反映对象的客观存在性；二是词义形成的约定俗成性。","从反映对象上看，无论是客观世界的山川草木，还是主观世界的爱恨情仇，都是客观存在的。","从词义形成来看，什么样的语音形式及其书写形式表示什么事物、现象及其关系的意义，是基于社会成员客观存在的共同认知而约定俗成的。","当然，词义的客观性并非客观存在或约定俗成本身，也不与客观存在的事物、现象及其关系完全符合或等同。"],"q":"词义的特征主要有客观性、主观性、概括性和演变性。词义的客观性主要表现在两个方面：一是反映对象的客观存在性；二是词义形成的约定俗成性。","w":"high","e":["教材高频"]},{"t":"词义的主观性","y":"名词解释","p":["词义的主观性主要表现为两个方面：一是使用主体的民族性；二是词义理解的个体性。","不同民族在用不同的词语记录客观世界和主观世界的事物现象时，由于民族思维、语言系统、生活习惯等方面的差异，决定了词义的民族差异。","即使同一个民族，在对事物认识基本一致的情况下，也会因年龄、生活环境、文化水平和认知能力等差异，造成词义理解的个体差异。"],"q":"词义的主观性主要表现为两个方面：一是使用主体的民族性；二是词义理解的个体性。","w":"high","e":["教材高频"]},{"t":"词义的概括性","y":"名词解释","p":["从指称方式上看，词义对所指事物、现象及其关系都具有概括能力。词义都是对一类对象的概括反映。","如“笔”的词义是写字画图的工具，是从铅笔、钢笔、圆珠笔、毛笔、蜡笔、水彩笔等不同类型和派克笔、英雄笔、金星笔等不同品牌的“笔”中概括出来的，舍弃了不同个体的差异特征，抽象出共同的功能特征。","不仅普通词的词义是概括的，专有词的词义也具有概括性。"],"q":"从指称方式上看，词义对所指事物、现象及其关系都具有概括能力。词义都是对一类对象的概括反映。","w":"high","e":["教材高频"]},{"t":"词义的演变性","y":"名词解释","p":["从发展趋势上看，词义并非一成不变，随着客观世界和主观世界的发展变化，人们对各类事物、现象及其关系的认识和使用方式也随之发生变化，因此，词义具有演变性。","词义演变主要有以下几种类型：(1)词义认识的深化；(2)词义范围的变化（扩大或缩小）；(3)词义功能的转移；(4)词义色彩的变化。","词义扩大如“河”从专指黄河扩大到泛指一切河流；词义缩小如“学者”从指“求学之人”缩小到指学术上有一定成就的人。"],"q":"从发展趋势上看，词义并非一成不变，随着客观世界和主观世界的发展变化，人们对各类事物、现象及其关系的认识和使用方式也随之发生变化，因此，词义具有演变性。","w":"high","e":["教材高频"]},{"t":"客观概念义","y":"名词解释","p":["从反映对象上看，词义反映的是人们对客观存在的事物、现象及其关系的本质属性的理性认识，理性认识一旦获得语音形式及其书写形式的物质外壳，就成为词义的客观概念义。","概念义也称为客观义、理据义和指称义。客观概念义大致分为两类：指称事物、动作和性质的概念义，可称为实体概念义；指称事物与现象之间关系的概念义，可称为关系概念义。"],"q":"从反映对象上看，词义反映的是人们对客观存在的事物、现象及其关系的本质属性的理性认识，理性认识一旦获得语音形式及其书写形式的物质外壳，就成为词义的客观概念义。","w":"high","e":["教材高频"]},{"t":"情态色彩义","y":"名词解释","p":["情态色彩义是指附着在词义上与其概念义同时存在的主观情感和态度。","情态色彩义主要分成两类：情感色彩和态度色彩。","情感色彩主要分为褒义词和贬义词，大部分词义不带固定的情感色彩，属于中性词。态度色彩主要是指人的态度倾向，如表谦虚、客气、敬重、鄙薄、强硬等态度。"],"q":"情态色彩义是指附着在词义上与其概念义同时存在的主观情感和态度。","w":"high","e":["教材高频"]},{"t":"语体色彩义","y":"名词解释","p":["语体色彩义是指词义所反映的适用于不同交际场合和文体的语体特征。","词义的语体色彩可以分为两类：口语语体色彩和书面语体色彩，书面语体色彩还可以进一步分为文艺语体、科技语体、政论语体、公文语体四类。","大多数词语既可以用于口语语体，也可以用于书面语体，具有通用的中性语体色彩。"],"q":"语体色彩义是指词义所反映的适用于不同交际场合和文体的语体特征。","w":"high","e":["教材高频"]},{"t":"固定修辞义","y":"名词解释","p":["固定修辞义是指一个词频繁用作一定的修辞手段并凝固在词义系统中成为词典义项之一。","根据修辞手段的不同，主要分为三类：比喻义、借代义和委婉义。","具有比喻义的如：爪牙、桃李、龙头；具有借代义的如：红娘、纨绔、杜康；具有委婉义的如：有喜、绿帽子、驾崩。"],"q":"固定修辞义是指一个词频繁用作一定的修辞手段并凝固在词义系统中成为词典义项之一。","w":"high","e":["教材高频"]},{"t":"临时语境义","y":"名词解释","p":["临时语境义是指一个词在具体语言环境中所派生出的新的临时性词义。","它对语言环境依赖性很大，脱离了具体语境就不存在了。它的产生一般源于人们在特定语境下追求某种特殊的表达效果。"],"q":"临时语境义是指一个词在具体语言环境中所派生出的新的临时性词义。","w":"high","e":["教材高频"]},{"t":"社区色彩义","y":"名词解释","p":["时间空间义是指语言因在一定的时代、地域中使用而产生的意义，主要有古今色彩义和社区色彩义两种。","社区色彩义指只在某个社区流通并反映该社区政治、经济、文化特色的词义。","香港的社区词如：公屋、居屋、夹屋、丁屋、抽水、通水；台湾的社区词如：泛蓝、泛绿、飞弹、辅育院、劈腿。"],"q":"时间空间义是指语言因在一定的时代、地域中使用而产生的意义，主要有古今色彩义和社区色彩义两种。社区色彩义指只在某个社区流通并反映该社区政治、经济、文化特色的词义。","w":"high","e":["教材高频"]},{"t":"什么是义素、义位和义项？三者之间是什么关系？","y":"简答题","p":["义素：不能独立运用的最小的意义单位，是区别性语义特征","义位：可以独立运用的最小的意义单位，是义素的集合体","义项：字典、词典中按意义数量分列的项目","义位与义素是整体与部分的关系","义位必定表现为义项，但义项不一定是义位"],"q":"义素是词义系统中不能独立运用的最小的意义单位，是构成义位的区别性语义特征；义位是词义系统中可以独立运用的最小的意义单位，是最基本的词义单位，是义素的集合体；义项是字典、词典中按照一个词意义数量分列的项目。义位与义素的关系是整体与部分的关系，义位是义素的集合；凡是义位在词典里必定列为一个义项，但是义项不一定就是义位，因为","w":"high","e":["2015 真题"]},{"t":"词义具有哪些特征？请简要说明。","y":"简答题","p":["词义特征：客观性、主观性、概括性、演变性","客观性：反映对象的客观存在性和约定俗成性","主观性：民族性和个体性","概括性：对一类对象的概括反映","演变性：认识的深化、范围的变化、功能的转移、色彩的变化"],"q":"词义是人们通过词的形式反映客观世界、主观世界的事物、现象及其关系的意义内容。词义的特征主要有客观性、主观性、概括性和演变性。客观性主要表现在反映对象的客观存在性和词义形成的约定俗成性；主观性主要表现为使用主体的民族性和词义理解的个体性；概括性指词义都是对一类对象的概括反映；演变性指词义并非一成不变，包括认识的深化、范围","w":"high","e":["教材高频"]},{"t":"词义演变主要有哪几种类型？请举例说明。","y":"简答题","p":["词义认识的深化（如“人”）","词义范围的变化（如“河”扩大、“学者”缩小）","词义功能的转移（如“布告”动词转名词）","词义色彩的变化（如“爪牙”变为贬义）"],"q":"随着客观世界和主观世界的发展变化，词义也随之变化发展，因此词义具有演变性。主要有以下几种类型：(1)词义认识的深化，如人们对“人”的定义从《说文解字》“天地之性最贵者也”发展到《现代汉语词典》“能制造工具并使用工具进行劳动的高等动物”；(2)词义范围的变化，如“河”从专指黄河扩大到泛指一切河流（词义扩大），“学者”从指","w":"high","e":["教材高频"]},{"t":"词义的内容包括哪些方面？","y":"简答题","p":["客观概念义","主观色彩义（情态色彩义、语体色彩义）","固定修辞义（比喻义、借代义、委婉义）","时间空间义（古今色彩义、社区色彩义）","临时语境义"],"q":"词义是人们通过词的形式反映客观世界、主观世界的事物、现象及其关系的意义内容，词义的内容包括：客观概念义、主观色彩义、固定修辞义、时间空间义以及临时语境义。客观概念义是人们对客观存在事物本质属性的理性认识；主观色彩义包括情态色彩义和语体色彩义；固定修辞义包括比喻义、借代义和委婉义；时间空间义主要有古今色彩义和社区色彩义；","w":"high","e":["教材高频"]},{"t":"试论述词义演变的主要类型，请举例说明。","y":"论述题","p":["词义认识的深化（如“人”的定义变化）","词义范围的变化：扩大（如“河”）和缩小（如“学者”）","词义功能的转移（如“布告”动词转名词）","词义色彩的变化（如“爪牙”变贬义）"],"q":"词义具有演变性。随着客观世界和主观世界的发展变化，人们对各类事物、现象及其关系的认识和使用方式也随之发生变化，从而影响到词义的变化发展。词义演变主要有以下几种类型：（一）词义认识的深化。随着社会的发展，一个词在古代和现代所指事物的范围没有变化，但是人们对词所指事物的性质特征的认知却在不断深化。如“人”从《说文解字》的“","w":"high","e":["2012 真题","2017 真题"]},{"t":"辨析“义位”和“义项”。","y":"辨析题","p":["义位：词义系统中可以独立运用的最小的意义单位，是义素的集合体","义项：字典、词典中按照一个词意义数量分列的项目","义项包括义位和语素义两类","义位必定表现为义项，但义项不一定就是义位"],"q":"义位和义项都是词义单位，但不完全相同。(1)义位是词义系统中可以独立运用的最小的意义单位，是最基本的词义单位，是义素的集合体，是作为单个词义的语义单位。(2)义项是字典、词典中按照一个词意义数量分列的项目。义项有两类：一是可以独立运用的词义，也就是义位；一类是不能独立运用，只是作为构成词或固定短语的语素义。因此，凡是义","w":"normal","e":["核心考点"]},{"t":"辨析“固定修辞义”和“临时语境义”。","y":"辨析题","p":["固定修辞义：频繁用作修辞手段并凝固为词典义项，具有稳定性","临时语境义：具体语言环境中派生的临时性词义，依附语境","关键区别：前者凝固稳定，后者临时依附语境"],"q":"二者都是词义的内容，但性质不同。(1)固定修辞义是指一个词频繁用作一定的修辞手段并凝固在词义系统中成为词典义项之一，根据修辞手段的不同分为比喻义、借代义和委婉义，如“爪牙”（比喻坏人的党羽）、“红娘”（指代媒人）。(2)临时语境义是指一个词在具体语言环境中所派生出的新的临时性词义，它对语言环境依赖性很大，脱离了具体语境","w":"normal","e":["核心考点"]},{"t":"义素是词义系统中可以独立运用的最小的意义单位。（  ）","y":"判断题","p":["判断：错误","义素是不能独立运用的最小的意义单位","可以独立运用的最小意义单位是义位"],"q":"错误。义素是词义系统中不能独立运用的最小的意义单位，是构成义位的区别性语义特征。可以独立运用的最小的意义单位是义位，不是义素。","w":"normal","e":["核心考点"]},{"t":"词义只具有客观性，不具有主观性。（  ）","y":"判断题","p":["判断：错误","词义的特征有客观性、主观性、概括性、演变性","词义具有主观性，表现为民族性和个体性"],"q":"错误。词义的特征主要有客观性、主观性、概括性和演变性。词义既具有客观性，又具有主观性。词义的主观性主要表现为使用主体的民族性和词义理解的个体性。","w":"normal","e":["核心考点"]},{"t":"“河”从专指黄河扩大到泛指一切河流，这体现了词义范围的扩大。（  ）","y":"判断题","p":["判断：正确","“河”从专指黄河到泛指河流属于词义扩大","词义范围变化包括扩大和缩小"],"q":"正确。词义范围的变化包括词义扩大和词义缩小。“河”从专指黄河扩大到泛指一切河流，“洗”从只限“洗脚”扩大到了洗一般物体，都属于词义扩大；而“学者”从指“求学之人”缩小到指学术上有一定成就的人，属于词义缩小。","w":"normal","e":["核心考点"]},{"t":"义素是词义系统中______运用的最小的意义单位。","y":"填空题","p":["不能独立"],"q":"不能独立。义素是词义系统中不能独立运用的最小的意义单位，是构成义位的区别性语义特征；而义位是词义系统中可以独立运用的最小的意义单位。","w":"normal","e":["核心考点"]},{"t":"词义的特征主要有客观性、主观性、______和演变性。","y":"填空题","p":["概括性"],"q":"概括性。词义的特征主要有客观性、主观性、概括性和演变性。概括性指词义都是对一类对象的概括反映。","w":"normal","e":["核心考点"]},{"t":"下列属于“义位”的是（  ）。","y":"单项选择题","p":["A","义位是可以独立运用的最小的意义单位","“父亲”只有一个义位"],"q":"A。义位是词义系统中可以独立运用的最小的意义单位，是义素的集合。“父亲”有一个独立运用的意义，只有一个义位；而义素是不能独立运用的最小意义单位，如[+人类][-男性]等。","w":"normal","e":["核心考点"]},{"t":"用义素分析法分析“男孩”和“女孩”的词义。","y":"分析题","p":["义素分析法是对同一语义场的义位进行对比分析","{男孩}=[+人类][+男性][-成年]","{女孩}=[+人类][-男性][-成年]","共同义素：[+人类][-成年]","区别义素：[±男性]"],"q":"义素分析法就是对同一语义场的一组义位进行对比分析，从中寻找义位之间共同义素和区别义素的方法。“男孩”和“女孩”的词义都可以分解为三个义素：{男孩}=[+人类][+男性][-成年]，{女孩}=[+人类][-男性][-成年]。“+”表示有此义素，“-”表示无此义素。其中[+人类][-成年]是“男孩”与“女孩”的共同义素，而","w":"high","e":["教材高频"]}]},{"id":"xdhy_up-c03-s04","t":"第四节 词义分析与释义","w":"high","n":18,"k":[{"t":"义素分析法","y":"名词解释","p":["义素分析法就是对同一语义场的一组义位进行对比分析，从中寻找义位之间共同义素和区别义素的方法，这是现代语义学的重要分析方法。","义位分为析形成义素，通过义素分析就可以揭示不同义位之间的异同。","义素分析法的步骤包括：掌握义素分析的元语言；确定语义场及其对比义位；提取共同义素和区别义素；列出义位结构式。"],"q":"义素分析法就是对同一语义场的一组义位进行对比分析，从中寻找义位之间共同义素和区别义素的方法，这是现代语义学的重要分析方法。","w":"high","e":["教材高频"]},{"t":"语义场","y":"名词解释","p":["语义场就是在共时条件下，在同一个语义系统中具有意义联系的词的聚合体，语义场是义素分析的依据。","义位之间的意义关联性是义素对比分析的基本条件，义素对比分析的对象必须是具有意义关联性的同一语义场的义位。","根据语义场内义位之间的关系，可以把语义场分为分类语义场、顺序语义场、关系语义场、反义语义场、同义语义场。语义场具有联系性、民族性、层次性三个特征。"],"q":"语义场就是在共时条件下，在同一个语义系统中具有意义联系的词的聚合体，语义场是义素分析的依据。","w":"high","e":["教材高频"]},{"t":"义素分析法的原则","y":"名词解释","p":["义素分析法必须遵循系统性原则、对等性原则、区别性原则和简明性原则。","系统性原则要求把义位放在属于同一语义场的语义系统中进行对比分析。","对等性原则要求义位的意义必须等于分解出来的各个义素的总和，所指范围不能过宽或过窄。","区别性原则要求找出具有区别作用的义素，这是义素分析的根本目的。","简明性原则要求用尽可能少的典型区别性义素来揭示义位的区别性特征。"],"q":"义素分析法必须遵循系统性原则、对等性原则、区别性原则和简明性原则。","w":"high","e":["教材高频"]},{"t":"语素分析法","y":"名词解释","p":["合成词是由语素作为构词成分构成的，语素义与词义之间有不同的关系类型，语素义从不同方面、以不同方式、不同程度地表示词义。","语素义与词义的关系类型主要有六种：词义由语素义构词直接来表示；词义由语素义同义互补来表示；词义由语素义和附加义来表示；词义由语素义修辞间接来表示；词义由部分语素义来表示；词义与语素义没有直接关系。"],"q":"合成词是由语素作为构词成分构成的，语素义与词义之间有不同的关系类型，语素义从不同方面、以不同方式、不同程度地表示词义。","w":"high","e":["教材高频"]},{"t":"构词分析法","y":"名词解释","p":["构词分析法就是通过综合全面地分析一个词的构词情况来确定该词的词义内容。","这种析义方法最适用于单音多义词。","一个单音多义词往往不容易明确该词的各个义项及其关系，而通过综合分析该词所构成的合成词，比较容易确定该词的多种义项。"],"q":"构词分析法就是通过综合全面地分析一个词的构词情况来确定该词的词义内容。","w":"high","e":["教材高频"]},{"t":"逻辑定义释义法","y":"名词解释","p":["运用逻辑学中的定义法来进行释义，即通过邻近的属和种差揭示被定义概念的本质属性，该方法比较适用于解释某些学科术语和普通名词。","逻辑定义释义法要求用“属加种差”的方式揭示被定义概念的本质。","被定义概念分别以其邻近的属概念和以其余词语为“种差”来释义。"],"q":"运用逻辑学中的定义法来进行释义，即通过邻近的属和种差揭示被定义概念的本质属性，该方法比较适用于解释某些学科术语和普通名词。","w":"high","e":["教材高频"]},{"t":"互训反训释义法","y":"名词解释","p":["运用与被解释词具有同义、近义或反义关系的词或短语等来释义，包括互训和反训。","互训就是用同义近义词释义的方法，反训就是用反义词释义的方法。","互训包括：今语词解释古语词、普通话解释方言词、通用语解释书面语、通用词解释口语词、对语素次序进行对等的同义近义解释。"],"q":"运用与被解释词具有同义、近义或反义关系的词或短语等来释义，包括互训和反训。","w":"high","e":["教材高频"]},{"t":"描写比喻释义法","y":"名词解释","p":["通过描述或列举、形容、比喻的方式说明被解释词所指的事物、行为、性状及其关系。","描写比喻释义法包括描述事物、描述行为、描述性状、描述关系、列举说明、形容说明、比喻说明等。","如比喻说明：旗手：比喻领导人或先行者；敲门砖：比喻借以求得名利的初步手段。"],"q":"通过描述或列举、形容、比喻的方式说明被解释词所指的事物、行为、性状及其关系。","w":"high","e":["教材高频"]},{"t":"补充论元释义法","y":"名词解释","p":["通过补充与被解释词所指事物、行为和形状等有关的主体、对象、原因、目的、工具、方式、处所、领域等语义信息来释义的方法。","补充论元释义法可根据所补充的信息分为：补充主体信息、补充对象信息、补充原因信息、补充目的信息、补充工具信息、补充方式处所领域等信息。"],"q":"通过补充与被解释词所指事物、行为和形状等有关的主体、对象、原因、目的、工具、方式、处所、领域等语义信息来释义的方法。","w":"high","e":["教材高频"]},{"t":"附加信息释义法","y":"名词解释","p":["附加与被解释词有关的时空信息、主观色彩、语法属性等语用方面的信息，使词语的释义更加完善充分。","附加信息释义法包括：附加时空（时代、社区、语境等）信息、附加主观色彩（情态、语体）、附加语法属性（用法、词性）。"],"q":"附加与被解释词有关的时空信息、主观色彩、语法属性等语用方面的信息，使词语的释义更加完善充分。","w":"high","e":["教材高频"]},{"t":"什么是义素分析法？它的步骤有哪些？","y":"简答题","p":["义素分析法：对同一语义场的一组义位进行对比分析，寻找共同义素和区别义素","步骤1：掌握义素分析的元语言","步骤2：确定语义场及其对比义位","步骤3：提取共同义素和区别义素","步骤4：列出义位结构式"],"q":"义素分析法就是对同一语义场的一组义位进行对比分析，从中寻找义位之间共同义素和区别义素的方法，这是现代语义学的重要分析方法。其步骤包括：(1)掌握义素分析的元语言；(2)确定语义场及其对比义位；(3)提取共同义素和区别义素；(4)列出义位结构式。","w":"high","e":["2016 真题"]},{"t":"什么是语义场？它有哪些类型和特征？","y":"简答题","p":["语义场：共时条件下在同一个语义系统中具有意义联系的词的聚合体","类型：分类、顺序、关系、反义、同义语义场","特征：联系性、民族性、层次性"],"q":"语义场就是在共时条件下，在同一个语义系统中具有意义联系的词的聚合体，语义场是义素分析的依据。根据语义场内义位之间的关系，可以把语义场分为：A.分类语义场；B.顺序语义场；C.关系语义场；D.反义语义场；E.同义语义场。语义场具有三个特征：A.联系性；B.民族性；C.层次性。","w":"high","e":["教材高频"]},{"t":"义素分析法的原则有哪些？","y":"简答题","p":["系统性原则：放在同一语义场的语义系统中对比分析","对等性原则：义位意义等于各义素总和","区别性原则：找出具有区别作用的义素","简明性原则：用尽可能少的典型区别性义素"],"q":"义素分析法的原则有：(1)系统性原则，必须把义位放在属于同一语义场的语义系统中进行对比分析；(2)对等性原则，义位的意义必须等于分解出来的各个义素的总和，所指范围不能过宽或过窄；(3)区别性原则，要找出具有区别作用的义素，这是义素分析的根本目的；(4)简明性原则，用尽可能少的典型区别性义素来揭示义位的区别性特征。","w":"normal","e":["核心考点"]},{"t":"语素义与词义的关系类型主要有哪些？","y":"简答题","p":["词义由语素义构词直接来表示","词义由语素义同义互补来表示","词义由语素义和附加义来表示","词义由语素义修辞间接来表示","词义由部分语素义来表示","词义与语素义没有直接关系"],"q":"合成词是由语素作为构词成分构成的，语素义与词义之间有不同的关系类型，主要有六种：1.词义由语素义构词直接来表示；2.词义由语素义同义互补来表示；3.词义由语素义和附加义来表示；4.词义由语素义修辞间接来表示；5.词义由部分语素义来表示；6.词义与语素义没有直接关系。","w":"normal","e":["核心考点"]},{"t":"词语释义法主要有哪些？请列举并简要说明。","y":"简答题","p":["逻辑定义释义法：通过邻近的属和种差揭示本质属性","互训反训释义法：用同义近义或反义词释义","描写比喻释义法：描述、列举、形容、比喻","补充论元释义法：补充主体对象原因目的工具方式处所领域","附加信息释义法：附加时空、主观色彩、语法属性"],"q":"词语释义法就是正确、明白、简练地解释词语意义的方法。包括：逻辑定义释义法，即通过邻近的属和种差揭示被定义概念的本质属性；互训反训释义法，即运用与被解释词具有同义、近义或反义关系的词或短语来释义；描写比喻释义法，即通过描述或列举、形容、比喻的方式说明被解释词；补充论元释义法，即通过补充主体、对象、原因、目的、工具、方式、","w":"normal","e":["核心考点"]},{"t":"义素分析法就是对同一______的一组义位进行对比分析，从中寻找共同义素和区别义素的方法。","y":"填空题","p":["语义场"],"q":"语义场。义素分析法就是对同一语义场的一组义位进行对比分析，从中寻找义位之间共同义素和区别义素的方法，这是现代语义学的重要分析方法。","w":"normal","e":["核心考点"]},{"t":"运用逻辑学中的定义法来进行释义，即通过邻近的属和______揭示被定义概念的本质属性。","y":"填空题","p":["种差"],"q":"种差。逻辑定义释义法运用逻辑学中的定义法来进行释义，即通过邻近的属和种差揭示被定义概念的本质属性。如“作家：从事文学创作有成就的人”。","w":"normal","e":["核心考点"]},{"t":"“作家：从事文学创作有成就的人。”这种释义方法属于（  ）。","y":"单项选择题","p":["A","逻辑定义释义法通过邻近的属和种差揭示本质属性","“作家”以“人”为属概念，其余为种差"],"q":"A。逻辑定义释义法运用逻辑学中的定义法来进行释义，即通过邻近的属和种差揭示被定义概念的本质属性。“作家”以“人”为邻近的属概念，其余为种差，属于逻辑定义释义法。","w":"normal","e":["核心考点"]}]},{"id":"xdhy_up-c03-s05","t":"第五节 词汇的分类系统","w":"high","n":36,"k":[{"t":"同音词","y":"名词解释","p":["同音词是指语音形式(声母、韵母和声调)相同而意义完全不同的词。","同音词包括两类：同音同形词，是指语音形式相同，书写形式也相同而意义不同的词；同音异形词，是指语音形式相同，书写形式和意义都不相同的词。","同音词就来源来说主要有两类：词源不同发音偶合的同音词；词源相同，词义分化而成的同音词。"],"q":"同音词是指语音形式(声母、韵母和声调)相同而意义完全不同的词。","w":"high","e":["教材高频"]},{"t":"同形词","y":"名词解释","p":["同形词是指书写形式相同，语音形式和意义不同的词。","根据语音形式的差异，同形词主要包括四类：声母、韵母相同而声调不同；声母相同而韵母不同或韵母、声调都不同；韵母相同而声母不同或声母、声调都不同；第一个音节相同，第二个音节有轻声与否的差别。"],"q":"同形词是指书写形式相同，语音形式和意义不同的词。","w":"high","e":["教材高频"]},{"t":"字母词","y":"名词解释","p":["字母词是指汉语中由拉丁字母、希腊字母等西文字母构成的或由它们与符号、数字或汉字混合构成的词。","字母词主要包括三类：英文字母词（包括英语词和英语首字母缩略语）、汉语拼音字母缩略形式、以字母表形的字母词。","字母词的大量出现主要有两个方面的原因：从社会生活考虑，一是国际交流的日趋频繁，二是社会文化水平的普遍提高，三是计算机及其网络的普遍运用；从语言文字本身着眼，一是某些外来词语难以翻译，二是字母词书写经济简便。"],"q":"字母词是指汉语中由拉丁字母、希腊字母等西文字母构成的或由它们与符号、数字或汉字混合构成的词。","w":"high","e":["教材高频"]},{"t":"单义词","y":"名词解释","p":["单义词是指一个语音形式只有一个意义的词。","单义词主要包括以下类型：事物名词、专有名词、科学术语、称谓名称。"],"q":"单义词是指一个语音形式只有一个意义的词。","w":"high","e":["教材高频"]},{"t":"多义词","y":"名词解释","p":["多义词是指一个语音形式有两个或两个以上既有联系又不相同的意义的词。","多义词的一个意义也被称为一个义项，多义词的各个义项具有以下特点：一是固定性，不是因语境而产生的临时意义；二是关联性，不同的义项之间存在着一定的联系；三是区别性，各个义项保持着自己的特点。","根据多义词所包含的义位和语素义情况，可以分成三种类型：所有义项都是词义的多义词；有些义项是词义而有些义项是语素义的多义词；所有义项都是语素义的多义不成词语素。"],"q":"多义词是指一个语音形式有两个或两个以上既有联系又不相同的意义的词。","w":"high","e":["教材高频"]},{"t":"本义","y":"名词解释","p":["本义是文献记载的词的最初意义。","有些多义词的本义已经消失，在一般词典中不再列为义项；有些多义词的本义作为语素义至今保留，但只出现在合成词或固定结构中；有些多义词的本义，至今仍然是最常用最主要的意义，这时多义词的本义与基本义就一致了。"],"q":"本义是文献记载的词的最初意义。","w":"high","e":["教材高频"]},{"t":"基本义","y":"名词解释","p":["基本义就是词在现代最常用最主要的意义。","有些多义词的本义和基本义一致，有些多义词的本义和基本义并不一致。","词的基本义都是词义义项，不能是语素义义项。在《现代汉语词典》中，基本义一般列为第一义项。"],"q":"基本义就是词在现代最常用最主要的意义。","w":"high","e":["教材高频"]},{"t":"引申义","y":"名词解释","p":["引申义是引申发展出来的意义。","引申义可以分为三种情况：从本义(基本义)发展出来的引申义；从基本义发展出来的引申义；从引申义发展出来的引申义。"],"q":"引申义是引申发展出来的意义。","w":"high","e":["教材高频"]},{"t":"比喻义","y":"名词解释","p":["比喻义就是把词的比喻用法固定下来的意义。","本义、基本义、引申义都可以产生比喻义。","“口”的本义和基本义是“人和动物进食、发声的器官”，发展出比喻义义项“出入通过的部位”。"],"q":"比喻义就是把词的比喻用法固定下来的意义。","w":"high","e":["教材高频"]},{"t":"同义词","y":"名词解释","p":["同义词就是意义相同或相近的词。","根据意义相同的程度，同义词可以分成两类：等义词和近义词。","等义词是指意义完全相同的词；近义词是指意义基本相同，但在意义、功能或色彩上存在细微差别的词。"],"q":"同义词就是意义相同或相近的词。","w":"high","e":["教材高频"]},{"t":"等义词","y":"名词解释","p":["等义词是指意义完全相同的词。","等义词属于同义词，与近义词相对。"],"q":"等义词是指意义完全相同的词。","w":"high","e":["教材高频"]},{"t":"近义词","y":"名词解释","p":["近义词是指意义基本相同，但在意义、功能或色彩上存在细微差别的词。","近义词属于同义词，同义词辨析可运用色彩分析法、意义分析法、功能分析法。"],"q":"近义词是指意义基本相同，但在意义、功能或色彩上存在细微差别的词。","w":"high","e":["教材高频"]},{"t":"反义词","y":"名词解释","p":["反义词就是属于同一范畴的意义相反或相对的一组词。","根据反义词在意义上是相反的矛盾关系还是相对的反对关系，可以分成两类：绝对反义词和相对反义词。","绝对反义词：肯定一方必否定另一方，否定一方必肯定另一方，二者属于矛盾关系；相对反义词：肯定一方必否定另一方，否定一方不一定肯定另一方，二者属于反对关系。"],"q":"反义词就是属于同一范畴的意义相反或相对的一组词。","w":"high","e":["教材高频"]},{"t":"绝对反义词","y":"名词解释","p":["绝对反义词：肯定一方必否定另一方，否定一方必肯定另一方，二者属于矛盾关系。","绝对反义词属于反义词的一类，与相对反义词相对。"],"q":"绝对反义词：肯定一方必否定另一方，否定一方必肯定另一方，二者属于矛盾关系。","w":"high","e":["教材高频"]},{"t":"相对反义词","y":"名词解释","p":["相对反义词：肯定一方必否定另一方，否定一方不一定肯定另一方，二者属于反对关系。","相对反义词属于反义词的一类，与绝对反义词相对。"],"q":"相对反义词：肯定一方必否定另一方，否定一方不一定肯定另一方，二者属于反对关系。","w":"high","e":["教材高频"]},{"t":"上位词与下位词","y":"名词解释","p":["上位词和下位词是指在意义上具有属种关系的一组词。在属种关系中，指称属概念的词就是上位词，指称种概念的词就是下位词。","根据属种关系的严密程度，上下位词主要包括两种类型：严格的基于科学分类的上下位词；非严格的基于日常运用的上下位词。","上位词与下位词间的属种关系可以通过“属加种差鉴定法”“类与子类鉴定法”“整分关系排除法”鉴别。"],"q":"上位词和下位词是指在意义上具有属种关系的一组词。在属种关系中，指称属概念的词就是上位词，指称种概念的词就是下位词。","w":"high","e":["教材高频"]},{"t":"类义词","y":"名词解释","p":["类义词就是根据同一意义标准划分出来的属于同一上位词的一组下位词。","根据同位关系的严密程度，类义词主要包括两种类型：严格的基于科学分类的类义词；非严格的基于日常运用的类义词。","类义词划分必须同一标准，类义词之间必须互相排斥。"],"q":"类义词就是根据同一意义标准划分出来的属于同一上位词的一组下位词。","w":"high","e":["教材高频"]},{"t":"什么是同音词？它可以分为哪两类？其来源是什么？","y":"简答题","p":["同音词：语音形式相同而意义完全不同","同音同形词：语音、书写形式相同，意义不同","同音异形词：语音形式相同，书写形式和意义都不相同","来源：词源不同发音偶合；词源相同词义分化"],"q":"同音词是指语音形式(声母、韵母和声调)相同而意义完全不同的词。同音词包括两类：同音同形词，是指语音形式相同，书写形式也相同而意义不同的词；同音异形词，是指语音形式相同，书写形式和意义都不相同的词。就来源来说，汉语的同音词主要有两类：一是词源不同发音偶合的同音词；二是词源相同，词义分化而成的同音词。","w":"high","e":["教材高频"]},{"t":"同音词与多义词有什么区别？","y":"简答题","p":["同音词各意义之间没有联系","多义词各意义之间有联系，具有固定性、关联性、区别性","区别关键在于各意义之间是否存在联系"],"q":"同音词是指语音形式相同而意义完全不同的词，各意义之间没有联系；多义词是指一个语音形式有两个或两个以上既有联系又不相同的意义的词，多义词的各个义项具有固定性、关联性和区别性。因此，同音词与多义词的关键区别在于各意义之间是否存在联系：有联系的是多义词，无联系的是同音词。","w":"normal","e":["核心考点"]},{"t":"什么是字母词？它可分为哪三类？大量出现的原因是什么？","y":"简答题","p":["字母词由西文字母构成或与符号数字汉字混合构成","三类：英文字母词、汉语拼音字母缩略形式、以字母表形的字母词","社会原因：国际交流频繁、文化水平提高、计算机网络运用","语言原因：某些外来词难翻译、书写经济简便"],"q":"字母词是指汉语中由拉丁字母、希腊字母等西文字母构成的或由它们与符号、数字或汉字混合构成的词。主要包括三类：(1)英文字母词，包括英语词和英语首字母缩略语；(2)汉语拼音字母缩略形式；(3)以字母表形的字母词。字母词大量出现主要有两个方面的原因：从社会生活考虑，一是国际交流的日趋频繁，二是社会文化水平的普遍提高，三是计算","w":"normal","e":["核心考点"]},{"t":"什么是同义词？同义词辨析可以运用哪些方法？","y":"简答题","p":["同义词是意义相同或相近的词，分等义词和近义词","色彩分析法：感情色彩、语体色彩","意义分析法：范围大小、语义轻重、语义偏向","功能分析法：搭配对象、词性功能"],"q":"同义词就是意义相同或相近的词，根据意义相同的程度可以分为等义词和近义词。一般来说，同义词可以运用三种方法进行辨析：A.色彩分析法，包括感情色彩的差异和语体色彩的差异；B.意义分析法，包括范围大小的差异、语义轻重的差异和语义偏向的差异；C.功能分析法，包括搭配对象的差异和词性功能的差异。","w":"high","e":["2011 真题","2019 真题"]},{"t":"什么是反义词？反义词的鉴定标准有哪些？","y":"简答题","p":["反义词：属于同一范畴的意义相反或相对的一组词","分绝对反义词（矛盾关系）和相对反义词（反对关系）","鉴定标准：必须属于同一范畴","必须属于同一词性","基于义项构成反义关系"],"q":"反义词就是属于同一范畴的意义相反或相对的一组词，根据反义词在意义上是相反的矛盾关系还是相对的反对关系，可以分成绝对反义词和相对反义词两类。反义词的鉴定标准有：A.必须属于同一范畴；B.必须属于同一词性；C.基于义项构成反义关系，即反义关系是以义项为基本单位的，一个多义词就可能构成若干组反义关系，例如“老”可以分别与“少","w":"high","e":["教材高频"]},{"t":"什么是上位词、下位词？其鉴定标准有哪些？","y":"简答题","p":["上位词指称属概念，下位词指称种概念","属加种差鉴定法","类与子类鉴定法","整分关系排除法","上位下位相对性"],"q":"上位词和下位词是指在意义上具有属种关系的一组词，在属种关系中，指称属概念的词就是上位词，指称种概念的词就是下位词。上位词与下位词间的属种关系可以通过以下方法鉴定：A.属加种差鉴定法，即“下位词是……的上位词”；B.类与子类鉴定法，即“下位词是上位词之一”；C.整分关系排除法，排除事物整体与部分的关系；D.上位下位相对性","w":"normal","e":["核心考点"]},{"t":"什么是类义词？其鉴定标准有哪些？","y":"简答题","p":["类义词：同一意义标准划分出来的属于同一上位词的一组下位词","划分必须同一标准","类义词之间必须互相排斥"],"q":"类义词就是根据同一意义标准划分出来的属于同一上位词的一组下位词。类义词的鉴定标准有：A.类义词划分必须同一标准，划分标准不同，类义关系就不同；B.类义词之间必须互相排斥，如文学体裁划分为小说、散文、诗歌、戏剧四类，它们之间是互相排斥的类义关系。","w":"normal","e":["核心考点"]},{"t":"试论述现代汉语多义词的类型和义项性质。","y":"论述题","p":["多义词：一个语音形式有两个或两个以上既有联系又不相同的意义的词","三个特点：固定性、关联性、区别性","三种类型：所有义项都是词义；词义与语素义兼有；都是语素义","义项性质：本义、基本义、引申义、比喻义"],"q":"多义词是指一个语音形式有两个或两个以上既有联系又不相同的意义的词。多义词的一个意义也被称为一个义项，多义词的各个义项具有固定性、关联性、区别性三个特点。根据多义词所包含的义位和语素义情况，可以分成三种类型：A.所有义项都是词义的多义词，属于合成词的双音节多义词和多音节多义词，其义项绝大多数都是词义；B.有些义项是词义而","w":"high","e":["2011 真题","2019 真题"]},{"t":"辨析“同音词”和“多义词”。","y":"辨析题","p":["同音词：语音形式相同而意义完全不同的词，各意义无联系","多义词：一个语音形式有多个既有联系又不同的意义，各义项有固定性、关联性、区别性","关键区别：各意义之间有无联系"],"q":"同音词和多义词都是同一个语音形式对应多个意义，但区别在于各意义之间有无联系。(1)同音词是指语音形式相同而意义完全不同的词，各意义之间没有联系，如“米₁(大米)”“米₂(长度单位)”。(2)多义词是指一个语音形式有两个或两个以上既有联系又不相同的意义的词，各义项具有固定性、关联性和区别性，如“闹”的七个义项之间存在引申","w":"high","e":["2014 真题"]},{"t":"辨析“绝对反义词”和“相对反义词”。","y":"辨析题","p":["绝对反义词：矛盾关系，否定一方必肯定另一方，如死—活","相对反义词：反对关系，否定一方不一定肯定另一方，如大—小","关键区别：绝对反义词无中间状态，相对反义词有中间状态"],"q":"二者都是反义词，区别在于意义关系不同。(1)绝对反义词：肯定一方必否定另一方，否定一方必肯定另一方，二者属于矛盾关系，如死—活、男—女、有—无、出席—缺席，其间不存在中间状态。(2)相对反义词：肯定一方必否定另一方，否定一方不一定肯定另一方，二者属于反对关系，如黑—白、大—小、高—低、冷—热，其间存在中间或过渡状态。","w":"normal","e":["核心考点"]},{"t":"辨析“同音词”和“同形词”。","y":"辨析题","p":["同音词：语音形式相同而意义不同，着眼“音同”","同形词：书写形式相同而语音、意义不同，着眼“形同”","同音词侧重音同，同形词侧重形同，二者有交叉"],"q":"二者都是形式相同而意义不同的词，但着眼点不同：(1)同音词是指语音形式（声母、韵母和声调）相同而意义完全不同的词，着眼于“音同”，包括同音同形词和同音异形词；(2)同形词是指书写形式相同，语音形式和意义不同的词，着眼于“形同”，根据语音差异分为声调不同、韵母不同、声母不同、轻声与否等四类，如“凉(liáng)—凉(li","w":"normal","e":["核心考点"]},{"t":"同音词就是指书写形式相同、意义不同的词。（  ）","y":"判断题","p":["判断：错误","同音词指语音形式相同而意义不同的词","题目所述是“同形词”的定义"],"q":"错误。同音词是指语音形式(声母、韵母和声调)相同而意义完全不同的词，包括同音同形词（如米₁—米₂）和同音异形词（如变幻—变换）。题目所说的“书写形式相同、语音形式和意义不同”是同形词的定义。","w":"normal","e":["核心考点"]},{"t":"绝对反义词之间可以存在中间状态。（  ）","y":"判断题","p":["判断：错误","绝对反义词属于矛盾关系，其间不存在中间状态","存在中间状态的是相对反义词"],"q":"错误。绝对反义词：肯定一方必否定另一方，否定一方必肯定另一方，二者属于矛盾关系，因此其间不存在中间状态，如死—活、男—女。而相对反义词：否定一方不一定肯定另一方，二者属于反对关系，其间存在中间状态，如大—小、高—低。","w":"normal","e":["核心考点"]},{"t":"“学生”与“大学生”是上下位关系；“地球”与“陆地”也是上下位关系。（  ）","y":"判断题","p":["判断：错误","“学生”与“大学生”是上下位关系","“地球”与“陆地”是整分关系，不是上下位关系"],"q":"错误。“学生”与“大学生”是上下位关系（属种关系），而“地球”与“陆地”是整体与部分的关系（整分关系）。上位词与下位词间的属种关系常常与事物整体与部分的关系混淆，整分关系常常表达为“乙是甲的一部分”，因此“地球”与“陆地”不构成上下位关系。","w":"normal","e":["核心考点"]},{"t":"同音词是指语音形式(声母、韵母和声调)相同而______完全不同的词。","y":"填空题","p":["意义"],"q":"意义。同音词是指语音形式(声母、韵母和声调)相同而意义完全不同的词。同音词包括同音同形词和同音异形词两类。","w":"normal","e":["核心考点"]},{"t":"反义词根据意义关系分为绝对反义词和______反义词。","y":"填空题","p":["相对"],"q":"相对。反义词就是属于同一范畴的意义相反或相对的一组词，根据意义关系分为绝对反义词和相对反义词。绝对反义词属于矛盾关系，相对反义词属于反对关系。","w":"normal","e":["核心考点"]},{"t":"“米₁（大米、稻米）—米₂（长度单位）”这组词属于（  ）。","y":"单项选择题","p":["A","同音词分同音同形词和同音异形词","“米₁”“米₂”语音、书写形式相同而意义不同，是同音同形词"],"q":"A。同音词是指语音形式相同而意义完全不同的词，分为同音同形词和同音异形词。“米₁”“米₂”语音形式、书写形式都相同而意义不同，属于同音同形词。","w":"normal","e":["核心考点"]},{"t":"下列各组中，属于绝对反义词的是（  ）。","y":"单项选择题","p":["B","绝对反义词属于矛盾关系，其间无中间状态","“死—活”是绝对反义词"],"q":"B。绝对反义词：肯定一方必否定另一方，否定一方必肯定另一方，二者属于矛盾关系，如死—活、男—女、有—无，其间不存在中间状态。“黑—白、大—小、高—低、冷—热”属于相对反义词。","w":"normal","e":["核心考点"]},{"t":"分析下列各组同义词的差异类型：①妨碍—妨害；②爸爸—父亲；③天气—气候；④永久—永远。","y":"分析题","p":["妨碍—妨害：意义分析法（语义轻重）","爸爸—父亲：色彩分析法（语体色彩）","天气—气候：意义分析法（范围大小）","永久—永远：功能分析法（词性功能）"],"q":"同义词辨析可以运用色彩分析法、意义分析法、功能分析法。(1)“妨碍—妨害”在语义轻重上有差异，“妨害”比“妨碍”语义重，属于意义分析法（语义轻重）。(2)“爸爸—父亲”在语体色彩上有差异，“爸爸”是口语，“父亲”是书面语，属于色彩分析法（语体色彩）。(3)“天气—气候”在范围大小上有差异，“气候”的范围大于“天气”，属","w":"normal","e":["核心考点"]}]},{"id":"xdhy_up-c03-s06","t":"第六节 词汇的构成系统","w":"high","n":19,"k":[{"t":"传承词","y":"名词解释","p":["传承词是指从古代、近代汉民族语言词汇中流传下来而为现代汉语词汇所承接的词。","传承词是现代汉语词汇的核心部分，属于基本词汇。传承词所指称的事物和现象从古代到现代都与人们的日常生活息息相关，因此具有较强的生命力。","传承词主要包括表示自然现象和事物、生产和生活资料、时量和空间概念、事物性质状态、人体部位和器官、动作行为和变化、亲属人称指代、事物或行为关系等八类。传承词具有共时的普遍性、历时的稳定性、构词的能产性三个特点。"],"q":"传承词是指从古代、近代汉民族语言词汇中流传下来而为现代汉语词汇所承接的词。","w":"high","e":["教材高频"]},{"t":"古语词","y":"名词解释","p":["古语词是指在古代、近代汉语中使用，而现代汉语出于特殊需要偶尔使用的词语。","根据指称事物的特点，主要包括两类：历史古语词和文言古语词。","历史古语词所指称的事物、现象和观念在历史上曾经存在过或流传过而现在已经不存在或不流传了；文言古语词所指称的事物、现象和观念在现实生活中依然存在，但古代和近代用文言词来表示，而现在用现代汉语词语来表示。"],"q":"古语词是指在古代、近代汉语中使用，而现代汉语出于特殊需要偶尔使用的词语。","w":"high","e":["教材高频"]},{"t":"新造词","y":"名词解释","p":["新造词是指为指称新事物、新概念或新现象而创造的词语。","新造词的产生与社会生活的变化有着密切的关系，社会变化越剧烈，新造词的产生就越频繁，有些新造词会随着使用频率的增加和范围的扩大而进入现代汉语词汇中，成为基本词汇成员，有些则随着使用频率的减少而逐渐消亡。","新词与旧词具有一定的相对性。以20世纪70年代末的改革开放为起点，在现代汉语中出现了大量新造词。"],"q":"新造词是指为指称新事物、新概念或新现象而创造的词语。","w":"high","e":["教材高频"]},{"t":"方言词","y":"名词解释","p":["方言词是指来源于某一方言且仅限于该方言地域内使用的词语。","根据交际的需要，方言词会不断地有选择地被吸收到现代汉语词汇中。当一个方言词可在全社会使用并稳定下来时，就成了现代汉语词汇的方言词。","方言词进入现代汉语词汇的速度和数量，与该方言地域的政治、经济、文化、人口等因素有密不可分的关系。"],"q":"方言词是指来源于某一方言且仅限于该方言地域内使用的词语。","w":"high","e":["教材高频"]},{"t":"社区词","y":"名词解释","p":["社区词是指反映某一社区政治、经济、文化特点并只在该社区流通的特有词语。","由于不同的政治制度、经济体制、文化教育和心理状态，中国大陆、香港特区、澳门特区、台湾地区以及不同的海外华人社区就会在政治、经济、文化、教育、生活等方面出现各不相同的事物、观念和现象，从而出现只在该社区使用的社区词。"],"q":"社区词是指反映某一社区政治、经济、文化特点并只在该社区流通的特有词语。","w":"high","e":["教材高频"]},{"t":"行业词","y":"名词解释","p":["行业词是指在不同学科专业和行业中使用的专门用语，是表达学科专业和行业概念的重要方式。","行业词包括专业术语和行业用语。","随着人们文化知识水平的普遍提高以及跨学科和跨行业交流的增加，许多行业词逐渐泛化而成为普通的现代汉语词汇。"],"q":"行业词是指在不同学科专业和行业中使用的专门用语，是表达学科专业和行业概念的重要方式。","w":"high","e":["教材高频"]},{"t":"外来词","y":"名词解释","p":["外来词是指从外国语或外族语中连音带义吸收来的词语。","在汉语发展史上，外来词的大规模借入主要有四个时期：一是借入西域诸国事物类词语的两汉时期；二是借入佛教词语的魏晋南北朝至唐宋时期；三是借入西方哲学、政治和科技词语的近代时期；四是全面借入外来词的改革开放时期。","现代汉语外来词主要来源于英语、日语、法语、俄语、德语以及境内少数民族语言。"],"q":"外来词是指从外国语或外族语中连音带义吸收来的词语。","w":"high","e":["教材高频"]},{"t":"外来词的译借方式","y":"名词解释","p":["现代汉语外来词的译借方式主要有：单纯音译式、音意混译式、音意兼译式、音加语素式、借音借形式。","单纯音译式即用汉字直接来译写外语词的读音；音意混译式即部分音译、部分意译；音意兼译式即整体音译，同时兼顾意译；音加语素式即外来词是由音译部分和表示类名的汉语语素组成；借音借形式包括借自西方字母的词和借自日文汉字字形而非读音的词。"],"q":"现代汉语外来词的译借方式主要有：单纯音译式、音意混译式、音意兼译式、音加语素式、借音借形式。","w":"high","e":["教材高频"]},{"t":"什么是传承词？它有哪些类型和特点？","y":"简答题","p":["传承词：从古代近代流传下来而为现代汉语承接的词","八大类型（自然现象、生产生活资料、时空概念、性质状态、人体部位、动作行为、亲属人称、事物关系）","特点：共时的普遍性、历时的稳定性、构词的能产性"],"q":"传承词是指从古代、近代汉民族语言词汇中流传下来而为现代汉语词汇所承接的词，是现代汉语词汇的核心部分，属于基本词汇。主要类型有：表示自然现象和事物、生产和生活资料、时量和空间概念、事物的性质状态、人体部位和器官、动作行为和变化、亲属人称指代、事物或行为关系的词。传承词具有三个特点：(1)共时的普遍性；(2)历时的稳定性；","w":"high","e":["教材高频"]},{"t":"什么是古语词？它可分为哪两类？","y":"简答题","p":["古语词：古代近代使用而现代偶尔使用的词语","历史古语词：所指事物现已不存在或不流传","文言古语词：所指事物仍存在但有对应的现代汉语词语"],"q":"古语词是指在古代、近代汉语中使用，而现代汉语出于特殊需要偶尔使用的词语。根据指称事物的特点，主要包括两类：历史古语词和文言古语词。历史古语词所指称的事物、现象和观念在历史上曾经存在过或流传过而现在已经不存在或不流传了；文言古语词所指称的事物、现象和观念在现实生活中依然存在，但古代和近代用文言词来表示，而现在用现代汉语词","w":"normal","e":["核心考点"]},{"t":"什么是方言词？它进入现代汉语词汇受什么因素影响？","y":"简答题","p":["方言词：来源于某一方言且仅限于该方言地域内使用的词语","有选择地被吸收，全社会使用并稳定下来即成为普通话方言词","速度和数量受该方言地域政治、经济、文化、人口等因素影响"],"q":"方言词是指来源于某一方言且仅限于该方言地域内使用的词语。根据交际的需要，方言词会不断地有选择地被吸收到现代汉语词汇中，当一个方言词可在全社会使用并稳定下来时，就成了现代汉语词汇的方言词。方言词进入现代汉语词汇的速度和数量，与该方言地域的政治、经济、文化、人口等因素有密不可分的关系。","w":"high","e":["教材高频"]},{"t":"什么是社区词？它与方言词有什么区别？","y":"简答题","p":["社区词：反映某一社区政治经济文化特点并只在该社区流通的特有词语","方言词是地域方言的产物","社区词是社会社区的产物，反映社区政治经济文化特点"],"q":"社区词是指反映某一社区政治、经济、文化特点并只在该社区流通的特有词语。与方言词相比，方言词是地域方言的产物，而社区词是社会社区（如不同政治制度、经济体制的地区）的产物，反映的是社区的政治、经济、文化特点。由于不同的政治制度、经济体制、文化教育和心理状态，中国大陆、香港特区、澳门特区、台湾地区以及不同的海外华人社区会出现","w":"normal","e":["核心考点"]},{"t":"什么是行业词？它为什么会泛化？","y":"简答题","p":["行业词：在不同学科专业和行业中使用的专门用语","包括专业术语和行业用语","泛化原因：文化知识水平提高、跨学科跨行业交流增加"],"q":"行业词是指在不同学科专业和行业中使用的专门用语，是表达学科专业和行业概念的重要方式，包括专业术语和行业用语。随着人们文化知识水平的普遍提高以及跨学科和跨行业交流的增加，许多行业词逐渐泛化而成为普通的现代汉语词汇，如医学领域的“手术、诊断、把脉”，计算机领域的“硬件、软件”等。","w":"normal","e":["核心考点"]},{"t":"什么是外来词？外来词的译借方式有哪些？","y":"简答题","p":["外来词：从外国语或外族语中连音带义吸收来的词语","单纯音译式（巴士、坦克）","音意混译式（新西兰、冰激凌）","音意兼译式（基因、可口可乐）","音加语素式（啤酒、芭蕾舞）","借音借形式（X光、经济、革命）"],"q":"外来词是指从外国语或外族语中连音带义吸收来的词语。现代汉语外来词的译借方式有五种：(1)单纯音译式，即用汉字直接来译写外语词的读音，如巴士、坦克；(2)音意混译式，即部分音译、部分意译，如新西兰、冰激凌；(3)音意兼译式，即整体音译，同时兼顾意译，如基因、可口可乐；(4)音加语素式，即外来词由音译部分和表示类名的汉语语","w":"high","e":["2014 真题"]},{"t":"外来词的发展趋势是什么？","y":"简答题","p":["大量外来词长期存在，特别是没有意译词的外来词","外来词与意译词长期并存","部分外来词被意译词取代，体现意译化趋势","有些外来词语素汉语化，构词能力强"],"q":"大量外来词在汉语中会长期存在，特别是没有汉语意译词的外来词，如苜蓿、芒果、啤酒、基因、麦当劳等。有时外来词与意译词也会长期并存，如的士——出租汽车、拷贝——复印、巴士——公共汽车等。部分外来词会被意译词所取代，如英语的cement曾被音译为“西门土、水门汀”等，现已被意译词“水泥”所取代。这种意译化趋势是汉语对外来词同","w":"normal","e":["核心考点"]},{"t":"辨析“方言词”和“社区词”。","y":"辨析题","p":["方言词：来源于某一方言且仅限于该方言地域内使用，是地域方言的产物","社区词：反映某一社区政治经济文化特点并只在该社区流通，是社会社区的产物","关键区别：方言词着眼于地域方言，社区词着眼于社会社区"],"q":"方言词和社区词都是特定范围内使用的词语，但来源和反映的内容不同。(1)方言词是指来源于某一方言且仅限于该方言地域内使用的词语，是地域方言的产物，如北京方言词“憋糟”、粤方言词“老窦”。(2)社区词是指反映某一社区政治、经济、文化特点并只在该社区流通的特有词语，是社会社区的产物，反映了不同社区的政治制度、经济体制、文化教","w":"normal","e":["核心考点"]},{"t":"外来词是指从外国语或外族语中______吸收来的词语。","y":"填空题","p":["连音带义"],"q":"连音带义。外来词是指从外国语或外族语中连音带义吸收来的词语。现代汉语外来词的译借方式主要有单纯音译式、音意混译式、音意兼译式、音加语素式、借音借形式。","w":"normal","e":["核心考点"]},{"t":"“克隆、坦克、迪斯科、麦当劳”这些外来词采用的译借方式是（  ）。","y":"单项选择题","p":["A","单纯音译式用汉字直接译写外语词的读音","克隆、坦克、迪斯科都是音译"],"q":"A。单纯音译式即用汉字直接来译写外语词的读音。“克隆(clone)、坦克(tank)、迪斯科(disco)、麦当劳(McDonald)”都是纯音译。","w":"normal","e":["核心考点"]},{"t":"指出下列外来词的译借方式：巴士、新西兰、基因、啤酒、X光。","y":"分析题","p":["巴士：单纯音译式","新西兰：音意混译式","基因：音意兼译式","啤酒：音加语素式","X光：借音借形式"],"q":"现代汉语外来词的译借方式有五种。(1)“巴士(bus)”属于单纯音译式，用汉字直接译写外语词的读音。(2)“新西兰(New Zealand)”属于音意混译式，部分音译、部分意译（“新”意译new，“西兰”音译Zealand）。(3)“基因(gene)”属于音意兼译式，整体音译，同时兼顾意译。(4)“啤酒(beer)”属","w":"normal","e":["核心考点"]}]},{"id":"xdhy_up-c03-s07","t":"第七节 词汇的熟语系统","w":"high","n":19,"k":[{"t":"熟语","y":"名词解释","p":["现代汉语的熟语系统包括五小类：成语、谚语、歇后语、惯用语和习用语。","熟语的特点：(1)结构的定型性；(2)语义的整合性；(3)功能的多样性；(4)语用的民族性。","结构的定型性指熟语的构成成分及其结构关系是固定的；语义的整合性指熟语的意义不是构成成分意义的简单相加；功能的多样性指熟语可以跟词一样按照一定的语法规则组织起来充当多种句子成分；语用的民族性指熟语的形成和使用受民族文化传统的影响。"],"q":"现代汉语的熟语系统包括五小类：成语、谚语、歇后语、惯用语和习用语。","w":"high","e":["教材高频"]},{"t":"成语","y":"名词解释","p":["成语是人们从历史上传承下来并长期使用的结构凝固、语义精辟且具有民族特点的熟语。","成语是熟语中最重要的一种，主要有四个特点：历史的传承性、结构的凝固性、意义的整体性、习用的民族性。","成语主要来源包括神话寓言、历史故事、诗文语句、口头俗语。"],"q":"成语是人们从历史上传承下来并长期使用的结构凝固、语义精辟且具有民族特点的熟语。","w":"high","e":["教材高频"]},{"t":"谚语","y":"名词解释","p":["谚语是民间基于深刻的社会生活经验而提炼出来的通俗、上口、精练、形象而有一定警示或教育意义的熟语。","谚语是人民智慧的结晶，能以浅显的语言表达深刻的道理。","根据谚语所反映的内容，谚语主要包括六种类型：农业谚语、气象谚语、规诫谚语、常识谚语、讽颂谚语、风土谚语。"],"q":"谚语是民间基于深刻的社会生活经验而提炼出来的通俗、上口、精练、形象而有一定警示或教育意义的熟语。","w":"high","e":["教材高频"]},{"t":"歇后语","y":"名词解释","p":["歇后语是指人们口头流传的由像谜面和谜底的前后两部分组成的通俗、风趣、形象而带有隐语性质的熟语。","前一部分是比喻或说出一个事物，类似于谜语的“谜面”，而后一部分则是解释说明，类似于“谜底”，前后两部分在话语中有停顿间歇，后一部分有时不说出来，让人去猜想其含义，所以称为歇后语。","根据歇后语前后两部分的关系以及后一部分与歇后语真实意义的关系，可以分成两类：喻意类和谐音类。"],"q":"歇后语是指人们口头流传的由像谜面和谜底的前后两部分组成的通俗、风趣、形象而带有隐语性质的熟语。","w":"high","e":["教材高频"]},{"t":"惯用语","y":"名词解释","p":["惯用语是群众口头创造并通过修辞手段准确、生动、形象、概括地揭示某些社会现象和某种行为的熟语。","从结构上看，典型的惯用语以三音节的动宾结构为主，也有部分偏正短语，少数主谓短语。","惯用语的整体意义不是其构成成分简单相加的意义，而是通过比喻、借代、夸张、比拟等手法所表达的修辞意义。"],"q":"惯用语是群众口头创造并通过修辞手段准确、生动、形象、概括地揭示某些社会现象和某种行为的熟语。","w":"high","e":["教材高频"]},{"t":"习用语","y":"名词解释","p":["习用语指口语中常用的一些习惯用语，形式不拘但基本固定，意义固化而有趣。","我们不能从字面意思去理解习用语，因为在长期口语使用中，它已经形成了某种特定的意义，但是跟成语、谚语、歇后语和惯用语还是有所不同。"],"q":"习用语指口语中常用的一些习惯用语，形式不拘但基本固定，意义固化而有趣。","w":"high","e":["教材高频"]},{"t":"什么是熟语？它有哪些特点和类型？","y":"简答题","p":["熟语包括成语、谚语、歇后语、惯用语和习用语五小类","结构的定型性","语义的整合性","功能的多样性","语用的民族性"],"q":"现代汉语的熟语系统包括五小类：成语、谚语、歇后语、惯用语和习用语。熟语的特点：(1)结构的定型性，熟语的构成成分及其结构关系是固定的，不能随意替换构成成分或改变结构关系；(2)语义的整合性，熟语的意义不是构成成分意义的简单相加；(3)功能的多样性，熟语可以跟词一样按照一定的语法规则组织起来，充当多种句子成分；(4)语用","w":"high","e":["教材高频"]},{"t":"成语有哪些特点？其来源有哪些？","y":"简答题","p":["成语的四个特点：历史的传承性、结构的凝固性、意义的整体性、习用的民族性","来源：神话寓言、历史故事、诗文语句、口头俗语"],"q":"成语是人们从历史上传承下来并长期使用的结构凝固、语义精辟且具有民族特点的熟语，是熟语中最重要的一种，主要有四个特点：历史的传承性、结构的凝固性、意义的整体性、习用的民族性。大多数成语沿袭自神话寓言、历史故事、诗文语句或口头俗语。","w":"high","e":["教材高频"]},{"t":"谚语和成语有什么区别？","y":"简答题","p":["字数形式差异：成语多为四字且定型，谚语不受字数限制且有多种表现形式","句法功能差异：成语相当于词可作句子成分，谚语多为引用语独立成句","语体风格差异：成语书面语性强，谚语口语性强"],"q":"谚语和成语的区别主要在三个方面：1.字数形式差异。绝大多数成语是四个字，而谚语则不受字数限制，甚至有很多谚语不止一个句子；成语比较定型，而谚语往往有多重表现形式。2.句法功能差异。成语一般表示的是概念，相当于词，一般可作句子成分；而谚语表示的则是命题和推理，多数作为引用语而独立成句。3.语体风格差异。成语一般书面语性强","w":"high","e":["教材高频"]},{"t":"什么是歇后语？它可分为哪两类？其形象材料的来源有哪些？","y":"简答题","p":["歇后语由像谜面和谜底的前后两部分组成","分喻意类和谐音类","喻意类：前部分比喻，后部分解释","谐音类：后部分通过谐音双关说明本意","形象材料来源：神话传说、历史故事、虚拟形象、日常现象"],"q":"歇后语是指人们口头流传的由像谜面和谜底的前后两部分组成的通俗、风趣、形象而带有隐语性质的熟语。根据歇后语前后两部分的关系以及后一部分与歇后语真实意义的关系，可以分成两类：喻意类和谐音类。喻意类前一部分是形象比喻，后一部分则是对比喻的解释；谐音类前一部分是描述形象，后一部分通过谐音双关说明歇后语的本意。歇后语形象材料的主","w":"high","e":["教材高频"]},{"t":"什么是惯用语？其结构类型有哪些？","y":"简答题","p":["惯用语：群众口头创造的揭示某些社会现象和行为的熟语","典型以三音节的动宾结构为主","也有部分偏正短语，少数主谓短语","整体意义是通过比喻、借代、夸张、比拟等表达的修辞意义"],"q":"惯用语是群众口头创造并通过修辞手段准确、生动、形象、概括地揭示某些社会现象和某种行为的熟语。从结构上看，典型的惯用语以三音节的动宾结构为主，也有部分偏正短语，少数主谓短语。惯用语的整体意义不是其构成成分简单相加的意义，而是通过比喻、借代、夸张、比拟等手法所表达的修辞意义。","w":"high","e":["教材高频"]},{"t":"什么是习用语？它与成语、谚语等有什么不同？","y":"简答题","p":["习用语：口语中常用的一些习惯用语，形式不拘但基本固定","意义固化而有趣，不能从字面意思去理解","与成语、谚语、歇后语和惯用语有所不同"],"q":"习用语指口语中常用的一些习惯用语，形式不拘但基本固定，意义固化而有趣。我们不能从字面意思去理解，因为在长期口语使用中，它已经形成了某种特定的意义，但是跟成语、谚语、歇后语和惯用语还是有所不同，如“不好意思”“意思意思”“巴不得”“留了一手”等。","w":"normal","e":["核心考点"]},{"t":"试论述现代汉语熟语系统的五个小类及其特点。","y":"论述题","p":["熟语五小类：成语、谚语、歇后语、惯用语、习用语","成语：传承性、凝固性、整体性、民族性","谚语：通俗上口精练，含六种类型","歇后语：谜面谜底结构，分喻意类和谐音类","惯用语：以三音节动宾结构为主","习用语：口语习惯用语，意义固化"],"q":"现代汉语的熟语系统包括五小类：成语、谚语、歇后语、惯用语和习用语。（一）成语是人们从历史上传承下来并长期使用的结构凝固、语义精辟且具有民族特点的熟语，具有历史的传承性、结构的凝固性、意义的整体性、习用的民族性四个特点，主要来源于神话寓言、历史故事、诗文语句、口头俗语。（二）谚语是民间基于深刻的社会生活经验而提炼出来的通","w":"high","e":["2015 真题"]},{"t":"辨析“成语”“谚语”“歇后语”“惯用语”。","y":"辨析题","p":["成语：多四字格，书面语性强，结构凝固，相当于词","谚语：通俗上口，不受字数限制，多独立成句","歇后语：谜面谜底两部分组成，带隐语性质","惯用语：以三音节动宾结构为主"],"q":"四者都是熟语，区别如下：(1)成语是人们从历史上传承下来的结构凝固、语义精辟且具有民族特点的熟语，多为四字格，书面语性强，相当于词，一般作句子成分；(2)谚语是民间提炼出来的通俗、上口、精练、形象而有一定警示或教育意义的熟语，不受字数限制，多为独立成句，口语性强；(3)歇后语是由像谜面和谜底的前后两部分组成的带有隐语性","w":"high","e":["教材高频"]},{"t":"“三个臭皮匠，顶个诸葛亮”是成语。（  ）","y":"判断题","p":["判断：错误","“三个臭皮匠，顶个诸葛亮”是谚语","谚语不受字数限制，成语多为四字"],"q":"错误。“三个臭皮匠，顶个诸葛亮”是谚语，不是成语。成语绝大多数是四个字，比较定型；谚语则不受字数限制，甚至有很多谚语不止一个句子，形式多样。“三个臭皮匠，顶个诸葛亮”就属于常识谚语。","w":"normal","e":["核心考点"]},{"t":"现代汉语的熟语系统包括五小类：成语、谚语、歇后语、惯用语和______。","y":"填空题","p":["习用语"],"q":"习用语。现代汉语的熟语系统包括五小类：成语、谚语、歇后语、惯用语和习用语。熟语具有结构的定型性、语义的整合性、功能的多样性、语用的民族性。","w":"normal","e":["核心考点"]},{"t":"“姜太公钓鱼——愿者上钩”属于（  ）。","y":"单项选择题","p":["A","歇后语分喻意类和谐音类","“姜太公钓鱼——愿者上钩”属于喻意类"],"q":"A。歇后语是由像谜面和谜底的前后两部分组成的熟语，分喻意类和谐音类。“姜太公钓鱼——愿者上钩”后一部分是对前一部分比喻的解释，属于喻意类歇后语。","w":"normal","e":["核心考点"]},{"t":"“走后门、开绿灯、碰钉子、炒鱿鱼”属于（  ）。","y":"单项选择题","p":["A","惯用语以三音节动宾结构为主","“走后门、开绿灯”等是惯用语"],"q":"A。惯用语是群众口头创造并通过修辞手段揭示某些社会现象和某种行为的熟语，从结构上看，典型的惯用语以三音节的动宾结构为主。“走后门、开绿灯、碰钉子、炒鱿鱼”都是三音节动宾结构的惯用语。","w":"normal","e":["核心考点"]},{"t":"指出下列成语的结构类型：夜郎自大、平分秋色、重于泰山、近水楼台、指鹿为马、先礼后兵。","y":"分析题","p":["夜郎自大：主谓关系","平分秋色：述宾关系","重于泰山：述补关系","近水楼台：偏正关系","指鹿为马：兼语关系","先礼后兵：连动关系"],"q":"成语属于短语结构的主要分为主谓、述宾、述补、偏正、兼语、连动和联合七种结构类型。(1)“夜郎自大”是主谓关系。(2)“平分秋色”是述宾关系。(3)“重于泰山”是述补关系。(4)“近水楼台”是偏正关系。(5)“指鹿为马”是兼语关系。(6)“先礼后兵”是连动关系。","w":"normal","e":["核心考点"]}]},{"id":"xdhy_up-c03-s08","t":"第八节 词汇的发展与规范","w":"high","n":19,"k":[{"t":"异形词","y":"名词解释","p":["异形词是指语义相同或相近，而词的书写形式和语音形式不同的词。","书写形式不同的词主要分为三类：同素颠倒词、异形等义词、异形外来词。","同素颠倒词指语素相同而词序相反的异形词，可以分成取A弃B类、AB并存类、AB分工类；异形等义词指一个语素位置和字形相同，另一个语素位置相同而字形不同的异形词；异形外来词指因引进方法不同或引进地区不同而造成外来词在书写形式和发音形式上都不同。"],"q":"异形词是指语义相同或相近，而词的书写形式和语音形式不同的词。","w":"high","e":["教材高频"]},{"t":"异读词","y":"名词解释","p":["异读词是指意义和书写形式都相同而读音形式不同的词。","造成异读词的原因主要有以下几个方面：(1)读书音(文读)和口语音(白读)的分歧；(2)方言读音的影响；(3)古代汉语多音字沿用至今；(4)语音的自然发展；(5)讹读的影响。","规范异读词读音的三个原则是：合并原则、从俗原则、区别原则。"],"q":"异读词是指意义和书写形式都相同而读音形式不同的词。","w":"high","e":["教材高频"]},{"t":"生造词","y":"名词解释","p":["生造词是指为了标新立异，一些个人不遵循造词规律而任意拼凑语素造出来的词义含糊不清的词语。","生造词既没有指称新事物和新概念，也没有表达社会变革和社会心理的特殊效果。","生造词的形成方式主要包括：任意简缩、随意破词、随便拼凑。"],"q":"生造词是指为了标新立异，一些个人不遵循造词规律而任意拼凑语素造出来的词义含糊不清的词语。","w":"high","e":["教材高频"]},{"t":"误用词","y":"名词解释","p":["误用词是指词语本身没有问题，由于使用者对词义及其色彩义的理解有误或受词形、字音的影响而误用的词语。","误用词的词语本身没有问题，问题在于使用者的使用不当。","误用词的成因包括对词义及色彩义理解有误，或受词形、字音的影响。"],"q":"误用词是指词语本身没有问题，由于使用者对词义及其色彩义的理解有误或受词形、字音的影响而误用的词语。","w":"high","e":["教材高频"]},{"t":"规范意识与动态观念","y":"名词解释","p":["从总体上看，词汇的规范是相对的，而词汇的发展变化却是绝对的，因此，我们必须运用动态发展的眼光看待词汇的规范。","词汇规范的必要性体现在两个方面：一是词汇系统存在着不规范现象，比如异形词、异读词；二是词汇使用中存在着不规范现象，比如生造词、误用词。","词汇是在不断发展变化的，旧词的消亡、新词的产生，随时随地都在发生，因此，我们必须具有动态的发展观，处理好规范意识与动态观念的互动关系。"],"q":"从总体上看，词汇的规范是相对的，而词汇的发展变化却是绝对的，因此，我们必须运用动态发展的眼光看待词汇的规范。","w":"high","e":["教材高频"]},{"t":"什么是异形词？它可以分为哪几类？","y":"简答题","p":["异形词：语义相同或相近而书写形式和语音形式不同的词","同素颠倒词：语素相同词序相反","异形等义词：一个语素字形不同","异形外来词：引进方法或地区不同"],"q":"异形词是指语义相同或相近，而词的书写形式和语音形式不同的词。书写形式不同的词主要分为三类：同素颠倒词、异形等义词、异形外来词。同素颠倒词指语素相同而词序相反的异形词，可以分成取A弃B类、AB并存类、AB分工类；异形等义词指一个语素位置和字形相同，另一个语素位置相同而字形不同的异形词，包括AB保留类和AB取舍类；异形外来","w":"normal","e":["核心考点"]},{"t":"异形等义词的取舍需要遵循哪些原则？","y":"简答题","p":["从俗原则：如选“思维、保姆、按语”","从简原则：如选“人才、暗淡、噩梦”","明确原则：如选“盯梢、吩咐、筹码、酒盅”"],"q":"异形等义词的取舍需要根据三条原则对A形词和B形词进行鉴别、取舍。一是从俗原则，如选择“思维、保姆、按语”，而舍弃“思惟、保母、案语”；二是从简原则，如选择“人才、暗淡、噩梦、舳板”，而舍弃“人材、黯淡、恶梦、舳舨”；三是明确原则，如选择“盯梢、吩咐、筹码、酒盅”，而舍弃“钉梢、分付、筹马、酒钟”。","w":"normal","e":["核心考点"]},{"t":"什么是异读词？造成异读词的原因有哪些？规范异读词读音的原则是什么？","y":"简答题","p":["异读词：意义和书写形式相同而读音不同的词","原因：文白分歧、方言影响、古多音字沿用、语音自然发展、讹读影响","规范原则：合并原则、从俗原则、区别原则"],"q":"异读词是指意义和书写形式都相同而读音形式不同的词。造成异读词的原因主要有以下几个方面：(1)读书音(文读)和口语音(白读)的分歧；(2)方言读音的影响；(3)古代汉语多音字沿用至今；(4)语音的自然发展；(5)讹读的影响。规范异读词读音的三个原则是：(1)合并原则；(2)从俗原则；(3)区别原则，主要是区别文白异读。","w":"high","e":["2010 真题"]},{"t":"什么是生造词？它的形成方式有哪些？","y":"简答题","p":["生造词：为标新立异、不遵循造词规律任意拼凑语素造出的词义含糊的词语","形成方式：任意简缩、随意破词、随便拼凑","既没指称新事物新概念，也没特殊表达效果"],"q":"生造词是指为了标新立异，一些个人不遵循造词规律而任意拼凑语素造出来的词义含糊不清的词语。生造词既没有指称新事物和新概念，也没有表达社会变革和社会心理的特殊效果。生造词的形成方式主要包括：任意简缩、随意破词、随便拼凑。任意简缩如“教质”（教学质量）；随意破词包括插入词语的破词、添加实词的破词、添加虚词的破词；随便拼凑如“","w":"normal","e":["核心考点"]},{"t":"什么是误用词？它与生造词有什么区别？","y":"简答题","p":["误用词：词语本身没问题，因理解有误或受词形字音影响而误用","生造词是词语本身就不规范","误用词是词语本身规范，问题在于使用不当"],"q":"误用词是指词语本身没有问题，由于使用者对词义及其色彩义的理解有误或受词形、字音的影响而误用的词语。与生造词的区别在于：生造词是词语本身就不规范（任意拼凑语素），而误用词是词语本身没有问题，问题在于使用者的使用不当，如“学历”应为“学力”，“必需”应改为“必须”。","w":"normal","e":["核心考点"]},{"t":"词汇规范的必要性体现在哪些方面？如何处理好规范与发展的关系？","y":"简答题","p":["必要性一：词汇系统存在不规范现象（异形词、异读词）","必要性二：词汇使用存在不规范现象（生造词、误用词）","词汇不断发展变化，须具有动态发展观","规范是相对的，发展变化是绝对的"],"q":"现代汉语词汇规范的必要性体现在两个方面：一是词汇系统存在着不规范现象，比如异形词、异读词；二是词汇使用中存在着不规范现象，比如生造词、误用词。此外，词汇是在不断发展变化的，旧词的消亡、新词的产生，随时随地都在发生，因此，我们必须具有动态的发展观，处理好规范意识与动态观念的互动关系。从总体上看，词汇的规范是相对的，而词汇","w":"high","e":["教材高频"]},{"t":"试论述现代汉语词汇的规范对象及如何处理好规范与发展的关系。","y":"论述题","p":["词汇规范必要性：系统不规范（异形词、异读词）与使用不规范（生造词、误用词）","词汇系统的规范：异形词、异读词","词汇使用的规范：生造词、误用词","规范意识与动态观念：规范是相对的，发展变化是绝对的","须运用动态发展眼光看待词汇规范"],"q":"现代汉语词汇规范的必要性体现在两个方面：一是词汇系统存在着不规范现象，比如异形词、异读词；二是词汇使用中存在着不规范现象，比如生造词、误用词。（一）词汇系统的规范。异形词是指语义相同或相近而书写形式和语音形式不同的词，包括同素颠倒词、异形等义词、异形外来词，需规范以去掉语义相同而文字形式或语音形式存在差异的词语；异读词","w":"high","e":["2016 真题"]},{"t":"辨析“生造词”和“误用词”。","y":"辨析题","p":["生造词：不遵循造词规律任意拼凑语素造出的词义含糊的词语，词语本身不规范","误用词：词语本身没问题，因理解有误或受词形字音影响而误用","关键区别：生造词是词语本身不规范，误用词是使用不当"],"q":"二者都是词汇使用中的不规范现象，但性质不同。(1)生造词是指为了标新立异，一些个人不遵循造词规律而任意拼凑语素造出来的词义含糊不清的词语，其词语本身就是新的、不规范的，形成方式包括任意简缩、随意破词、随便拼凑，如“教质”（教学质量）。(2)误用词是指词语本身没有问题，由于使用者对词义及其色彩义的理解有误或受词形、字音的","w":"normal","e":["核心考点"]},{"t":"异读词是指意义和书写形式都相同而读音形式不同的词。（  ）","y":"判断题","p":["判断：正确","异读词：意义和书写形式相同而读音不同","举例：汲(jí)(jī)、谁(shuí)(shéi)"],"q":"正确。异读词是指意义和书写形式都相同而读音形式不同的词。如“汲(jí)(jī)”“谁(shuí)(shéi)”“波浪(bōlàng)(pōlàng)”。造成异读词的原因有文白分歧、方言影响、古多音字沿用、语音自然发展、讹读影响等。","w":"normal","e":["核心考点"]},{"t":"词汇的规范是绝对的，发展变化是相对的。（  ）","y":"判断题","p":["判断：错误","词汇的规范是相对的","词汇的发展变化是绝对的"],"q":"错误。从总体上看，词汇的规范是相对的，而词汇的发展变化却是绝对的，因此，我们必须运用动态发展的眼光看待词汇的规范。新旧词语在不断更替，“卖萌、给力、网红”等新词语从出现到进入普通话词汇，就是在不断使用中从不规范到逐渐被接受再到规范认可的过程。","w":"normal","e":["核心考点"]},{"t":"异形词是指语义相同或相近，而词的书写形式和______形式不同的词。","y":"填空题","p":["语音"],"q":"语音。异形词是指语义相同或相近，而词的书写形式和语音形式不同的词。书写形式不同的词主要分为同素颠倒词、异形等义词、异形外来词三类。","w":"normal","e":["核心考点"]},{"t":"“思维—思惟、保姆—保母、按语—案语”的规范取舍遵循的原则是（  ）。","y":"单项选择题","p":["A","异形等义词取舍三原则：从俗、从简、明确","选“思维、保姆、按语”属于从俗原则"],"q":"A。异形等义词的取舍有三条原则：从俗原则、从简原则、明确原则。选择“思维、保姆、按语”而舍弃“思惟、保母、案语”，遵循的是从俗原则（选择群众习惯的写法）。","w":"normal","e":["核心考点"]},{"t":"指出下列例句中的误用词并改正：①招生对象为应届高中毕业生和同等学历……②母亲年轻时有一头丰满的黑发……③……必需拿出史料为据……④他是敢于摔了铁饭碗而干个体的始作俑者。","y":"分析题","p":["“学历”应为“学力”","“丰满”应为“浓密”","“必需”应为“必须”","“始作俑者”为贬义词，应改为“第一人”"],"q":"误用词是指词语本身没有问题，由于使用者对词义及其色彩义的理解有误或受词形、字音的影响而误用的词语。(1)“学历”应该为“学力”（指学问的程度、能力）。(2)“丰满”应该用“浓密”（形容头发多而密）。(3)“必需”应该用“必须”（副词，表示事理上和情理上的必要）。(4)“始作俑者”属于贬义词，指开始用俑殉葬的人，比喻首开","w":"normal","e":["核心考点"]},{"t":"分析下列词的异形词类型及规范原则：①裁剪—剪裁；②师傅—师父；③水泥（曾音译作“水门汀”）。","y":"分析题","p":["裁剪—剪裁：同素颠倒词（AB分工类）","师傅—师父：异形等义词（AB保留类）","水泥—水门汀：异形外来词（引进方法差异类）","异形外来词现在以意译词占优势，音译词正在淘汰"],"q":"异形词是指语义相同或相近，而词的书写形式和语音形式不同的词，分同素颠倒词、异形等义词、异形外来词三类。(1)“裁剪—剪裁”语素相同而词序相反，属于同素颠倒词，且属于AB分工类（各有分工）。(2)“师傅—师父”一个语素位置和字形相同，另一个语素字形不同，属于异形等义词，属于AB保留类（二者已有分工）。(3)“水泥—水门汀","w":"normal","e":["核心考点"]}]}]}]},{"d":"xdhy_down","t":"现代汉语通论（下册）","c":[{"id":"xdhy_down-c01","t":"第四章 语法","w":"high","s":[{"id":"xdhy_down-c01-s01","t":"第一节 现代汉语语法概述","w":"high","n":15,"k":[{"t":"语法","y":"名词解释","p":["制约着句子组合合法性的规则就是“语法”","语法是语言不可缺少的有机的组成部分","语音是语言的物质外壳，词汇是语言的建筑材料，语法是语言的构造规则","词语的组合绝不是任意的，符合规则句子就合法，否则就不合法"],"q":"语法是制约着句子组合合法性的规则。语音、词汇、语法三大部分构成语言的主体，语法是语言的构造规则。世界上任何语言都是有语法的，词语的组合不是任意的，符合规则句子就合法，否则就不合法。","w":"high","e":["2016 真题","2019 真题"]},{"t":"现代汉语最根本的总特点是什么？它具体表现为哪四个方面？","y":"简答题","p":["不依赖严格意义的形态变化，而借助于语序、虚词等其他语法手段来表示语法关系和语法意义","（一）语序的变化对语法结构和语法意义起重大影响","（二）虚词的运用对语法结构和语法意义有重要作用","（三）汉语的词类和句子成分不存在简单的一一对应的关系","（四）短语结构跟句子结构以及词的结构基本一致"],"q":"现代汉语最根本的总特点是：不依赖严格意义的形态变化，而借助于语序、虚词等其他语法手段来表示语法关系和语法意义。这一总特点具体表现为以下四个方面：（一）语序的变化对语法结构和语法意义起重大影响；（二）虚词的运用对语法结构和语法意义有重要作用；（三）汉语的词类和句子成分不存在简单的一一对应的关系；（四）短语结构跟句子结构以","w":"high","e":["2015 真题","2018 真题","2021 真题"]},{"t":"试论述汉语句法与西方印欧语在“短语结构跟句子结构以及词的结构基本一致”这一特点上的差异。","y":"论述题","p":["英语句子的谓语部分都必须有一个限定动词，短语里不允许有限定动词","汉语的动词在任何场合形式都不变","汉语的一个自由短语给予语调在特定语境里出现就可成为一个句子","汉语的多音节词主要是从短语的临时性组合发展而来，词的结构跟短语结构大体一致","短语跟句子是不同层次的语言单位，黏着短语即使给语调也不能独立成句"],"q":"英语的句子结构跟短语的结构有明显区别，英语句子的谓语部分都必须有一个限定动词，而短语里是不允许有限定动词的，如果要出现动词，就必须采用动词不定式或动名词的形式。例如：He flies a plane.（他开飞机。）/ To fly a plane is easy.（开飞机容易。）/ Flying a plane is ","w":"high","e":["2017 真题"]},{"t":"汉语语序变化这一语法手段可分哪三个不同层面的情况？请分别举例说明。","y":"简答题","p":["语用的语序变化：临时性移位，基本语义和语法结构关系都没有变化，只增加语用意义","语义的语序变化：语义角色关系发生变化，语义明显不同","语法的语序变化：语法结构关系随之改变，语义也改变"],"q":"汉语语序变化这一语法手段，实际上有三类不同层面的情况：（1）语用的语序变化：这是在语言交际使用时出现的临时性的移位，实际上基本语义和语法结构关系都没有变化，只是增加了一些语用意义，属于句子的一种动态变化。如“你快走吧！——快走吧，你！”（2）语义的语序变化：词语的次序替换，虽然没有引起语法结构关系的变化，但是语义却有明","w":"normal","e":["核心考点"]},{"t":"在印欧语里，词类和句法成分之间往往存在着一种简单的对应关系，大多是一对一，少数是一对二。（　）","y":"判断题","p":["印欧语中词类与句法成分多为一对一，少数一对二"],"q":"正确。在印欧语里，词类和句法成分之间往往存在着一种简单的对应关系，大多是一对一，少数是一对二，如动词——谓语，形容词——定语，副词——状语，名词——主语或宾语。","w":"normal","e":["核心考点"]},{"t":"下列说法符合汉语词类与句法成分关系特点的是（　　）。","y":"单项选择题","p":["B","汉语副词基本上只能作状语","其余词类都是一对多","印欧语词类属于“性格演员”，汉语属于“多功能演员”"],"q":"B。汉语里词类跟句法成分之间的关系比较复杂，除了副词基本上只能作状语，属于一对一之外，其余的都是一对多，即一种词类可以作多种句法成分。印欧语的词类基本上属于“性格演员”，汉语的词类则是“多功能演员”。","w":"normal","e":["核心考点"]},{"t":"有的语言偏重于形态变化，例如法语、俄语，称为“______语言”；有的语言偏重于词序变化和虚词运用，例如汉语，称为“______语言”。","y":"填空题","p":["综合性语言","分析性语言"],"q":"综合性语言；分析性语言","w":"normal","e":["核心考点"]},{"t":"传统语法","y":"名词解释","p":["又称“规范语法”或“学校语法”","分为词法和句法两大部分，以词法为主","划分词类主要依据形态变化","注重书面语分析","语法规则被看作一种规范和标准"],"q":"传统语法又称为“规范语法”或“学校语法”，从语法学产生就形成了，在教育界的影响是根深蒂固的。其特点主要分为词法和句法两大部分，并以词法为主；划分词类主要依据形态变化；注重书面语分析；语法规则被看作规范和标准。","w":"normal","e":["核心考点"]},{"t":"描写语法","y":"名词解释","p":["又叫“结构主义语法”","创始人为瑞士语言学家索绪尔","经典著作是《普通语言学教程》","提出“组合”和“聚合”两大结构关系","运用“直接成分分析法”对句法结构进行层次分析"],"q":"描写语法又叫“结构主义语法”，是在对传统语法批判的基础上形成的。创始人为索绪尔，经典著作是《普通语言学教程》。特点：区分语言和言语；提出组合和聚合两大结构关系；根据“分布”划分词类；强调层次，运用直接成分分析法。","w":"high","e":["2014 真题"]},{"t":"形式语法又叫“转换语法”或“生成语法”，创始人是美国的______，这一理论的提出被称为“语言学史上的一场革命”。","y":"填空题","p":["乔姆斯基","Chomsky"],"q":"乔姆斯基（Chomsky）","w":"normal","e":["核心考点"]},{"t":"汉语语法学的建立，通常认为应该以（　　）的出版为标志。","y":"单项选择题","p":["A","1898年《马氏文通》","马建忠","第一个以字为本位的语法体系"],"q":"A。汉语语法学的建立，通常认为应该以1898年《马氏文通》的出版为标志。马建忠的《马氏文通》以古代汉语为研究对象，仿照拉丁语法建立了第一个以字(即“词”)为本位的语法体系。","w":"normal","e":["核心考点"]},{"t":"黎锦熙《新著国语文法》与马建忠《马氏文通》相比有什么特点？","y":"简答题","p":["《马氏文通》以古代汉语为研究对象，建立了第一个以字为本位的语法体系","黎锦熙《新著国语文法》(1924)以现代汉语为研究对象","仿照纳氏文法建立了一个句本位的语法新体系","在中学语文学界产生过深远影响"],"q":"马建忠的《马氏文通》以古代汉语为研究对象，仿照拉丁语法建立了第一个以字(即“词”)为本位的语法体系，虽然不够精细，但毕竟是第一次，所以草创之功不可抹杀。黎锦熙的《新著国语文法》(商务印书馆，1924)则以现代汉语为研究对象，仿照纳氏文法建立了一个句本位的语法新体系，这一体系在中学语文学界产生过深远影响。","w":"normal","e":["核心考点"]},{"t":"20世纪80年代以朱德熙为代表的语法思想占据主导地位，其特色是什么？","y":"简答题","p":["提出“短语本位”，提高了短语结构的地位","宣称“语法研究的最终目的是弄清楚语法形式和语法意义之间的关系”","加强横向的方言语法研究和纵向的历史语法研究","胡裕树和张斌提出“句法、语义、语用”三个平面的思想"],"q":"20世纪80年代是后结构主义语法一统天下的局面，以朱德熙为代表的语法思想占据主导地位。其特色是：第一，提出“短语本位”，强化了短语研究，大大提高了短语结构在汉语语法中的地位。第二，宣称“语法研究的最终目的是弄清楚语法形式和语法意义之间的关系”，从而大大加强了语义在句法研究中的作用。第三，指出需要加强横向的方言语法研究以","w":"normal","e":["核心考点"]},{"t":"人们越来越认识到：语法研究和学习的最终目标应该是揭示语义的______、句法的______、语用的______以及认知的______。","y":"填空题","p":["决定性","强制性","选择性","解释性"],"q":"决定性；强制性；选择性；解释性","w":"high","e":["2019 真题"]},{"t":"判断：语法具有抽象性、稳固性和民族性。（　）","y":"判断题","p":["现代汉语总特点：不依赖形态变化，借助语序、虚词","语法具有抽象性、稳固性、民族性"],"q":"正确。现代汉语最根本的总特点是：不依赖严格意义的形态变化，而借助于语序、虚词等其他语法手段来表示语法关系和语法意义。语法规律是从大量的语言事实中概括出来的，具有高度的抽象性；语法规则相对稳定，变化缓慢，具有稳固性；各民族语言的语法各有特点，具有民族性。","w":"normal","e":["核心考点"]}]},{"id":"xdhy_down-c01-s02","t":"第二节 词类和功能分析法","w":"high","n":35,"k":[{"t":"词类","y":"名词解释","p":["词类专指词的语法类别","不同的词类在形态、意义和功能等方面表现出区别性特点","划分词类的目的是为了说明语言的构造规则","词类是一个有层次的系统"],"q":"词类专指词的语法类别，不同的词类在形态、意义和功能等方面都表现出一些区别性的特点。划分词类的目的是为了说明语言的构造规则。现代汉语通常认为有十四个词类，词类是一个有层次的系统。","w":"high","e":["2013 真题","2018 真题"]},{"t":"划分词类的标准主要有哪三个？它们在汉语词类划分中的地位如何？","y":"简答题","p":["形态标准：最简单最明显最可靠，但在汉语中只能作为辅助标准","意义标准：可以帮助快捷确定词性，但意义模糊，只能作为参考标准","功能标准：主要指词的组合能力，是主要标准，比较可靠有效","汉语的词类划分主要依靠功能标准，形态为辅助标准，意义为参考标准"],"q":"划分词类的标准主要有三个：（1）形态标准。这应该是最简单、最明显，也最可靠的标准，但汉语无论是形态标志还是形态变化都比较少，只能够作为辅助标准。（2）意义标准。词语，特别是实词，都是有具体意义的，可以帮助我们快捷地确定一个词的词性，但意义往往是模糊的，很难作为一种可以严格操作的标准，意义只能是划分词类的参考标准。（3）","w":"high","e":["2015 真题","2020 真题"]},{"t":"语法功能","y":"名词解释","p":["词的组合能力","能否与其他的词组合成短语","以什么顺序组合","组合以后表示什么关系","作句法成分的能力"],"q":"所谓语法功能是指词的组合能力，即能够跟哪些词组合，不能跟哪些词组合。组合能力有三重含义：能否与其他的词组合成短语；以什么顺序组合；组合以后表示什么关系。组合能力也包括作句法成分的能力。","w":"normal","e":["核心考点"]},{"t":"辨析“忽然”与“突然”的词性。","y":"辨析题","p":["两者意义几乎一样","“忽然”只能够作状语，是副词","“突然”能作状语、补语、定语，还可受“很”修饰，是形容词","意义相同或类似而句法作用不同时，意义反而会产生误导"],"q":"“忽然”，表示“来得迅速而又出乎意料”；“突然”，表示“在短促时间里发生，出乎意外”。这两个词的意义几乎一样，似乎应该属于同一词类，其实不然。因为“忽然”只能够作状语，而“突然”除了作状语之外，还可以作补语(他来得突然)、定语(突然事件)，也可以受副词“很”的修饰(很突然)。因此，“忽然”是副词，“突然”则为形容词。这","w":"high","e":["2017 真题"]},{"t":"“金、银”和“铜、铁、锡”都表示金属，因此它们属于同一个词类。（　）","y":"判断题","p":["错误","“金、银”是区别词，“铜、铁、锡”是名词","判断依据是组合能力而非意义"],"q":"错误。“金、银”和“铜、铁、锡”都表示金属，但却不是一个词类。“铜、铁、锡”可以单说，而“金、银”却不能单说，必须说成“金子、银子”；可以用数量短语去修饰“铜、铁、锡”，却不能直接修饰“金、银”。这说明“金、银”是区别词，“铜、铁、锡”是名词。可见，意义只能是划分词类的参考标准。","w":"normal","e":["核心考点"]},{"t":"能充当句法成分的词是______，不能充当句法成分的词是______。","y":"填空题","p":["实词","虚词"],"q":"实词；虚词","w":"normal","e":["核心考点"]},{"t":"实词与虚词有哪几个重要的区别性特征？","y":"简答题","p":["开放/封闭：实词数量开放，虚词可数有限，属封闭类","自由/黏着：实词可自由运用，虚词必须黏附在实词前后","不定位/定位：实词位置不固定，虚词位置相对固定"],"q":"实词与虚词有几个重要的区别性特征：（1）开放/封闭。实词的数量基本上是开放的，虚词则是可数的，有限的，不会轻易增加或减少，所以又叫“封闭”类。（2）自由/黏着。实词可以自由运用，虚词不能单独成句，不能单独回答问题，必须黏附在实词前后才能发挥作用。如“早饭你吃了没有?”可以回答“吃了”，但不能只回答“了”。（3）不定位/","w":"normal","e":["核心考点"]},{"t":"实词内部可再分为“______”与“______”。前者包括名词、动词、形容词三类；后者包括数词、量词、代词、区别词、副词、叹词、拟声词七类。","y":"填空题","p":["主体词","功能词"],"q":"主体词；功能词","w":"normal","e":["核心考点"]},{"t":"名词的语法特点是什么？","y":"简答题","p":["大多可以受数量短语的修饰","主要充当主语、宾语和定语，决不能作补语，一般不能作状语","不能受否定副词“不”的修饰","通常不能重叠"],"q":"名词的语法特点是：①大多可以受数量短语的修饰。②主要充当主语、宾语和定语，决不能作补语，一般不能作状语。③不能受否定副词“不”的修饰。④通常不能重叠。","w":"high","e":["教材高频"]},{"t":"方位词","y":"名词解释","p":["一般附着在其他名词之后，表示处所","有的也可以独立使用","分为单纯方位词、合成方位词和特殊方位词三类"],"q":"方位词一般附着在其他名词之后，表示处所；有的也可以独立使用。方位词分为单纯方位词、合成方位词和特殊方位词三类。","w":"normal","e":["核心考点"]},{"t":"单纯方位词有14个：上、下、前、后、左、右、里、外、______、______、______、______、内、中。","y":"填空题","p":["东","西","南","北"],"q":"东、西、南、北","w":"normal","e":["核心考点"]},{"t":"处所词的三个小类及其语法特点是什么？","y":"简答题","p":["能够独立使用的方位词","表示处所的名词","表示地名、机构的名词","能用在动词“在”“到”“往”后作宾语","能用“哪儿”提问","能用“这儿”“那儿”指代"],"q":"处所词有三小类：(1)能够独立使用的方位词。(2)表示处所的名词，例如：附近、近处、远处、高处、低处、明处、暗处、周围等。(3)表示地名、机构的名词，例如：亚洲、中国、北京、北京大学、商店、邮局等。处所词的语法特点是：①能用在动词“在”“到”或“往”的后面作宾语。②能用“哪儿”提问。③能用“这儿”“那儿”指代。表示地名","w":"normal","e":["核心考点"]},{"t":"动词的语法特点是什么？","y":"简答题","p":["主要作谓语","及物动词能带宾语","能受否定副词“不”修饰；除心理动词、能愿动词外不能受“很”修饰","动作动词多数能够重叠","大多数动词可以带时态助词“了”“着”或“过”"],"q":"动词的语法特点是：①主要作谓语。②及物动词能带宾语。③能受否定副词“不”修饰；除了心理动词、能愿动词，不能受程度副词“很”修饰。④动作动词多数能够重叠。⑤大多数动词可以带时态助词“了”“着”或“过”。","w":"high","e":["教材高频"]},{"t":"辨析及物动词与不及物动词。","y":"辨析题","p":["及物动词：只要能带宾语，不管带的是什么类型的宾语","不及物动词：不能带任何宾语","只能带施事宾语或处所宾语的也应归为及物动词","同一动词不同义项可归入不同小类"],"q":"(1)及物动词：只要能带宾语，不管带的是什么类型的宾语，都是及物动词。例如：吃、喝、拿、摸、打、来、去、走、坐、跑、取得、推广、发扬、选举、团结、修改、搜集、尊敬、服从、免得、惯于、进行、禁止、开展、受到、防止、觉得、感到、懒得、认为、以为、主张、打算、停止、继续、能够、可以、应该、愿意、敢于、值得等。(2)不及物动词","w":"normal","e":["核心考点"]},{"t":"传统上，动词按照意义并且参考功能可以分为八类，包括动作动词、______、心理动词、存现动词、______、______、判断动词、形式动词。","y":"填空题","p":["使令动词","趋向动词","能愿动词"],"q":"使令动词；趋向动词；能愿动词","w":"normal","e":["核心考点"]},{"t":"能愿动词","y":"名词解释","p":["也叫助动词","表示可能、必要或意愿","只能带动词性宾语","可以构成“不V不”格式"],"q":"能愿动词也叫助动词，表示可能、必要或意愿。语法特点是只能带动词性宾语，可以构成“不V不”格式。","w":"normal","e":["核心考点"]},{"t":"形容词的语法特点是什么？形容词包括哪两类？","y":"简答题","p":["多数能够受否定副词“不”和程度副词“很”的修饰","常作谓语、定语和补语","不能带宾语","部分形容词能够重叠","包括性质形容词和状态形容词两类"],"q":"形容词的语法特点是：①多数能够受否定副词“不”和程度副词“很”的修饰。②常作谓语、定语和补语。③不能带宾语。④部分形容词能够重叠。形容词包括性质形容词和状态形容词两类。","w":"high","e":["教材高频"]},{"t":"状态形容词","y":"名词解释","p":["也叫形容词的生动形式","表示程度比较高，前面不能再加“很”","使用时后面一般要带“的”","可比较自由地充当谓语、补语和状语"],"q":"状态形容词也叫形容词的生动形式，表示程度比较高，因而前面不能再加“很”，使用时后面一般要带“的”，可比较自由地充当谓语、补语和状语。","w":"normal","e":["核心考点"]},{"t":"请指出下列词语各属于哪类形容词，并说明理由：雪白、血红、通红、鲜红。","y":"分析题","p":["都属于状态形容词","由单音节性质形容词前加一个表比喻显示高程度的语素构成","表示程度比较高，前面不能再加“很”"],"q":"这些词都属于状态形容词。(2)单音节性质形容词前面加一个表比喻显示高程度的语素，例如：雪白、血红、金黄、冰冷、冰凉、蜡黄、碧绿、漆黑、笔直、飞快、火热、通红、鲜红、煞白、死沉、稀烂、稀软、铁青、滚烫、崭新、溜圆、喷香。这类状态形容词表示程度比较高，因此前面不能再加“很”。","w":"normal","e":["核心考点"]},{"t":"数词表示数目和次序。表示数目的是______词，表示次序的是______词。","y":"填空题","p":["基数词","序数词"],"q":"基数词；序数词","w":"normal","e":["核心考点"]},{"t":"量词的语法特点是什么？量词可分为哪两类？","y":"简答题","p":["不单独使用","先跟数词组合成数量短语，或跟指示代词组成指量短语","名量词表示人或事物的单位（个体量词、度量词、借用名量词）","动量词表示动作的次数（时间、器官、工具、伴随、同形量词）"],"q":"量词的语法特点是不单独使用，而是先跟数词组合成为数量短语，或者跟指示代词组成指量短语。量词包括名量词和动量词两类：名量词表示人或事物的单位，包括个体量词、度量词以及借用的名量词；动量词表示动作的次数，借用的动量词包括时间量词、器官量词、工具量词、伴随量词、同形量词五类。","w":"normal","e":["核心考点"]},{"t":"下列量词中，属于借用的动量词的是（　　）。","y":"单项选择题","p":["C","“看一眼”属于借用的动量词中的器官量词","“个”是个体量词，“斤”是度量词"],"q":"C。借用的动量词包括五类：(1)时间量词，如年、月、日；(2)器官量词，如看一眼、踢一脚、打两拳；(3)工具量词，如砍一刀、放一枪；(4)伴随量词，如唱一曲、走一步；(5)同形量词，如看一看、走一走。“看一眼”属于器官量词。“个”是个体量词，“斤”是度量词。","w":"normal","e":["核心考点"]},{"t":"代词","y":"名词解释","p":["具有替代和指示作用","包括人称代词、指示代词、疑问代词三类","不是按照语法功能划分出来的词类，只是在“指代”这一点上有共同点"],"q":"代词是具有替代和指示作用的词。代词包括三类：人称代词、指示代词、疑问代词。代词实际上并不是按照语法功能划分出来的词类，只是在“指代”这一点上有共同点。","w":"normal","e":["核心考点"]},{"t":"辨析“咱们”与“我们”。","y":"辨析题","p":["“咱们”往往包括说话人和听话人双方，叫“包括式”","“我们”也可以兼指听说双方","“我们”与“咱们”同现时只指说话人一方，属于“排除式”"],"q":"“我、咱、我们”是第一人称代词，代表说话一方。“咱们”往往包括说话人和听话人双方，叫作“包括式”。“我们”也可以兼指听说双方，但与“咱们”同现时，就只指说话人一方，属于“排除式”。","w":"normal","e":["核心考点"]},{"t":"代词可以活用。请指出下列各句中代词活用的类型：“谁有事都找他帮忙”“怎么方便怎么做”“不知道他去了哪儿”“什么张三李四，我都不认识”。","y":"分析题","p":["谁有事都找他帮忙——任指","怎么方便怎么做——承指","不知道他去了哪儿——虚指","什么张三李四，我都不认识——例指","代词可以活用，疑问代词不表示疑问"],"q":"(1)谁有事都找他帮忙。——任指；(2)怎么方便怎么做。——承指；(3)不知道他去了哪儿。——虚指；(4)什么张三李四，我都不认识。——例指。代词可以活用，比如疑问代词不表示疑问，人称代词和指示代词也可以活用。","w":"normal","e":["核心考点"]},{"t":"区别词","y":"名词解释","p":["又叫“非谓形容词”","不能作谓语、主语、宾语，也不能受数量短语修饰","单独只能作定语","跟“的”构成“的”字结构"],"q":"区别词跟形容词有点儿像，但是不能作谓语，又叫“非谓形容词”。区别词跟名词也不同，不能作主语或宾语，也不能受数量短语修饰。区别词的语法特点有两条：①单独只能作定语；②跟“的”构成“的”字结构。","w":"high","e":["2018 真题"]},{"t":"副词的语法特点是什么？按语义与功能可分为哪八类？","y":"简答题","p":["只能作状语，极少数还可以作补语","描摹副词、评注副词、否定副词、时间副词、频率副词、程度副词、范围副词等","内部虚化程度不等","兼具实词和虚词的某些特点"],"q":"副词的语法特点是只能作状语，极少数还可以作补语。副词按照语义与功能大体上可分成以下八类：1.描摹副词；2.评注副词；3.否定副词；4.时间副词；5.频率副词；6.程度副词；7.范围副词。（另含其他小类）。副词是个大杂烩，内部虚化程度不等。一些常用副词的语义相当复杂，可能分别属于几个小类。副词可作状语，应该为实词，但它的","w":"normal","e":["核心考点"]},{"t":"拟声词用来模拟自然界的声音，它可以单独成句，在句中主要作______，重叠式加“的”，还可作谓语、补语和定语。","y":"填空题","p":["状语"],"q":"状语","w":"normal","e":["核心考点"]},{"t":"叹词用来表示强烈感情和招呼应答，其语法特点是：一般不进入句子结构，______成句。","y":"填空题","p":["独立"],"q":"独立","w":"normal","e":["核心考点"]},{"t":"词的跨类现象包括哪四种情况？","y":"简答题","p":["兼类：具有两类词的语法功能，意义上又有密切联系","同音：同音同形而语法功能不同，意义上没有什么联系","活用：临时性地被用作另一类词","借用：临时“借用”为另一类，且全社会公认"],"q":"一个语音和文字形式相同的词可能表现出两类词的语法功能，这包括以下四种情况：1.兼类：一个词在不同语境中，具有A和B两类词的语法功能，意义上又有密切的联系，这是兼类词。2.同音：两个词同音又同形，而语法功能分别属于A和B两类词，但意义上没有什么联系，这是语法上的同音词。3.活用：某个词属于A类，由于表达的特殊需要，而被用","w":"high","e":["2016 真题"]},{"t":"辨析兼类词与同音词，并说明区分的关键。","y":"辨析题","p":["兼类：具有两类词的语法功能，意义上又有密切联系","同音词：同音同形而语法功能不同，意义上没有什么联系","区分关键：看它们的词义是否有密切的联系"],"q":"兼类：一个词在不同语境中，具有A和B两类词的语法功能，意义上又有密切的联系，这是兼类词。主要有：兼属名词和动词：锁、锄、锯、病、伤、药、电、漆、锈、网、尿、教练、指导、指挥、代表、领导；兼属名词和形容词：圆、尖、红、美、平常、累赘、方便、困难；兼属动词和形容词：热、冷、饿、破、端正、巩固、集中；兼属区别词和副词：长期、","w":"high","e":["2019 真题"]},{"t":"指出下列各句中加点词属于兼类、同音、活用还是借用：（1）别太近视眼了。（2）他比女人还女人。（3）一桶油。（4）一张纸。","y":"分析题","p":["“别太近视眼了”——活用为形容词","“他比女人还女人”——活用为形容词","“一桶油”——借用为量词","“一张纸”——同音词"],"q":"（1）“别太近视眼了。”把名词“近视眼”活用为形容词，属活用。（2）“他比女人还女人。”把名词“女人”活用为形容词，属活用。（3）“一桶油。”表示容器的名词“桶”直接出现在数词后面，是“借用”为量词。（4）“张”可以是动词，如“张口”，也可以是量词，如“一张纸”，意义上没有什么联系，属同音词。","w":"normal","e":["核心考点"]},{"t":"判断：划分词类的主要依据是词的语法功能。（　）","y":"判断题","p":["划分词类标准：形态、意义、功能","功能标准最重要"],"q":"错误。划分词类的标准主要有三个：形态标准、意义标准、功能标准。其中功能标准是最重要的标准。所谓语法功能是指词的组合能力，即能够跟哪些词组合，不能跟哪些词组合。意义标准只能作为参考标准，形态标准对汉语也不太适用。因此说“划分词类的主要依据是词的语法功能”是正确的，本题表述应判为正确。","w":"high","e":["教材高频"]},{"t":"判断：虚词不能充当句法成分，实词能充当句法成分。（　）","y":"判断题","p":["实词能充当句法成分","虚词不能充当句法成分"],"q":"正确。汉语词类的第一层次是分为“实词”和“虚词”两大类：能充当句法成分的词是实词，不能充当句法成分的词是虚词。虚词一般没有实在的词汇意义，但有重要的语法意义。","w":"high","e":["教材高频"]},{"t":"下列各组虚词中，都属于介词的一组是（　　）。","y":"单项选择题","p":["介词：把、从、关于","连词：和、或、但是","助词：的、了、着","语气词：啊、吧、呢"],"q":"A","w":"high","e":["教材高频"]}]},{"id":"xdhy_down-c01-s03","t":"第三节 虚词的作用及其辨析","w":"high","n":10,"k":[{"t":"介词","y":"名词解释","p":["多是从动词虚化而来，又叫“副动词”","引进跟谓词有关的对象","跟名词组合成介词短语","主要作状语，也可以作补语"],"q":"介词多是从动词虚化而来，又叫“副动词”，部分现在还跟动词兼类。介词的语法作用是引进跟谓词有关的对象，跟名词组合成介词短语，主要作状语，也可以作补语。","w":"normal","e":["核心考点"]},{"t":"连词可根据其所连接的对象分为哪三类？","y":"简答题","p":["只连接词和短语的：和、跟、同、与、及、或","只连接分句和句子的：即使、既然、如果、虽然、但是、所以等","既能连接词或短语，又能连接分句或句子的：并、并且、而、或者、因为、无论等"],"q":"连词的作用是把两个词、短语、分句或句子连接起来，以显示二者的语义关系。连词可根据其所连接的对象分为以下三类：1.只连接词和短语的有：和、跟、同、与、及、或。2.只连接分句和句子的有：即使、既然、尽管、宁可、要么、如果、尚且、虽然、与其、只要、不过、然而、否则、可是、但是、那么、况且、从而、所以、因此、因而。3.既能连接","w":"normal","e":["核心考点"]},{"t":"助词","y":"名词解释","p":["黏着在词或短语上面，表示附加意义","附着在后面的一律读轻声","结构助词：的、地、得","时态助词：了、着、过","其他助词：似的、所、给、看、来、把、们、第、初、等"],"q":"助词共同的特点是：黏着在词或短语上面，表示附加意义，附着在后面的一律读轻声。助词主要有以下三类：结构助词、时态助词、其他助词。","w":"high","e":["2017 真题"]},{"t":"语气词","y":"名词解释","p":["一般用于句末","表示陈述、疑问、祈使、感叹等语气","永远黏着、后附、轻声"],"q":"语气词一般用于句末，表示陈述、疑问、祈使、感叹等语气，永远黏着、后附、轻声。","w":"high","e":["2016 真题","2020 真题"]},{"t":"辨析语气词“吗”与“吧”。","y":"辨析题","p":["都用在是非疑问句末","“吗”疑大于信，怀疑程度大；“吧”信大于疑，怀疑程度小","“吧”句中可以出现“很可能”“八成”“大概”等词语","“吗”可加“难道”变成反问句，“吧”则不行"],"q":"“吗”和“吧”都用在是非疑问句末，只是“吗”表示怀疑的程度比较大，疑大于信；“吧”表示怀疑的程度比较小，信大于疑。例如，“今天八成是星期天吧?”可以用“吧”，而“*今天八成是星期天吗?”不行，因为“吧”表示基本上相信，但还有少许疑问，所以要对方给以确认，句中可以出现“很可能”“八成”“大概”等词语；而“吗”可加“难道”","w":"normal","e":["核心考点"]},{"t":"辨析副词“常常”与“往往”。","y":"辨析题","p":["都表示“经常性发生”","“往往”表示根据以往经验、在某种条件下发生带规律性的动作行为","无条件的或将来时的都不能用“往往”","“常常”没有这一限制"],"q":"“常常”和“往往”都表示“经常性发生”。但实际上两者意义还是有差别的：“往往”表示根据以往的经验，在某种条件下，发生带规律性的动作行为，因此，无条件的或将来时的都不能用“往往”；“常常”则没有这一限制。例如：“每逢假期，他常常去旅游。”/“每逢假期，他往往去旅游。（有规律）”；“他常常去图书馆看书。”/“*他往往去图书","w":"high","e":["教材高频"]},{"t":"辨析连词“或者”与“还是”。","y":"辨析题","p":["都是表示“选择”的连词","“或者”只能用于陈述句","“还是”主要用于疑问句，用于陈述句也含有疑惑的意思"],"q":"“或者”和“还是”，都是表示“选择”的连词，但“或者”只能用于陈述句，而“还是”主要用于疑问句，即使用于陈述句，也含有疑惑的意思。如：(1)暑假里，我们或者（*还是）去杭州，或者（*还是）去苏州。(2)你是去杭州，还是（*或者）去苏州?(3)我不清楚他是考文科还是（*或者）考理工科。","w":"normal","e":["核心考点"]},{"t":"考察虚词的用法，大致可以从哪八个方面入手？","y":"简答题","p":["适应不同的句类","适应于功能不同的词和短语","与之组合的成分音节多少不同","与之组合的成分肯定与否定不同","与之组合的成分简单与复杂不同","与相关成分的位置不同","与之相配合的词语不同","与之发生关系的成分是否可缺省"],"q":"考察虚词的用法，大致可以从以下八个方面去考察，即同类或同义的虚词可能在以下八个方面存在差别：1.适应不同的句类。2.适应于功能不同的词和短语。3.与之组合的成分音节多少不同。4.与之组合的成分肯定与否定不同。5.与之组合的成分简单与复杂不同。6.与相关成分的位置不同。7.与之相配合的词语不同。8.与之发生关系的成分是否","w":"normal","e":["核心考点"]},{"t":"辨析连词“只有”与“只要”。","y":"辨析题","p":["都是连词，表示条件","“只有”可以连接名词性短语和介词短语","“只要”只能接动词性词语和主谓短语"],"q":"“只有”和“只要”都是连词，表示条件，但“只有”可以连接名词性短语和介词短语，而“只要”只能接动词性词语和主谓短语。如：(1)只有付出真情的人才能赢得真情。（*“只要……就……”）(2)只有在特殊的情况下才能改变集体做出的决定。（*“只要……就……”）(3)只有努力学习，才能取得好成绩。（“只要……就……”）(4)只有","w":"normal","e":["核心考点"]},{"t":"辨析“非常”与“极其”“极为”在用法上的区别。","y":"分析题","p":["后两个词只用于书面","“非常”修饰的成分单音节、多音节都可以","“极其、极为”修饰的成分必须是多音节，多为双音节"],"q":"“非常”和“极其”“极为”的区别除了后两个词只用于书面外，还有对它们所修饰的词语的音节要求不同，“非常”修饰的成分单音节、多音节都可以，而“极其、极为”修饰的成分必须是多音节，多为双音节。例如：(1)非常重/非常沉重；(2)*极其重、*极为重/极其沉重、极为沉重。","w":"normal","e":["核心考点"]}]},{"id":"xdhy_down-c01-s04","t":"第四节 短语与层次分析法","w":"high","n":23,"k":[{"t":"短语","y":"名词解释","p":["由两个或两个以上单词构成的句法结构单位","在语义上能逐层贯通，在结构上能逐层搭配起来","没有句调的一组词","短语有两类：词组和结构"],"q":"由两个或两个以上单词构成的句法结构单位叫短语。它是在语义上能逐层贯通，在结构上能逐层搭配起来的没有句调的一组词。短语有两类：词组和结构。","w":"high","e":["2015 真题","2021 真题"]},{"t":"短语（词组）可分为哪八类？短语（结构）又可分为哪四类？","y":"简答题","p":["词组八类：偏正词组、述宾词组、述补词组、联合词组、主谓词组、同位词组、连谓词组、兼语词组","结构四类：量词结构、方位结构、介词结构、“的”字结构"],"q":"实词与实词按照一定的句法关系组合起来的短语叫“词组”，包括：偏正词组、述宾词组、述补词组、联合词组、主谓词组、同位词组、连谓词组和兼语词组等八类。实词与实词的非句法关系组合以及实词与虚词的组合叫“结构”，实词与实词的组合包括：量词结构、方位结构；实词与虚词的组合包括：介词结构、“的”字结构。","w":"high","e":["教材高频"]},{"t":"偏正词组","y":"名词解释","p":["前面的成分修饰、限定后面的成分","前面是修饰语，后面是中心语","分为定心词组和状心词组两类"],"q":"偏正词组前面的成分修饰、限定后面的成分，前面是修饰语，后面是中心语。偏正词组分为两类：定心词组和状心词组。","w":"normal","e":["核心考点"]},{"t":"区别定心词组和状心词组的方法是什么？请举例说明。","y":"分析题","p":["主要依据中心语来判断：名词性词语前的修饰语一般是定语","谓词性词语前的修饰语一般是状语","还要看修饰语的性质及整个偏正词组所处的语法位置","名词或人称代词作修饰语一般应是定语；副词作修饰语一般应是状语"],"q":"区别定心词组和状心词组的方法主要依据中心语来判断：名词或名词性词语前面的修饰语一般应该是定语；谓词(动词或形容词)或谓词性词语前面的修饰语一般应该是状语。此外，还要看修饰语的性质以及整个偏正词组所处的语法位置。名词或人称代词作修饰语(带“的”)，不管它的中心语是动词还是形容词，一般应该是定语；副词作修饰语，不管它的中心","w":"high","e":["教材高频"]},{"t":"述宾词组","y":"名词解释","p":["前后是支配与被支配、关涉与被关涉的关系","述语主要由及物动词充当","宾语一般是体词或体词性短语，也可以是谓词性短语或主谓词组","动词可分为体宾动词、谓宾动词、兼宾动词等"],"q":"述宾词组，前后是支配与被支配、关涉与被关涉的关系。述语主要由及物动词充当，宾语一般是体词或体词性短语，也可以是谓词、谓词性短语或主谓词组。根据这一特点，动词可以分为体宾动词、谓宾动词、兼宾动词三类，另有双宾动词和黏宾动词。","w":"normal","e":["核心考点"]},{"t":"根据带不带标志“得”的情况，补语可以分为哪几类？","y":"简答题","p":["数量补语：不能带“得”，说明动作的次数或延续的时间","情态补语：必须带“得”，说明动作或有关事物的状态","结果补语：不带“得”，表示动作的结果","趋向补语：不带“得”，表示动作的趋向","可能补语：结果补语和趋向补语中间插入“得/不”，表示可能性","程度补语：补语是副词构成，表示程度"],"q":"根据带不带标志“得”的情况，补语可以分为以下几类：1.数量补语：不能带“得”，由量词结构说明动作的次数或动作延续的时间，如“敲了三下/回来一趟”。2.情态补语：必须带“得”，说明动作或有关事物的状态，如“说得上气不接下气”。3.结果补语：不带“得”，表示动作的结果，如“长大/说清楚”。4.趋向补语：不带“得”，表示动作","w":"high","e":["2013 真题","2019 真题"]},{"t":"分析“台上坐着主席团”与“台上唱着戏”两组句子在补语/变换上的差异，并说明其语义特征根据。","y":"分析题","p":["两组句子结构层次、结构关系相同","A组变换式为“主席团坐在台上”，B组为“台上正在唱着戏”","A组表示“存在”，着眼点是空间；B组表示“进行”，着眼点是时间","A组动词具有[+附着]特征，B组动词具有[+持续]特征"],"q":"这两组句子词语序列相同，内部的结构层次、结构关系也相同，都是“处所词+动词+着+名词”，但两组句子的变换式却正好相反：(1)台上坐着主席团→主席团坐在台上→*台上正在坐着主席团；(3)台上唱着戏→*戏唱在台上→台上正在唱着戏。A组句子表示“存在”，说明事物的位置，着眼点是空间；B组句子表示动作行为的持续，着眼点是时间。","w":"high","e":["教材高频"]},{"t":"联合词组的构成有什么要求？","y":"简答题","p":["由两个或两个以上成分组成，构成并列、承接、选择或递进等关系","构成单位必须是语法性质相同或相近的","只有表示并列关系的，才可不用连词连接","为显示层次、分清主次，也经常使用连词"],"q":"联合词组由两个或两个以上成分组成，构成并列、承接、选择或者递进等关系。联合词组的构成，既可以是词与词的联合，也可以是词组与词组的联合，还可以是词与词组的联合，不论是何种语法单位的联合，都必须是语法性质相同或相近的。其次，只有表示并列关系的，其构成成分才可以不用连词来连接。即使这样，为了显示层次、分清主次等需要，并列关系","w":"normal","e":["核心考点"]},{"t":"同位词组","y":"名词解释","p":["前后成分所指内容相同","在句子中充当同一个句法成分","意义上构成复指关系"],"q":"同位词组前后成分所指内容相同，在句子中充当同一个句法成分，意义上构成复指关系。主要有通名与专名同位、别称与本称同位、数量短语构成的同位、人称代词构成的同位、指示代词构成的同位等类型。","w":"normal","e":["核心考点"]},{"t":"兼语词组","y":"名词解释","p":["由一个述宾词组跟一个主谓词组套叠而成","述宾词组的宾语兼任主谓词组的主语","典型兼语词组的谓语动词往往带有使动性"],"q":"兼语词组是由一个述宾词组跟一个主谓词组套叠而成，述宾词组的宾语兼任主谓词组的主语。典型兼语词组的谓语动词往往带有使动性。","w":"high","e":["教材高频"]},{"t":"请指出下列短语的类型：木头房子、我们大家、请他来、跳上、吃的、从北京、山坡前。","y":"分析题","p":["木头房子——偏正词组","我们大家——同位词组","请他来——兼语词组","跳上——述补词组","吃的——“的”字结构","从北京——介词结构","山坡前——方位结构"],"q":"木头房子——偏正词组（定心词组）；我们大家——同位词组；请他来——兼语词组；跳上——述补词组（趋向补语）；吃的——“的”字结构；从北京——介词结构；山坡前——方位结构（表处所义）。","w":"high","e":["2015 真题"]},{"t":"“的”字结构","y":"名词解释","p":["由结构助词“的”附加在其他词语之后构成","使谓词性成分转化为名词性成分","在语义上起转指作用"],"q":"“的”字结构由结构助词“的”附加在其他词语之后构成，主要作用是使谓词性成分转化为名词性成分，同时在语义上也起转指作用。","w":"high","e":["2020 真题"]},{"t":"层次分析法","y":"名词解释","p":["分析句法结构层次的方法","是句法分析最基本、最有效的方法之一","正式学名叫“直接成分分析法”（IC）","由布龙菲尔德系统运用到句法结构分析上","分析时尽可能采取二分，俗称“二分法”"],"q":"两个单词构成的短语只可能是一个层次，所以不需要进行层次分析，但是如果有三个以上的单词在两个以上层次上进行组合，就需要进行层次分析，分析句法结构层次的方法就叫作“层次分析法”。这是句法分析最基本，也是最有效的方法之一。","w":"high","e":["2012 真题","2016 真题","2020 真题"]},{"t":"什么是“层次”？什么是“同形结构”或“歧义结构”？请举例说明。","y":"简答题","p":["“层次”指一些句法单位在组合时所反映出来的不同的先后顺序和语义关系","词形相同词序也相同但层次与意义都不同的句法结构叫“同形结构”或“歧义结构”","“咬死了猎人的狗”有两种切分：(咬死了)(猎人的狗)和[(咬死了)猎人的]狗"],"q":"“层次”是个非常重要的概念，就是指一些句法单位在组合时所反映出来的不同的先后顺序和语义关系。“咬死了猎人的狗”是一个词形相同词序也相同但层次与意义都不同的句法结构，这叫作“同形结构”或“歧义结构”。“咬死了猎人的狗”有两种意思：(1)(咬死了)(猎人的狗)；(2)[(咬死了)猎人的]狗。这种意义的不同反映了相同的线形排","w":"high","e":["2018 真题"]},{"t":"层次分析必须注意的三大基本原则是什么？","y":"简答题","p":["结构原则：切分出来的两个部分都必须是合法的句法结构体","功能原则：切分出来的两部分可以根据汉语句法的组合规律再重新组合起来","意义原则：语义上要符合逻辑常理","三个原则都需要遵守，往往某一原则起主导作用"],"q":"层次分析时必须注意三大基本原则：1.结构原则。即切分得出来的两个部分都必须是合法的句法结构体。比如句法结构A，切分为A1和A2，那么，A1和A2，都应该是一个合法的词语或短语。2.功能原则。即切分出来的这两个部分，可以根据汉语句法的组合规律，再重新组合起来。3.意义原则。即语义上要符合逻辑常理，否则也是不可接受的。层次","w":"high","e":["2014 真题","2019 真题"]},{"t":"请用层次分析的三原则说明“一辆新车”为什么只有一种切分是正确的。","y":"分析题","p":["“一辆新车”理论上可有三种切分","a切分分出“一辆”与“新”，但“辆新车”不是合法的短语","c切分出“一辆新”不合法","只有b切分，分出“一辆”和“新车”都是合法的短语"],"q":"从理论上讲，“一辆新车”可以有三种切分办法：如果按a切分，分出的“一”固然是词，但是“辆新车”却不是一个合法的短语，所以a切分不能成立（违反结构原则）；如果按c切分，分出的“车”虽然是词，但是“一辆新”也不是一个合法的短语（只有在“一辆新，一辆旧”里边，才是合法的），所以c切分也不能成立；如果按b切分，分出的“一辆”和","w":"high","e":["教材高频"]},{"t":"请用层次分析的功能原则说明“刚买的书包”的切分。","y":"分析题","p":["a切分“刚”与“买的书包”无法重新组合，副词不能修饰名词","b切分“的书包”不是合法的短语","只有c切分“刚买的”和“书包”既符合结构原则也符合功能原则","“的”为定语标志，切分时可不予考虑"],"q":"按照a切分，虽然符合结构原则，“刚”是个副词，“买的书包”也是个偏正短语，但是根据汉语的句法组合规则，副词是不能修饰名词的，因此，“刚”跟“买的书包”无法重新组合，所以a切分是错误的；按照b切分，由于“的书包”不是个合法的短语，所以b切分也是不对的；只有c切分，“刚买的”和“书包”，既符合结构原则，也符合功能原则，这样","w":"high","e":["教材高频"]},{"t":"请用层次分析的意义原则说明“一位小偷的辩护律师”的切分。","y":"分析题","p":["“一位小偷的辩护律师”a、b切分表面都可行","量词“位”用于尊称，用来修饰“小偷”不适合","“位”可以用来修饰“辩护律师”","所以a切分错误，b切分准确（意义原则）"],"q":"表面看来，“一位小偷的辩护律师”无论a切分，还是b切分，都可以，但是，汉语的量词“位”是用于尊称的，用来修饰“小偷”显然是不适合的，不过可以用来修饰“辩护律师”，因此，a切分是错误的，b切分则是准确的。这体现的是层次分析的意义原则：语义上要符合逻辑常理，否则也是不可接受的。","w":"high","e":["教材高频"]},{"t":"语感","y":"名词解释","p":["对语言运用是否准确和得当的一种直接的本能的感觉","是长期积累起来的知识和能力的一种集中反映","需要有意识地去培养、积累和体验"],"q":"语感，就是对语言运用是否准确和得当的一种直接的本能的感觉。这种语感，是人们在使用语言的过程中，长期积累起来的知识和能力的一种集中反映。","w":"normal","e":["核心考点"]},{"t":"按照层次分析的原则，对“一辆新车”的正确切分是（　　）。","y":"单项选择题","p":["只有b切分合理","两部分都是合法的短语","符合结构原则"],"q":"B","w":"high","e":["教材高频"]},{"t":"简述层次分析法的三个基本原则。","y":"简答题","p":["结构原则：两部分都必须是合法的句法结构体","功能原则：两部分能根据汉语句法组合规律重新组合","意义原则：语义上符合逻辑常理"],"q":"层次分析时必须注意三大基本原则：（1）结构原则，即切分得出来的两个部分都必须是合法的句法结构体。（2）功能原则，即切分出来的这两个部分，可以根据汉语句法的组合规律，再重新组合起来。（3）意义原则，即语义上要符合逻辑常理，否则也是不可接受的。层次分析的三个原则都需要遵守，但在实际运用时，往往是某一个原则起主导作用，有时候","w":"high","e":["教材高频"]},{"t":"层次分析法的正式学名叫作＿＿＿＿分析法，这是由美国描写语言学家＿＿＿＿系统地运用到句法结构分析上来的。由于这种方法在分析时尽可能地采取二分，所以俗称＿＿＿＿。","y":"填空题","p":["直接成分分析(IC)","布龙菲尔德","二分法"],"q":"直接成分；布龙菲尔德(L.Bloomfield)；二分法","w":"high","e":["教材高频"]},{"t":"【名词解释】同形结构","y":"名词解释","p":["词形相同词序也相同","层次与意义都不同","也叫歧义结构"],"q":"同形结构是指一个词形相同词序也相同但层次与意义都不同的句法结构，也叫作“歧义结构”。","w":"high","e":["教材高频"]}]},{"id":"xdhy_down-c01-s05","t":"第五节 句型系统","w":"high","n":18,"k":[{"t":"【名词解释】句子","y":"名词解释","p":["前后都有停顿","带有一定的语调","表示相对完整的意义","人们用来进行交际的基本语言单位"],"q":"句子是前后都有停顿，带有一定的语调，表示相对完整的意义，人们用来进行交际的基本语言单位。","w":"high","e":["教材高频"]},{"t":"简述句子与短语的区别。","y":"简答题","p":["备用单位vs使用单位","组合关系与实现关系","区别在于质的飞跃而非量的多少","句子≠主谓形式，主谓形式≠句子"],"q":"（1）词与短语都是语言的备用单位，句子则是语言的使用单位。（2）词跟词可以组合成短语，从而构成“组合关系”；词(主要是实词)和短语，如果赋予它一定的语气语调，并进行交际活动，就可以成为句子，从而形成“实现关系”。（3）词、短语跟句子的根本区别不在于量的多少，而在于质的飞跃。（4）句子可长可短，即使一个词也可以独立成句。","w":"high","e":["教材高频"]},{"t":"试比较说明句子跟主谓短语的关系，并举例分析。","y":"论述题","p":["句子是使用单位，主谓短语是备用单位","口语中句子常是非主谓形式","主谓短语可成句也可作句子成分","句子≠主谓形式，主谓形式≠句子"],"q":"（1）句子跟主谓短语是两个完全不同的概念。句子是语言的使用单位，主谓短语是语言的备用单位。（2）书面上的句子往往是主谓形式的，但口语中的句子却常常是非主谓形式的，例如“谁?我。”“走?不!”都是句子，却都不是主谓形式。（3）主谓短语可以单独成句，但是也可以跟其他的短语一样只是句子中的一个成分。例如：(3)我读中文系。(","w":"normal","e":["核心考点"]},{"t":"【名词解释】句型","y":"名词解释","p":["按照句子的结构模式划分","类型系统"],"q":"句型是按照句子的结构模式划分出来的类型系统。建立在句子的结构模式基础上的句型，可以帮助我们分析成千上万个具体的句子，把它们纳入一定的系统框架，也可以解释无数个新的句子是如何产生的。","w":"high","e":["教材高频"]},{"t":"简述句型的三个特点。","y":"简答题","p":["抽象的、有生成性的","成系统的、有层次的","句型成分的结合有序列、有层次"],"q":"（1）句型是抽象的、有生成性的。世界上具体的句子是数不清的，从这些大量具体的句子中可以概括出若干句型，所以句型对具体使用的一个个的句子来讲是抽象的。句子的数量是无限的、不可数的，但句型的数量却是有限的、可数的。人们掌握了一定的句型，并且根据有关规则，填入某些功能相同也符合语义搭配的词语，就能够产生出新的合法的句子来，这","w":"normal","e":["核心考点"]},{"t":"【名词解释】主谓句","y":"名词解释","p":["由主谓短语构成","能分析出主语和谓语两个直接成分"],"q":"主谓句是由主谓短语构成的句子，即能分析出主语和谓语两个直接成分的句子。","w":"high","e":["教材高频"]},{"t":"简述动词性谓语句的六种基本句型，并各举一例。","y":"简答题","p":["动词谓语句","述宾谓语句","述补谓语句","连谓谓语句","兼语谓语句","主谓谓语句"],"q":"动词性谓语句的谓语由动词或动词性短语构成，主要有以下六种基本句型：（1）动词谓语句：花开了。（2）述宾谓语句：我们吃苹果。（3）述补谓语句：汽车开走了。（4）连谓谓语句：小王去上海买器材。（5）兼语谓语句：学校派老张值班。（6）主谓谓语句：面包我吃光了。","w":"high","e":["教材高频"]},{"t":"【名词解释】非主谓句","y":"名词解释","p":["单个词或非主谓短语构成","不能分析出主语和谓语","不宜叫无主句"],"q":"由单个词或者非主谓短语构成的单句是非主谓句。非主谓句不可能分析出主语和谓语来，所以不宜叫“无主句”。","w":"high","e":["教材高频"]},{"t":"简述非主谓句的四类，并各举一例。","y":"简答题","p":["名词性非主谓句","动词性非主谓句","形容词性非主谓句","特殊非主谓句"],"q":"非主谓句可以分为四类：（1）名词性非主谓句。例如：飞机!好大的老鼠!老张和老李。图书馆的。（2）动词性非主谓句。例如：听!下雨了。晒干了!请大家不要抽烟。（3）形容词性非主谓句。例如：对!好极了!（4）特殊非主谓句。例如：不!(否定副词)啊?(叹词)","w":"normal","e":["核心考点"]},{"t":"进行句型分析时必须排除哪些不影响句型的因素?请分别举例说明。","y":"论述题","p":["表示语气的因素(语气词和语调)不影响句型","功能相同词义不同的词语替换不影响句型","扩展一般不影响句型","句子的特殊成分(独立成分、提示成分)不影响句型","语用移位不影响句型"],"q":"进行句型分析时，只考虑句型成分以及句子的结构模式，所以必须首先排除一些不影响句型的因素，主要有五种：（1）表示语气的因素不影响句型，包括语气词和语调。不同的句类可能是同一个句型，相同的句类可能是不同的句型。例如“你来了。（陈述）”“你来吧!（祈使）”“你来吗?（疑问）”“你来啦!（感叹）”四句语气不同，分属不同句类，句","w":"high","e":["教材高频"]},{"t":"【名词解释】句子的特殊成分","y":"名词解释","p":["独立成分和提示成分","不参加句子的结构组合","不能独立成句","在语义表达上有特殊作用"],"q":"句子的特殊成分是指独立成分和提示成分。它们有三个特点：第一，不参加句子的结构组合，所以不是句型成分，也不是短语成分；第二，附属于句子，但是不能独立成句；第三，在语义表达上有特殊作用。","w":"normal","e":["核心考点"]},{"t":"简述独立成分的常见类型，并各举一例。","y":"简答题","p":["引起对方注意：你看/你想/你听","推测估计：看来/算起来/说不定/少说","表明意见态度：依我看/我看/我想","表示消息来源：据说/听说/据……说","总结举例补充注释：总之/正如/此外/即"],"q":"独立成分指在句子中临时插进一些习惯用语，目的是增强语言的表达色彩，这些习惯用语跟别的成分不发生结构上的联系，但是在语义的表达上还是很重要的。常见类型有：（1）为了引起对方的注意，常用“你看”“你想”“你听”“你说”等。例如：你看，这事怎么办?（2）表示对情况的推测和估计，比较委婉，常用“看来”“看起来”“算起来”“说不","w":"normal","e":["核心考点"]},{"t":"【名词解释】提示成分","y":"名词解释","p":["称代式提示成分","总分式提示成分","不参加结构组合","出现在句首或句尾"],"q":"提示成分是句子的特殊成分之一，有两种：称代式提示成分和总分式提示成分。它不参加句子的结构组合，总是出现在句子的前面或后面。","w":"normal","e":["核心考点"]},{"t":"【名词解释】中心词分析法","y":"名词解释","p":["传统语法分析句子的方法","又叫句子成分分析法","设立句子六大成分"],"q":"中心词分析法是传统语法分析句子时主要采用的方法，又叫句子成分分析法。它设立句子的六大成分，并认为句子总是由主谓词组组成的。由于这种句子分析法用六大成分来命名，所以又叫“句子成分分析法”。","w":"high","e":["教材高频"]},{"t":"比较中心词分析法与层次分析法的优缺点。","y":"论述题","p":["中心词分析法优点：简便易操作、利于归纳句型、利于修改病句","中心词分析法缺点：缺乏层次观念、缺乏关系观念、词组身份不一致、语义理解偏误","层次分析法优点：既讲层次又讲关系，弥补中心词分析法不足","层次分析法缺点：手续烦琐、难以把握全局、难以处理歧义结构"],"q":"中心词分析法的优点是：（1）方法简便，易于操作。一个句子，特别是一些比较长、结构比较复杂的句子，可以很快分出句子的主干和枝叶，便于提纲挈领、主次分明。（2）有利于归纳句型，句子的格局比较清楚，对语文教学有一定帮助。（3）有利于修改病句。检查语法错误经常使用的“紧缩法”，就是从“中心词分析法”演变而来的。但缺点也非常明显","w":"high","e":["教材高频"]},{"t":"“学校派老张值班。”属于（　　）。","y":"单项选择题","p":["兼语谓语句","老张既是派的宾语又是值班的主语"],"q":"C","w":"high","e":["教材高频"]},{"t":"现代汉语句型首先分为＿＿＿与＿＿＿两大类型。主谓句是由＿＿＿＿构成的句子。","y":"填空题","p":["单句","复句","主谓短语"],"q":"单句；复句；主谓短语","w":"high","e":["教材高频"]},{"t":"指出下列句子的句型：(1)今天星期三。(2)新来的厂长四十来岁。(3)天气晴朗。(4)我们吃苹果。(5)下雨了。","y":"分析题","p":["(1)名词谓语句","(2)数量谓语句","(3)形容词谓语句","(4)述宾谓语句","(5)动词性非主谓句"],"q":"（1）“今天星期三”是名词性谓语句(名词谓语句)。（2）“新来的厂长四十来岁”是名词性谓语句(数量谓语句)。（3）“天气晴朗”是形容词性谓语句(形容词谓语句)。（4）“我们吃苹果”是动词性谓语句(述宾谓语句)。（5）“下雨了”是非主谓句(动词性非主谓句)。","w":"high","e":["教材高频"]}]},{"id":"xdhy_down-c01-s06","t":"第六节 句式系统","w":"high","n":21,"k":[{"t":"【名词解释】句式","y":"名词解释","p":["根据句子的显著特点划分","句子类型","体现结构特点和语义特色"],"q":"句式是根据句子的显著特点划分出来的句子类型。它比较集中地体现了现代汉语句子的结构特点以及语义表达上的特色。","w":"high","e":["教材高频"]},{"t":"【名词解释】把字句","y":"名词解释","p":["介词“把”和它的宾语充当状语","选择并凸显特别关注的某个对象","表示动作或原因的影响产生某种结果或状态"],"q":"由介词“把”和它的宾语充当状语的句子叫作把字句。“把”的作用是选择并凸显说话者特别关注的某个对象。整句语法意义表示某种动作或原因的影响而产生某种结果或状态。","w":"high","e":["教材高频"]},{"t":"简述把字句的结构类型和“把”字宾语的特点。","y":"简答题","p":["谓语必须复杂，不能是单个动词","结构类型：带补语/带宾语/带状语/带了着","宾语主要是受事，也可为工具、处所、与事、使事、施事","宾语一般是定指的、已知的"],"q":"（1）把字句的谓语必须是复杂的，不能只是单个动词，特别是单音节动词。其结构类型主要有四种：1.带补语：把事情搞得一团糟。2.带宾语：把老虎打断了一条腿。3.带状语：把毛衣往包里塞。4.带“了、着”：把苹果吃了。/把行李背着。（2）“把”字宾语的特点：从语义上看，“把”的宾语主要是动作的受事，也可以是工具、处所、与事、使","w":"high","e":["教材高频"]},{"t":"分析“孩子老吃糖，把糖全吃完了”“孩子老吃糖，把牙也吃坏了”“孩子老吃糖，把压岁钱也吃光了”“孩子老吃糖，把奶奶吃火了”四句中“把”的宾语分别担任什么语义角色。","y":"分析题","p":["把糖：受事","把牙：工具","把压岁钱：直接影响对象","把奶奶：间接影响对象"],"q":"这四句说明了“把”的宾语可以担任不同的语义角色：（1）“把糖全吃完了”中，“糖”是受事。=孩子老吃糖+糖(因而)完了。（2）“把牙也吃坏了”中，“牙”是工具。=孩子老吃糖+牙(因而)坏了。（3）“把压岁钱也吃光了”中，“压岁钱”是直接影响对象。=孩子老吃糖+压岁钱(因而)光了。（4）“把奶奶吃火了”中，“奶奶”是间接影","w":"high","e":["教材高频"]},{"t":"判断：把字句中的否定词以及助动词只能出现在把字结构之前，而不能在它之后。（　）","y":"判断题","p":["否定词以及助动词只能出现在把字结构之前"],"q":"正确。","w":"normal","e":["核心考点"]},{"t":"下列句子能否成立?请说明原因。(1)你把雨伞别拿进来。(2)我把事情想弄清楚。","y":"分析题","p":["否定词/助动词只能出现在把字结构之前","“别”应在把字结构之前","助动词“想”应在把字结构之前","习惯用法中“不”可后置"],"q":"都不能成立。（1）“你别把雨伞拿进来”是规范的把字句，“你把雨伞别拿进来”不成立。原因是：否定词以及助动词只能出现在把字结构之前，而不能在它之后，“别”是副词，只能出现在“把雨伞”之前。（2）“我想把事情弄清楚”是规范的把字句，“我把事情想弄清楚”不成立，原因是助动词“想”只能出现在把字结构之前，而不能在它之后。不过，","w":"high","e":["教材高频"]},{"t":"判断：把字句中“把”的宾语都可以还原到动词之后。（　）","y":"判断题","p":["并非所有“把”的宾语都能还原到动词后","“把”的宾语不是由动词宾语提前得来"],"q":"错误。虽然有些把字句“把”的宾语可以还原到动词之后，但不能认为“把”的宾语就是从原来的动词宾语用“把”提前得来的，因为还有大量的把字句“把”的宾语无法还原到动词后面。例如“船员把落水儿童救到了岸上→*船员救落水儿童到了岸上”“花匠把空地都种上了鲜花→*花匠都种上了空地鲜花”。","w":"high","e":["教材高频"]},{"t":"【名词解释】被字句","y":"名词解释","p":["介词“被”和它的宾语充当状语","表示被动意义","宾语是施事或原因，主语是受事"],"q":"由介词“被”和它的宾语充当状语的句子叫作被字句。“被”的作用是表示被动意义，并且引进的宾语往往是动作的施事或原因，而主语则是动作的受事。","w":"high","e":["教材高频"]},{"t":"下列各项中，属于口语中替代“被”字表示被动的是（　　）。A.被……所 B.为……所 C.叫 D.所","y":"单项选择题","p":["书面语变体：被……所、为……所","口语变体：叫、让、给","固定格式：被……给、叫……给、让……给"],"q":"C。“被……所”“为……所”是书面语中保留的文言格式；“叫、让、给”是口语中替代“被”的说法。","w":"high","e":["教材高频"]},{"t":"分析说明被字句和把字句的变换关系，并举例说明变式的条件制约。","y":"分析题","p":["把字句与被字句可互相变换","被字句是把字句的对应格式","被字句主语是受事、被的宾语是施事，强调被动","把字句主语是施事、把的宾语是受事，强调结果","变换有条件制约：祈使句不可变换，光杆/感知动词构成的被字句不可变换","被把可融合，主语和把的宾语都是受事"],"q":"把字句和被字句有许多特点是相似的，由于语义上的对应关系，句式之间经常可以互相变换。例如：(1)他把碗打破了。←碗被他打破了。(2)美国队把巴西队打败了。→巴西队被美国队打败了。事实上，被字句并不是普通主动句的对应格式，而是把字句的对应格式。一般地说，被字句的主语是受事，“被”的宾语是施事，整个句子强调被动；把字句的主语","w":"high","e":["教材高频"]},{"t":"判断：被字句的主语表示的事物必须是定指的。（　）","y":"判断题","p":["被字句主语必须是定指的","形式上不定指但语境中可判定为定指"],"q":"正确。有时候被字句的主语在形式上好像是不定指的，但是在具体的上下文中，仍然可以看出它是定指的。例如“张妈买了三株花，一株被孙子折断了”中“一株”是“三株”中的一株，“树上的一只鸟被吓跑了”中“一只鸟”是树上的。","w":"normal","e":["核心考点"]},{"t":"【名词解释】双宾语句","y":"名词解释","p":["述宾短语再带一个宾语","近宾语(间接宾语)","远宾语(直接宾语)"],"q":"双宾语句是一个述宾短语再带一个宾语的句子。紧靠动词的宾语叫作近宾语(又称间接宾语)，不紧靠动词的宾语叫作远宾语(又称直接宾语)。","w":"high","e":["教材高频"]},{"t":"简述构成双宾语句的动词的三种类型，并各举一例。","y":"简答题","p":["给予义动词，多数可加“给”","取得义动词，一般不能加“给”","言说义动词，表示言语传递或称呼认定"],"q":"构成双宾语句的动词大体上可以分为三类：（1）具有“给予”义的动作动词，表示事物由甲传递给乙，如：给、卖、送、赠、奖、发、递、输、交、还、赔、付、喂。这些动词的后面大多可以添加“给”字。例如：卖他两幅画。→卖给他两幅画。（2）具有“取得”义的动作动词，表示事物由乙传递给甲，如：取、买、娶、偷、抢、骗、赢、赚、要、扣、收。","w":"high","e":["教材高频"]},{"t":"【名词解释】主谓谓语句","y":"名词解释","p":["由主谓短语充当谓语","全句主语相当于话题，谓语相当于述题","大主语/大谓语、小主语/小谓语"],"q":"主谓谓语句是由主谓短语充当谓语的句子。全句的主语相当于“话题”，谓语相当于“述题”。全句的主语叫大主语，全句的谓语叫大谓语；充当谓语的主谓短语的主语叫小主语，主谓短语的谓语叫小谓语。","w":"high","e":["教材高频"]},{"t":"简述主谓谓语句的四类，并各举一例。","y":"简答题","p":["受事性主谓谓语句","领属性主谓谓语句","关涉性主谓谓语句","周遍性主谓谓语句"],"q":"根据大主语、小主语、小谓语三者之间的语义关系，可以把主谓谓语句分为四类：（1）受事性主谓谓语句。大主语是小谓语中某个动词的受事，有时也可以是与事或工具等。例如：这件事我没有听说过。（2）领属性主谓谓语句。大主语和小主语之间有领属关系，或者是整体与部分的关系。例如：老张身体非常棒。（3）关涉性主谓谓语句。大主语是大谓语关","w":"high","e":["教材高频"]},{"t":"下列句子属于关涉性主谓谓语句的是（　　）。A.老张身体非常棒 B.这孩子我真没办法 C.今天天气很好 D.他性情温和","y":"单项选择题","p":["关涉性：大主语是大谓语关涉的对象","可加对/对于/关于","A为受事性，D为领属性"],"q":"B。关涉性主谓谓语句中，大主语是大谓语关涉的某一方面的对象，可以在大主语前面加上介词“对、对于、关于”形成句首状语。“这孩子我真没办法→对这孩子，我真没办法”。","w":"high","e":["教材高频"]},{"t":"【名词解释】存现句","y":"名词解释","p":["表示存在、出现或消失","基本格式：处所词+存现动词+事物"],"q":"存现句是表示人或事物存在、出现或消失的句子。它的基本格式是“处所词+存现动词+事物”。","w":"high","e":["教材高频"]},{"t":"简述静态存在句和动态存在句的区别。","y":"简答题","p":["动词本身有无动作性","动词是否可以从动作转化为状态","静态存在句的“着”可被“了”替换","动态存在句的“着”不能换成“了”，可转成陈述句"],"q":"静态存在句和动态存在句的区别在于两点：第一，动词本身有无动作性，比如“是”“有”只能构成静态存在句；第二，动词是否可以从动作转化为状态，所以静态存在句里的“着”能够被“了”替换，例如“桌上放着一个花瓶。→桌上放了一个花瓶。”“床上躺着一个病号。→床上躺了一个病号。”而动态存在句中的“着”不能用“了”替换，但可以转换成一","w":"high","e":["教材高频"]},{"t":"分析说明位移性隐现句与非位移性隐现句在形式上的区别，并各举两例。","y":"分析题","p":["位移性隐现句带空间位置变化，句首可加“从”","非位移性隐现句不涉及空间位置变化，句首可加“在”","举例"],"q":"隐现句表示某个地方出现或消失了什么人或事物，分为两类：（1）位移性隐现句。特点是事物的出现或消失伴随着空间位置的变化。例如：外面走进来一个女人。→从外面走进来一个女人。窗户里飞走了一只鸟。→从窗户里飞走了一只鸟。（2）非位移性隐现句。特点是事物的出现或消失不直接涉及空间位置的变化。例如：脑海里浮现出一幅神异的图画。→在","w":"normal","e":["核心考点"]},{"t":"判断：被字句的谓语动词必须是动作性较强的及物动词，非动作动词不能构成被字句。（　）","y":"判断题","p":["被字句谓语须是动作性较强的及物动词","非动作动词不能构成被字句"],"q":"正确。被字句的谓语动词必须是动作性较强的及物动词，非动作动词比如“有、是、成为”等是不能构成被字句的。同时不能是光杆动词，一般要在后面带上别的成分。","w":"high","e":["教材高频"]},{"t":"请判断下列存现句是存在句还是隐现句，并进一步分类：(1)桌上放着一个花瓶。(2)天空中盘旋着一架直升机。(3)外面走进来一个女人。(4)书架上少了一本书。","y":"分析题","p":["(1)静态存在句","(2)动态存在句","(3)位移性隐现句","(4)非位移性隐现句"],"q":"（1）“桌上放着一个花瓶”是存在句中的静态存在句，动词“放”不表示实在的动作，只表示存在的方式，后面所跟的“着”表示状态的持续。（2）“天空中盘旋着一架直升机”是存在句中的动态存在句，动词表示正在进行的动作，后面所跟的“着”表示动作的进行时态。（3）“外面走进来一个女人”是隐现句中的位移性隐现句，事物的出现伴随着空间位","w":"high","e":["教材高频"]}]},{"id":"xdhy_down-c01-s07","t":"第七节 句类系统","w":"high","n":15,"k":[{"t":"【名词解释】句类","y":"名词解释","p":["按照不同语气功能划分","陈述句、疑问句、祈使句、感叹句"],"q":"句类是句子按照不同语气功能划分出来的类型。一般分为陈述句、疑问句、祈使句和感叹句四类。","w":"high","e":["教材高频"]},{"t":"【名词解释】陈述句","y":"名词解释","p":["向听话人述说一件事情","语调平直，句尾略降","书面上用句号"],"q":"陈述句是用来向听话人述说一件事情的句子。陈述句的语调平直，句尾略降，在书面上用句号表示停顿。","w":"normal","e":["核心考点"]},{"t":"简述“不”和“没有(没)”在语义和用法上的区别。","y":"简答题","p":["不表主观意愿，没有表客观情状","不无时间限制，没有不能用于将来时","不修饰动形，没有原则上只修饰动词","不可跟几乎所有助动词，没有只跟部分助动词"],"q":"“不”和“没有(没)”都表示否定，但语义和用法有明显的区别，主要有以下几点：（1）“不”往往表示主观意愿，“没有(没)”则表示客观情状。例如：他不去英国，想去法国。/他没去英国，去了法国。（2）“不”在时间上没有限制，“没有(没)”不能用于将来时。例如：我以前不干，现在不干，将来也不会干。/我以前没干，现在也没干。（3","w":"high","e":["教材高频"]},{"t":"【名词解释】双重否定格式","y":"名词解释","p":["表示特殊肯定的意思","语气比单纯肯定或委婉或强烈"],"q":"双重否定格式用来表示特殊肯定的意思。双重否定表面上意义等于肯定，但实际上不然：有的语气比单纯肯定委婉，有的语气比单纯肯定强烈。","w":"normal","e":["核心考点"]},{"t":"【名词解释】疑问句","y":"名词解释","p":["包括疑惑和询问双重意义","两大类型：结构类型、功能类型"],"q":"疑问句包括疑惑和询问双重意义。一个疑问句，通常是既疑且问，但可以疑而不问，也可以问而不疑。疑问句有两大类型：结构类型、功能类型。","w":"high","e":["教材高频"]},{"t":"简述疑问句的四种结构类型，并各举一例。","y":"简答题","p":["是非问(语调升调或加语气词)","特指问(用疑问代词)","选择问(是……还是)","正反问(正反并列结构)"],"q":"按照结构特点，疑问句可以分为四类：（1）是非问。在结构上跟一般的陈述句相同，只要语调变为升调，或者带上疑问语气词，陈述句就变为疑问句了。例如：你去北京吗?（2）特指问。陈述句中的每一项基本上都可用疑问代词来替换，从而构成特指问句。例如：谁明天坐飞机去北京?（3）选择问。提出两种或几种选择项，希望听话人从中选择一项，经常","w":"high","e":["教材高频"]},{"t":"分析说明是非问句中语气词“吗”“吧”“啊”的疑问程度差异，并说明是非问为何不能用“呢”。","y":"分析题","p":["“吗”疑问程度强，基本不知","“吧”疑问程度弱，表示估测，求确认","“啊”惊疑兼有","是非问不能用“呢”，用“呢”变特指问简略格式"],"q":"语调是非问倾向于否定，表示难以理解、不可思议。语气词是非问则各有特点：用“吗”疑问程度比较强，基本不知，所以询问；用“吧”的疑问程度比较弱，表示一种估测，大体知道，但不敢确认，所以希望对方确认；“啊”则惊疑兼有。例如：(2)今天星期天?(怎么可能呢?应该是星期六。)(3)今天星期天吗?(4)今天星期天吧?(今天大概星期","w":"high","e":["教材高频"]},{"t":"分析特指问的两种特殊简略格式“NP+呢?”和“VP+呢?”的疑问功能。","y":"分析题","p":["NP+呢：首发句询问处所，后续句可询问其他情况","VP+呢：通常询问假设性结果，可含假设连词","一定条件下不含假设义，理解为语用省略"],"q":"特指问有两种特殊的简略格式，即在形式上没有疑问代词出现，但是句末用了疑问语气词“呢”，而且要求有针对性的回答。A.“NP(名词性成分)+呢?”这种问句，如果是首发句，通常是询问处所，相当于问“NP在哪儿呢?”。在一定的上下文里，当“NP呢?”处在后续句的情况下，也可以询问处所以外的其他情况，相当于问“NP怎么样呢?”。","w":"high","e":["教材高频"]},{"t":"简述正反问句的多种省略变化形式，并说明用“没有”否定动词时的规范用法。","y":"简答题","p":["正反问是特殊的选择问","省略变化形式多样","用“没有”否定动词时肯定形式不能用“有”，只能零形式"],"q":"正反问句提出正反两项，希望对方从中选择一项回答，所以也可以说是一种特殊的选择问。它的疑问信息是由正反并列结构承担的，所以回答往往比较简单。正反问句有多种省略的变化形式。例如：(3)开会不开会?/有人没有人?(4)开不开会?/有没有人?(5)开会不开?/有人没有?(6)开会不?/有人不?要注意的是，如果用“没有”否定动词","w":"high","e":["教材高频"]},{"t":"【名词解释】反问句","y":"名词解释","p":["又叫反诘问","无疑而问","用肯定表否定、用否定表肯定"],"q":"反问句又叫反诘问，它是“无疑而问”，即发问人心目中并没有真正的疑惑，只是在用疑问句的形式曲折地表达自己对某个事情的看法，语气上有不满、反驳的意味。通常用肯定形式表示否定意思，用否定形式表示肯定意思。","w":"high","e":["教材高频"]},{"t":"【名词解释】祈使句","y":"名词解释","p":["向听话人提出要求","主语限于第二人称代词、包括式第一人称复数、称谓词","经常省略"],"q":"向听话人提出要求，希望他做什么或别做什么的句子叫祈使句。祈使句的主语限于三类词语：第二人称代词、包括式的第一人称复数、称谓词，但是经常省略。","w":"high","e":["教材高频"]},{"t":"举例论述祈使句肯定形式和否定形式的不对称现象，并说明造成这种不对称的原因。","y":"论述题","p":["不对称现象的表现","褒贬色彩的影响","[+自主]与[-自主]语义特征的影响","带数量结构的祈使句只有肯定形式"],"q":"有些祈使句既有肯定形式又有否定形式，有些祈使句要么只有肯定形式、要么只有否定形式，我们把这叫作祈使句肯定形式和否定形式的不对称现象。例如：(1)请进来。/请别进来。(2)千万当心哪。/*千万别当心哪。(3)*请紧张。/请别紧张。造成这种不对称现象的原因在于充当祈使句谓语中心语的词语特点，关键在于它们的褒贬色彩和语义特征","w":"high","e":["教材高频"]},{"t":"【名词解释】感叹句","y":"名词解释","p":["抒发强烈感情","三类：叹词构成/带明显标志/句尾用感叹号"],"q":"感叹句是抒发强烈感情的句子。它大体上可以分为三类：直接用叹词构成的感叹句；带有明显标志的感叹句；句子形式在书面上跟一般的陈述句一样但句尾用感叹号的感叹句。","w":"normal","e":["核心考点"]},{"t":"“今天星期天吧?”属于疑问句中的（　　）。","y":"单项选择题","p":["是非问","结构同陈述句，带疑问语气词“吧”"],"q":"B","w":"high","e":["教材高频"]},{"t":"按照结构特点，疑问句可以分为＿＿＿、＿＿＿、＿＿＿、＿＿＿四类。","y":"填空题","p":["是非问","特指问","选择问","正反问"],"q":"是非问；特指问；选择问；正反问","w":"high","e":["教材高频"]}]},{"id":"xdhy_down-c01-s08","t":"第八节 句法结构中的语义分析","w":"high","n":15,"k":[{"t":"简述句法结构中的语义分析主要包括哪三种。","y":"简答题","p":["语义角色","语义指向","语义特征"],"q":"句法结构是句法形式和语义内容的统一体。对句法结构不仅要做形式分析，而且还要做种种语义分析。句法结构中的语义分析，主要是指语义角色、语义指向和语义特征三种分析。（1）语义角色是指名词性成分担任的语义角色(论元)，揭示名词性成分跟动词之间的语义关系。（2）语义指向是指句法结构中的某一成分跟其他成分之间在语义上的联系。（3）","w":"high","e":["教材高频"]},{"t":"【名词解释】语义角色","y":"名词解释","p":["名词性成分担任的语义角色(论元)","揭示名词性成分跟动词之间的语义关系"],"q":"语义角色是指在各种语义关系中，名词性成分担任的一定的语义角色(论元)，如“施事”“受事”“工具”“方式”等，这实际上也就是揭示了名词性成分跟动词之间的语义关系。","w":"high","e":["教材高频"]},{"t":"简述动词跟名词性词语之间常见的语义角色，至少列举10种并各举一例。","y":"简答题","p":["施事","受事","系事/等事","与事","结果","工具","方式","处所","时间","目的/原因/材料/致使/对象"],"q":"名词性词语经常担任的语义角色主要有：（1）施事，指动作行为的发出者，也可用介词“被”(叫、让、给)引进。例如：小牛在吃草。（2）受事，指动作行为的承受者，也可用介词“把”(将)引进。例如：小花猫逮住了一只大老鼠。（3）系事，指连系动词连接的主体。例如：他是学生。（4）等事，指连系动词连接的对象。例如：陈伟成了一名画家。","w":"high","e":["教材高频"]},{"t":"请分析下列“吃”字结构中名词性成分所担任的语义角色：(1)吃面条(2)吃大碗(3)吃食堂(4)吃大户(5)吃包月","y":"分析题","p":["吃面条：受事","吃大碗：工具","吃食堂：处所","吃大户：依据","吃包月：方式"],"q":"同一个动词与不同的名词性词语搭配就可能产生不同的语义关系：（1）“吃面条”是“动作——受事”关系。（2）“吃大碗”是“动作——工具”关系。（3）“吃食堂”是“动作——处所”关系。（4）“吃大户”是“动作——依据”关系。（5）“吃包月”是“动作——方式”关系。这说明动词同名词性词语之间的语义关系是由它们双方共同决定的，同","w":"high","e":["教材高频"]},{"t":"【名词解释】语义指向","y":"名词解释","p":["某一成分跟其他成分之间在语义上的联系","同句法关系有时一致有时不一致","重点是非直接成分之间的语义联系"],"q":"语义指向是指句法结构中的某一成分跟其他成分之间在语义上的联系。这种语义联系同句法关系有时一致，有时不一致。语义指向分析的重点是分析在结构上没有直接组合关系的语法成分之间的语义联系，即非直接成分之间的语义联系。","w":"high","e":["教材高频"]},{"t":"请分析下列句中补语的语义指向：(1)你砍快了，慢一点!(2)我砍累了。(3)我们砍光了树再休息。(4)把刀都砍钝了。","y":"分析题","p":["前指动词","前指主语","后指宾语","前指“把”的宾语"],"q":"补语的语义指向有四种情况：（1）“你砍快了，慢一点!”中补语“快”前指动词，即“你砍+砍快了”。（2）“我砍累了”中补语“累”前指主语，即“我砍+我累了”。（3）“我们砍光了树再休息”中补语“光”后指宾语，即“我们砍树+树光了”。（4）“把刀都砍钝了”中补语“钝”前指“把”的宾语，即“用刀砍树+刀钝了”。","w":"high","e":["教材高频"]},{"t":"请分析下列句中状语的语义指向：(1)血压急剧下降。(2)祥子青筋蹦跳地坐下。(3)花也很多，圆圆的排成一个圈。(4)我把王群满意地打发走了。","y":"分析题","p":["后指中心语","前指主语","后指宾语","前指介词“把”的宾语"],"q":"状语的语义指向有四种情况：（1）“血压急剧下降”中状语“急剧”后指中心语，描写“下降”的速度。（2）“祥子青筋蹦跳地坐下”中状语“青筋蹦跳”前指主语，即“祥子青筋蹦跳”，描写动作者在进行动作时的表情、姿态、心理状态。（3）“花也很多，圆圆的排成一个圈”中状语“圆圆的”后指宾语，即“排成一个圆圆的圈”。（4）“我把王群满","w":"high","e":["教材高频"]},{"t":"请分析说明“她又买了一件毛衣”中“又”的语义指向，并指出如何用设置语境的方法加以分析。","y":"分析题","p":["a指向“她”","b指向“买”","c指向“一件”","d指向“毛衣”"],"q":"“她又买了一件毛衣”语义指向不同，可以通过设置语境的方法来分析：（1）a.我买了一件毛衣，她又买了一件毛衣。“又”语义指向“她”。（2）b.她已借了一件毛衣，她又买了一件毛衣。“又”语义指向“买”。（3）c.她已买了两件毛衣，她又买了一件毛衣。“又”语义指向“一件”。（4）d.她已买了一件皮衣，她又买了一件毛衣。“又”","w":"high","e":["教材高频"]},{"t":"【名词解释】语义特征","y":"名词解释","p":["符合某种组合选择","有区别性特征","最小语义成分"],"q":"词语中符合某种组合选择的有区别性特征的最小语义成分就是语义特征。词与词在选择搭配时既有一定的语法限制，也有一定的语义限制，这种语义限制实际上就是词与词在语义成分上的适应性。","w":"high","e":["教材高频"]},{"t":"请运用语义特征分析“台上坐着主席团”与“台上唱着戏”两组句子的变换差异，并作解释。","y":"分析题","p":["A组“坐/盖”具有[+附着]，表示存在，着眼空间","B组“唱/下”具有[+持续]，表示进行，着眼时间","变换式相反证明语义特征差异"],"q":"A组“台上坐着主席团”“身上盖着毯子”与B组“台上唱着戏”“外头下着雨”词语序列相同，内部的结构层次、结构关系也相同，但变换式却正好相反：(1)台上坐着主席团→主席团坐在台上→*台上正在坐着主席团(2)台上唱着戏→*戏唱在台上→台上正在唱着戏。变换式不同反映出两组句子具有不同的语法意义：A组表示“存在”，说明事物的位置","w":"high","e":["教材高频"]},{"t":"请运用语义特征分析说明“倒了一杯水”与“烧了一车炭”产生歧义的原因。","y":"分析题","p":["“倒1/烧1”具有[+去掉]","“倒2/烧2”具有[+获得]","名词语义特征也制约句义，“纸”[+可燃性]、“水”[-可燃性]"],"q":"“倒了一杯水”可以理解为“倒掉”或“倒上”，“烧了一车炭”可以理解为“烧掉”或“烧得”，关键就在于动词的语义特征的不同：“倒1”和“烧1”具有[+去掉]语义特征，“倒2”和“烧2”具有[+获得]的语义特征。这就比较合理地解释了造成这类歧义现象的原因。此外，名词的语义特征也同样重要，例如“烧了一张纸”只能够理解为“烧掉”","w":"high","e":["教材高频"]},{"t":"请运用语义特征分析说明为什么能说“谦虚点儿”“老实点儿”“灵活点儿”，但不能说“健康点儿”“伟大点儿”“高尚点儿”。","y":"分析题","p":["“谦虚/老实/灵活”具有[+可控]/[+自主]特征，可入祈使式","“健康/伟大/高尚”不具有[+可控]特征，不可入祈使式","祈使句对形容词有语义特征选择限制"],"q":"“谦虚点儿”“老实点儿”“灵活点儿”能够成立，而“健康点儿”“伟大点儿”“高尚点儿”不能成立，原因在于形容词的语义特征不同。“谦虚、老实、灵活”具有[+可控]或[+自主]的语义特征，人们可以有意识地通过努力去改变或达到这种状态，因此可以进入“A点儿”的祈使格式；而“健康、伟大、高尚”不具有[+可控]的语义特征，不是人的","w":"normal","e":["核心考点"]},{"t":"“他把书拿走了”中“书”担任的语义角色是（　　）。","y":"单项选择题","p":["受事","动作行为的承受者","由介词“把”引进"],"q":"B","w":"high","e":["教材高频"]},{"t":"句法结构中的语义分析，主要是指＿＿＿、＿＿＿和＿＿＿三种分析。","y":"填空题","p":["语义角色","语义指向","语义特征"],"q":"语义角色；语义指向；语义特征","w":"high","e":["教材高频"]},{"t":"下列句子中补语语义指向主语的是（　　）。A.你砍快了 B.我们砍光了树 C.我砍累了 D.把刀都砍钝了","y":"单项选择题","p":["前指主语：我砍累了、我学会了滑雪","B前指动词、D后指宾语、E前指把的宾语"],"q":"C。补语语义指向分四种：前指动词、前指主语、后指宾语、前指“把”的宾语。“我砍累了”中“累”前指主语(我砍+我累了)。A前指动词，B后指宾语，D前指“把”的宾语。","w":"high","e":["教材高频"]}]},{"id":"xdhy_down-c01-s09","t":"第九节 歧义结构与框式结构","w":"high","n":12,"k":[{"t":"【名词解释】歧义现象","y":"名词解释","p":["一个语言片断可作两种或两种以上的语义理解","又叫做同形","以同形为前提"],"q":"歧义现象是指一个语言片断可以作两种或两种以上的语义理解。歧义又叫做“同形”，一个着眼于内容，一个着眼于形式。歧义必须以同形作为前提，不同形就无所谓歧义。","w":"high","e":["教材高频"]},{"t":"简述歧义的分类系统(从存在方式和产生根源两个角度)。","y":"简答题","p":["存在方式：口头歧义、书面歧义","产生根源：词汇歧义、组合歧义","组合歧义分为语法组合歧义和语义组合歧义"],"q":"（1）按照歧义现象存在的方式，可以先把它分为口头歧义和书面歧义。口头歧义主要是由同音词造成的，例如“你qīzhōng考试考得怎么样?(期中/期终)”“岸边停着一艘yóuchuán。(游船/油船/邮船)”。（2）书面歧义比较复杂，从歧义所产生的根源来分析可以分为词汇歧义和组合歧义。词汇歧义主要是由词的多义而引起的，例如“","w":"high","e":["教材高频"]},{"t":"请指出下列短语产生歧义的原因(歧义类型)：(1)进口彩电(2)饭不热了(3)自行车没有锁","y":"分析题","p":["进口彩电：结构关系不同(述宾/偏正)","饭不热了：词类不同(形容词/动词)","自行车没有锁：词类不同(副词/动词、名词/动词)"],"q":"（1）“进口彩电”属于语法组合歧义中的“结构关系不同”，可分析为述宾关系或偏正关系（进口的彩电/进口彩电这一行为）。（2）“饭不热了”属于语法组合歧义中的“词类不同”，“热”可理解为形容词或动词。（3）“自行车没有锁”属于语法组合歧义中的“词类不同”，“没有”可理解为副词或动词，“锁”可理解为名词或动词。这三例都属于语","w":"high","e":["教材高频"]},{"t":"请指出下列歧义句的歧义类型，并加以分化：(1)这个人谁都不认识。(2)开刀的是他的父亲。(3)汽车运走了。(4)提拔团长。","y":"分析题","p":["语义角色不同","这个人：施事/受事","他的父亲：施事/受事","汽车：受事/工具
