常工作由其常设机构“国家对外汉语教学领导小组办公室”（简称“汉办”）负责，第一任办公室主任为北京语言学院院长吕必松。","1993年国家教委发布的《中国教育改革和发展纲要》中更进一步提出要“大力加强对外汉语教学工作”。"],"q":"1987年7月国务院批准成立了由国家教委、国务院外事办公室、外交部、文化部、广播电影电视部、新闻出版署、国家语言文字工作委员会等政府部门及北京语言学院组成的“国家对外汉语教学领导小组”（1998年已扩展为由11个政府部门组成），由当时的国家教委负责人任组长。","w":"high","e":["2018 真题"]},{"t":"“精讲多练”","y":"名词解释","p":["钟梫《十五年汉语教学总结》一文中特别提到了“精讲多练”和“课内课外相结合”的实践性原则，用汉语进行课堂教学的直接性原则，教学内容与学生的专业相结合的学以致用原则，以及“语文并进”，听说读写全面要求、阶段侧重等主要的教学原则。","这些从长期教学实践中总结出来的宝贵经验，虽然还缺乏理论的指导和系统的阐述，但却是对对外汉语教学规律早期探索所得出的重要共识，对后来的教学得以坚持正确的方向起了保证作用，也为学科理论建设奠定了基础。"],"q":"钟梫《十五年汉语教学总结》一文中特别提到了“精讲多练”和“课内课外相结合”的实践性原则，用汉语进行课堂教学的直接性原则，教学内容与学生的专业相结合的学以致用原则，以及“语文并进”，听说读写全面要求、阶段侧重等主要的教学原则。","w":"high","e":["2018 真题"]},{"t":"“结构、功能、文化相结合”原则","y":"名词解释","p":["在深化理论研究的基础上，教学层面的应用研究也有了新的发展。与国外研究的趋势相一致，这一阶段对教学原则的研究和总结，成为教学法研究的重点。","特别是其中的“结构、功能、文化相结合”的原则，已成为带有中国特色的汉语作为第二语言教学的一项重要原则。","在教学法的研究方面，提出了“结构与功能相结合”的原则以及“交际性原则”，并紧密结合教学的需要对对外汉语预备教育、短期教育、进修教育及现代汉语专业的本科教育等门类的课程与教材进行了全面的改革试验。"],"q":"在深化理论研究的基础上，教学层面的应用研究也有了新的发展。与国外研究的趋势相一致，这一阶段对教学原则的研究和总结，成为教学法研究的重点。","w":"high","e":["2019 真题"]},{"t":"开创对外汉语教学事业时期","y":"名词解释","p":["对外汉语教学五十年的发展史，以1978年为界分为两个时期。1978年以前的20多年为第一时期，即“开创对外汉语教学事业”的时期，是我们对这项新的事业进行摸索、试验并不断积累经验的经验型时期。","开创事业时期（50年代初至70年代末）又可分为三个阶段，即初创阶段、巩固阶段和恢复阶段。"],"q":"对外汉语教学五十年的发展史，以1978年为界分为两个时期。1978年以前的20多年为第一时期，即“开创对外汉语教学事业”的时期，是我们对这项新的事业进行摸索、试验并不断积累经验的经验型时期。","w":"high","e":["2017 真题"]},{"t":"确立对外汉语教育学科时期","y":"名词解释","p":["1978年以后的20年为“确立对外汉语教育学科”的时期，是我们为使学科得到认定而自觉地进行学科建设，从理论和实践上探讨学科的规律并大力发展这一学科，由经验型向科学型转变的时期。","这20年又可分为80年代的“建构学科理论框架”阶段和90年代的“深化学科理论研究”阶段。","之所以提出以1978年为分界线……1978年是对外汉语教育学科发展的起点，这一年中国社会科学院召开的北京地区语言学科规划座谈会上，第一次提出把对外汉语教学“作为一个专门学科来研究”。"],"q":"1978年以后的20年为“确立对外汉语教育学科”的时期，是我们为使学科得到认定而自觉地进行学科建设，从理论和实践上探讨学科的规律并大力发展这一学科，由经验型向科学型转变的时期。","w":"high","e":["2017 真题"]},{"t":"我国对外汉语教学事业开始于____年，通常以____年为界分为“开创对外汉语教学事业”和“确立对外汉语教育学科”两个时期。","y":"填空题","p":["我国对外汉语教学事业开始于1950年","以1978年为界分为两个时期"],"q":"1950；1978","w":"high","e":["2017 真题"]},{"t":"1950年7月在清华大学成立的我国第一个对外汉语教学机构是“____”。","y":"填空题","p":["1950年7月在清华大学成立第一个对外汉语教学机构“东欧交换生 学院被戴上了“黑学校”、“小西方”的帽子于1971年被宣布撤销，从此全国的对外汉语教学中断了六七年。","w":"normal","e":["核心考点"]},{"t":"1978年提出把对外汉语教学“作为一个专门学科来研究”的会议是（　）。","y":"单项选择题","p":["1978年是对外汉语教育学科发展的起点，这一年中国社会科学院召开的北京地区语言学科规划座谈会上，第一次提出把对外汉语教学“作为一个专门学科来研究”"],"q":"B","w":"high","e":["2017 真题"]}]},{"id":"yinlun-c02-s02","t":"第二节 我国对外汉语教学的发展现状","w":"high","n":16,"k":[{"t":"中国汉语水平考试（HSK）","y":"名词解释","p":["中国汉语水平考试(HSK)研究（北京语言学院）——1985年夏第一套试卷测试成功，1990年初中等考试通过国家鉴定，获国家教委1991年科技进步奖，1993年正式成为国家标准化考试，也是目前世界上最具权威性、影响最大的汉语水平测试。","其理论成果《汉语水平考试研究》获1991年北京市第二届哲学社会科学优秀成果二等奖。"],"q":"中国汉语水平考试(HSK)研究（北京语言学院）——1985年夏第一套试卷测试成功，1990年初中等考试通过国家鉴定，获国家教委1991年科技进步奖，1993年正式成为国家标准化考试，也是目前世界上最具权威性、影响最大的汉语水平测试。","w":"high","e":["2020 真题"]},{"t":"世界汉语教学学会","y":"名词解释","p":["1987年在北京举行第二届国际汉语教学讨论会期间，各国代表协商成立了“世界汉语教学学会”。","该会的成立是为了促进世界汉语教学与研究的交流与合作，推动世界汉语教学与研究的发展。","秘书处也一直设在北京语言学院，首任会长为朱德熙，现有30多个国家和地区的800多名会员。","1999年8月将举行第六届国际汉语教学讨论会。"],"q":"1987年在北京举行第二届国际汉语教学讨论会期间，各国代表协商成立了“世界汉语教学学会”。","w":"high","e":["2019 真题"]},{"t":"中国对外汉语教学学会","y":"名词解释","p":["1983年6月成立的“中国教育学会对外汉语教学研究会”于1988年独立为“中国对外汉语教学学会”，秘书处设在北京语言学院，首任会长为吕必松。","该会现有会员700多人，至今已举行过六届学术讨论会，并组织过多次国内外学术交流活动。","由于教学事业和学科研究发展的需要，1996年又先后成立了北京、华东、华北、华南和东北等五个地区分会。"],"q":"1983年6月成立的“中国教育学会对外汉语教学研究会”于1988年独立为“中国对外汉语教学学会”，秘书处设在北京语言学院，首任会长为吕必松。","w":"high","e":["2021 真题"]},{"t":"汉语言专业","y":"名词解释","p":["1975年，原北京语言学院开始试办以外国留学生为对象、以汉语作为第二语言的教育为特征的四年制“汉语言”专业本科，当初提出的培养目标为汉语教师、翻译和汉语研究人才。","接着南开大学、南京大学、复旦大学等院校也相继设立该专业，现在全国已有20多所大学设立了汉语言本科专业。","1996年北京语言文化大学又开设了外国留学生四年制“中国语言文化”本科专业。"],"q":"1975年，原北京语言学院开始试办以外国留学生为对象、以汉语作为第二语言的教育为特征的四年制“汉语言”专业本科，当初提出的培养目标为汉语教师、翻译和汉语研究人才。","w":"normal","e":["核心考点"]},{"t":"1987年7月国务院批准成立了“____”，其常设机构简称“____”，第一任办公室主任为吕必松。","y":"填空题","p":["1987年7月国务院批准成立了……“国家对外汉语教学领导小组”","日常工作由其常设机构“国家对外汉语教学领导小组办公室”（简称“汉办”）负责"],"q":"国家对外汉语教学领导小组；汉办","w":"high","e":["2018 真题"]},{"t":"中国汉语水平考试的英文缩写是____，1993年正式成为国家____考试。","y":"填空题","p":["中国汉语水平考试(HSK)研究","1993年正式成为国家标准化考试"],"q":"HSK；标准化","w":"high","e":["2020 真题"]},{"t":"1987年在第二届国际汉语教学讨论会期间成立的国际性学术组织是“____”，首任会长为____。","y":"填空题","p":["各国代表协商成立了“世界汉语教学学会”","首任会长为朱德熙"],"q":"世界汉语教学学会；朱德熙","w":"normal","e":["核心考点"]},{"t":"“国家对外汉语教学领导小组”成立于1987年，其常设机构简称“汉办”。","y":"判断题","p":["1998年已扩展为由11个政府部门组成","第一任办公室主任为吕必松"],"q":"正确。1987年7月国务院批准成立了“国家对外汉语教学领导小组”，日常工作由其常设机构“国家对外汉语教学领导小组办公室”（简称“汉办”）负责。","w":"high","e":["2018 真题"]},{"t":"中国汉语水平考试（HSK）正式成为国家标准化考试是在（　）年。","y":"单项选择题","p":["1993年正式成为国家标准化考试"],"q":"D","w":"normal","e":["核心考点"]},{"t":"1975年北京语言学院开始试办的四年制“汉语言”专业的培养目标是（　）。","y":"单项选择题","p":["当初提出的培养目标为汉语教师、翻译和汉语研究人才"],"q":"A","w":"normal","e":["核心考点"]},{"t":"提出“对外汉语教学已发展成为一门新的学科”，并于1984年题词“对外汉语教学是一门科学”的语言学家是（　）。","y":"单项选择题","p":["王力先生于1984年题词写道：“对外汉语教学是一门科学。”"],"q":"A","w":"normal","e":["核心考点"]},{"t":"简述我国对外汉语教学教育体系和课程体系的发展。","y":"简答题","p":["由单一的汉语预备教育（非学历）发展到学历教育","本科—硕士—博士完整学历教育体系","非学历教育门类发展","课程分为语言技能课、语言知识课和中国文化知识课"],"q":"①教育体系：在开创事业时期，对外汉语教学基本上只有一种类型，即为将来进入中国有关大学学习某项专业的外国留学生进行一至二年的汉语预备教育，属非学历教育。到确立学科时期，开始了本专业的大学本科教育和研究生教育：1975年北京语言学院开始试办四年制“汉语言”专业本科；1986年北京语言学院成为硕士学位授予单位；1997年全国","w":"high","e":["2016 真题"]},{"t":"【案例】某海外中学的汉语教师发现，虽然近年来学习汉语的学生人数增长很快，但学校仍把汉语作为选修课，周课时只有1～2学时，教学上以教师讲解语法、学生阅读为主，缺乏听说技能训练；学生学了两三年仍开不了口。同事中有人认为“汉语难学，能读懂就行”。请结合世界汉语教学的发展特点，按照“发现问题—分析问题—解决问题”的思路，写一篇800字以上的案例分析。","y":"案例分析","p":["发现问题：课时少、重阅读轻听说、交际能力差","分析问题：汉语仍属非普遍教授语言、附属于汉学","分析问题：强调阅读、以教师讲解语法为主的弊端","解决问题：以培养交际能力为目标、技能训练为中心、精讲多练"],"q":"①发现问题：该校汉语教学存在课时少、重阅读轻听说、以教师讲解语法为主、学生交际能力差等问题。②分析问题：依据教材，当前世界汉语教学呈现的特点之一是“学习汉语的人数迅速增长，教学规模不断扩大，但在世界绝大多数地区汉语仍属‘非普遍教授语言’”；另一特点是在很大程度上汉语教学仍附属于汉学，重古代汉语轻现代汉语、重阅读轻听说，","w":"normal","e":["核心考点"]},{"t":"简述我国对外汉语教学发展现状的主要成就（五个方面）。","y":"简答题","p":["国家和民族的事业","学科地位得到确认","学科教育体系和课程体系","学科理论体系","教师队伍建设"],"q":"①国家和民族的事业：1989年国家教委明确指出“发展对外汉语教学事业是一项国家和民族的事业”。②学科地位：对外汉语教学作为一门学科的地位在我国已得到学术界和政府的确认，成立了学术团体和研究机构。③学科教育体系和课程体系：建立了多类型、多层次、比较完整的教育体系和趋向科学化的课程体系。④学科理论体系：初步形成了自己的学科","w":"high","e":["2016 真题"]},{"t":"简述我国对外汉语教师队伍培养方式的发展。","y":"简答题","p":["50-60年代主要来自中文系、外语系毕业生","60年代培养出国储备师资","1983年设对外汉语教学本科专业","1986年招硕士研究生","1997年建成本科—硕士—博士完整体系"],"q":"①50年代至60年代初，对外汉语教师大部分来自高等院校中文系的毕业生，小部分来自外语系的毕业生。②60年代初，基于教师既应有较高的中国语言文学水平、又应有较高的外语水平的认识，采取选择一部分中文系毕业生学习外语的方法，培养出国储备师资。③80年代进一步认识到本学科教师在知识结构和能力素养方面特殊的要求，需要培养适合本学","w":"normal","e":["核心考点"]},{"t":"1997年全国第一个带有对外汉语教学方向的“语言学和应用语言学”博士专业获准在北京语言文化大学建立。","y":"判断题","p":["1986年北京语言学院成为硕士学位授予单位","1997年建立全国第一个对外汉语教学“学科教学论”硕士专业"],"q":"正确。1997年全国第一个带有对外汉语教学方向的“语言学和应用语言学”博士专业获准在北京语言文化大学建立，本学科有了从学士学位到博士学位的完整的学历教育体系。","w":"normal","e":["核心考点"]}]},{"id":"yinlun-c02-s03","t":"第三节 世界汉语教学的发展特点","w":"normal","n":10,"k":[{"t":"五个“C”","y":"名词解释","p":["文件提出了用来概括21世纪第二语言教育的目标和学习标准的5个“C”：Communication（运用语言进行交际）、Cultures（体认多元文化）、Connections（贯连其他学科）、Comparisons（通过比较了解语言文化的特性）、Communities（应用于国内和国外的多元社区）。","美国“外语教育委员会”(ACTFL)等40多个单位在联邦政府教育部和全美人文基金会的资助下，用了数年的时间于1996年完成了《外语学习的标准：迎接21世纪》的研究项目，提出了新世纪第二语言(外语)教育的纲领。"],"q":"文件提出了用来概括21世纪第二语言教育的目标和学习标准的5个“C”：Communication（运用语言进行交际）、Cultures（体认多元文化）、Connections（贯连其他学科）、Comparisons（通过比较了解语言文化的特性）、Communities（应用于国内和国外的多元社区）。","w":"normal","e":["核心考点"]},{"t":"非普遍教授语言","y":"名词解释","p":["（1）学习汉语的人数迅速增长，教学规模不断扩大，但在世界绝大多数地区汉语仍属“非普遍教授语言”。","当时美国学习外语的大、中学生中91%选择西、法、德三大“普遍教授语言”，其余的所有被称为“非普遍教授语言”的都包括在9%之中。","而汉语与日语、阿语、朝语、东南亚语、非洲语及葡语、北欧语等数十种语言一起，又只占其中的1%不到。"],"q":"（1）学习汉语的人数迅速增长，教学规模不断扩大，但在世界绝大多数地区汉语仍属“非普遍教授语言”。","w":"normal","e":["核心考点"]},{"t":"汉语是世界上使用人数最多的语言，是联合国的____种工作语言之一。","y":"填空题","p":["汉语是世界上使用人数最多的语言，是联合国的六种工作语言之一"],"q":"六","w":"normal","e":["核心考点"]},{"t":"在世界绝大多数地区，汉语已属“普遍教授语言”。","y":"判断题","p":["美国学习外语学生中91%选择西、法、德三大“普遍教授语言”","汉语与日语、阿语等数十种语言一起又只占其中的1%不到"],"q":"错误。学习汉语的人数迅速增长、教学规模不断扩大，但在世界绝大多数地区汉语仍属“非普遍教授语言”。","w":"normal","e":["核心考点"]},{"t":"欧洲各国有着重汉学、轻汉语教学的传统，汉语教学在很大程度上仍附属于汉学。","y":"判断题","p":["在汉语教学中重古代汉语轻现代汉语，重阅读轻听说","汉学界对汉语教学的偏见依然存在"],"q":"正确。16至18世纪汉学兴起，而18至19世纪才逐渐开始教授汉语，因此有着重汉学、轻汉语教学的倾向；汉语教学一直附属于汉学而不能成为一门受重视的学科。","w":"normal","e":["核心考点"]},{"t":"汉语教学历史最久、从公元3世纪或更早时就开始的国家是（　）。","y":"单项选择题","p":["我国周边国家，由于历史和文化的渊源关系，汉语教学历史最久。日本、朝鲜、越南等国是从公元3世纪或更早时开始的"],"q":"A","w":"normal","e":["核心考点"]},{"t":"简述当前世界汉语教学发展的主要特点。","y":"简答题","p":["学习人数迅速增长但仍属非普遍教授语言","现代汉语教学受到重视但仍附属于汉学","专业教育、学历教育有所发展、向中小学发展，但起点低"],"q":"①学习汉语的人数迅速增长，教学规模不断扩大，但在世界绝大多数地区汉语仍属“非普遍教授语言”。②现代汉语的教学日益受到重视，但在很大程度上汉语教学仍附属于汉学，未能成为独立的学科。③中文的专业教育、学历教育有所发展，汉语教学出现向中、小学发展的趋势，但总的看来学生学习汉语的起点仍比较低，多数地区尚不能培养高级汉语人才。","w":"normal","e":["核心考点"]},{"t":"简述对外汉语教学与世界汉语教学的关系。","y":"简答题","p":["汉语作为第二语言教学包括对外汉语教学与汉语作为外语的教学两方面","两部分在教学对象、内容、目标、规律上基本相同","对外汉语教学是世界汉语教学的中心和基地","世界汉语教学规模更大、经验更丰富"],"q":"①作为第二语言的汉语教学大体上包括两个方面：在使用汉语的环境里进行的汉语作为第二语言的教学，即对外汉语教学；和在非汉语环境里进行的常常是汉语作为外语的教学。②这两部分虽然主要因为语言环境的差别而影响到教学方法上的差异，但在教学对象、教学内容、教学目标和教学规律方面基本上是相同的。③我国对外汉语教学仅是世界汉语作为第二语","w":"normal","e":["核心考点"]},{"t":"简述世界汉语教学发展的三个高潮期。","y":"简答题","p":["第一个高潮：50年代东欧和亚洲社会主义国家","第二个高潮：70年代恢复联合国席位、改革开放","第三个高潮：90年代中期我国经济高速发展推动"],"q":"这50年间世界汉语教学的发展有三个高潮期。①第一个高潮出现在50年代新中国刚成立时，主要是东欧和亚洲的社会主义国家纷纷开展汉语教学。②第二个高潮是从70年代我国恢复在联合国的合法席位、与许多西方国家建立外交关系开始，特别是70年代末我国实行改革开放，扩大了与世界各国、尤其是西方国家的交流与合作，这期间很多欧美国家的汉语","w":"normal","e":["核心考点"]},{"t":"据不完全统计，目前全世界有（　）多个国家的主要大学开设中文系或中文课程。","y":"单项选择题","p":["据不完全统计，目前全世界有70多个国家的主要大学开设中文系或中文课程"],"q":"C","w":"normal","e":["核心考点"]}]}]},{"id":"yinlun-c03","t":"第三章 对外汉语教学的语言学基础和教育学基础","w":"high","s":[{"id":"yinlun-c03-s01","t":"第一节 对外汉语教学的语言学基础(一)","w":"high","n":14,"k":[{"t":"语言和言语","y":"名词解释","p":["根据瑞士语言学家索绪尔对语言（langue）和言语（parole）的区分，语言是对言语的抽象和概括，常常指作为社会惯例的语音、词汇、语法的规则系统；言语是语言的表现形式，也可以说是个人对语言在特定环境中的运用。","语言存在于言语之中，通过言语来体现，平常我们接触到(听到、看到)都是具体的言语。","两者的关系好比“人”和张三、李四的关系：张三、李四是“人”的具体表现形式，而“人”是对张三、李四等很多人的特点的抽象。"],"q":"根据瑞士语言学家索绪尔对语言（langue）和言语（parole）的区分，语言是对言语的抽象和概括，常常指作为社会惯例的语音、词汇、语法的规则系统；言语是语言的表现形式，也可以说是个人对语言在特定环境中的运用。","w":"high","e":["2017 真题"]},{"t":"语言能力","y":"名词解释","p":["乔姆斯基在60年代提出“语言能力”的概念，并将内在的“语言功能”与“语言表现”，即对语言的实际运用做了区分。","所谓“语言能力”是指人们所具有的语言知识，是一种内化了的包括语音、词汇、语法等的语言规则体系。","根据转换生成语言理论，一个人的语言能力主要表现在能正确组合声音和语素；能区分是否合乎语法的句子；能区分结构相同或相似但意义不同的句子等；而最根本之点则是能运用这一有限的规则体系创造出无限的句子。","可见“语言能力”主要是与语言形式结构有关，实际上是一种高度抽象的语法能力，是一种脱离外部语言环境的、人的内部心理机制。"],"q":"乔姆斯基在60年代提出“语言能力”的概念，并将内在的“语言功能”与“语言表现”，即对语言的实际运用做了区分。","w":"high","e":["2018 真题"]},{"t":"结构主义语言学","y":"名词解释","p":["20世纪初语言学进入新的发展时期。1906年到1911年瑞士语言学家索绪尔在日内瓦大学讲授普通语言学，1916年由他的学生整理出版了他的讲稿《普通语言学教程》。","索绪尔被公认为现代语言学的主要奠基人，其语言理论也成了现代语言学的指导思想。","索绪尔语言理论的核心是语言是符号系统，这一系统由很多小系统组成；符号由“能指”(形式)和“所指”(概念)两部分构成。","在30年代有三个学派：强调语言符号的功能的布拉格功能语言学派，强调语言符号间各种关系的哥本哈根语符学派，强调共时描写语言事实的美国描写语言学派。"],"q":"20世纪初语言学进入新的发展时期。1906年到1911年瑞士语言学家索绪尔在日内瓦大学讲授普通语言学，1916年由他的学生整理出版了他的讲稿《普通语言学教程》。","w":"high","e":["2018 真题"]},{"t":"转换生成语法","y":"名词解释","p":["20世纪中期在美国出现了转换生成语法学派，其标志是1957年美国麻省理工学院乔姆斯基的《句法结构》一书的出版。","他提出区分“语言能力”——人们内化了的语言规则体系和“语言表现”——语言能力的实际运用。","为此，他提出“语言习得机制”和“普遍语法”的假说和“深层结构”、“表层结构”的理论。这样就把语言学的触角伸向人类认知领域，探讨语言的心理过程。","转换生成语法学派的出现，称为“乔姆斯基革命”，开拓了语言研究的新领域。"],"q":"20世纪中期在美国出现了转换生成语法学派，其标志是1957年美国麻省理工学院乔姆斯基的《句法结构》一书的出版。","w":"high","e":["2017 真题"]},{"t":"功能主义语言学","y":"名词解释","p":["60年代末、70年代功能主义语言学兴起，标志着语言研究重点由语言形式转向语言功能，这是语言学研究领域又一次拓宽。","功能主义学派的代表人物有英国的韩礼德、法国的马丁内等著名语言学家，中心在欧洲。","以弗斯为奠基人的伦敦功能结构语言学派认为语言的本质是意义——语言环境中的意义，语义是语言研究的中心，主张从社会的角度去观察、研究语言，强调语言的社会性。","韩礼德继承和发展了弗斯的理论，建立了系统——功能语法理论，以“系统语法”为框架论述语言功能。"],"q":"60年代末、70年代功能主义语言学兴起，标志着语言研究重点由语言形式转向语言功能，这是语言学研究领域又一次拓宽。","w":"high","e":["2020 真题"]},{"t":"语言的物质形式是____，语言符号是____和意义的结合体。","y":"填空题","p":["语言的物质形式是声音，语言符号是声音和意义的结合体"],"q":"声音；声音","w":"normal","e":["核心考点"]},{"t":"根据索绪尔对语言（langue）和____（parole）的区分，语言是对言语的抽象和概括。","y":"填空题","p":["索绪尔对语言（langue）和言语(parole)的区分"],"q":"言语","w":"high","e":["2017 真题"]},{"t":"语言符号的形式与意义的结合是必然的，音义之间有必然联系。","y":"判断题","p":["符号的形式与意义的结合是任意的","音义关系是约定俗成的","约定后有强制性"],"q":"错误。符号的形式与意义的结合是任意的，没有什么必然的联系；语言中的音和义的关系也完全是“约定俗成”的。但符号一经由社会“约定”，就有强制性，社会成员必须遵守。","w":"normal","e":["核心考点"]},{"t":"语言本质上是口头的，文字是第二性的，语言的学习和教学应从听、说开始。","y":"判断题","p":["语言是一种符号系统","声音是语言的物质外壳"],"q":"正确。声音是语言的物质外壳，语言本质上是口头的，文字是第二性的。语言的学习和教学应从听、说开始，首先着眼于口头语言。","w":"normal","e":["核心考点"]},{"t":"区分“语言”和“言语”的瑞士语言学家是（　）。","y":"单项选择题","p":["根据瑞士语言学家索绪尔对语言（langue）和言语(parole)的区分"],"q":"B","w":"high","e":["2017 真题"]},{"t":"出版《普通语言学教程》、被公认为现代语言学主要奠基人的是（　）。","y":"单项选择题","p":["索绪尔被公认为现代语言学的主要奠基人，其语言理论也成了现代语言学的指导思想"],"q":"B","w":"normal","e":["核心考点"]},{"t":"1957年出版《句法结构》、开创转换生成语法学派的是（　）。","y":"单项选择题","p":["其标志是1957年美国麻省理工学院乔姆斯基的《句法结构》一书的出版"],"q":"C","w":"normal","e":["核心考点"]},{"t":"简述语言的基本特征对对外汉语教学的启示（以符号系统、交际工具为例）。","y":"简答题","p":["符号系统：重视意义、掌握语言系统、从听说开始","交际工具：以培养交际能力为根本目标、体现工具课技能课特点"],"q":"①语言是一种符号系统：启示(1)学习一种语言要重视意义，要掌握音义的联系，遵守约定俗成的社会规则；(2)要掌握语言系统和各分支系统，对外汉语教学的主要内容是语音、词汇、语法和汉字四个要素及其相关系统；(3)声音是语言的物质外壳，语言本质上是口头的，文字是第二性的，语言的学习和教学应从听、说开始。②语言是人类最重要的交际","w":"high","e":["2018 真题"]},{"t":"简述语言学四大流派及其对应的第二语言教学法。","y":"简答题","p":["历史比较语言学—语法翻译法","结构主义语言学—听说法、视听法","转换生成语法—认知法","功能主义语言学—交际法"],"q":"语言学一个多世纪的发展中出现了四大主要思潮：①历史比较语言学（18世纪末19世纪初），强调语言间的共同点，影响到以语法知识为纲、以与母语的翻译对比为基本手段的语法翻译法。②结构主义语言学（20世纪前半叶），把语言看做一种工具和手段，通过刺激—反应来获得，强调各种语言之间的差别，着重研究和描写不同的语言系统及其结构形式，","w":"high","e":["2017 真题"]}]},{"id":"yinlun-c03-s02","t":"第二节 对外汉语教学的语言学基础(二)","w":"high","n":21,"k":[{"t":"交际能力","y":"名词解释","p":["社会语言学家海姆斯在60年代提出了不同的看法，他认为一个人的语言能力不仅指能否说出合乎语法的句子，还包括能否在一定的语言环境中恰当地使用语言的能力。","海姆斯首次提出了“交际能力”（communicative competence）的概念，即运用语言（或非语言手段)进行社会交往的能力，包括传递信息、交流思想和表达感情。","海姆斯还进一步提出了交际能力的四个特征：语法性——指语法上是否正确；可接受性——在交际中能否被接受；得体性——在一定的语境中是否恰当，是否合乎社会文化习惯；现实性——是否是现实中常用的。","交际能力既包括语言能力，也包括语言运用的能力。"],"q":"社会语言学家海姆斯在60年代提出了不同的看法，他认为一个人的语言能力不仅指能否说出合乎语法的句子，还包括能否在一定的语言环境中恰当地使用语言的能力。","w":"high","e":["2019 真题"]},{"t":"话语","y":"名词解释","p":["简单说来，话语是在交际过程中一定语境下表示完整语义的自然语言，是由结构衔接、语义连贯、排列符合逻辑来表达某个主题的连续的句子所构成的语言整体。","话语从形式上看通常是大于句子的语言单位，可能是句组、段落甚至篇章；也可能只是一个句子，一个短语甚至一个词。","话语既包括口语，也包括书面语。"],"q":"简单说来，话语是在交际过程中一定语境下表示完整语义的自然语言，是由结构衔接、语义连贯、排列符合逻辑来表达某个主题的连续的句子所构成的语言整体。","w":"high","e":["2018 真题"]},{"t":"会话分析","y":"名词解释","p":["由于会话是口头表达的一种常见形式，对日常会话的结构与规律进行分析的“会话分析”已成为话语分析的重要组成部分。","70年代美国社会学家萨克斯等分析自然话语，指出会话的特点是“话轮替换”（turn-taking），发话人从头至尾连续的一段话称为一个“话轮”(turn)，会话中每次须保持一人说话。","会话结构的基本单位是“毗邻应对”(adjacency pair)，即会话双方的发话与应对一前一后紧密相连；有时也会出现“插入序列”甚至出现打断发话者的“分岔序列”。"],"q":"由于会话是口头表达的一种常见形式，对日常会话的结构与规律进行分析的“会话分析”已成为话语分析的重要组成部分。","w":"high","e":["2016 真题"]},{"t":"言语行为理论","y":"名词解释","p":["50年代末英国哲学家奥斯汀提出“言语行为”理论（speech act theory）。","他指出语言不仅是描写、陈述和说明客观世界，提供信息，而且人们说出话语也是一种行为。人们在说话的时候，就是在做一件事，完成一种行为。","奥斯汀认为人们所说出的话语能同时进行三种行为，即言内行为、言外行为和言后行为。","仍以“屋里很热”这句话为例，言内行为是说话人通过发声把这句话说出来；言外行为则是通过这句话来表达隐含的真正意图，也就是言外之意；言后行为则是指这句话对听话人所产生的影响。"],"q":"50年代末英国哲学家奥斯汀提出“言语行为”理论（speech act theory）。","w":"high","e":["2019 真题"]},{"t":"合作原则","y":"名词解释","p":["60年代中期美国语言哲学家格赖斯提出了会话含义理论，他认为会话能顺利进行需要双方互相配合，共同遵守一些基本原则。他提出“合作原则”，包括四项准则。","四项准则：(1)质的准则——所说的话要真实，不要说自知是虚假的话，或缺乏足够证据的话。(2)量的准则——所说的话应包含交谈目的所需要的信息，而不要包含超出需要的信息。(3)关系准则——所说的话必须是有关的，要切题。(4)方式准则——所说的话要清楚，有条理，简练，避免晦涩、歧义。"],"q":"60年代中期美国语言哲学家格赖斯提出了会话含义理论，他认为会话能顺利进行需要双方互相配合，共同遵守一些基本原则。他提出“合作原则”，包括四项准则。","w":"high","e":["2018 真题"]},{"t":"会话含义","y":"名词解释","p":["对“会话含义”（conversational implicature）的研究实际上就是对会话中说话者的言外之意的研究。","所以会话含义是指会话中说话者因违反“合作原则”而产生的言外之意。","但在实际语言交际中，人们常常出于某种礼貌或其他目的，故意违反这些合作原则，从而产生言外之意让听话者去领会。","格赖斯会话含义理论后来不断得到补充和完善。"],"q":"对“会话含义”（conversational implicature）的研究实际上就是对会话中说话者的言外之意的研究。","w":"high","e":["2018 真题"]},{"t":"语言形式与语言功能","y":"名词解释","p":["语言形式通常指语音、语法、词汇等语言的结构体系，也称语言结构。语言功能指语言所能发挥的作用。","随着社会语言学的兴起，强调语言作为交际工具的职能，人们更重视语言的交际功能。这里所说的语言功能，就是指用语言做事，或者说用语言完成交际任务。","韩礼德认为儿童在语言发展过程中就掌握了七种功能：工具功能、控制功能、交往功能、表达个体功能、启发功能、想像功能、信息功能。","他把成人的语言功能归纳为三种：观念功能、交际功能、话语功能。"],"q":"语言形式通常指语音、语法、词汇等语言的结构体系，也称语言结构。语言功能指语言所能发挥的作用。","w":"high","e":["2020 真题"]},{"t":"海姆斯首次提出了“____”的概念，即运用语言进行社会交往的能力。","y":"填空题","p":["海姆斯首次提出了“交际能力”（communicative competence）的概念"],"q":"交际能力","w":"high","e":["2019 真题"]},{"t":"美国语言学家卡纳尔等1983年提出的模式概括了交际能力的四个方面：语法能力、____、话语能力和____。","y":"填空题","p":["他概括了交际能力的四个方面","语法能力、社会语言能力、话语能力和策略能力"],"q":"社会语言能力；策略能力","w":"high","e":["2018 真题"]},{"t":"奥斯汀认为人们所说出的话语能同时进行三种行为，即____、____和____。","y":"填空题","p":["即言内行为、言外行为和言后行为"],"q":"言内行为；言外行为；言后行为","w":"high","e":["2019 真题"]},{"t":"格赖斯提出的“合作原则”包括四项准则：质的准则、____、____和方式准则。","y":"填空题","p":["质的准则","量的准则","关系准则","方式准则"],"q":"量的准则；关系准则","w":"high","e":["2018 真题"]},{"t":"会话结构的基本单位是“____”，即会话双方的发话与应对一前一后紧密相连。","y":"填空题","p":["会话结构的基本单位是“毗邻应对”(adjacency pair)"],"q":"毗邻应对","w":"normal","e":["核心考点"]},{"t":"海姆斯认为交际能力就是乔姆斯基所说的语言能力。","y":"判断题","p":["交际能力包括传递信息、交流思想和表达感情","海姆斯提出交际能力的四个特征：语法性、可接受性、得体性、现实性"],"q":"错误。海姆斯认为一个人的语言能力不仅指能否说出合乎语法的句子，还包括能否在一定的语言环境中恰当地使用语言的能力；交际能力既包括语言能力，也包括语言运用的能力。","w":"high","e":["2019 真题"]},{"t":"格赖斯认为会话含义是指说话者遵守合作原则而产生的字面意义。","y":"判断题","p":["合作原则包括四项准则","人们常常出于某种礼貌或其他目的故意违反这些合作原则，从而产生言外之意"],"q":"错误。会话含义是指会话中说话者因违反“合作原则”而产生的言外之意。","w":"high","e":["2018 真题"]},{"t":"话语从形式上看通常都大于句子，只能是句组、段落或篇章。","y":"判断题","p":["话语是在交际过程中一定语境下表示完整语义的自然语言","话语既包括口语，也包括书面语"],"q":"错误。话语从形式上看通常是大于句子的语言单位，可能是句组、段落甚至篇章；也可能只是一个句子，一个短语甚至一个词。","w":"normal","e":["核心考点"]},{"t":"建立系统—功能语法理论的语言学家是（　）。","y":"单项选择题","p":["韩礼德建立了系统———功能语法理论，以“系统语法”为框架论述语言功能"],"q":"D","w":"normal","e":["核心考点"]},{"t":"最早提出“话语分析”这一术语的学者是（　）。","y":"单项选择题","p":["美国语言学家哈里斯于1952年最早提出这一术语"],"q":"A","w":"normal","e":["核心考点"]},{"t":"简述交际能力的构成（卡纳尔模式）。","y":"简答题","p":["语法能力","社会语言能力","话语能力","策略能力"],"q":"美国语言学家卡纳尔等于1983年提出的模式影响较大，他概括了交际能力的四个方面：①语法能力——指对语言规则系统的掌握，包括语音、拼写、词的组成、词汇、句子结构等规则，并掌握听说读写技能，能辨别并造出合乎语法的句子，也就是语言能力。②社会语言能力——指掌握语用规则、在真实的社会语境中得体地运用语言的能力，涉及参加者、场合","w":"high","e":["2018 真题"]},{"t":"简述言语行为理论的基本内容。","y":"简答题","p":["奥斯汀提出言语行为理论","说出话语也是一种行为","三种行为：言内行为、言外行为、言后行为","以“屋里很热”为例说明"],"q":"①50年代末英国哲学家奥斯汀提出“言语行为”理论。他指出语言不仅是描写、陈述和说明客观世界，提供信息，而且人们说出话语也是一种行为。人们在说话的时候，就是在做一件事，完成一种行为。②奥斯汀认为人们所说出的话语能同时进行三种行为，即言内行为、言外行为和言后行为。以“屋里很热”为例：言内行为是说话人通过发声把这句话说出来，","w":"high","e":["2019 真题"]},{"t":"简述会话的基本结构和规则。","y":"简答题","p":["会话特点是话轮替换","会话结构基本单位是毗邻应对","插入序列、分岔序列、预示语列、开头序列、结束序列","会话规则体现为语义连贯性、共有知识和合作原则"],"q":"①会话的特点是“话轮替换”，发话人从头至尾连续的一段话称为一个“话轮”，会话中每次须保持一人说话；发话者与受话者不断变换角色，轮流发话。②会话结构的基本单位是“毗邻应对”，即会话双方的发话与应对一前一后紧密相连；有时也会出现“插入序列”甚至出现打断发话者的“分岔序列”；在做出请求、邀请、宣告前，为避免遭到对方的拒绝，常","w":"high","e":["2016 真题"]},{"t":"试论述功能主义语言学对对外汉语教学的影响。","y":"论述题","p":["形式主义与功能主义两大思潮","交际能力理论及其构成","语言形式与语言功能、话语分析、言语行为理论、会话含义理论","培养交际能力成为目标共识，交际法成为最受关注的教学法"],"q":"要点：①从语言学发展看，长期以来对语言的研究存在形式主义与功能主义两大思潮，近30年来语言学发展的一个主要特点是语言研究的重点从语言的形式和结构转向语言的功能和使用。②功能主义语言学的主要理论贡献包括：语言能力和交际能力的区分（海姆斯提出交际能力概念，卡纳尔提出交际能力四方面）；语言形式和语言功能的研究（韩礼德的语言功","w":"high","e":["2019 真题"]}]},{"id":"yinlun-c03-s03","t":"第三节 对外汉语教学的教育学基础","w":"high","n":20,"k":[{"t":"学科课程论","y":"名词解释","p":["学科课程论在我国孔子时代和欧洲的希腊罗马学校中早已有之，17世纪的夸美纽斯和18世纪著名德国教育家赫尔巴特进一步奠定了理论基础，至今仍为我国和世界各国的大多数学校所采用。","这是一种以学科的知识体系为中心的课程理论，强调以各门学科知识固有的逻辑体系来组织课程。","对社会生活实际和学生的兴趣、需要及接受能力考虑不多。"],"q":"学科课程论在我国孔子时代和欧洲的希腊罗马学校中早已有之，17世纪的夸美纽斯和18世纪著名德国教育家赫尔巴特进一步奠定了理论基础，至今仍为我国和世界各国的大多数学校所采用。","w":"high","e":["2026 真题"]},{"t":"活动课程论","y":"名词解释","p":["活动课程论。代表人物是美国实用主义教育家杜威。这是以经验为中心的课程理论，强调学生的生活经验中包括了各方面的知识，课程的编排应与生活经验的发展顺序相一致。","这种课程论强调要让学生掌握解决实际问题的知识，提倡“教育即生活”，“在做中学”，适应以培养能力为主的教学。","活动课程论强调发挥学生学习的主动性，强调教学与社会生活的联系，但对科学知识本身的逻辑体系和逻辑顺序注意不够，不利于学生掌握系统的知识。"],"q":"活动课程论。代表人物是美国实用主义教育家杜威。这是以经验为中心的课程理论，强调学生的生活经验中包括了各方面的知识，课程的编排应与生活经验的发展顺序相一致。","w":"high","e":["2026 真题"]},{"t":"教学过程","y":"名词解释","p":["教师和学生共同参与的教学活动过程叫教学过程。对教学过程规律的研究也称为过程论，是广义的教学论中的一部分。","教学过程的性质，按照马克思主义的观点是学生的认识过程，而且是一种特殊的认识过程。","其特殊性表现为：(1)学生不是真刀真枪直接同客观事物打交道，而是通过书本和课堂接受前人总结的实践经验；(2)学生的认识活动是在教师的引导下进行的；(3)学生的认识过程不只是知识技能掌握的过程，而且是德智体美全面发展的过程；(4)作为教学过程中学生的认识活动，不是学生自发的、主动的要求，而是在教师和课本影响下进行的。"],"q":"教师和学生共同参与的教学活动过程叫教学过程。对教学过程规律的研究也称为过程论，是广义的教学论中的一部分。","w":"high","e":["2018 真题"]},{"t":"教学原则","y":"名词解释","p":["教学原则是从一定的教育和教学目的出发，在教学实践的基础上，根据对教学过程客观规律的认识而制订的指导教学工作的基本要求。","教学原则对一切教学活动，包括教学计划的制定、教学内容的选择、教学过程的组织、教学方法手段的运用都有指导作用。","教学原则有继承性，像早在17世纪由夸美纽斯第一次系统提出的直观性、自觉性、系统性、巩固性、量力性五大教学原则，在一定程度上反映了教学规律，至今仍有指导意义。","教学原则不能是一般哲学原则或社会政治原则的套用，必须结合教育实际、体现教育的特点。"],"q":"教学原则是从一定的教育和教学目的出发，在教学实践的基础上，根据对教学过程客观规律的认识而制订的指导教学工作的基本要求。","w":"high","e":["2020 真题"]},{"t":"启发式","y":"名词解释","p":["教学方法的根本指导思想是“启发式”，即教师从学生的实际出发，采取各种有效的办法调动学生学习的积极性和主动性，引导他们自己去学习。","与之相反的指导思想是“注入式”，教师单方面地向学生灌输知识，学生被动地接受知识。","显然，启发式符合辩证唯物主义内因和外因互相作用的规律。学生自觉、主动的学习是内因，起着决定性的作用；教师的指引、帮助则是外因。","启发式教学不仅有利于具体教学任务的完成，更重要的是培养了学生的学习能力，养成学生的好的学习习惯。"],"q":"教学方法的根本指导思想是“启发式”，即教师从学生的实际出发，采取各种有效的办法调动学生学习的积极性和主动性，引导他们自己去学习。","w":"high","e":["2019 真题"]},{"t":"教育史上影响最大的两种课程理论是____和____。","y":"填空题","p":["影响最大的是学科课程理论和活动课程论"],"q":"学科课程论；活动课程论","w":"high","e":["2026 真题"]},{"t":"活动课程论的代表人物是美国实用主义教育家____，这种课程论提倡“教育即生活”“____”。","y":"填空题","p":["活动课程论。代表人物是美国实用主义教育家杜威","提倡“教育即生活”，“在做中学”"],"q":"杜威；在做中学","w":"high","e":["2026 真题"]},{"t":"杜威的“设计教学法”模式的过程为：“设置问题的情境→确定问题的性质→拟定解决问题的方案→执行计划→____”。","y":"填空题","p":["其过程为：“设置问题的情境→确定问题的性质→拟定解决问题的方案→执行计划→检验与评价”"],"q":"检验与评价","w":"normal","e":["核心考点"]},{"t":"17世纪捷克教育家夸美纽斯发表划时代的著作《____》（1657年）建立了教学论。","y":"填空题","p":["夸美纽斯发表划时代的著作《大教学论》(1657年)建立教学论"],"q":"大教学论","w":"normal","e":["核心考点"]},{"t":"活动课程论以学科的知识体系为中心，对社会生活实际和学生的兴趣考虑不多。","y":"判断题","p":["学科课程论强调以各门学科知识固有的逻辑体系来组织课程","活动课程论提倡“教育即生活”，“在做中学”"],"q":"错误。以学科的知识体系为中心的是学科课程论；活动课程论是以经验为中心的课程理论，强调教学与社会生活的联系。","w":"high","e":["2026 真题"]},{"t":"教学原则可以是一般哲学原则或社会政治原则的套用。","y":"判断题","p":["教学原则是根据对教学过程客观规律的认识而制订的指导教学工作的基本要求","教学原则具有理论概括性"],"q":"错误。教学原则不能是一般哲学原则或社会政治原则的套用，必须结合教育实际、体现教育的特点；也不能是教学经验的简单反映，而是经过反复检验并上升到理论高度、具有理论概括性。","w":"normal","e":["核心考点"]},{"t":"在人的发展中，遗传、环境和教育三者缺一不可，而教育起着主导作用。","y":"判断题","p":["遗传素质是人发展的物质前提","环境因素是人发展的客观条件","教育起着主导作用"],"q":"正确。就语言人才的培养而论，当前主要靠学校教育；在人的发展中，遗传、环境、教育三者缺一不可，而教育又起着主导作用。","w":"normal","e":["核心考点"]},{"t":"以“设计教学法”为代表、主张“在做中学”的教育家是（　）。","y":"单项选择题","p":["活动式的指导思想是强调学生的直接经验","活动式以美国实用主义教育家杜威(J. Dewey)的“设计教学法”模式为代表"],"q":"B","w":"high","e":["2026 真题"]},{"t":"提出“学科结构论”和“发现学习论”的教育家是（　）。","y":"单项选择题","p":["发现式以美国心理学家和教育学家布鲁纳(J. S. Bruner)的“学科结构论”和“发现学习论”理论为代表"],"q":"C","w":"normal","e":["核心考点"]},{"t":"第一次系统提出直观性、自觉性、系统性、巩固性、量力性五大教学原则的教育家是（　）。","y":"单项选择题","p":["像早在17世纪由夸美纽斯第一次系统提出的直观性、自觉性、系统性、巩固性、量力性五大教学原则"],"q":"A","w":"normal","e":["核心考点"]},{"t":"简述普遍教学原则（九条）。","y":"简答题","p":["科学性与思想性相结合","知识传授与智能发展相结合","理论联系实际与理论知识为主导相结合","教师主导作用与学生主动性自觉性相结合","统一的培养要求与因材施教相结合","系统性与循序渐进性相结合","直观性、巩固性、量力性"],"q":"教材提出的普遍教学原则：(1)科学性与思想性相结合的原则；(2)知识传授与智能发展相结合的原则；(3)理论联系实际与理论知识为主导相结合的原则；(4)教师的主导作用与学生主动性、自觉性相结合的原则；(5)统一的培养要求与因材施教相结合的原则；(6)系统性与循序渐进性相结合的原则；(7)直观性原则；(8)巩固性原则；(9","w":"high","e":["2020 真题"]},{"t":"简述教学过程的四种模式。","y":"简答题","p":["传授式—夸美纽斯","活动式—杜威","发现式—布鲁纳","发展式—赞科夫"],"q":"①传授式：在教师主导下系统地传授书本知识的模式，以夸美纽斯的“观察—记忆—理解—练习”过程为代表，这是传统模式也是影响最大的模式。②活动式：在教师辅导下学生通过活动自己进行探究性学习的模式，以杜威的“设计教学法”模式为代表。③发现式：既主张学生学习最新、系统、有严密逻辑结构的科学知识，又要求学生通过自己的活动去发现知识","w":"high","e":["2018 真题"]},{"t":"简述影响教学方法的因素及教学方法的主要类别。","y":"简答题","p":["影响因素：教学理论、教学手段、课程改革","选择依据：教学目的任务、教师学生、教学环境手段","四类方法：讲授、观察、训练、陶冶","第二语言教学以训练为主"],"q":"①影响教学方法的因素主要有：教学理论以及学习理论的发展；教学手段不断地改进；课程的改革。而对教学方法的具体选择，则决定于：教学目的和教学任务，教师的条件和学生的特点，教学环境和教学手段。②以教学活动的主要途径为依据，教学方法可分为四类：以语言讲授为主的教学方法；以观察为主的教学方法；以训练为主的教学方法；以陶冶为主的教","w":"normal","e":["核心考点"]},{"t":"试论述教育学为什么是对外汉语教学最直接的基础理论学科，以及运用一般教育学原理时应注意什么。","y":"论述题","p":["对外汉语教育学与教育学是分支学科与总学科的关系","教育规律和教学规律对本学科有指导意义","第二语言教学的四个特殊性","需自己发现特殊规律并对教育学做贡献"],"q":"要点：①对外汉语教育学是语言教育学的分支学科，而语言教育学又是一门分科教育学。因此对外汉语教育学与教育学的关系是分支学科与总学科、下位学科与上位学科的关系，这是一种最直接的关系。②教育学是研究教育规律的科学，其重要组成部分——教学论则是研究教学规律的理论。教育学中教育的本质、教育方针、教育目的等和教学论中有关教学过程、","w":"high","e":["2021 真题"]},{"t":"【案例】一位对外汉语教师在课堂上一向重视语法知识的系统讲授，把汉语的语法规则讲得十分细致，学生笔记记得很全，但一到实际交流就说不出来。请结合教育学基础中的教学过程理论、课程论和教学方法理论，按照“发现问题—分析问题—解决问题”的思路，写一篇800字以上的案例分析。","y":"案例分析","p":["发现问题：重知识讲授、轻技能训练，学生说不出来","分析问题：第二语言教学的工具性技能性特点","分析问题：教学方法应以训练为主、指导思想是启发式","解决问题：精讲多练、以训练为主、启发式教学、结合活动课程论"],"q":"①发现问题：该教师把汉语课当成语法知识讲解课，学生“会记不会说”，交际能力差。②分析问题：依据教材，第二语言教学更强调语言理解和表达能力的培养，教学更多地体现工具性、技能性的特点；教学过程的性质是学生的认识过程，学生要在教师引导下通过大量练习实践、尤其是真实语言环境中真刀真枪地实践才能真正掌握语言规则。从课程论看，第二","w":"high","e":["2019 真题"]}]}]},{"id":"yinlun-c04","t":"第四章 对外汉语教学的心理学基础和文化学基础","w":"high","s":[{"id":"yinlun-c04-s01","t":"第一节 对外汉语教学的心理学基础","w":"high","n":30,"k":[{"t":"格式塔心理学","y":"名词解释","p":["20世纪初德国出现了反对构造主义的学派，即格式塔心理学，其创始人为韦特海默、考夫卡和柯勒。","德文“格式塔”（Gestalt）的意思是“整体”，又称“完形学派”。","该派反对把意识化解成元素，主张把心理作为一个整体组织来研究。认为整体不能还原为各个部分、各种元素；整体先于部分而存在并制约着部分的性质和意义；部分相加不等于整体，整体大于部分之和。","格式塔学派强调采用综合方法研究心理现象，在研究方法上主要采用演示和主观报告的方法，并在知觉、学习和问题解决等方面展开大量的实验研究。"],"q":"20世纪初德国出现了反对构造主义的学派，即格式塔心理学，其创始人为韦特海默、考夫卡和柯勒。","w":"high","e":["2025 真题"]},{"t":"行为主义","y":"名词解释","p":["20世纪的美国心理学界出现了反对构造主义和机能主义的另一种思潮——行为主义。这是强调学习过程和测量外显行为的心理学派，其创始人是美国心理学家华生，后期主要代表人物是斯金纳。","行为主义有两个主要特点：否认意识，主张心理学只研究人的行为；反对内省，主张采用客观的实验的方法。","华生受俄国巴甫洛夫经典性条件反射学说的影响，建立了刺激——反应模式，成为经典性行为主义理论。新行为主义代表人物之一的斯金纳，则受到操作主义哲学的影响，建立了操作行为主义，和“刺激——反应——强化”的模式。"],"q":"20世纪的美国心理学界出现了反对构造主义和机能主义的另一种思潮——行为主义。这是强调学习过程和测量外显行为的心理学派，其创始人是美国心理学家华生，后期主要代表人物是斯金纳。","w":"high","e":["2026 真题"]},{"t":"认知心理学","y":"名词解释","p":["认知心理学出现在本世纪初，在60年代由于行为主义心理学弱点的暴露而迅速发展起来。1967年美国心理学家奈塞尔发表《认知心理学》一书，标志着现代认知心理学的正式诞生。","广义的认知就是指人的认识活动，认知心理学研究人的认知过程，并把认知作为人的全部心理活动的过程。","认知心理学不是把人看做是刺激的被动接受者，而是信息加工者，一种具有丰富的内在资源并能利用这些资源与周围环境发生相互作用的积极的有机体。"],"q":"认知心理学出现在本世纪初，在60年代由于行为主义心理学弱点的暴露而迅速发展起来。1967年美国心理学家奈塞尔发表《认知心理学》一书，标志着现代认知心理学的正式诞生。","w":"high","e":["2019 真题"]},{"t":"人本主义心理学","y":"名词解释","p":["人本主义心理学是本世纪60年代才在美国兴起的一个心理学流派，创始人是马斯洛，影响最大的代表人物是罗杰斯。","人本主义心理学强调心理学的首要任务是了解人、揭示人性的本质，认为既不要把人神化，也不要把人兽化。","人本主义心理学强调人的价值和尊严，强调人有自由的意志，有发展自身潜能和自我实现的需要。","在人与人的关系中，情感因素起决定作用，反对强迫、压制的方法，而是要启示人的自我意识，促进人的自我实现。"],"q":"人本主义心理学是本世纪60年代才在美国兴起的一个心理学流派，创始人是马斯洛，影响最大的代表人物是罗杰斯。","w":"high","e":["2020 真题"]},{"t":"关键期","y":"名词解释","p":["据此，伦尼伯格于60年代提出语言习得“关键期”（critical period)或称“临界期”假说。","所谓语言习得关键期，就是指在青春期(12岁左右)以前，由于大脑语言功能侧化尚未完成，左脑和右脑都能参与语言习得的这段时期。","此时大脑灵活，可塑性大，因而比较容易习得语言。这是习得母语的最佳时期。","对语言习得关键期的假说，也存在不同看法。有的研究显示，婴儿一出生，大脑左半球就有对语音敏感的倾向，到四五岁大脑功能侧化就已基本完成。"],"q":"据此，伦尼伯格于60年代提出语言习得“关键期”（critical period)或称“临界期”假说。","w":"high","e":["2018 真题"]},{"t":"记忆","y":"名词解释","p":["记忆是过去的经验在人脑中的保存和提取，是人脑对过去经历过的事物的反映。","第二语言记忆则是指第二语言知识和能力的保持和再现，是第二语言学习者主动积极的活动过程。","记忆按其内容分为形象记忆、逻辑记忆、情绪记忆和运动记忆等，第二语言记忆涉及到所有这些方面。","记忆按保持的状态和时间分为感觉记忆、短时记忆和长时记忆。"],"q":"记忆是过去的经验在人脑中的保存和提取，是人脑对过去经历过的事物的反映。","w":"high","e":["2019 真题"]},{"t":"长时记忆","y":"名词解释","p":["长时记忆是在头脑中长期保持的记忆，从保持一分钟以上直至终生。","长时记忆的容量是没有限度的，它的信息主要来自短时记忆，也有特别强烈的感知记忆一下子直接进入长时记忆。","短时记忆的信息要进入长时记忆，需要该信息呈现一定的强度(如生动程度)和重复，有的研究认为一个单词要反复10次才能记住。","长时记忆中信息主要以意义的形式保持，而不是逐词逐句的内容，也缺少细节。"],"q":"长时记忆是在头脑中长期保持的记忆，从保持一分钟以上直至终生。","w":"normal","e":["核心考点"]},{"t":"短时记忆","y":"名词解释","p":["短时记忆又称操作记忆，典型的例子是人们在拨电话时记住刚查找的号码，打完电话马上就忘掉了。短时记忆是对信息进行操作的系统，是动态系统。","感觉信息在短时记忆中保存一分钟左右，通常是以听觉形式编码，且基本保持逐词逐句的内容。","短时记忆容量有限，信息一次呈现后能在短时记忆中正确回忆起7±2个信息单位，以数字计大约为5至7个数，不相连的字母为7个，无关联的汉字一次则能记住6个。","在第二语言学习中如能在短时记忆中组成有意义的信息单位，如词、句，则记忆容量可以大大增加。"],"q":"短时记忆又称操作记忆，典型的例子是人们在拨电话时记住刚查找的号码，打完电话马上就忘掉了。短时记忆是对信息进行操作的系统，是动态系统。","w":"high","e":["2017 真题"]},{"t":"遗忘曲线","y":"名词解释","p":["这就是德国著名心理学家、记忆与遗忘现象实验研究的创始人艾宾浩斯的遗忘曲线。","遗忘规律启示我们，在第二语言教学中对已识记的材料应赶在遗忘以前迅速地、及时地进行巩固、复习、重现和运用，并且要经常复习，复习的间距由短拉长。","从识记的时间来看，遗忘的进程并不是均衡的。在识记的最初时间遗忘很快，识记后的一小时遗忘率达56％，以后就逐渐放慢，31天后遗忘率达79%，到一定程度就不再遗忘。"],"q":"这就是德国著名心理学家、记忆与遗忘现象实验研究的创始人艾宾浩斯的遗忘曲线。","w":"high","e":["2020 真题"]},{"t":"前摄抑制","y":"名词解释","p":["干扰信息保持的因素有两类：一类是前边的学习活动对现在的记忆的保持所产生的影响，称为前摄抑制，也就是旧的记忆干扰新的记忆；另一类是后边的学习活动对现在的记忆保持所产生的影响，称为倒摄抑制，也就是后边的新的记忆干扰旧的记忆。","实验证明：两种学习活动的内容或材料完全相同或完全不同时，不会引起抑制；只有当二者既有相同又有不同处时才产生因内容类似而引起的抑制，特别是相同与不同各占一半时，引起的抑制最大。","为防止这两类抑制的作用，第二语言教学中尽可能把近似的材料分隔开学习。"],"q":"干扰信息保持的因素有两类：一类是前边的学习活动对现在的记忆的保持所产生的影响，称为前摄抑制，也就是旧的记忆干扰新的记忆；另一类是后边的学习活动对现在的记忆保持所产生的影响，称为倒摄抑制，也就是后边的新的记忆干扰旧的记忆。","w":"high","e":["2018 真题"]},{"t":"20世纪初德国出现的、反对构造主义的心理学派是____，德文意思是“整体”，又称“____”。","y":"填空题","p":["20世纪初德国出现了反对构造主义的学派，即格式塔心理学","德文“格式塔”（Gestalt）的意思是“整体”，又称“完形学派”"],"q":"格式塔心理学；完形学派","w":"high","e":["2025 真题"]},{"t":"行为主义的创始人是美国心理学家____，后期主要代表人物是____。","y":"填空题","p":["其创始人是美国心理学家华生","后期主要代表人物是斯金纳"],"q":"华生；斯金纳","w":"high","e":["2026 真题"]},{"t":"1967年美国心理学家____发表《认知心理学》一书，标志着现代认知心理学的正式诞生。","y":"填空题","p":["1967年美国心理学家奈塞尔发表《认知心理学》一书，标志着现代认知心理学的正式诞生"],"q":"奈塞尔","w":"normal","e":["核心考点"]},{"t":"伦尼伯格于60年代提出语言习得“____”假说，指在青春期(12岁左右)以前，由于大脑语言功能侧化尚未完成，左脑和右脑都能参与语言习得的这段时期。","y":"填空题","p":["伦尼伯格于60年代提出语言习得“关键期”（critical period)或称“临界期”假说"],"q":"关键期","w":"high","e":["2018 真题"]},{"t":"记忆过程包括____、____、再认和重现四个基本环节。","y":"填空题","p":["记忆过程包括识记、保持、再认和重现四个基本环节"],"q":"识记；保持","w":"high","e":["2018 真题"]},{"t":"记忆按保持的状态和时间分为____、____和____。","y":"填空题","p":["记忆按保持的状态和时间分为感觉记忆、短时记忆和长时记忆"],"q":"感觉记忆；短时记忆；长时记忆","w":"normal","e":["核心考点"]},{"t":"德国心理学家艾宾浩斯提出的____揭示了遗忘的进程先快后慢的规律。","y":"填空题","p":["这就是德国著名心理学家、记忆与遗忘现象实验研究的创始人艾宾浩斯的遗忘曲线"],"q":"遗忘曲线","w":"high","e":["2020 真题"]},{"t":"干扰信息保持的两类因素是____和____。","y":"填空题","p":["一类是前边的学习活动对现在的记忆的保持所产生的影响，称为前摄抑制","另一类是后边的学习活动对现在的记忆保持所产生的影响，称为倒摄抑制"],"q":"前摄抑制；倒摄抑制","w":"high","e":["2018 真题"]},{"t":"语言习得关键期就是指在青春期(12岁左右)以前，由于大脑语言功能侧化尚未完成，左脑和右脑都能参与语言习得的这段时期。","y":"判断题","p":["由伦尼伯格于60年代提出","此时大脑灵活，可塑性大，比较容易习得语言"],"q":"正确。所谓语言习得关键期，就是指在青春期(12岁左右)以前，由于大脑语言功能侧化尚未完成，左脑和右脑都能参与语言习得的这段时期。","w":"high","e":["2018 真题"]},{"t":"感觉记忆的容量(称记忆广度)很小，只能容纳少量信息。","y":"判断题","p":["感觉记忆(也称感觉登记或瞬间记忆)是指感知后信息保持极短时间的记忆，通常以毫秒计","被登记的信息只有在受到特别注意或经过模式的识别后，才能进入短时记忆系统"],"q":"错误。感觉记忆的容量(称记忆广度)很大，足够接纳进入感官的所有信息，并以最快的速度决定其去留。","w":"normal","e":["核心考点"]},{"t":"行为主义心理学成为听说法、视听法、程序教学法等教学法流派的心理学理论基础。","y":"判断题","p":["行为主义强调学习过程和测量外显行为","否认意识，主张心理学只研究人的行为"],"q":"正确。在第二语言教学方面，行为主义成为听说法、视听法、程序教学法等很多有重大影响的教学法流派的心理学理论基础。","w":"high","e":["2026 真题"]},{"t":"格式塔心理学的核心观点是“部分相加等于整体”。","y":"判断题","p":["格式塔心理学又称“完形学派”","主张把心理作为一个整体组织来研究"],"q":"错误。格式塔心理学认为部分相加不等于整体，整体大于部分之和；整体先于部分而存在并制约着部分的性质和意义。","w":"high","e":["2025 真题"]},{"t":"主张把心理作为一个整体组织来研究、认为“整体大于部分之和”的心理学派是（　）。","y":"单项选择题","p":["格式塔学派……主张把心理作为一个整体组织来研究……整体大于部分之和"],"q":"C","w":"high","e":["2025 真题"]},{"t":"主张心理学只研究人的外显行为、反对内省的心理学派是（　）。","y":"单项选择题","p":["行为主义……否认意识，主张心理学只研究人的行为；反对内省，主张采用客观的实验的方法"],"q":"D","w":"high","e":["2026 真题"]},{"t":"以马斯洛为创始人、以罗杰斯为最大代表人物的心理学派是（　）。","y":"单项选择题","p":["人本主义心理学是本世纪60年代才在美国兴起的一个心理学流派，创始人是马斯洛(A. Maslow)，影响最大的代表人物是罗杰斯(C. R. Rogers)"],"q":"D","w":"normal","e":["核心考点"]},{"t":"由奥地利维也纳精神病医生弗洛伊德创立的心理学派是（　）。","y":"单项选择题","p":["心理学的精神分析学派是本世纪初由奥地利维也纳精神病医生弗洛伊德(S. Freud)创立的"],"q":"C","w":"normal","e":["核心考点"]},{"t":"心理学的“格式塔”一词的德文意思是（　）。","y":"单项选择题","p":["德文“格式塔”（Gestalt）的意思是“整体”，又称“完形学派”"],"q":"A","w":"high","e":["2025 真题"]},{"t":"简述记忆过程包括的四个基本环节。","y":"简答题","p":["识记","保持","再认和重现","识记分无意识记和有意识记、机械识记和意义识记"],"q":"记忆过程包括识记、保持、再认和重现四个基本环节。这实际上体现了信息的输入、储存和输出的过程。①识记：记忆过程的第一个阶段，是指通过各种感觉器官感知、识别并记住第二语言的知识和技能的心理过程，是建立暂时神经联系痕迹的过程。识记按其目的分为无意识记和有意识记；依照材料是否有意义又分为机械识记和意义识记。②保持：对已识记的第","w":"high","e":["2018 真题"]},{"t":"简述艾宾浩斯遗忘规律及影响遗忘的因素对第二语言教学的启示。","y":"简答题","p":["艾宾浩斯遗忘曲线及复习启示","识记内容与兴趣、难易","识记数量与分散识记","过度学习150%","多通道输入增强记忆"],"q":"①从识记的时间来看，遗忘的进程并不是均衡的。在识记的最初时间遗忘很快，识记后的一小时遗忘率达56%，以后逐渐放慢，31天后遗忘率达79%，到一定程度就不再遗忘，即艾宾浩斯遗忘曲线。启示：对已识记的材料应赶在遗忘以前迅速地、及时地进行巩固、复习、重现和运用，并且要经常复习，复习的间距由短拉长。②从识记的内容看，有意义内容","w":"high","e":["2020 真题"]},{"t":"简述心理学主要流派及其对第二语言教学的影响。","y":"简答题","p":["构造主义、机能主义、格式塔心理学","行为主义影响听说法、视听法、程序教学法","认知心理学影响认知法","人本主义影响咨询法、默教法","行为主义、认知心理学、人本主义对学习理论影响最大"],"q":"①构造主义：奠基人是冯特，典型代表人物铁欣纳，主张通过内省的方法研究心理结构。②机能主义：创始人是詹姆士，代表人物还有杜威，强调研究意识的作用。③格式塔心理学：创始人为韦特海默、考夫卡和柯勒，主张把心理作为一个整体组织来研究，对视听法教学流派整体结构的学习理论有一定影响。④行为主义：创始人是华生，后期主要代表人物斯金纳","w":"high","e":["2026 真题"]}]},{"id":"yinlun-c04-s02","t":"第二节 对外汉语教学的文化学基础(一)","w":"high","n":18,"k":[{"t":"文化休克","y":"名词解释","p":["这些表现叫“文化震荡症”，也叫“文化休克”（cultural shock）。","文化休克是指在非本民族文化环境中生活或学习的人，由于文化的冲突和不适应而产生的深度焦虑的精神症状。","在跨文化交际中，或是进入非本民族文化生活环境中，以及学习目的语文化的过程中，文化差异都会引起人们的心理反应，产生一定的文化冲突，经历从文化不适应到适应的过程。这一过程大体上分为四个阶段：蜜月阶段、挫折阶段、调整阶段、适应阶段。","处于异文化环境中的人一般都要经历这一挫折期和文化震荡症。只不过文化震荡症在不同人身上表现的形式和程度不完全相同。"],"q":"这些表现叫“文化震荡症”，也叫“文化休克”（cultural shock）。","w":"high","e":["2025 真题"]},{"t":"交际文化","y":"名词解释","p":["80年代初，对外汉语教学界的学者张占一等人，从第二语言教学培养交际能力的实际出发，按文化在交际中的功能提出区分“知识文化”和“交际文化”的观点。","交际文化则是指跨文化交际中直接影响信息准确传递(即引起偏差或误解)的语言和非语言的文化因素。","所谓知识文化是指跨文化交际中不直接影响准确传递信息的语言和非语言的文化因素。","交际文化则是指两种语言间规约性的文化差异，是以制约信息模式的形式来参与交际的，可能在交际中引起误解或偏差。"],"q":"80年代初，对外汉语教学界的学者张占一等人，从第二语言教学培养交际能力的实际出发，按文化在交际中的功能提出区分“知识文化”和“交际文化”的观点。","w":"high","e":["2018 真题"]},{"t":"知识文化","y":"名词解释","p":["所谓知识文化是指跨文化交际中不直接影响准确传递信息的语言和非语言的文化因素；交际文化则是指跨文化交际中直接影响信息准确传递(即引起偏差或误解)的语言和非语言的文化因素。","知识文化常以“知识”或“内容”的形式参与交际。“知识”的多少也会影响到交际的进行。但懂就是懂，不懂就是不懂，一般不会产生误解。","交际文化与知识文化概念的提出，加深了人们对语言教学中的文化教学的认识。"],"q":"所谓知识文化是指跨文化交际中不直接影响准确传递信息的语言和非语言的文化因素；交际文化则是指跨文化交际中直接影响信息准确传递(即引起偏差或误解)的语言和非语言的文化因素。","w":"high","e":["2018 真题"]},{"t":"跨文化交际","y":"名词解释","p":["跨文化交际是指不同文化背景的人们之间的交际行为。这种交际主要是通过语言来进行的，称为跨文化语言交际。","影响跨文化语言交际的是不同文化之间的相同之处和不同之处，特别是文化差异。因此跨文化交际中要特别重视并研究文化差异。","跨文化交际的特点：(1)文化的差异与交际障碍；(2)交际原则与价值观念；(3)母语文化的思维定势和对异文化的成见；(4)交际过程中的相互接近和求同趋向；(5)交际的结果：文化的相互影响。","从上述五个特点可以看出，跨文化交际的根本特征是如何发现、认识和对待不同文化之间的差异。"],"q":"跨文化交际是指不同文化背景的人们之间的交际行为。这种交际主要是通过语言来进行的，称为跨文化语言交际。","w":"high","e":["2019 真题"]},{"t":"文化依附","y":"名词解释","p":["所谓文化依附，是指人们言行所代表和体现的是哪一种文化。","第二语言学习者为了掌握目的语，需要了解和学习目的语文化知识；第二语言教师为了帮助学习者掌握目的语，也需要介绍目的语文化知识。因此在这一过程中，原则上师生都需要依附目的语文化。","以学习汉语的外国学习者为例，为了尽快地学会汉语并正确地、得体地运用汉语，在他们学习期间、特别是在中国生活期间需要依附汉语的文化。","一般说来应依附于所用语言的文化。比如用汉语交际，应依附于汉语文化；主动依附的一方，往往是对对方文化有较多了解的一方。"],"q":"所谓文化依附，是指人们言行所代表和体现的是哪一种文化。","w":"high","e":["2017 真题"]},{"t":"从文化不适应到适应，这一过程大体上分为四个阶段：____、____、调整阶段、____。","y":"填空题","p":["这一过程大体上分为四个阶段：(1)蜜月阶段。(2)挫折阶段。(3)调整阶段。(4)适应阶段。"],"q":"蜜月阶段；挫折阶段；适应阶段","w":"high","e":["2025 真题"]},{"t":"80年代初，张占一等学者按文化在交际中的功能提出区分“____”和“____”的观点。","y":"填空题","p":["按文化在交际中的功能提出区分“知识文化”和“交际文化”的观点"],"q":"知识文化；交际文化","w":"high","e":["2018 真题"]},{"t":"按文化的内容常把文化分为____、____、制度文化和观念文化四个部分。","y":"填空题","p":["按文化的内容常把文化分为物质文化、行为文化、制度文化和观念文化四个部分"],"q":"物质文化；行为文化","w":"high","e":["2018 真题"]},{"t":"文化休克是指在非本民族文化环境中生活或学习的人，由于文化的冲突和不适应而产生的深度焦虑的精神症状。","y":"判断题","p":["又叫“文化震荡症”","跨文化适应过程分蜜月阶段、挫折阶段、调整阶段、适应阶段四个阶段"],"q":"正确。文化休克是指在非本民族文化环境中生活或学习的人，由于文化的冲突和不适应而产生的深度焦虑的精神症状。","w":"high","e":["2025 真题"]},{"t":"交际文化是指跨文化交际中不直接影响信息准确传递的语言和非语言的文化因素。","y":"判断题","p":["知识文化是跨文化交际中不直接影响准确传递信息的语言和非语言的文化因素","交际文化以制约信息模式的形式来参与交际"],"q":"错误。交际文化是指跨文化交际中直接影响信息准确传递(即引起偏差或误解)的语言和非语言的文化因素；不直接影响信息传递的是知识文化。","w":"high","e":["2018 真题"]},{"t":"文化休克一般要经历蜜月阶段、挫折阶段、调整阶段和适应阶段四个阶段，一般要一年左右的时间。","y":"判断题","p":["挫折阶段会出现文化震荡症","儿童由于对母文化也所知不多，文化休克就很微弱"],"q":"正确。跨文化适应过程大体上分为蜜月阶段、挫折阶段、调整阶段、适应阶段四个阶段；一般说来要一年左右的时间。","w":"high","e":["2025 真题"]},{"t":"按文化的内容分类，被称为“深层文化”的是（　）。","y":"单项选择题","p":["观念文化……属文化的精神内核，是深层文化"],"q":"D","w":"normal","e":["核心考点"]},{"t":"提出区分“知识文化”和“交际文化”的学者是（　）。","y":"单项选择题","p":["80年代初，对外汉语教学界的学者张占一等人……按文化在交际中的功能提出区分“知识文化”和“交际文化”的观点"],"q":"B","w":"high","e":["2018 真题"]},{"t":"简述语言与文化的关系。","y":"简答题","p":["语言是文化的重要组成部分，部分与整体关系","语言是记录文化的符号体系、文化的主要载体","语言和文化相互依附、促进和制约","启示：学语言必须同时学文化"],"q":"语言与文化有着十分密切的关系：①语言是文化的重要组成部分，语言与文化是部分与整体的关系，二者不可分割。一种文化不可能没有与之相应的语言；抽去文化内容，语言也不能独立存在。②语言是用于记录文化的符号体系，是文化的主要载体。语言不仅本身是文化的一种形态，而且还是记录其他部分文化的符号，成为反映文化的一面镜子。③语言和文化相","w":"high","e":["2019 真题"]},{"t":"简述跨文化交际的特点。","y":"简答题","p":["文化的差异与交际障碍","交际原则与价值观念","母语文化的思维定势和对异文化的成见","交际过程中的相互接近和求同趋向","交际的结果：文化的相互影响"],"q":"①文化的差异与交际障碍：跨文化交际发生在不同的文化之间，两种文化的共同之处有利于对双方语言的理解，不同之处则可能由于差异的存在而造成对语言理解和运用的偏误，并形成障碍。②交际原则与价值观念：人们对合作原则、礼貌原则等交际原则的理解受到不同价值观念的制约。③母语文化的思维定势和对异文化的成见：人们容易形成母文化的思维定势","w":"high","e":["2019 真题"]},{"t":"简述跨文化交际中对待不同文化的态度。","y":"简答题","p":["尊重不同的文化","理解与适应目的语文化","求同存异对待文化冲突","外为我用、发展本国文化","选择文化依附"],"q":"①尊重不同的文化，这是对待任何一种文化应有的最基本的态度。②理解与适应目的语文化。③求同存异对待文化冲突，需要采取开放宽容的态度，用求同存异的原则化解文化冲突。④外为我用，发展本国文化，即在立足母语文化优秀传统和本质特征的同时，汲取目的语文化的长处，不断发展，创造本民族的新文化。⑤从跨文化交际的需要出发，选择文化依附。","w":"normal","e":["核心考点"]},{"t":"试论述跨文化交际中的文化冲突与适应，并结合对外汉语教学说明其启示。","y":"论述题","p":["文化冲突引起心理反应、经历不适应到适应过程","四阶段：蜜月、挫折、调整、适应","文化休克的定义及影响因素","启示：重视文化差异、帮助度过文化休克期、同时掌握目的语和目的语文化"],"q":"要点：①在跨文化交际中，或是进入非本民族文化的生活环境中，以及学习目的语文化的过程中，文化差异都会引起人们的心理反应，产生一定的文化冲突，经历从文化不适应到适应的过程。②这一过程大体上分为四个阶段：蜜月阶段（对新文化感到新奇、兴奋、满足）、挫折阶段（产生迷惑、沮丧、焦虑等，出现“文化休克”）、调整阶段（开始调整与环境的","w":"high","e":["2025 真题"]},{"t":"【案例】一位刚到中国学习汉语半年的欧洲留学生，最初对中国的一切都感到新奇有趣，但两个月后开始失眠、焦虑、想家，抱怨中国的饮食、作息和人际交往方式难以适应，甚至产生了退学的念头。请结合跨文化交际中文化冲突与适应的理论，按照“发现问题—分析问题—解决问题”的思路，写一篇800字以上的案例分析。","y":"案例分析","p":["发现问题：处于挫折阶段、出现文化休克","分析问题：文化休克的定义与四阶段理论","分析问题：文化休克程度取决于本人态度和文化差异大小","解决问题：理解帮助、度过文化休克期、处理语言与文化教学关系"],"q":"①发现问题：该留学生正处于跨文化适应的“挫折阶段”，出现了“文化休克”：失眠、焦虑、思乡、抱怨、产生退学念头。②分析问题：依据教材，在跨文化交际中，进入非本民族文化的生活环境中，文化差异会引起心理反应，产生文化冲突，经历从文化不适应到适应的过程；这一过程大体分为蜜月阶段、挫折阶段、调整阶段、适应阶段四个阶段。该生经历了","w":"high","e":["2025 真题"]}]},{"id":"yinlun-c04-s03","t":"第三节 对外汉语教学的文化学基础(二)","w":"high","n":15,"k":[{"t":"语言文化因素","y":"名词解释","p":["语言的文化因素是语言教学中的文化教学首先接触的、也是最重要的部分，主要指语言系统各层次的文化内涵和语言使用的社会规约。","语言文化因素主要隐含在词汇系统、语法系统和语用系统之中，在跨文化交际中制约着语言的理解和使用，甚至可能造成一定的交际误解和障碍。","缺少语言文化因素的教学就不能达到语言教学的目的，因此就像语音、词汇、语法和汉字等因素一样，文化因素也是语言中不可或缺的组成部分。","陈光磊把这种文化因素分为语构文化、语义文化和语用文化。"],"q":"语言的文化因素是语言教学中的文化教学首先接触的、也是最重要的部分，主要指语言系统各层次的文化内涵和语言使用的社会规约。","w":"high","e":["2026 真题"]},{"t":"语构文化","y":"名词解释","p":["语构文化指词、词组、句子和话语篇章的构造所体现的文化特点，反映了民族的心理模式和思维方式。","汉语结构最大的特点是重意合而不重形式。","不是用严格的形态变化来体现语法关系和语义信息，而是除了遵照一定的结构规则外，只要在上下文中语义搭配合乎事理，就可以合在一起组成句子、语段。","汉语的意合性也必然带来语言结构的灵活性和简约性。"],"q":"语构文化指词、词组、句子和话语篇章的构造所体现的文化特点，反映了民族的心理模式和思维方式。","w":"high","e":["2019 真题"]},{"t":"语义文化","y":"名词解释","p":["语义文化指语言的语义系统、主要是词汇中所包含的社会文化涵义，它反映了民族的心理模式和思维方式。","这是语言中的文化因素最基本、最大量的表现形式，也是语言教学中文化因素教学的重点之一。","首先是一个民族文化中特有的事物和概念体现在词汇中，而在别的语言中没有对应词语，如不加解释，第二语言学习者就难以理解。","更多的则是某一事物或概念虽在不同的语言中有对应词语，但词义却存在很大差别，因而在语言交际中最容易造成误解和障碍。"],"q":"语义文化指语言的语义系统、主要是词汇中所包含的社会文化涵义，它反映了民族的心理模式和思维方式。","w":"high","e":["2019 真题"]},{"t":"语用文化","y":"名词解释","p":["语用文化指语言用于交际中的语用规则和文化规约，是由不同民族的文化、特别是习俗文化所决定的。","语用文化是培养语言交际能力的主要内容，是对外汉语教学中文化因素教学的重点之一。","可以和功能意念的教学和语用规则的教学结合在一起。对外汉语教学中常用的基本的语用文化包括：称呼；问候和道别；道谢和道歉；敬语与谦辞；褒奖与辞让；宴请与送礼；隐私与禁忌。","如中国人敬老在称呼中加上“老”字如“老大爷”、“老大娘”。"],"q":"语用文化指语言用于交际中的语用规则和文化规约，是由不同民族的文化、特别是习俗文化所决定的。","w":"high","e":["2020 真题"]},{"t":"文化的分类","y":"名词解释","p":["对文化有多种分类方法。按文化的内容常把文化分为物质文化、行为文化、制度文化和观念文化四个部分。","观念文化是人类在社会实践和意识活动中形成的价值观念、伦理道德、审美情趣、宗教情感、思维方式和民族性格……属文化的精神内核，是深层文化。","制度文化是由观念文化所决定的社会规范体系……制度文化与行为文化属中层文化。","行为文化也称习俗文化，是人们交往中约定俗成的社会风俗习惯和行为标准……可以看做是制度文化的一部分。","物质文化指人类创造的、体现一定生活方式的种种物质文明……是表层文化。","此外，还有大写字母C文化(简称大文化)和小写字母c文化(简称小文化)的分法。"],"q":"对文化有多种分类方法。按文化的内容常把文化分为物质文化、行为文化、制度文化和观念文化四个部分。","w":"high","e":["2018 真题"]},{"t":"文化教学原则","y":"名词解释","p":["将上述文化教学的内容组织到对外汉语教学中去，需要体现以下原则：(1)要为语言教学服务，与语言教学的阶段相适应；(2)要有针对性；(3)要有代表性；(4)要有发展变化的观点；(5)要把文化知识转化为交际能力。","文化教学必须为语言教学服务，为培养语言交际能力的教学目标服务，这是本学科、本专业的性质所决定的。","文化教学中所介绍的中国文化，应该是主流文化、国家文化或者说是中国人共通的文化，而不是地域文化或部分人群的亚文化。"],"q":"将上述文化教学的内容组织到对外汉语教学中去，需要体现以下原则：(1)要为语言教学服务，与语言教学的阶段相适应；(2)要有针对性；(3)要有代表性；(4)要有发展变化的观点；(5)要把文化知识转化为交际能力。","w":"high","e":["2021 真题"]},{"t":"陈光磊把语言中的文化因素分为____、____和____三类。","y":"填空题","p":["陈光磊把这种文化因素分为语构文化、语义文化和语用文化"],"q":"语构文化；语义文化；语用文化","w":"high","e":["2019 真题"]},{"t":"文化教学方法主要有：通过____直接阐述文化知识、文化内容____中去、通过语言实践培养交际能力。","y":"填空题","p":["通过注释直接阐述文化知识","文化内容融会到课文中去","通过语言实践培养交际能力"],"q":"注释；融会到课文","w":"normal","e":["核心考点"]},{"t":"语言是文化的重要组成部分，语言与文化是部分与整体的关系，二者不可分割。","y":"判断题","p":["语言是用于记录文化的符号体系，是文化的主要载体","语言和文化相互依附、促进和制约"],"q":"正确。语言是文化的重要组成部分，语言与文化是部分与整体的关系，二者不可分割。","w":"normal","e":["核心考点"]},{"t":"文化教学要以文化教学为中心，语言教学与文化教学并重。","y":"判断题","p":["文化教学必须为语言教学服务","对外汉语教学作为语言教育学科的性质决定了它必须以语言教学为主"],"q":"错误。对外汉语教学应该以语言教学为主，同时紧密结合相关的文化教学。“以文化教学为中心”、“语言教学与文化教学并重”，与排斥文化教学的观点一样，都是语言教学的误区。","w":"high","e":["2018 真题"]},{"t":"把语言中的文化因素分为语构文化、语义文化和语用文化的学者是（　）。","y":"单项选择题","p":["陈光磊把这种文化因素分为语构文化、语义文化和语用文化"],"q":"C","w":"high","e":["2019 真题"]},{"t":"简述与对外汉语教学相关的文化教学的三个层次。","y":"简答题","p":["语言的文化因素（语构、语义、语用文化）","基本国情和文化背景知识","专门性文化知识"],"q":"确定文化教学内容应体现语言的、交际的、对外的三条原则。与对外汉语教学相关的文化教学应是三个层次：①语言的文化因素：语言教学中的文化教学首先接触的、也是最重要的部分，主要指语言系统各层次的文化内涵和语言使用的社会规约，主要隐含在词汇系统、语法系统和语用系统之中，陈光磊把它分为语构文化、语义文化和语用文化。②基本国情和文化","w":"high","e":["2019 真题"]},{"t":"简述对外汉语教学中的文化教学原则。","y":"简答题","p":["为语言教学服务、与语言教学的阶段相适应","要有针对性","要有代表性","要有发展变化的观点","要把文化知识转化为交际能力"],"q":"①要为语言教学服务，与语言教学的阶段相适应。文化教学必须为语言教学服务，为培养语言交际能力的教学目标服务；文化教学为语言教学服务就必须与语言教学的阶段相适应，与学生的语言水平和交际需要相适应。②要有针对性。文化教学要针对外国学习者在跨文化交际中出现的障碍和困难，确定应教的项目并做出解释和说明，这就需要进行文化对比。③要","w":"high","e":["2021 真题"]},{"t":"简述对外汉语教学中文化教学的主要方法。","y":"简答题","p":["通过注释直接阐述文化知识","文化内容融会到课文中去","通过语言实践培养交际能力"],"q":"①通过注释直接阐述文化知识：这一方法比较灵活简便，语言学习各个阶段都可以用。开始甚至可以用学习者的母语注释，随着学习者汉语水平的提高，可逐渐用目的语注释。②文化内容融会到课文中去：课文本身就可以介绍某一文化习俗，学习语言的同时也就学到了文化，这是比较理想、效果较好的文化揭示方法。③通过语言实践培养交际能力：课堂中引进有","w":"normal","e":["核心考点"]},{"t":"试论述对外汉语教学中的语言文化因素（语构文化、语义文化、语用文化）。","y":"论述题","p":["语言文化因素是文化教学最重要部分、隐含在词汇语法语用系统","语构文化：重意合、反映思维方式","语义文化：词汇的社会文化涵义","语用文化：语用规则和文化规约，是培养交际能力的主要内容"],"q":"要点：①语言的文化因素是语言教学中文化教学首先接触、也是最重要的部分，主要指语言系统各层次的文化内涵和语言使用的社会规约，主要隐含在词汇系统、语法系统和语用系统之中。陈光磊把这种文化因素分为语构文化、语义文化和语用文化。②语构文化：指词、词组、句子和话语篇章的构造所体现的文化特点，反映了民族的心理模式和思维方式。汉语结","w":"high","e":["2026 真题"]}]}]},{"id":"yinlun-c05","t":"第五章 语言习得理论","w":"high","s":[{"id":"yinlun-c05-s01","t":"第一节 语言学习与习得","w":"high","n":32,"k":[{"t":"学习(广义)","y":"名词解释","p":["作为心理学的概念，学习是指人和动物在生活过程中获得经验而产生行为的比较持久的变化，这是学习的广义概念。","人类的学习则是指在人类的社会生活实践中运用语言工具主动地获得社会的和个体的经验，并产生比较持久的行为变化。","人和动物的行为有两类：一种是生来就会、通过遗传而获得的极为有限的“本能行为”，如婴儿会吸奶，母鸡会孵蛋；更多的则是在后天环境中通过学习而获得的“习得行为”，如海豚的表演、人的各种知识和技能等。"],"q":"作为心理学的概念，学习是指人和动物在生活过程中获得经验而产生行为的比较持久的变化，这是学习的广义概念。","w":"high","e":["2019 真题"]},{"t":"行为主义学习理论","y":"名词解释","p":["行为主义学习理论受经验主义哲学影响，认为学习是人和动物受环境支配、获得经验而被动形成的行为的改变。在这一过程中，完全排斥人的主观思想或思维活动。","行为主义学习理论是在经典条件作用与操作性条件作用的基础上建立起来的刺激—反应学习理论，历来是西方学习理论的主体部分。","这里需要特别提到桑代克的“尝试—错误学习理论”和斯金纳的“操作学习理论”。","桑代克通过饿猫的“迷箱实验”提出联结试误说；斯金纳提出操作性(也称工具性)条件作用理论。"],"q":"行为主义学习理论受经验主义哲学影响，认为学习是人和动物受环境支配、获得经验而被动形成的行为的改变。在这一过程中，完全排斥人的主观思想或思维活动。","w":"high","e":["2026 真题"]},{"t":"认知学习理论","y":"名词解释","p":["认知学习理论受哲学上的理性主义的影响，认为学习是学习者对环境和客观事物主动的认识和行为的主动的改变，是主体的认知过程，而不是在外界环境支配下被动地进行刺激—反应的联结和行为习惯的改变。","它强调学习中认知机制所起的作用，着重探讨学习者内部心理结构的形成和改变。","这里主要介绍格式塔心理学的完形说和布鲁纳的认知—发现说。","德国格式塔心理学家柯勒通过猩猩取香蕉实验认为这是通过顿悟实现了学习，顿悟是指突然觉察到解决问题的办法。"],"q":"认知学习理论受哲学上的理性主义的影响，认为学习是学习者对环境和客观事物主动的认识和行为的主动的改变，是主体的认知过程，而不是在外界环境支配下被动地进行刺激—反应的联结和行为习惯的改变。","w":"high","e":["2019 真题"]},{"t":"顿悟","y":"名词解释","p":["顿悟是指突然觉察到解决问题的办法，要做到这点就必须对整个问题的情境进行知觉，了解构成情境的各要素之间的各种关系。","柯勒认为这是通过顿悟实现了学习，格式塔心理学认为顿悟学习可以避免盲目的试误学习。","格式塔心理学认为，有机体获得的每种经验都是一个有组织的整体，也就是完形——不是孤立的组成部分，也不是各组成部分的简单相加。","由于新经验的发生，对问题的情境以及情境各部分的关系需要进行知觉的重组或认知的重组，即由一种完形改变成另一种完形，从而实现顿悟。"],"q":"顿悟是指突然觉察到解决问题的办法，要做到这点就必须对整个问题的情境进行知觉，了解构成情境的各要素之间的各种关系。","w":"high","e":["2019 真题"]},{"t":"习得","y":"名词解释","p":["“习得”是在自然的语言环境中，通过旨在沟通意义的言语交际活动，不知不觉(潜意识)地获得一种语言，典型的例子是儿童习得第一语言(一般是母语)。","简言之，习得是潜意识的自然的获得。","习得，特别是儿童第一语言的习得，是从本能的要求(生存和交际的需要)开始、与其生理和心理的自然发育、成熟同步进行的过程，儿童是在不知不觉中习得第一语言的。","习得一般是在使用该目的语的社会环境中进行的；习得时注意力主要集中在语言的功能和意义方面。"],"q":"“习得”是在自然的语言环境中，通过旨在沟通意义的言语交际活动，不知不觉(潜意识)地获得一种语言，典型的例子是儿童习得第一语言(一般是母语)。","w":"high","e":["2019 真题"]},{"t":"学习(与习得相对)","y":"名词解释","p":["“学习”则是指在课堂环境下有专门的教师指导，严格按照教学大纲和课本，通过讲解、练习、记忆等活动，有计划、有系统、也是有意识地对语言规则的掌握，典型的例子是成人在学校学习第二语言。","简言之，学习则是有意识的规则的掌握。","学习是主体为了掌握一种新的交际工具所进行的目的性非常明确的活动，除了本身的自觉要求外，还加上教师的督促、考试、竞争等外部因素的作用，是一种有意识的行为。","学习主要是在课堂环境下进行的，可能有使用该目的语的社会环境(学习第二语言)，也可能没有(学习外语)。"],"q":"“学习”则是指在课堂环境下有专门的教师指导，严格按照教学大纲和课本，通过讲解、练习、记忆等活动，有计划、有系统、也是有意识地对语言规则的掌握，典型的例子是成人在学校学习第二语言。","w":"high","e":["2026 真题"]},{"t":"直觉掌握","y":"名词解释","p":["苏俄学者用“直觉掌握”和“自觉掌握”两个概念来表述这两种类型的学习。","直觉掌握指在使用语言时，意识所控制的是话语所表达的内容而不是它的语言形式；而自觉掌握则是指在使用语言时，意识所控制的是话语的语言形式而不是它所表达的内容。","与之相关的“直觉学习”指的是单纯模仿，知其然而不知其所以然，“自觉学习”则是指在理解的基础上模仿，不但知其然还要知其所以然。"],"q":"苏俄学者用“直觉掌握”和“自觉掌握”两个概念来表述这两种类型的学习。","w":"normal","e":["核心考点"]},{"t":"学习理论主要有两大派：一是____学习理论，一是认知学习理论。","y":"填空题","p":["行为主义"],"q":"行为主义","w":"high","e":["2026 真题"]},{"t":"60年代以来还出现了向传统的两大派挑战的____学习理论。","y":"填空题","p":["人本主义"],"q":"人本主义","w":"normal","e":["核心考点"]},{"t":"美国著名心理学家桑代克于19世纪末首先用动物实验进行学习的研究，通过他的饿猫的“____”，提出了联结试误说。","y":"填空题","p":["迷箱实验"],"q":"迷箱实验","w":"high","e":["2020 真题"]},{"t":"斯金纳通过他所设计的“____”，进行了操作性条件作用的实验。","y":"填空题","p":["斯金纳箱"],"q":"斯金纳箱","w":"normal","e":["核心考点"]},{"t":"斯金纳认为强化又分____(得到奖赏)和负强化(逃避或回避不愉快情境的出现)。","y":"填空题","p":["正强化"],"q":"正强化","w":"high","e":["2026 真题"]},{"t":"德国格式塔心理学家____于20世纪初对猩猩解决问题的行为做了实验研究。","y":"填空题","p":["柯勒"],"q":"柯勒","w":"high","e":["2025 真题"]},{"t":"____是指突然觉察到解决问题的办法。","y":"填空题","p":["顿悟"],"q":"顿悟","w":"normal","e":["核心考点"]},{"t":"加涅按学习的复杂程度，由低级到高级把学习分为____类。","y":"填空题","p":["八"],"q":"八","w":"normal","e":["核心考点"]},{"t":"加涅认为学习行为分为八个阶段，即动机、领会、获得、保持、回忆、概括、____、反馈。","y":"填空题","p":["作业"],"q":"作业","w":"normal","e":["核心考点"]},{"t":"加涅归纳了各类学习应达到的五种学习结果，即智力技能、____、言语信息、动作技能和态度。","y":"填空题","p":["认知策略"],"q":"认知策略","w":"high","e":["2026 真题"]},{"t":"习得是____的自然的获得；学习则是有意识的规则的掌握。","y":"填空题","p":["潜意识"],"q":"潜意识","w":"high","e":["2019 真题"]},{"t":"苏俄学者用“直觉掌握”和“____”两个概念来表述两种类型的学习。","y":"填空题","p":["自觉掌握"],"q":"自觉掌握","w":"normal","e":["核心考点"]},{"t":"行为主义学习理论认为学习是人和动物受环境支配、获得经验而被动形成的行为的改变，排斥人的主观思想或思维活动。","y":"判断题","p":["行为主义受经验主义哲学影响，认为学习是受环境支配、被动形成的行为的改变，完全排斥人的主观思想或思维活动。"],"q":"正确","w":"high","e":["2026 真题"]},{"t":"斯金纳通过“迷箱实验”提出了联结试误说。","y":"判断题","p":["通过饿猫的“迷箱实验”提出联结试误说的是桑代克，而非斯金纳；斯金纳提出的是操作性条件作用理论。"],"q":"错误","w":"high","e":["2020 真题"]},{"t":"认知学习理论认为学习是学习者对环境和客观事物主动的认识和行为的主动的改变，是主体的认知过程。","y":"判断题","p":["认知学习理论受理性主义影响，认为学习是学习者对环境和客观事物主动的认识和行为的主动的改变，是主体的认知过程。"],"q":"正确","w":"high","e":["2019 真题"]},{"t":"格式塔心理学认为学习就是个体内部通过知觉重组主动构造完形的过程。","y":"判断题","p":["学习就是个体内部通过知觉重组主动构造完形的过程，也是实现顿悟的过程。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"加涅按学习的复杂程度把学习分为六类，前三种属行为主义，后三种属认知学派。","y":"判断题","p":["加涅把学习分为八类，前五种属行为主义，后三种属认知学派。"],"q":"错误","w":"high","e":["2020 真题"]},{"t":"习得是潜意识的自然的获得，学习则是有意识的规则的掌握。","y":"判断题","p":["习得是潜意识的自然的获得；学习则是有意识的规则的掌握。"],"q":"正确","w":"high","e":["2019 真题"]},{"t":"直觉掌握指在使用语言时意识所控制的是话语的语言形式而不是它所表达的内容。","y":"判断题","p":["直觉掌握指在使用语言时意识所控制的是话语所表达的内容而不是它的语言形式；控制语言形式的应是自觉掌握。"],"q":"错误","w":"normal","e":["核心考点"]},{"t":"奠定了行为主义学习理论基础的美国著名心理学家是（　　）。","y":"单项选择题","p":["桑代克通过饿猫的“迷箱实验”提出了联结试误说，奠定了行为主义学习理论的基础。"],"q":"A","w":"high","e":["2026 真题"]},{"t":"操作性(也称工具性)条件作用理论的提出者是（　　）。","y":"单项选择题","p":["斯金纳本世纪30年代以后提出操作性(也称工具性)条件作用理论。"],"q":"C","w":"high","e":["教材高频"]},{"t":"提出认知—发现说的心理学家是（　　）。","y":"单项选择题","p":["布鲁纳强调学生学习的目的在于掌握知识结构，学习应是主动发现的过程，其学习理论称为认知—发现说。"],"q":"B","w":"normal","e":["核心考点"]},{"t":"提出学习分类方法，把学习分为八类的心理学家是（　　）。","y":"单项选择题","p":["加涅按学习的复杂程度，由低级到高级把学习分为八类。"],"q":"D","w":"normal","e":["核心考点"]},{"t":"简述行为主义学习理论与认知学习理论的主要区别。","y":"简答题","p":["行为主义来源于经验主义，认为学习是被动形成的行为改变，排斥思维活动","认知学习理论来源于理性主义，认为学习是主动的认知过程，强调内部心理结构","行为主义把学习看成刺激—反应联结加习惯形成，研究外显行为","认知学习理论把学习看成顿悟和完形构造，研究内部心理过程","两派各有偏颇，正出现互相吸取、逐渐融合的趋势"],"q":"①哲学来源不同：行为主义来源于经验主义，认知学习理论来源于理性主义。②对学习实质的理解不同：行为主义认为学习是人和动物受环境支配、获得经验而被动形成的行为的改变，完全排斥人的主观思想或思维活动；认知学习理论认为学习是学习者对环境和客观事物主动的认识和行为的主动的改变，是主体的认知过程。③对学习过程的看法不同：行为主义把","w":"high","e":["2026 真题"]},{"t":"简述习得与学习的区别。","y":"简答题","p":["习得是潜意识的、自然获得，学习是有意识的行为","习得在使用该目的语的社会环境中进行，学习主要在课堂环境中进行","习得关注语言的功能和意义，学习关注语言的形式","习得靠自然语言环境中的语言交际活动，学习靠教师指导下的模仿和练习","习得效果较好能形成语言交际能力，学习效果不确定"],"q":"习得与学习的主要区别有：①行为性质不同：习得是潜意识的、不自觉的行为，儿童在不知不觉中习得第一语言；学习则是有意识的行为，是主体为了掌握一种新的交际工具所进行的目的性非常明确的活动。②环境不同：习得一般是在使用该目的语的社会环境中进行的；学习则主要是在课堂环境下进行的。③关注点不同：习得时注意力主要集中在语言的功能和意","w":"high","e":["2019 真题"]}]},{"id":"yinlun-c05-s02","t":"第二节 第一语言习得及主要理论和假说","w":"high","n":30,"k":[{"t":"刺激—反应论","y":"名词解释","p":["刺激—反应论是行为主义心理学的理论，盛行于40年代和50年代，代表人物是斯金纳，是关于第一语言习得的主要理论之一。","行为主义者认为语言不是先天所有而是后天习得的，强调外部条件在第一语言习得过程中的作用。","这种行为跟人类的其他行为一样，是通过刺激—反应—强化的模式养成习惯而学会的；婴儿来到世界时像一张白纸，对这个世界、对语言没有任何先天的知识，完全由环境来塑造其行为。","儿童学话就是对环境所给予的刺激做出相应的反应，开始是对成人语言的模仿，如果模仿得比较接近，就从成人那儿得到奖励或赞许，这样他的反应就得到了强化。"],"q":"刺激—反应论是行为主义心理学的理论，盛行于40年代和50年代，代表人物是斯金纳，是关于第一语言习得的主要理论之一。","w":"high","e":["2018 真题"]},{"t":"先天论","y":"名词解释","p":["先天论又称“内在论”，代表人物是乔姆斯基，是在乔姆斯基语言学理论、特别是80年代初提出的“普遍语法”理论基础上的儿童第一语言习得理论。","乔氏认为语言不像行为主义者所说的是“习惯的总和”，而是由抽象规则构成的复杂的体系。","人们习得语言绝不是单纯的模仿记忆，而是要把这些复杂的规则“内化”(internalization)，达到自动运用的程度，成为理解和产生言语的基础。","乔氏认为人类先天具有一种习得语言的特殊能力，表现为儿童头脑中有一种受遗传因素决定的“语言习得机制”(language acquisition device，简称LAD)。"],"q":"先天论又称“内在论”，代表人物是乔姆斯基，是在乔姆斯基语言学理论、特别是80年代初提出的“普遍语法”理论基础上的儿童第一语言习得理论。","w":"high","e":["2019 真题"]},{"t":"语言习得机制","y":"名词解释","p":["乔氏认为人类先天具有一种习得语言的特殊能力，表现为儿童头脑中有一种受遗传因素决定的“语言习得机制”(language acquisition device，简称LAD)。","这一特殊机制脱离人类的其他功能而独立存在，甚至跟智力没有直接关系，在12岁以前发挥作用。","语言习得机制包括两部分：一部分是以待定的参数形式出现的、人类语言所普遍具有的语言原则，又称为“普遍语法”。","语言习得机制的第二部分是评价语言信息的能力，也就是对所接触到的实际语言的核心部分进行语言参数的定值。"],"q":"乔氏认为人类先天具有一种习得语言的特殊能力，表现为儿童头脑中有一种受遗传因素决定的“语言习得机制”(language acquisition device，简称LAD)。","w":"high","e":["2020 真题"]},{"t":"普遍语法","y":"名词解释","p":["语言习得机制包括两部分：一部分是以待定的参数形式出现的、人类语言所普遍具有的语言原则，又称为“普遍语法”(universal grammar)。","普遍语法反映了人类语言的共性，它不是指那些具体的语法规则或某种语言的语法，而是存在于人类所有语言的深层结构中的语言中最本质的东西。","任何语言都会有元音，都有影响意义的语序，都有主语、谓语、宾语等句子的组成部分，都有表示时间关系的手段。","这些有关语法成分、句法结构以及句法转换等适合所有语言的语言知识和原则，成为“核心”部分，而各种语言本身所具有的特殊结构称为“外围”部分。"],"q":"语言习得机制包括两部分：一部分是以待定的参数形式出现的、人类语言所普遍具有的语言原则，又称为“普遍语法”(universal grammar)。","w":"high","e":["2020 真题"]},{"t":"认知论(第一语言习得)","y":"名词解释","p":["认知论的理论基础是瑞士著名儿童心理学家皮亚杰(J. Piaget)的发生认识论(genetic epistemology)，是关于第一语言习得的主要理论之一。","认知论认为儿童头脑中没有神秘的语言习得机制，更不存在普遍语法，但人类有先天的认知机制和认知能力。","皮亚杰指出人有遗传的心理功能，它决定人与环境相互作用，并向环境学习，与环境作用的结果就形成并发展了儿童的认知结构(cognitive structure)。","认知结构的组成部分又称为图式(schema)，人脑中储存着各种各样的图式。"],"q":"认知论的理论基础是瑞士著名儿童心理学家皮亚杰(J. Piaget)的发生认识论(genetic epistemology)，是关于第一语言习得的主要理论之一。","w":"high","e":["2018 真题"]},{"t":"同化与顺应","y":"名词解释","p":["儿童遇到新事物、新经验，总希望把它结合到原有的图式中，使其成为自身的一部分，这就叫同化(assimilation)。","如果同化成功，就会使认识与外界趋于一致，达到暂时的平衡(equilibrium)；如果不能纳入原有的图式，儿童就要调整原有的图式或创立新的图式以适应环境、同化新事物，这就叫顺应(adaptation)。","顺应的结果也使认识与外界趋于一致，达到新的平衡。","同化是个体对环境的作用，顺应是环境对个体的作用，平衡则总是动态的，由一种较低水平的平衡过渡到一种较高水平的平衡。"],"q":"儿童遇到新事物、新经验，总希望把它结合到原有的图式中，使其成为自身的一部分，这就叫同化(assimilation)。","w":"high","e":["2018 真题"]},{"t":"语言功能论","y":"名词解释","p":["语言功能论以韩礼德为代表，别开生面地从语言交际功能的角度研究儿童语言的发展，是第一语言习得的主要理论之一。","在成人的语言体系中，语言结构只是其中的一部分，只是表达意思的手段之一。","儿童习得语言是为了学会如何表达意思，如何用语言做事、进行交际，因此更为重要的是掌握语言的语义体系和语用体系。","儿童习得母语的过程，应看做是逐步探索并掌握用语言来表示功能的各种方式的过程。"],"q":"语言功能论以韩礼德为代表，别开生面地从语言交际功能的角度研究儿童语言的发展，是第一语言习得的主要理论之一。","w":"high","e":["2019 真题"]},{"t":"图式","y":"名词解释","p":["认知结构的组成部分又称为图式(schema)，人脑中储存着各种各样的图式，如开车的图式、做饭的图式等。","图式是心理活动的组织结构，也是人类认识事物的基础，是人类向环境学习的产物，同时对新事物的理解和吸收又取决于头脑中已有的图式。","图式随着儿童心理的发展而变化，体现了认知的发展；而认知的发展受同化、顺应、平衡三个基本过程的影响。","图式是通过同化和顺应不断发展的。"],"q":"认知结构的组成部分又称为图式(schema)，人脑中储存着各种各样的图式，如开车的图式、做饭的图式等。","w":"high","e":["2020 真题"]},{"t":"儿童第一语言的习得过程大体上有____个阶段。","y":"填空题","p":["五"],"q":"五","w":"normal","e":["核心考点"]},{"t":"儿童第一语言习得的第一阶段是____阶段(半岁至一岁)。","y":"填空题","p":["喃语"],"q":"喃语","w":"normal","e":["核心考点"]},{"t":"儿童第一语言习得的第二阶段是____阶段(一岁左右)。","y":"填空题","p":["独词句"],"q":"独词句","w":"normal","e":["核心考点"]},{"t":"电报句又叫____，在这一阶段儿童突破了双词句，出现了多词句。","y":"填空题","p":["实词句"],"q":"实词句","w":"normal","e":["核心考点"]},{"t":"先天论又称“____”，代表人物是乔姆斯基。","y":"填空题","p":["内在论"],"q":"内在论","w":"high","e":["2019 真题"]},{"t":"语言习得机制(language acquisition device)简称____。","y":"填空题","p":["LAD"],"q":"LAD","w":"high","e":["2020 真题"]},{"t":"认知论的理论基础是瑞士著名儿童心理学家皮亚杰的____。","y":"填空题","p":["发生认识论"],"q":"发生认识论","w":"normal","e":["核心考点"]},{"t":"认知结构的组成部分又称为____，人脑中储存着各种各样的图式。","y":"填空题","p":["图式"],"q":"图式","w":"high","e":["2020 真题"]},{"t":"语言功能论的代表人物是英国语言学家____。","y":"填空题","p":["韩礼德"],"q":"韩礼德","w":"normal","e":["核心考点"]},{"t":"刺激—反应论认为语言不是先天所有而是后天习得的，强调外部条件在第一语言习得过程中的作用。","y":"判断题","p":["行为主义者认为语言不是先天所有而是后天习得的，强调外部条件在第一语言习得过程中的作用，是通过刺激—反应—强化的模式养成习惯而学会的。"],"q":"正确","w":"high","e":["2018 真题"]},{"t":"先天论认为语言是习惯的总和，人们习得语言是单纯的模仿记忆。","y":"判断题","p":["乔姆斯基认为语言不像行为主义者所说的是“习惯的总和”，而是由抽象规则构成的复杂的体系；人们习得语言也绝不是单纯的模仿记忆，而是要把这些复杂的规则“内化”。"],"q":"错误","w":"high","e":["2019 真题"]},{"t":"认知论认为儿童语言的发展是通过同化、顺应和达到暂时平衡，不断地从一个阶段发展到一个新的阶段。","y":"判断题","p":["儿童语言的发展是个体在与客观环境交互作用过程中，通过同化、顺应和达到暂时平衡，不断地从一个阶段发展到一个新的阶段；认知能力的发展决定语言的发展。"],"q":"正确","w":"high","e":["2018 真题"]},{"t":"认知论认为语言能力的发展可以先于认知能力的发展。","y":"判断题","p":["认知论认为语言能力的发展不能先于认知能力的发展，更不能决定认知能力的发展。"],"q":"错误","w":"normal","e":["核心考点"]},{"t":"语言功能论代表人物是英国语言学家韩礼德，他别开生面地从语言交际功能的角度研究儿童语言的发展。","y":"判断题","p":["语言功能论以韩礼德为代表，从语言交际功能的角度研究儿童语言的发展，认为儿童语言体系首先是有意义体系。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"先天论(内在论)的代表人物是（　　）。","y":"单项选择题","p":["先天论又称“内在论”，代表人物是乔姆斯基。"],"q":"A","w":"high","e":["2019 真题"]},{"t":"认知论的理论基础是（　　）。","y":"单项选择题","p":["认知论的理论基础是瑞士著名儿童心理学家皮亚杰的发生认识论。"],"q":"C","w":"normal","e":["核心考点"]},{"t":"儿童第一语言习得过程中，出现“妈妈袜袜”、“宝宝肚肚饿”等只用实词没有虚词的句式，属于（　　）阶段。","y":"单项选择题","p":["电报句又叫实词句，在这一阶段儿童突破了双词句，出现了多词句，只用实词没有虚词，如“妈妈袜袜”、“宝宝肚肚饿”等。"],"q":"C","w":"normal","e":["核心考点"]},{"t":"简述儿童第一语言习得的五个阶段。","y":"简答题","p":["喃语阶段(半岁至一岁)，是前语言阶段","独词句阶段(一岁左右)，真正语言表达的开始","双词句阶段(一岁半以后)，出现由两个词组成的句子","电报句阶段(两岁至两岁半)，多词句只用实词没有虚词","成人句阶段(两岁半到五岁)，掌握基本语法体系"],"q":"儿童第一语言的习得过程大体上有五个阶段：①喃语阶段(半岁至一岁)：这是前语言阶段，即婴儿语音的听辨和发声的准备阶段，婴儿的发声过程从呱呱坠地时开始，几周后由啼哭阶段进入咕咕之声阶段，半岁后进入咿呀学语阶段。②独词句阶段(一岁左右)：这是真正语言表达的开始，幼儿学习用单个词表达意思。③双词句阶段(一岁半以后)：儿童语言的","w":"high","e":["2019 真题"]},{"t":"简述刺激—反应论的主要观点及其不足之处。","y":"简答题","p":["刺激—反应论是行为主义理论，盛行于40年代和50年代，代表人物是斯金纳","认为语言是后天习得的，通过刺激—反应—强化的模式养成习惯","不能解释儿童言语行为中的创造性","成人并不总是对儿童的话语进行强化","单靠刺激—反应培养不出语言交际能力"],"q":"主要观点：刺激—反应论是行为主义心理学的理论，盛行于40年代和50年代，代表人物是斯金纳。行为主义者认为语言不是先天所有而是后天习得的，强调外部条件在第一语言习得过程中的作用。这种行为跟人类的其他行为一样，是通过刺激—反应—强化的模式养成习惯而学会的；婴儿来到世界时像一张白纸，完全由环境来塑造其行为；儿童学话就是对环境","w":"high","e":["2018 真题"]},{"t":"简述先天论的主要观点及其评价。","y":"简答题","p":["先天论又称内在论，代表人物是乔姆斯基，以普遍语法理论为基础","认为语言是由抽象规则构成的复杂体系，习得语言是规则的“内化”","人类先天具有语言习得机制(LAD)，在12岁以前发挥作用","把儿童母语习得看成主动、积极、创造性的过程，儿童习得的是规则体系","语言习得机制只是一种假说，难以通过实验证明，且对环境的作用估计不够"],"q":"主要观点：先天论又称“内在论”，代表人物是乔姆斯基，是在乔姆斯基语言学理论、特别是80年代初提出的“普遍语法”理论基础上的儿童第一语言习得理论。乔氏认为语言不像行为主义者所说的是“习惯的总和”，而是由抽象规则构成的复杂的体系；人们习得语言是把这些复杂的规则“内化”，达到自动运用的程度。乔氏认为人类先天具有一种习得语言的","w":"high","e":["2019 真题"]},{"t":"简述认知论关于第一语言习得的主要观点。","y":"简答题","p":["认知论以皮亚杰的发生认识论为基础","认为儿童没有语言习得机制，但有先天的认知机制和认知能力","认知结构的组成部分称为图式，认知发展受同化、顺应、平衡影响","儿童语言发展通过同化、顺应达到暂时平衡，不断发展到新阶段","认知能力的发展决定语言的发展，语言能力的发展不能先于认知能力的发展"],"q":"认知论的理论基础是瑞士著名儿童心理学家皮亚杰的发生认识论。①认知论认为儿童头脑中没有神秘的语言习得机制，更不存在普遍语法，但人类有先天的认知机制和认知能力，认知机制和认识能力与环境相互作用，并向环境学习。②皮亚杰指出人有遗传的心理功能，它决定人与环境相互作用，并向环境学习，与环境作用的结果就形成并发展了儿童的认知结构，","w":"high","e":["2018 真题"]},{"t":"试综合比较分析关于第一语言习得的四种主要理论(刺激—反应论、先天论、认知论、语言功能论)。","y":"论述题","p":["刺激—反应论：行为主义理论，代表人物斯金纳，认为后天环境的外部因素决定一切","先天论：代表人物乔姆斯基，认为先天的语言习得机制决定一切","认知论：以皮亚杰发生认识论为基础，认为是先天与后天因素相互作用，认知能力决定一切","语言功能论：代表人物韩礼德，把第一语言习得看成是语义体系掌握的过程","四种理论各有独到之处，与其说是互相对立，不如说是相互补充","第一语言习得受多种因素影响，必须借助多学科的协同研究"],"q":"关于第一语言习得主要有四种理论。①刺激—反应论：这是行为主义心理学的理论，代表人物是斯金纳，认为语言不是先天所有而是后天习得的，强调外部条件的作用，是通过刺激—反应—强化的模式养成习惯而学会的。该理论认为后天环境的外部因素决定一切。②先天论：又称内在论，代表人物是乔姆斯基，以普遍语法理论为基础，认为人类先天具有语言习得","w":"high","e":["2019 真题"]}]},{"id":"yinlun-c05-s03","t":"第三节 第二语言习得理论和假说","w":"high","n":41,"k":[{"t":"对比分析假说","y":"名词解释","p":["对比分析假说由拉多于50年代中期行为主义鼎盛时期提出，认为第二语言的获得也是通过刺激—反应—强化形成习惯的结果。","拉多认为第二语言与第一语言相似的语言成分容易学，不同的成分则难学；两种语言结构特征相同之处产生正迁移，两种语言的差异导致负迁移。","迁移(transfer)是心理学的概念，指在学习过程中已获得的知识、技能和方法、态度等对学习新知识、技能的影响。这种影响有的起积极、促进的作用，叫正迁移，有的起阻碍的作用，叫负迁移，也叫干扰。","负迁移造成第二语言习得的困难和学生的错误，这就是对比分析假说。"],"q":"对比分析假说由拉多于50年代中期行为主义鼎盛时期提出，认为第二语言的获得也是通过刺激—反应—强化形成习惯的结果。","w":"high","e":["2018 真题"]},{"t":"正迁移与负迁移","y":"名词解释","p":["迁移(transfer)是心理学的概念，指在学习过程中已获得的知识、技能和方法、态度等对学习新知识、技能的影响。","这种影响有的起积极、促进的作用，叫正迁移(positive transfer)，有的起阻碍的作用，叫负迁移(negative transfer)，也叫干扰。","拉多认为第二语言与第一语言相似的语言成分容易学，不同的成分则难学。","也就是说两种语言结构特征相同之处产生正迁移，两种语言的差异导致负迁移。"],"q":"迁移(transfer)是心理学的概念，指在学习过程中已获得的知识、技能和方法、态度等对学习新知识、技能的影响。","w":"high","e":["2020 真题"]},{"t":"中介语","y":"名词解释","p":["美国语言学家塞林克于1969年提出中介语(interlanguage)的概念，1972年在其著名论文《中介语》中提出的中介语假说。","中介语是指在第二语言习得过程中，学习者通过一定的学习策略，在目的语输入的基础上所形成的一种既不同于其第一语言也不同于目的语、随着学习的进展向目的语逐渐过渡的动态的语言系统。","中介语既指学习者语言发展的任何一个阶段的“静态”语言系统，可以把它看做是某一阶段的“切片”；也是指学习者从零起点到靠近目的语的语言发展轨迹，可以把它看做是各阶段相接而形成的一种连续体。","中介语在其发展过程中的任何一个阶段都是学习者创造的一种介于第一语言和目的语之间的独特的语言系统；中介语不是固定不变的，而是一个不断变化的动态语言系统。"],"q":"美国语言学家塞林克于1969年提出中介语(interlanguage)的概念，1972年在其著名论文《中介语》中提出的中介语假说。","w":"high","e":["2020 真题"]},{"t":"化石化","y":"名词解释","p":["中介语的偏误有顽固性，语言中的某一部分可能会停滞不前，产生“僵化”或“化石化”(fossilization)的现象，特别表现在语音方面。","僵化的原因是多方面的。","可能是第一语言的影响无法消除；也可能是学习者意识到该偏误并不妨碍交际、甚至还得到过积极的反馈，便满足于已取得的进步而停滞不前；还可能是对目的语的某些方面形成偏见无法接受等。","第二语言学习者完全达到目的语的彼岸、具有说母语者的水平的情况很少，大部分学习者可能一辈子使用的都是中介语。"],"q":"中介语的偏误有顽固性，语言中的某一部分可能会停滞不前，产生“僵化”或“化石化”(fossilization)的现象，特别表现在语音方面。","w":"high","e":["2020 真题"]},{"t":"内在大纲","y":"名词解释","p":["科德于1967年在其《学习者言语错误的重要意义》一文中提出，第二语言学习者在语言习得的过程中有其自己的内在大纲(built-in syllabus)。","而学习者的种种偏误正是这种内在大纲的反映。","学习者不是被动地服从教师的教学安排、接受所教的语言知识，而是跟儿童习得母语一样，有其自身的规律和顺序。这一顺序并非完全按照语言形式的难易，有迹象显示它与课堂上所教的语法规则的顺序并不一样。","内在大纲实际上是人类掌握语言的客观的、普遍的规律，教师只能在有限的范围内控制教学过程，无法完全控制学习者对输入的语言的内化过程。"],"q":"科德于1967年在其《学习者言语错误的重要意义》一文中提出，第二语言学习者在语言习得的过程中有其自己的内在大纲(built-in syllabus)。","w":"high","e":["2019 真题"]},{"t":"习得顺序假说","y":"名词解释","p":["70年代进行的较有影响的研究是杜雷(H. Dulay)和伯特(M. Burt)按照布朗(R. Brown)研究儿童习得母语英语语素顺序的实验方法，率先进行的儿童习得作为第二语言的英语的语素习得顺序(acquisition order)的实验。","这些实验的结果发现，不同母语背景、不同年龄的英语作为第二语言的学习者，有非常相似的英语语素习得顺序。","这一顺序反映在克拉申于1982年列出的九项英语语素习得“自然顺序”表中，他认为从第一组到第四组的习得顺序是固定不变的。","克拉申赞同科德的内在大纲假说，认为人们习得语言规则有一个可以预测的共同顺序：有的先习得，有的后习得。"],"q":"70年代进行的较有影响的研究是杜雷(H. Dulay)和伯特(M. Burt)按照布朗(R. Brown)研究儿童习得母语英语语素顺序的实验方法，率先进行的儿童习得作为第二语言的英语的语素习得顺序(acquisition order)的实验。","w":"high","e":["2019 真题"]},{"t":"输入假说","y":"名词解释","p":["从70年代末开始，美国语言教育家克拉申对第二语言习得提出了一系列假说，1985年在其著作《输入假说：理论与启示》中正式归纳为习得与学习假说、自然顺序假说、监控假说、输入假说和情感过滤假说等五个系列假说，总称为输入假说理论。","这一理论被认为是第二语言习得研究中论述最全面、影响最大的理论，但同时也是引起很多争议的理论。","输入假说认为人类获得语言的惟一方式是对信息的理解，也就是通过吸收可理解的输入(comprehensible input)习得语言知识；输入的语言信息既不要过难也不要过易，克拉申用“i+1”来表示，i代表学习者目前的语言水平，i+1则是下一阶段应达到的语言结构的水平。","克拉申强调听力活动对语言习得最为重要，语言习得是通过听力理解来实现的，而不是通过“说”获得的。"],"q":"从70年代末开始，美国语言教育家克拉申对第二语言习得提出了一系列假说，1985年在其著作《输入假说：理论与启示》中正式归纳为习得与学习假说、自然顺序假说、监控假说、输入假说和情感过滤假说等五个系列假说，总称为输入假说理论。","w":"high","e":["2025 真题"]},{"t":"监控假说","y":"名词解释","p":["监控假说认为，与习得和学习分别相联系，人的头脑中有两个独立的语言系统，一是潜意识的系统，一是有意识的系统，而且两个系统似乎存在于大脑的不同部位。","流利地运用第二语言靠习得，交际中使用的输出的话语是由潜意识的习得系统引起或“驱动”的。","通过学习所获得的有意识的系统语言知识和规则，并不能使学习者表达得更为流利；有意识的系统在言语行为中只有一项功能，即只能作为一个监督者、一个编辑，起监控(monitor)的作用，对输出的言语形式进行检查和控制。","这种监控可能在说话前，也可能在说话同时甚至是说话之后进行校正。"],"q":"监控假说认为，与习得和学习分别相联系，人的头脑中有两个独立的语言系统，一是潜意识的系统，一是有意识的系统，而且两个系统似乎存在于大脑的不同部位。","w":"high","e":["2020 真题"]},{"t":"情感过滤假说","y":"名词解释","p":["情感过滤假说也称屏蔽效应假说，是克拉申输入假说理论的重要组成部分。","第二语言学习者在学习和生活中有各种各样接触目的语的机会，这都是输入，但输入的语言信息有时并没有被吸收。","人类头脑中这种对语言的堵塞现象，是由于情感对输入的信息起了过滤作用，称为“情感过滤”(the affective filter)，或者说成为把输入挡在外边的屏障。","而造成这种过滤或屏障的主要是一些心理因素，如学习的动力、对所学语言的态度、自信心、是否紧张焦虑、是否处于防卫状态、怕出丑，甚至精神和身体状况不佳都能产生屏蔽效应，挡住输入。"],"q":"情感过滤假说也称屏蔽效应假说，是克拉申输入假说理论的重要组成部分。","w":"high","e":["2025 真题"]},{"t":"文化适应假说","y":"名词解释","p":["文化适应假说由舒曼(J. Schumann)提出，从文化与语言的关系出发，把第二语言习得的过程看做是逐步适应目的语文化的过程。","把整个第二语言习得看做是文化适应的一部分，认为第二语言学习者对目的语文化的适应程度决定该目的语掌握的程度。","所谓文化适应是指学习者与目的语社团的社会和心理的结合，因此，学习者与目的语文化的社会距离与心理距离，就成了影响第二语言习得的主要因素。","心理距离主要指学习者在情感方面影响到第二语言习得的因素，包括语言障碍带来的焦虑，文化震荡带来的恐惧紧张以及动机、自尊心等。"],"q":"文化适应假说由舒曼(J. Schumann)提出，从文化与语言的关系出发，把第二语言习得的过程看做是逐步适应目的语文化的过程。","w":"high","e":["2025 真题"]},{"t":"洋泾浜化假说","y":"名词解释","p":["在社会与心理距离太大的情况下，学习者的语言就会停留在初级阶段形成洋泾浜化，即使在自然的语言环境中也不一定能习得目的语，这就是舒曼提出的洋泾浜化假说(Pidginization Hypothesis)。","而社会距离和心理距离二者之间，社会距离又起着主导的作用。","文化适应假说从文化与语言的关系出发，把第二语言习得的过程看做是逐步适应目的语文化的过程。","由缩短的社会距离或由好的社会因素所形成的有利的语言环境，能促成第二语言的习得；否则则起相反的作用。"],"q":"在社会与心理距离太大的情况下，学习者的语言就会停留在初级阶段形成洋泾浜化，即使在自然的语言环境中也不一定能习得目的语，这就是舒曼提出的洋泾浜化假说(Pidginization Hypothesis)。","w":"normal","e":["核心考点"]},{"t":"语言原则参数理论","y":"名词解释","p":["普遍语法理论不仅是语法理论，也是语言习得的理论，用来解释第一语言是如何习得的、语言习得机制是如何发挥作用的。","乔氏认为婴儿的“最初语言状态”包括人类语言共有的语言原则和尚未定值的语言参数。","婴儿接触到具体的语言(如母语)通过假设—验证给这些语言参数定值，逐渐形成他母语的规则系统，这就是“语言原则参数”理论。","有实验表明，在第二语言习得中普遍语法仍起作用，人们对所接触到的第二语言的语言参数值可以再定值。"],"q":"普遍语法理论不仅是语法理论，也是语言习得的理论，用来解释第一语言是如何习得的、语言习得机制是如何发挥作用的。","w":"high","e":["2020 真题"]},{"t":"第二语言习得","y":"名词解释","p":["正因为第二语言学习中也包含有习得的因素，越来越多的人把第二语言学习也称为第二语言习得。","在第二语言学习理论的研究中，特别是西方学者的研究文章中已出现用术语“习得”代替“学习”的趋向。","有关第二语言习得的理论和模式，西方学者已提出不下数十种，从各个不同的角度论述或解释第二语言是如何习得的。","其中有的理论虽然影响不小，但尚未得到足够的科学实验的证实，还只能称为假说。"],"q":"正因为第二语言学习中也包含有习得的因素，越来越多的人把第二语言学习也称为第二语言习得。","w":"high","e":["2019 真题"]},{"t":"对比分析假说由____于50年代中期行为主义鼎盛时期提出。","y":"填空题","p":["拉多"],"q":"拉多","w":"high","e":["2020 真题"]},{"t":"美国语言学家塞林克于____年提出中介语(interlanguage)的概念。","y":"填空题","p":["1969"],"q":"1969","w":"normal","e":["核心考点"]},{"t":"中介语是指既不同于其第一语言也不同于目的语、随着学习的进展向目的语逐渐过渡的____的语言系统。","y":"填空题","p":["动态"],"q":"动态","w":"high","e":["2020 真题"]},{"t":"中介语的偏误有顽固性，语言中的某一部分可能会停滞不前，产生“僵化”或“____”的现象。","y":"填空题","p":["化石化"],"q":"化石化","w":"normal","e":["核心考点"]},{"t":"科德于1967年在其《学习者言语错误的重要意义》一文中提出，第二语言学习者在语言习得的过程中有其自己的____。","y":"填空题","p":["内在大纲"],"q":"内在大纲","w":"high","e":["2019 真题"]},{"t":"克拉申用“____”来表示输入的语言信息既不要过难也不要过易。","y":"填空题","p":["i+1"],"q":"i+1","w":"high","e":["2025 真题"]},{"t":"克拉申的输入假说理论包括习得与学习假说、自然顺序假说、监控假说、输入假说和____假说等五个系列假说。","y":"填空题","p":["情感过滤"],"q":"情感过滤","w":"high","e":["2025 真题"]},{"t":"文化适应假说由____提出，从文化与语言的关系出发，认为第二语言学习者对目的语文化的适应程度决定该目的语掌握的程度。","y":"填空题","p":["舒曼"],"q":"舒曼","w":"high","e":["2025 真题"]},{"t":"在社会与心理距离太大的情况下，学习者的语言就会停留在初级阶段形成____。","y":"填空题","p":["洋泾浜化"],"q":"洋泾浜化","w":"normal","e":["核心考点"]},{"t":"在第二语言习得中，____距离和____距离是影响第二语言习得的主要因素。","y":"填空题","p":["社会","心理"],"q":"社会；心理","w":"high","e":["2025 真题"]},{"t":"正迁移指已获得的知识、技能对学习新知识、技能起阻碍的作用。","y":"判断题","p":["正迁移指已获得的知识、技能和方法、态度等对学习新知识、技能起积极、促进的作用；起阻碍作用的叫负迁移，也叫干扰。"],"q":"错误","w":"high","e":["2020 真题"]},{"t":"对比分析假说认为第二语言习得的主要障碍来自第一语言(母语)的干扰。","y":"判断题","p":["对比分析假说认为第二语言习得的主要障碍来自第一语言(母语)的干扰，需要通过对比两种语言结构的异同来预测难点和错误。"],"q":"正确","w":"high","e":["2018 真题"]},{"t":"中介语是固定不变的语言系统，一旦形成就不再变化。","y":"判断题","p":["中介语不是固定不变的，而是一个不断变化的动态语言系统；新知识和新规则不断注入，原有的尚未学好的规则和结构也在不断修正调整。"],"q":"错误","w":"high","e":["2020 真题"]},{"t":"中介语并非都是错误的，它有正确的部分，而且正确的部分随着学习的进展不断扩大。","y":"判断题","p":["中介语中存在一定的偏误，但中介语并非都是错误的，它有正确的部分，而且正确的部分随着学习的进展不断扩大。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"克拉申认为习得是首要的，学习实际上是辅助性的。","y":"判断题","p":["克拉申认为习得是首要的，远比我们想像的要重要，而学习实际上是辅助性的；通过学习获得的语言无法成为目的语习得的基础。"],"q":"正确","w":"high","e":["2019 真题"]},{"t":"克拉申认为“说”的教学没有必要，只要给学生可理解的输入，学习者能自然地学会说话，这一观点为绝大多数教师所认同。","y":"判断题","p":["该观点很难为有实际教学经验的教师们所认同，克拉申认为“说”的教学没有必要这一观点存在争议。"],"q":"错误","w":"high","e":["2025 真题"]},{"t":"文化适应假说是由舒曼提出的，认为第二语言学习者对目的语文化的适应程度决定该目的语掌握的程度。","y":"判断题","p":["舒曼提出的文化适应假说认为第二语言学习者对目的语文化的适应程度决定该目的语掌握的程度。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"中介语概念的提出者是（　　）。","y":"单项选择题","p":["美国语言学家塞林克于1969年提出中介语(interlanguage)的概念。"],"q":"B","w":"high","e":["2020 真题"]},{"t":"内在大纲假说的提出者是（　　）。","y":"单项选择题","p":["科德于1967年在其《学习者言语错误的重要意义》一文中提出，第二语言学习者在语言习得的过程中有其自己的内在大纲。"],"q":"C","w":"high","e":["2019 真题"]},{"t":"克拉申用“i+1”表示的是（　　）。","y":"单项选择题","p":["i代表学习者目前的语言水平，i+1则是下一阶段应达到的语言结构的水平，即稍稍高出他目前的语言水平。"],"q":"C","w":"high","e":["2025 真题"]},{"t":"简述对比分析假说的主要观点及其理论基础。","y":"简答题","p":["对比分析假说由拉多于50年代中期行为主义鼎盛时期提出","认为第二语言的获得是通过刺激—反应—强化形成习惯的结果","存在第一语言习惯的迁移问题，相同之处产生正迁移，差异导致负迁移","认为第二语言习得的主要障碍来自第一语言(母语)的干扰","理论基础是行为主义刺激—反应—强化理论，成为听说法、视听法等教学法的理论基础"],"q":"主要观点：对比分析假说由拉多于50年代中期行为主义鼎盛时期提出，认为第二语言的获得也是通过刺激—反应—强化形成习惯的结果。但与第一语言习得不同的是，在习得第二语言的时候，学习者已形成了一整套第一语言的习惯，因此就存在第一语言习惯的迁移问题。拉多认为第二语言与第一语言相似的语言成分容易学，不同的成分则难学；两种语言结构特","w":"high","e":["2018 真题"]},{"t":"简述中介语假说的主要内容。","y":"简答题","p":["中介语由塞林克于1969年提出概念、1972年提出假说","中介语是既不同于第一语言也不同于目的语的动态语言系统","中介语有自身的规律，是介于第一语言和目的语之间的独特语言系统","中介语不断变化，呈一定阶段性，逐渐向目的语靠拢","中介语的产生原因包括语言迁移、过度概括、训练迁移、学习策略和交际策略","中介语的偏误有反复性和顽固性，会产生僵化或化石化的现象"],"q":"中介语假说是美国语言学家塞林克于1969年提出中介语概念、1972年在其论文《中介语》中提出的，是试图探索第二语言习得者在习得过程中的语言系统和习得规律的假说，在第二语言习得的研究史上有重大意义。①中介语是指在第二语言习得过程中，学习者通过一定的学习策略，在目的语输入的基础上所形成的一种既不同于其第一语言也不同于目的语","w":"high","e":["2020 真题"]},{"t":"简述克拉申输入假说理论中的输入假说和情感过滤假说。","y":"简答题","p":["输入假说认为人类获得语言的惟一方式是对信息的理解，通过吸收可理解的输入习得语言","输入的语言信息既不要过难也不要过易，克拉申用“i+1”来表示","克拉申强调听力活动对语言习得最为重要","情感过滤假说也称屏蔽效应假说，情感对输入的信息起了过滤作用","造成过滤的主要心理因素包括学习的动力、态度、自信心、焦虑等","可理解的输入加上低屏蔽效应、低焦虑环境能习得第二语言"],"q":"输入假说：①人类获得语言的惟一方式是对信息的理解，也就是通过吸收可理解的输入习得语言知识，人们的注意力集中在输入的信息本身，而不是语言形式上。②输入的语言信息既不要过难也不要过易，克拉申用“i+1”来表示，i代表学习者目前的语言水平，i+1则是下一阶段应达到的语言结构的水平，即稍稍高出他目前的语言水平。③克拉申强调听力","w":"high","e":["2025 真题"]},{"t":"简述文化适应假说的主要内容及其评价。","y":"简答题","p":["文化适应假说由舒曼提出，认为第二语言习得是逐步适应目的语文化的过程","文化适应指学习者与目的语社团的社会和心理的结合","社会距离与心理距离是影响第二语言习得的主要因素","社会与心理距离太大时学习者语言停留在初级阶段形成洋泾浜化","强调文化的重要性是正确的，但把文化适应看成唯一关键因素则未必全面"],"q":"主要内容：文化适应假说由舒曼提出，从文化与语言的关系出发，把第二语言习得的过程看做是逐步适应目的语文化的过程，把整个第二语言习得看做是文化适应的一部分，认为第二语言学习者对目的语文化的适应程度决定该目的语掌握的程度。所谓文化适应是指学习者与目的语社团的社会和心理的结合，因此，学习者与目的语文化的社会距离与心理距离，就成","w":"high","e":["2025 真题"]},{"t":"简述第一语言习得与第二语言习得的相同点。","y":"简答题","p":["两种语言习得都必须具备一定的主观条件(健全的大脑和语言器官)和客观条件(一定的语言环境)","两种语言习得都是为了培养语言交际能力","两种语言习得都必须掌握语音、词汇、语法等要素和受文化制约的语用规则","两种语言习得都必须形成一定的听说读写的技能","两种语言习得大体上都经过感知、理解、模仿、记忆、巩固和应用阶段"],"q":"第一语言习得与第二语言习得的相同点主要有：①两种语言习得都必须具备一定的主观条件和客观条件。作为主观条件，主体必须具备健全的大脑和语言器官；作为客观条件，必须具备一定的语言环境。②两种语言习得都是为了培养语言交际能力。语言是交际工具，习得语言的目的都是为了交际。③两种语言习得都必须掌握语音、词汇、语法等要素和受文化制约","w":"high","e":["2020 真题"]},{"t":"试论述克拉申输入假说理论的五个系列假说及其对第二语言教学的启示。","y":"论述题","p":["习得与学习假说：认为习得是首要的，学习是辅助性的","自然顺序假说：认为人们习得语言规则有一个可以预测的共同顺序","监控假说：有意识的系统在言语行为中只起监控作用","输入假说：通过吸收可理解的输入习得语言，用i+1表示，强调听力理解","情感过滤假说：情感对输入的信息起过滤作用，受动力、态度、自信心、焦虑等影响","启示：提供大量可理解输入，控制在i+1程度，降低情感过滤，教学重心是交际"],"q":"克拉申从70年代末开始对第二语言习得提出了一系列假说，1985年在其著作《输入假说：理论与启示》中正式归纳为五个系列假说，总称为输入假说理论。①习得与学习假说：认为成人有两种截然不同的获得第二语言的方法，一种是习得，即潜意识的、日常的暗含的学习；另一种是有意识的语言学习。克拉申认为习得是首要的，学习实际上是辅助性的。②","w":"high","e":["2025 真题"]},{"t":"试论述第一语言习得与第二语言习得的不同点，并说明其对第二语言教学的启示。","y":"论述题","p":["习得的动力不同：儿童习得第一语言有天然动力，成人习得第二语言动机受意志支配且不稳定","习得的环境和方式不同：儿童在天然语言环境中以“沉浸法”习得，输入量大；成人主要在课堂习得，输入量少","习得的过程不同：儿童习得语言与建立概念、发展思维同步，成人习得需经过第一语言的思维","文化因素习得的不同：儿童自然习得文化和社会价值，成人非目的语环境不一定能习得目的语文化","主体的生理、心理特点不同：第一语言习得者都是儿童，第二语言习得者多为成人","启示：不能盲目模仿儿童习得第一语言的过程，必须研究成人第二语言习得的特殊规律"],"q":"儿童习得第一语言与成人习得第二语言之间存在着很大的不同。①习得的动力不同：儿童习得第一语言是出于其本能，是一种生存和发展的需要，是一种自然的需要，有天然的动力，可以持久不衰；成人习得第二语言在交际的大前提下有各种目的，这种习得的动机是受其意志支配的，也是不稳定的，一般说来，第二语言习得不具有第一语言习得的天然动力。②习","w":"high","e":["2020 真题"]},{"t":"【案例】某高校国际中文教育专业的一位留学生在学习汉语时，经常说出“我昨天去图书馆了”“他比我高得很”这样的句子，其中“他比我高得很”这类表达并不符合汉语的习惯。该学生母语为英语，教师发现他在使用汉语定语、状语的位置以及动词形态时，常常带有英语的痕迹。经过一段时间学习，该学生的汉语水平逐步提高，但仍然在语音和一些固定结构上出现难以纠正的错误，而且这些错误反复出现，很难彻底改掉。\n请结合第二语言习得理论的相关知识分析上述案例。","y":"案例分析","p":["运用中介语假说：学生的汉语表达既不同于母语也不同于目的语，是中介语系统的体现","运用对比分析假说和迁移理论：母语英语对汉语学习产生负迁移，导致定语、状语位置等方面的错误","中介语的偏误有反复性，已经纠正了的偏误还可能有规律地重现","中介语的偏误有顽固性，会产生僵化或化石化的现象，特别表现在语音方面","教学启示：正确认识中介语现象，重视母语迁移的影响","教学启示：针对化石化现象及早发现、及时纠正，提供大量可理解的输入和真实交际环境"],"q":"本案例可以用第二语言习得的相关理论进行分析。①中介语假说：美国语言学家塞林克提出中介语概念和假说，认为中介语是指在第二语言习得过程中，学习者通过一定的学习策略，在目的语输入的基础上所形成的一种既不同于其第一语言也不同于目的语、随着学习的进展向目的语逐渐过渡的动态的语言系统。案例中该留学生的汉语表达带有英语的痕迹，既不同","w":"high","e":["2020 真题"]}]}]},{"id":"yinlun-c06","t":"第六章 第二语言习得研究","w":"high","s":[{"id":"yinlun-c06-s01","t":"第一节 第二语言习得过程研究","w":"high","n":38,"k":[{"t":"对比分析","y":"名词解释","p":["对比分析(Contrastive Analysis)是将两种语言的系统进行共时比较，以揭示其相同点和不同点的一种语言分析方法。","把对比分析运用到第二语言教学中来，始于40年代的美国；提出第二语言习得的对比分析假说并建立起对比分析的理论系统的，是拉多。","对比分析的语言学理论基础是结构主义语言学，其心理学的理论基础是行为主义心理学和迁移理论。","对比分析大体上按照描写、选择、对比、预测四个步骤进行。"],"q":"对比分析(Contrastive Analysis)是将两种语言的系统进行共时比较，以揭示其相同点和不同点的一种语言分析方法。","w":"high","e":["2019 真题"]},{"t":"难度等级模式","y":"名词解释","p":["难度等级模式由普拉克特(C. Practor)提出，是一种分类比较简明的语言难度等级模式。","该模式将难度分为六级，从零级到五级，级数愈高难度也愈大。","零级：指两种语言中相同的成分，在学习中产生正迁移，而不会发生困难。如英语和汉语都是“动词＋宾语”的语序。","一级：在第一语言中分开的两个语言项目，在目的语中合成一项。二级：第一语言中有而目的语中没有的语言项目，学生必须避免使用。三级：第一语言中的某个语言项目在目的语中虽有相应的项目，但在项目的形式、分布和使用方面又有着差异。四级：目的语中的某个语言项目，在其第一语言中没有相应的项目，学习者在习得这些全新的项目时会产生阻碍性干扰。五级：第一语言中的一个语言项目到了目的语中分成两个或两个以上的项目，是本模式中难度最高的一项。"],"q":"难度等级模式由普拉克特(C. Practor)提出，是一种分类比较简明的语言难度等级模式。","w":"high","e":["2020 真题"]},{"t":"偏误分析","y":"名词解释","p":["偏误分析(Error Analysis)是对学习者在第二语言习得过程中所产生的偏误进行系统的分析，研究其来源，揭示学习者的中介语体系，从而了解第二语言习得的过程与规律。","科德是偏误分析最早的倡导者。","偏误分析的心理学基础是认知理论，语言学基础则是乔姆斯基的普遍语法理论。","第二语言习得过程被看成是规则形成的过程，即学习者不断从目的语的输入中尝试对目的语规则做出假设，并进行检验与修正，逐渐向目的语靠近并建构目的语的规则体系。"],"q":"偏误分析(Error Analysis)是对学习者在第二语言习得过程中所产生的偏误进行系统的分析，研究其来源，揭示学习者的中介语体系，从而了解第二语言习得的过程与规律。","w":"high","e":["2020 真题"]},{"t":"偏误与失误","y":"名词解释","p":["科德把学习者所犯的错误分为失误(mistake)和偏误(error)两种。","所谓失误是指偶然产生的口误或笔误，如本想说“甲”，但临时因紧张或是疏忽说成了“乙”。这种错误没有什么规律，即使操本族语的人也常常会发生。","偏误则是指由于目的语掌握不好而产生的一种规律性错误，它偏离了目的语的轨道，反映了说话者的语言能力和水准。","这类规律性的偏误正是中介语特征的反映，是偏误分析要研究的主要内容。"],"q":"科德把学习者所犯的错误分为失误(mistake)和偏误(error)两种。","w":"high","e":["2019 真题"]},{"t":"语内偏误与语际偏误","y":"名词解释","p":["进一步分析，人们把第二语言学习者在学习过程中由于对目的语规则掌握不全面或因错误推断而造成的偏误称为语内偏误。","把由于第一语言的干扰造成的偏误称为语际偏误。","偏误的来源包括母语负迁移、目的语知识负迁移、文化因素负迁移、学习策略和交际策略的影响、学习环境的影响等五个主要方面。","母语负迁移又特别体现在目的语语音的学习中，用学习者第一语言的语音规律代替目的语的语音规律是中介语语音的一大特色。"],"q":"进一步分析，人们把第二语言学习者在学习过程中由于对目的语规则掌握不全面或因错误推断而造成的偏误称为语内偏误。","w":"high","e":["2020 真题"]},{"t":"目的语知识负迁移","y":"名词解释","p":["目的语知识负迁移指学习者把他所学的有限的、不充分的目的语知识，用类推的办法不适当地套用在目的语新的语言现象上，造成了偏误，也称为过度概括(over-generalization)或过度泛化。","这类偏误一般在其母语中找不到根源，而且不同母语背景的学习者常常出现同样的偏误。","如果说由于母语负迁移所造成的偏误在学习的初级阶段占优势，到中级阶段或高级阶段目的语知识负迁移造成的偏误就逐渐占了优势，这是学习者内化规则过程中所产生的偏误。","表现在语音方面，如学习汉语第三声声调先降后升是学习者的一大难点；再如字母ü在 ju、qu、xu、yu等音节的拼写中，上边的两点要省去，学习者常常把这些音节中省去两点的ü读成u。"],"q":"目的语知识负迁移指学习者把他所学的有限的、不充分的目的语知识，用类推的办法不适当地套用在目的语新的语言现象上，造成了偏误，也称为过度概括(over-generalization)或过度泛化。","w":"high","e":["2020 真题"]},{"t":"运用分析","y":"名词解释","p":["运用分析(Performance Analysis)和话语分析(Discourse Analysis)也始于70年代，到80年代人们才更为重视第二语言习得运用分析与话语分析的研究。","运用分析是对第二语言学习者运用目的语的全部表现(既包括偏误部分也包括正确部分)进行分析，从而揭示中介语的发展轨迹。","迄今为止，西方学者的运用分析研究主要集中于对英语语素习得顺序的研究和对英语某些句法结构发展进程的研究；70年代初开始的语素研究，可以看做是最早的运用分析研究。","对英语某些句法结构如否定句、疑问句、关系从句等发展过程的研究，主要采用对一个或数个被试的语言运用进行较长期的跟踪调查。"],"q":"运用分析(Performance Analysis)和话语分析(Discourse Analysis)也始于70年代，到80年代人们才更为重视第二语言习得运用分析与话语分析的研究。","w":"high","e":["2019 真题"]},{"t":"话语分析","y":"名词解释","p":["话语分析作为一种语言研究方法，在第三章第二节已经做了介绍；70年代末大力倡导把话语分析用于第二语言习得研究的是哈奇(E. Hatch)。","她认为语言习得最重要的途径是语言交际，即第二语言学习者与以该语言为母语者之间的交谈，因此特别强调研究话语分析中的会话分析。","也有的学者认为不仅要研究学习者如何掌握语言形式，还要研究如何恰当地运用这些形式，因而强调研究言语行为和功能(如抱歉、邀请、埋怨等)。","对语言形式和功能的重视，打开了话语分析研究的广阔领域。"],"q":"话语分析作为一种语言研究方法，在第三章第二节已经做了介绍；70年代末大力倡导把话语分析用于第二语言习得研究的是哈奇(E. Hatch)。","w":"high","e":["2020 真题"]},{"t":"对比分析的语言学理论基础是____语言学，其心理学的理论基础是行为主义心理学和迁移理论。","y":"填空题","p":["结构主义"],"q":"结构主义","w":"high","e":["2020 真题"]},{"t":"对比分析大体上按照描写、选择、对比、____四个步骤进行。","y":"填空题","p":["预测"],"q":"预测","w":"high","e":["2019 真题"]},{"t":"难度等级模式由普拉克特(C. Practor)提出，将难度分为____级，从零级到五级，级数愈高难度也愈大。","y":"填空题","p":["六"],"q":"六","w":"high","e":["2020 真题"]},{"t":"科德把学习者所犯的错误分为失误和____两种。","y":"填空题","p":["偏误"],"q":"偏误","w":"high","e":["2019 真题"]},{"t":"偏误分析的心理学基础是认知理论，语言学基础则是乔姆斯基的____理论。","y":"填空题","p":["普遍语法"],"q":"普遍语法","w":"high","e":["2020 真题"]},{"t":"科德把偏误分析分为____个步骤。","y":"填空题","p":["五"],"q":"五","w":"normal","e":["核心考点"]},{"t":"人们把第二语言学习者在学习过程中由于对目的语规则掌握不全面或因错误推断而造成的偏误称为____偏误。","y":"填空题","p":["语内"],"q":"语内","w":"high","e":["2020 真题"]},{"t":"科德根据中介语的发展过程，把偏误分为前系统偏误、系统偏误和____偏误三类。","y":"填空题","p":["后系统"],"q":"后系统","w":"normal","e":["核心考点"]},{"t":"学习者把他所学的有限的、不充分的目的语知识，用类推的办法不适当地套用在目的语新的语言现象上，造成了偏误，也称为____或过度泛化。","y":"填空题","p":["过度概括"],"q":"过度概括","w":"high","e":["2020 真题"]},{"t":"70年代末大力倡导把话语分析用于第二语言习得研究的是____。","y":"填空题","p":["哈奇"],"q":"哈奇","w":"normal","e":["核心考点"]},{"t":"对比分析是将两种语言的系统进行共时比较，以揭示其相同点和不同点的一种语言分析方法。","y":"判断题","p":["对比分析(Contrastive Analysis)是将两种语言的系统进行共时比较，以揭示其相同点和不同点的一种语言分析方法。"],"q":"正确","w":"high","e":["2019 真题"]},{"t":"提出第二语言习得的对比分析假说并建立起对比分析理论系统的是弗赖斯。","y":"判断题","p":["提出对比分析假说并建立起对比分析理论系统的是弗赖斯的学生和后来的同事拉多；弗赖斯只是指出最有效的教材应以对母语和目的语的对比为基础。"],"q":"错误","w":"high","e":["2020 真题"]},{"t":"对比分析的主要观点是两种语言的差异越大，干扰越大，学习的困难也就越大。","y":"判断题","p":["对比分析的主要观点是两种语言的相同之处产生正迁移，不同之处则产生负迁移；两种语言的差异越大，干扰越大，学习的困难也就越大。"],"q":"正确","w":"high","e":["2020 真题"]},{"t":"对比分析只研究第一语言对目的语学习的迁移作用，而第二语言学习者所遇到的困难和所犯的错误并不只是来自第一语言的干扰。","y":"判断题","p":["调查研究表明，第一语言干扰所造成的错误只占学习者全部错误的33%，事实是学习者困难和错误的来源是多方面的。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"失误是指由于目的语掌握不好而产生的一种规律性错误，它反映了说话者的语言能力和水准。","y":"判断题","p":["失误指偶然产生的口误或笔误，没有什么规律；由于目的语掌握不好而产生的规律性错误是偏误。"],"q":"错误","w":"high","e":["2019 真题"]},{"t":"偏误分析是对比分析的继承和发展。","y":"判断题","p":["偏误分析是对比分析的继承和发展，在中介语理论影响下，突破了对比分析只强调第一语言干扰的局限，弥补了对比分析的不足。"],"q":"正确","w":"high","e":["2020 真题"]},{"t":"目的语知识负迁移造成的偏误一般能在其母语中找到根源。","y":"判断题","p":["目的语知识负迁移也称为过度概括或过度泛化，这类偏误一般在其母语中找不到根源，而且不同母语背景的学习者常常出现同样的偏误。"],"q":"错误","w":"high","e":["2020 真题"]},{"t":"运用分析是对第二语言学习者运用目的语的全部表现(既包括偏误部分也包括正确部分)进行分析，从而揭示中介语的发展轨迹。","y":"判断题","p":["运用分析是对第二语言学习者运用目的语的全部表现进行分析，从而揭示中介语的发展轨迹，这是它对偏误分析的重要发展。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"话语分析作为一种语言研究方法，70年代末大力倡导把话语分析用于第二语言习得研究的是克拉申。","y":"判断题","p":["70年代末大力倡导把话语分析用于第二语言习得研究的是哈奇(E. Hatch)，不是克拉申。"],"q":"错误","w":"normal","e":["核心考点"]},{"t":"提出第二语言习得的对比分析假说并建立起对比分析理论系统的学者是（　　）。","y":"单项选择题","p":["提出第二语言习得的对比分析假说并建立起对比分析的理论系统的，是弗赖斯的学生和后来的同事拉多。"],"q":"C","w":"high","e":["2020 真题"]},{"t":"难度等级模式的提出者是（　　）。","y":"单项选择题","p":["这里介绍由普拉克特(C. Practor)提出的一种分类比较简明的“难度等级模式”。"],"q":"B","w":"normal","e":["核心考点"]},{"t":"偏误分析最早的倡导者是（　　）。","y":"单项选择题","p":["科德是偏误分析最早的倡导者，他在《学习者言语错误的重要意义》一文中提出偏误分析。"],"q":"A","w":"high","e":["2019 真题"]},{"t":"中介语理论指导下的偏误分析研究，在我国对外汉语教学界是从（　　）于1984年发表《中介语理论与外国人学习汉语的语音偏误分析》一文开始的。","y":"单项选择题","p":["中介语理论指导下的偏误分析的研究，在我国对外汉语教学界是从鲁健骥于1984年发表《中介语理论与外国人学习汉语的语音偏误分析》一文开始的。"],"q":"C","w":"normal","e":["核心考点"]},{"t":"科德把偏误分析分为五个步骤，其中第一个步骤是（　　）。","y":"单项选择题","p":["科德把偏误分析分为五个步骤：(1)搜集供分析的语料……"],"q":"A","w":"normal","e":["核心考点"]},{"t":"简述对比分析的理论基础、步骤及其意义与局限。","y":"简答题","p":["语言学理论基础是结构主义语言学，心理学理论基础是行为主义心理学和迁移理论","步骤为描写、选择、对比、预测四个步骤","意义：发现学生学习的难点，揭示教学的重点，加强教学的针对性","局限：差异越大困难越大的观点与实际不符","局限：只研究第一语言的迁移作用，错误来源是多方面的","局限：只对语言的表层结构进行对比，把学习者看作机械刺激的对象"],"q":"理论基础：对比分析的语言学理论基础是结构主义语言学，其心理学的理论基础是行为主义心理学和迁移理论。步骤：对比分析大体上按照四个步骤进行：①描写，对目的语和学习者的第一语言进行详细的、具体的描写；②选择，在两种语言中选择进行对比的某些有意义的语言项目或结构；③对比，对两种语言中选择好的语言项目或结构进行对比，找出两种语言","w":"high","e":["2020 真题"]},{"t":"简述偏误与失误的区别。","y":"简答题","p":["失误是指偶然产生的口误或笔误，没有什么规律，不反映说话者的语言能力","偏误是指由于目的语掌握不好而产生的一种规律性错误，偏离了目的语的轨道","偏误反映了说话者的语言能力和水准，学习者自己难以察觉，也不易改正","规律性的偏误正是中介语特征的反映，是偏误分析要研究的主要内容"],"q":"科德把学习者所犯的错误分为失误(mistake)和偏误(error)两种。①失误是指偶然产生的口误或笔误，如本想说“甲”，但临时因紧张或是疏忽说成了“乙”。这种错误没有什么规律，即使操本族语的人也常常会发生；说话者一旦意识到马上可以自己改正，以后同样的错误也不一定再次出现。由于这类错误不反映说话者的语言能力，所以不在偏","w":"high","e":["2019 真题"]},{"t":"简述第二语言学习者偏误的主要来源。","y":"简答题","p":["母语负迁移：初学者偏误产生的主要原因之一","目的语知识负迁移：也称为过度概括或过度泛化","文化因素负迁移：由文化差异造成语言形式或使用的偏误","学习策略和交际策略的影响：如迁移、过度泛化、简化、回避、语言转换","学习环境的影响：教师解释引导、教材、课堂训练等"],"q":"第二语言学习者偏误的来源是多方而的，主要有五个方面：①母语负迁移。学习者不熟悉目的语规则的情况下，只能依赖母语知识，因而同一母语背景的学习者往往出现同类性质的偏误，对初学者来说，这是其偏误产生的主要原因之一。②目的语知识负迁移。学习者把他所学的有限的、不充分的目的语知识，用类推的办法不适当地套用在目的语新的语言现象上，","w":"high","e":["2020 真题"]},{"t":"简述偏误分析的意义与局限。","y":"简答题","p":["意义：偏误分析是对比分析的继承和发展","意义：改变了人们对偏误本质的认识，把偏误看成了解习得过程的窗口","意义：丰富了第二语言教学理论，促进了第二语言教学的发展","局限：正确与偏误的区分标准很难确定","局限：对各种偏误的研究还很不平衡","局限：只研究中介语的偏误部分，并未研究中介语的正确部分"],"q":"意义：①偏误分析是对比分析的继承和发展。在中介语理论影响下，突破了对比分析只强调第一语言干扰的局限，指出过度泛化等语内干扰以及学习策略、交际策略和学习环境所造成的偏误，弥补了对比分析的不足，成为第二语言习得研究中的重要部分。②偏误分析改变了人们对语言学习过程中所出现的偏误本质的认识。从把偏误看成是需要防范、避免的消极因","w":"high","e":["2019 真题"]},{"t":"简述对比分析、偏误分析、运用分析和话语分析之间的关系。","y":"简答题","p":["对比分析开始于50年代，是揭示两种语言异同的语言分析方法","偏误分析、运用分析和话语分析基本上都先后开始于70年代","四种分析模式之间不存在后者取代前者的问题","它们之间的关系是后者包括了前者","四种分析模式都用来进行中介语研究，后两种可望成为研究热点"],"q":"第二语言习得过程研究先后出现了对比分析、偏误分析、运用分析和话语分析几种模式。①对比分析开始于50年代，是将两种语言的系统进行共时比较，以揭示其相同点和不同点的语言分析方法。②偏误分析、运用分析和话语分析基本上都先后开始于70年代，它们之间很难区分出不同的阶段，更不存在后者取代前者的问题。③事实上每种分析模式都有其特点","w":"high","e":["2020 真题"]},{"t":"试论述偏误分析的理论基础、步骤、偏误分类及偏误来源。","y":"论述题","p":["理论基础：心理学基础是认知理论，语言学基础是普遍语法理论","步骤：搜集语料、鉴别偏误、对偏误进行分类、解释偏误产生的原因、评估偏误的严重程度","偏误分类：整体性偏误与局部性偏误、语内偏误与语际偏误、显性偏误与隐性偏误","科德根据中介语的发展过程把偏误分为前系统偏误、系统偏误和后系统偏误三类","偏误来源：母语负迁移、目的语知识负迁移、文化因素负迁移、学习策略和交际策略、学习环境","母语负迁移是初学者偏误产生的主要原因之一，目的语知识负迁移在中高级阶段逐渐占优势"],"q":"偏误分析是对学习者在第二语言习得过程中所产生的偏误进行系统的分析，研究其来源，揭示学习者的中介语体系，从而了解第二语言习得的过程与规律。理论基础：偏误分析的心理学基础是认知理论，语言学基础则是乔姆斯基的普遍语法理论；第二语言习得过程被看成是规则形成的过程。步骤：科德把偏误分析分为五个步骤：①搜集供分析的语料；②鉴别偏误","w":"high","e":["2020 真题"]}]},{"id":"yinlun-c06-s02","t":"第二节 学习者的个体因素","w":"high","n":36,"k":[{"t":"学习者的个体因素","y":"名词解释","p":["所谓学习者的个体因素，指第二语言学习者个体在习得过程中表现出的、对第二语言习得产生一定影响的生理、认知、情感等方面的特点。","由于语言学习活动必须通过学习者来实现，从这个意义上来说个体因素在语言习得中起决定的作用。","第二语言习得有普遍规律，同时学习者又表现出很多个体因素的特点。","第二语言习得即使是相同年龄、在同一教室的学习者之间，也表现出明显的差异，这种差异直接影响到学习的成绩和最终是否能获得第二语言。"],"q":"所谓学习者的个体因素，指第二语言学习者个体在习得过程中表现出的、对第二语言习得产生一定影响的生理、认知、情感等方面的特点。","w":"high","e":["2019 真题"]},{"t":"语言学能","y":"名词解释","p":["这种学习第二语言所需要的特殊认知素质叫做第二语言学习的能力倾向，也称语言学能(language aptitude)。","一般的智商测验不能准确地预测语言学能，专门用来测量语言学能的是语言学能测验。","有影响的语言学能测验有三种，即由卡罗尔(J. Carroll)和萨彭(S. Sapon)于1959年编制的《现代语言学能考试》和1967年编制的《初级现代语言学能考试》以及由平斯勒(P. Pimsleur)于1966年编制的《语言学能考试》。","语言学能测验，根据卡罗尔的观点，主要考查四种能力：语音编码解码能力、语法敏感性、强记能力、归纳能力。"],"q":"这种学习第二语言所需要的特殊认知素质叫做第二语言学习的能力倾向，也称语言学能(language aptitude)。","w":"high","e":["2020 真题"]},{"t":"学习策略","y":"名词解释","p":["学习策略(learning strategies)是语言学习者为有效地掌握语言规则系统，发展言语技能和语言交际能力，解决学习过程中所遇到的问题而采取的各种计划、途径、步骤、方法、技巧和调节措施。","研究发现，不同学习者所采用的学习策略有很大的一致性和规律性。","综合看来，学习策略大体上可分为认知学习策略和元认知策略(metacognitive strategies)两大类。","根据最早研究学习策略的茹宾(J. Rubin)所提出的六种认知学习策略，可以概括为求解、推理、实践、记忆、监控几个方面。"],"q":"学习策略(learning strategies)是语言学习者为有效地掌握语言规则系统，发展言语技能和语言交际能力，解决学习过程中所遇到的问题而采取的各种计划、途径、步骤、方法、技巧和调节措施。","w":"high","e":["2020 真题"]},{"t":"元认知策略","y":"名词解释","p":["元认知策略就是学习者通过计划、监控和评估等方式对自己的认知过程进行反思和研究。","元认知可以说是对认知的认知，是一种深层次的认知活动，是学习者对自己的能力特点、对认知任务和认知策略的认知。","并通过认知活动中的体验，对认知过程和认知策略进行自我监控和调节，以保证学习活动的成功。","如学习者通过学习成绩的反馈发现自己学习方法的问题，通过与其他人学习策略和学习结果的对比，发现相互之间的差异，从而取长补短提高自己的学习效率。"],"q":"元认知策略就是学习者通过计划、监控和评估等方式对自己的认知过程进行反思和研究。","w":"high","e":["2022 真题"]},{"t":"交际策略","y":"名词解释","p":["交际策略是学习者为顺利进行语言交际活动(即理解对话者的意图和表达自己的意思)有意识采取的计划措施或方法技巧，是语言使用者交际能力的一部分。","西方学者认为一般是在交际中遇到困难，如语言知识不能应付交际需要或缺乏某一特定的语言表达手段，无法按原定计划实现交际目标时，才采用交际策略。","对第二语言学习者来说，其交际活动在一定意义上也是学习活动的一部分，可以获得把学到的语言知识付诸实践进行运用的机会，是实现培养语言交际能力这一目标所不可缺少的。","各种具体的交际策略，实际上也扩充了学习者的语言表现手段。"],"q":"交际策略是学习者为顺利进行语言交际活动(即理解对话者的意图和表达自己的意思)有意识采取的计划措施或方法技巧，是语言使用者交际能力的一部分。","w":"high","e":["2019 真题"]},{"t":"认知方式","y":"名词解释","p":["认知方式(cognitive style)是人们感知和认识世界的方式，对学习者说来，也是其学习方式。","认知方式存在着个体差异，这里着重讨论场独立性和场依存性、审慎与冲动、歧义容忍度等。","场独立性是易于从整体中发现个别的认知方式，善于剖析事物和问题，把部分与整体区别开来，能集中于某一部分而不受其他部分的干扰；场依存性是易于感知事物整体的认知方式，倾向于从宏观上看事物并把事物作为一个整体来对待。","审慎型的人在学习中善于周密地思考，全面分析，反复权衡以后才做决定或反应；冲动型的人在学习中反应快捷，甚至不假思索。"],"q":"认知方式(cognitive style)是人们感知和认识世界的方式，对学习者说来，也是其学习方式。","w":"high","e":["2020 真题"]},{"t":"场独立性与场依存性","y":"名词解释","p":["场独立性(field independence)是易于从整体中发现个别的认知方式，善于剖析事物和问题，把部分与整体区别开来，能集中于某一部分而不受其他部分的干扰。","场依存性(field dependence)是易于感知事物整体的认知方式，倾向于从宏观上看事物并把事物作为一个整体来对待。","在第二语言学习中，场独立性的学习者由于分析能力强，能从一定的语境中把语言项目分离出来，长于在课堂教学中有意识地学习语言形式；场依存性的学习者则长于在自然语言环境中习得语言，他们关心别人，善于与别人交往。","研究还表明儿童的场依存性倾向大一些，成人的场独立性强，需要在正规的课堂学习环境里学习第二语言。"],"q":"场独立性(field independence)是易于从整体中发现个别的认知方式，善于剖析事物和问题，把部分与整体区别开来，能集中于某一部分而不受其他部分的干扰。","w":"high","e":["2020 真题"]},{"t":"动机","y":"名词解释","p":["动机(motivation)在情感因素中又占极其重要的地位。动机是激励个体从事某种行为的内在动力，常表现为为达到某种目的而付出努力的愿望。","调查结果发现，在影响第二语言学习的诸因素中，动机占33%，学能占33%，智力占20%，其他占14%。","第二语言习得的动机是推动学习者学习并达到掌握第二语言目的的一种强烈愿望，包括目的、要达到目的的愿望、对学习的态度和努力行动四个方面。","动机有内部动机和外部动机之分，内部动机是个体自身所产生的动力，外部动机是外部因素作用的结果；动机还有近景动机和远景动机之分。"],"q":"动机(motivation)在情感因素中又占极其重要的地位。动机是激励个体从事某种行为的内在动力，常表现为为达到某种目的而付出努力的愿望。","w":"high","e":["2021 真题"]},{"t":"融合型动机与工具型动机","y":"名词解释","p":["对第二语言学习动机的分类影响最大的是由兰伯特(W. Lambert)和加德纳(R. Gardner)所提出的融合型动机和工具型动机。","所谓融合型动机(integrative motivation)是指为了跟目的语社团直接进行交际，与目的语文化有更多的接触、甚至想进一步融合到第二语言社团中成为其一员。","工具型动机(instrumental motivation)是指把第二语言用作工具的实际目的，如查阅资料，进行研究，寻找工作，提高自己的知识水平，改善自己的社会地位等。","一般认为融合型动机更为强烈，所取得的学习效果也更大。"],"q":"对第二语言学习动机的分类影响最大的是由兰伯特(W. Lambert)和加德纳(R. Gardner)所提出的融合型动机和工具型动机。","w":"high","e":["2020 真题"]},{"t":"态度","y":"名词解释","p":["态度是构成动机的主要因素之一。它是个体对某种客观事物的评价性反应，是在对事物了解的基础上产生情感上的褒贬好恶，并反映出对之采取行动的倾向性。","西方学者的调查表明，学习第二语言的态度与所取得的学习成绩之间的关系高于学习其他科目的态度与成绩之间的关系。","影响学习态度的几个方面是：对目的语社团和文化的态度、对目的语的态度、对课程和教师、教材的态度。","对大多数学习者来说直接影响其目的语学习态度的还是他们在语言课堂上的感受。"],"q":"态度是构成动机的主要因素之一。它是个体对某种客观事物的评价性反应，是在对事物了解的基础上产生情感上的褒贬好恶，并反映出对之采取行动的倾向性。","w":"high","e":["2019 真题"]},{"t":"移情","y":"名词解释","p":["移情(empathy)是指设身处地领会别人的思想和感情。这是人与人交往中相互沟通、消除隔阂、达到和谐相处的必要条件。","语言是达到移情的主要手段，在语言交际过程中双方都要不断做出假设，揣摸从对方输入的信息所表达的意思以及将要输入的是什么信息。","由于认知因素和情感因素的差异，在同一语言文化的成员之间也需要有一定的移情，理解对方的认知及情感特点和状态，才能使交际顺利进行。","运用第二语言进行交际，除了认知和情感方面的差异外，更存在双方在文化上的差异和语言方面的障碍，更需要双方跨出自我的疆界，运用更多的移情来理解对方的文化特点和语言结构特点。"],"q":"移情(empathy)是指设身处地领会别人的思想和感情。这是人与人交往中相互沟通、消除隔阂、达到和谐相处的必要条件。","w":"high","e":["2020 真题"]},{"t":"抑制","y":"名词解释","p":["与自尊心有着密切关系的是抑制。抑制是个体的一种防御外部伤害、保护自我的心理屏障。","婴儿一生下来没有自我意识，甚至不能区分自我和周围世界；随着年龄的增长，自我意识逐渐形成。","从青少年时期开始，自我意识进一步发展，害怕自我暴露太多而使自尊心受到伤害，于是采用抑制的方法保护自我。","到了青春期随着在生理、认知和情感上受到的挫折增多，个体意识到不仅要认识自己还要认识周围的环境与社会，因而用于自我保护的抑制心理更为增强，而且一直发展到成年期。"],"q":"与自尊心有着密切关系的是抑制。抑制是个体的一种防御外部伤害、保护自我的心理屏障。","w":"high","e":["2020 真题"]},{"t":"学习者的个体因素主要指第二语言学习者个体在习得过程中表现出的、对第二语言习得产生一定影响的生理、____、情感等方面的特点。","y":"填空题","p":["认知"],"q":"认知","w":"high","e":["2019 真题"]},{"t":"学习第二语言所需要的特殊认知素质叫做第二语言学习的能力倾向，也称____。","y":"填空题","p":["语言学能"],"q":"语言学能","w":"high","e":["2020 真题"]},{"t":"根据卡罗尔的观点，语言学能测验主要考查语音编码解码能力、语法敏感性、强记能力和____四种能力。","y":"填空题","p":["归纳能力"],"q":"归纳能力","w":"normal","e":["核心考点"]},{"t":"综合看来，学习策略大体上可分为认知学习策略和____策略两大类。","y":"填空题","p":["元认知"],"q":"元认知","w":"high","e":["2022 真题"]},{"t":"元认知策略就是学习者通过计划、监控和____等方式对自己的认知过程进行反思和研究。","y":"填空题","p":["评估"],"q":"评估","w":"high","e":["2022 真题"]},{"t":"对模糊不清或有歧义的问题的接受与容忍的程度叫____。","y":"填空题","p":["歧义容忍度"],"q":"歧义容忍度","w":"normal","e":["核心考点"]},{"t":"动机有内部动机和外部动机之分，____动机是个体自身所产生的动力，常常来自个体对所做事情的兴趣和对其意义的认识。","y":"填空题","p":["内部"],"q":"内部","w":"high","e":["2021 真题"]},{"t":"对第二语言学习动机的分类影响最大的是由兰伯特和加德纳所提出的融合型动机和____动机。","y":"填空题","p":["工具型"],"q":"工具型","w":"high","e":["2020 真题"]},{"t":"____(empathy)是指设身处地领会别人的思想和感情。","y":"填空题","p":["移情"],"q":"移情","w":"high","e":["2020 真题"]},{"t":"圭奥拉在研究第二语言习得过程中的抑制心理时，提出____的概念，用来表示对自己语言的认同。","y":"填空题","p":["语言自我"],"q":"语言自我","w":"normal","e":["核心考点"]},{"t":"第二语言习得研究除了要研究共同的规律外，还要了解个体差异对习得的影响。","y":"判断题","p":["由于语言学习活动必须通过学习者来实现，个体因素在语言习得中起决定的作用，因此还要了解个体差异对习得的影响。"],"q":"正确","w":"high","e":["2019 真题"]},{"t":"影响第二语言习得成功与否的根本因素是学习开始得早晚，而不是学习时间的长短。","y":"判断题","p":["影响第二语言习得成功与否的根本因素是学习时间的长短，而并非学习开始得早晚；学习开始得早的儿童，从总体上看并无明显优势。"],"q":"错误","w":"high","e":["2020 真题"]},{"t":"一般说来，智商越高，学习效果也就越好，但不同的科目与智商的相关程度也不相同。","y":"判断题","p":["大体说来，智力是人的一种心理机能……一般说来，智商越高，学习效果也就越好，但不同的科目与智商的相关程度也不相同。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"元认知可以说是对认知的认知，是一种深层次的认知活动。","y":"判断题","p":["元认知可以说是对认知的认知，是一种深层次的认知活动，是学习者对自己的能力特点、对认知任务和认知策略的认知。"],"q":"正确","w":"high","e":["2022 真题"]},{"t":"场独立性是易于感知事物整体的认知方式，倾向于从宏观上看事物。","y":"判断题","p":["场独立性是易于从整体中发现个别的认知方式，善于剖析事物和问题；场依存性才是易于感知事物整体、倾向于从宏观上看事物的认知方式。"],"q":"错误","w":"normal","e":["核心考点"]},{"t":"一般认为融合型动机更为强烈，所取得的学习效果也更大，但这也不是绝对的。","y":"判断题","p":["一般认为融合型动机更为强烈，所取得的学习效果也更大，但这也不是绝对的，因为融合型还是工具型只是根据动机中的“目的”一项来划分的。"],"q":"正确","w":"high","e":["2020 真题"]},{"t":"态度是构成动机的主要因素之一，它是个体对某种客观事物的评价性反应。","y":"判断题","p":["态度是构成动机的主要因素之一，它是个体对某种客观事物的评价性反应，是在对事物了解的基础上产生情感上的褒贬好恶。"],"q":"正确","w":"normal","e":["核心考点"]},{"t":"焦虑过多会阻碍第二语言习得，因此一点焦虑也没有对第二语言习得最为有利。","y":"判断题","p":["过多的焦虑会阻碍第二语言习得，但如果一点焦虑也没有，同样不利于第二语言习得；适当的焦虑会增加学习的动力和上进心。"],"q":"错误","w":"normal","e":["核心考点"]},{"t":"在影响第二语言学习的诸因素中，动机和学能各占（　　）。","y":"单项选择题","p":["调查结果发现，在影响第二语言学习的诸因素中，动机占33%，学能占33%，智力占20%，其他占14%。"],"q":"C","w":"normal","e":["核心考点"]},{"t":"提出融合型动机和工具型动机的心理学家是（　　）。","y":"单项选择题","p":["对第二语言学习动机的分类影响最大的是由兰伯特和加德纳所提出的融合型动机和工具型动机。"],"q":"B","w":"high","e":["2020 真题"]},{"t":"简述学习策略的构成。","y":"简答题","p":["学习策略是学习者掌握语言规则系统、发展言语技能和语言交际能力所采取的各种措施","学习策略大体上可分为认知学习策略和元认知策略两大类","认知学习策略可概括为求解、推理、实践、记忆、监控几个方面","元认知策略是学习者通过计划、监控和评估等方式对自己的认知过程进行反思和研究","元认知可以概括为计划、监控、评估、调节几个方面"],"q":"学习策略是语言学习者为有效地掌握语言规
