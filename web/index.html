，到６０年代的认知法和各种人本主义教学法、７０年代的交际法，出现了百花争艳的局面。","w":"high","e":["2018 真题","2021 真题"]},{"t":"情景法","y":"名词解释","p":["情景法是本世纪二三十年代产生于英国的一种以口语能力的培养为基础、强调通过有意义的情景进行目的语基本结构操练的教学法。","情景法早期称为口语法(Oral Approach)，代表人物为英国著名语言教育家帕默(H. E. Palmer)和霍恩比(A. S. Hornby)。","情景法的语言学理论基础是英国的结构主义，口语被认为是语言的基础，准确的结构是说话能力的核心。","情景法的心理学基础是行为主义的习惯形成理论，强调学生通过模仿形成正确的语言习惯。","帕默认为学习语言有两种能力：一种是有意识的学习能力，另一种则是天赋的自然学习能力，这应看做是最早提出的区分语言学习与习得的理论。"],"q":"(3) 情景法。把新词放在语境中，也就是联系句子、话语和一定的社会文化背景来理解。 如要区别“家”的两个含义，可以用问答来解释清楚：“你家有几口人?”(指家庭)，“你今天回家吗?”(指家庭住处)","w":"high","e":["2019 真题"]},{"t":"视听法","y":"名词解释","p":["视听法是50年代产生于法国的一种第二语言教学法，它强调在一定的情景中听觉(录音)感知与视觉(图片影视)感知相结合的教学方法。","因它首创于法国圣克卢高等师范学院，所以也叫“圣克卢法”，代表人物是古布里纳(P. Guberina)和古根汉(G. Gougenhein)。","视听法来源于直接法和听说法，它继承和发扬了二者的长处。","视听法的理论基础也是结构主义语言学和行为主义心理学，认为掌握了一种语言的结构就是掌握了该语言。","视听法又受到完形心理学的影响，强调完整地感知事物，所以视听法也叫“整体结构法”。"],"q":"对比分析假说对第二语言习得的解释完全是行为主义刺激—反应一强化的理论，这一理论成为听说法、视听法等重要的第二语言教学法，特别是句型替换操练的理论基础，对第二语言教学产生了深远的影响。","w":"high","e":["2019 真题"]},{"t":"语法翻译法","y":"名词解释","p":["语法翻译法又称“传统法”或“古典法”，是以系统的语法知识教学为纲，依靠母语，通过翻译手段，主要培养第二语言读写能力的教学法。","这是第二语言教学史上最古老的教学法，在欧洲用于教授古希腊语、拉丁语已有千百年的历史。","语法翻译法的语言学基础是历史比较语言学，认为一切语言都起源于一种共同的原始语言，语言规律是共同的，词汇所代表的概念也是相同的，所不同的只是词汇的语音和书写形式。","语法翻译法的心理学基础是18世纪德国的官能心理学，其创始人是德国哲学家沃尔夫(C. Wolff)。","18世纪末、19世纪初，德国语言学家奥伦多夫(H. Ollendorff)等对语法翻译法进行了理论上的总结与阐述，使之成为一种科学的第二语言教学法体系。"],"q":"目前，二语教学法多种多样, 如语法翻译法 (Grammar Translation Method)、直接法 (Direct Method)、听说法(Audiolingual Method)、程序教学法 (Presentation Practice Production)、全身反应法(Total Physical Response)、交际教学法 (Communicative Language Teaching)、任务型教学法 (Task-based Learning)、语块教学法(The Lexical Approach) 等。","w":"high","e":["2018 真题","2021 真题"]},{"t":"自觉实践法","y":"名词解释","p":["自觉实践法是前苏联20世纪60年代以来广泛采用的外语教学方法，主张学习者在自觉掌握一定语言理论知识基础上，主要通过大量言语实践活动达到直觉运用目的语。","代表人物是前苏联的心理学家别利亚耶夫(Б. B. Беляев)。","自觉实践法主要继承直接法通过大量言语实践培养听说读写技能的本质特点，同时也继承了语法翻译法强调自觉掌握语言规则的正确主张，同时吸取了对立的两大派的长处。","自觉实践法的语言学基础是苏联著名语言学家谢尔巴院士关于区分语言、言语、言语活动的学说。"],"q":"直接法(自觉对比法)认知法阅读法情景法听说法视听法团体语言学习法默教法全身反应法暗示法交际法(自觉实践法)自然法语言学理论基础","w":"high","e":["2020 真题"]},{"t":"自觉对比法","y":"名词解释","p":["自觉对比法是主张通过母语与目的语的翻译和结构对比，自觉掌握目的语的一种教学方法。","在本世纪30年代至50年代成为前苏联正统的外语教学法，对东欧和蒙古的外语教学也有较大影响，50年代我国外语教学基本上是以自觉对比法为依据。","自觉对比法是以直接法为对立面，客观上成了语法翻译法的继承和发展。","自觉对比法的理论基础首先是重视德育、把教育教养任务放在首位的苏联教育学思想，还以当时苏联的语言学和心理学理论为基础。"],"q":"直接法(自觉对比法)认知法阅读法情景法听说法视听法团体语言学习法默教法全身反应法暗示法交际法(自觉实践法)自然法语言学理论基础","w":"high","e":["2020 真题"]},{"t":"阅读法","y":"名词解释","p":["阅读法产生于20世纪初，为英国著名语言教育家韦斯特(M. West)在印度从事英语教学工作时所创立，又称韦斯特“新法”，是一种强调通过直接阅读来培养阅读能力的教学法。","与帕默强调“口语是基础”不同，韦斯特强调“阅读是基础”。","韦斯特认为应当通过阅读学会阅读，阅读既是目的也是手段。","阅读法要求学生接触大量的语言材料，在上下文或插图的帮助下直接理解阅读材料的内容；不主张阅读之前先教语法规则，而是阅读后把学习者在阅读中已熟悉的语法项目进行归纳。"],"q":"二、阅读法⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯ (36)","w":"normal","e":[]}]},{"id":"yinlun-c07-s02","t":"第二节 人本派与功能派教学法","w":"high","n":8,"k":[{"t":"功能","y":"名词解释","p":["交际法一反其他教学法以语法或句型结构为纲的传统做法，明确提出以功能意念为纲。","功能是用语言做事，完成一定的交际行为。","交际大纲把语言功能分为六类：传达与了解实际情况；表达或了解理智性的态度；表达或了解道义上的态度；表达或了解情感性的态度；请人做事；社交。","以“邮局在哪儿?”这个句子为例，其功能是询问。"],"q":"我们认为，在这个“综合创新”观点的启示下，只要我们既不因循守旧，盲目自满，拒绝和排斥外来文化的优秀成分，也不崇洋媚外，丢弃自我，照搬人家的一切，而是实事求是地分析中国文化的成分及其对历史的影响和贡献，继承和吸收古代文化中一切有益的东西，借鉴和吸收外来文化中一切优秀的成果，建立一种性质、结构和功能都完全崭新的社会主义新文化，是完全可以实现的。","w":"high","e":["2019 真题","2020 真题","2021 真题"]},{"t":"意念","y":"名词解释","p":["意念指功能作用的对象，也就是功能的具体内容，常用来回答“什么”、“谁”的问题。","意念又分为普通意念和特殊意念。","普通意念指与功能相关的时、空、数量等关系，比如表示存在、空间、时间、数量、质量、心理关系、指代等，适用于各种话题和背景，是所有学习者都必须掌握的，与功能称为“共核”。","特殊意念是由话题直接决定的词汇项目，也就是各类词汇，如个人身份、住处、业余爱好、旅行、健康福利等。"],"q":"如：①教材以哪种语言理论为基础，结构主义还是功能意念? ②教材侧重哪种教学法，听说法还是交际法? ③如何处理知识传授和技能培养的关系? ④技能训练的比重是否合理，侧重哪种技能? ⑤语言表达的地道性和得体性是否得到重视?","w":"high","e":["2020 真题"]},{"t":"交际法","y":"名词解释","p":["交际法又称“交际语言教学”(Communicative Language Teaching)，较早称为“功能法”(Functional Approach)、“意念—功能法”(Notional-Functional Approach)，是以语言功能和意念项目为纲、培养在特定的社会语境中运用语言进行交际能力的一种教学法。","交际法产生于70年代初期西欧共同体国家，中心在英国，创始人为英国语言学家威尔金斯(D. A. Wilkins)。","交际法的语言学理论基础正是60年代兴起、70年代形成高潮的社会语言学，尤其是社会语言学家海姆斯的交际能力理论和功能主义语言学家韩礼德的功能语言理论和话语分析理论，以及威多森的语言交际观。","在心理学方面，交际法受到人本主义心理学和60年代后期兴起的心理语言学的影响，强调以学生为中心。"],"q":"如：①教材以哪种语言理论为基础，结构主义还是功能意念? ②教材侧重哪种教学法，听说法还是交际法? ③如何处理知识传授和技能培养的关系? ④技能训练的比重是否合理，侧重哪种技能? ⑤语言表达的地道性和得体性是否得到重视?","w":"high","e":["2020 真题"]},{"t":"自然法","y":"名词解释","p":["自然法是70年代后期产生于美国的新教学法，其倡导者是美国加州大学西班牙语副教授特雷尔(Tracy Terrell)和美国语言教育家克拉申。","自然法是根据对自然环境中的母语习得和第二语言习得的观察与研究，提出在非自然条件(即课堂教学)中最大限度地扩大对学习者的语言输入、首先集中培养理解能力并强调通过习得掌握第二语言的教学方法。","自然法以语言交际理论和克拉申的有关第二语言习得理论，即“输入”的五个假说为理论基础。","1983年克拉申与特雷尔合作出版了《自然法：课堂中的语言习得》一书，全面阐述了自然法的理论基础和具体实践。"],"q":"直接法(自觉对比法)认知法阅读法情景法听说法视听法团体语言学习法默教法全身反应法暗示法交际法(自觉实践法)自然法语言学理论基础","w":"high","e":["2018 真题"]},{"t":"全身反应法","y":"名词解释","p":["全身反应法(简称TPR)于60年代初期产生于美国，盛行于70年代，创始人是美国实验心理学家阿舍尔(James T. Asher)。","这种教学法强调语言学习行为的协调，通过身体动作教授第二语言，主要用于美国移民儿童的英语教育。","全身反应法是以儿童习得第一语言的理论为依据。","其实比阿舍尔早半个世纪，第一次大战时帕默就提出过第二语言听说读写的教学顺序，主张理解能力先于表达能力，还在其著作《通过动作学英语》中竭力提倡在教学的第一阶段让学生做执行教师指令的训练。","逐渐形成了各种以听力领先、从较长期的听力理解训练开始的“领会教学法”(Comprehension Approach)，全身反应法则是其中最具代表性、且影响最大的一种。"],"q":"目前，二语教学法多种多样, 如语法翻译法 (Grammar Translation Method)、直接法 (Direct Method)、听说法(Audiolingual Method)、程序教学法 (Presentation Practice Production)、全身反应法(Total Physical Response)、交际教学法 (Communicative Language Teaching)、任务型教学法 (Task-based Learning)、语块教学法(The Lexical Approach) 等。","w":"high","e":["2019 真题","2021 445 二、教育学、心理"]},{"t":"暗示法","y":"名词解释","p":["暗示法是由保加利亚精神病医学家和心理学家、教育家罗扎诺夫(G. Lozanov)于60年代中期创立的。","这是一种强调通过暗示，开发人的身心两方面的潜力，激发高度的学习动机并创造最佳学习条件，有意识的和无意识的活动相结合，让学习者在放松而又注意力高度集中的心理状态下进行有效学习的教学方法。","暗示法以现代心理学和生理学为其理论基础。","为了把学习者从错误的暗示惯性中解放出来，正确的暗示主要采取两种手段：威信和稚化。","罗扎诺夫还提出教学中充分考虑到心理、生理规律的三个基本原则：学习活动应由整个大脑组织参与；教学中的分析与综合应同时进行；学习者的意识过程和超意识过程应同时地、不可分割地进行。"],"q":"直接法(自觉对比法)认知法阅读法情景法听说法视听法团体语言学习法默教法全身反应法暗示法交际法(自觉实践法)自然法语言学理论基础","w":"normal","e":[]},{"t":"默教法","y":"名词解释","p":["默教法是美国教育家加特诺(C. Gattegno)于60年代初首创的一种第二语言教学法，它要求教师在课堂上尽量少说话，尽量鼓励学生多参与言语活动，从而使学生更有效地掌握运用第二语言的能力。","教师的沉默是默教法的最大特点。","默教法的主要理论基础是布鲁纳“发现学习”的教育思想，认为学习应是解决问题式的、创造和发现式的活动。","默教法还从儿童第一语言习得中吸取了不少有益的东西，但同时又认为成人第二语言学习完全不同于儿童母语习得，成功的第二语言学习是受到严格控制的“人为”的方法。"],"q":"直接法(自觉对比法)认知法阅读法情景法听说法视听法团体语言学习法默教法全身反应法暗示法交际法(自觉实践法)自然法语言学理论基础","w":"normal","e":[]},{"t":"团体语言学习法","y":"名词解释","p":["团体语言学习法60年代初创立于美国，代表人物为美国心理学家柯伦(C. A. Curran)。","这是一种采用小组集体讨论的形式、教师和学生处于医生和病人的关系并把学习过程看成是咨询过程的第二语言学习方法，也称为咨询法(Counseling Learning)。","团体语言学习法的理论基础是人本主义心理学，强调整体学习观，认为人类学习是完整的人的学习。","团体语言学习法吸取了心理疗法的理论和方法，把教师看做是咨询医生，把学生看做是病人。"],"q":"直接法(自觉对比法)认知法阅读法情景法听说法视听法团体语言学习法默教法全身反应法暗示法交际法(自觉实践法)自然法语言学理论基础","w":"normal","e":[]}]},{"id":"yinlun-c07-s03","t":"第三节 第二语言教学法的发展趋向","w":"high","n":3,"k":[{"t":"综合法","y":"名词解释","p":["50年来我国对外汉语教学界在辩证唯物主义思想指导下，正是从汉语教学的实际出发，吸取了国外第二语言教学法各流派的优秀成分，摈弃其极端化、片面化的做法，不拘一格走一条综合化的路子。","今天本学科大部分教师和学者仍主张继续进行“综合法”的研究。","具体说来，这种综合法既应重视语言功能的教学和交际能力的培养，又应加强语言结构规则的教学；既强调语法知识的理解和掌握，又重视通过模仿操练形成习惯；既重视课堂上的自觉学习，并以此为主；又重视课堂和课下的自然习得，不排斥其辅助作用。","既强调以学生为中心、充分调动学习者的主动性积极性，又重视教师的主导作用；教材既要用规范、循序渐进、有利于学习的材料，也要逐步增加“真实”教材的比重。"],"q":"自20世纪20年代以来，折衷主义的教学法有混合法、综合法、折衷法等。","w":"high","e":["2019 真题"]},{"t":"教学法流派","y":"名词解释","p":["教学法流派，指在一定的理论指导下在教学实践中逐渐形成的、包括其理论基础、教学目标、教学原则、教学内容、教学过程、教学形式、教学方法和技巧、教学手段、教师与学生的作用和评估方法等方面的教学法体系。","一种教学法流派的形成除了受当时的时代背景，特别是政治、经济等因素的影响外，更直接地受这一阶段的语言学理论、心理学理论、教育学理论以及一些其他相邻学科发展的影响。","各种不同教学法流派之间的差异，主要是由于对语言本质特征和对语言学习规律有不同认识，因而对教学规律有不同看法。","它影响到教学大纲的制订、教材的编写、课程教学程序和方法的确定，以及测试评估手段的选择等。"],"q":"从80年代初开始，由于学科建设的开展，对外汉语教学界同仁的学科意识不断增强，激发了从事科研的极大积极性，对指导教学实践所急需的教学方法、教材和测试评估等方面的研究全面展开，还开始了后来一直延伸到９０年代的文化与语言教学关系的大讨论，并加强了对国外的教学理论、习得理论和教学法流派的介绍与研究。","w":"high","e":["2021 真题"]},{"t":"分阶段教学法","y":"名词解释","p":["美国学者黎天睦(T. Light)提出了“分阶段教学法”的主张，即根据不同学习阶段的特点，采用适当的教学法。","由于教学目的、教学对象、教学阶段和教学条件的不同，事实上不可能有适应各种情况的万能教学法。","很多学者主张应该根据不同的情况，选择不同的教学法。","黎天睦提出：初级阶段宜用听说法，中级阶段宜用交际法，高级阶段则用认知法或语法翻译法；同一阶段也可以几种教学法交叉使用。"],"q":"美国学者黎天睦(T. Light)提出了“分阶段教学法”的主张，即根据不同学习阶段的特点，采用适当的教学法。","w":"normal","e":[]}]}]},{"id":"yinlun-c08","t":"第八章 对外汉语教学理论与应用(上)","w":"high","s":[{"id":"yinlun-c08-s01","t":"第一节 对外汉语教学目的与课程设计","w":"high","n":6,"k":[{"t":"教学内容","y":"名词解释","p":["第二语言教学是为了培养语言交际能力，这一教学目的决定了教学内容。","从语言能力和语言交际能力的构成因素出发，吕必松曾提出语言教学的教学内容应包括“语言要素、语用规则、言语技能、言语交际技能和相关文化知识”。","这样，对外汉语教学内容可以概括为四个方面：(1)语言要素(汉语语音、词汇、语法、汉字)；(2)言语技能(汉语听、说、读、写)；(3)言语交际技能(汉语语用规则、话语规则、交际策略)；(4)相关文化知识(汉语的文化因素、中国基本国情和文化背景知识)。","语言要素、言语技能、言语交际技能和相关文化知识就构成了语言交际能力的基础。"],"q":"他把对外汉语教学看做是一项系统工程，认为总体设计是“根据语言规律、语言学习规律和语言教学规律，在全面分析第二语言教学的各种主客观条件、综合考虑各种可能的教学措施的基础上选择最佳方案，对教学对象、教学目标、教学内容、教学途径、教学原则以及教师的分工和对教师的要求等做出明确的规定，以便指导教材编写(或选择)、课堂教学和成绩测试使各个教学环节成为一个互相衔接的、统一的整体，使全体教学人员根据不同的分工在教学上进行协调行动。","w":"high","e":["2020 真题"]},{"t":"总体设计","y":"名词解释","p":["总体设计是吕必松在80年代初根据对外汉语教学事业创立时期教学活动处于经验型的探索阶段、缺乏科学性和规范性的实际情况提出的理论。","他把对外汉语教学看做是一项系统工程，认为总体设计是“根据语言规律、语言学习规律和语言教学规律，在全面分析第二语言教学的各种主客观条件、综合考虑各种可能的教学措施的基础上选择最佳方案，对教学对象、教学目标、教学内容、教学途径、教学原则以及教师的分工和对教师的要求等做出明确的规定，以便指导教材编写(或选择)、课堂教学和成绩测试，使各个教学环节成为一个互相衔接的、","他并把总体设计以及根据总体设计而进行的教材编写、课堂教学和语言测试看做是对外汉语教学活动的四大环节。"],"q":"一、跟教学总体设计的关系 ⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯ (34)二、跟教材设计的关系 ⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯ (34)","w":"high","e":["2019 真题"]},{"t":"教学大纲","y":"名词解释","p":["教学大纲是根据教学计划、以纲要形式制定的、对具体课程的教学目的、教学内容、教学进度和教学方法进行规范的指导性文件。","教学大纲通常分说明、本文和附录三部分。","说明部分阐明本课程的教学对象、教学目的要求、教学方式、本课程在专业中的地位和作用等；本文部分按课、章、节详细规定教学内容及其定量分级、主要教学环节；附录部分是各种教学参考资料和附表(如语言学科的词汇表、汉字表、功能项目表等)。","根据语言教学的特点，有的教学大纲按语言要素分别制订，就有关方面的教学内容做出规范，如语法大纲、句型大纲、词汇大纲、情景大纲、功能大纲、意念大纲等。"],"q":"二、词汇教学的任务刘珣 (2000) 曾指出对外汉语词汇教学应该“根据教学大纲的要求，(使学习者)在有关汉语词汇知识的指导下，掌握一定数量的汉语词汇的音、义、形和基本用法，培养其在语言交际中对词汇的正确理解和表达能力”。","w":"high","e":["2021 真题"]},{"t":"教学计划","y":"名词解释","p":["教学计划是根据教育目的和培养目标所制定的全面指导某专业教与学活动的规范性文件。","教学计划是以课程设计为核心的总体设计的具体体现，主要包括专业培养目标、学习年限、课程设置及其主要教学方式和学时分配。","其中，课程体系是主要内容，教学计划也可以看做是课程设置的总体规划，决定该专业课程的结构与方向。","教学计划常由国家教育行政部门组织制订，对有关专业的教学工作和教学活动提出统一的要求，因此教学计划是编制教学大纲和编写教材的主要依据，也是进行教学活动、评估教学工作的主要依据。"],"q":"对外汉语教学过程是根据教学计划和教学大纲的规定，教师和学生共同参与的对外汉语教学活动的过程，也是实施教学、全面完成教学任务的过程。","w":"high","e":["2021 真题"]},{"t":"课程设计","y":"名词解释","p":["课程设计，简单说来就是制定课程。","课程设计是在教育目的和具体教学目的的指导下，从学习者的特点和需要出发，根据专业对知识结构和能力结构的要求，最优化地选择教学内容、组织教学进程，形成合理的、相互配合的课程体系。","课程设计不能只考虑教学内容一个方面，它涉及到对教学需求和教学条件的分析、课程与大纲设计理论的选择、教学目标、教学内容、教学进度、教学方法、教学评估和教学管理等多方面问题的确定，直到课程计划和教学大纲的制订。"],"q":"作为指导思想，在课程设计实践中这两种理论已相互融合，现在的课程结构一般既有学科知识课程，也有如见习、实习、社会实践等活动课程。","w":"high","e":["2021 真题"]},{"t":"对外汉语教学目的","y":"名词解释","p":["对外汉语教学的教学目的应归纳为：掌握汉语基础知识和听说读写基本技能，培养运用汉语进行交际的能力；增强学习汉语的兴趣和动力，发展智力，培养汉语的自学能力；掌握汉语的文化因素，熟悉基本的中国国情和文化背景知识，提高文化素养。","不同的学习阶段、不同学习期限在要求上应有所区别，但都应从这三方面来考虑教学目的。","掌握汉语基础知识和听说读写基本技能，培养运用汉语进行交际的能力，这是最直接、最根本的教学目的，体现了语言教学的根本任务。","语言交际能力包括语法(语言)能力、社会语言能力、话语能力和策略能力，因此要培养语言交际能力必须掌握汉语的基础知识和听说读写基本技能，以及语用规则和相关的文化知识。"],"q":"[3] 程棠. 对外汉语教学目的原则方法 [M].北京：华语教学出版社，2000.[4] 崔希亮. 语言理解与认知 [M].北京：语言文化大学出版社，2001.","w":"high","e":["2020 真题","2021 真题"]}]},{"id":"yinlun-c08-s02","t":"第二节 对外汉语教学的基本教学原则","w":"normal","n":1,"k":[{"t":"对外汉语教材都是利用拼音方案，使用简化字，教普通话。","y":"判断题","p":["我国规范、通用的汉语是普通话，规范、通用的标注音素读音的符号是《汉语拼音方案》，规范、通用的汉字是我国正式公布的简化字。","对外汉语教材都是利用拼音方案，使用简化字，教普通话。"],"q":"对外汉语教材都是利用拼音方案，使用简化字，教普通话。","w":"normal","e":[]}]},{"id":"yinlun-c08-s03","t":"第三节 对外汉语教材的编写与选用","w":"high","n":11,"k":[{"t":"教材","y":"名词解释","p":["教材是教师教学和学生学习所依据的材料，与教学计划和教学大纲构成学校教学内容的有机组成部分。","在教学活动的四大环节中，教材占有很重要的地位。它是总体设计的具体体现，反映了培养目标、教学要求、教学内容、教学原则；同时教材又是课堂教学和测试的依据。","狭义的教材指教科书，广义的教材除了教科书外还包括教学参考书、讲义、讲授提纲、图表、各种教学音像资料等。","教材体现了语言教学最根本的两个方面：教什么和如何教。教材水平的高低不仅能反映教学理论和教学法研究的深度，而且在很大程度上决定教与学的效果。"],"q":"他把对外汉语教学看做是一项系统工程，认为总体设计是“根据语言规律、语言学习规律和语言教学规律，在全面分析第二语言教学的各种主客观条件、综合考虑各种可能的教学措施的基础上选择最佳方案，对教学对象、教学目标、教学内容、教学途径、教学原则以及教师的分工和对教师的要求等做出明确的规定，以便指导教材编写(或选择)、课堂教学和成绩测试使各个教学环节成为一个互相衔接的、统一的整体，使全体教学人员根据不同的分工在教学上进行协调行动。","w":"high","e":["2021 真题"]},{"t":"实用性","y":"名词解释","p":["实用性是教材编写和选用的原则之一。","第二语言教材不同于语言学教材，主要用于培养语言技能和能力；语言知识要通过教学转化为技能，是为培养能力服务的。","实用性主要体现在：(1)教材内容要从学习者的需要出发，是学习者进行交际活动所必需的，是在生活中能马上应用的，要避免“教科书语言”和“教室语言”；(2)语言材料必须来源于生活、来源于现实，要有真实性；(3)要有利于贯彻精讲多练的原则；(4)要有利于开展交际活动，使教学过程交际化。"],"q":"一、商务汉语教学方法由于其教学内容、教学目的的特殊性，商务汉语在教学上要以学生为本，突出交际性、实用性，注重师生互动与沟通，教学方法具有多样性和灵活性的特点。","w":"high","e":["2020 真题"]},{"t":"科学性","y":"名词解释","p":["科学性是对外汉语教材编写和选用的原则之一。","针对性、实用性以及趣味性、系统性也都属于科学性的范围。","科学性特别强调以下几点：(1)要教规范、通用的语言，我国规范、通用的汉语是普通话，规范、通用的标注音素读音的符号是《汉语拼音方案》，规范、通用的汉字是我国正式公布的简化字；(2)教材内容的组织要符合语言教学的规律；(3)对语言现象的解释要注意准确性，避免造成对学习者的误导；(4)教材内容要反映出学科理论研究的新水平，及时更换陈旧内容。"],"q":"在它指导下的教学法认为，言语行为的基本特征是创新而不是模仿，理解是习得语言知识的基础，强调在交际环境中训练语言运用的能力，重视阅读在语言和思维能力培养过程中的作用，注重语言知识的科学性和系统性。","w":"high","e":["2020 真题"]},{"t":"系统性","y":"名词解释","p":["系统性是对外汉语教材编写和选用的原则之一。","首先是指教材内容在基本知识介绍和技能训练方面，也就是语音、词汇、语法、汉字等语言要素和听、说、读、写言语技能的安排方面，要平衡协调、有一定的章法。","学生用书、教师手册、练习本、单元试题各部分要分工合理，相互呼应。纵的方面，初级、中级、高级不同阶段教材要衔接；横的方面，综合技能课与听、说、读、写专项技能课教材要配合。还要考虑图片、幻灯、声、像、电脑辅助教材的提供。从而形成系列的、立体的教材体系。"],"q":"最直接的影响还是来自教育学所提出的普遍教学原则，如第三章所提到的理论联系实际的原则、知识传授与智能发展相结合的原则、教师的主导作用与学生的主动性、自觉性相结合的原则、统一的培养要求与因材施教相结合的原则、系统性与循序渐进相结合的原则，直观性原则、巩固性原则、量力","w":"high","e":["2020 真题"]},{"t":"趣味性","y":"名词解释","p":["趣味性是对外汉语教材编写和选用的原则之一。","教材内容和形式生动有趣，能吸引学习者，使学习者产生学习兴趣和动力，让相对说来比较枯燥的语言学习过程变得轻松愉快。","趣味性主要体现在：(1)教材的趣味性与教材的实用性、交际性紧密相关；(2)教材内容要反映现实，是学习者所关注的话题；(3)教材内容要逐步加大文化内涵，多方面介绍目的语文化；(4)多样化是形成趣味性的重要因素。"],"q":"介绍历史要有趣味性。中国历史很多时候故事性很强，画面感也很强，可以很好地加以运用。如楚汉相争时的萧何月下追韩信、鸿门宴、乌江自刎，明末清初的吴三桂引清兵入关等，都非常有趣。","w":"high","e":["2020 真题"]},{"t":"针对性","y":"名词解释","p":["针对性是教材编写和选用的原则之一。","教材要适合使用对象的特点。最基本的特点是，不同母语、母语文化背景与目的语、目的语文化对比所确定的教学重点不同。","针对性包括：(1)学习者的年龄、国别、文化程度特点；(2)学习者学习目的的不同；(3)学习者学习的起点不同，根据学习者原有的目的语水平分为初、中、高三级教材；(4)学习时限的不同。"],"q":"田有兰、王新编著并出版的《警务中泰英三语教程》，内容涉及警务及法律常识，书中内容具有很强的针对性，如公共安全、失物招领、交通管理、处理交通违规、巡逻及盘查、刑事审讯、非法移民、非法务工、处理刑事案件、社区警务管理等。","w":"high","e":["2020 真题"]},{"t":"《实用汉语课本》","y":"名词解释","p":["1981～1982年，受教育部委托，专门为我国教师在国外进行汉语教学编写的基础汉语教材《实用汉语课本》第一、二册(北京语言学院刘珣、邓恩明、刘社会编著)由商务印书馆出版。","第一套贯彻结构、情景及功能相结合原则的教材是《实用汉语课本》。“从选材到练习内容和练习方式都经过精心设计，在贯彻交际性原则和加强文化知识的教学等方面进行了不少有益的创造，使对外汉语教材的编写原则和编写方法向前迈进了一步。”","该教材出版后，很快就得到国外汉语教学界的重视，1983年9月德国现代汉语讨论会发表的公报中认为这是“中国到现在为止最先进的对外汉语教材”。","1987年成为我国第一部获奖的对外汉语教材。出版20年来，该教材除了国内不少学校使用外，还行销五大洲，成为世界上使用最广的基础汉语教材之一。"],"q":"如初级汉语综合课《实用汉语课本》第四十三课教案是详细的叙述式教案，《中级汉语精读教程》 (Ⅱ)第七课的教案是列表式和叙述式结合的详细教案。","w":"high","e":["2019 真题","2021 真题"]},{"t":"直线式","y":"名词解释","p":["直线式指教材的语法结构或话题内容排列的一种方式。","直线式安排就是将语法点或句型按难易排列，从第一课开始一课教一个或几个语法点，直到最后一课。除了在课文中重现外，同一语法点除个别因用法较复杂而分作连续几课介绍外，作为讲练的重点一般不会出现两次。","这种方法的缺点十分明显。编者企图一次就把某一语法点介绍清楚，并设想学了这一次，学习者就能基本掌握该语法点。这种一个问题一个问题依次解决的方式不符合语言学习的规律。直线式的另一个缺点是按难易程度安排语法点往往是主观的，而且与学生的实际需要脱节。"],"q":"直线式安排就是将语法点或句型按难易排列，从第一课开319","w":"normal","e":[]},{"t":"螺旋式","y":"名词解释","p":["螺旋式是交际法主张的教材安排方式，也叫圆周式安排。","即将话题和句型结构根据交际需要并适当照顾难易度分成几个圈，每圈都将主要话题和句型结构出现一遍，而圈与圈之间又逐步加深难度，呈螺旋式上升或是同心圆扩大之势。","这样安排既能使学习者在较短的时间(一圈中)接触较多的话题和句型结构，便于及早地运用和交际，又能使同一话题和结构多次出现，反复巩固加深，符合认知规律和第二语言学习的特点。"],"q":"9.循序渐进，螺旋式提高，加强重现原则本原则涉及教学内容的编排顺序问题。","w":"normal","e":[]},{"t":"结构法教材时期","y":"名词解释","p":["回顾半个世纪对外汉语教材发展的历史，我们已经走过了50年代到70年代的结构法教材时期，和80年代到90年代的结构与功能相结合教材时期，现在正跨入结构、功能、文化相结合时期。","结构法教材指以语言结构(语法)为纲的教材。对外汉语教学结构法教材强调理解和掌握语法规则，并在基本语法知识的指导下培养听说读写基本技能。","对外汉语教材从50年代至70年代经过30年的探索，总共出版约10部。尽管数量不算多，但由于每部教材都是精心制作，每一部都在前一部的基础上有所发展，使我们在编写结构法教材方面积累了较为丰富的经验，并达到了相当的水平。"],"q":"回顾半个世纪对外汉语教材发展的历史，我们已经走过了５０年代到７０年代的结构法教材时期，和８０年代到９０年代的结构与功能相结合教材时期，现在正跨入结构、功能、文化相结合时期。","w":"normal","e":[]},{"t":"结构—功能型教材","y":"名词解释","p":["结构—功能型是教材按遵循的主要教学原则划分的一种类型。","结构与功能相结合，以结构安排为基础，同时考虑到结构所表达的功能，使结构应用于一定的功能。比较适合于初级阶段的第二语言学习。","这是80年代以来我国对外汉语教材编写的主要路子。目的是为了弥补纯结构型和纯功能型教材的不足，并吸取两者的优点。","但这类教材也未能很好地解决结构与功能的结合问题，容易让结构成为支配的因素，功能则成为附属，可有可无。"],"q":"结构——功能型教材以语言结构为基础，同时考虑结构所表达的交际功能；","w":"normal","e":[]}]}]},{"id":"yinlun-c09","t":"第九章 对外汉语教学理论与应用(下)","w":"high","s":[{"id":"yinlun-c09-s01","t":"第一节 对外汉语教学过程与课堂教学","w":"high","n":7,"k":[{"t":"课堂教学","y":"名词解释","p":["课堂教学是指教师根据教学大纲规定的目的、任务和教材，运用恰当的教学方法，在规定的时间内对固定班级的学生进行某门课程教学的形式。","在学校教育中，课堂是实施教学的主要场所。对外汉语课堂教学是对外汉语教学的基本组织形式，集中地体现了对外汉语教学过程。","教学过程的感知、理解、巩固、运用阶段主要在课堂教学中完成。实施教学计划，贯彻教学原则，运用教学方法，完成课程教学并实现教学目标，主要都是靠课堂教学。","在教学活动的四大环节中，课堂教学是中心环节。要提高教学效果，就要提高课堂教学质量。"],"q":"他把对外汉语教学看做是一项系统工程，认为总体设计是“根据语言规律、语言学习规律和语言教学规律，在全面分析第二语言教学的各种主客观条件、综合考虑各种可能的教学措施的基础上选择最佳方案，对教学对象、教学目标、教学内容、教学途径、教学原则以及教师的分工和对教师的要求等做出明确的规定，以便指导教材编写(或选择)、课堂教学和成绩测试使各个教学环节成为一个互相衔接的、统一的整体，使全体教学人员根据不同的分工在教学上进行协调行动。","w":"high","e":["2019 真题"]},{"t":"教师的语言","y":"名词解释","p":["这里的“教师的语言”(teacher talk)是一个特定的概念，是指第二语言教师为了达到交际的目的，对该语言的非母语学习者在课堂教学和课外交往中有意识使用的目的语系统的变体。","正因为它是教师主要在课堂中使用的语言，因此关系到能否成功地执行教学计划，同时也成为学生(特别是在非目的语环境中学习)所能获得的可理解输入的主要来源，直接影响到他们的目的语习得。","总的说来有三大特点：一是慢，放慢语速，增加停顿；二是简化，使用简单的词汇、句子；三是详细化，输入更多信息包括多余信息，采用重复、释义、迂回的办法，目的是为了便于学习者理解，成为可理解的输入。","教师的语言对学习者有示范和引导作用，推动其中介语向目的语靠拢，因此必须是规范的。"],"q":"对成人来说，也有帮助他们习得第二语言的简化的代码，这就是“教师的语言”、本族人与学习自己母语的外国人交谈时使用的“外国人的语言”，以及第二语言习得者之间的交际语言“中介语”。","w":"high","e":["2020 真题"]},{"t":"对外汉语教学过程","y":"名词解释","p":["对外汉语教学过程是根据教学计划和教学大纲的规定，教师和学生共同参与的对外汉语教学活动的过程，也是实施教学、全面完成教学任务的过程。","在这一过程中，学习者在教师的指导和帮助下，逐步培养运用汉语进行交际的能力，对中国文化的了解得以加深，文化素养得到进一步提高，同时其智力也得到发展，从而实现教育的总目的。","教学过程的实质是学习者对目的语和目的语文化的认识过程，是学习者感觉、知觉、记忆、想像、思维、情感等一系列心理活动的过程。在这一过程中，教师和学生是教学活动的两主体。","对外汉语教学过程主要通过课堂教学和课外活动来实现。课堂教学是对外汉语教学的基本组织形式，课外活动是辅助形式。"],"q":"上述学生认识活动的特殊性，也就是教学过程的本质特征，对对外汉语教学过程特征的把握和教学原则的确定有重要的指导意义。","w":"high","e":["2019 真题"]},{"t":"课堂教学的主要环节","y":"名词解释","p":["课堂教学的主要环节，以教学过程的感知、理解、巩固、运用四个阶段为基础。","这里仅就一般语言课的教学提出五个主要环节，即组织教学、复习检查、讲练新内容、巩固新内容和布置课外作业。","组织教学的目的是稳定学生的情绪，集中学生的注意力，创造有利于学习的和谐气氛。复习检查的目的是了解学生对已学内容的掌握情况，获得反馈，发现并弥补教学中的缺陷。讲练新内容是课堂教学中的重点环节。巩固新内容与新内容讲练紧密相连。布置课外作业用以巩固课堂所学内容、督促学生及时复习旧课和预习新课。"],"q":"这四个阶段基本上反映了课堂教学的主要环节。","w":"high","e":["2020 真题"]},{"t":"教学过程的四个基本阶段","y":"名词解释","p":["从第二语言教学特点出发，对外汉语教学过程分为四个基本阶段，即感知阶段、理解阶段、巩固阶段和运用阶段。","感知阶段的特点是，感性的语言材料通过视、听、读等途径被学生感知，进入大脑形成表象。","理解阶段的特点是，从感知的表象中进一步认识事物的内部结构和内在联系，是从感性认识发展到理性认识的阶段，也是识记、特别是有意义的识记的完成和记忆保持的开始。","巩固阶段是从理论到实践的阶段，其特点是从识记、理解的大量语言材料中归纳出目的语的规则和用法，扩大、完善目的语的知识结构，并通过各种练习和交际实践，内化这些规则并形成言语技能。","运用阶段是指在真实的语言情境中进行的言语交际活动，也是记忆的再认阶段，是以培养学生创造力和想像力为特点的阶段。"],"q":"以上教学过程的四个基本阶段是相互衔接、紧密联系的有机整体。","w":"high","e":["2020 真题"]},{"t":"在教学活动的四大环节中，课堂教学是中心环节。","y":"判断题","p":["在教学活动的四大环节中，课堂教学是中心环节。要提高教学效果，就要提高课堂教学质量。"],"q":"所以说，在教学活动的四大环节中，课堂教学是中心环节。","w":"high","e":["2019 真题"]},{"t":"板书","y":"名词解释","p":["板书是课堂教学的重要教学手段。除了帮助学生理解并记笔记外，还可以使课堂教学纲目清楚，更具条理性，也可以突出重点引起学生的注意。","对外汉语教学的板书，还有将听说技能训练与读写技能训练相联系、给学生提供更多的认读汉字和学习汉字机会的作用。","板书应当注意：(1)汉字一定要正确、规范，笔顺应与教材一致，字形要美观，至少要端正，给学生以示范的作用；(2)板书要很好地设计，黑板当中五分之三用于书写新课内容；(3)板书要鲜明、醒目，适当运用彩色粉笔突出重点。"],"q":"以“看”为例，当学习表示“观察并加以判断”的“看”( 你看今天会不会下雨?)时，教师可以引导学生说出带有“看”的短语或句子，教师再将包含有“看”的不同义项的短语或句子板书下来，组织学生分析归纳例子中“看”的意思。","w":"normal","e":[]}]},{"id":"yinlun-c09-s02","t":"第二节 对外汉语语音、词汇、语法、汉字教学","w":"high","n":4,"k":[{"t":"汉字教学","y":"名词解释","p":["汉字是用来记录汉语的书写符号系统。","汉字教学的任务是，以汉字形、音、义的构成特点和规律为教学内容，帮助学习者获得认读和书写汉字的技能。汉字教学是汉语教学的重要组成部分，不掌握汉字就学不好汉语。汉字教学是汉语作为第二语言教学最显著的特点。","汉字又被认为是汉语学习最大的难点。这是由于由笔画组成的方块汉字是记录语素的语素文字，是与世界上大多数民族使用的、以记录音素的字母拼写的拼音文字根本不同的文字系统。","汉字教学原则主要有：(1)语和文先分后合，初期汉字应按自身规律独立教学；(2)强化汉字教学，字与词教学相结合；(3)把握汉字的构成规律和基本理论，利用汉字的表意和表音功能识记汉字；(4)按笔画、部件、整字三个层次，从笔画、笔顺、部件、间架结构四个方面进行汉字教学；(5)重视对比，加强复习，通过书写识记汉字。"],"q":"对形旁有表义作用的字，在日常分散的汉字教学过程中，可适当利用形旁的类别作用，例如“跳”“跑”“蹲”“跨”“踩”“踏”“跟”“踮”“蹦”等字，由于这些动作都必须用脚，所以，都用“足”旁，并可推而广之，例如“跷”“跛”“蹄”等字也跟“脚”有关。","w":"high","e":["2020 真题"]},{"t":"词汇教学","y":"名词解释","p":["对外汉语词汇教学的任务是根据教学大纲的要求，在有关汉语词汇知识的指导下，掌握一定数量的汉语词汇的音、义、形和基本用法，培养在语言交际中对词汇的正确理解和表达能力。","词汇是语言的建筑材料，是句子的基本结构单位。没有词汇就无法传递信息，也就无从交际。","词汇教学原则主要有：(1)要认真掌握每一个词语的具体意义和用法；(2)词的教学应与句子教学相结合，在一定的语境中掌握词汇；(3)利用词的聚合和组合关系在系统中学习词；(4)掌握汉语构词法，重视语素教学，词与字(语素)教学相结合；(5)不同的言语技能对词的掌握有不同的要求；(6)加强词汇的重现与复习，减少遗忘。"],"q":"1. 词汇教学的任务和意义对外汉语词汇教学的任务是根据教学大纲的要求，在有关汉语词汇知识的指导下，掌握一定数量的汉语词汇的音、义、形和基本用法，培养在语言交际中对词汇的正确理解和表达能力。","w":"high","e":["2019 真题"]},{"t":"语法教学","y":"名词解释","p":["语法教学是对目的语的词组、句子以及话语的组织规律的教学，用以指导言语技能训练并培养正确运用目的语进行交际的能力。","不掌握目的语遣词造句的规则，就难以正确理解和表达。语法教学一直处于第二语言教学的中心地位。","语法教学原则主要有：(1)通过语言对比突出语法的重点和难点；(2)从句型入手，句型操练与语法知识的归纳相结合；(3)由句子扩大到话语；(4)语法结构的教学与语义、语用和功能的教学相结合；(5)精讲多练，以练习为主；(6)先易后难、循序渐进地安排语法项目；(7)重视纠正学习者的语法错误，并把病错句的分析作为课堂教学内容的一个部分。"],"q":"[56] 周小兵. 越南人学习汉语语法点难度考察 [J].云南师范大学学报：对外汉语教学与研究版，2007 (1).[57] 周小兵，语言对比分析的技术应用———基于对韩汉语语法教学 [M]//周小兵，孟柱亿. 国际汉语教育：教学资源与汉韩对比. 广州，中山大学出版社，2014.","w":"high","e":["2020 真题","2021 真题"]},{"t":"语音教学","y":"名词解释","p":["对外汉语语音教学的任务是让学习者掌握汉语语音的基本知识和汉语普通话正确、流利的发音，为用口语进行交际打下基础。","语音是语言的物质外壳。语音的重要性决定了语音教学是第二语言教学的基础，是掌握听说读写技能和交际能力的前提。","语音教学原则主要有：(1)短期集中教学与长期严格要求相结合；(2)音素教学与语流教学相结合；(3)通过语音对比突出重点和难点；(4)声韵调结合教学，循序渐进；(5)听说结合，先听后说；(6)以模仿和练习为主、语音知识讲解为辅；(7)机械性练习与有意义练习相结合。"],"q":"中 编 语言要素和文化教学第九章 语音教学 ……………………………………………………………………………………………………………………………………… (237)","w":"high","e":["2020 真题"]}]},{"id":"yinlun-c09-s03","t":"第三节 语言测试","w":"high","n":14,"k":[{"t":"信度","y":"名词解释","p":["信度又称可靠性，指测试结果的可靠程度或稳定性，也就是考试成绩是否反映了受试者的实际水平。","测量的工具要固定。松紧带不能用来作测量的尺子。语言测试是测量语言的工具，这把尺子也要固定。","一般从三个方面衡量测试的信度：(1)测试的稳定性(stability)，也称再测信度；(2)测试的等值性(equivalence)，也称为复本信度；(3)测试的内部一致性(internal consistency)，常用分半法。","影响信度的因素有：测试的题量、试题的同质性、试题的区分性、受试者水平的多样性、评分的客观性。"],"q":"《通用规范汉字表》特别采集了常用的姓氏人名用字、乡镇以上地名用字、与民众生活相关的科技用字和教材印刷需要的文言用字，使大众传媒用字的准确程度、通过网络传递信息的信度和速度，都得到进一步的改善。","w":"high","e":["2021 真题"]},{"t":"效度","y":"名词解释","p":["效度又称有效性，指测试的有效程度，即测试的内容和方法是否能测出预定要测量的东西。","效度又分为表面效度、内容效度、结构效度和经验效度(效标关联效度)。","表面效度指某个测验或考试从表面看来是否测了它旨在测量的东西，有没有缺漏的部分，有没有偏题怪题。","内容效度指测试的内容是否是应该考查的，是否反映了这项测试的要求，或者说试题所包含的内容代表性、准确度和覆盖面如何。","结构效度又称理论效度，指考试的结果在多大程度上符合我们根据某种理论做出的预测。","效标关联效度是指确定一种能反映测试效度的参照标准，然后考察某一考试与该标准之间的相关程度。"],"q":"标准化测试是以现代教育测量学的理论为依据，按照系统的科学程序对考试的全过程(设计、命题、施测、评分、分析等)实行标准化处理，对误差进行严格控制，有较高效度、信度，能测出受试者真实水平的测试。","w":"high","e":["2020 真题"]},{"t":"区分性","y":"名词解释","p":["区分性指测试区分受试者知识和能力差别的性能，是试题的质量标准。","如果受试者的水平高低不同而测试的成绩却很接近，不能把水平高和水平低的受试者区分开来，说明该考试的区分性差。","测试的区分性从试题的难易度和试题的区分度两方面考虑。","试题的难易度指试卷中应包括适当比例的难易程度不同的试题。试题的区分度指试题能区分受试者水平差异的程度，它与难易度相关，是更重要的指标。"],"q":"它具有较高的区分性，受试者的分数反映了他在全体受试者中的位置。","w":"high","e":["2021 真题"]},{"t":"学能测试","y":"名词解释","p":["学能测试又称潜能测试或性向测试，目的在于了解受试者学习第二语言的潜在能力和素质。","学习语言的潜能包括：语音的编码、解码能力，语法敏感性，语言的记忆能力，综合归纳能力等。","学能测试是一种预示性的测试。","在决定学习一种语言之前，了解学习者先天条件和素质，对学习者本人和学校都是有价值的。学能测试属于常模参照测试。"],"q":"三、分班测试和学能测试这两种测试都是为了将来的学习，其区别在于：分班测试着重测量学生现实的实际水平, 学能测试 (aptitude test) 着重测量学生将来的潜在能力。","w":"high","e":["2019 真题"]},{"t":"成绩测试","y":"名词解释","p":["成绩测试又称课程测试，是一门课程或课型的测试，目的是检查学习者在某一教学阶段是否掌握了教学大纲和教材所规定的教学内容，在学习上取得什么成果。","测试的内容以课程的教学大纲和教材为依据，教什么考什么。","这是一种回顾性的测试，目的在于了解学习者目前所达到的程度，是与一个较长期的目标相联系的。受试者获得的成绩是绝对的。","成绩测试是教学中用得最多的测试，学校的期中期末考试、毕业考试等都属于这一类。"],"q":"他把对外汉语教学看做是一项系统工程，认为总体设计是“根据语言规律、语言学习规律和语言教学规律，在全面分析第二语言教学的各种主客观条件、综合考虑各种可能的教学措施的基础上选择最佳方案，对教学对象、教学目标、教学内容、教学途径、教学原则以及教师的分工和对教师的要求等做出明确的规定，以便指导教材编写(或选择)、课堂教学和成绩测试使各个教学环节成为一个互相衔接的、统一的整体，使全体教学人员根据不同的分工在教学上进行协调行动。","w":"high","e":["2019 真题","2021 真题"]},{"t":"水平测试","y":"名词解释","p":["水平测试又称能力测试，目的在于测量受试者现有的整体的语言实际运用能力，以评定是否达到胜任某项任务的要求。","水平测试不考虑受试者的学历，也不以任何大纲、课程或教材为依据，而是根据语言交际能力的标准，或是某一特定任务的要求来命题。这是一种回顾兼预示的测试。","水平测试具有较高的区分性，受试者的分数反映了他在全体受试者中的位置。水平测试常常是大规模标准化测试，如我国的汉语水平考试(HSK)、英语水平考试(EPT)，美国的托福考试，英国的剑桥英语水平考试等。"],"q":"四、成绩测试和水平测试 ⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯ (131)","w":"high","e":["2019 真题","2021 真题","2024 445 二、教育学心理学"]},{"t":"语言测试","y":"名词解释","p":["语言测试是根据一定的评估目的，以抽样方式通过有限试题来诱导出受试者的言语行为，然后借助于定量描述来推断受试者掌握的该语言的知识和能力。","从心理学的角度来看，上述定义表明，测试的任务在于如何诱导出体现受试者语言知识和能力的言语行为，并对这种行为进行量化和说明解释。","语言测试具有间接性、片面性、主观性和偶然性四个特点。","测试是教育评估的主要手段，也是教学活动的主要环节之一。测试是第二语言教学四大环节的重要组成部分。"],"q":"498 对外汉语教学入门(第三版)为满足汉语学习者的商务测试需求，孔子学院总部/国家汉办委托对外经济贸易大学国际商务汉语教学与资源开发基地，组织中外专家，借鉴近年来国际语言测试和商务汉语研究的最新成果，对2006年开考的商务汉语考试(BCT) 进行了改版，编著出版了《商务汉语考试BCT (A) 大纲》《商务汉语考试 BCT (B) 大纲》和《商务汉语考试大纲(口语)》。","w":"high","e":["2020 真题","2021 真题"]},{"t":"后效作用","y":"名词解释","p":["测试是用来检查教学效果的，但同时又不可避免地给教学以影响，这就是测试的后效作用。","特别是一些大型的、重要的考试，如升学考试，常常对教学起指挥棒的作用。为了使学习者能通过这类考试获得好的成绩，教学反而向测试看齐，甚至出现教学为考试服务的本末倒置现象。","好的测试符合教学规律，能给教学以正确的引导，对学生的学习起检查和督促的作用，产生积极的后效。","如果考试背离了教学规律和学习规律，就会对教学产生有害的影响。"],"q":"5. 后效作用(backwash)测试是用来检查教学效果的，但同时又不可避免地给教学以影响，这就是测试的后效作用。","w":"high","e":["2021 真题"]},{"t":"多项选择题","y":"名词解释","p":["多项选择题一般是先提出情景(称为题干)，并提出四个答案的备选项，让受试者选择其中的一个(其余三个叫干扰)，所以也称四项选择题。","这是考查阅读理解和听力理解等语言技能的常用题型，可以考词汇也可考语法。","多项选择题最大的优点是评分客观，因而信度大。可以直接考出编制者想考的问题，使受试者无法回避，因而效度也大。由于答题迅速，因此题量可大。","缺点是不能测表达能力，有25%猜对的概率，命题费时费力。"],"q":"英语教学界最早于70年代率先引进了多项选择题型和完形测试题型，于１９８１年研制了我国第一个标准化语言考试——英语水平考试(EPT)。","w":"high","e":["2019 真题"]},{"t":"标准化测试","y":"名词解释","p":["标准化测试是以现代教育测量学的理论为依据，按照系统的科学程序对考试的全过程(设计、命题、施测、评分、分析等)实行标准化处理，对误差进行严格控制，有较高效度、信度，能测出受试者真实水平的测试。","这种测试由权威机构和专业队伍研制。","为了保证严密的科学性，标准化测试通常是以客观性试题为主的常模参照测试。","标准化语言测试的过程大体上有四个步骤，即设计命题、考试实施、阅卷评分和统计分析。"],"q":"水平测试常常是大规模标准化测试，如我国的汉语水平考试(HSK)、英语水平考试(EPT)，美国的托福考试，英国的剑桥英语水平考试等。","w":"high","e":["2020 真题"]},{"t":"综合填充题","y":"名词解释","p":["综合填充是完形测试(cloze tests)的基本形式。即在一篇短文中隔一定的字数删去一个词，让受试者补上。","它是以格式塔的完形心理学派理论为基础，认为心理学的基本特征是在意识经验中所体现的结构性或整体性。","“完形倾向”使人具有填补空缺的心理，而填补空缺的过程中必须对整体及其组成部分有充分的认识。","最早是选用三四百字短文，除了第一句和最后一句外，每隔5或7、9、11个字就留出一个空格，每道试题约25～50个空格。后来改为从出题的需要出发不定距离留空，并采用综合填充与多项选择相结合的办法。"],"q":"语言测试的题型有数十种，这里我们重点讨论多项选择题、综合填充题、作文和口试。","w":"high","e":["2020 真题"]},{"t":"结构效度是最重要的效度，是效度的核心问题。","y":"判断题","p":["结构效度是最重要的效度，是效度的核心问题。"],"q":"结构效度是最重要的效度，是效度的核心问题。","w":"high","e":["2020 真题"]},{"t":"诊断测试","y":"名词解释","p":["诊断测试是为了了解受试者在学习某一具体内容或在较短的一段学习时间里所存在的问题而进行的测试。","目的是迅速直接地获得反馈信息，及时改进教学。这也是一种回顾兼预示性的测试，常常是与一具体的短期目标相联系。","学校中的小考、小测验都属于这一类。诊断测试是非正式的测试，命题、评分都比较灵活，一般也不用作衡量学生水平的主要依据。"],"q":"七、诊断测试 ⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯ (132)","w":"high","e":["2026 445 二、教育学、心理"]},{"t":"分立式测试","y":"名词解释","p":["分立式测试是对语言要素(语音、词汇、语法等)和言语技能(听、说、读、写)分别进行单项测试，如填空、完成句子、多项选择。","其理论基础是结构主义语言学。认为语言是由各种成分组成的，掌握一种语言就是掌握这些成分和技能。","分立式试题的长处在于想考什么就能考什么，受试者无法回避，而且大多采用客观试题。","缺点是只能测量各个孤立项目的知识和技能。而各个单项知识、技能之和不一定等于其总体语言能力。"],"q":"(1)分立式测试(discrete-point tests)。","w":"normal","e":[]}]}]},{"id":"yinlun-c10","t":"第十章 对外汉语教学的学科建设","w":"high","s":[{"id":"yinlun-c10-s01","t":"第一节 对外汉语教学研究方法","w":"high","n":14,"k":[{"t":"方法论","y":"名词解释","p":["方法论是在哲学层次上探讨科学方法的一般理论，是对科学方法的高度抽象与概括，研究如何把世界观的基本观点变为认识世界和改造世界的根本方法理论。","方法论一般就是指哲学方法论。","最普遍、最根本、最具有通用性的方法是哲学方法，它适用于自然科学、社会科学和思维科学，成为所有方法的基础，对其他各种方法起指导作用。","除了作为根本方法的哲学方法外，数学等横断科学作为运用于各个领域的一般方法，也起着方法论的作用，对各学科都有方法论的指导意义。"],"q":"本体系中所说的学科研究方法学，是指受哲学方法论普遍规律的指导，用来探讨对本学科最具针对性的方法论原则，并着重研究适用于本学科的一般方法，特别是本学科特有的方法。","w":"high","e":["2020 真题"]},{"t":"实验法","y":"名词解释","p":["实验法是有意识地使一个变量(自变量)发生变化，并观察对另一个变量(因变量)所产生的影响的研究方法。","实验法是国外第二语言习得和教学研究的主要方法，也一直为我国心理学和教育学研究者所使用。","实验法的关键在于：首先必须有作为实验目的的假说，并根据这一假说进行精确的实验设计；第二，在实验过程中对被试要进行随机抽样，要控制自变量，同时对非研究变量要进行控制；第三，对实验获得的数据和资料进行分析，对一些理论问题进行讨论并对假说进行检验。","实验方法是科学研究最重要、最基本的方法。"],"q":"一般的研究方法如观察法、调查法、经验总结法、文献研究法、实验法、个案研究法、相关分析法等，也是本学科通用的研究方法。","w":"high","e":["2020 真题"]},{"t":"对比分析法","y":"名词解释","p":["对比分析法是语言研究和语言教学研究最常用的方法，用来对两种或多种语言的相同和相异之点、两种或多种语言的习得或教学规律的相同和相异之点进行对比研究，以加深对所比较的事物的认识，从而发现新的特征和新的规律。","对比分析法有着广阔的天地，可以进行不同事物之间的共时横向比较，也可以进行同一事物的历时纵向比较；可以进行定量比较，也可以进行定性比较；可以进行专项比较，也可以进行综合比较。","具体地说，第一语言习得和第二语言学习的比较，第二语言学习和外语学习的比较，不同母语的学习者学习同一目的语的比较，同一语言学习者学习不同目的语的比较，不同学习策略或不同的教学方法流派的比较等等，都是很好的研究课题。"],"q":"一、对比分析的心理学基础对比分析法 (Contrastive Analysis) 由拉多 (R. Lado) 1957年提出, 其心理学基础是行为主义心理学。","w":"high","e":["2019 真题"]},{"t":"偏误分析法","y":"名词解释","p":["偏误分析已成为第二语言习得过程研究和中介语研究的最重要的方法之一。","不少对外汉语教师正在从事这方面的研究工作，成果相对说来也比较多。","现在应当对这一研究方法进行总结。要避免重复研究或是同一水平上的研究，就需要与其他的研究方法如实验法、话语分析法等相结合，开创研究的新局面。"],"q":"而对比分析法、偏误分析法、话语分析法则更带有语言教学研究的特色。","w":"high","e":["2019 真题"]},{"t":"观察法","y":"名词解释","p":["观察法是科学研究也是教育研究中最基本、最普遍的方法。","它是在自然的条件下，有目的有计划地通过观察而感知研究对象以获得实例的方法。可以作为参与者观察，也可以作为旁观者观察。","观察的范围通常是从开放式到逐步缩小、聚焦。","从事语言教学的研究者和教师正是通过课上、课下和社会实践活动，对学生或别的教师进行观察和记录。这样所获得的第一手资料，常常成为用其他方法特别是经验总结法进行研究的基础。"],"q":"一般的研究方法如观察法、调查法、经验总结法、文献研究法、实验法、个案研究法、相关分析法等，也是本学科通用的研究方法。","w":"normal","e":[]},{"t":"调查法","y":"名词解释","p":["调查法是根据一定的目的，有计划地从一定量的样本中搜集有关研究对象的资料，从而对研究对象的整体进行推断的方法。","与观察法相同之处是两者都是在自然状态中获得实例。不同之处在于调查法是一种间接的观察法，因而不受时空的限制，既可以调查现状，也可以调查历史资料，可以调查国内国外的情况，有观察法和其他方法难以达到的广度。","调查的具体方法有访谈法、问卷法和测试法等。","本学科已成功地进行过一些大型的调查项目，如《北京口语调查》(常宝儒等，1992)，《汉语中介语语料库系统》(储诚志等，1995)，《外国人学习与使用汉语情况调查研究报告》(高彦德等，1993)。"],"q":"一般的研究方法如观察法、调查法、经验总结法、文献研究法、实验法、个案研究法、相关分析法等，也是本学科通用的研究方法。","w":"normal","e":[]},{"t":"个案研究法","y":"名词解释","p":["个案研究是指对某个人或某件事等限定系统进行集中、深入、全面的研究，常用于定性研究，也用于描述性研究。","就语言教学研究来说，常常是对一个学生或教师、一个学校或团体、一门课或一个事件进行纵向的跟踪研究。","根据马克思主义哲学有关个性与共性、个别与一般的论述，典型的个案研究有助于认识同类事物的全貌。","个案研究最早用于儿童语言习得和语言人类学。有名的范例如赵元任先生50年代初发表的、对他的孙女学话过程的跟踪观察与研究。"],"q":"一般的研究方法如观察法、调查法、经验总结法、文献研究法、实验法、个案研究法、相关分析法等，也是本学科通用的研究方法。","w":"normal","e":[]},{"t":"文献研究法","y":"名词解释","p":["文献研究法是通过对文献资料的阅读、分析、研究以获取信息并得出一定结论的方法。","常用于介绍或评述某一学术问题。","文献研究法的典型例子如《第二语言习得研究的回顾与展望》(袁博平，1995)，《国外外语教学学科发展的过去和现状》(孙德坤，1994)等。"],"q":"一般的研究方法如观察法、调查法、经验总结法、文献研究法、实验法、个案研究法、相关分析法等，也是本学科通用的研究方法。","w":"normal","e":[]},{"t":"相关分析法","y":"名词解释","p":["相关分析法是对研究对象群体特征的定量分析，以研究各特征之间或多元因素之间的相互关系。","比如某变量的变化与另一变量的变化之间存在的一定的规律性。","相关分析通常研究两个或多个变量之间是否相关：是正相关还是负相关?相关程度如何?相关程度常用-1.0到+1.0的相关系数表示。多个变量之间的关系分析也称“多元回归分析”。"],"q":"一般的研究方法如观察法、调查法、经验总结法、文献研究法、实验法、个案研究法、相关分析法等，也是本学科通用的研究方法。","w":"normal","e":[]},{"t":"经验总结法","y":"名词解释","p":["经验总结法可以说是本学科用得最多的方法。","从现存的早期论文《教非汉族学生学习汉语的一些问题》(周祖谟，1953)，到文革前对外汉语教学的全面总结《15年汉语教学经验总结》(钟梫，1965)，以及近十多年来各种学术会议和期刊论文的绝大部分，都是运用经验总结的方法写成的。","这在学科发展的一定阶段是一种正常的现象。","由经验型向科学型过渡也是一般学科发展的必由之路。"],"q":"一般的研究方法如观察法、调查法、经验总结法、文献研究法、实验法、个案研究法、相关分析法等，也是本学科通用的研究方法。","w":"normal","e":[]},{"t":"话语分析法","y":"名词解释","p":["话语分析法，即对超出句子层面的语言和语言教学的研究方法。","这在语言学界和语言教学界都还是一种新的事物。它是随着对语言的语用研究、对语言习得的社会文化因素的研究以及语言教学交际性原则的研究的发展，而成为最重要的研究方法。","这也反映了对语言和语言学习的更为广阔的新视野。","话语分析法几乎能用于语言习得与教学的所有课题，并能带来“柳暗花明又一村”的境界。在对外汉语教学界，这一方法的运用几乎还未开始，特别需要做一些勇敢的探索。"],"q":"而对比分析法、偏误分析法、话语分析法则更带有语言教学研究的特色。","w":"normal","e":[]},{"t":"科学研究是一门学科赖以建立和发展的基础和动力。","y":"判断题","p":["科学研究是一门学科赖以建立和发展的基础和动力。对外汉语教学作为一门新兴学科，其理论体系还有待进一步完善。"],"q":"科学研究是一门学科赖以建立和发展的基础和动力。","w":"normal","e":[]},{"t":"把介于定性分析和定量分析之间的研究方法称为（　　）。","y":"名词解释","p":["在实际操作中人们倾向于定性分析与定量分析相结合，并把介于定性分析和定量分析之间的研究方法称为描述性研究。"],"q":"在实际操作中人们倾向于定性分析与定量分析相结合，并把介于定性分析和定量分析之间的研究方法称为描述性研究。","w":"normal","e":[]},{"t":"观察法是科学研究也是教育研究中最基本、最普遍的方法。","y":"判断题","p":["观察法是科学研究也是教育研究中最基本、最普遍的方法。它是在自然的条件下，有目的有计划地通过观察而感知研究对象以获得实例的方法。"],"q":"1. 观察法观察法是科学研究也是教育研究中最基本、最普遍的方法。","w":"normal","e":[]}]},{"id":"yinlun-c10-s02","t":"第二节 对外汉语教学学科建设的任务","w":"high","n":5,"k":[{"t":"教学法体系","y":"名词解释","p":["改革和完善教学法体系是本学科建设的三项任务之一。","中外汉语教学工作者普遍对目前汉语教学效果不满意。达到同样的程度，学习汉语所花的时间和精力往往超过学习其他第二语言。","根本原因可能还在于我们没有完全找到针对汉语特点的学习规律与教学规律，汉语作为第二语言的教学法体系还不完善，教学方法还需进一步改革。","目前我国流行的对外汉语教学模式是在80年代中期定型的，它反映的是60~70年代国际语言教学的认识水平。"],"q":"对外汉语教学发展５０年来，我们在坚持从汉语的特点出发探索汉语作为第二语言教学规律的同时，也吸取了西方教学法流派的很多长处，逐渐形成自己的教学法体系。","w":"high","e":["2018 真题"]},{"t":"教师队伍建设","y":"名词解释","p":["加强教师队伍建设是学科建设的三项任务之一。","无论是教学工作还是理论研究工作，都需要人来做。有一支能胜任教学工作、科研工作和教学科研管理工作的高素质的教师队伍，是汉语教学事业发展的最根本的条件。","目前我们的教师队伍的状况远不能适应新世纪汉语教学发展的需要。","除了通过本科和研究生的学历教育培养本专业新一代的教师外，更为重要的、切实可行的措施是在职教师的培训。当前需要大力加强对在职教师的培训。"],"q":"这些观点引发了一场关系到本学科的发展方向、影响到专业建设、课程设置、课堂教学和教师队伍建设的争论。","w":"high","e":["2020 真题"]},{"t":"加强理论研究","y":"名词解释","p":["加强理论研究是学科建设的三项任务之一。","教学体系的建立，教学效率的提高，有赖于理论的指导。加强理论研究，首先是加强汉语教学理论的研究。","除了教学理论的研究外，语言习得的研究也将是21世纪本学科理论研究的重点。","理论研究的第三个重要方面是对作为第二语言学习和教学内容的汉语的研究。"],"q":"加强理论研究、推动学科建设是一项十分紧迫的任务。","w":"high","e":["2019 真题"]},{"t":"学科建设的三项任务","y":"名词解释","p":["吕必松早在1987年就提出了本学科建设的三项任务：改革和完善教学法体系、加强理论研究和加强教师队伍的建设。","十多年来，我们在这三方面已取得了很大成绩，但显然这三项任务仍是我们今天和今后一段时期中的任务。","改革和完善教学法体系，首先必须进行教学法改革。加强理论研究，首先是加强汉语教学理论的研究。加强教师队伍建设，是整个汉语作为第二语言教学领域的当务之急。"],"q":"吕必松早在 １９８７年就提出了本学科建设的三项任务：改革和完善教学法体系、加强理论研究和加强教师队伍的建设。","w":"high","e":["2019 真题"]},{"t":"加强教师队伍建设是整个汉语作为第二语言教学领域的当务之急。","y":"判断题","p":["加强教师队伍建设是整个汉语作为第二语言教学领域的当务之急。"],"q":"加强教师队伍建设是整个汉语作为第二语言教学领域的当务之急。","w":"high","e":["2020 真题"]}]}]}]},{"d":"xdhy_up","t":"现代汉语通论（上册）","c":[{"id":"xdhy_up-c01","t":"第一章 语音","w":"high","s":[{"id":"xdhy_up-c01-s01","t":"第一节 现代汉语语音概述","w":"high","n":13,"k":[{"t":"语音","y":"名词解释","p":["由人的发音器官发出","不同的语音代表不同的意义","作用是进行社会交际，具有“社会”的属性"],"q":"在英语、德语、俄语中，清辅音与浊辅音的对立是语音的重要特点,具有区别意义的作用,如英语 beak[biːk](鸟嘴)不同于 peak[piːk](山顶)、 down[daun](向下)区别于 town[taun](城镇)，送气与否却并无别意作用；","w":"high","e":["2016 真题","2020 真题"]},{"t":"音高","y":"名词解释","p":["就是声音的高低","决定于发音体振动的频率","取决于声带紧张的程度"],"q":"教师示范: xué, xí 学生模仿: xué, xí教师再示范: xuéxí 学生再模仿: xuéxí示范正确读音时，可以夸张一点，并配合以手势，指明声调音高及其走势，或板书舌位图。","w":"high","e":["2013 真题"]},{"t":"音强","y":"名词解释","p":["就是声音的强弱","主要取决于发音体的振幅"],"q":"总之，音高、音强、音长、音色(音值)是所有发声体共有的特征，生理属性也不是人类语音独有的特征，只有它的社会属性才是人类语言独有的，是区别于其他一切声音的本质属性。","w":"high","e":["2013 真题"]},{"t":"社会属性","y":"名词解释","p":["语音最重要的特点","世界上其他任何声音所不具备","约定俗成","系统性","民族特征和地域特征"],"q":"总之，音高、音强、音长、音色(音值)是所有发声体共有的特征，生理属性也不是人类语音独有的特征，只有它的社会属性才是人类语言独有的，是区别于其他一切声音的本质属性。","w":"high","e":["2014 真题","2018 真题","2022 真题"]},{"t":"音色（音值）","y":"名词解释","p":["又叫音值","指具体发出来的音素","主要取决于发声与共鸣的形式"],"q":"刺激 问答 苏区 四十 安乐 木耳 应该 浓烈 演义璀璨 叶片 捐款 相当 进行 成功 功能 生长 交通六、请从音色(音值)特点与音节的结构关系上说明普通话i[i]、-i[1]、-i[1]3个韵母的区别。","w":"high","e":["2015 真题"]},{"t":"《汉语拼音方案》","y":"名词解释","p":["用拉丁字母拼写现代汉语普通话语音的方案","基本功能是解决汉字、词语等语言单位的规范读音与拼写","专门为普通话读音设计，只适用于普通话"],"q":"为帮助来华传教士认读汉字，以及让中国人了解西文，他在中国学者王征等人协助下，用西方语音学探讨整理汉语音韵规律而成的《西儒耳目资》(图8.14)，是一部帮助西洋人学习汉语、汉字的罗马字注音字汇，在我国音韵学史上具有开拓新领域的作用，事实上也成为我国最早的汉语拼音方案。","w":"high","e":["2011 真题","2017 真题"]},{"t":"语音的发音体是（　　）。","y":"名词解释","p":["任何声音都是由物体的振动而产生的，语音的发音体是人的声带，它与琴弦、喇叭簧片、鼓等发音体一样也是一种物质振动体，所以语音同样具备音高、音强、音长、音色(音值)四个要素。"],"q":"任何声音都是由物体的振动而产生的，语音的发音体是人的声带，它与琴弦、喇叭簧片、鼓等发音体一样也是一种物质振动体，所以语音同样具备音高、音强、音长、音色(音值)四个要素。","w":"high","e":["2012 真题","2017 真题"]},{"t":"语音共鸣腔分口腔、鼻腔与咽腔。","y":"判断题","p":["错误","共鸣器官包括喉腔、咽腔、鼻腔和口腔四部分"],"q":"2.语音共鸣腔分口腔、鼻腔与咽腔。","w":"high","e":["2013 真题"]},{"t":"人发出的所有声音是否都是语音？为什么？","y":"分析题","p":["不是所有声音都是语音","语音须具有一定意义","语音的目的是进行社会交际","没有约定俗成意义的声音不是语音"],"q":"二、人发出的所有声音是否都是语音?为什么?三、汉语拼音方案的应用领域有哪些?四、国际音标的优点有哪些?第二节 音节分析：元音和辅音","w":"high","e":["2012 真题","2012 真题"]},{"t":"在区别语义作用上，语音关注的是绝对音高。","y":"判断题","p":["错误","语音注重的是相对音高"],"q":"1.在区别语义作用上，语音关注的是绝对音高。","w":"high","e":["2010 真题","2015 真题"]},{"t":"音长","y":"名词解释","p":["就是声音的长短","决定于发音体振动持续时间的长短"],"q":"轻声在形式上主要取决于音长和音高，它与非轻声音节是对比而言的，词语中的轻声音节总处在非轻声音节的后头，音长明显短于非轻声音节，音长一缩短，原来的调值也就发生相应的变化，变为轻声特有的音高形式。","w":"normal","e":[]},{"t":"“音高”指振动体的振动频率，音长指振动体振动的幅度。","y":"判断题","p":["错误","音长取决于振动持续时间，取决于振幅的是音强"],"q":"3.“音高”指振动体的振动频率，音长指振动体振动的幅度。","w":"normal","e":[]},{"t":"语音的“音色”就像笛子与胡琴的不同，主要指声音的色彩。","y":"判断题","p":["错误","语音学上的音色指具体发出来的音素","主要取决于发声与共鸣的形式"],"q":"4.语音的“音色”就像笛子与胡琴的不同，主要指声音的色彩。","w":"normal","e":[]}]},{"id":"xdhy_up-c01-s02","t":"第二节 音节分析：元音和辅音","w":"high","n":7,"k":[{"t":"音节","y":"名词解释","p":["人们听感容易分辨出来的最小语音片断","发音肌肉经历一次从紧张到松弛的过程","听感上有一个明显的响度中心","普通话除儿化音外一个汉字读音就是一个音节"],"q":"68.4我国汉语教学主要依据以下几个词汇大纲：《汉语水平词汇与汉字等级大纲》(国家汉办，1992)， 《高等学校外国留学生汉语教学大纲(长期进修)》 (国家汉办，2002)，《汉语国际教育用音节汉字词汇等级划分》(国家汉办，2010)。","w":"high","e":["2013 真题","2019 真题"]},{"t":"元音","y":"名词解释","p":["气流振动声带","发音部位不受阻碍","又叫母音","主要功能是构成音节的韵母"],"q":"再如“来”lái由l[l]、a[a]、i[i]三个音素构成,保留声母[1]、韵尾[i]与阳平声调不变,只将主元音a[a]替换为e[e],则“雷”l éi≠“来”lái,可见普通话中的a[a]、e[e]是具有对立关系的两个音，应当划分为/a/、/e/两个不同音位。","w":"high","e":["2012 真题","2018 真题"]},{"t":"辅音","y":"名词解释","p":["气流在发音部位受到明显的阻碍","又叫子音","主要功能是担当声母或韵尾"],"q":"比如l[1]与n[n]是两个不同的辅音音素，普通话音系中的“连”li án≠“年”nián，在两个音节的比较中我们发现两者的韵母相同、声调相同，唯一不同的是|与n，所以我们判定辅音音素l、n在普通话中有区别意义的作用,所以分/l/、/n/为两个不同的音位。","w":"high","e":["2012 真题","2018 真题"]},{"t":"音素","y":"名词解释","p":["从音色（音值）角度划分","最小语音单位"],"q":"节律的体现形式是语音，但节律的语音形式不同于声母韵母等可以独立存在的音素成分，表现节律的语音形式不能单独存在，它附加于语言建筑材料之上，是对具体语言建筑材料的组合运用，以体现具体的语义、语法与语用功能。","w":"high","e":["2015 真题","2021 真题"]},{"t":"舌位","y":"名词解释","p":["舌头收紧隆起的发音部位"],"q":"教师示范: xué, xí 学生模仿: xué, xí教师再示范: xuéxí 学生再模仿: xuéxí示范正确读音时，可以夸张一点，并配合以手势，指明声调音高及其走势，或板书舌位图。","w":"high","e":["2018 真题"]},{"t":"元音发音声带一定振动；辅音发音声带一定不振动。","y":"判断题","p":["错误","辅音发音时声带不一定振动","浊辅音声带振动"],"q":"1.元音发音声带一定振动；辅音发音声带一定不振动。 ( )","w":"high","e":["2013 真题","2018 真题"]},{"t":"辅音的发音方法分塞音、塞擦音、擦音、鼻音、边音五种。","y":"判断题","p":["错误","发音方法包括成阻除阻方式、声带振动与否、气流强弱三方面","五类只是按成阻和除阻方式划分"],"q":"3.辅音的发音方法分塞音、塞擦音、擦音、鼻音、边音五种。","w":"normal","e":[]}]},{"id":"xdhy_up-c01-s03","t":"第三节 音节分析：声母和韵母","w":"high","n":10,"k":[{"t":"声母","y":"名词解释","p":["音节开头的辅音","普通话22个辅音有21个可作声母"],"q":"节律的体现形式是语音，但节律的语音形式不同于声母韵母等可以独立存在的音素成分，表现节律的语音形式不能单独存在，它附加于语言建筑材料之上，是对具体语言建筑材料的组合运用，以体现具体的语义、语法与语用功能。","w":"high","e":["2014 真题","2020 真题"]},{"t":"韵尾","y":"名词解释","p":["韵腹后的元音或辅音","位于韵母的最后","表示主要元音发音时的滑动方向或归结所在","只能由i、u(o)和n、ng 4个音素充当"],"q":"(2)即使是彼此共有的同一个音素，在不同的语音系统中的功能和地位也并不一样，如双唇鼻辅音m[m]在汉语普通话中只能充当声母而不能充当韵尾，舌根鼻音 ng[ŋ]只能充当韵尾而不能充当声母；","w":"high","e":["2014 真题"]},{"t":"韵母","y":"名词解释","p":["一个音节声母后面的部分","由元音或元音加鼻辅音构成","普通话共有39个韵母"],"q":"节律的体现形式是语音，但节律的语音形式不同于声母韵母等可以独立存在的音素成分，表现节律的语音形式不能单独存在，它附加于语言建筑材料之上，是对具体语言建筑材料的组合运用，以体现具体的语义、语法与语用功能。","w":"high","e":["2011 真题","2017 真题"]},{"t":"韵腹","y":"名词解释","p":["韵母的主干，也指主要元音","位于韵头、韵尾之间","常由a、o、e、ê充当","韵母必不可少的部分"],"q":"押韵并不一定要求韵母完全相同，通常只是韵腹或韵腹韵尾相同，如“霞”与“花”是韵腹相同而韵头不同，“狂”与“香”是韵腹韵尾相同但韵头不同。","w":"high","e":["2013 真题","2019 真题"]},{"t":"四呼","y":"名词解释","p":["开口呼、齐齿呼、合口呼、撮口呼","韵母的分类","有利于揭示声韵配合规律"],"q":"ueng[uxŋ] wēngwēng(嗡嗡) shuǐwèng(水瓮) yúwēng(渔翁)(三)四呼中国传统语音学把汉语的韵母分为四类：“开口呼”“齐齿呼”“合口呼”“撮口呼”，简称“四呼”。","w":"high","e":["2012 真题","2016 真题","2022 真题"]},{"t":"零声母","y":"名词解释","p":["没有辅音开头的音节","韵母独自形成音节","y、w不是真正的声母，而是隔音字母"],"q":"二、零声母能不能归作一个辅音音位?为什么?三、轻声能不能归纳成一个单独的调位?为什么?第七节 音 变学习要点：了解普通话常见的几种音变现象，包括轻声、儿化、连读变调、语气词“啊”的变读等，重点了解轻声、儿化的规律和作用，并能正确运用；","w":"high","e":["2016 真题","2022 真题"]},{"t":"撮口呼","y":"名词解释","p":["韵母以元音ü开头","共4个：ü、üe、üan、ün"],"q":"辅 音开 口 呼齐 齿 呼合 口 呼撮 口 呼jqx+-+gkh-+zcs-+zh ch sh r-+上表说明j、q、x这一组辅音跟g、k、h和z、c、s以及 zh、 ch、 sh这三套辅音都形成互补,从理论上讲,j、q、x跟g、k、h或z、c、s或 zh、ch、sh都可以归并为一套音位。","w":"high","e":["2025 真题"]},{"t":"呼读音","y":"名词解释","p":["在声母后边加上一个元音","已组成一个音节","方便不同声母的称读"],"q":"一、普通话的声母(一)声母的本音与呼读音声母是指音节开头的辅音。","w":"high","e":["2015 真题","2021 真题"]},{"t":"韵头（介音）","y":"名词解释","p":["韵腹前的元音","又叫介音","只有i、u、ü3个元音可以充当"],"q":"声母、韵母两者处于同一层面，是相互拼合的关系，韵母结构又分韵头(介音)、韵腹(主要元音)、韵尾三部分。","w":"high","e":["2015 真题","2021 真题"]},{"t":"所有的单元音都可以直接作韵母。","y":"判断题","p":["错误","舌尖元音不能单独成音节"],"q":"2.所有的单元音都可以直接作韵母。","w":"normal","e":[]}]},{"id":"xdhy_up-c01-s04","t":"第四节 普通话声调","w":"high","n":6,"k":[{"t":"声调","y":"名词解释","p":["音节读音的高低升降","区别意义的重要手段","汉语区别于其他语言的重要特征之一"],"q":"这些单音词又分属平、上、去、入四个古调(今天归入阴平、阳平、 上声、去声四个声调)，而同类性质的单音词，又往往分属平、仄二调,如天(平)、地(仄),来(平)、去(仄),男(平)、女(仄),多(平)、少(仄), 先(平)、后(仄), 山(平)、水(仄), 这些单音节排列起来，最能体现工整对仗、抑扬顿挫的特点，很符合中国人的审美需求。","w":"high","e":["2013 真题","2019 真题"]},{"t":"调值","y":"名词解释","p":["音节读音高低、升降、曲折、长短的具体变化值"],"q":"陈默、王建勤 (2010) 考察了不同母语背景的汉语学习者双字组声调发展情况，发现学习者在学习初期，五项声调特征(调值、调形、调长、调强、调域)的得分呈现出五种类型：直线型，下降型，上升型，U型和倒U型。","w":"high","e":["2014 真题","2020 真题"]},{"t":"调号","y":"名词解释","p":["声调的标志符号","把五度标调法图形简化","“-、ˊ、ˇ、`”分别表示阴平、阳平、上声、去声"],"q":"汉 字拼 音声 母韵 头韵 腹韵尾调类调值调型调号四呼远yuǎn窄zhǎi伟wěi英yīng凉liáng日rì军jūn困","w":"high","e":["2013 真题","2017 真题","2023 真题"]},{"t":"调型","y":"名词解释","p":["声调高低、升降的变化模式","55高平、35高升、214曲折、51全降"],"q":"如泰语有五个声调 (一声 [33]、二声 [21]、三声 [41]、四声 [45]、五声 [114]),汉语的阴平、阳平、去声在泰语里都有相同、相似的调型。","w":"high","e":["2017 真题"]},{"t":"调类","y":"名词解释","p":["声调的类别","把调值相同的音节归在一起","根据区别意义的不同声调调值建立","有多少个不同调值就有多少个调类"],"q":"汉 字拼 音声 母韵 头韵 腹韵尾调类调值调型调号四呼远yuǎn窄zhǎi伟wěi英yīng凉liáng日rì军jūn困","w":"high","e":["2015 真题","2021 真题"]},{"t":"五度标调法","y":"名词解释","p":["赵元任设计","用从1到5的5度竖轴表示相对音高","1最低、2次低、3中高、4次高、5最高"],"q":"对具体调值的确定，我们通常采用赵元任设计的“五度标调法”，方法是建立一个坐标，用从1到5的5度竖轴表示相对音高，用横轴表示音长。","w":"high","e":["2013 真题","2020 真题"]}]},{"id":"xdhy_up-c01-s05","t":"第二章 元音","w":"normal","n":0,"k":[]}]},{"id":"xdhy_up-c02","t":"第二章 汉字","w":"high","s":[{"id":"xdhy_up-c02-s01","t":"第一节 现代汉字概述","w":"high","n":20,"k":[{"t":"汉字","y":"名词解释","p":["汉字是汉民族在长期的劳动生产和社会实践中为适应交际需要而独立创造出来的书面交际工具。","汉字是一种重要而独特的文字系统，在记录语言的方法、造字的方式、字形的结构、字体的呈现等诸方面都有鲜明的特点。","汉字是世界上历史最悠久的一种独立发展的文字，曾形成“汉字文化圈”。"],"q":"二、记忆与第二语言学习心理学不仅阐述了有关语言的生理一心理基础，而且在语言学习理论、第一语言和第二语言学习、第二语言从感知·理解到记忆·表达的过程、第二语言语音·词汇·语法·汉字的学习心理以及学习者的个体因素等方面，都为本学科提供了坚实的理论依据。","w":"high","e":["2016 真题"]},{"t":"象形","y":"名词解释","p":["用线条描画出事物的形象，其字形与字义的联系比较具体、紧密。","这类字大多表示自然界和日常生活中的实物。","许多事物用几根线条很难画出，所以用这种方法造出来的字并不多。","由于字形历史演变等原因，这类字的形体象形意味现在大为减弱，不少已经失去了跟字义的直接联系，有些还变成了记号。"],"q":"他在《古画品录》里说，所谓“六法”，第一是“气韵生动”，第二是“骨法用笔”，第三是“应物象形”，第四是“随类赋彩”，第五是“经营位置”，第六是“传移模写”。","w":"high","e":["2012 真题"]},{"t":"字体","y":"名词解释","p":["字体指的是同一种文字的各种不同体式。","例如汉字的楷书、行书、草书，印刷的宋体、仿宋体、楷体、黑体等。","至于书法艺术上的种种字体，例如欧体、颜体、柳体，指的是书法的派别，又称“书体”，不属于严格文字学的范围。"],"q":"可是，随着印刷技术的进步和文化事业的发展，图书典籍不断增加，不同时间、不同地点、不同纸张、不同字体印刷的同一种书大量出现，于是版本的含义发生了很大的变化，其内容包括了书籍抄印的时代源流、纸墨刀法、装帧形式以及书籍的优劣等。","w":"high","e":["2013 真题","2019 真题"]},{"t":"会意","y":"名词解释","p":["用两个或几个物体的图形的组合产生字义。","会意字是在象形字基础上创造的，所表示的字义可从几个象形字组合的关系上显示出来，所以能把没法直接描画的一些动作、状态表示出来。","这种造字方法，现在仍在少量地应用。"],"q":"远景动机则是与长远目标特别是有社会意义的目标相联系，如有的中学生学习第二语言是为了立志将来当翻译家或外交家，或者为国家、为学术界做出某项贡献，这类动机有较深的思想基础，比较稳固，在较长的时间里发挥作用。","w":"high","e":["2014 真题"]},{"t":"六书","y":"名词解释","p":["“六书”是指象形、指事、会意、形声、假借、转注。","目前主流看法认为假借、转注是用字手段，象形、指事、会意、形声才是造字方法。","造字法，通常采用传统的“六书”来分析。"],"q":"无论是介绍汉字特点、汉字演变、汉字结构规律，或是对音符、意符进行解释，作为正式教学，都应当以传统的字源学特别是“六书”理论为依据，以保证汉字教学的科学性。","w":"high","e":["2011 真题","2017 真题","2017 真题","2023 真题"]},{"t":"形声","y":"名词解释","p":["由形旁与声旁组成，形旁表示大致的字义或字义的类属，声旁提示字的读音或近似的读音。","形声法是汉字最主要的造字方法。","形声法综合利用字形表义和字形表音这两种手段。"],"q":"多数形声字由一个形旁和一个声旁组成，例如“根”“柱”“梢”“杖”的形旁都是“木”，而声旁分别为“艮”“主”“肖”“丈”。","w":"high","e":["2011 真题","2016 真题","2020 真题","2016 真题"]},{"t":"隶变","y":"名词解释","p":["由甲骨文、金文发展到小篆，是一个简化的过程。小篆又简化为隶书，隶书又简化为草书和楷书，楷书又跟草书结合为行书。","隶变在字体演变史上的地位最为重要，它是古今汉字的分水岭。","汉字字体演变的总趋势是由繁难变为简易。"],"q":"其中，隶变在字体演变史上的地位最为重要，它是古今汉字的分水岭。","w":"high","e":["2015 真题","2021 真题","2015 真题","2024 真题"]},{"t":"现代汉字","y":"名词解释","p":["现代汉字指现阶段正在使用的汉字，它记录的主要对象是现代汉语，与传统汉字相对应。","判断一种文字符号体系的性质，首要的是研究这种文字与它所记录的语言之间的关系。","考察现代汉字的特点，还必须跟拼音文字符号体系进行比较。"],"q":"丑(醜): 龟(龜):专(專): 学(學):第七节 现代汉字的信息处理79长(長): 泪(涙):谷(穀): 书(書):","w":"high","e":["2013 真题","2019 真题"]},{"t":"多部件字","y":"名词解释","p":["多部件字主要有三类：合成意符字、意符音符字、合成记号字。","合成意符字由两个或两个以上意符构成，从现代汉字字形看，可以说是合字表义。","意符音符字由意符和音符构成，从意符可以大致知道字义的类别，从音符可以大致读出字音。","合成记号字组合成字的部件都是既不表示字音又不表示字义的记号。"],"q":"根据现代汉字构字部件的数量，可以把现代汉字字形分为单部件字和多部件字两大类。","w":"high","e":["2017 真题"]},{"t":"意音文字","y":"名词解释","p":["汉字记录汉语则兼用三种方法，即从义入手、从音入手或同时从音义入手。","汉字是一种兼顾意音的文字，可以简称为“意音文字”。","汉字绝大多数都是兼用表音和表义的方法，所以形声字约占全部汉字的90%左右。","现代汉字的意符和音符所起的表义标音作用已经有限。"],"q":"对世界上大多数使用拼音文字的学习者来说，像汉字这种意音文字，即每个方块字基本上记录一个单音节语素的文字，是一套完全陌生的书写符号系统，难认、难记、难写。","w":"high","e":["2015 真题"]},{"t":"语素文字","y":"名词解释","p":["从汉字符号记录语言的单位来看，现代汉字是一种语素文字。","表音文字根据文字所记录的语言单位的不同，可以分为音素文字和音节文字两种类型。","汉字在记录语言时，利用了语素音义兼顾的特点，用能产性极强的形声字分别记录语素意义所属的类别和语素的音节。"],"q":"这是由于由笔画组成的方块汉字是记录语素的语素文字，是与世界上大多数民族使用的、以记录音素的字母拼写的拼音文字根本不同的文字系统。","w":"high","e":["2018 真题"]},{"t":"现代汉字是一种（　）。","y":"名词解释","p":["现代汉字是兼表意音的语素文字"],"q":"(一)现代汉字是一种意音文字语言是音义的结合体。","w":"high","e":["2016 真题"]},{"t":"楷书","y":"名词解释","p":["楷书是现代通行的汉字手写正体字，也叫正楷。“楷”是楷模、法式的意思。","楷书笔画分明，笔形规整，结构端庄，字形方正，是汉字的标准字体。","现代汉字手写体主要有楷书、草书、行书等三种。"],"q":"三、 石鼓文汉字的演变是由甲骨文到金文，由金文到篆书，由篆书到隶书，然后才是现在使用的行书和楷书。","w":"high","e":["教材高频"]},{"t":"指事","y":"名词解释","p":["用抽象符号来提示字义。","这类字可以分两种：1.纯符号的；2.在具体事物的图形上添加抽象符号。","这种方法造的汉字局限性很大，所以字数极少，纯符号的指事字更少。"],"q":"(四)补充论元释义法通过补充与被解释词所指事物、行为和形状等有关的主体、对象、原因、目的、工具、方式、处所、领域等语义信息来释义的方法。","w":"high","e":["教材高频"]},{"t":"记号","y":"名词解释","p":["凡是跟整字在意义和读音上都没有联系的部件，称为“记号”。","单部件字有：意符字和记号字；多部件字主要有三类：合成意符字、意符音符字、合成记号字。","组合成字的部件都是既不表示字音又不表示字义的记号。"],"q":"就字形而言，尽管汉字有较强的表意功能(形声字能表示一定的意义类别)，但由于几千年的形体变化，大都很难直接以象形表意来识记，已经只是一种记号。","w":"high","e":["教材高频"]},{"t":"音符","y":"名词解释","p":["凡是跟整字在读音上有联系的部件，称为“音符”。","汉字的音符，也叫声旁，同表音文字的音符有很大的区别。","前者是非专职的，是借用本来既有音又有义的现成字符充当的，而后者则是专职的。","现代汉字中音符的数量很多，超过一千个。"],"q":"此后又产生了一套“注音字母”，这套方案虽克服了“直音”“读若”的某些缺点，但因不是音素标音，也没采用拉丁字母符号，仍不能准确地反映规范语音的面貌，也无法与国际通用的拼音符号接轨，因此《汉语拼音方案》的诞生就成了势在必行。","w":"high","e":["教材高频"]},{"t":"意符","y":"名词解释","p":["凡是跟整字在意义上有联系的部件，称为“意符”。","对现代汉字构形成分进行分析，得到的是构字部件；构字部件的属性，指的是部件跟整字在音义上的关系，这可以分为三类：意符、音符和记号。","汉字的意符，也叫形旁，在传递语义信息上的功能，是单纯的表音文字所不具备的。"],"q":"就字义而言，汉字虽有一套约定俗成的意符系统但不严密，有些意符的形义关系今天已模糊，而且一字多义的现象十分普遍。","w":"high","e":["教材高频"]},{"t":"方块字","y":"名词解释","p":["汉字是一种平面性文字，它的构成成分是从横和纵展开，形成平面布局。","在一个平面内，不管有多少个构成成分都要均衡地分布在方方正正的框架里，呈现为方块形式，所以汉字又叫作“方块字”。","汉字从隶书发展为楷书，形象性减弱，符号性加强。"],"q":"发展成今天独具特色的方块字，并不是一种随意性的结果，它是跟中国人重实际、多想象、包容万物的那种实用理性思维和天人合一、物我一体的精神密切相关的。从汉字的构成来看，六书中的象形、指事、会意、形声属于造字法，而","w":"high","e":["教材高频"]},{"t":"单部件字","y":"名词解释","p":["根据现代汉字构字部件的数量，可以把现代汉字字形分为单部件字和多部件字两大类；单部件字有：意符字和记号字。","由一个意符单独构成，从现代汉字的字形上就可以大致读出字义，这是意符字。","由一个记号单独构成，从现代汉字的字形上，既不能知道读音，也不能读出字义，这是记号字。"],"q":"根据现代汉字构字部件的数量，可以把现代汉字字形分为单部件字和多部件字两大类。","w":"high","e":["教材高频"]},{"t":"《说文解字》里形声字已占（　）。","y":"名词解释","p":["《说文解字》里形声字已占82%"],"q":"在《说文解字》里，形声字已占82%。","w":"normal","e":[]}]},{"id":"xdhy_up-c02-s02","t":"第二节 现代汉字的字形","w":"high","n":11,"k":[{"t":"笔画","y":"名词解释","p":["笔画是构成楷书字形的最小单位。","就书写过程而言，笔画是有起止的线条，从落笔到下一次提笔的过程中写出的点和线就叫一笔或一画。","在不同的字体中，笔画的表现形式可能不完全相同。","这里所说的笔画是以印刷体的主流字体宋体、楷体作为分析对象的。"],"q":"此外, 1985 年到1986年, 考古工作者在西安市长安区境内发现了一处龙山文化时期的原始社会村落遗址，出土了十多块兽骨，上面刻有用各种笔画组成的单体符号文字，经专家们研究、辨认，已认出 甲骨文“人” “羊” “三” “退” “万”等字。","w":"high","e":["2012 真题","2018 真题"]},{"t":"部首","y":"名词解释","p":["“部首”是指可以成批构字的一部分部件。含有同一部件的字，在“字集”中均排列在一起，该部件作为领头单位排在开头，成为查字的依据。","部首一般包括两类：一是形旁，例如“栋”“梁”的部首都是“木”；二是某些笔画，例如“头”的第一笔“、”就是部首。","《说文解字》的部首是540个，《现代汉语词典》（第6版）的部首是201个。"],"q":"4.《说文解字》把9353个汉字归为 部，《字汇》和《康熙字典》把部首归并为 部，《新华字典》和新《辞海》分别把部首定为 部和 部，而《汉语大字典》又把部首定为 部。","w":"high","e":["2014 真题","2021 真题"]},{"t":"部件","y":"名词解释","p":["部件是由笔画组成的、能独立运用的、具有组配汉字功能的构字单位。","部件也可以看作是对整字进行一次或几次切分后得出来的构字单位。","大多数部件是由一些笔画组合成的“构件”，它们可以独立运用；有少数部件本身就是一个字；也有少数部件本身就是一个笔画。"],"q":"三、汉字教学中的几个顺序关系 ⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯ (334)四、以部件为中心的汉字教学 ⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯ (335)","w":"high","e":["2013 真题","2019 真题"]},{"t":"偏旁","y":"名词解释","p":["偏旁就是用二分法对合体字进行一次性切分而获得的结构单位，可分为“形旁”和“声旁”两类。","形旁通常表示该字的意义类别，声旁通常表示该字的大致读音。","多数形声字由一个形旁和一个声旁组成；会意字的两个偏旁都属于形旁。","通用汉字的偏旁约有1500个。"],"q":"1964年，有关部门根据推行的实际情况，并加上了遵照国家规定用简化字和简化偏旁作为构字偏旁得出来的简化字，重新整理、编制了《简化字总表》，于1964年5月出版发行。","w":"high","e":["2012 真题","2018 真题"]},{"t":"笔顺","y":"名词解释","p":["书写汉字时笔画的走向和次序叫作笔顺。","笔顺包括两方面内容：一是笔画的走向，也有人称“笔势”，例如横（一）是从左到右，竖（丨）是从上到下；二是笔画出现的先后次序，也有人称“笔序”。","笔势和笔序合起来称为笔顺。"],"q":"这些信息包括每个字的序号、读音、笔画数、部件数、部首、部首笔画数、部首外笔画数、部首序号、笔顺、笔顺编号、结构方式、异体字、繁体字、旧字形、字频、国际码、电报码、四角号码等。","w":"high","e":["2014 真题","2020 真题"]},{"t":"合体字","y":"名词解释","p":["合体字是由两个或两个以上部件组合而成的汉字。","象形字、指事字一般属于独体字，会意字、形声字通常属于合体字。","独体和合体在汉字形体演变过程中会互变。"],"q":"(二) 关于汉字的知识首先是汉字构形知识，主要包括汉字的基本构成要素(笔画、部件、偏旁等) 和结构方式(独体、合体以及合体字的结构方式)。","w":"high","e":["2015 真题"]},{"t":"独体字","y":"名词解释","p":["独体字是指无法分离出两个或两个以上部件的汉字。","有些字笔画相交，结构呈镶嵌式，即使笔画很多，由于从字形上不能分解出相离的部件，因而也是独体字；有些字分解后就是相离而又对称或平行的笔画，这类字也宜看作独体字。","独体字在现代汉字中约占3%——5%，绝对数量为三百上下，它们是构成现代汉字字形的基础。"],"q":"具体的实施在教学中可以表现为：从意义和笔画都简单的常用独体字开始教学 (人、山、口、小、大等)，接着教笔画相对复杂难写的独体字 (水、气、马、身、我等)，然后教结构和笔画都比较简单的合体字 (左右结构：体、好、休、明；","w":"high","e":["2013 真题","2019 真题"]},{"t":"部位","y":"名词解释","p":["要确定部件的名称，还要给汉字字形结构的各个位置定名，这就叫部位。可以分为八类。","八类部位可以编成16字口诀：上“头”下“底”，左“旁”右“边”，内“心”外“框”，中“腰”四“角”。","使用统一规范的部件和部位名称，可以把一个结构复杂的汉字称说得既准确又清楚，这就叫“部件识字法”。"],"q":"它把人体的生理机能看作一个整体，进而把人体的生理机能与自然环境看作一个整体，把治病过程看作一个统一性运动，认为人体各部位器官的功能休戚与共，认为自然环境影响人体的生理功能，人的病理过程实际上就是外在环境作用于内部机体的过程，是一个由表及里、由虚到实的过程。","w":"high","e":["教材高频"]},{"t":"笔形","y":"名词解释","p":["依据笔势和走向，现代汉字的笔画可以有31种不同的形式，笔画的形式简称为笔形。","现代汉字的笔形可以有概括的和细致的两种分类法：概括的分类法把笔形分为八类或五类；细致的分类法先把笔形分为基本笔形和派生笔形（也称复合笔形）两个大类。","书写时，笔画的方向自始至终没有变化的笔形是基本笔形，笔画的方向有所变化的是派生笔形。"],"q":"7.汉字序列法中的 ()又分部首法、笔画法和笔形法、A 音序法 D 形序法C 义序法 D 音义法","w":"high","e":["教材高频"]},{"t":"基础部件","y":"名词解释","p":["最小的不再拆分的部件叫基础部件，又叫单纯部件；由于基础部件总是处在组字的最低层次，所以又称末级部件。","由两个和两个以上基础部件组成的部件叫合成部件。"],"q":"(3)基础部件/合成部件：最小的不再拆分的部件叫基础部件，又叫单纯部件；","w":"high","e":["教材高频"]},{"t":"独体字是______，合体字是______。","y":"填空题","p":["独体字：无法分离出两个或两个以上部件","合体字：由两个或两个以上部件组合而成"],"q":"4.独体字是 ，合体字是 。","w":"normal","e":[]}]},{"id":"xdhy_up-c02-s03","t":"第三节 现代汉字的字音","w":"high","n":4,"k":[{"t":"多音字","y":"名词解释","p":["所谓多音字，是指一个汉字可以有两个或两个以上的读音。","同一个汉字可以有不止一个读音，同一个读音也可以由多个字形共同拥有。","现代汉字中许多字只有一个读音，例如《汉字信息字典》所收7785个字中，单音字共7038个，占90%，而另外10%的字则是多音字。"],"q":"现代汉字中许多字只有一个读音，例如《汉字信息字典》所收7785个字中，单音字共7038个，占90%，而另外10%的字则是多音字。","w":"high","e":["2011 真题","2017 真题"]},{"t":"全表音声旁","y":"名词解释","p":["严格的标准是：声旁必须和整字的声母、韵母、声调全部相同。这种声旁就叫“全表音声旁”。","统计结果，字音与声旁的声、韵、调全部相同的只占26.3%。","宽松的标准是：把部首以外的另外半边一概看作声旁，只要声母、韵母相同就看作有表音功能，这样统计的结果，现代汉字声旁的有效表音率也只占39%。"],"q":"这种声旁就叫“全表音声旁”。","w":"high","e":["2018 真题"]},{"t":"儿化音节","y":"名词解释","p":["现代汉语书面语中还有少量用两个汉字记录一个音节的，例如“花儿”（huār）、“画儿”（huàr）等，这类音节在汉语中称为儿化音节，是在一个音节的末尾附加卷舌动作。","这个卷舌动作发出的音并不构成一个独立完整的音节。","一个汉字记录的语音单位基本上是一个音节。"],"q":"这类音节在汉语中称为儿化音节，是在一个音节的末尾附加卷舌动作。","w":"high","e":["教材高频"]},{"t":"如何充分发挥形声字声旁的积极作用？","y":"简答题","p":["利用声旁类推，帮助记忆成组字音","利用声旁认读生僻字","利用声旁分辨字形","充分利用形声字的系统性"],"q":"三、结合实例说明如何充分发挥形声字声旁的积极作用。","w":"normal","e":[]}]},{"id":"xdhy_up-c02-s04","t":"第四节 现代汉字的字义","w":"high","n":3,"k":[{"t":"字义","y":"名词解释","p":["汉字字形跟字义的关系大致有三类：1.字形记录的是词义；2.字形记录的是语素义；3.字形记录的仅仅是一个音节，它没有字义。","一个汉字在多数情况下，记录的是现代汉语的一个语素。字义也就是语素义。","现代汉字中也有少数用会意法造出来的字还是可以直接从字形推知字义的。"],"q":"4.简化字与繁体字对应问题据统计，《简化字总表》的2235个简化字，在简繁转换中有95.5%是一对一的关系，就是一个简化字形只对应一个繁体字形，简体和繁体的字音、字义都相同。","w":"high","e":["2015 真题"]},{"t":"形旁表义","y":"名词解释","p":["在形声字中，形旁主要提示跟字义有一定联系的信息。形声字的形旁和整字字义的关系有以下几种：(1)形旁完全表义；(2)形旁基本表义；(3)形旁不表义。","形旁基本表义可分为三种：形旁表示字义的大致类别；形旁与字义直接相关；形旁与字义间接有关。","在现代汉字中，表义部件的主要作用有二：一是提示，二是区别。","形旁的总体表义率为43.79%。"],"q":"最后讲到“节”(作为量词)，像这样的汉字本义已经十分遥远的字，就没有必要再分析形旁的表义性，可以把该字作为形旁表义性丧失的例子，让学生认识到形旁表义的局限性。","w":"high","e":["2013 真题","2020 真题"]},{"t":"形旁的总体表义率为（　）。","y":"名词解释","p":["形旁的总体表义率为43.79%"],"q":"形旁的总体表义率为43.79%。","w":"normal","e":[]}]},{"id":"xdhy_up-c02-s05","t":"第五节 现代汉字形音义的关系","w":"high","n":8,"k":[{"t":"同音字","y":"名词解释","p":["同音字是指两个或两个以上的汉字，读音相同、意义不同而且意义没有联系。","同音字按字形是否相同可以分为同形同音异义字和异形同音异义字两类。","狭义的同音字只指同形同音异义字；广义的同音字，除了同形同音字之外，还包括了异形同音字。"],"q":"四、有人认为汉字数量太多了，不利于学习和使用，所以建议3500个常用字之外的汉字全部淘汰，用同音字来替代，你以为这个办法是否可行?","w":"high","e":["2014 真题","2021 真题"]},{"t":"近形字","y":"名词解释","p":["近形字也称形近字，是指字形相近而音、义有别的字。","近形字会给汉字的使用带来种种不便。","近形字的差异大体表现在以下四个方面：1.笔画数的微小差异；2.个别笔形的差异；3.笔画组合关系的差异；4.构字部件有局部差异。"],"q":"学习要点：了解近形字、同音字、多音字、多义字与多音多义字的特点，并能够鉴别和分析。","w":"high","e":["2011 真题","2018 真题"]},{"t":"多音多义字","y":"名词解释","p":["多音多义字：即一形对数音数义。","所谓多音多义字就是同一个字形却记录不同的读音和不同的字义。","有人统计，在1988年发布的《现代汉语常用字表》3500个常用字中，有多音多义字405个，占总数的11.6%。","多音字节省了造字数量，但同时带来一字异读的麻烦。"],"q":"学习要点：了解近形字、同音字、多音字、多义字与多音多义字的特点，并能够鉴别和分析。","w":"high","e":["2012 真题","2019 真题"]},{"t":"现代汉字形音义的关系","y":"名词解释","p":["字形是文字的物质外壳，是文字层面上的要素；字音和字义是文字所记录语言的音和义，是语言层面上的要素。","字形与字音以及字义这三者之间形成了错综复杂的关系。","现代汉字学的术语中，例如“多音多义字、同音字、异读字、异体字、繁简字、同形字”等，它们的内涵有一些交叉或重叠，这是因为给这些名称命名时的出发点不同。"],"q":"第五节 现代汉字形音义的关系","w":"high","e":["2014 真题"]},{"t":"异体字","y":"名词解释","p":["异体字（也叫异形字）：即数形对一音一义。不同字形之间没有任何音义差别。","经过整理，规定正体字，淘汰异体字形。","异体字指音义都相同仅形不同的字。"],"q":"现代汉字学的术语中，例如“多音多义字、同音字、异读字、异体字、繁简字、同形字”等，它们的内涵有一些交叉或重叠，这是因为给这些名称命名时的出发点不同，但不管从哪一方面着眼，实际上都必须考虑到字形、字音、字义这三个方面。","w":"high","e":["教材高频"]},{"t":"繁简字","y":"名词解释","p":["繁简字：即一为笔画比较多的字，一为笔画比较少的字，字音和字义都相同。","《简化字总表》的2235个简化字，在简繁转换中有95.5%是一对一的关系。","“简体字”则有特定的含义，指由国家明文规定取代繁体字而推广使用的简体字。"],"q":"现代汉字学的术语中，例如“多音多义字、同音字、异读字、异体字、繁简字、同形字”等，它们的内涵有一些交叉或重叠，这是因为给这些名称命名时的出发点不同，但不管从哪一方面着眼，实际上都必须考虑到字形、字音、字义这三个方面。","w":"high","e":["教材高频"]},{"t":"异读字","y":"名词解释","p":["异读字：即一形对数音一义。不同读音之间一般没有语义差别，仅仅是不同的人、不同的习惯读法。","异读字原则上应该统读。少数文白异读，目前还保留着。","异读字即多音同形同义字。"],"q":"现代汉字学的术语中，例如“多音多义字、同音字、异读字、异体字、繁简字、同形字”等，它们的内涵有一些交叉或重叠，这是因为给这些名称命名时的出发点不同，但不管从哪一方面着眼，实际上都必须考虑到字形、字音、字义这三个方面。","w":"high","e":["教材高频"]},{"t":"单音单义字","y":"名词解释","p":["单音单义字：即一形对一音一义。这样的字多半不是常用字，而是专用字或较冷僻的字。","现代汉字中许多字只有一个读音。","《汉字信息字典》所收7785个字中，单音字共7038个，占90%。"],"q":"(1)单音单义字：即一形对一音一义。","w":"high","e":["教材高频"]}]},{"id":"xdhy_up-c02-s06","t":"第六节 现代汉字的规范","w":"high","n":20,"k":[{"t":"字序","y":"名词解释","p":["字序就是汉字排列的先后顺序。","汉字字序的复杂性表现为汉字的排序具有多样性和互补性的特点。","汉字序列法主要有两种：音序法、形序法，形序法又分部首法、笔画法和笔形法。"],"q":"2.汉字部分，基本上采用全新的框架，即以现代汉字为分析的唯一对象，加强现代汉字的字形、字音、字义、字序、字量的分析，突出现代汉字的标准化、规范化以及信息化处理。","w":"high","e":["2012 真题","2019 真题"]},{"t":"四定","y":"名词解释","p":["现代汉字规范主要表现在定量、定形、定音和定序上，俗称“四定”。","2001年1月1日起施行的《中华人民共和国国家通用语言文字法》明确规定：“国家推广普通话，推行规范汉字。”"],"q":"”现代汉字规范主要表现在定量、定形、定音和定序上，俗称“四定”。","w":"high","e":["2013 真题","2020 真题"]},{"t":"简化字","y":"名词解释","p":["简化字专指政府有关部门公布的规范的简体字。","“简体字”则有特定的含义，指由国家明文规定取代繁体字而推广使用的简体字。","1956年1月，国务院通过并发布了《汉字简化方案》；1964年重新整理、编制了《简化字总表》；1986年10月重新发表《简化字总表》，共收录简化字2235个。","同一个字有几个形体，笔画比较多的叫繁体字，笔画比较少的叫简体字。"],"q":"中华人民共和国成立后，为了推动文字改革，曾设立了中国文字改革委员会(即今国家语言文字工作委员会)，随后即公布了《第一批异体字整理表》《汉字简化方案》《简化字总表》，研究和制定了《汉语拼音方案》。","w":"high","e":["2014 真题","2021 真题"]},{"t":"常用字","y":"名词解释","p":["常用字就是书写现代汉语时经常要用到的字。","汉字总字数很多，通用字的数量也不少，可是人们经常使用的字量并不多，往往只集中在有限的两三千个字种上。","现代汉语常用字的特点：常用性、能产性、稳定性、简易性。"],"q":"与此同时，汉字的字义经过假借(常用读音相同的字形记录跟这个字形毫无联系的字义)、引申(同一字形增加跟原始本义有联系的字义)等发展途径，有些初始义变为罕用义甚至消退了，字形跟常用字义的表达关系模糊了。","w":"high","e":["2015 真题","2022 真题"]},{"t":"部首法","y":"名词解释","p":["部首法是东汉许慎在《说文解字》中首创的。","《说文解字》把汉字按其来源分为540部，每部把共同傍从的形旁字列在开头，称为部首。","部首法自创立以后千百年来一直为编纂字书的人所采用，只是分部的多少和字的归部原则有所不同。","语文学界把214部的部首系统称为“传统部首”，而把改变214部的现代各种部首系统称为“改良部首”。"],"q":"7.汉字序列法中的 ()又分部首法、笔画法和笔形法、A 音序法 D 形序法C 义序法 D 音义法","w":"high","e":["2013 真题","2020 真题"]},{"t":"规范汉字","y":"名词解释","p":["“规范汉字”指经过系统整理、由国家发布、通行于大陆现代社会一般应用领域的标准汉字。","“经过系统整理”保证了科学性，“由国家发布”标明权威性，“通行于大陆”确定地域性，“通行于现代社会”指明时代性，“通行于一般应用领域”明确使用层面。"],"q":"汉语音节数量是有限的，《新华字典》(第11版)“汉语拼音音节索引”收录不标声调的音节416个，《现代汉语词典》(第6版)“音节表”收录标声调的音节1282个，而汉字的数量则大得多，仅《通用规范汉字表》就收录8105个汉字，其中读为yì音节的就有“弋、亿、义、艺”等73个汉字。","w":"high","e":["2019 真题"]},{"t":"《通用规范汉字表》","y":"名词解释","p":["《通用规范汉字表》于2013年6月5日由国务院发布。","《通用规范汉字表》收字8105个，分为三级。","该表发布后，社会一般应用领域的汉字使用应以此表为准，原有相关字表全部停止使用。","一级字表共收3500字，是使用频度最高的常用字集；二级字表共收3000字；一、二级字表合计6500字；三级字表收字1605个。","总体特点：整合多个规范，调适内部矛盾；照顾不同需要，科学划分字级；预测信息储备需要，增加特殊领域用字；促进海峡两岸信息互通，分解简繁对应关系。"],"q":"汉语音节数量是有限的，《新华字典》(第11版)“汉语拼音音节索引”收录不标声调的音节416个，《现代汉语词典》(第6版)“音节表”收录标声调的音节1282个，而汉字的数量则大得多，仅《通用规范汉字表》就收录8105个汉字，其中读为yì音节的就有“弋、亿、义、艺”等73个汉字。","w":"high","e":["2016 真题","2021 真题"]},{"t":"汉字字序的复杂性表现在哪些方面？","y":"简答题","p":["排序的多样性：有形序法、音序法、义序法","排序的互补性：各成系统又互为补充","必须同时运用几种序列法，分层次地处理"],"q":"9.汉字字序的复杂性表现在哪些方面?思考题一、台湾省、香港特区、澳门特区以及海外部分地区还在使用繁体字和一部分异体字。","w":"high","e":["2012 真题","2019 真题"]},{"t":"《通用规范汉字表》共收二级字（　）。","y":"名词解释","p":["《通用规范汉字表》二级字表共收3000字"],"q":"1.《通用规范汉字表》共收二级字(1)6196个 (2)3500个 (3)7000个 (4)3000个。","w":"high","e":["2021 真题"]},{"t":"20世纪50年代以来，主要通过哪几条途径来精简汉字的字数？","y":"简答题","p":["淘汰异体字（《第一批异体字整理表》淘汰1053个）","更改地名生僻字（精简15个地名字）","统一计量单位名称用字（精简20个字）","通用层面被精简的汉字总数达上千个"],"q":"4.20世纪50年代以来，主要通过哪几条途径来精简汉字的字数?","w":"high","e":["2014 真题","2021 真题"]},{"t":"定音","y":"名词解释","p":["定音就是确定现代汉字的规范字音。","《汉语拼音方案》（1958）确定了普通话的声、韵、调系统。","《普通话异读词审音表》（1985年修订稿）对一千多条异读词作了审订和修订，为字音的标准化打下了基础。"],"q":"这一律制早在春秋战国时代已经形成，之后历代以此固定音高，形成各种不同的调式，如同现在的C 大调、D大调等。","w":"high","e":["教材高频"]},{"t":"字种","y":"名词解释","p":["所谓的“字种”是指汉字的个体种类(即不同的汉字)，异体字、繁体字、简体字和变体字都不影响字种的数量。","例如“群、羣”以及“众、衆”都只算一个字种。","从汉代到现代，各个时代实际使用的汉字总数都不曾超出一万字。"],"q":"如果去掉这些异体字，按不同的字来统计的话，字种的实际数量会大大减少。","w":"high","e":["教材高频"]},{"t":"形序法","y":"名词解释","p":["形序法是按照字形的各个方面特点来排列字序的方法。","形序法包括部首法、笔画法、四角号码法等，其中部首法历史最悠久，使用也最普遍。","目前大都采用混合法：A.“笔画——笔形法”，B.“笔形——笔画法”。"],"q":"7.汉字序列法中的 ()又分部首法、笔画法和笔形法、A 音序法 D 形序法C 义序法 D 音义法","w":"high","e":["教材高频"]},{"t":"音序法","y":"名词解释","p":["音序法是按照字音来排列字序的方法。","汉字的音序法经历了声韵序列法、注音字母序列法和汉语拼音字母序列法三个阶段。","汉语拼音序列法内部还有两种：单纯的字母序列法与“音节·汉字·字母分层序列法”。","用音序法排检汉字简单、迅速，一查即得。"],"q":"5.分别运用音序法和部首法，在《新华字典》(第11版)里查找下列汉字：","w":"high","e":["教材高频"]},{"t":"字形整理","y":"名词解释","p":["以前，我国出版物上使用的汉字字形相当混乱，除了繁体、简体的问题外，还存在字形的小差异。","有些字的结构和轮廓相同，笔画数目和笔形却有少量差异。","1965年1月，文化部和中国文字改革委员会联合发布《印刷通用汉字字形表》，为6196个通用汉字规定了通用字体的印刷规范字形。","之后，人们就把《印刷通用汉字字形表》规定的字形称为新字形。"],"q":"二、现代汉字的定形定形包括繁体简化、异体整理、字形整理以及笔画、部件规范等各个方面的工作。","w":"high","e":["教材高频"]},{"t":"通用汉字","y":"名词解释","p":["通用汉字就是书写现代汉语通常要用到的字，也就是除去有特定使用范围的专用字和罕用的生僻字以后的那一部分字。","从商代到现代，一般通用层面使用的汉字数量没有显著变化，可能一直在五六千个左右。","通用字是相对于专用字而言的。"],"q":"1965年1月文化部和中国文字改革委员会联合发布的《印刷通用汉字字形表》，为6196个通用汉字规定了通用字体(宋体)的规范字形。","w":"high","e":["教材高频"]},{"t":"异体字整理","y":"名词解释","p":["异体字指音义都相同仅形不同的字。","整理异体字时，主要采用“从俗从简”的原则。","1955年发布的《第一批异体字整理表》，除了符合严式定义的异体字外，还有包孕关系的异体字、交叉关系的异体字。","从俗，即去生留熟；从简，即选用笔画相对较少的字形。当从俗从简不一致时，往往依据从俗。"],"q":"中华人民共和国成立后，为了推动文字改革，曾设立了中国文字改革委员会(即今国家语言文字工作委员会)，随后即公布了《第一批异体字整理表》《汉字简化方案》《简化字总表》，研究和制定了《汉语拼音方案》。","w":"high","e":["教材高频"]},{"t":"常用字最根本的特点是（　）。","y":"名词解释","p":["常用性主要的依据是该字出现的频率，是最根本的特点"],"q":"2.常用字最根本的特点是(1)能产性 (2)常用性 (3)简易性 (4)稳定性。","w":"normal","e":[]},{"t":"部首法的分歧主要表现在（　）。","y":"名词解释","p":["部首法的分歧主要表现在设部和归部两个问题上"],"q":"2.部首法的分歧与规范部首法的分歧主要表现在设部和归部两个问题上。","w":"normal","e":[]},{"t":"部首法的分歧主要表现在哪些方面？","y":"简答题","p":["设部的分歧：部首总数的差异、设立哪些部首","归部的分歧：从义取部还是从位取部","还有同一部首内汉字的排序问题"],"q":"8.部首法的分歧主要表现在哪些方面?","w":"normal","e":[]}]},{"id":"xdhy_up-c02-s07","t":"第七节 现代汉字的信息处理","w":"high","n":12,"k":[{"t":"汉字信息处理","y":"名词解释","p":["汉字信息处理就是利用计算机对汉字符号系统进行处理的一项科学技术。","所谓语言信息处理就是指用计算机对自然语言的形、音、义等信息进行处理。","汉字信息处理不等同于中文信息处理。汉字信息处理系统则是中文信息处理系统中一个关键和基础的部分。","汉字信息处理，对使用者来说，最主要的是汉字信息的输入与输出。"],"q":"学习要点：了解汉字信息处理的输入方式、汉字键盘输入的方法和汉字编码方案的优缺点；","w":"high","e":["2014 真题","2019 真题"]},{"t":"汉语拼音输入法","y":"名词解释","p":["汉语拼音输入是以汉语拼音连续输入为手段，而由计算机自动转换为汉字的一种计算机汉字处理技术。","汉语拼音输入法的优越性：不需要编码规则；体现语言中以词为单位的特点；输入与思维同步进行；有利于学习普通话和汉语拼音；有利于国际的信息交流。","汉语拼音输入法符合我国国策，是发展方向。其中减少同音选择是完善汉语拼音输入法的关键。"],"q":"汉字键盘输入方式大体上经历了三个发展阶段：整字输入法、汉字编码输入法、汉语拼音输入法。","w":"high","e":["2015 真题","2021 真题"]},{"t":"形码","y":"名词解释","p":["形码是按照汉字字形编码输入的设计。它将汉字的形体分解为若干字元（例如笔画、部件、偏旁、部首），再利用字元代码表和字元排列顺序规则得到汉字编码，然后在键盘上输入。","形码着眼于汉字形体，有效地避免了同音字的问题，因此输入速度大大提高。其缺点在于掌握字形编码方案需要专门训练。","常见的字形编码方案有笔形编码、部件编码、部首编码和四角编码等四种。"],"q":"根据抽取汉字信息特征的不同，汉字编码方案可分为音码、形码、音形结合码三类。","w":"high","e":["教材高频"]},{"t":"音码","y":"名词解释","p":["音码是按照汉字字音编码输入的设计。音码输入实际上是一种拼音转换法，即利用现行的汉语拼音方案输入拼音，把汉字转换成国际通用的拼音编码输入计算机，再由计算机自动转换为汉字。","拼音编码输入法在具体实施中有两种不同的方案：一种是全拼式，一种是双拼式。","音码的优点在于它可以使用计算机上的通用键盘，并且只要使用者基本掌握汉语拼音方案和普通话语音即可进行操作，不需要专门培训。缺点在于同音字需要二次选择，影响输入速度。"],"q":"根据抽取汉字信息特征的不同，汉字编码方案可分为音码、形码、音形结合码三类。","w":"high","e":["教材高频"]},{"t":"点阵法","y":"名词解释","p":["点阵法是最早使用的一种字形描述方法。","汉字打印机、汉字显示终端以及计算机——激光汉字编辑排版系统等汉字输出设备，都要把汉字字形变成数字化的点阵。","点阵利用位于一定栅格内的黑点和白点来存储、显示和打印汉字字形。"],"q":"点阵法是最早使用的一种字形描述方法。","w":"high","e":["教材高频"]},{"t":"整字输入法","y":"名词解释","p":["整字输入法是把整个汉字作为输入符号。一般是把几千个汉字按照一定的顺序排列在一个大键盘上，使用者用键盘击打或电笔点触输入。","汉字键盘输入方式大体上经历了三个发展阶段：整字输入法、汉字编码输入法、汉语拼音输入法。","这种大键盘输入方式的优点是一字一键，无重码，直观性好，操作简单；缺点是需要特制键盘，速度较慢，设备笨重，成本昂贵，难以普及。"],"q":"汉字键盘输入方式大体上经历了三个发展阶段：整字输入法、汉字编码输入法、汉语拼音输入法。","w":"high","e":["教材高频"]},{"t":"音形结合码","y":"名词解释","p":["为了克服形码和音码各自的缺点，形音结合的输入法应运而生。这类编码方案又可分为两种：一种是以字形为主字音为辅的形音码，一种是以字音为主字形为辅的音形码。","形音码与纯形码的不同在于还要利用某些字音信息，即在形码上附加音码。","在实际操作过程中，音形信息的转换往往影响使用者思想的连贯性。"],"q":"根据抽取汉字信息特征的不同，汉字编码方案可分为音码、形码、音形结合码三类。","w":"high","e":["教材高频"]},{"t":"汉字编码输入法","y":"名词解释","p":["汉字编码输入法是把每个汉字编成一个代码，然后利用国际通用小键盘把代码输入计算机。","这种输入法需要进行专门的学习和训练，优点是速度快、重码少，但是写作过程不断受到干扰，使用起来十分不便。","根据抽取汉字信息特征的不同，汉字编码方案可分为音码、形码、音形结合码三类。"],"q":"汉字键盘输入方式大体上经历了三个发展阶段：整字输入法、汉字编码输入法、汉语拼音输入法。","w":"high","e":["教材高频"]},{"t":"汉字的字形识别输入","y":"名词解释","p":["汉字的字形识别输入就是通过特定的文图扫描装置，对印刷在纸上或写在纸上的汉字字符进行分类判别。它用光学字符识别器“扫描仪”抽取汉字字形特征，将纸面上的汉字信息转换成离散的电信号，然后再送入计算机识别，形成汉字内部码。","汉字识别在学科上属于模式识别和人工智能范畴，在应用上属于汉字信息处理系统的一种高速输入方式。","目前比较成熟的识别方法有图形匹配法和结构分析法两种。"],"q":"(二)汉字的字形识别输入采用键盘输入方式，要靠操作人员击键输入，速度较慢，工作量也大。","w":"high","e":["教材高频"]},{"t":"汉字的语音识别输入","y":"名词解释","p":["汉字的语音识别输入就是通过与计算机连接的传声装置，利用语音分析技术，抽取语音特征参数，由计算机进行辨识并形成汉字内部码。","语音识别的原理是把语音先根据语法规则切词，根据语音规则切音段，再根据语境、语用和语义规则辨别词句。","根据输入者的身份，语音识别可分为特定人的语音识别和非特定人的语音识别两类。根据输入者的发音方式，语音识别又可分为孤立词语音识别和连续语音识别两类。"],"q":"(三)汉字的语音识别输入汉字的语音识别输入就是通过与计算机连接的传声装置，利用语音分析技术，抽取语音特征参数，由计算机进行辨识并形成汉字内部码。","w":"high","e":["教材高频"]},{"t":"王永民的五笔字型码属于（　）。","y":"名词解释","p":["部件编码以王永民的五笔字型码为代表"],"q":"1.王永民的五笔字型码属于(1)部件码 (2)笔形码 (3)部首码 (4)四角编码。","w":"normal","e":[]},{"t":"完善汉语拼音输入法的关键是（　）。","y":"名词解释","p":["减少同音选择是完善汉语拼音输入法的关键"],"q":"2.完善汉语拼音输入法的关键是(1)确定标调方法 (2)多音节词连写定型 (3)减少同音字选择。","w":"normal","e":[]}]}]},{"id":"xdhy_up-c03","t":"第三章 词汇","w":"high","s":[{"id":"xdhy_up-c03-s01","t":"第一节 现代汉语词汇概述","w":"high","n":10,"k":[{"t":"词汇","y":"名词解释","p":["词汇也称语汇，是语言中能独立运用的最小的音义结合单位的集合，有时也可以指特定领域中词语的集合。","词语是能够独立运用的音义结合的最小语言单位。词语包括词和固定短语，词是词汇的主体部分，而固定短语是词汇的重要组成部分。","词语的总和形成词汇，词汇与词语的关系是集合与个体的关系。","根据语言差异，词汇可分为汉语词汇、英语词汇、德语词汇等；根据领域不同，词汇可分为政治词汇、经济词汇、法律词汇等。"],"q":"二、记忆与第二语言学习心理学不仅阐述了有关语言的生理一心理基础，而且在语言学习理论、第一语言和第二语言学习、第二语言从感知·理解到记忆·表达的过程、第二语言语音·词汇·语法·汉字的学习心理以及学习者的个体因素等方面，都为本学科提供了坚实的理论依据。","w":"high","e":["教材高频"]},{"t":"语素","y":"名词解释","p":["语素是语言中最小的音义结合的构词单位，是最基本的语言单位。","一个语素必须是语音与语义结合，而且不能再拆分。其中，具有一定的语义是判断语素的最基本条件。","汉语绝大多数语素是一个有意义的音节。如“床”的语音形式是chuáng，它的语义内容是“供人躺在上面睡觉的家具”，那么，“床”就是一个语素。","有少数语素是由两个无意义的音节合成的。如“玻璃”，它的语音形式是bōli，语义是“一种质地硬而脆的透明物体”。“玻”和“璃”虽然都有语音形式，但都没有单独的语义，因此都不是语素；只有“玻璃”才是一个语素。"],"q":"这方面７０年代进行的较有影响的研究是杜雷(Ｈ.Ｄulay)和伯特(M. Burt)按照布朗(R. Brown)研究儿童习得母语英语语素顺序的实验方法，率先进行的儿童习得作为第二语言的英语的语素习得顺序（acquisition order）的实验。","w":"high","e":["教材高频"]},{"t":"离合词","y":"名词解释","p":["有些双音节词在中间可以插入别的成分而变成短语，这类可以插入别的成分变成短语的词叫“离合词”。","常见的离合词有“洗澡、站岗、生气、结亲、伤心、帮忙、随便、游泳、推翻、说服、打倒、看见”等。"],"q":"如果结合“*见面他/*一次见面过”等偏误讲练离合词，或参照外国学生疑问代词习得顺序进行教材编写和教学实施，就可以提高学习效率。","w":"high","e":["教材高频"]},{"t":"扩展法","y":"名词解释","p":["扩展法就是在一个语言单位内部插入其他成分，来观察语言单位的意义是否发生了改变。","如果语言单位的意义改变了或者不合法，则说明该语言单位在意义上是最小的，是词，否则就是短语。","词的意义具有凝固性和专指性，不可以扩展，而短语的意义具有分析性，可以扩展。因此，“扩展法”是区别词和短语的基本方法。"],"q":"因此，“扩展法”是区别词和短语的基本方法。","w":"high","e":["教材高频"]},{"t":"固定短语","y":"名词解释","p":["固定短语是词与词的固定组合，在长期使用过程中形成了相对完整的意义，在实际使用时作用相当于一个词。","其特点是：(1)其中的词和词序一般不能自由变化；(2)整个短语的意义往往不能按字面意义去理解；(3)与词一样不能拆开，并且具有独立运用能力。","可见，固定短语具有结构的固定性、意义的整体性、功能的独立性。","固定短语主要有两类：一是专用短语，指特定的人物、地方、机构、活动以及会议等的名称；二是惯用熟语，指成语、谚语、歇后语与习用语。"],"q":"第三，某些独立成分，往往由固定短语充当，比如“反之”“总而言之”“一方面⋯⋯另一方面⋯⋯”。","w":"high","e":["教材高频"]},{"t":"定位语素","y":"名词解释","p":["一个语素同别的语素组合成词时，位置固定的语素叫定位语素。","根据位置的前后，又分为前置定位语素和后置定位语素。","前缀如：非(非常、非凡、非法、非分等)；后缀如：者(读者、记者、作者、学者等)、化(绿化、美化、净化、激化等)。","一个语素同别的语素组合成词时，位置不固定的语素叫不定位语素，如“电”可以前置（电器、电子、电影），也可以后置（闪电、雷电、水电）。"],"q":"中高级阶段的语素教学，是为了让学生了解语素的类别(成词语素/不成词语素、定位语素/不定位语素、词根/词缀) 和语素构成词的规则，从而更为有效地帮助学生扩大词汇量。","w":"high","e":["教材高频","2024 354 一、名词解释（每"]},{"t":"成词语素","y":"名词解释","p":["能够独立成词的语素是成词语素。","不能独立成词的语素是不成词语素，它只是词语的构成单位。","成词语素如：他、书、看、来、好、就、很、也、了、被、呢、吗、葡萄、牡丹、啰唆、朦胧等；不成词语素如：童(心)、日(子)、衣(服)、朗(读)、历(史)、肃(清)、(人)民、(丢)失等。"],"q":"中高级阶段的语素教学，是为了让学生了解语素的类别(成词语素/不成词语素、定位语素/不定位语素、词根/词缀) 和语素构成词的规则，从而更为有效地帮助学生扩大词汇量。","w":"high","e":["教材高频"]},{"t":"双音节化","y":"名词解释","p":["汉语词汇发展的一个明显的趋势就是“双音节化”。","现代汉语的语素以单音节为主，词则以多音节为主。古代汉语中，以单音节词为主，而现代汉语则以多音节词为主，特别是双音节词占绝大多数。","其原因主要有以下三个：一是有助于避免大量同音词的出现；二是双音节词使词义的表达更为细腻、精确；三是双音节读起来往往带有一种乐感，轻重之间形成一种节奏，悦耳动听。"],"q":"绝大多数的汉语词又是由单音节或双音节组成(据北京语言学院编的《现代汉语频率词典》统计，单音节词与双音节词占总词数的85.6%)，词的双音节化是总的发展趋势。","w":"high","e":["教材高频"]},{"t":"意义整合","y":"名词解释","p":["词的意义比较凝固，往往不是语素意义的简单相加，具有综合性。","自由短语的意义往往可以从组成成分及其意义关系上给予解释，其组成成分在意义上具有相对独立性，短语的整体意义是组合成分意义的加合，具有分析性。","比如：指称一种蔬菜的“白菜”不等于“白色的菜”，指称一种教具的“黑板”不等于“黑色的板”；而“白布”就是“白色的布”，“门窗”就是指“门”和“窗”。"],"q":"他因素的作用下，使相互制约、相互依赖的各个构成成分的意义整合为一个新的完整意义。","w":"high","e":["教材高频"]},{"t":"所有的语素都能单独成词。（  ）","y":"判断题","p":["判断：错误","语素分为成词语素和不成词语素","不成词语素不能单独成词"],"q":"所有的词都是由语素组成的，但并非所有的语素都能单独成词。","w":"normal","e":[]}]},{"id":"xdhy_up-c03-s02","t":"第二节 构词法与造词法","w":"high","n":28,"k":[{"t":"词缀","y":"名词解释","p":["词缀是构成合成词的附着在词根前后或中间表示附加意义的定位语素。","合成词根据词缀的位置，可以分成前缀、后缀、中缀三种类型。","汉语里典型词缀并不太丰富，但是存在比较多的“类词缀”，特点是类似于词缀，意义有不同程度的虚化，但还不彻底；构词功能很强，有组合泛化趋势；其中，后缀与类后缀型最为丰富，中缀和类中缀最少。"],"q":"中高级阶段的语素教学，是为了让学生了解语素的类别(成词语素/不成词语素、定位语素/不定位语素、词根/词缀) 和语素构成词的规则，从而更为有效地帮助学生扩大词汇量。","w":"high","e":["教材高频"]},{"t":"词根","y":"名词解释","p":["词根是构成合成词的有实在意义的不定位语素。","合成词是由两个或两个以上语素构成的词。根据语素在合成词中的表义作用，把语素分为词根和词缀。","词缀是构成合成词的附着在词根前后或中间表示附加意义的定位语素。"],"q":"中高级阶段的语素教学，是为了让学生了解语素的类别(成词语素/不成词语素、定位语素/不定位语素、词根/词缀) 和语素构成词的规则，从而更为有效地帮助学生扩大词汇量。","w":"high","e":["教材高频"]},{"t":"叠音词","y":"名词解释","p":["叠音词是同一个音节重叠而成的单纯词。","叠音词属于双音节单纯词，与重叠式合成词（如“爸爸、常常”）不同。"],"q":"五、包含共同语素的近义词数量多 ⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯ (263)六、有叠音词和带叠音形式的词，叠音形式多样 ⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯ (263)","w":"high","e":["教材高频"]},{"t":"单纯词","y":"名词解释","p":["由一个语素构成的词是单纯词，不存在内部构造问题，但可以根据构词语素的音节特征来划分类型。","根据音节的数量，单纯词可以分为单音节、双音节和多音节三类。","双音节单纯词包括联绵词、叠音词、音译词和拟声词四类。"],"q":"90第三章 词汇第二节 构词法与造词法学习要点：掌握汉语构词法与造词法的特点，重点是构词类型，区分出单纯词、合成词及其内部类型复合词、派生词、重叠词等，并能够准确地对词语进行结构层次分析。","w":"high","e":["教材高频"]},{"t":"复合词","y":"名词解释","p":["复合式合成词指由至少两个不同词根组合而成的合成词，这是现代汉语最重要的构词法。","根据词根与词根的意义与结构关系，复合词主要有五种类型：联合型、偏正型、述宾型、补充型、主谓型。","联合型由两个意义相同、相近、相关或相反的词根并列组合而成；偏正型前一个词根修饰限制后一个词根；述宾型前后词根构成支配与被支配的关系；补充型后一个词根补充说明前一个词根；主谓型前一个词根是被陈述对象，后一个表示陈述。"],"q":"90第三章 词汇第二节 构词法与造词法学习要点：掌握汉语构词法与造词法的特点，重点是构词类型，区分出单纯词、合成词及其内部类型复合词、派生词、重叠词等，并能够准确地对词语进行结构层次分析。","w":"high","e":["教材高频"]},{"t":"构词法","y":"名词解释","p":["构词法是指语素构成词的方式和方法，是对已有词的音节特征和结构关系进行静态的分析和分类。","“构词法”和“造词法”组成了词汇的两大构造系统。","构词法是研究语素如何构成词的方法。"],"q":"90第三章 词汇第二节 构词法与造词法学习要点：掌握汉语构词法与造词法的特点，重点是构词类型，区分出单纯词、合成词及其内部类型复合词、派生词、重叠词等，并能够准确地对词语进行结构层次分析。","w":"high","e":["教材高频"]},{"t":"联绵词","y":"名词解释","p":["联绵词是从古代汉语中流传下来的，由两个没有意义的音节连缀成义而形成的词。","根据联绵词两个音节的声母、韵母关系，联绵词可以分为三类：双声词、叠韵词、非双声叠韵词。","双声词指声母相同的联绵词；叠韵词指韵母相同的联绵词；非双声叠韵词指声母和韵母都不相同或不相近的联绵词。"],"q":"汉语特有的双声联绵词，例如“伶俐”“崎岖”“仓促”“坎坷”，叠韵联绵词，例如“灿烂”“逍遥”“苗条”“唠叨”等都具有一种音乐美。","w":"high","e":["教材高频"]},{"t":"重叠词","y":"名词解释","p":["重叠式合成词是通过同一词根的重叠而形成合成词的方式。","重叠词主要分两种：AA型（如爸爸、常常）和AABB型（如骂骂咧咧、花花绿绿）。","AABB型重叠式合成词既没有对应的AB型词，也没有因重叠而增加语法上的意义，属于词法学的构词重叠；而“漂漂亮亮、大大方方”都有对应词“漂亮、大方”，重叠形式具有“程度加强”的语法意义，属于语法学的构形重叠。"],"q":"90第三章 词汇第二节 构词法与造词法学习要点：掌握汉语构词法与造词法的特点，重点是构词类型，区分出单纯词、合成词及其内部类型复合词、派生词、重叠词等，并能够准确地对词语进行结构层次分析。","w":"high","e":["教材高频"]},{"t":"摹音式","y":"名词解释","p":["摹音式是用汉语的语音形式模拟事物发出的声音或外语词的发音来创造新词的方法。","摹音式是语音指称法的一种，分为指音型、指情型、指物型、译音型。","指音型通过模仿事物发出的声音来指称该声音；指情型通过模仿人发出的声音来指称人之情感；指物型通过模仿事物发出的声音来指称该事物；译音型通过汉字来记录外语词的发音。"],"q":"1.摹音式：用汉语的语音形式模拟事物发出的声音或外语词的发音来创造新词的方法。","w":"high","e":["教材高频"]},{"t":"派生词","y":"名词解释","p":["派生式合成词是指由词根和词缀组合而成的词。","根据词缀的位置，可以分成前缀、后缀、中缀三种类型。","汉语里典型词缀并不太丰富，但是存在比较多的“类词缀”，特点是类似于词缀，意义有不同程度的虚化，但还不彻底。"],"q":"90第三章 词汇第二节 构词法与造词法学习要点：掌握汉语构词法与造词法的特点，重点是构词类型，区分出单纯词、合成词及其内部类型复合词、派生词、重叠词等，并能够准确地对词语进行结构层次分析。","w":"high","e":["教材高频"]},{"t":"类推型","y":"名词解释","p":["类推型是根据与已有概念的语义关系类推成词的方法。","类推型是直指式的一种，分类义类推和反义类推。","类义类推如：雨衣→风衣；文盲→科盲、法盲、音盲、色盲；反义类推如：空姐→空嫂、空哥；国手→国脚；冷门儿→热门儿。"],"q":"(2)类推型：根据与已有概念的语义关系类推成词的方法。","w":"high","e":["教材高频"]},{"t":"造词法","y":"名词解释","p":["造词法是指人们创造新词的方式和方法，是对新造词的形成方式进行动态的分析和分类。","造词法解决了一个词从无到有的问题，即为了命名新事物和新现象而创造新词的方法。","人们在命名事物和现象而创造新词时，可以根据本民族的语言习惯和对事物现象的认识，运用现有的语言材料创造并组合各种各样的新词。"],"q":"90第三章 词汇第二节 构词法与造词法学习要点：掌握汉语构词法与造词法的特点，重点是构词类型，区分出单纯词、合成词及其内部类型复合词、派生词、重叠词等，并能够准确地对词语进行结构层次分析。","w":"high","e":["教材高频"]},{"t":"颜氏家训","y":"简答题","p":["他搜集历代家教典故，结合自己的家教实践，写成《颜氏家训》二十篇，其中有“教子”“勉学”“兄弟”“治家”“风操”“慕贤”“涉务”“杂艺”等篇目，涉及封建家庭教育的各个方面，其精华部分在塑造人们的民族文化心理、维护社会的稳定方面，起过积极的作用；"],"q":"他搜集历代家教典故，结合自己的家教实践，写成《颜氏家训》二十篇，其中有“教子”“勉学”“兄弟”“治家”“风操”“慕贤”“涉务”“杂艺”等篇目，涉及封建家庭教育的各个方面，其精华部分在塑造人们的民族文化心理、维护社会的稳定方面，起过积极的作用；","w":"high","e":["2023 445 一、中外文化及跨"]},{"t":"短语缩略法","y":"名词解释","p":["短语缩略法是指基于交际的经济性原则，通过简缩部分语素或词使短语缩略成词的造词方法。","短语缩略法包括五种方式：分段简缩式、截段简缩式、综合简缩式、取异合同式、数字概括式。","分段简缩式把短语分段，每段取一个成分；截段简缩式取其中具有区别性特征的一段；综合简缩式把分段与截段相结合；取异合同式保留差异成分，把相同成分合一；数字概括式用数字概括相同的成分，省略不同的成分。"],"q":"(四)短语缩略法短语缩略法是指基于交际的经济性原则，通过简缩部分语素或词使短语缩略成词的造词方法。","w":"high","e":["教材高频"]},{"t":"语义关联法","y":"名词解释","p":["语义关联法主要是以概念与概念之间的语义关联为基础，通过组合或比拟等手段来直指或喻指事物现象的方法。","语义关联法分为直指式和喻指式两类。","直指式通过概念之间的关联直指事物现象；喻指式通过概念之间的关联喻指事物现象，包括比喻型、引申型、借代型。"],"q":"(三)语义关联法语义关联法主要是以概念与概念之间的语义关联为基础，通过组合或比拟等手段来直指或喻指事物现象的方法。","w":"high","e":["教材高频"]},{"t":"方志","y":"简答题","p":["所谓地方志就是以行政区划为记述内容的历史书，“志”即“记”的意思，取“永志不忘”之意。"],"q":"所谓地方志就是以行政区划为记述内容的历史书，“志”即“记”的意思，取“永志不忘”之意。","w":"normal","e":[]},{"t":"经部","y":"分析题","p":["“经部”包括儒家经典以及研究、解释这些经典的著作；"],"q":"“经部”包括儒家经典以及研究、解释这些经典的著作；","w":"normal","e":[]},{"t":"豫园","y":"简答题","p":["上海市的“豫园”是明代官僚潘允端为其父亲所建，素称“东南名园之冠”，距今已有400多年的历史。"],"q":"上海市的“豫园”是明代官僚潘允端为其父亲所建，素称“东南名园之冠”，距今已有400多年的历史。","w":"normal","e":[]},{"t":"会馆","y":"简答题","p":["“会馆”是文人和商人活动的场所，它的功能是经济和文化性的。"],"q":"“会馆”是文人和商人活动的场所，它的功能是经济和文化性的。","w":"normal","e":[]},{"t":"猗猗","y":"简答题","p":["”《诗经·卫风·淇奥》云：“瞻彼淇奥，绿竹猗猗。"],"q":"”《诗经·卫风·淇奥》云：“瞻彼淇奥，绿竹猗猗。","w":"normal","e":[]},{"t":"子云亭","y":"名词解释","p":["在汉代，已有人把亭子建在庭院里供歇息，如扬雄在西蜀建有“玄亭”(后人称为“子云亭”)，刘禹锡在《陋室铭》中所说的“西蜀子云亭”即此。"],"q":"在汉代，已有人把亭子建在庭院里供歇息，如扬雄在西蜀建有“玄亭”(后人称为“子云亭”)，刘禹锡在《陋室铭》中所说的“西蜀子云亭”即此。","w":"normal","e":[]},{"t":"廓如亭","y":"简答题","p":["位于颐和园十七孔桥东头的“廓如亭”是全国最大的一座亭，面积达130多平方米；"],"q":"位于颐和园十七孔桥东头的“廓如亭”是全国最大的一座亭，面积达130多平方米；","w":"normal","e":[]},{"t":"曲江池","y":"简答题","p":["公共园林约略出现于唐代，长安城外的“曲江池”是突出的代表。"],"q":"公共园林约略出现于唐代，长安城外的“曲江池”是突出的代表。","w":"normal","e":[]},{"t":"断桥残雪","y":"简答题","p":["如“卢沟晓月”为燕京八景之一，“断桥残雪”是西湖十景之一，等等，都是因为桥梁建筑能与自然环境融为一体。"],"q":"如“卢沟晓月”为燕京八景之一，“断桥残雪”是西湖十景之一，等等，都是因为桥梁建筑能与自然环境融为一体。","w":"normal","e":[]},{"t":"最早的砚应当","y":"简答题","p":["最早的砚应当就是石砚。到汉代发明了人工制墨，墨可以直接在砚上研磨，就陆续出现了其他材质的砚，如铜砚、陶砚、银砚、瓷砚、瓦砚、铁砚、"],"q":"最早的砚应当就是石砚。到汉代发明了人工制墨，墨可以直接在砚上研磨，就陆续出现了其他材质的砚，如铜砚、陶砚、银砚、瓷砚、瓦砚、铁砚、","w":"normal","e":[]},{"t":"第二座历史名桥","y":"简答题","p":["第二座历史名桥就是河北省赵县的赵州桥，本名“安济桥”，由隋代石匠李春建造，是全世界最早的敞肩拱桥。"],"q":"第二座历史名桥就是河北省赵县的赵州桥，本名“安济桥”，由隋代石匠李春建造，是全世界最早的敞肩拱桥。","w":"normal","e":[]},{"t":"919122三是","y":"简答题","p":["919122三是由秦将史禄开凿的“灵渠”，在现在广西壮族自治区兴安县，凿于公元前223 年至前214年。"],"q":"919122三是由秦将史禄开凿的“灵渠”，在现在广西壮族自治区兴安县，凿于公元前223 年至前214年。","w":"normal","e":[]},{"t":"另一项闻名世界的大型水利工程","y":"简答题","p":["另一项闻名世界的大型水利工程就是贯通中国南北的“大运河”。"],"q":"另一项闻名世界的大型水利工程就是贯通中国南北的“大运河”。","w":"normal","e":[]}]},{"id":"xdhy_up-c03-s03","t":"第三节 词义构成","w":"high","n":12,"k":[{"t":"义项","y":"名词解释","p":["义项是字典、词典中按照一个词意义数量分列的项目。","义项有两类：一是可以独立运用的词义，也就是义位；一类是不能独立运用，只是作为构成词或固定短语的语素义。","义位在词典里必定表现为义项，但是义项并不完全等于义位，关键是有的义项只是语素义，不是词义。"],"q":"有的新教师不了解对外汉语教学的这一性质和特点，用大学中文系讲授语言学的方法在课堂上大讲汉语语法知识，或是词汇的各种义项和用法，这就完全违背了语言教学的规律。","w":"high","e":["教材高频"]},{"t":"义素","y":"名词解释","p":["义素是词义系统中不能独立运用的最小的意义单位，是构成义位的区别性语义特征，是从词义分析中抽象出来的观念成分。","义位是可以独立使用的最小意义单位，是词义的最基本构成单位。而义素是不能独立使用的最小意义单位，是构成义位的区别性特征。","义位分解形成义素，不同的义素组合起来形成义位才能构成一个独立运用的意义，义位与义素的关系是整体与部分的关系。"],"q":"3.词汇，建立词汇内部各分支系统，包括：构词系统、本体系统、来源系统、熟语系统和词义系统，特别是加强词义的分析和描写，引进义素分析法以及语素分析法、构词分析法。","w":"high","e":["教材高频"]},{"t":"义位","y":"名词解释","p":["义位是词义系统中可以独立运用的最小的意义单位，是最基本的词义单位，是义素的集合体。","一个词有几个可独立运用的意义就有几个义位，有的词有一个独立运用的意义就只有一个义位，有的词有多个独立运用的意义就有多个义位。","义位是义素的集合，义位与义素的关系是整体与部分的关系。义位是作为单个词义的语义单位，凡是义位，在词典里必定列为一个义项，但是义项不一定就是义位。"],"q":"爸爸 姥姥 靡靡 眯眯 姑姑 常常 看看 刚刚 蝈蝈 饽饽 想想第三节 词 义 构 成学习要点：了解词义的基本概念：义素、义位和义项；","w":"high","e":["教材高频"]},{"t":"临时语境义","y":"名词解释","p":["临时语境义是指一个词在具体语言环境中所派生出的新的临时性词义。","它对语言环境依赖性很大，脱离了具体语境就不存在了。它的产生一般源于人们在特定语境下追求某种特殊的表达效果。"],"q":"二、词义的内容词义是人们通过词的形式反映客观世界、主观世界的事物、现象及其关系的意义内容，词义的内容包括：客观概念义、主观色彩义、固定修辞义、时间空间义以及临时语境义。","w":"high","e":["教材高频"]},{"t":"固定修辞义","y":"名词解释","p":["固定修辞义是指一个词频繁用作一定的修辞手段并凝固在词义系统中成为词典义项之一。","根据修辞手段的不同，主要分为三类：比喻义、借代义和委婉义。","具有比喻义的如：爪牙、桃李、龙头；具有借代义的如：红娘、纨绔、杜康；具有委婉义的如：有喜、绿帽子、驾崩。"],"q":"二、词义的内容词义是人们通过词的形式反映客观世界、主观世界的事物、现象及其关系的意义内容，词义的内容包括：客观概念义、主观色彩义、固定修辞义、时间空间义以及临时语境义。","w":"high","e":["教材高频"]},{"t":"客观概念义","y":"名词解释","p":["从反映对象上看，词义反映的是人们对客观存在的事物、现象及其关系的本质属性的理性认识，理性认识一旦获得语音形式及其书写形式的物质外壳，就成为词义的客观概念义。","概念义也称为客观义、理据义和指称义。客观概念义大致分为两类：指称事物、动作和性质的概念义，可称为实体概念义；指称事物与现象之间关系的概念义，可称为关系概念义。"],"q":"二、词义的内容词义是人们通过词的形式反映客观世界、主观世界的事物、现象及其关系的意义内容，词义的内容包括：客观概念义、主观色彩义、固定修辞义、时间空间义以及临时语境义。","w":"high","e":["教材高频"]},{"t":"情态色彩义","y":"名词解释","p":["情态色彩义是指附着在词义上与其概念义同时存在的主观情感和态度。","情态色彩义主要分成两类：情感色彩和态度色彩。","情感色彩主要分为褒义词和贬义词，大部分词义不带固定的情感色彩，属于中性词。态度色彩主要是指人的态度倾向，如表谦虚、客气、敬重、鄙薄、强硬等态度。"],"q":"1.情态色彩义情态色彩义是指附着在词义上与其概念义同时存在的主观情感和态度。","w":"high","e":["教材高频"]},{"t":"社区色彩义","y":"名词解释","p":["时间空间义是指语言因在一定的时代、地域中使用而产生的意义，主要有古今色彩义和社区色彩义两种。","社区色彩义指只在某个社区流通并反映该社区政治、经济、文化特色的词义。","香港的社区词如：公屋、居屋、夹屋、丁屋、抽水、通水；台湾的社区词如：泛蓝、泛绿、飞弹、辅育院、劈腿。"],"q":"(四)时间空间义时间空间义是指语言因在一定的时代、地域中使用而产生的意义，主要有古今色彩义和社区色彩义两种。","w":"high","e":["教材高频"]},{"t":"语体色彩义","y":"名词解释","p":["语体色彩义是指词义所反映的适用于不同交际场合和文体的语体特征。","词义的语体色彩可以分为两类：口语语体色彩和书面语体色彩，书面语体色彩还可以进一步分为文艺语体、科技语体、政论语体、公文语体四类。","大多数词语既可以用于口语语体，也可以用于书面语体，具有通用的中性语体色彩。"],"q":"2.语体色彩义语体色彩义是指词义所反映的适用于不同交际场合和文体的语体特征。","w":"high","e":["教材高频"]},{"t":"词义的主观性","y":"名词解释","p":["词义的主观性主要表现为两个方面：一是使用主体的民族性；二是词义理解的个体性。","不同民族在用不同的词语记录客观世界和主观世界的事物现象时，由于民族思维、语言系统、生活习惯等方面的差异，决定了词义的民族差异。","即使同一个民族，在对事物认识基本一致的情况下，也会因年龄、生活环境、文化水平和认知能力等差异，造成词义理解的个体差异。"],"q":"2.主观性词义的主观性主要表现为两个方面：一是使用主体的民族性；","w":"high","e":["教材高频"]},{"t":"词义的客观性","y":"名词解释","p":["词义的特征主要有客观性、主观性、概括性和演变性。","词义的客观性主要表现在两个方面：一是反映对象的客观存在性；二是词义形成的约定俗成性。","从反映对象上看，无论是客观世界的山川草木，还是主观世界的爱恨情仇，都是客观存在的。","从词义形成来看，什么样的语音形式及其书写形式表示什么事物、现象及其关系的意义，是基于社会成员客观存在的共同认知而约定俗成的。","当然，词义的客观性并非客观存在或约定俗成本身，也不与客观存在的事物、现象及其关系完全符合或等同。"],"q":"1.客观性词义的客观性主要表现在两个方面：一是反映对象的客观存在性；","w":"high","e":["教材高频"]},{"t":"词义的演变性","y":"名词解释","p":["从发展趋势上看，词义并非一成不变，随着客观世界和主观世界的发展变化，人们对各类事物、现象及其关系的认识和使用方式也随之发生变化，因此，词义具有演变性。","词义演变主要有以下几种类型：(1)词义认识的深化；(2)词义范围的变化（扩大或缩小）；(3)词义功能的转移；(4)词义色彩的变化。","词义扩大如“河”从专指黄河扩大到泛指一切河流；词义缩小如“学者”从指“求学之人”缩小到指学术上有一定成就的人。"],"q":"二、比较下面每个词语的新旧两种释义，运用词义的演变性，说明概念义发生了何种类型的变化。","w":"high","e":["教材高频"]}]},{"id":"xdhy_up-c03-s04","t":"第四节 词义分析与释义","w":"high","n":9,"k":[{"t":"语义场","y":"名词解释","p":["语义场就是在共时条件下，在同一个语义系统中具有意义联系的词的聚合体，语义场是义素分析的依据。","义位之间的意义关联性是义素对比分析的基本条件，义素对比分析的对象必须是具有意义关联性的同一语义场的义位。","根据语义场内义位之间的关系，可以把语义场分为分类语义场、顺序语义场、关系语义场、反义语义场、同义语义场。语义场具有联系性、民族性、层次性三个特征。"],"q":"义素分析法就是对同一语义场的一组义位进行对比分析，从中寻找义位之间共同义素和区别义素的方法，这是现代语义学的重要分析方法。","w":"high","e":["教材高频"]},{"t":"义素分析法","y":"名词解释","p":["义素分析法就是对同一语义场的一组义位进行对比分析，从中寻找义位之间共同义素和区别义素的方法，这是现代语义学的重要分析方法。","义位分为析形成义素，通过义素分析就可以揭示不同义位之间的异同。","义素分析法的步骤包括：掌握义素分析的元语言；确定语义场及其对比义位；提取共同义素和区别义素；列出义位结构式。"],"q":"3.词汇，建立词汇内部各分支系统，包括：构词系统、本体系统、来源系统、熟语系统和词义系统，特别是加强词义的分析和描写，引进义素分析法以及语素分析法、构词分析法。","w":"high","e":["教材高频"]},{"t":"构词分析法","y":"名词解释","p":["构词分析法就是通过综合全面地分析一个词的构词情况来确定该词的词义内容。","这种析义方法最适用于单音多义词。","一个单音多义词往往不容易明确该词的各个义项及其关系，而通过综合分析该词所构成的合成词，比较容易确定该词的多种义项。"],"q":"3.词汇，建立词汇内部各分支系统，包括：构词系统、本体系统、来源系统、熟语系统和词义系统，特别是加强词义的分析和描写，引进义素分析法以及语素分析法、构词分析法。","w":"high","e":["教材高频"]},{"t":"语素分析法","y":"名词解释","p":["合成词是由语素作为构词成分构成的，语素义与词义之间有不同的关系类型，语素义从不同方面、以不同方式、不同程度地表示词义。","语素义与词义的关系类型主要有六种：词义由语素义构词直接来表示；词义由语素义同义互补来表示；词义由语素义和附加义来表示；词义由语素义修辞间接来表示；词义由部分语素义来表示；词义与语素义没有直接关系。"],"q":"3.词汇，建立词汇内部各分支系统，包括：构词系统、本体系统、来源系统、熟语系统和词义系统，特别是加强词义的分析和描写，引进义素分析法以及语素分析法、构词分析法。","w":"high","e":["教材高频"]},{"t":"互训反训释义法","y":"名词解释","p":["运用与被解释词具有同义、近义或反义关系的词或短语等来释义，包括互训和反训。","互训就是用同义近义词释义的方法，反训就是用反义词释义的方法。","互训包括：今语词解释古语词、普通话解释方言词、通用语解释书面语、通用词解释口语词、对语素次序进行对等的同义近义解释。"],"q":"切实掌握逻辑定义释义法、互训反训释义法、描写比喻释义法、补充论元释义法、附加信息释义法，以准确解释词语的意义。","w":"high","e":["教材高频"]},{"t":"描写比喻释义法","y":"名词解释","p":["通过描述或列举、形容、比喻的方式说明被解释词所指的事物、行为、性状及其关系。","描写比喻释义法包括描述事物、描述行为、描述性状、描述关系、列举说明、形容说明、比喻说明等。","如比喻说明：旗手：比喻领导人或先行者；敲门砖：比喻借以求得名利的初步手段。"],"q":"切实掌握逻辑定义释义法、互训反训释义法、描写比喻释义法、补充论元释义法、附加信息释义法，以准确解释词语的意义。","w":"high","e":["教材高频"]},{"t":"补充论元释义法","y":"名词解释","p":["通过补充与被解释词所指事物、行为和形状等有关的主体、对象、原因、目的、工具、方式、处所、领域等语义信息来释义的方法。","补充论元释义法可根据所补充的信息分为：补充主体信息、补充对象信息、补充原因信息、补充目的信息、补充工具信息、补充方式处所领域等信息。"],"q":"切实掌握逻辑定义释义法、互训反训释义法、描写比喻释义法、补充论元释义法、附加信息释义法，以准确解释词语的意义。","w":"high","e":["教材高频"]},{"t":"逻辑定义释义法","y":"名词解释","p":["运用逻辑学中的定义法来进行释义，即通过邻近的属和种差揭示被定义概念的本质属性，该方法比较适用于解释某些学科术语和普通名词。","逻辑定义释义法要求用“属加种差”的方式揭示被定义概念的本质。","被定义概念分别以其邻近的属概念和以其余词语为“种差”来释义。"],"q":"切实掌握逻辑定义释义法、互训反训释义法、描写比喻释义法、补充论元释义法、附加信息释义法，以准确解释词语的意义。","w":"high","e":["教材高频"]},{"t":"附加信息释义法","y":"名词解释","p":["附加与被解释词有关的时空信息、主观色彩、语法属性等语用方面的信息，使词语的释义更加完善充分。","附加信息释义法包括：附加时空（时代、社区、语境等）信息、附加主观色彩（情态、语体）、附加语法属性（用法、词性）。"],"q":"切实掌握逻辑定义释义法、互训反训释义法、描写比喻释义法、补充论元释义法、附加信息释义法，以准确解释词语的意义。","w":"high","e":["教材高频"]}]},{"id":"xdhy_up-c03-s05","t":"第五节 词汇的分类系统","w":"high","n":17,"k":[{"t":"本义","y":"名词解释","p":["本义是文献记载的词的最初意义。","有些多义词的本义已经消失，在一般词典中不再列为义项；有些多义词的本义作为语素义至今保留，但只出现在合成词或固定结构中；有些多义词的本义，至今仍然是最常用最主要的意义，这时多义词的本义与基本义就一致了。"],"q":"与此同时，汉字的字义经过假借(常用读音相同的字形记录跟这个字形毫无联系的字义)、引申(同一字形增加跟原始本义有联系的字义)等发展途径，有些初始义变为罕用义甚至消退了，字形跟常用字义的表达关系模糊了。","w":"high","e":["教材高频"]},{"t":"同义词","y":"名词解释","p":["同义词就是意义相同或相近的词。","根据意义相同的程度，同义词可以分成两类：等义词和近义词。","等义词是指意义完全相同的词；近义词是指意义基本相同，但在意义、功能或色彩上存在细微差别的词。"],"q":"易混淆词与同(近) 义词有交叉关系，它不仅包括容易混淆的同义词、近义词，还包括语义关系较远或没有同(近) 义关系而二语者却经常混用或误用的词(张博，2005、2007)。","w":"high","e":["教材高频"]},{"t":"多义词","y":"名词解释","p":["多义词是指一个语音形式有两个或两个以上既有联系又不相同的意义的词。","多义词的一个意义也被称为一个义项，多义词的各个义项具有以下特点：一是固定性，不是因语境而产生的临时意义；二是关联性，不同的义项之间存在着一定的联系；三是区别性，各个义项保持着自己的特点。","根据多义词所包含的义位和语素义情况，可以分成三种类型：所有义项都是词义的多义词；有些义项是词义而有些义项是语素义的多义词；所有义项都是语素义的多义不成词语素。"],"q":"二、多义词 ⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯ (271)","w":"high","e":["教材高频"]},{"t":"近义词","y":"名词解释","p":["近义词是指意义基本相同，但在意义、功能或色彩上存在细微差别的词。","近义词属于同义词，同义词辨析可运用色彩分析法、意义分析法、功能分析法。"],"q":"五、包含共同语素的近义词数量多 ⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯ (263)六、有叠音词和带叠音形式的词，叠音形式多样 ⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯ (263)","w":"high","e":["教材高频"]},{"t":"反义词","y":"名词解释","p":["反义词就是属于同一范畴的意义相反或相对的一组词。","根据反义词在意义上是相反的矛盾关系还是相对的反对关系，可以分成两类：绝对反义词和相对反义词。","绝对反义词：肯定一方必否定另一方，否定一方必肯定另一方，二者属于矛盾关系；相对反义词：肯定一方必否定另一方，否定一方不一定肯定另一方，二者属于反对关系。"],"q":"3. 利用近义词或反义词用近义词释义，如“邀请”在《等级大纲》中属乙级词，可借助其近义词，即甲级词“请”来进行解释。","w":"high","e":["教材高频"]},{"t":"同音词","y":"名词解释","p":["同音词是指语音形式(声母、韵母和声调)相同而意义完全不同的词。","同音词包括两类：同音同形词，是指语音形式相同，书写形式也相同而意义不同的词；同音异形词，是指语音形式相同，书写形式和意义都不相同的词。","同音词就来源来说主要有两类：词源不同发音偶合的同音词；词源相同，词义分化而成的同音词。"],"q":"(二)同音字与同音词同音的汉字虽然很多，但是同音的词却不是很多，除了单音词同声同韵同调的情况比较多一些之外，双音节、多音节词中的同音现象(例如“琵琶”和“枇杷”)就比较少。","w":"high","e":["教材高频"]},{"t":"同形词","y":"名词解释","p":["同形词是指书写形式相同，语音形式和意义不同的词。","根据语音形式的差异，同形词主要包括四类：声母、韵母相同而声调不同；声母相同而韵母不同或韵母、声调都不同；韵母相同而声母不同或声母、声调都不同；第一个音节相同，第二个音节有轻声与否的差别。"],"q":"不典型的实例坚决更换，宁少毋滥，例如原本同形词举例就有不少问题。","w":"high","e":["教材高频"]},{"t":"引申义","y":"名词解释","p":["引申义是引申发展出来的意义。","引申义可以分为三种情况：从本义(基本义)发展出来的引申义；从基本义发展出来的引申义；从引申义发展出来的引申义。"],"q":"有些字的引申义、假借义成了常用义，记录本义的形旁失去了表义作用，例如“错”有锉刀义，所以形旁用“金字旁”，现在的字义是“不对、不正确”，跟金属联系不上了。","w":"high","e":["教材高频"]},{"t":"比喻义","y":"名词解释","p":["比喻义就是把词的比喻用法固定下来的意义。","本义、基本义、引申义都可以产生比喻义。","“口”的本义和基本义是“人和动物进食、发声的器官”，发展出比喻义义项“出入通过的部位”。"],"q":"词的引申义和比喻义不同，如松竹梅在汉语中象征人的品德高洁，而在英语中无此意义。","w":"high","e":["教材高频"]},{"t":"单义词","y":"名词解释","p":["单义词是指一个语音形式只有一个意义的词。","单义词主要包括以下类型：事物名词、专有名词、科学术语、称谓名称。"],"q":"而根据意义的数量、异同和属种，可以分出单义词和多义词、同义词和反义词、上位词和下位词及类义词。","w":"high","e":["教材高频"]},{"t":"基本义","y":"名词解释","p":["基本义就是词在现代最常用最主要的意义。","有些多义词的本义和基本义一致，有些多义词的本义和基本义并不一致。","词的基本义都是词义义项，不能是语素义义项。在《现代汉语词典》中，基本义一般列为第一义项。"],"q":"有些多义词的本义，至今仍然是最常用最主要的意义，这时多义词的本义与基本义就一致了。","w":"high","e":["教材高频"]},{"t":"字母词","y":"名词解释","p":["字母词是指汉语中由拉丁字母、希腊字母等西文字母构成的或由它们与符号、数字或汉字混合构成的词。","字母词主要包括三类：英文字母词（包括英语词和英语首字母缩略语）、汉语拼音字母缩略形式、以字母表形的字母词。","字母词的大量出现主要有两个方面的原因：从社会生活考虑，一是国际交流的日趋频繁，二是社会文化水平的普遍提高，三是计算机及其网络的普遍运用；从语言文字本身着眼，一是某些外来词语难以翻译，二是字母词书写经济简便。"],"q":"五、汉语中的字母词有越来越多的趋势，有人坚决反对，你是怎么看的?第六节 词汇的构成系统学习要点：了解现代汉语词汇在时间和空间上的两大构成系统，并能够根据不同类型的特点判断各种词语的不同来源。","w":"high","e":["教材高频"]},{"t":"等义词","y":"名词解释","p":["等义词是指意义完全相同的词。","等义词属于同义词，与近义词相对。"],"q":"书写形式不同的词主要分为三类：同素颠倒词、异形等义词、异形外来词。","w":"high","e":["教材高频"]},{"t":"类义词","y":"名词解释","p":["类义词就是根据同一意义标准划分出来的属于同一上位词的一组下位词。","根据同位关系的严密程度，类义词主要包括两种类型：严格的基于科学分类的类义词；非严格的基于日常运用的类义词。","类义词划分必须同一标准，类义词之间必须互相排斥。"],"q":"学习要点：了解现代汉语词汇的形式和意义两种分类系统，学会运用同义词的三种辨析方法，掌握上位词、下位词和类义词的类型和鉴定标准。","w":"high","e":["教材高频"]},{"t":"相对反义词","y":"名词解释","p":["相对反义词：肯定一方必否定另一方，否定一方不一定肯定另一方，二者属于反对关系。","相对反义词属于反义词的一类，与绝对反义词相对。"],"q":"B.相对反义词：肯定一方必否定另一方，否定一方不一定肯定另一方，二者属于反对关系的相对反义词。","w":"high","e":["教材高频"]},{"t":"绝对反义词","y":"名词解释","p":["绝对反义词：肯定一方必否定另一方，否定一方必肯定另一方，二者属于矛盾关系。","绝对反义词属于反义词的一类，与相对反义词相对。"],"q":"A.绝对反义词：肯定一方必否定另一方，否定一方必肯定另一方，二者属于矛盾关系的绝对反义词。","w":"high","e":["教材高频"]},{"t":"上位词与下位词","y":"名词解释","p":["上位词和下位词是指在意义上具有属种关系的一组词。在属种关系中，指称属概念的词就是上位词，指称种概念的词就是下位词。","根据属种关系的严密程度，上下位词主要包括两种类型：严格的基于科学分类的上下位词；非严格的基于日常运用的上下位词。","上位词与下位词间的属种关系可以通过“属加种差鉴定法”“类与子类鉴定法”“整分关系排除法”鉴别。"],"q":"(2)上位词、下位词的鉴定标准A.属加种差鉴定法上位词与下位词间的属种关系可以通过“属加种差定义法”鉴别出来，即“下位词是⋯⋯的上位词”。","w":"high","e":["教材高频"]}]},{"id":"xdhy_up-c03-s06","t":"第六节 词汇的构成系统","w":"high","n":8,"k":[{"t":"外来词","y":"名词解释","p":["外来词是指从外国语或外族语中连音带义吸收来的词语。","在汉语发展史上，外来词的大规模借入主要有四个时期：一是借入西域诸国事物类词语的两汉时期；二是借入佛教词语的魏晋南北朝至唐宋时期；三是借入西方哲学、政治和科技词语的近代时期；四是全面借入外来词的改革开放时期。","现代汉语外来词主要来源于英语、日语、法语、俄语、德语以及境内少数民族语言。"],"q":"汉语的外来词中，单纯音译而又通用的(如咖啡、卢布)或译音兼巧妙地译义(如浪漫、可口可乐)不多，绝大部分都经过汉语构词法的改造：或音译加类名(如汉堡包、芭蕾舞)，或部分译音、部分译义(如英特网、迷你裙)，或意译(如电视、代沟)，均与原文相去甚远，并未能给外国学习者提供很多联系其母语记忆词汇的方便。","w":"high","e":["教材高频"]},{"t":"方言词","y":"名词解释","p":["方言词是指来源于某一方言且仅限于该方言地域内使用的词语。","根据交际的需要，方言词会不断地有选择地被吸收到现代汉语词汇中。当一个方言词可在全社会使用并稳定下来时，就成了现代汉语词汇的方言词。","方言词进入现代汉语词汇的速度和数量，与该方言地域的政治、经济、文化、人口等因素有密不可分的关系。"],"q":"最早的辞书《尔雅》出现在秦汉之交(公元前2世纪)，西汉扬雄的《方言》(公元前后)是中国第一部在实地调查收集资料的基础上的比较方言词汇的重要著作，东汉时期(公元1世纪)许慎的《说文解字》是中国最早按形义关系编排的字书。","w":"high","e":["教材高频"]},{"t":"社区词","y":"名词解释","p":["社区词是指反映某一社区政治、经济、文化特点并只在该社区流通的特有词语。","由于不同的政治制度、经济体制、文化教育和心理状态，中国大陆、香港特区、澳门特区、台湾地区以及不同的海外华人社区就会在政治、经济、文化、教育、生活等方面出现各不相同的事物、观念和现象，从而出现只在该社区使用的社区词。"],"q":"这最主要反映在词汇方面，有一些反映该社区政治、经济、文化、教育的特殊词语，例如：打工皇帝、直通车、夹心阶层、金鱼缸、楼花、黑金政治、太平绅士等(香港社区词)；","w":"high","e":["教材高频"]},{"t":"传承词","y":"名词解释","p":["传承词是指从古代、近代汉民族语言词汇中流传下来而为现代汉语词汇所承接的词。","传承词是现代汉语词汇的核心部分，属于基本词汇。传承词所指称的事物和现象从古代到现代都与人们的日常生活息息相关，因此具有较强的生命力。","传承词主要包括表示自然现象和事物、生产和生活资料、时量和空间概念、事物性质状态、人体部位和器官、动作行为和变化、亲属人称指代、事物或行为关系等八类。传承词具有共时的普遍性、历时的稳定性、构词的能产性三个特点。"],"q":"(1)传承词：天、江、水、吃、讲、过、长、香、很、最、不、但、可、才、就、和、把、只、了、吗、呢、吧等。","w":"high","e":["教材高频"]},{"t":"新造词","y":"名词解释","p":["新造词是指为指称新事物、新概念或新现象而创造的词语。","新造词的产生与社会生活的变化有着密切的关系，社会变化越剧烈，新造词的产生就越频繁，有些新造词会随着使用频率的增加和范围的扩大而进入现代汉语词汇中，成为基本词汇成员，有些则随着使用频率的减少而逐渐消亡。","新词与旧词具有一定的相对性。以20世纪70年代末的改革开放为起点，在现代汉语中出现了大量新造词。"],"q":"造词法是指人们创造新词的方式和方法，是对新造词的形成方式进行动态的分析和分类。","w":"high","e":["教材高频"]},{"t":"古语词","y":"名词解释","p":["古语词是指在古代、近代汉语中使用，而现代汉语出于特殊需要偶尔使用的词语。","根据指称事物的特点，主要包括两类：历史古语词和文言古语词。","历史古语词所指称的事物、现象和观念在历史上曾经存在过或流传过而现在已经不存在或不流传了；文言古语词所指称的事物、现象和观念在现实生活中依然存在，但古代和近代用文言词来表示，而现在用现代汉语词语来表示。"],"q":"词汇的构成相当复杂，从时间维度看，有传承词、古语词、新造词；","w":"high","e":["教材高频"]},{"t":"行业词","y":"名词解释","p":["行业词是指在不同学科专业和行业中使用的专门用语，是表达学科专业和行业概念的重要方式。","行业词包括专业术语和行业用语。","随着人们文化知识水平的普遍提高以及跨学科和跨行业交流的增加，许多行业词逐渐泛化而成为普通的现代汉语词汇。"],"q":"从空间维度看，有方言词、社区词、行业词、外来词。","w":"high","e":["教材高频"]},{"t":"外来词的译借方式","y":"名词解释","p":["现代汉语外来词的译借方式主要有：单纯音译式、音意混译式、音意兼译式、音加语素式、借音借形式。","单纯音译式即用汉字直接来译写外语词的读音；音意混译式即部分音译、部分意译；音意兼译式即整体音译，同时兼顾意译；音加语素式即外来词是由音译部分和表示类名的汉语语素组成；借音借形式包括借自西方字母的词和借自日文汉字字形而非读音的词。"],"q":"2.现代汉语外来词的译借方式","w":"high","e":["教材高频"]}]},{"id":"xdhy_up-c03-s07","t":"第七节 词汇的熟语系统","w":"high","n":6,"k":[{"t":"成语","y":"名词解释","p":["成语是人们从历史上传承下来并长期使用的结构凝固、语义精辟且具有民族特点的熟语。","成语是熟语中最重要的一种，主要有四个特点：历史的传承性、结构的凝固性、意义的整体性、习用的民族性。","成语主要来源包括神话寓言、历史故事、诗文语句、口头俗语。"],"q":"他反对在课堂上正式教授语法规则，主张把课堂变成语言习得的场所，让学习者在课堂上尽可能多地接触体现 i+1原则的可理解输人，由他们按自然顺序通过假设和验证在有目的的交际活动中习得目的语的基本规则。","w":"high","e":["教材高频"]},{"t":"谚语","y":"名词解释","p":["谚语是民间基于深刻的社会生活经验而提炼出来的通俗、上口、精练、形象而有一定警示或教育意义的熟语。","谚语是人民智慧的结晶，能以浅显的语言表达深刻的道理。","根据谚语所反映的内容，谚语主要包括六种类型：农业谚语、气象谚语、规诫谚语、常识谚语、讽颂谚语、风土谚语。"],"q":"学习要点：现代汉语词汇的熟语系统，包括成语、谚语、歇后语、惯用语和习用语，了解各类的特点和类型，并能据此判断某个词语的熟语类型。","w":"high","e":["教材高频"]},{"t":"熟语","y":"名词解释","p":["现代汉语的熟语系统包括五小类：成语、谚语、歇后语、惯用语和习用语。","熟语的特点：(1)结构的定型性；(2)语义的整合性；(3)功能的多样性；(4)语用的民族性。","结构的定型性指熟语的构成成分及其结构关系是固定的；语义的整合性指熟语的意义不是构成成分意义的简单相加；功能的多样性指熟语可以跟词一样按照一定的语法规则组织起来充当多种句子成分；语用的民族性指熟语的形成和使用受民族文化传统的影响。"],"q":"固定短语是词与词的组合，相当于一个词，主要由专门用语、熟语和缩略语组成，如“中国人民银行”“守株待兔”“开后门” “大海里捞针————无处寻” “上有天堂，下有苏杭” “北大” “五味”等。","w":"high","e":["教材高频"]},{"t":"惯用语","y":"名词解释","p":["惯用语是群众口头创造并通过修辞手段准确、生动、形象、概括地揭示某些社会现象和某种行为的熟语。","从结构上看，典型的惯用语以三音节的动宾结构为主，也有部分偏正短语，少数主谓短语。","惯用语的整体意义不是其构成成分简单相加的意义，而是通过比喻、借代、夸张、比拟等手法所表达的修辞意
