治区兴安县，凿于公元前223 年至前214年。当时因两广交通不便，秦始皇为统一岭南，调动军队和军需，命史禄将湘、漓二水沟通，纳入长江和珠江两大水系。灵渠全长34公里，使当时的水路可以直达今天的广州。灵渠工程由大小天平、铧嘴、南北渠、秦堤、泄水天平及陡门等30多处工程组成完整的防洪、泄洪、航运、灌溉体系","w":"normal","e":["原书正文"]},{"t":"【原文】另一项闻名世界的大型水利","y":"教材原文","p":["另一项闻名世界的大型水利工程就是贯通中国南北的“大运河”","它由隋炀帝于大业元年(605 年) 开始修建，至大业六年 (610年) 完成，部分"],"q":"另一项闻名世界的大型水利工程就是贯通中国南北的“大运河”。它由隋炀帝于大业元年(605 年) 开始修建，至大业六年 (610年) 完成，部分","w":"normal","e":["原书正文"]}]}]},{"id":"culture-c12","t":"第十二章 传统建筑","w":"high","s":[{"id":"culture-c12-s01","t":"第一节 木构架与结构构件","w":"high","n":10,"k":[{"t":"斗拱","y":"名词解释","p":["位于柱顶与屋檐之间的构件","承托屋檐、传递荷载","层数出跳定等级","形成框架结构"],"q":"中国传统木构建筑中特有的构件，由斗、拱、昂等组成，位于柱顶与屋檐之间，起承托屋檐、传递荷载和装饰的作用。斗拱的层数与出跳数越多，建筑等级越高。它使中国建筑形成了\"墙倒屋不塌\"的框架结构特性。","w":"high","e":["2018 真题"]},{"t":"榫卯","y":"名词解释","p":["凹凸结合的连接工艺","凸者为榫、凹者为卯","不用钉、抗震性能好"],"q":"中国传统木构建筑的核心连接工艺，在两个构件上采用凹凸结合的方式相接，凸出者称榫，凹入者称卯。榫卯不用钉子，靠木材本身的咬合受力，具有良好的抗震性能，是中国古代木构建筑的重大创造。","w":"high","e":["2017 真题"]},{"t":"木构架结构","y":"名词解释","p":["以木柱木梁承重","墙倒屋不塌","抬梁式穿斗式井干式","抬梁式用于北方与宫殿"],"q":"木构架结构是中国古代建筑最主要的承重方式，以木柱、木梁构成房屋骨架，墙体只起围护分隔作用，有\"墙倒屋不塌\"之说。主要形式有抬梁式、穿斗式和井干式。其中抬梁式使用最广，多用于北方与宫殿庙宇；穿斗式多用于南方民居。","w":"high","e":["2016 真题"]},{"t":"试论中国古代建筑所体现的文化观念","y":"名词解释","p":["礼制等级观念","宗法家族观念","天人合一与风水","中轴对称体现中庸","阴阳五行观念","内向封闭的文化性格"],"q":"中国古代建筑深刻体现了传统文化观念：①礼制等级观念，如屋顶形式、开间数量、色彩装饰均有严格等级，黄瓦红墙为皇家专用；②宗法家族观念，四合院\"长幼有序、内外有别\"的布局正是宗法伦理的空间化；③天人合一思想，建筑选址讲究风水、依山傍水，与自然融为一体；④中正平和之美，中轴对称、居中为尊体现儒家中庸思想；","w":"high","e":["2023 真题"]},{"t":"【原文】立祠祭祀。现今湖北省秭归","y":"教材原文","p":["现今湖北省秭归县和湖南省汨省秭归县和湖南省汨罗市，都有屈原庙或罗市，都有屈原庙或屈子祠留存","“骚人屈子祠留存"],"q":"立祠祭祀。现今湖北省秭归县和湖南省汨省秭归县和湖南省汨罗市，都有屈原庙或罗市，都有屈原庙或屈子祠留存。“骚人屈子祠留存。“骚人","w":"normal","e":["原书正文"]},{"t":"【原文】《诗经》与《楚辞》以其巨","y":"教材原文","p":["《诗经》与《楚辞》以其巨大的艺术魅力而被称为“风骚”，构成中国诗歌发展史上的两大源头","汉魏六朝乐府是我国诗歌发展的又一个高峰","汉代独尊儒术，注重诗教，专门设立“乐府”，负责采集民歌，编制乐章，整理外来乐曲","后来把汉代乐府搜集来的歌词及魏晋六朝到隋唐时代可以入乐的诗歌和模仿乐府古题的作品统称为“乐府诗”"],"q":"《诗经》与《楚辞》以其巨大的艺术魅力而被称为“风骚”，构成中国诗歌发展史上的两大源头。汉魏六朝乐府是我国诗歌发展的又一个高峰。汉代独尊儒术，注重诗教，专门设立“乐府”，负责采集民歌，编制乐章，整理外来乐曲。后来把汉代乐府搜集来的歌词及魏晋六朝到隋唐时代可以入乐的诗歌和模仿乐府古题的作品统称为“乐府诗”。宋代郭茂倩编辑的《乐府诗集》主要收录了从传说中的陶唐氏之","w":"normal","e":["原书正文"]},{"t":"【原文】古典文学古典文学2972","y":"教材原文","p":["古典文学古典文学297297在汉乐府民歌的直接影响下，东汉末年出现了文人创作的五言诗，如班固的《咏史诗》、张衡的《同声歌》和无名氏的《古诗十九首》","特别是《古诗十九首》，借景抒情，语言精炼，交替使用赋、比、兴手法，达到了很高的艺术成就，对后来的诗歌创作产生了深刻的影响","建安时期，以曹操(155——220年)、曹植(192——232年) 父子和“建安七子”(孔融、王粲、刘桢、陈琳、阮瑀、徐干、应瑀) 为代表的建安文人把五言诗推上了一个高峰","他们面对混乱的社会现实，在诗中抒发丧乱之情，感叹身世之遇，吐露了忧国治世的思想和愿望，形成一代诗风，即文学史上所称的“建安风骨”"],"q":"古典文学古典文学297297在汉乐府民歌的直接影响下，东汉末年出现了文人创作的五言诗，如班固的《咏史诗》、张衡的《同声歌》和无名氏的《古诗十九首》。特别是《古诗十九首》，借景抒情，语言精炼，交替使用赋、比、兴手法，达到了很高的艺术成就，对后来的诗歌创作产生了深刻的影响。建安时期，以曹操(155——220年)、曹植(192——232年) 父子和“建安七子”(孔","w":"normal","e":["原书正文"]},{"t":"【原文】魏晋之际，五言诗有了进一","y":"教材原文","p":["魏晋之际，五言诗有了进一步发展，杰出诗人有阮籍(210—263 年)、嵇康(224——263年)、左思(约250——约305年)、陶渊明(本名潜, 365—427年) 等","阮籍的《咏怀诗》、嵇康的《幽愤诗》、左思的《咏史诗》，或以古喻今，或遣幽排愤，都表现了诗人们不畏艰难的英雄气概和情怀","而此时，由于玄学的影响，“玄言诗”也颇流行，但陶渊明却以率真自然的笔调描绘田园风光和田园生活的感受","陶诗语言自然平淡，不事雕饰，诗旨宏阔深远"],"q":"魏晋之际，五言诗有了进一步发展，杰出诗人有阮籍(210—263 年)、嵇康(224——263年)、左思(约250——约305年)、陶渊明(本名潜, 365—427年) 等。阮籍的《咏怀诗》、嵇康的《幽愤诗》、左思的《咏史诗》，或以古喻今，或遣幽排愤，都表现了诗人们不畏艰难的英雄气概和情怀。而此时，由于玄学的影响，“玄言诗”也颇流行，但陶渊明却以率真自然的笔调","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)298298南北朝时期可以说是我国诗歌发展的重大转变时期，其标志就是“音律”的出现，代表诗人是沈约、谢朓等","他们依据四声的规律，在诗歌创作中注意声、韵、调的相互配合和词语对偶形式的运用，创造了一种讲究声律和对仗的新诗体","因其活跃在南齐永明年间，故称为“永明体”","从此，中国诗歌开始从比较自由的形式向讲求格律的方向发展，这一变化对唐代以后的诗歌以及宋词、元曲都产生了巨大的影响"],"q":"中国文化要略(第4版)中国文化要略(第4版)298298南北朝时期可以说是我国诗歌发展的重大转变时期，其标志就是“音律”的出现，代表诗人是沈约、谢朓等。他们依据四声的规律，在诗歌创作中注意声、韵、调的相互配合和词语对偶形式的运用，创造了一种讲究声律和对仗的新诗体。因其活跃在南齐永明年间，故称为“永明体”。从此，中国诗歌开始从比较自由的形式向讲求格律的方向发展","w":"normal","e":["原书正文"]},{"t":"【原文】诗歌发展到唐代，进入了高","y":"教材原文","p":["诗歌发展到唐代，进入了高度繁荣的阶段","以数量而论，清代编定的《全唐诗》共录作者 2，300余位，诗作48，900余首，还有许多散失的作品未能包括在内，可称盛况空前","以诗体而论，以由“永明体”发展而来的“近体诗”(即格律诗) 为主，其中又分五律、七律，五绝、七绝，其他五言、七言古"],"q":"诗歌发展到唐代，进入了高度繁荣的阶段。以数量而论，清代编定的《全唐诗》共录作者 2，300余位，诗作48，900余首，还有许多散失的作品未能包括在内，可称盛况空前；以诗体而论，以由“永明体”发展而来的“近体诗”(即格律诗) 为主，其中又分五律、七律，五绝、七绝，其他五言、七言古","w":"normal","e":["原书正文"]}]},{"id":"culture-c12-s02","t":"第二节 屋顶形制与等级","w":"normal","n":8,"k":[{"t":"庑殿顶","y":"名词解释","p":["等级最高的屋顶形式","一正脊四斜脊，又称四阿顶","用于宫殿坛庙最高等级建筑","太和殿为重檐庑殿顶"],"q":"庑殿顶是中国传统屋顶形式中等级最高的一种，由一条正脊和四条斜脊组成，四面均为斜坡，故又称\"四阿顶\"\"五脊殿\"。它多用于宫殿、坛庙等最高等级建筑，如故宫太和殿即重檐庑殿顶。屋顶形式按等级依次为庑殿、歇山、悬山、硬山、攒尖，是礼制等级在建筑上的直接体现。","w":"normal","e":["核心概念"]},{"t":"【原文】魏晋南北朝的辞赋虽然继承","y":"教材原文","p":["魏晋南北朝的辞赋虽然继承了汉赋的遗风，但与汉赋相比，已发生某些变化，即由“润色鸿业”的歌功颂德转向咏物抒情，写作的题材更加广泛，语言由散体趋向骈体","建安时代的文人都擅长辞赋，其中最为人传诵的是"],"q":"魏晋南北朝的辞赋虽然继承了汉赋的遗风，但与汉赋相比，已发生某些变化，即由“润色鸿业”的歌功颂德转向咏物抒情，写作的题材更加广泛，语言由散体趋向骈体。建安时代的文人都擅长辞赋，其中最为人传诵的是","w":"normal","e":["原书正文"]},{"t":"【原文】曹植的《洛神赋》、王粲的","y":"教材原文","p":["曹植的《洛神赋》、王粲的《登楼赋》，二者状物抒情，文笔清丽","蔡邕的《述行赋》和祢衡的《鹦鹉赋》则抒情言志，寓意深刻","左思的鸿篇巨制《三都赋》，虽然在写作手法上模拟汉大赋，但作品风格豪迈，文辞富丽，使得国人竞相传抄，洛阳为之纸贵","由于受魏晋玄学的影响，这时的赋多谈老庄玄旨，清新质朴的短篇小赋也日渐增多，其中如孙绰的《游天台山赋》、陶渊明的《闲情赋》、潘岳的《怀旧赋》，都是这类作品的代表"],"q":"曹植的《洛神赋》、王粲的《登楼赋》，二者状物抒情，文笔清丽；蔡邕的《述行赋》和祢衡的《鹦鹉赋》则抒情言志，寓意深刻。左思的鸿篇巨制《三都赋》，虽然在写作手法上模拟汉大赋，但作品风格豪迈，文辞富丽，使得国人竞相传抄，洛阳为之纸贵。由于受魏晋玄学的影响，这时的赋多谈老庄玄旨，清新质朴的短篇小赋也日渐增多，其中如孙绰的《游天台山赋》、陶渊明的《闲情赋》、潘岳的《怀","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)唐代虽然以诗歌创作为主调，但辞赋也是文人学士显示文学才华的一块园地","可以说，唐代的许多著名诗人，都写过辞赋作品","如王勃的《春思赋》，抒发了自己渴望建功立业的雄心壮志","张九龄的《荔枝赋》，表达了才士位卑，欲求上达的思想"],"q":"中国文化要略(第4版)中国文化要略(第4版)唐代虽然以诗歌创作为主调，但辞赋也是文人学士显示文学才华的一块园地。可以说，唐代的许多著名诗人，都写过辞赋作品。如王勃的《春思赋》，抒发了自己渴望建功立业的雄心壮志； 张九龄的《荔枝赋》，表达了才士位卑，欲求上达的思想；李白的《大鹏赋》，则以搏击云天的大鹏自况，等等。中晚唐以后，诗人们在古文运动的影响下，突破骈体赋","w":"normal","e":["原书正文"]},{"t":"【原文】唐代虽然以诗歌创作为主调","y":"教材原文","p":["唐代虽然以诗歌创作为主调，但辞赋也是文人学士显示文学才华的一块园地","可以说，唐代的许多著名诗人，都写过辞赋作品","如王勃的《春思赋》，抒发了自己渴望建功立业的雄心壮志","张九龄的《荔枝赋》，表达了才士位卑，欲求上达的思想"],"q":"唐代虽然以诗歌创作为主调，但辞赋也是文人学士显示文学才华的一块园地。可以说，唐代的许多著名诗人，都写过辞赋作品。如王勃的《春思赋》，抒发了自己渴望建功立业的雄心壮志； 张九龄的《荔枝赋》，表达了才士位卑，欲求上达的思想；李白的《大鹏赋》，则以搏击云天的大鹏自况，等等。中晚唐以后，诗人们在古文运动的影响下，突破骈体赋的限制，运用辞赋反映社会问题，十分关注人生，","w":"normal","e":["原书正文"]},{"t":"【原文】308308宋代辞赋继承","y":"教材原文","p":["308308宋代辞赋继承了前代辞赋创作的传统，继续采用古赋和骈体赋的形式，但在唐宋古文运动的推动下，受杜牧《阿房宫赋》的启示，产生了一种用韵比较自由、章法比较严谨、气象十分生动的文赋，其代表作有欧阳修的《秋声赋》、苏轼的《前赤壁赋》和《后赤壁赋》","这些作品散韵间杂，文辞富于变化，想象丰富，说理精辟，写景状物惟妙惟肖","如苏轼《前赤壁赋》中的“白露横江，水光接天”，《后赤壁赋》中的“山高月小，水落石出”，都是一派画境","作者在赋中所表达的旷达胸怀和乐观态度，使之成为了千古不朽的杰作"],"q":"308308宋代辞赋继承了前代辞赋创作的传统，继续采用古赋和骈体赋的形式，但在唐宋古文运动的推动下，受杜牧《阿房宫赋》的启示，产生了一种用韵比较自由、章法比较严谨、气象十分生动的文赋，其代表作有欧阳修的《秋声赋》、苏轼的《前赤壁赋》和《后赤壁赋》。这些作品散韵间杂，文辞富于变化，想象丰富，说理精辟，写景状物惟妙惟肖。如苏轼《前赤壁赋》中的“白露横江，水光接天","w":"normal","e":["原书正文"]},{"t":"【原文】宋代辞赋继承了前代辞赋创","y":"教材原文","p":["宋代辞赋继承了前代辞赋创作的传统，继续采用古赋和骈体赋的形式，但在唐宋古文运动的推动下，受杜牧《阿房宫赋》的启示，产生了一种用韵比较自由、章法比较严谨、气象十分生动的文赋，其代表作有欧阳修的《秋声赋》、苏轼的《前赤壁赋》和《后赤壁赋》","这些作品散韵间杂，文辞富于变化，想象丰富，说理精辟，写景状物惟妙惟肖","如苏轼《前赤壁赋》中的“白露横江，水光接天”，《后赤壁赋》中的“山高月小，水落石出”，都是一派画境","作者在赋中所表达的旷达胸怀和乐观态度，使之成为了千古不朽的杰作"],"q":"宋代辞赋继承了前代辞赋创作的传统，继续采用古赋和骈体赋的形式，但在唐宋古文运动的推动下，受杜牧《阿房宫赋》的启示，产生了一种用韵比较自由、章法比较严谨、气象十分生动的文赋，其代表作有欧阳修的《秋声赋》、苏轼的《前赤壁赋》和《后赤壁赋》。这些作品散韵间杂，文辞富于变化，想象丰富，说理精辟，写景状物惟妙惟肖。如苏轼《前赤壁赋》中的“白露横江，水光接天”，《后赤壁","w":"normal","e":["原书正文"]},{"t":"【原文】作已屈指可数","y":"教材原文","p":["金代元好问的《秋望赋》、郝经的《怒雨赋》，还值得一读","明代的前后七子也作过一些辞赋，但多辞藻华丽而少寄托","清代的某些文人企图模仿汉赋，又都流于歌功颂德，因此，辞赋创作在明清两代只能算是高音余响了"],"q":"作已屈指可数。金代元好问的《秋望赋》、郝经的《怒雨赋》，还值得一读。明代的前后七子也作过一些辞赋，但多辞藻华丽而少寄托；清代的某些文人企图模仿汉赋，又都流于歌功颂德，因此，辞赋创作在明清两代只能算是高音余响了。","w":"normal","e":["原书正文"]}]},{"id":"culture-c12-s03","t":"第三节 布局、民居与园林","w":"high","n":12,"k":[{"t":"四合院","y":"名词解释","p":["北方典型民居、北京最著名","中轴对称、四面围合","体现宗法伦理与天人合一"],"q":"中国北方典型的传统民居形式，以北京四合院最为著名。其布局以南北纵轴对称为原则，由正房、东西厢房、倒座房围合成封闭的院落，大门多开于东南角。四合院体现了尊卑有序、长幼有别的宗法伦理和\"天人合一\"的居住理念。","w":"high","e":["2016 真题"]},{"t":"中轴线","y":"名词解释","p":["都城规划核心原则","南北纵贯对称布局","南起永定门北至钟鼓楼","体现皇权至上居中为尊"],"q":"中轴线是中国古代都城规划的核心原则，以南北纵贯的都城中轴为骨架，重要建筑对称分布于两侧。明清北京城中轴线南起永定门，经正阳门、天安门、紫禁城、景山，北至钟鼓楼，全长约7.8公里，集中体现了皇权至上、居中为尊的礼制思想，2024年\"北京中轴线\"被列入世界遗产名录。","w":"high","e":["2024 真题"]},{"t":"借景","y":"名词解释","p":["古典园林最重要的造景手法","将园外景物纳入园内视野","《园冶》\"得景则无拘远近\"","远借、邻借、仰借、俯借"],"q":"借景是中国古典园林最重要的造景手法，指将园外的景物有意识地组织到园内视野之中，使有限空间获得无限意境。计成《园冶》云\"借者，园虽别内外，得景则无拘远近\"。借景分远借、邻借、仰借、俯借、应时而借等，如颐和园借西山、拙政园借北寺塔，是园林艺术\"虽由人作，宛自天开\"的关键。","w":"normal","e":["核心概念"]},{"t":"风水","y":"名词解释","p":["又称堪舆","阴阳五行、八卦方位的环境选择","藏风聚气、负阴抱阳","含实践经验亦杂糅迷信"],"q":"风水又称堪舆，是中国古代关于建筑选址、朝向、布局的环境选择理论与术数。它以阴阳五行、八卦方位、气论为基础，讲究\"藏风聚气\"\"负阴抱阳\"\"背山面水\"。其中包含对地形、水文、气候、日照的实践经验，具有合理成分，但也杂糅了大量迷信内容。风水观念深刻影响了中国传统聚落、住宅与陵墓的营造。","w":"normal","e":["核心概念"]},{"t":"【原文】说淮安，今均属江苏省)","y":"教材原文","p":["说淮安，今均属江苏省)","他以《大宋宣和遗事》为蓝本，吸收了元杂剧中“水浒戏”的许多情节，经再创作而成《水浒传》","该书描写了北宋末年以"],"q":"说淮安，今均属江苏省)。他以《大宋宣和遗事》为蓝本，吸收了元杂剧中“水浒戏”的许多情节，经再创作而成《水浒传》。该书描写了北宋末年以","w":"normal","e":["原书正文"]},{"t":"【原文】宋江为首的可歌可泣的梁山","y":"教材原文","p":["宋江为首的可歌可泣的梁山农民起义的故事，反映了宋代阶级压迫的社会现实，揭示了封建社会“官逼民反”的道理，塑造了李逵、武松、林冲、"],"q":"宋江为首的可歌可泣的梁山农民起义的故事，反映了宋代阶级压迫的社会现实，揭示了封建社会“官逼民反”的道理，塑造了李逵、武松、林冲、","w":"normal","e":["原书正文"]},{"t":"【原文】鲁智深等众多英雄人物形象","y":"教材原文","p":["鲁智深等众多英雄人物形象","但宋江等人的“招安”结局，也反映了作者思想的局限性","《西游记》的作者为吴承恩(约1500——约1582年)，山阳"],"q":"鲁智深等众多英雄人物形象。但宋江等人的“招安”结局，也反映了作者思想的局限性。《西游记》的作者为吴承恩(约1500——约1582年)，山阳","w":"normal","e":["原书正文"]},{"t":"【原文】宋元话本《大唐三藏取经诗","y":"教材原文","p":["宋元话本《大唐三藏取经诗话》的基础上，经再创作而成的，是一部规模宏伟、结构完整、情节曲折、想象丰富、语言生动诙谐的艺术巨著","全书借助幻想的形式，歌颂孙悟空不畏强暴、降妖伏魔的顽强精神，肯定了孙悟空等护法取经、维护既定统治秩序的观念","《金瓶梅》，全称《金瓶梅词话》，书名取于潘金莲、李瓶儿、庞春梅等三个主要女性的名字，作者题“兰陵笑笑生”，但究竟为何人，众说纷纭，难以断定","全书借《水浒传》中西门庆与潘金莲的故事为线索，描写西门庆由发迹到毁灭的过程，展示了这个家庭肮脏丑恶的生活，揭露了明代中叶封建市侩与官僚地主相互勾结以残酷压迫百姓的事实"],"q":"宋元话本《大唐三藏取经诗话》的基础上，经再创作而成的，是一部规模宏伟、结构完整、情节曲折、想象丰富、语言生动诙谐的艺术巨著。全书借助幻想的形式，歌颂孙悟空不畏强暴、降妖伏魔的顽强精神，肯定了孙悟空等护法取经、维护既定统治秩序的观念。《金瓶梅》，全称《金瓶梅词话》，书名取于潘金莲、李瓶儿、庞春梅等三个主要女性的名字，作者题“兰陵笑笑生”，但究竟为何人，众说纷纭","w":"normal","e":["原书正文"]},{"t":"【原文】明代后期，出现了白话短篇","y":"教材原文","p":["明代后期，出现了白话短篇小说繁荣的局面，代表作有由冯梦龙编纂的“三言”(《喻世明言》《警世通言》《醒世恒言》) 和凌濛初创作的“二拍”(《初刻拍案惊奇》和《二刻拍案惊奇》)","“三言”属于宋、元、明三代短篇小说的选集，“二拍”则是凌濛初个人的创作","这些作品突出反映社会矛盾，其中大量描写市民爱情生活，对妇女命运的描述尤其生动","如“三言”中的《杜十娘怒沉百宝箱》《卖油郎独占花魁》《玉堂春落难逢夫》《沈小霞相会出师表》等，都是中国文学史上闪光的篇章"],"q":"明代后期，出现了白话短篇小说繁荣的局面，代表作有由冯梦龙编纂的“三言”(《喻世明言》《警世通言》《醒世恒言》) 和凌濛初创作的“二拍”(《初刻拍案惊奇》和《二刻拍案惊奇》)。“三言”属于宋、元、明三代短篇小说的选集，“二拍”则是凌濛初个人的创作。这些作品突出反映社会矛盾，其中大量描写市民爱情生活，对妇女命运的描述尤其生动。如“三言”中的《杜十娘怒沉百宝箱》《","w":"normal","e":["原书正文"]},{"t":"【原文】清代盛期，中国古典小说创","y":"教材原文","p":["清代盛期，中国古典小说创作也转向极盛，各种长短篇小说争相辉映，其中蒲松龄的《聊斋志异》、吴敬梓的《儒林外史》和曹雪芹的《红楼梦》，是古典小说创作的高峰","蒲松龄(1640——1715年)，淄川(今山东省淄博市)人，他的《聊斋志异》继承六朝志怪小说和唐人传奇的传统，以浪漫主义手法，借狐鬼花妖之形，写嬉笑怒骂之情，通过各种狐鬼精灵的动人故事，表现青年男女追求婚恋自由的愿望，揭露封建统治的黑暗和罪恶，抨击科举制度的腐朽和弊端，对后来的文言创作产生了巨大的影响","吴敬梓(1701——1754年)，安徽全椒人，他的《儒林外史》是一部讽刺小说，以自己的经历和体验创作而成","它从多方面揭露和抨击了封建统治的黑暗、科举八股取"],"q":"清代盛期，中国古典小说创作也转向极盛，各种长短篇小说争相辉映，其中蒲松龄的《聊斋志异》、吴敬梓的《儒林外史》和曹雪芹的《红楼梦》，是古典小说创作的高峰。蒲松龄(1640——1715年)，淄川(今山东省淄博市)人，他的《聊斋志异》继承六朝志怪小说和唐人传奇的传统，以浪漫主义手法，借狐鬼花妖之形，写嬉笑怒骂之情，通过各种狐鬼精灵的动人故事，表现青年男女追求婚恋自","w":"normal","e":["原书正文"]},{"t":"【原文】士的罪恶，生动地描写了一","y":"教材原文","p":["士的罪恶，生动地描写了一群受科举毒害和被市侩熏染的儒林形象，并将这些虚伪人物的丑恶灵魂暴露无遗，再现了封建社会末期的社会现实","曹雪芹(约1715—约1763年)，本名霑，祖籍河北省丰润县，生于南京，晚年居于北京西山，“十年增删，五易其稿”，创作了中国最伟大的古典长篇小说《红楼梦》(又名《石头记》《金玉缘》)","该书共120 回，前 80 回为曹雪芹所作，后40回为高鹗续写","全书以贾宝玉、林黛玉和薛宝钗的爱情婚姻为主线，通过一个封建大家庭的盛衰变迁，描述了家庭内外在政治、道德、文化、教育、财产诸方面错综复杂的矛盾冲突，展示了一个个青年女子的悲惨结局，和封建制度行将灭亡的历史命运，显示了作者对社会生活巨大的概括力和精确的表现力，从而使这部小说成为世界性的文学名著"],"q":"士的罪恶，生动地描写了一群受科举毒害和被市侩熏染的儒林形象，并将这些虚伪人物的丑恶灵魂暴露无遗，再现了封建社会末期的社会现实。曹雪芹(约1715—约1763年)，本名霑，祖籍河北省丰润县，生于南京，晚年居于北京西山，“十年增删，五易其稿”，创作了中国最伟大的古典长篇小说《红楼梦》(又名《石头记》《金玉缘》)。该书共120 回，前 80 回为曹雪芹所作，后40","w":"normal","e":["原书正文"]},{"t":"【原文】古典文学古典文学清代中期","y":"教材原文","p":["古典文学古典文学清代中期以后，小说创作已走向衰落，好的作品寥若晨星","值得一提的有李汝珍的《镜花缘》，叙述了唐敖等游历海外的见闻","吴趼人的《二十年目睹之怪现状》，描绘了晚清社会官场、洋场、商场的种种丑态","刘鹗的《老残游记》，展示了晚清山东一带的生活现实，揭露了所谓“清官”的暴政"],"q":"古典文学古典文学清代中期以后，小说创作已走向衰落，好的作品寥若晨星。值得一提的有李汝珍的《镜花缘》，叙述了唐敖等游历海外的见闻； 吴趼人的《二十年目睹之怪现状》，描绘了晚清社会官场、洋场、商场的种种丑态；刘鹗的《老残游记》，展示了晚清山东一带的生活现实，揭露了所谓“清官”的暴政；曾朴的《孽海花》，描写了从慈禧到妓女及三教九流的各种人物，谴责了当时社会的各种官","w":"normal","e":["原书正文"]}]},{"id":"culture-c12-s04","t":"第四节 建筑典籍","w":"high","n":9,"k":[{"t":"营造法式","y":"名词解释","p":["北宋李诫奉敕编修","1103年刊行34卷","规定设计施工用料标准","提出材分制模数体系"],"q":"《营造法式》是北宋李诫奉敕编修的建筑技术专著，刊于崇宁二年（1103年）。全书34卷，系统规定了建筑的设计规范、施工技术、用料标准与工限，提出\"材分制\"模数体系，是中国古代最完备的建筑技术典籍，对研究宋代建筑与东亚建筑影响极大。","w":"high","e":["2021 真题"]},{"t":"【原文】379年) 的艺术成就更","y":"教材原文","p":["379年) 的艺术成就更是非凡，因他曾任“右军将军”，后世称为“王右军”","王羲之被尊为“书圣”，与钟繇并称为“钟王”，与他的儿子王献之并称为“二王”","他的书法“兼摄众法，备成一家”，终于“贵越群品，古今莫二”","早在南北朝时，梁武帝就认为他的书法“字势雄逸，如龙跳天门，虎卧凤阙”，还有人说他的书法是“清风出袖，明月入怀”"],"q":"379年) 的艺术成就更是非凡，因他曾任“右军将军”，后世称为“王右军”。王羲之被尊为“书圣”，与钟繇并称为“钟王”，与他的儿子王献之并称为“二王”。他的书法“兼摄众法，备成一家”，终于“贵越群品，古今莫二”。早在南北朝时，梁武帝就认为他的书法“字势雄逸，如龙跳天门，虎卧凤阙”，还有人说他的书法是“清风出袖，明月入怀”。唐太宗甚至称赞说：“观其点曳之工，裁成","w":"normal","e":["原书正文"]},{"t":"【原文】各类艺术各类艺术3233","y":"教材原文","p":["各类艺术各类艺术323323隋唐两代是书法艺术的鼎盛阶段","这同隋唐时期高度繁荣的经济和高度辉煌的文化密不可分","由于统治阶级的提倡，书法被列为“书学”，被定为学校中的学习科目，因而无论是理论还是创作都达到了新的高度"],"q":"各类艺术各类艺术323323隋唐两代是书法艺术的鼎盛阶段。这同隋唐时期高度繁荣的经济和高度辉煌的文化密不可分。由于统治阶级的提倡，书法被列为“书学”，被定为学校中的学习科目，因而无论是理论还是创作都达到了新的高度。这一时","w":"normal","e":["原书正文"]},{"t":"【原文】本书法的影响也由此肇始","y":"教材原文","p":["本书法的影响也由此肇始","唐初的四大书法家是“虞(世南)、欧(阳询)、褚(遂良)、薛(稷)”","虞世南(558——638年) 是智永的学生、唐太宗的老"],"q":"本书法的影响也由此肇始。唐初的四大书法家是“虞(世南)、欧(阳询)、褚(遂良)、薛(稷)”。虞世南(558——638年) 是智永的学生、唐太宗的老","w":"normal","e":["原书正文"]},{"t":"【原文】师。他的书法笔圆而体方，","y":"教材原文","p":["他的书法笔圆而体方，外柔而内刚，发笔出锋如抽刀断水，传世名作有《孔子庙堂碑》","欧阳询(557——641年) 的书法以楷书为最好，用笔和结"],"q":"师。他的书法笔圆而体方，外柔而内刚，发笔出锋如抽刀断水，传世名作有《孔子庙堂碑》。欧阳询(557——641年) 的书法以楷书为最好，用笔和结","w":"normal","e":["原书正文"]},{"t":"【原文】构都有严肃的程式，字体劲","y":"教材原文","p":["构都有严肃的程式，字体劲险刻厉，于平正中见险绝，“若草里惊蛇，云间电发","又如金刚怒目，力士挥拳”，代表作有《九成宫醴泉铭》《皇甫诞碑》，"],"q":"构都有严肃的程式，字体劲险刻厉，于平正中见险绝，“若草里惊蛇，云间电发； 又如金刚怒目，力士挥拳”，代表作有《九成宫醴泉铭》《皇甫诞碑》，","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)被推为唐人楷书第一，与其子欧阳通并称“大小欧阳”","褚遂良(596——659年)"],"q":"中国文化要略(第4版)中国文化要略(第4版)被推为唐人楷书第一，与其子欧阳通并称“大小欧阳”。褚遂良(596——659年)","w":"normal","e":["原书正文"]},{"t":"【原文】被推为唐人楷书第一，与其","y":"教材原文","p":["被推为唐人楷书第一，与其子欧阳通并称“大小欧阳”","褚遂良(596——659年)的书法习王羲之、虞世南","据说他深得王羲之三昧，唐太宗把所藏王羲之墨"],"q":"被推为唐人楷书第一，与其子欧阳通并称“大小欧阳”。褚遂良(596——659年)的书法习王羲之、虞世南。据说他深得王羲之三昧，唐太宗把所藏王羲之墨","w":"normal","e":["原书正文"]},{"t":"【原文】的书法习王羲之、虞世南","y":"教材原文","p":["的书法习王羲之、虞世南","据说他深得王羲之三昧，唐太宗把所藏王羲之墨迹拿出来让他鉴别真伪，他能一一判断出来","他的书法“字里金生，行间"],"q":"的书法习王羲之、虞世南。据说他深得王羲之三昧，唐太宗把所藏王羲之墨迹拿出来让他鉴别真伪，他能一一判断出来。他的书法“字里金生，行间","w":"normal","e":["原书正文"]}]}]},{"id":"culture-c13","t":"第十三章 古典文学","w":"high","s":[{"id":"culture-c13-s01","t":"第一节 先秦文学","w":"high","n":12,"k":[{"t":"风骚","y":"名词解释","p":["风指《诗经·国风》，骚指屈原《离骚》","分别代表现实主义与浪漫主义两大传统","后世以风骚代指文学"],"q":"“风”指《诗经》中的《国风》，“骚”指屈原的《离骚》。“风骚”并称，代表了中国古典文学中现实主义与浪漫主义两大源头，后世常以“风骚”代指文学或文学成就。","w":"high","e":["2021 真题","2016 真题"]},{"t":"诗经","y":"名词解释","p":["我国第一部诗歌总集，共305篇","内容分风、雅、颂三部分","手法为赋、比、兴","奠定现实主义诗歌传统"],"q":"我国第一部诗歌总集，收录西周初年至春秋中叶约五百年的诗歌 305 篇，又称“诗三百”。按内容分为风、雅、颂三部分，艺术上多用赋、比、兴手法，奠定了中国诗歌现实主义的优良传统。","w":"high","e":["2019 真题","2015 真题"]},{"t":"楚辞","y":"名词解释","p":["屈原为代表的楚国新诗体","句式长短参差，多用“兮”字","刘向辑录成书，浪漫主义源头"],"q":"战国时期以屈原为代表的楚国诗人创造的一种新诗体，句式长短参差，多用“兮”字，富有浓郁的楚国地方色彩与浪漫主义精神。西汉刘向辑录屈原、宋玉等人作品编成《楚辞》一书，是我国第一部浪漫主义诗歌总集。","w":"high","e":["2018 真题"]},{"t":"诗经六义","y":"名词解释","p":["风雅颂为体制分类","赋比兴为表现手法","风为地方乐歌，颂为祭祀乐歌","儒家诗学核心范畴"],"q":"诗经六义指《诗经》的六种体制与表现手法，即风、雅、颂、赋、比、兴。风、雅、颂是《诗经》按音乐性质划分的三类内容：风为地方乐歌，雅为周王畿正声，颂为宗庙祭祀乐歌；赋、比、兴是表现手法：赋为铺陈直叙，比为比喻，兴为先言他物以引起所咏之词。这一体系是儒家诗学的核心范畴。","w":"normal","e":["核心概念"]},{"t":"试述宋词的发展脉络与豪放婉约两大流派","y":"名词解释","p":["晚唐五代花间与南唐词","柳永创慢词、扩大题材","苏轼以诗为词开豪放","周邦彦格律与婉约集成","李清照词别是一家","辛弃疾以文为词、苏辛并称","豪放与婉约互渗"],"q":"宋词发展脉络：晚唐五代词以温庭筠、韦庄为代表的花间派与李煜的南唐词奠定基础，题材多绮怨柔情。北宋初期晏殊、欧阳修承其余绪，词风闲雅；柳永大量创制慢词长调，铺叙羁旅行役，扩大词的体制与题材；苏轼以诗为词，开豪放一派，扩大词的境界；周邦彦精于音律、讲究章法，为婉约之集大成。南宋初期李清照倡词别是一家，以","w":"normal","e":["核心概念"]},{"t":"《诗经》中的“风”指宗庙祭祀的乐歌。","y":"名词解释","p":["风为各地民歌","雅为宫廷正乐","颂为宗庙祭祀乐歌"],"q":"错误。“风”指各地民歌民谣；“雅”为宫廷正乐；“颂”才是宗庙祭祀的乐歌。","w":"normal","e":["核心概念"]},{"t":"【原文】隋唐绘画，成就惊人，是这","y":"教材原文","p":["隋唐绘画，成就惊人，是这一时代文化昌盛的形象表现","这个阶段无论是画的种类，还是画的技巧，都显示了绘画艺术的高度发展","著名画家有隋代的展子虔，现存作品《游春图卷》采用青绿重彩渲染春天的气氛，表现了苍茫的山水烟景","这幅画解决了山水画空间的远近关系问题，使山水画从原来“水不容泛，人大于山”的幼稚阶段，达到和谐自然的成熟阶段"],"q":"隋唐绘画，成就惊人，是这一时代文化昌盛的形象表现。这个阶段无论是画的种类，还是画的技巧，都显示了绘画艺术的高度发展。著名画家有隋代的展子虔，现存作品《游春图卷》采用青绿重彩渲染春天的气氛，表现了苍茫的山水烟景。这幅画解决了山水画空间的远近关系问题，使山水画从原来“水不容泛，人大于山”的幼稚阶段，达到和谐自然的成熟阶段。唐代绘画艺术空前繁荣，涌现出许多绘画大师","w":"normal","e":["原书正文"]},{"t":"【原文】丰富了线条在中国画中的表","y":"教材原文","p":["丰富了线条在中国画中的表现力","相传他画成《地狱变相图》后，京师的屠宰户们纷纷改业","他的绘画真迹没有流传下来，现在有宋人摹画的《送子天王图》比较接近原作","吴道子之后有张萱和周昉，这两位都是描绘贵族生活的能手"],"q":"丰富了线条在中国画中的表现力。相传他画成《地狱变相图》后，京师的屠宰户们纷纷改业。他的绘画真迹没有流传下来，现在有宋人摹画的《送子天王图》比较接近原作。吴道子之后有张萱和周昉，这两位都是描绘贵族生活的能手。张萱的《虢国夫人游春图》(宋徽宗摹本)、周昉的《簪花仕女图》是他们的代表作。在二人的影响下，形成了仕女画这一画科。唐代山水画的代表人物是李思训、李昭道父子","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)330330宋代绘画继续发展","由于帝王将相及地方官吏们富于文化教养，追求更高的艺术享受，绘画艺术进入了一种新的境界","同时，城市市民阶层的兴起和商业经济的发展，也给绘画艺术开辟了新的天地","朝廷在宫内设立了翰林图画院，以考试吸收画家，产生了“院体画”，其特点是严密精细，注重法度，作品多供帝王观赏，题材多为山水、花鸟"],"q":"中国文化要略(第4版)中国文化要略(第4版)330330宋代绘画继续发展。由于帝王将相及地方官吏们富于文化教养，追求更高的艺术享受，绘画艺术进入了一种新的境界； 同时，城市市民阶层的兴起和商业经济的发展，也给绘画艺术开辟了新的天地。朝廷在宫内设立了翰林图画院，以考试吸收画家，产生了“院体画”，其特点是严密精细，注重法度，作品多供帝王观赏，题材多为山水、花鸟。","w":"normal","e":["原书正文"]},{"t":"【原文】嵩的《巴船下峡图》以及无","y":"教材原文","p":["嵩的《巴船下峡图》以及无名氏的《耕织图》《归牧图》等","宋代的大画家是织图》《归牧图》等","宋代的大画家是李公麟，他擅长人物画，所画的人物"],"q":"嵩的《巴船下峡图》以及无名氏的《耕织图》《归牧图》等。宋代的大画家是织图》《归牧图》等。宋代的大画家是李公麟，他擅长人物画，所画的人物","w":"normal","e":["原书正文"]},{"t":"【原文】李公麟，他擅长人物画，所","y":"教材原文","p":["李公麟，他擅长人物画，所画的人物能区别面貌、性格、 年龄，现存作品能区别面貌、性格、 年龄，现存作品有《五马图》《维摩居士像》和《免胄"],"q":"李公麟，他擅长人物画，所画的人物能区别面貌、性格、 年龄，现存作品能区别面貌、性格、 年龄，现存作品有《五马图》《维摩居士像》和《免胄","w":"normal","e":["原书正文"]},{"t":"【原文】有《五马图》《维摩居士像","y":"教材原文","p":["有《五马图》《维摩居士像》和《免胄图》等","米芾和米友仁父子、赵伯驹、图》等","米芾和米友仁父子、赵伯驹、李唐、刘松年、马远、夏圭多以山水画、"],"q":"有《五马图》《维摩居士像》和《免胄图》等。米芾和米友仁父子、赵伯驹、图》等。米芾和米友仁父子、赵伯驹、李唐、刘松年、马远、夏圭多以山水画、","w":"normal","e":["原书正文"]}]},{"id":"culture-c13-s02","t":"第二节 汉魏六朝文学","w":"normal","n":11,"k":[{"t":"乐府","y":"名词解释","p":["本为汉代掌乐官署","采集民歌配乐，后成诗体名","《孔雀东南飞》为代表，多叙事","唐代新乐府运动承其精神"],"q":"乐府本是汉代掌管音乐的官署，始于秦，汉武帝时规模扩大，负责采集民间歌谣、配制乐曲。后人将乐府机关采集、演唱的诗歌称为\"乐府诗\"，遂由官署名变为诗体名。汉乐府以《陌上桑》《孔雀东南飞》为代表，多叙事、善铺陈、语言质朴，开创了中国叙事诗的传统。唐代白居易等倡导新乐府运动，主张\"文章合为时而著，歌诗合为事","w":"normal","e":["核心概念"]},{"t":"骈文","y":"名词解释","p":["南北朝盛行的文体","双句为主，讲究对仗声律","四六句式，用典繁富","韩柳古文运动后渐衰"],"q":"骈文是魏晋以来形成、南北朝盛行的文体，又称\"骈体文\"\"四六文\"。其特点是通篇以双句（俪句、偶句）为主，讲究对仗工整、声律和谐、用典繁富、辞藻华丽，句式多为四字、六字相间。代表作家有庾信、徐陵，代表作《哀江南赋》《玉台新咏序》。中唐韩柳古文运动兴起后骈文渐衰，清代又一度复兴。","w":"normal","e":["核心概念"]},{"t":"建安风骨","y":"名词解释","p":["建安时期三曹与建安七子","反映动乱、抒建功立业之志","慷慨悲凉、刚健有力","后世提倡刚健文风的旗帜"],"q":"建安风骨指汉末建安时期以曹操、曹丕、曹植父子及\"建安七子\"为代表的诗歌风格。其作品继承汉乐府现实精神，反映社会动乱与人民疾苦，抒发建功立业的抱负，情感慷慨悲凉、语言刚健有力、意境雄浑阔大。刘勰《文心雕龙》称\"慷慨以任气，磊落以使才\"，后世以此作为反对绮靡诗风、提倡刚健文风的旗帜。","w":"normal","e":["核心概念"]},{"t":"【原文】考古发掘的成果已经证明，","y":"教材原文","p":["考古发掘的成果已经证明，我国的雕塑艺术可以追溯到原始氏族社会","河南省裴李岗文化遗址中已发现陶塑人像，仰韶文化遗址中出土的陶塑人像就更多，其中1964年在甘肃省礼县高寺头出土的圆雕少女头像，是仰韶文化陶塑人像的杰作","而 1986年在辽西文化遗址的牛河梁出土的陶塑裸体女神像及无头裸体女神坐像中，有一尊女神头像与真人头大小接近，眼珠用碧绿的圆玉球镶嵌而成，显得双目炯炯有神","这些雕像注意外形轮廓的健美柔和，又追求内蕴神态的感情流露，造型准确生动，形象栩栩如生，显示出我国原始雕塑已经具有惊人的艺术水平"],"q":"考古发掘的成果已经证明，我国的雕塑艺术可以追溯到原始氏族社会。河南省裴李岗文化遗址中已发现陶塑人像，仰韶文化遗址中出土的陶塑人像就更多，其中1964年在甘肃省礼县高寺头出土的圆雕少女头像，是仰韶文化陶塑人像的杰作。而 1986年在辽西文化遗址的牛河梁出土的陶塑裸体女神像及无头裸体女神坐像中，有一尊女神头像与真人头大小接近，眼珠用碧绿的圆玉球镶嵌而成，显得双目","w":"normal","e":["原书正文"]},{"t":"【原文】各类艺术各类艺术3373","y":"教材原文","p":["各类艺术各类艺术337337数量很多、阵容最大的雕塑作品，乃是发掘于陕西省西安市临潼区的秦始皇兵马俑","它是世界文化史上迄今为止空前巨大的彩色陶塑群体，仅现挖掘的部分，已出土形同真人大小的人俑、车马俑6，000多件，形成一个气势磅礴、场面肃静的军事阵局，被誉为“世界第八奇迹”","雕塑家们在创作这些人物、车马塑像的时候，注意从多方面去刻画它们的形象，揭示他们的特征，所以有的挺胸直立，目视前方，外表刚毅勇猛","有的浓眉大眼，阔口宽腮，显得勇敢机智"],"q":"各类艺术各类艺术337337数量很多、阵容最大的雕塑作品，乃是发掘于陕西省西安市临潼区的秦始皇兵马俑。它是世界文化史上迄今为止空前巨大的彩色陶塑群体，仅现挖掘的部分，已出土形同真人大小的人俑、车马俑6，000多件，形成一个气势磅礴、场面肃静的军事阵局，被誉为“世界第八奇迹”。雕塑家们在创作这些人物、车马塑像的时候，注意从多方面去刻画它们的形象，揭示他们的特征","w":"normal","e":["原书正文"]},{"t":"【原文】汉代雕塑是秦代雕塑的继承","y":"教材原文","p":["汉代雕塑是秦代雕塑的继承和发展","一方面是运用寓意手法，造成浪漫主义的艺术效果","另一方面是采取现实主义手法，展现以人与人为主要关系的现实生活","前者的代表作是陕西省兴平市霍去病墓前的《马踏匈奴》石雕"],"q":"汉代雕塑是秦代雕塑的继承和发展。一方面是运用寓意手法，造成浪漫主义的艺术效果； 另一方面是采取现实主义手法，展现以人与人为主要关系的现实生活。前者的代表作是陕西省兴平市霍去病墓前的《马踏匈奴》石雕。","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)魏晋南北朝时期由于佛教的流行，我国的雕塑艺术深受佛教的影响，以表现佛教内容为题材的雕塑作品大量出现，敦煌、云冈、龙门和麦积山四大石窟中有许多这个时期的造像","这一时期人物形象的主流仍然是体态修长、面貌清瘦、直鼻大眼、耳廓长垂的印度佛模样，在塑工上注意圆润，讲究“行云流水”","在形象上注意浓丽淳厚的色调和朴实的装饰美","在思想上，由于南北战乱，社会动荡，人们饱经苦难，因而在塑像中寄托愿望，使塑像充满宁静、飘逸、洒脱的智慧和神态，表现出人的脱俗情感"],"q":"中国文化要略(第4版)中国文化要略(第4版)魏晋南北朝时期由于佛教的流行，我国的雕塑艺术深受佛教的影响，以表现佛教内容为题材的雕塑作品大量出现，敦煌、云冈、龙门和麦积山四大石窟中有许多这个时期的造像。这一时期人物形象的主流仍然是体态修长、面貌清瘦、直鼻大眼、耳廓长垂的印度佛模样，在塑工上注意圆润，讲究“行云流水”； 在形象上注意浓丽淳厚的色调和朴实的装饰美；","w":"normal","e":["原书正文"]},{"t":"【原文】魏晋南北朝时期由于佛教的","y":"教材原文","p":["魏晋南北朝时期由于佛教的流行，我国的雕塑艺术深受佛教的影响，以表现佛教内容为题材的雕塑作品大量出现，敦煌、云冈、龙门和麦积山四大石窟中有许多这个时期的造像","这一时期人物形象的主流仍然是体态修长、面貌清瘦、直鼻大眼、耳廓长垂的印度佛模样，在塑工上注意圆润，讲究“行云流水”","在形象上注意浓丽淳厚的色调和朴实的装饰美","在思想上，由于南北战乱，社会动荡，人们饱经苦难，因而在塑像中寄托愿望，使塑像充满宁静、飘逸、洒脱的智慧和神态，表现出人的脱俗情感"],"q":"魏晋南北朝时期由于佛教的流行，我国的雕塑艺术深受佛教的影响，以表现佛教内容为题材的雕塑作品大量出现，敦煌、云冈、龙门和麦积山四大石窟中有许多这个时期的造像。这一时期人物形象的主流仍然是体态修长、面貌清瘦、直鼻大眼、耳廓长垂的印度佛模样，在塑工上注意圆润，讲究“行云流水”； 在形象上注意浓丽淳厚的色调和朴实的装饰美；在思想上，由于南北战乱，社会动荡，人们饱经苦","w":"normal","e":["原书正文"]},{"t":"【原文】333388唐代经济繁荣","y":"教材原文","p":["333388唐代经济繁荣，文化昌盛，雕塑艺术呈现出另一番辉煌气象","这一时期的雕塑作品大多色彩明快，趋于华丽","人物造型比例适度，凝练健康"],"q":"333388唐代经济繁荣，文化昌盛，雕塑艺术呈现出另一番辉煌气象。这一时期的雕塑作品大多色彩明快，趋于华丽；人物造型比例适度，凝练健康； 人物","w":"normal","e":["原书正文"]},{"t":"【原文】神情温和慈祥，具有浓郁的","y":"教材原文","p":["神情温和慈祥，具有浓郁的人情神情温和慈祥，具有浓郁的人情味和亲切感","特别是女性菩萨像，味和亲切感","特别是女性菩萨像，更是体态秀美，气度娴雅，眼含"],"q":"神情温和慈祥，具有浓郁的人情神情温和慈祥，具有浓郁的人情味和亲切感。特别是女性菩萨像，味和亲切感。特别是女性菩萨像，更是体态秀美，气度娴雅，眼含","w":"normal","e":["原书正文"]},{"t":"【原文】更是体态秀美，气度娴雅，","y":"教材原文","p":["更是体态秀美，气度娴雅，眼含柔情，嘴带微笑，极少神的韵味"],"q":"更是体态秀美，气度娴雅，眼含柔情，嘴带微笑，极少神的韵味。","w":"normal","e":["原书正文"]}]},{"id":"culture-c13-s03","t":"第三节 唐宋文学","w":"high","n":7,"k":[{"t":"唐宋八大家","y":"名词解释","p":["唐代韩愈、柳宗元，宋代欧阳修、三苏、王安石、曾巩","倡导古文运动，反对骈文","主张文以明道","确立平易畅达的散文传统"],"q":"唐代韩愈、柳宗元和宋代欧阳修、苏洵、苏轼、苏辙、王安石、曾巩八位散文家的合称。他们倡导古文运动，反对骈文浮华，主张“文以明道”，确立了平易畅达的散文传统，对后世散文发展影响深远。","w":"high","e":["2023 真题","2017 真题"]},{"t":"【原文】中国现有戏曲一共有多少种","y":"教材原文","p":["中国现有戏曲一共有多少种? 《中国戏曲曲艺词典》载有287种，实际上超过360种，其中包括了各地演出的秧歌、皮影、木偶等，因为皮影、木偶也要配有一定的曲调，表演也有一定程式，所以归入戏曲一类","京剧是流行最广、影响最大、表演艺术最成熟的一个剧种，代表了中国戏曲发展的水平","京剧在表演风格上分成京、海两大流派","京派重视基本功的训练，严格讲究艺术规范"],"q":"中国现有戏曲一共有多少种? 《中国戏曲曲艺词典》载有287种，实际上超过360种，其中包括了各地演出的秧歌、皮影、木偶等，因为皮影、木偶也要配有一定的曲调，表演也有一定程式，所以归入戏曲一类。京剧是流行最广、影响最大、表演艺术最成熟的一个剧种，代表了中国戏曲发展的水平。京剧在表演风格上分成京、海两大流派。京派重视基本功的训练，严格讲究艺术规范；海派勇于革新创","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)342342(二) 戏曲表演艺术的特点戏曲表演艺术的特点主要包含以下三点"],"q":"中国文化要略(第4版)中国文化要略(第4版)342342(二) 戏曲表演艺术的特点戏曲表演艺术的特点主要包含以下三点。","w":"normal","e":["原书正文"]},{"t":"【原文】第一是虚拟的时空环境","y":"教材原文","p":["第一是虚拟的时空环境","这一点跟西方传入的话剧有根本不同","话剧要求真实地表现生活，因此，演员的表演必须在规定的时间和空间里，即必须有一个固定的环境，野外就是野外，室内就是室内","春天有花红柳绿，秋天有落叶枯枝，人物的表演离不开这些实有的环境"],"q":"第一是虚拟的时空环境。这一点跟西方传入的话剧有根本不同。话剧要求真实地表现生活，因此，演员的表演必须在规定的时间和空间里，即必须有一个固定的环境，野外就是野外，室内就是室内；春天有花红柳绿，秋天有落叶枯枝，人物的表演离不开这些实有的环境。中国的戏曲不是这","w":"normal","e":["原书正文"]},{"t":"【原文】样，它没有固定的环境，时","y":"教材原文","p":["样，它没有固定的环境，时间和空间自由灵活，完全用虚拟的手法来表现","所谓“虚拟”，就是以虚代实，就是想象和写意","台上摆着一张桌子和两把椅子，在演员出场以前，观众不知道是什么时间和什么地点","只有演员出场以后，由剧中人通过“唱”或“念”做出交代，观众才动用自己的想象，进入剧中的时空境界"],"q":"样，它没有固定的环境，时间和空间自由灵活，完全用虚拟的手法来表现。所谓“虚拟”，就是以虚代实，就是想象和写意。台上摆着一张桌子和两把椅子，在演员出场以前，观众不知道是什么时间和什么地点。只有演员出场以后，由剧中人通过“唱”或“念”做出交代，观众才动用自己的想象，进入剧中的时空境界。如《打渔杀家》开始，萧恩、萧桂英父女上场先唱两句，交代出地点是“河下”，父女的","w":"normal","e":["原书正文"]},{"t":"【原文】各类艺术各类艺术3433","y":"教材原文","p":["各类艺术各类艺术343343第二是严格的表演程式","中国的艺术都是虚实结合，虚中有实","戏曲的虚拟依据于一定的真实生活，而虚拟的表演又不能没有规范，想怎么样就怎么样","这个规范，就是表演程式"],"q":"各类艺术各类艺术343343第二是严格的表演程式。中国的艺术都是虚实结合，虚中有实。戏曲的虚拟依据于一定的真实生活，而虚拟的表演又不能没有规范，想怎么样就怎么样。这个规范，就是表演程式。它是以生活为原型，经过艺术加工，逐渐形成的一种形式结构。它跟生活有距离，但有的近，有的远，有的虚，有的实。如开门关门的表演，虽然做一个开关的动作就可以，但必须是在什么地方关，","w":"normal","e":["原书正文"]},{"t":"【原文】曲的夸张主要在形象方面","y":"教材原文","p":["曲的夸张主要在形象方面","比如脸谱就是一种极度的夸张，忠义、宽厚的曲的夸张主要在形象方面","比如脸谱就是一种极度的夸张，忠义、宽厚的"],"q":"曲的夸张主要在形象方面。比如脸谱就是一种极度的夸张，忠义、宽厚的曲的夸张主要在形象方面。比如脸谱就是一种极度的夸张，忠义、宽厚的","w":"normal","e":["原书正文"]}]},{"id":"culture-c13-s04","t":"第四节 元明清文学","w":"high","n":10,"k":[{"t":"四大名著","y":"名词解释","p":["《三国演义》《水浒传》《西游记》《红楼梦》","《三国演义》为第一部长篇章回体小说","《红楼梦》前八十回曹雪芹，后四十回高鹗续"],"q":"指《三国演义》《水浒传》《西游记》《红楼梦》四部长篇章回体小说。《三国演义》为罗贯中所著，是我国第一部长篇章回体历史演义小说；《水浒传》相传为施耐庵所著；《西游记》为吴承恩所著；《红楼梦》前八十回为曹雪芹所著，后四十回一般认为是高鹗续成。","w":"high","e":["2022 真题","2016 真题"]},{"t":"元曲四大家","y":"名词解释","p":["关汉卿、白朴、马致远、郑光祖","关汉卿为四大家之首，代表作《窦娥冤》","与唐诗宋词并称"],"q":"指元代杂剧作家关汉卿、白朴、马致远、郑光祖。关汉卿被誉为“元曲四大家”之首，代表作《窦娥冤》；白朴《梧桐雨》；马致远《汉宫秋》；郑光祖《倩女离魂》。元曲与唐诗、宋词并称，是中国韵文史上的高峰。","w":"high","e":["2020 真题"]},{"t":"汤显祖与临川派","y":"名词解释","p":["汤显祖，江西临川人，代表作《牡丹亭》","临川四梦：《牡丹亭》《紫钗记》《南柯记》《邯郸记》","主张重情采，与沈璟吴江派对立"],"q":"汤显祖是明代万历年间著名戏曲家，江西临川人，代表作“临川四梦”中以《牡丹亭》最为著名。他主张戏曲创作应以“情”为主，不受格律束缚，形成了以文采见长的“临川派”（又称玉茗堂派），与沈璟为首的“吴江派”形成对立。","w":"high","e":["2024 真题","2019 真题"]},{"t":"公安派","y":"名词解释","p":["明代后期三袁为代表","湖北公安人","独抒性灵，不拘格套","反对前后七子复古模拟"],"q":"公安派是明代后期以袁宏道、袁宗道、袁中道三兄弟为代表的文学流派，因三人为湖北公安人而得名。他们受李贽童心说影响，提出\"独抒性灵，不拘格套\"的文学主张，反对前后七子的复古模拟，强调作家真情实感与个性表现。公安派的文学解放思潮对晚明小品文与清代性灵派产生了深远影响。","w":"normal","e":["核心概念"]},{"t":"桐城派","y":"名词解释","p":["清代最大散文流派","方苞、刘大櫆、姚鼐为代表","方苞义法说，姚鼐义理考据辞章","主盟文坛二百余年"],"q":"桐城派是清代最大的散文流派，由方苞开创，经刘大櫆、姚鼐发展完善，因三人均为安徽桐城人而得名。方苞提出\"义法\"说，刘大櫆讲\"神气音节\"，姚鼐提出义理、考据、辞章三者统一，并编《古文辞类纂》确立古文统系。桐城派主盟清代文坛二百余年，影响直至近代。","w":"normal","e":["核心概念"]},{"t":"【原文】所谓“变文”，是一种说唱","y":"教材原文","p":["所谓“变文”，是一种说唱艺术，它起于佛教的讲经宣传","佛教为了扩大影响，采取民间说唱形式宣扬佛教故事，从而形成了一种新的音乐文化，并由寺院走向民间","变文内容有故事情节，演唱时讲究音律节拍，很受人们的欢迎，后来发展为宋元时的“诸宫调”","唐代音乐的这种大发展，使得歌手、音乐家和音乐著作大量出现，描写音乐活动的唐诗也举不胜举"],"q":"所谓“变文”，是一种说唱艺术，它起于佛教的讲经宣传。佛教为了扩大影响，采取民间说唱形式宣扬佛教故事，从而形成了一种新的音乐文化，并由寺院走向民间。变文内容有故事情节，演唱时讲究音律节拍，很受人们的欢迎，后来发展为宋元时的“诸宫调”。唐代音乐的这种大发展，使得歌手、音乐家和音乐著作大量出现，描写音乐活动的唐诗也举不胜举。较为重要的音乐著作有《乐书要录》(传武则","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版中国","y":"教材原文","p":["中国文化要略(第4版中国文化要略(第4版3 483 48宋元时代，城市的商业经济进一步发展，市民阶层也进一步壮大，与之相适应的音乐艺术也随之产生","但从音乐思想上来说，由于理学的形成及其影响，在音乐理论方面出现了复古主义倾向","这似乎很矛盾，但其实却是很自然的现象","因为日益发展的市民阶层的艺术与儒家的正统说教成为一种对照，所以理学家们就会出来维护儒学的正统地位"],"q":"中国文化要略(第4版中国文化要略(第4版3 483 48宋元时代，城市的商业经济进一步发展，市民阶层也进一步壮大，与之相适应的音乐艺术也随之产生。但从音乐思想上来说，由于理学的形成及其影响，在音乐理论方面出现了复古主义倾向。这似乎很矛盾，但其实却是很自然的现象。因为日益发展的市民阶层的艺术与儒家的正统说教成为一种对照，所以理学家们就会出来维护儒学的正统地位。","w":"normal","e":["原书正文"]},{"t":"【原文】从明代初年到鸦片战争前夕","y":"教材原文","p":["从明代初年到鸦片战争前夕，是我国封建社会的后期","这一时期一方面是明清贵族的残暴统治，另一方面是资本主义经济因素的出现，反映在音乐上是某些创作和理论的战斗意识和复古主义并存","但是，由于科学技术的发展，乐律的研究获得划时代的成就","这一时期音乐艺术的重要特点之一是民歌异常活跃，尤以情歌为多，内容表现出要求自由和个性解放"],"q":"从明代初年到鸦片战争前夕，是我国封建社会的后期。这一时期一方面是明清贵族的残暴统治，另一方面是资本主义经济因素的出现，反映在音乐上是某些创作和理论的战斗意识和复古主义并存。但是，由于科学技术的发展，乐律的研究获得划时代的成就。这一时期音乐艺术的重要特点之一是民歌异常活跃，尤以情歌为多，内容表现出要求自由和个性解放。因此明人说：“我明诗让唐，词让宋，曲让元，庶","w":"normal","e":["原书正文"]},{"t":"【原文】各类艺术各类艺术3493","y":"教材原文","p":["各类艺术各类艺术349349说到十二平均律，有必要交代一下古音律的一些知识","五音也称“五声”，是中国古代五个音阶的总称，即宫、商、角 (jué)、徵(zhǐ )、羽, 相当于现代音乐的1、2、3、5、6, 是在阴阳五行学说影响下产生的音乐形态，也是中国古代音乐和音阶形式的基础"],"q":"各类艺术各类艺术349349说到十二平均律，有必要交代一下古音律的一些知识。首先说“五音”。五音也称“五声”，是中国古代五个音阶的总称，即宫、商、角 (jué)、徵(zhǐ )、羽, 相当于现代音乐的1、2、3、5、6, 是在阴阳五行学说影响下产生的音乐形态，也是中国古代音乐和音阶形式的基础。如果某个人不善","w":"normal","e":["原书正文"]},{"t":"【原文】唱歌，常以“五音不全”自","y":"教材原文","p":["唱歌，常以“五音不全”自谦","五音理论在春秋战国时已经形成，之后一直是中国音乐的基本形态","其次说“七音”，或称“七律”","这是五音的进一步发展，即在角徵、羽宫之间各出一个偏音，即现代音乐简谱中的4、7"],"q":"唱歌，常以“五音不全”自谦。五音理论在春秋战国时已经形成，之后一直是中国音乐的基本形态。其次说“七音”，或称“七律”。这是五音的进一步发展，即在角徵、羽宫之间各出一个偏音，即现代音乐简谱中的4、7。但这两个音既可比徵和宫低半个音，称为“变徵”和“变宫”，排成音阶为宫、商、角、变徵、徵、羽、变宫；也可比角和羽高半个音，称为“清角”和“闰”，排成音阶为宫、商、角","w":"normal","e":["原书正文"]}]}]},{"id":"culture-c14","t":"第十四章 各类艺术","w":"high","s":[{"id":"culture-c14-s01","t":"第一节 书法艺术","w":"high","n":15,"k":[{"t":"颜筋柳骨","y":"名词解释","p":["颜真卿柳公权并称","颜体丰腴雄浑筋骨内含","柳体骨力遒劲结体严紧","代表唐代楷书最高成就"],"q":"颜筋柳骨是后人对唐代书法家颜真卿与柳公权书法风格的并称。颜真卿书法丰腴雄浑、筋骨内含，如《多宝塔碑》《颜勤礼碑》；柳公权书法骨力遒劲、结体严紧，如《玄秘塔碑》《神策军碑》。二人并称\"颜柳\"，代表了唐代楷书的最高成就。","w":"high","e":["2020 真题"]},{"t":"楷书四大家","y":"名词解释","p":["欧阳询、颜真卿、柳公权、赵孟頫","欧阳询《九成宫醴泉铭》为天下第一楷书","颜筋柳骨并称","赵体圆润清秀"],"q":"指唐代欧阳询、颜真卿、柳公权和元代赵孟頫。欧阳询楷书劲险刻厉，于平正中见险绝，代表作《九成宫醴泉铭》；颜真卿端庄雄伟，代表作《多宝塔碑》；柳公权骨力遒劲，与颜真卿并称“颜筋柳骨”；赵孟頫圆润清秀，世称“赵体”。","w":"high","e":["2024 真题","2020 真题"]},{"t":"京剧四大名旦","y":"名词解释","p":["梅兰芳、尚小云、程砚秋、荀慧生","梅派圆润大方，代表作《贵妃醉酒》","程派幽咽婉转，代表作《锁麟囊》","代表京剧旦角艺术最高成就"],"q":"指梅兰芳、尚小云、程砚秋、荀慧生四位京剧旦角表演艺术家。梅兰芳创“梅派”，唱腔圆润大方，代表作《贵妃醉酒》；尚小云创“尚派”，刚健婀娜；程砚秋创“程派”，幽咽婉转，代表作《锁麟囊》；荀慧生创“荀派”，活泼俏丽。四人代表京剧旦角艺术的最高成就。","w":"high","e":["2024 真题","2018 真题"]},{"t":"试论中国传统戏曲的艺术特征","y":"名词解释","p":["唱念做打综合一体","虚拟性以鞭代马以桨代船","程式性规范严格","写意性追求神似","生旦净丑行当化","流派纷呈世界三大体系"],"q":"中国传统戏曲的艺术特征主要有：①综合性，融唱、念、做、打于一体，综合文学、音乐、舞蹈、美术、武术；②虚拟性，舞台上不设实景，以鞭代马、以桨代船，通过演员表演虚拟出时空；③程式性，唱腔、念白、身段、脸谱、服装均有严格规范；④写意性，追求神似而非形似，重意境营造；⑤角色行当化，分生、旦、净、丑四大行当；","w":"high","e":["2022 真题"]},{"t":"试论《红楼梦》的思想内容与艺术成就","y":"名词解释","p":["四大家族兴衰与宝黛爱情悲剧","揭露封建末世腐朽与礼教批判","人物塑造高度个性化","结构宏大严谨、语言洗练","打破大团圆传统的悲剧结局"],"q":"思想内容：以贾、史、王、薛四大家族兴衰为背景，以宝黛爱情悲剧为主线，深刻揭露封建末世的腐朽与必然衰亡的命运，批判封建礼教与科举制度，具有深刻的现实主义精神。艺术成就：①人物形象塑造高度个性化，塑造了众多性格鲜明的人物；②结构宏大而严谨，多条线索交织推进；③语言洗练自然，兼具雅俗；④细节描写精微，生活","w":"high","e":["2022 真题"]},{"t":"京剧脸谱","y":"名词解释","p":["程式化面部化妆图案","红忠、黑直、白奸","色彩象征人物性格品质"],"q":"京剧演员面部化妆的程式化图案，通过不同色彩与纹样象征人物性格与品质。红脸表示忠勇正义，如关羽；黑脸表示刚直勇猛，如包拯、张飞；白脸表示奸诈多疑，如曹操；蓝脸、绿脸多表示草莽英雄；金银脸多用于神佛。","w":"normal","e":["核心概念"]},{"t":"书法的\"永字八法\"","y":"名词解释","p":["以\"永\"字八种笔画为法","侧勒努趯策掠啄磔","楷书笔画写法要领"],"q":"永字八法是古代书法用笔的基本法则，因\"永\"字包含八种基本笔画而得名：侧（点）、勒（横）、努（竖）、趯（钩）、策（提）、掠（长撇）、啄（短撇）、磔（捺）。它系统概括了楷书笔画的写法要领，是学习书法的重要入门法则。","w":"normal","e":["核心概念"]},{"t":"【原文】一人为大 大邦大国大明君","y":"教材原文","p":["一人为大 大邦大国大明君又如有一个贪官叫李儒卿，人们把他的名字拆开作一联讽刺："],"q":"一人为大 大邦大国大明君又如有一个贪官叫李儒卿，人们把他的名字拆开作一联讽刺：","w":"normal","e":["原书正文"]},{"t":"【原文】又如有一个贪官叫李儒卿，","y":"教材原文","p":["又如有一个贪官叫李儒卿，人们把他的名字拆开作一联讽刺："],"q":"又如有一个贪官叫李儒卿，人们把他的名字拆开作一联讽刺：","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)本非正人 装作雷公模样 却少三分面目本非正人 装作雷公模样 却少三分面目惯开私卯 会打银子主意 绝无一点良心"],"q":"中国文化要略(第4版)中国文化要略(第4版)本非正人 装作雷公模样 却少三分面目本非正人 装作雷公模样 却少三分面目惯开私卯 会打银子主意 绝无一点良心","w":"normal","e":["原书正文"]},{"t":"【原文】惯开私卯 会打银子主意 ","y":"教材原文","p":["惯开私卯 会打银子主意 绝无一点良心此联上联拆“儒” (“人”, “雷”的“雨”,“面”去三横为“而”), 下联拆 “卿” (“卯”, “银” 的 “艮”, “良” 无一点为 “艮”) 字"],"q":"惯开私卯 会打银子主意 绝无一点良心此联上联拆“儒” (“人”, “雷”的“雨”,“面”去三横为“而”), 下联拆 “卿” (“卯”, “银” 的 “艮”, “良” 无一点为 “艮”) 字。","w":"normal","e":["原书正文"]},{"t":"【原文】此联上联拆“儒” (“人","y":"教材原文","p":["此联上联拆“儒” (“人”, “雷”的“雨”,“面”去三横为“而”), 下联拆 “卿” (“卯”, “银” 的 “艮”, “良” 无一点为 “艮”) 字"],"q":"此联上联拆“儒” (“人”, “雷”的“雨”,“面”去三横为“而”), 下联拆 “卿” (“卯”, “银” 的 “艮”, “良” 无一点为 “艮”) 字。","w":"normal","e":["原书正文"]},{"t":"【原文】356356悲哉 秋之为","y":"教材原文","p":["356356悲哉 秋之为气悲哉 秋之为气惨矣 瑾其可怀惨矣 瑾其可怀又如袁世凯窃据总统之位后，有人曾为他题联："],"q":"356356悲哉 秋之为气悲哉 秋之为气惨矣 瑾其可怀惨矣 瑾其可怀又如袁世凯窃据总统之位后，有人曾为他题联：","w":"normal","e":["原书正文"]},{"t":"【原文】东塔寺和尚 朝南坐北吃西","y":"教材原文","p":["东塔寺和尚 朝南坐北吃西瓜春水庵尼姑 自夏至冬穿秋衣上联嵌“东南西北”， 下联嵌“春夏秋冬”"],"q":"东塔寺和尚 朝南坐北吃西瓜春水庵尼姑 自夏至冬穿秋衣上联嵌“东南西北”， 下联嵌“春夏秋冬”。","w":"normal","e":["原书正文"]},{"t":"【原文】重重叠叠山 曲曲环环路叮","y":"教材原文","p":["重重叠叠山 曲曲环环路叮叮咚咚泉 高高低低树又如苏州市网师园联："],"q":"重重叠叠山 曲曲环环路叮叮咚咚泉 高高低低树又如苏州市网师园联：","w":"normal","e":["原书正文"]}]},{"id":"culture-c14-s02","t":"第二节 绘画艺术","w":"normal","n":10,"k":[{"t":"文人画","y":"名词解释","p":["文人学士创作，苏轼首倡","重神韵意趣、轻形似","山水花鸟梅兰竹菊为题材","诗书画印四者结合"],"q":"文人画是中国传统绘画中由文人学士创作、以抒发主观情趣为旨归的画种，又称\"士人画\"，由苏轼首倡其说，经元四家、明董其昌发展成熟。其特点是重神韵意趣而轻形似工整，多以山水、花鸟、梅兰竹菊为题材，讲求诗、书、画、印四者结合，追求\"逸笔草草，不求形似\"的境界，体现了文人的人格理想与审美情趣。","w":"normal","e":["核心概念"]},{"t":"工笔与写意","y":"名词解释","p":["中国画两种基本技法","工笔工整细致、层层渲染","写意简练豪放、重在传神","分小写意与大写意"],"q":"工笔与写意是中国画两种基本的表现技法。工笔又称\"细笔\"，用笔工整细致、设色层层渲染、造型精微谨严，多用于人物、花鸟，如宋代院体画；写意又称\"粗笔\"，用笔简练豪放、以少胜多、重在传神，通过笔墨的浓淡干湿表现物象神韵，又分小写意与大写意。二者一工一放，代表了中国画两种不同的审美取向。","w":"normal","e":["核心概念"]},{"t":"【原文】玉器的文化内质，与中国玉","y":"教材原文","p":["玉器的文化内质，与中国玉器的文化内质，与中国传统文化的特质正相 一传统文化的特质正相 一致","玉的出现和玉器的使致","玉的出现和玉器的使"],"q":"玉器的文化内质，与中国玉器的文化内质，与中国传统文化的特质正相 一传统文化的特质正相 一致。玉的出现和玉器的使致。玉的出现和玉器的使","w":"normal","e":["原书正文"]},{"t":"【原文】用，最早是因为符合远古用","y":"教材原文","p":["用，最早是因为符合远古用，最早是因为符合远古先民的审美意识和审美情先民的审美意识和审美情趣，但同时也给原始宗教趣，但同时也给原始宗教"],"q":"用，最早是因为符合远古用，最早是因为符合远古先民的审美意识和审美情先民的审美意识和审美情趣，但同时也给原始宗教趣，但同时也给原始宗教","w":"normal","e":["原书正文"]},{"t":"【原文】信仰提供了很好的物质载信","y":"教材原文","p":["信仰提供了很好的物质载信仰提供了很好的物质载体，成为当时社会的一道体，成为当时社会的一道亮色","玉器除了用作各种佩饰以外，还雕刻成“玉龙”“玉凤”“玉龟”等，"],"q":"信仰提供了很好的物质载信仰提供了很好的物质载体，成为当时社会的一道体，成为当时社会的一道亮色。玉器除了用作各种佩饰以外，还雕刻成“玉龙”“玉凤”“玉龟”等，","w":"normal","e":["原书正文"]},{"t":"【原文】亮色。玉器除了用作各种佩","y":"教材原文","p":["玉器除了用作各种佩饰以外，还雕刻成“玉龙”“玉凤”“玉龟”等，第十五章第十五章精美器物精美器物用作部落图腾的标志","随着奴隶社会的形成，玉又逐步用来表示等级和权力"],"q":"亮色。玉器除了用作各种佩饰以外，还雕刻成“玉龙”“玉凤”“玉龟”等，第十五章第十五章精美器物精美器物用作部落图腾的标志。随着奴隶社会的形成，玉又逐步用来表示等级和权力。","w":"normal","e":["原书正文"]},{"t":"【原文】《周礼·春官》说“以玉作","y":"教材原文","p":["《周礼·春官》说“以玉作六瑞，以等邦国”，就是以六种瑞器显示六等爵位《周礼·春官》说“以玉作六瑞，以等邦国”，就是以六种瑞器显示六等爵位"],"q":"《周礼·春官》说“以玉作六瑞，以等邦国”，就是以六种瑞器显示六等爵位《周礼·春官》说“以玉作六瑞，以等邦国”，就是以六种瑞器显示六等爵位","w":"normal","e":["原书正文"]},{"t":"【原文】363363标准：王执“","y":"教材原文","p":["363363标准：王执“镇圭”、公执“桓圭”、侯执“信圭”、伯执“躬圭”、子执“谷璧”、男执“蒲璧”","“以玉作六器，以礼天地四方”，则是以六种礼器祭祀天地与"],"q":"363363标准：王执“镇圭”、公执“桓圭”、侯执“信圭”、伯执“躬圭”、子执“谷璧”、男执“蒲璧”；“以玉作六器，以礼天地四方”，则是以六种礼器祭祀天地与","w":"normal","e":["原书正文"]},{"t":"【原文】东南西北四方，如祭天用“","y":"教材原文","p":["东南西北四方，如祭天用“璧”，祭地用“琮”，祭东用“圭”，祭南用“璋”，祭西用“琥”，祭北用“璜”","儒学出现以后，玉被用来承载儒家的伦理道德，"],"q":"东南西北四方，如祭天用“璧”，祭地用“琮”，祭东用“圭”，祭南用“璋”，祭西用“琥”，祭北用“璜”。儒学出现以后，玉被用来承载儒家的伦理道德，","w":"normal","e":["原书正文"]},{"t":"【原文】使玉成为人格象征","y":"教材原文","p":["使玉成为人格象征","孔子提出“君子比德于玉”，认为玉“温润而泽，仁也"],"q":"使玉成为人格象征。孔子提出“君子比德于玉”，认为玉“温润而泽，仁也；","w":"normal","e":["原书正文"]}]},{"id":"culture-c14-s03","t":"第三节 戏曲艺术","w":"normal","n":7,"k":[{"t":"生旦净丑","y":"名词解释","p":["京剧四大行当","生为男性正面角色","旦为女性角色","净为花脸，丑为喜剧角色"],"q":"生旦净丑是京剧（戏曲）的四大行当。生为男性正面角色，分老生、小生、武生等；旦为女性角色，分青衣、花旦、老旦、武旦等；净俗称\"花脸\"，多为性格豪迈或奸诈的男性，以脸谱化妆为特征，分正净、副净、武净；丑为喜剧角色，鼻梁涂白，分文丑、武丑。行当体制是中国戏曲程式化表演的核心。","w":"normal","e":["核心概念"]},{"t":"【原文】记载，汉武帝“元鼎”年号","y":"教材原文","p":["记载，汉武帝“元鼎”年号就与出土大鼎有直接关系","可以说，中国古代青铜器埋藏的范围之广，数量之丰，是世界上少有的","陕西关中地带是周秦汉唐的王都所在，随帝王公卿下葬的青铜器更是难以胜数，历史上在这个区域内屡有重大考古发现，仅从 1949 年新中国成立到 1979年的30年间，就在这里先后出土商周青铜器3，000余件","1976 年 12 月在扶风县出土了微氏家族铜器群，一个窖藏就藏有103件精美的青铜制品"],"q":"记载，汉武帝“元鼎”年号就与出土大鼎有直接关系。可以说，中国古代青铜器埋藏的范围之广，数量之丰，是世界上少有的。陕西关中地带是周秦汉唐的王都所在，随帝王公卿下葬的青铜器更是难以胜数，历史上在这个区域内屡有重大考古发现，仅从 1949 年新中国成立到 1979年的30年间，就在这里先后出土商周青铜器3，000余件。1976 年 12 月在扶风县出土了微氏家族铜","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)368368如前所述，商周时期是中国青铜器极度兴盛的时期，是中国青铜文化最辉煌的时期","这一时期的青铜制品不但数量众多，制作精良，而且品种丰富，形制瑰异、花纹繁缛、富丽堂皇","其中许多制品是用于国家大礼的重器","《左传》说“国之大事，在祀与戎”，“祀”就是国家的公祭仪式，“戎”就是国家的军事行动"],"q":"中国文化要略(第4版)中国文化要略(第4版)368368如前所述，商周时期是中国青铜器极度兴盛的时期，是中国青铜文化最辉煌的时期。这一时期的青铜制品不但数量众多，制作精良，而且品种丰富，形制瑰异、花纹繁缛、富丽堂皇。其中许多制品是用于国家大礼的重器。《左传》说“国之大事，在祀与戎”，“祀”就是国家的公祭仪式，“戎”就是国家的军事行动。鉴于青铜器坚实、厚重和耐","w":"normal","e":["原书正文"]},{"t":"【原文】概括说来，商周时期的青铜","y":"教材原文","p":["概括说来，商周时期的青铜器，主要分为礼器、乐器、兵器和杂器，礼器又分食器、酒器和水器","各种器物都依据用途和等级限定有不同的造型和名称，如食器有鼎、簋、鬲、、簠、敦、、、盂、桓、铺等，酒器有爵、、、、、彝、卣、壶、樽、缶、罍、孟等，水器有盘、匹、洗、盆等","乐器有铙、钲、钟、鼓，兵器有戈、矛、钺、刀、剑等","礼器和乐器不能在一般的生活场合使用，而必须陈设在庙堂用于祭祀，或者用于宴飨、盥洗，因此非常神圣与隆重"],"q":"概括说来，商周时期的青铜器，主要分为礼器、乐器、兵器和杂器，礼器又分食器、酒器和水器。各种器物都依据用途和等级限定有不同的造型和名称，如食器有鼎、簋、鬲、、簠、敦、、、盂、桓、铺等，酒器有爵、、、、、彝、卣、壶、樽、缶、罍、孟等，水器有盘、匹、洗、盆等。乐器有铙、钲、钟、鼓，兵器有戈、矛、钺、刀、剑等。礼器和乐器不能在一般的生活场合使用，而必须陈设在庙堂用于","w":"normal","e":["原书正文"]},{"t":"【原文】鼎，用以烹饪的器具，常于","y":"教材原文","p":["鼎，用以烹饪的器具，常于祭祀或典礼时炖煮和盛放猪牛羊肉等食物，相当于现在的锅，但在商周时期却成了象征统治权威的国家重器","据传大禹立国之前，曾经铸造九鼎以象征九州，并在上面镌刻魑魅魍魉的图形以警戒世人","鼎由此成为立国与传国的重器，后来的奴隶主贵族便用它来“别上下、明贵贱”","史载西周“天子九鼎，诸侯七鼎，卿大夫五鼎，士三鼎或一鼎”"],"q":"鼎，用以烹饪的器具，常于祭祀或典礼时炖煮和盛放猪牛羊肉等食物，相当于现在的锅，但在商周时期却成了象征统治权威的国家重器。据传大禹立国之前，曾经铸造九鼎以象征九州，并在上面镌刻魑魅魍魉的图形以警戒世人。鼎由此成为立国与传国的重器，后来的奴隶主贵族便用它来“别上下、明贵贱”。史载西周“天子九鼎，诸侯七鼎，卿大夫五鼎，士三鼎或一鼎”。鼎的基本形式有圆形，三足两耳；","w":"normal","e":["原书正文"]},{"t":"【原文】由于鼎在古代青铜器中的重","y":"教材原文","p":["由于鼎在古代青铜器中的重要地位，“鼎”在汉语中组成很多成语，如“一言九鼎”“一代鼎臣”“人声鼎沸”“问鼎中原”等"],"q":"由于鼎在古代青铜器中的重要地位，“鼎”在汉语中组成很多成语，如“一言九鼎”“一代鼎臣”“人声鼎沸”“问鼎中原”等。","w":"normal","e":["原书正文"]},{"t":"【原文】簋，盛放食物的器具，古人","y":"教材原文","p":["簋，盛放食物的器具，古人在宴饮时席地而坐，簋即置于席上，所以簋的下面多附有三足、四足或方座","它自商代开始出现，一直延续到战国时期，造型多样，变化复杂，有圆体、方体或上圆下方，两边有耳或环，常与鼎搭配使用","在西周时期，使用铜簋有严格的等级规定，与鬲一样，与鼎搭配以偶数出现，如天子用九鼎八簋，诸侯七鼎六簋，大夫五鼎四簋，士三鼎二簋","已经出土的簋很多，各地博物馆都有藏品"],"q":"簋，盛放食物的器具，古人在宴饮时席地而坐，簋即置于席上，所以簋的下面多附有三足、四足或方座。它自商代开始出现，一直延续到战国时期，造型多样，变化复杂，有圆体、方体或上圆下方，两边有耳或环，常与鼎搭配使用。在西周时期，使用铜簋有严格的等级规定，与鬲一样，与鼎搭配以偶数出现，如天子用九鼎八簋，诸侯七鼎六簋，大夫五鼎四簋，士三鼎二簋。已经出土的簋很多，各地博物馆都","w":"normal","e":["原书正文"]}]}]},{"id":"culture-c15","t":"第十五章 精美器物","w":"high","s":[{"id":"culture-c15-s01","t":"第一节 青铜器","w":"high","n":11,"k":[{"t":"青铜器","y":"名词解释","p":["铜锡铅合金","夏代始，商周鼎盛","礼器乐器兵器生活用器","饕餮纹、司母戊鼎、四羊方尊"],"q":"青铜是铜与锡、铅的合金。我国青铜器始于夏代，商周达到鼎盛，主要用于礼器、乐器、兵器与生活用具。商周青铜器造型厚重、纹饰繁缛，常见饕餮纹、夔龙纹，代表器物有司母戊鼎、四羊方尊，是研究上古礼制与工艺的重要实物。","w":"high","e":["2019 真题","2015 真题"]},{"t":"青铜礼器","y":"名词解释","p":["商周祭祀宴飨礼仪用器","藏礼于器的宗法等级体现","鼎簋尊卣爵觚等","列鼎制度天子九鼎"],"q":"青铜礼器是商周时期用于祭祀、宴飨、朝聘等重要礼仪活动的青铜器，是\"藏礼于器\"的宗法等级制度的物化体现。主要种类有鼎、簋、尊、卣、爵、觚等，其中鼎为最重要的礼器，用以\"明尊卑、别上下\"，天子九鼎、诸侯七鼎、大夫五鼎，形成严格的列鼎制度。","w":"high","e":["2017 真题"]},{"t":"司母戊鼎","y":"名词解释","p":["商代后期青铜方鼎","1939年安阳武官村出土","重832.84公斤最重青铜器","现藏中国国家博物馆"],"q":"司母戊鼎（又称后母戊鼎）是商代后期铸造的青铜方鼎，1939年出土于河南安阳武官村。鼎高133厘米、口长110厘米、重832.84公斤，是迄今出土最重的中国古代青铜器。鼎腹内壁铸有\"司母戊\"三字铭文，为商王祖庚或祖甲为祭祀其母戊所铸，现藏中国国家博物馆。","w":"high","e":["2019 真题"]},{"t":"鼎","y":"名词解释","p":["青铜礼器，源于陶鼎","圆腹三足两耳，亦有方鼎","权力等级象征，问鼎喻图谋王位","列鼎制度天子九鼎"],"q":"鼎是中国古代最重要的青铜礼器，由新石器时代的陶鼎演变而来，形状多为圆腹、三足、两耳，亦有方鼎四足。鼎本为炊器，后成为祭祀与宴飨的礼器，是权力与等级的象征，\"问鼎\"即喻图谋王位。相传夏禹铸九鼎象征九州，为传国之宝。西周列鼎制度规定天子九鼎、诸侯七鼎、大夫五鼎，等级森严。","w":"normal","e":["核心概念"]},{"t":"青铜器是铜与铁的合金。","y":"名词解释","p":["青铜为铜锡铅合金","因色青灰得名"],"q":"错误。青铜是铜与锡、铅的合金，因颜色青灰而得名，与铁无关。","w":"normal","e":["核心概念"]},{"t":"【原文】进入明清两代，中国的瓷器","y":"教材原文","p":["进入明清两代，中国的瓷器生产达到鼎盛，产品的数量之大和质量之高均前所未有","由于明代的社会经济出现了资本主义因素，市场对瓷器生产的需求增加，各地工匠和制瓷高手纷纷涌向日益繁荣的景德镇，形成了“工匠八方来，器成天下走”的局面","于是景德镇的制瓷业突飞猛进，景德镇也很快发展成为全国的瓷业中心，最终确立了它作为“中国瓷都”的地位"],"q":"进入明清两代，中国的瓷器生产达到鼎盛，产品的数量之大和质量之高均前所未有。由于明代的社会经济出现了资本主义因素，市场对瓷器生产的需求增加，各地工匠和制瓷高手纷纷涌向日益繁荣的景德镇，形成了“工匠八方来，器成天下走”的局面。于是景德镇的制瓷业突飞猛进，景德镇也很快发展成为全国的瓷业中心，最终确立了它作为“中国瓷都”的地位。","w":"normal","e":["原书正文"]},{"t":"【原文】中国瓷器外销的历史始于隋","y":"教材原文","p":["中国瓷器外销的历史始于隋唐，那时外销的产品主要是越窑的青瓷、邢窑和定窑的白瓷以及长沙窑的彩绘瓷等，外销地主要是日本、朝鲜半岛、东南亚地区，也有到印度、巴基斯坦和斯里兰卡的","宋元以后，海上贸易进入繁荣阶段，出现了广州、泉州、明州(今浙江省宁波市)、杭州、秀州(辖境相当于除今天海宁市以外的杭州湾以北、桐乡市以东地区及上海市所辖吴淞江以南地区) 等贸易大港，为此，北宋朝廷从开宝四年(971年) 开始，陆续在上述地方设置“市舶司”(类似今天的海关)，专门用来管理进出口事务，瓷器便是主要的外销商品","这些外销瓷器，宋元时代主要是江西景德镇窑、浙江龙泉窑和福建德化窑的产品，也有陕西耀州窑、河南汝州窑，甚至广东、广西一带窑场的产品","自元朝政府在景德镇设立“浮梁瓷局”之后，景德镇窑获得发展良机，制瓷工艺迅速提高，所烧制的青花瓷成为最受欢迎的产品"],"q":"中国瓷器外销的历史始于隋唐，那时外销的产品主要是越窑的青瓷、邢窑和定窑的白瓷以及长沙窑的彩绘瓷等，外销地主要是日本、朝鲜半岛、东南亚地区，也有到印度、巴基斯坦和斯里兰卡的。宋元以后，海上贸易进入繁荣阶段，出现了广州、泉州、明州(今浙江省宁波市)、杭州、秀州(辖境相当于除今天海宁市以外的杭州湾以北、桐乡市以东地区及上海市所辖吴淞江以南地区) 等贸易大港，为此，","w":"normal","e":["原书正文"]},{"t":"【原文】精美器物精美器物3753","y":"教材原文","p":["精美器物精美器物375375明朝建立伊始，一度实行海禁，但并没有杜绝瓷器出口","官方对外国的馈赠以及民间贸易都是瓷器出口的渠道","郑和下西洋的大规模远航行动，也带有数量巨大的瓷器","明中期以后重新开关，合法的对外贸易迅速活跃起来"],"q":"精美器物精美器物375375明朝建立伊始，一度实行海禁，但并没有杜绝瓷器出口。官方对外国的馈赠以及民间贸易都是瓷器出口的渠道。郑和下西洋的大规模远航行动，也带有数量巨大的瓷器。明中期以后重新开关，合法的对外贸易迅速活跃起来。从明代中晚期到清代初年，瓷器外销进入黄金时期，出口瓷器主要是青花瓷，也有白瓷和彩瓷，产品多为外国定制，造型与图案增加了外邦色彩。欧洲贵族","w":"normal","e":["原书正文"]},{"t":"【原文】到了 18世纪下半叶，欧","y":"教材原文","p":["到了 18世纪下半叶，欧洲国家经过100多年的摸索，才在中国制瓷技术的基础上生产出数量较多的瓷器，从而减少了从中国的进口","中国转而向美国市场出售瓷器，但为时不久","由于英法等资本主义强国的入侵、国内太平天国战争的破坏以及清朝政府的腐败，官窑生产更加低落，民窑瓷器尚能在挣扎中生产一些较好的产品","这种衰败现象直到新中国成立以后才得以逐步扭转，出现了步步繁荣的景象"],"q":"到了 18世纪下半叶，欧洲国家经过100多年的摸索，才在中国制瓷技术的基础上生产出数量较多的瓷器，从而减少了从中国的进口。中国转而向美国市场出售瓷器，但为时不久。由于英法等资本主义强国的入侵、国内太平天国战争的破坏以及清朝政府的腐败，官窑生产更加低落，民窑瓷器尚能在挣扎中生产一些较好的产品。这种衰败现象直到新中国成立以后才得以逐步扭转，出现了步步繁荣的景象。","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)目前，中国的瓷器生产主要在江西省景德镇市、河南省禹州市、湖南省醴陵市、福建省德化市、河北省唐山市、山东省淄博市和广东省佛山市等地","景德镇依然保持着它“中国瓷都”的地位，并发展成为我国集陶瓷生产、销售、科研、教育与旅游于一体的庞大基地","河南省禹州市仍然是钧瓷的产地，而中心产地在该市神垕镇，那里拥有许多知名企业，已研制开发出各类品种造型1，200多种、窑变釉色30 多种","湖南省醴陵市是釉下五彩瓷原产地，现在以生产红瓷闻名天下，“中国红”更是它的一大品牌"],"q":"中国文化要略(第4版)中国文化要略(第4版)目前，中国的瓷器生产主要在江西省景德镇市、河南省禹州市、湖南省醴陵市、福建省德化市、河北省唐山市、山东省淄博市和广东省佛山市等地。景德镇依然保持着它“中国瓷都”的地位，并发展成为我国集陶瓷生产、销售、科研、教育与旅游于一体的庞大基地。河南省禹州市仍然是钧瓷的产地，而中心产地在该市神垕镇，那里拥有许多知名企业，已研制","w":"normal","e":["原书正文"]},{"t":"【原文】目前，中国的瓷器生产主要","y":"教材原文","p":["目前，中国的瓷器生产主要在江西省景德镇市、河南省禹州市、湖南省醴陵市、福建省德化市、河北省唐山市、山东省淄博市和广东省佛山市等地","景德镇依然保持着它“中国瓷都”的地位，并发展成为我国集陶瓷生产、销售、科研、教育与旅游于一体的庞大基地","河南省禹州市仍然是钧瓷的产地，而中心产地在该市神垕镇，那里拥有许多知名企业，已研制开发出各类品种造型1，200多种、窑变釉色30 多种","湖南省醴陵市是釉下五彩瓷原产地，现在以生产红瓷闻名天下，“中国红”更是它的一大品牌"],"q":"目前，中国的瓷器生产主要在江西省景德镇市、河南省禹州市、湖南省醴陵市、福建省德化市、河北省唐山市、山东省淄博市和广东省佛山市等地。景德镇依然保持着它“中国瓷都”的地位，并发展成为我国集陶瓷生产、销售、科研、教育与旅游于一体的庞大基地。河南省禹州市仍然是钧瓷的产地，而中心产地在该市神垕镇，那里拥有许多知名企业，已研制开发出各类品种造型1，200多种、窑变釉色3","w":"normal","e":["原书正文"]}]},{"id":"culture-c15-s02","t":"第二节 陶瓷","w":"high","n":10,"k":[{"t":"唐三彩","y":"名词解释","p":["唐代低温铅釉陶器","以黄绿白三色为主","多为随葬明器","造型有马、骆驼、人物"],"q":"唐代盛行的一种低温铅釉陶器，以黄、绿、白（或褐）三色为主，故称唐三彩。多用作随葬明器，造型有马、骆驼、人物、器皿等，釉色淋漓交融，富有浓郁的盛唐气象，代表唐代陶瓷工艺的高度成就。","w":"high","e":["2021 真题"]},{"t":"五大名窑","y":"名词解释","p":["汝、官、哥、钧、定","汝窑天青釉为诸窑之冠","钧窑窑变万彩","定窑白瓷印花刻花"],"q":"宋代最著名的五个瓷窑：汝窑、官窑、哥窑、钧窑、定窑。汝窑以天青釉著称，为宋代五大名窑之首；官窑釉色粉青，紫口铁足；哥窑有金丝铁线开片；钧窑釉色窑变，“入窑一色，出窑万彩”；定窑以白瓷印花刻花见长。","w":"high","e":["2023 真题","2018 真题"]},{"t":"青花瓷","y":"名词解释","p":["元代景德镇创烧的釉下彩","钴料绘画，高温一次烧成","元青花用苏麻离青，发色浓艳","外销主要品种，影响世界"],"q":"青花瓷是元代景德镇创烧的釉下彩瓷器，以钴料在素胎上绘画，再罩透明釉经高温一次烧成，呈现白地蓝花的效果。元代青花使用进口\"苏麻离青\"钴料，发色浓艳、有铁锈斑，器形硕大；明清青花以永乐、宣德、成化、康熙为高峰。青花瓷是中国瓷器外销的主要品种，深刻影响了伊斯兰世界与欧洲的陶瓷艺术。","w":"normal","e":["核心概念"]},{"t":"【原文】1.常素霞.中国玉器发展","y":"教材原文","p":["1.常素霞.中国玉器发展史.北京：科学出版社，2009."],"q":"1.常素霞.中国玉器发展史.北京：科学出版社，2009.","w":"normal","e":["原书正文"]},{"t":"【原文】2.郭军林.中国青铜文化","y":"教材原文","p":["2.郭军林.中国青铜文化.北京：时事出版社，2009."],"q":"2.郭军林.中国青铜文化.北京：时事出版社，2009.","w":"normal","e":["原书正文"]},{"t":"【原文】各个民族在历史发展过程中","y":"教材原文","p":["各个民族在历史发展过程中，由于自然条件和社会环境不同，形成各自不同的行为方式和生活方式，这就是人们常说的风俗习惯","所以古语说：“百里不同风，千里不同俗","”从文化考察和文化研究的角度去看，一个民族的风俗习惯能最充分地体现这个民族的心理、志趣、信仰和历史，因而也是这个民族最有意义的文化特征","世界上一些著名的文化学家，几乎都是通过对风俗习惯的考察来研究一个民族的文化的"],"q":"各个民族在历史发展过程中，由于自然条件和社会环境不同，形成各自不同的行为方式和生活方式，这就是人们常说的风俗习惯。所以古语说：“百里不同风，千里不同俗。”从文化考察和文化研究的角度去看，一个民族的风俗习惯能最充分地体现这个民族的心理、志趣、信仰和历史，因而也是这个民族最有意义的文化特征。世界上一些著名的文化学家，几乎都是通过对风俗习惯的考察来研究一个民族的文","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)386386中国有56个民族，风俗习惯各不相同","那么，它们的共同特点是什么呢?"],"q":"中国文化要略(第4版)中国文化要略(第4版)386386中国有56个民族，风俗习惯各不相同。那么，它们的共同特点是什么呢?","w":"normal","e":["原书正文"]},{"t":"【原文】一是积久性，即中国人的风","y":"教材原文","p":["一是积久性，即中国人的风俗习惯大多具有古老的历史渊源，经历了漫长的演变过程","原因很简单，我们的历史非常悠久","在长达数千年的时间里，各种习俗积聚人们的感情、信念、愿望和追求，以其缓慢变化的方式，反映一定历史阶段上的物质生活水平","比如祭祖这一风俗，产生于4，000年以前的原始社会"],"q":"一是积久性，即中国人的风俗习惯大多具有古老的历史渊源，经历了漫长的演变过程。原因很简单，我们的历史非常悠久。在长达数千年的时间里，各种习俗积聚人们的感情、信念、愿望和追求，以其缓慢变化的方式，反映一定历史阶段上的物质生活水平。 比如祭祖这一风俗，产生于4，000年以前的原始社会。它所体现的情感是后人对先人的怀念和尊敬，认为先祖生育了后代，他们的伟大就在于他们","w":"normal","e":["原书正文"]},{"t":"【原文】家庭平安康健的保证","y":"教材原文","p":["家庭平安康健的保证","到封建社会的中晚期，祭祖活动与“齐家”“治国”“平天下”的政治需要结合到一起，被看作是“人生第一吃紧事”","人们把遵循教条和道德的自我完善，看成是对先祖恩德的最好报答","因此，那些功成名就、衣锦还乡的人，总认为自己是光宗耀祖"],"q":"家庭平安康健的保证。到封建社会的中晚期，祭祖活动与“齐家”“治国”“平天下”的政治需要结合到一起，被看作是“人生第一吃紧事”。人们把遵循教条和道德的自我完善，看成是对先祖恩德的最好报答。因此，那些功成名就、衣锦还乡的人，总认为自己是光宗耀祖；而那些家境败落或毫无成就的人，总是在内心深处谴责自己愧对“列祖列宗”。这种祭祖活动的道德化与政治化，是封建制度长期发展","w":"normal","e":["原书正文"]},{"t":"【原文】二是多元性，即风俗习惯的","y":"教材原文","p":["二是多元性，即风俗习惯的多民族性、多区域性和多系统性","由于民族不同、地域不同，形成的风俗习惯也不同，这一点是很容易理解的","每个民族都有自己的丧葬、婚姻、祭祀方式和衣、食、住、行方式","同一民族居于不同地域的人们，也有各自不同的习惯"],"q":"二是多元性，即风俗习惯的多民族性、多区域性和多系统性。由于民族不同、地域不同，形成的风俗习惯也不同，这一点是很容易理解的。每个民族都有自己的丧葬、婚姻、祭祀方式和衣、食、住、行方式。 同一民族居于不同地域的人们，也有各自不同的习惯。西南地区的彝族、傈族、拉祜族、纳西族等都过“火把节”，但他们火把节的来历、举行火把节的方式并不相同。这说明，他们对火与光的理解存","w":"normal","e":["原书正文"]}]},{"id":"culture-c15-s03","t":"第三节 玉器与工艺","w":"high","n":10,"k":[{"t":"景泰蓝","y":"名词解释","p":["铜胎掐丝珐琅","明代景泰年间兴盛得名","掐丝填釉烧制打磨镀金","北京传统工艺代表"],"q":"又称铜胎掐丝珐琅，明代景泰年间最为兴盛，故称景泰蓝。以铜为胎，用细铜丝掐成花纹轮廓，填入珐琅釉料，经烧制、打磨、镀金而成。色彩以蓝为主，富丽堂皇，是北京传统工艺美术的代表。","w":"high","e":["2020 真题"]},{"t":"文房四宝","y":"名词解释","p":["笔、墨、纸、砚","湖笔、徽墨、宣纸、端砚","产地各具代表性","承载书画艺术与文人审美"],"q":"文房四宝指中国传统书写工具笔、墨、纸、砚，是文人书房必备之物。其名品分别为：湖笔（浙江湖州）、徽墨（安徽歙县）、宣纸（安徽泾县）、端砚（广东肇庆）与歙砚（安徽歙县）。文房四宝不仅是实用工具，更承载了书法绘画艺术与文人审美，是中国传统文化的重要物质载体。","w":"normal","e":["核心概念"]},{"t":"【原文】(2) 江苏镇江中泠泉，","y":"教材原文","p":["(2) 江苏镇江中泠泉，即古长江南零水，在镇江金山公园西面","水质甘洌醇厚，表面张力很大，泡茶效果极佳"],"q":"(2) 江苏镇江中泠泉，即古长江南零水，在镇江金山公园西面。由刘伯刍评定。水质甘洌醇厚，表面张力很大，泡茶效果极佳。","w":"normal","e":["原书正文"]},{"t":"【原文】(3) 北京玉泉，在西郊","y":"教材原文","p":["(3) 北京玉泉，在西郊玉泉山，由乾隆皇帝评定","元代以来被定为宫廷用水，煎茶、酿酒均好"],"q":"(3) 北京玉泉，在西郊玉泉山，由乾隆皇帝评定。元代以来被定为宫廷用水，煎茶、酿酒均好。","w":"normal","e":["原书正文"]},{"t":"【原文】(4) 山东济南趵突泉，","y":"教材原文","p":["(4) 山东济南趵突泉，在济南市西门桥附近，为济南七十二泉之首","相传乾隆至此，见泉水趵突，脱口加封为“天下第一泉”"],"q":"(4) 山东济南趵突泉，在济南市西门桥附近，为济南七十二泉之首。由乾隆评定。相传乾隆至此，见泉水趵突，脱口加封为“天下第一泉”。","w":"normal","e":["原书正文"]},{"t":"【原文】江苏无锡惠山泉，在无锡市","y":"教材原文","p":["江苏无锡惠山泉，在无锡市锡惠公园内，由陆羽评定，因此又叫“陆子泉”","历代对它的地位众口一词，在中国名泉中稳坐第二把交椅","阿炳的《二泉映月》即诞生于此","唐武宗时的宰相李德裕有茶瘾，曾命地方官派人用传递的办法把惠山泉送往长安"],"q":"江苏无锡惠山泉，在无锡市锡惠公园内，由陆羽评定，因此又叫“陆子泉”。历代对它的地位众口一词，在中国名泉中稳坐第二把交椅。阿炳的《二泉映月》即诞生于此。唐武宗时的宰相李德裕有茶瘾，曾命地方官派人用传递的办法把惠山泉送往长安。","w":"normal","e":["原书正文"]},{"t":"【原文】(1) 湖北蕲水(在今浠","y":"教材原文","p":["(1) 湖北蕲水(在今浠水县) 兰溪泉，由陆羽评定，又叫“陆羽茶泉”，配湖北老青茶味道最佳"],"q":"(1) 湖北蕲水(在今浠水县) 兰溪泉，由陆羽评定，又叫“陆羽茶泉”，配湖北老青茶味道最佳。","w":"normal","e":["原书正文"]},{"t":"【原文】(2) 江苏苏州陆羽井，","y":"教材原文","p":["(2) 江苏苏州陆羽井，在苏州虎丘山，传为陆羽开凿，由刘伯刍等评定，配以太湖碧螺春最好"],"q":"(2) 江苏苏州陆羽井，在苏州虎丘山，传为陆羽开凿，由刘伯刍等评定，配以太湖碧螺春最好。","w":"normal","e":["原书正文"]},{"t":"【原文】(3) 浙江杭州虎跑泉，","y":"教材原文","p":["(3) 浙江杭州虎跑泉，与西湖龙井茶相配，称为“西湖双绝”"],"q":"(3) 浙江杭州虎跑泉，与西湖龙井茶相配，称为“西湖双绝”。","w":"normal","e":["原书正文"]},{"t":"【原文】(2) 蛤蟆泉，与黄牛泉","y":"教材原文","p":["(2) 蛤蟆泉，与黄牛泉不在一处，但地质结构相同，出于同一水源，因此均被陆羽评为第四","陆游入蜀，曾饮过蛤蟆泉水，并写诗赞美它","葛洲坝建成后，蛤蟆泉已沉入江中"],"q":"(2) 蛤蟆泉，与黄牛泉不在一处，但地质结构相同，出于同一水源，因此均被陆羽评为第四。陆游入蜀，曾饮过蛤蟆泉水，并写诗赞美它。葛洲坝建成后，蛤蟆泉已沉入江中。","w":"normal","e":["原书正文"]}]}]},{"id":"culture-c16","t":"第十六章 风俗习惯","w":"high","s":[{"id":"culture-c16-s01","t":"第一节 岁时节日","w":"high","n":17,"k":[{"t":"春节","y":"名词解释","p":["农历正月初一，又称过年","源于上古岁首祭祀","贴春联、守岁、拜年、压岁钱","象征辞旧迎新、阖家团圆"],"q":"农历正月初一，是我国最隆重、最热闹的传统节日，又称过年。源于上古岁首祭祀，习俗有贴春联、放鞭炮、守岁、拜年、吃年夜饭、发压岁钱等，象征辞旧迎新、阖家团圆，是中华民族最重要的节日。","w":"high","e":["2016 真题"]},{"t":"清明节","y":"名词解释","p":["二十四节气与传统节日","扫墓祭祖与踏青郊游","融合寒食节禁火冷食习俗"],"q":"二十四节气之一，也是我国重要的传统节日。主要习俗为扫墓祭祖与踏青郊游，兼具缅怀先人与亲近自然的双重内涵。清明前一二日的寒食节有禁火冷食之俗，后与清明融合。","w":"high","e":["2019 真题"]},{"t":"端午节","y":"名词解释","p":["农历五月初五，又称端阳节","纪念屈原投汨罗江","赛龙舟、吃粽子、挂艾草"],"q":"农历五月初五，又称端阳节。相传为纪念投汨罗江的爱国诗人屈原，习俗有赛龙舟、吃粽子、挂艾草菖蒲、饮雄黄酒、佩香囊等，具有驱邪避疫与纪念先贤的双重意义。","w":"high","e":["2021 真题"]},{"t":"中秋节","y":"名词解释","p":["农历八月十五，居秋季之中","赏月、吃月饼、家人团聚","源于古代秋分祭月","嫦娥奔月神话"],"q":"农历八月十五，因居秋季之中而得名，又称团圆节。习俗有赏月、吃月饼、家人团聚，源于古代秋分祭月，嫦娥奔月、吴刚伐桂等神话为其增添浪漫色彩，是仅次于春节的重要传统节日。","w":"high","e":["2018 真题"]},{"t":"清明上河图","y":"名词解释","p":["北宋张择端所作风俗长卷","描绘汴京清明时节市井繁华","分城郊、汴河、街市三段","现实主义风俗画杰作"],"q":"北宋画家张择端所作风俗长卷，绢本设色，现藏北京故宫博物院。全图描绘北宋都城汴京清明时节的市井繁华，展现了城郊、汴河、街市三部分场景，人物数以百计，是我国古代现实主义风俗画的杰作，具有极高的历史与艺术价值。","w":"high","e":["2022 真题","2017 真题"]},{"t":"年号","y":"名词解释","p":["帝王纪年的名号","始于汉武帝建元","新君即位或遇祥瑞改元","明以后一帝一元，常代称帝王"],"q":"年号是古代帝王纪年的名号，始于汉武帝建元元年（前140年），此后成为定制。新君即位或遇祥瑞灾异往往改元，一个皇帝可有多至十余个年号，明太祖以后基本一帝一元。年号多取吉祥嘉美之义，如贞观、开元、康熙、乾隆等，后世常以年号代称帝王。","w":"normal","e":["核心概念"]},{"t":"二十四节气","y":"名词解释","p":["按太阳黄道位置划分","完整见于《淮南子·天文训》","反映季节气候物候变化","2016年列入人类非遗"],"q":"二十四节气是中国古代根据太阳在黄道上的位置划分的农事历法体系，形成于春秋战国，完整记载见于西汉《淮南子·天文训》。它以立春、雨水、惊蛰等二十四个名称反映季节、气候与物候的变化，指导农业生产。2016年被联合国教科文组织列入人类非物质文化遗产代表作名录。","w":"normal","e":["核心概念"]},{"t":"庙号、谥号与年号","y":"名词解释","p":["庙号为太庙奉祀名号","谥号依生平事迹褒贬","年号始于汉武帝建元","均为帝王称谓纪年制度"],"q":"庙号是皇帝死后在太庙奉祀时追尊的名号，如太祖、世宗；谥号是依据生前事迹给予的褒贬称号，如文帝、武帝、炀帝；年号是皇帝纪年的名号，始于汉武帝建元，如贞观、康熙。三者是中国古代帝王称谓与纪年的重要制度。","w":"normal","e":["核心概念"]},{"t":"元宵节的主要习俗是吃粽子、赛龙舟。","y":"名词解释","p":["元宵节赏灯猜谜吃元宵","端午才吃粽子赛龙舟"],"q":"错误。吃粽子、赛龙舟是端午节习俗；元宵节的主要习俗是赏灯、猜灯谜、吃元宵。","w":"normal","e":["核心概念"]},{"t":"【原文】馁而肉败(鱼烂肉腐)，不","y":"教材原文","p":["馁而肉败(鱼烂肉腐)，不食","色恶(食物变色不鲜)，不食","臭恶(变味)，不食","失饪(饭菜做得不好)，不食"],"q":"馁而肉败(鱼烂肉腐)，不食；色恶(食物变色不鲜)，不食；臭恶(变味)，不食；失饪(饭菜做得不好)，不食；不时(果实不到成熟时、吃饭不到时间)，","w":"normal","e":["原书正文"]},{"t":"【原文】不食；失饪(饭菜做得不好","y":"教材原文","p":["失饪(饭菜做得不好)，不食","不时(果实不到成熟时、吃饭不到时间)，不食","割不正(刀工不合规定)，不食","不得其酱(调料不符合要求)，不食"],"q":"不食；失饪(饭菜做得不好)，不食；不时(果实不到成熟时、吃饭不到时间)，不食；割不正(刀工不合规定)，不食；不得其酱(调料不符合要求)，不食；","w":"normal","e":["原书正文"]},{"t":"【原文】不食；割不正(刀工不合规","y":"教材原文","p":["割不正(刀工不合规定)，不食","不得其酱(调料不符合要求)，不食"],"q":"不食；割不正(刀工不合规定)，不食；不得其酱(调料不符合要求)，不食；","w":"normal","e":["原书正文"]},{"t":"【原文】沽酒市脯，不食”(《论语","y":"教材原文","p":["沽酒市脯，不食”(《论语·乡党》)","从考古和文献知道，春秋战国时的诸396396侯设宴，食品多达40余种，以至如《墨子·辞过》所说：“美食……前方丈，"],"q":"沽酒市脯，不食”(《论语·乡党》)。从考古和文献知道，春秋战国时的诸396396侯设宴，食品多达40余种，以至如《墨子·辞过》所说：“美食……前方丈，","w":"normal","e":["原书正文"]},{"t":"【原文】侯设宴，食品多达40余种","y":"教材原文","p":["侯设宴，食品多达40余种，以至如《墨子·辞过》所说：“美食……前方丈，目不能遍视，手不能遍操，口不能遍味","”汉代的《盐铁论》也有“熟食遍地，"],"q":"侯设宴，食品多达40余种，以至如《墨子·辞过》所说：“美食……前方丈，目不能遍视，手不能遍操，口不能遍味。”汉代的《盐铁论》也有“熟食遍地，","w":"normal","e":["原书正文"]},{"t":"【原文】烹调的发展，是基于人要不","y":"教材原文","p":["烹调的发展，是基于人要不断满足自己口味的需求，但是，它也必须具备相应的社会经济条件","汉代经济繁荣，饮食文化也进一步发展，烹调技术已达到相当水平，当时的炖、炒、煎、煮、酱、腌、炙等烹调方法已被充分掌握","湖南省长沙市马王堆汉墓出土的简册记载，西汉时的精美菜肴已达近百种，与这种饮食相配的各种食器也是丰富多彩、琳琅满目","山东省诸城市汉墓出土的汉画像中有一幅《庖厨图》，图上所画40余人，各自忙着与烹调有关的劳动，是汉代烹调事业兴旺的生动写照"],"q":"烹调的发展，是基于人要不断满足自己口味的需求，但是，它也必须具备相应的社会经济条件。汉代经济繁荣，饮食文化也进一步发展，烹调技术已达到相当水平，当时的炖、炒、煎、煮、酱、腌、炙等烹调方法已被充分掌握。湖南省长沙市马王堆汉墓出土的简册记载，西汉时的精美菜肴已达近百种，与这种饮食相配的各种食器也是丰富多彩、琳琅满目。山东省诸城市汉墓出土的汉画像中有一幅《庖厨图》","w":"normal","e":["原书正文"]},{"t":"【原文】也更为丰富。唐代官吏韦巨","y":"教材原文","p":["唐代官吏韦巨源曾为皇帝制作了丰盛的宴席，他把这些菜肴一一记录下来，成为后世流传的《食谱》","前边提到的“韦家食谱”即指此","据《食谱》介绍，其中的馄饨竟用了24种馅","另据记载，唐代有一位精于烹调的尼姑，用酱肉、酱瓜、鱼等食品制成一个拼盘，表现王维隐居的“辋川二十一景”，其精妙有如一件工艺品"],"q":"也更为丰富。唐代官吏韦巨源曾为皇帝制作了丰盛的宴席，他把这些菜肴一一记录下来，成为后世流传的《食谱》。前边提到的“韦家食谱”即指此。据《食谱》介绍，其中的馄饨竟用了24种馅。另据记载，唐代有一位精于烹调的尼姑，用酱肉、酱瓜、鱼等食品制成一个拼盘，表现王维隐居的“辋川二十一景”，其精妙有如一件工艺品。杜甫的《丽人行》中说：“紫驼之峰出翠釜，水精之盘行素鳞。犀箸","w":"normal","e":["原书正文"]},{"t":"【原文】风俗习惯风俗习惯明清两代","y":"教材原文","p":["风俗习惯风俗习惯明清两代是封建社会的晚期，在烹调方面积累了以前的经验，各种总结烹调技术和加工仪器的专著纷纷出现，其中以清代文学家袁枚的《随园食单》最有代表性，它不但记载了从明代到清初流行的食品326种，而且对烹调技艺提出了许多高明见解","在这一阶段，宫廷菜的发展特别迅速","尤其是清代，统治者作为入主中原的少数民族，他们在原有民族菜肴的基础上，沿袭明代宫廷宴席旧制，任用全国著名厨师，逐渐形成满汉一体的宫廷菜肴，每逢各种节日、婚礼、生日、登基等大典都要举行大宴","据研究，一桌“满汉全席”多时有菜点 182种，少时也有64种"],"q":"风俗习惯风俗习惯明清两代是封建社会的晚期，在烹调方面积累了以前的经验，各种总结烹调技术和加工仪器的专著纷纷出现，其中以清代文学家袁枚的《随园食单》最有代表性，它不但记载了从明代到清初流行的食品326种，而且对烹调技艺提出了许多高明见解。在这一阶段，宫廷菜的发展特别迅速。尤其是清代，统治者作为入主中原的少数民族，他们在原有民族菜肴的基础上，沿袭明代宫廷宴席旧制","w":"normal","e":["原书正文"]}]},{"id":"culture-c16-s02","t":"第二节 人生礼仪与婚俗","w":"normal","n":10,"k":[{"t":"六礼","y":"名词解释","p":["《仪礼·士昏礼》所载六道程序","纳采、问名、纳吉、纳征、请期、亲迎","纳征送聘礼，亲迎为最后环节","确立传统婚姻礼仪规范"],"q":"六礼是中国古代婚姻缔结的六道程序，见于《仪礼·士昏礼》，即纳采、问名、纳吉、纳征、请期、亲迎。纳采用雁求婚；问名问女方姓名生辰；纳吉卜得吉兆后定婚；纳征送聘礼；请期商定婚期；亲迎新郎迎娶新娘。六礼确立了传统婚姻的礼仪规范，历代虽有简化，但基本框架沿用至近代。","w":"normal","e":["核心概念"]},{"t":"冠礼与笄礼","y":"名词解释","p":["男子二十冠礼，女子十五笄礼","冠礼三加：缁布冠、皮弁、爵弁","取字，以成人之礼相待","标志成年，获得权利与义务"],"q":"冠礼与笄礼是古代男子的成年礼与女子的成年礼。男子二十岁行冠礼，于宗庙中由父亲主持，加缁布冠、皮弁、爵弁三次，取字并以成人之礼相待；女子十五岁行笄礼，结发加簪（笄），表示可以许嫁。二者均标志由少年进入成年，获得成人的权利与义务，是传统人生礼仪的重要环节。","w":"normal","e":["核心概念"]},{"t":"【原文】风俗习惯风俗习惯4034","y":"教材原文","p":["风俗习惯风俗习惯403403清代以高压政策推行满族服饰打扮","首先是强令汉人削发留辫，当时有“留头不留发，留发不留头”的说法，可想制度之严","其次是废除明代服饰制度，以满族风尚重定冠服制度","最明显的特点是，官员穿“蟒袍”，蟒的数目因品级而异"],"q":"风俗习惯风俗习惯403403清代以高压政策推行满族服饰打扮。首先是强令汉人削发留辫，当时有“留头不留发，留发不留头”的说法，可想制度之严。其次是废除明代服饰制度，以满族风尚重定冠服制度。最明显的特点是，官员穿“蟒袍”，蟒的数目因品级而异。在蟒袍外，又加一外褂，也称“补服”，短袖，对襟，前后正中习明代绣补子，以表示官衔。上面所绣鸟兽与明代大同小异。礼服中还增加","w":"normal","e":["原书正文"]},{"t":"【原文】婚俗和葬俗是人类社会学和","y":"教材原文","p":["婚俗和葬俗是人类社会学和人类文化学上很重要的问题","以婚姻而论，其制度的变化与风俗的形成，既反映了人类自身的进步，也反映了社会生活的发展，因而它也是衡量人类文明的一个尺度","而如何丧葬则深刻表现了人类对死亡这一问题的理解和认识","不同民族由于各自的历史进程并不一致，他们对未来世界的幻想和描绘也不尽相同"],"q":"婚俗和葬俗是人类社会学和人类文化学上很重要的问题。以婚姻而论，其制度的变化与风俗的形成，既反映了人类自身的进步，也反映了社会生活的发展，因而它也是衡量人类文明的一个尺度。而如何丧葬则深刻表现了人类对死亡这一问题的理解和认识。不同民族由于各自的历史进程并不一致，他们对未来世界的幻想和描绘也不尽相同。不同民族的婚姻关系和丧葬方式存在着许多殊异现象。考察婚丧嫁娶的","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版中国","y":"教材原文","p":["中国文化要略(第4版中国文化要略(第4版“婚姻”这个词，通俗地说是男女两性结合为夫妻","但历史状况和实际生活远比这一解释要复杂得多","我国古书对“婚姻”二字的解释是：“婚”同“昏”，是昏时迎娶的意思","“姻”同“因”，是因男而嫁的意思"],"q":"中国文化要略(第4版中国文化要略(第4版“婚姻”这个词，通俗地说是男女两性结合为夫妻。但历史状况和实际生活远比这一解释要复杂得多。我国古书对“婚姻”二字的解释是：“婚”同“昏”，是昏时迎娶的意思；“姻”同“因”，是因男而嫁的意思。《诗经·陈风·东门之杨》云：“东门之杨，其叶牂牂；昏以为期，明星煌煌。”可见，“婚姻”二字的产生，应是父权制度已经完全确立以后的事","w":"normal","e":["原书正文"]},{"t":"【原文】“婚姻”这个词，通俗地说","y":"教材原文","p":["“婚姻”这个词，通俗地说是男女两性结合为夫妻","但历史状况和实际生活远比这一解释要复杂得多","我国古书对“婚姻”二字的解释是：“婚”同“昏”，是昏时迎娶的意思","“姻”同“因”，是因男而嫁的意思"],"q":"“婚姻”这个词，通俗地说是男女两性结合为夫妻。但历史状况和实际生活远比这一解释要复杂得多。我国古书对“婚姻”二字的解释是：“婚”同“昏”，是昏时迎娶的意思；“姻”同“因”，是因男而嫁的意思。《诗经·陈风·东门之杨》云：“东门之杨，其叶牂牂；昏以为期，明星煌煌。”可见，“婚姻”二字的产生，应是父权制度已经完全确立以后的事。","w":"normal","e":["原书正文"]},{"t":"【原文】404404在远古时代，","y":"教材原文","p":["404404在远古时代，人类群居野处，男女混杂，性关系非常混乱而又自由，并没有什么婚姻概念","这正是《吕氏春秋·恃君览》所说的“其民聚生群处，知母不知父，无亲戚、兄弟、夫妻、男女之别”的那种原始群婚生活","青海的土族，在新中国成立前还流行“戴天头”的婚俗，即女子到15岁，在除夕与天结为夫妻，此后性生活即可自由，生下子女归女家","这是原始群婚的遗风"],"q":"404404在远古时代，人类群居野处，男女混杂，性关系非常混乱而又自由，并没有什么婚姻概念。这正是《吕氏春秋·恃君览》所说的“其民聚生群处，知母不知父，无亲戚、兄弟、夫妻、男女之别”的那种原始群婚生活。青海的土族，在新中国成立前还流行“戴天头”的婚俗，即女子到15岁，在除夕与天结为夫妻，此后性生活即可自由，生下子女归女家。这是原始群婚的遗风。类似的群婚遗迹在","w":"normal","e":["原书正文"]},{"t":"【原文】所谓“血缘群婚”就是由血","y":"教材原文","p":["所谓“血缘群婚”就是由血缘关系构成的一种群婚现象","它的特点是在同血缘的氏族内，相同辈分的男女互为夫妻，即所有的祖父、祖母，所有的父亲、母亲，所有的兄弟姐妹按辈数互为夫妻","只要是同辈男女都可以自由地发生性关系，但排斥祖孙之间、双亲和子女之间的性关系"],"q":"所谓“血缘群婚”就是由血缘关系构成的一种群婚现象。它的特点是在同血缘的氏族内，相同辈分的男女互为夫妻，即所有的祖父、祖母，所有的父亲、母亲，所有的兄弟姐妹按辈数互为夫妻。只要是同辈男女都可以自由地发生性关系，但排斥祖孙之间、双亲和子女之间的性关系。这种血","w":"normal","e":["原书正文"]},{"t":"【原文】缘群婚在我国的神话传说中","y":"教材原文","p":["缘群婚在我国的神话传说中，可以看到一些痕迹","如传说中的伏羲、女娲兄妹结为夫妻，生下一个肉团，内有15对童男童女，他们又互相结合，生男育女，才有了人类","我国的其他少数民族，也都有兄妹配婚的传说","随着社会的发展和文明的进步，人类逐渐认识到血缘婚姻的危害并逐渐产生明确的婚禁，即禁止一切血缘亲属间的性关系，而到无血缘关系的其他氏族集团寻找婚配对象，这就出现了氏族之间的“对偶婚”，也就是古代所说的“同姓不婚”"],"q":"缘群婚在我国的神话传说中，可以看到一些痕迹。如传说中的伏羲、女娲兄妹结为夫妻，生下一个肉团，内有15对童男童女，他们又互相结合，生男育女，才有了人类。我国的其他少数民族，也都有兄妹配婚的传说。随着社会的发展和文明的进步，人类逐渐认识到血缘婚姻的危害并逐渐产生明确的婚禁，即禁止一切血缘亲属间的性关系，而到无血缘关系的其他氏族集团寻找婚配对象，这就出现了氏族之间","w":"normal","e":["原书正文"]},{"t":"【原文】风俗习惯风俗习惯4054","y":"教材原文","p":["风俗习惯风俗习惯405405对偶婚的进一步发展，就是固定的“一夫一妻制”","我国的“婚姻”概念也正是在这个阶段产生的","这一婚姻形态从仰韶文化中晚期到龙山文化时期开始出现和发展，一直持续到现在，包括了整个父权时代和刚刚开始的男女平等的时代","考古工作者曾经在陕西省华阴市发现了龙山文化时期的一个夫妻合葬墓，它正好是这种婚姻形态早已形成的证据"],"q":"风俗习惯风俗习惯405405对偶婚的进一步发展，就是固定的“一夫一妻制”。我国的“婚姻”概念也正是在这个阶段产生的。这一婚姻形态从仰韶文化中晚期到龙山文化时期开始出现和发展，一直持续到现在，包括了整个父权时代和刚刚开始的男女平等的时代。考古工作者曾经在陕西省华阴市发现了龙山文化时期的一个夫妻合葬墓，它正好是这种婚姻形态早已形成的证据。但是，父权制度的确立，就","w":"normal","e":["原书正文"]}]},{"id":"culture-c16-s03","t":"第三节 生肖与饮食","w":"normal","n":8,"k":[{"t":"十二生肖","y":"名词解释","p":["十二种动物与十二地支相配","起源先秦，完整见于《论衡》","用于纪年纪时","中华文化圈特有民俗符号"],"q":"十二生肖是中国传统的以十二种动物纪年、纪时的民俗系统，即鼠、牛、虎、兔、龙、蛇、马、羊、猴、鸡、狗、猪，与十二地支相配。其起源可追溯至先秦，完整记载见于东汉王充《论衡》。生肖文化渗透于纪年、婚配、命理、艺术等民俗生活各个方面，是中华文化圈特有的民俗符号。","w":"normal","e":["核心概念"]},{"t":"八大菜系","y":"名词解释","p":["鲁川粤苏浙闽湘徽八系","鲁菜重火候高汤","川菜麻辣、粤菜清鲜","体现饮食文化地域多样性"],"q":"八大菜系是中国地方风味菜肴的八个代表性体系，即鲁菜、川菜、粤菜、苏菜、浙菜、闽菜、湘菜、徽菜。鲁菜为北方代表，讲究火候与高汤；川菜麻辣鲜香，善用三椒；粤菜清淡鲜美，重原汁原味；苏菜刀工精细、口味平和；浙菜清鲜脆嫩；闽菜善用海鲜与汤；湘菜香辣浓郁；徽菜重油重色、善烧炖。八大菜系体现了中国饮食文化的地域","w":"normal","e":["核心概念"]},{"t":"【原文】先说龙。龙在中国文化中是","y":"教材原文","p":["龙在中国文化中是一种变化莫测的神物","封建帝王把它当作自己的真身，自称“真龙天子”","平民百姓把它当作自己的神灵，每每在祭龙求雨的时候，表现出极大的虔诚，以至经过几千年的演变，它成为中华民族的伟大象征，我们这些海内外的男男女女都自称是“龙的传人”","全国各地的山河湖泉，不知道有多少用龙来命名"],"q":"先说龙。龙在中国文化中是一种变化莫测的神物。封建帝王把它当作自己的真身，自称“真龙天子”；平民百姓把它当作自己的神灵，每每在祭龙求雨的时候，表现出极大的虔诚，以至经过几千年的演变，它成为中华民族的伟大象征，我们这些海内外的男男女女都自称是“龙的传人”。全国各地的山河湖泉，不知道有多少用龙来命名；天文学中的东方群星被称作“苍龙”； 就连人们的生辰属相里也有一条","w":"normal","e":["原书正文"]},{"t":"【原文】风俗习惯风俗习惯1111","y":"教材原文","p":["风俗习惯风俗习惯111144关于龙的起源和形成，近年来的学术研究非常活跃，但迄今众说纷纭，难以形成定论","大体归纳起来，有如下三种说法：一是认为龙的产生源于"],"q":"风俗习惯风俗习惯111144关于龙的起源和形成，近年来的学术研究非常活跃，但迄今众说纷纭，难以形成定论。大体归纳起来，有如下三种说法：一是认为龙的产生源于","w":"normal","e":["原书正文"]},{"t":"【原文】自然现象，认为“龙是先民","y":"教材原文","p":["自然现象，认为“龙是先民想象出来的自然神，龙的创造是出于先民在密云骤雨中观察霹云骤雨中观察霹雳、闪电的形象而雳、闪电的形象而"],"q":"自然现象，认为“龙是先民想象出来的自然神，龙的创造是出于先民在密云骤雨中观察霹云骤雨中观察霹雳、闪电的形象而雳、闪电的形象而","w":"normal","e":["原书正文"]},{"t":"【原文】萌发的灵感”","y":"教材原文","p":["持这一观点的人认这一观点的人认为，对具有原始思为，对具有原始思维的原始人来说，维的原始人来说，"],"q":"萌发的灵感”。持萌发的灵感”。持这一观点的人认这一观点的人认为，对具有原始思为，对具有原始思维的原始人来说，维的原始人来说，","w":"normal","e":["原书正文"]},{"t":"【原文】量极感兴趣，并且总认为它","y":"教材原文","p":["量极感兴趣，并且总认为它有一种实体存在，于是就用自己头脑中熟悉的东西去构建这个并不存在的实体，这样就形成了具有多种动物特点的神龙","二是认为龙的形象起源于鳄，诸如海鳄、扬子鳄等，因为它们都是远古时巨大的爬行类动物，而远古神话和天文学中的苍龙或青龙，正跟鳄的颜色相同","持这一看法的人还认为，龙之所以被看作雷雨神，是因为鳄确实有预知风雨的本领，每逢大雨来临前，鳄都要发出雷鸣一般的吼声","鳄鱼冬眠，到初春时苏醒，因此古书中说它“春分而登天，秋分而潜渊”"],"q":"量极感兴趣，并且总认为它有一种实体存在，于是就用自己头脑中熟悉的东西去构建这个并不存在的实体，这样就形成了具有多种动物特点的神龙。这是一种说法。二是认为龙的形象起源于鳄，诸如海鳄、扬子鳄等，因为它们都是远古时巨大的爬行类动物，而远古神话和天文学中的苍龙或青龙，正跟鳄的颜色相同。持这一看法的人还认为，龙之所以被看作雷雨神，是因为鳄确实有预知风雨的本领，每逢大雨","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)414122据考古发掘，迄今最早的龙形，是在河南省濮阳市仰韶文化前期墓葬中用蚌壳排成的龙、虎图案","龙置于墓主右侧，其形弯曲，长达1.78米，昂首拱背，其状似遨游于大海，腾飞于天空","此墓距今约五六千年，证明那"],"q":"中国文化要略(第4版)中国文化要略(第4版)414122据考古发掘，迄今最早的龙形，是在河南省濮阳市仰韶文化前期墓葬中用蚌壳排成的龙、虎图案。龙置于墓主右侧，其形弯曲，长达1.78米，昂首拱背，其状似遨游于大海，腾飞于天空。此墓距今约五六千年，证明那","w":"normal","e":["原书正文"]}]},{"id":"culture-c16-s04","t":"综合考点","w":"normal","n":7,"k":[{"t":"【原文】再说虎。虎也是实有动物，","y":"教材原文","p":["虎也是实有动物，虽不属于“四灵”，但按古代“五灵”的说法，则在其内","如孔颖达在为《春秋左传·序》作的疏解中说：“麟、凤与龟、龙、白虎，五者，神灵之鸟兽，王者之嘉瑞也","”古人认为虎为“山兽之君”，是威猛勇武的象征，人们常借虎以助威和驱邪","河南省濮阳市仰韶文化遗址出土的龙虎图案表明，原始社会已把虎当作神物，到周代已有在门上画虎驱邪的习俗"],"q":"再说虎。虎也是实有动物，虽不属于“四灵”，但按古代“五灵”的说法，则在其内。如孔颖达在为《春秋左传·序》作的疏解中说：“麟、凤与龟、龙、白虎，五者，神灵之鸟兽，王者之嘉瑞也。”古人认为虎为“山兽之君”，是威猛勇武的象征，人们常借虎以助威和驱邪。河南省濮阳市仰韶文化遗址出土的龙虎图案表明，原始社会已把虎当作神物，到周代已有在门上画虎驱邪的习俗。作为勇猛威武的化","w":"normal","e":["原书正文"]},{"t":"【原文】风俗习惯风俗习惯4141","y":"教材原文","p":["风俗习惯风俗习惯414177然而，理想的事物总是完美无缺的，现实的事物总是优劣兼具的","龙、凤、麒麟，都存在于理想中，它们的形象和神性，谁也没有真正见过","人们几乎找不到它们的缺点，由它们产生的故事和语言也几乎都是美好的","诸如“龙飞凤舞”“龙凤呈祥”“百鸟朝凤”“丹凤朝阳”“凤毛麟角”“望子成龙”等，"],"q":"风俗习惯风俗习惯414177然而，理想的事物总是完美无缺的，现实的事物总是优劣兼具的。龙、凤、麒麟，都存在于理想中，它们的形象和神性，谁也没有真正见过。人们几乎找不到它们的缺点，由它们产生的故事和语言也几乎都是美好的。诸如“龙飞凤舞”“龙凤呈祥”“百鸟朝凤”“丹凤朝阳”“凤毛麟角”“望子成龙”等，","w":"normal","e":["原书正文"]},{"t":"【原文】各个民族都有自己最喜爱的","y":"教材原文","p":["各个民族都有自己最喜爱的花木，并且常常在它们身上倾注深沉的感情","这种感情表现了人们对自然的热爱，甚至还表达了人们的某种寄托和愿望","许多国家因此形成了国花、国树","由于民族发展过程和生存环境的不同，也由于民族心理和趣味的不同，各民族最喜爱的花木也不同"],"q":"各个民族都有自己最喜爱的花木，并且常常在它们身上倾注深沉的感情。这种感情表现了人们对自然的热爱，甚至还表达了人们的某种寄托和愿望。许多国家因此形成了国花、国树。由于民族发展过程和生存环境的不同，也由于民族心理和趣味的不同，各民族最喜爱的花木也不同。中国人习惯于同自然的融合，把花木当作与自己一样，是有生命的活物，并且常常借花木及其他万物的自然属性来比喻人的社会","w":"normal","e":["原书正文"]},{"t":"【原文】松，常与柏并称","y":"教材原文","p":["它为中国人所喜爱，主要是因为它有耐寒而又能常青的特性","这本来是一种自然特性，但中国人把它理解为一种遭遇环境变化而能保持自身不变的社会品格，理解为具有坚强不屈的精神","《礼记·礼器》云：“其在人也⋯⋯如松柏之有心也⋯⋯故贯四时不改柯易叶","”这是以松柏的秉性比喻人的品格的开始"],"q":"松，常与柏并称。它为中国人所喜爱，主要是因为它有耐寒而又能常青的特性。这本来是一种自然特性，但中国人把它理解为一种遭遇环境变化而能保持自身不变的社会品格，理解为具有坚强不屈的精神。《礼记·礼器》云：“其在人也⋯⋯如松柏之有心也⋯⋯故贯四时不改柯易叶。”这是以松柏的秉性比喻人的品格的开始。其后，孔子等人继续发挥这个观点，认为只有经过艰苦的考验，才能看出一个人的","w":"normal","e":["原书正文"]},{"t":"【原文】松柏之茂也。”正是由于这","y":"教材原文","p":["”正是由于这种遇寒不凋的品性，古人才把松柏看作长生的象征，把它当作“百木之长”，从而赋予它守卫宫阙的资格","《史记·龟策列传》云：“松柏为百木长也，而守门闾","”因此历代帝王、公卿及至士大夫都在自己安息的墓前广植松柏，而古代砍伐陵前松柏被视为大逆不道的行为，甚至有杀头之罪","又据古籍记载，晋代荥阳郡南有一石室，室后有孤松千丈，常有双鹤，绕松而翔"],"q":"松柏之茂也。”正是由于这种遇寒不凋的品性，古人才把松柏看作长生的象征，把它当作“百木之长”，从而赋予它守卫宫阙的资格。《史记·龟策列传》云：“松柏为百木长也，而守门闾。”因此历代帝王、公卿及至士大夫都在自己安息的墓前广植松柏，而古代砍伐陵前松柏被视为大逆不道的行为，甚至有杀头之罪。又据古籍记载，晋代荥阳郡南有一石室，室后有孤松千丈，常有双鹤，绕松而翔。相传昔","w":"normal","e":["原书正文"]},{"t":"【原文】风俗习惯风俗习惯竹，古人","y":"教材原文","p":["风俗习惯风俗习惯竹，古人认为它是一种高雅的象征，其形象秀逸而有神韵，其品格虚心而能自持，故常被用来比喻人的品德高尚不俗","同时因为它生而有节，又被古人视为气节的象征","《礼记·礼器》云：“其在人也，如竹箭之有筠也","”《诗经·卫风·淇奥》云：“瞻彼淇奥，绿竹猗猗"],"q":"风俗习惯风俗习惯竹，古人认为它是一种高雅的象征，其形象秀逸而有神韵，其品格虚心而能自持，故常被用来比喻人的品德高尚不俗。同时因为它生而有节，又被古人视为气节的象征。《礼记·礼器》云：“其在人也，如竹箭之有筠也。”《诗经·卫风·淇奥》云：“瞻彼淇奥，绿竹猗猗。”“猗猗”是美丽茂盛的样子。历代文人欣赏竹的高尚和秀美，用它比喻自己的品格和情操。魏晋时代的嵇康、阮籍","w":"normal","e":["原书正文"]},{"t":"【原文】竹，古人认为它是一种高雅","y":"教材原文","p":["竹，古人认为它是一种高雅的象征，其形象秀逸而有神韵，其品格虚心而能自持，故常被用来比喻人的品德高尚不俗","同时因为它生而有节，又被古人视为气节的象征","《礼记·礼器》云：“其在人也，如竹箭之有筠也","”《诗经·卫风·淇奥》云：“瞻彼淇奥，绿竹猗猗"],"q":"竹，古人认为它是一种高雅的象征，其形象秀逸而有神韵，其品格虚心而能自持，故常被用来比喻人的品德高尚不俗。同时因为它生而有节，又被古人视为气节的象征。《礼记·礼器》云：“其在人也，如竹箭之有筠也。”《诗经·卫风·淇奥》云：“瞻彼淇奥，绿竹猗猗。”“猗猗”是美丽茂盛的样子。历代文人欣赏竹的高尚和秀美，用它比喻自己的品格和情操。魏晋时代的嵇康、阮籍、山涛、向秀、阮","w":"normal","e":["原书正文"]}]}]},{"id":"culture-c17","t":"第十七章 中外文化交流","w":"high","s":[{"id":"culture-c17-s01","t":"第一节 陆上与海上丝路","w":"high","n":12,"k":[{"t":"丝绸之路","y":"名词解释","p":["张骞出使西域后开辟","东起长安，西至地中海东岸","输出丝绸瓷器造纸术","输入葡萄苜蓿与佛教艺术"],"q":"西汉张骞出使西域后开辟的横贯欧亚的交通贸易通道。东起汉唐都城长安，经河西走廊、西域，越过葱岭，抵达中亚、西亚，直至地中海东岸转至罗马各地。中国输出丝绸、瓷器、造纸术，输入葡萄、苜蓿、胡桃及佛教、音乐等，是东西方经济文化交流的重要纽带。","w":"high","e":["2024 真题","2018 真题"]},{"t":"试论中国古代中外文化交流的历史意义","y":"名词解释","p":["丰富中国文化内涵","四大发明西传推动欧洲变革","形成东亚汉字文化圈","和平交往的典范","为一带一路提供历史根基"],"q":"中国古代中外文化交流的历史意义：①丰富了中国文化内涵，佛教东传促成宋明理学，西域乐舞融入中原艺术，葡萄、苜蓿、胡椒等物产丰富了中国饮食；②推动了世界文明进程，四大发明西传对欧洲文艺复兴、地理大发现与资产阶级革命起了巨大推动作用，造纸术经怛罗斯之战传入阿拉伯再入欧洲；③促进了东亚文化圈的形成，汉字、儒","w":"high","e":["2023 真题"]},{"t":"张骞通西域","y":"名词解释","p":["西汉两次出使西域","前139年首次出使大月氏","前119年再使乌孙","凿空西域，奠定丝绸之路"],"q":"张骞通西域是西汉时期两次出使西域的重大外交活动。建元二年（前139年）张骞奉汉武帝命出使大月氏，欲联合夹击匈奴，途中被匈奴扣留十余年，历尽艰险返回；元狩四年（前119年）再度出使乌孙。张骞的两次西行打通了中原与西域的交通，史称\"凿空\"，为丝绸之路的开辟奠定了基础。","w":"normal","e":["核心概念"]},{"t":"海上丝绸之路","y":"名词解释","p":["古代海上贸易与文化通道","形成秦汉，繁荣宋元","泉州、广州、宁波为始发港","输出丝绸瓷器，输入香料珠宝"],"q":"海上丝绸之路是古代中国与外国进行贸易往来和文化交流的海上通道，形成于秦汉，发展于三国隋唐，繁荣于宋元，明初达到顶峰，明中叶后因海禁而衰落。它以泉州、广州、宁波、扬州等为始发港，输出丝绸、瓷器、茶叶，输入香料、珠宝、药材。宋元时期泉州被誉为\"东方第一大港\"，海上丝路是陶瓷外销与宗教传播的重要通道。","w":"normal","e":["核心概念"]},{"t":"【原文】因此汉代以隆重的仪式祭之","y":" 失败，双目失明，第六次终于抵达日本。他在日本传授戒律、建筑、雕塑、医药等技艺，主持修建唐招提寺，为中日文化交流作出卓越贡献。","w":"high","e":["2017 真题"]},{"t":"郑和下西洋","y":"名词解释","p":["明永乐至宣德年间七次远航","最远到达非洲东海岸","途经30余国","比哥伦布早87年","宣德化柔远人的朝贡贸易"],"q":"郑和下西洋是明代永乐至宣德年间（1405—1433年）由宦官郑和率领的七次大规模远洋航行。船队最多达200余艘、2.7万余人，最远到达非洲东海岸与红海沿岸，途经30余国，比哥伦布远航早87年。它以\"宣德化、柔远人\"为宗旨，以朝贡贸易为主，促进了中国与亚非各国的友好往来，但未带来经济扩张。","w":"high","e":["2017 真题","2022 真题"]},{"t":"遣唐使","y":"名词解释","p":["日本学习唐朝的官方使团","630—894年共派十九次","阿倍仲麻吕、空海、吉备真备","全面输入唐制与文化"],"q":"遣唐使是日本为学习唐朝制度文化而派遣的官方使团。自贞观四年（630年）至乾宁元年（894年），日本共派遣唐使十九次，实际成行十余次，每次数百人，成员包括正副使、留学生、学问僧、医师、画师等。阿倍仲麻吕、吉备真备、空海、最澄等皆为杰出代表。遣唐使全面输入了唐朝的典章制度、文字、宗教、建筑与艺术，深刻塑","w":"normal","e":["核心概念"]},{"t":"【原文】也称“十二属相”，指用来","y":"教材原文","p":["也称“十二属相”，指用来计算年岁的十二种动物","近年在内蒙古阴山北麓乌兰察布草原的一块岩石上，发现了刻有战国至西汉时期的十二生肖图像，说明先秦时期已有十二生肖","东汉王充的《论衡》里记载了十二生肖的名称","到魏晋南北朝时期，人们已普遍使用十二生肖"],"q":"也称“十二属相”，指用来计算年岁的十二种动物。近年在内蒙古阴山北麓乌兰察布草原的一块岩石上，发现了刻有战国至西汉时期的十二生肖图像，说明先秦时期已有十二生肖。东汉王充的《论衡》里记载了十二生肖的名称。到魏晋南北朝时期，人们已普遍使用十二生肖。南朝陈代沈炯的《十二属诗》云：“鼠迹生尘案，牛羊暮下来。虎啸坐空谷，兔月向窗开。龙隰远青翠，蛇柳近徘徊。马兰方远摘，羊","w":"normal","e":["原书正文"]},{"t":"【原文】说”，认为这是术家观察、","y":"教材原文","p":["说”，认为这是术家观察、选择的结果","如明代叶子奇在《草木子》中说：“术家以十二生肖配十二辰，每肖各有不足之形焉，如鼠无牙、牛无齿、虎无脾、兔无唇、龙无耳、蛇无足、马无胆、羊无瞳、猴无臀、鸡无肾、犬无肠、猪无筋，人则无不足","”为什么要选用这些有缺陷的动物来代表人的生年呢?这里没有进一步说明，因而解释也难以叫人信服","三是“混合纪年说”，认为十二生肖是古代华夏族纪年法与少数民族纪年法混合的结果"],"q":"说”，认为这是术家观察、选择的结果。如明代叶子奇在《草木子》中说：“术家以十二生肖配十二辰，每肖各有不足之形焉，如鼠无牙、牛无齿、虎无脾、兔无唇、龙无耳、蛇无足、马无胆、羊无瞳、猴无臀、鸡无肾、犬无肠、猪无筋，人则无不足。”为什么要选用这些有缺陷的动物来代表人的生年呢?这里没有进一步说明，因而解释也难以叫人信服。三是“混合纪年说”，认为十二生肖是古代华夏族纪","w":"normal","e":["原书正文"]},{"t":"【原文】人们给每个星座配一种动物","y":"教材原文","p":["人们给每个星座配一种动物，与唐代铜镜完全相符，这就是："],"q":"人们给每个星座配一种动物，与唐代铜镜完全相符，这就是：","w":"normal","e":["原书正文"]},{"t":"【原文】东方: 角(蛟)、 亢(","y":"教材原文","p":["东方: 角(蛟)、 亢(龙)、 氐(貉)、 房(兔)、 心(狐)、尾(虎)、箕(豹)","南方: 井(奸)、鬼(羊)、柳(獐)、星(马)、张(鹿)、翼(蛇)、轸(蚓)"],"q":"东方: 角(蛟)、 亢(龙)、 氐(貉)、 房(兔)、 心(狐)、尾(虎)、箕(豹);南方: 井(奸)、鬼(羊)、柳(獐)、星(马)、张(鹿)、翼(蛇)、轸(蚓);","w":"normal","e":["原书正文"]},{"t":"【原文】西方: 奎(狼)、娄(狗","y":"教材原文","p":["西方: 奎(狼)、娄(狗)、 胃 (雉)、 昴(鸡)、 毕(鸟)、, (猴)、参(猿)","北方: 斗(獬)、牛(牛)、女(蝠)、虚(鼠)、危 (燕)、 室 (猪)、壁()"],"q":"西方: 的文化只能是一种窒息的文化，是毫无生气和自我消亡的文化。中国文化从发生的那一刻起，就呈现出一种多元融合与交汇的态势；发展到今天，更是","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版中国","y":"教材原文","p":["中国文化要略(第4版中国文化要略(第4版必须指出的是，不同文化之间的交流总是相互的、双向的，即使是两种文化有先进和落后之分，也是一种相互影响的关系，并不是某一方总是影响者，而另一方总是被影响者，只不过有时候某一方对另一方的影响可能大一些或小一些而已","成熟的或发达的文化，可能对尚未成熟的或较不发达的文化影响大一些，反之可能小一些","但这也不是一定之规","后者对前者在特定阶段影响大一些的现象，也是可以在文化史上找到的"],"q":"中国文化要略(第4版中国文化要略(第4版必须指出的是，不同文化之间的交流总是相互的、双向的，即使是两种文化有先进和落后之分，也是一种相互影响的关系，并不是某一方总是影响者，而另一方总是被影响者，只不过有时候某一方对另一方的影响可能大一些或小一些而已。成熟的或发达的文化，可能对尚未成熟的或较不发达的文化影响大一些，反之可能小一些。但这也不是一定之规。后者对前者","w":"normal","e":["原书正文"]}]}]},{"id":"culture-c18","t":"第十八章 中国传统文化的基本特征与现代价值","w":"high","s":[{"id":"culture-c18-s01","t":"第一节 中国传统文化的基本特征","w":"high","n":12,"k":[{"t":"中庸之道","y":"名词解释","p":["出自《论语·雍也》","不偏不倚、无过无不及","把握适度、反对极端、追求和谐"],"q":"中庸是儒家重要的伦理与哲学范畴，出自《论语·雍也》。\"中\"指不偏不倚、无过无不及；\"庸\"指平常、恒常。中庸之道主张处理事物要把握适度原则，反对极端，追求和谐，是中华民族重要的思维方式与处世准则。","w":"high","e":["2021 真题"]},{"t":"和而不同","y":"名词解释","p":["出自《论语·子路》","承认差异前提下的和谐","反对无原则苟同","多元共生包容精神"],"q":"出自《论语·子路》\"君子和而不同，小人同而不和\"。\"和\"指在承认差异的前提下求得和谐统一，\"同\"指无原则的苟同。和而不同体现了中国文化包容差异、多元共生的精神，是处理人际关系与文化交流的重要原则。","w":"high","e":["2022 真题"]},{"t":"中国传统文化的基本特征","y":"名词解释","p":["统一性：大一统文化格局","连续性：文明未曾中断","包容性：融合外来与民族文化","多样性：地域与民族异彩纷呈","重伦理尚中庸：儒家伦理为核心"],"q":"中国传统文化在数千年发展中形成的基本特征主要有：①统一性，长期大一统格局使文化具有强大的凝聚力；②连续性，是世界上唯一未曾中断的古老文明；③包容性，能吸纳融合外来文化与少数民族文化；④多样性，地域文化与民族文化异彩纷呈；⑤重伦理、尚中庸，以儒家伦理为核心价值。","w":"high","e":["2018 真题"]},{"t":"天人合一","y":"名词解释","p":["中国传统哲学核心命题","源于《周易》老庄，张载正式提出","主张人与自然和谐统一","对生态文明建设有启示"],"q":"天人合一是中国传统哲学关于天人关系的核心命题，强调人与自然、天道与人道的统一和谐。其思想渊源可追溯至《周易》与老庄，庄子提出\"天地与我并生，万物与我为一\"，董仲舒发展为\"天人感应\"，宋代张载正式提出\"天人合一\"的命题。这一观念主张人应顺应自然规律、与自然和谐共生，对当代生态文明建设具有重要启示意义。","w":"normal","e":["核心概念"]},{"t":"【原文】佛教传入中国，是中外文化","y":"教材原文","p":["佛教传入中国，是中外文化交流史上最重大的事件之一，也是对中国社会影响深远的文化交融的结果之一","印度佛经传入中国内地经由两条路线：一条是陆路，即由中亚、西亚地区传入我国新疆地区，然后再深入中原地区","史书上记载的东汉明帝永平十年印度僧人迦叶摩腾、竺法兰等以白马驮经到达洛阳，就是经由陆路而来的","稍后的安世高和支娄迦谶也是通过这条路线来到中原的"],"q":"佛教传入中国，是中外文化交流史上最重大的事件之一，也是对中国社会影响深远的文化交融的结果之一。印度佛经传入中国内地经由两条路线：一条是陆路，即由中亚、西亚地区传入我国新疆地区，然后再深入中原地区。史书上记载的东汉明帝永平十年印度僧人迦叶摩腾、竺法兰等以白马驮经到达洛阳，就是经由陆路而来的； 稍后的安世高和支娄迦谶也是通过这条路线来到中原的。另一条是海路，大约","w":"normal","e":["原书正文"]},{"t":"【原文】中外文化交流中外文化交流","y":"教材原文","p":["中外文化交流中外文化交流449449如前所说，佛教传入中国以后，在魏晋南北朝时得到很快的发展","4世纪，朝鲜半岛正处于高丽、百济、新罗三国鼎立的时代，前秦苻坚于建元八年(372年) 派遣使者和僧人顺道送佛经、佛像至高丽，随后，又有僧人阿道至高丽","不久，高丽即建寺供顺道、阿道居住，这就是佛教在朝鲜半岛传播的开始","到7 世纪时，新罗统一朝鲜半岛，与唐朝交往甚密，来华留学的僧人很多，隋唐佛教宗派也陆续东传，特别是禅宗传入朝鲜半岛之后，在新罗时代发展成“禅门九山”，盛极一时"],"q":"中外文化交流中外文化交流449449如前所说，佛教传入中国以后，在魏晋南北朝时得到很快的发展。4世纪，朝鲜半岛正处于高丽、百济、新罗三国鼎立的时代，前秦苻坚于建元八年(372年) 派遣使者和僧人顺道送佛经、佛像至高丽，随后，又有僧人阿道至高丽。不久，高丽即建寺供顺道、阿道居住，这就是佛教在朝鲜半岛传播的开始。到7 世纪时，新罗统一朝鲜半岛，与唐朝交往甚密，来","w":"normal","e":["原书正文"]},{"t":"【原文】6世纪时，佛教从朝鲜半岛","y":"教材原文","p":["6世纪时，佛教从朝鲜半岛南部的百济传入日本","这时的日本正由分散的部族权力结构向统一的中央政府过渡，摄政的圣德太子决定利用佛教作"],"q":"6世纪时，佛教从朝鲜半岛南部的百济传入日本。这时的日本正由分散的部族权力结构向统一的中央政府过渡，摄政的圣德太子决定利用佛教作","w":"normal","e":["原书正文"]},{"t":"【原文】为政治思想工具，要求全体","y":"教材原文","p":["为政治思想工具，要求全体臣民信佛","随后，便有中国和朝鲜半岛的僧人赴日传法，日本僧人也大批来华求法，其中，扬州大明寺僧人鉴真，应日本僧人邀请，排除艰难险阻，六次冒死东渡，终于在天宝十三载(754年)东渡成功，并且在日本弘扬律宗，为中日文化交流写下光辉的一页，他自己也成为日本律宗的始祖","入华习法的日本僧人空海、最澄、圆仁等，也是中日文化交流史上的功臣","空海于唐贞元二十年(804年) 来华在长安青龙寺研习密宗与汉学，回国后在日本建立了“真言宗”，史称“东密”"],"q":"为政治思想工具，要求全体臣民信佛。随后，便有中国和朝鲜半岛的僧人赴日传法，日本僧人也大批来华求法，其中，扬州大明寺僧人鉴真，应日本僧人邀请，排除艰难险阻，六次冒死东渡，终于在天宝十三载(754年)东渡成功，并且在日本弘扬律宗，为中日文化交流写下光辉的一页，他自己也成为日本律宗的始祖。入华习法的日本僧人空海、最澄、圆仁等，也是中日文化交流史上的功臣。空海于唐贞","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)450450在印度佛教东传的同时，中国的僧人兴起了西行求法活动","为了寻求佛教真谛，一些僧人不畏艰险，长途跋涉，西行广求佛典，形成一股热潮","据统计，西晋时已有三人西行求法，东晋已多达37人，六朝时达百人以上","其中以东晋时代的法显成就最大"],"q":"中国文化要略(第4版)中国文化要略(第4版)450450在印度佛教东传的同时，中国的僧人兴起了西行求法活动。为了寻求佛教真谛，一些僧人不畏艰险，长途跋涉，西行广求佛典，形成一股热潮。据统计，西晋时已有三人西行求法，东晋已多达37人，六朝时达百人以上。其中以东晋时代的法显成就最大。法显(334—420年)，晋平阳郡武阳(今山西省襄垣县) 人，三岁出家，二十岁受","w":"normal","e":["原书正文"]},{"t":"【原文】唐代僧人西行求法的代表","y":"教材原文","p":["唐代僧人西行求法的代表","玄奘(602—664年)，俗姓陈，名祎，河南缑氏(今偃师市) 人，出家后在长安、成都等地遍访名师","为了了解佛学底蕴，"],"q":"唐代僧人西行求法的代表。玄奘(602—664年)，俗姓陈，名祎，河南缑氏(今偃师市) 人，出家后在长安、成都等地遍访名师。为了了解佛学底蕴，","w":"normal","e":["原书正文"]},{"t":"【原文】玄奘于唐贞观元年(627","y":"教材原文","p":["玄奘于唐贞观元年(627年) 私出玉门关，取道西域，经葱岭，到达古印度境内，研习讲学，周游印度，历时17年，于贞观十七年 (643年) 载誉回国，"],"q":"玄奘于唐贞观元年(627年) 私出玉门关，取道西域，经葱岭，到达古印度境内，研习讲学，周游印度，历时17年，于贞观十七年 (643年) 载誉回国，","w":"normal","e":["原书正文"]},{"t":"【原文】主持佛经翻译，其所著《大","y":"教材原文","p":["主持佛经翻译，其所著《大唐西域记》详述亲所历见的各国风土人情，成为中外文化交流史上的不朽之作","义净(635——713年)，比玄奘略晚，俗姓"],"q":"主持佛经翻译，其所著《大唐西域记》详述亲所历见的各国风土人情，成为中外文化交流史上的不朽之作。义净(635——713年)，比玄奘略晚，俗姓","w":"normal","e":["原书正文"]}]},{"id":"culture-c18-s02","t":"第二节 传统文化的现代价值","w":"high","n":10,"k":[{"t":"试论如何正确对待中国传统文化","y":"名词解释","p":["批判继承取其精华去其糟粕","创造性转化与创新性发展","坚持马克思主义指导反对两种错误倾向","坚定文化自信推动文化走出去"],"q":"正确对待中国传统文化应坚持：①批判继承，取其精华、去其糟粕，区分民主性精华与封建性糟粕；②创造性转化、创新性发展，使传统文化与当代社会相适应、与现代文明相协调；③坚持马克思主义指导，坚守中华文化立场，反对历史虚无主义与全盘复古；④加强文化自信，推动中华优秀传统文化走向世界，增强国家文化软实力。","w":"high","e":["2023 真题","2019 真题"]},{"t":"文化自信","y":"名词解释","p":["对自身文化价值的充分肯定","对文化生命力的坚定信念","源于优秀传统文化与先进文化"],"q":"文化自信是一个国家、一个民族对自身文化价值的充分肯定和对自身文化生命力的坚定信念。它源于中华优秀传统文化、革命文化和社会主义先进文化，是更基础、更广泛、更深厚的自信。","w":"normal","e":["核心概念"]},{"t":"横渠四句","y":"名词解释","p":["北宋张载（横渠）提出","为天地立心、为生民立命","为往圣继绝学、为万世开太平","儒家士人担当精神的经典表达"],"q":"横渠四句是北宋理学家张载（号横渠）在《横渠语录》中提出的名言：\"为天地立心，为生民立命，为往圣继绝学，为万世开太平。\"它概括了儒家士人的最高理想：以天地之心为心确立价值本体，为民众安身立命，继承弘扬圣贤绝学，开创万世太平。这四句话是中国传统知识分子担当精神的经典表达。","w":"normal","e":["核心概念"]},{"t":"试论中国传统文化与现代化的关系","y":"名词解释","p":["传统文化是现代化的根基与资源","积极因素提供价值支撑","消极因素需改造","现代化推动传统文化创新发展"],"q":"二者是辩证统一的关系：①传统文化是现代化的根基与精神资源，现代化不能割断历史；②传统文化中重伦理、重和谐、重整体的思想可为现代化提供价值支撑；③传统文化中的等级观念、因循守旧等消极因素会阻碍现代化，必须加以改造；④现代化为传统文化注入新的时代内涵，推动其创造性转化与创新性发展，二者在互动中共同演进。","w":"normal","e":["核心概念"]},{"t":"【原文】及其思想就随着耶稣会传教","y":"教材原文","p":["及其思想就随着耶稣会传教士的东行传到中国来了","这些传教士的先行者和奠基人便是意大利人利玛窦"],"q":"及其思想就随着耶稣会传教士的东行传到中国来了。这些传教士的先行者和奠基人便是意大利人利玛窦。","w":"normal","e":["原书正文"]},{"t":"【原文】利 玛 窦 (Matte","y":"教材原文","p":["利 玛 窦 (Matte o Ricci, 1552—1610年) 于 1582年来华, 先在澳门研习中文，次年进入肇庆，获准建筑教堂，并开始传教","他与各级官员和社会名流交往，宣讲欧洲文物和典章制度，介绍西方的天文、算学、理化知识，将自鸣钟、地图、天象仪器和三棱镜陈列于室内任人参观，起到了很好的宣传作用","1589年，利玛窦到韶州，大力结交官绅，攻读儒家经典，改穿儒服，习用儒礼，为北上进京做准备","1601年，利玛窦等人终于抵达"],"q":"利 玛 窦 (Matte o Ricci, 1552—1610年) 于 1582年来华, 先在澳门研习中文，次年进入肇庆，获准建筑教堂，并开始传教。他与各级官员和社会名流交往，宣讲欧洲文物和典章制度，介绍西方的天文、算学、理化知识，将自鸣钟、地图、天象仪器和三棱镜陈列于室内任人参观，起到了很好的宣传作用。1589年，利玛窦到韶州，大力结交官绅，攻读儒家经典，","w":"normal","e":["原书正文"]},{"t":"【原文】北京，朝见明神宗，献上天","y":"教材原文","p":["北京，朝见明神宗，献上天主经像、自鸣钟、万国图及西洋琴等礼物，获准在宣武门内居住传教"],"q":"北京，朝见明神宗，献上天主经像、自鸣钟、万国图及西洋琴等礼物，获准在宣武门内居住传教。","w":"normal","e":["原书正文"]},{"t":"【原文】利玛窦在京期间，以尊儒为","y":"教材原文","p":["利玛窦在京期间，以尊儒为旗号，以所著《天主实义》为蓝本，不遗余力地进行传教活动，到他去世时已有教徒2，500 余人","他的传教活动注意吸纳中国传统文化，融儒学与天主教义于一体，因而在明朝官绅和知识分子中间产生了广泛的影响","徐光启、李之藻、杨廷筠等朝野名流先后受洗，成为明末中国天主教的三大柱石","徐光启还与利玛窦合译欧几里得的《几何原本》，李之藻则随利玛窦学习地理和历算"],"q":"利玛窦在京期间，以尊儒为旗号，以所著《天主实义》为蓝本，不遗余力地进行传教活动，到他去世时已有教徒2，500 余人。他的传教活动注意吸纳中国传统文化，融儒学与天主教义于一体，因而在明朝官绅和知识分子中间产生了广泛的影响。徐光启、李之藻、杨廷筠等朝野名流先后受洗，成为明末中国天主教的三大柱石。徐光启还与利玛窦合译欧几里得的《几何原本》，李之藻则随利玛窦学习地理","w":"normal","e":["原书正文"]},{"t":"【原文】中国文化要略(第4版)中","y":"教材原文","p":["中国文化要略(第4版)中国文化要略(第4版)456456西方各国来华的传教士，以传教为其根本目的，但他们为了传教，也努力学习中国语言文字和典籍，了解中国社会，顺应中国风俗，从而也受到中国文化的熏染","在这样一个前提下，他们开始向欧洲、向他们的国家，提供更真实的与中国相关的信息，介绍中国文化","利玛窦首先于 1593 年将“四书”译成拉丁文","1626年,法国人金尼阁(Nicolas Trigault) 又将“五经”译成拉丁文, 并在杭州刊印"],"q":"中国文化要略(第4版)中国文化要略(第4版)456456西方各国来华的传教士，以传教为其根本目的，但他们为了传教，也努力学习中国语言文字和典籍，了解中国社会，顺应中国风俗，从而也受到中国文化的熏染。在这样一个前提下，他们开始向欧洲、向他们的国家，提供更真实的与中国相关的信息，介绍中国文化。利玛窦首先于 1593 年将“四书”译成拉丁文;1626年,法国人金尼","w":"normal","e":["原书正文"]},{"t":"【原文】的同时，传教士对中国的文","y":"教材原文","p":["的同时，传教士对中国的文明史也发生了浓厚的兴趣，于是介绍中国历史和地理的著作便接连出现","最早的一本是西班牙人门多萨(Juan Gonsales de Mendoza) 于1585年在罗马出版的西班牙文《中华大帝国史》，接着又有意大利人卫匡国(Martino Martini) 的《中国历史》、法国人冯秉正 (Joseph de Moyriac de Mailla) 的《中国通史》等","随后法国人杜赫德(Jean Baptiste du Halde) 编撰的《中华帝国志》，也于1735年在巴黎印行，成为欧洲人研究中国的百科全书式的著作","此书的第一卷记述各省地理和历朝编年史，第二卷研究中国的政治、经济和教育，第三卷介绍宗教、道德和医药等，第四卷则专门研究满、蒙、西藏、朝鲜"],"q":"的同时，传教士对中国的文明史也发生了浓厚的兴趣，于是介绍中国历史和地理的著作便接连出现。最早的一本是西班牙人门多萨(Juan Gonsales de Mendoza) 于1585年在罗马出版的西班牙文《中华大帝国史》，接着又有意大利人卫匡国(Martino Martini) 的《中国历史》、法国人冯秉正 (Joseph de Moyriac de Maill","w":"normal","e":["原书正文"]}]}]}]},{"d":"yinlun","t":"对外汉语教育学引论","c":[{"id":"yinlun-c01","t":"第一章 对外汉语教育是一门专门的学科","w":"high","s":[{"id":"yinlun-c01-s01","t":"第一节 对外汉语教育的学科名称","w":"high","n":18,"k":[{"t":"第一语言","y":"名词解释","p":["人出生以后首先接触并获得的语言","第二语言指人们在获得第一语言以后再学习和使用的另一种语言。","这是按人们获得语言的先后顺序来区分的两个概念，也是语言教学理论中用得最多的术语。"],"q":"人出生以后首先接触并获得的语言","w":"high","e":["2013 真题","2019 真题"]},{"t":"第二语言","y":"名词解释","p":["指人们在获得第一语言以后再学习和使用的另一种语言","由于学习这些语言的规律与学习第二语言有很多共同之处，所以一般不再细分而统称第二语言。","广义的“第二语言”是指任何一种在第一语言获得以后学习和使用的语言，包括外语。"],"q":"指人们在获得第一语言以后再学习和使用的另一种语言","w":"high","e":["2019 真题"]},{"t":"应用语言学","y":"名词解释","p":["这是使用得最早、最为普遍的名称。早在19世纪末就由波兰语言学家博杜恩·德·库尔特内（Baudouin de Courtenay）提出。","广义的应用语言学是跟理论语言学相对的概念，指把理论语言学的理论、规律、原则和方法应用到其他学科领域，从而产生的新的边缘学科。","狭义的应用语言学则专指语言学理论在语言教学中的应用，特别是指第二语言教学。","把应用语言学用作本学科的名称并不恰当，因为本学科的性质绝不仅仅是“应用”，它所应用的更不仅仅是“语言学”。"],"q":"这是使用得最早、最为普遍的名称。早在19世纪末就由波兰语言学家博杜恩·德·库尔特内（Baudouin de Courtenay）提出。","w":"high","e":["2017 真题"]},{"t":"对外汉语教学","y":"名词解释","p":["《中国大百科全书·语言文字》中写道：“对外汉语教学是指对外国人的汉语教学。”","实际上也包括对第一语言不是汉语的海外华人进行的汉语教学。","这一名称基本上体现了这个学科的特点和内涵，在国外也产生了广泛的影响，而且简洁上口、符合汉语习惯，因此从1982年提出一直使用至今。","但是十多年的使用也发现这一名称有一定的局限性：它只突出了主要教学对象，未能全面、准确地反映学科性质——第二语言教学。"],"q":"《中国大百科全书·语言文字》中写道：“对外汉语教学是指对外国人的汉语教学。”","w":"high","e":["2015 真题","2021 真题"]},{"t":"母语","y":"名词解释","p":["母语是指本国、本民族的语言","这是按国家的界限来区分的。","外语是指外国的语言。一般情况下母语是人们的第一语言；但对一些移居国外的人来说，其子女出生后首先接触并获得的语言有可能是居住国的语言而不是母语。"],"q":"母语是指本国、本民族的语言","w":"normal","e":["核心概念"]},{"t":"本族语","y":"名词解释","p":["本族语就是本民族的语言，因此这一术语与“母语”可以通用","这是按言语社团、通常是民族的界限来区分的。非本族语是指本民族以外的语言，可能是外语，也可能是指本国其他民族的语言。"],"q":"本族语就是本民族的语言，因此这一术语与“母语”可以通用","w":"normal","e":["核心概念"]},{"t":"教育语言学","y":"名词解释","p":["国外的语言教育专家对学科体系的研究非常重视。","美国学者斯波尔斯基（B. Spolsky）主张用“教育语言学”。","加拿大学者斯特恩（H. H. Stern）提出“第二语言教学理论的一般模式”；斯波尔斯基基于1980年提出“教育语言学理论模式”。","在斯波尔斯基的模式中，语言描写、语言学习理论和语言运用理论成为第二语言教学理论的主要来源。"],"q":"国外的语言教育专家对学科体系的研究非常重视。","w":"normal","e":["核心概念"]},{"t":"对外汉语教育学","y":"名词解释","p":["从教育的高度研究对外汉语教学，反映到本学科的名称上，本书主张应与其他学科教育学的名称相一致，即用“对外汉语教育学”比较规范。","这一名称还能更清楚地体现出本学科的性质及其科学定位。","当然，提出“对外汉语教育”并不意味着、实际上也不可能用它来取代已使用近20年之久、早已深入人心的“对外汉语教学”这一名称。"],"q":"从教育的高度研究对外汉语教学，反映到本学科的名称上，本书主张应与其他学科教育学的名称相一致，即用“对外汉语教育学”比较规范。","w":"normal","e":["核心概念"]},{"t":"非本族语一定是外语。","y":"名词解释","p":["非本族语可能指本国其他民族的语言","对我国蒙族来说，汉语是非本族语，是本国其他民族的语言，但绝不能称作外语"],"q":"错误。非本族语是指本民族以外的语言，可能是外语，也可能是指本国其他民族的语言。","w":"normal","e":["核心概念"]},{"t":"汉语作为第二语言的教学","y":"名词解释","p":["从学术上较能精确地指称这一学科内涵和性质的，应当是“汉语作为第二语言教学”，即“Teaching of Chinese as a Second Language”（英文缩写为TCSL）。","这一名称既能指在中国进行的对外国人的汉语教学、即对外汉语教学，也能指世界各地的汉语教学，而且还能包括与之性质大体相同的对我国国内少数民族的汉语教学。","也就是说，它能涵盖第一语言以外的所有汉语教学，同时又能体现出它与其上位学科——整个第二语言教学学科的关系。"],"q":"从学术上较能精确地指称这一学科内涵和性质的，应当是“汉语作为第二语言教学”，即“Teaching of Chinese as a Second Language”（英文缩写为TCSL）。","w":"normal","e":["核心概念"]},{"t":"【原文】(uɔ\"IOSOLW*m","y":"教材原文","p":["(uɔ\"IOSOLW*mmm) ☒塑料梯袋丢单鞋(uɔ\"IOSOLW*mmm) ☒塑料梯袋丢单鞋ど00’9Z :ど00’9Z :"],"q":"(uɔ\"IOSOLW*mmm) ☒塑料梯袋丢单鞋(uɔ\"IOSOLW*mmm) ☒塑料梯袋丢单鞋ど00’9Z :ど00’9Z :","w":"normal","e":["原书正文"]},{"t":"【原文】222806 9S∠82","y":"教材原文","p":["222806 9S∠8222806 9S∠866L-ク∠80-619S-∠ NESIL-ク∠80-619S-∠ NESI"],"q":"222806 9S∠8222806 9S∠866L-ク∠80-619S-∠ NESIL-ク∠80-619S-∠ NESI","w":"normal","e":["原书正文"]},{"t":"【原文】唑唑丹／长颈匣脯丹／长颈","y":"教材原文","p":["唑唑丹／长颈匣脯丹／长颈匣脯(uɔ\"IOSOLWmmm) 网塑业 排票多重期单(uɔ\"IOSOLWmmm) 网塑业 排票多重期单"],"q":"唑唑丹／长颈匣脯丹／长颈匣脯(uɔ\"IOSOLWmmm) 网塑业 排票多重期单(uɔ\"IOSOLWmmm) 网塑业 排票多重期单","w":"normal","e":["原书正文"]},{"t":"【原文】(京) 新登字157号图","y":"教材原文","p":["(京) 新登字157号图书在版编目 (CIP) 数据对外汉语教育学引论/刘珣著 .—北京：北京语言文化大学出版社，2000印"],"q":"(京) 新登字157号图书在版编目 (CIP) 数据对外汉语教育学引论/刘珣著 .—北京：北京语言文化大学出版社，2000印","w":"normal","e":["原书正文"]},{"t":"【原文】Ⅲ.对外汉语教学——教学","y":"教材原文","p":["Ⅲ.对外汉语教学——教学理论Ⅳ. H195.1中国版本图书馆CIP数据核字 (2000) 第36992号责任印制：乔学军"],"q":"Ⅲ.对外汉语教学——教学理论Ⅳ. H195.1中国版本图书馆CIP数据核字 (2000) 第36992号责任印制：乔学军","w":"normal","e":["原书正文"]},{"t":"【原文】责任校对：周 均出版发行","y":"教材原文","p":["责任校对：周 均出版发行：北京语言文化大学出版社(北京海淀区学院路 15号 邮政编码 100083 )印 刷：北京北林印刷厂"],"q":"责任校对：周 均出版发行：北京语言文化大学出版社(北京海淀区学院路 15号 邮政编码 100083 )印 刷：北京北林印刷厂","w":"normal","e":["原书正文"]},{"t":"【原文】经 销：全国新华书店版 ","y":"教材原文","p":["经 销：全国新华书店版 次：２０００年１月第１版 ２０００年１月第１次印刷开 本： 850毫米×1168毫米 1/32 印张： 13.75"],"q":"经 销：全国新华书店版 次：２０００年１月第１版 ２０００年１月第１次印刷开 本： 850毫米×1168毫米 1/32 印张： 13.75","w":"normal","e":["原书正文"]},{"t":"【原文】字 数： 357千字 印","y":"教材原文","p":["字 数： 357千字 印数：0001－2000书 号： ISBN7－5619－0874－1／H·0054定 价"],"q":"字 数： 357千字 印数：0001－2000书 号： ISBN7－5619－0874－1／H·0054定 价； 26.00元","w":"normal","e":["原书正文"]}]},{"id":"yinlun-c01-s02","t":"第二节 对外汉语教育的学科任务和学科体系","w":"high","n":15,"k":[{"t":"学科体系","y":"名词解释","p":["学科体系是一门学科的结构系统，它显示构成该学科的内部和外部因素以及这些因素之间的关系，其核心部分是学科的理论体系。","学科体系既体现了学科的内容及学科的性质特征，同时又能为学科的理论研究和整个学科建设指明方向。"],"q":"学科体系是一门学科的结构系统，它显示构成该学科的内部和外部因素以及这些因素之间的关系，其核心部分是学科的理论体系。","w":"high","e":["2018 真题"]},{"t":"汉语习得理论","y":"名词解释","p":["汉语习得理论是对对外汉语教学的主体——学习者的研究，即侧重从心理学的角度研究教学对象的学习过程和学习规律。","随着认知心理学和教育心理学的发展和语言习得研究本身的进展，人们逐渐认识到“教”的成功与否决定性的因素还在“学”的方面，对“学”的研究是对“教”的研究的基础和前提。"],"q":"汉语习得理论是对对外汉语教学的主体——学习者的研究，即侧重从心理学的角度研究教学对象的学习过程和学习规律。","w":"high","e":["2019 真题"]},{"t":"对外汉语语言学","y":"名词解释","p":["对外汉语语言学是作为第二语言来教学和研究的汉语语言学，包括语音、词汇、语法、汉字、语义、语用、话语、功能和文化因素等方面。","对对外汉语语言学的研究是对对外汉语教学内容的研究；从教育学的角度来分析，也是对对外汉语教学的客体的研究。","语言学和汉语语言学（一般指作为母语研究的汉语语言学）是对外汉语教学的理论基础，对本学科研究汉语起指导的作用，但它不能代替本学科对汉语的研究。","本学科需要从第二语言学习和教学这一新的角度来描写汉语、研究汉语。"],"q":"对外汉语语言学是作为第二语言来教学和研究的汉语语言学，包括语音、词汇、语法、汉字、语义、语用、话语、功能和文化因素等方面。","w":"high","e":["2020 真题"]},{"t":"对外汉语教学理论","y":"名词解释","p":["对外汉语教学理论是把上述两个方面——对教学内容和对教学对象的研究结合起来，即研究如何通过教学活动使教学内容为学习者迅速、有效掌握的规律和原理。","教学理论有时也称为教学论或教学原理（甚至称为教学法），这是本学科研究的传统领域。","我们亟须把教学论的教学目的、教学原则、教学过程、课程设置、教学方法、教学手段和教学评估等一般理论与对外汉语教学的规律紧密结合起来，形成有自己特色的对外汉语教学理论。"],"q":"对外汉语教学理论是把上述两个方面——对教学内容和对教学对象的研究结合起来，即研究如何通过教学活动使教学内容为学习者迅速、有效掌握的规律和原理。","w":"high","e":["2021 真题"]},{"t":"对外汉语教育学科的任务","y":"名词解释","p":["对外汉语教育学科的任务是研究汉语作为第二语言的教育原理、教育过程和教育方法，并用来指导教育实践，从而更好地实现学习者德智体美全面发展的教育目的。","对外汉语教育学科研究的核心内容是对外汉语教学。","对外汉语教育作为一门分支学科，它还有一项任务，即以自身的学科理论建设，为第二语言教育学科甚至整个语言教育学科的理论发展做出贡献。"],"q":"对外汉语教育学科的任务是研究汉语作为第二语言的教育原理、教育过程和教育方法，并用来指导教育实践，从而更好地实现学习者德智体美全面发展的教育目的。","w":"high","e":["2016 真题"]},{"t":"应用研究","y":"名词解释","p":["应用研究指运用相关学科和本学科的基础理论，对总体设计、教材编写、课堂教学、测试评估、教学管理和师资培养等方面进行专门的研究。","用学科的基础理论来指导教学实践，需要经过学科应用研究这个中介环节。","应用研究与教学实践最为接近，可以直接用来指导相关的教学活动。","本学科的理论体系除基础理论外，还有应用研究。"],"q":"应用研究指运用相关学科和本学科的基础理论，对总体设计、教材编写、课堂教学、测试评估、教学管理和师资培养等方面进行专门的研究。","w":"normal","e":["核心概念"]},{"t":"学科研究方法学","y":"名词解释","p":["本体系中所说的学科研究方法学，是指受哲学方法论普遍规律的指导，用来探讨对本学科最具针对性的方法论原则，并着重研究适用于本学科的一般方法，特别是本学科特有的方法。","学科研究方法学也是本学科理论体系的一个重要组成部分，研究方法在很大程度上决定研究的成果，甚至影响到研究的成功与失败。"],"q":"本体系中所说的学科研究方法学，是指受哲学方法论普遍规律的指导，用来探讨对本学科最具针对性的方法论原则，并着重研究适用于本学科的一般方法，特别是本学科特有的方法。","w":"normal","e":["核心概念"]},{"t":"【原文】一、对外国学习者的教育目","y":"教材原文","p":["一、对外国学习者的教育目的…………………………(293)二、对外汉语教学目的…………………………………………(295)三、对外汉语教学的课程设计…………………………(298)"],"q":"一、对外国学习者的教育目的…………………………(293)二、对外汉语教学目的…………………………………………(295)三、对外汉语教学的课程设计…………………………(298)","w":"normal","e":["原书正文"]},{"t":"【原文】教学内容课程设计教学计划","y":"教材原文","p":["教学内容课程设计教学计划与教学大纲第二节对外汉语教学的基本教学原则………………(302)一、确立教学原则的指导思想⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯(303)"],"q":"教学内容课程设计教学计划与教学大纲第二节对外汉语教学的基本教学原则………………(302)一、确立教学原则的指导思想⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯(303)","w":"normal","e":["原书正文"]},{"t":"【原文】二、对外汉语教学的基本教","y":"教材原文","p":["二、对外汉语教学的基本教学原则…………………(305)第三节对外汉语教材的编写与选用⋯⋯⋯⋯⋯⋯⋯⋯(312)一、教材的重要性⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯(312)"],"q":"二、对外汉语教学的基本教学原则…………………(305)第三节对外汉语教材的编写与选用⋯⋯⋯⋯⋯⋯⋯⋯(312)一、教材的重要性⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯(312)","w":"normal","e":["原书正文"]},{"t":"【原文】二、教材的依据……………","y":"教材原文","p":["二、教材的依据…………………………………………………………………(313)三、教材编写和选用的原则………………………………(313)"],"q":"二、教材的依据…………………………………………………………………(313)三、教材编写和选用的原则………………………………(313)","w":"normal","e":["原书正文"]},{"t":"【原文】四、教材设计的类型………","y":"教材原文","p":["四、教材设计的类型……………………………………………………(318)五、我国对外汉语教材的发展…………………………(322)"],"q":"四、教材设计的类型……………………………………………………(318)五、我国对外汉语教材的发展…………………………(322)","w":"normal","e":["原书正文"]},{"t":"【原文】六、对外汉语教材建设中存","y":"教材原文","p":["六、对外汉语教材建设中存在的主要问题………(331)第九章对外汉语教学理论与应用(下)……………(335)第一节对外汉语教学过程与课堂教学………………(335)"],"q":"六、对外汉语教材建设中存在的主要问题………(331)第九章对外汉语教学理论与应用(下)……………(335)第一节对外汉语教学过程与课堂教学………………(335)","w":"normal","e":["原书正文"]},{"t":"【原文】一、教学过程的重要因素：","y":"教材原文","p":["一、教学过程的重要因素：教师和学生…………(336)二、教学过程的基本阶段……………………………………(338)三、对外汉语课堂教学的特点与环节⋯⋯⋯⋯⋯(340)"],"q":"一、教学过程的重要因素：教师和学生…………(336)二、教学过程的基本阶段……………………………………(338)三、对外汉语课堂教学的特点与环节⋯⋯⋯⋯⋯(340)","w":"normal","e":["原书正文"]},{"t":"【原文】第二节对外汉语语音、词汇","y":"教材原文","p":["第二节对外汉语语音、词汇、语法、汉字教学………(355)"],"q":"第二节对外汉语语音、词汇、语法、汉字教学………(355)","w":"normal","e":["原书正文"]}]},{"id":"yinlun-c01-s03","t":"第三节 对外汉语教育的学科性质和学科特点","w":"high","n":13,"k":[{"t":"应用的学科","y":"名词解释","p":["我们把与实践紧密联系、直接解决实际问题的学科称为应用学科。","对外汉语教育是一门理论与实践紧密结合、具有极强实践性的应用学科。","应用学科也有其自身的基础理论研究领域和理论体系，它不仅需要进行具体的应用研究，不仅关注应用过程本身，而且要进行与之相关的基础理论研究。","它面对着对外汉语教育的实际和大量亟待解决的问题，理论研究的目的在于指导教育实践。"],"q":"我们把与实践紧密联系、直接解决实际问题的学科称为应用学科。","w":"high","e":["2019 真题"]},{"t":"综合交叉学科","y":"名词解释","p":["对外汉语教育是一门综合交叉学科。","由两门学科相交而介于其间的，称为边缘交叉学科；由多门学科涉及到同一对象而形成的综合性学科，称为综合交叉学科。","它综合了多种学科的理论成果，研究本学科所面临的特殊课题，从而形成并逐步完善自身的学科理论。","作为本学科理论基础的七个主要学科：语言学、心理学、教育学、文化学、社会学、横断学科及哲学。"],"q":"对外汉语教育是一门综合交叉学科。","w":"high","e":["2017 真题"]},{"t":"对外汉语教学的性质","y":"名词解释","p":["对外汉语教学是一种第二语言教学，也是一种外语教学。","从上述四个方面可以概括出对外汉语教学的性质是汉语作为第二语言的教学，它是第二语言教学的分支学科。","对外汉语教学首先是语言教学；对外汉语教学是第二语言教学；对外汉语教学是汉语作为第二语言的教学；对外汉语教学是对外国人进行的汉语作为第二语言的教学。"],"q":"对外汉语教学是一种第二语言教学，也是一种外语教学。","w":"high","e":["2016 真题","2022 真题"]},{"t":"对外汉语教学的特点","y":"名词解释","p":["（1）以培养汉语交际能力为目标——不是让已具备汉语运用能力的本族人掌握更多的语言和文化知识，而是让作为第二语言的学习者掌握用汉语进行听说读写交际活动的能力。","（2）以技能训练为中心，将语言知识转化为技能。","这些性质和特点也影响到对外汉语教学基本原则等一系列问题的确定。"],"q":"（1）以培养汉语交际能力为目标——不是让已具备汉语运用能力的本族人掌握更多的语言和文化知识，而是让作为第二语言的学习者掌握用汉语进行听说读写交际活动的能力。","w":"high","e":["2018 真题"]},{"t":"专门的学科","y":"名词解释","p":["所谓专门的学科，就是指它有专门的研究对象、研究任务和研究视角，是别的学科所无法替代的。","对外汉语教育是一门专门的学科。","对外汉语教育的研究对象，是汉语作为第二语言的教育现象、教育原理和教育方法，并以对外汉语教学为核心。","本学科的研究任务和教学任务，是其他任何学科，包括最相近的语言学学科、外语教育学科、甚至母语文教育学科所不承担的。"],"q":"所谓专门的学科，就是指它有专门的研究对象、研究任务和研究视角，是别的学科所无法替代的。","w":"normal","e":["核心概念"]},{"t":"【原文】一种模式(见图3)","y":"教材原文","p":["一种模式(见图3)","这一模式把学科体系分成三个部分：理论基础、学科理论和教学实践"],"q":"一种模式(见图3)。这一模式把学科体系分成三个部分：理论基础、学科理论和教学实践。","w":"normal","e":["原书正文"]},{"t":"【原文】(1) 理论基础部分提出","y":"教材原文","p":["(1) 理论基础部分提出与本学科的发展关系最密切的七个基础学科，即语言学、心理学、教育学、文化学、社会学、横断学科及哲学","这七个学科中又包括一些分支学科或边缘学科","这里不详细讨论每门学科对本学科所发挥的作用","需要特别指出的是，这七个学科本身都是独立的学科，不能算作本学科的理论，而且 一般说来这些理论不能直接应用于本学科的语言教学"],"q":"(1) 理论基础部分提出与本学科的发展关系最密切的七个基础学科，即语言学、心理学、教育学、文化学、社会学、横断学科及哲学。这七个学科中又包括一些分支学科或边缘学科。这里不详细讨论每门学科对本学科所发挥的作用。需要特别指出的是，这七个学科本身都是独立的学科，不能算作本学科的理论，而且 一般说来这些理论不能直接应用于本学科的语言教学；但它们都从不同方面，特别是语","w":"normal","e":["原书正文"]},{"t":"【原文】(2) 直接应用于语言教","y":"教材原文","p":["(2) 直接应用于语言教学、属于本学科范围内的学科理论体系，包括基础理论和应用研究两部分"],"q":"(2) 直接应用于语言教学、属于本学科范围内的学科理论体系，包括基础理论和应用研究两部分。","w":"normal","e":["原书正文"]},{"t":"【原文】作为一门独立的学科或者说","y":"教材原文","p":["作为一门独立的学科或者说专门的学科，应当有体现本学科性质、内容和特点，并对本学科具有直接指导作用、真正属于自己的基础理论","本学科的基础理论包括四个方面：对外汉语语言学、对外汉语教学理论、汉语习得理论和学科研究方法学","这也是我们学科理论研究的四个主要方面"],"q":"作为一门独立的学科或者说专门的学科，应当有体现本学科性质、内容和特点，并对本学科具有直接指导作用、真正属于自己的基础理论。本学科的基础理论包括四个方面：对外汉语语言学、对外汉语教学理论、汉语习得理论和学科研究方法学。这也是我们学科理论研究的四个主要方面。","w":"normal","e":["原书正文"]},{"t":"【原文】①对外汉语语言学是作为第","y":"教材原文","p":["①对外汉语语言学是作为第二语言来教学和研究的汉语语言学，包括语音、词汇、语法、汉字、语义、语用、话语、功能和文化因素等方面","对对外汉语语言学的研究是对对外汉语教学内容的研究","从教育学的角度来分析，也是对对外汉语教学的客体的研究","汉语研究在我国已有２０００多年的历史，对现代汉语的研究国内外语言学界也已积累了丰硕的成果，这些研究成果已成为本学科宝贵的资源"],"q":"①对外汉语语言学是作为第二语言来教学和研究的汉语语言学，包括语音、词汇、语法、汉字、语义、语用、话语、功能和文化因素等方面。对对外汉语语言学的研究是对对外汉语教学内容的研究；从教育学的角度来分析，也是对对外汉语教学的客体的研究。汉语研究在我国已有２０００多年的历史，对现代汉语的研究国内外语言学界也已积累了丰硕的成果，这些研究成果已成为本学科宝贵的资源。语言学","w":"normal","e":["原书正文"]},{"t":"【原文】www.MTCSOL.c","y":"教材原文","p":["www.MTCSOL.cn)第一章 对外汉语教育是一门专门的学科第一章 对外汉语教育是一门专门的学科的一般的汉语语言学的特征"],"q":"www.MTCSOL.cn)第一章 对外汉语教育是一门专门的学科第一章 对外汉语教育是一门专门的学科的一般的汉语语言学的特征。","w":"normal","e":["原书正文"]},{"t":"【原文】培养汉语作为第二语培养汉","y":"教材原文","p":["培养汉语作为第二语培养汉语作为第二语培养对外汉语教培养对外汉语教教育实践教育实践设备条件设备条件师黄力量师黄力量学生素质"],"q":"培养汉语作为第二语培养汉语作为第二语培养对外汉语教培养对外汉语教教育实践教育实践设备条件设备条件师黄力量师黄力量学生素质","w":"normal","e":["原书正文"]},{"t":"【原文】学生素质社会香具社会香具","y":"教材原文","p":["学生素质社会香具社会香具国家政策国家政策经济实力经济实力言学习者的教育实践言学习者的教育实践师的教育实践师的教育实践语 言 环 境"],"q":"学生素质社会香具社会香具国家政策国家政策经济实力经济实力言学习者的教育实践言学习者的教育实践师的教育实践师的教育实践语 言 环 境","w":"normal","e":["原书正文"]}]},{"id":"yinlun-c01-s04","t":"第四节 对外汉语教育的学科定位与争论","w":"high","n":12,"k":[{"t":"学科定位","y":"名词解释","p":["学科定位，是指某一学科在众多学科中的位置，也就是科学地确定它的门类归属问题，通常是由该学科的研究内容、任务和性质所决定的。","学科定位问题之所以需要探讨，是因为它决定学科的发展方向。","对外汉语教育由于它研究内容的特殊性，也由于它是一门综合交叉学科，受到多种学科理论的影响，因而在学科定位的问题上，多少年来一直存在不同的看法和争论。"],"q":"学科定位，是指某一学科在众多学科中的位置，也就是科学地确定它的门类归属问题，通常是由该学科的研究内容、任务和性质所决定的。","w":"high","e":["2020 真题"]},{"t":"“应用语言学学科”论","y":"名
