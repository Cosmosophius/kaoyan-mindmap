,"y":"名词解释","p":["螺旋式是交际法主张的教材安排方式，也叫圆周式安排。","即将话题和句型结构根据交际需要并适当照顾难易度分成几个圈，每圈都将主要话题和句型结构出现一遍，而圈与圈之间又逐步加深难度，呈螺旋式上升或是同心圆扩大之势。","这样安排既能使学习者在较短的时间(一圈中)接触较多的话题和句型结构，便于及早地运用和交际，又能使同一话题和结构多次出现，反复巩固加深，符合认知规律和第二语言学习的特点。"],"q":"4.答案：螺旋式【解析】根据教材的语法结构或话题内容的排列方式，可以把教材分为直线式和螺旋式两大类。","w":"normal","e":[]},{"t":"都江堰","y":"名词解释","p":["战国李冰父子主持修建","鱼嘴、飞沙堰、宝瓶口三大主体","无坝引水，自动分水排沙","使成都平原成为天府之国"],"q":"36.都江堰由蜀郡太守 主持兴建，直到现在，都江堰主体工程依然屹立在岷江中流。","w":"normal","e":[]},{"t":"阅读法","y":"名词解释","p":["阅读法产生于20世纪初，为英国著名语言教育家韦斯特(M. West)在印度从事英语教学工作时所创立，又称韦斯特“新法”，是一种强调通过直接阅读来培养阅读能力的教学法。","与帕默强调“口语是基础”不同，韦斯特强调“阅读是基础”。","韦斯特认为应当通过阅读学会阅读，阅读既是目的也是手段。","阅读法要求学生接触大量的语言材料，在上下文或插图的帮助下直接理解阅读材料的内容；不主张阅读之前先教语法规则，而是阅读后把学习者在阅读中已熟悉的语法项目进行归纳。"],"q":"12.答案: ✔【解析】语法翻译法是“用母语翻译教授外语书面语的一种传统外语教学法，即用语法讲解加翻译练习的方式来教学外语的方法”语法翻译法又称传统法，古典法，旧式法、阅读法、普鲁士法等。","w":"normal","e":[]},{"t":"默教法","y":"名词解释","p":["默教法是美国教育家加特诺(C. Gattegno)于60年代初首创的一种第二语言教学法，它要求教师在课堂上尽量少说话，尽量鼓励学生多参与言语活动，从而使学生更有效地掌握运用第二语言的能力。","教师的沉默是默教法的最大特点。","默教法的主要理论基础是布鲁纳“发现学习”的教育思想，认为学习应是解决问题式的、创造和发现式的活动。","默教法还从儿童第一语言习得中吸取了不少有益的东西，但同时又认为成人第二语言学习完全不同于儿童母语习得，成功的第二语言学习是受到严格控制的“人为”的方法。"],"q":"5.人本主义心理学是咨询法、默教法等教学法流派的理论基础。","w":"normal","e":[]},{"t":"传统语法","y":"名词解释","p":["又称“规范语法”或“学校语法”","分为词法和句法两大部分，以词法为主","划分词类主要依据形态变化","注重书面语分析","语法规则被看作一种规范和标准"],"q":"A 描写语法B 功能语法C 生成语法 D 传统语法","w":"normal","e":[]},{"t":"偏正词组","y":"名词解释","p":["前面的成分修饰、限定后面的成分","前面是修饰语，后面是中心语","分为定心词组和状心词组两类"],"q":"A.三个词 B.五个词 C.一个单句 D.两个偏正词组","w":"normal","e":[]},{"t":"八大菜系","y":"名词解释","p":["鲁川粤苏浙闽湘徽八系","鲁菜重火候高汤","川菜麻辣、粤菜清鲜","体现饮食文化地域多样性"],"q":"38.按照各地饮食习惯和食物条件，通常将中国菜分为( )浙、皖、闽、湘等“八大菜系”。","w":"normal","e":[]},{"t":"四书五经","y":"名词解释","p":["四书：大学中庸论语孟子","五经：诗书礼易春秋","朱熹合编四书并作注","科举考试核心内容"],"q":"17.“四书五经”不都是儒家经典。","w":"normal","e":[]},{"t":"天人合一","y":"名词解释","p":["中国传统哲学核心命题","源于《周易》老庄，张载正式提出","主张人与自然和谐统一","对生态文明建设有启示"],"q":"其他的原则还有：以小观大、气韵生动、骨法用笔、随类赋彩、应物象形、笔墨情趣、形神兼备、意在笔先、成竹在胸、迁想妙得、天人合一、外师造化、中得心源等。","w":"normal","e":[]},{"t":"文化自信","y":"名词解释","p":["对自身文化价值的充分肯定","对文化生命力的坚定信念","源于优秀传统文化与先进文化"],"q":"(四) 论述题(20分)在全球化背景下，应如何树立文化自信，应对中国文化面临的挑战与机遇?二、教育学、心理学及语言学基础知识(共30分)","w":"normal","e":[]},{"t":"文房四宝","y":"名词解释","p":["笔、墨、纸、砚","湖笔、徽墨、宣纸、端砚","产地各具代表性","承载书画艺术与文人审美"],"q":"7.文房四宝中的笔的著名产地是 。","w":"normal","e":[]},{"t":"梦溪笔谈","y":"名词解释","p":["北宋沈括著","笔记体，二十六卷","记载活字印刷、指南针、石油","中国科学史上的坐标"],"q":"我国第一部科普作品————沈括的《梦溪笔谈》：","w":"normal","e":[]},{"t":"生旦净丑","y":"名词解释","p":["京剧四大行当","生为男性正面角色","旦为女性角色","净为花脸，丑为喜剧角色"],"q":"13.京剧演员分生、旦、净、丑四个行当，净也叫“花脸”。","w":"normal","e":[]},{"t":"竹林七贤","y":"名词解释","p":["嵇康阮籍山涛向秀刘伶王戎阮咸","聚于竹林饮酒清谈","以老庄对抗名教礼法","名士风度代表"],"q":"31.魏晋“竹林七贤”中的阮咸善弹琵琶，后人称琵琶为“阮咸”。","w":"normal","e":[]},{"t":"能愿动词","y":"名词解释","p":["也叫助动词","表示可能、必要或意愿","只能带动词性宾语","可以构成“不V不”格式"],"q":"16.我一家专注汉硕考研的店铺——汉硕考研网【解析】状语不只是由副词充当，还可以由时间名词、能愿动词、形容词充当；","w":"normal","e":[]},{"t":"长时记忆","y":"名词解释","p":["长时记忆是在头脑中长期保持的记忆，从保持一分钟以上直至终生。","长时记忆的容量是没有限度的，它的信息主要来自短时记忆，也有特别强烈的感知记忆一下子直接进入长时记忆。","短时记忆的信息要进入长时记忆，需要该信息呈现一定的强度(如生动程度)和重复，有的研究认为一个单词要反复10次才能记住。","长时记忆中信息主要以意义的形式保持，而不是逐词逐句的内容，也缺少细节。"],"q":"1.长时记忆典型的例子是人们在拨电话时记住刚查找的号码，打完电话马上就忘掉了。","w":"normal","e":[]},{"t":"魏晋玄学","y":"名词解释","p":["以三玄为经典","探讨本末有无、名教与自然","代表人物何晏王弼嵇康阮籍","崇尚清谈、越名教而任自然"],"q":"理学直接承继孔子到孟子的先秦儒家，同时理学思想体系也有选择性的吸收扬弃了魏晋玄学、道教以及一些佛教的思想。","w":"normal","e":[]},{"t":"鸿都门学","y":"名词解释","p":["东汉灵帝光和元年设立","专授辞赋、尺牍、字画","中国第一所文艺专科学校","反映文艺独立发展"],"q":"18.汉代官学有中央办的“太学”和“鸿都门学”，地方政府办的“郡国学”和校、庠、( )等。","w":"normal","e":[]},{"t":"分立式测试","y":"名词解释","p":["分立式测试是对语言要素(语音、词汇、语法等)和言语技能(听、说、读、写)分别进行单项测试，如填空、完成句子、多项选择。","其理论基础是结构主义语言学。认为语言是由各种成分组成的，掌握一种语言就是掌握这些成分和技能。","分立式试题的长处在于想考什么就能考什么，受试者无法回避，而且大多采用客观试题。","缺点是只能测量各个孤立项目的知识和技能。而各个单项知识、技能之和不一定等于其总体语言能力。"],"q":"12.×【解析】对语言要素和语言技能分别进行测试叫分立式测试。","w":"normal","e":[]},{"t":"状态形容词","y":"名词解释","p":["也叫形容词的生动形式","表示程度比较高，前面不能再加“很”","使用时后面一般要带“的”","可比较自由地充当谓语、补语和状语"],"q":"1.×【解析】状态形容词不受程度副词修饰。","w":"normal","e":[]},{"t":"常用字最根本的特点是（　）。","y":"名词解释","p":["常用性主要的依据是该字出现的频率，是最根本的特点"],"q":"6.常用字最根本的特点是 ()。","w":"normal","e":[]},{"t":"所有的单元音都可以直接作韵母。","y":"判断题","p":["错误","舌尖元音不能单独成音节"],"q":"3.现代汉语普通话中所有的单元音都可以直接作韵母。","w":"normal","e":[]}]}]}]},{"d":"zhenti_2026","t":"2026南师大334+445真题","c":[{"id":"zhenti_2026-c01","t":"全文","w":"high","s":[{"id":"zhenti_2026-c01-s01","t":"全文","w":"high","n":16,"k":[{"t":"汉字","y":"名词解释","p":["汉字是汉民族在长期的劳动生产和社会实践中为适应交际需要而独立创造出来的书面交际工具。","汉字是一种重要而独特的文字系统，在记录语言的方法、造字的方式、字形的结构、字体的呈现等诸方面都有鲜明的特点。","汉字是世界上历史最悠久的一种独立发展的文字，曾形成“汉字文化圈”。"],"q":"5.为什么说现代汉字是语素文字?三、汉语应用与分析(共30分)","w":"high","e":["2016 真题"]},{"t":"语法","y":"名词解释","p":["制约着句子组合合法性的规则就是“语法”","语法是语言不可缺少的有机的组成部分","语音是语言的物质外壳，词汇是语言的建筑材料，语法是语言的构造规则","词语的组合绝不是任意的，符合规则句子就合法，否则就不合法"],"q":"有英国本土大学生汉语语法基础扎实，听说能力却相对薄弱；","w":"high","e":["2016 真题","2019 真题"]},{"t":"音节","y":"名词解释","p":["人们听感容易分辨出来的最小语音片断","发音肌肉经历一次从紧张到松弛的过程","听感上有一个明显的响度中心","普通话除儿化音外一个汉字读音就是一个音节"],"q":"2.简述现代汉语词汇双音节化的主要途径。","w":"high","e":["2013 真题","2019 真题"]},{"t":"科举制","y":"名词解释","p":["隋大业元年设进士科始","1905年废止历时1300年","以考试成绩为录取标准","打破门第限制"],"q":"2.简述古代科举制度的功与过。","w":"high","e":["2015 真题","2019 真题","2024 真题"]},{"t":"现代汉字","y":"名词解释","p":["现代汉字指现阶段正在使用的汉字，它记录的主要对象是现代汉语，与传统汉字相对应。","判断一种文字符号体系的性质，首要的是研究这种文字与它所记录的语言之间的关系。","考察现代汉字的特点，还必须跟拼音文字符号体系进行比较。"],"q":"5.为什么说现代汉字是语素文字?三、汉语应用与分析(共30分)","w":"high","e":["2013 真题","2019 真题"]},{"t":"语素文字","y":"名词解释","p":["从汉字符号记录语言的单位来看，现代汉字是一种语素文字。","表音文字根据文字所记录的语言单位的不同，可以分为音素文字和音节文字两种类型。","汉字在记录语言时，利用了语素音义兼顾的特点，用能产性极强的形声字分别记录语素意义所属的类别和语素的音节。"],"q":"5.为什么说现代汉字是语素文字?三、汉语应用与分析(共30分)","w":"high","e":["2018 真题"]},{"t":"跨文化交际","y":"名词解释","p":["跨文化交际是指不同文化背景的人们之间的交际行为。这种交际主要是通过语言来进行的，称为跨文化语言交际。","影响跨文化语言交际的是不同文化之间的相同之处和不同之处，特别是文化差异。因此跨文化交际中要特别重视并研究文化差异。","跨文化交际的特点：(1)文化的差异与交际障碍；(2)交际原则与价值观念；(3)母语文化的思维定势和对异文化的成见；(4)交际过程中的相互接近和求同趋向；(5)交际的结果：文化的相互影响。","从上述五个特点可以看出，跨文化交际的根本特征是如何发现、认识和对待不同文化之间的差异。"],"q":"南京师范大学2026年全国硕士研究生统一招生考试招生专业：国际中文教育考试科目：汉语国际教育基础试题编号：445一、中外文化及跨文化交际基础知识(共80分)","w":"high","e":["2019 真题"]},{"t":"《九章算术》","y":"名词解释","p":["东汉成书分九章246题","方田粟米至勾股九类","确立算法为中心的数学体系","负数与方程解法世界领先"],"q":"2.刘徽在《九章算术》注中提出了独创的“割圆术”极限思想，第一次将圆周率具体到3.1416。","w":"high","e":["2017 真题"]},{"t":"《齐民要术》","y":"名词解释","p":["北魏贾思勰著","现存最早最完整的农学名著","总结黄河流域农业生产经验"],"q":"4.北魏贾思勰所著《齐民要术》，记载了黄河流域的农业生产相关内容，是经典农学著作。","w":"high","e":["2024 真题"]},{"t":"对外汉语教学","y":"名词解释","p":["《中国大百科全书·语言文字》中写道：“对外汉语教学是指对外国人的汉语教学。”","实际上也包括对第一语言不是汉语的海外华人进行的汉语教学。","这一名称基本上体现了这个学科的特点和内涵，在国外也产生了广泛的影响，而且简洁上口、符合汉语习惯，因此从1982年提出一直使用至今。","但是十多年的使用也发现这一名称有一定的局限性：它只突出了主要教学对象，未能全面、准确地反映学科性质——第二语言教学。"],"q":"(三)论述题(每题20分，共20分)请结合具体例子谈一谈对外汉语教学中的语言文化因素。","w":"high","e":["2015 真题","2021 真题"]},{"t":"语言文化因素","y":"名词解释","p":["语言的文化因素是语言教学中的文化教学首先接触的、也是最重要的部分，主要指语言系统各层次的文化内涵和语言使用的社会规约。","语言文化因素主要隐含在词汇系统、语法系统和语用系统之中，在跨文化交际中制约着语言的理解和使用，甚至可能造成一定的交际误解和障碍。","缺少语言文化因素的教学就不能达到语言教学的目的，因此就像语音、词汇、语法和汉字等因素一样，文化因素也是语言中不可或缺的组成部分。","陈光磊把这种文化因素分为语构文化、语义文化和语用文化。"],"q":"(三)论述题(每题20分，共20分)请结合具体例子谈一谈对外汉语教学中的语言文化因素。","w":"high","e":["2026 真题"]},{"t":"词汇","y":"名词解释","p":["词汇也称语汇，是语言中能独立运用的最小的音义结合单位的集合，有时也可以指特定领域中词语的集合。","词语是能够独立运用的音义结合的最小语言单位。词语包括词和固定短语，词是词汇的主体部分，而固定短语是词汇的重要组成部分。","词语的总和形成词汇，词汇与词语的关系是集合与个体的关系。","根据语言差异，词汇可分为汉语词汇、英语词汇、德语词汇等；根据领域不同，词汇可分为政治词汇、经济词汇、法律词汇等。"],"q":"2.简述现代汉语词汇双音节化的主要途径。","w":"high","e":["教材高频"]},{"t":"语素","y":"名词解释","p":["语素是语言中最小的音义结合的构词单位，是最基本的语言单位。","一个语素必须是语音与语义结合，而且不能再拆分。其中，具有一定的语义是判断语素的最基本条件。","汉语绝大多数语素是一个有意义的音节。如“床”的语音形式是chuáng，它的语义内容是“供人躺在上面睡觉的家具”，那么，“床”就是一个语素。","有少数语素是由两个无意义的音节合成的。如“玻璃”，它的语音形式是bōli，语义是“一种质地硬而脆的透明物体”。“玻”和“璃”虽然都有语音形式，但都没有单独的语义，因此都不是语素；只有“玻璃”才是一个语素。"],"q":"5.为什么说现代汉字是语素文字?三、汉语应用与分析(共30分)","w":"high","e":["教材高频"]},{"t":"扩展法","y":"名词解释","p":["扩展法就是在一个语言单位内部插入其他成分，来观察语言单位的意义是否发生了改变。","如果语言单位的意义改变了或者不合法，则说明该语言单位在意义上是最小的，是词，否则就是短语。","词的意义具有凝固性和专指性，不可以扩展，而短语的意义具有分析性，可以扩展。因此，“扩展法”是区别词和短语的基本方法。"],"q":"1.有人认为“同形替代法”和“扩展法”都是鉴定词的方法，也有人认为“同形替代法”实质上是另一种形式的“扩展法”，请结合语言事实谈谈你的看法。","w":"high","e":["教材高频"]},{"t":"双音节化","y":"名词解释","p":["汉语词汇发展的一个明显的趋势就是“双音节化”。","现代汉语的语素以单音节为主，词则以多音节为主。古代汉语中，以单音节词为主，而现代汉语则以多音节词为主，特别是双音节词占绝大多数。","其原因主要有以下三个：一是有助于避免大量同音词的出现；二是双音节词使词义的表达更为细腻、精确；三是双音节读起来往往带有一种乐感，轻重之间形成一种节奏，悦耳动听。"],"q":"2.简述现代汉语词汇双音节化的主要途径。","w":"high","e":["教材高频"]},{"t":"诊断测试","y":"名词解释","p":["诊断测试是为了了解受试者在学习某一具体内容或在较短的一段学习时间里所存在的问题而进行的测试。","目的是迅速直接地获得反馈信息，及时改进教学。这也是一种回顾兼预示性的测试，常常是与一具体的短期目标相联系。","学校中的小考、小测验都属于这一类。诊断测试是非正式的测试，命题、评分都比较灵活，一般也不用作衡量学生水平的主要依据。"],"q":"4.诊断测试(二)简答题 (每题10分,共10分)简述对外汉语教学的原则。","w":"high","e":["2026 445 二、教育学、心理"]}]}]}]},{"d":"zhenti_24","t":"24南师大354+445真题和答案","c":[{"id":"zhenti_24-c01","t":"全文","w":"high","s":[{"id":"zhenti_24-c01-s01","t":"全文","w":"high","n":81,"k":[{"t":"习得","y":"名词解释","p":["“习得”是在自然的语言环境中，通过旨在沟通意义的言语交际活动，不知不觉(潜意识)地获得一种语言，典型的例子是儿童习得第一语言(一般是母语)。","简言之，习得是潜意识的自然的获得。","习得，特别是儿童第一语言的习得，是从本能的要求(生存和交际的需要)开始、与其生理和心理的自然发育、成熟同步进行的过程，儿童是在不知不觉中习得第一语言的。","习得一般是在使用该目的语的社会环境中进行的；习得时注意力主要集中在语言的功能和意义方面。"],"q":"1.系统偏误 2.水平测试 3.带音法 4.强化论五、简答题 (10分)请简要对比第一语言习得与第二语言习得的不同。","w":"high","e":["2019 真题"]},{"t":"乡试","y":"名词解释","p":["省级考试三年一次","秋八月举行称秋闱","考中者称举人","第一名称解元"],"q":"明清会试是全国范围内的考试，也是每三年举行一次，即于乡试的第二年举行，也就是在丑、辰、未、戌年举行，时间是春三月，因由礼部主持，所以又叫“礼闱”或“春闱”。","w":"high","e":["2024 真题"]},{"t":"会试","y":"名词解释","p":["乡试次年春三月京城举行","称春闱或礼闱","考中者称贡士","第一名称会元"],"q":"4.明清会试因为举办时间为每年的春三月，由礼部主持，因此又叫“礼闱”或“春闱”。","w":"high","e":["2024 真题"]},{"t":"假借","y":"名词解释","p":["本无其字依声托事","借用同音字记录新词","如“其”借为代词","属用字法"],"q":"声旁本身来自义符，假借义符表音类，又不是专门表某音，有的声旁还可兼做形旁，所以汉字的形声字的音符不同于表音文字的字母，汉字不是意音文字，是属于表意体系的文字。","w":"high","e":["2011 真题"]},{"t":"偏旁","y":"名词解释","p":["偏旁就是用二分法对合体字进行一次性切分而获得的结构单位，可分为“形旁”和“声旁”两类。","形旁通常表示该字的意义类别，声旁通常表示该字的大致读音。","多数形声字由一个形旁和一个声旁组成；会意字的两个偏旁都属于形旁。","通用汉字的偏旁约有1500个。"],"q":"2.由表示字义类属的偏旁即意符，和表示字音的偏旁即音符，组成新字的造字法叫形声。","w":"high","e":["2012 真题","2018 真题"]},{"t":"元音","y":"名词解释","p":["气流振动声带","发音部位不受阻碍","又叫母音","主要功能是构成音节的韵母"],"q":"1.普通话的ü是舌面、前、高、圆唇元音。","w":"high","e":["2012 真题","2018 真题"]},{"t":"功能","y":"名词解释","p":["交际法一反其他教学法以语法或句型结构为纲的传统做法，明确提出以功能意念为纲。","功能是用语言做事，完成一定的交际行为。","交际大纲把语言功能分为六类：传达与了解实际情况；表达或了解理智性的态度；表达或了解道义上的态度；表达或了解情感性的态度；请人做事；社交。","以“邮局在哪儿?”这个句子为例，其功能是询问。"],"q":"分类的依据是词的语法功能、形态和意义三方面，就汉语来说语法功能是主要依据，形态和意义是参考依据，三者合称为词性。","w":"high","e":["2019 真题","2020 真题","2021 真题"]},{"t":"助词","y":"名词解释","p":["黏着在词或短语上面，表示附加意义","附着在后面的一律读轻声","结构助词：的、地、得","时态助词：了、着、过","其他助词：似的、所、给、看、来、把、们、第、初、等"],"q":"4.什么是助词，助词有哪些小类，请举例说明。","w":"high","e":["2017 真题"]},{"t":"声母","y":"名词解释","p":["音节开头的辅音","普通话22个辅音有21个可作声母"],"q":"(1)ü跟 n、1以外的声母相拼时都省写两点。","w":"high","e":["2014 真题","2020 真题"]},{"t":"字义","y":"名词解释","p":["汉字字形跟字义的关系大致有三类：1.字形记录的是词义；2.字形记录的是语素义；3.字形记录的仅仅是一个音节，它没有字义。","一个汉字在多数情况下，记录的是现代汉语的一个语素。字义也就是语素义。","现代汉字中也有少数用会意法造出来的字还是可以直接从字形推知字义的。"],"q":"2.由表示字义类属的偏旁即意符，和表示字音的偏旁即音符，组成新字的造字法叫形声。","w":"high","e":["2015 真题"]},{"t":"字体","y":"名词解释","p":["字体指的是同一种文字的各种不同体式。","例如汉字的楷书、行书、草书，印刷的宋体、仿宋体、楷体、黑体等。","至于书法艺术上的种种字体，例如欧体、颜体、柳体，指的是书法的派别，又称“书体”，不属于严格文字学的范围。"],"q":"5.唐朝欧阳询的书法以楷书为最好，字体劲险刻厉，于平正中见险绝，其代表作为《九成宫醴泉铭》。","w":"high","e":["2013 真题","2019 真题"]},{"t":"形声","y":"名词解释","p":["由形旁与声旁组成，形旁表示大致的字义或字义的类属，声旁提示字的读音或近似的读音。","形声法是汉字最主要的造字方法。","形声法综合利用字形表义和字形表音这两种手段。"],"q":"2.由表示字义类属的偏旁即意符，和表示字音的偏旁即音符，组成新字的造字法叫形声。","w":"high","e":["2011 真题","2016 真题","2020 真题","2016 真题"]},{"t":"态度","y":"名词解释","p":["态度是构成动机的主要因素之一。它是个体对某种客观事物的评价性反应，是在对事物了解的基础上产生情感上的褒贬好恶，并反映出对之采取行动的倾向性。","西方学者的调查表明，学习第二语言的态度与所取得的学习成绩之间的关系高于学习其他科目的态度与成绩之间的关系。","影响学习态度的几个方面是：对目的语社团和文化的态度、对目的语的态度、对课程和教师、教材的态度。","对大多数学习者来说直接影响其目的语学习态度的还是他们在语言课堂上的感受。"],"q":"三、论述题 (20分)请简要论述跨文化交际中对待不同文化应秉持的态度。","w":"high","e":["2019 真题"]},{"t":"母语","y":"名词解释","p":["母语是指本国、本民族的语言","这是按国家的界限来区分的。","外语是指外国的语言。一般情况下母语是人们的第一语言；但对一些移居国外的人来说，其子女出生后首先接触并获得的语言有可能是居住国的语言而不是母语。"],"q":"(1)通过注释直接阐述文化知识：开始可以用学习者的母语注释，随着学习者汉语水平的提高，可逐渐用目的语注释，让学生自己阅读，可以省去课堂上讲解的时间。","w":"high","e":["2019 真题"]},{"t":"汉字","y":"名词解释","p":["汉字是汉民族在长期的劳动生产和社会实践中为适应交际需要而独立创造出来的书面交际工具。","汉字是一种重要而独特的文字系统，在记录语言的方法、造字的方式、字形的结构、字体的呈现等诸方面都有鲜明的特点。","汉字是世界上历史最悠久的一种独立发展的文字，曾形成“汉字文化圈”。"],"q":"2.说明“隶变”在汉字发展史上的价值。","w":"high","e":["2016 真题"]},{"t":"短语","y":"名词解释","p":["由两个或两个以上单词构成的句法结构单位","在语义上能逐层贯通，在结构上能逐层搭配起来","没有句调的一组词","短语有两类：词组和结构"],"q":"同一类的虚词有共性，又有个性，很多虚词还往往不止有一种语法意义，如结构助词“的”用在偏正短语里表示修饰和被修饰的关系，用在“的”字短语中让整个短语获得指称性。","w":"high","e":["2015 真题","2021 真题"]},{"t":"笔画","y":"名词解释","p":["笔画是构成楷书字形的最小单位。","就书写过程而言，笔画是有起止的线条，从落笔到下一次提笔的过程中写出的点和线就叫一笔或一画。","在不同的字体中，笔画的表现形式可能不完全相同。","这里所说的笔画是以印刷体的主流字体宋体、楷体作为分析对象的。"],"q":"隶书把小篆圆转弧形的笔画变成方折平直笔画的过程被称作隶变，它在字体演变史上的地位最为重要，它是古今汉字的分水岭。","w":"high","e":["2012 真题","2018 真题"]},{"t":"词类","y":"名词解释","p":["词类专指词的语法类别","不同的词类在形态、意义和功能等方面表现出区别性特点","划分词类的目的是为了说明语言的构造规则","词类是一个有层次的系统"],"q":"2.汉语词类划分应该依据什么标准?试对此加以论述。","w":"high","e":["2013 真题","2018 真题"]},{"t":"话语","y":"名词解释","p":["简单说来，话语是在交际过程中一定语境下表示完整语义的自然语言，是由结构衔接、语义连贯、排列符合逻辑来表达某个主题的连续的句子所构成的语言整体。","话语从形式上看通常是大于句子的语言单位，可能是句组、段落甚至篇章；也可能只是一个句子，一个短语甚至一个词。","话语既包括口语，也包括书面语。"],"q":"指出语言不仅是描写、陈述和说明客观世界，提供信息，而且人们说出的话语也是一种行为。","w":"high","e":["2018 真题"]},{"t":"语法","y":"名词解释","p":["制约着句子组合合法性的规则就是“语法”","语法是语言不可缺少的有机的组成部分","语音是语言的物质外壳，词汇是语言的建筑材料，语法是语言的构造规则","词语的组合绝不是任意的，符合规则句子就合法，否则就不合法"],"q":"4.词类是词的语法性质的分类。","w":"high","e":["2016 真题","2019 真题"]},{"t":"语音","y":"名词解释","p":["由人的发音器官发出","不同的语音代表不同的意义","作用是进行社会交际，具有“社会”的属性"],"q":"一、名词解释(每题5分，共30分)语音是人类说话的声音，是语义的表达形式，是语言的物质外壳，是人类通过发音器官来传递信息的声音，只有具有词句意义的声音才是语音。","w":"high","e":["2016 真题","2020 真题"]},{"t":"象形","y":"名词解释","p":["用线条描画出事物的形象，其字形与字义的联系比较具体、紧密。","这类字大多表示自然界和日常生活中的实物。","许多事物用几根线条很难画出，所以用这种方法造出来的字并不多。","由于字形历史演变等原因，这类字的形体象形意味现在大为减弱，不少已经失去了跟字义的直接联系，有些还变成了记号。"],"q":"九中)隶书的出现，打破了古汉字象形的传统，奠定了现代汉字的基础，是文字史上的分水岭，在汉字发展史上具有划时代的意义。","w":"high","e":["2012 真题"]},{"t":"隶变","y":"名词解释","p":["由甲骨文、金文发展到小篆，是一个简化的过程。小篆又简化为隶书，隶书又简化为草书和楷书，楷书又跟草书结合为行书。","隶变在字体演变史上的地位最为重要，它是古今汉字的分水岭。","汉字字体演变的总趋势是由繁难变为简易。"],"q":"2.说明“隶变”在汉字发展史上的价值。","w":"high","e":["2015 真题","2021 真题","2015 真题","2024 真题"]},{"t":"音素","y":"名词解释","p":["从音色（音值）角度划分","最小语音单位"],"q":"语音有大大小小不同的单位，音素是最小的语音单位，音节是听话时自然感到的最小的语音单位，音位是一个语音系统中能够区别意义的最小的语音单位。","w":"high","e":["2015 真题","2021 真题"]},{"t":"音节","y":"名词解释","p":["人们听感容易分辨出来的最小语音片断","发音肌肉经历一次从紧张到松弛的过程","听感上有一个明显的响度中心","普通话除儿化音外一个汉字读音就是一个音节"],"q":"语音有大大小小不同的单位，音素是最小的语音单位，音节是听话时自然感到的最小的语音单位，音位是一个语音系统中能够区别意义的最小的语音单位。","w":"high","e":["2013 真题","2019 真题"]},{"t":"韵母","y":"名词解释","p":["一个音节声母后面的部分","由元音或元音加鼻辅音构成","普通话共有39个韵母"],"q":"(2)韵母ü单独出现在声母n、1后面时不能省写是因为如果省了，这些音节就会发生混淆。","w":"high","e":["2011 真题","2017 真题"]},{"t":"中介语","y":"名词解释","p":["美国语言学家塞林克于1969年提出中介语(interlanguage)的概念，1972年在其著名论文《中介语》中提出的中介语假说。","中介语是指在第二语言习得过程中，学习者通过一定的学习策略，在目的语输入的基础上所形成的一种既不同于其第一语言也不同于目的语、随着学习的进展向目的语逐渐过渡的动态的语言系统。","中介语既指学习者语言发展的任何一个阶段的“静态”语言系统，可以把它看做是某一阶段的“切片”；也是指学习者从零起点到靠近目的语的语言发展轨迹，可以把它看做是各阶段相接而形成的一种连续体。","中介语在其发展过程中的任何一个阶段都是学习者创造的一种介于第一语言和目的语之间的独特的语言系统；中介语不是固定不变的，而是一个不断变化的动态语言系统。"],"q":"科德根据中介语的发展过程，把偏误分为三类：前系统偏误、系统偏误和后系统偏误。","w":"high","e":["2020 真题"]},{"t":"合体字","y":"名词解释","p":["合体字是由两个或两个以上部件组合而成的汉字。","象形字、指事字一般属于独体字，会意字、形声字通常属于合体字。","独体和合体在汉字形体演变过程中会互变。"],"q":"叫形声字。形声字都是合体字。形声字总是分成两部分，一部分表意，一部分表音。表意部分称为意符，也叫形旁、形符、义符。意符表示形声字的意义范畴。意符的作用一是提示该字所记录的语素的一类，二是区别同音字。意符在表","w":"high","e":["2015 真题"]},{"t":"同音字","y":"名词解释","p":["同音字是指两个或两个以上的汉字，读音相同、意义不同而且意义没有联系。","同音字按字形是否相同可以分为同形同音异义字和异形同音异义字两类。","狭义的同音字只指同形同音异义字；广义的同音字，除了同形同音字之外，还包括了异形同音字。"],"q":"意符的作用一是提示该字所记录的语素的一类，二是区别同音字。","w":"high","e":["2014 真题","2021 真题"]},{"t":"国子监","y":"名词解释","p":["隋炀帝始设","兼具最高教育行政机关与最高学府","明代监生制度"],"q":"3.国子监最初只是管理教育的行政机关，到了明代就发展成为兼有行政机关和最高学府两种性质的机构。","w":"high","e":["2024 真题"]},{"t":"实用性","y":"名词解释","p":["实用性是教材编写和选用的原则之一。","第二语言教材不同于语言学教材，主要用于培养语言技能和能力；语言知识要通过教学转化为技能，是为培养能力服务的。","实用性主要体现在：(1)教材内容要从学习者的需要出发，是学习者进行交际活动所必需的，是在生活中能马上应用的，要避免“教科书语言”和“教室语言”；(2)语言材料必须来源于生活、来源于现实，要有真实性；(3)要有利于贯彻精讲多练的原则；(4)要有利于开展交际活动，使教学过程交际化。"],"q":"1.在13世纪以后，中国的科学技术就停留在经验阶段，创新意识没有进一步提升，科学技术理论没有进一步发展，其根本原因是与中国社会的伦理型结构、中国科技的实用性特点和科学研究的整体性观念密切相关的。","w":"high","e":["2020 真题"]},{"t":"语气词","y":"名词解释","p":["一般用于句末","表示陈述、疑问、祈使、感叹等语气","永远黏着、后附、轻声"],"q":"虚词按照语法意义的不同可以细分为介词、连词、助词、语气词。","w":"high","e":["2016 真题","2020 真题"]},{"t":"《七略》","y":"名词解释","p":["刘歆在刘向《别录》基础上编成","分辑略等七部分","我国第一部综合性图书分类目录"],"q":"8.西汉刘向汇集各种书录编辑成《七略》，这是我国最早的目录学专著。","w":"high","e":["2024 真题"]},{"t":"丝绸之路","y":"名词解释","p":["张骞出使西域后开辟","东起长安，西至地中海东岸","输出丝绸瓷器造纸术","输入葡萄苜蓿与佛教艺术"],"q":"7.丝绸之路东起汉唐首都长安，向西经河西走廊，经过里海南沿、巴格达，抵达波罗的海东岸，转至罗马各地。","w":"high","e":["2024 真题","2018 真题"]},{"t":"交际文化","y":"名词解释","p":["80年代初，对外汉语教学界的学者张占一等人，从第二语言教学培养交际能力的实际出发，按文化在交际中的功能提出区分“知识文化”和“交际文化”的观点。","交际文化则是指跨文化交际中直接影响信息准确传递(即引起偏差或误解)的语言和非语言的文化因素。","所谓知识文化是指跨文化交际中不直接影响准确传递信息的语言和非语言的文化因素。","交际文化则是指两种语言间规约性的文化差异，是以制约信息模式的形式来参与交际的，可能在交际中引起误解或偏差。"],"q":"3.请简要举例对比“知识文化”和“交际文化丸子汉硕考研4.请简述对外汉语教学中文化教学的方法。","w":"high","e":["2018 真题"]},{"t":"交际能力","y":"名词解释","p":["社会语言学家海姆斯在60年代提出了不同的看法，他认为一个人的语言能力不仅指能否说出合乎语法的句子，还包括能否在一定的语言环境中恰当地使用语言的能力。","海姆斯首次提出了“交际能力”（communicative competence）的概念，即运用语言（或非语言手段)进行社会交往的能力，包括传递信息、交流思想和表达感情。","海姆斯还进一步提出了交际能力的四个特征：语法性——指语法上是否正确；可接受性——在交际中能否被接受；得体性——在一定的语境中是否恰当，是否合乎社会文化习惯；现实性——是否是现实中常用的。","交际能力既包括语言能力，也包括语言运用的能力。"],"q":"3.80年代初，对外汉语教学界的学者张占一等人，从第二语言教学培养交际能力的实际出发，按文化在交际中的功能提出区分“知识文化”和“交际文化”的观点。","w":"high","e":["2019 真题"]},{"t":"会话含义","y":"名词解释","p":["对“会话含义”（conversational implicature）的研究实际上就是对会话中说话者的言外之意的研究。","所以会话含义是指会话中说话者因违反“合作原则”而产生的言外之意。","但在实际语言交际中，人们常常出于某种礼貌或其他目的，故意违反这些合作原则，从而产生言外之意让听话者去领会。","格赖斯会话含义理论后来不断得到补充和完善。"],"q":"利奇的礼貌原则进一步丰富和发展了会话含义理论，使格赖斯会话含义理论不断得到补充和完善。","w":"high","e":["2018 真题","2023 354 一、名词解释（每"]},{"t":"偏误分析","y":"名词解释","p":["偏误分析(Error Analysis)是对学习者在第二语言习得过程中所产生的偏误进行系统的分析，研究其来源，揭示学习者的中介语体系，从而了解第二语言习得的过程与规律。","科德是偏误分析最早的倡导者。","偏误分析的心理学基础是认知理论，语言学基础则是乔姆斯基的普遍语法理论。","第二语言习得过程被看成是规则形成的过程，即学习者不断从目的语的输入中尝试对目的语规则做出假设，并进行检验与修正，逐渐向目的语靠近并建构目的语的规则体系。"],"q":"【丸子汉硕解析】本题主要考查偏误分析的知识点，见刘珣《对外汉语教育学引论》第六章P194。","w":"high","e":["2020 真题"]},{"t":"四大发明","y":"名词解释","p":["造纸术—东汉蔡伦改进","印刷术—唐雕版、宋活字","火药—唐炼丹、宋军用","指南针—战国司南、宋航海"],"q":"即使是著名的“四大发明”，也与国家的实用目的有关。","w":"high","e":["2016 真题"]},{"t":"对比分析","y":"名词解释","p":["对比分析(Contrastive Analysis)是将两种语言的系统进行共时比较，以揭示其相同点和不同点的一种语言分析方法。","把对比分析运用到第二语言教学中来，始于40年代的美国；提出第二语言习得的对比分析假说并建立起对比分析的理论系统的，是拉多。","对比分析的语言学理论基础是结构主义语言学，其心理学的理论基础是行为主义心理学和迁移理论。","对比分析大体上按照描写、选择、对比、预测四个步骤进行。"],"q":"此外不能使用对比分析法，鼓励学生之间进行讨论和互动，分享他们对目的语国家文化的理解和体验。","w":"high","e":["2019 真题"]},{"t":"意音文字","y":"名词解释","p":["汉字记录汉语则兼用三种方法，即从义入手、从音入手或同时从音义入手。","汉字是一种兼顾意音的文字，可以简称为“意音文字”。","汉字绝大多数都是兼用表音和表义的方法，所以形声字约占全部汉字的90%左右。","现代汉字的意符和音符所起的表义标音作用已经有限。"],"q":"声旁本身来自义符，假借义符表音类，又不是专门表某音，有的声旁还可兼做形旁，所以汉字的形声字的音符不同于表音文字的字母，汉字不是意音文字，是属于表意体系的文字。","w":"high","e":["2015 真题"]},{"t":"教学内容","y":"名词解释","p":["第二语言教学是为了培养语言交际能力，这一教学目的决定了教学内容。","从语言能力和语言交际能力的构成因素出发，吕必松曾提出语言教学的教学内容应包括“语言要素、语用规则、言语技能、言语交际技能和相关文化知识”。","这样，对外汉语教学内容可以概括为四个方面：(1)语言要素(汉语语音、词汇、语法、汉字)；(2)言语技能(汉语听、说、读、写)；(3)言语交际技能(汉语语用规则、话语规则、交际策略)；(4)相关文化知识(汉语的文化因素、中国基本国情和文化背景知识)。","语言要素、言语技能、言语交际技能和相关文化知识就构成了语言交际能力的基础。"],"q":"这种测试不与特定的课程或教学内容直接关联，而是侧重于评估考生的整体语言水平。","w":"high","e":["2020 真题"]},{"t":"水平测试","y":"名词解释","p":["水平测试又称能力测试，目的在于测量受试者现有的整体的语言实际运用能力，以评定是否达到胜任某项任务的要求。","水平测试不考虑受试者的学历，也不以任何大纲、课程或教材为依据，而是根据语言交际能力的标准，或是某一特定任务的要求来命题。这是一种回顾兼预示的测试。","水平测试具有较高的区分性，受试者的分数反映了他在全体受试者中的位置。水平测试常常是大规模标准化测试，如我国的汉语水平考试(HSK)、英语水平考试(EPT)，美国的托福考试，英国的剑桥英语水平考试等。"],"q":"1.系统偏误 2.水平测试 3.带音法 4.强化论五、简答题 (10分)请简要对比第一语言习得与第二语言习得的不同。","w":"high","e":["2019 真题","2021 真题","2024 445 二、教育学心理学"]},{"t":"现代汉字","y":"名词解释","p":["现代汉字指现阶段正在使用的汉字，它记录的主要对象是现代汉语，与传统汉字相对应。","判断一种文字符号体系的性质，首要的是研究这种文字与它所记录的语言之间的关系。","考察现代汉字的特点，还必须跟拼音文字符号体系进行比较。"],"q":"九中)隶书的出现，打破了古汉字象形的传统，奠定了现代汉字的基础，是文字史上的分水岭，在汉字发展史上具有划时代的意义。","w":"high","e":["2013 真题","2019 真题"]},{"t":"知识文化","y":"名词解释","p":["所谓知识文化是指跨文化交际中不直接影响准确传递信息的语言和非语言的文化因素；交际文化则是指跨文化交际中直接影响信息准确传递(即引起偏差或误解)的语言和非语言的文化因素。","知识文化常以“知识”或“内容”的形式参与交际。“知识”的多少也会影响到交际的进行。但懂就是懂，不懂就是不懂，一般不会产生误解。","交际文化与知识文化概念的提出，加深了人们对语言教学中的文化教学的认识。"],"q":"3.请简要举例对比“知识文化”和“交际文化丸子汉硕考研4.请简述对外汉语教学中文化教学的方法。","w":"high","e":["2018 真题"]},{"t":"社会属性","y":"名词解释","p":["语音最重要的特点","世界上其他任何声音所不具备","约定俗成","系统性","民族特征和地域特征"],"q":"语音要表达一定的意义，什么样的意义用什么样的语音形式表达，必须是由使用该语言的全体社会成员约定俗成并共同遵守的，所以语音又具有社会属性。","w":"high","e":["2014 真题","2018 真题","2022 真题"]},{"t":"第一语言","y":"名词解释","p":["人出生以后首先接触并获得的语言","第二语言指人们在获得第一语言以后再学习和使用的另一种语言。","这是按人们获得语言的先后顺序来区分的两个概念，也是语言教学理论中用得最多的术语。"],"q":"1.系统偏误 2.水平测试 3.带音法 4.强化论五、简答题 (10分)请简要对比第一语言习得与第二语言习得的不同。","w":"high","e":["2013 真题","2019 真题"]},{"t":"第二语言","y":"名词解释","p":["指人们在获得第一语言以后再学习和使用的另一种语言","由于学习这些语言的规律与学习第二语言有很多共同之处，所以一般不再细分而统称第二语言。","广义的“第二语言”是指任何一种在第一语言获得以后学习和使用的语言，包括外语。"],"q":"1.系统偏误 2.水平测试 3.带音法 4.强化论五、简答题 (10分)请简要对比第一语言习得与第二语言习得的不同。","w":"high","e":["2019 真题"]},{"t":"行为主义","y":"名词解释","p":["20世纪的美国心理学界出现了反对构造主义和机能主义的另一种思潮——行为主义。这是强调学习过程和测量外显行为的心理学派，其创始人是美国心理学家华生，后期主要代表人物是斯金纳。","行为主义有两个主要特点：否认意识，主张心理学只研究人的行为；反对内省，主张采用客观的实验的方法。","华生受俄国巴甫洛夫经典性条件反射学说的影响，建立了刺激——反应模式，成为经典性行为主义理论。新行为主义代表人物之一的斯金纳，则受到操作主义哲学的影响，建立了操作行为主义，和“刺激——反应——强化”的模式。"],"q":"4.强化论是习得理论之一，理论依据是行为主义的刺激反应论，代表人物是塞林克。","w":"high","e":["2026 真题","2026 445 二、教育学、心理"]},{"t":"语法教学","y":"名词解释","p":["语法教学是对目的语的词组、句子以及话语的组织规律的教学，用以指导言语技能训练并培养正确运用目的语进行交际的能力。","不掌握目的语遣词造句的规则，就难以正确理解和表达。语法教学一直处于第二语言教学的中心地位。","语法教学原则主要有：(1)通过语言对比突出语法的重点和难点；(2)从句型入手，句型操练与语法知识的归纳相结合；(3)由句子扩大到话语；(4)语法结构的教学与语义、语用和功能的教学相结合；(5)精讲多练，以练习为主；(6)先易后难、循序渐进地安排语法项目；(7)重视纠正学习者的语法错误，并把病错句的分析作为课堂教学内容的一个部分。"],"q":"【丸子汉硕解析】本题考查第二语言教学语法教学和偏误分析的知识点。","w":"high","e":["2020 真题","2021 真题"]},{"t":"语言测试","y":"名词解释","p":["语言测试是根据一定的评估目的，以抽样方式通过有限试题来诱导出受试者的言语行为，然后借助于定量描述来推断受试者掌握的该语言的知识和能力。","从心理学的角度来看，上述定义表明，测试的任务在于如何诱导出体现受试者语言知识和能力的言语行为，并对这种行为进行量化和说明解释。","语言测试具有间接性、片面性、主观性和偶然性四个特点。","测试是教育评估的主要手段，也是教学活动的主要环节之一。测试是第二语言教学四大环节的重要组成部分。"],"q":"【丸子汉硕解析】本题考查语言测试中的水平测试，见刘珣《对外汉语教育学引论》第九章P380。","w":"high","e":["2020 真题","2021 真题"]},{"t":"语言能力","y":"名词解释","p":["乔姆斯基在60年代提出“语言能力”的概念，并将内在的“语言功能”与“语言表现”，即对语言的实际运用做了区分。","所谓“语言能力”是指人们所具有的语言知识，是一种内化了的包括语音、词汇、语法等的语言规则体系。","根据转换生成语言理论，一个人的语言能力主要表现在能正确组合声音和语素；能区分是否合乎语法的句子；能区分结构相同或相似但意义不同的句子等；而最根本之点则是能运用这一有限的规则体系创造出无限的句子。","可见“语言能力”主要是与语言形式结构有关，实际上是一种高度抽象的语法能力，是一种脱离外部语言环境的、人的内部心理机制。"],"q":"偏误是由于目的语掌握不好而产生的一种规律性错误，它偏离了目的语的轨道，反映了说话者的语言能力和水准。","w":"high","e":["2018 真题"]},{"t":"语音教学","y":"名词解释","p":["对外汉语语音教学的任务是让学习者掌握汉语语音的基本知识和汉语普通话正确、流利的发音，为用口语进行交际打下基础。","语音是语言的物质外壳。语音的重要性决定了语音教学是第二语言教学的基础，是掌握听说读写技能和交际能力的前提。","语音教学原则主要有：(1)短期集中教学与长期严格要求相结合；(2)音素教学与语流教学相结合；(3)通过语音对比突出重点和难点；(4)声韵调结合教学，循序渐进；(5)听说结合，先听后说；(6)以模仿和练习为主、语音知识讲解为辅；(7)机械性练习与有意义练习相结合。"],"q":"【丸子汉硕解析】本题考查语音教学方法，见周小兵《对外汉语教学入门》第四章P152。","w":"high","e":["2020 真题"]},{"t":"对比分析法","y":"名词解释","p":["对比分析法是语言研究和语言教学研究最常用的方法，用来对两种或多种语言的相同和相异之点、两种或多种语言的习得或教学规律的相同和相异之点进行对比研究，以加深对所比较的事物的认识，从而发现新的特征和新的规律。","对比分析法有着广阔的天地，可以进行不同事物之间的共时横向比较，也可以进行同一事物的历时纵向比较；可以进行定量比较，也可以进行定性比较；可以进行专项比较，也可以进行综合比较。","具体地说，第一语言习得和第二语言学习的比较，第二语言学习和外语学习的比较，不同母语的学习者学习同一目的语的比较，同一语言学习者学习不同目的语的比较，不同学习策略或不同的教学方法流派的比较等等，都是很好的研究课题。"],"q":"此外不能使用对比分析法，鼓励学生之间进行讨论和互动，分享他们对目的语国家文化的理解和体验。","w":"high","e":["2019 真题"]},{"t":"标准化测试","y":"名词解释","p":["标准化测试是以现代教育测量学的理论为依据，按照系统的科学程序对考试的全过程(设计、命题、施测、评分、分析等)实行标准化处理，对误差进行严格控制，有较高效度、信度，能测出受试者真实水平的测试。","这种测试由权威机构和专业队伍研制。","为了保证严密的科学性，标准化测试通常是以客观性试题为主的常模参照测试。","标准化语言测试的过程大体上有四个步骤，即设计命题、考试实施、阅卷评分和统计分析。"],"q":"2.水平测试又称能力测试，是一种用于测量考生语言能力的标准化测试。","w":"high","e":["2020 真题"]},{"t":"跨文化交际","y":"名词解释","p":["跨文化交际是指不同文化背景的人们之间的交际行为。这种交际主要是通过语言来进行的，称为跨文化语言交际。","影响跨文化语言交际的是不同文化之间的相同之处和不同之处，特别是文化差异。因此跨文化交际中要特别重视并研究文化差异。","跨文化交际的特点：(1)文化的差异与交际障碍；(2)交际原则与价值观念；(3)母语文化的思维定势和对异文化的成见；(4)交际过程中的相互接近和求同趋向；(5)交际的结果：文化的相互影响。","从上述五个特点可以看出，跨文化交际的根本特征是如何发现、认识和对待不同文化之间的差异。"],"q":"三、论述题 (20分)请简要论述跨文化交际中对待不同文化应秉持的态度。","w":"high","e":["2019 真题"]},{"t":"“的”字结构","y":"名词解释","p":["由结构助词“的”附加在其他词语之后构成","使谓词性成分转化为名词性成分","在语义上起转指作用"],"q":"5.“的”字结构是助词短语的一种，属于短语的结构类。","w":"high","e":["2020 真题","2024 354 一、名词解释（每"]},{"t":"《齐民要术》","y":"名词解释","p":["北魏贾思勰著","现存最早最完整的农学名著","总结黄河流域农业生产经验"],"q":"贾思勰是北魏时期的大农学家，他的代表作是《齐民要术》。","w":"high","e":["2024 真题"]},{"t":"刺激—反应论","y":"名词解释","p":["刺激—反应论是行为主义心理学的理论，盛行于40年代和50年代，代表人物是斯金纳，是关于第一语言习得的主要理论之一。","行为主义者认为语言不是先天所有而是后天习得的，强调外部条件在第一语言习得过程中的作用。","这种行为跟人类的其他行为一样，是通过刺激—反应—强化的模式养成习惯而学会的；婴儿来到世界时像一张白纸，对这个世界、对语言没有任何先天的知识，完全由环境来塑造其行为。","儿童学话就是对环境所给予的刺激做出相应的反应，开始是对成人语言的模仿，如果模仿得比较接近，就从成人那儿得到奖励或赞许，这样他的反应就得到了强化。"],"q":"4.强化论是习得理论之一，理论依据是行为主义的刺激反应论，代表人物是塞林克。","w":"high","e":["2018 真题"]},{"t":"对外汉语教学","y":"名词解释","p":["《中国大百科全书·语言文字》中写道：“对外汉语教学是指对外国人的汉语教学。”","实际上也包括对第一语言不是汉语的海外华人进行的汉语教学。","这一名称基本上体现了这个学科的特点和内涵，在国外也产生了广泛的影响，而且简洁上口、符合汉语习惯，因此从1982年提出一直使用至今。","但是十多年的使用也发现这一名称有一定的局限性：它只突出了主要教学对象，未能全面、准确地反映学科性质——第二语言教学。"],"q":"3.请简要举例对比“知识文化”和“交际文化丸子汉硕考研4.请简述对外汉语教学中文化教学的方法。","w":"high","e":["2015 真题","2021 真题"]},{"t":"第二语言习得","y":"名词解释","p":["正因为第二语言学习中也包含有习得的因素，越来越多的人把第二语言学习也称为第二语言习得。","在第二语言学习理论的研究中，特别是西方学者的研究文章中已出现用术语“习得”代替“学习”的趋向。","有关第二语言习得的理论和模式，西方学者已提出不下数十种，从各个不同的角度论述或解释第二语言是如何习得的。","其中有的理论虽然影响不小，但尚未得到足够的科学实验的证实，还只能称为假说。"],"q":"1.系统偏误 2.水平测试 3.带音法 4.强化论五、简答题 (10分)请简要对比第一语言习得与第二语言习得的不同。","w":"high","e":["2019 真题"]},{"t":"言语行为理论","y":"名词解释","p":["50年代末英国哲学家奥斯汀提出“言语行为”理论（speech act theory）。","他指出语言不仅是描写、陈述和说明客观世界，提供信息，而且人们说出话语也是一种行为。人们在说话的时候，就是在做一件事，完成一种行为。","奥斯汀认为人们所说出的话语能同时进行三种行为，即言内行为、言外行为和言后行为。","仍以“屋里很热”这句话为例，言内行为是说话人通过发声把这句话说出来；言外行为则是通过这句话来表达隐含的真正意图，也就是言外之意；言后行为则是指这句话对听话人所产生的影响。"],"q":"6.50年代末英国哲学家奥斯汀提出“言语行为”理论。","w":"high","e":["2019 真题"]},{"t":"对外汉语教育学","y":"名词解释","p":["从教育的高度研究对外汉语教学，反映到本学科的名称上，本书主张应与其他学科教育学的名称相一致，即用“对外汉语教育学”比较规范。","这一名称还能更清楚地体现出本学科的性质及其科学定位。","当然，提出“对外汉语教育”并不意味着、实际上也不可能用它来取代已使用近20年之久、早已深入人心的“对外汉语教学”这一名称。"],"q":"【丸子汉硕解析】本题考查言语行为的概念，可参考刘珣《对外汉语教育学引论》P81。","w":"high","e":["2016 真题"]},{"t":"格鲁派（黄教）","y":"名词解释","p":["宗喀巴15世纪初创立","戴黄帽故称黄教","达赖与班禅两大转世系统","清乾隆确立金瓶掣签"],"q":"达赖和班禅是格鲁派(黄教)两大活佛转世系统的称号，而不是红教(宁玛派)的。","w":"high","e":["2024 真题"]},{"t":"《汉语拼音方案》","y":"名词解释","p":["用拉丁字母拼写现代汉语普通话语音的方案","基本功能是解决汉字、词语等语言单位的规范读音与拼写","专门为普通话读音设计，只适用于普通话"],"q":"记录汉语语音现在主要使用《汉语拼音方案》。","w":"high","e":["2011 真题","2017 真题"]},{"t":"\"达赖\"和\"班禅\"是红教两大活佛转世系统的称号。","y":"判断题","p":["格鲁派（黄教）两大系统","红教为宁玛派"],"q":"1.“达赖”和“班禅”是红教两大活佛转世系统的称号。","w":"high","e":["2024 真题"]},{"t":"介词","y":"名词解释","p":["多是从动词虚化而来，又叫“副动词”","引进跟谓词有关的对象","跟名词组合成介词短语","主要作状语，也可以作补语"],"q":"虚词按照语法意义的不同可以细分为介词、连词、助词、语气词。","w":"high","e":["教材高频"]},{"t":"意符","y":"名词解释","p":["凡是跟整字在意义上有联系的部件，称为“意符”。","对现代汉字构形成分进行分析，得到的是构字部件；构字部件的属性，指的是部件跟整字在音义上的关系，这可以分为三类：意符、音符和记号。","汉字的意符，也叫形旁，在传递语义信息上的功能，是单纯的表音文字所不具备的。"],"q":"2.由表示字义类属的偏旁即意符，和表示字音的偏旁即音符，组成新字的造字法叫形声。","w":"high","e":["教材高频"]},{"t":"成语","y":"名词解释","p":["成语是人们从历史上传承下来并长期使用的结构凝固、语义精辟且具有民族特点的熟语。","成语是熟语中最重要的一种，主要有四个特点：历史的传承性、结构的凝固性、意义的整体性、习用的民族性。","成语主要来源包括神话寓言、历史故事、诗文语句、口头俗语。"],"q":"他认为儿童学习说话就是对环境或成人话语作出合适的反应，反应正确就会得到奖励，使之受到强化并形成语言习惯。","w":"high","e":["教材高频"]},{"t":"楷书","y":"名词解释","p":["楷书是现代通行的汉字手写正体字，也叫正楷。“楷”是楷模、法式的意思。","楷书笔画分明，笔形规整，结构端庄，字形方正，是汉字的标准字体。","现代汉字手写体主要有楷书、草书、行书等三种。"],"q":"5.唐朝欧阳询的书法以楷书为最好，字体劲险刻厉，于平正中见险绝，其代表作为《九成宫醴泉铭》。","w":"high","e":["教材高频"]},{"t":"笔形","y":"名词解释","p":["依据笔势和走向，现代汉字的笔画可以有31种不同的形式，笔画的形式简称为笔形。","现代汉字的笔形可以有概括的和细致的两种分类法：概括的分类法把笔形分为八类或五类；细致的分类法先把笔形分为基本笔形和派生笔形（也称复合笔形）两个大类。","书写时，笔画的方向自始至终没有变化的笔形是基本笔形，笔画的方向有所变化的是派生笔形。"],"q":"(1)隶书打破了小篆的结构，改变了小篆原有的笔势，使圆体变方体，曲笔变直笔，形成了汉字基本笔画，使汉字完全符号化；","w":"high","e":["教材高频"]},{"t":"词汇","y":"名词解释","p":["词汇也称语汇，是语言中能独立运用的最小的音义结合单位的集合，有时也可以指特定领域中词语的集合。","词语是能够独立运用的音义结合的最小语言单位。词语包括词和固定短语，词是词汇的主体部分，而固定短语是词汇的重要组成部分。","词语的总和形成词汇，词汇与词语的关系是集合与个体的关系。","根据语言差异，词汇可分为汉语词汇、英语词汇、德语词汇等；根据领域不同，词汇可分为政治词汇、经济词汇、法律词汇等。"],"q":"这些特点都与磋词无词汇意义有关。","w":"high","e":["教材高频"]},{"t":"词缀","y":"名词解释","p":["词缀是构成合成词的附着在词根前后或中间表示附加意义的定位语素。","合成词根据词缀的位置，可以分成前缀、后缀、中缀三种类型。","汉语里典型词缀并不太丰富，但是存在比较多的“类词缀”，特点是类似于词缀，意义有不同程度的虚化，但还不彻底；构词功能很强，有组合泛化趋势；其中，后缀与类后缀型最为丰富，中缀和类中缀最少。"],"q":"词缀都是定位语素，居前部的是前缀，如“老、阿”；","w":"high","e":["教材高频"]},{"t":"语素","y":"名词解释","p":["语素是语言中最小的音义结合的构词单位，是最基本的语言单位。","一个语素必须是语音与语义结合，而且不能再拆分。其中，具有一定的语义是判断语素的最基本条件。","汉语绝大多数语素是一个有意义的音节。如“床”的语音形式是chuáng，它的语义内容是“供人躺在上面睡觉的家具”，那么，“床”就是一个语素。","有少数语素是由两个无意义的音节合成的。如“玻璃”，它的语音形式是bōli，语义是“一种质地硬而脆的透明物体”。“玻”和“璃”虽然都有语音形式，但都没有单独的语义，因此都不是语素；只有“玻璃”才是一个语素。"],"q":"3.确定汉语语素的基本方法是什么，请举例说明。","w":"high","e":["教材高频"]},{"t":"部位","y":"名词解释","p":["要确定部件的名称，还要给汉字字形结构的各个位置定名，这就叫部位。可以分为八类。","八类部位可以编成16字口诀：上“头”下“底”，左“旁”右“边”，内“心”外“框”，中“腰”四“角”。","使用统一规范的部件和部位名称，可以把一个结构复杂的汉字称说得既准确又清楚，这就叫“部件识字法”。"],"q":"具体来说，带音法包括以下几种操作方式：(1)以旧带新：利用学习者已经掌握的音素，通过微调发音部位和方法，引出新的音素；","w":"high","e":["教材高频"]},{"t":"音符","y":"名词解释","p":["凡是跟整字在读音上有联系的部件，称为“音符”。","汉字的音符，也叫声旁，同表音文字的音符有很大的区别。","前者是非专职的，是借用本来既有音又有义的现成字符充当的，而后者则是专职的。","现代汉字中音符的数量很多，超过一千个。"],"q":"2.由表示字义类属的偏旁即意符，和表示字音的偏旁即音符，组成新字的造字法叫形声。","w":"high","e":["教材高频"]},{"t":"反义词","y":"名词解释","p":["反义词就是属于同一范畴的意义相反或相对的一组词。","根据反义词在意义上是相反的矛盾关系还是相对的反对关系，可以分成两类：绝对反义词和相对反义词。","绝对反义词：肯定一方必否定另一方，否定一方必肯定另一方，二者属于矛盾关系；相对反义词：肯定一方必否定另一方，否定一方不一定肯定另一方，二者属于反对关系。"],"q":"反义词是“普通、一般”。","w":"high","e":["教材高频"]},{"t":"同音词","y":"名词解释","p":["同音词是指语音形式(声母、韵母和声调)相同而意义完全不同的词。","同音词包括两类：同音同形词，是指语音形式相同，书写形式也相同而意义不同的词；同音异形词，是指语音形式相同，书写形式和意义都不相同的词。","同音词就来源来说主要有两类：词源不同发音偶合的同音词；词源相同，词义分化而成的同音词。"],"q":"(3)汉字分化同音词能力强。","w":"high","e":["教材高频"]},{"t":"定位语素","y":"名词解释","p":["一个语素同别的语素组合成词时，位置固定的语素叫定位语素。","根据位置的前后，又分为前置定位语素和后置定位语素。","前缀如：非(非常、非凡、非法、非分等)；后缀如：者(读者、记者、作者、学者等)、化(绿化、美化、净化、激化等)。","一个语素同别的语素组合成词时，位置不固定的语素叫不定位语素，如“电”可以前置（电器、电子、电影），也可以后置（闪电、雷电、水电）。"],"q":"语素可以按照不同的标准进行分类，按语素的位置，可以分为定位语素和不定位语素。","w":"high","e":["教材高频","2024 354 一、名词解释（每"]},{"t":"语法功能","y":"名词解释","p":["词的组合能力","能否与其他的词组合成短语","以什么顺序组合","组合以后表示什么关系","作句法成分的能力"],"q":"分类的依据是词的语法功能、形态和意义三方面，就汉语来说语法功能是主要依据，形态和意义是参考依据，三者合称为词性。","w":"high","e":["教材高频"]},{"t":"小篆","y":"名词解释","p":["秦统一后推行的标准字体","李斯整理、由大篆简化","笔画圆转匀称、结构整齐","第一次汉字规范化"],"q":"隶书把小篆圆转弧形的笔画变成方折平直笔画的过程被称作隶变，它在字体演变史上的地位最为重要，它是古今汉字的分水岭。","w":"normal","e":[]}]}]}]},{"d":"zhenti_25","t":"25南师大354+445真题","c":[{"id":"zhenti_25-c01","t":"全文","w":"high","s":[{"id":"zhenti_25-c01-s01","t":"全文","w":"high","n":7,"k":[{"t":"形声","y":"名词解释","p":["由形旁与声旁组成，形旁表示大致的字义或字义的类属，声旁提示字的读音或近似的读音。","形声法是汉字最主要的造字方法。","形声法综合利用字形表义和字形表音这两种手段。"],"q":"4.形声字声旁表音的局限性","w":"high","e":["2011 真题","2016 真题","2020 真题","2016 真题"]},{"t":"教材","y":"名词解释","p":["教材是教师教学和学生学习所依据的材料，与教学计划和教学大纲构成学校教学内容的有机组成部分。","在教学活动的四大环节中，教材占有很重要的地位。它是总体设计的具体体现，反映了培养目标、教学要求、教学内容、教学原则；同时教材又是课堂教学和测试的依据。","狭义的教材指教科书，广义的教材除了教科书外还包括教学参考书、讲义、讲授提纲、图表、各种教学音像资料等。","教材体现了语言教学最根本的两个方面：教什么和如何教。教材水平的高低不仅能反映教学理论和教学法研究的深度，而且在很大程度上决定教与学的效果。"],"q":"六、案例分析(每题40分，共1题，共40分)亚琴是一名国际中文教师，去年通过了语合中心的考试，去到了一所海外的孔子学院教学，他发现当地配套的教材与学生不符合，于是他自己编教材，但是他发现自己编教材花费了很多时间，占用了他很多的工作时间致使他每天都加班，无法很好地融入当地的文化交流，无法交新朋友。","w":"high","e":["2021 真题"]},{"t":"文化休克","y":"名词解释","p":["这些表现叫“文化震荡症”，也叫“文化休克”（cultural shock）。","文化休克是指在非本民族文化环境中生活或学习的人，由于文化的冲突和不适应而产生的深度焦虑的精神症状。","在跨文化交际中，或是进入非本民族文化生活环境中，以及学习目的语文化的过程中，文化差异都会引起人们的心理反应，产生一定的文化冲突，经历从文化不适应到适应的过程。这一过程大体上分为四个阶段：蜜月阶段、挫折阶段、调整阶段、适应阶段。","处于异文化环境中的人一般都要经历这一挫折期和文化震荡症。只不过文化震荡症在不同人身上表现的形式和程度不完全相同。"],"q":"10.文化休克四个阶段是挫折、调整、适应、蜜月阶段。","w":"high","e":["2025 真题"]},{"t":"《汉语教科书》","y":"名词解释","p":["1958年出版的我国第一套对外汉语教材《汉语教科书》"],"q":"4.《汉语教科书》五、简答题(每题 10分，共1题，共10分)任务式教学法的特点。","w":"high","e":["2025 真题","2019 真题","2025 445 二、教育学、心理"]},{"t":"部位","y":"名词解释","p":["要确定部件的名称，还要给汉字字形结构的各个位置定名，这就叫部位。可以分为八类。","八类部位可以编成16字口诀：上“头”下“底”，左“旁”右“边”，内“心”外“框”，中“腰”四“角”。","使用统一规范的部件和部位名称，可以把一个结构复杂的汉字称说得既准确又清楚，这就叫“部件识字法”。"],"q":"1.请写出以下国际音标、发音部位和发音方法(每题2分，共5题，共10分)","w":"high","e":["教材高频"]},{"t":"反义词","y":"名词解释","p":["反义词就是属于同一范畴的意义相反或相对的一组词。","根据反义词在意义上是相反的矛盾关系还是相对的反对关系，可以分成两类：绝对反义词和相对反义词。","绝对反义词：肯定一方必否定另一方，否定一方必肯定另一方，二者属于矛盾关系；相对反义词：肯定一方必否定另一方，否定一方不一定肯定另一方，二者属于反对关系。"],"q":"5.反义词的鉴定标准三、基础能力题(30分)","w":"high","e":["教材高频"]},{"t":"郡县制","y":"名词解释","p":["秦统一后全面推行","分天下为三十六郡","中央直接任免、加强中央集权"],"q":"1.唐宋至隋朝实行郡县制，元明清实行道路制。","w":"high","e":["2025 445 一、中外文化及跨"]}]}]}]},{"d":"ziliao","t":"汉硕考研资料汇总","c":[{"id":"ziliao-c01","t":"全文","w":"normal","s":[{"id":"ziliao-c01-s01","t":"全文","w":"normal","n":0,"k":[]}]}]}];

const TWEEN_FAST = 180;   // LOD tween

/* 横向填满宽度时的缩放上限。
   光栅实测（1440×900，按真实像素统计卡片覆盖，2px 网格）：
     FILL_MAX=1.6 → 视口占用 31.7%，s=1.578，字 20.5px
     FILL_MAX=2.0 → 视口占用 39.6%，s=2.000，字 26.0px
     FILL_MAX=2.4 → 视口占用 40.0%，s=2.047，字 26.6px  ← 最优
     FILL_MAX=2.8 → 与 2.4 完全相同（已被 byW 自然限住）
   1.6 让内容只占屏幕三成，四周大片留白；放到 2.4 后屏幕被用到四成，
   且重叠恒为 0%。再往上没有收益，因为宽度已拟合满。 */
const FILL_MAX   = 2.4;
/* 字号可读下限：取景缩放跌破它就宁可少展，不可看不清。
   autoFill 与 fitView 共用，因此必须是模块级，不能留在函数内。 */
const READABLE_MIN = 0.72;
/* autoFill 的字号地板：低于 0.85（≈11px 字）就不再展开。
   注意不能用绝对缩放阈值判断"该不该展"——
   实测 768 屏首屏缩放本来只有 1.3、1024 屏 1.425，
   若要求 >= 1.45 则一章都展不开（19 张卡、屏幕占用仅 27%）。
   真正的判据是"展开后屏幕占用是否上升"，见 autoFill 内部。 */
const FONT_FLOOR = 0.85;
let   FIT_PAD    = 16;

/* 布局常量（DictMindMap.computeMindMapLayout） */

const COL_W_BASE = [212, 230, 246, 264];  // 桌面基准列宽（收紧后 1024 屏可横排）
const W_PARA_BASE = 520;

/* 小屏纵向缩进布局（TreeChat 窄屏模式）：横排四列在 360px 上必然缩到 0.4 倍，
   文字不可读，因此窄屏改为自上而下缩进，只沿纵向滚动 */
let VERTICAL   = false;   // 是否纵向布局
let INDENT_V   = 22;      // 每层缩进
let PAD_V      = 12;      // 左右安全边距
let GAP_Y_V    = 3;       // 纵向卡片间距
let COL_W_V    = [];      // 纵向各层卡片宽度
/* 卡片最小宽度（自适应下限）。
   实测 3,618 条知识点标题：中位仅 3 个汉字（≈39px 文字），
   P90 也只有 6 个字。原下限 96px 会把 82.8% 的卡强行撑宽，
   总共浪费 82,031px 宽度（平均每张 22.7px，单卡 60% 是空背景）。
   降到 56px 后浪费归零，同时仍能容纳最短 2 字标题 + 箭头按钮。 */
const MIN_CARD_W = 56;
const KP_CHUNK   = 20;                 // 每节首屏挂载的知识点数
const PARA_CHUNK = 80;                 // 正文首屏渲染的段落数

let TARGET_ASPECT = 1.6;   // 视口宽高比：布局据此决定每层拆几列
let COL_W  = COL_W_BASE.slice();
let GAP_X  = 12;
let GAP_Y  = 3;
/* 对齐方式：top = 父卡与首个子卡顶端对齐；center = 父卡居中于子块。
   两种都在 place() 的同一次调用内用子块高度算出，不依赖任何回读值。 */
let ALIGN_MODE = "center";
try{ ALIGN_MODE = localStorage.getItem("alignMode") || "center"; }catch(_){}
let W_PARA = W_PARA_BASE;
let IS_COMPACT = false;

function computeMetrics(){
  const W = innerWidth, H = innerHeight;
  const tiny    = W < 420;
  const compact = W < 720 || H < 620;
  IS_COMPACT = compact;
  /* 布局用：让包围盒形状贴近视口，才能把屏幕用满 */
  TARGET_ASPECT = (stage.clientWidth || W) / Math.max(1, (stage.clientHeight || H));

  /* 列宽按屏宽收缩，但守住可读下限（再窄中文标题就没法两行了） */
  const k = tiny ? 0.60 : compact ? 0.76 : 1;
  const floor = tiny ? 188 : compact ? 210 : 0;
  /* 先算出"横向布局"的列宽，作为方向判据的唯一依据。
     注意不能直接读 COL_W —— 纵向模式下 COL_W 已被改写，
     重复调用会自我污染，得出"越来越窄"的错误结论。 */
  const COL_W_H = COL_W_BASE.map(w => Math.max(floor, Math.round(w * k)));

  GAP_X = tiny ? 6 : compact ? 7 : 8;
  GAP_Y = compact ? 2 : 2;
  W_PARA = Math.min(W_PARA_BASE, Math.max(280, W - 48));
  FIT_PAD = compact ? 8 : 16;

  /* 方向判据：横排放进屏宽后，缩放比还够不够读？
     只看"放不放得下"会把 1440 桌面也判成纵向（四列共 1512px）。
     真正该问的是 fitView 缩放后字号是否还可读，阈值 0.72。 */
  const hNeed   = COL_W_H.reduce((a, b) => a + b, 0) + GAP_X * 3;
  const fitNeed = (W * 0.92) / hNeed;
  VERTICAL = fitNeed < 0.72;

  if(VERTICAL){
    INDENT_V = tiny ? 14 : 18;
    PAD_V    = tiny ? 8 : 12;
    GAP_Y_V  = tiny ? 2 : 3;
    /* 每层可用宽度 = 屏宽 - 两侧边距 - 该层缩进；守住可读下限 200 */
    COL_W_V = COL_W_BASE.map((_, d) =>
      Math.max(180, Math.min(340, W - PAD_V * 2 - d * INDENT_V)));
    /* 纵向模式下卡片按自身层宽渲染 */
    COL_W = COL_W_V.slice();
    W_PARA = Math.min(W - PAD_V * 2, 440);
  }else{
    COL_W_V = [];
    /* 必须显式还原横向列宽：否则从纵向切回横向时会沿用上次的
       COL_W_V（[440,440,440,440]），四列总宽膨胀到 2096px 直接溢出 */
    COL_W = COL_W_H.slice();
    W_PARA = Math.min(W_PARA_BASE, Math.max(280, W - 48));
  }

  document.documentElement.classList.toggle("compact", compact);
  document.documentElement.classList.toggle("tiny", tiny);
}

/* =====================================================================
   2. 树构建
   ===================================================================== */
let NODES = [];          // 扁平节点表
let ROOT  = null;
let bookIdx = 0;

function makeNode(o){
  const n = Object.assign({
    id:"", kind:"kp", label:"", depth:0, parent:null, children:[],
    open:false, visible:false, hasPara:false, paraOpen:false, paraLoaded:false,
    w:COL_W[0], h:34,
    x:0, y:0, vx:0, vy:0, tx:0, ty:0,
    fx:0, fy:0, fvx:0, fvy:0, _anim:false,   /* FLIP：相对布局位置的瞬时偏移 */
    el:null, alpha:0, scaleIn:1,
    shown:null,        /* 已挂载的子节点数（null = 未截断） */
    moreNode:null,     /* "再显示 N 条"哨兵节点 */
    paraAll:null,      /* 全量正文段落 */
    paraShown:0        /* 已渲染的段落数 */
  }, o);
  return n;
}

/* ---- 子节点的唯一出口：分页截断都在这里，布局/连线/可见性统一走它 ---- */
const NO_KIDS = [];
function kidsOf(n){
  if(!n.open) return NO_KIDS;
  const c = n.children;
  if(!c.length) return c;

  /* 只有"节"节点的子节点（知识点）才可能海量 */
  const lim = (n.shown == null) ? (n.kind === "section" ? KP_CHUNK : c.length) : n.shown;
  if(lim >= c.length) return c;

  if(!n.moreNode){
    n.moreNode = makeNode({
      id: n.id + "@more", kind:"more", depth: n.depth + 1,
      parent: n, w: COL_W[Math.min(n.depth + 1, COL_W.length - 1)]
    });
    NODES.push(n.moreNode);
  }
  const remain = c.length - lim;
  n.moreNode.remain = remain;
  n.moreNode.label = "再显示 " + Math.min(KP_CHUNK, remain) + " 条 · 余 " + remain;
  return c.slice(0, lim).concat([n.moreNode]);
}

function buildTree(book){
  NODES = [];
  const root = makeNode({
    id:"root", kind:"root", label:book.t, depth:0, w:COL_W[0], open:true
  });
  NODES.push(root);

  book.c.forEach((ch, ci) => {
    const cn = makeNode({
      id:ch.id, kind:"chapter", label:ch.t, depth:1, parent:root,
      w:COL_W[1], weight:ch.w
    });
    root.children.push(cn); NODES.push(cn);

    ch.s.forEach(se => {
      const sn = makeNode({
        id:se.id, kind:"section", label:se.t, depth:2, parent:cn,
        w:COL_W[2], weight:se.w, hasPara:true, kpCount:se.n
      });
      cn.children.push(sn); NODES.push(sn);

      se.k.forEach((kp, ki) => {
        const kn = makeNode({
          id:se.id + "#" + ki, kind:"kp", label:kp.t, depth:3, parent:sn,
          w:COL_W[3], weight:kp.w, kp:kp
        });
        sn.children.push(kn); NODES.push(kn);
      });
    });
  });

  ROOT = root;
  return root;
}

/* =====================================================================
   3. 布局：tidy tree —— 叶子按累计高度排布，父节点取子节点中位
   ===================================================================== */
function ensureDom(n){
  if(n.tn) return;
  const tn = document.createElement("div"); tn.className = "tn";
  const tc = document.createElement("div"); tc.className = "tc";
  const tk = document.createElement("div"); tk.className = "tk";
  tn.appendChild(tc); tn.appendChild(tk);
  n.tn = tn; n.tc = tc; n.tk = tk;
}

/* 把节点的 DOM 挂到父节点的子列里，顺序即兄弟顺序。
   已经挂好的元素再次 appendChild 会移动到末尾 —— 正好用来排序。 */
function syncTree(){
  refreshVisible();
  ensureDom(ROOT);
  if(!ROOT.el) createCard(ROOT);
  if(ROOT.tn.parentNode !== nodesLayer) nodesLayer.appendChild(ROOT.tn);
  ROOT.tn.style.display = "";
  (function walk(n){
    const kids = n.open ? kidsOf(n) : [];
    const vis = [];
    for(const c of kids){
      if(!c.visible){
        if(c.tn && c.tn.parentNode) c.tn.parentNode.removeChild(c.tn);
        continue;
      }
      ensureDom(c);
      if(!c.el) createCard(c);
      c.tn.style.display = "";
      vis.push(c);
    }
    n.tk.style.display       = vis.length ? "flex" : "none";
    n.tk.style.flexDirection = "column";
    n.tk.style.gap           = GAP_Y + "px";
    /* 主干分支舒展间隙：根到章节 36px，章节到小节 26px，其余 20px，避免挤在 8px 窄缝内折叠 */
    const branchGap = (n.kind === "root") ? 36 : (n.kind === "chapter") ? 26 : 20;
    n.tk.style.marginLeft    = Math.max(GAP_X, branchGap) + "px";
    n.tn.style.alignItems    = (ALIGN_MODE === "center") ? "center" : "flex-start";
    for(const c of vis) n.tk.appendChild(c.tn);
    for(const c of vis) walk(c);
  })(ROOT);
  for(const n of NODES){
    if(n.tn && !n.visible && n.tn !== ROOT.tn && n.tn.parentNode){
      n.tn.parentNode.removeChild(n.tn);
    }
  }
}

/* =====================================================================
   布局：交给浏览器
   ---------------------------------------------------------------------
   旧实现用 JS 算 ty/tx，再靠弹簧把卡片挪过去。真实浏览器里卡片高度
   与 JS 预估不一致（实测章节卡 204×40、小节卡 296×57），于是父子
   越排越偏 —— 这就是反复出现的"对不齐"。
   现在卡片是嵌套 flex：
     .tn{display:flex;align-items:center}    卡片垂直居中于子节点列
     .tk{display:flex;flex-direction:column} 子节点自上而下排列
   对齐由浏览器保证，然后把结果读回 tx/ty 供连线与取景使用。
   ALIGN_MODE="top" 时 .tn 改为 align-items:flex-start。
   ===================================================================== */
function computeLayout(){
  syncTree();
  const wr = world.getBoundingClientRect();
  const s  = view.s || 1;
  for(const n of NODES){
    if(!n.visible || !n.el || !n.el.isConnected) continue;
    const r = n.el.getBoundingClientRect();
    /* 宽高用 offsetWidth/Height：不受卡片自身 scale 动画影响 */
    n.w = n.el.offsetWidth  || n.w;
    n.h = n.el.offsetHeight || n.h;
    /* rect 里含 FLIP 的瞬时位移 fx/fy，扣掉才是真正的布局位置 */
    n.tx = (r.left - wr.left) / s - (n.fx || 0);
    n.ty = (r.top  - wr.top ) / s - (n.fy || 0);
    n.x  = n.tx; n.y = n.ty;
  }
}

/* 可见集合：自身可见 = 所有祖先都 open
   [重要] 必须遍历完整 children，不能用 kidsOf：
     kidsOf 在 !open 时直接返回 NO_KIDS，递归到已收起的节点就断了，
     它的子孙永远得不到 visible=false。后果有两个：
       ① 收起父节点后子卡片仍是 visible=true，relayout 里 display 保持 ""，
          于是"留在原处"收不掉；
       ② computeLayout 的 walkY 同样走 kidsOf，这些卡片不参与重排，
          保留上一轮的 tx/ty，展开别的节点时就压在同一位置重叠。 */
function refreshVisible(){
  const vis = [];
  (function walk(n, parentOpen){
    n.visible = parentOpen;
    if(n.visible) vis.push(n);
    const childOpen = parentOpen && n.open;
    /* 展开时走 kidsOf（含分页哨兵）；收起时走完整 children，
       并且要把 moreNode 一起带进去，否则分页哨兵同样收不掉 */
    const kids = n.open
      ? kidsOf(n)
      : (n.moreNode ? n.children.concat([n.moreNode]) : n.children);
    kids.forEach(c => walk(c, childOpen));
  })(ROOT, true);
  return vis;
}

/* =====================================================================
   4. DOM 构建
   ===================================================================== */
const nodesLayer = document.getElementById("nodes");
const edgeLayer  = document.getElementById("edges");
const stage      = document.getElementById("stage");
const world      = document.getElementById("world");
const grid       = document.getElementById("grid");

const SVG = {
  chev:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.3 6.7L14.6 12l-5.3 5.3 1.4 1.4L17.4 12 10.7 5.3z"/></svg>',
  doc :'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8zm-1 7V3.5L18.5 9zM8 13h8v2H8zm0 4h8v2H8z"/></svg>',
  fire:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1.5 4 5 5.5 5 9.5A5 5 0 017 11.5C7 8 10 6.5 12 2zm0 18a4 4 0 004-4c0-1.6-.9-2.7-2-3.6.2 1.4-.4 2.4-1.3 2.8.3-2.2-1-3.6-2.2-4.6C9 12 8 13.3 8 15a4 4 0 004 5z"/></svg>',
  win :'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 19H5V5h7V3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7h-2zM14 3v2h3.6l-9.8 9.8 1.4 1.4L19 6.4V10h2V3z"/></svg>'
};

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function createCard(n){
  const el = document.createElement("div");
  el.className = "card " + n.kind + (n.weight === "high" ? " hot" : "");
  el.dataset.id = n.id;
  /* 关键：绝对定位元素的可用宽度是 0，必须显式给宽，
     否则 shrink-to-fit 会把中文压成一字一行（即"长条"） */
  const capW = n.paraOpen ? W_PARA : n.w;
  el.style.width = capW + "px";

  const hasKids = n.children.length > 0;
  /* 知识点详情行默认折叠，因此需要自己的展开箭头 */
  const hasDetail = !!(n.kind === "kp" && n.kp &&
                       ((n.kp.p && n.kp.p.length) || n.kp.y));
  const chev = (hasKids || n.hasPara || hasDetail)
    ? '<button class="ibtn chev" data-act="toggle">' + SVG.chev + '</button>' : '';

  /* 不再生成「N节 / N点」徽标。
     实测 1440 屏：chapter 卡装饰宽 60px、section 卡 100px，
     其中徽标固定占 32px（30 + gap），43 张卡合计 1,376px 宽度。
     而这些数字展开后就能看到，属于纯冗余；移出后卡宽直接收窄 32px。 */
  let badge = "";
  /* 真题标记不再用「真题」徽标。
     实测：3,618 张 kp 卡里有 3,229 张是高频，徽标各占 36px，
     合计 116,244px，占全部装饰宽度的 76.3%，去掉后整卡宽度减少 37.1%。
     而且人人都有标 = 没有区分度。改为左侧 2px 金色竖条（CSS），
     横向零占用，靠颜色一眼分辨。 */

  let detail = "";
  if(n.kind === "kp" && n.kp){
    const kp = n.kp;
    let inner = "";
    if(kp.p && kp.p.length){
      inner += kp.p.map(p => '<div class="pt"><span>' + esc(p) + '</span></div>').join("");
    }
    if(kp.y) inner += '<div style="margin-top:4px"><span class="tag-type' + (n.weight === "high" ? " hot" : "") + '">' + esc(kp.y) + '</span></div>';
    if(inner) detail = '<div class="detail">' + inner + '</div>';
  }

  el.innerHTML =
    '<div class="row">' +
      '<span class="label">' + esc(n.label) + '</span>' +
      badge +
      (n.kind === "section"
        ? '<button class="ibtn act" data-act="win" title="在窗口中打开">' + SVG.win + '</button>' +
          '<button class="ibtn act" data-act="para" title="画布内展开正文">' + SVG.doc + '</button>'
        : '') +
      chev +
    '</div>' + detail;

  ensureDom(n);
  n.tc.appendChild(el);
  n.el = el;

  /* ---- 自适应卡宽：先量自然宽，再收敛 ----
     固定列宽会让"10 个字 + 268px 卡"留下 60% 空背景，
     这是截图里最刺眼的面积浪费。改为让卡片刚好包住内容。 */
  measureCardW(n);

  /* 一次性量高，之后布局不再触发重排 */
  n.h = Math.max(22, el.offsetHeight);
  return el;
}

/* =====================================================================
   5. 视图变换（唯一合成层，只改 transform）
   ===================================================================== */
const view = { px:0, py:0, s:1, tpx:0, tpy:0, ts:1, springing:false };

function applyView(){
  const _zp = document.getElementById("zoomPct");
  if(_zp) _zp.textContent = Math.round(view.s * 100) + "%";
  world.style.transform =
    "translate3d(" + view.px.toFixed(2) + "px," + view.py.toFixed(2) + "px,0) scale(" + view.s.toFixed(4) + ")";
  /* 点阵跟随平移，取模避免数值无限增长 */
  const gx = ((view.px % 36) + 36) % 36;
  const gy = ((view.py % 36) + 36) % 36;
  grid.style.transform = "translate3d(" + gx.toFixed(1) + "px," + gy.toFixed(1) + "px,0)";
  const lod = view.s >= LOD_SCALE ? 1 : 0;
  if(lod !== applyView._lod){
    applyView._lod = lod;
    nodesLayer.style.setProperty("--lod", lod);
  }
  if(typeof updateCrumbsThrottled === "function") updateCrumbsThrottled();
}

/* =====================================================================
   6. 帧循环：弹簧 + 惯性 + 连线重绘
   ===================================================================== */
let rafId = 0, lastT = 0, vel = { x:0, y:0 }, inertiaOn = false;

function needsFrame(){
  if(inertiaOn) return true;
  if(view.springing) return true;
  for(const n of NODES){
    if(!n.visible || !n.el) continue;
    if(n.alpha < 0.999 || n.scaleIn < 0.999) return true;
    if(n.fx || n.fy || n.fvx || n.fvy) return true;
  }
  return false;
}

function frame(t){
  rafId = 0;
  if(!lastT) lastT = t;
  let dt = (t - lastT) / 1000;
  lastT = t;
  dt = Math.min(dt, 1/30);           // 掉帧时不让弹簧积分爆炸

  /* --- 节点动效：FLIP 弹簧归零 + 入场淡入/缩放 --- */
  let moving = false;
  for(const n of NODES){
    if(!n.visible || !n.el) continue;
    let anim = false;
    if(n.fx || n.fy || n.fvx || n.fvy){
      const ax = -SPRING_K * n.fx - SPRING_C * n.fvx;
      const ay = -SPRING_K * n.fy - SPRING_C * n.fvy;
      n.fvx += ax * dt; n.fvy += ay * dt;
      n.fx  += n.fvx * dt; n.fy  += n.fvy * dt;
      if(Math.abs(n.fx) < 0.3 && Math.abs(n.fy) < 0.3 &&
         Math.abs(n.fvx) < 2 && Math.abs(n.fvy) < 2){
        n.fx = n.fy = n.fvx = n.fvy = 0;
      }else{
        anim = true;
      }
    }
    const fadeIn = n.alpha < 1, growIn = n.scaleIn < 1;
    if(fadeIn) n.alpha = Math.min(1, n.alpha + dt * (1000 / TWEEN_BASE));
    if(growIn) n.scaleIn = Math.min(1, n.scaleIn + dt * (1000 / 220));
    if(anim || fadeIn || growIn){
      const sc = 0.92 + 0.08 * n.scaleIn;
      n.el.style.transform =
        "translate3d(" + n.fx.toFixed(2) + "px," + n.fy.toFixed(2) + "px,0) scale(" + sc.toFixed(3) + ")";
      n.el.style.opacity = n.alpha.toFixed(3);
      n.x = n.tx + n.fx; n.y = n.ty + n.fy;
      n._anim = true;
      moving = true;
    }else if(n._anim){
      n.el.style.transform = "";
      n.el.style.opacity = "";
      n.x = n.tx; n.y = n.ty;
      n._anim = false;
    }
  }

  /* --- 视图弹簧（滚轮/按钮缩放） --- */
  if(view.springing){
    const k = 300, c = 26;
    view._vx = (view._vx || 0) + (-k * (view.s - view.ts) - c * view._vx) * dt;
    view.s += view._vx * dt;
    if(Math.abs(view.s - view.ts) < 0.0008 && Math.abs(view._vx) < 0.004){
      view.s = view.ts; view._vx = 0; view.springing = false;
    }
    applyView();
    moving = true;
  }

  /* --- 惯性衰减（0.92/帧，对齐 Compose Decay） --- */
  if(inertiaOn){
    view.px += vel.x * dt; view.py += vel.y * dt;
    const decay = Math.pow(0.92, dt * 60);
    vel.x *= decay; vel.y *= decay;
    applyView();
    if(Math.hypot(vel.x, vel.y) < 18) inertiaOn = false;
    moving = true;
  }

  if(moving) drawEdges();

  if(needsFrame()) rafId = requestAnimationFrame(frame);
  else { lastT = 0; if(moving) drawEdges(); }
}

function kick(){
  if(!rafId){ lastT = 0; rafId = requestAnimationFrame(frame); }
}

/* =====================================================================
   7. 连线：bezierPath 复刻
      dx = max(|ex-sx|, 60) * 0.5 ; cubicTo(sx+dx, sy, ex-dx, ey)
   ===================================================================== */
function anchorOut(n){
  if(n.el && n.el.isConnected){
    const wr = world.getBoundingClientRect();
    const s  = view.s || 1;
    const r  = n.el.getBoundingClientRect();
    return VERTICAL
      ? { x: (r.left + r.width / 2 - wr.left) / s, y: (r.bottom - wr.top) / s }
      : { x: (r.right - wr.left) / s,              y: (r.top + r.height / 2 - wr.top) / s };
  }
  return VERTICAL
    ? { x:n.x + cardW(n)/2, y:n.y + n.h }        /* 纵向：父出点在下边中点 */
    : { x:n.x + cardW(n),   y:n.y + n.h/2 };     /* 横向：父出点在右边中点 */
}
function anchorIn(n){
  if(n.el && n.el.isConnected){
    const wr = world.getBoundingClientRect();
    const s  = view.s || 1;
    const r  = n.el.getBoundingClientRect();
    return VERTICAL
      ? { x: (r.left + r.width / 2 - wr.left) / s, y: (r.top - wr.top) / s }
      : { x: (r.left - wr.left) / s,               y: (r.top + r.height / 2 - wr.top) / s };
  }
  return VERTICAL
    ? { x:n.x + cardW(n)/2, y:n.y }              /* 纵向：子入点在上边中点 */
    : { x:n.x,              y:n.y + n.h/2 };
}
function cardW(n){ return n.paraOpen ? W_PARA : n.w; }

/* 自适应卡宽的唯一实现：先量 max-content 自然宽，再收敛到 [MIN_CARD_W, 列上限]。
   createCard 与 resize 共用，避免两处逻辑分叉。 */
/* 文本像素宽度估算：CJK 按 1em，拉丁/数字按 0.55em。
   为什么不用 offsetWidth：那需要「加 measuring 类 → 强制同步重排 → 读回 → 去类」，
   3,618 张卡逐个同步重排会让首屏明显卡顿；而且量宽时机稍有不慎
   （元素未挂载 / display:none）就恒得 0，代码只能回落列宽上限，
   于是所有卡又变回满列宽 —— 这正是"卡片浪费面积"反复出现的根因。
   纯文本度量无重排、无时序依赖，结果确定。 */
function textPx(str, fs){
  let w = 0;
  for(let i = 0; i < str.length; i++){
    const c = str.charCodeAt(i);
    /* CJK 统一表意文字 / 全角标点 / 假名 / 谚文：1em */
    if((c >= 0x2E80 && c <= 0x9FFF) || (c >= 0xAC00 && c <= 0xD7AF) ||
       (c >= 0xF900 && c <= 0xFAFF) || (c >= 0xFF00 && c <= 0xFF60) ||
       (c >= 0x3000 && c <= 0x303F)) w += fs;
    else if(c === 32) w += fs * 0.28;
    else w += fs * 0.55;
  }
  return w;
}

function measureCardW(n){
  const el = n.el;
  if(!el || n.paraOpen) return n.w;
  const capW = COL_W[Math.min(n.depth, COL_W.length - 1)];

  /* 展开态：只有知识点卡有详情行，需要横向空间，才用列宽上限。
     章节/小节卡展开只是露出子节点，自身内容不变宽 ——
     对它们强制列宽会白扔 80~105px（实测第一章空 105px、第二章空 79px）。 */
  if(n.open && n.kind === "kp"){
    n.w = capW;
    el.style.width = capW + "px";
    return capW;
  }

  const fs = n.kind === "root" ? 15 : n.kind === "chapter" ? 13
           : n.kind === "section" ? 12.5 : 13;
  let w = textPx(n.label || "", fs);

  /* 装饰宽度：padding 左右 + gap + 按钮 + 徽标 */
  /* 装饰宽度只算「常驻占位」的元素。
     win/doc 两个按钮已改为 hover 时绝对定位浮现，不占流内宽度，
     因此这里不再计入 —— 与 CSS 保持同一口径，否则又会白留 36px。 */
  /* 必须把 border 算进去：.card 是 box-sizing:border-box 且有 1px 边框，
     内容可用宽 = 宽 - 2*padding - 2*border。
     .card      padding:3px 7px  → 7*2 + 1*2 = 16
     .card.kp   padding:2px 5px  → 5*2 + 1*2 = 12（边框透明但仍然占宽）
     旧值 14 / 10 漏掉了这 2px，导致卡片内容宽比文字窄 1~2px，
     几乎每张单行卡都被迫折成两行：实测卡高 24px → 39px，
     整棵树被凭空拉高一倍，再被 fitView 压缩，字就更小。
     这是"卡片浪费面积 + 树过高对不齐"的隐藏放大项。 */
  const pad = n.kind === "kp" ? 12 : 16;
  let chrome = pad;
  if(n.children.length || n.hasPara || (n.kind === "kp" && n.kp &&
     ((n.kp.p && n.kp.p.length) || n.kp.y)))   chrome += 2 + 16;   /* 展开箭头 */

  const natural = Math.ceil(w + chrome) + 1;
  /* 上限仍是列宽：标题过长时按两行折行，不无限拉宽 */
  const out = Math.max(MIN_CARD_W, Math.min(capW, natural));
  n.w = out;
  n.measured = true;
  el.style.width = out + "px";
  return out;
}

let edgePool = [];
/* 连线按父节点层级分色：根→章 用次级色，章→节 用三级色，其余用描边色 */
function edgeStyle(parent){
  if(parent.kind === "root")    return { c:"var(--secondary)", w:1.6,  o:0.72 };
  if(parent.kind === "chapter") return { c:"var(--tertiary)",  w:1.25, o:0.55 };
  return { c:"var(--outline)", w:0.9, o:0.34 };
}
function drawEdges(){
  let i = 0;
  for(const n of NODES){
    if(!n.visible || !n.open) continue;
    const p = anchorOut(n);
    for(const c of kidsOf(n)){
      if(!c.visible) continue;
      const e = anchorIn(c);
      let d;
      if(VERTICAL){
        /* 纵向：控制点沿 y 轴拉伸，形成 TreeChat 式圆润竖向下垂 */
        const dy = Math.max(Math.abs(e.y - p.y), 40) * 0.5;
        d = "M" + p.x.toFixed(1) + " " + p.y.toFixed(1) +
            "C" + p.x.toFixed(1) + " " + (p.y + dy).toFixed(1) + "," +
                  e.x.toFixed(1) + " " + (e.y - dy).toFixed(1) + "," +
                  e.x.toFixed(1) + " " + e.y.toFixed(1);
      }else{
        /* 标准思维导图分支曲线（经典三次贝塞尔脑图曲线）：
           中轴控制点 midX = (p.x + e.x) / 2。
           从父卡右边缘 (p.x, p.y) 出发水平向右平滑延展，在中轴柔和转向，
           并以 0 倾角水平平滑插入子卡左侧 (e.x, e.y)。
           数学上 x(t) 严格单调递增，彻底杜绝任何两端死褶与反向回折！ */
        const midX = (e.x > p.x) ? (p.x + e.x) / 2 : p.x + 12;
        d = "M" + p.x.toFixed(1) + " " + p.y.toFixed(1) +
            "C" + midX.toFixed(1) + " " + p.y.toFixed(1) + "," +
                  midX.toFixed(1) + " " + e.y.toFixed(1) + "," +
                  e.x.toFixed(1) + " " + e.y.toFixed(1);
      }
      let path = edgePool[i];
      if(!path){
        path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        edgeLayer.appendChild(path);
        edgePool.push(path);
      }
      path.setAttribute("d", d);
      const st = edgeStyle(n);
      const hot = (c.weight === "high");
      path.setAttribute("stroke", hot ? "var(--gold)" : st.c);
      path.setAttribute("stroke-width", String(hot ? st.w + 0.35 : st.w));
      path.setAttribute("opacity", String(hot ? Math.min(0.9, st.o + 0.25) : st.o));
      path.style.display = "";
      i++;
    }
  }
  for(let k = i; k < edgePool.length; k++) edgePool[k].style.display = "none";
}

/* =====================================================================
   8. 展开 / 收起
   ===================================================================== */
function setOpen(n, open){
  n.open = open;
  if(n.el) n.el.classList.toggle("open", open);
  /* 展开/收起改变内容宽度，重新量一次（仅状态变化时，非每帧） */
  if(n.el && n.kind === "kp") measureCardW(n);
  /* 新出现的子节点从父节点位置弹出去（Compose 入场感） */
  if(open){
    kidsOf(n).forEach(c => {
      if(!c.el) createCard(c);
      c.alpha = 0; c.scaleIn = 0;      /* 入场：淡入 + 从 0.92 生长 */
      c.visible = true;
    });
  }
}

/* FLIP：布局由浏览器算，动效靠"反向位移 + 弹簧归零"实现。
   relayout 前记录每张卡的世界坐标，重排后算出位移差，交给 frame() 弹回 0。
   这样既有原来的弹簧手感，又不会和 flex 布局打架。 */
function captureRects(){
  const wr = world.getBoundingClientRect();
  const s  = view.s || 1;
  const m = new Map();
  for(const n of NODES){
    if(n.visible && n.el && n.el.isConnected){
      const r = n.el.getBoundingClientRect();
      m.set(n, { x:(r.left - wr.left) / s, y:(r.top - wr.top) / s });
    }
  }
  return m;
}

function relayout(animate){
  const before = (animate === false) ? null : captureRects();
  computeLayout();
  if(before){
    for(const n of NODES){
      if(!n.visible || !n.el) continue;
      const old = before.get(n);
      if(old){
        n.fx = old.x - n.tx;
        n.fy = old.y - n.ty;
      }else{
        /* 新出现的卡片：从父卡当前位置弹出来（Compose 入场感） */
        const p = n.parent;
        if(p && p.visible){
          n.fx = (p.tx + p.fx) - n.tx;
          n.fy = (p.ty + p.fy) - n.ty;
        }else{ n.fx = 0; n.fy = 0; }
        n.fvx = 0; n.fvy = 0;
        n.alpha = 0; n.scaleIn = 0;
      }
    }
  }
  for(const n of NODES){
    if(!n.visible || !n.el) continue;
    n.x = n.tx + (n.fx || 0);
    n.y = n.ty + (n.fy || 0);
  }
  drawEdges();
  updateBadge();
  kick();
}

function updateBadge(){
  const bt = document.getElementById("buildTag");
  if(!bt) return;
  let mx = 0, pairs = 0;
  for(const n of NODES){
    if(!n.visible || !n.open) continue;
    const kids = kidsOf(n).filter(c => c.visible);
    if(!kids.length) continue;
    const last = kids[kids.length - 1];
    const d = (ALIGN_MODE === "center")
      ? Math.abs((n.ty + n.h / 2) - (kids[0].ty + (last.ty + last.h)) / 2)
      : Math.abs(kids[0].ty - n.ty);
    pairs++;
    if(d > mx) mx = d;
  }
  bt.textContent = BUILD_ID + " · " + (ALIGN_MODE === "center" ? "居中" : "顶部")
                 + " · Δ" + (Math.round(mx * 10) / 10) + " (" + pairs + ")";
}

function toggleNode(n){
  /* 分页哨兵：再放一页知识点出来 */
  if(n.kind === "more"){
    const p = n.parent;
    if(!p) return;
    p.shown = (p.shown == null ? KP_CHUNK : p.shown) + KP_CHUNK;
    relayout();
    return;
  }
  /* 知识点：展开/收起详情行。默认收起，避免要点铺满画布 */
  if(n.kind === "kp"){
    setOpen(n, !n.open);
    relayout();
    return;
  }
  if(n.kind === "section" && n.hasPara){
    /* 有正文的节：先展开子节点，再允许正文 */
    if(n.children.length){ setOpen(n, !n.open); relayout(); return; }
  }
  if(n.children.length){
    setOpen(n, !n.open);
    relayout();
  }
}

/* 正文分页渲染：先 80 段，底部按钮按需追加，避免 6390 段一次性进 DOM */
function paraHtml(list, from, to){
  let html = "";
  for(let i = from; i < to; i++){
    const p = list[i];
    html += '<p><span class="pid">p' + p.i + '</span>' + esc(p.t) + '</p>';
  }
  return html;
}

function renderParaPage(n){
  if(!n.paraEl || !n.paraAll) return;
  const total = n.paraAll.length;
  const to = Math.min(total, n.paraShown);
  n.paraBody.innerHTML = paraHtml(n.paraAll, 0, to);
  if(to < total){
    const left = total - to;
    n.paraBody.insertAdjacentHTML("beforeend",
      '<button class="para-more" type="button">继续加载 ' +
      Math.min(PARA_CHUNK, left) + ' 段 · 余 ' + left + '</button>');
    n.paraBody.querySelector(".para-more").addEventListener("click", ev => {
      ev.stopPropagation();
      n.paraShown = Math.min(total, n.paraShown + PARA_CHUNK);
      renderParaPage(n);
      n.h = Math.max(22, n.el.offsetHeight);
      relayout();
    });
  }
}

async function togglePara(n){
  if(!n.paraLoaded){
    n.paraLoaded = true;
    n.el.classList.add("loading");
    try{
      const r = await fetch("data/para/" + n.id + ".json");
      n.paraAll = await r.json();
      n.el.insertAdjacentHTML("beforeend", '<div class="para"><div class="para-body"></div></div>');
      n.paraEl   = n.el.querySelector(".para");
      n.paraBody = n.paraEl.querySelector(".para-body");
      n.paraShown = Math.min(PARA_CHUNK, n.paraAll.length);
      renderParaPage(n);
    }catch(e){
      n.el.insertAdjacentHTML("beforeend",
        '<div class="para" style="color:var(--outline)">正文分片加载失败（需通过 http 打开）</div>');
      n.paraEl = n.el.querySelector(".para");
    }
    n.el.classList.remove("loading");
  }
  n.paraOpen = !n.paraOpen;
  n.el.classList.toggle("para-open", n.paraOpen);
  if(n.paraEl) n.paraEl.style.display = n.paraOpen ? "" : "none";
  n.el.style.width = (n.paraOpen ? W_PARA : n.w) + "px";
  /* 挂载下一帧平滑更新高度，触发 FLIP 弹簧弹性展开/收起过渡 */
  requestAnimationFrame(() => {
    n.h = Math.max(22, n.el.offsetHeight);
    relayout();
  });
}

/* =====================================================================
   9. 手势：拖拽 / 惯性 / 双指缩放 / 滚轮缩放
   ===================================================================== */
let ptrs = new Map();
let dragging = false, lastPt = null, downPt = null, moved = false;
let pinchStart = 0, pinchScale = 1;

stage.addEventListener("pointerdown", e => {
  /* 卡片上同样要能拖动画布、双指缩放。
     只排除正文阅读区（那里要能选中文字），其余一律放行；
     点击与拖拽靠下面 moved>4px 阈值区分，所以不会误伤卡片点击。 */
  if(e.target.closest(".para")) return;
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
  /* 不做 setPointerCapture：它会把 pointerup 重定向到 stage，
     导致卡片及其按钮拿不到原生 click（展开/收起/正文按钮全失效）。
     改为把 move/up 挂到 window 上，指针移出卡片也不断流。 */
  if(ptrs.size === 1){
    dragging = true; moved = false;
    stage.classList.add("dragging");
    inertiaOn = false;
    lastPt = { x:e.clientX, y:e.clientY };
    downPt = { x:e.clientX, y:e.clientY };
    vel.x = vel.y = 0;
  }else if(ptrs.size === 2){
    const a = [...ptrs.values()];
    pinchStart = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
    pinchScale = view.s;
  }
});

window.addEventListener("pointermove", e => {
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });

  if(ptrs.size === 1 && dragging){
    const dx = e.clientX - lastPt.x;
    const dy = e.clientY - lastPt.y;
    if(Math.abs(e.clientX - downPt.x) + Math.abs(e.clientY - downPt.y) > 4) moved = true;
    view.px += dx; view.py += dy;
    /* 速度采样，松手后接惯性 */
    vel.x = vel.x * 0.65 + (dx / 0.016) * 0.35;
    vel.y = vel.y * 0.65 + (dy / 0.016) * 0.35;
    lastPt = { x:e.clientX, y:e.clientY };
    applyView();
  }else if(ptrs.size === 2){
    const a = [...ptrs.values()];
    const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
    if(pinchStart > 0){
      const ns = Math.max(SCALE_MIN, Math.min(SCALE_MAX, pinchScale * (d / pinchStart)));
      const cx = (a[0].x + a[1].x) / 2, cy = (a[0].y + a[1].y) / 2;
      zoomAt(ns, cx, cy);
    }
  }
});

function endPtr(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size === 0){
    if(dragging){
      dragging = false;
      stage.classList.remove("dragging");
      if(moved && Math.hypot(vel.x, vel.y) > 120){
        inertiaOn = true; kick();
      }else{
        vel.x = vel.y = 0;
      }
    }
    pinchStart = 0;
  }else if(ptrs.size === 1){
    const a = [...ptrs.values()];
    lastPt = { x:a[0].x, y:a[0].y };
  }
}
window.addEventListener("pointerup", endPtr);
window.addEventListener("pointercancel", endPtr);

/* 以某点为锚缩放 */
function zoomAt(ns, cx, cy){
  const k = ns / view.s;
  view.px = cx - (cx - view.px) * k;
  view.py = cy - (cy - view.py) * k;
  view.s  = ns;
  applyView();
}

/* 滚轮 / 触控板 */
stage.addEventListener("wheel", e => {
  /* 正文阅读区内的滚轮要留给文字自己滚动，
     否则一滚就缩放，长段落永远读不到下半部分。 */
  if(e.target.closest(".para")) return;
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * 0.0016);
  const ns = Math.max(SCALE_MIN, Math.min(SCALE_MAX, view.s * factor));
  zoomAt(ns, e.clientX, e.clientY);
}, { passive:false });

/* 点击卡片 */
nodesLayer.addEventListener("click", e => {
  /* 拖拽/缩放结束后浏览器仍会补发一次 click。
     不拦截的话，拖完画布松手就会误触展开/收起。 */
  if(moved){ moved = false; return; }
  const card = e.target.closest(".card");
  if(!card) return;
  const n = NODES.find(x => x.id === card.dataset.id);
  if(!n) return;
  const act = e.target.closest("[data-act]");
  if(act && act.dataset.act === "win"){ openSectionWindow(n); return; }
  if(act && act.dataset.act === "para"){ togglePara(n); return; }
  toggleNode(n);
});

/* =====================================================================
   10. 自适应视图（computeFitScale 复刻：padding 90 / clamp 0.35~1.3）
   ===================================================================== */
function fitView(animate){
  const vis = NODES.filter(n => n.visible);
  if(!vis.length) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for(const n of vis){
    minX = Math.min(minX, n.tx);
    minY = Math.min(minY, n.ty);
    maxX = Math.max(maxX, n.tx + cardW(n));
    maxY = Math.max(maxY, n.ty + n.h);
  }
  const cw = Math.max(1, maxX - minX);
  const chh = Math.max(1, maxY - minY);
  const vw = stage.clientWidth, vh = stage.clientHeight;
  const topSafe = document.getElementById("topbar").offsetHeight + 24;
  const availW = vw - FIT_PAD * 2;
  const availH = vh - FIT_PAD - topSafe;

  /* 纵向布局只按宽度取景。
     纵向内容动辄 2000px 高，若同时按高度拟合会算出 0.245，
     被 FIT_MIN=0.35 截断后既没真正放下、字又变小 —— 两头不讨好。
     纵向本来就是靠纵向滚动阅读的，所以顶部对齐、保持可读字号。 */
  if(VERTICAL){
    const nsv = Math.max(FIT_MIN, Math.min(FIT_MAX, availW / cw));
    const npxv = Math.min((vw - cw * nsv) / 2, FIT_PAD) - minX * nsv;
    const npyv = topSafe - minY * nsv;
    if(animate){
      animateViewTo(npxv, npyv, nsv);
    }else{
      view.px = view.tpx = npxv; view.py = view.tpy = npyv;
      view.s = view.ts = nsv;
      applyView();
    }
    return;
  }

  /* 横向：宽度必须拟合，高度只在"字号仍可读"时才拟合。
     24 个并列小节纵向堆叠可达 1800px，若强行按高度塞进 900px 视口，
     缩放会掉到 0.456（13px 字变 5.9px）—— 图是"看全"了，但根本读不了。
     所以设一个可读下限 READABLE_MIN：高度拟合跌破它时放弃高度拟合，
     顶部对齐，纵向靠拖拽平移查看。 */
  /* 取景策略：可读优先，其次控制纵向溢出。
     旧策略在"填满宽度"(FILL_MAX=2.4) 与"塞进高度"之间二选一，两头都不可用：
       1548×1032 实测填满宽度 → scale 2.4，根卡字 36px，
         一屏只剩 3 章，其余全在屏幕外 —— 用户说的"完全用不了"；
       纯按高度拟合 → scale 0.72（约 9px 字）—— 用户说的"有的字看不清楚"。
     改为三步：
       1) 先按宽度拟合，上限 FIT_MAX（1.3，约 17px 字）；
       2) 若纵向溢出超过 MAX_VSCREENS 屏，压到刚好那么多屏；
       3) 压缩后不低于 READABLE_SCALE（1.0，约 13px 字）。
     纵向溢出交给拖拽平移 —— 这是可平移画布，本来就不需要一屏看全。 */
  const byW = availW / cw;
  const MAX_VSCREENS = 1.6;
  const READABLE_SCALE = 1.0;
  let ns = Math.min(byW, FIT_MAX);
  const capH = (availH * MAX_VSCREENS) / chh;
  if(ns > capH) ns = Math.max(capH, Math.min(byW, READABLE_SCALE));
  ns = Math.max(FIT_MIN, ns);
  const overflows = chh * ns > availH;

  const npx = (vw - cw * ns) / 2 - minX * ns;
  /* 高度没拟合时不能对齐"包围盒顶边"。
     横向布局里整棵树是围绕根节点垂直居中的，根节点位于树的中段；
     若把包围盒顶边贴到顶栏下沿，根节点会被推到视口下方（实测 y=1036 > 900）。
     正确做法是把根节点本身对齐到视口中上部，其余部分上下拖拽查看。 */
  /* 高度没拟合 / 放大后溢出：都不能对齐包围盒顶边。
     横向布局整棵树围绕根节点垂直居中，根节点位于树中段，
     对齐顶边会把根节点推到视口下方（实测 y=1036 > 900）。
     改为把根节点本身锚定到顶栏下沿。 */
  /* 溢出时的纵向锚点：
     居中对齐下内容会延伸到根卡【上方】，若把根卡贴到顶栏，上半截会被裁掉。
     改为取两者较高者（npy 越小内容越靠上）：
       A) 包围盒顶端对齐 → 内容从头可见；
       B) 根卡落在视口上 1/3 → 保证根卡一定出现在屏幕里（全展开时内容极高，
          只对齐顶端会把根卡推到屏幕下方）。 */
  const npyA = topSafe - minY * ns;
  const npyRoot = topSafe + availH * 0.33 - (ROOT.ty + ROOT.h / 2) * ns;
  const npy = overflows
    ? Math.min(npyA, npyRoot)
    : (topSafe + (availH - chh * ns) / 2 - minY * ns);

  if(animate){
    animateViewTo(npx, npy, ns);
  }else{
    view.px = view.tpx = npx; view.py = view.tpy = npy;
    view.s = view.ts = ns;
    applyView();
  }
}

function animateViewTo(px, py, s){
  const sx = view.px, sy = view.py, ss = view.s;
  const t0 = performance.now(), dur = 460;
  function step(t){
    let k = Math.min(1, (t - t0) / dur);
    /* M3 emphasized decelerate */
    k = 1 - Math.pow(1 - k, 3);
    view.px = sx + (px - sx) * k;
    view.py = sy + (py - sy) * k;
    view.s  = ss + (s  - ss) * k;
    applyView();
    if(k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* 首屏自动填充：按屏幕大小决定展开多少章节。
   固定"展开前 2 章"会让 1440 屏上只有 26 张卡片，
   画布大片空白 —— 这才是"浪费可显示面积"的主因，
   而不是卡片内部太胖（实测内部空白仅 0.2%~0.6%）。

   策略：BFS 逐层展开章节；每展开一个就重排并试算取景缩放，
   一旦缩放跌破 READABLE_MIN 就回退并停止。小屏少展、大屏多展。 */
/* 屏幕被卡片覆盖的比例：Σ卡片面积 × 缩放² / 视口面积。
   这是"有没有浪费显示面积"最直接的度量 —— 展开子节点会增加卡片面积，
   但同时可能撑大包围盒、压低缩放，两者相抵未必更满，必须实测比较。 */
/* 屏幕真实覆盖率：只统计「当前真正落在视口内」的卡片面积。
   旧实现是「全部可见卡面积 × s² / 视口面积」，把已经放大到屏幕外、
   用户根本看不到的卡片也算了进去。实测 1440 屏包围盒 795×856，
   按 1.6 倍填满宽度后高 1370px，而视口只有 812px ——
   近 40% 卡片落在折叠线以下，旧公式却报 39.4% 的占用率，
   指标虚高，autoFill 一直在优化一个用户看不见的数字。
   新实现按矩形求交，只算屏幕上真的被卡片占住的地方。 */
function usageScore(){
  const vw = stage.clientWidth || W, vh = stage.clientHeight || H;
  if(vw <= 0 || vh <= 0) return 0;
  const s = view.s, px = view.px, py = view.py;
  if(!(s > 0)) return 0;
  let hit = 0;
  for(const n of NODES){
    if(!n.visible) continue;
    const x0 = n.tx * s + px, y0 = n.ty * s + py;
    const x1 = Math.min(x0 + cardW(n) * s, vw), y1 = Math.min(y0 + n.h * s, vh);
    const ax = Math.max(x0, 0), ay = Math.max(y0, 0);
    if(x1 > ax && y1 > ay) hit += (x1 - ax) * (y1 - ay);
  }
  return hit / (vw * vh);
}

function autoFill(targetCards){
  /* 目标卡片数必须跟着视口面积走。
     实测固定 64 张时：1440 屏占用 39.4%，1920 屏只有 25.4% ——
     同样 64 张卡摊在 1.6 倍面积上，自然显得空。
     以 1440×900（1.296M px²）= 64 张为基准等比放大。 */
  const vw = stage.clientWidth  || 1440;
  const vh = stage.clientHeight || 900;
  const TARGET = targetCards ||
    Math.max(48, Math.min(220, Math.round(64 * (vw * vh) / 1296000)));
  const queue = [ROOT];
  let guard = 0;
  while(queue.length && guard++ < 400){
    if(NODES.filter(n => n.visible).length >= TARGET) break;
    const n = queue.shift();
    if(!n.children.length || n.depth >= 3) continue;
    if(n.open) { n.children.forEach(c => { if(c.children.length) queue.push(c); }); continue; }

    const before = usageScore();
    setOpen(n, true);
    refreshVisible();
    computeLayout();
    fitView(false);
    /* 判据：展开后"屏幕被卡片覆盖的比例"是否真的上升。
       试过改成「只看字号是否可读」，实测是负优化：
       1440 屏从 64 张卡 / 占用 39.4% 变成 65 张卡 / 占用 29.9% ——
       多展的那一层把包围盒撑高，fitView 缩放从 1.577 掉到 1.363，
       缩放是平方项，掉一点就吃掉全部收益。所以仍用占用率判据。 */
    const after = usageScore();
    if(view.s < FONT_FLOOR || after <= before * 1.02){
      setOpen(n, false);
      refreshVisible();
      computeLayout();
      fitView(false);
      continue;
    }
    n.children.forEach(c => { if(c.children.length) queue.push(c); });
  }
  refreshVisible();
  computeLayout();
}
